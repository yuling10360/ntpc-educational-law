const laws = [{"title":"兒童課後照顧服務班與中心設立及管理辦法","content":"第  一  章  總則\n第  1  條\n本辦法依兒童及少年福利與權益保障法(以下簡稱本法)第七十六條第三項規定訂定之。\n第  2  條\n本辦法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  3  條\n本辦法用詞，定義如下：\n一、兒童課後照顧服務(以下簡稱本服務)：指招收國民小學階段兒童，於學校上課以外時間，提供以生活照顧及學校作業輔導為主之多元服務，以促進兒童健康成長、支持婦女婚育及使父母安心就業。\n二、兒童課後照顧服務班(以下簡稱課後照顧班)：指由公、私立國民小學設立，辦理兒童課後照顧服務之班級。\n三、兒童課後照顧服務中心(以下簡稱課後照顧中心)：指由鄉(鎮、市、區)公所、私人(包括自然人或法人)或團體設立，辦理兒童課後照顧服務之機構。\n前項第二款由公立國民小學設立或第三款由鄉(鎮、市、區)公所設立者，為公立，其餘為私立。\n第  4  條\n公立國民小學或鄉(鎮、市、區)公所(以下簡稱委託人)，得委託依法登記或立案之公、私立機構、法人、團體(以下簡稱受託人)辦理公立課後照顧班或公立課後照顧中心。\n前項委託辦理，應符合政府採購法及其相關法規規定，受託人辦理本服務經評鑑成績優良者，委託人得以續約方式延長一年；其收費數額、活動內容、人員資格與在職訓練計畫、編班方式、辦理時間、辦理場所、管理方案、受託人續約及相關必要事項，應載明於招標文件。\n公立國民小學依前項規定，委託辦理本服務者，應提供學校內各項設施及設備。受託人須使用學校以外之其他場所、設施或設備時，應以師生安全及服務活動需要為優先考量，並經學校同意後，報直轄市、縣(市)主管機關核准。\n第  5  條\n提供本服務而招收兒童五人以上者，應依本辦法規定辦理。但依法登記或立案之社會福利、公益、慈善或宗教團體提供免費之本服務者，不在此限。\n國民小學辦理課後照顧班，應充分告知兒童之家長，儘量配合一般家長上班時間，並由家長決定自由參加，不得強迫。\n課後照顧班、課後照顧中心(以下簡稱課後照顧班、中心)每班兒童，以十五人為原則，至多不得超過二十五人。\n公立課後照顧班、中心，每班以招收身心障礙兒童二人為原則，並應酌予減少該班級人數。\n國民小學得視身心障礙兒童照顧需要，以專班方式辦理本服務。\n第  6  條\n直轄市、縣(市)主管機關於離島、偏鄉、原住民族或特殊地區，得優先指定公立國民小學、區公所設立課後照顧班、中心，或補助鄉(鎮、市)公所、私人或團體設立課後照顧中心。\n離島、偏鄉、原住民族或特殊地區依本辦法規定設立課後照顧中心有困難者，得專案報直轄市、縣(市)主管機關許可後，依許可內容辦理之。\n前項特殊地區，由直轄市、縣(市)主管機關認定。\n第  7  條\n公立課後照顧班應優先招收低收入戶、身心障礙及原住民兒童。\n公立課後照顧班之收費如下：\n一、低收入戶、身心障礙及原住民兒童：免費。\n二、情況特殊兒童：經學校評估後，報直轄市、縣(市)主管機關專案核准者，減免收費。\n三、一般兒童：依第二十條規定收費。\n前項兒童，除第五條第四項規定外，以分散編班為原則。\n國民小學或受託人每招收兒童二十人，第二項減免之費用，應自行負擔一人；其餘由直轄市、縣(市)主管機關補助之；仍不足者，由中央主管機關視實際情況補助之。\n低收入戶、身心障礙、原住民及其他情況特殊兒童參加本服務之人數比率，列為各國民小學辦理本服務之教育視導重要指標之一。\n第  二  章  設立許可\n第  8  條\n直轄市、縣(市)主管機關依本法第七十六條第四項規定設立之課後照顧服務審議會，其任務如下：\n一、研訂直轄市、縣(市)推展兒童課後照顧服務之目標及方針。\n二、協調規劃直轄市、縣(市)主管機關兒童課後照顧服務之推動。\n三、審議其他有關兒童課後照顧服務事項。\n前項審議會置委員十三人至十七人，由直轄市、縣(市)長或其指定之人擔任召集人，並就教育學者專家、家長團體代表、婦女團體代表、公益教保團體代表、勞工團體代表、兒童及少年福利團體代表及機關代表聘(派)兼之。\n第  9  條\n公立課後照顧班，由直轄市、縣(市)主管機關指定公立國民小學，或由公立國民小學提出申請，經直轄市、縣(市)主管機關核定後辦理；私立課後照顧班，由直轄市、縣(市)主管機關指定私立國民小學辦理者，由直轄市、縣(市)主管機關核定後辦理之。\n私立課後照顧班，由私立國民小學申請辦理者，應填具申請書，並檢附下列文件、資料，經直轄市、縣(市)主管機關核定後辦理之：\n一、設立目的及業務計畫書。\n二、財產清冊及經費來源。\n三、預算表：載明全年收入及支出預算。\n四、組織表、主管與工作人員人數、資格、條件、工作項目及福利。\n五、收退費及服務規定。\n六、學校財團法人董事會同意附設課後照顧班之會議紀錄。\n前二項所定國民小學，包括師資培育大學附設之實驗國民小學及高級中等以上學校附設之國民小學或國小部。\n第一項指定或申請程序及應檢附資料表件，由直轄市、縣(市)主管機關定之。\n第  10  條\n公、私立課後照顧中心，由鄉(鎮、市)公所、私人或團體填具申請書，並檢附下列文件、資料一式三份，向直轄市、縣(市)主管機關申請許可：\n一、課後照顧中心名稱、地址及負責人等基本資料；負責人並應檢附其無違反本法第八十一條之一第一項規定之切結書及警察刑事紀錄證明。\n二、課後照顧中心設立目的及業務計畫書。\n三、建築物位置圖及平面圖，並以平方公尺註明樓層、各隔間面積、用途說明及總面積。\n四、土地及建築物使用權利證明文件：包括土地與建物登記(簿)謄本、建築物使用執照影本、建築物竣工圖、消防安全設備圖說及消防安全機關查驗合格之證明文件與使用權利證明文件影本。土地或建物所有權非屬私人或團體所有者，應分別檢具經公證自申請日起有效期限三年以上之租賃契約或使用同意書；課後照顧中心應有獨立之門牌號碼。\n五、財產清冊及經費來源。\n六、預算表：載明全年收入及支出預算。\n七、組織表、主管與工作人員人數、資格、條件、工作項目及福利。\n八、收退費基準及服務規定。\n九、履行營運擔保證明影本。\n十、投保公共意外責任保險之保險單影本。\n十一、申請人為法人或團體者，並應檢附法人或團體登記或立案證明文件　　　影本，及法人或團體經目的事業主管機關核准附設課後照顧中心文件影本。\n前項第九款履行營運擔保能力之認定及第十款公共意外責任保險之保險金額，由直轄市、縣(市)主管機關公告之。\n直轄市、縣(市)主管機關得視需要，命申請人就第一項所定文件、資料繳交正本，備供查驗。\n直轄市、市主管機關指定區公所辦理課後照顧中心者，由直轄市、市主管機關核定後辦理之。\n第一項第一款負責人如下：\n一、由鄉(鎮、市、區)公所或團體設立者：以其代表人為負責人。\n二、由法人設立者：以其董(理)事長或有代表法人資格之董(理)事為負責人。\n三、由自然人設立者：以設立人為負責人；設立人為二人以上者，以推舉之代表人為負責人。\n第  11 條\n課後照顧班、中心之命名及更名，應符合下列規定：\n一、私立課後照顧班、中心，不得使用易使人誤解其與政府機關(構)有關之名稱。\n二、課後照顧班應冠以學校附設之名稱；其依第四條規定委託辦理者，並應明確表示委託人與委託辦理及受託人之名稱。\n三、公立課後照顧中心，應冠以直轄市、縣(市)某鄉(鎮、市、區)公所設立之名稱；其依第四條規定委託辦理者，並應明確表示委託人與委託辦理及受託人之名稱。\n四、私立課後照顧中心，應冠以其所在地直轄市、縣(市)名稱及私立二字，並得冠以該私人、團體之姓名或名稱。\n五、同一直轄市、縣(市)之私立課後照顧中心，不得使用相同名稱。但由同一私人或團體設立者，得使用相同名稱，並加註足資分辨之文字。\n第  12  條\n直轄市、縣(市)主管機關受理第十條第一項之申請後，經會同相關機關實地勘查，認符合本辦法規定者，應許可其設立，並發給設立許可證書。\n第  13  條\n設立許可證書應至少載明課後照顧中心之名稱、地址、負責人姓名、機構面積、最大招收人數、許可日期及許可文號；其格式，由直轄市、縣(市)主管機關定之。\n第  14  條\n前條設立許可證書應載明之事項有變更時，負責人應自事實發生之次日起三十日內，向直轄市、縣(市)主管機關申請變更登記，並換發設立許可證書。\n第  15  條\n課後照顧中心遷移者，應向遷移所在地直轄市、縣(市)主管機關重新申請設立；其遷移至原行政區域外者，並應向原主管機關申請歇業。\n第  16 條\n課後照顧中心停業或歇業時，應於三十日前敘明理由、日期，申請直轄市、縣(市)主管機關核准後，始得為之；停業後復業者，亦同。申請停業或歇業時，並應敘明兒童之安置方式。\n課後照顧中心經許可設立後，於一年內未開始營運，或因故停業而未依前項規定申請核准者，直轄市、縣(市)主管機關應命其限期改善；屆期未改善者，得廢止其設立許可。已逾核准之停業期間而未復業者，亦同。\n第一項所定停業期間，以一年為限，必要時得申請延長一年。\n第  17  條\n課後照顧中心在原址進行改建、擴充、縮減場地、增減招收人數等事項時，應於三十日前檢具下列文件、資料，申請直轄市、縣(市)主管機關核准：\n一、原設立許可證書。\n二、變更項目及內容。\n三、建築物改建、擴充或縮減場地之許可證明文件及建築物樓層配置圖，並標示變更範圍。\n四、消防安全設備機關核發之合格文件及圖說。\n五、變更後之室內、外活動空間面積。\n六、變更後之房舍用途及面積。\n七、學童安置方式。\n課後照顧中心依前項核准之事項變更完成後，應報直轄市、縣(市)主管機關進行查核，通過者，換發設立許可證書。未依規定辦理或不符許可內容者，直轄市、縣(市)主管機關得廢止其設立許可。\n第  三  章  行政管理及收費\n第  18  條\n課後照顧中心每年六月三十日及十二月三十一日前，應檢附招收概況表，報直轄市、縣(市)主管機關備查。\n課後照顧中心每年十二月三十一日前，應檢附公共意外責任險保單影本，報直轄市、縣(市)主管機關備查。\n課後照顧中心應每二年檢附主任、課後照顧服務人員與其他工作人員之健康檢查結果影本，報直轄市、縣(市)主管機關備查。\n第  18  條之 1\n課後照顧中心之服務，分為下列三類：\n一、平日服務：於學期起迄期間提供服務者。\n二、寒暑假服務：於寒暑假期間提供服務者。\n三、臨時服務：為父母、監護人或其他實際照顧兒童之人因臨時需要提供服務者。\n第 18 條之 2\n課後照顧中心收取之費用項目及用途如下：\n一、註冊費：支應硬體設施維護成本。\n二、月費：支應人事成本。\n三、代辦費：支應交通費、教材費、餐點費、活動費等費用。\n四、臨時服務費：支應臨時服務時間之相關費用。\n第 18 條之 3\n課後照顧中心應於申請許可時，考量其營運成本，依前條所定收費項目及用途訂定收費基準，報直轄市、縣(市)主管機關核准。\n直轄市、縣(市)主管機關應衡酌收費項目與用途、中心規模及經營成本，核准其收費基準後，課後照顧中心始得依核准之內容，向兒童家長收取費用。\n課後照顧中心有變更收費項目及基準必要時，應於每學期開始三十日前，敘明理由及擬變更收費日期，向直轄市、縣(市)主管機關申請核准後，始得為之。\n第  18  條之 4\n課後照顧中心收取費用，應掣給正式收據，且不得以任何理由要求兒童及家長繳回收據收執聯。\n前項收據，應載明課後照顧中心名稱、地址、設立許可證書號碼、服務期間、收費項目、各項金額、總額及退費規定。\n第  19  條\n課後照顧中心應與兒童家長，就本服務之內容、時間、接送方式、逾時或短少時數、保護照顧、告知義務、緊急事故與處理、終止契約事項、收費與退費方式、違約賠償、申訴處理、管轄法院及其他課後照顧中心與家長之權利、義務等事項，訂定書面契約。\n前項書面契約之範本，由中央主管機關公告之。\n第  20  條\n公立課後照顧班辦理本服務之收費基準，由直轄市、縣(市)主管機關以下列計算方式為上限，自行訂定：\n一、學校自辦：\n二、委託辦理：\n前項第一款服務總節數，其每節為四十分鐘。\n第一項收費，得採每月收費或一次收費；參加兒童未滿十五人者，得酌予提高收費，但不得超過直轄市、縣(市)主管機關依第一項所定收費基準之百分之二十，並應報直轄市、縣(市)主管機關核准。\n第一項本服務總節(時)數，因故未能依原定服務節(時)數實施時，應依比率減收費用。\n第  21  條\n公立課後照顧班依前條規定收取之費用，其支應之項目，分為下列二類：\n一、行政費：\n（一）行政費包括水電費、材料費、勞健保費、勞退金、資遣費、加班費、獎金及意外責任保險等勞動權益保障費用。\n（二）行政費以占總收費百分之三十為原則。但學校委託辦理時，受託人之行政費，以占總收費百分之二十為原則；學校之行政費，以占總收費百分之十為限。\n二、鐘點費：以占總收費百分之七十為原則。\n前項收費不足支應時，應優先支付鐘點費。\n公立國民小學自行辦理本服務時，其收支得採代收代付方式為之，並應妥為管理會計帳冊。\n第  21  條之 1\n私立課後照顧班辦理本服務之收費基準，準用第二十條第一項第一款公立課後照顧班學校自辦規定。\n私立課後照顧班辦理本服務之支應項目及收支方式，準用前條規定。\n第  四  章  人員資格訓練及配置\n第  22  條\n課後照顧班置下列人員：\n一、執行秘書：一人；學校自辦者，得由校長就校內教師派兼之；委託辦理者，由受託人聘請合格人員擔任之。\n二、課後照顧服務人員：\n（一）每招收兒童二十五人，應置一人；未滿二十五人者，以二十五人計。\n（二）學校自辦者，得由校長就校內教師派兼之或聘請合格人員擔任之，校內教師並應徵詢其意願；委託辦理者，由受託人聘請合格人員擔任之，並應於開課七日前報委託學校備查。\n三、行政人員或其他工作人員：由學校視需要酌置之，並得由校長就校內教師派兼之；委託辦理者，由受託人視需要酌置之。\n課後照顧中心置下列人員：\n一、主任：一人，專任，並得支援該中心課後照顧服務業務。\n二、課後照顧服務人員：每招收兒童二十五人，應置一人；未滿二十五人者，以二十五人計。\n三、行政人員或其他工作人員：視實際需要酌置之。\n課後照顧中心應於設立後，招生前，檢附主任、課後照顧服務人員、行政人員與其他工作人員名冊及下列文件，報直轄市、縣(市)主管機關核准後，始得招生；課後照顧班委託辦理者，亦同：\n一、主任及課後照顧服務人員之資格證明文件影本。\n二、所有人員無違反本法第八十一條之一第一項規定之切結書及警察刑事紀錄證明。\n三、所有人員之健康檢查表影本。\n四、其他相關文件。\n第  23  條\n課後照顧班、中心之執行秘書、主任及課後照顧服務人員，應具備下列資格之一：\n一、高級中等以下學校、幼稚園或幼兒園合格教師、幼兒園教保員、助理教保員。\n二、曾依中小學兼任代課及代理教師聘任辦法或國民中小學教學支援工作人員聘任辦法聘任之教師。但教學支援工作人員為高級中等以下學校畢業者，應經直轄市、縣(市)政府教育、社政或勞工相關機關自行或委託辦理之一百八十小時課後照顧服務人員專業訓練課程結訓。\n三、公私立大專校院以上畢業，並修畢師資培育規定之教育專業課程者。\n四、符合兒童及少年福利機構專業人員資格者。但不包括保母人員。\n五、高級中等以上學校畢業，並經直轄市、縣(市)政府教育、社政或勞工相關機關自行或委託辦理之一百八十小時課後照顧服務人員專業訓練課程結訓。\n偏鄉、離島、原住民族或特殊地區遴聘前項資格人員有困難時，得報直轄市、縣(市)主管機關核准，酌減前項第二款或第五款人員之專業課程訓練時數。\n本服務針對需要個案輔導之兒童，應視需要聘請全職或兼職社會福利工作或輔導專業人員為之；針對身心障礙兒童，應視需要聘請全職或兼職特教教師或專業人員為之。\n第  24  條\n課後照顧班執行秘書、課後照顧中心主任及課後照顧服務人員，每年應參加直轄市、縣(市)主管機關辦理之在職訓練至少十八小時。\n課後照顧班、中心應就前項參加在職訓練人員給予公假，並建立在職訓練檔案，至少保存三年。\n第一項在職訓練，得由直轄市、縣(市)主管機關自行辦理、委託專業團體、法人或專科以上學校辦理，或由專業團體報經直轄市、縣(市)主管機關認可後辦理。\n國民小學合格教師及依中小學兼任代課及代理教師聘任辦法聘任之教師，其當年度依法令參與進修、研究或研習之課程，經學校報直轄市、縣(市)主管機關認定相當於第一項在職訓練課程者，得抵免第一項所定時數。\n第一項所列人員任職未滿一年者，依其任職之月數，按比例計算該年度應研習之時數；未滿一個月者，不予計入。\n第  五  章  場地、空間及設施設備\n第  25  條\n課後照顧中心之室內樓地板面積及室外活動面積，扣除辦公室、保健室、盥洗衛生設備、廚房、儲藏室、防火空間、樓梯、陽台、法定停車空間及騎樓等非兒童主要活動空間之面積後，應符合下列規定：\n一、兒童活動總面積：應達七十平方公尺以上。\n二、室內活動面積：兒童每人不得小於一點五平方公尺。\n三、室外活動面積：兒童每人不得小於二平方公尺，設置於內政部公布直轄市最新人口密度高於每平方公里一萬二千人或可供都市發展用地之最新人口密度高於每平方公里一萬二千人之行政區者，每人不得小於一點三平方公尺。但無室外活動面積或室外活動面積不足時，得另以室內相同活動面積替代之。\n前項第三款所稱行政區，指直轄市依地方制度法第三條第三項所劃分之區；可供都市發展用地，指依都市計畫書該行政區土地總面積扣除農業區、保護區、河川區、行水區、風景區等非屬開發建築之用地。\n第  26  條\n課後照顧中心應有固定地點及完整專用場地；其為樓層建築者，以使用地面樓層一樓至四樓為限。\n課後照顧中心申請擴充營運規模，同棟建築物內以同一樓層或相連之直上樓層及直下樓層為限；他棟或他幢建築物，以原中心許可土地範圍內之建築物為限，且二者均使用地面樓層者。\n課後照顧中心經直轄市、縣(市)主管機關核准後，得依下列規定使用，不受第一項規定之限制：\n一、附帶使用地下一樓作為行政或儲藏等非兒童活動之用途。\n二、位於山坡地或因基地整地形成地面高低不一，且非作為防空避難設備使用之地下一樓，得作為兒童遊戲空間使用。\n第  27  條\n課後照顧中心應具備下列設施、設備：\n一、教室。\n二、活動室。\n三、遊戲空間。\n四、寢室。\n五、保健室或保健箱。\n六、辦公區或辦公室。\n七、廚房或配膳空間。\n八、盥洗衛生設備。\n九、其他與本服務相關之必要設施或設備。\n前項第一款至第六款設施、設備，得視實際需要調整併用。\n第一項第八款設備數量，不得少於下列規定，其規格應合於兒童使用；便器並應有隔間設計：\n一、大便器：\n（一）男生：每七十五人一個，未滿七十五人者，以七十五人計。\n（二）女生：每十五人一個，未滿十五人者，以十五人計。\n二、男生小便器：每三十人一個，未滿三十人者，以三十人計。\n三、水龍頭：每十人一個，未滿十人者，以十人計。\n第  28  條\n課後照顧班、中心之建築、設施及設備，應符合下列規定：\n一、依建築、衛生、消防等法規規定建築及設置，並考量兒童個別需求。\n二、配合兒童之特殊安全需求，妥為設計，並善盡管理及維護。\n三、使身心障礙之兒童有平等之使用機會。\n四、環境應保持清潔、衛生，室內之採光及通風應充足。\n第  六  章  附則\n第  29  條\n本辦法所定書表格式，除第十九條第二項規定外，由直轄市、縣(市)主管機關定之。\n第  30  條\n直轄市、縣(市)主管機關得定期或不定期至課後照顧班、中心視導、稽查，其中安全措施相關業務之稽查，應每年至少辦理一次。\n直轄市、縣(市)主管機關視導、稽查課後照顧班、中心時，得要求其提出業務報告，或提供相關資料、文件；課後照顧班、中心之負責人或相關人員不得規避、妨礙或拒絕。\n前二項視導及稽查之相關規定，由直轄市、縣(市)主管機關定之。\n第  31  條\n(刪除)\n第  32  條\n直轄市、縣(市)主管機關依本辦法規定，得另訂補充規定。\n第  33  條\n本辦法自中華民國一百零一年五月三十日施行。\n本辦法修正條文，自發布日施行。","history":"中華民國108年12月5日教育部臺教社(一)字第 1080170848B 號令修正發布部分條文，並自發布日施行。"},{"title":"新北巿國民中學學生學習輔導實施要點","content":"一、新北巿政府(以下簡稱本府)為提升新北巿(以下簡稱本巿)學生各領域基本能力，引發學習興趣，增進學習效果，輔導學生善用學習時間，強化生活知能，充實生活內涵，培養自主學習精神，特訂定本要點。\n二、本要點所稱國民中學，含本巿國民中學、高級中學國中部及國民中小學國中部(以下簡稱學校)。\n三、學校得依實際需求，規劃辦理學習輔導，課後學習活動、寒暑假學藝活動，國民教育階段七年級至九年級均可實施；留(到)校自習以國民教育階段九年級為限。\n四、學校辦理學習輔導，應依實際需求訂定實施計畫，並經學校行政會議決議通過，校長核定後實施。\n五、學習輔導實施時間如下：\n（一）課後學習活動：以星期一至星期五正式課程結束後至下午五時三十分前辦理。\n（二）寒暑假學藝活動：以星期一至星期五上午實施為原則，如因辦理校外教學活動得調整之，總上課時數寒假不得超過四十節，暑假不得超過一百二十節。\n（三）學校開放留(到)校自習時間：\n1.星期一至星期五：學期中開放至下午九時，寒暑假期間開放至下午五時。\n2.星期六、星期日及國定假日：不開放。\n六、學校學習輔導實施原則如下：\n（一）課後學習活動、寒暑假學藝活動：\n1.每班以二十五人為原則，最低不得少於二十人。\n2.學生自由申請，不得強迫參加，並應事先取得家長同意書。\n3.課程內容由學校依學生實際需求妥為設計規劃，力求適性化及多元化。\n4.不得提前教授新單元或採用坊間出版專為應付升學考試之各種參考書及測驗卷。\n5.學生參加學習輔導表現，不列入學期成績計算，出缺勤管理由學校規範。\n6.學校辦理學習輔導課程，應安排適當教師進行教學活動，在校內資源不足之情形下，得利用社會資源，聘請具有特殊專長、才藝之家長或社會人士協助辦理，以提高活動效果。\n（二）留(到)校自習：\n1.學校應遵守不強迫參加、不上課、不考試之原則。\n2.應有學校行政人員、教師或家長在場督導，負責安全、整潔及秩序之維護。\n七、學校學習輔導收費及支用原則如下：\n（一）課後學習活動、寒暑假學藝活動收費標準：每名學生應繳費用為教師授課鐘點費乘以上課節數除以零點七五再除以每班平均計費人數。\n（二）經費之收支應依學校會計程序辦理，經費支用包含鐘點費及行政費兩部分：\n1.鐘點費佔百分之七十五，依實際授課時數支給，每節最高支給新臺幣五百四十元，不列入兼代課時數計算。\n2.行政費佔百分之二十五，支給項目包括業務費、水電費、文具紙張、印刷費、材料費、生活輔導費、獎學金、加班費、雜支及其他教學相關設備、物品之購置或維修費用。\n（三）學校所收費用，應以核發鐘點費為優先，不得另收教材或講義費。鐘點費核實支付後，剩餘費用始得用於行政費、實際參與此項工作人員之加班費或其他相關費用之開支。\n（四）寒暑假期間，生活輔導教師得支領生活輔導費，每班每星期最高得支新臺幣六百六十五元。但已支領導師費者，不得重複支領生活輔導費。\n（五）費用減收及退費規定如下：\n1.經政府核定有案之低收入戶學生或家境清寒學生，得免繳或酌減活動費用。\n2.學生中途加入，應依實際上課週次比例辦理收費。\n3.學生參加課業輔導後，因故無法參加其課程者，學校應依下列規定退還學生所繳費用:\n（1）開課前申請退費者，全數退還。\n（2）開課後未逾學期三分之一申請退費者，退還三分之二。\n（3）開課後逾學期三分之一，未逾學期三分之二申請退費者，退還三分之一。\n（4）開課後逾學期三分之二申請退費者，不予退費。\n4.學校如因故停課且未補課，應依實際上課節數比例辦理退費。\n（六）留(到)校自習，除冷氣使用及維護費、代收膳費外，不得收費。","history":"1.97年9月12日北教國字第0970673695號函修訂第2、5點(自97學年度寒假開始實施)。\n2.99年12月25日北府法規字第0991209390號公告繼續適用。\n3.99年12月25日北教秘字第0991209368號公告繼續適用。\n4.100年11月9日北府教秘字第 1001458364號令訂定。發布全文7點；並即日起生效。\n5.102年7月19日北府教中字第1022196890號令修正發布名稱及全文7點；並自即日生效(原名稱：新北市立完全中學暨國民中學 學生課後輔導及寒暑假學藝活動實施要點)。\n6.104年1月14日新北市政府新北府教中字第1040067349號令修正發布第7點條文；並自即日生效。\n7.115年4月30日新北府教中字第 1150787151號令修正發布全文7點；並自即日生效。"},{"title":"各校辦理課後輔導及寒暑假學藝活動時，應精確計算課程節數並依活動計畫實施及收費，若有賸餘經費應退還學生。","content":"一、依審計部臺北縣審計室對於本縣九十二年度總決算之重要審核意見第一項第十二點辦理。\n二、據審計部臺北縣審計室審核本縣各校課後輔導及寒暑假學藝活動收費情形發現，多有累積賸餘款充作教育經費之情形。\n三、請各校於規畫上課時程時應預留補課時間，避免遇特殊情形(如：天災)導致停課，又因無規劃補課時間，致無法補課而產生超收費用之情形。另各校應確實核算各項費用，若因故停課且未補課，則未核發部份之費用應退予學生。","history":"93年9月10日北府教學字第0930625618號。"},{"title":"新北市高級中等以下學校辦理學生假期育樂營實施計畫","content":"一、依據\n（一）教育部友善校園學生事務與輔導工作作業計畫。\n（二）新北市友善校園學生事務與輔導工作作業計畫。\n二、目的：\n（一）推廣正當休閒活動，增進學生身心健康。\n（二）倡導生活與教育結合，建立合作樂群精神。\n（三）寓教於樂從做中學，充實學生生活知能。\n三、指導單位：新北市政府(以下簡稱本市)。\n四、辦理單位：本市高級中等以下學校。\n五、活動時間：每學年度寒暑假期間學校自行辦理為原則。\n六、實施方式：\n（一）由主辦機關選擇適當地點，或利用學校現有之環境及設備辦理，可採駐地露營或宿營等方式；課程設計以技藝、體育、休閒活動、才藝及其他富有教育性之多元化藝能課程活動為主。(學校課業輔導課程除外)\n（二）活動可採集中食宿或自理食宿，並以野營、健行、參觀等方式實施，由各校視需要自行訂定。\n（三）學校應依據設備、師資、學生意願等條件規劃假期育樂活動並妥善規劃課程內容及活動時間。\n（四）寒暑假辦理之育樂營由本局統一彙整後發布新聞，並報教育部，相關作業時程由本局統一規範。\n七、活動內容：\n（一）休閒活動類：以棋藝、牌藝、登山、溯溪、攀岩、民俗活動、團體活動、生態環境、參觀史蹟文物等方式實施，培養青少年民主自治、團結合作的精神。\n（二）知性藝文類：以天文觀測、繪畫、樂器、閱讀、本土藝術、鄉土教育等活動，陶冶青少年的藝文氣質。\n（三）技能研習類：以餐點製作、民俗技藝、歌唱、舞蹈、童軍技能訓練、科學創意等培養青少年多元展能。\n（四）體育競賽類：以球類、游泳、直排輪、溜冰、跆拳道、武術、空手道、劍道、射箭、田徑等各項體育活動以鍛鍊強健體魄，並培養青少年樂觀進取的人生觀。\n（五）服務公益類：以掃街、淨灘、募集發票、打掃療養院等各項人道關懷及公益服務活動，擴大視野，增廣見聞，培養學生知善樂善行善的服務精神。\n（六）其他項目類：有關理財、領導及其他適合學生學習課程，以培養學生領導能力與生涯發展。\n八、師資來源：遴聘校內、校外具專長之教師或社會人士等擔任。\n九、開班方式：\n（一）由各校自行辦理或校際聯合辦理。\n（二）每班(隊)以12人為原則，不得超過20人，視活動性質得指派隨隊指導老師(或輔導員)。\n（三）由學生自願報名參加，並須徵得其家長之同意，且可開放親子同時報名參加。\n（四）參加對象可開放本市各校學生參加，亦可由學校決定開放部分名額供外縣市學生參加。\n十、經費：\n（一）活動經費以自給自足為原則。\n（二）教師鐘點費支給標準，比照各階段規定支付。國小準用「新北市公立國民小學辦理課後社團實施要點(115年6月24日廢止)」；國中準用「新北市國民中學學生學習輔導實施要點」；高中準用「新北市公私立高級中等學校課業輔導實施要點」。\n（三）收費計費標準方式：學生參加活動可收取活動指導費。\n1.國小活動指導費：鐘點費(400元)乘以上課節數除以0.7，再除以上課人數，等於每名學生應繳費用(個位數字無條件進位)。\n2.國中活動指導費：鐘點費(450元)乘以上課節數除以0.8，再除以上課人數，等於每名學生應繳費用(個位數字無條件進位)。\n3.高中活動指導費：鐘點費(550元)乘以上課節數除以0.75，再除以上課人數，等於每名學生應繳費用(個位數字無條件進位)。\n4.有關食宿費用、保險費、材料費及雜支按實際需要收費。\n（四）行政費之支給，包括工作人員加班費、工作費、保險費、事務費、文具費、充實教學設備費及雜支等。另工作人員加班費支付視活動需要經校長同意後，得不受每月最高20小時之限制。\n（五）所收費用之開支以指導教師鐘點費為優先，有結餘應支應行政費用及水電維護等費用。\n（六）收費應正式給予收據，並應列入學校會計帳務處理後，專款專用。\n（七）學生家境清寒、低收入或單親家庭生計困難者，經學校審查後，得准其免繳費用或酌減費用。\n（八）如參加人數較少，收費不敷支用時，由學校開會共同研商酌予降低各項支出標準。不得事後要求學生補交費用。\n（九）活動前如遇不可抗力之天然災害影響，承辦單位可逕行宣佈取消 ，並退回所繳交之一切費用。\n（十）活動期間如遇不可抗力之天然災害影響，承辦單位可逕行宣佈取消，並由承辦單位決定擇日補課或退費。\n（十一）學生參加活動中途申請退費者(家長應提出申請並敘明理由)，比照各階段規定辦理。國小準用「新北市公立國民小學辦理課後社團實施要點(註:已廢止)」；國中準用「新北市國民中學學生學習輔導實施要點」；高中準用「新北市公私立高級中等學校課業輔導實施要點」。\n十一、獎勵：\n（一）學校工作人員(限教育人員)辦理本案認真負責者，得依「公立高級中等以下學校教師成績考核辦法」及「新北市政府所屬各級學校辦理教師敘獎處理原則」附表第4項第2款，開班數9班(含)以下者，主辦人員1人嘉獎2次，餘有功人員以4人為限，嘉獎1次；開班數10班至19班者，主辦人員1人嘉獎2次，餘有功人員以5人為限，嘉獎1次；開班數20班(含)以上者，主辦人員1人嘉獎2次，餘有功人員以6人為限，嘉獎1次。\n（二）開課班級滿12名學生參加者，任課教師得予敘獎，每寒(暑)假嘉獎1次為限(開課班級學生未滿12名者，一律不敘獎)。\n十二、本計畫奉核後實施，修正時亦同。","history":"106年11月3日新北教特字第1062124363號函。"},{"title":"新北市立高中職及國民中小學辦理學生假期育樂營作業流程","content":"一、承辦人員：訓育組長或學校指派業務人員\n二、相關單位：教務處、總務處、學務處、任課教師\n三、辦理期程：各校依行事曆辦理\n四、辦理時間：各校依行事曆辦理\n五、注意事項：\n（一）教育原則：應符合教育意義，推廣正當休閒活動，增進學生身心健康。\n（二）安全原則：應考量學生安全，避免傷害事件之發生。\n（三）民主原則：規劃與實施應廣納親、師、生意見及需求，避免偏聽個人好惡。\n（四）程序原則：規劃與實施應依照程序進行，並依照既定之收費標準。\n（五）辦理方式：\n1.籌備階段\n（1）成立規劃小組：成員5至11人包含(學務主任、教務主任、總務主任、訓育組長、體育組長、教學組長、相關教師若干人)依小組人數進行比例分配。\n（2）蒐集活動辦理相關資料。\n（3）召開相關會議：依所蒐集資料提供會議參考。\n（4）擬訂計畫：\nA.參照本局辦理學生假期育樂營實施計畫\nB.學校應依據設備、師資、學生意願等條件規劃假期育樂活動並妥善規劃課程內容及活動時間。\n（5）審查計畫：依學校行政程序處理。\n2.準備工作：\n（1）彙報教育局。\nA.寒暑假辦理育樂營須於12月(5月)上旬完成開班規劃，並彙報教育局。\nB.本局於12月(5月)中旬發布全市假期育樂營新聞。\nC.本局於12月(5月)下旬彙報教育部。\n（2）公告活動訊息：學校同步於教育局發布假期育樂營新聞時，連結教育局網站到各校網站公告。\n（3）辦理報名作業：學校於12月(5月)下旬開始接受報名作業(報名表件應包含家長同意書)\n3.活動實施：\n（1）應要求學生遵守上課規定，注意安全及保持環境清潔。\n（2）指導教師必須點名，隨時注意學生動態。\n（3）意外事件發生時，啟動危機處理機制。\n（4）活動前如遇不可抗力之天然災害影響，承辦單位可逕行宣佈取消，並退回所繳交之一切費用。\n（5）活動期間如遇不可抗力之天然災害影響，承辦單位可逕行宣佈取消，並由承辦單位決定擇日補課或退費。\n（6）學生參加活動中途申請退費者(家長應提出申請並敘明理由)，學校應按上課時數計算退還剩餘之費用。\n（7）學生家境清寒、低收入或單親家庭生計困難者，經學校審查後，得准其免繳費用或酌減費用。\n4.檢討階段：\n（1）召開檢討會。\n（2）作為爾後修正學生假期育樂營活動實施之參考\n5.成果彙整\n6.完成","history":""},{"title":"有關本市各高級中等以下學校辦理115年度暑期育樂營因應「新北市立高級中等以下學校課後社團活動實施要點」（以下簡稱該要點）修正發布後之過渡期經費差額處理方案。","content":"一、依據本府115年6月2日新北府教中字第1151025866號令發布修正該要點、本局115年6月16日新北教中字第1151143479號函暨同年7月3日1151285454號核准簽續辦。\n二、查該要點修正重點，係提高內聘教師每節鐘點費上限（國小調高至480元、國中調高至540元、高中調高至660元），並統一收費基準係數改以除以0.7計算。惟部分學校於要點修正發布前，已依原規範完成115年度暑期營隊招生及收費作業，致衍生新舊法規更迭之鐘點費與行政費差額。\n三、衡諸行政法之誠信原則與信賴保護原則，保障家長權益並維護政府施政公信力，各校實不宜再向已報名之家長追加或補收費用。\n四、為協助各校營隊順利運作，相關經費補助與因應原則如下，請依該說明辦理：\n（一）本局專案營隊（未向家長收費）：本局各專案業務科室主管之營隊因未向家長收取費用，維持依原訂計畫經費內勻支或依原核定額度賡續辦理，本局不另追加補助。\n（二）學校自辦營隊（已向家長收費）：為兼顧行政誠信並協助學校順利運作，本局特保留行政彈性，原則由校方自行吸收或自籌差額，倘學校經費自籌確有困難者，得檢具經費收支明細，專案函報本局各學制業管科（國小教育科、中等教育科）審查；通過後將於過渡期（115年7至8月）內，依權責核實給予個別補助。","history":"中華民國115年7月8日新北教特字第1151305091號函。"},{"title":"新北市立高級中等以下學校課後社團活動實施要點","content":"一、新北市政府（以下簡稱本府）為協助新北市立高級中等以下學校（以下簡稱學校）學生個別差異，統整學習經驗，充實生活知能，加強優良品德實踐，並發展學校特色活動，特訂定本要點。\n二、本要點所稱之學校課後社團活動（以下簡稱社團活動），指於課後（含晨光時間、假日及寒暑假）實施團體性、系統性之活動，由合格或專長師資擔任指導，且需要定期訓練或研習之學習團體。\n社團活動類別如下：\n（一）學藝類社團活動：語文類、科學類等。\n（二）體育類社團活動：球類、田徑類、技擊類等。\n（三）才藝性社團活動：音樂類、表演團隊類、視覺藝術類等。\n（四）其它類別社團活動。\n三、學校實施社團活動，應考量學生興趣、需求及身心發展情形，並配合各學習領域，兼顧學校或地區特色，提供多元學習的機會，引導學生發掘興趣及優勢潛能，促進全人發展及適性揚才。\n四、社團活動由學生事務處或相關單位規劃辦理，管理及實施事項如下：\n（一）學校辦理社團活動，應訂定實施計畫，內容包括辦理單位、招收對      象、班別、人數、實施時間、師資條件、師資審核及停聘、解聘程序、收退費基準、費用、活動內容、提供之場地設施及設備、安全照護、選填志願方式及其他相關事項；學校指導或輔助學生社團活動、製作媒體文宣、簽訂契約或其他相關事項，學校應於實施計畫內明確規範。\n（二）學校得成立社團推行委員會，負責前款所稱實施計畫所定事項審議      通過後公告周知，以及社團活動之課程教學或訓練計畫、師資遴聘、收費標準、減免規定、器材及教材選購、教師鐘點費、經費收支及其他相關事項。\n（三）前款社團推行委員會校長為當然委員，其餘成員由行政代表、教師      代表、家長代表組成，亦得邀請學生列席提供意見。\n（四）學生社團活動以學校名義辦理跨校、校外競賽或活動者，應報學校      同意後，始得為之。\n五、學校應依學生多元興趣及學校發展特色，辦理各類社團活動，並應遵行下列規定：\n（一）學校規劃成立的社團活動，其成員不受班級、年級之限制，實施對象以校內學生為原則。\n（二）社團活動應依學生意願自由參加，不得強迫。\n（三）學校不得為配合社團活動，變更原定作息時間及教學計畫。社團活      動之規劃不得藉社團活動名義進行課業加廣、加深或補救教學。\n（四）社團活動上課時間國民小學每節為四十分鐘，國民中學每節為四十      五分鐘，高級中等學校每節五十分鐘。\n（五）學校辦理各項社團活動，應提供所需設施及設備，如需使用校外其      他場地設備或設施，應以師生安全為優先考量。\n（六）辦理社團活動所需經費，應具必要性及合理性；其收費項目及經費      收支，應予公開透明。\n（七）社團活動除由學校自行辦理外，得就實施內容之全部或一部，依政      府採購法及相關規定委託立案之公、私立機構、法人或團體辦理。\n六、社團活動師資，包含指導教師及助理教師，優先遴聘校內具有專長之教師擔任。但有外聘師資之必要者，其資格應符合下列各款規定之一：\n（一）具有該項專長之合格教師。\n（二）未具教師資格。但有相關專長素養，並持有下列學經歷相關證明文件之一：\n1.國內外大學以上符合社團活動相關科系畢業者。\n2.曾獲選為直轄市或縣（市）級以上相關專長之代表隊一年以上資歷或近五年內曾參加直轄市或縣（市）主辦之相關專長公開表演、展示、競賽得獎，且其專長符合社團活動者。\n3.曾獲得國家級、直轄市或縣（市）級，公開辦理之能力檢定、檢核或鑑別證書，且符合社團活動者。\n4.經學校認定具特殊專長，符合社團活動內容且具有相關證明者。\n（三）外聘體育類社團活動指導教師未具合格教師資格者，由學校就具有下列條件之一者依序聘任，並核發聘書：\n1.持有全國性體育團體核發之有效教練證。\n2.具體育（運動）相關科系學經歷或相關能力檢定、競賽證明。\n3.學校外聘社團活動指導教師或助理教師前，學校應依性別平等教育法第三十條、性侵害犯罪加害人登記報到查訪及查閱辦法及不適任教育人員之通報資訊蒐集及查詢處理利用辦法相關規定查閱。如屬通報有案者，不得聘任；已聘任者，學校應立即予以終止聘任。\n學校外聘指導教師或助理教師時，應簽訂勞動契約，並約定其權利及義務。\n外聘社團活動指導教師或助理教師於學校服務期間如涉校園性別事件，應依據性別平等教育法等規定配合調查及處置。\n外聘社團活動指導教師或助理教師於學校服務期間如涉前項以外之情    形而有終止契約關係或終止運用關係之必要者，其調查程序準用高級中等以下學校教師解聘不續聘停聘或資遣辦法，並應配合調查及處置。\n每一學生社團活動，以置指導教師一人為原則，並得視需要得置助理教師一名至二名。\n七、學校辦理社團活動收費基準如下：\n（一）依使用者付費原則，經費得由參加學生平均分攤。\n（二）社團活動全學期所需經費以全期總節數乘以鐘點費再除以零點七計      算之。\n（三）每位學生應收費用以全期所需經費除以總參加學生數計算之。\n（四）低收入戶學生且具該項潛能值得栽培者，學校得減免其收費。\n（五）社團招生人數未逾原定人數百分之二十，不予重新計算收費金額。\n（六）社團活動經費之收支，應詳列帳冊及保管單據，於每學期向學生社      團活動成員公布；社團活動指導教師及校內相關單位應負監督輔導之責。\n（七）社團活動收費由學校依實際需要定之，收費項目得包含鐘點費及行      政費等，且以代收代付方式，納入學校公庫專款專用，其管理及支用依據校內會計相關法規。\n八、學校辦理社團活動經費開支基準規定如下：\n（一）鐘點費：\n1.教師鐘點費占百分之七十為原則，核實支給。\n2.內聘教師：高級中等學校每節上限新臺幣六百六十元；國民中學每節上限新臺幣五百四十元，國民小學每節上限新臺幣四百八十元。\n3.外聘教師：學校得依教師之學經歷或專業能力等級酌予提高，每節上限新臺幣八百元為原則。學校得因應實際狀況支應額外之鐘點費，經費來源由學校自籌。\n4.助理教師鐘點費應以該社團活動指導教師鐘點費二分之一為支給上限。\n（二）行政費：行政費占百分之三十為原則，包含水電費（占行政費百分之二十，即所收費用百分之六）、紙張、講義印刷費、材料費、加班費及其他相關費用。\n（三）教師授課鐘點費核實支付後，剩餘費用始得用於行政費或其他相關費用之開支。\n九、學生參加社團之退費基準如下：\n（一）開課前申請退費者，應全額退還已繳費用。\n（二）開課後未逾全期三分之一申請退費者，應退還已繳費用三分之二。\n（三）開課後逾全期三分之一，未逾全期三分之二申請退費者，應退還已      繳費用三分之一。\n（四）開課後逾全期三分之二申請退費者，不予退費。學校如因故停課且      未補課，應依上課天數比例辦理退費，學生缺席天數不得申請退費；學校因故未能開班者，應全額退還費用。\n第一項退費基準，如材料費已購置成品者，應扣除材料費後發還成品。\n十、學校應定期考核社團活動參與展演及競賽之成果，指導教師及相關人員得視其服務表現，並依新北市政府所屬各級學校及幼兒園辦理教師敘獎處理原則辦理敘獎事宜。\n十一、本府教育局得不定期視導考核學校社團活動之辦理情形。","history":"1.115年2月3日新北市政府新北府教中字第 1150232718 號令訂定發布全文 11 點；並自即日生效。\n2.115年6月2日新北市政府新北府教中字第 1151025866 號令修正發布第 8 點條文；並自即日生效。"},{"title":"轉知教育部函釋「針對教師於寒暑假期間應否擔任學生課業輔導之職務」","content":"一、依據教育部97年2月21日台人(二)字第0970013140號書函辦理。\n二、有關教師於寒暑假期間擔任學生課業輔導業務義務之法源依據，係以地方制度法第十八條第四款、第十九條第四款及國民教育法第四條第二項「公立國民小學及國民中學，由直轄市或縣(市)…劃分學區，分區設置；…規定，由直轄市或縣(市)政府定之。」之規定，有關國民教育之辦理係屬直轄市、縣(市)之自治事項，又依95年10月17日教育部召開之「研商落實教學正常化－國中課業輔導與留校自習協調會議」決議，各國中小於課外時間在校為學生進行課業輔導或補救教學，應由縣市政府本於權責，基於學生自由參加，嚴禁強迫收費及上新課程等原則，自行訂定各有關規定為之，是以，本府訂定之「臺北縣縣立完全中學暨國民中學學生課後輔導及寒暑假學藝活動實施要點」，應即為臺北縣實施完全中學暨國民中學學生課後輔導及寒暑假學藝活動之法源依據，合先敘明。\n三、「臺北縣立完全中學暨國民中學學生課後輔導及寒暑假學藝活動實施要點」規定不得強迫學生參加，至教師自應依教育部96年12月27日台人(二)字第0960191722號書函之說明，學校所安排之寒暑假課業輔導課程，教師實施教學活動，尚屬義務範疇，教師無法配合參與時，仍應依規定辦理請假手續。","history":"97年3月10日北教國字第0970778215號。"},{"title":"轉知教育部函，有關教師寒暑假期間應否擔任學生課業輔導之職務疑義一案。","content":"一、依教育部98年2月20日台人(二)字第0980013253號函辦理。\n二、查教師法第十七條規定：「教師除應遵守法令履行聘約外，並負有下列義務：…積極維護學生受教之權益。三、依有關法令及學校安排之課程，實施教學活動。…七、依有關法令參與學校學術、行政工作及社會教育活動。…」是以，學校所安排之寒暑假課業輔導課程，教師實施教學活動，尚屬上開規定所規範之義務範疇。\n三、次查「教師請假規則」第十二條規定：「公立中小學未兼任行政職務教師於學生寒暑假期間，除例假日、返校服務、研究與進修等活動及配合災害防救所需之日外，餘可不必到校。前項返校服務、研究與進修等活動事項及日數之實施原則，由中央主管教育行政機關邀請全國教師會代表參與訂定，並由各級主管教育行政機關邀請同級教師會協商後訂定執行規定；…前2項返校服務、研究與進修等活動之實施，教師無法配合參與時，應依規定辦理請假手續。」又公立中小學未兼任行政職務教師寒暑假期間返校活動事項及日數實施原則第3點規定：「教師寒暑假期間返校活動事項如下：(一)返校服務事項：…(二)研究與進修事項：…」，另教育部96年4月14日台人(二)字第0960038022D號書函說明，本實施原則係規範全體教師共通性應返校服務與研究進修事項及日數，教師於寒暑假期間，若有與教學相關事項或配合災害防救所需亦應到校辦理，教師無法配合參與時，應依規定辦理請假手續，併予敘明。\n四、又查教育部97年12月25日台國(四)字第0970259038號函略以：「請各縣市政府督導轄內各國中，應以自主辦理課外輔導或留校自習等學習活動為原則，不應有接受外界或家長委託辦理情事；亦請兼顧尊重教師授課意願。」是以各校應依上開規定，妥適調整寒暑假期間課輔教師之安排，以維護學生學習權益及衡平教師權益。","history":"98年3月4日北教人字第0980131018號。"},{"title":"報載有關學校寒暑假輔導課安排任課教師方式疑義，引起基層教師關切案。","content":"一、依據教育部98年4月6日台國(四)字第0980055659號函辦理。\n二、貴校辦理寒暑假課業輔導，應於學生自願參加前提下，徵詢教師授課意願妥為安排相關課務，原依教師意願安排之課輔課程，如授課教師因故未能如期擔任課輔授課時，宜由任課老師自行覓妥適當之人員代授課程，如該教師無法事先覓妥適當之職務代理人時，應以書面通知學校另行安排授課教師，且不計入教師請假時數。上開工作之安排宜考量教師身心狀況與學生需求平衡辦理。\n三、另請確依「臺北縣立完全中學暨國民中學學生課後輔導及寒暑假學藝活動實施要點」規定辦理寒暑假課業輔導，不得強迫學生參加，以符教學正常化之準則。","history":"98年4月15日北教國字第0980267637號。"},{"title":"教育部國民及學前教育署補助辦理國民小學及國民中學學生學習扶助作業要點","content":"一、教育部國民及學前教育署(以下簡稱本署)為落實國民小學及國民中學學生成績評量準則第十一條規定，執行國民小學及國民中學學生學習扶助，篩選國語文、數學、英語文三科目(領域)學習低成就學生，及早即時提供學習扶助，以提升學生學習效能，縮減學力落差，落實教育機會均等，特訂定本要點。\n二、本要點所定補助(以下簡稱本補助)之適用對象如下：\n（一）直轄市、縣(市)政府(以下簡稱地方政府)。\n（二）法務部矯正署。\n（三）公私立大學。\n（四）與本署合作之機關團體。\n三、本補助之類別如下：\n（一）地方政府：\n1.縣市整體行政推動計畫經費。\n2.學校開班經費。\n3.課中學習扶助增置代理教師計畫經費。\n4.教學換宿經費。\n5.國中適性分組教學試辦經費。\n6.有關學校自主規劃辦理之提升學習低成就學生學力計畫經費。\n（二）法務部矯正署：學校開班經費。\n（三）公立大學及與本署合作之機關團體：學校開班經費(限補助教學人員之鐘點費、勞保費、勞退金、健保費及補充保費等相關經費)。\n四、補助項目及支用標準：\n（一）縣市整體行政推動計畫經費：\n1.政策推動：辦理全直轄市、縣(市)說明會、校長及承辦人員相關教育訓練等。\n2.行政督導：辦理學習扶助相關政策規劃、督導會議、檢核訪視、成效追蹤及評選表揚等。\n3.資源中心：\n（1）資源中心設立數以地方政府轄內學校校數為依據。達一百校(含百校內)者得設置一所資源中心，每年經費新臺幣(以下同)一百萬元，含聘請一名專責人員人事費用(最高每年六十萬元)、中心運作業務費；達二及三百校以上者，依前述方式比照辦理。\n（2）部分縣(市)政府轄內學校數已達百校，但未達得增第二所以上資源中心標準者，如校數超過六十校以上者，得多增聘一名專責人員，並予以補助其人事費用。\n4.研發推廣：研發教材教法、教學策略及教材示例等並加以推廣。所研發相關教材教案檔案應上傳(或連結)於本署指定之資源平臺，提供教學人員無償使用。\n5.教師成長：辦理學習扶助教師相關知能增長研習等。\n6.教材印製：編印師生所需學習扶助課程教材資源及個案學生使用教材之印刷費等。\n7.輔導諮詢：學校現職教育人員，於不影響課務之前提下擔任諮詢或輔導任務工作，每週以二日為上限，得以公假登記。\n（1）到校諮詢：具到校諮詢人員資格者，諮詢費用以每人每場次二千元、一日四千元為上限，每週以二日為上限。\n（2）入班輔導：具入班輔導人員資格者，輔導費用以每人每場次二千元、一日四千元為上限，每週以二日為上限。\n8.差旅費：\n（1）業務相關人員參與學習扶助之研習、訪視、會議與活動等。\n（2）注意事項：\nA.如係參與培訓、實習、研習或回訓等性質之活動，則僅補助往返交通及住宿費。\nB.各項訪視、評鑑、追蹤督導或諮詢輔導人員，其已支領酬勞者，僅補助往返交通及住宿費。\n9.辦理學習扶助授課人員之表揚所需費用。\n10.三年級至八年級篩選測驗，因電腦設備不足或大型學校而採答案卡劃記方式所需費用。\n11.其他：由各地方政府依需求辦理符合本要點相關規定之提升學習低成就學生學習成效之計畫項目。\n（二）學校開班經費：\n1.教學人員鐘點費、勞保費、勞退金、健保費及補充保費等相關經費：\n（1）鐘點費：\nA.學期中第七節以前：依「公立中小學兼任及代課教師鐘點費支給基準表」之國民小學及國民中學兼任及代課教師支給數額辦理。\nB.第七節下課以後、週末、寒暑假及住校生十八時以後夜間輔導：國民小學每節四百元，國民中學每節四百五十元。\nC.校內現職教師(包括代理教師)擔任課中學習扶助班級授課教師，於超過各地方政府所訂每週基本課節數後之課中學習扶助授課節數(國小週間未排課下午之學習扶助授課節數不在此限)，始得支領本目之(１)之A之鐘點費。\n（2）勞保費、勞退金、健保費及補充保費依相關規定辦理。\n2.行政費：辦理學習扶助相關費用。以每校各期實際授課總節數乘以每節四十元計算，且各期行政費僅得於該期別使用，不得勻支至其他期別使用。各地方政府得依下列經費項目訂定比率：\n（1）建立學生個人學習檔案、製作教材教具。\n（2）召開學校學習輔導小組會議所需膳費或資料印刷費。\n（3）提供參與學習扶助學生於課程中所需餐點或學習用品(包括獎勵品)。\n（4）非屬施測時該節課任課教師之施測費，以學習扶助授課鐘點費計算之。\n（5）住校生夜間學習輔導工作人員加班費。\n3.教材編輯費及活動費：不支領鐘點費之授課人員依實際授課節數每節九十元計算，其費用得由學校統籌辦理學習扶助授課人員之表揚等學習扶助相關活動。\n4.交通費：具大學生(包括研究所學生)身分之教學人員每人每月最高一千二百元。依各地方政府規定核實支付。\n5.冷氣電費：\n（1）計算公式：\nA.暑假：以每校該期實際授課總節數乘以一點二倍乘以一臺冷氣乘以每臺每節耗電量二點五度乘以「該學年度第一學期開始所屬年度中央對直轄市及縣市政府一般性教育補助款(以下簡稱一般性教育補助款)國民中小學冷氣電費設算公式之每度電費」計算。\nB.第一學期：以每校該期課後及週休實際授課總節數乘以「九、十月占第一學期月份數比率」乘以一點二倍乘以二臺冷氣乘以每臺每節耗電量二點五度乘以「該學年度第一學期開始所屬年度一般性教育補助款國民中小學冷氣電費設算公式之每度電費」計算。\nC.第二學期：以每校該期課後及週休實際授課總節數乘以「五、六月占第二學期月份數比率」乘以一點二倍乘以一臺冷氣乘以每臺每節耗電量二點五度乘以每度電二點八二元計算。\n（2）依上開公式加總暑假、第一學期及第二學期計算結果為整學年可使用冷氣電費上限，使用期間不以每年五至十月為限，且各期冷氣電費得於暑假、第一學期、寒假及第二學期各期別勻支使用。\n（三）課中學習扶助增置代理教師計畫經費：\n1.人事費：每人每年以六十五萬元為申請上限。\n2.行政費：每人每年以六千元計算，且須使用於辦理課中學習扶助相關事宜。\n3.各地方政府得另以其他教育經費支應進用本計畫代理教師所需之費用。\n（四）教學換宿相關費用：補助項目依本署「偏遠地區國民中小學教學換宿計畫」相關規定辦理。\n（五）國中適性分組教學試辦相關費用：補助項目依本署「國民中學英語及數學領域適性分組教學試辦計畫」相關規定辦理。\n（六）其他學校自主規劃辦理之提升學習低成就學生學力計畫經費：業務費、開班費及其他依「教育部補(捐)助及委辦經費核撥結報作業要點」規定之經費等。\n五、補助基準：\n（一）本要點各項經費補助比率，依中央對直轄市及縣(市)政府補助辦法規定及配合本署獲配年度預算額度，就地方政府財力級次分級補助，並得依本署預算編列情形、地方政府財政狀況及配合本署重要政策推動情形、因應天然災害或其他特殊需要予以增減補助比率，最高補助百分之九十。但第二目及第三目經費經本署專案報請行政院同意放寬者，得不受補助比率之限制：\n1.整體行政推動計畫經費：第一級百分之八十二、第二級百分之八十五、第三級百分之八十七、第四級百分之八十九、第五級百分之九十。學校開班經費：補助比率依學校類型及財力級次劃分，偏遠地區學校之補助比率，依「教育部補助偏遠地區學校及非山非市學校教育經費作業要點」規定辦理；一般地區學校之補助比率為第一級至第二級百分之九十、第三級至第五級百分之百。\n2.課中學習扶助增置代理教師計畫及國中適性分組教學試辦計畫開課經費：第一級至第二級百分之九十、第三級至第五級百分之百。\n（二）縣市整體行政推動計畫每年最高以六百萬元為申請上限。\n（三）課中學習扶助增置代理教師計畫：\n1.以各地方政府前一學年度開班補助經費總額之百分之八為設算基準，核算可申請增置代理教師人數，採小數點以後無條件捨去。計算後人數不足一人時，得以一人計算。各校以申請一名增置代理教師為限。\n2.本計畫須經審查通過後補助。\n六、審查方式：由本署邀請學者專家及具實務經驗者組成審查小組，並得視需要邀請地方政府或相關人員派員列席說明。\n七、本補助經費之請撥、支用及核銷結報事宜，應依「教育部補(捐)助及委辦經費核撥結報作業要點」及本署相關規定辦理：\n（一）本補助經費應專款專用核實支付，且不得用於地方政府辦理任何學習能力檢測之普測。\n（二）本補助以學年度為辦理期程，經費請撥方式如下：\n1.整體行政推動計畫經費及課中學習扶助增置代理教師計畫經費依本署審查結果核定後撥付。\n2.開班經費參採前一學年度之額度，於每年六月前以預核方式辦理；並分期核撥。\n3.學校自主規劃之提升學習低成就學生學力計畫依本署審查結果辦理。\n（三）差旅費支應規定：\n1.應依「國內出差旅費報支要點」辦理，已支領酬勞者，僅得向任職單位申請往返交通費及住宿費，且不得重複請領。\n2.各子計畫人員所需差旅費用，不得重複編列。\n（四）本補助之結餘款，應按補助比率繳回。另縣市整體行政推動計畫經費結餘款未超過十萬元者，依中央對直轄市及縣(市)政府補助辦法第十九條第二款規定，無需繳回。\n（五）第三點之適用對象，應於每年十月十五日前，將執行成果報告(包括紙本及電子檔，以不超過三十頁為原則)及經費收支結算表函送本署辦理核結。成果報告內容應包括計畫執行成果、成效評估與檢討、問題解決策略等。\n八、督導、檢核及獎勵：\n（一）本署、地方政府及學校得依辦理學習扶助情形(如相關會議出席、系統資料填報維護、資料繳交及經費運用等情形)進行評估檢核，其績效卓著者，得依權責對受補助對象或相關單位及人員從優獎勵。\n（二）各地方政府應於每年十月十五日前，完成前一學年度補助經費核結，因故無法於原定期程內報核，應於期限截止前向本署申請展延，並在本署同意可延展期限內，完成結報。","history":"1.101年11月30日教育部臺國(二)字第 1010193922B號令訂定發布全文9點；並自102年1月1日生效。\n2.102年11月28日教育部國民及學前教育署臺教國署國字第 10 let currentIndex=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderList(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const list=document.getElementById('lawList');
 const count=document.getElementById('count');
 const none=document.getElementById('none');
 if(!laws.length){
  count.textContent='待匯入法規';
  none.classList.add('hidden');
  list.innerHTML='<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm leading-relaxed text-slate-500">第七類法規清單預留區；確認版型後再匯入法規名稱。</div>';
  return;
 }
 list.innerHTML='';
 const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+'\\n'+x.content+'\\n'+x.history).toLowerCase().includes(q));
 count.textContent=`${filtered.length} / ${laws.length} 項`;
 none.classList.toggle('hidden',filtered.length>0);
 filtered.forEach(x=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'active-law':'');
  b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title.replace(/^\\s*\\d+[、.．]?\\s*/,''))}</span>`;
  b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};
  list.appendChild(b);
 });
}
function formatLawText(content, lawIndex){
 const normalized=String(content||'').replace(/\\n/g,'\n');
 return normalized.split('\n').map(raw=>{
  const t=raw.trim();
  if(!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
  const chapter=t.match(/^第\s*([一二三四五六七八九十百千0-9０-９]+)\s*章\s*(.*)$/);
  if(chapter) return '<div class="doc-chapter" style="display:block;font-size:1.25rem!important;font-weight:800!important;line-height:2.2!important;margin:1.25em 0 .6em!important;">'+esc('第'+chapter[1]+'章 '+chapter[2].trim())+'</div>';
  const article=t.match(/^(第\s*[0-9０-９一二三四五六七八九十百千]+\s*條(?:\s*之\s*[0-9０-９一二三四五六七八九十百千]+)?)(.*)$/);
  if(article){
   const label=article[1].replace(/\s+/g,'');
   const heading='<div class="doc-article-heading">'+esc(label)+'</div>';
   const inlineText=article[2].trim();
   return heading+(inlineText?'<div class="doc-article-body">'+esc(inlineText)+'</div>':'');
  }
  const levels=[
   {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/,n:0},
   {re:/^([一二三四五六七八九十百千]+、)(.*)$/,n:1},
   {re:/^([（(][一二三四五六七八九十百千壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/,n:2},
   {re:/^([0-9０-９]+[、.．])(.*)$/,n:3},
   {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/,n:4},
   {re:/^([A-ZＡ-Ｚ]+[、.．])(.*)$/,n:5}
  ];
  for(const level of levels){
   const m=t.match(level.re);
   if(m) return '<div class="doc-row doc-level-'+level.n+'"><span class="doc-marker">'+esc(m[1])+'</span><span class="doc-copy">'+esc(m[2].trimStart())+'</span></div>';
  }
  return '<div class="doc-row doc-paragraph"><span class="doc-marker"></span><span class="doc-copy">'+esc(t)+'</span></div>';
 }).join('');
}
function renderDetail(){
 const detail=document.getElementById('detail');
 if(!laws.length){
  detail.innerHTML='<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第七類法規版型確認</span><span class="text-xs text-slate-400">版型確認階段</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">法規內容預留區</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]"><div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-5 text-sm leading-relaxed text-slate-500">目前尚未匯入法規正文。</div></div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">法規沿革預留區。</div></div>';
  return;
 }
 const law=laws[currentIndex];
 const content=formatLawText(law.content,currentIndex);
 const hasArticleStructure=/(?:^|\n)\s*第\s*[0-9０-９一二三四五六七八九十百千]+\s*條(?:\s*之\s*[0-9０-９一二三四五六七八九十百千]+)?/m.test(law.content||'');
 const hasItemMarkers=/(?:^|\n)\s*(?:[壹貳參肆伍陸柒捌玖拾]+、|[一二三四五六七八九十百千]+、|[（(][一二三四五六七八九十百千壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)]|[0-9０-９]+[、.．]|[A-ZＡ-Ｚ]+[、.．])/m.test(law.content||'');
 const formatClass=hasArticleStructure?'law07-article-format':(hasItemMarkers?'law07-item-format':'law07-plain-format');
 detail.innerHTML='<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 '+(currentIndex+1)+' 項／共 '+laws.length+' 項</span><span class="text-xs text-slate-400">課後照顧、寒暑假學藝活動</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">'+esc(law.title)+'</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px] '+formatClass+'">'+(content||'<p>原始文件未提供此項資料。</p>')+'</div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">'+(law.history&&law.history.trim()?esc(law.history):'原始文件未提供此項資料。')+'</div></div><div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" '+(currentIndex===0?'disabled':'')+' class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" '+(currentIndex===laws.length-1?'disabled':'')+' class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>';
}
function go(d){currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
document.getElementById('searchInput').addEventListener('input',renderList);renderList();renderDetail();
</script></body></html>
