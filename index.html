<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市115學年度教務行政法規手冊與重點工作平台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <div class="flex-grow flex flex-col">
    <!-- 頂端導覽列 -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
            <i class="fa-solid fa-scale-balanced text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-base md:text-lg text-slate-900 leading-tight">新北市115學年度教務行政法規手冊</h1>
            <p class="text-xs text-slate-500 hidden sm:block">法規彙編 ✕ 重點工作平台</p>
          </div>
        </div>

        <!-- 視圖切換按鈕 -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs md:text-sm">
          <button id="btn-all" onclick="setView('all')" class="px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold">
            雙欄對照
          </button>
          <button id="btn-laws" onclick="setView('laws')" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 flex items-center gap-1">
            <i class="fa-solid fa-book-bookmark text-xs"></i> 僅看法規
          </button>
          <button id="btn-tasks" onclick="setView('tasks')" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 flex items-center gap-1">
            <i class="fa-solid fa-list-check text-xs"></i> 僅看科室
          </button>
        </div>
      </div>
    </header>

    <!-- 橫幅搜尋區 -->
    <section class="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-900 text-white py-8 px-4">
      <div class="max-w-4xl mx-auto text-center space-y-3">
        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">依法行政・處室協作指引</h2>
        <p class="text-slate-300 text-xs md:text-sm">法規手冊目錄 ✕ 各科室指引快速檢索</p>

        <!-- 搜尋輸入框 -->
        <div class="relative max-w-2xl mx-auto pt-2">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="searchInput"
            oninput="handleSearch()"
            placeholder="請輸入關鍵字（例如：中教科、特教科、授課時數...）"
            class="w-full pl-11 pr-4 py-3 bg-white text-slate-800 rounded-2xl shadow-lg focus:ring-4 focus:ring-blue-400/30 outline-none text-sm transition">
        </div>
      </div>
    </section>

    <!-- 主體內容區塊（純雙欄） -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

        <!-- 左邊：法規彙編（11 大類標題） -->
        <section id="section-laws" class="space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <span class="p-1.5 bg-blue-100 text-blue-700 rounded-lg"><i class="fa-solid fa-book-bookmark text-sm"></i></span>
              <h3 class="text-base font-bold text-slate-800">法規彙編</h3>
              <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">共 11 大類</span>
            </div>
            <span class="text-xs text-slate-400">手冊目錄分類</span>
          </div>

          <!-- 11 大類法規標題容器 -->
          <div id="laws-container" class="space-y-3"></div>
        </section>

        <!-- 右邊：重點工作（只保留純科室名稱） -->
        <section id="section-tasks" class="space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <span class="p-1.5 bg-emerald-100 text-emerald-700 rounded-lg"><i class="fa-solid fa-building-columns text-sm"></i></span>
              <h3 class="text-base font-bold text-slate-800">重點工作（科室）</h3>
              <span id="tasks-count" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">共 11 科室</span>
            </div>
            <span class="text-xs text-slate-400">局端業務科室</span>
          </div>

          <!-- 純科室清單容器 -->
          <div id="tasks-container" class="space-y-3"></div>
        </section>

      </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
      <p>新北市立中等學校法規彙編與重點工作指引平台</p>
    </footer>
  </div>

  <script>
    // 左邊：法規 11 大類目錄
    const lawsCategories = [
      { id: "law-01", title: "一、組織編制、員額基準、授課時數", icon: "fa-users-gear" },
      { id: "law-02", title: "二、課程與教學", icon: "fa-book-open-reader" },
      { id: "law-03", title: "三、常態編班、正常教學", icon: "fa-chalkboard-user" },
      { id: "law-04", title: "四、新生入學、學籍管理、成績評量", icon: "fa-id-card-clip" },
      { id: "law-05", title: "五、教師聘任、兼任代課、代理、權利義務、教師甄選等", icon: "fa-user-tie" },
      { id: "law-06", title: "六、教師研習、進修、請假", icon: "fa-calendar-check" },
      { id: "law-07", title: "七、課後照顧、寒暑假學藝活動", icon: "fa-sun" },
      { id: "law-08", title: "八、特殊教育、技藝教育、補習進修學校", icon: "fa-hand-holding-heart" },
      { id: "law-09", title: "九、高級中等教育、職業教育、實習課程、技能檢定、職業安全", icon: "fa-wrench" },
      { id: "law-10", title: "十、實驗教育", icon: "fa-flask-vial" },
      { id: "law-11", title: "十一、其它", icon: "fa-folder-open" }
    ];

    // 右邊：純科室清單（不帶數字、不帶多餘字句）
    const deptList = [
      { name: "小教科", icon: "fa-child" },
      { name: "中教科", icon: "fa-school" },
      { name: "技職科", icon: "fa-gears" },
      { name: "特教科", icon: "fa-heart" },
      { name: "社教科", icon: "fa-users" },
      { name: "衛環科", icon: "fa-seedling" },
      { name: "教資科", icon: "fa-laptop-code" },
      { name: "新民科", icon: "fa-globe" },
      { name: "政風室", icon: "fa-shield-halved" },
      { name: "校安室", icon: "fa-bell" },
      { name: "家庭教育中心", icon: "fa-house-chimney-window" }
    ];

    let currentView = 'all';

    function setView(view) {
      currentView = view;
      document.getElementById('btn-all').className = view === 'all' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900';
      document.getElementById('btn-laws').className = view === 'laws' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold flex items-center gap-1' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 flex items-center gap-1';
      document.getElementById('btn-tasks').className = view === 'tasks' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold flex items-center gap-1' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 flex items-center gap-1';

      const secLaws = document.getElementById('section-laws');
      const secTasks = document.getElementById('section-tasks');

      if (view === 'all') {
        secLaws.classList.remove('hidden', 'lg:col-span-2');
        secTasks.classList.remove('hidden', 'lg:col-span-2');
      } else if (view === 'laws') {
        secLaws.classList.remove('hidden');
        secLaws.classList.add('lg:col-span-2');
        secTasks.classList.add('hidden');
      } else if (view === 'tasks') {
        secLaws.classList.add('hidden');
        secTasks.classList.remove('hidden');
        secTasks.classList.add('lg:col-span-2');
      }
    }

    function renderPage() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const lawsContainer = document.getElementById('laws-container');
      const tasksContainer = document.getElementById('tasks-container');

      // 渲染左邊：法規 11 大類標題
      const filteredLaws = lawsCategories.filter(cat => q === '' || cat.title.toLowerCase().includes(q));

      lawsContainer.innerHTML = filteredLaws.map(cat => {
        return `
          <div class="bg-white rounded-xl border border-slate-200/90 shadow-sm p-4 hover:border-blue-400 hover:shadow-md transition cursor-pointer">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-sm flex-shrink-0">
                  <i class="fa-solid ${cat.icon}"></i>
                </span>
                <h4 class="font-bold text-slate-900 text-sm md:text-base leading-snug">${cat.title}</h4>
              </div>
              <span class="text-xs text-slate-400 font-medium ml-2 flex-shrink-0">整理中</span>
            </div>
          </div>
        `;
      }).join('');

      // 渲染右邊：純科室名稱卡片
      const filteredDepts = deptList.filter(d => q === '' || d.name.toLowerCase().includes(q));

      document.getElementById('tasks-count').innerText = `${filteredDepts.length} 科室`;

      if (filteredDepts.length === 0) {
        tasksContainer.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">查無此科室</div>`;
        return;
      }

      tasksContainer.innerHTML = filteredDepts.map(d => {
        return `
          <div class="bg-white rounded-xl border border-slate-200/90 shadow-sm p-4 hover:border-emerald-400 hover:shadow-md transition cursor-pointer">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center text-sm flex-shrink-0">
                  <i class="fa-solid ${d.icon}"></i>
                </span>
                <h4 class="font-bold text-slate-900 text-base leading-snug">${d.name}</h4>
              </div>
              <span class="text-xs text-slate-400 font-medium ml-2 flex-shrink-0">整理中</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleSearch() {
      renderPage();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderPage();
    });
  </script>
</body>
</html>
