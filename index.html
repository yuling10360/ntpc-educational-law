<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市115學年度教務行政法規手冊與重點工作平台</title>
  <!-- Tailwind CSS -->

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

            <i class="fa-solid fa-scale-balanced text-lg"></i>

          <div>

            <p class="text-xs text-slate-500 hidden sm:block">法規彙編 ✕ 重點工作平台</p>

          <button id="btn-all" onclick="setView('all')" class="px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold">雙欄對照</button>
          <button id="btn-laws" onclick="setView('laws')" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900">僅看法規</button>

          <input 
            type="text" 
            id="searchInput"
            oninput="handleSearch()"
            placeholder="請輸入關鍵字（例如：授課時數、編班、中教科、校安...）"

    <!-- 主體內容區塊（純雙欄） -->

              <h3 class="text-base font-bold text-slate-800">法規彙編</h3>
              <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">共 11 大類</span>
            </div>
            <span class="text-xs text-slate-400">點擊卡片進入詳細頁面</span>
          </div>

          <div id="laws-container" class="space-y-3"></div>
        </section>

        <!-- 右邊：重點工作（點擊開啟子網頁） -->

            <div class="flex items-center gap-2">

  <script>
    // 11 大類目錄（設定跳轉網址 link）
    const lawsCategories = [
      { id: "law-01", title: "一、組織編制、員額基準、授課時數", icon: "fa-users-gear", link: "law-01.html" },
      { id: "law-02", title: "二、課程與教學", icon: "fa-book-open-reader", link: "law-02.html" },
      { id: "law-03", title: "三、常態編班、正常教學", icon: "fa-chalkboard-user", link: "law-03.html" },
      { id: "law-04", title: "四、新生入學、學籍管理、成績評量", icon: "fa-id-card-clip", link: "law-04.html" },
      { id: "law-05", title: "五、教師聘任、兼任代課、代理、權利義務、教師甄選等", icon: "fa-user-tie", link: "law-05.html" },
      { id: "law-06", title: "六、教師研習、進修、請假", icon: "fa-calendar-check", link: "law-06.html" },
      { id: "law-07", title: "七、課後照顧、寒暑假學藝活動", icon: "fa-sun", link: "law-07.html" },
      { id: "law-08", title: "八、特殊教育、技藝教育、補習進修學校", icon: "fa-hand-holding-heart", link: "law-08.html" },
      { id: "law-09", title: "九、高級中等教育、職業教育、實習課程、技能檢定、職業安全", icon: "fa-wrench", link: "law-09.html" },
      { id: "law-10", title: "十、實驗教育", icon: "fa-flask-vial", link: "law-10.html" },
      { id: "law-11", title: "十一、其它", icon: "fa-folder-open", link: "law-11.html" }
    ];

    // 11 個科室清單（設定跳轉網址 link）
    const deptList = [
      { name: "小教科", icon: "fa-child", link: "dept-01.html" },
      { name: "中教科", icon: "fa-school", link: "dept-02.html" },
      { name: "技職科", icon: "fa-gears", link: "dept-03.html" },
      { name: "特教科", icon: "fa-heart", link: "dept-04.html" },
      { name: "社教科", icon: "fa-users", link: "dept-05.html" },
      { name: "衛環科", icon: "fa-seedling", link: "dept-06.html" },
      { name: "教資科", icon: "fa-laptop-code", link: "dept-07.html" },
      { name: "新民科", icon: "fa-globe", link: "dept-08.html" },
      { name: "政風室", icon: "fa-shield-halved", link: "dept-09.html" },
      { name: "校安室", icon: "fa-bell", link: "dept-10.html" },
      { name: "家庭教育中心", icon: "fa-house-chimney-window", link: "dept-11.html" }
    ];

    function setView(view) {
      document.getElementById('btn-all').className = view === 'all' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900';
      document.getElementById('btn-laws').className = view === 'laws' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900';
      document.getElementById('btn-tasks').className = view === 'tasks' 
        ? 'px-3 py-1.5 rounded-lg transition bg-white shadow text-blue-600 font-semibold' 
        : 'px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900';

      const secLaws = document.getElementById('section-laws');
      const secTasks = document.getElementById('section-tasks');

      if (view === 'all') {
        secLaws.classList.remove('hidden', 'lg:col-span-2');
        secTasks.classList.remove('hidden', 'lg:col-span-2');
      } else if (view === 'laws') {
        secLaws.classList.remove('hidden');
        secLaws.classList.add('lg:col-span-2');
        secTasks.classList.add('hidden');
      } else if (view === 'tasks') {
        secLaws.classList.add('hidden');
        secTasks.classList.remove('hidden');
        secTasks.classList.add('lg:col-span-2');
      }
    }

    function renderPage() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const lawsContainer = document.getElementById('laws-container');
      const tasksContainer = document.getElementById('tasks-container');

      // 渲染左邊（帶有超連結標籤 <a>）
      const filteredLaws = lawsCategories.filter(cat => q === '' || cat.title.toLowerCase().includes(q));
      lawsContainer.innerHTML = filteredLaws.map(cat => `
        <a href="${cat.link}" class="block bg-white rounded-xl border border-slate-200/90 shadow-sm p-4 hover:border-blue-500 hover:shadow-md transition group">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-sm group-hover:bg-blue-600 group-hover:text-white transition">
                <i class="fa-solid ${cat.icon}"></i>
              </span>
              <h4 class="font-bold text-slate-900 text-sm md:text-base leading-snug group-hover:text-blue-600 transition">${cat.title}</h4>
            </div>
            <div class="flex items-center gap-1.5 text-slate-400 group-hover:text-blue-600 text-xs">
              <span>前往查閱</span>
              <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </div>
          </div>
        </a>
      `).join('');

      // 渲染右邊（帶有超連結標籤 <a>）
      const filteredDepts = deptList.filter(d => q === '' || d.name.toLowerCase().includes(q));
      document.getElementById('tasks-count').innerText = `${filteredDepts.length} 科室`;

      tasksContainer.innerHTML = filteredDepts.map(d => `
        <a href="${d.link}" class="block bg-white rounded-xl border border-slate-200/90 shadow-sm p-4 hover:border-emerald-500 hover:shadow-md transition group">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center text-sm group-hover:bg-emerald-600 group-hover:text-white transition">
                <i class="fa-solid ${d.icon}"></i>
              </span>
              <h4 class="font-bold text-slate-900 text-base leading-snug group-hover:text-emerald-700 transition">${d.name}</h4>
            </div>
            <div class="flex items-center gap-1.5 text-slate-400 group-hover:text-emerald-700 text-xs">
              <span>前往查閱</span>
              <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </div>
          </div>
        </a>
      `).join('');
    }

    // 法規全文搜尋：即時比對各法規頁面的原文段落
    let legalTextIndexPromise = null;
    function getLegalTextIndex() {
      if (!legalTextIndexPromise) {
        legalTextIndexPromise = Promise.all(lawsCategories.map(async cat => {
          try {
            const response = await fetch(cat.link);
            if (!response.ok) return [];
            const source = await response.text();
            const doc = new DOMParser().parseFromString(source, "text/html");
            const blocks = [];
            const main = doc.querySelector("main, article, .law-content, #law-content") || doc.body;
            if (main) {
              const clean = main.cloneNode(true);
              clean.querySelectorAll("script, style, nav, header, footer, button, input, select, textarea").forEach(el => el.remove());
              // 保留法規頁原有區塊邊界，避免整頁文字混成一大段。
              const separated = clean.innerHTML
                .replace(/<br\s*\/?\s*>/gi, "\n")
                .replace(/<\/(?:p|li|tr|td|th|h[1-6]|section|article|div|blockquote|pre)>/gi, "\n")
                .replace(/<[^>]*>/g, " ");
              const textHolder = doc.createElement("div");
              textHolder.innerHTML = separated;
              const lines = (textHolder.textContent || "").split(/\n+/)
                .map(s => s.replace(/\s+/g, " ").trim())
                .filter(s => s.length >= 8);
              const seen = new Set();
              lines.forEach(line => {
                if (!seen.has(line)) {
                  seen.add(line);
                  blocks.push({ text: line, link: cat.link, title: cat.title });
                }
              });
            }
            return blocks;
          } catch (_) { return []; }
        })).then(groups => groups.flat());
      }
      return legalTextIndexPromise;
    }

    let searchSequence = 0;
    async function showLegalSearchResults(query) {
      const panel = document.getElementById("searchResults");
      const q = (query || "").trim();
      if (!q) { panel.classList.add("hidden"); panel.innerHTML = ""; return; }
      panel.classList.remove("hidden");
      panel.innerHTML = '<div class="px-4 py-3 text-sm text-slate-500">正在搜尋法規原文…</div>';
      const sequence = ++searchSequence;
      const index = await getLegalTextIndex();
      if (sequence !== searchSequence) return;
      const normalizedQuery = q.toLowerCase();
      const matches = index
        .filter(item => item.text.toLowerCase().includes(normalizedQuery))
        .sort((a, b) => {
          const aExact = a.text.toLowerCase().startsWith(normalizedQuery) ? 1 : 0;
          const bExact = b.text.toLowerCase().startsWith(normalizedQuery) ? 1 : 0;
          return bExact - aExact || a.text.length - b.text.length;
        })
        .slice(0, 12);
      if (!matches.length) {
        panel.innerHTML = '<div class="px-4 py-3 text-sm text-slate-500">法規內文中沒有找到相符段落。</div>';
        return;
      }
      panel.innerHTML = '<div class="px-4 py-2 bg-slate-50 border-b border-slate-200 text-xs text-slate-500">法規原文搜尋結果（最多顯示 12 段）</div>' +
        matches.map(item => '<a href="' + item.link + '" class="block px-4 py-3 border-b border-slate-100 last:border-b-0 hover:bg-blue-50 transition">' +
          '<div class="text-xs font-semibold text-blue-700 mb-1">' + escapeSearchHtml(item.title) + '</div>' +
          '<div class="text-sm text-slate-700 leading-relaxed">' + highlightSearchText(item.text, q) + '</div></a>').join("");
    }
    function escapeSearchHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function highlightSearchText(text, query) {
      const safeText = escapeSearchHtml(text);
      const safeQuery = escapeSearchHtml(query);
      const index = safeText.toLowerCase().indexOf(safeQuery.toLowerCase());
      if (index < 0) return safeText;
      return safeText.slice(0, index) + '<mark class="bg-yellow-200 text-slate-900 rounded px-0.5">' + safeText.slice(index, index + safeQuery.length) + '</mark>' + safeText.slice(index + safeQuery.length);
    }

    function handleSearch() {
      renderPage();
      showLegalSearchResults(document.getElementById("searchInput").value);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderPage();
    });
  </script>

  <!-- 免費智慧法規客服：僅依網站既有法規原文進行關鍵詞／同義詞檢索，不呼叫 AI API -->

    #legalBotPanel{position:fixed;right:22px;bottom:88px;width:min(410px,calc(100vw - 28px));height:min(590px,calc(100vh - 125px));z-index:80;box-shadow:0 18px 55px rgba(15,23,42,.22)}

      <div id="legalBotScopeBadge" class="hidden text-xs text-indigo-800 bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-2 cursor-pointer" title="點此重新選擇學制"></div>
      <div id="legalBotSuggestions" class="hidden flex-wrap gap-2">
        <button type="button" class="legalbot-suggestion text-xs rounded-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 hover:bg-indigo-50">基鐘／每週授課節數</button>
        <button type="button" class="legalbot-suggestion text-xs rounded-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 hover:bg-indigo-50">減課／減授課</button>
        <button type="button" class="legalbot-suggestion text-xs rounded-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 hover:bg-indigo-50">代理教師聘任</button>
        <button type="button" class="legalbot-suggestion text-xs rounded-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 hover:bg-indigo-50">實驗教育</button>
        <button type="button" class="legalbot-suggestion text-xs rounded-full bg-white border border-indigo-200 text-indigo-700 px-3 py-2 hover:bg-indigo-50">課後照顧</button>

    <form id="legalBotForm" class="hidden border-t border-slate-200 bg-white p-3 flex gap-2">
      <input id="legalBotInput" type="text" maxlength="180" autocomplete="off" placeholder="例如：國中教師減授課有哪些規定？"
        class="min-w-0 flex-1 rounded-xl border border-slate-300 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500">
      <button type="submit" class="rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2" aria-label="送出問題"><i class="fa-solid fa-paper-plane"></i></button>

  <script>
    (function () {
      const launcher = document.getElementById('legalBotLauncher');
      const panel = document.getElementById('legalBotPanel');
      const close = document.getElementById('legalBotClose');
      const form = document.getElementById('legalBotForm');
      const input = document.getElementById('legalBotInput');
      const messages = document.getElementById('legalBotMessages');
      const synonymGroups = [
        ['基鐘','每週授課節數','基本授課節數'],
        ['減課','減授課'],
        ['家長會','家長組織','家長參與','家長委員'],
        ['代理教師','代理老師','代課教師','兼任代課','教師聘任','教師甄選'],
        ['實驗教育','實驗學校','實驗機構','非學校型態'],
        ['課後照顧','課後班','課後托育','寒暑假學藝','學藝活動'],
        ['課程發展委員會','課發會','課程委員會','課程發展'],
        ['授課時數','授課節數','教師節數','減授課'],
        ['編班','常態編班','能力分班','分班'],
        ['請假','教師請假','差假','休假'],
        ['成績評量','學習評量','定期評量','成績'],
        ['特殊教育','資優','身心障礙','特教'],
        ['學生入學','新生入學','學籍','轉學'],
        ['教師進修','研習','在職進修'],
        ['技能檢定','職業安全','實習課程','技職教育']
      ];
      let selectedSchoolLevel = null;
      const levelChoices = document.getElementById('legalBotLevelChoices');
      const scopeBadge = document.getElementById('legalBotScopeBadge');
      const suggestions = document.getElementById('legalBotSuggestions');
      function openPanel() {
        panel.classList.remove('hidden'); launcher.classList.add('hidden');
        launcher.setAttribute('aria-expanded','true');
        if (selectedSchoolLevel) input.focus();
      }
      function chooseSchoolLevel(level) {
        selectedSchoolLevel = level;
        const label = level === 'junior' ? '國中' : '高中';
        levelChoices.classList.add('hidden');
        scopeBadge.textContent = '目前查詢範圍：' + label + '（點此重新選擇）';
        scopeBadge.classList.remove('hidden');
        suggestions.classList.remove('hidden');
        suggestions.classList.add('flex');
        form.classList.remove('hidden');
        addBubble('好的，請輸入您想了解的問題。我會優先呈現「' + label + '」相關法規；若條文屬於國高中共同適用，也會保留相關結果。', 'bot');
        input.focus();
      }
      function resetSchoolLevel() {
        selectedSchoolLevel = null;
        levelChoices.classList.remove('hidden');
        scopeBadge.classList.add('hidden');
        suggestions.classList.add('hidden');
        suggestions.classList.remove('flex');
        form.classList.add('hidden');
        addBubble('請先選擇您要查詢國中還是高中。', 'bot');
      }
      scopeBadge.addEventListener('click', resetSchoolLevel);
      document.querySelectorAll('.legalbot-level').forEach(button => {
        button.addEventListener('click', () => chooseSchoolLevel(button.dataset.schoolLevel));
      })
      function resetConversation() {
        // 每次關閉小幫手都清除本次對話，重新詢問學制。
        const persistentElements = [messages.firstElementChild, levelChoices, scopeBadge, suggestions];
        Array.from(messages.children).forEach(child => {
          if (!persistentElements.includes(child)) child.remove();
        });
        persistentElements.forEach(element => messages.appendChild(element));
        selectedSchoolLevel = null;
        levelChoices.classList.remove('hidden');
        scopeBadge.classList.add('hidden');
        suggestions.classList.add('hidden');
        suggestions.classList.remove('flex');
        form.classList.add('hidden');
        input.value = '';
        messages.scrollTop = 0;
      }
      function closePanel() {
        resetConversation();
        panel.classList.add('hidden'); launcher.classList.remove('hidden');
        launcher.setAttribute('aria-expanded','false');
      }
      launcher.addEventListener('click', openPanel);
      close.addEventListener('click', closePanel);
      function addBubble(text, kind) {
        const bubble = document.createElement('div');
        bubble.className = 'legalbot-bubble rounded-2xl p-3 text-sm ' +
          (kind === 'user' ? 'ml-auto bg-indigo-700 text-white rounded-tr-sm' : 'bg-white border border-slate-200 text-slate-700 rounded-tl-sm');
        bubble.textContent = text;
        messages.appendChild(bubble); messages.scrollTop = messages.scrollHeight;
        return bubble;
      }
      function termsFor(query) {
        const q = query.toLowerCase().replace(/[，。！？、；：,.!?;:（）()\s]/g,'');
        const terms = new Set();
        if (q.length >= 2) terms.add(q);
        // 原問題中的有意義片語與中文字詞，避免只用整句精確比對。
        for (let n = Math.min(6,q.length); n >= 2; n--) {
          for (let i = 0; i <= q.length - n; i++) terms.add(q.slice(i,i+n));
        }
        synonymGroups.forEach(group => {
          if (group.some(term => q.includes(term))) group.forEach(term => terms.add(term.toLowerCase()));
        });
        return [...terms].filter(t => t.length >= 2).sort((a,b)=>b.length-a.length).slice(0,100);
      }
      function highlight(text, query) {
        const safe = escapeSearchHtml(text);
        const q = query.trim();
        if (!q) return safe;
        const i = safe.toLowerCase().indexOf(escapeSearchHtml(q).toLowerCase());
        if (i < 0) return safe;
        const sq = escapeSearchHtml(q);
        return safe.slice(0,i)+'<mark>'+safe.slice(i,i+sq.length)+'</mark>'+safe.slice(i+sq.length);
      }
      async function answerQuestion(query) {
        addBubble(query, 'user');
        const waiting = addBubble('正在比對 11 類法規原文，請稍候…', 'bot');
        try {
          const index = await getLegalTextIndex();
          waiting.remove();
          const terms = termsFor(query);
          const scored = index.map(item => {
            const text = item.text.toLowerCase();
            let score = 0; let hits = 0;
            terms.forEach(term => { if (text.includes(term)) { score += Math.min(term.length,8); hits++; } });
            const normalized = query.toLowerCase().replace(/\\s/g,'');
            if (normalized.length >= 2 && text.includes(normalized)) score += 20;
            const levelTerms = selectedSchoolLevel === 'junior'
              ? ['國民中學','國民中小學','國中','國民中學部']
              : ['高級中等','高中職','高級中學','高職','普通型高級中等','技術型高級中等'];
            const otherLevelTerms = selectedSchoolLevel === 'junior'
              ? ['高級中等','高中職','高級中學','高職']
              : ['國民中學','國中'];
            if (levelTerms.some(term => text.includes(term))) score += 7;
            if (otherLevelTerms.some(term => text.includes(term))) score -= 3;
            return { ...item, score, hits };
          }).filter(x => x.score >= 5 && x.hits >= 1)
            .sort((a,b)=>b.score-a.score || a.text.length-b.text.length);
          const unique = []; const seen = new Set();
          for (const item of scored) {
            const key = item.title + '|' + item.text;
            if (!seen.has(key)) { seen.add(key); unique.push(item); }
            if (unique.length >= 5) break;
          }
          if (!unique.length) {
            addBubble('目前在網站已收錄的法規原文中，沒有找到足夠相關的段落。您可以試著縮短問題，改用法規用語或主題詞（例如「教師聘任」、「課程發展」、「實驗教育」）再查一次。', 'bot');
            return;
          }
          addBubble('我找到以下可能相關的法規原文。請點選「前往法規」查閱完整條文；排序依關鍵詞命中程度，請以原文及現行規定為準。', 'bot');
          unique.forEach(item => {
            const card = document.createElement('div');
            card.className = 'legalbot-result space-y-2';
            const title = document.createElement('div');
            title.className = 'text-xs font-bold text-indigo-700';
            title.textContent = item.title;
            const excerpt = document.createElement('div');
            excerpt.className = 'text-sm leading-relaxed text-slate-700';
            excerpt.innerHTML = highlight(item.text, query);
            const link = document.createElement('a');
            link.href = item.link;
            link.className = 'inline-flex items-center gap-2 text-sm font-semibold text-blue-700 hover:text-blue-900';
            link.innerHTML = '前往法規 <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>';
            card.append(title, excerpt, link); messages.appendChild(card);
          });
          messages.scrollTop = messages.scrollHeight;
        } catch (error) {
          waiting.textContent = '目前無法讀取法規頁面。請稍後再試，或使用首頁原有的關鍵字搜尋功能。';
        }
      }
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!selectedSchoolLevel) {
          addBubble('請先選擇要查詢「國中」或「高中」相關問題。', 'bot');
          return;
        }
        const query = input.value.trim();
        if (!query) return;
        input.value = '';
        answerQuestion(query);
      });
      document.querySelectorAll('.legalbot-suggestion').forEach(button => button.addEventListener('click', () => {
        if (!selectedSchoolLevel) return;
        openPanel(); const query = button.textContent.trim(); answerQuestion(query);
      }));
    })();
  </script>

</body>
</html>
