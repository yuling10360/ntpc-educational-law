l-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">課程規劃及教學設計。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">校園規劃、環境設計及教學設備計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">招生對象、招生人數及班級數等招生計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">近程、中程及長程財務規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">各該主管機關所定其他相關事項。<\/span><\/div>\n<div class=\"doc-plain\">前項經營計畫，各該主管機關應送請相關學者專家初審，並依學校屬直轄市、縣(市)立或國立，分別經直轄市、縣(市)教育審議委員會或中央主管機關所組學校委託私人辦理審議會(以下合稱審議會)複審。複審通過後，由各該主管機關核准委託辦理後通知申請人，並刊登公報。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)教育審議委員會審議之經營計畫，其涉及原住民族教育事務者，應增聘具原住民身分之委員一人至二人參與審議；其涉及實驗教育者，應增聘熟悉實驗教育之委員一人至二人參與審議；委員依該審議之案件聘免，不受直轄市、縣(市)教育審議委員會原有委員原有總額及任期之限制。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">申請人應自收受核准委託辦理通知之次日起一個月內，與各該主管機關簽訂行政契約，其內容，除經依前條第二項複審通過之經營計畫外，應包括下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校名稱及所在地。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">委託辦理期間。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">入學時間及學區劃分。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">各該主管機關應協助事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">雙方應負擔經費及辦理事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">具體績效指標。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">移轉管理標的。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">其他相關事項。<\/span><\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">申請人應於簽訂行政契約後三個月內完成下列事項，報各該主管機關核定後，辦理學生入學：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">取得校長、教學人員及職員之同意受聘意願書。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">完成課程規劃、教學與活動設計及教學資源運用等教學準備。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">完成學生入學準備。<\/span><\/div>\n<div class=\"doc-plain\">受託人未於期限內完成前項事項者，得申請延長，最長不得逾三個月；屆期未完成者，各該主管機關得廢止核准，並解除契約。<\/div>\n<div class=\"doc-plain\">受託人認行政契約有變更必要時，應擬具修正草案，報各該主管機關同意後修正之；其涉及經營計畫之變更者，並應擬具經營計畫修正草案，報各該主管機關提審議會審議後，由各該主管機關核准變更。<\/div>\n<div class=\"chapter-heading\">第  三  章  教職員工權利義務<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">各該主管機關就學校委託私人辦理前，原學校依教育人員、公務人員相關法規聘任、任用之現有編制內校長、教師及職員，於委託日隨同移轉至受託學校繼續聘任、任用者，仍具教育人員、公務人員身分；其任用、服務、懲戒、考績、訓練、進修、俸給、保險、保障、結社、退休、資遣、撫卹、福利及其他權益事項，依原適用之教育人員、公務人員相關法規辦理。<\/div>\n<div class=\"doc-plain\">前項繼續任用人員中，人事、會計人員之管理，與其他公務人員同。<\/div>\n<div class=\"doc-plain\">前二項繼續任用之公務人員，得依委託日前原適用之組織法規，依規定辦理陞遷及銓敘審定。<\/div>\n<div class=\"doc-plain\">第一項、第二項人員於退休、資遣後受聘於受託人者，依第十五條至第十八條規定辦理，並停止領受月退休金及停辦優惠存款。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">前條第一項之原學校校長、教師及職員不願隨同移轉至受託學校者，應由各該主管機關先參酌其意願予以專案安置，或於委託日依其適用之法規辦理退休或資遣。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">各該主管機關就學校委託私人辦理前，原學校依教育人員相關法規聘任、兼任編制外教學人員，於委託日隨同移轉至受託學校繼續聘任者，依原適用之教育人員任用條例規定適用至契約屆滿為止。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">原學校適用勞動基準法之勞工於委託日隨同移轉至受託人者，其勞動條件及工作年資，應由受託人繼續予以承認；其不願隨同移轉者，應由原學校依法預告終止勞動契約，並依適用法律規定給付資遣費或退休金。<\/div>\n<div class=\"doc-plain\">原學校現有依工友管理要點(原事務管理規則)進用之工友(含技工、駕駛，以下簡稱原學校工友)於委託日得依原法規留用，或隨同移轉至受託人；隨同移轉至受託人者，於委託日依其適用之退休、資遣法令辦理退休、資遣，並改依受託學校人事管理規章辦理。<\/div>\n<div class=\"doc-plain\">前項原學校工友不願隨同移轉至受託人者，應由各該主管機關專案安置，其工作年資並應由安置機關(構)繼續予以承認。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">受託人得依校務發展及辦學特色需要，聘請具特定領域專長人員擔任校長，具教育人員任用條例所定校長資格者，得優先聘任；其權利與義務，適用第十六條第二項規定。<\/div>\n<div class=\"doc-plain\">前項校長未具教育人員任用條例所定資格者，其權利與義務依有無具教師證書，分別適用第十六條第三項或第五項規定。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">受託人得依校務發展及辦學特色需要，聘請具特定科目、領域專長人員擔任教學人員，具教師證書者，得優先聘任。<\/div>\n<div class=\"doc-plain\">具教師證書非屬第十一條第一項情形之編制內專任教師，其權利與義務，適用公立學校編制內教師相關法令。但加給、獎金與福利事項，各該主管機關與受託人，及受託學校與教師所定契約另有約定依受託學校人事管理規章為更有利之規定者，從其規定。<\/div>\n<div class=\"doc-plain\">具教師證書之編制外專任教師，依下列規定辦理：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">退休、撫卹、資遣、保險事項，依受託學校人事管理規章規定辦理，不適用公立學校教師相關法令。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">前款以外之權利與義務，適用公立學校編制內教師相關法令。但加給、獎金與福利事項，各該主管機關與受託人，及受託人與教師所定契約另有約定依受託學校人事管理規章為更有利之規定者，從其規定。<\/span><\/div>\n<div class=\"doc-plain\">受託學校教師，於受託學校依其所適用之法令辦理退休、撫卹、資遣、保險給付時，其曾任本條例公布施行前之任職年資採計，依所適用之法令規定辦理。<\/div>\n<div class=\"doc-plain\">不具教師證書之教學人員，其待遇與福利事項，依受託人與教學人員所定契約及受託學校人事管理規章辦理，其退休、撫卹、資遣、保險事項，不適用公立學校教師相關法令規定，其於取得教師證書並任教於公立學校時，職務等級相當且服務成績優良之年資，得在本職最高年功薪範圍內按年採計提敘薪級。<\/div>\n<div class=\"doc-plain\">其他公立學校現任教師經任職學校同意及各該主管機關許可者，得借調至受託學校擔任編制內校長或教師，其期間總計不得逾三年，待遇及福利，由受託學校支給，借調期滿回任原學校，原學校應保留職缺。<\/div>\n<div class=\"doc-plain\">前項借調期間，受託學校應依學校教職員退休條例規定，按月撥繳退撫基金。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">受託人聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可；其屬合格外國語文課程教師者，不受就業服務法第四十六條第二項及第四十八條第一項本文、第二項規定之限制。<\/div>\n<div class=\"doc-plain\">前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">依第一項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">受託學校於受託日後，新進之職員，依受託人與其所定契約及受託學校人事管理規章辦理，不適用公務人員相關法規。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">受託人應依受託學校規模，擬訂學校行政組織、人員配置及人事管理規章等重要章則，報各該主管機關核定。<\/div>\n<div class=\"doc-plain\">受託學校教師員額編制，不得低於公立學校之相關規定。<\/div>\n<div class=\"doc-plain\">受託學校所需之人事費，於支用第四條第一項各該主管機關所提供之人事費後仍有不足者，由受託人自籌，不得由其他用途別科目流入。<\/div>\n<div class=\"doc-plain\">受託學校之各項收入，應悉數用於教育活動及預算項目支出，不得為營利或其他非教育目的行為之支出。<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">受託人或其代表人、負責人、董事或校長之配偶、三親等血親、姻親，不得擔任受託學校之總務、會計、人事職務或工作；其擔任總務、會計或擔任人事職務之人員於簽約前或校長到任前已擔任者，應調整其職務或工作。<\/div>\n<div class=\"doc-plain\">前項違反規定進用之人員，各該主管機關應令受託人或校長立即解除其職務；受託人或校長未立即辦理者，各該主管機關得逕予解除其職務。<\/div>\n<div class=\"chapter-heading\">第 四 章 招生、班級學生人數及教學設備<\/div>\n<div class=\"article-heading\">第 21 條<\/div><div class=\"doc-plain\">  公立國民小學及國民中學委託私人辦理者，直轄市、縣(市)主管機關與受託人訂定行政契約劃分學區時，得納入其他學區，不受原學校所屬學區之限制；其報名入學學生過多時，以設籍先後或抽籤方式決定其入學優先順序。<\/div>\n<div class=\"doc-plain\">前項學區，直轄市、縣(市)主管機關得因社區發展、人口變動、交通狀況、學校環境等因素考量，於舉行公聽會後變更契約調整之。<\/div>\n<div class=\"doc-plain\">學區學生不願就讀受託學校，直轄市、縣(市)主管機關應協助家長依其意願辦理學生轉入鄰近學校就讀，直轄市、縣(市)主管機關應補助其交通費；轉入學校應視實際需要對學生進行生活及學習輔導，並應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。<\/div>\n<div class=\"article-heading\">第  22  條 <\/div>\n<div class=\"doc-plain\">受託學校之班級學生人數，不得高於公立學校之相關規定；其教學設備依公立學校相關規定，但經各該主管機關核准者，不在此限。<\/div>\n<div class=\"chapter-heading\">第  五  章  評鑑、獎勵及輔導<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">各該主管機關應組成評鑑小組，定期或不定期對受託學校實施評鑑及輔導。<\/div>\n<div class=\"doc-plain\">前項評鑑得委託相關學術機構或團體辦理，並於評鑑前公布評鑑項目、評鑑方式等相關事項，於評鑑後公布評鑑結果。評鑑時，得邀請家長陳述意見。評鑑優良者，得予獎勵；評鑑未達標準者，得以書面糾正、限期改善，並接受複評。複評未通過，各該主管機關應再限期改善。<\/div>\n<div class=\"doc-plain\">前項評鑑、獎勵及輔導辦法，由各該主管機關定之。<\/div>\n<div class=\"doc-plain\">各級主管機關得編列預算，對學校予以補助。中央主管機關應依直轄市、縣(市)政府財力級次予以補助，並應專款專用。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">前條評鑑優良者，於委託辦理期間屆滿時，各該主管機關得優先續約。<\/div>\n<div class=\"chapter-heading\">第  六  章  續約、接續辦理、契約終止及期滿之處理<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">受託人於委託辦理期間屆滿有意繼續經營者，應於委託辦理期間屆滿一年前提出辦學績效、財務報告、學校評鑑報告、後續經營計畫等，向各該主管機關申請續約。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">受託人於委託辦理期間屆滿依前條規定申請續約未獲同意、無意願續約，或經依第二十七條、第二十八條第二項規定終止契約者，由各該主管機關接續辦理，並指派適當人員代理校長處理校務，代理至新任校長遴選接任為止；代理校長之指派，不適用公立學校校長遴選之相關規定。<\/div>\n<div class=\"doc-plain\">前項情形，除委託契約另有訂定者外，受託人應將受託學校之各類財產、經營權、學生學籍資料、校務檔案等迅速移交各該主管機關。<\/div>\n<div class=\"doc-plain\">前二項接續辦理之相關事項，由各該主管機關訂定法規及自治法規辦理之。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">有下列各款情事之一者，各該主管機關應提經審議會決議後，終止委託契約：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">受託人或受託學校從事營利或違法行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">受託人或受託學校發生財務困難，致影響學校正常運作及損及學生權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">受託學校發生其他足以嚴重影響學校經營及學生權益之情事。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">受託學校依第二十三條規定，經複評未通過者，經各該主管機關再限期改善，屆期仍未改善。<\/span><\/div>\n<div class=\"doc-plain\">審議會於作出前項決議前，應召開公聽會，邀請受託學校之教師、學生及家長參與。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">各該主管機關於委託辦理期間屆滿前終止契約者，應於該學年度結束時為之。但有前條各款情事之一者，不在此限。<\/div>\n<div class=\"doc-plain\">受託人因經營不善終止契約、依委託契約所定或行政程序法規定得終止契約者，應於學年度結束六個月前，向各該主管機關申請，提經審議會決議後，由各該主管機關終止委託契約。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">因契約終止或屆滿之受託國民小學或國民中學學生，有轉出需求者，直轄市、縣(市)主管機關應參酌家長意願，協助就近轉入未招滿額學校就學。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">委託辦理期間屆滿，受託人未與各該主管機關續約者，其依第十一條第一項規定隨同移轉至受託學校之教師及職員及依第十六條第二項適用公立學校教師相關法令之編制內教師，除辦理資遣或退休者外，由原學校繼續任用。<\/div>\n<div class=\"doc-plain\">前項以外之教學人員及職員，除辦理資遣或退休者外，應由受託人自行負責處理。<\/div>\n<div class=\"chapter-heading\">第  七  章  罰則<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">受託人或校長違反第二十條第一項規定者，由各該主管機關處新臺幣五萬元以上二十萬元以下罰鍰；其同時違反公職人員利益衝突迴避法者，優先適用該法處罰。<\/div>\n<div class=\"chapter-heading\">第  八  章  附則<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain\">本條例施行前已依原法規規定委託辦理之學校，得依原契約約定辦理至期間屆滿為止；期間屆滿後，應依本條例辦理。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain\">本條例施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain\">本條例自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國103年11月26日總統華總一義字第10300177151 號令制定公布33條；施行日期由行政院定之。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國104年2月14日臺教授國字第 1040009842 號令行政院定自104年1月1日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國107年1月31日總統華總一義字第10700011081 號令修正公布名稱及全文 34 條；並自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4. 中華民國110年12月22日總統華總一義字第 11000114001號令修正公布第4、6條條文。<\/div>"},{"title":"高級中等教育階段非學校型態教育未取得學籍學生受教權益維護辦法","content":"第  1  條\n本辦法依高級中等以下教育階段非學校型態實驗教育實施條例(以下簡稱\n本條例)第十八條規定訂定之。\n第  2  條\n依本條例參與高級中等教育階段非學校型態實驗教育，未入學高級中等學\n校(以下簡稱學校)取得學籍，而依本條例第十八條規定取得學生身分證\n明之學生(以下簡稱實驗教育學生)，享有學校學生依法令所定之各項受\n教權益、福利及優惠措施，並據以平等參與各類競賽。\n第  3  條\n實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請\n，依下列規定，比照學校學生享有受教權益：\n比照高級中等學校辦理學生國外學歷採認辦法之規定，由直轄市、縣(市)主管機關採認其國外學歷。\n比照學生轉銜輔導及服務辦法之規定，享有學校學生之轉銜輔導及服務之權益，其輔導評估相關事宜，由直轄市、縣(市)政府所設諮商輔導中心辦理。\n為身心障礙者，比照身心障礙學生支持服務辦法及身心障礙學生考試服務辦法之規定，享有學校學生之支持服務及考試服務。\n為特殊教育學生者，比照特殊教育法之規定，辦理鑑定、通報及訂定個別化教育計畫，其相關評估事宜由直轄市、縣(市)政府主管機關所設特殊教育學生鑑定及就學輔導會辦理。\n第  4  條\n實驗教育學生得持學生身分證明，依下列規定向各該法規所定學校、權責\n機關提出申請，比照學校學生享有受教權益：\n於高級中等以上學校修習全民國防教育軍事訓練課程，經修習且成績合格，由修習學校審認並載明其課程內容、時數及得折減日數者，比照全民國防教育軍事訓練課程折減常備兵役役期與軍事訓練期間實施辦法規定辦理。\n比照國軍預備學校高中部學生入學相關規定，享有公平入學之機會。\n比照高級中等學校學生學籍管理辦法規定，參與學校辦理之公告招收或學生申請方式，轉入學校就讀；實驗教育學生轉入學校後，學校應考量其修習實驗教育課程之特殊性，依相關規定從寬予以採認抵免學分。必要時，並應依申請給予適切之轉銜協助及輔導。\n第  5  條\n實驗教育學生依高級中等以下學校學生及教保服務機構幼兒團體保險條例\n，享有團體保險相關權益。\n前項條例未施行前，實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請，比照高級中等以下學校辦理學生團體保險辦法規定，參加學生團體保險。\n第  6  條\n實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請\n，比照學校衛生法及學生健康檢查實施辦法之規定，享有學校學生之健康\n指導、缺點矯治、預防接種及健康檢查相關權益。\n第  7  條\n實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請\n，依下列規定，比照私立學校學生享有優惠措施：\n比照軍公教遺族就學費用優待條例，享有就學費用優待。\n比照特殊教育法、身心障礙者權益保障法及身心障礙學生及身心障礙人士子女就學費用減免辦法，享有就學費用減免。\n比照原住民族教育法，享有助學金補助。\n比照社會救助法，享有學雜費減免。\n比照特殊境遇家庭扶助條例，享有學雜費減免。\n比照高級中等教育法、高級中等學校向學生收取費用辦法及高級中等學校經濟弱勢學生就學費用補助辦法，享有就學費用補助。\n比照軍人及其家屬優待條例及現役軍人子女就讀中等以上學校學費減免辦法，享有學費減免。\n比照高級中等以上學校學生就學貸款辦法，享有申請就學貸款相關權益。\n比照蒙藏學生升學優待辦法，享有升學優待。\n比照離島建設條例及離島地區學生保送高級中等以上學校辦法，享有申請保送入學相關權益。\n比照中等以上學校運動成績優良學生升學輔導辦法，享有升學輔導\n相關優惠措施。\n比照身心障礙學生升學輔導辦法，享有升學輔導相關優惠措施。\n比照學生參與觀賞運動競技或表演補助辦法，享有申請參與或觀賞費用補助之權益。\n第  8  條\n實驗教育學生得持學生身分證明，依下列規定向各該法規所定權責機關提\n出申請，比照私立學校學生享有優惠措施：\n比照中等以上學校技藝技能優良學生甄審及保送入學辦法，享有甄審及保送入學。\n比照教育部國民及學前教育署(以下簡稱國教署)補助高級中等學校學生校外職場參觀與校外實習及校內併校外實習有關規定，享有申請補助校外職場參觀、校外實習及校內併校外實習之權益。\n比照全國軍公教員工待遇支給要點所定子女教育補助規定，享有相關子女教育補助之權益。\n比照特種勤務條例及特勤人員及特勤編組人員執行勤務遭受暴力或意外危害致全殘廢或半殘廢及殉職人員子女教養辦法，享有子女教養優惠措施。\n比照警察人員人事條例及警察人員執行勤務遭受暴力或意外危害致全\n殘廢或半殘廢及殉職人員子女教養辦法，享有子女教養優惠措施。\n比照參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升\n學優待辦法，享有保送或推薦升學相關優待。\n第  9  條\n實驗教育學生得持學生身分證明，依下列規定，比照學校學生平等參與各\n類競賽：\n比照高級中等以上學校推動學生參與技藝競賽相關規定，享有平等參與技藝競賽之權益。\n比照全國中等學校運動會舉辦準則，享有平等參與競賽之權益。\n直轄市、縣(市)主管機關應協助實驗教育學生得平等參與前項各款所定\n各類競賽；必要時，得指定學校協助辦理。\n第  10  條\n實驗教育學生為應受常備兵役現役或軍事訓練徵集之役齡男子者，得依兵\n役法相關規定，申請緩徵。\n第  11  條\n依本條例參與高級中等教育階段實驗教育學生，符合本條例第二十條第三項所定實驗教育計畫總期程達一年半以上，且完成至少三年實驗教育或就讀高級中等學校及參與實驗教育時間合計至少三年者，由直轄市、縣(市)主管機關發給完成高級中等教育階段實驗教育證明。\n實驗教育學生符合本條例第三十條第二項規定者，得報考二年制專科學校或大學學士班；其錄取者應於入學註冊前，繳交完成高級中等教育階段實驗教育證明。\n第  12  條\n實驗教育學生得依國教署建置之數位平臺，建立學生學習歷程檔案；其基本資料，由直轄市、縣(市)主管機關建置之。\n第  13  條\n實驗教育學生對影響其受教權益、福利、優惠措施及參與各類競賽之處置如有不服，得依相關處理及救濟規定辦理。\n第  14  條\n除本辦法另有規定外，實驗教育學生享有學校學生依法令所定之各項受教權益、福利及優惠措施，並據以平等參與各類競賽；必要時，由直轄市、縣(市)主管機關協助辦理。\n第  15  條\n本辦法自發布日施行。","history":"中華民國108年7月23日教育部臺教授國部字第 1080077426B 號令訂定發布全文 15 條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本辦法依高級中等以下教育階段非學校型態實驗教育實施條例(以下簡稱本條例)第十八條規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段非學校型態實驗教育，未入學高級中等學校(以下簡稱學校)取得學籍，而依本條例第十八條規定取得學生身分證明之學生(以下簡稱實驗教育學生)，享有學校學生依法令所定之各項受教權益、福利及優惠措施，並據以平等參與各類競賽。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請，依下列規定，比照學校學生享有受教權益：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">比照高級中等學校辦理學生國外學歷採認辦法之規定，由直轄市、縣(市)主管機關採認其國外學歷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">比照學生轉銜輔導及服務辦法之規定，享有學校學生之轉銜輔導及服務之權益，其輔導評估相關事宜，由直轄市、縣(市)政府所設諮商輔導中心辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">為身心障礙者，比照身心障礙學生支持服務辦法及身心障礙學生考試服務辦法之規定，享有學校學生之支持服務及考試服務。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">為特殊教育學生者，比照特殊教育法之規定，辦理鑑定、通報及訂定個別化教育計畫，其相關評估事宜由直轄市、縣(市)政府主管機關所設特殊教育學生鑑定及就學輔導會辦理。<\/span><\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，依下列規定向各該法規所定學校、權責機關提出申請，比照學校學生享有受教權益：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">於高級中等以上學校修習全民國防教育軍事訓練課程，經修習且成績合格，由修習學校審認並載明其課程內容、時數及得折減日數者，比照全民國防教育軍事訓練課程折減常備兵役役期與軍事訓練期間實施辦法規定辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">比照國軍預備學校高中部學生入學相關規定，享有公平入學之機會。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">比照高級中等學校學生學籍管理辦法規定，參與學校辦理之公告招收或學生申請方式，轉入學校就讀；實驗教育學生轉入學校後，學校應考量其修習實驗教育課程之特殊性，依相關規定從寬予以採認抵免學分。必要時，並應依申請給予適切之轉銜協助及輔導。<\/span><\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">實驗教育學生依高級中等以下學校學生及教保服務機構幼兒團體保險條例，享有團體保險相關權益。<\/div>\n<div class=\"doc-plain\">前項條例未施行前，實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請，比照高級中等以下學校辦理學生團體保險辦法規定，參加學生團體保險。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請，比照學校衛生法及學生健康檢查實施辦法之規定，享有學校學生之健康指導、缺點矯治、預防接種及健康檢查相關權益。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，向直轄市、縣(市)主管機關提出申請，依下列規定，比照私立學校學生享有優惠措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">比照軍公教遺族就學費用優待條例，享有就學費用優待。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">比照特殊教育法、身心障礙者權益保障法及身心障礙學生及身心障礙人士子女就學費用減免辦法，享有就學費用減免。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">比照原住民族教育法，享有助學金補助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">比照社會救助法，享有學雜費減免。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">比照特殊境遇家庭扶助條例，享有學雜費減免。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">比照高級中等教育法、高級中等學校向學生收取費用辦法及高級中等學校經濟弱勢學生就學費用補助辦法，享有就學費用補助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">比照軍人及其家屬優待條例及現役軍人子女就讀中等以上學校學費減免辦法，享有學費減免。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">比照高級中等以上學校學生就學貸款辦法，享有申請就學貸款相關權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">比照蒙藏學生升學優待辦法，享有升學優待。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">比照離島建設條例及離島地區學生保送高級中等以上學校辦法，享有申請保送入學相關權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">比照中等以上學校運動成績優良學生升學輔導辦法，享有升學輔導相關優惠措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">比照身心障礙學生升學輔導辦法，享有升學輔導相關優惠措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十三、<\/span><span class=\"doc-copy\">比照學生參與觀賞運動競技或表演補助辦法，享有申請參與或觀賞費用補助之權益。<\/span><\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，依下列規定向各該法規所定權責機關提出申請，比照私立學校學生享有優惠措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">比照中等以上學校技藝技能優良學生甄審及保送入學辦法，享有甄審及保送入學。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">比照教育部國民及學前教育署(以下簡稱國教署)補助高級中等學校學生校外職場參觀與校外實習及校內併校外實習有關規定，享有申請補助校外職場參觀、校外實習及校內併校外實習之權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">比照全國軍公教員工待遇支給要點所定子女教育補助規定，享有相關子女教育補助之權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">比照特種勤務條例及特勤人員及特勤編組人員執行勤務遭受暴力或意外危害致全殘廢或半殘廢及殉職人員子女教養辦法，享有子女教養優惠措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">比照警察人員人事條例及警察人員執行勤務遭受暴力或意外危害致全殘廢或半殘廢及殉職人員子女教養辦法，享有子女教養優惠措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">比照參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升學優待辦法，享有保送或推薦升學相關優待。<\/span><\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得持學生身分證明，依下列規定，比照學校學生平等參與各類競賽：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">比照高級中等以上學校推動學生參與技藝競賽相關規定，享有平等參與技藝競賽之權益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">比照全國中等學校運動會舉辦準則，享有平等參與競賽之權益。<\/span><\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應協助實驗教育學生得平等參與前項各款所定各類競賽；必要時，得指定學校協助辦理。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">實驗教育學生為應受常備兵役現役或軍事訓練徵集之役齡男子者，得依兵役法相關規定，申請緩徵。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段實驗教育學生，符合本條例第二十條第三項所定實驗教育計畫總期程達一年半以上，且完成至少三年實驗教育或就讀高級中等學校及參與實驗教育時間合計至少三年者，由直轄市、縣(市)主管機關發給完成高級中等教育階段實驗教育證明。<\/div>\n<div class=\"doc-plain\">實驗教育學生符合本條例第三十條第二項規定者，得報考二年制專科學校或大學學士班；其錄取者應於入學註冊前，繳交完成高級中等教育階段實驗教育證明。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">實驗教育學生得依國教署建置之數位平臺，建立學生學習歷程檔案；其基本資料，由直轄市、縣(市)主管機關建置之。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">實驗教育學生對影響其受教權益、福利、優惠措施及參與各類競賽之處置如有不服，得依相關處理及救濟規定辦理。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">除本辦法另有規定外，實驗教育學生享有學校學生依法令所定之各項受教權益、福利及優惠措施，並據以平等參與各類競賽；必要時，由直轄市、縣(市)主管機關協助辦理。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">中華民國108年7月23日教育部臺教授國部字第 1080077426B 號令訂定發布全文 15 條，並自發布日施行。<\/div>"},{"title":"新北市高級中等以下教育階段非學校型態實驗教育補充規定","content":"本規定依高級中等以下教育階段非學校型態實驗教育實施條例(以下簡稱本條例)第二十八條第一項規定訂定。\n新北市政府(以下簡稱本府)應設新北市(以下簡稱本市)非學校型態實驗教育審議會(以下簡稱本會)審議本市實驗教育之申請許可、變更、續辦及其他實驗教育相關事項。\n本會置委員九人至二十一人，除本府教育局(以下簡稱本局)副局長或主任秘書為當然委員並擔任召集人外，其餘委員由本府就下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總數五分之二；任一性別委員不得少於委員總數總額三分之一：\n本局代表。\n具有會計、財務金融、法律或教育專業之專家、學者。\n校長及教師組織代表。\n具有實驗教育經驗之校長或教學人員。\n實驗教育家長代表、本人或子女曾接受實驗教育者。\n實驗教育相關團體代表。\n本會委員任期二年，其續聘以二次為限；續聘之委員不得超過委員總數之三分之二。委員於任期出缺，應予補聘(派)兼之；其任期至原任期屆滿之日止。\n實驗教育計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。\n本會主席，由委員互推產生。\n本會委員，均為無給職。但得依規定支給相關費用。\n本局受理申請實驗教育期間如下：\n每年四月一日至四月三十日。\n每年十月一日至十月三十一日。\n本局應於受理申請辦理實驗教育計畫後，得委由本市相關學校就申請\n案件進行書面審查，並由該校校長擔任召集人召開相關會議，其作業\n流程如下：\n審查申請書表內容及附件。\n申請書表內容及附件有得補正事項時，應通知申請人於十五天內補正，屆期未補正者，不予受理。\n承辦學校完成申請案件書面審查後，應於每年五月二十日、十一月二十日前彙整申請案件資料，報請本會進行審議。\n經本會核准辦理本條例第四條第一項第二款之團體實驗教育之實驗教育團體，得於每學期開學二星期內，在轉入、轉出學生數各不超過原核准名單人數之三分之一，且學生總人數不超過三十人的前提下，以調整團體實驗教育成員之方式，提交學生名冊至學生所設學籍學校(以下簡稱設籍學校)，由設籍學校報本局備查。經本會核准辦理本條例第四條第一項第三款之機構實驗教育之非營利法人設新立之機構(以下簡稱非營利機構)，於每學期開學前二星期內，應提報學生名冊至設籍學校，由設籍學校報本局備查。\n學期中學生因轉出、轉入或停止實驗教育，實驗教育團體或非營利機構應將異動名冊提交至設籍學校，由設籍學校報本局備查。\n設籍學校應視實驗教育學生及家長之實際需要，協助辦理下列事項：\n提供學校親職教育課程或學校圖書館資源。\n協助學生購買學校選用之教科書。\n提供家長教材教法諮詢，並適時給予輔導。\n通知實驗教育之學生得參與學校定期評量及其他學習評量。但評量成績不列入畢業成績獎項評比。\n提供學生施打疫苗及相關檢查之訊息。\n依規定收取平安保險費及依實驗教育學生之實際需要代收或代辦費。\n學生得向學校申請使用與實驗教育教學相關之設施設備；設施設備之申請程序及使用，依學校相關規定辦理，其依規定應收費者，學校得減免之。\n提供家長相關升學輔導資訊。\n辦理實驗教育者，應依本條例第二十條所訂期限內，將報告書報本局備查或核定。\n本局依許可之實驗教育計畫辦理實驗教育個人、團體及機構之訪視，\n訪視項目如下：\n教學場地。\n課程教學。\n學習評量。\n學生學習表現。\n團體或機構實驗教育者之場地、行政組織、財務規劃及收(退)費情形。\n其他相關事項。\n本規定所需書表格式，由本局定之。","history":"1.中華民國107年8月21日新北市政府新北府教國字第 1071517776 號令修正發布全文 9  點；並自即日生效。\n2.民國 110 年 10月 15 日 修正。","contentHtml":"<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">本規定依高級中等以下教育階段非學校型態實驗教育實施條例(以下簡稱本條例)第二十八條第一項規定訂定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">新北市政府(以下簡稱本府)應設新北市(以下簡稱本市)非學校型態實驗教育審議會(以下簡稱本會)審議本市實驗教育之申請許可、變更、續辦及其他實驗教育相關事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">本會置委員九人至二十一人，除本府教育局(以下簡稱本局)副局長或主任秘書為當然委員並擔任召集人外，其餘委員由本府就下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總數五分之二；任一性別委員不得少於委員總數總額三分之一：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">本局代表。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">具有會計、財務金融、法律或教育專業之專家、學者。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">校長及教師組織代表。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">具有實驗教育經驗之校長或教學人員。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">實驗教育家長代表、本人或子女曾接受實驗教育者。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">實驗教育相關團體代表。<\/span><\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">本會委員任期二年，其續聘以二次為限；續聘之委員不得超過委員總數之三分之二。委員於任期出缺，應予補聘(派)兼之；其任期至原任期屆滿之日止。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">實驗教育計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">本會主席，由委員互推產生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">本會委員，均為無給職。但得依規定支給相關費用。<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">本局受理申請實驗教育期間如下：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">每年四月一日至四月三十日。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">每年十月一日至十月三十一日。<\/span><\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">本局應於受理申請辦理實驗教育計畫後，得委由本市相關學校就申請案件進行書面審查，並由該校校長擔任召集人召開相關會議，其作業流程如下：<\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">審查申請書表內容及附件。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">申請書表內容及附件有得補正事項時，應通知申請人於十五天內補正，屆期未補正者，不予受理。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">承辦學校完成申請案件書面審查後，應於每年五月二十日、十一月二十日前彙整申請案件資料，報請本會進行審議。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">經本會核准辦理本條例第四條第一項第二款之團體實驗教育之實驗教育團體，得於每學期開學二星期內，在轉入、轉出學生數各不超過原核准名單人數之三分之一，且學生總人數不超過三十人的前提下，以調整團體實驗教育成員之方式，提交學生名冊至學生所設學籍學校(以下簡稱設籍學校)，由設籍學校報本局備查。經本會核准辦理本條例第四條第一項第三款之機構實驗教育之非營利法人設新立之機構(以下簡稱非營利機構)，於每學期開學前二星期內，應提報學生名冊至設籍學校，由設籍學校報本局備查。<\/span><\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.8em\">學期中學生因轉出、轉入或停止實驗教育，實驗教育團體或非營利機構應將異動名冊提交至設籍學校，由設籍學校報本局備查。<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">設籍學校應視實驗教育學生及家長之實際需要，協助辦理下列事項：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">提供學校親職教育課程或學校圖書館資源。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">協助學生購買學校選用之教科書。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">提供家長教材教法諮詢，並適時給予輔導。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">通知實驗教育之學生得參與學校定期評量及其他學習評量。但評量成績不列入畢業成績獎項評比。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">提供學生施打疫苗及相關檢查之訊息。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">依規定收取平安保險費及依實驗教育學生之實際需要代收或代辦費。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（七）<\/span><span class=\"doc-copy\">學生得向學校申請使用與實驗教育教學相關之設施設備；設施設備之申請程序及使用，依學校相關規定辦理，其依規定應收費者，學校得減免之。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（八）<\/span><span class=\"doc-copy\">提供家長相關升學輔導資訊。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">辦理實驗教育者，應依本條例第二十條所訂期限內，將報告書報本局備查或核定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">本局依許可之實驗教育計畫辦理實驗教育個人、團體及機構之訪視，訪視項目如下：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">教學場地。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">課程教學。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">學習評量。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">學生學習表現。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">團體或機構實驗教育者之場地、行政組織、財務規劃及收(退)費情形。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">其他相關事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">本規定所需書表格式，由本局定之。<\/span><\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國107年8月21日新北市政府新北府教國字第 1071517776 號令修正發布全文 9  點；並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.民國 110 年 10月 15 日 修正。<\/div>"},{"title":"新北市立國民中小學委託民間辦理辦法","content":"第  1  條\n新北市政府(以下簡稱本府)為鼓勵私人興學，善用教育資源，委託民間辦理新北市立國民中、小學(以下簡稱學校)教育事務，依教育基本法第七條第二項及國民教育法第四條第三項規定，訂定本辦法。\n第  2  條\n本辦法所稱委託，係指本府提供學校之土地、校舍及教學設備，於一定期間內供教育或社會福利事務之財團法人、學術研究機構(以下簡稱受託人)，辦理國民教育者。\n私立中、小學不得為前項之受託人。\n第一項所稱一定期間，於小學為六年至十年；於中學為三年至六年。\n第  3  條\n本府委託民間辦理之學校(以下簡稱委辦學校)，應以已無學生就讀者為限。\n第  4  條\n本府應於每年六月三十日前，就合於前條規定之委辦學校，公告委託之事項、方式、相關權利義務、資格及決定之程序等；申請者應於每年十月三十一日前，依公告規定提出申請，由本府教育審議委員會於每年十二月三十一日前完成評選。\n前項評選結果，應報本府核定，並由本府與入選之申請者簽訂委託契約。\n第一項申請程序及表件，由本府另定之。\n第  5  條\n委辦學校應於原學校名稱之前，加記委託之字樣。\n第  6  條\n受託人辦理之委辦學校，於第二條第三項所定期間內，同一學習階段以一所為限。\n前項所稱同一學習階段，分別指國民小學或國民中學階段。\n第  7  條\n委辦學校之課程，應依教育部頒布之國民中、小學課程綱要實施。但得依辦學理念，彈性調整課程、教材、教學方法及評量方式。\n第  8  條\n委辦學校每班學生人數，不得逾教育部所定同級公立學校標準。\n第  9  條\n委辦學校之招生，以設籍新北市者為限。但經本府專案核定者，不在此限。\n委辦學校之申請入學學生逾招生人數，應優先招收原學區學生，並以設籍先後或抽籤決定入學之順序。\n第  10  條\n委辦學校之校長，不得為受託人之代表人或負責人及其配偶、直系血親，且應具備教育人員任用條例規定之資格。\n第  11  條\n委辦學校應聘任合格教師，其員額不得低於同級公立學校之編制標準。\n第  12  條\n委辦學校之總務、會計及人事職務，不得由受託人之代表人、負責人或校長之配偶及其三親等以內之血親、姻親擔任。\n第  13  條\n委辦學校之設備，不得低於同級公立學校之設備標準。\n第  14  條\n本府因受託人違反委託契約、本辦法或相關法規規定而終止委託契約時，其暫時接管校務之受託人，不受第六條之限制。\n第  15  條\n本府對於委辦學校原學區學生不願就讀者，應依家長意願，協助轉讀鄰近學校，不受原學區之限制。\n第  16  條\n本府提供委辦學校之土地、校舍及教學設備予受託人辦理國民教育者，比照公有財產出租相關規定收取租金。\n第  17  條\n受託人應於委託期限屆滿日二年前，檢附經營成效、最近二年以上之校務評鑑報告及後續學校經營計畫書等，向本府申請續約，經本府審核同意後辦理之。\n第  18  條\n委辦學校應於每一學年度，接受本府輔導與評鑑，其方式、期程及內容等事項，由本府另定之。\n第  19  條\n本辦法自發布日施行。","history":"101年9月5日北府法規字第1012380923 號令訂定發布全文19條；並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">新北市政府(以下簡稱本府)為鼓勵私人興學，善用教育資源，委託民間辦理新北市立國民中、小學(以下簡稱學校)教育事務，依教育基本法第七條第二項及國民教育法第四條第三項規定，訂定本辦法。　<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本辦法所稱委託，係指本府提供學校之土地、校舍及教學設備，於一定期間內供教育或社會福利事務之財團法人、學術研究機構(以下簡稱受託人)，辦理國民教育者。<\/div>\n<div class=\"doc-plain\">私立中、小學不得為前項之受託人。<\/div>\n<div class=\"doc-plain\">第一項所稱一定期間，於小學為六年至十年；於中學為三年至六年。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本府委託民間辦理之學校(以下簡稱委辦學校)，應以已無學生就讀者為限。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">本府應於每年六月三十日前，就合於前條規定之委辦學校，公告委託之事項、方式、相關權利義務、資格及決定之程序等；申請者應於每年十月三十一日前，依公告規定提出申請，由本府教育審議委員會於每年十二月三十一日前完成評選。<\/div>\n<div class=\"doc-plain\">前項評選結果，應報本府核定，並由本府與入選之申請者簽訂委託契約。<\/div>\n<div class=\"doc-plain\">第一項申請程序及表件，由本府另定之。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">委辦學校應於原學校名稱之前，加記委託之字樣。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">受託人辦理之委辦學校，於第二條第三項所定期間內，同一學習階段以一所為限。<\/div>\n<div class=\"doc-plain\">前項所稱同一學習階段，分別指國民小學或國民中學階段。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">委辦學校之課程，應依教育部頒布之國民中、小學課程綱要實施。但得依辦學理念，彈性調整課程、教材、教學方法及評量方式。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">委辦學校每班學生人數，不得逾教育部所定同級公立學校標準。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">委辦學校之招生，以設籍新北市者為限。但經本府專案核定者，不在此限。<\/div>\n<div class=\"doc-plain\">委辦學校之申請入學學生逾招生人數，應優先招收原學區學生，並以設籍先後或抽籤決定入學之順序。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">委辦學校之校長，不得為受託人之代表人或負責人及其配偶、直系血親，且應具備教育人員任用條例規定之資格。　　<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">委辦學校應聘任合格教師，其員額不得低於同級公立學校之編制標準。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">委辦學校之總務、會計及人事職務，不得由受託人之代表人、負責人或校長之配偶及其三親等以內之血親、姻親擔任。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">委辦學校之設備，不得低於同級公立學校之設備標準。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">本府因受託人違反委託契約、本辦法或相關法規規定而終止委託契約時，其暫時接管校務之受託人，不受第六條之限制。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">本府對於委辦學校原學區學生不願就讀者，應依家長意願，協助轉讀鄰近學校，不受原學區之限制。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">本府提供委辦學校之土地、校舍及教學設備予受託人辦理國民教育者，比照公有財產出租相關規定收取租金。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">受託人應於委託期限屆滿日二年前，檢附經營成效、最近二年以上之校務評鑑報告及後續學校經營計畫書等，向本府申請續約，經本府審核同意後辦理之。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">委辦學校應於每一學年度，接受本府輔導與評鑑，其方式、期程及內容等事項，由本府另定之。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">101年9月5日北府法規字第1012380923 號令訂定發布全文19條；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>"},{"title":"新北市政府所屬公立學校辦理學校型態實驗教育辦法","content":"第  1  條\n本辦法依學校型態實驗教育實施條例(以下簡稱本條例)第二十五條第二項規定訂定之。\n第  2  條\n本辦法之執行機關為新北市政府教育局(以下簡稱本局)。\n第  3  條\n新北市政府所屬公立高級中等以下學校(以下簡稱學校)，得由本局指定或由學校申請，辦理學校型態實驗教育(以下簡稱實驗教育)。\n前項實驗教育，指以學校為範圍，依據特定教育理念，就行政運作、組織型態、設備設施、課程教學、學生入學、學習成就評量、學生事務及輔導等事項，進行整合性實驗之教育。\n第  4  條\n具備下列各款條件之一之學校，得由本局指定辦理實驗教育：\n一、經本局評鑑辦學績效良好。\n二、因應整體教育創新、學校地緣位置、教育資源分布或小型學校轉型發展需要。\n經本局評鑑辦學績效良好之學校，得經校務會議通過，向本局申請辦理實驗教育。\n第  5  條\n原住民重點學校以外學校辦理實驗教育之總數，不得逾所屬同一教育階段總校數百分之五，不足一校者，以一校採計。但情況特殊，其實驗教育計畫於學年度開始六個月前，逐案報本局轉教育部審查核定者，不得逾同一教育階段總校數百分之十五。\n辦理實驗教育學校屬國民中小學及完全中學者，以其最高教育階段採計。\n第  6  條\n本局為辦理學校實驗教育之審議及監督等相關事項，應依本條例第五條規定設置學校型態實驗教育審議會(以下簡稱審議會)。\n第  7  條\n學校辦理實驗教育應以校長為實驗教育計畫主持人（以下簡稱計畫主持人）；必要時，得邀請學術機關（構）、團體之負責人或學者專家協同主持或提供諮詢。\n第  8  條\n學校辦理實驗教育應由計畫主持人擬具實驗教育計畫，於預定辦理實驗教育之該學年度開始一年前，向本局提出申請，經審議會審議通過及本局許可後，始得辦理。\n前項實驗教育計畫，應載明下列事項：\n一、學校名稱。\n二、實驗教育名稱。\n三、學校所在地。\n四、教育理念及計畫特色。\n五、學生權益之保障。\n六、課程及教學規劃。\n七、行政運作、組織型態。\n八、設備設施。\n九、學生入學、學習成就評量、學生事務及輔導之方式。\n十、經費需求、來源及收費基準。\n十一、預計招收學生人數。\n十二、實驗期程及步驟。\n十三、自我評鑑之方式。\n十四、計畫主持人及參與人員背景資料。\n十五、其他經本局認定應列入實驗教育計畫之相關項目。\n前項實驗教育計畫期程，為三年以上十二年以下。但經本局許可續辦者，得予延長，每次延長期限為三年以上十二年以下。\n第  9  條\n學校辦理實驗教育應依本條例第二十三條第一項所訂事項，擬訂實驗規範，於該規範之範圍內，應載明不適用本條例第二十三條第四項所定法規之相關規定，並報本局核轉教育部核定。但屬第五條第一項但書情形者應併實驗教育計畫報送。\n第  10  條\n學校辦理實驗教育得依相關法規規定，以契約方式進用編制外之教職員；本局得依學校之需要，提供相關協助。\n第  11  條\n實驗教育計畫有變更之必要時，應由計畫主持人於預定辦理實驗教育之該學年度開始六個月前，向本局提出申請，經審議會審議通過及本\n局許可後，始得辦理。\n第  12  條\n實驗教育計畫結束六個月前，計畫主持人應提出成果報告書，報本局\n送審議會審議。\n第  13  條\n計畫主持人依本條例第十一條第一項規定提出續辦之申請，應依本條例第十一條第二項及第十七條第一項規定，檢具實驗教育計畫成果報告書評鑑結果及續辦之實驗教育計畫，作為本局是否許可續辦之參考。\n前項續辦之申請、審議及許可程序，準用第八條及第九條之規定。\n第  14  條\n學校辦理實驗教育有下列情事之一者，經審議會決議同意後，本局得廢止其原許可或指定，並命學校於次一學年度起停辦實驗教育計畫：\n一、違反本條例。\n二、違反實驗教育計畫。\n三、實驗教育評鑑結果為待改善或不通過。\n四、影響學生權益之情事。\n經審議會決議不同意續辦者，學校應於次一學年度起，停辦實驗教育計畫。\n實驗教育計畫經停辦或不續辦後，學校應恢復原有辦學型態。\n第  15  條\n實驗教育計畫經停辦或不續辦時，應依學生意願留校或輔導轉學；必要時，得由本局分發學生至其他學校。\n第  16  條\n實驗教育計畫經停辦或不續辦時，學校對於為辦理實驗教育進用之編制外職員及其他適用勞動基準法之人員終止契約者，應依勞動法規等相關規定辦理；其對於為辦理實驗教育進用之編制外教師終止契約者，應依勞動法規等相關規定計算之標準數額，給予補償。\n第  17  條\n學校辦理實驗教育經本局評鑑成績為優良者，應予獎勵；實驗成果有推廣價值者，本局應定期舉行公開發表會、學術研討會或教學觀摩會，以分享實驗經驗。\n第  18  條\n本辦法自發布日施行。","history":"1.104年12月30日新北府法規字第 1042467056 號令訂定發布全文 17 條；並自發布日施行。\n2.108年7月24日新北市政府新北府法規字第1081333795號令修正 發布全文18條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本辦法依學校型態實驗教育實施條例(以下簡稱本條例)第二十五條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本辦法之執行機關為新北市政府教育局(以下簡稱本局)。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">新北市政府所屬公立高級中等以下學校(以下簡稱學校)，得由本局指定或由學校申請，辦理學校型態實驗教育(以下簡稱實驗教育)。<\/div>\n<div class=\"doc-plain\">前項實驗教育，指以學校為範圍，依據特定教育理念，就行政運作、組織型態、設備設施、課程教學、學生入學、學習成就評量、學生事務及輔導等事項，進行整合性實驗之教育。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">具備下列各款條件之一之學校，得由本局指定辦理實驗教育：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">經本局評鑑辦學績效良好。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">因應整體教育創新、學校地緣位置、教育資源分布或小型學校轉型發展需要。<\/span><\/div>\n<div class=\"doc-plain\">經本局評鑑辦學績效良好之學校，得經校務會議通過，向本局申請辦理實驗教育。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">原住民重點學校以外學校辦理實驗教育之總數，不得逾所屬同一教育階段總校數百分之五，不足一校者，以一校採計。但情況特殊，其實驗教育計畫於學年度開始六個月前，逐案報本局轉教育部審查核定者，不得逾同一教育階段總校數百分之十五。<\/div>\n<div class=\"doc-plain\">辦理實驗教育學校屬國民中小學及完全中學者，以其最高教育階段採計。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">本局為辦理學校實驗教育之審議及監督等相關事項，應依本條例第五條規定設置學校型態實驗教育審議會(以下簡稱審議會)。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育應以校長為實驗教育計畫主持人（以下簡稱計畫主持人）；必要時，得邀請學術機關（構）、團體之負責人或學者專家協同主持或提供諮詢。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育應由計畫主持人擬具實驗教育計畫，於預定辦理實驗教育之該學年度開始一年前，向本局提出申請，經審議會審議通過及本局許可後，始得辦理。<\/div>\n<div class=\"doc-plain\">前項實驗教育計畫，應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗教育名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學校所在地。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">教育理念及計畫特色。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">學生權益之保障。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">課程及教學規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">行政運作、組織型態。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">設備設施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">學生入學、學習成就評量、學生事務及輔導之方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">經費需求、來源及收費基準。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">預計招收學生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">實驗期程及步驟。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十三、<\/span><span class=\"doc-copy\">自我評鑑之方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十四、<\/span><span class=\"doc-copy\">計畫主持人及參與人員背景資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十五、<\/span><span class=\"doc-copy\">其他經本局認定應列入實驗教育計畫之相關項目。<\/span><\/div>\n<div class=\"doc-plain\">前項實驗教育計畫期程，為三年以上十二年以下。但經本局許可續辦者，得予延長，每次延長期限為三年以上十二年以下。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育應依本條例第二十三條第一項所訂事項，擬訂實驗規範，於該規範之範圍內，應載明不適用本條例第二十三條第四項所定法規之相關規定，並報本局核轉教育部核定。但屬第五條第一項但書情形者應併實驗教育計畫報送。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育得依相關法規規定，以契約方式進用編制外之教職員；本局得依學校之需要，提供相關協助。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">實驗教育計畫有變更之必要時，應由計畫主持人於預定辦理實驗教育之該學年度開始六個月前，向本局提出申請，經審議會審議通過及本<\/div>\n<div class=\"doc-plain\">局許可後，始得辦理。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">實驗教育計畫結束六個月前，計畫主持人應提出成果報告書，報本局<\/div>\n<div class=\"doc-plain\">送審議會審議。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">計畫主持人依本條例第十一條第一項規定提出續辦之申請，應依本條例第十一條第二項及第十七條第一項規定，檢具實驗教育計畫成果報告書評鑑結果及續辦之實驗教育計畫，作為本局是否許可續辦之參考。<\/div>\n<div class=\"doc-plain\">前項續辦之申請、審議及許可程序，準用第八條及第九條之規定。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育有下列情事之一者，經審議會決議同意後，本局得廢止其原許可或指定，並命學校於次一學年度起停辦實驗教育計畫：　　<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">違反本條例。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">違反實驗教育計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">實驗教育評鑑結果為待改善或不通過。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">影響學生權益之情事。<\/span><\/div>\n<div class=\"doc-plain\">經審議會決議不同意續辦者，學校應於次一學年度起，停辦實驗教育計畫。<\/div>\n<div class=\"doc-plain\">實驗教育計畫經停辦或不續辦後，學校應恢復原有辦學型態。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">實驗教育計畫經停辦或不續辦時，應依學生意願留校或輔導轉學；必要時，得由本局分發學生至其他學校。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">實驗教育計畫經停辦或不續辦時，學校對於為辦理實驗教育進用之編制外職員及其他適用勞動基準法之人員終止契約者，應依勞動法規等相關規定辦理；其對於為辦理實驗教育進用之編制外教師終止契約者，應依勞動法規等相關規定計算之標準數額，給予補償。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育經本局評鑑成績為優良者，應予獎勵；實驗成果有推廣價值者，本局應定期舉行公開發表會、學術研討會或教學觀摩會，以分享實驗經驗。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.104年12月30日新北府法規字第 1042467056 號令訂定發布全文 17 條；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.108年7月24日新北市政府新北府法規字第1081333795號令修正 發布全文18條，並自發布日施行。<\/div>"},{"title":"學校型態實驗教育評鑑辦法","content":"第 1 條\n本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第十七條第二項規定訂定之。\n第 2 條\n依本辦法所辦理之評鑑，應具有協調溝通之精神，以引導、協助及促進實驗教育學校落實特定教育理念為目的。\n第 3 條\n各該實驗教育學校主管機關（以下簡稱各該主管機關）應於學校型態實驗教育計畫（以下簡稱實驗教育計畫）期間辦理評鑑；其辦理期程如下：\n一、高級中等以下教育階段：每三年辦理評鑑一次；第一次評鑑應於實驗教育計畫執行滿二年之次日起算六個月內完成。\n二、專科以上教育階段：每四年辦理評鑑一次；第一次評鑑應於實驗教育計畫執行滿二年六個月之次日起算六個月內完成。\n三、實驗教育計畫就評鑑之實施及完成期程另有規定者，依該計畫之規定辦理，不受前二款規定之限制。\n各該主管機關應於評鑑一年前，辦理評鑑協調會，就評鑑之人員、內容、期日、期程及實施方式，與實驗教育計畫主持人（以下簡稱計畫主持人）及實驗教育學校協調並達成共識。\n計畫主持人應於每次各該主管機關通知之評鑑期日六個月前，依評鑑內容，檢附自我評鑑報告書，送各該主管機關辦理評鑑。\n依本條例規定申請設立或改制之實驗教育學校，依本辦法規定辦理評鑑者，免再參加一般高級中等以下學校或大專校院評鑑。\n第 4 條\n評鑑應包括下列內容：\n一、高級中等以下教育階段：\n（一）實驗教育計畫之執行。\n（二）學生權益之維護。\n（三）學生學習之發展。\n（四）財務之透明健全。\n（五）相關法規之遵行。\n（六）其他主管機關會商實驗教育學校後，規定與實驗教育相關之事項。\n二、專科以上教育階段：\n（一）實驗教育計畫之執行。\n（二）教學品質保證機制之規劃及運作。\n（三）學生學習及研究之支持。\n（四）財務之透明健全。\n（五）相關法規之遵行。\n（六）其他主管機關會商實驗教育學校後，規定與實驗教育相關之事項。\n第 5 條\n各該主管機關得自行或委託公、私立大學、經核准立案之學術團體或專業評鑑機構（以下均簡稱評鑑單位）組成評鑑小組辦理評鑑。\n前項所定學術團體或專業評鑑機構，應符合下列條件：\n一、經核准立案之全國性學術團體或經核准立案且設立宗旨與教育事業相關之全國性民間團體或專業機構。\n二、有專業客觀之評鑑實施計畫，包括足夠之評鑑領域專家學者、完善之評鑑委員遴選與培訓制度、足夠之行政人員及健全之組織及會計制度。\n第 6 條\n評鑑小組應就計畫主持人提出之自我評鑑報告書，進行書面審查及實地評鑑。\n前項實地評鑑，由評鑑小組成員前往受評鑑之實驗教育學校，以資料檢閱、參觀設施、觀察與訪談、綜合座談或其他方式為之，並於一個月內作成評鑑報告書，送學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議。\n實地評鑑時，評鑑小組成員應全程親自出席，不得代理。\n第 7 條\n評鑑小組成員五人至七人，由各該主管機關或評鑑單位於實驗教育計畫期間，邀集實驗教育審議會委員及實驗教育學者、專家組成。\n第 8 條\n評鑑小組成員及參與評鑑相關人員，與受評鑑之實驗教育學校間，不得有下列情形之一：\n一、有行政程序法第三十二條第一款至第四款及第三十三條第一項第二款規定之迴避事由。\n二、曾參與該實驗教育計畫之執行。\n三、其他有具體事實經主管機關認定於執行職務有偏頗之虞者。\n評鑑小組成員及參與評鑑相關人員，對評鑑工作所獲取之各項資訊，應負保密義務。\n第 9 條\n實驗教育計畫評鑑結果（以下簡稱評鑑結果），分為優良、良、待改善及不通過四種。\n第 10 條\n評鑑結果為優良者，各該主管機關應予獎勵。\n評鑑結果為優良或良者，各該主管機關得作為審議續辦申請之參考。\n第 11 條\n評鑑結果為待改善者，各該主管機關得對實驗教育學校予以輔導、糾正或限期整頓改善；其經限期整頓改善，屆期未完成者，各該主管機關得視情節輕重，經實驗教育審議會審議通過後，予以減少招生人數、停止招生或令其停辦實驗教育計畫。\n第 12 條\n評鑑結果為不通過者，各該主管機關得經實驗教育審議會審議通過後，令實驗教育學校停辦實驗教育計畫。\n第 13 條\n評鑑結果為良、待改善或不通過者，計畫主持人得於通知送達之次日起十五日內，向各該主管機關申復，並以一次為限。\n各該主管機關受理前項申復後，除原評鑑程序或事實認定有嚴重瑕疵應重新評鑑外，應於二十日內回復處理結果。\n第 14 條\n各該主管機關至遲應於實地評鑑後三個月內，將實驗教育審議會審議之評鑑結果，通知計畫主持人及實驗教育學校；評鑑結果為優良者予以公告，評鑑結果為良、待改善及不通過者，得延至申復獲致結果後公告。\n第 15 條\n計畫主持人得依本條例第十一條第一項規定，於實驗教育計畫結束六個月前，檢具歷次評鑑結果、成果報告書及後續之實驗教育計畫，向各該主管機關申請續辦。\n第 16 條\n計畫主持人不服評鑑結果者，應於不服各該主管機關依該結果所為行政處分依法提起訴願時，一併主張之。\n第 17 條\n本辦法自發布日施行。","history":"1.中華民國一百零四年六月二十三日教育部臺教授國部字第 1040063143B號令訂定發布全文 14 條；並自發布日施行。\n2.中華民國一百零七年十月八日教育部臺教授國部字第 1070107862B號令修正發布全文 17 條；並自發布日施行。","contentHtml":"<div class=\"article-heading\">第 1 條<\/div>\n<div class=\"doc-plain\">本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第十七條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第 2 條<\/div>\n<div class=\"doc-plain\">依本辦法所辦理之評鑑，應具有協調溝通之精神，以引導、協助及促進實驗教育學校落實特定教育理念為目的。<\/div>\n<div class=\"article-heading\">第 3 條<\/div>\n<div class=\"doc-plain\">各該實驗教育學校主管機關（以下簡稱各該主管機關）應於學校型態實驗教育計畫（以下簡稱實驗教育計畫）期間辦理評鑑；其辦理期程如下：<\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高級中等以下教育階段：每三年辦理評鑑一次；第一次評鑑應於實驗教育計畫執行滿二年之次日起算六個月內完成。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">專科以上教育階段：每四年辦理評鑑一次；第一次評鑑應於實驗教育計畫執行滿二年六個月之次日起算六個月內完成。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">實驗教育計畫就評鑑之實施及完成期程另有規定者，依該計畫之規定辦理，不受前二款規定之限制。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">各該主管機關應於評鑑一年前，辦理評鑑協調會，就評鑑之人員、內容、期日、期程及實施方式，與實驗教育計畫主持人（以下簡稱計畫主持人）及實驗教育學校協調並達成共識。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">計畫主持人應於每次各該主管機關通知之評鑑期日六個月前，依評鑑內容，檢附自我評鑑報告書，送各該主管機關辦理評鑑。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">依本條例規定申請設立或改制之實驗教育學校，依本辦法規定辦理評鑑者，免再參加一般高級中等以下學校或大專校院評鑑。<\/div>\n<div class=\"article-heading\">第 4 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑應包括下列內容：<\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高級中等以下教育階段：<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">實驗教育計畫之執行。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">學生權益之維護。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">學生學習之發展。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">財務之透明健全。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">相關法規之遵行。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">其他主管機關會商實驗教育學校後，規定與實驗教育相關之事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">專科以上教育階段：<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">實驗教育計畫之執行。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">教學品質保證機制之規劃及運作。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">學生學習及研究之支持。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">財務之透明健全。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">相關法規之遵行。<\/span><\/div>\n<div class=\"doc-row doc-level-1\" style=\"padding-left:0\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">其他主管機關會商實驗教育學校後，規定與實驗教育相關之事項。<\/span><\/div>\n<div class=\"article-heading\">第 5 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">各該主管機關得自行或委託公、私立大學、經核准立案之學術團體或專業評鑑機構（以下均簡稱評鑑單位）組成評鑑小組辦理評鑑。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項所定學術團體或專業評鑑機構，應符合下列條件：<\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">經核准立案之全國性學術團體或經核准立案且設立宗旨與教育事業相關之全國性民間團體或專業機構。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">有專業客觀之評鑑實施計畫，包括足夠之評鑑領域專家學者、完善之評鑑委員遴選與培訓制度、足夠之行政人員及健全之組織及會計制度。<\/span><\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑小組應就計畫主持人提出之自我評鑑報告書，進行書面審查及實地評鑑。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項實地評鑑，由評鑑小組成員前往受評鑑之實驗教育學校，以資料檢閱、參觀設施、觀察與訪談、綜合座談或其他方式為之，並於一個月內作成評鑑報告書，送學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">實地評鑑時，評鑑小組成員應全程親自出席，不得代理。<\/div>\n<div class=\"article-heading\">第 7 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑小組成員五人至七人，由各該主管機關或評鑑單位於實驗教育計畫期間，邀集實驗教育審議會委員及實驗教育學者、專家組成。<\/div>\n<div class=\"article-heading\">第 8 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑小組成員及參與評鑑相關人員，與受評鑑之實驗教育學校間，不得有下列情形之一：<\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">有行政程序法第三十二條第一款至第四款及第三十三條第一項第二款規定之迴避事由。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">曾參與該實驗教育計畫之執行。<\/span><\/div>\n<div class=\"doc-row doc-level-0\" style=\"padding-left:0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">其他有具體事實經主管機關認定於執行職務有偏頗之虞者。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑小組成員及參與評鑑相關人員，對評鑑工作所獲取之各項資訊，應負保密義務。<\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">實驗教育計畫評鑑結果（以下簡稱評鑑結果），分為優良、良、待改善及不通過四種。<\/div>\n<div class=\"article-heading\">第 10 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑結果為優良者，各該主管機關應予獎勵。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑結果為優良或良者，各該主管機關得作為審議續辦申請之參考。<\/div>\n<div class=\"article-heading\">第 11 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑結果為待改善者，各該主管機關得對實驗教育學校予以輔導、糾正或限期整頓改善；其經限期整頓改善，屆期未完成者，各該主管機關得視情節輕重，經實驗教育審議會審議通過後，予以減少招生人數、停止招生或令其停辦實驗教育計畫。<\/div>\n<div class=\"article-heading\">第 12 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑結果為不通過者，各該主管機關得經實驗教育審議會審議通過後，令實驗教育學校停辦實驗教育計畫。<\/div>\n<div class=\"article-heading\">第 13 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">評鑑結果為良、待改善或不通過者，計畫主持人得於通知送達之次日起十五日內，向各該主管機關申復，並以一次為限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">各該主管機關受理前項申復後，除原評鑑程序或事實認定有嚴重瑕疵應重新評鑑外，應於二十日內回復處理結果。<\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">各該主管機關至遲應於實地評鑑後三個月內，將實驗教育審議會審議之評鑑結果，通知計畫主持人及實驗教育學校；評鑑結果為優良者予以公告，評鑑結果為良、待改善及不通過者，得延至申復獲致結果後公告。<\/div>\n<div class=\"article-heading\">第 15 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">計畫主持人得依本條例第十一條第一項規定，於實驗教育計畫結束六個月前，檢具歷次評鑑結果、成果報告書及後續之實驗教育計畫，向各該主管機關申請續辦。<\/div>\n<div class=\"article-heading\">第 16 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">計畫主持人不服評鑑結果者，應於不服各該主管機關依該結果所為行政處分依法提起訴願時，一併主張之。<\/div>\n<div class=\"article-heading\">第 17 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國一百零四年六月二十三日教育部臺教授國部字第 1040063143B號令訂定發布全文 14 條；並自發布日施行。<\/div>\n<div class=\"history-paragraph\">2.中華民國一百零七年十月八日教育部臺教授國部字第 1070107862B號令修正發布全文 17 條；並自發布日施行。<\/div>"},{"title":"申請辦理實驗教育學校之學校財團法人辦學績優認定標準","content":"第 一 條\n本標準依學校型態實驗教育實施條例（以下簡稱本條例）第四條第二項規定訂定之。\n第 二 條\n學校財團法人（以下簡稱學校法人）申請辦理私立實驗教育學校或將現有私立學校改制為私立實驗教育學校，以辦學績優者為限。\n前項所稱辦學績優之學校法人，指申請前三年內學校法人董事會及監察人組織及財務健全，且運作正常。\n第一項學校法人及其所設學校申請前三年內，不得有下列情形：\n一、學校法人及其所設學校受私立學校法第二十五條、第五十四條、第五十五條或第七十八條規定之處分。\n二、學校經依專科學校法第七條規定改制或停辦，或依私立學校法第七十條規定停辦。\n三、學校經各級主管機關依相關規定進行改善之相關輔導。\n第 三 條\n學校法人符合前條規定者，得依各級主管機關依本條例第二十五條第一項規定訂定之辦法，申請辦理私立實驗教育學校，或將現有私立學校改制為私立實驗教育學校。\n第 四 條\n本標準自發布日施行。","history":"1.中華民國107年12月25日教育部臺教技（四）字第 1070217005B 號令訂定發布全文 ４ 條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第 一 條<\/div>\n<div class=\"doc-plain\">本標準依學校型態實驗教育實施條例（以下簡稱本條例）第四條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第 二 條<\/div>\n<div class=\"doc-plain\">學校財團法人（以下簡稱學校法人）申請辦理私立實驗教育學校或將現有私立學校改制為私立實驗教育學校，以辦學績優者為限。<\/div>\n<div class=\"doc-plain\">前項所稱辦學績優之學校法人，指申請前三年內學校法人董事會及監察人組織及財務健全，且運作正常。<\/div>\n<div class=\"doc-plain\">第一項學校法人及其所設學校申請前三年內，不得有下列情形：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校法人及其所設學校受私立學校法第二十五條、第五十四條、第五十五條或第七十八條規定之處分。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學校經依專科學校法第七條規定改制或停辦，或依私立學校法第七十條規定停辦。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學校經各級主管機關依相關規定進行改善之相關輔導。<\/span><\/div>\n<div class=\"article-heading\">第 三 條<\/div>\n<div class=\"doc-plain\">學校法人符合前條規定者，得依各級主管機關依本條例第二十五條第一項規定訂定之辦法，申請辦理私立實驗教育學校，或將現有私立學校改制為私立實驗教育學校。<\/div>\n<div class=\"article-heading\">第 四 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">本標準自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國107年12月25日教育部臺教技（四）字第 1070217005B 號令訂定發布全文 ４ 條，並自發布日施行。<\/div>"},{"title":"高級中等以下學校型態實驗教育許可辦法","content":"第 一 條\n本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第二十五條第一項規定訂定之。\n第 二 條\n本辦法適用範圍如下：\n一、學校財團法人（以下簡稱學校法人）或其他非營利之私法人申請設立教育部（以下簡稱本部）主管之私立高級中等實驗教育學校（以下簡稱實驗學校）者。\n二、學校法人申請將所設本部主管之私立高級中等學校改制為實驗學校者。\n前項第二款私立高級中等學校附設國民中學部、國民小學部者，各該部應併同該私立高級中等學校改制。\n學校法人依本條例第十四條規定，將私立高級中等以下學校改制為實驗學校者，自改制日起每年級招收之學生人數，依同條第一項第一款第二目，不得超過五十人。但改制前學校學生總人數符合規定者，已入學學生併同實施實驗教育，並繼續就讀至畢業止，不受每年級五十人規定之限制。\n第 三 條\n財團法人私立高級中等學校，應先依私立學校法第八十七條第二項規定，變更為學校法人及所設私立學校後，始得申請設立或改制為實驗學校。\n第 四 條\n學校法人申請設立實驗學校，或將所設私立高級中等學校改制為實驗學校者，應符合依本條例第四條第二項所定標準及本條例第十四條第一項第一款規定。\n第 五 條\n學校法人以外其他非營利之私法人申請設立實驗學校者，應具備下列各款條件：\n一、申請前三年內，法人運作正常，且無重大財務缺失。\n二、符合本條例第十四條第一項第一款規定。\n三、私法人由學校法人改辦者，改辦逾三年。\n第 六 條\n本條例第七條第一項所定學校型態實驗教育計畫（以下簡稱實驗教育計畫\n）主持人（以下簡稱計畫主持人），於學校法人或其他非營利之私法人申\n請設立者，為法人之代表人或法人指定之人；於學校法人申請改制者，為\n校長或由學校法人指定之人。\n第 七 條\n本條例第七條第二項第九款所定實驗規範，應依其實驗教育計畫之特定教育理念，擬訂本條例第三條第一項所定學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務與輔導及社區與家長參與事項，並載明不適用本條例第九條第一項所定法律之條項。\n前項實驗規範載明之學生入學方式，經學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議通過者，準用高級中等教育法第五十六條免納學費相關規定，不受同法第三十五條、第三十六條規定之限制。\n第 八 條\n本部受理申請設立或改制為實驗學校時，免依高級中等以下學校及其分校分部設立變更停辦辦法之規定，提審查小組及私立學校諮詢會審議或提供諮詢。\n前項申請，本部應於受理申請之日起三個月內作成決定；必要時，得延長一次，並以三個月為限。\n經本部許可改制為實驗學校者，其原私立高級中等學校之校地、校舍及設校基金，非依私立學校法之規定，不得變更。\n第 九 條\n申請設立或改制為實驗學校經許可者，三年內未完成籌設及立案或改制，本部得廢止其實驗教育計畫及學校設立或改制之許可。\n第 十 條\n實驗教育計畫有停辦或不續辦之必要時，計畫主持人應於預定停辦或不續辦之該學年度開始六個月前，向本部申請；經送實驗教育審議會審議通過，並由本部核定後，始得辦理。\n前項申請，應擬具計畫書，載明下列事項：\n一、停辦或不續辦之原因。\n二、期程規劃。\n三、停辦期間或不續辦後，學校設施設備、檔案資料之管理維護方式。\n四、教職員工之離退處理措施。\n五、學生之輔導轉學措施。\n六、其他有關停辦或不續辦事務之規劃。\n經許可改制之實驗學校，擬恢復原有辦學型態者，除前項計畫書外，並應擬具恢復原有辦學型態計畫書，載明下列事項：\n一、整體發展方向及特色。\n二、校地面積及校舍相關資料。\n三、教學單位及行政單位之規劃。\n四、擬設科、學程及班級。\n五、擬聘校長及師資之規劃。\n六、圖書、儀器等教學設備之規劃。\n七、學校經費概算、財務規劃、經費來源及其證明文件。\n八、期程規劃。\n九、其他恢復原有辦學型態之相關事項。\n實驗學校經本部依本條例第十九條第一項第五款規定命停辦實驗教育計畫者，應於本部指定期限內，依前二項規定擬具計畫書報本部。\n第  十一  條\n實驗教育計畫經停辦或不續辦時，實驗學校應依學生意願留校或輔導轉學；必要時，得由本部自行或商請直轄市、縣（市）主管機關協助分發學生至其他學校。\n第  十二  條\n本辦法施行前，已依法規辦理全部班級實驗教育之私立高級中等學校，自本辦法施行之日起仍繼續辦理實驗教育者，得依本辦法申請改制為實驗學校，不適用第六條、第七條與第九條及本條例第七條第一項至第三項第一款、第十條、第十六條第一項及第二項規定。\n前項已辦理全部班級實驗教育之學校依原法規規定經本部核准之實驗計畫，視同本辦法所定之實驗教育計畫。\n第  十三  條\n本辦法自發布日施行。","history":"1.中華民國104年08月19日臺教授國部字第1040076510B 號令訂定發布全文 21 點，並自發布日施行。\n2.中華民國108年02月27日教育部臺教授國部字第 1080012926B 號令修\n正發布全文 １３ 條，名稱並修正為「高級中等以下學校型態實驗教育許可辦法」，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第 一 條<\/div>\n<div class=\"doc-plain\">本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第二十五條第一項規定訂定之。<\/div>\n<div class=\"article-heading\">第 二 條<\/div>\n<div class=\"doc-plain\">本辦法適用範圍如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校財團法人（以下簡稱學校法人）或其他非營利之私法人申請設立教育部（以下簡稱本部）主管之私立高級中等實驗教育學校（以下簡稱實驗學校）者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學校法人申請將所設本部主管之私立高級中等學校改制為實驗學校者。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">前項第二款私立高級中等學校附設國民中學部、國民小學部者，各該部應併同該私立高級中等學校改制。<\/div>\n<div class=\"doc-plain doc-continuation\">學校法人依本條例第十四條規定，將私立高級中等以下學校改制為實驗學校者，自改制日起每年級招收之學生人數，依同條第一項第一款第二目，不得超過五十人。但改制前學校學生總人數符合規定者，已入學學生併同實施實驗教育，並繼續就讀至畢業止，不受每年級五十人規定之限制。<\/div>\n<div class=\"article-heading\">第 三 條<\/div>\n<div class=\"doc-plain doc-continuation\">財團法人私立高級中等學校，應先依私立學校法第八十七條第二項規定，變更為學校法人及所設私立學校後，始得申請設立或改制為實驗學校。<\/div>\n<div class=\"article-heading\">第 四 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校法人申請設立實驗學校，或將所設私立高級中等學校改制為實驗學校者，應符合依本條例第四條第二項所定標準及本條例第十四條第一項第一款規定。<\/div>\n<div class=\"article-heading\">第 五 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校法人以外其他非營利之私法人申請設立實驗學校者，應具備下列各款條件：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請前三年內，法人運作正常，且無重大財務缺失。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">符合本條例第十四條第一項第一款規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">私法人由學校法人改辦者，改辦逾三年。<\/span><\/div>\n<div class=\"article-heading\">第 六 條<\/div>\n<div class=\"doc-plain doc-continuation\">本條例第七條第一項所定學校型態實驗教育計畫（以下簡稱實驗教育計畫）主持人（以下簡稱計畫主持人），於學校法人或其他非營利之私法人申請設立者，為法人之代表人或法人指定之人；於學校法人申請改制者，為校長或由學校法人指定之人。<\/div>\n<div class=\"article-heading\">第 七 條<\/div>\n<div class=\"doc-plain doc-continuation\">本條例第七條第二項第九款所定實驗規範，應依其實驗教育計畫之特定教育理念，擬訂本條例第三條第一項所定學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務與輔導及社區與家長參與事項，並載明不適用本條例第九條第一項所定法律之條項。<\/div>\n<div class=\"doc-plain doc-continuation\">前項實驗規範載明之學生入學方式，經學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議通過者，準用高級中等教育法第五十六條免納學費相關規定，不受同法第三十五條、第三十六條規定之限制。<\/div>\n<div class=\"article-heading\">第 八 條<\/div>\n<div class=\"doc-plain doc-continuation\">本部受理申請設立或改制為實驗學校時，免依高級中等以下學校及其分校分部設立變更停辦辦法之規定，提審查小組及私立學校諮詢會審議或提供諮詢。<\/div>\n<div class=\"doc-plain doc-continuation\">前項申請，本部應於受理申請之日起三個月內作成決定；必要時，得延長一次，並以三個月為限。<\/div>\n<div class=\"doc-plain doc-continuation\">經本部許可改制為實驗學校者，其原私立高級中等學校之校地、校舍及設校基金，非依私立學校法之規定，不得變更。<\/div>\n<div class=\"article-heading\">第 九 條<\/div>\n<div class=\"doc-plain doc-continuation\">申請設立或改制為實驗學校經許可者，三年內未完成籌設及立案或改制，本部得廢止其實驗教育計畫及學校設立或改制之許可。<\/div>\n<div class=\"article-heading\">第 十 條<\/div>\n<div class=\"doc-plain doc-continuation\">實驗教育計畫有停辦或不續辦之必要時，計畫主持人應於預定停辦或不續辦之該學年度開始六個月前，向本部申請；經送實驗教育審議會審議通過，並由本部核定後，始得辦理。<\/div>\n<div class=\"doc-plain doc-continuation\">前項申請，應擬具計畫書，載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">停辦或不續辦之原因。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">期程規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">停辦期間或不續辦後，學校設施設備、檔案資料之管理維護方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">教職員工之離退處理措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">學生之輔導轉學措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">其他有關停辦或不續辦事務之規劃。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">經許可改制之實驗學校，擬恢復原有辦學型態者，除前項計畫書外，並應擬具恢復原有辦學型態計畫書，載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">整體發展方向及特色。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">校地面積及校舍相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">教學單位及行政單位之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">擬設科、學程及班級。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">擬聘校長及師資之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">圖書、儀器等教學設備之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">學校經費概算、財務規劃、經費來源及其證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">期程規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">其他恢復原有辦學型態之相關事項。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">實驗學校經本部依本條例第十九條第一項第五款規定命停辦實驗教育計畫者，應於本部指定期限內，依前二項規定擬具計畫書報本部。<\/div>\n<div class=\"article-heading\">第  十一  條<\/div>\n<div class=\"doc-plain doc-continuation\">實驗教育計畫經停辦或不續辦時，實驗學校應依學生意願留校或輔導轉學；必要時，得由本部自行或商請直轄市、縣（市）主管機關協助分發學生至其他學校。<\/div>\n<div class=\"article-heading\">第  十二  條<\/div>\n<div class=\"doc-plain doc-continuation\">本辦法施行前，已依法規辦理全部班級實驗教育之私立高級中等學校，自本辦法施行之日起仍繼續辦理實驗教育者，得依本辦法申請改制為實驗學校，不適用第六條、第七條與第九條及本條例第七條第一項至第三項第一款、第十條、第十六條第一項及第二項規定。<\/div>\n<div class=\"doc-plain doc-continuation\">前項已辦理全部班級實驗教育之學校依原法規規定經本部核准之實驗計畫，視同本辦法所定之實驗教育計畫。<\/div>\n<div class=\"article-heading\">第  十三  條<\/div>\n<div class=\"doc-plain doc-continuation\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國104年08月19日臺教授國部字第1040076510B 號令訂定發布全文 21 點，並自發布日施行。<\/div>\n<div class=\"history-paragraph\">2.中華民國108年02月27日教育部臺教授國部字第 1080012926B 號令修<\/div>\n<div class=\"history-paragraph\">正發布全文 １３ 條，名稱並修正為「高級中等以下學校型態實驗教育許可辦法」，並自發布日施行。<\/div>"},{"title":"國立高級中等以下學校辦理學校型態實驗教育辦法","content":"第 一 條\n本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第二十五條第二項規定訂定之。\n第 二 條\n本辦法適用對象為國立高級中等以下學校（以下簡稱學校）。\n前項學校附設國民中學部、國民小學部者，各該部應併同辦理學校型態實驗教育（以下簡稱實驗教育）。\n學校辦理實驗教育者，自辦理日起每年級招收之學生人數，依本條例第十四條第一項第一款第二目，不得超過五十人。但辦理前學校學生總人數符合規定者，已入學學生併同實施實驗教育，並繼續就讀至畢業止，不受每年級五十人規定之限制。\n第 三 條\n教育部（以下簡稱本部）指定辦理實驗教育之學校，應具備下列各款條件之一：\n一、高級中等學校最近一次校務評鑑之各評鑑項目達八十分以上；其附設有國民中學部、國民小學部者，各該部經本部進行訪視通過者。\n二、國民中學、國民小學經本部進行訪視通過者。\n三、因應整體教育創新或發展政策、學校地緣位置或教育資源分布，有指定必要者。\n學校具備前項第一款或第二款條件，並經校務會議通過者，得向本部申請辦理實驗教育。\n第 四 條\n學校申請或經指定辦理實驗教育者，應以校長為實驗教育計畫主持人（以下簡稱計畫主持人）；必要時，由本部指定自然人、經核准立案之學術團體或設立宗旨與教育事業相關機構之代表人或負責人，擔任計畫主持人。\n第 五 條\n本部得依學校辦理實驗教育之需要，寬籌經費給予必要之協助。\n第 六 條\n學校型態實驗教育計畫（以下簡稱實驗教育計畫）內容有變更之必要時，計畫主持人應於預定變更之該學年度開始六個月前，向本部提出申請，經送學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議通過，由本部核定後，始得辦理。\n第 七 條\n實驗教育計畫有停辦或不續辦之必要時，計畫主持人應於預定停辦或不續辦之該學年度開始六個月前，向本部申請，經送實驗教育審議會審議通過，並由本部核定後，始得辦理。\n前項停辦或不續辦之申請，應擬具計畫書，載明下列事項：\n一、停辦或不續辦之原因。\n二、期程規劃。\n三、停辦期間或不續辦後，學校設施設備、檔案資料之管理維護方式。\n四、教職員工之離退處理措施。\n五、學生之輔導轉學措施。\n六、其他有關停辦或不續辦事務之規劃。\n學校申請停辦或不續辦，除前項計畫書外，並應擬具恢復原有辦學型態計畫書，載明下列事項：\n一、整體發展方向及特色。\n二、校地面積及校舍相關資料。\n三、教學單位及行政單位之規劃。\n四、擬設科、學程及班級。\n五、擬聘校長及師資之規劃。\n六、圖書、儀器等教學設備之規劃。\n七、學校經費概算、財務規劃、經費來源及其證明文件。\n八、期程規劃。\n九、其他恢復原有辦學型態之相關事項。\n第 八 條\n經許可辦理實驗教育之學校違反本條例或實驗教育計畫、經實驗教育評鑑結果為待改善或不通過或有影響學生權益之情事時，本部應採取下列全部或部分措施：\n一、輔導。\n二、糾正。\n三、限期整頓改善。\n四、停止招生或減少招生人數。\n五、停辦實驗教育計畫。\n本部對學校採取前項第四款、第五款之措施或廢止原指定前，應先提經實驗教育審議會審議通過，並對就讀學生採取必要之補救措施。\n學校經本部命停辦實驗教育計畫後，應恢復原有辦學型態，並於本部指定期限內，依前條第二項及第三項規定擬具計畫書報本部。\n第 九 條\n實驗教育計畫經停辦或不續辦者，學校應依學生意願留校或輔導轉學；必要時，得由本部自行或商請直轄市、縣（市）主管機關協助分發學生至其他學校。\n第 十 條\n本辦法自發布日施行。","history":"1.中華民國104年08月19日臺教授國部字第1040076511B 號令訂定發布全文 17 點，並自發布日施行。\n2.中華民國108年02月27日教育部臺教授國部字第 1080013050B 號令修\n正發布全文10條，名稱並修正為「國立高級中等以下學校辦理學校型態實驗教育辦法」，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第 一 條<\/div>\n<div class=\"doc-plain\">本辦法依學校型態實驗教育實施條例（以下簡稱本條例）第二十五條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第 二 條<\/div>\n<div class=\"doc-plain\">本辦法適用對象為國立高級中等以下學校（以下簡稱學校）。<\/div>\n<div class=\"doc-plain\">前項學校附設國民中學部、國民小學部者，各該部應併同辦理學校型態實驗教育（以下簡稱實驗教育）。<\/div>\n<div class=\"doc-plain\">學校辦理實驗教育者，自辦理日起每年級招收之學生人數，依本條例第十四條第一項第一款第二目，不得超過五十人。但辦理前學校學生總人數符合規定者，已入學學生併同實施實驗教育，並繼續就讀至畢業止，不受每年級五十人規定之限制。<\/div>\n<div class=\"article-heading\">第 三 條<\/div>\n<div class=\"doc-plain\">教育部（以下簡稱本部）指定辦理實驗教育之學校，應具備下列各款條件之一：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高級中等學校最近一次校務評鑑之各評鑑項目達八十分以上；其附設有國民中學部、國民小學部者，各該部經本部進行訪視通過者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">國民中學、國民小學經本部進行訪視通過者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">因應整體教育創新或發展政策、學校地緣位置或教育資源分布，有指定必要者。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">學校具備前項第一款或第二款條件，並經校務會議通過者，得向本部申請辦理實驗教育。<\/div>\n<div class=\"article-heading\">第 四 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校申請或經指定辦理實驗教育者，應以校長為實驗教育計畫主持人（以下簡稱計畫主持人）；必要時，由本部指定自然人、經核准立案之學術團體或設立宗旨與教育事業相關機構之代表人或負責人，擔任計畫主持人。<\/div>\n<div class=\"article-heading\">第 五 條<\/div>\n<div class=\"doc-plain doc-continuation\">本部得依學校辦理實驗教育之需要，寬籌經費給予必要之協助。<\/div>\n<div class=\"article-heading\">第 六 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校型態實驗教育計畫（以下簡稱實驗教育計畫）內容有變更之必要時，計畫主持人應於預定變更之該學年度開始六個月前，向本部提出申請，經送學校型態實驗教育審議會（以下簡稱實驗教育審議會）審議通過，由本部核定後，始得辦理。<\/div>\n<div class=\"article-heading\">第 七 條<\/div>\n<div class=\"doc-plain doc-continuation\">實驗教育計畫有停辦或不續辦之必要時，計畫主持人應於預定停辦或不續辦之該學年度開始六個月前，向本部申請，經送實驗教育審議會審議通過，並由本部核定後，始得辦理。<\/div>\n<div class=\"doc-plain doc-continuation\">前項停辦或不續辦之申請，應擬具計畫書，載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">停辦或不續辦之原因。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">期程規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">停辦期間或不續辦後，學校設施設備、檔案資料之管理維護方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">教職員工之離退處理措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">學生之輔導轉學措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">其他有關停辦或不續辦事務之規劃。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">學校申請停辦或不續辦，除前項計畫書外，並應擬具恢復原有辦學型態計畫書，載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">整體發展方向及特色。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">校地面積及校舍相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">教學單位及行政單位之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">擬設科、學程及班級。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">擬聘校長及師資之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">圖書、儀器等教學設備之規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">學校經費概算、財務規劃、經費來源及其證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">期程規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">其他恢復原有辦學型態之相關事項。<\/span><\/div>\n<div class=\"article-heading\">第 八 條<\/div>\n<div class=\"doc-plain doc-continuation\">經許可辦理實驗教育之學校違反本條例或實驗教育計畫、經實驗教育評鑑結果為待改善或不通過或有影響學生權益之情事時，本部應採取下列全部或部分措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">輔導。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">糾正。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">限期整頓改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">停止招生或減少招生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">停辦實驗教育計畫。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">本部對學校採取前項第四款、第五款之措施或廢止原指定前，應先提經實驗教育審議會審議通過，並對就讀學生採取必要之補救措施。<\/div>\n<div class=\"doc-plain doc-continuation\">學校經本部命停辦實驗教育計畫後，應恢復原有辦學型態，並於本部指定期限內，依前條第二項及第三項規定擬具計畫書報本部。<\/div>\n<div class=\"article-heading\">第 九 條<\/div>\n<div class=\"doc-plain doc-continuation\">實驗教育計畫經停辦或不續辦者，學校應依學生意願留校或輔導轉學；必要時，得由本部自行或商請直轄市、縣（市）主管機關協助分發學生至其他學校。<\/div>\n<div class=\"article-heading\">第 十 條<\/div>\n<div class=\"doc-plain doc-continuation\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國104年08月19日臺教授國部字第1040076511B 號令訂定發布全文 17 點，並自發布日施行。<\/div>\n<div class=\"history-paragraph\">2.中華民國108年02月27日教育部臺教授國部字第 1080013050B 號令修<\/div>\n<div class=\"history-paragraph\">正發布全文10條，名稱並修正為「國立高級中等以下學校辦理學校型態實驗教育辦法」，並自發布日施行。<\/div>"},{"title":"公立高級中等以下學校辦理部分班級原住民族實驗教育辦法","content":"第 一 條\n本辦法依原住民族教育法第二十一條第二項規定訂定之。\n第 二 條\n公立高級中等以下學校（以下簡稱學校）辦理部分班級原住民族實驗教育（以下簡稱原民實驗教育），應適用本辦法之規定。\n第 三 條\n學校辦理原民實驗教育，應依原住民族知識特性及內涵，發展原住民族課程及評量。\n前項原住民族知識特性及內涵，得包括原住民族語言、歷史、文學、歲時祭儀、社會組織、傳統習慣、工藝、樂舞、生活技能、土地與生態智慧、族群權利及其他文化內涵。\n第 四 條\n各該教育主管機關得就整體教育創新、學校地緣位置或教育資源分布情形，指定所屬學校辦理原民實驗教育。\n除前項指定外，學校經課程發展委員會及校務會議通過後，得向各該教育\n主管機關申請辦理原民實驗教育。\n第 五 條\n學校辦理原民實驗教育，應遵守下列事項：\n一、實驗前徵得學生本人及其法定代理人之同意。但學生已成年者，免經法定代理人同意。\n二、學生本人及其法定代理人申請退出實驗時，不得以任何理由拒絕；學生已成年者，得單獨提出申請。\n三、學校應主動提供學生及其法定代理人充足之學習、實驗狀態與結果及其他實驗資料。\n四、學生經評估不符合實驗所需或有違反實驗規範者，得由學校終止其參與實驗，並提供必要之輔導及協助。\n五、學校於招生及實施實驗之過程中，應平等維護學生學習權，非有正當理由，不得為差別待遇。\n六、學校不得洩漏學生個人資料及其他隱私，亦不得為影響學生身心發展或其他侵害學生人權之行為。\n七、其他各該教育主管機關會商各該原住民族主管機關規定之事項。\n第 六 條\n學校經指定或申請辦理原民實驗教育，應於學年度開始一年前提出實驗計畫，報各該教育主管機關核准後實施；實驗計畫變更時，應於預定變更之該學年度開始六個月前，報各該教育主管機關核准後實施。\n前項實驗計畫，應載明下列事項：\n一、名稱。\n二、目的。\n三、對象及學生入學方式。\n四、期間。\n五、實驗事項及範圍。\n六、課程教學及師資規劃。\n七、學生學習評量內容及方式。\n八、預期成效。\n九、主持人及參與人員背景資料。\n十、終止實驗後之處理措施。\n第 七 條\n實驗計畫期程，依申請辦理之不同教育階段，規定如下：\n一、高級中等教育階段：一年以上三年以下。\n二、國民中學教育階段：一年以上三年以下。\n三、國民小學教育階段：一年以上六年以下。\n前項計畫期程，經各該教育主管機關核准續辦者，得予延長，前項第一款及第二款每次得延長一年至三年，前項第三款每次得延長一年至六年。\n第 八 條\n各該教育主管機關為審議實驗計畫，應召開原住民族實驗教育審議會；其組成及運作應依原住民族教育法施行細則之規定辦理。\n原住民族實驗教育審議會審議實驗計畫時，應邀請學校列席陳述意見。\n第一項實驗計畫經原住民族實驗教育審議會審議通過，並由各該教育主管機關核准後，通知學校。\n第 九 條\n國民小學、國民中學辦理原民實驗教育，其課程不受國民小學課程綱要及國民中學課程綱要校訂課程及節數之限制。\n前項原民實驗教育，採專班方式為之；其每班原住民學生人數，不得少於全班學生總數百分之六十。\n第 十 條\n高級中等學校辦理原民實驗教育，其課程不受高級中等學校課程綱要之限\n制。但課程之總學分數，應符合中央教育主管機關所定畢業條件。\n第 十一 條\n學校辦理原民實驗教育，其學生學習評量，除依第六條第二項第七款規定，擬訂學生學習評量規定納入實驗計畫者外，應依高級中等學校學生學習評量辦法、國民小學及國民中學學生成績評量準則規定辦理。\n高級中等學校學生修畢實驗計畫所定課程，並經評量及格者，學校應發給修畢原民實驗教育證明。\n第 十二 條\n學校辦理原民實驗教育，應於實驗計畫結束後三個月內，提出成果報告書，報各該教育主管機關備查。\n第 十三 條\n各該教育主管機關應會同原住民族主管機關組成訪視評估小組，依所核准之學校實驗計畫，評定學校辦理原民實驗教育之成效。\n前項評定之方式如下：\n一、由辦理學校每學年進行自我評估，並報各該教育主管機關備查。\n二、經訪視評估小組，定期進行成效評估及追蹤輔導。\n第 十四 條\n各該教育主管機關及原住民族主管機關對核准之學校實驗計畫應提供輔導資源，並得視國家財政狀況給予經費補助；中央教育主管機關得對促進原住民族教育著有成效之實驗計畫，給予專案獎勵。\n學校得依經核准之實驗計畫需要，以契約進用教學及工作人員。\n學校辦理原民實驗教育經評定成績優良者，各該教育主管機關應予獎勵；實驗成果有推廣價值者，得舉行公開發表會。\n第 十五 條\n各該教育主管機關對學校辦理之原民實驗教育，經訪視評估小組評定有成果不佳或有違反本辦法、經核准之實驗計畫者，應採取下列必要措施：\n一、輔導。\n二、糾正。\n三、限期改善。\n四、核減招生人數。\n五、終止實驗。\n學校辦理原民實驗教育有前項情形，致損害學生權益時，經訪視評估小組評定後，各該教育主管機關得依相關法規規定，對學生採取必要之補救措施。\n第 十六 條\n本辦法自發布日施行。","history":"1.中華民國109年02月21日教育部臺教授國部字第 1090008021B 號令訂定發布全文 16 條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第 一 條<\/div>\n<div class=\"doc-plain\">本辦法依原住民族教育法第二十一條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第 二 條<\/div>\n<div class=\"doc-plain\">公立高級中等以下學校（以下簡稱學校）辦理部分班級原住民族實驗教育（以下簡稱原民實驗教育），應適用本辦法之規定。<\/div>\n<div class=\"article-heading\">第 三 條<\/div>\n<div class=\"doc-plain\">學校辦理原民實驗教育，應依原住民族知識特性及內涵，發展原住民族課程及評量。<\/div>\n<div class=\"doc-plain\">前項原住民族知識特性及內涵，得包括原住民族語言、歷史、文學、歲時祭儀、社會組織、傳統習慣、工藝、樂舞、生活技能、土地與生態智慧、族群權利及其他文化內涵。<\/div>\n<div class=\"article-heading\">第 四 條<\/div>\n<div class=\"doc-plain\">各該教育主管機關得就整體教育創新、學校地緣位置或教育資源分布情形，指定所屬學校辦理原民實驗教育。<\/div>\n<div class=\"doc-plain\">除前項指定外，學校經課程發展委員會及校務會議通過後，得向各該教育<\/div>\n<div class=\"doc-plain\">主管機關申請辦理原民實驗教育。<\/div>\n<div class=\"article-heading\">第 五 條<\/div>\n<div class=\"doc-plain\">學校辦理原民實驗教育，應遵守下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗前徵得學生本人及其法定代理人之同意。但學生已成年者，免經法定代理人同意。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學生本人及其法定代理人申請退出實驗時，不得以任何理由拒絕；學生已成年者，得單獨提出申請。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學校應主動提供學生及其法定代理人充足之學習、實驗狀態與結果及其他實驗資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">學生經評估不符合實驗所需或有違反實驗規範者，得由學校終止其參與實驗，並提供必要之輔導及協助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">學校於招生及實施實驗之過程中，應平等維護學生學習權，非有正當理由，不得為差別待遇。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">學校不得洩漏學生個人資料及其他隱私，亦不得為影響學生身心發展或其他侵害學生人權之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">其他各該教育主管機關會商各該原住民族主管機關規定之事項。<\/span><\/div>\n<div class=\"article-heading\">第 六 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校經指定或申請辦理原民實驗教育，應於學年度開始一年前提出實驗計畫，報各該教育主管機關核准後實施；實驗計畫變更時，應於預定變更之該學年度開始六個月前，報各該教育主管機關核准後實施。<\/div>\n<div class=\"doc-plain doc-continuation\">前項實驗計畫，應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">目的。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">對象及學生入學方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">期間。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">實驗事項及範圍。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">課程教學及師資規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">學生學習評量內容及方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">預期成效。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">主持人及參與人員背景資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">終止實驗後之處理措施。<\/span><\/div>\n<div class=\"article-heading\">第 七 條<\/div>\n<div class=\"doc-plain doc-continuation\">實驗計畫期程，依申請辦理之不同教育階段，規定如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高級中等教育階段：一年以上三年以下。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">國民中學教育階段：一年以上三年以下。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">國民小學教育階段：一年以上六年以下。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">前項計畫期程，經各該教育主管機關核准續辦者，得予延長，前項第一款及第二款每次得延長一年至三年，前項第三款每次得延長一年至六年。<\/div>\n<div class=\"article-heading\">第 八 條<\/div>\n<div class=\"doc-plain doc-continuation\">各該教育主管機關為審議實驗計畫，應召開原住民族實驗教育審議會；其組成及運作應依原住民族教育法施行細則之規定辦理。<\/div>\n<div class=\"doc-plain doc-continuation\">原住民族實驗教育審議會審議實驗計畫時，應邀請學校列席陳述意見。<\/div>\n<div class=\"doc-plain doc-continuation\">第一項實驗計畫經原住民族實驗教育審議會審議通過，並由各該教育主管機關核准後，通知學校。<\/div>\n<div class=\"article-heading\">第 九 條<\/div>\n<div class=\"doc-plain doc-continuation\">國民小學、國民中學辦理原民實驗教育，其課程不受國民小學課程綱要及國民中學課程綱要校訂課程及節數之限制。<\/div>\n<div class=\"doc-plain doc-continuation\">前項原民實驗教育，採專班方式為之；其每班原住民學生人數，不得少於全班學生總數百分之六十。<\/div>\n<div class=\"article-heading\">第 十 條<\/div>\n<div class=\"doc-plain doc-continuation\">高級中等學校辦理原民實驗教育，其課程不受高級中等學校課程綱要之限<\/div>\n<div class=\"doc-plain doc-continuation\">制。但課程之總學分數，應符合中央教育主管機關所定畢業條件。<\/div>\n<div class=\"article-heading\">第 十一 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校辦理原民實驗教育，其學生學習評量，除依第六條第二項第七款規定，擬訂學生學習評量規定納入實驗計畫者外，應依高級中等學校學生學習評量辦法、國民小學及國民中學學生成績評量準則規定辦理。<\/div>\n<div class=\"doc-plain doc-continuation\">高級中等學校學生修畢實驗計畫所定課程，並經評量及格者，學校應發給修畢原民實驗教育證明。<\/div>\n<div class=\"article-heading\">第 十二 條<\/div>\n<div class=\"doc-plain doc-continuation\">學校辦理原民實驗教育，應於實驗計畫結束後三個月內，提出成果報告書，報各該教育主管機關備查。<\/div>\n<div class=\"article-heading\">第 十三 條<\/div>\n<div class=\"doc-plain doc-continuation\">各該教育主管機關應會同原住民族主管機關組成訪視評估小組，依所核准之學校實驗計畫，評定學校辦理原民實驗教育之成效。<\/div>\n<div class=\"doc-plain doc-continuation\">前項評定之方式如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">由辦理學校每學年進行自我評估，並報各該教育主管機關備查。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">經訪視評估小組，定期進行成效評估及追蹤輔導。<\/span><\/div>\n<div class=\"article-heading\">第 十四 條<\/div>\n<div class=\"doc-plain doc-continuation\">各該教育主管機關及原住民族主管機關對核准之學校實驗計畫應提供輔導資源，並得視國家財政狀況給予經費補助；中央教育主管機關得對促進原住民族教育著有成效之實驗計畫，給予專案獎勵。<\/div>\n<div class=\"doc-plain doc-continuation\">學校得依經核准之實驗計畫需要，以契約進用教學及工作人員。<\/div>\n<div class=\"doc-plain doc-continuation\">學校辦理原民實驗教育經評定成績優良者，各該教育主管機關應予獎勵；實驗成果有推廣價值者，得舉行公開發表會。<\/div>\n<div class=\"article-heading\">第 十五 條<\/div>\n<div class=\"doc-plain doc-continuation\">各該教育主管機關對學校辦理之原民實驗教育，經訪視評估小組評定有成果不佳或有違反本辦法、經核准之實驗計畫者，應採取下列必要措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">輔導。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">糾正。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">限期改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">核減招生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">終止實驗。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\">學校辦理原民實驗教育有前項情形，致損害學生權益時，經訪視評估小組評定後，各該教育主管機關得依相關法規規定，對學生採取必要之補救措施。<\/div>\n<div class=\"article-heading\">第 十六 條<\/div>\n<div class=\"doc-plain doc-continuation\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國109年02月21日教育部臺教授國部字第 1090008021B 號令訂定發布全文 16 條，並自發布日施行。<\/div>"},{"title":"非學校型態機構實驗教育評鑑辦法","content":"第  一  條\n本辦法依高級中等以下教育階段非學校型態實驗教育實施條例（以下簡稱本條例）第二十二條第二項規定訂定之。\n第  二  條\n依本辦法所辦理之成效評鑑，應具有協調溝通之精神，以引導、協助及促進實驗教育機構落實實驗教育理念為目的。\n第  三  條\
