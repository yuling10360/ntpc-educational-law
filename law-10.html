<script>

const laws = [{"title":"高級中等學校辦理實驗教育辦法","content":"第  1  條\n本辦法依高級中等教育法第十二條第一項規定訂定之。\n第  2  條\n高級中等學校(以下簡稱學校)得就下列事項之全部或部分，辦理實驗教育(以下簡稱實驗)：\n一、課程教學。\n二、學生學習評量。\n三、區域及國際合作。\n四、雙語課程。\n五、其他各該主管機關核准促進教育優質之實驗事項。\n為培育兼具人文素養及科學專業知能之科學傑出人才，中央主管機關得指定學校或經學校申請，與大學合作辦理前項實驗之科學班。\n第  3  條\n學校辦理實驗，應遵守下列事項：\n一、實驗前徵得學生本人及其父母或監護人之同意。但學生已成年者，免經父母或監護人同意。\n二、學生本人及其父母或監護人申請退出實驗時，不得以任何理由拒絕；學生已成年者，得單獨提出申請。\n三、學校應主動提供學生與其父母或監護人充足之學習、實驗狀態與結果及其他實驗資料。\n四、學生經評估不符合實驗所需或有違反實驗規範者，得由學校終止其參與實驗，並提供必要之輔導及協助。\n五、學校於招生及實施實驗之過程中，應平等維護學生學習權，非有正當理由，不得為差別待遇。\n六、學校不得洩漏學生個人資料及其他隱私，亦不得為影響學生身心發展或其他侵害學生人權之行為。\n七、其他各該主管機關規定之事項。\n第  4  條\n學校應於每年十月三十一日前，提出下學年度入學新生適用之實驗計畫，報各該主管機關核准後實施；實驗計畫變更時，亦同。但學校辦理科學班者，應報中央主管機關核准。\n前項實驗計畫，應載明下列事項：\n一、名稱。\n二、目的。\n三、對象。\n四、期間。\n五、實驗事項及範圍。\n六、方法。\n七、經費需求。\n八、預期成效。\n九、主持人及參與人員背景資料。\n十、終止實驗後之處理措施。\n科學班實驗計畫，除應視性質載明前項事項外，並應載明下列事項：\n一、與合作大學共同規劃之課程、師資、設備、經費項目及金額。\n二、與合作大學成立科學班入學甄選及學科資格考試委員會，負責審理科學班學生入班資格及就讀期間入合作大學修課、學科資格考試、個別科學研究相關事宜。\n三、追蹤學生學習成效檢核方式之學生資料檔案，及學生輔導計畫。\n第  5  條\n各該主管機關為審議各類實驗計畫，得召開實驗教育審議會(以下簡稱審議會)。\n前項審議會，應置委員九人至十五人，其中一人為主席，由委員互推之；其餘委員由各該主管機關就熟悉實驗之教育行政人員、學者專家、具實務經驗學校校長團體代表、教師組織代表、家長團體代表及熱心教育人士聘(派)兼之；其審議之實驗計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人。\n審議會審議實驗計畫時，應邀請學校列席陳述意見。\n中央主管機關為審查科學班實驗計畫，應邀集學者專家及機關代表組成審查小組審查之，不適用前二項規定。\n前項審查小組審查通過後，由中央主管機關核准，並通知學校；直轄市、縣(市)主管機關主管之學校，由中央主管機關核准，並通知各該主管機關轉知學校。\n第  6  條\n學校辦理全部或部分班級實驗者，其課程得不受高級中等學校課程綱要規定之限制。但課程之排定，應符合中央主管機關所定學生畢(修)業之條件。\n學校辦理實驗，其學生學習評量，除就第二條第一項第二款辦理實驗，經擬訂學生學習評量規定納入實驗計畫者外，應依高級中等學校學生學習評量辦法規定辦理。\n學校辦理科學班者，應與合作大學共同辦理下列事項：\n一、規劃課程、師資、設備、經費項目及金額。\n二、成立科學班入學甄選及學科資格考試委員會；其任務如下：\n（一）審議科學班學生入班資格及學科資格考試通過基準。\n（二）審議合作大學開設課程。\n（三）輔導學生進行個別科學研究。\n（四）其他科學班運作之事項。\n第  7  條\n學校辦理實驗，應於每一學年度結束時，提出期中實驗報告，並於實驗計畫結束後三個月內，提出成果報告書；其期中實驗報告及成果報告書，應報各該主管機關備查。\n第  8  條\n全國科學班學生總數，中央主管機關得限制之；未達上限時，中央主管機關得視實際需要，就科學班之開放申請、期限、班級數、每班學生數及其他相關事項公告之。\n學校辦理科學班者，應符合下列條件：\n一、最近一次學校評鑑獲優等(或一等)。\n二、首次辦理前三年內，有學生代表我國參加下列國際競賽，並獲獎項：\n（一）國際數理學科奧林匹亞競賽、亞太數學奧林匹亞競賽、亞洲物理奧林匹亞競賽。\n（二）由國立臺灣科學教育館選派參加之美國國際科技展覽會（International Science and Engineering Fair, ISEF）。\n三、經學校校務會議通過。\n四、合作大學同意共同辦理學生入學甄選、課程規劃、實驗探究及指導學生完成個別科學研究之文件。\n第  9  條\n直轄市、縣(市)主管機關主管之學校所設國民中學部或國民中學有特殊優異表現之學生，經各該校列冊，報直轄市、縣(市)主管機關初審後，經擬入學校之科學班入學甄選及學科資格考試委員會審查通過後，得直接錄取入科學班就讀，並報中央主管機關備查；中央主管機關主管之學校所設國民中學部或國民中學，經擬入學校之科學班入學甄選及學科資格考試委員會審查通過後，得直接錄取入科學班就讀，並報中央主管機關備查。\n前項直接錄取人數，應併入中央主管機關公告之每班學生數計算。\n第  10  條\n各該主管機關應組成訪視評估小組，依所核准之學校實驗計畫，評定學校辦理實驗之成效。\n前項評定之方式如下：\n一、由辦理學校每學年進行自我評估。\n二、經訪視評估小組，定期進行成效評估及追蹤輔導。\n第  11  條\n各該主管機關得視其財政狀況，對核准之學校實驗計畫，給予經費補助；\n中央主管機關並得對促進高級中等教育著有成效之實驗計畫，給予專案獎勵。\n學校得依經核准之實驗計畫需要，以契約進用實驗計畫工作人員。\n學校辦理實驗經評定成績優良者，各該主管機關應予獎勵；實驗成果有推廣價值者，得舉行公開發表會。\n第  12  條\n各該主管機關對所核准學校辦理之實驗，認有訪視評估成效不佳或違反本辦法、經核定之實驗計畫者，經訪視評估小組評定後，應對學校採取下列必要措施：\n一、輔導。\n二、糾正。\n三、限期改善。\n四、核減招生人數。\n五、終止實驗。\n學校辦理實驗有前項情形，致損害學生權益時，經訪視評估小組審議後，各該主管機關得依相關法規規定，對學生採取必要之補救措施。\n第  13  條\n依科學園區設置管理條例規定及本辦法施行前已依特殊教育目的設立之學校，不受本辦法規定之限制。\n第  14  條\n本辦法中華民國一百零八年五月三十一日修正施行後，依本辦法規定辦理實驗之學校，其名稱不得冠以「實驗」二字；修正施行前已依原規定辦理實驗之學校，適用本辦法修正施行後之規定繼續辦理實驗，其名稱已依原規定冠以「實驗」二字者，得冠以「實驗」二字。\n前項繼續辦理實驗之學校，其有不符合本辦法修正施行後之規定者，應於本辦法修正施行後三年內完成調整。\n第  15  條\n本辦法自發布日施行。","history":"1.中華民國103年1月8日教育部臺教授國部字第1020128580A號令訂定發布全文 16 條；並自103年8月1日施行。\n2.中華民國108年5月31日教育部臺教授國部字第1080059219B號令修正發布全文 15 條；並自發布日施行。\n3. 中華民國111年10月28日教育部臺教授國部字第 1110139682A 號令修正部分條文","contentHtml":"<div class=\"article-heading\">第 1 條<\/div>\n<div class=\"doc-plain\">本辦法依高級中等教育法第十二條第一項規定訂定之。<\/div>\n<div class=\"article-heading\">第 2 條<\/div>\n<div class=\"doc-plain\">高級中等學校(以下簡稱學校)得就下列事項之全部或部分，辦理實驗教育(以下簡稱實驗)：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">課程教學。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學生學習評量。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">區域及國際合作。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">雙語課程。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他各該主管機關核准促進教育優質之實驗事項。<\/span><\/div>\n<div class=\"doc-plain\">為培育兼具人文素養及科學專業知能之科學傑出人才，中央主管機關得指定學校或經學校申請，與大學合作辦理前項實驗之科學班。<\/div>\n<div class=\"article-heading\">第 3 條<\/div>\n<div class=\"doc-plain\">學校辦理實驗，應遵守下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗前徵得學生本人及其父母或監護人之同意。但學生已成年者，免經父母或監護人同意。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學生本人及其父母或監護人申請退出實驗時，不得以任何理由拒絕；學生已成年者，得單獨提出申請。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學校應主動提供學生與其父母或監護人充足之學習、實驗狀態與結果及其他實驗資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">學生經評估不符合實驗所需或有違反實驗規範者，得由學校終止其參與實驗，並提供必要之輔導及協助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">學校於招生及實施實驗之過程中，應平等維護學生學習權，非有正當理由，不得為差別待遇。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">學校不得洩漏學生個人資料及其他隱私，亦不得為影響學生身心發展或其他侵害學生人權之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">其他各該主管機關規定之事項。<\/span><\/div>\n<div class=\"article-heading\">第 4 條<\/div>\n<div class=\"doc-plain\">學校應於每年十月三十一日前，提出下學年度入學新生適用之實驗計畫，報各該主管機關核准後實施；實驗計畫變更時，亦同。但學校辦理科學班者，應報中央主管機關核准。<\/div>\n<div class=\"doc-plain\">前項實驗計畫，應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">目的。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">對象。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">期間。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">實驗事項及範圍。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">方法。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">經費需求。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">預期成效。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">主持人及參與人員背景資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">終止實驗後之處理措施。<\/span><\/div>\n<div class=\"doc-plain\">科學班實驗計畫，除應視性質載明前項事項外，並應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">與合作大學共同規劃之課程、師資、設備、經費項目及金額。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">與合作大學成立科學班入學甄選及學科資格考試委員會，負責審理科學班學生入班資格及就讀期間入合作大學修課、學科資格考試、個別科學研究相關事宜。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">追蹤學生學習成效檢核方式之學生資料檔案，及學生輔導計畫。<\/span><\/div>\n<div class=\"article-heading\">第 5 條<\/div>\n<div class=\"doc-plain\">各該主管機關為審議各類實驗計畫，得召開實驗教育審議會(以下簡稱審議會)。<\/div>\n<div class=\"doc-plain\">前項審議會，應置委員九人至十五人，其中一人為主席，由委員互推之；其餘委員由各該主管機關就熟悉實驗之教育行政人員、學者專家、具實務經驗學校校長團體代表、教師組織代表、家長團體代表及熱心教育人士聘(派)兼之；其審議之實驗計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人。<\/div>\n<div class=\"doc-plain\">審議會審議實驗計畫時，應邀請學校列席陳述意見。<\/div>\n<div class=\"doc-plain\">中央主管機關為審查科學班實驗計畫，應邀集學者專家及機關代表組成審查小組審查之，不適用前二項規定。<\/div>\n<div class=\"doc-plain\">前項審查小組審查通過後，由中央主管機關核准，並通知學校；直轄市、縣(市)主管機關主管之學校，由中央主管機關核准，並通知各該主管機關轉知學校。<\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain\">學校辦理全部或部分班級實驗者，其課程得不受高級中等學校課程綱要規定之限制。但課程之排定，應符合中央主管機關所定學生畢(修)業之條件。<\/div>\n<div class=\"doc-plain\">學校辦理實驗，其學生學習評量，除就第二條第一項第二款辦理實驗，經擬訂學生學習評量規定納入實驗計畫者外，應依高級中等學校學生學習評量辦法規定辦理。<\/div>\n<div class=\"doc-plain\">學校辦理科學班者，應與合作大學共同辦理下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">規劃課程、師資、設備、經費項目及金額。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">成立科學班入學甄選及學科資格考試委員會；其任務如下：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">審議科學班學生入班資格及學科資格考試通過基準。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">審議合作大學開設課程。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">輔導學生進行個別科學研究。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">其他科學班運作之事項。<\/span><\/div>\n<div class=\"article-heading\">第 7 條<\/div>\n<div class=\"doc-plain\">學校辦理實驗，應於每一學年度結束時，提出期中實驗報告，並於實驗計畫結束後三個月內，提出成果報告書；其期中實驗報告及成果報告書，應報各該主管機關備查。<\/div>\n<div class=\"article-heading\">第 8 條<\/div>\n<div class=\"doc-plain\">全國科學班學生總數，中央主管機關得限制之；未達上限時，中央主管機關得視實際需要，就科學班之開放申請、期限、班級數、每班學生數及其他相關事項公告之。<\/div>\n<div class=\"doc-plain\">學校辦理科學班者，應符合下列條件：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">最近一次學校評鑑獲優等(或一等)。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">首次辦理前三年內，有學生代表我國參加下列國際競賽，並獲獎項：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">國際數理學科奧林匹亞競賽、亞太數學奧林匹亞競賽、亞洲物理奧林匹亞競賽。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">由國立臺灣科學教育館選派參加之美國國際科技展覽會（International Science and Engineering Fair, ISEF）。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">經學校校務會議通過。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">合作大學同意共同辦理學生入學甄選、課程規劃、實驗探究及指導學生完成個別科學研究之文件。<\/span><\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關主管之學校所設國民中學部或國民中學有特殊優異表現之學生，經各該校列冊，報直轄市、縣(市)主管機關初審後，經擬入學校之科學班入學甄選及學科資格考試委員會審查通過後，得直接錄取入科學班就讀，並報中央主管機關備查；中央主管機關主管之學校所設國民中學部或國民中學，經擬入學校之科學班入學甄選及學科資格考試委員會審查通過後，得直接錄取入科學班就讀，並報中央主管機關備查。<\/div>\n<div class=\"doc-plain\">前項直接錄取人數，應併入中央主管機關公告之每班學生數計算。<\/div>\n<div class=\"article-heading\">第 10 條<\/div>\n<div class=\"doc-plain\">各該主管機關應組成訪視評估小組，依所核准之學校實驗計畫，評定學校辦理實驗之成效。<\/div>\n<div class=\"doc-plain\">前項評定之方式如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">由辦理學校每學年進行自我評估。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">經訪視評估小組，定期進行成效評估及追蹤輔導。<\/span><\/div>\n<div class=\"article-heading\">第 11 條<\/div>\n<div class=\"doc-plain\">各該主管機關得視其財政狀況，對核准之學校實驗計畫，給予經費補助；<\/div>\n<div class=\"doc-plain\">中央主管機關並得對促進高級中等教育著有成效之實驗計畫，給予專案獎勵。<\/div>\n<div class=\"doc-plain\">學校得依經核准之實驗計畫需要，以契約進用實驗計畫工作人員。<\/div>\n<div class=\"doc-plain\">學校辦理實驗經評定成績優良者，各該主管機關應予獎勵；實驗成果有推廣價值者，得舉行公開發表會。<\/div>\n<div class=\"article-heading\">第 12 條<\/div>\n<div class=\"doc-plain\">各該主管機關對所核准學校辦理之實驗，認有訪視評估成效不佳或違反本辦法、經核定之實驗計畫者，經訪視評估小組評定後，應對學校採取下列必要措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">輔導。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">糾正。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">限期改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">核減招生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">終止實驗。<\/span><\/div>\n<div class=\"doc-plain\">學校辦理實驗有前項情形，致損害學生權益時，經訪視評估小組審議後，各該主管機關得依相關法規規定，對學生採取必要之補救措施。<\/div>\n<div class=\"article-heading\">第 13 條<\/div>\n<div class=\"doc-plain\">依科學園區設置管理條例規定及本辦法施行前已依特殊教育目的設立之學校，不受本辦法規定之限制。<\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain\">本辦法中華民國一百零八年五月三十一日修正施行後，依本辦法規定辦理實驗之學校，其名稱不得冠以「實驗」二字；修正施行前已依原規定辦理實驗之學校，適用本辦法修正施行後之規定繼續辦理實驗，其名稱已依原規定冠以「實驗」二字者，得冠以「實驗」二字。<\/div>\n<div class=\"doc-plain\">前項繼續辦理實驗之學校，其有不符合本辦法修正施行後之規定者，應於本辦法修正施行後三年內完成調整。<\/div>\n<div class=\"article-heading\">第 15 條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國103年1月8日教育部臺教授國部字第1020128580A號令訂定發布全文 16 條；並自103年8月1日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國108年5月31日教育部臺教授國部字第1080059219B號令修正發布全文 15 條；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3. 中華民國111年10月28日教育部臺教授國部字第 1110139682A 號令修正部分條文<\/div>"},{"title":"學校型態實驗教育實施條例","content":"第 一 章 總則\n第 1 條\n為鼓勵教育創新，實施學校型態實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展，落實教育基本法第十三條規定，特制定本條例。\n第 2 條\n本條例所稱主管機關，在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n私立實驗教育學校，依其最高教育階段之法規，定其主管機關。\n第 3 條\n本條例所稱學校型態實驗教育，指依據特定教育理念，以學校為範圍，從事教育理念之實踐，並就學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務及輔導、社區及家長參與等事項，進行整合性實驗之教育。\n前項特定教育理念之實踐，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，並以引導學生適性學習及促進多元教育發展為目標。\n本條例所稱私立實驗教育學校，指主管機關許可辦理學校型態實驗教育之私立學校。\n第 4 條\n私立實驗教育學校，由學校財團法人(以下簡稱學校法人)或其他非營利之私法人申請設立，或由學校法人將現有私立學校改制。\n前項學校法人，以辦學績優者為限；其辦學績優認定之標準，由中央主管機關定之。\n第 5 條\n學校型態實驗教育之審議、監督及政策與資源協調等相關事項，應由各該主管機關定期召開學校型態實驗教育審議會(以下簡稱實驗教育審議會)辦理。\n前項實驗教育審議會置委員九人至二十五人，由各該主管機關就熟悉實驗教育之下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總人數五分之二；任一性別委員人數不得少於委員總人數三分之一：\n一、教育行政機關代表。\n二、具有會計、財務金融、法律或教育專業之專家、學者。\n三、校長及教師組織代表。\n四、具有實驗教育經驗之校長或教學人員。\n五、實驗教育家長代表、本人或子女曾接受實驗教育者。\n六、實驗教育相關團體代表。\n前項委員任期二年，其續聘以二次為限；每次聘任之委員中續聘之委員不得超過委員總數之三分之二。任期內出缺時，得補行聘(派)兼，其任期至原任期屆滿之日為止。\n實驗教育審議會審議學校型態實驗教育計畫(以下簡稱實驗教育計畫)涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。\n實驗教育審議會主席，由委員互推產生。\n實驗教育審議會委員，均為無給職。\n實驗教育審議會為行使職權，得指派委員攜帶證明文件，赴私立實驗教育學校進行訪視、調查，並得要求學校承辦人員提出報告或提供必要之文書資料及物品；必要時，並得洽請有關機關協助執行。\n實驗教育審議會之委員，不得參與其所監督之私立實驗教育學校辦理之實驗教育。\n第 6 條\n為保障學生之權益，學校型態實驗教育應維護學生基本人權，積極營造友善校園之教育環境，並遵守下列事項：\n一、實驗教育之實施應事前徵得學生本人及其法定代理人之同意或事先載明於招生簡章中。\n二、接受學生本人及其法定代理人退出實驗教育之申請，不得以任何理由拒絕。\n三、學生不適應實驗教育，並提出轉學需求時，學校應予以協助。\n四、學生本人及其法定代理人申請瞭解學生學習狀況，學校應予告知或提供資料。\n五、無正當理由，不得於招生或教育過程中，使學生受差別待遇。\n六、不得洩漏學生個人資料及其他隱私。\n七、不得有虐待、疏忽照顧或其他傷害學生身心發展之行為。\n八、不得為其他侵害學生人權之行為。\n九、其他主管機關規定之事項。\n學校接受前項第三款高級中等以上實驗教育學生轉入時，應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。\n第 二 章 學校型態實驗教育之許可\n第 7 條\n學校法人或其他非營利之私法人申請辦理學校型態實驗教育，應由其指定之計畫主持人擬具實驗教育計畫，於學年度開始一年前，向各該主管機關提出，經各該主管機關送實驗教育審議會審議通過後，由各該主管機關許可。\n前項實驗教育計畫，應載明下列事項：\n一、學校名稱。\n二、實驗教育名稱。\n三、學校所在地。\n四、教育理念及計畫特色。\n五、課程及教學規劃。\n六、學校制度。\n七、行政運作、組織型態。\n八、設備設施。\n九、實驗規範。\n十、校長資格與產生方式、教職員工之資格及進用方式。\n十一、學生入學、學習成就評量、學生事務及輔導之方式。\n十二、社區及家長參與方式。\n十三、經費需求、來源及收費基準。\n十四、預計招收學生人數。\n十五、實驗期程及步驟。\n十六、自我評鑑之方式。\n十七、實驗教育計畫主持人(以下簡稱計畫主持人)及參與人員背景資料。\n前項實驗教育計畫期程，依申請辦理之不同教育階段規定如下：\n一、高級中等以下階段學校型態實驗教育：三年以上十二年以下。但經主管機關許可續辦者，得予延長，每次延長期限為三年以上十二年以下。\n二、專科以上階段學校型態實驗教育：四年以上十二年以下，並以辦理專科班、學士班或碩士班為限。但經主管機關許可續辦者，得予延長，每次延長期限為四年以上十二年以下。\n第 8 條\n實驗教育審議會審議實驗教育計畫時，應考量下列因素：\n一、保障學生學習權與落實家長及學生教育選擇權。\n二、計畫內容之合理性及可行性，並應符合第三條第二項規定。\n三、預期成效。\n第 9 條\n第七條第二項第九款之實驗規範，應就第三條第一項所定事項擬訂，於該規範之範圍內，得不適用教育人員任用條例、教師法、國民教育法、高級中等教育法、專科學校法、大學法、私立學校法、技術及職業教育法、特殊教育法、學位授予法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。\n私立實驗教育學校之主管機關屬直轄市、縣(市)政府者，其實驗規範應報中央主管機關核定。\n第 10 條\n第七條第一項之申請，應由各該主管機關於受理申請之日起三個月內作成決定，必要時得延長一次，並以三個月為限。\n第 11 條\n實驗教育計畫結束六個月前，計畫主持人應提出結果報告，並得同時提出續辦之申請。\n前項實驗教育結果報告，應報各該主管機關送實驗教育審議會審議，並作為是否許可續辦之參考。\n第一項續辦之申請、審議及許可程序，準用第七條至前條規定。\n第 12 條\n私立高級中等以下實驗教育學校聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可；其屬合格外國語文課程教師者，不受就業服務法第四十六條第二項及第四十八條第一項本文、第二項規定之限制。\n前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。\n依第一項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。\n第 13 條\n實驗教育計畫經主管機關許可後，計畫主持人及學校校長以不變更為原則；計畫內容有變更之必要時，計畫主持人應於學年度開始六個月前，報各該主管機關送實驗教育審議會審議通過後，由主管機關同意變更。\n第 三 章 私立實驗教育學校之許可\n第 14 條\n學校法人及其他非營利之私法人，經各該主管機關許可辦理學校型態實驗教育，並符合下列各款規定之一者，得申請設立或改制私立實驗教育學校：\n一、申請設立或改制私立高級中等以下實驗教育學校者，應符合下列各目規定：\n（一）招生對象為六歲至十八歲之學生。\n（二）每年級學生人數不得超過五十人，自國民教育階段至高級中等教育階段學生總人數，不得超過六百人。但僅單獨辦理高級中等教育階段或國民中學教育階段者，其學生總人數，分別不得超過二百四十人，每年級學生不受五十人之限制。\n（三）專任教師對學生人數之比例不低於一比十；其應有專任教師人數之一半，得以兼任教師折抵，兼任教師三人以專任教師一人計算。\n（四）學生學習活動室內場地使用面積，每人不得少於一點五平方公尺，其面積不包括室內走廊及樓梯；學生學習活動室外面積，每人不得少於三平方公尺。但每人之樓地板總面積高於四平方公尺者，不在此限。\n二、申請設立或改制私立專科以上實驗教育學校者，應符合下列各目規定：\n（一）招生對象：專科班或學士班為公、私立高級中等學校或同等學校畢業之學生，或具有同等學力之學生；碩士班為取得學士學位或具有同等學力之學生。\n（二）自專科班階段至碩士班階段學生總人數，不得超過五百人。但僅單獨辦理專科班階段或碩士班階段者，其學生總人數，分別不得超過一百六十人；僅單獨辦理學士班階段，其學生總人數不得超過三百二十人。\n學校法人所設私立實驗教育學校，適用私立學校法之規定；其他非營利之私法人所設私立實驗教育學校，視同私立學校法所定私立學校，除本條例另有規定外，適用私立學校法之規定。\n學校法人組織及運作之監督，依私立學校法及其相關法規之規定；其他非營利之私法人組織及運作之監督，依各該法人設立許可法規之規定。\n第 15 條\n學校法人申請設立或改制私立實驗教育學校，或其他非營利之私法人申請設立私立實驗教育學校，應由各該法人之代表人於學年度開始六個月前，擬具設校或改制計畫，向各該主管機關提出，經實驗教育審議會審議通過後，由各該主管機關許可其設立或改制。\n前項設校或改制計畫，應載明下列事項：\n一、學校名稱。\n二、設校或改制之時程。\n三、預定設校規劃或改制前學校狀況。\n四、學校位置、面積及相關資料。\n五、規劃中或現有組織編制及班級師生人數。\n六、法人登記證書。\n七、法人資產狀況及經會計師簽證之財務報表。\n八、前三年學校經費概算及籌措方式。\n九、法人之代表人、擬聘或現任之校長、教師及其他人員之相關資料或同意受聘意願書。\n第一項設立或改制計畫，得由申請人併同第七條實驗教育計畫向各該主管機關提出，經實驗教育審議會併同審議通過後，由各該主管機關許可。\n第 16 條\n學校法人申請設立或改制私立實驗教育學校，或其他非營利之私法人申請設立私立實驗教育學校者，其校地、校舍及教學設備，應符合足夠進行實驗教育之基本教學及行政需求，不受高級中等以下學校及其分校分部設立變更停辦辦法及專科以上學校及其分校分部專科部技術型高級中等學校部設立變更停辦辦法之限制；私立專科以上實驗教育學校設校標準，由中央主管機關定之。\n前項校地及校舍，申請人應檢附所有權人同意該校於實驗教育實施期間內，得合法使用並經依法公證之證明文件。\n各該主管機關為鼓勵學校型態實驗教育之實施，得將公有之都市計畫學校用地或閒置之校地校舍，依相關法令提供私立實驗教育學校使用或租用。\n實驗教育學校租用土地之租期，依其實驗計畫期程，不適用私立學校法第三十六條第三項應至少承租三十年之規定。\n第 四 章 評鑑、監督及獎勵\n第 17 條\n各該主管機關應於實驗教育計畫期間，邀集實驗教育審議會委員組成評鑑小組辦理評鑑；其評鑑結果，併同實驗計畫成果報告書，作為申請續辦實驗教育計畫之參考。\n前項評鑑之實施期程、內容、程序、評鑑小組之組成、成員之資格及評鑑結果之處理等相關事項之辦法，由中央主管機關定之。\n第 18 條\n私立專科以上實驗教育學校應建立教學品質保證機制，得定期接受國內或國外專業評鑑機構之評鑑或認可；其教學品質保證機制、評鑑、認可及相關事項之辦法，由中央主管機關定之。\n前項教學品質保證機制及獲得專業評鑑機構評鑑或認可之情形，應一併載明於招生簡章。\n第 19 條\n私立實驗教育學校違反本條例或實驗教育計畫、經實驗教育評鑑結果辦理不善或有影響學生權益之情事時，各該主管機關應採取下列全部或部分措施：\n一、輔導。\n二、糾正。\n三、限期整頓改善。\n四、停止招生或減少招生人數。\n五、停辦實驗教育計畫。\n各該主管機關對私立實驗教育學校採取前項第四款或第五款之措施前，應先提請實驗教育審議會審議，並對就讀學生採取必要之補救措施。\n實驗教育計畫經停辦或不續辦之私立實驗教育學校，其為學校法人所設私立學校改制者，廢止其改制許可，恢復原有辦學型態；其為學校法人或其他非營利之私法人設立者，廢止其設立許可。\n第 20 條\n私立實驗教育學校之實驗教育計畫經停辦或不續辦時，應依學生意願留校或輔導轉學，必要時得由各該主管機關分發學生至其他學校。\n學校法人或其他非營利之私法人依法解散時，各該主管機關應廢止其私立實驗教育學校之許可。\n第 21 條\n私立實驗教育學校之實驗教育計畫經停辦或不續辦時，學校法人或其他非營利之私法人對於為辦理實驗教育進用之編制外職員及其他適用勞動基準法之人員終止契約者，應依勞動法規規定辦理；其對於為辦理實驗教育進用之編制外教師終止契約者，應依勞動法規規定計算標準數額給予補償。\n第 22 條\n私立實驗教育學校經評鑑成績優良者，各該主管機關應予獎勵；實驗成果有推廣價值者，各該主管機關應定期舉行公開發表會、學術研討會或教學觀摩會，以分享實驗經驗。\n第 五 章 附則\n第 23 條\n公立學校經校務會議通過後得提出申請，或由各該主管機關指定所屬高級中等以下公立學校，以學校為範圍，依據特定教育理念，就行政運作、組織型態、設備設施、課程教學、學生入學、學習成就評量、學生事務及輔導等事項，辦理學校型態實驗教育，並準用第五條、第六條、第七條第一項、第二項第一款至第五款、第七款、第八款、第十一款、第十三款至第十七款、第三項、第八條、第十一條第一項、第二項、第十二條、第十四條第一項第一款第一目、第二目、第二款、第十七條、第二十條第一項、第二十一條及前條規定。\n原住民重點學校以外之公立學校辦理學校型態實驗教育，其學校總數，不得逾主管機關所屬同一教育階段總校數百分之五，不足一校者，以一校採計。但情況特殊，其實驗教育計畫於學年度開始六個月前逐案報中央主管機關審查核定者，不得逾同一教育階段總校數百分之十五。\n前項學校總數，不得逾全國同一教育階段總校數百分之十。\n公立學校辦理學校型態實驗教育，應就第一項所定事項擬訂實驗規範，報學校主管機關核轉中央主管機關核定；於實驗規範之範圍內，得不適用國民教育法、高級中等教育法、專科學校法、大學法、技術及職業教育法、特殊教育法、學位授予法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。屬第二項但書情形者，併實驗教育計畫報送。\n公立學校辦理學校型態實驗教育，其校長之遴選、聘任程序，由各該主管機關依實際需要另定之；校長辦學績效卓著，其校務發展計畫經實驗教育審議會通過，並經各該主管機關校長遴選委員會同意者，得不受連任一次之限制。\n公立高級中等以下實驗教育學校，其校長得以具教育人員任用條例第四條、第五條或第六條資格之一者聘任之。\n公立學校辦理學校型態實驗教育，得依相關法規規定以契約方式進用編制外之教職員。\n第 24 條\n非營利之私法人所設之非學校型態機構實驗教育，以原有場地及建築物，且學生人數符合原規定，依本條例申請改設立為私立高級中等以下實驗教育學校者，得於報各該主管機關許可後，繼續適用原建築物使用組別及其建築相關法令之規定。\n第 25 條\n學校法人及其他非營利之私法人申請辦理學校型態實驗教育之許可條件、程序、實驗教育計畫之審查、續辦、改制或設立私立實驗教育學校之程序、許可之廢止、恢復原有辦學型態、監督、獎勵及其他應遵行事項之辦法，於高級中等以下教育階段，由各該主管機關定之；於專科以上教育階段，由中央主管機關定之。\n公立學校辦理學校型態實驗教育之條件、程序、實驗教育計畫之審查、變更、續辦、指定之廢止、恢復原有辦學型態、監督、獎勵及其他應遵行事項之辦法，於高級中等以下教育階段，由各該主管機關定之；於專科以上教育階段，由中央主管機關定之。\n各級主管機關得編列預算，對前二項實驗教育學校予以補助；其屬偏遠地區學校者，應優先補助。中央主管機關應依直轄市、縣(市)政府財力級次優予補助，並應專款專用。\n直轄市、縣(市)主管機關辦理實驗教育績效優良者，中央主管機關得予獎勵。\n第 26 條\n各級主管機關得建置實驗教育網路平臺，舉辦說明會，提供多元選擇資訊，促進社會大眾之認知。\n實驗教育得與在地社區或組織合作，結合地方產業、地方創生活化教學，並得聘請業界專家協助教學。\n第 27 條\n本條例施行細則，由中央主管機關定之。\n第 28 條\n本條例自公布日施行。","history":"1.中華民國103年11月19日總統華總一義字第10300173321號令制定公布全文23條，自公布日施行。\n2.中華民國107年1月31日總統華總一義字第 10700009831號令修正公布全文 28 條；並自公布日施行。","contentHtml":"<div class=\"chapter-heading\">第 一 章 總則<\/div>\n<div class=\"article-heading\">第 1 條<\/div>\n<div class=\"doc-plain\">為鼓勵教育創新，實施學校型態實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展，落實教育基本法第十三條規定，特制定本條例。<\/div>\n<div class=\"article-heading\">第 2 條<\/div>\n<div class=\"doc-plain\">本條例所稱主管機關，在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"doc-plain\">私立實驗教育學校，依其最高教育階段之法規，定其主管機關。<\/div>\n<div class=\"article-heading\">第 3 條<\/div>\n<div class=\"doc-plain\">本條例所稱學校型態實驗教育，指依據特定教育理念，以學校為範圍，從事教育理念之實踐，並就學校制度、行政運作、組織型態、設備設施、校長資格與產生方式、教職員工之資格與進用方式、課程教學、學生入學、學習成就評量、學生事務及輔導、社區及家長參與等事項，進行整合性實驗之教育。<\/div>\n<div class=\"doc-plain\">前項特定教育理念之實踐，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，並以引導學生適性學習及促進多元教育發展為目標。<\/div>\n<div class=\"doc-plain\">本條例所稱私立實驗教育學校，指主管機關許可辦理學校型態實驗教育之私立學校。<\/div>\n<div class=\"article-heading\">第 4 條<\/div>\n<div class=\"doc-plain\">私立實驗教育學校，由學校財團法人(以下簡稱學校法人)或其他非營利之私法人申請設立，或由學校法人將現有私立學校改制。<\/div>\n<div class=\"doc-plain\">前項學校法人，以辦學績優者為限；其辦學績優認定之標準，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第 5 條<\/div>\n<div class=\"doc-plain\">學校型態實驗教育之審議、監督及政策與資源協調等相關事項，應由各該主管機關定期召開學校型態實驗教育審議會(以下簡稱實驗教育審議會)辦理。<\/div>\n<div class=\"doc-plain\">前項實驗教育審議會置委員九人至二十五人，由各該主管機關就熟悉實驗教育之下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總人數五分之二；任一性別委員人數不得少於委員總人數三分之一：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">教育行政機關代表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">具有會計、財務金融、法律或教育專業之專家、學者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">校長及教師組織代表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">具有實驗教育經驗之校長或教學人員。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">實驗教育家長代表、本人或子女曾接受實驗教育者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">實驗教育相關團體代表。<\/span><\/div>\n<div class=\"doc-plain\">前項委員任期二年，其續聘以二次為限；每次聘任之委員中續聘之委員不得超過委員總數之三分之二。任期內出缺時，得補行聘(派)兼，其任期至原任期屆滿之日為止。<\/div>\n<div class=\"doc-plain\">實驗教育審議會審議學校型態實驗教育計畫(以下簡稱實驗教育計畫)涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。<\/div>\n<div class=\"doc-plain\">實驗教育審議會主席，由委員互推產生。<\/div>\n<div class=\"doc-plain\">實驗教育審議會委員，均為無給職。<\/div>\n<div class=\"doc-plain\">實驗教育審議會為行使職權，得指派委員攜帶證明文件，赴私立實驗教育學校進行訪視、調查，並得要求學校承辦人員提出報告或提供必要之文書資料及物品；必要時，並得洽請有關機關協助執行。<\/div>\n<div class=\"doc-plain\">實驗教育審議會之委員，不得參與其所監督之私立實驗教育學校辦理之實驗教育。<\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain\">為保障學生之權益，學校型態實驗教育應維護學生基本人權，積極營造友善校園之教育環境，並遵守下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗教育之實施應事前徵得學生本人及其法定代理人之同意或事先載明於招生簡章中。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">接受學生本人及其法定代理人退出實驗教育之申請，不得以任何理由拒絕。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學生不適應實驗教育，並提出轉學需求時，學校應予以協助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">學生本人及其法定代理人申請瞭解學生學習狀況，學校應予告知或提供資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">無正當理由，不得於招生或教育過程中，使學生受差別待遇。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">不得洩漏學生個人資料及其他隱私。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">不得有虐待、疏忽照顧或其他傷害學生身心發展之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">不得為其他侵害學生人權之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">其他主管機關規定之事項。<\/span><\/div>\n<div class=\"doc-plain\">學校接受前項第三款高級中等以上實驗教育學生轉入時，應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。<\/div>\n<div class=\"chapter-heading\">第 二 章 學校型態實驗教育之許可<\/div>\n<div class=\"article-heading\">第 7 條<\/div>\n<div class=\"doc-plain\">學校法人或其他非營利之私法人申請辦理學校型態實驗教育，應由其指定之計畫主持人擬具實驗教育計畫，於學年度開始一年前，向各該主管機關提出，經各該主管機關送實驗教育審議會審議通過後，由各該主管機關許可。<\/div>\n<div class=\"doc-plain\">前項實驗教育計畫，應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗教育名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學校所在地。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">教育理念及計畫特色。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">課程及教學規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">學校制度。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">行政運作、組織型態。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">設備設施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">實驗規範。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">校長資格與產生方式、教職員工之資格及進用方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">學生入學、學習成就評量、學生事務及輔導之方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">社區及家長參與方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十三、<\/span><span class=\"doc-copy\">經費需求、來源及收費基準。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十四、<\/span><span class=\"doc-copy\">預計招收學生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十五、<\/span><span class=\"doc-copy\">實驗期程及步驟。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十六、<\/span><span class=\"doc-copy\">自我評鑑之方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十七、<\/span><span class=\"doc-copy\">實驗教育計畫主持人(以下簡稱計畫主持人)及參與人員背景資料。<\/span><\/div>\n<div class=\"doc-plain\">前項實驗教育計畫期程，依申請辦理之不同教育階段規定如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高級中等以下階段學校型態實驗教育：三年以上十二年以下。但經主管機關許可續辦者，得予延長，每次延長期限為三年以上十二年以下。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">專科以上階段學校型態實驗教育：四年以上十二年以下，並以辦理專科班、學士班或碩士班為限。但經主管機關許可續辦者，得予延長，每次延長期限為四年以上十二年以下。<\/span><\/div>\n<div class=\"article-heading\">第 8 條<\/div>\n<div class=\"doc-plain\">實驗教育審議會審議實驗教育計畫時，應考量下列因素：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">保障學生學習權與落實家長及學生教育選擇權。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">計畫內容之合理性及可行性，並應符合第三條第二項規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">預期成效。<\/span><\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain\">第七條第二項第九款之實驗規範，應就第三條第一項所定事項擬訂，於該規範之範圍內，得不適用教育人員任用條例、教師法、國民教育法、高級中等教育法、專科學校法、大學法、私立學校法、技術及職業教育法、特殊教育法、學位授予法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。<\/div>\n<div class=\"doc-plain\">私立實驗教育學校之主管機關屬直轄市、縣(市)政府者，其實驗規範應報中央主管機關核定。<\/div>\n<div class=\"article-heading\">第 10 條<\/div>\n<div class=\"doc-plain\">第七條第一項之申請，應由各該主管機關於受理申請之日起三個月內作成決定，必要時得延長一次，並以三個月為限。<\/div>\n<div class=\"article-heading\">第 11 條<\/div>\n<div class=\"doc-plain\">實驗教育計畫結束六個月前，計畫主持人應提出結果報告，並得同時提出續辦之申請。<\/div>\n<div class=\"doc-plain\">前項實驗教育結果報告，應報各該主管機關送實驗教育審議會審議，並作為是否許可續辦之參考。<\/div>\n<div class=\"doc-plain\">第一項續辦之申請、審議及許可程序，準用第七條至前條規定。<\/div>\n<div class=\"article-heading\">第 12 條<\/div>\n<div class=\"doc-plain\">私立高級中等以下實驗教育學校聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可；其屬合格外國語文課程教師者，不受就業服務法第四十六條第二項及第四十八條第一項本文、第二項規定之限制。<\/div>\n<div class=\"doc-plain\">前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">依第一項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。<\/div>\n<div class=\"article-heading\">第 13 條<\/div>\n<div class=\"doc-plain\">實驗教育計畫經主管機關許可後，計畫主持人及學校校長以不變更為原則；計畫內容有變更之必要時，計畫主持人應於學年度開始六個月前，報各該主管機關送實驗教育審議會審議通過後，由主管機關同意變更。<\/div>\n<div class=\"chapter-heading\">第 三 章 私立實驗教育學校之許可<\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain\">學校法人及其他非營利之私法人，經各該主管機關許可辦理學校型態實驗教育，並符合下列各款規定之一者，得申請設立或改制私立實驗教育學校：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請設立或改制私立高級中等以下實驗教育學校者，應符合下列各目規定：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">招生對象為六歲至十八歲之學生。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">每年級學生人數不得超過五十人，自國民教育階段至高級中等教育階段學生總人數，不得超過六百人。但僅單獨辦理高級中等教育階段或國民中學教育階段者，其學生總人數，分別不得超過二百四十人，每年級學生不受五十人之限制。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">專任教師對學生人數之比例不低於一比十；其應有專任教師人數之一半，得以兼任教師折抵，兼任教師三人以專任教師一人計算。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">學生學習活動室內場地使用面積，每人不得少於一點五平方公尺，其面積不包括室內走廊及樓梯；學生學習活動室外面積，每人不得少於三平方公尺。但每人之樓地板總面積高於四平方公尺者，不在此限。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">申請設立或改制私立專科以上實驗教育學校者，應符合下列各目規定：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">招生對象：專科班或學士班為公、私立高級中等學校或同等學校畢業之學生，或具有同等學力之學生；碩士班為取得學士學位或具有同等學力之學生。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">自專科班階段至碩士班階段學生總人數，不得超過五百人。但僅單獨辦理專科班階段或碩士班階段者，其學生總人數，分別不得超過一百六十人；僅單獨辦理學士班階段，其學生總人數不得超過三百二十人。<\/span><\/div>\n<div class=\"doc-plain\">學校法人所設私立實驗教育學校，適用私立學校法之規定；其他非營利之私法人所設私立實驗教育學校，視同私立學校法所定私立學校，除本條例另有規定外，適用私立學校法之規定。<\/div>\n<div class=\"doc-plain\">學校法人組織及運作之監督，依私立學校法及其相關法規之規定；其他非營利之私法人組織及運作之監督，依各該法人設立許可法規之規定。<\/div>\n<div class=\"article-heading\">第 15 條<\/div>\n<div class=\"doc-plain\">學校法人申請設立或改制私立實驗教育學校，或其他非營利之私法人申請設立私立實驗教育學校，應由各該法人之代表人於學年度開始六個月前，擬具設校或改制計畫，向各該主管機關提出，經實驗教育審議會審議通過後，由各該主管機關許可其設立或改制。<\/div>\n<div class=\"doc-plain\">前項設校或改制計畫，應載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">設校或改制之時程。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">預定設校規劃或改制前學校狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">學校位置、面積及相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">規劃中或現有組織編制及班級師生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">法人登記證書。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">法人資產狀況及經會計師簽證之財務報表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">前三年學校經費概算及籌措方式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">法人之代表人、擬聘或現任之校長、教師及其他人員之相關資料或同意受聘意願書。<\/span><\/div>\n<div class=\"doc-plain\">第一項設立或改制計畫，得由申請人併同第七條實驗教育計畫向各該主管機關提出，經實驗教育審議會併同審議通過後，由各該主管機關許可。<\/div>\n<div class=\"article-heading\">第 16 條<\/div>\n<div class=\"doc-plain\">學校法人申請設立或改制私立實驗教育學校，或其他非營利之私法人申請設立私立實驗教育學校者，其校地、校舍及教學設備，應符合足夠進行實驗教育之基本教學及行政需求，不受高級中等以下學校及其分校分部設立變更停辦辦法及專科以上學校及其分校分部專科部技術型高級中等學校部設立變更停辦辦法之限制；私立專科以上實驗教育學校設校標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">前項校地及校舍，申請人應檢附所有權人同意該校於實驗教育實施期間內，得合法使用並經依法公證之證明文件。<\/div>\n<div class=\"doc-plain\">各該主管機關為鼓勵學校型態實驗教育之實施，得將公有之都市計畫學校用地或閒置之校地校舍，依相關法令提供私立實驗教育學校使用或租用。<\/div>\n<div class=\"doc-plain\">實驗教育學校租用土地之租期，依其實驗計畫期程，不適用私立學校法第三十六條第三項應至少承租三十年之規定。<\/div>\n<div class=\"chapter-heading\">第 四 章 評鑑、監督及獎勵<\/div>\n<div class=\"article-heading\">第 17 條<\/div>\n<div class=\"doc-plain\">各該主管機關應於實驗教育計畫期間，邀集實驗教育審議會委員組成評鑑小組辦理評鑑；其評鑑結果，併同實驗計畫成果報告書，作為申請續辦實驗教育計畫之參考。<\/div>\n<div class=\"doc-plain\">前項評鑑之實施期程、內容、程序、評鑑小組之組成、成員之資格及評鑑結果之處理等相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第 18 條<\/div>\n<div class=\"doc-plain\">私立專科以上實驗教育學校應建立教學品質保證機制，得定期接受國內或國外專業評鑑機構之評鑑或認可；其教學品質保證機制、評鑑、認可及相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">前項教學品質保證機制及獲得專業評鑑機構評鑑或認可之情形，應一併載明於招生簡章。<\/div>\n<div class=\"article-heading\">第 19 條<\/div>\n<div class=\"doc-plain\">私立實驗教育學校違反本條例或實驗教育計畫、經實驗教育評鑑結果辦理不善或有影響學生權益之情事時，各該主管機關應採取下列全部或部分措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">輔導。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">糾正。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">限期整頓改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">停止招生或減少招生人數。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">停辦實驗教育計畫。<\/span><\/div>\n<div class=\"doc-plain\">各該主管機關對私立實驗教育學校採取前項第四款或第五款之措施前，應先提請實驗教育審議會審議，並對就讀學生採取必要之補救措施。<\/div>\n<div class=\"doc-plain\">實驗教育計畫經停辦或不續辦之私立實驗教育學校，其為學校法人所設私立學校改制者，廢止其改制許可，恢復原有辦學型態；其為學校法人或其他非營利之私法人設立者，廢止其設立許可。<\/div>\n<div class=\"article-heading\">第 20 條<\/div>\n<div class=\"doc-plain\">私立實驗教育學校之實驗教育計畫經停辦或不續辦時，應依學生意願留校或輔導轉學，必要時得由各該主管機關分發學生至其他學校。<\/div>\n<div class=\"doc-plain\">學校法人或其他非營利之私法人依法解散時，各該主管機關應廢止其私立實驗教育學校之許可。<\/div>\n<div class=\"article-heading\">第 21 條<\/div>\n<div class=\"doc-plain\">私立實驗教育學校之實驗教育計畫經停辦或不續辦時，學校法人或其他非營利之私法人對於為辦理實驗教育進用之編制外職員及其他適用勞動基準法之人員終止契約者，應依勞動法規規定辦理；其對於為辦理實驗教育進用之編制外教師終止契約者，應依勞動法規規定計算標準數額給予補償。<\/div>\n<div class=\"article-heading\">第 22 條<\/div>\n<div class=\"doc-plain\">私立實驗教育學校經評鑑成績優良者，各該主管機關應予獎勵；實驗成果有推廣價值者，各該主管機關應定期舉行公開發表會、學術研討會或教學觀摩會，以分享實驗經驗。<\/div>\n<div class=\"chapter-heading\">第 五 章 附則<\/div>\n<div class=\"article-heading\">第 23 條<\/div>\n<div class=\"doc-plain\">公立學校經校務會議通過後得提出申請，或由各該主管機關指定所屬高級中等以下公立學校，以學校為範圍，依據特定教育理念，就行政運作、組織型態、設備設施、課程教學、學生入學、學習成就評量、學生事務及輔導等事項，辦理學校型態實驗教育，並準用第五條、第六條、第七條第一項、第二項第一款至第五款、第七款、第八款、第十一款、第十三款至第十七款、第三項、第八條、第十一條第一項、第二項、第十二條、第十四條第一項第一款第一目、第二目、第二款、第十七條、第二十條第一項、第二十一條及前條規定。<\/div>\n<div class=\"doc-plain\">原住民重點學校以外之公立學校辦理學校型態實驗教育，其學校總數，不得逾主管機關所屬同一教育階段總校數百分之五，不足一校者，以一校採計。但情況特殊，其實驗教育計畫於學年度開始六個月前逐案報中央主管機關審查核定者，不得逾同一教育階段總校數百分之十五。<\/div>\n<div class=\"doc-plain\">前項學校總數，不得逾全國同一教育階段總校數百分之十。<\/div>\n<div class=\"doc-plain\">公立學校辦理學校型態實驗教育，應就第一項所定事項擬訂實驗規範，報學校主管機關核轉中央主管機關核定；於實驗規範之範圍內，得不適用國民教育法、高級中等教育法、專科學校法、大學法、技術及職業教育法、特殊教育法、學位授予法、師資培育法、學生輔導法、國民體育法及其相關法規之部分規定，並應載明其不適用之相關規定。屬第二項但書情形者，併實驗教育計畫報送。<\/div>\n<div class=\"doc-plain\">公立學校辦理學校型態實驗教育，其校長之遴選、聘任程序，由各該主管機關依實際需要另定之；校長辦學績效卓著，其校務發展計畫經實驗教育審議會通過，並經各該主管機關校長遴選委員會同意者，得不受連任一次之限制。<\/div>\n<div class=\"doc-plain\">公立高級中等以下實驗教育學校，其校長得以具教育人員任用條例第四條、第五條或第六條資格之一者聘任之。<\/div>\n<div class=\"doc-plain\">公立學校辦理學校型態實驗教育，得依相關法規規定以契約方式進用編制外之教職員。<\/div>\n<div class=\"article-heading\">第 24 條<\/div>\n<div class=\"doc-plain\">非營利之私法人所設之非學校型態機構實驗教育，以原有場地及建築物，且學生人數符合原規定，依本條例申請改設立為私立高級中等以下實驗教育學校者，得於報各該主管機關許可後，繼續適用原建築物使用組別及其建築相關法令之規定。<\/div>\n<div class=\"article-heading\">第 25 條<\/div>\n<div class=\"doc-plain\">學校法人及其他非營利之私法人申請辦理學校型態實驗教育之許可條件、程序、實驗教育計畫之審查、續辦、改制或設立私立實驗教育學校之程序、許可之廢止、恢復原有辦學型態、監督、獎勵及其他應遵行事項之辦法，於高級中等以下教育階段，由各該主管機關定之；於專科以上教育階段，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">公立學校辦理學校型態實驗教育之條件、程序、實驗教育計畫之審查、變更、續辦、指定之廢止、恢復原有辦學型態、監督、獎勵及其他應遵行事項之辦法，於高級中等以下教育階段，由各該主管機關定之；於專科以上教育階段，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">各級主管機關得編列預算，對前二項實驗教育學校予以補助；其屬偏遠地區學校者，應優先補助。中央主管機關應依直轄市、縣(市)政府財力級次優予補助，並應專款專用。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關辦理實驗教育績效優良者，中央主管機關得予獎勵。<\/div>\n<div class=\"article-heading\">第 26 條<\/div>\n<div class=\"doc-plain\">各級主管機關得建置實驗教育網路平臺，舉辦說明會，提供多元選擇資訊，促進社會大眾之認知。<\/div>\n<div class=\"doc-plain\">實驗教育得與在地社區或組織合作，結合地方產業、地方創生活化教學，並得聘請業界專家協助教學。<\/div>\n<div class=\"article-heading\">第 27 條<\/div>\n<div class=\"doc-plain\">本條例施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第 28 條<\/div>\n<div class=\"doc-plain\">本條例自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國103年11月19日總統華總一義字第10300173321號令制定公布全文23條，自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國107年1月31日總統華總一義字第 10700009831號令修正公布全文 28 條；並自公布日施行。<\/div>"},{"title":"學校型態實驗教育實施條例施行細則","content":"第  1  條\n本細則依學校型態實驗教育實施條例(以下簡稱本條例)第二十七條規定訂定之。\n第  2  條\n本條例第二條第二項所稱主管機關，指私立實驗教育學校之學校主管機關。\n第  3  條\n本條例第四條第一項所定其他非營利之私法人，不包括政治團體或政黨。\n第  4  條\n本條例第五條所定學校型態實驗教育審議會(以下簡稱實驗教育審議會)，其決議應有委員總額過半數之出席，出席委員過半數之同意行之。但實驗教育審議會之議事相關規定有更嚴格之規定者，從其規定。\n第  5  條\n本條例第十九條第三項所稱恢復原有辦學型態，指回復至改制為私立實驗教育學校前，該私立學校原有之辦學型態。\n第  6  條\n本條例第二十三條第二項及第三項所定同一教育階段總校數，不包括原住民重點學校及私立學校之校數。\n第  7  條\n本條例中華民國一百零七年一月三十一日修正施行前，各該主管機關所屬公立學校型態實驗教育學校之校數已逾百分之五者，原辦理之公立學校型態實驗教育學校免依本條例第二十三條第二項但書規定報中央主管機關審查核定；本條例修正施行後，新辦理之公立學校型態實驗教育學校，仍應報中央主管機關審查核定。\n第  8  條\n依本條例第二十三條第七項規定，以契約方式進用編制外之教職員，適用勞動基準法之規定。\n第  9  條\n本細則自發布日施行。","history":"1.中華民國104年1月27日教育部臺教授國部字第 1040008221B號令訂定發布全文 8  條；並自學校型態實驗教育實施條例施行之日施行。\n2.中華民國106年2月17日教育部臺教授國部字第 1060006417B號令修正發布第 8  條條文；增訂第 7-1  條條文；並自發布日施行。\n3.中華民國107年10月2日教育部臺教授國部字第 1070105530B號令修正發布全文 9  條；並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本細則依學校型態實驗教育實施條例(以下簡稱本條例)第二十七條規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本條例第二條第二項所稱主管機關，指私立實驗教育學校之學校主管機關。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本條例第四條第一項所定其他非營利之私法人，不包括政治團體或政黨。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">本條例第五條所定學校型態實驗教育審議會(以下簡稱實驗教育審議會)，其決議應有委員總額過半數之出席，出席委員過半數之同意行之。但實驗教育審議會之議事相關規定有更嚴格之規定者，從其規定。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">本條例第十九條第三項所稱恢復原有辦學型態，指回復至改制為私立實驗教育學校前，該私立學校原有之辦學型態。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">本條例第二十三條第二項及第三項所定同一教育階段總校數，不包括原住民重點學校及私立學校之校數。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">本條例中華民國一百零七年一月三十一日修正施行前，各該主管機關所屬公立學校型態實驗教育學校之校數已逾百分之五者，原辦理之公立學校型態實驗教育學校免依本條例第二十三條第二項但書規定報中央主管機關審查核定；本條例修正施行後，新辦理之公立學校型態實驗教育學校，仍應報中央主管機關審查核定。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">依本條例第二十三條第七項規定，以契約方式進用編制外之教職員，適用勞動基準法之規定。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">本細則自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國104年1月27日教育部臺教授國部字第 1040008221B號令訂定發布全文 8  條；並自學校型態實驗教育實施條例施行之日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國106年2月17日教育部臺教授國部字第 1060006417B號令修正發布第 8  條條文；增訂第 7-1  條條文；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國107年10月2日教育部臺教授國部字第 1070105530B號令修正發布全文 9  條；並自發布日施行。<\/div>"},{"title":"高級中等以下教育階段非學校型態實驗教育實施條例","content":"第  1  條\n為保障學生學習權及家長教育選擇權，提供學校型態以外之其他教育方式及內容，落實教育基本法第八條第三項及第十三條規定，特制定本條例。\n第  2  條\n本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  3  條\n本條例所稱非學校型態實驗教育(以下簡稱實驗教育)，指學校教育以外，非以營利為目的，採用實驗課程，以培養德、智、體、群、美五育均衡發展之健全國民為目的所辦理之教育。\n具有國民小學、國民中學或高級中等學校入學資格者，得依本條例規定參與各該教育階段實驗教育；參與實驗教育者，視同各教育階段學校之學生。\n依本條例規定參與國民教育階段實驗教育之學生，視同接受同一教育階段之學校教育，不受強迫入學條例之規範。\n第  4  條\n實驗教育應依下列方式辦理：\n個人實驗教育：指為學生個人，在家庭或其他場所實施之實驗教育。\n團體實驗教育：指為三人以上學生，於共同時間及場所實施之實驗教育。\n機構實驗教育：指由學校財團法人以外之非營利法人(以下簡稱非營利法人)設立之機構，以實驗課程為主要目的，在固定場所實施之實驗教育。\n前項第二款團體實驗教育學生總人數，以三十人為限。\n第一項第三款機構實驗教育，每班學生人數不得超過二十五人，國民教育階段學生總人數不得超過二百五十人，高級中等教育階段學生總人數不得超過一百二十五人，且生師比不得高於十比一，並不得以學生之認知測驗結果或學校成績評量紀錄作為入學標準。\n第  5  條\n申請辦理實驗教育之方式及程序如下：\n個人實驗教育：由學生之法定代理人，向戶籍所在地直轄市、縣(市)主管機關提出。但學生已成年者，由其本人提出。\n團體實驗教育：由學生之法定代理人，共同或推派一人為代表，向團體成員設籍占最多數者之直轄市、縣(市)主管機關提出。但學生已成年者，由其本人，共同或推派一人為代表提出。\n機構實驗教育：由非營利法人之代表人，向擬設實驗教育機構所在地直轄市、縣(市)主管機關提出。\n直轄市、縣(市)主管機關應於每年二月底前，將申請辦理實驗教育之相關資訊，公告於其網頁上。\n第  6  條\n前條申請人應填具申請書，並檢附實驗教育計畫，至遲於每年四月三十日或十月三十一日前提出申請。\n前項申請書及實驗教育計畫，應分別載明下列事項：\n申請書：申請人、聯絡方式、實驗教育之對象及期程。\n實驗教育計畫：實驗教育之名稱、目的、方式、內容(包括課程所屬類型與教學、學習評量及預定使用學校設施、設備項目；身心障礙學生使用設施之需求，應予載明)、預期成效、計畫主持人及參與實驗教育人員之相關資料。\n申請辦理團體實驗教育者，除前項所定資料外，並應檢附下列資料：\n教學資源相關資料。\n教學場地同意使用證明文件。\n學生名冊。\n計畫經費來源及財務規劃。\n由申請人推派之代表提出申請者，應檢附其他申請人同意參與實驗教育之聲明書。\n申請辦理機構實驗教育者，除第二項所定資料外，並應檢附下列資料：\n法人及擬聘實驗教育機構負責人之相關資料。\n實驗教育機構名稱。\n實驗教育機構地址及位置略圖。\n實驗教育理念。\n教學資源及師資之相關資料。\n教學場地同意使用證明文件。\n計畫經費來源、財務規劃及收、退費規定。\n實驗教育計畫期程，應配合學校學期時間；國民小學教育階段最長為六年，國民中學教育階段最長為三年，高級中等教育階段最長為三年。\n前項高級中等教育階段實驗教育計畫期程，必要時得申請延長，以一次為限，其期間最長為二年。但學生因身心障礙、懷孕、分娩或撫育三歲以下子女而申請延長者，其期間最長為四年。\n完成國民教育階段實驗教育之學生，不得重行依本條例規定申請參與同一教育階段之實驗教育。\n實驗教育計畫有變更之必要時，申請人應檢具變更後之實驗教育計畫，向直轄市、縣(市)主管機關申請許可。但團體實驗教育之學生人數變更，其變更人數未達原核定學生數三分之一者，應將變更後之學生名冊報直轄市、縣(市)主管機關備查，免申請許可。\n申請書或實驗教育計畫不合規定之程式者，應通知申請人於十五日內補正；屆期未補正者，得不予許可。\n第  7  條\n於固定場所辦理團體實驗教育及機構實驗教育者，應符合下列規定：\n學生學習活動室內場地使用面積，每人不得少於一點五平方公尺，其面積不包括室內走廊及樓梯；機構實驗教育除應符合室內場地使用面積規定外，學生學習活動室外面積，每人不得少於三平方公尺，但機構實驗教育每人之樓地板總面積高於四平方公尺者，不在此限。\n教學場地，以地面以上一層至五層樓為原則。\n建築物應符合D-5使用組別及建築相關法令規定。但符合本款規定有困難或因教學型態有實際需求者，得專案報直轄市、縣(市)主管機關許可後，依許可內容辦理之，其許可使用類組，由中央主管機關另行公告之。\n教學場地應符合消防安全規定，總樓地板面積二百平方公尺以上者，應指派防火管理人。\n辦理團體實驗教育及機構實驗教育者，得依法申請使用公立學校之閒置空間，或經學校財團法人依法同意租、借私立學校之空餘空間；並不受前項第三款建築物使用組別之限制。\n各該主管機關為鼓勵非學校型態實驗教育之實施，得將公有之都市計畫學校用地或閒置之校地校舍，依相關法令提供團體實驗教育或機構實驗教育使用或租用。\n第  8  條\n實驗教育之理念，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，應以引導學生適性學習為目標。\n實驗教育之教學，應由實質具有與教學內容相關專長者擔任。\n實驗教育機構負責人聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可。\n前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。\n依第三項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。\n實驗教育之課程與教學、學習領域及教材教法，應依直轄市、縣(市)主管機關許可之實驗教育計畫所定內容實施，不受課程綱要之限制；學生學習評量，應依該許可之實驗教育計畫所定評量方式實施。\n第  9  條\n機構實驗教育應維護學生基本人權，積極營造友善之教育環境，並遵守下列事項：\n實施實驗教育，應事先徵得學生本人及其法定代理人之同意或載明於招生簡章中。\n學生本人及其法定代理人申請退出實驗教育者，不得拒絕之。\n學生不適應實驗教育時，應由機構提供必要之輔導，經評估確認仍不適應時，輔導其轉出。\n學生本人或其法定代理人申請瞭解學生學習狀況或實驗教育結果，機構應予告知或提供資料。\n無正當理由，不得於招生或教育過程中，使學生受差別待遇。\n不得洩漏學生個人資料及其他隱私。\n不得有虐待、疏忽照顧或其他傷害學生身心發展之行為。\n不得為其他侵害學生人權之行為。\n其他主管機關規定之事項。\n高級中等學校對於前項第三款轉入之學生，應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。\n第  10  條\n直轄市、縣(市)主管機關為審議實驗教育之申請、變更、續辦及其他相關事項，應組成非學校型態實驗教育審議會(以下簡稱審議會)，並得依個人、團體或機構實驗教育之屬性，分組審議。\n前項審議會置委員九人至二十一人，由直轄市、縣(市)主管機關就熟悉實驗教育之下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總人數五分之二；任一性別委員人數不得少於委員總人數三分之一：\n教育行政機關代表。\n具有會計、財務金融、法律或教育專業之專家、學者。\n校長及教師組織代表。\n具有實驗教育經驗之校長或教學人員。\n實驗教育家長代表、本人或子女曾接受實驗教育者。\n實驗教育相關團體代表。\n前項委員任期二年，其續聘以二次為限；每次聘任之委員中續聘之委員不得超過委員總數之三分之二。任期內出缺時，得補行聘(派)兼，其任期至原任期屆滿之日為止。\n實驗教育計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。\n審議會主席，由委員互推產生。\n審議會委員，均為無給職。\n第  11  條\n實驗教育之申請、變更、續辦或廢止許可，應經審議會之決議；審議會之決議，應有委員三分之二以上之出席，以出席委員過半數之同意行之。\n審議會開會時，屬個人實驗教育審議案件者，得邀請申請人列席陳述意見；屬團體實驗教育及機構實驗教育審議案件者，應邀請申請人或其推派提出申請之代表列席陳述意見；必要時，得邀請學生本人、設籍學校代表或學生之法定代理人列席。\n第  12  條\n審議會審議實驗教育計畫時，應考量下列因素：\n保障學生學習權及落實家長教育選擇權。\n計畫內容之合理性及可行性，並應符合第八條第一項規定。\n預期成效。\n前項實驗教育計畫為辦理團體實驗教育或機構實驗教育者，並應考量下列因素：\n申請人、實驗教育機構負責人、計畫主持人與參與實驗教育人員之資格及專業能力。\n計畫經費來源、財務規劃之健全性及收費規定之合理性。\n授課時間安排之適當性。\n第  13  條\n申請辦理個人或團體實驗教育者，經審議會審議通過後，由直轄市、縣(市)主管機關許可辦理；申請辦理機構實驗教育者，經審議會審議通過後，由直轄市、縣(市)主管機關許可籌設實驗教育機構辦理之。\n直轄市、縣(市)主管機關應自受理前項申請之日起算二個月內，作成許可與否之決定，必要時，得延長一個月，並通知申請人。\n第  14  條\n實驗教育機構之許可籌設期間，以一年為限；期間屆滿一個月前，得申請延長一年，並以一次為限。\n申請人應於前項許可籌設期間屆滿前，檢具下列資料，向直轄市、縣(市)主管機關申請實驗教育機構之立案許可，並由該主管機關發給立案證書：\n擬聘之教學人員與職員之名冊、學經歷證明及身分證明文件影本。\n教學場地之建築物合法使用執照。但使用公立學校校舍者，免附。\n前款建築物之所有權證明或租用、借用三年以上經公證之契約。但使用公立學校校舍者，免附。\n前項許可立案之機構名稱，應為某某實驗教育機構，並冠以直轄市、縣(市)之名稱，不得以實驗學校為名。\n實驗教育機構使用相同、近似或其他足以使一般民眾誤認為學校之名稱者，直轄市、縣(市)主管機關應令其變更之。\n直轄市、縣(市)主管機關應就第二項立案許可之申請，自受理申請之日起算一個月內，作成許可與否之決定。申請人檢具之資料不合規定之程式者，應通知申請人於十五日內補正；屆期未補正者，得不予許可。\n申請人於第一項許可籌設期間屆滿，仍未完成籌設，或其籌設活動涉有違法情事者，直轄市、縣(市)主管機關得廢止其籌設許可。\n第  15  條\n參與國民教育階段個人實驗教育之學生，其學籍設於原學區學校；參與團體實驗教育或機構實驗教育之學生，其學籍設於受理辦理實驗教育申請之直轄市、縣(市)主管機關指定之學校。\n直轄市、縣(市)主管機關許可辦理國民教育階段實驗教育後，應通知前項學校辦理學籍相關事宜。\n國民教育階段實驗教育之學生修業期滿成績及格者，由設籍學校發給畢業證書。\n國民教育階段因故停止實驗教育之學生，應返回設籍學校、戶籍所在學區學校或其他公、私立學校就讀；違反者，依強迫入學條例處理。\n國民教育階段實驗教育學生轉出、轉入之規定，由直轄市、縣(市)主管機關定之。\n國民教育階段實驗教育之學生返回學校就讀時，學校應給予必要之協助及輔導。\n國民教育階段實驗教育之學生參加需由學校推薦之各項競賽及活動，享有與其他學生相同之機會；設籍學校於學期初，應以書面提供家長相關競賽及活動資訊，屬臨時性競賽或活動者，學校得另行通知。\n國民教育階段實驗教育之學生得平等參與各類競賽。\n國民教育階段實驗教育之學生得申請使用設籍學校之設施、設備；其依規定應收費者，學校得減免之。\n設籍學校得依國民教育階段實驗教育學生之實際需要，向學生收取代收或代辦費。\n第  16  條\n依本條例參與高級中等教育階段實驗教育之學生，擬同時取得高級中等學校學籍者，應依高級中等學校多元入學招生辦法之規定入學，並由其法定代理人就課程與教學之實施、成績之評量、校內活動之參與、學雜費之收取及其他有關實驗教育之事項，與該學校擬訂合作計畫，經學校報主管機關許可後進行合作。但學生已成年者，該合作計畫由其本人與學校擬訂。\n前項學生修業期滿，依高級中等學校學生學習評量辦法或與學校之合作計畫所定評量方式評量；成績及格者，由設籍學校依高級中等教育法相關規定，發給畢業證書或修業證明書。\n第  17  條\n依本條例參與高級中等教育階段實驗教育之學生，未入學高級中等學校取得學籍者，得由其法定代理人就課程與教學之參與、成績之評量、校內活動之參加、費用收取及其他有關實驗教育之事項，與各類高級中等學校擬訂合作計畫，經學校報主管機關許可後進行合作。但學生已成年者，該合作計畫由其本人與學校擬訂。\n第  18  條\n依本條例參與高級中等教育階段實驗教育之學生，未入學高級中等學校取得學籍，得由辦理實驗教育之申請人造具參與實驗教育學生名冊，報請直轄市、縣(市)主管機關發給學生身分證明者，享有同一教育階段學校學生依法令所定之各項受教權益、福利及優惠措施，並據以平等參與各類競賽；其相關辦法，由中央主管機關定之。\n第  19  條\n依第十六條第一項規定取得學籍之學生，得依高級中等學校向學生收取費用辦法規定，向學校申請學費補助；依前二條規定未取得學籍之學生，得比照上開辦法有關私立學校學生之規定，依其實驗教育計畫內容，向直轄市、縣(市)主管機關申請核轉中央主管機關補助學費。\n辦理團體實驗教育者，應公開其收取費用之項目、數額及用途，並向參與之學生及家長說明。\n辦理機構實驗教育者，應於招生簡章載明每學年度向學生收取費用之項目、數額及用途，並於網路公告。\n第  20  條\n辦理個人實驗教育者，應於每學年度結束後二個月內，提出學生學習狀況報告書，為期三年以上之實驗計畫於計畫結束當學年應併提出實驗教育成果報告書，屬國民教育階段者，報直轄市、縣(市)主管機關備查；屬高級中等教育階段者，報直轄市、縣(市)主管機關核定。\n辦理團體實驗教育及機構實驗教育者，應於每學年度結束後二個月內，為期三年以上之實驗計畫於計畫結束當學年應併提出實驗教育成果報告書，屬國民教育階段者，報直轄市、縣(市)主管機關備查；屬高級中等教育階段者，報直轄市、縣(市)主管機關核定。\n參與高級中等教育階段實驗教育計畫總期程達一年半以上，且學習狀況報告書或年度報告書經核定者，直轄市、縣(市)主管機關應依申請，發給學生參與高級中等教育階段實驗教育證明。\n辦理機構實驗教育者於依第二項規定提出年度報告書時，應同時提出該年度預算書及年度決算表，報直轄市、縣(市)主管機關備查。\n第  21  條\n直轄市、縣(市)主管機關應於每學年度邀集審議會委員或委託相關學術團體、專業機構辦理個人實驗教育及團體實驗教育之訪視；於訪視前，應公布訪視項目，訪視後，應公布訪視結果；必要時，並得請參與或辦理實驗教育之學生、家長、團體進行成果發表。\n直轄市、縣(市)主管機關認有必要時，得請審議會指定委員攜帶證明文件，赴實驗教育機構進行訪視、調查，並得要求該機構之代表人或承辦人員提出報告或提供必要之文書資料及物品；或洽請有關機關協助執行。\n前二項訪視結果不佳者，直轄市、縣(市)主管機關應予以輔導，並令辦理實驗教育者限期改善，屆期未改善者，經審議會審議通過後，廢止其辦理實驗教育之許可；訪視結果優良者，得作為許可續辦之參考。\n第  22  條\n直轄市、縣(市)主管機關應於機構實驗教育計畫期滿三個月前，對機構實驗教育辦理成效評鑑；經評鑑通過者，得依第六條第一項所定期限，檢具實驗教育計畫成果報告書及後續之實驗教育計畫，向直轄市、縣(市)主管機關申請續辦。但有情況急迫之特殊情形者，實驗教育計畫主持人得於評鑑通過前，向直轄市、縣(市)主管機關提出續辦之申請。\n前項評鑑之實施期程、內容、程序、評鑑小組之組成、成員之資格、評鑑結果作成期限及評鑑結果之處理等相關事項之辦法，由中央主管機關定之。\n第一項續辦之申請、審議及許可，準用申請辦理實驗教育之規定。\n各級主管機關得編列預算，對實驗教育機構予以補助。中央主管機關應依直轄市、縣(市)政府財力級次予以補助，並應專款專用。\n第  23  條\n實驗教育之實施違反本條例或實驗教育計畫、經實驗教育評鑑結果辦理不善或有影響學生權益之情事者，直轄市、縣(市)主管機關應令其限期改善，屆期未改善者，經審議會審議通過後，廢止其辦理實驗教育之許可。\n第  24  條\n直轄市、縣(市)主管機關對學生、家長、團體或機構於申請、參與或辦理實驗教育之過程中，應提供必要之協助及輔導。\n第  25  條\n直轄市、縣(市)政府應結合社政、警政、衛生、教育、司法、民政、新聞等機關或單位，協助團體、機構實驗教育者建構兒童及少年保護家庭暴力與性侵害事件協助通報、救援與保護服務網絡，並邀集團體、機構實驗教育者，定期參與聯繫會報，加強橫向聯繫機制，檢討及改進合作模式。\n參與團體、機構實驗教育之學生有下列情形之一，依相關法規規定學校有通報義務者，該團體、機構應準用學校通報程序之規定協助辦理通報：\n有強迫入學條例及國民中小學中途輟學學生通報及復學輔導辦法規定之應入學未入學或中途輟學。\n有家庭暴力防治法規定之家庭暴力、性侵害犯罪防治法規定之性侵害犯罪、兒童及少年性剝削防制條例規定之兒童或少年性剝削、性別平等教育法規定之性侵害、性騷擾、性霸凌或人口販運防制法規定之人口販運。\n有社會救助法規定之社會救助需要、兒童及少年福利與權益保障法規定之發展遲緩、家庭遭遇經濟、教養、婚姻、醫療等問題致有未獲適當照顧之虞，或同法第五十三條第一項各款規定情形之一。\n為身心障礙者，有身心障礙者權益保障法第七十五條各款規定情形之一。\n其他法規規定學校有通報義務。\n直轄市、縣(市)政府應向團體、機構實驗教育者進行協助通報宣導及提供教育訓練，加強落實協助通報制度。\n直轄市、縣(市)政府應針對協助通報事項訂定保護措施，並針對未盡協助通報案件之調查，加強處理。\n協助通報人身分資料遭洩露致有安全之虞，直轄市、縣(市)政府應聯繫警察單位提供安全維護，並酌予心理諮商、訴訟扶助。\n第  26  條\n直轄市、縣(市)主管機關與設籍學校對參與實驗教育之特殊教育、原住民及低收入戶學生，應提供必要之資源及協助。\n第  27  條\n實驗教育機構得設學生家長會；其設置及運作方式，準用同一教育階段家長參與學校事務相關法規之規定。\n第  28  條\n直轄市、縣(市)主管機關於不牴觸本條例之範圍內，得訂定實驗教育之自治法規或補充規定。\n直轄市、縣(市)主管機關訂定前項實驗教育之自治法規或補充規定時，應邀請熟悉實驗教育之教育學者專家、實驗教育團體代表、家長、教師、學校行政人員代表及其他相關人士參與。\n第  29  條\n本條例施行前，已經直轄市、縣(市)主管機關許可辦理之實驗教育，於本條例施行後，得依原規定繼續辦理至計畫結束止。\n第  30  條\n依本條例參與實驗教育之學生，得依相關法規規定參加自學進修高級中等教育畢業程度學力鑑定考試。\n依本條例參與高級中等教育階段實驗教育之學生，符合下列情形之一，並持有直轄市、縣(市)主管機關發給之完成高級中等教育階段實驗教育證明者，得依相關法規規定，以同等學力報考大學：\n完成至少三年實驗教育。\n就讀高級中等學校及參與實驗教育時間合計至少三年。\n符合前項情形之一者，其實驗教育證明，應註明已修業完成高級中等教育階段教育。\n第  31  條\n本條例自公布日施行。","history":"1.103年11月19日總統華總一義字第10300173311號令制定公布全文30條；並自公布日施行。\n2.107年1月31日總統華總一義字第 10700009821號令修正公布全文31條；並自公布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">為保障學生學習權及家長教育選擇權，提供學校型態以外之其他教育方式及內容，落實教育基本法第八條第三項及第十三條規定，特制定本條例。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本條例所稱非學校型態實驗教育(以下簡稱實驗教育)，指學校教育以外，非以營利為目的，採用實驗課程，以培養德、智、體、群、美五育均衡發展之健全國民為目的所辦理之教育。<\/div>\n<div class=\"doc-plain\">具有國民小學、國民中學或高級中等學校入學資格者，得依本條例規定參與各該教育階段實驗教育；參與實驗教育者，視同各教育階段學校之學生。<\/div>\n<div class=\"doc-plain\">依本條例規定參與國民教育階段實驗教育之學生，視同接受同一教育階段之學校教育，不受強迫入學條例之規範。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">實驗教育應依下列方式辦理：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">個人實驗教育：指為學生個人，在家庭或其他場所實施之實驗教育。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">團體實驗教育：指為三人以上學生，於共同時間及場所實施之實驗教育。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">機構實驗教育：指由學校財團法人以外之非營利法人(以下簡稱非營利法人)設立之機構，以實驗課程為主要目的，在固定場所實施之實驗教育。<\/span><\/div>\n<div class=\"doc-plain\">前項第二款團體實驗教育學生總人數，以三十人為限。<\/div>\n<div class=\"doc-plain\">第一項第三款機構實驗教育，每班學生人數不得超過二十五人，國民教育階段學生總人數不得超過二百五十人，高級中等教育階段學生總人數不得超過一百二十五人，且生師比不得高於十比一，並不得以學生之認知測驗結果或學校成績評量紀錄作為入學標準。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">申請辦理實驗教育之方式及程序如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">個人實驗教育：由學生之法定代理人，向戶籍所在地直轄市、縣(市)主管機關提出。但學生已成年者，由其本人提出。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">團體實驗教育：由學生之法定代理人，共同或推派一人為代表，向團體成員設籍占最多數者之直轄市、縣(市)主管機關提出。但學生已成年者，由其本人，共同或推派一人為代表提出。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">機構實驗教育：由非營利法人之代表人，向擬設實驗教育機構所在地直轄市、縣(市)主管機關提出。<\/span><\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應於每年二月底前，將申請辦理實驗教育之相關資訊，公告於其網頁上。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">前條申請人應填具申請書，並檢附實驗教育計畫，至遲於每年四月三十日或十月三十一日前提出申請。<\/div>\n<div class=\"doc-plain\">前項申請書及實驗教育計畫，應分別載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請書：申請人、聯絡方式、實驗教育之對象及期程。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗教育計畫：實驗教育之名稱、目的、方式、內容(包括課程所屬類型與教學、學習評量及預定使用學校設施、設備項目；身心障礙學生使用設施之需求，應予載明)、預期成效、計畫主持人及參與實驗教育人員之相關資料。<\/span><\/div>\n<div class=\"doc-plain\">申請辦理團體實驗教育者，除前項所定資料外，並應檢附下列資料：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">教學資源相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">教學場地同意使用證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學生名冊。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">計畫經費來源及財務規劃。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">由申請人推派之代表提出申請者，應檢附其他申請人同意參與實驗教育之聲明書。<\/span><\/div>\n<div class=\"doc-plain\">申請辦理機構實驗教育者，除第二項所定資料外，並應檢附下列資料：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">法人及擬聘實驗教育機構負責人之相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗教育機構名稱。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">實驗教育機構地址及位置略圖。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">實驗教育理念。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">教學資源及師資之相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">教學場地同意使用證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">計畫經費來源、財務規劃及收、退費規定。<\/span><\/div>\n<div class=\"doc-plain\">實驗教育計畫期程，應配合學校學期時間；國民小學教育階段最長為六年，國民中學教育階段最長為三年，高級中等教育階段最長為三年。<\/div>\n<div class=\"doc-plain\">前項高級中等教育階段實驗教育計畫期程，必要時得申請延長，以一次為限，其期間最長為二年。但學生因身心障礙、懷孕、分娩或撫育三歲以下子女而申請延長者，其期間最長為四年。<\/div>\n<div class=\"doc-plain\">完成國民教育階段實驗教育之學生，不得重行依本條例規定申請參與同一教育階段之實驗教育。<\/div>\n<div class=\"doc-plain\">實驗教育計畫有變更之必要時，申請人應檢具變更後之實驗教育計畫，向直轄市、縣(市)主管機關申請許可。但團體實驗教育之學生人數變更，其變更人數未達原核定學生數三分之一者，應將變更後之學生名冊報直轄市、縣(市)主管機關備查，免申請許可。<\/div>\n<div class=\"doc-plain\">申請書或實驗教育計畫不合規定之程式者，應通知申請人於十五日內補正；屆期未補正者，得不予許可。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">於固定場所辦理團體實驗教育及機構實驗教育者，應符合下列規定：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學生學習活動室內場地使用面積，每人不得少於一點五平方公尺，其面積不包括室內走廊及樓梯；機構實驗教育除應符合室內場地使用面積規定外，學生學習活動室外面積，每人不得少於三平方公尺，但機構實驗教育每人之樓地板總面積高於四平方公尺者，不在此限。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">教學場地，以地面以上一層至五層樓為原則。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">建築物應符合D-5使用組別及建築相關法令規定。但符合本款規定有困難或因教學型態有實際需求者，得專案報直轄市、縣(市)主管機關許可後，依許可內容辦理之，其許可使用類組，由中央主管機關另行公告之。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">教學場地應符合消防安全規定，總樓地板面積二百平方公尺以上者，應指派防火管理人。<\/span><\/div>\n<div class=\"doc-plain\">辦理團體實驗教育及機構實驗教育者，得依法申請使用公立學校之閒置空間，或經學校財團法人依法同意租、借私立學校之空餘空間；並不受前項第三款建築物使用組別之限制。<\/div>\n<div class=\"doc-plain\">各該主管機關為鼓勵非學校型態實驗教育之實施，得將公有之都市計畫學校用地或閒置之校地校舍，依相關法令提供團體實驗教育或機構實驗教育使用或租用。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">實驗教育之理念，應以學生為中心，尊重學生之多元文化、信仰及多元智能，課程、教學、教材、教法或評量之規劃，應以引導學生適性學習為目標。<\/div>\n<div class=\"doc-plain\">實驗教育之教學，應由實質具有與教學內容相關專長者擔任。<\/div>\n<div class=\"doc-plain\">實驗教育機構負責人聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可。<\/div>\n<div class=\"doc-plain\">前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">依第三項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。<\/div>\n<div class=\"doc-plain\">實驗教育之課程與教學、學習領域及教材教法，應依直轄市、縣(市)主管機關許可之實驗教育計畫所定內容實施，不受課程綱要之限制；學生學習評量，應依該許可之實驗教育計畫所定評量方式實施。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">機構實驗教育應維護學生基本人權，積極營造友善之教育環境，並遵守下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實施實驗教育，應事先徵得學生本人及其法定代理人之同意或載明於招生簡章中。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學生本人及其法定代理人申請退出實驗教育者，不得拒絕之。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學生不適應實驗教育時，應由機構提供必要之輔導，經評估確認仍不適應時，輔導其轉出。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">學生本人或其法定代理人申請瞭解學生學習狀況或實驗教育結果，機構應予告知或提供資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">無正當理由，不得於招生或教育過程中，使學生受差別待遇。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">不得洩漏學生個人資料及其他隱私。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">不得有虐待、疏忽照顧或其他傷害學生身心發展之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">不得為其他侵害學生人權之行為。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">其他主管機關規定之事項。<\/span><\/div>\n<div class=\"doc-plain\">高級中等學校對於前項第三款轉入之學生，應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關為審議實驗教育之申請、變更、續辦及其他相關事項，應組成非學校型態實驗教育審議會(以下簡稱審議會)，並得依個人、團體或機構實驗教育之屬性，分組審議。<\/div>\n<div class=\"doc-plain\">前項審議會置委員九人至二十一人，由直轄市、縣(市)主管機關就熟悉實驗教育之下列人員聘(派)兼之，其中第四款至第六款之委員人數合計不得少於委員總人數五分之二；任一性別委員人數不得少於委員總人數三分之一：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">教育行政機關代表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">具有會計、財務金融、法律或教育專業之專家、學者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">校長及教師組織代表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">具有實驗教育經驗之校長或教學人員。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">實驗教育家長代表、本人或子女曾接受實驗教育者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">實驗教育相關團體代表。<\/span><\/div>\n<div class=\"doc-plain\">前項委員任期二年，其續聘以二次為限；每次聘任之委員中續聘之委員不得超過委員總數之三分之二。任期內出缺時，得補行聘(派)兼，其任期至原任期屆滿之日為止。<\/div>\n<div class=\"doc-plain\">實驗教育計畫涉及原住民族實驗教育者，應增聘具原住民身分之委員一人至二人；其委員人數及任期，不受前二項規定之限制。<\/div>\n<div class=\"doc-plain\">審議會主席，由委員互推產生。<\/div>\n<div class=\"doc-plain\">審議會委員，均為無給職。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">實驗教育之申請、變更、續辦或廢止許可，應經審議會之決議；審議會之決議，應有委員三分之二以上之出席，以出席委員過半數之同意行之。<\/div>\n<div class=\"doc-plain\">審議會開會時，屬個人實驗教育審議案件者，得邀請申請人列席陳述意見；屬團體實驗教育及機構實驗教育審議案件者，應邀請申請人或其推派提出申請之代表列席陳述意見；必要時，得邀請學生本人、設籍學校代表或學生之法定代理人列席。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">審議會審議實驗教育計畫時，應考量下列因素：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">保障學生學習權及落實家長教育選擇權。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">計畫內容之合理性及可行性，並應符合第八條第一項規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">預期成效。<\/span><\/div>\n<div class=\"doc-plain\">前項實驗教育計畫為辦理團體實驗教育或機構實驗教育者，並應考量下列因素：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請人、實驗教育機構負責人、計畫主持人與參與實驗教育人員之資格及專業能力。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">計畫經費來源、財務規劃之健全性及收費規定之合理性。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">授課時間安排之適當性。<\/span><\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">申請辦理個人或團體實驗教育者，經審議會審議通過後，由直轄市、縣(市)主管機關許可辦理；申請辦理機構實驗教育者，經審議會審議通過後，由直轄市、縣(市)主管機關許可籌設實驗教育機構辦理之。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應自受理前項申請之日起算二個月內，作成許可與否之決定，必要時，得延長一個月，並通知申請人。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">實驗教育機構之許可籌設期間，以一年為限；期間屆滿一個月前，得申請延長一年，並以一次為限。<\/div>\n<div class=\"doc-plain\">申請人應於前項許可籌設期間屆滿前，檢具下列資料，向直轄市、縣(市)主管機關申請實驗教育機構之立案許可，並由該主管機關發給立案證書：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">擬聘之教學人員與職員之名冊、學經歷證明及身分證明文件影本。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">教學場地之建築物合法使用執照。但使用公立學校校舍者，免附。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">前款建築物之所有權證明或租用、借用三年以上經公證之契約。但使用公立學校校舍者，免附。<\/span><\/div>\n<div class=\"doc-plain\">前項許可立案之機構名稱，應為某某實驗教育機構，並冠以直轄市、縣(市)之名稱，不得以實驗學校為名。<\/div>\n<div class=\"doc-plain\">實驗教育機構使用相同、近似或其他足以使一般民眾誤認為學校之名稱者，直轄市、縣(市)主管機關應令其變更之。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應就第二項立案許可之申請，自受理申請之日起算一個月內，作成許可與否之決定。申請人檢具之資料不合規定之程式者，應通知申請人於十五日內補正；屆期未補正者，得不予許可。<\/div>\n<div class=\"doc-plain\">申請人於第一項許可籌設期間屆滿，仍未完成籌設，或其籌設活動涉有違法情事者，直轄市、縣(市)主管機關得廢止其籌設許可。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">參與國民教育階段個人實驗教育之學生，其學籍設於原學區學校；參與團體實驗教育或機構實驗教育之學生，其學籍設於受理辦理實驗教育申請之直轄市、縣(市)主管機關指定之學校。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關許可辦理國民教育階段實驗教育後，應通知前項學校辦理學籍相關事宜。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育之學生修業期滿成績及格者，由設籍學校發給畢業證書。<\/div>\n<div class=\"doc-plain\">國民教育階段因故停止實驗教育之學生，應返回設籍學校、戶籍所在學區學校或其他公、私立學校就讀；違反者，依強迫入學條例處理。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育學生轉出、轉入之規定，由直轄市、縣(市)主管機關定之。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育之學生返回學校就讀時，學校應給予必要之協助及輔導。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育之學生參加需由學校推薦之各項競賽及活動，享有與其他學生相同之機會；設籍學校於學期初，應以書面提供家長相關競賽及活動資訊，屬臨時性競賽或活動者，學校得另行通知。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育之學生得平等參與各類競賽。<\/div>\n<div class=\"doc-plain\">國民教育階段實驗教育之學生得申請使用設籍學校之設施、設備；其依規定應收費者，學校得減免之。<\/div>\n<div class=\"doc-plain\">設籍學校得依國民教育階段實驗教育學生之實際需要，向學生收取代收或代辦費。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段實驗教育之學生，擬同時取得高級中等學校學籍者，應依高級中等學校多元入學招生辦法之規定入學，並由其法定代理人就課程與教學之實施、成績之評量、校內活動之參與、學雜費之收取及其他有關實驗教育之事項，與該學校擬訂合作計畫，經學校報主管機關許可後進行合作。但學生已成年者，該合作計畫由其本人與學校擬訂。<\/div>\n<div class=\"doc-plain\">前項學生修業期滿，依高級中等學校學生學習評量辦法或與學校之合作計畫所定評量方式評量；成績及格者，由設籍學校依高級中等教育法相關規定，發給畢業證書或修業證明書。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段實驗教育之學生，未入學高級中等學校取得學籍者，得由其法定代理人就課程與教學之參與、成績之評量、校內活動之參加、費用收取及其他有關實驗教育之事項，與各類高級中等學校擬訂合作計畫，經學校報主管機關許可後進行合作。但學生已成年者，該合作計畫由其本人與學校擬訂。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段實驗教育之學生，未入學高級中等學校取得學籍，得由辦理實驗教育之申請人造具參與實驗教育學生名冊，報請直轄市、縣(市)主管機關發給學生身分證明者，享有同一教育階段學校學生依法令所定之各項受教權益、福利及優惠措施，並據以平等參與各類競賽；其相關辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">依第十六條第一項規定取得學籍之學生，得依高級中等學校向學生收取費用辦法規定，向學校申請學費補助；依前二條規定未取得學籍之學生，得比照上開辦法有關私立學校學生之規定，依其實驗教育計畫內容，向直轄市、縣(市)主管機關申請核轉中央主管機關補助學費。<\/div>\n<div class=\"doc-plain\">辦理團體實驗教育者，應公開其收取費用之項目、數額及用途，並向參與之學生及家長說明。<\/div>\n<div class=\"doc-plain\">辦理機構實驗教育者，應於招生簡章載明每學年度向學生收取費用之項目、數額及用途，並於網路公告。<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">辦理個人實驗教育者，應於每學年度結束後二個月內，提出學生學習狀況報告書，為期三年以上之實驗計畫於計畫結束當學年應併提出實驗教育成果報告書，屬國民教育階段者，報直轄市、縣(市)主管機關備查；屬高級中等教育階段者，報直轄市、縣(市)主管機關核定。<\/div>\n<div class=\"doc-plain\">辦理團體實驗教育及機構實驗教育者，應於每學年度結束後二個月內，為期三年以上之實驗計畫於計畫結束當學年應併提出實驗教育成果報告書，屬國民教育階段者，報直轄市、縣(市)主管機關備查；屬高級中等教育階段者，報直轄市、縣(市)主管機關核定。<\/div>\n<div class=\"doc-plain\">參與高級中等教育階段實驗教育計畫總期程達一年半以上，且學習狀況報告書或年度報告書經核定者，直轄市、縣(市)主管機關應依申請，發給學生參與高級中等教育階段實驗教育證明。<\/div>\n<div class=\"doc-plain\">辦理機構實驗教育者於依第二項規定提出年度報告書時，應同時提出該年度預算書及年度決算表，報直轄市、縣(市)主管機關備查。<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應於每學年度邀集審議會委員或委託相關學術團體、專業機構辦理個人實驗教育及團體實驗教育之訪視；於訪視前，應公布訪視項目，訪視後，應公布訪視結果；必要時，並得請參與或辦理實驗教育之學生、家長、團體進行成果發表。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關認有必要時，得請審議會指定委員攜帶證明文件，赴實驗教育機構進行訪視、調查，並得要求該機構之代表人或承辦人員提出報告或提供必要之文書資料及物品；或洽請有關機關協助執行。<\/div>\n<div class=\"doc-plain\">前二項訪視結果不佳者，直轄市、縣(市)主管機關應予以輔導，並令辦理實驗教育者限期改善，屆期未改善者，經審議會審議通過後，廢止其辦理實驗教育之許可；訪視結果優良者，得作為許可續辦之參考。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應於機構實驗教育計畫期滿三個月前，對機構實驗教育辦理成效評鑑；經評鑑通過者，得依第六條第一項所定期限，檢具實驗教育計畫成果報告書及後續之實驗教育計畫，向直轄市、縣(市)主管機關申請續辦。但有情況急迫之特殊情形者，實驗教育計畫主持人得於評鑑通過前，向直轄市、縣(市)主管機關提出續辦之申請。<\/div>\n<div class=\"doc-plain\">前項評鑑之實施期程、內容、程序、評鑑小組之組成、成員之資格、評鑑結果作成期限及評鑑結果之處理等相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">第一項續辦之申請、審議及許可，準用申請辦理實驗教育之規定。<\/div>\n<div class=\"doc-plain\">各級主管機關得編列預算，對實驗教育機構予以補助。中央主管機關應依直轄市、縣(市)政府財力級次予以補助，並應專款專用。<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">實驗教育之實施違反本條例或實驗教育計畫、經實驗教育評鑑結果辦理不善或有影響學生權益之情事者，直轄市、縣(市)主管機關應令其限期改善，屆期未改善者，經審議會審議通過後，廢止其辦理實驗教育之許可。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關對學生、家長、團體或機構於申請、參與或辦理實驗教育之過程中，應提供必要之協助及輔導。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)政府應結合社政、警政、衛生、教育、司法、民政、新聞等機關或單位，協助團體、機構實驗教育者建構兒童及少年保護家庭暴力與性侵害事件協助通報、救援與保護服務網絡，並邀集團體、機構實驗教育者，定期參與聯繫會報，加強橫向聯繫機制，檢討及改進合作模式。<\/div>\n<div class=\"doc-plain\">參與團體、機構實驗教育之學生有下列情形之一，依相關法規規定學校有通報義務者，該團體、機構應準用學校通報程序之規定協助辦理通報：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">有強迫入學條例及國民中小學中途輟學學生通報及復學輔導辦法規定之應入學未入學或中途輟學。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">有家庭暴力防治法規定之家庭暴力、性侵害犯罪防治法規定之性侵害犯罪、兒童及少年性剝削防制條例規定之兒童或少年性剝削、性別平等教育法規定之性侵害、性騷擾、性霸凌或人口販運防制法規定之人口販運。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">有社會救助法規定之社會救助需要、兒童及少年福利與權益保障法規定之發展遲緩、家庭遭遇經濟、教養、婚姻、醫療等問題致有未獲適當照顧之虞，或同法第五十三條第一項各款規定情形之一。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">為身心障礙者，有身心障礙者權益保障法第七十五條各款規定情形之一。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他法規規定學校有通報義務。<\/span><\/div>\n<div class=\"doc-plain\">直轄市、縣(市)政府應向團體、機構實驗教育者進行協助通報宣導及提供教育訓練，加強落實協助通報制度。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)政府應針對協助通報事項訂定保護措施，並針對未盡協助通報案件之調查，加強處理。<\/div>\n<div class=\"doc-plain\">協助通報人身分資料遭洩露致有安全之虞，直轄市、縣(市)政府應聯繫警察單位提供安全維護，並酌予心理諮商、訴訟扶助。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關與設籍學校對參與實驗教育之特殊教育、原住民及低收入戶學生，應提供必要之資源及協助。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">實驗教育機構得設學生家長會；其設置及運作方式，準用同一教育階段家長參與學校事務相關法規之規定。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關於不牴觸本條例之範圍內，得訂定實驗教育之自治法規或補充規定。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關訂定前項實驗教育之自治法規或補充規定時，應邀請熟悉實驗教育之教育學者專家、實驗教育團體代表、家長、教師、學校行政人員代表及其他相關人士參與。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">本條例施行前，已經直轄市、縣(市)主管機關許可辦理之實驗教育，於本條例施行後，得依原規定繼續辦理至計畫結束止。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">依本條例參與實驗教育之學生，得依相關法規規定參加自學進修高級中等教育畢業程度學力鑑定考試。<\/div>\n<div class=\"doc-plain\">依本條例參與高級中等教育階段實驗教育之學生，符合下列情形之一，並持有直轄市、縣(市)主管機關發給之完成高級中等教育階段實驗教育證明者，得依相關法規規定，以同等學力報考大學：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">完成至少三年實驗教育。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">就讀高級中等學校及參與實驗教育時間合計至少三年。<\/span><\/div>\n<div class=\"doc-plain\">符合前項情形之一者，其實驗教育證明，應註明已修業完成高級中等教育階段教育。<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">本條例自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.103年11月19日總統華總一義字第10300173311號令制定公布全文30條；並自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.107年1月31日總統華總一義字第 10700009821號令修正公布全文31條；並自公布日施行。<\/div>"},{"title":"公立高級中等以下學校委託私人辦理實驗教育條例","content":"第  一  章  總則\n第  1  條\n為促進教育創新，鼓勵私人參與辦理公立高級中等以下學校(以下簡稱學校)實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展，落實教育基本法第十三條規定，特制定本條例。\n第  2  條\n本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  3  條\n本條例用詞，定義如下：\n委託私人辦理：指核准設立學校之主管機關(以下簡稱各該主管機關)，依學校辦學特性，針對學校土地、校舍、教學設備之使用、學區劃分、依法向學生收取之費用、課程、校長、教學人員與職員之人事管理、行政組織、員額編制、編班原則、教學評量、學校經費運用及學校評鑑等事項，與受託人簽訂行政契約，將學校之全部委託其辦理，或將學校之分校、分部、分班或可以明確劃分與區隔之一部分校地、校舍，於新設一所學校後委託其辦理。\n受託人：指受各該主管機關委託辦理學校之本國自然人、非營利之私法人或民間機構、團體。但學校財團法人及其設立之私立學校或短期補習班，不得為受託人。\n受託學校：指由受託人受各該主管機關委託辦理之學校，仍屬公立學校。\n前項第一款新設學校之設立條件，得不受各該教育階段設校相關法令規定之限制。\n第一項第二款自然人、私法人或民間機構、團體之代表人或負責人，不得有教育人員任用條例第三十一條第一項規定各款情事之一。\n第  4  條\n學校委託私人辦理，各該主管機關應提供同級同規模學校之教職員工員額編制之人事費、建築設備費及業務費予受託學校；人事費並應逐年依教職員工敘薪情形調整之。\n前項人事費，教師部分應以專任教師適用之基準編列之。\n受託學校對於前項費用，除人事費不得流入及資本支出不得流出外，得於各用途別科目間彈性運用。\n受託學校辦學應保障學生受教權，實踐國民基本教育之公益性、公共性、效能性、實驗性、多元性及創新性。\n第  5  條\n受託學校就學區劃分、依法向學生收取之費用、課程、校長、教學人員與職員之進用、行政組織、員額編制、編班原則及教學評量，得不適用下列法律與其相關法規及自治法規之規定：\n國民教育法第四條第二項、第五條第三項、第六條第一項、第二項、第八條第一項、第八條之二、第九條第一項至第五項、第十條第二項至第四項及第六項、第十二條、第十三條及第十八條。\n高級中等教育法第十四條、第十六條、第十八條、第十九條、第二十條第一項及第二項、第二十四條第一項、第三十條、第三十三條、第三十九條第一項、第四十三條第一項、第四十五條第一項及第二項、第四十六條、第四十八條、第四十九條及第五十六條第四項。\n教育人員任用條例第四條、第五條、第六條、第十二條、第十三條、第二十一條、第二十七條及第二十八條。\n前項不適用範圍及替代方案，各該主管機關應於與受託人簽訂之行政契約中定明。\n受託學校在教學人員聘任、招生、課程及教學方面，均應符合性別平等教育法規定之內涵。\n第  二  章  申請及審查程序\n第  6  條\n各該主管機關就學校委託私人辦理，應先邀請學者、專家、地方社區人士、家長或相關人士進行專案評估，並舉行公聽會。但就國民教育階段之原住民重點學校委託私人辦理，自然人、非營利之私法人或民間機構、團體，得經徵求設籍於該學區成年原住民二分之一以上書面同意後，送請各該主管機關進行專案評估，並舉行公聽會，各該主管機關不得拒絕。\n自然人、非營利之私法人或民間機構、團體，就特定學校委託私人辦理，得向各該主管機關申請核准由申請人進行專案評估，並舉行公聽會；申請人進行專案評估，並舉行公聽會後，應彙整專案評估及公聽會資料，報各該主管機關審核專案評估是否通過。\n各該主管機關計劃停辦或合併學校前，得依第一項規定進行專案評估，並舉行公聽會後，委託私人辦理。\n第  7  條\n前條之專案評估通過後，各該主管機關應公告委託資格、期間、權利義務、評選基準、申請期限及決定程序等相關資訊，受理申請。\n第  8  條\n前條申請，應提出經營計畫，載明下列事項：\n申請人為自然人者，其姓名及住所或居所；申請人為私法人或民間機構、團體者，其名稱及公務所、事務所或營業所。\n計畫執行期間。\n辦學目標、理念、特色及預期效益。\n依第五條第二項規定，擬不受限制之法規規定、理由及替代方案。\n擬聘校長之學、經歷及專長。\n擬訂行政組織及員額編制。\n人員進用方式及相關事項。\n課程規劃及教學設計。\n校園規劃、環境設計及教學設備計畫。\n招生對象、招生人數及班級數等招生計畫。\n近程、中程及長程財務規劃。\n各該主管機關所定其他相關事項。\n前項經營計畫，各該主管機關應送請相關學者專家初審，並依學校屬直轄市、縣(市)立或國立，分別經直轄市、縣(市)教育審議委員會或中央主管機關所組學校委託私人辦理審議會(以下合稱審議會)複審。複審通過後，由各該主管機關核准委託辦理後通知申請人，並刊登公報。\n直轄市、縣(市)教育審議委員會審議之經營計畫，其涉及原住民族教育事務者，應增聘具原住民身分之委員一人至二人參與審議；其涉及實驗教育者，應增聘熟悉實驗教育之委員一人至二人參與審議；委員依該審議之案件聘免，不受直轄市、縣(市)教育審議委員會原有委員原有總額及任期之限制。\n第  9  條\n申請人應自收受核准委託辦理通知之次日起一個月內，與各該主管機關簽訂行政契約，其內容，除經依前條第二項複審通過之經營計畫外，應包括下列事項：\n學校名稱及所在地。\n委託辦理期間。\n入學時間及學區劃分。\n各該主管機關應協助事項。\n雙方應負擔經費及辦理事項。\n具體績效指標。\n移轉管理標的。\n其他相關事項。\n第  10  條\n申請人應於簽訂行政契約後三個月內完成下列事項，報各該主管機關核定後，辦理學生入學：\n取得校長、教學人員及職員之同意受聘意願書。\n完成課程規劃、教學與活動設計及教學資源運用等教學準備。\n完成學生入學準備。\n受託人未於期限內完成前項事項者，得申請延長，最長不得逾三個月；屆期未完成者，各該主管機關得廢止核准，並解除契約。\n受託人認行政契約有變更必要時，應擬具修正草案，報各該主管機關同意後修正之；其涉及經營計畫之變更者，並應擬具經營計畫修正草案，報各該主管機關提審議會審議後，由各該主管機關核准變更。\n第  三  章  教職員工權利義務\n第  11  條\n各該主管機關就學校委託私人辦理前，原學校依教育人員、公務人員相關法規聘任、任用之現有編制內校長、教師及職員，於委託日隨同移轉至受託學校繼續聘任、任用者，仍具教育人員、公務人員身分；其任用、服務、懲戒、考績、訓練、進修、俸給、保險、保障、結社、退休、資遣、撫卹、福利及其他權益事項，依原適用之教育人員、公務人員相關法規辦理。\n前項繼續任用人員中，人事、會計人員之管理，與其他公務人員同。\n前二項繼續任用之公務人員，得依委託日前原適用之組織法規，依規定辦理陞遷及銓敘審定。\n第一項、第二項人員於退休、資遣後受聘於受託人者，依第十五條至第十八條規定辦理，並停止領受月退休金及停辦優惠存款。\n第  12  條\n前條第一項之原學校校長、教師及職員不願隨同移轉至受託學校者，應由各該主管機關先參酌其意願予以專案安置，或於委託日依其適用之法規辦理退休或資遣。\n第  13  條\n各該主管機關就學校委託私人辦理前，原學校依教育人員相關法規聘任、兼任編制外教學人員，於委託日隨同移轉至受託學校繼續聘任者，依原適用之教育人員任用條例規定適用至契約屆滿為止。\n第  14  條\n原學校適用勞動基準法之勞工於委託日隨同移轉至受託人者，其勞動條件及工作年資，應由受託人繼續予以承認；其不願隨同移轉者，應由原學校依法預告終止勞動契約，並依適用法律規定給付資遣費或退休金。\n原學校現有依工友管理要點(原事務管理規則)進用之工友(含技工、駕駛，以下簡稱原學校工友)於委託日得依原法規留用，或隨同移轉至受託人；隨同移轉至受託人者，於委託日依其適用之退休、資遣法令辦理退休、資遣，並改依受託學校人事管理規章辦理。\n前項原學校工友不願隨同移轉至受託人者，應由各該主管機關專案安置，其工作年資並應由安置機關(構)繼續予以承認。\n第  15  條\n受託人得依校務發展及辦學特色需要，聘請具特定領域專長人員擔任校長，具教育人員任用條例所定校長資格者，得優先聘任；其權利與義務，適用第十六條第二項規定。\n前項校長未具教育人員任用條例所定資格者，其權利與義務依有無具教師證書，分別適用第十六條第三項或第五項規定。\n第  16  條\n受託人得依校務發展及辦學特色需要，聘請具特定科目、領域專長人員擔任教學人員，具教師證書者，得優先聘任。\n具教師證書非屬第十一條第一項情形之編制內專任教師，其權利與義務，適用公立學校編制內教師相關法令。但加給、獎金與福利事項，各該主管機關與受託人，及受託學校與教師所定契約另有約定依受託學校人事管理規章為更有利之規定者，從其規定。\n具教師證書之編制外專任教師，依下列規定辦理：\n退休、撫卹、資遣、保險事項，依受託學校人事管理規章規定辦理，不適用公立學校教師相關法令。\n前款以外之權利與義務，適用公立學校編制內教師相關法令。但加給、獎金與福利事項，各該主管機關與受託人，及受託人與教師所定契約另有約定依受託學校人事管理規章為更有利之規定者，從其規定。\n受託學校教師，於受託學校依其所適用之法令辦理退休、撫卹、資遣、保險給付時，其曾任本條例公布施行前之任職年資採計，依所適用之法令規定辦理。\n不具教師證書之教學人員，其待遇與福利事項，依受託人與教學人員所定契約及受託學校人事管理規章辦理，其退休、撫卹、資遣、保險事項，不適用公立學校教師相關法令規定，其於取得教師證書並任教於公立學校時，職務等級相當且服務成績優良之年資，得在本職最高年功薪範圍內按年採計提敘薪級。\n其他公立學校現任教師經任職學校同意及各該主管機關許可者，得借調至受託學校擔任編制內校長或教師，其期間總計不得逾三年，待遇及福利，由受託學校支給，借調期滿回任原學校，原學校應保留職缺。\n前項借調期間，受託學校應依學校教職員退休條例規定，按月撥繳退撫基金。\n第  17  條\n受託人聘僱應經工作許可之外國人，從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作，得檢具相關文件，向中央主管機關申請許可；其屬合格外國語文課程教師者，不受就業服務法第四十六條第二項及第四十八條第一項本文、第二項規定之限制。\n前項外國人之教學資格、人數、每週從事相關工作時數、審查基準、申請許可、廢止許可、聘僱管理及其他相關事項之辦法，由中央主管機關定之。\n依第一項規定聘僱之外國人，其他聘僱管理，依就業服務法有關從事該法第四十六條第一項第一款至第六款工作者之規定辦理；其停留、居留及永久居留，依入出國及移民法規定辦理。\n第  18  條\n受託學校於受託日後，新進之職員，依受託人與其所定契約及受託學校人事管理規章辦理，不適用公務人員相關法規。\n第  19  條\n受託人應依受託學校規模，擬訂學校行政組織、人員配置及人事管理規章等重要章則，報各該主管機關核定。\n受託學校教師員額編制，不得低於公立學校之相關規定。\n受託學校所需之人事費，於支用第四條第一項各該主管機關所提供之人事費後仍有不足者，由受託人自籌，不得由其他用途別科目流入。\n受託學校之各項收入，應悉數用於教育活動及預算項目支出，不得為營利或其他非教育目的行為之支出。\n第  20  條\n受託人或其代表人、負責人、董事或校長之配偶、三親等血親、姻親，不得擔任受託學校之總務、會計、人事職務或工作；其擔任總務、會計或擔任人事職務之人員於簽約前或校長到任前已擔任者，應調整其職務或工作。\n前項違反規定進用之人員，各該主管機關應令受託人或校長立即解除其職務；受託人或校長未立即辦理者，各該主管機關得逕予解除其職務。\n第 四 章 招生、班級學生人數及教學設備\n第 21 條  公立國民小學及國民中學委託私人辦理者，直轄市、縣(市)主管機關與受託人訂定行政契約劃分學區時，得納入其他學區，不受原學校所屬學區之限制；其報名入學學生過多時，以設籍先後或抽籤方式決定其入學優先順序。\n前項學區，直轄市、縣(市)主管機關得因社區發展、人口變動、交通狀況、學校環境等因素考量，於舉行公聽會後變更契約調整之。\n學區學生不願就讀受託學校，直轄市、縣(市)主管機關應協助家長依其意願辦理學生轉入鄰近學校就讀，直轄市、縣(市)主管機關應補助其交通費；轉入學校應視實際需要對學生進行生活及學習輔導，並應考量其特殊性，就原於實驗教育修習之學分，依相關規定從寬予以採認抵免。\n第  22  條\n受託學校之班級學生人數，不得高於公立學校之相關規定；其教學設備依公立學校相關規定，但經各該主管機關核准者，不在此限。\n第  五  章  評鑑、獎勵及輔導\n第  23  條\n各該主管機關應組成評鑑小組，定期或不定期對受託學校實施評鑑及輔導。\n前項評鑑得委託相關學術機構或團體辦理，並於評鑑前公布評鑑項目、評鑑方式等相關事項，於評鑑後公布評鑑結果。評鑑時，得邀請家長陳述意見。評鑑優良者，得予獎勵；評鑑未達標準者，得以書面糾正、限期改善，並接受複評。複評未通過，各該主管機關應再限期改善。\n前項評鑑、獎勵及輔導辦法，由各該主管機關定之。\n各級主管機關得編列預算，對學校予以補助。中央主管機關應依直轄市、縣(市)政府財力級次予以補助，並應專款專用。\n第  24  條\n前條評鑑優良者，於委託辦理期間屆滿時，各該主管機關得優先續約。\n第  六  章  續約、接續辦理、契約終止及期滿之處理\n第  25  條\n受託人於委託辦理期間屆滿有意繼續經營者，應於委託辦理期間屆滿一年前提出辦學績效、財務報告、學校評鑑報告、後續經營計畫等，向各該主管機關申請續約。\n第  26  條\n受託人於委託辦理期間屆滿依前條規定申請續約未獲同意、無意願續約，或經依第二十七條、第二十八條第二項規定終止契約者，由各該主管機關接續辦理，並指派適當人員代理校長處理校務，代理至新任校長遴選接任為止；代理校長之指派，不適用公立學校校長遴選之相關規定。\n前項情形，除委託契約另有訂定者外，受託人應將受託學校之各類財產、經營權、學生學籍資料、校務檔案等迅速移交各該主管機關。\n前二項接續辦理之相關事項，由各該主管機關訂定法規及自治法規辦理之。\n第  27  條\n有下列各款情事之一者，各該主管機關應提經審議會決議後，終止委託契約：\n受託人或受託學校從事營利或違法行為。\n受託人或受託學校發生財務困難，致影響學校正常運作及損及學生權益。\n受託學校發生其他足以嚴重影響學校經營及學生權益之情事。\n受託學校依第二十三條規定，經複評未通過者，經各該主管機關再限期改善，屆期仍未改善。\n審議會於作出前項決議前，應召開公聽會，邀請受託學校之教師、學生及家長參與。\n第  28  條\n各該主管機關於委託辦理期間屆滿前終止契約者，應於該學年度結束時為之。但有前條各款情事之一者，不在此限。\n受託人因經營不善終止契約、依委託契約所定或行政程序法規定得終止契約者，應於學年度結束六個月前，向各該主管機關申請，提經審議會決議後，由各該主管機關終止委託契約。\n第  29  條\n因契約終止或屆滿之受託國民小學或國民中學學生，有轉出需求者，直轄市、縣(市)主管機關應參酌家長意願，協助就近轉入未招滿額學校就學。\n第  30  條\n委託辦理期間屆滿，受託人未與各該主管機關續約者，其依第十一條第一項規定隨同移轉至受託學校之教師及職員及依第十六條第二項適用公立學校教師相關法令之編制內教師，除辦理資遣或退休者外，由原學校繼續任用。\n前項以外之教學人員及職員，除辦理資遣或退休者外，應由受託人自行負責處理。\n第  七  章  罰則\n第  31  條\n受託人或校長違反第二十條第一項規定者，由各該主管機關處新臺幣五萬元以上二十萬元以下罰鍰；其同時違反公職人員利益衝突迴避法者，優先適用該法處罰。\n第  八  章  附則\n第  32  條\n本條例施行前已依原法規規定委託辦理之學校，得依原契約約定辦理至期間屆滿為止；期間屆滿後，應依本條例辦理。\n第  33  條\n本條例施行細則，由中央主管機關定之。\n第  34  條\n本條例自公布日施行。","history":"1.中華民國103年11月26日總統華總一義字第10300177151 號令制定公布33條；施行日期由行政院定之。\n2.中華民國104年2月14日臺教授國字第 1040009842 號令行政院定自104年1月1日施行。\n3.中華民國107年1月31日總統華總一義字第10700011081 號令修正公布名稱及全文 34 條；並自公布日施行。\n4. 中華民國110年12月22日總統華總一義字第 11000114001號令修正公布第4、6條條文。","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條 <\/div>\n<div class=\"doc-plain\">為促進教育創新，鼓勵私人參與辦理公立高級中等以下學校(以下簡稱學校)實驗教育，以保障人民學習及受教育權利，增加人民選擇教育方式與內容之機會，促進教育多元化發展，落實教育基本法第十三條規定，特制定本條例。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本條例用詞，定義如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">委託私人辦理：指核准設立學校之主管機關(以下簡稱各該主管機關)，依學校辦學特性，針對學校土地、校舍、教學設備之使用、學區劃分、依法向學生收取之費用、課程、校長、教學人員與職員之人事管理、行政組織、員額編制、編班原則、教學評量、學校經費運用及學校評鑑等事項，與受託人簽訂行政契約，將學校之全部委託其辦理，或將學校之分校、分部、分班或可以明確劃分與區隔之一部分校地、校舍，於新設一所學校後委託其辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">受託人：指受各該主管機關委託辦理學校之本國自然人、非營利之私法人或民間機構、團體。但學校財團法人及其設立之私立學校或短期補習班，不得為受託人。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">受託學校：指由受託人受各該主管機關委託辦理之學校，仍屬公立學校。<\/span><\/div>\n<div class=\"doc-plain\">前項第一款新設學校之設立條件，得不受各該教育階段設校相關法令規定之限制。<\/div>\n<div class=\"doc-plain\">第一項第二款自然人、私法人或民間機構、團體之代表人或負責人，不得有教育人員任用條例第三十一條第一項規定各款情事之一。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">學校委託私人辦理，各該主管機關應提供同級同規模學校之教職員工員額編制之人事費、建築設備費及業務費予受託學校；人事費並應逐年依教職員工敘薪情形調整之。<\/div>\n<div class=\"doc-plain\">前項人事費，教師部分應以專任教師適用之基準編列之。<\/div>\n<div class=\"doc-plain\">受託學校對於前項費用，除人事費不得流入及資本支出不得流出外，得於各用途別科目間彈性運用。<\/div>\n<div class=\"doc-plain\">受託學校辦學應保障學生受教權，實踐國民基本教育之公益性、公共性、效能性、實驗性、多元性及創新性。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">受託學校就學區劃分、依法向學生收取之費用、課程、校長、教學人員與職員之進用、行政組織、員額編制、編班原則及教學評量，得不適用下列法律與其相關法規及自治法規之規定：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">國民教育法第四條第二項、第五條第三項、第六條第一項、第二項、第八條第一項、第八條之二、第九條第一項至第五項、第十條第二項至第四項及第六項、第十二條、第十三條及第十八條。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">高級中等教育法第十四條、第十六條、第十八條、第十九條、第二十條第一項及第二項、第二十四條第一項、第三十條、第三十三條、第三十九條第一項、第四十三條第一項、第四十五條第一項及第二項、第四十六條、第四十八條、第四十九條及第五十六條第四項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">教育人員任用條例第四條、第五條、第六條、第十二條、第十三條、第二十一條、第二十七條及第二十八條。<\/span><\/div>\n<div class=\"doc-plain\">前項不適用範圍及替代方案，各該主管機關應於與受託人簽訂之行政契約中定明。<\/div>\n<div class=\"doc-plain\">受託學校在教學人員聘任、招生、課程及教學方面，均應符合性別平等教育法規定之內涵。<\/div>\n<div class=\"chapter-heading\">第  二  章  申請及審查程序<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">各該主管機關就學校委託私人辦理，應先邀請學者、專家、地方社區人士、家長或相關人士進行專案評估，並舉行公聽會。但就國民教育階段之原住民重點學校委託私人辦理，自然人、非營利之私法人或民間機構、團體，得經徵求設籍於該學區成年原住民二分之一以上書面同意後，送請各該主管機關進行專案評估，並舉行公聽會，各該主管機關不得拒絕。<\/div>\n<div class=\"doc-plain\">自然人、非營利之私法人或民間機構、團體，就特定學校委託私人辦理，得向各該主管機關申請核准由申請人進行專案評估，並舉行公聽會；申請人進行專案評估，並舉行公聽會後，應彙整專案評估及公聽會資料，報各該主管機關審核專案評估是否通過。<\/div>\n<div class=\"doc-plain\">各該主管機關計劃停辦或合併學校前，得依第一項規定進行專案評估，並舉行公聽會後，委託私人辦理。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">前條之專案評估通過後，各該主管機關應公告委託資格、期間、權利義務、評選基準、申請期限及決定程序等相關資訊，受理申請。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">前條申請，應提出經營計畫，載明下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請人為自然人者，其姓名及住所或居所；申請人為私法人或民間機構、團體者，其名稱及公務所、事務所或營業所。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">計畫執行期間。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">辦學目標、理念、特色及預期效益。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">依第五條第二項規定，擬不受限制之法規規定、理由及替代方案。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">擬聘校長之學、經歷及專長。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">擬訂行政組織及員額編制。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">人員進用方式及相關事項。<\/span><\/div>\n<div class=\"doc-row doc-leve
