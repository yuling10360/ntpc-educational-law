n直轄市、縣（市）主管機關應於機構實驗教育計畫（以下簡稱實驗教育計畫）期滿一年前，辦理實驗教育計畫成效評鑑（以下簡稱成效評鑑）協調會，就成效評鑑之人員、內容、期日、期程、實施方式，與實驗教育計畫主持人（以下簡稱計畫主持人）及實驗教育機構協調並達成共識。\n計畫主持人應於實驗教育計畫期滿六個月前，依成效評鑑內容，檢附自我評鑑報告書，送直轄市、縣（市）主管機關辦理成效評鑑。\n直轄市、縣（市）主管機關應於收受自我評鑑報告書後二個月內完成評鑑，必要時得延長一次，最長不得逾一個月。\n實驗教育計畫期滿，不擬申請續辦者，仍應依本辦法規定接受成效評鑑。\n第  四  條\n成效評鑑應包括下列內容：\n一、實驗教育計畫之執行。\n二、學生權益之維護。\n三、學生學習之發展。\n四、財務之透明健全。\n五、相關法規之遵循。\n六、其他主管機關會商實驗教育機構後，規定與實驗教育相關之事項。\n第  五  條\n直轄市、縣（市）主管機關得自行或委託公、私立大學、經核准立案\n之學術團體或專業評鑑機構（以下均簡稱評鑑單位）組成評鑑小組辦理成\n效評鑑。\n前項所定學術團體或專業評鑑機構，應符合下列條件：\n一、經核准立案之全國性學術團體或經核准立案且設立宗旨與教育事業相關之全國性民間團體或專業機構。\n二、有專業客觀之評鑑實施計畫，包括足夠之評鑑領域專家學者、完善之評鑑成員遴選與培訓制度、足夠之行政人員及健全之組織及會計制度。\n第  六  條\n評鑑小組應就計畫主持人提出之自我評鑑報告書，進行書面審查及實地評鑑。\n前項實地評鑑，由評鑑小組成員前往受評鑑之實驗教育機構，以資料檢閱、參觀設施、觀察與訪談、綜合座談或其他方式為之，並於一個月內作成評鑑報告書，送直轄市、縣（市）主管機關之非學校型態實驗教育審議會（以下簡稱審議會）審議。\n實地評鑑時，評鑑小組成員應親自出席，不得代理。\n第  七  條\n評鑑小組成員三人至七人，由直轄市、縣（市）主管機關或評鑑單位邀集審議會委員及實驗教育學者、專家組成。\n第  八  條\n評鑑小組成員及參與評鑑之相關人員，與受評鑑之實驗教育機構間，不得有下列情形之一：\n一、有行政程序法第三十二條第一款至第四款及第三十三條第一項第二款規定之迴避事由。\n二、曾參與該實驗教育計畫之執行。\n三、其他有具體事實經主管機關認定於執行職務有偏頗之虞者。評鑑小組成員及參與評鑑相關人員，對評鑑工作所獲取之各項資訊，應負保密義務。\n第  九  條\n成效評鑑結果，分為通過、待改善及不通過三種。\n第  十  條\n成效評鑑結果為通過者，計畫主持人得依本條例第六條第一項所定期限，檢具實驗教育計畫成果報告書及後續之實驗教育計畫，向直轄市、縣（市）主管機關申請續辦。但成效評鑑結果有第十二條第二項規定之情形者，不受本條例第六條第一項所定期限之限制。\n第 十一 條\n成效評鑑結果為待改善者，直轄市、縣（市）主管機關得令計畫主持人限期改善，屆期未改善完成者，成效評鑑結果為不通過。\n成效評鑑結果為待改善或不通過者，計畫主持人得於通知送達之次日起十五日內，向直轄市、縣（市）主管機關申復，並以一次為限。\n直轄市、縣（市）主管機關收受前項申復後，除原評鑑程序或事實認定有嚴重瑕疵應重新評鑑外，應於二十日內回復處理結果；其申復結果為不通過者，不得申請續辦；已申請續辦者，並應駁回其續辦之申請。\n第 十二 條\n直轄市、縣（市）主管機關至遲應於實驗教育計畫期滿三個月前，將審議會審議之成效評鑑結果，通知計畫主持人及實驗教育機構；評鑑結果為通過者予以公告，評鑑結果為待改善及不通過者，得延至申復獲致結果後公告。\n前項成效評鑑結果因故無法於實驗教育計畫期滿三個月前通知，或有情況急迫之特殊情形者，計畫主持人得依本條例第二十二條第一項但書規定，於評鑑通過前，先向直轄市、縣（市）主管機關提出續辦之申請。\n第 十三 條\n計畫主持人不服成效評鑑結果者，應於不服直轄市、縣（市）主管機關駁回續辦申請而依法提起訴願時，一併主張之。\n第 十四 條\n本辦法自發布日施行。","history":"1.中華民國104年06月23日教育部臺教授國部字第 1040063385B 號令訂定發布全文12條；並自發布日施行。\n2.中華民國107年10月03日教育部臺教授國部字第 1070107860B 號令修正發布全文14條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  一  條<\/div>\n<div class=\"doc-plain\">本辦法依高級中等以下教育階段非學校型態實驗教育實施條例（以下簡稱本條例）第二十二條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第  二  條<\/div>\n<div class=\"doc-plain\">依本辦法所辦理之成效評鑑，應具有協調溝通之精神，以引導、協助及促進實驗教育機構落實實驗教育理念為目的。<\/div>\n<div class=\"article-heading\">第  三  條<\/div>\n<div class=\"doc-plain\">直轄市、縣（市）主管機關應於機構實驗教育計畫（以下簡稱實驗教育計畫）期滿一年前，辦理實驗教育計畫成效評鑑（以下簡稱成效評鑑）協調會，就成效評鑑之人員、內容、期日、期程、實施方式，與實驗教育計畫主持人（以下簡稱計畫主持人）及實驗教育機構協調並達成共識。<\/div>\n<div class=\"doc-plain\">計畫主持人應於實驗教育計畫期滿六個月前，依成效評鑑內容，檢附自我評鑑報告書，送直轄市、縣（市）主管機關辦理成效評鑑。<\/div>\n<div class=\"doc-plain\">直轄市、縣（市）主管機關應於收受自我評鑑報告書後二個月內完成評鑑，必要時得延長一次，最長不得逾一個月。<\/div>\n<div class=\"doc-plain\">實驗教育計畫期滿，不擬申請續辦者，仍應依本辦法規定接受成效評鑑。<\/div>\n<div class=\"article-heading\">第  四  條<\/div>\n<div class=\"doc-plain\">成效評鑑應包括下列內容：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗教育計畫之執行。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">學生權益之維護。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">學生學習之發展。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">財務之透明健全。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">相關法規之遵循。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">其他主管機關會商實驗教育機構後，規定與實驗教育相關之事項。<\/span><\/div>\n<div class=\"article-heading\">第  五  條<\/div>\n<div class=\"doc-plain doc-continuation\">直轄市、縣（市）主管機關得自行或委託公、私立大學、經核准立案<\/div>\n<div class=\"doc-plain doc-continuation\">之學術團體或專業評鑑機構（以下均簡稱評鑑單位）組成評鑑小組辦理成<\/div>\n<div class=\"doc-plain doc-continuation\">效評鑑。<\/div>\n<div class=\"doc-plain doc-continuation\">前項所定學術團體或專業評鑑機構，應符合下列條件：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">經核准立案之全國性學術團體或經核准立案且設立宗旨與教育事業相關之全國性民間團體或專業機構。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">有專業客觀之評鑑實施計畫，包括足夠之評鑑領域專家學者、完善之評鑑成員遴選與培訓制度、足夠之行政人員及健全之組織及會計制度。<\/span><\/div>\n<div class=\"article-heading\">第  六  條<\/div>\n<div class=\"doc-plain doc-continuation\">評鑑小組應就計畫主持人提出之自我評鑑報告書，進行書面審查及實地評鑑。<\/div>\n<div class=\"doc-plain doc-continuation\">前項實地評鑑，由評鑑小組成員前往受評鑑之實驗教育機構，以資料檢閱、參觀設施、觀察與訪談、綜合座談或其他方式為之，並於一個月內作成評鑑報告書，送直轄市、縣（市）主管機關之非學校型態實驗教育審議會（以下簡稱審議會）審議。<\/div>\n<div class=\"doc-plain doc-continuation\">實地評鑑時，評鑑小組成員應親自出席，不得代理。<\/div>\n<div class=\"article-heading\">第  七  條<\/div>\n<div class=\"doc-plain doc-continuation\">評鑑小組成員三人至七人，由直轄市、縣（市）主管機關或評鑑單位邀集審議會委員及實驗教育學者、專家組成。<\/div>\n<div class=\"article-heading\">第  八  條<\/div>\n<div class=\"doc-plain doc-continuation\">評鑑小組成員及參與評鑑之相關人員，與受評鑑之實驗教育機構間，不得有下列情形之一：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">有行政程序法第三十二條第一款至第四款及第三十三條第一項第二款規定之迴避事由。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">曾參與該實驗教育計畫之執行。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">其他有具體事實經主管機關認定於執行職務有偏頗之虞者。評鑑小組成員及參與評鑑相關人員，對評鑑工作所獲取之各項資訊，應負保密義務。<\/span><\/div>\n<div class=\"article-heading\">第  九  條<\/div>\n<div class=\"doc-plain doc-continuation\">成效評鑑結果，分為通過、待改善及不通過三種。<\/div>\n<div class=\"article-heading\">第  十  條<\/div>\n<div class=\"doc-plain doc-continuation\">成效評鑑結果為通過者，計畫主持人得依本條例第六條第一項所定期限，檢具實驗教育計畫成果報告書及後續之實驗教育計畫，向直轄市、縣（市）主管機關申請續辦。但成效評鑑結果有第十二條第二項規定之情形者，不受本條例第六條第一項所定期限之限制。<\/div>\n<div class=\"article-heading\">第 十一 條<\/div>\n<div class=\"doc-plain doc-continuation\">成效評鑑結果為待改善者，直轄市、縣（市）主管機關得令計畫主持人限期改善，屆期未改善完成者，成效評鑑結果為不通過。<\/div>\n<div class=\"doc-plain doc-continuation\">成效評鑑結果為待改善或不通過者，計畫主持人得於通知送達之次日起十五日內，向直轄市、縣（市）主管機關申復，並以一次為限。<\/div>\n<div class=\"doc-plain doc-continuation\">直轄市、縣（市）主管機關收受前項申復後，除原評鑑程序或事實認定有嚴重瑕疵應重新評鑑外，應於二十日內回復處理結果；其申復結果為不通過者，不得申請續辦；已申請續辦者，並應駁回其續辦之申請。<\/div>\n<div class=\"article-heading\">第 十二 條<\/div>\n<div class=\"doc-plain doc-continuation\">直轄市、縣（市）主管機關至遲應於實驗教育計畫期滿三個月前，將審議會審議之成效評鑑結果，通知計畫主持人及實驗教育機構；評鑑結果為通過者予以公告，評鑑結果為待改善及不通過者，得延至申復獲致結果後公告。<\/div>\n<div class=\"doc-plain doc-continuation\">前項成效評鑑結果因故無法於實驗教育計畫期滿三個月前通知，或有情況急迫之特殊情形者，計畫主持人得依本條例第二十二條第一項但書規定，於評鑑通過前，先向直轄市、縣（市）主管機關提出續辦之申請。<\/div>\n<div class=\"article-heading\">第 十三 條<\/div>\n<div class=\"doc-plain doc-continuation\">計畫主持人不服成效評鑑結果者，應於不服直轄市、縣（市）主管機關駁回續辦申請而依法提起訴願時，一併主張之。<\/div>\n<div class=\"article-heading\">第 十四 條<\/div>\n<div class=\"doc-plain doc-continuation\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國104年06月23日教育部臺教授國部字第 1040063385B 號令訂定發布全文12條；並自發布日施行。<\/div>\n<div class=\"history-paragraph\">2.中華民國107年10月03日教育部臺教授國部字第 1070107860B 號令修正發布全文14條，並自發布日施行。<\/div>"},{"title":"高級中等以下實驗教育學校及機構聘僱外國人辦法","content":"第 1 條\n本辦法依學校型態實驗教育實施條例第十二條第二項、第二十三條第一項、公立高級中等以下學校委託私人辦理實驗教育條例第十七條第二項、高級中等以下教育階段非學校型態實驗教育實施條例第八條第四項及外國專業人才延攬及僱用法第五條第三項規定訂定之。\n第 2 條\n高級中等以下實驗教育學校及機構（以下併稱學校、機構）聘僱應經工作許可之外國人（以下簡稱受聘僱外國人），從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作者，應依本辦法規定辦理；其屬學校者，不適用各級學校申請外國教師聘僱許可及管理辦法規定。\n前項高級中等以下實驗教育學校，包括公、私立學校型態實驗教育學校及委託私人辦理實驗教育之受託學校。\n第一項所稱受聘僱外國人，不包括取得永久居留且依就業服務法第五十一條規定取得勞動部核發工作許可之外國人。\n第 3 條\n受聘僱外國人教授外國語文課程者，應取得中央主管機關採認之國內外大學或獨立學院學位，且教授之語文課程應為其護照國籍之官方語言。\n受聘僱外國人從事學科、師資養成、課程研發及活動推廣工作者，應具有實質工作專長之相關經歷。\n第 4 條\n學校、機構申請聘僱外國人前，應先依實驗教育計畫或經營計畫擬具載明聘僱目的、人數及從事工作之聘僱計畫，向各該主管機關申請核准。\n學校、機構聘僱外國人，應填具申請書，並檢具下列文件、資料，直轄市、縣（市）主管機關主管之學校、機構，向直轄市、縣（市）主管機關申請核轉中央主管機關許可；中央主管機關主管之學校，逕向中央主管機關申請許可：\n一、申請書一式二份。\n二、護照影本。\n三、符合前條第一項、第二項規定學歷及經歷之證明文件。\n四、載明受聘僱外國人之職稱、聘僱期間、權利義務及其他相關事項之聘僱契約書影本。\n五、經許可之實驗教育計畫或複審通過之經營計畫。\n六、經核准之聘僱計畫。\n七、最近三個月內核發之警察刑事紀錄證明書。\n八、學校、機構之立案證明文件。\n九、其他經中央主管機關指定之文件。\n第 5 條\n前條申請，經中央主管機關審查通過後，發給聘僱許可。\n前項許可期間最長為三年；期滿後有繼續聘僱之需要者，學校、機構應於期間屆滿日前六十日期間內，檢具申請書一式二份、原聘僱許可文件影本、續聘聘僱契約書影本，依前條規定程序申請許可。\n學校、機構聘僱外國人於單一學年度來臺停留累計九十日以下，其向中央主管機關申請許可時，免檢附前條第二項第五款及第六款所定文件、資料。\n第 6 條\n受聘僱外國人於公立學校專任從事學科或外國語文課程教學，其每週工作時數，準用同等教育階段學校專任教師之規定。\n受聘僱外國人於私立學校、機構專任從事學科或外國語文課程教學，其每週工作時數，依聘僱契約之規定。\n受聘僱外國人兼任從事前二項之工作，其每週工作時數，依聘僱契約之規定。\n受聘僱外國人從事師資養成、課程研發及活動推廣工作，其每週工作時數，依聘僱契約之規定。\n第三項受聘僱從事兼任工作之外國人，以學校、機構合聘者為限。\n第 7 條\n學校、機構得聘僱從事學科、外國語文課程教學之外國人，其人數上限之計算依各該主管機關核定總班級數，乘以實驗教育計畫或經營計畫所定每班每週之該學科或外國語文課程節數，除以十六節，等於最高聘僱人數，所得之數額不滿一人，以一人計算。\n前項從事學科、外國語文課程教學之外國人為兼任者，每三人以專任一人計算。\n二以上學校、機構合聘前項外國人者，其總班級數及每週工作時數，得合併計算。\n第 8 條\n學校、機構聘僱從事師資養成、課程研發及活動推廣工作之外國人，不得從事學科、外國語文課程教學；其聘僱人數依第四條第一項之聘僱計畫辦理；其工作時數依第六條第四項之聘僱契約辦理。\n第 9 條\n受聘僱外國人，於聘僱許可有效期間內，需轉換至其他學校、機構，或受聘僱於二以上學校、機構者，應由擬聘學校、機構依第四條規定申請許可；申請轉換聘僱學校、機構時，擬聘學校、機構應檢附受聘僱外國人之離職證明文件；申請受聘僱於二以上學校、機構時，擬聘學校、機構應檢附原聘學校、機構之同意證明文件。\n前項受聘僱外國人於聘僱許可有效期間內，轉換至學校、機構以外之其他雇主工作，原聘僱學校、機構應於事實發生日起算七日內，通知中央主管機關廢止原聘僱許可。\n第 10 條\n學校、機構申請聘僱外國人而有下列情形之一者，中央主管機關不予核發聘僱許可；已核發者，撤銷或廢止之：\n一、不符第四條所定應檢具之文件、資料、違反第六條至第八條所定聘僱人數或工作時數等規定，經通知限期補正，屆期未補正。\n二、提供不實或失效資料。\n三、受聘僱外國人未具備第三條所定資格。\n四、終止或解除聘僱契約。\n第 11 條\n受聘僱外國人之管理及權利義務事項，屬學校編制內專任合格教師者，應依教師法及其他相關法令之規定；其餘受聘僱外國人，除本辦法或其他法令另有規定外，應依聘僱契約辦理。\n第 12 條\n適用教師法規定之受聘僱外國人，有教師法所定解聘、不續聘、停聘或資遣情事之一者，學校應依該法之規定，予以解聘、不續聘、停聘或資遣。\n第 13 條\n學校聘僱前條以外之受聘僱外國人，有性別平等教育法第二十九條所定情形者，不得聘用，已聘用者應予終止或解除聘僱契約。\n機構聘僱之受聘僱外國人，有下列情形之一者，不得聘用，已聘用者應予終止或解除聘僱契約：\n一、犯性侵害犯罪防治法第二條第一項之性侵害犯罪，經有罪判決確定。\n二、經各該主管機關調查確認有性侵害行為屬實。\n三、經各該主管機關調查確認有性騷擾、性霸凌或違反與性或性別有關之專業倫理行為，有終止契約及終身不得擔任教育從業人員之必要。\n四、經各該主管機關調查確認有性騷擾、性霸凌或違反與性或性別有關之專業倫理行為，有終止契約之必要，且議決一年至四年不得擔任教育從業人員，於該管制期間。\n學校、機構應分別將前二項納入聘僱契約，以使受聘僱外國人確實知悉，並依個人資料保護法規定，取得受聘僱外國人同意學校、機構及相關機關蒐集、處理及利用其個人資料之書面文件，並切結無前二項之情事。\n第 14 條\n受聘僱外國人有就業服務法第五十六條規定之情事者，學校、機構除依規定通知當地勞工主管機關、入出國管理機關及警察機關外，並副知中央主管機關。\n前項通知內容，應包括受聘僱外國人之姓名、性別、年齡、國籍、入國日期、工作期限或聘僱許可文號及外僑居留證影本等資料。\n受聘僱外國人未出國者，警察機關應彙報內政部警政署，並加強查緝。\n第 15 條\n中央主管機關核發、撤銷或廢止外國人聘僱許可時，應通知外交部、勞動部、內政部及學校、機構所在地直轄市、縣（市）主管機關。\n第 16 條\n學校、機構應於受聘僱外國人工作許可期限屆滿前，協助其辦理手續並使其出國。但期限屆滿後，有其他學校、機構願接續聘僱該外國人，並於期限屆滿前，由接續聘僱之學校、機構檢附原學校、機構同意屆期離職之證明文件，依本辦法取得許可者，不在此限。\n受聘僱外國人有下列情事之一，經中央主管機關令其出國者，學校、機構應於限令出國期限前，協助該受聘僱外國人辦理手續並使其出國。但經入出國主管機關依法限令其出國者，不得逾該出國期限：\n一、聘僱許可經撤銷或廢止。\n二、未依規定辦理續聘許可或經不予許可。\n學校、機構應於前二項受聘僱外國人出國後三十日內，檢具受聘僱外國人名冊及出國證明文件，通知中央主管機關。\n第 17 條\n本辦法施行前，已依有關法令申請核准聘僱之受聘僱外國人，得依原規定繼續聘僱至聘期屆滿。\n第 18 條\n學校、機構聘僱香港或澳門居民在臺灣地區從事第二條第一項規定之工作，準用本辦法之規定。\n第 19 條\n本辦法自發布日施行。","history":"1.中華民國一百零八年五月三日教育部臺教授國部字第 1080042402B號令訂定發布全文19 條；並自發布日施行。\n2.中華民國一百十一年二月二十一日教育部臺教授國部字第 1110008574A號令修正發布第1條條文。\n3.中華民國一百十四年十二月二十二日教育部臺教授國部字第 1145406556A號令修正發布第12、13條條文。","contentHtml":"<div class=\"article-heading\">第 1 條<\/div>\n<div class=\"doc-plain\">本辦法依學校型態實驗教育實施條例第十二條第二項、第二十三條第一項、公立高級中等以下學校委託私人辦理實驗教育條例第十七條第二項、高級中等以下教育階段非學校型態實驗教育實施條例第八條第四項及外國專業人才延攬及僱用法第五條第三項規定訂定之。<\/div>\n<div class=\"article-heading\">第 2 條<\/div>\n<div class=\"doc-plain\">高級中等以下實驗教育學校及機構（以下併稱學校、機構）聘僱應經工作許可之外國人（以下簡稱受聘僱外國人），從事學科、外國語文課程教學、師資養成、課程研發及活動推廣工作者，應依本辦法規定辦理；其屬學校者，不適用各級學校申請外國教師聘僱許可及管理辦法規定。<\/div>\n<div class=\"doc-plain\">前項高級中等以下實驗教育學校，包括公、私立學校型態實驗教育學校及委託私人辦理實驗教育之受託學校。<\/div>\n<div class=\"doc-plain\">第一項所稱受聘僱外國人，不包括取得永久居留且依就業服務法第五十一條規定取得勞動部核發工作許可之外國人。<\/div>\n<div class=\"article-heading\">第 3 條<\/div>\n<div class=\"doc-plain\">受聘僱外國人教授外國語文課程者，應取得中央主管機關採認之國內外大學或獨立學院學位，且教授之語文課程應為其護照國籍之官方語言。<\/div>\n<div class=\"doc-plain\">受聘僱外國人從事學科、師資養成、課程研發及活動推廣工作者，應具有實質工作專長之相關經歷。<\/div>\n<div class=\"article-heading\">第 4 條<\/div>\n<div class=\"doc-plain\">學校、機構申請聘僱外國人前，應先依實驗教育計畫或經營計畫擬具載明聘僱目的、人數及從事工作之聘僱計畫，向各該主管機關申請核准。<\/div>\n<div class=\"doc-plain\">學校、機構聘僱外國人，應填具申請書，並檢具下列文件、資料，直轄市、縣（市）主管機關主管之學校、機構，向直轄市、縣（市）主管機關申請核轉中央主管機關許可；中央主管機關主管之學校，逕向中央主管機關申請許可：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">申請書一式二份。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">護照影本。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">符合前條第一項、第二項規定學歷及經歷之證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">載明受聘僱外國人之職稱、聘僱期間、權利義務及其他相關事項之聘僱契約書影本。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">經許可之實驗教育計畫或複審通過之經營計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">經核准之聘僱計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">最近三個月內核發之警察刑事紀錄證明書。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">學校、機構之立案證明文件。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">其他經中央主管機關指定之文件。<\/span><\/div>\n<div class=\"article-heading\">第 5 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前條申請，經中央主管機關審查通過後，發給聘僱許可。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項許可期間最長為三年；期滿後有繼續聘僱之需要者，學校、機構應於期間屆滿日前六十日期間內，檢具申請書一式二份、原聘僱許可文件影本、續聘聘僱契約書影本，依前條規定程序申請許可。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構聘僱外國人於單一學年度來臺停留累計九十日以下，其向中央主管機關申請許可時，免檢附前條第二項第五款及第六款所定文件、資料。<\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人於公立學校專任從事學科或外國語文課程教學，其每週工作時數，準用同等教育階段學校專任教師之規定。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人於私立學校、機構專任從事學科或外國語文課程教學，其每週工作時數，依聘僱契約之規定。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人兼任從事前二項之工作，其每週工作時數，依聘僱契約之規定。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人從事師資養成、課程研發及活動推廣工作，其每週工作時數，依聘僱契約之規定。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">第三項受聘僱從事兼任工作之外國人，以學校、機構合聘者為限。<\/div>\n<div class=\"article-heading\">第 7 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構得聘僱從事學科、外國語文課程教學之外國人，其人數上限之計算依各該主管機關核定總班級數，乘以實驗教育計畫或經營計畫所定每班每週之該學科或外國語文課程節數，除以十六節，等於最高聘僱人數，所得之數額不滿一人，以一人計算。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項從事學科、外國語文課程教學之外國人為兼任者，每三人以專任一人計算。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">二以上學校、機構合聘前項外國人者，其總班級數及每週工作時數，得合併計算。<\/div>\n<div class=\"article-heading\">第 8 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構聘僱從事師資養成、課程研發及活動推廣工作之外國人，不得從事學科、外國語文課程教學；其聘僱人數依第四條第一項之聘僱計畫辦理；其工作時數依第六條第四項之聘僱契約辦理。<\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人，於聘僱許可有效期間內，需轉換至其他學校、機構，或受聘僱於二以上學校、機構者，應由擬聘學校、機構依第四條規定申請許可；申請轉換聘僱學校、機構時，擬聘學校、機構應檢附受聘僱外國人之離職證明文件；申請受聘僱於二以上學校、機構時，擬聘學校、機構應檢附原聘學校、機構之同意證明文件。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項受聘僱外國人於聘僱許可有效期間內，轉換至學校、機構以外之其他雇主工作，原聘僱學校、機構應於事實發生日起算七日內，通知中央主管機關廢止原聘僱許可。<\/div>\n<div class=\"article-heading\">第 10 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構申請聘僱外國人而有下列情形之一者，中央主管機關不予核發聘僱許可；已核發者，撤銷或廢止之：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">不符第四條所定應檢具之文件、資料、違反第六條至第八條所定聘僱人數或工作時數等規定，經通知限期補正，屆期未補正。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">提供不實或失效資料。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">受聘僱外國人未具備第三條所定資格。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">終止或解除聘僱契約。<\/span><\/div>\n<div class=\"article-heading\">第 11 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人之管理及權利義務事項，屬學校編制內專任合格教師者，應依教師法及其他相關法令之規定；其餘受聘僱外國人，除本辦法或其他法令另有規定外，應依聘僱契約辦理。<\/div>\n<div class=\"article-heading\">第 12 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">適用教師法規定之受聘僱外國人，有教師法所定解聘、不續聘、停聘或資遣情事之一者，學校應依該法之規定，予以解聘、不續聘、停聘或資遣。<\/div>\n<div class=\"article-heading\">第 13 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校聘僱前條以外之受聘僱外國人，有性別平等教育法第二十九條所定情形者，不得聘用，已聘用者應予終止或解除聘僱契約。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">機構聘僱之受聘僱外國人，有下列情形之一者，不得聘用，已聘用者應予終止或解除聘僱契約：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">犯性侵害犯罪防治法第二條第一項之性侵害犯罪，經有罪判決確定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">經各該主管機關調查確認有性侵害行為屬實。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">經各該主管機關調查確認有性騷擾、性霸凌或違反與性或性別有關之專業倫理行為，有終止契約及終身不得擔任教育從業人員之必要。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">經各該主管機關調查確認有性騷擾、性霸凌或違反與性或性別有關之專業倫理行為，有終止契約之必要，且議決一年至四年不得擔任教育從業人員，於該管制期間。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構應分別將前二項納入聘僱契約，以使受聘僱外國人確實知悉，並依個人資料保護法規定，取得受聘僱外國人同意學校、機構及相關機關蒐集、處理及利用其個人資料之書面文件，並切結無前二項之情事。<\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人有就業服務法第五十六條規定之情事者，學校、機構除依規定通知當地勞工主管機關、入出國管理機關及警察機關外，並副知中央主管機關。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">前項通知內容，應包括受聘僱外國人之姓名、性別、年齡、國籍、入國日期、工作期限或聘僱許可文號及外僑居留證影本等資料。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人未出國者，警察機關應彙報內政部警政署，並加強查緝。<\/div>\n<div class=\"article-heading\">第 15 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">中央主管機關核發、撤銷或廢止外國人聘僱許可時，應通知外交部、勞動部、內政部及學校、機構所在地直轄市、縣（市）主管機關。<\/div>\n<div class=\"article-heading\">第 16 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構應於受聘僱外國人工作許可期限屆滿前，協助其辦理手續並使其出國。但期限屆滿後，有其他學校、機構願接續聘僱該外國人，並於期限屆滿前，由接續聘僱之學校、機構檢附原學校、機構同意屆期離職之證明文件，依本辦法取得許可者，不在此限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">受聘僱外國人有下列情事之一，經中央主管機關令其出國者，學校、機構應於限令出國期限前，協助該受聘僱外國人辦理手續並使其出國。但經入出國主管機關依法限令其出國者，不得逾該出國期限：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">聘僱許可經撤銷或廢止。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">未依規定辦理續聘許可或經不予許可。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構應於前二項受聘僱外國人出國後三十日內，檢具受聘僱外國人名冊及出國證明文件，通知中央主管機關。<\/div>\n<div class=\"article-heading\">第 17 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">本辦法施行前，已依有關法令申請核准聘僱之受聘僱外國人，得依原規定繼續聘僱至聘期屆滿。<\/div>\n<div class=\"article-heading\">第 18 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">學校、機構聘僱香港或澳門居民在臺灣地區從事第二條第一項規定之工作，準用本辦法之規定。<\/div>\n<div class=\"article-heading\">第 19 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:0\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國一百零八年五月三日教育部臺教授國部字第 1080042402B號令訂定發布全文19 條；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國一百十一年二月二十一日教育部臺教授國部字第 1110008574A號令修正發布第1條條文。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國一百十四年十二月二十二日教育部臺教授國部字第 1145406556A號令修正發布第12、13條條文。<\/div>"}];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTableHtml(html){
  const tpl=document.createElement('template');tpl.innerHTML=html;
  tpl.content.querySelectorAll('th,td').forEach(cell=>{
    const walker=document.createTreeWalker(cell,NodeFilter.SHOW_TEXT);const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const text=node.nodeValue||'';
      if(text.includes('、') || [...text].length<=6 || !text.trim()) return;
      const chars=[...text];const frag=document.createDocumentFragment();
      for(let i=0;i<chars.length;i+=6){if(i) frag.appendChild(document.createElement('br'));frag.appendChild(document.createTextNode(chars.slice(i,i+6).join('')));}
      node.parentNode.replaceChild(frag,node);
    });
  });
  return tpl.innerHTML;
}
function renderList(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const list=document.getElementById('lawList');list.innerHTML='';const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+' '+x.content+' '+x.history).toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} / ${laws.length} 項`;document.getElementById('none').classList.toggle('hidden',filtered.length>0);filtered.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'bg-blue-600 text-white':'');b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title)}</span>`;b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};list.appendChild(b);});}
function renderLawContent(law){

  const patterns=[
    /^(一、|二、|三、|四、|五、|六、|七、|八、|九、|十、|十[一二三四五六七八九]、|二十、|三十、)/,
    /^(（[一二三四五六七八九十百]+）|\([一二三四五六七八九十百]+\))/,
    /^(\d+[、.．])/,
    /^(（\d+）|\(\d+\))/
  ];
  // 含「第X條」的法規維持原有排版，僅調整以項次編排的法規內文縮排。
  const isArticleLaw=lines.some(raw=>/^第\s*\d+\s*條(?:之\s*\d+)?/.test(raw.trim()));
  if(isArticleLaw){
    return lines.map(raw=>{
      const line=raw.trim();
      if(!line) return '<div class="doc-empty" aria-hidden="true"></div>';
      if((line==='附表一' || line==='附表二' || line.includes('國民中學學技藝教育抽離式上課各職群主題與國中全對應及部分對應領域課程節數原則')) && law.tablesHtml && law.tablesHtml[tableIndex]) return `<div class="doc-plain">${esc(line)}</div>${formatTableHtml(law.tablesHtml[tableIndex++])}`;
      if(/^第\s*\d+\s*條(?:之\s*\d+)?/.test(line)) return `<div class="article-heading">${esc(line)}</div>`;
      for(let i=0;i<patterns.length;i++){
        const m=line.match(patterns[i]);
        if(m){const marker=m[0], body=line.slice(marker.length).trimStart();return `<div class="doc-row doc-level-${i}"><span class="doc-marker">${esc(marker)}</span><span class="doc-copy">${esc(body)}</span></div>`;}
      }
      return `<div class="doc-plain">${esc(line)}</div>`;
    }).join('');
  }
  let activeLevel=-1;
  return lines.map(raw=>{
    const line=raw.trim();
    if(!line){activeLevel=-1;return '<div class="doc-empty" aria-hidden="true"></div>';}
    if((line==='附表一' || line==='附表二' || line.includes('國民中學學技藝教育抽離式上課各職群主題與國中全對應及部分對應領域課程節數原則')) && law.tablesHtml && law.tablesHtml[tableIndex]) { activeLevel=-1; return `<div class="doc-plain">${esc(line)}</div>${formatTableHtml(law.tablesHtml[tableIndex++])}`; }
    for(let i=0;i<patterns.length;i++){
      const m=line.match(patterns[i]);
      if(m){
        activeLevel=i;
        const marker=m[0], body=line.slice(marker.length).trimStart();
        return `<div class="doc-row doc-level-${i}"><span class="doc-marker">${esc(marker)}</span><span class="doc-copy">${esc(body)}</span></div>`;
      }
    }
    if(activeLevel>=0){
      const indent=[2.8,4.8,6.8,8.8][activeLevel]||2.8;
      return `<div class="doc-plain doc-continuation" style="padding-left:${indent}em">${esc(line)}</div>`;
    }
    return `<div class="doc-plain">${esc(line)}</div>`;
  }).join('');
}

     const panel=getPanel(btn,index);
     const title=(btn.innerText||btn.textContent||'').replace(/\s+/g,' ').trim();
     const body=panel ? (panel.innerText||panel.textContent||'') : title;
     if(norm(title).includes(q)||norm(body).includes(q)) matches.push({btn,title,body,index});
   });
   const heading=document.createElement('div');
   heading.className='px-4 py-2 text-xs font-bold text-slate-500 bg-slate-50 border-b border-slate-100';
   heading.textContent=matches.length?'搜尋結果（'+matches.length+' 項）':'找不到符合的法規';
   results.appendChild(heading);
   if(matches.length){
     matches.slice(0,30).forEach(item=>{
       const a=document.createElement('button');
       a.type='button';
       a.className='block w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-blue-50 focus:bg-blue-50';
       const name=document.createElement('div');name.className='text-sm font-semibold text-blue-700';name.textContent=item.title;
       const desc=document.createElement('div');desc.className='mt-1 text-xs leading-relaxed text-slate-600';desc.textContent=excerpt(item.body,raw);
       a.append(name,desc);
       a.addEventListener('click',()=>{
         item.btn.click();
         results.style.display='none';
         input.blur();
       });
       results.appendChild(a);
     });
     if(matches.length>30){const more=document.createElement('div');more.className='px-4 py-2 text-xs text-slate-500';more.textContent='另有 '+(matches.length-30)+' 項符合，請輸入更完整的關鍵字縮小範圍。';results.appendChild(more);}
   }
   results.style.display='block';
 }
 input.addEventListener('input',render);
 input.addEventListener('focus',render);
 document.addEventListener('click',e=>{if(!results.contains(e.target)&&e.target!==input)results.style.display='none';});
})();
</script>

<style id="mobile-law-detail-switch-style">
@media(max-width:1023px){
 body.mobile-law-detail-view main>aside{display:none!important}
 body.mobile-law-detail-view main>section,body.mobile-law-detail-view main>div:not(aside){display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;grid-column:1/-1!important}
 body.mobile-law-detail-view main{display:block!important}

}
@media(min-width:1024px){#mobileLawBackButton{display:none!important}}
</style>
<script id="mobile-law-detail-switch-script">
(function(){
 function mobile(){return window.matchMedia('(max-width:1023px)').matches}
 function returnToList(){document.body.classList.remove('mobile-law-detail-view');var a=document.querySelector('main>aside');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});}
 document.addEventListener('click',function(e){
   var btn=e.target.closest('#lawList button[data-law], aside button[data-law]');
   if(!btn||!mobile())return;
   var main=document.querySelector('main'), aside=main&&main.querySelector(':scope > aside');
   if(!main||!aside)return;
   var detail=Array.from(main.children).find(function(el){return el!==aside && (el.matches('section')||el.id==='lawPanels'||el.querySelector('#detail, .law-panel, [id*="detail"]'));});
   if(!detail)return;
   var back=document.getElementById('mobileLawBackButton');
   if(!back){back=document.createElement('button');back.id='mobileLawBackButton';back.type='button';back.textContent='← 返回法規項目清單';back.addEventListener('click',returnToList);}
   if(!detail.contains(back))detail.insertBefore(back,detail.firstChild);
   document.body.classList.add('mobile-law-detail-view');
   setTimeout(function(){detail.scrollIntoView({behavior:'smooth',block:'start'});},180);
 });
 window.addEventListener('resize',function(){if(!mobile())document.body.classList.remove('mobile-law-detail-view');});
})();
</script>
