const laws = [{"title":"教師法","content":"第  一  章  總則\n第  1  條\n為明定教師權利義務，保障教師工作及生活，提升教師專業地位，並維護學生學習權，特制定本法。\n第  2  條\n本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n軍警校院及矯正學校依本法規定處理專任教師之事項時，除資格檢定及審定外，以其所屬主管機關為本法所稱主管機關。\n第  3  條\n本法於公立及已立案之私立學校編制內，按月支給待遇，並依法取得教師資格之專任教師適用之。\n軍警校院及矯正學校依本法及教育人員任用條例規定聘任之專任教師，除法律另有規定者外，適用本法之規定。\n第  4  條\n教師資格檢定及審定、聘任、解聘、不續聘、停聘及資遣、權利義務、教師組織、申訴及救濟等事項，應依本法之規定。\n第  二  章 資格檢定及審定\n第  5  條\n教師資格之取得分檢定及審定二種：高級中等以下學校之教師採檢定制；專科以上學校之教師採審定制。\n第  6  條\n高級中等以下學校教師資格之檢定，另以法律定之；經檢定合格之教師，由中央主管機關發給教師證書。\n第  7  條\n專科以上學校教師資格之審定分學校審查及中央主管機關審查二階段；教師經學校審查合格者，由學校報請中央主管機關審查，再審查合格者，由中央主管機關發給教師證書。但經中央主管機關認可之學校審查合格者，得逕由中央主管機關發給教師證書。\n第 8 條\n專科以上學校教師資格審定辦法，由中央主管機關定之。\n第  三  章  聘任\n第  9  條\n高級中等以下學校教師之聘任，分初聘、續聘及長期聘任，除有下列情形之一者外，應經教師評審委員會審查通過後，由校長聘任之：\n一、依師資培育法規定分發之公費生。\n二、依國民教育法或高級中等教育法回任教師之校長。\n前項教師評審委員會之組成，應包括教師代表、學校行政人員代表及家長會代表一人；其中未兼行政或董事之教師代表，不得少於總額二分之一。但教師之員額少於委員總額二分之一者，不在此限。\n高級中等以下學校教師評審委員會於處理第十四條第一項第七款及第十款、第十五條第一項第一款至第四款時，學校應另行增聘校外學者專家擔任委員，至未兼行政或董事之教師代表人數少於委員總額二分之一為止。\n前三項教師評審委員會之任務、組成方式、任期、議事、迴避及其他相關事項之辦法，由中央主管機關定之。\n第 10 條\n高級中等以下學校教師之聘任，以具有教師證書者為限。\n高級中等以下學校教師聘任期限，初聘為一年；續聘第一次為一年，以後續聘每次為二年；續聘三次以上服務成績優良者，經教師評審委員會全體委員三分之二以上審查通過後，得以長期聘任，其聘期由各校教師評審委員會訂定之，至多七年。\n專科以上學校教師之聘任及期限，分別依大學法及專科學校法之規定辦理。\n第 11 條\n高級中等以下學校科、組、課程調整或學校減班、停辦或解散時，學校對仍願繼續任教且在校內有其他適當工作可以調任之合格教師，應優先輔導調整職務；在校內無其他適當工作可以調整職務者，學校或主管機關應優先輔導介聘。\n高級中等以下學校或主管機關依前項規定優先輔導介聘之教師，經學校教師評審委員會審查發現有第三十條各款情形之一者，其聘任應不予通過。\n第 12 條\n專科以上學校系、所、科、組、課程調整或學校減班、停辦、解散時，學校對仍願繼續任教且有其他適當工作可以調任之合格教師，應優先輔導遷調，各該主管機關應輔導學校執行。\n專科以上學校依前項規定優先輔導遷調之教師，經教師評審委員會審查發現有下列各款情形之一者，其聘任得不予通過：\n一、第十四條第一項、第十五條第一項或第十六條第一項各款情形之一，尚在解聘或不續聘處理程序中。\n二、有第十八條、第二十一條、第二十二條第一項或第二項之情形，尚在停聘處理程序中或停聘期間。\n三、第二十七條第一項第二款或第三款情形之一，尚在資遣處理程序中。\n第  13  條\n教師除有第十四條至第十六條、第十八條、第十九條、第二十一條及第二十二條情形之一者外，不得解聘、不續聘或停聘。\n第  四  章  解聘、不續聘、停聘及資遣\n第  14  條\n教師有下列各款情形之一者，應予解聘，且終身不得聘任為教師：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n四、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性侵害行為屬實。\n五、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘及終身不得聘任為教師之必要。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經學校性別平等教育委員會確認，有解聘及終身不得聘任為教師之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經學校教師評審委員會確認，有解聘及終身不得聘任為教師之必要。\n八、知悉服務學校發生疑似校園性侵害事件，未依性別平等教育法規定通報，致再度發生校園性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園性侵害事件之證據，經學校或有關機關查證屬實。\n九、偽造、變造或湮滅他人所犯校園毒品危害事件之證據，經學校或有關機關查證屬實。\n十、體罰或霸凌學生，造成其身心嚴重侵害。\n十一、行為違反相關法規，經學校或有關機關查證屬實，有解聘及終身不得聘任為教師之必要。\n教師有前項第一款至第三款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘，不受大學法第二十條第一項及專科學校法第二十七條第一項規定之限制。\n教師有第一項第四款至第六款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以解聘，不受大學法第二十條第一項及專科學校法第二十七條第一項規定之限制。\n教師有第一項第七款或第十款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第八款、第九款或第十一款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n第  15 條\n教師有下列各款情形之一者，應予解聘，且應議決一年至四年不得聘任為教師：\n一、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經學校性別平等教育委員會確認，有解聘之必要。\n三、體罰或霸凌學生，造成其身心侵害，有解聘之必要。\n四、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經學校教師評審委員會確認，有解聘之必要。\n五、行為違反相關法規，經學校或有關機關查證屬實，有解聘之必要。\n教師有前項第一款或第二款規定情形之一者，應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘。\n教師有第一項第三款或第四款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第五款規定情形者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n第  16  條\n教師聘任後，有下列各款情形之一者，應經教師評審委員會審議通過，並報主管機關核准後，予以解聘或不續聘；其情節以資遣為宜者，應依第二十七條規定辦理：\n一、教學不力或不能勝任工作有具體事實。\n二、違反聘約情節重大。\n教師有前項各款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過。但高級中等以下學校教師有前項第一款情形，學校向主管機關申請教師專業審查會調查屬實，應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過。\n第  17  條\n主管機關為協助高級中等以下學校處理前條第一項第一款及第二十六條第二項情形之案件，應成立教師專業審查會，受理學校申請案件或依第二十六條第二項提交教師專業審查會審議之案件。\n教師專業審查會置委員十一人至十九人，任期二年，由主管機關首長就行政機關代表、教育學者、法律專家、兒童及少年福利學者專家、全國或地方校長團體代表、全國或地方家長團體代表及全國或地方教師組織推派之代表遴聘(派)兼之；任一性別委員人數不得少於委員總數三分之一。\n第一項教師專業審查會之組成及運作辦法，由中央主管機關定之。\n教師專業審查會之結案報告摘要，應供公眾查閱。\n第  18  條\n教師行為違反相關法規，經學校或有關機關查證屬實，未達解聘之程度，而有停聘之必要者，得審酌案件情節，經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，議決停聘六個月至三年，並報主管機關核准後，予以終局停聘。\n前項停聘期間，不得申請退休、資遣或在學校任教。\n第  19 條\n有下列各款情形之一者，不得聘任為教師；已聘任者，應予以解聘：\n一、有第十四條第一項各款情形之一。\n二、有第十五條第一項各款情形之一，於該議決一年至四年期間。\n有前條第一項情形者，於該停聘六個月至三年期間，其他學校不得聘任其為教師；已聘任者，應予以解聘。\n前二項已聘任之教師屬依第二十條第一項規定通報有案者，免經教師評審委員會審議，並免報主管機關核准，予以解聘，不受大學法第二十條第一項及專科學校法第二十七條第一項規定之限制；非屬依第二十條第一項規定通報有案者，應依第十四條或第十五條規定予以解聘。\n本法中華民國一百零二年六月二十七日修正之條文施行前，因行為不檢有損師道，經有關機關查證屬實而解聘或不續聘之教師，除屬性侵害行為；\n性騷擾、性霸凌行為、行為違反相關法令且情節重大；體罰或霸凌學生造成其身心嚴重侵害者外，於解聘或不續聘生效日起算逾四年者，得聘任為教師。\n第  20  條\n教師有第十四條第一項、第十五條第一項、第十八條第一項及前條第一項、第二項規定之情形者，各級主管機關及各級學校應依規定辦理通報、資訊之蒐集及查詢。\n學校聘任教師前，應查詢其有無前條第一項及第二項規定之情形；已聘任者，應定期查詢。\n各級主管機關協助學校辦理前項查詢，得使用中央社政主管機關建立之依兒童及少年性剝削防制條例、性騷擾防治法第二十條或兒童及少年福利與權益保障法第九十七條規定受行政處罰者之資料庫。\n前三項之通報、資訊之蒐集、查詢、處理、利用及其他相關事項之辦法，由中央主管機關定之。\n第  21  條\n教師有下列各款情形之一者，當然暫時予以停聘：\n一、依刑事訴訟程序被通緝或羈押。\n二、依刑事確定判決，受褫奪公權之宣告。\n三、依刑事確定判決，受徒刑之宣告，在監所執行中。\n第  22  條\n教師涉有下列各款情形之一者，服務學校應於知悉之日起一個月內經教師評審委員會審議通過後，免報主管機關核准，暫時予以停聘六個月以下，並靜候調查；必要時，得經教師評審委員會審議通過後，延長停聘期間二次，每次不得逾三個月。經調查屬實者，於報主管機關後，至主管機關核准及學校解聘前，應予停聘，免經教師評審委員會審議：\n一、第十四條第一項第四款至第六款情形。\n二、第十五條第一項第一款或第二款情形。\n教師涉有下列各款情形之一，服務學校認為有先行停聘進行調查之必要者，應經教師評審委員會審議通過，免報主管機關核准，暫時予以停聘三個月以下；必要時得經教師評審委員會審議通過後，延長停聘期間一次，且不得逾三個月。經調查屬實者，於報主管機關後，至主管機關核准及學校解聘前，得經教師評審委員會審議通過後，予以停聘：\n一、第十四條第一項第七款至第十一款情形。\n二、第十五條第一項第三款至第五款情形。\n前二項情形應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過。\n第  23  條\n教師停聘期間，服務學校應予保留底缺；終局停聘期間遇有聘約期限屆滿情形者，學校應予續聘。\n依第十八條、前條第一項或第二項規定停聘之教師，於停聘期間屆滿後，學校應予復聘，教師應於停聘期間屆滿次日向學校報到復聘。\n依前條第一項或第二項規定停聘之教師，於停聘期間屆滿前，停聘事由已消滅者，得申請復聘。\n依前項規定申請復聘之教師，應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過後復聘。\n依第二十一條規定停聘之教師，於停聘事由消滅後，除經學校依前條第二項規定予以停聘外，學校應予復聘，教師應於事由消滅後次日向學校報到復聘。\n經依法停聘之教師，未依第二項規定於停聘期間屆滿次日或未依前項規定於事由消滅後次日向學校報到復聘，或未依第三項規定於停聘事由消滅後三個月內申請復聘者，服務學校應負責查催，教師於回復聘任報到前，仍視為停聘；如仍未於接到查催通知之日起三十日內報到復聘者，除有不可歸責於該教師之事由外，視為辭職。\n第  24  條\n受解聘、不續聘或停聘之教師，依法提起救濟後，原解聘、不續聘或停聘決定經撤銷或因其他事由失去效力，除得依法另為處理者外，其服務學校應通知其復聘，免經教師評審委員會審議。\n依前項規定復聘之教師，於接獲復聘通知後，應於三十日內報到，其未於期限內報到者，除經核准延長或有不可歸責於該教師之事由外，視為辭職。\n依第一項或前條第二項、第三項或第五項規定復聘之教師，服務學校應回復其教師職務。\n第  25  條\n依第十八條第一項或第二十一條第二款、第三款停聘之教師，停聘期間不發給待遇。\n依第二十一條第一款、第二十二條第一項、第二十三條第六項停聘之教師，於停聘期間不發給待遇；停聘事由消滅後，未受解聘或終局停聘處分，並回復聘任者，補發其停聘期間全數本薪(年功薪)及學術研究加給。\n依第二十二條第二項停聘之教師，於停聘期間發給半數本薪(年功薪)及學術研究加給；調查後未受解聘或終局停聘處分，並回復聘任者，補發其停聘期間未發之本薪(年功薪)及學術研究加給。\n第  26  條\n學校教師評審委員會、性別平等教育委員會或依法組成之相關委員會依第十四條至第十六條規定作成教師解聘或不續聘之決議，或依第十八條規定作成教師終局停聘之決議後，除本法另有規定外，學校應自決議作成之日起十日內報主管機關核准，並同時以書面附理由通知當事人。\n高級中等以下學校教師涉有第十四條至第十六條或第十八條規定之情形，學校教師評審委員會未依規定召開、審議或決議，主管機關認有違法之虞時，應敘明理由交回學校審議或復議；屆期未依法審議或復議者，主管機關得敘明理由逕行提交教師專業審查會審議，並得追究學校相關人員責任。\n前項教師專業審查會之決議，應依該案件性質，以學校教師評審委員會原應經之委員出席比率及表決比率審議通過；其決議視同學校教師評審委員會之決議。\n專科以上學校教師涉有第十四條至第十六條或第十八條規定之情形，學校教師評審委員會未依規定召開、審議或決議，主管機關認有違法之虞時，應敘明理由交回學校審議或復議；屆期未依法審議或復議者，主管機關得追究學校相關人員責任。\n教師解聘、不續聘或終局停聘案尚在處理程序中，其聘約期限屆滿者，學校應予暫時繼續聘任。\n第  27  條\n教師有下列各款情事之一者，應經教師評審委員會審議通過，並報主管機關核准後，得予以資遣：\n一、因系、所、科、組、課程調整或學校減班、停辦、解散時，現職已無工作又無其他適當工作可以調任。\n二、現職工作不適任且無其他工作可調任；或經中央衛生主管機關評鑑合格之醫院證明身體衰弱不能勝任工作。\n三、受監護宣告或輔助宣告，尚未撤銷。\n符合退休資格之教師有前項各款情形之一，經核准資遣者，得於資遣確定之日起一個月內依規定申請辦理退休，並以原核准資遣生效日為退休生效日。\n第  28  條\n學校於知悉教師涉有第十四條第一項或第十五條第一項所定情形之日起，不得同意其退休或資遣。\n教師離職後，學校始知悉該教師於聘任期間涉有第十四條第一項或第十五條第一項所定之情形者，學校仍應予以解聘，並依第二十條規定辦理通報。\n第  29  條\n高級中等以下學校依本法所為教師之解聘、不續聘、停聘或資遣程序及相關事項之辦法，由中央主管機關定之。\n第  30  條\n高級中等以下學校現職教師，有下列各款情形之一者，不得申請介聘：\n一、有第十四條第一項、第十五條第一項或第十六條第一項各款情形之一，尚在調查、解聘或不續聘處理程序中。\n二、有第十八條第一項、第二十一條、第二十二條第一項或第二項情形，尚在調查、停聘處理程序中或停聘期間。\n三、有第二十七條第一項第二款或第三款情形，尚在調查、資遣處理程序中。\n第  五  章  權利義務\n第  31  條\n教師接受聘任後，依有關法令及學校章則之規定，享有下列權利：\n一、對學校教學及行政事項提供興革意見。\n二、享有待遇、福利、退休、撫卹、資遣、保險等權益及保障。\n三、參加在職進修、研究及學術交流活動。\n四、參加教師組織，並參與其他依法令規定所舉辦之活動。\n五、對主管機關或學校有關其個人之措施，認為違法或不當致損害其權益者，得依法提出申訴。\n六、教師之教學及對學生之輔導依法令及學校章則享有專業自主。\n七、除法令另有規定者外，教師得拒絕參與主管機關或學校所指派與教學無關之工作或活動。\n八、教師依法執行職務涉訟時，其服務學校應輔助其延聘律師為其辯護及提供法律上之協助。\n九、其他依本法或其他法律應享有之權利。\n前項第八款情形，教師因公涉訟輔助辦法，由中央主管機關定之；另其涉訟係因教師之故意或重大過失所致者，應不予輔助；如服務學校已支付涉訟輔助費用者，應以書面限期命其繳還。\n第  32  條\n教師除應遵守法令履行聘約外，並負有下列義務：\n一、遵守聘約規定，維護校譽。\n二、積極維護學生受教之權益。\n三、依有關法令及學校安排之課程，實施適性教學活動。\n四、輔導或管教學生，導引其適性發展，並培養其健全人格。\n五、從事與教學有關之研究、進修。\n六、嚴守職分，本於良知，發揚師道及專業精神。\n七、依有關法令參與學校學術、行政工作及社會教育活動。\n八、非依法律規定不得洩漏學生個人或其家庭資料。\n九、擔任導師。\n十、其他依本法或其他法律規定應盡之義務。\n前項第四款及第九款之辦法，由各校校務會議定之。\n第  33  條\n各級學校教師在職期間應主動積極進修、研究與其教學有關之知能。\n教師在職進修得享有帶職帶薪或留職停薪之保障；其進修、研究之經費得由學校或所屬主管機關編列預算支應。\n為提升教育品質，鼓勵各級學校教師進修、研究，中央主管機關應規劃多元之教師進修、研究等專業發展制度，其方式、獎勵相關事項之辦法，由中央主管機關定之。\n高級中等以下學校各主管機關應建立教師諮商輔導支持體系，協助教師諮商輔導；其辦法由各該主管機關定之。\n第  34  條\n教師違反第三十二條第一項各款之規定者，各聘任學校應交教師評審委員會評議後，由學校依有關法令規定處理。\n第  35  條\n教師因婚、喪、疾病、分娩或其他正當事由，得依規定請假；其基於法定義務出席作證性侵害、性騷擾及霸凌事件，應給予公假。\n前項教師請假之假別、日數、請假程序、核定權責與違反之處理及其他相關事項之規則，由中央主管機關定之。\n第  36  條\n教師之待遇，另以法律定之。\n第  37  條\n公私立學校教師互轉時，其未核給退休、撫卹、離職及資遣給與之任職年資應合併計算。\n第  38  條\n教師之退休、撫卹、離職、資遣及保險，另以法律定之。\n第  六  章  教師組織\n第  39  條\n教師組織分為三級：在學校為學校教師會；在直轄市及縣(市)為地方教師會；在中央為全國教師會。\n學校班級數少於二十班時，得跨區 (鄉、鎮)合併成立學校教師會。\n各級教師組織之設立，應依人民團體法規定向該管主管機關申請辦理。\n地方教師會應有行政區內半數以上學校教師會加入，始得設立。全國教師會應有半數以上之地方教師會加入，始得成立。\n第  40  條\n各級教師組織之基本任務如下：\n一、維護教師專業尊嚴與專業自主權。\n二、與各級機關協議教師聘約及聘約準則。\n三、研究並協助解決各項教育問題。\n四、監督離職給付儲金機構之管理、營運、給付等事宜。\n五、派出代表參與教師聘任、申訴及其他與教師有關之法定組織。\n六、制定教師自律公約。\n第  41  條\n學校不得限制教師參加教師組織或擔任教師組織職務。\n學校不得因教師參加教師組織、擔任教師組織職務或參與活動，拒絕聘用、解聘或為其他不利之待遇。\n第  七  章  申訴及救濟\n第  42  條\n教師對學校或主管機關有關其個人之措施，認為違法或不當，致損害其權益者，得向各級教師申訴評議委員會提起申訴、再申訴。\n教師因學校或主管機關對其依法申請之案件，於法定期間內應作為而不作為，認為損害其權益者，亦得提起申訴；法令未規定應作為之期間者，其期間自學校或主管機關受理申請之日起為二個月。\n申訴之提起，應於收受或知悉措施之次日起三十日內以書面為之；再申訴應於申訴評議書達到之次日起三十日內以書面為之。\n前項期間，以申訴評議委員會收受申訴書或再申訴書之日期為準。\n第  43  條\n教師申訴評議委員會委員，由教師、社會公正人士、學者專家、該地區教師組織代表，及組成教師申訴評議委員會之主管機關或學校代表擔任之；其中未兼行政職務之教師人數不得少於委員總數三分之二。\n前項教師組織代表在直轄市、縣(市)由直轄市、縣(市)教師會推薦；在專科以上學校由該校教師會推薦，其無教師會者，由該學校教育階段相當或直轄市、縣(市)教師會推薦；在中央教師申訴評議委員會由全國教師會推薦。\n教師申訴評議委員會之組織、迴避、評議程序與方式及其他相關事項之準則，由中央主管機關定之；軍警校院及矯正學校適用之規定，得由各該主管機關另定之。\n各級教師申訴評議委員會組織與第一項及第二項規定不符者，應於本法中華民國一百零八年五月十日修正之條文施行之日起一年內完成修正。\n第  44  條\n教師申訴之程序分為申訴及再申訴二級如下：\n一、專科以上學校分學校及中央二級。\n二、高級中等以下學校分直轄市、縣(市)及中央二級。但中央主管機關所屬學校為中央一級，其提起之申訴，以再申訴論。\n教師不服申訴決定者，得提起再申訴；學校及主管機關不服申訴決定者，亦同。\n教師依本法提起申訴、再申訴後，不得復依訴願法提起訴願；於申訴、再申訴程序終結前提起訴願者，受理訴願機關應於十日內，將該事件移送應受理之教師申訴評議委員會，並通知教師；同時提起訴願者，亦同。\n教師依訴願法提起訴願後，復依本法提起申訴者，受理之教師申訴評議委員會應停止評議，並於教師撤回訴願或訴願決定確定後繼續評議；原措施屬行政處分者，應為申訴不受理之決定。\n本法中華民國一百零八年五月十日修正之條文施行前，尚未終結之事件，其以後之程序，依修正施行後之本法規定終結之。\n原措施性質屬行政處分者，其再申訴決定視同訴願決定；不服再申訴決定者，得依法提起行政訴訟。\n第  45  條\n評議決定確定後，就其事件，有拘束各關係機關、學校之效力；原措施之學校或主管機關應依評議決定執行，主管機關並應依法監督其確實執行。\n學校未依前項規定辦理，主管機關得依相關法規追究責任，並作為扣減或停止部分或全部學校獎勵、補助或其他措施之依據。\n第  46  條\n直轄市、縣(市)及中央教師申訴評議委員會之評議書應主動公開。但其他法律另有規定者，依其規定。\n前項公開，應不包括自然人姓名以外之自然人國民身分證統一編號、護照號碼及其他足資識別該個人之資料。\n第  八  章  附則\n第  47  條\n各級學校兼任教師之資格檢定與審定，依本法之規定辦理。\n兼任、代課及代理教師之權利、義務、資格、聘任、終止聘約、停止聘約之執行與其通報、資訊之蒐集、查詢及其他相關事項之辦法，由中央主管機關定之。\n各級學校專業、技術科目教師及擔任健康與護理課程之護理教師，其資格均依教育人員任用條例之規定辦理。\n第  48  條\n前條第三項之護理教師，其解職、申訴、進修、待遇、福利、退休、資遣、撫卹事項，準用教師相關法令規定。\n經主管機關介派之護理教師具有健康與護理科合格教師資格者，主管機關得辦理介聘為健康與護理科教師；其介聘辦法，由中央主管機關定之。\n第  49  條\n本法各相關條文之規定，於下列幼兒園教師準用之：\n一、公立幼兒園教師，其聘任、解聘、不續聘、停聘、資遣、教師組織、申訴、救濟及其他管理相關事項。\n二、中華民國一百年十二月三十一日以前已準用本法之私立幼兒園教師，其聘任、進修、研究、離職、資遣、教師組織及申訴相關事項。\n第  50  條\n各級學校校長，得準用教師申訴之規定提起申訴。\n第  51  條\n本法授權中央主管機關訂定之各項法規命令，中央主管機關應邀請全國教師組織代表參與訂定。\n第  52  條\n本法施行細則，由中央主管機關定之。\n第  53  條\n本法施行日期，由行政院定之。\n本法修正條文自公布日施行。","history":"1.中華民國108年6月5日總統華總一義字第10800055651號令修正公布全文53條；施行日期，由行政院定之。\n\n2.中華民國109年5月21日行政院院臺教字第1090015037 號令發布定自109年6月30日施行。\n\n3. 中華民國115年5月13日總統華總一義字第 11500042691 號令修正公布第25、53條條文；並自公布日施行。"},{"title":"教育人員任用條例","content":"第  1  條\n教育人員之任用，依本條例行之。本條例未規定者，適用其他有關法律之規定。\n第  2  條\n本條例所稱教育人員為各公立各級學校校長、教師、職員、運動教練，社會教育機構專業人員及各級主管教育行政機關所屬學術研究機構 (以下簡稱學術研究機構) 研究人員。\n第  二  章  任用資格\n第  3  條\n教育人員之任用，應注意其品德及對國家之忠誠；其學識、經驗、才能、體能，應與擬任職務之種類、性質相當。各級學校校長及社會教育機構、學術研究機構主管人員之任用，並應注重其領導能力。\n第  4  條\n國民小學校長應持有國民小學教師證書，並具下列資格之一：\n一、曾任國民小學教師五年以上，及各級學校法規所定一級單位主管之學校行政工作三年以上。\n二、曾任國民小學或國民中學教師三年以上或合計四年以上，及薦任第八職等以上或與其相當之教育行政相關工作二年以上。\n三、曾任各級學校教師合計七年以上，其中擔任國民小學教師至少三年，及國民小學一級單位主管之學校行政工作二年以上。 前項第三款國民小學一級單位主管之學校行政工作年資，於師資培育之大學所設附屬國民小學校長，得為大學法規所定一級單位主管之學校行政工作年資。\n第  5  條\n國民中學校長應持有中等學校教師證書，並具下列資格之一：\n一、曾任國民中學教師五年以上，及各級學校法規所定一級單位主管之學校行政工作三年以上。\n二、曾任國民小學或中等學校教師三年以上或合計四年以上，及薦任第八職等以上或與其相當之教育行政相關工作二年以上。\n三、曾任各級學校教師合計七年以上，其中擔任國民中學教師至少三年，及國民中學一級單位主管之學校行政工作二年以上。\n師資培育之大學附設國民中學校長資格，除依前項各款規定辦理外，得曾任教育學院、系專任講師及中等學校教師各三年以上，並應持有中等學校教師證書；前項第三款國民中學一級單位主管之學校行政工作年資，並得為大學法規所定一級單位主管之學校行政工作年資。\n持有國民中學主任甄選儲訓合格證書之高級中等學校附設國民中學部教師，其兼任高級中等學校主任者，得以該主任年資，採計為第一項第三款國民中學一級單位主管之學校行政工作年資。\n第  6  條\n高級中等學校校長應持有中等學校教師證書，並具下列資格之一：\n一、曾任高級中等學校教師五年以上，及各級學校法規所定一級單位主管之學校行政工作三年以上。\n二、曾任中等學校教師三年以上，及薦任第九職等以上或與其相當之教育行政相關工作二年以上。\n三、曾任各級學校教師合計七年以上，其中擔任高級中等學校教師至少三年，及高級中等學校一級單位主管之學校行政工作二年以上。\n師資培育之大學附設高級中等學校校長資格，除依前項各款規定辦理外，得曾任教育學院、系專任副教授或曾任與擬任職業學校性質相關學科專任副教授，及中等學校教師各二年以上，並具各級學校法規所定一級單位主管之學校行政工作一年以上，且應持有中等學校教師證書；前項第三款高級中等學校一級單位主管之學校行政工作年資，並得為大學法規所定一級單位主管之學校行政工作年資。\n民族藝術高級中等學校校長資格，除依第一項各款規定辦理外，得曾任高級中等學校或專科以上學校之戲劇、藝術或其相關科、系(所、學程)教師二年以上，及各級學校法規所定主管職務、薦任第九職等以上或與其相當之教育、文化行政工作二年以上。\n第  6  條之  1\n特殊教育學校校長應持有學校所設最高教育階段教師證書及具備特殊教育之專業知能，並具下列資格之一：\n一、曾任特殊教育學校(班)教師五年以上，及各級學校法規所定一級單位主管之學校行政工作三年以上。\n二、曾任特殊教育學校(班)教師三年以上，及薦任第九職等以上或與其相當之教育行政相關工作二年以上。\n三、曾任各級學校教師合計七年以上，其中擔任特殊教育學校(班)教師至少三年，及高級中等以下學校一級單位主管之學校行政工作二年以上。\n第 7  條\n(刪除)\n第 8  條\n專科學校校長應具下列第一款各目資格之一及第二款資格：\n一、具下列資格之一：\n(一)中央研究院院士。\n(二)教授。\n(三)曾任相當教授之教學、學術研究工作。\n(四)曾任副教授三年以上。\n(五)曾任相當副教授三年以上之教學、學術研究工作。\n二、曾任學校、政府機關(構)或其他公民營事業機構之主管職務合計三年以上。\n第  9  條\n(刪除)\n第  10  條\n大學校長應具下列第一款各目資格之一及第二款資格：\n一、具下列資格之一：\n(一)中央研究院院士。\n(二)教授。\n(三)曾任相當教授之教學、學術研究工作。\n二、曾任學校、政府機關（構)或其他公民營事業機構之主管職務合計三年以上。 獨立學院校長資格，除依前項各款規定辦理外，得以具有博士學位，並曾任與擬任學院性質相關之專門職業，或簡任第十二職等以上或與其相當之教育行政職務合計六年以上者充任之。\n大學及獨立學院校長之資格除應符合前二項規定外，各校得因校務發展及特殊專業需求，另定前二項以外之資格條件，並於組織規程中明定。\n第  10-1  條\n本條例中華民國一百年十一月十五日修正之條文施行前曾任或現任各級學校校長，或經公開甄選儲訓合格之國民中學、國民小學校長候用人員，或符合修正前高級中等以上學校校長聘任資格者，具有同級學校校長之聘任資格；主管教育行政機關已依修正前第四條、第五條規定資格辦理校長候用人員儲訓作業者，其儲訓合格之人員，亦同。\n專科學校改制為技術學院設有專科部者，其校長得由原專科學校校長繼續擔任至任期屆滿為止。 本條例中華民國一百年十一月十五日修正之條文施行前，主管教育行政機關、學校或董事會已依修正前第四條至前條規定資格辦理校長遴選作業中者，其校長聘任資格得依修正前規定辦理。\n第  11  條\n師範大學、師範學院、師範專科學校校、院長，除應具備本條例相關各條規定之資格外，並以修習教育者為原則。\n第  12  條\n國民小學教師應具有左列資格之一：\n一、師範專科學校畢業者。\n二、師範大學、師範學院各學系、或教育學院、系畢業者。\n三、本條例施行前，依規定取得國民小學教師合格證書尚在有效期間者。\n第  13  條\n中等學校教師應具有左列資格之一：\n一、師範大學、師範學院各系、所畢業者。\n二、教育學院各系、所或大學教育學系、所畢業者。\n三、大學或獨立學院各系、所畢業，經修習規定之教育學科及學分者。\n四、本條例施行前，依規定取得中等學校教師合格證書尚在有效期間者。\n第  14  條\n大學、獨立學院及專科學校教師分為教授、副教授、助理教授、講師。\n大學、獨立學院及專科學校教師應具有專門著作在國內外知名學術或專業刊物發表，或已為接受且出具證明將定期發表，或經出版公開發行，並經教育部審查其著作合格者，始得升等；必要時，教育部得授權學校辦理審查。\n大學、獨立學院及專科學校體育、藝術、應用科技等以技能為主之教師聘任或升等，得以作品、成就證明或技術報告代替專門著作送審。\n大學、獨立學院及專科學校教師之聘任、升等均應辦理資格審查； 其審查辦法由教育部定之。\n第  15  條\n大學、獨立學院及專科學校得聘任助教協助教學及研究工作。 助教應具有左列資格之一：\n一、大學或獨立學院畢業，成績優良者。\n二、三年制專科學校畢業，曾從事與所習學科有關之研究工作、專門職業或職務二年以上；或二年制、五年制專科學校畢業，曾從事與所習學科有關之研究工作、專門職業或職務三年以上， 成績優良者。\n第  16  條\n助理教授應具有左列資格之一：\n一、具有博士學位或其同等學歷證書，成績優良，並有專門著作者。\n二、具有碩士學位或其同等學歷證書，曾從事與所習學科有關之研究工作、專門職業或職務四年以上，成績優良，並有專門著作者。\n三、大學或獨立學院醫學系、中醫學系、牙醫學系畢業，擔任臨床工作九年以上，其中至少曾任醫學中心主治醫師四年，成績優良，並有專門著作者。\n四、曾任講師三年以上，成績優良，並有專門著作者。\n第  17  條\n副教授應具有左列資格之一：\n一、具有博士學位或其同等學歷證書，曾從事與所習學科有關之研究工作、專門職業或職務四年以上，並有專門著作者。\n二、曾任助理教授三年以上，成績優良，並有專門著作者。\n第  18  條\n教授應具有左列資格之一：\n一、具有博士學位或其同等學歷證書，曾從事與所習學科有關之研究工作、專門職業或職務八年以上，有創作或發明，在學術上有重要貢獻或重要專門著作者。\n二、曾任副教授三年以上，成績優良，並有重要專門著作者。\n第  19  條\n在學術上有傑出之貢獻，並經教育部學術審議會委員二分之一以上出席及出席委員四分之三以上之決議通過者，得任大學、獨立學院或專科學校教師，不受前四條規定之限制。\n第  20  條\n偏遠或特殊地區之學校校長、教師之資格及專業科目、技術科目、特殊科目教師及稀少性科技人員之資格，由教育部定之。\n在民國八十三年二月七日前已考進師範學院幼教系及八十四年十一月十六日前已考進師範學院進修部幼教系肄業之師範生，參加偏遠地區國民小學教師甄試，其教育學科及學分之採計，由原就讀之師資培育機構依實質認定原則處理之。\n參加八十九學年度各縣市偏遠地區國小教師甄試錄取未獲介聘，符合前項規定者，應比照辦理。\n第  21  條\n學校職員之任用，依其職務類別，分別適用公務人員任用法或技術人員任用條例之規定，並辦理銓敘審查。\n本條例施行前已遴用之學校編制內現任職員，其任用資格適用原有關法令規定，並得在各學校間調任。\n各學校編制內現任職員，在本條例修正施行前，已具有公務人員或技術人員法定任用資格者，依現職改任換敘；其改任換敘辦法由考試院會同行政院定之。\n學校人事人員及主計人員之任用，分別依照各該有關法律規定辦理。 公立學校職員升等考試規則由考試院定之。\n第  22  條\n社會教育機構專業人員及學術研究機構研究人員之聘任資格，依其職務等級，準用各級學校教師之規定。\n第  22-1  條\n各級學校專任運動教練之資格，由中央體育主管機關定之；聘任程序及聘期，由中央主管機關定之。\n第  三  章  任用程序\n第  23  條\n(刪除)\n第  24  條\n(刪除)\n第 25  條\n(刪除)\n第  26  條\n各級學校教師之聘任，應本公平、公正、公開之原則辦理，其程序如左：\n一、高級中等以下學校教師除依法令分發者外，由校長就經公開甄選之合格人員中，提請教師評審委員會審查通過後聘任。\n二、專科學校教師經科務會議，由科主任提經教師評審委員會評審通過後，報請校長聘任。\n三、大學、獨立學院各學系、研究所教師，學校應於傳播媒體或學術刊物刊載徵聘資訊後，由系主任或所長就應徵人員提經系(所) 、院、校教師評審委員會評審通過後，報請校長聘任。 前項教師評審委員會之設置辦法，除專科以上學校由學校組織規程規定外，其辦法由教育部定之。\n第  27  條\n國民中、小學校長之遴選，除依法兼任者外，應就合格人員以公開方式甄選之。中等學校教師，除分發者外，亦同。\n第  28  條","history":"中華民國103年1月22日總統華總一義字第 10300008941號令修正公布第31條條文。"},{"title":"教育人員任用條例施行細則","content":"第  1  條\n本細則依教育人員任用條例(以下簡稱本條例)第四十二條規定訂定之。\n第  2  條\n本條例所稱各級學校，指大學、獨立學院、專科學校、高級中學、職業學校、國民中小學、各級補習學校及各級特殊教育學校。\n第  3  條\n本條例所稱高級中等學校，指高級中學、職業學校；所稱中等學校，指高級中學、職業學校及國民中學；所稱中小學，指高級中學、職業學校、國民中小學。\n補習學校、特殊教育學校等級之認定，依各該有關法令之規定。\n第  4  條\n本條例所稱社會教育機構專業人員，指依原社會教育法第四條、第五條及終身學習法第八條第一項、第三項設立之社會教育機構，其組織法規中，除行政人員外，定有職務名稱其職等列為聘任之人員。\n前項專業人員之職務等級，依社會教育機構專業人員與各級學校教師職務等級比照表(附表一)之規定。\n社會教育機構專業人員之遴聘及審查，依教育部之規定。\n第  5  條\n本條例所稱學術研究機構研究人員，指各級主管教育行政機關所屬學術研究機構組織法規中，除行政人員外，定有職務名稱其職等列為聘任之人員。\n前項研究人員之職務等級，研究員比照教授、副研究員比照副教授、助理研究員比照助理教授、研究助理比照講師。\n學術研究機構研究人員之遴聘及審查，依教育部之規定。\n第  6  條\n本條例八十六年三月二十一日修正生效前已聘任之社會教育機構、學術研究機構之現職助理研究員、研究助理及其他相當等級之專業人員，在未取得本條例八十六年三月二十一日修正生效後所定之資格前，仍依原職務等級晉敘。\n第  7  條\n(刪除)\n第  8  條\n(刪除)\n第  9  條\n(刪除)\n第  10  條\n本條例第六條第三項所定民族藝術高級中等學校，由教育部認定之。\n第  11  條\n本條例所稱曾任各級學校教師年資，以專任為原則，兼任教師年資，折半計算。\n大學校院附設醫院之專任醫事人員兼任同校臨床學科教師，從事臨床教學工作，其聘任、升等審查基準與程序、課程負擔及教師評鑑等，經所屬學校比照專任教師辦理，並納入校內章則規範，且未支給兼任教師薪資者，報教育部審查同意後，其辦理教師資格審查時，得以專任教師年資採計。\n前項以外經依法規評鑑為醫學中心之醫院專任醫事人員，兼任設有醫學系院並與該醫院具有合作關係之大學校院(以下簡稱合作學校)之臨床學科教師，符合下列各款規定者，報教育部審查同意後，其辦理教師資格審查時，亦得以專任教師年資採計：\n一、經合作學校比照校內專任教師辦理其聘任、升等審查基準與程序、課程負擔及教師評鑑等，並納入校內章則規範。\n二、未支給兼任教師薪資。\n三、合作學校當年度送審之兼任醫事人員總人數至多不超過合作學校前一學年度醫學系院專任教師總人數之百分之十。\n第  12  條\n本條例所稱專門職業，指考試法規及職業法規所定領有執業證書而其性質程度與擬任職務相當之專門性或技術性職業；所稱專門職務，指在政府機關、學校或公民營機構從事與所習學科有關、任教課程性質相近及程度相當之專門性或技術性職務。\n第  13  條\n本條例第八條及第十條所稱曾任學校、政府機關(構)或其他公民營事業機構之主管職務，指符合下列條件之一者：\n一、曾任專科以上學校組織法規所定一級單位主管以上之職務。\n二、曾任中央研究院組織法規所定一級單位主管以上之職務。\n三、曾任政府機關(構)或公營事業機構薦任第九職等或相當薦任第九職等以上之主管職務。\n四、曾任下列民營事業機構主管職務之一：\n(一)在主管機關登記有案，其實收資本額在新臺幣八千萬元以上，並依其組織架構所列一級單位主管以上之職務。\n(二)在主管機關登記有案，且符合衛生主管機關所定綜合醫院設置標準之醫院，並依其組織架構所列一級單位主管以上之職務。\n第  13-1  條\n本條例第八條所稱相當教授之教學、學術研究工作，指符合下列條件之一者：\n一、依專科以上學校兼任教師聘任辦法擔任兼任教授、依大學聘任專業技術人員擔任教學辦法擔任專任或兼任教授級專業技術人員、依專科學校專業及技術教師遴聘辦法擔任專任或兼任教授級專業及技術教師、依大學研究人員聘任辦法擔任研究員。\n二、曾任專科以上學校講座教授或榮(名)譽教授，具博士學位或其同等學歷證書後，曾從事相關之教學或研究工作八年以上，有創作、發明或重要專門著作，在教學、學術研究上有重要貢獻。\n三、曾任公立學術研究機構研究人員或研究技術人員、財團法人或行政法人研究組織研究人員或公民營事業機構研發部門研發人員，具博士學位或其同等學歷證書後，曾從事相關之教學或研究工作八年以上，有創作、發明或重要專門著作，在教學、學術研究上有重要貢獻。\n本條例第八條所稱相當副教授之教學、學術研究工作，指符合下列條件之一者：\n一、依專科以上學校兼任教師聘任辦法擔任兼任副教授、依大學聘任專業技術人員擔任教學辦法擔任專任或兼任副教授級專業技術人員、依專科學校專業及技術教師遴聘辦法擔任專任或兼任副教授級專業及技術教師、依大學研究人員聘任辦法擔任副研究員。\n二、曾任公立學術研究機構研究人員或研究技術人員、財團法人或行政法人研究組織研究人員或公民營事業機構研發部門研發人員，具博士學位或其同等學歷證書後，曾從事相關之教學或研究工作四年以上，並有專門著作。\n本條例第十條所稱相當教授之教學、學術研究工作，指符合下列條件之一者：\n一、依專科以上學校兼任教師聘任辦法擔任兼任教授、依大學聘任專業技術人員擔任教學辦法擔任專任或兼任教授級專業技術人員、依大學研究人員聘任辦法擔任研究員。\n二、曾任專科以上學校講座教授或榮(名)譽教授，具博士學位或其同等學歷證書後，曾從事相關之教學或研究工作八年以上，有創作、發明或重要專門著作，在教學、學術研究上有重要貢獻。\n三、曾任公立學術研究機構研究人員或研究技術人員、財團法人或行政法人研究組織研究人員或公民營事業機構研發部門研發人員，具博士學位或其同等學歷證書後，曾從事相關之教學或研究工作八年以上，有創作、發明或重要專門著作，在教學、學術研究上有重要貢獻。\n本細則中華民國一百零八年八月一日修正施行前，已依本條例第八條或第十條所定曾任相當教授或相當副教授之教學、學術研究工作資格擔任專科學校校長或大學校長者，具有專科學校校長或大學校長之聘任資格。\n第  14  條\n本條例第十一條所稱修習教育者，指大學校院畢業且修畢規定教育學程 (分) 者。\n第  15  條\n本條例第十二條第一款所定師範專科學校畢業者，不包括幼稚教育師資科畢業者。\n第  15-1  條\n本條例第十二條、第十三條、第十五條、第十六條及第十六條之一所稱研究所、大學、獨立學院、專科學校畢業，指公立或已立案之私立或符合教育部採認規定之國外、大陸地區、香港及澳門研究所、大學、獨立學院及專科學校畢業。\n第  16  條\n本條例第十三條所稱師範大學、師範學院、教育學院、大學或獨立學院各系所畢業，指擔任學科之本學系所或相關系所畢業，或其他系所畢業而曾修習規定之專門科目學分者。\n第  17  條\n本條例施行前，合於大學、獨立學院及專科學校講師資格審查規定而仍繼續在職者，得依本條例第三十條規定報請審查其資格。\n第  18  條\n本條例第十六條、第十六條之一、第十七條及第十八條所稱博士學位及碩士學位之同等學歷，由教育部視其入學程度、修業年限及學術造詣認定之。\n第  19  條\n各級學校延聘教師，應以審查合格之等級或檢定之類科為準。\n高級中等以下學校除法令另有規定外，初任教師應具有合格教師證明。\n專科以上學校初任教師，應於到職三個月內，報請審查其資格，除有不可歸責於教師之事由外，屆期不送審者，聘約期滿後，不得再聘；送審未通過者，應即撤銷其聘任。\n第  20  條\n教師擬於聘約期滿後，不再應聘時，應於聘約期滿一個月前以書面通知學校。如欲於聘約存續期間內辭職者，應經學校同意後，始得離職。\n第  21  條\n本條例所稱學校職員，指各級學校編制內辦理學校行政工作及一般技術工作之專任人員。但教學、研究及稀少性科技人員不在其內。\n前項稀少性科技人員遴用資格辦法，由教育部定之。\n第  22  條\n本條例第二十一條第二項所稱原有關法令規定，指本條例七十四年五月三日公布生效前，經主管教育行政機關、學校核定或訂定之任用、升遷及組織規程等規定。\n第  23  條\n本條例施行前已遴用之各類學校現任職員，具有下列資格之一者，依法取得任用資格：\n一、依考試法規所舉行之各類公務人員考試及格者。\n二、依公務人員各種任用法規銓敘合格者。\n三、登記合格領有銓敘部證書者。\n未依前項規定取得任用資格之職員及稀少性科技人員，其成績考核準用公務人員考績法及其相關規定辦理。\n第  24  條\n各級補習學校及特殊性質學校校長、教師之遴用資格及程序，準用本條例同級同類學校校長、教師之規定。\n第  24-1  條\n本條例第四十一條所稱宗教事業機構，指符合下列條件之一者：\n一、經內政部或直轄市、縣(市)政府許可設立，並向法院登記具宗教性質之財團法人或公益社團法人。\n二、前款法人附設之組織、機構或捐資設立之法人、機構。\n三、經登記或立案之寺廟。\n本條例第四十一條所稱主管職務，指前項宗教事業機構之下列人員之一：\n一、負責人。\n二、章程或內部組織編制所載之一級單位主管。\n三、擔任其他經教育部認定為主管職務者。\n第  25  條\n高級中等以上學校軍訓教官及護理教師之遴選任用，依教育部及國防部有關法規辦理。\n第  26  條\n各級海事學校研究或實習用船之海事人員，其遴選任用，由教育部會同有關機關定之。\n第  27  條\n本細則自發布日施行。","history":"中華民國108年8月1日教育部臺教人(二)字第1080109562B號令增訂發布第13-1條條文。"},{"title":"高級中等以下學校教師評審委員會設置辦法","content":"第  1  條\n本辦法依教師法(以下簡稱本法)第九條第四項規定訂定之。\n第  2  條\n高級中等以下學校教師評審委員會(以下簡稱本會)之任務如下：\n一、教師初聘、續聘及長期聘任之審查。\n二、教師長期聘任聘期之訂定。\n三、教師解聘、不續聘、停聘及資遣之審議。\n四、教師違反本法規定之義務及聘約之審議。\n五、其他依法令應經本會審議之事項。\n本會辦理前項第一款教師初聘之審查時，應以公開甄選或現職教師介聘方式為之。辦理公開甄選時，得經本會決議成立甄選委員會、聯合數校或委託主管機關辦理。\n前項甄選委員會之組織及作業規定，由辦理之學校或機關定之；現職教師之介聘，依相關法令規定辦理。\n第  3  條\n本會置委員五人至十九人，其組成方式如下：\n一、當然委員：\n(一)校長一人。校長因故出缺時，以代理校長擔任。\n(二)家長會代表一人。\n(三)學校教師會代表一人。跨校、跨區(鄉、鎮)合併成立之學校教師會，以該教師會選(推)舉之各該校代表擔任；尚未成立學校教師會者，不置教師會代表。\n二、選舉委員：由全體專任教師選(推)舉之。\n本會委員中未兼行政或董事之教師，不得少於委員總額二分之一。但學校未兼行政或董事之教師員額少於委員總額二分之一者，不在此限。\n本會任一性別委員人數不得少於委員總額三分之一。但學校任一性別教師人數少於委員總額三分之一者，不在此限。\n第一項第二款之委員選(推)舉時，得選(推)舉候補委員若干人，於當選委員因故不能擔任時依序遞補之。無候補委員遞補時，應即辦理補選(推)舉。\n本會委員之總額、選舉與被選舉資格、委員選(推)舉方式、依第五條規定增聘校外學者專家擔任本會委員與候補委員遴聘方式、會議規範及相關事項規定，應由學校訂定，經校務會議通過後實施。\n第  4  條\n本會委員任期一年，自九月一日起至翌年八月三十一日止，連選得連任。\n遞補之候補委員或補選(推)舉產生之委員，其任期均至原任期屆滿之日止。\n本會委員應親自出席會議。\n選舉委員於任期中經本會認定無故缺席達二次或因故無法執行職務者，解除其委員職務。\n第  5  條\n學校依本法第九條第三項另行增聘校外學者專家擔任本會委員，產生方式如下：\n一、處理本法第十四條第一項第七款、第十款及第十五條第一項第三款、第四款時，自教育部國民及學前教育署(以下簡稱國教署)建置之高級中等以下學校教師評審委員會校外學者專家人才庫(以下簡稱教評會人才庫)遴聘之。\n二、處理本法第十五條第一項第一款及第二款時，自依校園性侵害性騷擾或性霸凌防治準則第二十二條規定建置之校園性侵害性騷擾或性霸凌調查專業人才庫遴聘之。\n前項校外委員，於審議前項各款案件時，始具委員資格；其委員人數及任期不受第三條第一項及前條第一項規定之限制。\n本辦法修正施行前，本會已受理涉及本法第九條第三項案件，於本辦法修正施行後尚未審議完竣者，應依前二項規定辦理。\n國教署應定期更新教評會人才庫之資訊。\n教評會人才庫人員，有違反客觀、公正、專業之原則，或有其他不適任情形，致其認定事實顯有偏頗，並由國教署確認者，應自教評會人才庫移除之。\n教評會人才庫人員個人資料之蒐集、處理及利用，應依個人資料保護法之規定。\n第  6  條\n新設立學校無法依規定組成本會前，得由校長(籌備主任)聘請地方教師會代表、社(學)區公正人士或其他相關人員組成遴選委員會，報主管機關核定後，辦理第二條有關事項。\n學校成立後三個月內應即依第三條及前條規定成立本會，前項遴選委員會並於本會成立之日解散。\n第  7  條\n本會由校長召集；經全體委員二分之一以上連署召集時，校長應自受請求後五日內召集；校長不召集時，得由連署委員互推一人召集之。\n本會開會時，以校長為主席，校長因故無法主持時，由委員互推一人為主席。\n第  8  條\n本會之決議，除有下列情形之一者外，應經全體委員二分之一以上出席及出席委員二分之一以上之審議通過：\n一、審查教師長期聘任事項，應經全體委員三分之二以上出席及全體委員    三分之二以上之審議通過。\n二、本法第十四條至第十六條、第十八條或相關法規另有規定。\n審議本法第九條第三項之議案時，全體委員應計入校外學者專家之委員；非審議本法第九條第三項之議案時，不予計入。\n決議過程及個別委員意見，應對外嚴守秘密。\n本會為第一項序文及第二款決議時，迴避之委員不計入該項決議案之出席委員人數；為第一項第一款審查教師長期聘任事項決議時，迴避之委員不計入該項決議案之全體委員人數。\n第  9  條\n本會委員於審查有關委員本人或其配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者之事項時，應自行迴避。\n本會委員有下列各款情形之一者，審查事項之當事人得向本會申請迴避︰一、有前項所定之情形而不自行迴避。\n二、有具體事實，足認其執行任務有偏頗之虞。\n前項申請，應舉其原因及事實，並為適當之釋明；被申請迴避之委員，對於該申請得提出意見書，由本會決議之。\n本會委員有第一項所定情形不自行迴避，而未經審查事項當事人申請迴避者，應由本會依職權命其迴避。\n第  10  條\n本會委員均為無給職。\n學校教師執行本會委員職務時，該校應核予公假，所遺課務由學校遴聘合格人員代課。\n第  11  條\n本會審議第二條第一項第三款及第四款事項時，應給予當事人陳述意見之機會。\n本會基於調查事實及證據之必要，得以書面通知審議事項相關人員列席陳述意見。通知書中應記載詢問目的、時間、地點、得否委託他人到場及不到場所生之效果。\n第  12  條\n本會審議第二條第一項第三款及第四款事項之當事人或利害關係人，得依學校規定申請閱覽、抄寫、複印或攝影有關資料或卷宗。但以主張或維護其法律上利益有必要者為限。\n學校對前項之申請，除有下列情形之一者外，不得拒絕︰\n一、本會決議前之擬稿或其他準備作業文件。\n二、涉及公務機密。\n三、涉及個人隱私。\n四、有侵害第三人權利之虞。\n五、有嚴重妨礙教學、行政職務正常進行之虞。\n前項第二款及第三款無保密必要之部分，仍應准許閱覽。\n本會審議事項之當事人就第一項資料或卷宗內容關於自身之記載有錯誤者，得檢具事實證明，請求學校更正。\n第  13  條\n本會之行政工作，由學校人事單位主辦，教務、總務等單位協辦；人事單位應就審議案件會同相關單位，依據有關法令研提參考意見，開會時並應列席。\n第  14  條\n本辦法自發布日施行。","history":"中華民國109年6月28日教育部臺教授國部字第 1090065729B\n\n號令修正發布全文 14條；並自發布日施行。"},{"title":"新北市立高級中等以下學校兼任代課及代理教師聘任補充規定","content":"一、新北市立高中職及國民中小學兼任代課及代理教師聘任補充規定(以下簡稱本補充規定)係依高級中等以下學校兼任代課及代理教師聘任辦法(以下簡稱本辦法)第十八條規定訂定之。\n二、新北市立高中職及國民中學小學(以下簡稱學校)兼任代課及代理教師之聘任，除依本辦法及相關法規規定外，並應依本補充規定辦理。\n三、本補充規定所稱長期代理教師，係指擔任代理教師連續三個月以上者；所稱短期代理教師，指擔任代理教師連續未滿三個月者。\n四、學校每學期課程編排所餘節數，應優先安排及確認編制內教師兼課節數後，仍有餘留節數時，得對外聘任合格教師擔任兼任教師，並以非退休教師為優先。\n前項兼任教師授課科目與時數，應依教育部頒課程標準辦理同班同性質課程以兼授為原則。\n五、學校編制內教師因差假或其他原因所遺之課務，得對外聘任合格教師擔任代課教師，並以非退休教師為優先。\n六、學校聘任代理教師，應以合格教師為優先。\n前項代理教師在外兼課、兼職，比照公立各級學校專任教師兼職處理原則辦理。\n七、學校聘任兼任教師及長期代理教師，其聘約於不違反本補充規定及相關法規規定下，得依實際需要簽訂定之。\n學校聘任代理教師，實際需要為一學期或一學年者，應依下列規定辦理：\n(一)聘期為一學期者，其聘期應自當學期起日至當學期訖日止。\n(二)聘期為一學年者，其聘期應自當學年起日至當學年訖日止。\n前項代理教師，其初次聘任因招聘作業或其他因素延遲，致未於當學期起日或當學年起日聘任者，聘期自實際聘任日起算。\n八、學校聘任校外現職軍公教人員為兼任、代課教師，應經其服務單位之同意；其為機關首長者，應經上級主管機關之許可。\n九、兼任及代課教師之鐘點費，除法規另有規定外，依公立中小學兼任及代課教師鐘點費支給基準支給之。\n十、代理教師待遇之支給，比照專任教師之規定。但未具所代理科(類)別合格教師證書者，其學術研究費按相當等級專任教師八成數額支給。\n代理教師依起聘時所具學歷及聘任資格敘薪。但代理教師具有代理該教育階段、類（科）別合格教師資格者，其提敘薪級及取得較高學歷改敘，比照專任教師之規定。\n代理教師於代理期間取得聘任之教育階段、類（科）合格教師證者，得辦理改敘，並自申請日生效。\n十一、長期代理教師待遇，按實際代理之月數，按月支給；其支薪起迄日期依實際到職日、離職日核算。\n短期代理教師待遇，按實際代理日數支給。\n代理教師得比照行政院當年度核定之軍公教年終工作獎金(慰問金)發給注意事項發給年終工作獎金。\n十二、兼任、代課及代理教師，因故無法按時到校授課或執行職務者，應先經學校同意調整授課時間或另請他教師代課、代理；其鐘點費、薪資由代為授課、執行職務之教師支領。\n十三、長期代理教師之出勤管理比照專任教師之規定，其給假準用行政院與所屬中央及地方各機關聘僱人員給假辦法第三條規定。\n代理教師經主管機關核准兼任學校行政職務者，準用教師請假規則第八條，給予休假、休假補助費及未休假加班費。\n聘期為一學期或一學年未兼任學校行政職務代理教師，於學生寒暑假期間之到校，準用教師請假規則第十二條規定。\n十四、兼任、代課及代理教師參加勞工保險、勞工退休金及全民健康保險者，依相關規定辦理。\n十五、學校聘任兼任、代課及代理教師，應於聘約註明代理原因並約定授課、聘期、終止聘約、停止聘約執行、待遇、請假、保險、退休金及其他相關權利義務事項。\n長期代理教師，其留職停薪，適用性別工作平等法之規定，並應於聘約中事先約定。\n長期代理教師離職或服務證明文件應載明離職原因及聘約失效等事項。\n聘期三個月以上經公開甄選之代課、代理教師，其服務成績優良之考核項目、認定標準及辦理程序由學校自訂，並經學校教師成績考核委員會核議，學校應依核議結果，成績優良者於個人離職或服務證明文件，加註服務成績優良。\n十六、兼任、代課及代理教師之服務成績及平時獎懲，應比照專任教師成績考核相關規定辦理。","history":"1.中華民國108年9月4日新北市政府新北府教國字第1081639044號函修正第7點條文；並自108年8月1日生效。\n\n2.中華民國109年10月23日新北市政府新北府教國字第 1092010079號函修正第 1、4、6、9點條文；並自即日生效。\n\n3.中華民國113年7月5日新北市政府新北府教國字1131276853號函修正名稱及第4、6、7、13、15點條文；並自即日生效(原名稱：新北市立高中職及國民中小學兼任代課及代理教師聘任補充規定；新名稱：新北市立高級中等以下學校兼任代課及代理教師聘任補充規定)。\n\n4. 中華民國114年9月19日新北市政府新北府教國字第 1141900691號函修正第10點條文；並自114年8月1日生效。"},{"title":"國民中小學教學支援工作人員聘任辦法","content":"第 1 條\n本辦法依國民教育法（以下簡稱本法）第二十四條第二項規定訂定之。\n第 2 條\n本辦法所稱教學支援工作人員（以下簡稱教學支援老師），指具有下列特定科目、領域之專長，並以部分時間擔任教學支援工作者：\n一、本土語文：包括原住民族語文、客語文、閩南語文及閩東語文。\n二、臺灣手語。\n三、新住民語文：以越南、印尼、泰國、緬甸、柬埔寨、菲律賓及馬來西亞七國官方語文為主。\n四、英語文及第二外國語文。\n五、藝術。\n六、綜合活動。\n七、其他學校發展特色或經各主管機關指定科目、領域專長。\n第 3 條\n擔任前條第一款至第三款特定科目、領域專長之教學支援老師，應具備下列資格：\n一、前條第一款本土語文專長：\n（一）原住民族語文，應符合下列規定：\n1.具備下列原住民族語言能力認證之一：\n（1）取得原住民族委員會中華民國一百零二年十二月三十一日以前核發之原住民族語言能力證明書。\n（2）取得原住民族委員會一百零三年一月一日以後核發之原住民族語言能力證明書。任教國民中學及高級中等學校者，應具備高級以上合格證明書；任教國民小學者，應具備中高級以上合格證明書。\n2.具備下列資格之一：\n（1）原住民族委員會核發之原住民族語言能力認證合格人員研習結業證書。\n（2）經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之教學支援老師認證，取得合格證書。\n（3）大學校院依原住民族語言師資培育計畫辦理核發之修畢學分證明書。\n（二）客語文：參加客家委員會或其公告之學校、機構或法人辦理之客語能力認證，取得中高級以上之能力證明，並經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之教學支援老師認證，取得合格證書者。\n（三）閩南語文：參加中央主管機關或其公告之學校、機構或法人辦理之閩南語能力認證，取得中高級以上之能力證明，並經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之教學支援老師認證，取得合格證書者。\n（四）閩東語文：經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之閩東語文教學支援老師認證，取得合格證書者。\n二、前條第二款臺灣手語專長：經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之臺灣手語教學支援老師認證，取得合格證書者。\n三、前條第三款新住民語文專長：經中央主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之新住民語文教學支援老師認證，取得合格證書者。\n第 4 條\n前條第一款第一目之二、第二目至第四目、第二款及第三款之教學支援老師認證，其程序及內容，規定如下：\n一、資格審查：\n（一）原住民族語文、客語文及閩南語文之報名資格及審查基準，由各辦理認證之機關定之。\n（二）閩東語文、臺灣手語及新住民語文教學支援老師之報名資格及審查基準，由中央主管機關定之。\n二、教學專業培訓：應依中央主管機關之規定辦理。\n三、認證測驗：\n（一）應以筆試、口試或展演等方式為之，並於簡章中定明。\n（二）已取得前條第一款第一目至第三目規定之語言能力證明者，參加各該科目教學支援老師認證測驗時，得免筆試。\n第 5 條\n第二條第四款至第七款特定科目、領域專長之教學支援老師，應經直轄市、縣（市）主管機關所舉辦之教學支援老師認證，取得合格證書；其報名資格、審查基準、認證程序及內容，應依直轄市、縣（市）主管機關之規定辦理。\n第 6 條\n各校聘任教學支援老師，應公開甄選，並經教師評審委員會審查通過後，由校長聘任之；其聘任期間，每次最長為一學年。但未達一學期者，得逕由校長聘任之。\n本土語文教學支援老師之甄選，學校得依原住民族教育法第三十五條規定聘任地方耆老或具相關專長人士擔任。\n新住民語文教學支援老師之甄選，無合格人員報名或合格人員經甄選未通過者，學校得聘任具新住民語文專長之新住民或相關人士擔任。\n前三項教學支援老師表現良好，經教師評審委員會審查通過者，得免甄選再聘一學年，並以免甄選二次為限。\n第 7 條\n教學支援老師有下列各款情形之一者，學校應予以解聘，且終身不得聘任為教學支援老師：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n四、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性侵害行為屬實。\n五、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘及終身不得聘任為教學支援老師之必要。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十五條或第二十七條規定處罰，經學校性別平等教育委員會或依法令組成之相關委員會確認，有解聘及終身不得聘任為教學支援老師之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有解聘及終身不得聘任為教學支援老師之必要。\n八、知悉服務學校發生疑似校園性侵害事件，未依性別平等教育法規定通報，致再度發生校園性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園性侵害事件之證據，經學校查證屬實。\n九、偽造、變造或湮滅他人所犯校園毒品危害事件之證據，經學校查證屬實。\n十、體罰或霸凌學生，造成其身心嚴重侵害。\n十一、行為違反相關法規，經學校查證屬實，有解聘及終身不得聘任為教學支援老師之必要。\n教學支援老師聘期在一學期以上，有前項第一款至第三款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘；有前項第四款至第六款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以解聘。\n教學支援老師聘期在一學期以上，有第一項第七款或第十款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第一項第八款、第九款或第十一款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n教學支援老師聘期未滿一學期，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘。\n第 8 條\n教學支援老師有下列各款情形之一者，學校應予解聘，且應議決一年至四年不得聘任為教學支援老師：\n一、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十五條或第二十七條規定處罰，經學校性別平等教育委員會或依法令組成之相關委員會確認，有解聘之必要。\n三、體罰或霸凌學生，造成其身心侵害，有解聘之必要。\n四、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有解聘之必要。\n五、行為違反相關法規，經學校查證屬實，有解聘之必要。\n教學支援老師聘期在一學期以上，有前項第一款或第二款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以解聘。\n教學支援老師聘期在一學期以上，有第一項第三款或第四款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第一項第五款規定情形者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n教學支援老師聘期未滿一學期，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘。\n第 9 條\n教學支援老師聘任後，有下列各款情形之一者，應予以解聘：\n一、教學不力或不能勝任工作有具體事實。\n二、違反聘約情節重大。\n教學支援老師聘期在一學期以上，有前項各款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n教學支援老師聘期未滿一學期，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘。\n第 10 條\n有下列各款情形之一者，不得聘任為教學支援老師；已聘任者，學校應予以解聘：\n一、有第七條第一項各款情形。\n二、有第八條第一項各款情形，於該議決一年至四年期間。\n三、有教師法第十四條第一項各款、第十九條第一項第一款情形。\n四、有教師法第十五條第一項各款、第十九條第一項第二款情形，於該議決一年至四年期間。\n五、有教師法第十八條第一項情形，於該終局停聘六個月至三年期間。\n六、有性別平等教育法第二十九條第一項第一款、第三項前段情形。\n七、有性別平等教育法第二十九條第一項第二款、第三項後段情形，於該議決一年至四年期間。\n有前項各款情形，且屬依第十一條、教師法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，未聘任者，不得聘任；已聘任者，免經教師評審委員會、學校性別平等教育委員會或依法令組成之相關委員會審議，由學校逕予解聘；非屬依第十一條、教師法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，學校應依第七條或第八條規定辦理，未聘任者，不得聘任；已聘任者，予以解聘。\n第 11 條\n教學支援老師有第七條第一項、第八條第一項及前條規定之情形者，學校應辦理通報、資訊之蒐集、查詢、處理及利用；學校聘任教學支援老師前，應查詢其有無前條規定之情形，已聘任者，應定期查詢；其通報、資訊之蒐集、查詢、處理、利用及其他相關事項，準用不適任教育人員之通報資訊蒐集及查詢處理利用辦法之規定。\n第 12 條\n教學支援老師有下列各款情形之一者，當然暫時予以停聘：\n一、依刑事訴訟程序被通緝或羈押。\n二、依刑事確定判決，受褫奪公權之宣告。\n三、依刑事確定判決，受徒刑之宣告，在監所執行中。\n第 13 條\n教學支援老師於聘約有效期間內，涉有下列各款情形之一者，服務學校應於知悉之日起一個月內經教師評審委員會審議通過後，免報主管機關核准，暫時予以停聘六個月以下，並靜候調查；必要時，得經教師評審委員會審議通過後，延長停聘期間二次，每次不得逾三個月，其停聘期間不得超過聘約有效期間。經調查屬實者，依第七條或第八條規定辦理：\n一、第七條第一項第四款至第六款情形。\n二、第八條第一項第一款或第二款情形。\n教學支援老師於聘約有效期間內，涉有下列各款情形之一，服務學校認為有先行停聘進行調查之必要者，應經教師評審委員會審議通過，免報主管機關核准，暫時予以停聘三個月以下；必要時，得經教師評審委員會審議通過後，延長停聘期間一次，且不得逾三個月；其停聘期間不得超過聘約有效期間。經調查屬實者，依第七條或第八條規定辦理：\n一、第七條第一項第七款至第十一款情形。\n二、第八條第一項第三款至第五款情形。\n前二項情形應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過。\n第 14 條\n依第十二條第二款、第三款規定停聘之教學支援老師，停聘期間不發給鐘點費。\n依第十二條第一款、前條第一項規定停聘之教學支援老師，於停聘期間不發給鐘點費；停聘事由消滅後，未予解聘者，補發其停聘期間全數鐘點費。\n依前條第二項規定停聘之教學支援老師，於停聘期間發給半數鐘點費；調查後未予解聘者，補發其停聘期間另半數鐘點費。\n第 15 條\n教學支援老師依其認證類科，以擔任國民中小學特定科目、領域教學為限，不得轉任或兼任其他課程之教學。\n第 16 條\n教學支援老師之教學時間，於單一學校（不包括分校）之每週教學節數，以不超過二十節為原則。\n第 17 條\n教學支援老師之待遇，依各校實際授課之節數支給鐘點費，聘任期間應按月發給。但因天然災害、法定傳染病或其他不可抗力因素，致全校或全班停止上班上課而無實際授課，學校應依原排定課程發給鐘點費。\n前項教學支援老師鐘點費支給基準，由中央主管機關擬訂，報行政院核定。\n第 18 條\n教學支援老師於受聘期間，得享有下列權利：\n一、對學校教學及行政事項提供興革意見。\n二、參與教學有關之校內研習或活動。\n三、享受學校各種教學資源。\n第 19 條\n教學支援老師於受聘期間，除應遵守法令履行聘約外，並負有下列義務：\n一、遵守聘約規定，維護校譽。\n二、積極維護學生受教之權益。\n三、依有關法令及學校安排之課程，實施適性教學活動。\n四、輔導或管教學生，導引其適性發展，並培養其健全人格。\n五、嚴守職分，本於良知，發揚專業精神。\n六、非依法律規定不得洩漏學生個人或其家庭資料。\n七、其他依法令規定應盡之義務。\n第 20 條\n本法第二十四條第三項所定認證資格之互相承認及教學支援老師聘任之相關事宜，由直轄市、縣（市）主管機關定之。\n第 21 條\n高級中等學校依據學生需求、學校發展願景及特色，得準用本辦法之規定聘任教學支援老師，擔任本土語文、臺灣手語或第二外國語文課程或其他經中央主管機關指定科目之教學。\n第 22 條\n本辦法自發布日施行。\n本辦法中華民國一百十四年六月十二日修正發布之條文，自一百十四年八月一日施行。\n本辦法中華民國一百十四年十一月十七日修正發布之條文，自一百十四年十一月二十日施行。","history":"1.中華民國109年6月28日教育部臺教授國部字第 1090064869B號令修正發布全文21條；並自發布日施行。\n\n2.中華民國111年5月9日教育部臺教授國部字第 1110054951A號令修正發布第2～4、20 條條文；增訂第4-1條條文。\n\n3.中華民國112年11月6日教育部臺教授國部字第 1120139702A號令修正發布第1、6、19條條文。\n\n4.中華民國113年10月25日教育部臺教授國部字第 1135505350A號令修正發布全文22條；並自發布日施行。\n\n5.中華民國114年6月12日教育部臺教授國部字第 1145502070A號令修正發布第 3、17、22  條條文；並自114年8月1日施行。\n\n6. 中華民國114年11月17日教育部臺教授國部字第1145505850A號令修正第21條、第22條。"},{"title":"高級中等以下學校兼任代課及代理教師聘任辦法","content":"第  1  條\n本辦法依教師法(以下簡稱本法)第四十七條第二項規定訂定之。\n第  2　條\n本辦法所稱兼任、代課及代理教師，定義如下：\n一、兼任教師：指以部分時間擔任高級中等以下學校(以下簡稱學校)編制內教師依規定排課後尚餘之課務或特殊類科之課務者。\n二、代課教師：指以部分時間擔任學校編制內教師因差假或其他原因所遺之課務者。\n三、代理教師：指以全部時間擔任學校編制內教師因差假或其他原因所遺之課務者。\n第　3　條\n學校聘任兼任教師，應由校長就具有各該教育階段、科(類)合格教師證書者聘任之。\n學校藝術才能班因課程安排需要聘任兼任教師，得由校長就校外具藝術專長者聘任之，不受前項規定資格之限制。\n學校聘任三個月以上之代課、代理教師，應依下列資格順序公開甄選，經教師評審委員會審查通過後，由校長聘任之：\n一、具有各該教育階段、科(類)合格教師證書者。\n二、無前款人員報名或前款人員經甄選未通過者，得為具有修畢師資職前教育課程，取得修畢證明書者。\n三、無前款人員報名或前款人員經甄選未通過者，得為具有大學以上畢業者。\n前項第二款、第三款資格，應以具出缺科(類)專長者，優先聘任之。第三項甄選作業，得以一次公告分次招考方式辦理；甄選作業完竣後，學校應檢附甄選簡章、錄取名單及相關會議紀錄，報各該主管機關備查。但經各該主管機關核准免報者，不在此限。\n學校聘任未滿三個月之代課或代理教師，得免經公開甄選及教師評審委員會審查程序，由校長就符合第三項規定資格者聘任之。\n第　4　條\n學校聘任三個月以上經公開甄選之代課、代理教師，其服務成績優良、符合學校校務需求，且具前條第三項第一款資格者，經教師評審委員會審查通過後得再聘之，再聘至多以二次為限，發生災害防救法第二條第一款所定災害或傳染病防治法第三條第一項所定傳染病時，報經各該主管機關核准後，再聘得不受二次之限制；偏遠地區學校之代課、代理教師，有下列情形之一者，亦同：\n一、依前條第三項第二款或第三款資格聘任之藝術與人文學習領域、藝術領域或藝術群之代課、代理教師。\n二、依前條第三項第二款或第三款資格聘任，且具出缺科(類)專長之代課、代理教師。\n前項學校應報各該主管機關備查。但經各該主管機關核准免報者，不在此限。\n聘期三個月以上經公開甄選之代課、代理教師之平時考核，公立學校準用公立高級中等以下學校教師成績考核辦法相關規定，私立學校準用該校教師成績考核相關規定；服務成績優良之考核項目、認定標準及辦理程序由各校自訂，並經學校教師成績考核會核議，學校應依核議結果，成績優良者於個人離職或服務證明文件，加註服務成績優良。\n第　5　條\n參加奧林匹克運動會比賽者、亞洲運動會獲得前八名者或獲得三等二級以上國光體育獎章之傑出運動員，其學歷、專長足堪任教者，得由學校報請各該主管機關核定酌予放寬資格後聘任為代課、代理教師。\n第  5  條之  1\n學校聘任兼任、代課及代理教師，應以聘約約定授課、聘期、終止聘約、停止聘約執行、待遇、請假、保險、退休金及其他相關權利義務事項。\n第  5  條之  2\n學校聘任兼任、代課及代理教師，其聘期由學校依實際需要定之。\n學校聘任代理教師，實際需要為一學期或一學年者，應依下列規定辦理：\n一、聘期為一學期者，其聘期應自當學期起日至當學期訖日止。\n二、聘期為一學年者，其聘期應自當學年起日至當學年訖日止。\n前項代理教師，其初次聘任因招聘作業延遲致未於當學期起日或當學年起日聘任者，聘期自實際聘任日起算。\n第　6　條\n兼任、代課及代理教師有下列各款情形之一者，學校應予終止聘約，且終身不得聘任為兼任、代課及代理教師：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n四、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性侵害行為屬實。\n五、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性騷擾或性霸凌行為，有終止聘約及終身不得聘任為兼任、代課及代理教師之必要。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經學校性別平等教育委員會或依法令組成之相關委員會確認，有終止聘約及終身不得聘任為兼任、代課及代理教師之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有終止聘約及終身不得聘任為兼任、代課及代理教師之必要。\n八、知悉服務學校發生疑似校園性侵害事件，未依性別平等教育法規定通報，致再度發生校園性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園性侵害事件之證據，經學校查證屬實。\n九、偽造、變造或湮滅他人所犯校園毒品危害事件之證據，經學校查證屬實。\n十、體罰或霸凌學生，造成其身心嚴重侵害。\n十一、行為違反相關法規，經學校查證屬實，有終止聘約及終身不得聘任為兼任、代課及代理教師之必要。\n兼任、代課及代理教師聘期在三個月以上，有前項第一款至第三款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以終止聘約；有前項第四款至第六款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以終止聘約。\n兼任、代課及代理教師聘期在三個月以上，有第一項第七款或第十款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以終止聘約；有第一項第八款、第九款或第十一款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以終止聘約。\n兼任、代課及代理教師聘期未滿三個月，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以終止聘約。\n第　7　條\n兼任、代課及代理教師有下列各款情形之一者，學校應予終止聘約，且應議決一年至四年不得聘任為兼任、代課及代理教師：\n一、經學校性別平等教育委員會或依法令組成之相關委員會調查確認有性騷擾或性霸凌行為，有終止聘約之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經學校性別平等教育委員會或依法令組成之相關委員會確認，有終止聘約之必要。\n三、體罰或霸凌學生，造成其身心侵害，有終止聘約之必要。\n四、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有終止聘約之必要。\n五、行為違反相關法規，經學校查證屬實，有終止聘約之必要。\n兼任、代課及代理教師聘期在三個月以上，有前項第一款或第二款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以終止聘約。\n兼任、代課及代理教師聘期在三個月以上，有第一項第三款或第四款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以終止聘約；有第一項第五款規定情形者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以終止聘約。\n兼任、代課及代理教師聘期未滿三個月，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以終止聘約。\n第　8　條\n兼任、代課及代理教師聘任後，有下列各款情形之一者，應予以終止聘約：\n一、教學不力或不能勝任工作有具體事實。\n二、違反聘約情節重大。\n兼任、代課及代理教師聘期在三個月以上，有前項各款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以終止聘約。\n兼任、代課及代理教師聘期未滿三個月，有第一項各款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以終止聘約。\n第　9　條\n有下列各款情形之一者，不得聘任為兼任、代課及代理教師；已聘任者，學校應予以終止聘約：\n一、有第六條第一項各款情形。\n二、有第七條第一項各款情形，於該議決一年至四年期間。\n三、有本法第十四條第一項各款、第十九條第一項第一款情形。\n四、有本法第十五條第一項各款、第十九條第一項第二款情形，於該議決一年至四年期間。\n五、有本法第十八條第一項情形，於該終局停聘六個月至三年期間。\n六、有性別平等教育法第二十七條之一第一項第一款、第三項前段情形。\n七、有性別平等教育法第二十七條之一第一項第二款、第三項後段情形，於該議決一年至四年期間。\n有前項各款情形，且屬依第十條、本法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，未聘任者，不得聘任；已聘任者，免經教師評審委員會、學校性別平等教育委員會或依法令組成之相關委員會審議，由學校逕予終止聘約；非屬依第十條、本法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，學校應依第六條或第七條規定辦理，未聘任者，不得聘任；已聘任者，予以終止聘約。\n第　10　條\n兼任、代課及代理教師有第六條第一項、第七條第一項及前條規定之情形者，學校應辦理通報、資訊之蒐集、查詢、處理及利用；學校聘任兼任、代課及代理教師前，應查詢其有無前條規定之情形，已聘任者，應定期查詢；其通報、資訊之蒐集、查詢、處理、利用及其他相關事項，準用不適任教育人員之通報資訊蒐集及查詢處理利用辦法之規定。\n第　11　條\n兼任、代課及代理教師有下列各款情形之一者，當然暫時予以停止聘約之執行：\n一、依刑事訴訟程序被通緝或羈押。\n二、依刑事確定判決，受褫奪公權之宣告。\n三、依刑事確定判決，受徒刑之宣告，在監所執行中。\n第　12　條\n兼任、代課及代理教師於聘約有效期間內，涉有下列各款情形之一者，服務學校應於知悉之日起一個月內經教師評審委員會審議通過後，免報主管機關核准，暫時予以停止聘約之執行六個月以下，並靜候調查；必要時，得經教師評審委員會審議通過後，延長停止聘約之執行期間二次，每次不得逾三個月；其停止聘約之執行期間不得超過聘約有效期間。經調查屬實者，依第六條或第七條規定辦理：\n一、第六條第一項第四款至第六款情形。\n二、第七條第一項第一款或第二款情形。\n兼任、代課及代理教師於聘約有效期間內，涉有下列各款情形之一，服務學校認為有先行停止聘約之執行進行調查之必要者，應經教師評審委員會審議通過，免報主管機關核准，暫時予以停止聘約之執行三個月以下；必要時，得經教師評審委員會審議通過後，延長停止聘約之執行期間一次，且不得逾三個月；其停止聘約之執行期間不得超過聘約有效期間。經調查屬實者，依第六條或第七條規定辦理：\n一、第六條第一項第七款至第十一款情形。\n二、第七條第一項第三款至第五款情形。\n前二項情形應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過。\n第　13　條\n依第十一條第二款、第三款規定停止聘約之執行之兼任、代課及代理教師，停止聘約之執行期間不發給本薪(年功薪)或鐘點費。\n依第十一條第一款、前條第一項規定停止聘約之執行之兼任、代課及代理教師，於停止聘約之執行期間不發給本薪(年功薪)或鐘點費；停止聘約之執行事由消滅後，未予終止聘約者，補發其停止聘約之執行期間全數本薪(年功薪)或鐘點費。\n依前條第二項規定停止聘約之執行之兼任、代課及代理教師，於停止聘約之執行期間發給半數本薪(年功薪)或鐘點費；調查後未予終止聘約者，補發其停止聘約之執行期間另半數本薪(年功薪)或鐘點費。\n第　14　條\n兼任、代課及代理教師於受聘期間，享有下列權利：\n一、對學校教學及行政事項提供意見。\n二、享有兼任、代課及代理教師依法令規定之權益。\n三、參與教師專業發展有關之研習或活動。\n四、對下列措施，認為違法或不當致損害其權益者，得準用本法之申訴程序，請求救濟：\n(一)兼任、代課及代理教師，對各該主管機關或學校有關其個人待遇、終止聘約、停止聘約之執行及退休金之措施。\n(二)聘期三個月以上代理教師，對學校有關其請假之措施。\n(三)聘期三個月以上代課、代理教師，對學校有關其平時考核及個人服務成績之措施。\n五、除本辦法或其他法令另有規定者外，得拒絕參與各該主管機關或學校所指派與教學無關之工作或活動。\n六、依法執行職務涉訟時，其服務學校應輔助其延聘律師為其辯護及提供法律上之協助，並準用教師因公涉訟輔助辦法規定。\n第　15　條\n兼任、代課及代理教師除應遵守法令履行聘約外，並負有下列義務：\n一、遵守聘約規定，維護校譽。\n二、積極維護學生受教之權益。\n三、依有關法令及學校安排之課程，實施適性教學活動。\n四、輔導或管教學生，導引其適性發展，並培養其健全人格。\n五、參加經指派與教學、行政有關之研習或活動。\n六、嚴守職分，本於良知，發揚師道及專業精神。\n七、非依法律規定不得洩漏學生個人或其家庭資料。\n八、其他法令規定應盡之義務。\n第　16　條\n兼任、代課及代理教師之待遇規定如下：\n一、兼任及代課教師待遇，以鐘點費支給。\n二、代理教師待遇分本薪(年功薪)、加給及獎金三種。\n前項各款待遇支給基準，由教育部定之。\n代理教師具有代理該教育階段、類（科）別合格教師資格者，其提敘薪級，比照專任教師之規定。\n第　16　條之   1\n兼任、代課及代理教師符合勞工保險條例、勞工職業災害保險及保護法、就業保險法或全民健康保險法所定資格者，學校應於聘約有效期間為其投保勞工保險、勞工職業災害保險、就業保險及全民健康保險。\n兼任、代課及代理教師符合勞工退休金條例所定資格者，學校於聘約有效期間，應依勞工退休金條例規定，按月為代理教師、未具本職之兼任、代課教師提繳退休金。\n前項所稱未具本職，指兼任、代課教師未具下列身分之一：\n一、軍人保險身分者。\n二、公教人員保險身分者。\n三、農民健康保險身分者。\n四、勞工保險身分之下列全部時間工作者：\n(一)以機關學校為投保單位：機關學校專任有給人員。\n(二)非以機關學校為投保單位：\n1.公、民營事業、機構之全部時間受雇者。\n2.雇主或自營業主。\n3.專門職業及技術人員自行執業者。\n五、已依相關退休(職、伍)法規，支(兼)領退休(職、伍)給與者。\n第　16　條之  2\n各該主管機關就主管之學校聘期為一學期或一學年未兼任學校行政職務代理教師，於學生寒暑假期間之到校，準用教師請假規則第十二條規定。但依第二項辦理者，不在此限。\n未採前項規定之直轄市、縣(市)主管機關，基於學生照顧、學習輔導及學習活動之需要，得依下列規定就主管之學校，比照行政院人事行政總處公告之行政機關辦公日辦理：\n一、以辦理學生照顧、學習輔導及學習活動之相關事項為限。\n二、準用行政院與所屬中央及地方各機關聘僱人員給假辦法(以下簡稱約僱辦法)之規定給予慰勞假。\n三、前款慰勞假應於寒暑假實施，且不給予慰勞假補助費；慰勞假未休畢者，不予保留，亦不給予未休畢慰勞假加班費。\n聘期為三個月以上代理教師，其給假，準用約僱辦法第三條規定；其留職停薪，適用性別工作平等法之規定，並應於聘約中事先約定。\n代理教師經主管機關核准兼任學校行政職務者，準用教師請假規則第八條，給予休假、休假補助費及未休假加班費。\n第二項第二款慰勞假及前項休假年資，得併計代理教師於其他學校任教年資。\n第　17　條\n兼任、代課及代理教師不得擔任學校導師或各處(室)行政職務。但情況特殊，經各該主管機關核准者，代理教師得擔任之。\n第　18　條\n本辦法未盡事宜，得由各該主管機關訂定補充規定。\n第　19　條\n本辦法自發布日施行。\n本辦法中華民國一百十二年六月十九日修正發布之條文，自一百十二年八月一日施行。\n本辦法中華民國一百十四年六月二十七日修正發布之第十六條，自一百十四年八月一日施行。","history":"1.中華民國109年06月28日(補登)教育部臺教授國部字第 1090063918B號令修正發布全文19 條，名稱並修正為「高級中等以下學校兼任代課及代理教師聘任辦法」，並自發布日施行\n\n。\n\n2.中華民國110年7月22日教育部臺教授國部字第 1100085895B號令修正發布第4條條文。\n\n3.中華民國112年6月19日教育部臺教授國部字第 1120079624A號令修正發布第 14、19 條條文；增訂第 5-1、5-2、16-2 條條文；並自112年8月1日施行。\n\n4.中華民國114年6月27日教育部臺教授國部字第1145502437A號令修正部分條文。"},{"title":"有關代理教師遇有代理原因需跨學年度(如兵缺)時，是否仍可依教育部八十九年七月十五日台(八九)國字第八九0六九七一一號函規定，經教評會審議同議續聘，不須於新學年度時再次辦理教師一案。","content":"依據九十一年七月二十九日北府教學字第0九一0四六六二七六號函，重申本縣各校聘任長期代理(課)教師其聘期起訖日期為每學年度八月廿九日起至翌年七月一日止。依上開規定，各校長期代理教師之聘期皆至七月一日止，惟倘依教育部函示其兵缺代理教師之代理期間得至代理原因消失為止，將造成兵缺代理教師於跨學年度之暑假期間均屬聘約有效期間，於服務年資(例如退休)或薪津各方面，相對於其他原因之代理教師顯失公平。準此，本案於新學年度時仍需重新辦理甄選事宜。","history":"92 年10 月17 日北府教學字第0920580508號。"},{"title":"國中校長可否在服務學校兼課一案","content":"一、考量校長非屬教師身分，即尚不得支領鐘點費，惟校長如具教師資格又具所授課專長，仍可於原校授課。另依教育部89年1月4日台(88)人(二)字第88161589號書函釋示略以，基於實務考量，校長無須比照職員於辦公時間內在服務學校兼課之規定辦理請假手續。\n二、校長倘於原校授課，仍請依公務員服務法第14條之3規定報所屬上級主管機關許可，且依上開說明不得支領鐘點費。\n三、另校長因具公務員身分，爰其於原校授課係適用公務員兼課不得逾4節之規定。","history":"102年7月16日臺教授國部字第1020061965 號函。"},{"title":"因天然災害停止上班上課登記，教師所遺留之課務得否由學校排派","content":"一、依據「天然災害停止辦公及上課作業辦法」第八條規定：「公教員工服務機關、學校所在地須照常辦公及上課，其居住地區或依正常上班必經地區，經權責機關決定停止辦公及上課者，各該公教員工由服務機關核實予以停止辦公及上課登記。」\n二、學校教師如因前述規定經服務機關核實給予「停止辦公及上課登記」，所遺留課務及鐘點費之支付依下列原則處理：\n(一)兼任、代課及短期代理教師部份：依據臺北縣政府所屬學校兼任代課及代理教師聘任實施要點第十三條規定：「兼任、代課及短期代理教師，因故無法按時到校授課或執行職務者，應事先經學校同意調整授課時間或由學校另遴人員代課、代理，其鐘點費由代授教師支領。」準此，其課務雖由學校代為處理，仍應由教師本身自付鐘點費。\n(二)專任教師及長期代理教師部份：考量教師係因居住地區天然災害因素無法到校上課，如經學校核實給予「停止辦公及上課登記」，本府同意學校得視經費情形，為教師安排代課並支付代課鐘點費。","history":"90年12月5日九十北府教學字第439941 號。"},{"title":"轉知教育部函釋有關實習教師(學生)得否於課後輔導期間擔任短期部份時間代課一案","content":"一、依據教育部94年12月9日台中(二)字第0940164852號函辦理。\n二、有關師資培育舊制實習教師及新制實習學生得否於實習期間擔任短期部分時間代課乙節，教育部業分於92年2月6日以台中(三)字第0920015811號函及93年9月30日以台國字第09301106014號函釋在案，仍請依前揭規定辦理。\n三、實習教師(學生)未具合格教師資格，擔負學生教學及輔導工作專業性尚未具足，且擔任課後輔導工作仍負有學生安全之責任，爰基於保障學生受教權益及維護教育實習品質原則下，實習教師(學生)不宜於課後輔導期間擔任短期部份時間代課。","history":"94年12月16日北府教學字第0940851961 號。"},{"title":"有關函請釋示師資培育法新制實習之實習學生可否短期部份時間代課疑義一案","content":"一、復○○府97年1月4日府教學字第0970007151號函及97年1月4日府教學字第0970004057號函。\n二、有關貴府來函所指本部92年2月6日台師字第0920215811號函適用對象係指92年8月1日修正公布前之師資培育法舊制實習教師；惟貴府來函所稱對象為新制教育實習學生，其教育實習應依師資培育法第十六條及師資培育法施行細則第四條規定辦理，爰此本部據以於94年11月4日台中(三)字第0940153337號函釋，實習學生參與半年全時教育實習課程期間，不得同時於其他機構擔任專職工作或進修學位。綜上，依師資培育法等相關法令規定及立法意旨，並保障學生受教權益，維護師資培育品質，新制實習學生應不得於教育實習期間擔任短期部分時間代課。\n另93年9月30日台國字第0930116014號函有關部分不再適用。","history":"1.97年2月25日教育部台國(四)字第0970002365號函。\n\n2.97 年4 月21 日北教國字第0970301125號函轉。"},{"title":"轉知教育部函釋有關實習學生半年全時教育實習課程期間，應依規定全時參與。","content":"一、依據教育部99年7月7日台中(二)字第0990116784號函辦理。\n二、依師資培育法及相關法規規定，教育實習為培育教師之教學實習、導師(級務)實習、行政實習、研習活動之半年全時教育實習課程；且實習學生參與半年全時教育實習課程期間，不得同時於其他機構擔任專職工作或進修學位，先予敘明。\n三、另依教育部97年2月25日台國(四)字第0970002365號函釋，實習學生應不得於教育實習課程期間擔任短期部分時間代課，併予敘明。\n四、請各校積極落實前項旨意，並載明於教育實習實施規定，作為評量學生教育實習成績之重要參據。","history":"99年7月15日北教國字第0990639443號。"},{"title":"轉知教育部有關「高級中等以下學校及幼兒園輔導實習學生參與半年全時教育實習課程事宜」一案","content":"一、依據教育部104年7月23日臺教師(二)字第1040096940號函辦理。\n二、依「師資培育法」第16條規定，高級中等以下學校、幼稚園及特殊教育學校 (班) 應配合師資培育之大學辦理全時教育實習。\n三、次依「師資培育法施行細則」第5條規定，半年教育實習，以每年8月至翌年1月或2月至7月為起訖期間；其日期，由各師資培育之大學定之。前開日期雖由各師資培育之大學定之，但仍不應逾越上開法規規定之起訖時間。\n四、教育部前以100年5月25日臺中(二)字第1000086623號函釋，請師資培育之大學確實依師資培育法等相關規定，與合作之教育實習機構審慎嚴謹辦理半年全時教育實習，保障學生權益。\n五、綜上，為確保師資培育品質及實習學生權益，請貴校確實依師資培育法相關規定辦理；倘確有必要需請實習學生提前到校進行教育訓練，教育實習機構應注意下列事項，以確保實習學生權益：\n(一)與師資培育之大學共商實習學生提前到校相關作業，並納入實習計畫及提前公告，向實習學生宣導並取得同意。\n(二)完備實習學生之平安保險事宜。\n(三)協助實習學生熟悉教育實習機構交通路線，確保上下課交通安全。","history":"104年7月24日新北教中字第1041375827號。"},{"title":"公立中小學兼任及代課教師鐘點費支給基準表","content":"附則:\n一、支給方式：\n(一)整學期兼任、代課者：按每週排定之兼任、代課節數，每月以四週，每學期以五個半月計算發給。\n(二)非整學期兼任、代課者：依實際授課節數發給。\n二、高級中等學校附設國民中學部教師每節上課時間，如比照高中部每節上課時間，其鐘點費依高級中等學校支給數額支給。\n三、依本表支給鐘點費所需經費，應由各直轄市、縣(市)政府於各該預算科目項下支應，不得向中央政府申請補助。但下列情形不在此限：\n(一)藝術才能班支給鐘點費所需經費。\n(二)108年修正本表，調增國民小學兼任及代課教師支給數額所增加經費。\n(三)114年修正本表，調增中小學兼任及代課教師支給數額所增加經費。\n四、藝術才能班支給鐘點費所需經費，依高級中等以下學校藝術才能班空間設備及經費基準規定辦理。\n五、本表兼任及代課教師支給數額自114年9月1日生效；藝術才能班外聘兼任教師支給數額下限自115年8月1日生效。","history":"1.101年8月30日教育部臺人(三)字第 1010147290C號令修正。\n\n2.中華民國107年7月5日行政院院授人給字第1070043601號函分行修正發布核定本，名稱並修正為「公立中小學兼任及代課教師鐘點費支給基準表」，並自108年1月1日生效。\n\n3.中華民國110年8月9日教育部院授人給字第1110019600號函修正，並自111年2月1日生效。\n\n4.中華民國115年7月28日教育部臺教授國字第1156002300號函修正「公立中小學兼任及代課教師鐘點費支給基準表」，兼\n\n任及代課教師支給數額自中華民國114年9月1日生效，藝術才能班外聘兼任教師支給數額下限自115年8月1日生效。"},{"title":"有關公私立國民中小學專任教師兼課、超時授課及代課節數規定解釋函之說明","content":"一、本局業於101年1月11日北教國字第1011061100號函知各校本市國小教師每週授課節數實施要點補充說明在案。\n二、參酌中小學兼任代課及代理教師聘任辦法第2條規定及教育部97年7月29日台人(三)字第0970143051號函意旨，有關「兼課」、「超時授課」及「代課」定義如下：\n(一)兼課：係指專任教師以部分時間擔任他校編制內教師依規定排課後尚餘之課務或特殊類科之課務。\n(二)超時授課：係指專任教師基本授課節數以外之超時授課。\n(三)代課：係指專任教師以部分時間擔任學校編制內教師因差假或其他原因所遺之課務。\n三、為因應教師自101年1月1日起施行課稅，依國民中小學教師兼代課節數規定研商會議決議，修正公私立國民中小學專任教師兼課(超時授課)及代課節數，以兼課(超時授課)不超過6節，代課不超過5節，兼課(超時授課)復代課併計不超過9節為原則，但課程不可分割或特殊情形報經主管教育行政機關核准者，不在此限。\n四、教育部64年10月20日臺(64)中字第27698號函、87年10月27日台(87)人(二)字第87100864號函及歷來函釋涉及公私立國民中小學專任教師兼課(超時授課)及代課節數規定，自即日起均停止適用。","history":"教育部101 年3 月9 日臺人(二)字第1010024544號。"},{"title":"轉知教育部函釋「中小學教師超時鐘點費之支給疑義」","content":"一、依據教育部台人(三)字第0990100620A號函辦理。\n二、現行國民中學及高級中等學校專任教師基本授課節數以外之超時授課，其鐘點費之支給，自民國94年8月1日起，應以學校行事曆排定之上課週數，按每週排定之超時授課節數計算發給；其節數包括適逢國定假日未實際超時授課之節數及學期始(末)未滿1週之超時授課節數，先以敘明。\n三、前開應以學校行事曆排定之上課週數，按每週排定之超時授課節數計算發給超時鐘點費之規定，其節數除包括適逢國定假日未實際超時授課之節數及學期始(末)未滿1週之超時授課節數外，因學校舉辦之校外教學參觀佸動為教學課程一環，爰增列學校行事曆排定之超時授課節數，如適逢校外教學活動且有實際參與活動之教師，仍得列為超時授課節數計算發給超時鐘點費。","history":"99年7月20日北府教國字第0990608673 號。"},{"title":"有關函詢因教師曠職，其所遺課務之代課鐘點費應如何支付一案。","content":"依教育部80年1月26日臺(80)人字第04656號函示：「查『臺灣省公立學校教師及職員出勤差假管理辦法』第7條既已規定教師及職員曠職、曠課者，應按日扣除薪俸。…有關教師曠課期間之代課鐘點費，不宜再由曠課教師自付。」本案請依上開規定辦理。","history":"95年5月2日北府教學字第0950349078 號。"},{"title":"有關國中教師校內代課，適逢期(末)中考試，被派監考，可否比照代課時數鐘點費疑義案：查代課教師期(末)中排定監考，視同上課，可比照代課時數發給鐘點費。","content":"","history":"72年10月12日七二北府人三字第305649 號。"},{"title":"有關請釋監考可否支領代課鐘點費一案","content":"一、本府八十九年四月十日八九北府主一字第一二五四八九號函所指監考、巡堂、閱卷不得支領代課鐘點費乙節，係指該項工作多排且非屬原排定人員擔任，故不得領取代課鐘點費。\n二、依據台灣省政府教育廳五十五年八月二十九日教人字第四九三０七號函規定略以….代課教員在代課期間，如適逢月考、期考而停課者，但需監考及閱卷者仍得核照原排定任課時數發給鐘點費。綜上意旨貴校周師請病假八日如已依規定覓合格人員代理，自可依上開規定辦理。至於巡堂工作則尚無規定可支領。","history":"90年12月18日九十北府主一字第429419 號。"},{"title":"函詢教師兼代課費用支領疑義","content":"一、依本府94年9月10日北府教學字第0940587239號函辦理。\n二、整學期兼、代課之教師鐘點費支給，以學校行事曆排定上課週數，按每週排定之兼、代課節數計算之節數發給，其節數包括適逢國定假日未實際兼、代課之節數及學期始(末)未滿1週之上課節數；故校內專任教師如係為整學期兼、代課者，應依前項規定核發鐘點費，惟因教師差假致無法實際兼、代課者，應以不重領、不兼領之原則，鐘點費改由代授課教師支領。\n三、至專任教師如已依規定折算時數，復又因協助校務經學校校務會議通過酌減授課時數者，如確因校內教師臨時差假，致需協助代授其所遺課程，同意比照國小以「有代課事實即可支領代課費」辦理；惟為使協助校務教師確實落實協助校務之精神，應減少以整學年(期)兼代課方式支領超時鐘點費；如否，則仍請授足「每週最高基本節數後」，再行核支超時鐘點費。\n四、前項專任教師如因導師請假需代理導師職務者，請逕依89年9月20日北府人三字第355660號函規定，依其實際代理天數(含星期例假日)以一星期4小時為計算基準，按比例計支代理導師鐘點費。惟原導師職務應到班之時段，不得另支超時鐘點費。\n五、另有關本府94年9月10日北府教學字第0940587239號函規定之鐘點費支給，為免全縣做法不一，請自94學年度起實施。","history":"94年10月12日北府教學字第0940693376 號。"},{"title":"國民中小學專任教師代理導師職務期間，依教師兼導師與專任教師每週授課節數之實際差距節數發給代理導師鐘點費疑義一案。","content":"一、查本部89年9月15日台(89)人(三)字第89087811號書函略以，有關公立中等學校導師請假期間，由專任教師代理導師職務，如因教學需要無法減少授課鐘點時，同意在不重領不兼領原則下，依其實際代理天數(含星期例假日)，以1星期4小時為計算基準，按比例計支代理導師鐘點費。惟代理時間經折算不及l小時者，不計。\n二、次查本部97年8月14日台人(三)字第0970149631A號函略以，本部94年9月13日台人(三)字第0940112052號書函及89年9月15日台(89)人(三)字第89087811號書函略以，國民中小學專任教師代理導師職務期間因教學需要無法減少授課節數者，在不重領不兼領原則下，依其實際代理天數(含星期例假日)，以一星期4小時為計算基準，按比例計支代理導師鐘點費。惟案經行政院97年7月30日院授人給字第0970016004號函准予改依教師兼導師與專任教師每週授課之實際差距節數及實際代理天數，發給代理導師鐘點費。是以，本部上開94年9月13日及89年9月15日書函有關國民中小學代理導師鐘點費計算基準，均併予停止適用。\n三、以上開行政院97年7月30日函於「實際代理天數」部分，已無「含星期例假日」之文字，亦未規定「代理時間經折算不及l小時者，不計」，爰每週應授課天數及實際代理天數均不含星期例假日，並請依每週授課之實際差距節數及實際代理天數，按比例計支代理導師鐘點費。","history":"100年12月2日臺人(三)字第1000216872 號函。"},{"title":"公立中小學代理導師鐘點費代理未滿1日不計入實際代理天數計算疑義一案","content":"查教育部101年11月6日臺人(三)字第1010203979號函及101年8月23日臺人(三)字第10101520444號函送同年月10日召開之「研商教師兼任組長主管職務加給、導師費及鐘點費相關事宜會議紀錄」略以，以1週5天為計算基準；代理未滿1日部分，不計入實際代理天數。依上開決議，代理天數未滿1日即不列入計算，仍請依本部上開函辦理。","history":"102年4月26日臺教國署人字第1020040136 號函。"},{"title":"有關兼任行政教師公假隨班參加學生校外教學(畢業旅行)，擔任生活教育管理工作，可否視同兼課支給鐘點費案。","content":"兼行政教師如已符支領兼代鐘點費規定，於隨班校外教學期間，得不扣除其兼課鐘點費，唯鐘點費之核給乃以有授課事實者為限，本案自不得視同兼課另支給鐘點費。","history":"86年1 月16 日八六北府教一字第006727 號。"},{"title":"各校於考試期間安排教師監考節數之原則，請予以制度化辦理，以符公平公正原則。","content":"一、依審計部臺灣省臺北縣審計室97年10月3日審北縣二字第0970002508號函辦理。\n二、各校監考原則應經校務會議通過後實施，倘負責試務工作或特殊身份不納入監考範圍等亦須併入原則中敘明，使校內教師達成一致共識並確實執行。\n三、學校考試期間於折算監考節數時，應將超鐘點之兼代課教師時數倂予計算計入，以符公平原則。\n四、考試期間教師若因請假而無法監考，請校方於排定代監考之教師時，應優先安排未監考之教師，以避免有教師未安排監考節數而代監考，同時支領兼課鐘點費及代課費，致增加經費支出之不合理情形。","history":"97年10月27日北教國字第0970794642 號。"},{"title":"各校於考試期間安排教師監考時數，應一併考量兼課教師及未兼課教師之差異性，以符公平原則。","content":"一、依臺灣省臺北縣審計室97年1月10日審北縣二字第0970000027號函辦理。\n二、依本府94年9月10日北府教學字第0940587239號函規定：「…整學期兼、代課之教師鐘點費支給，以學校行事曆排定上課週數，按每週排定之兼、代課節數計算之節數發給，其節數包括適逢國定假日未實際兼、代課之節數及學期始(末)未滿1週之上課節數…」合先敘明。\n三、惟以上開審計室號函說明段略以：「…學校考試期間監考時數已較原上課\n時數少，而未計入兼課鐘點費及請假排代情形下，核有教師未安排監考節數而代監考，同時支領兼課鐘點費及代課費之不合理情形，…有增加代課鐘點費之情事。」\n四、查各校考試期間監考節數較上課時數少者，仍依上開說明(2)函規定，按教師每週排定之兼代課節數計算之節數發給兼代課費，爰此，請各校於考試期間安排監考節數時，應一併考量兼課教師及未兼課教師之差異性；並確實分配試務工作，以符公平原則。","history":"97年4月7日北教國字第09701780591 號。"},{"title":"教師兼任導師，其八月份導師費如何核發案。","content":"本案釋復如次：\n一、暑假期間導師仍負有輔導之責。故實際擔任導師者仍應發給導師費。\n二、關於新學期新任或調任教師擔任導師者，應以實際擔任導師之日起發聘及支付導師費。","history":"82年3月11日教育部台(82)訓字第13160號。"},{"title":"公立高級中等以下學校教師甄選作業要點","content":"一、為落實教師法第九條、教育人員任用條例第二十六條第一項第一款及高級中等以下學校教師評審委員會設置辦法(以下簡稱本辦法)之規定，公立高級中等以下學校(以下簡稱各校)應以公平、公正、公開之原則辦理教師甄選，特訂定本要點。\n二、各校教師職務出缺，除依規定分發、介聘或列入超額精簡、因應課程調整保留名額及依主管機關規定可保留名額外，其餘缺額應依規定辦理公開甄選。\n代理代課教師必要時得併專任教師甄選辦理。\n三、各校辦理教師甄選，若經教師評審委員會(以下簡稱教評會)決議成立甄選委員會，其組織及作業規定，由教評會定之。\n前項教師甄選得以筆試、口試、試教、實作方式辦理，以二種以上方式綜合考評為原則，並由教評會或甄選委員會視需要決議推薦筆試、口試、試教、實作委員，密送校長或由其指定專人擇聘之，其中得包括校外委員。\n四、教評會委員、甄選委員會委員及筆試、口試、試教、實作委員應確實保密，其本人或配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者報名應試，應依本辦法第九條規定迴避之。\n前項委員係校內報名參加甄選之實習教師之實習輔導教師或與報名參加甄選者曾有師生、同學關係者，均屬應行迴避之情形，不得擔任命題、評分工作。\n第一項委員辦理甄選試務程序中，除基於職務上之必要外，不得與參加甄選者或代表其利益之人為行政程序外之接觸。\n五、各校訂定甄選簡章，內容應包括：甄選類科、名額、甄選資格、報名日期、地點及程序、甄選時間、地點及方式、身心障礙應考人應試多元化適性協助措施、成績配分比例、甄試科目及範圍、錄取總成績計算及相同時之處理方式、成績通知方式、成績複查期限及方式、榜示日期及方式、報名費、申訴電話專線、信箱及附則等。\n前項名額如有備取時，以依序補足當次缺額為限。\n各校教評會或甄選委員會應參照身心障礙者應國家考試權益維護辦法等相關規定，提供第一項身心障礙應考人應試多元化適性協助措施。\n六、各校辦理教師甄選，應擬訂甄選簡章提交教評會審查。\n有關命題、製(印)卷、協助工作人員均應設法隔離作業，或比照典試法及其施行細則之規定，採入闈之方式處理。\n七、各校甄選簡章及職缺等有關教師甄選之資訊，除應公告於學校、主管機關網站外，高級中等學校並應公告於高級中等學校教師選聘網；國民中學及國民小學並應公告於高級中等以下教育人才庫入口網，且應視需要刊登於新聞紙。公告開始至報名截止期間不得少於五日（包括例假日）。\n八、各校依第三點第二項辦理教師甄選時，各項委員宜避免重複，並應建立明確之評分基準及紀錄。口試、試教、實作採分組方式辦理者，同類科委員分派之試場於考試前半小時抽籤決定。\n口試、試教之評分設最高、最低標準分數，高於最高標準、低於最低標準或評分有變更時，評分委員應敘明理由，並簽名負責。\n九、各校應將最終甄選成績通知應考人，採取二階段甄選時，應明列各階段各項成績、總成績及錄取標準等。\n筆試採測驗題題型者，應於筆試後二日內公告試題及答案。\n十、各校保存教師甄選作業有關資料，應參考檔案中央主管機關訂定之機關檔案保存年限區分參考表之規定辦理。\n十一、主管機關應督導所屬學校辦理教師甄選，經發現違失且查明屬實者，應請改正，並議處有關人員或移送法辦。\n十二、主管機關接受各級學校教評會委託辦理之教師聯合甄選，得準用本要點之規定辦理。\n前項聯合甄選，中央主管機關發現有違失且經查證屬實，應即請受委託辦理教師聯合甄選之主管機關予以改正；相關人員涉及行政責任者，應函請相關主管機關依法規予以議處；涉及刑事責任者，應予以告發。\n十三、為提升教師甄選作業成效，各級主管機關應為所屬學校教評會委員　　　及其他與教師甄選作業相關人員辦理講習活動，並適時提供相關法規訊息。\n十四、公立幼兒園教師甄選作業，準用本要點有關國民小學之規定辦理。","history":"1.93年1月13日教育部臺人(一)字第0930000757 號函訂定。\n\n2.94年4月18日教育部台人(一)字第0940042331 號函修正第3點、第9點。\n\n3.100年5月3日教育部臺人(一)字第1000069257 號函修正第5點、第7點。\n\n4.中華民國109年12月31日教育部臺教授國字第 1090146670B 號令訂定「公立高級中等以下學校教師甄選作業要點」，並自即日生效。\n\n5. 中華民國112年2月3日臺教授國字第1120003545A號修正「公立高級中等以下學校教師甄選作業要點」第12點，並自即日生效。\n\n6.中華民國115年5月8日教育部臺教授國部字第1156000706A號令修正第7點、第14點，並自即日生效。"},{"title":"高級中等以下學校及幼兒園教師資格考試收費標準","content":"第  1  條\n本標準依師資培育法第十條第二項及規費法第十條第一項規定訂定之。\n第  2  條\n參加高級中等以下學校及幼兒園教師資格考試者(以下簡稱報考人)，於報名時應繳納報名費新臺幣一千元。\n第  3  條\n前條報考人依簡章規定提出成績複查申請時，應繳納成績複查費，每科新臺幣五十元。\n第  4  條\n本標準所定收費金額，依辦理費用、成本變動趨勢及消費者物價指數變動情形等影響因素，每三年至少檢討一次。\n第  5  條\n本標準自中華民國一百零七年二月一日施行。","history":"1.102年7月23日教育部臺教師(二)字第1020096784B號令修正發布名稱及第2 條條文(原名稱：高級中等以下學校及幼稚園教師資格檢定考試收費標準)。\n\n2.106年6月26日教育部臺教師(二)字第1060082634B號修正第2條。\n\n3. 106年12月19日臺教師（二）字第1060165706B號修正，名稱並修正為「高級中等以下學校及幼兒園教師資格考試收費標準」。"},{"title":"高級中等以下學校及幼兒園教師資格檢定辦法","content":"第  1  條\n本辦法依師資培育法(以下簡稱本法)第十條第二項規定訂定之。\n第  2  條\n高級中等以下學校及幼兒園教師資格考試(以下簡稱本考試)，以筆試行之；每年以辦理一次為原則。\n第  3  條\n中華民國國民、外國學生、僑生及港澳學生修畢師資培育之大學規定之師資職前教育課程，取得修畢師資職前教育證明書，或中華民國國民依本法第九條第一項規定取得修畢師資職前教育證明者，得依證明書或證明所載之類科別，報名參加本考試。\n第  4  條\n有下列各款情形之一者，不得參加本考試：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n四、經師資培育之大學或教育實習機構性別平等教育委員會或依法組成之相關委員會調查確認有性侵害行為屬實。\n五、經師資培育之大學或教育實習機構性別平等教育委員會或依法組成之相關委員會調查確認有情節重大之性騷擾或性霸凌行為。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十五條或第二十七條規定處罰，經師資培育之大學性別平等教育委員會或中央主管機關確認，有不得參加本考試之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經師資培育之大學或中央主管機關確認，有不得參加本考試之必要。\n八、行為違反相關法規，經師資培育之大學或中央主管機關查證屬實，有不得參加本考試之必要。\n九、依教師法、教保服務人員條例或性別平等教育法規定通報有案，且於不得聘任、任用、進用或運用期間。\n十、受監護或輔助宣告，尚未撤銷。\n第  5  條\n本考試報名程序、應繳納之費用、考試日期與地點、考試放榜日、成績通知、複查成績及其他相關事項，應載明於報名簡章，由中央主管機關或中央主管機關依本法第十三條規定委託之學校或有關機關(構)，於本考試舉行二個月前公告之。\n第  6  條\n本考試類科、應試科目及其命題範圍，由中央主管機關於本考試舉行六個月前公告之。\n考試題型除國語文能力測驗為選擇題、非選擇題及寫作外，其餘應試科目均為選擇題及非選擇題。\n考試時間除國語文能力測驗至多一百分鐘外，其餘各應試科目時間至多八十分鐘。\n第  7  條\n參加本考試者(以下簡稱報考人)於報名時，應上傳下列表件及繳交報名費：\n一、最近一年內正面脫帽半身彩色照片。\n二、國民身分證、有效之護照或合法停留、居留或定居之證明文件。\n三、修畢師資職前教育證明書或證明。\n四、學士以上學位證書。\n低收入戶、中低收入戶及特殊境遇家庭之報考人，其報名費得由中央主管機關酌予補助之。\n第一項報考人，於報名當學期將修畢師資職前教育課程，於報名時無法上傳第一項第三款之修畢師資職前教育證明書，且符合下列條件之一者，得申請暫准報名：\n一、於修讀學士學位階段，修習師資職前教育課程者：經就讀之師資培育之大學造具名冊，證明得於考試放榜日十日前取得學士學位及修畢師資職前教育證明書。\n二、於修讀碩士或博士學位階段，修習師資職前教育課程者：經就讀之師資培育之大學造具名冊，證明得於考試放榜日十日前取得修畢碩士學位或博士學位畢業應修畢學分(不包括論文學分)之證明及修畢師資職前教育證明書。\n三、修習幼兒園在職人員修習幼兒園教師師資職前教育課程辦法所定幼教專班或中央主管機關核定開設之學士後師資培育專班者：經就讀之師資培育之大學造具名冊，證明得於考試放榜日十日前取得修畢師資職前教育證明書。\n前項第二款及第三款之報考人，未具學士學位者，並應經就讀之師資培育之大學證明得於考試放榜日十日前取得學士以上學位。\n依第三項第一款或第三款規定申請暫准報名者，至遲應於考試放榜日十日前，由報考人就讀之師資培育之大學上傳第一項第三款之修畢師資職前教育證明書及第一項第四款之學士以上學位證書；依第三項第二款規定申請暫准報名者，至遲應於考試放榜日十日前，由報考人就讀之師資培育之大學上傳第一項第三款之修畢師資職前教育證明書、修畢碩士學位或博士學位畢業應修畢學分(不包括論文學分)之證明及第一項第四款之學士以上學位證書；逾期未上傳視為自始不具備應考資格。\n第  8  條\n報考人有下列各款情形之一時，考試前發現者，撤銷其應考資格；考試時發現者，予以扣考，已應考之科目均不予計分；考試後榜示前發現者，不予計分；考試通過後發現者，撤銷其考試通過資格；已發給教師證書者，撤銷其教師證書；其涉及刑事責任者，移送司法機關辦理：\n一、冒名頂替。\n二、偽造或變造應考證件。\n三、自始不具備應考資格。\n四、以詐術或其他不正當方法，使考試發生不正確之結果。\n五、第四條各款情形之一。\n前項所稱扣考，指扣留報考人之試題、試卷與其他試務機關提供之應試物品、終止其應試用電腦系統或取消其應試資格與序位，並禁止其繼續應試；所稱不予計分，指違規報考人已應試科目不予計算成績。\n第  9  條\n本考試各類科各應試科目以一百分為滿分；其符合下列各款規定者為通過：\n一、應試科目總成績平均滿六十分。\n二、應試科目不得有二科成績均未滿五十分。\n三、應試科目不得有一科成績為零分。\n缺考之科目，以零分計算。\n考試結果經中央主管機關所設教師資格考試審議會審查通過者，始得向師資培育之大學申請修習教育實習。\n第  10  條\n辦理教師資格考試時，得視身心障礙及特殊需求報考人實際需要，在考試公平原則下，在考場設施、考卷呈現、作答時間、作答方式等合理調整之適當服務措施。\n第  11  條\n本辦法未規定事項，準用有關考試法規之規定辦理。\n第  12  條\n本辦法自中華民國一百零七年二月一日施行。\n本辦法修正條文，自發布日施行。","history":"1.92年7月31日教育部台參字第0920115095A號令訂定發布全文11條；並自92年8月1日施行。\n\n2.94年10月3日教育部台參字第0940133794C 號令修正發布第1條條文及第5條條文之附表。\n\n3.99 年10 月26 日教育部台參字第0990178992C 號令修正發布第5、11條條文。\n\n4.101年10月9日教育部臺參字第010183426C號令修正發布名稱及第2、5、9、11條條文；除第 5 條第1項附表自103年1月1日施行外，自發布日施行(原名稱：高級中等以下學校及幼稚園教師資格檢定辦法)。\n\n5.102年7月8日教育部臺教師(二)字第1020085610B 號令修正發布名稱及第2、5 條條文；第5條第1 項附表自103年1月1日施行(原名稱：高級中等以下學校及幼兒(稚)園教師資格檢定辦法)。\n\n6.103 年8 月29 日教育部臺教師(二)字第1030122455B 號令修正發布第5 條條文附表。\n\n7.中華民國106年8月24日教育部臺教師(二)字第 1060106426B號令修正發布第5條條文之附表。\n\n8. 中華民國107年3月26日教育部臺教師(二)字第 1070037680B號令修正發布名稱及全文 12條；並自107年2月1日施行(原名稱：高級中等以下學校及幼兒園教師資格檢定辦法；新名稱：高級中等以下學校及幼兒園教師資格考試辦法)。\n\n9.中華民國109年3月25日教育部臺教師(二)字第 1090039733B號令修正發布第4、5、7、8、12條條文；並自發布日施行。\n\n10.中華民國113年12月24日教育部臺教師（四）字第1132604162A號令修正部分條文。"},{"title":"新北市立國民中小學及幼兒園超額教師輔導介聘實施要點","content":"一、新北市政府(以下簡稱本府)為執行教師法(以下簡稱本法)第十一條規定，使新北市(以下簡稱本市)立國民中小學及幼兒園(以下簡稱學校)超額教師輔導介聘有所遵循，特訂定本要點。\n二、本要點所稱超額教師，指符合下列情形之一：\n(一)學校自然減班、停辦、解散或改制為他校分班、他校校區，扣除退休、辭職、資遣、遷調及其他異動人員，仍超出法定編制員額之教師。\n(二)學校學區內因遷校、新設校或其他學區調整，學生自然移撥，致超出法定編制員額之教師，原校教師依移撥班級數計算編制員額後隨同移撥。\n三、學校型態實驗教育學校於轉型當年度之超額教師，視為非自願超額。\n四、超額教師介聘學校應辦理事項：\n(一)超額教師之計算、認定方式如下：\n1.計算方式：現有編制內正式教師人數減次一學年度預估法定編制教師員額減各項離職員額等於超額教師人數。\n2.各國民小學附設幼兒園、國民中學附設幼兒園及高級中學附設幼兒園、市立幼兒園應依前目規定計算確認教師總額是否超額，如有超額，則計算超額人數。\n3.各國民小學應依第一目規定計算確認教師總額是否超額，如有超額，則依一般科、特教科、專任輔導教師及英語科四科分別計算超額人數。如有英語師資不足情形，其於該學年度授課節數超過二分之一之英語教師，不計入超額教師人數，並於次一學年度擔任英語教師(應需於次一學年度授課節數超過二分之一)。教師同時具備二科資格者，學校得擇一科別提報，各科別教師依其資格，調入相關缺額之學校。\n4.各國民中學應依第一目規定計算確認教師總額是否超額，如有超額，則分科計算超額人數，於某一科目出現缺額時，除特教科與專任輔導教師依其法令規定外，以該校初聘科目為主，第二專長為輔，各校據以調整後，再搭配總超額數計算各科超額教師人數。\n5.學校現任教師兼主任(含代理主任、園長、園主任、偏遠地區學校之商借主任)、國中(含高級中等學校國中部)現任教師兼生活教育或生活輔導組長，除自願者外，不計入超額教師人數，以協助校內行政之延續。\n6.經本市特教班區域平衡調整減班超額教師，則優先調入有特教教師缺額之學校。\n7.教師轉任不同教育階段，其年資應重新計算。\n(二)超額教師申報，依下列之規定：\n1.學校應依優先順序，填具輔導介聘名冊，經各校教師評審委員會(以下簡稱教評會)審議後，提報介聘承辦學校彙整。\n2.介聘名冊及其相關事宜，學校應以書面通知當事人。當事人不得以任何理由推拖或避不出面處理，倘因當事人疏失影響其權益時，不得提出申復。學校依本法、本要點及相關規定介聘教師至他校時，如當事人不願接受介聘他校且現職已無工作又無其他適當工作可調任者，於報經本府教育局核准後予以資遣。\n前項第一款第二目規定英語教師除需授課節數超過二分之一外，亦需具有以下各款資格條件之一：\n(一)通過教育部八十八年所辦國小英語教師英語能力檢核測驗檢核者。\n(二)達到CEFR架構之B2級以上英語相關考試檢定者。\n(三)畢業於英文(語)相關系所者、畢業於外文系英文(語)組者(含未分組之外語文系，經畢業大學開具主修英文之證明者)、畢業於英文(語)輔系者、國民小學英語教師學士後教育學分班結業者、修畢各大學為國小英語教學所開設之英語二十學分班者。\n(四)經本市自行培訓檢核通過者(含八學分、十二學分、二十學分)。\n五、超額教師輔導介聘之優先順序，依下列規定：\n(一)如自願人數超過超額人數時，學校應依下列原則依序列冊輔導介聘：\n1.於該校服務年資深淺，以資深者優先。\n2.年資相同者以年長者優先。\n3.符合第二點第二款須移撥之教師，如為自願超額者，得另選填其他志願學校，並不受隨同移撥之限制。\n(二)無教師自願者或自願人數不足時，應依下列順序輔導介聘：\n1.該校服務正式合格教師連續年資淺者為優先。\n2.該校服務正式合格教師連續年資或資格相同者，以在該校兼任主任、園長、組長、副組長、導師合計年資較少者優先。\n3.該校兼任主任、園長、組長、副組長、導師合計年資相同時，以任教總年資(含私校任教時具合格教師證年資，但代理代課年資及留職停薪期間不計入)資淺者為優先。\n4.任教總年資相同時，以年齡較輕者優先。\n5.前四目條件均相同者，以抽籤決定之。\n前項第二款各目之年資計入本校報到後入伍年資及育嬰假留職停薪期間年資，不計入其他各項留職停薪之年資。\n六、超額教師輔導介聘，依下列之規定：\n(一)依本法第十一條規定，超額教師輔導介聘應優先辦理，以確保教師工作權。\n(二)學校應將缺額全數提供本府辦理超額教師輔導介聘，實際開列缺額，以本府核定為准；另新設校之教師缺額應優先提供原學區超額學校教師移撥之用。\n(三)超額教師依自己意願，選填志願接受輔導介聘。若有二人以上同時選填同校同一科目時，依下列規定決定其介聘優先順序：\n1.初聘科目優先，本科系者(含教育系所修輔系)次之，第二專長者再次之。\n2.以服務本校正式合格連續年資深者優先。\n3.服務本校正式合格連續年資相同時，以任教總年資深者為優先。\n4.任教總年資相同時，以志願較前者優先。\n5.前四目規定之條件相同時，以年長者優先。\n(四)超額教師經輔導介聘後，新任職學校教評會，除確能證明該教師具有教師法第十四條各款不適任之事實外，應予接受，並由校長聘任。\n七、超額教師應注意事項：\n(一)調出超額教師若本科系已選完，則調整以第二專長選填學校，至新校後需任教第二專長科目。\n(二)經介聘至他校後，如非自願之超額教師，得保留原校服務年資。自願移撥至原學區新設校之教師亦可保留原校服務年資。\n(三)於開學前如原校同登記類科出缺，經調入學校校長同意，非自願超額教師得回原校服務，原校不得拒絕。\n(四)自願超額教師，一經超額分發後，當年度均不得再申請市內、外介聘。\n(五)非自願超額教師得視實際需求針對市內、外介聘擇一申請，並以分發報到後之學校為申請學校，申請時所需相關資料應由原服務學校審查後經超額分發報到學校確認並代為申請，如超額分發報到學校未參加市內、外介聘作業，該校仍需代為申請，並改列為參加介聘學校，除申請教師所占之缺額外，不另提撥缺額供介聘作業運用(此僅供該師申請，該校教師仍不得申請)。\n八、其他事項：\n(一)超額學校：\n1.不得為達成處理不適任教師之目的，而違反本要點規定，強迫教師非自願介聘。\n2.不得以任何理由保留缺額，在完成超額教師輔導介聘後，於開學前若因臨時事故或教師臨時辭職等不可預測之因素而有缺額時，應優先接受本校調出之非自願(除移撥教師外)超額教師回校任職。\n3.因非自願超額於近二年內已有超額調動之情形者、公假一年以上或準用教育人員留職停薪辦法第四條第一項各款留職停薪之教師，不列入超額員額內核計，惟若即將屆滿復職並於新學年之始(八月一日)即可復職者，列入超額員額內處理。\n4.超額學校，除依第三點辦理超額介聘之學校外，當年度不得再辦理合格教師甄選。\n(二)超額學校如開學前出缺，需徵求非自願(除移撥教師外)超額教師返校服務意願，並依原超額列冊順序之反順位接受回原校服務，若超額教師不願返回原校服務，需簽訂切結書，並取消保留年資。\n(三)因執行輔導團職務而免兼導師之教育部專任輔導團員及本市國民教育輔導團員、幼兒教育輔導團員，其擔任輔導團員年資視同導師年資。\n(四)幼兒園裁併或國民中小學改制為他校分班、他校校區者，應配合政策規劃，以超額方式辦理，視為非自願超額教師，不視同原服務學校出缺，亦不得回任改制後之分班或校區。","history":"1.100年9月16日北府教秘字第1001107614號令，自即日起生效。\n\n2.102年4月22日新北市政府北府教國字第1021559106號令修正發布第1、3、7 點條文；並自即日生效。\n\n3.105 年1 月28 日新北市政府新北府教字第1050119438號令修正發布第3點、第7 點，並自即日生效。\n\n4.107年3月16日新北市政府新北府教國字第 1070407965號令修正發布第6點條文；並自即日生效。\n\n5.中華民國108年1月8日新北市政府新北府教國字第 1072460076號令修正發布第3點，並自即日起生效。\n\n6.中華民國113年9月20日新北市政府新北府教國字第1131807543號令修正發布名稱及全文 8  點；並自即日生效  （原名稱：新北市政府所屬國民中小學及幼兒園超額教師輔導介聘實施要點；新名稱：新北市立國民中小學及幼兒園超額教師輔導介聘實施要點）"},{"title":"轉知教育部函釋有關代理教師初聘時未具各該教育階段、科(類)合格教師證，嗣於學期中取得該證，是否符合再聘之規定一案。","content":"一、依據教育部103年8月5日臺教授國字第1030070095號函辦理。\n二、查「中小學兼任代課及代理教師聘任辦法(以下簡稱本辦法)」第3條之2第1項規定，「中小學聘任三個月以上經公開甄選之代課、代理教師，其服務成績優良、符合學校校務需求，且具第三條第三項第一款資格﹝按：具有各該教育階段、科(類)合格教師證書﹞者，經教師評審委員會審查通過後得再聘之，並報主管教育行政機關備查；再聘至多以二次為限。」次查教育部101年8月29日臺國(四)字第1010137769D號令略以，「再聘」之適用對象，限於欲聘任學期之前一學期內，於同校擔任聘期3個月以上之代理(課)教師。\n三、另依教育部101年8月24日臺國(四)字第1010137769A號函示略以，本辦法其意旨為將優質師資留在原校，及降低代理(課)教師、學校、縣(市)政府參加、辦理甄選之工作負荷。\n四、據上，代理教師新聘時未具各該教育階段、科(類)合格教師證，嗣於學期中取得各該教育階段、科(類)合格教師證，若具經公開甄選、服務成績優良、符合校務需求、前一學期於原校代理(課)3個月以上，且經教評會審查通過之條件，得適用再聘之規定。","history":"103年8月5日教育部臺教授國字第1030070095 號函。"},{"title":"公立國民小學及國民中學校長主任甄選儲訓辦法","content":"第  1  條\n本辦法依國民教育法(以下簡稱本法)第十四條第三項及第二十條第六項規定訂定之。\n第　2　條\n公立國民小學及國民中學(以下簡稱公立學校)校長、主任之甄選及儲訓，依本辦法辦理。\n第　3　條\n直轄市、縣(市)主管機關為辦理前條之相關事宜，應組成小組辦理之。\n公立師資培育之大學附設實驗國民小學、國民中學，得由師資培育之大學準用前項規定辦理。\n第　4　條\n具有教育人員任用條例及有關規定資格者，得參加公立學校校長、主任之甄選及儲訓。\n第　5　條\n公立國民小學現職合格教師，實際服務滿五年，並符合下列資格之一者，得參加公立國民小學主任甄選；其兼任人事、主計或代理主任者，比照具有組長資格之規定計算：\n一、曾任組長二年或導師三年以上，成績優良。\n二、曾任組長一年及導師二年以上，成績優良。\n三、曾調用或支援主管機關、所屬機構服務二年及導師二年以上，成績優良。\n公立國民小學現職合格教師實際服務特殊或偏遠地區滿三年，其間曾任組長一年或導師二年以上，成績優良者，得參加該地區公立國民小學主任甄選。\n具有公立國民小學校長任用資格之現職人員，服務成績優良者，得參加公立國民小學校長甄選。\n第　6　條\n公立國民中學現職合格教師，實際服務滿五年，並符合下列資格之一者，得參加公立國民中學主任甄選；其兼任人事、主計或代理主任者，比照具有組長資格之規定計算：\n一、曾任組長二年或導師三年以上，成績優良。\n二、曾任組長一年及導師二年以上，成績優良。\n三、曾調用或支援主管機關、所屬機構服務二年及導師二年以上，成績優良。\n公立國民中學現職合格教師實際服務特殊或偏遠地區滿三年，其間曾任組長一年或導師二年以上，成績優良者，得參加該地區公立國民中學主任甄選。\n具有公立國民中學校長任用資格之現職人員，服務成績優良者，得參加公立國民中學校長甄選。\n第  7  條\n公立學校現職合格教師最近三年有下列各款情形之一者，不得參加校長或主任之甄選、儲訓：\n一、受刑事有罪判決。但經判決無罪確定者，不在此限。\n二、受懲戒處分，未經撤銷。\n三、受記過以上之行政懲處，未經撤銷。\n第　8　條\n公立師資培育之大學附設實驗國民小學、國民中學教師，具備第五條或第六條資格者，得經該學校所在地之主管機關同意，分別參加公立學校校長、主任之甄選。\n第　9　條\n直轄市、縣(市)主管機關辦理前項校長、主任甄選時，得採年資積分比序、筆試、面試方式辦理；採年資積分比序方式者，其年資積分項目中，兼任行政職務資歷應列為單獨採計項目。\n校長儲訓課程應包括校務發展與經營、課程發展與教學領導、公共關係與溝通及其他專業知能。\n主任儲訓課程應包括行政規劃與執行、課程教學與學生輔導、公共關係與溝通及其他專業知能。\n前二項儲訓課程由直轄市、縣(市)主管機關自行或委託國家教育研究院及其他學術研究機構辦理，並以實務課程導向為原則。\n第一項甄選及儲訓作業相關規定，由直轄市、縣(市)主管機關定之。\n第　10　條\n取得參加校長遴選或受聘主任資格後，有第七條規定情形之一者，廢止其資格。\n第　11　條\n直轄市、縣(市)主管機關辦理本辦法規定之甄選、儲訓，如有誤寫、誤算或其他類此之顯然錯誤者，應予更正；無法更正者，應重行辦理。\n有前項情形者，應以書面通知相對人及已知之利害關係人。\n有第一項情形者，應查明相關人員責任。\n第　12　條\n本辦法自發布日施行。","history":"1.中華民國109年6月28日(補登)教育部臺教授國部字第 1090065282B 號令修正發布全文20條，並自發布日施行。\n\n2.中華民國112年12月18日教育部臺教授國部字第 1120174338號令修正發布名稱及全文12 條；並自發布日施行(原名稱：國民中小學校長主任教師甄選儲訓及介聘辦法；新名稱：公立國民小學及國民中學校長主任甄選儲訓辦法)。"},{"title":"新北市政府所屬國民中學超額教師人數計算與排序原則","content":"一、超額教師人數計算：\n本學年度現有編制員額－下學年度預定編制員額－本學年度各項離職員額＝超額教師總數。\n二、倘教師總額超額(從寬)，則分科計算：\n一般教師以新北市政府規定之專任教師應授節數計算(以週為單位)：\n(一)下學年普通班該科教師開課節數總計(7、8、9年級)\n(二)新北市政府教育局規定之該科專任教師應授節數\n該科下學年應有教師數＝(A)÷(B)=(C)\n(C)該科教師需求人數\n(D)目前該科教師人數\n(E)該科超額教師人數\n(D)-(C)＝(E)\n三、分次計算應以該科超額教師人數越多者，依序優先超額為原則：\n(一)將各科超額人數由高至低排序，(E)越多之該科教師依序優先超額。\n舉例如下：\n(二)總超額教師人數=計算次數\n(三)該次第1序位之科目，應為該次超額科目，超額人數為1，舉例如下：\n1.第一次計算：\n2.第二次計算：\n3.第三次計算：\n4.第四次計算：.\n5.第五次計算：.\n四、各校超額教師辦法須依「新北市政府所屬國民中小學及幼稚園超額教師輔導介聘實施要點」訂定，並經校務會議通過。\n五、處理超額教師排序之原則：\n(一)教師自願者為優先。\n(二)若無自願之超額教師，考量服務該校正式合格教師連續年資淺者為優先(含報到後入伍年資者及育嬰假留職停薪期間年資，其他留職停薪年資，留職停薪期間不予計算，教師復職後可接續)。\n(三)學校現任教師兼主任(含代理主任)除自願者外，若超額序位排至主任，則依序以下一位遞補，以協助校內行政之延續。\n服務該校正式合格教師連續年資或資格相同者，考量在學校職務分配及課程特色發展(如：彈性課程)，妥適處理超額教師之排序。","history":"105 年3 月3 日新北教中字第1050316553 號函"},{"title":"公立高級中等以下學校教師成績考核辦法","content":"第  1  條\n本辦法依高級中等教育法第三十三條及國民教育法第二十六條第二項規定訂定之。\n第  2  條\n公立高級中等以下學校編制內專任合格教師(以下簡稱教師)之成績考核，依本辦法辦理。\n第  3  條\n教師任職至學年度終了屆滿一學年者，應予年終成績考核；不滿一學年，而連續任職已達六個月，或有養育三足歲以下子女辦理留職停薪，而任職累計已達六個月者，另予成績考核。但教師於考核年度內全無工作事實者，或教師於考核年度內有教師法第十四條第一項各款、第十五條第一項各款、第十六條第一項各款、第十九條第一項各款情事之一，或教育人員任用條例第三十一條第一項各款情事之一，經依法定程序予以解聘、不續聘者，不再辦理年終成績考核或另予成績考核。\n教師在考核年度內有下列各款情形之一者，得併計年資參加考核：\n一、轉任其他學校年資未中斷。\n二、服役期滿退伍，在規定期間返回原校復職。\n教師依法服兵役，合於參加成績考核之規定者，應併同在職人員列冊辦理，並以服役情形作為成績考核之參考。但不發給考核獎金。\n教師另予成績考核，應於學年度終了辦理。但辭職、退休、資遣、死亡或留職停薪者，得隨時辦理。\n同一考核年度內再任教師，除已辦理另予成績考核者外，其再任至學年度終了已達六個月者，得於學年度終了辦理另予成績考核。\n教師留職停薪借調至公立學校擔任編制內教師，由當學年度第二學期之最後服務學校就其借調期間及借調前後年資依本辦法辦理成績考核，依考核結果晉敘薪級及給予獎金；借調教師歸建後，由原任職學校依考核結果敘薪。\n第  4  條\n教師之年終成績考核，應按其教學、輔導管教、服務、品德及處理行政等情形，依下列規定辦理：\n一、在同一學年度內合於下列條件者，除晉本薪或年功薪一級外，並給與一個月薪給總額之一次獎金，已支年功薪最高級者，給與二個月薪給總額之一次獎金：\n(一)按課表上課，教法優良，進度適宜，成績卓著。\n(二)輔導管教工作得法，效果良好。\n(三)服務熱誠，對校務能切實配合。\n(四)事病假併計在十四日以下，並依照規定補課或請人代課。\n(五)品德良好，能作為學生表率。\n(六)專心服務，未違反主管機關有關兼課兼職規定。\n(七)按時上下課，無曠課、曠職紀錄。\n(八)未受任何刑事、懲戒處分及行政懲處。但受行政懲處而於同一學年度經獎懲相抵者，不在此限。\n二、在同一學年度內合於下列條件者，除晉本薪或年功薪一級外，並給與半個月薪給總額之一次獎金，已支年功薪最高級者，給與一個半月薪給總額之一次獎金：\n(一)教學認真，進度適宜。\n(二)對輔導管教工作能負責盡職。\n(三)對校務之配合尚能符合要求。\n(四)事病假併計未超過二十八日，或因重病住院致病假連續超過二十八日而未達延長病假，並依照規定補課或請人代課。\n(五)品德無不良紀錄。\n三、在同一學年度內有下列情形之一者，留支原薪：\n(一)教學成績平常，勉能符合要求。\n(二)曠課超過二節或曠職累計超過二小時。\n(三)事、病假期間，未依照規定補課或請人代課。\n(四)未經學校同意，擅自在外兼課兼職。\n(五)品德較差，情節尚非重大。\n(六)因病已達延長病假。\n(七)事病假超過二十八日。\n另予成績考核，列前項第一款者，給與一個月薪給總額之一次獎金；列前項第二款者，給與半個月薪給總額之一次獎金；列前項第三款者，不予獎勵。\n第一項第一款第四目、第二款第四目及第三款第七目有關事、病假併計日數，應扣除請家庭照顧假、生理假，及經醫師診斷需安胎休養者，其治療、照護或休養期間請假之日數。\n第一項第三款第六目因病已達延長病假之情形，不含經醫師診斷需安胎休養者，其治療照護或休養期間之請假。\n各學校於辦理教師成績考核時，不得以下列事由，作為成績考核等次之考量因素：\n一、依法令規定日數所核給之家庭照顧假、生理假、婚假、產前假、娩假、流產假或陪產假。\n二、經醫師診斷需安胎休養者，其治療、照護或休養期間請假之日數。\n三、法令規定核給之哺乳時間、因育嬰減少之工作時間或辦理育嬰留職停薪。\n第  5  條\n教師在考核年度內，除本辦法另有規定外，應依下列規定辦理：\n一、經獎懲抵銷後，尚有一次記一大功者，不得考列前條第一項第三款。\n二、經獎懲抵銷後，尚有一次記一大過者，不得考列前條第一項第二款以上。\n三、體罰、霸凌、不當管教或其他違法處罰學生，而受申誡以上之懲處者，不得考列前條第一項第一款。\n四、有性騷擾、性霸凌行為，或違反性別平等教育法之規定，而受申誡以上之懲處者，不得考列前條第一項第一款。\n第  6  條\n教師之平時考核，應隨時根據具體事實，詳加記錄；其有合於第二項獎懲基準之情形者，應予以獎勵或懲處。\n獎勵分記大功、記功、嘉獎；懲處分記大過、記過、申誡；其基準規定如下：\n一、有下列情形之一，記大功：\n(一)對教育重大困難問題，能及時提出具體有效改進方案，圓滿解決。\n(二)辦理重要業務成績特優，或有特殊效益。\n(三)在惡劣環境下克盡職責，圓滿達成任務。\n(四)搶救重大災害，切合機宜，有具體效果。\n(五)執行重要法令克服困難，圓滿達成任務。\n二、有下列情形之一，記功：\n(一)革新改進教育業務，且努力推行，著有成效。\n(二)對學校校務、設施，有長期發展計畫，且能切實執行，績效卓著。\n(三)研究改進教材教法，確能增進教學效果，提高學生程度。\n(四)自願輔導學生課業，並能注意學生身心健康，而教學成績優良。\n(五)推展輔導管教工作，確能變化學生氣質，造成優良學風。\n(六)輔導畢業學生就業，著有成績。\n(七)對偶發事件之預防或處理適當，因而避免或減少可能發生之損害。\n(八)教師本人或指導學生代表學校參加各級主管機關認定之全國校際比賽，成績卓著。\n(九)其他優良事蹟，足資表率。\n三、有下列情形之一，嘉獎：\n(一)課業編排得當，課程調配妥善，經實施確具成效。\n(二)進行課程研發，有具體績效，在校內進行分享。\n(三)編撰教材、自製教具或教學媒體，成績優良。\n(四)教學優良，評量認真，確能提高學生程度。\n(五)對學生之輔導管教，熱心負責，成績優良。\n(六)辦理教學演示、分享或研習活動，表現優異。\n(七)教師本人或指導學生參加各項活動、比賽，成績優良。\n(八)擔任導師能有效進行品格教育、生活教育足堪表率。\n(九)在課程研發、教學創新、多元評量等方面著有績效，促進團隊合作。\n(十)其他辦理有關教育工作，成績優良。\n四、有下列情形之一，記大過：\n(一)言行不檢，致損害教育人員聲譽，情節重大。\n(二)故意曲解法令，致學生權益遭受重大損害。\n(三)因重大過失貽誤公務，導致不良後果。\n(四)體罰、霸凌或其他違法處罰學生，造成學生身心傷害，情節重大，而未達解聘、不續聘或終局停聘之程度。\n(五)執行職務知有校園性侵害事件，未依規定通報。\n(六)隱匿學生涉犯毒品事件，或要求藥物濫用個案學生辦理休、轉學等情形，經查證屬實。\n(七)行為違反相關法規，情節重大，而未達解聘、不續聘或終局停聘之程度。\n五、有下列情形之一，記過：\n(一)處理教育業務，工作不力，影響計畫進度。\n(二)有不當行為，致損害教育人員聲譽。\n(三)體罰、霸凌、不當管教或其他違法處罰學生，造成學生身心傷害。\n(四)對偶發事件之處理有明顯失職，致損害加重。\n(五)有曠課、曠職紀錄且工作態度消極。\n(六)班級經營不佳，致影響學生受教權益。\n(七)在外補習、違法兼職，或藉職務之便從事私人商業行為。\n(八)代替他人不實簽到退，經查屬實。\n(九)對公物未善盡保管義務或有浪費公帑情事，致造成損失。\n(十)延遲通報學生涉犯毒品事件，經查證屬實。\n(十一)其他違反有關教育法令規定之事項。\n六、有下列情形之一，申誡：\n(一)執行教育法規不力，有具體事實。\n(二)處理業務失當，或督察不週，有具體事實。\n(三)不按課程綱要教學，或教學未能盡責，致貽誤學生課業。\n(四)對學生之輔導或管教，未能盡責。\n(五)有不實言論或不當行為致有損學校名譽。\n(六)無正當理由不遵守上下課時間且經勸導仍未改善。\n(七)教學、輔導管教行為失當，有損學生學習權益。\n(八)體罰、霸凌、不當管教或其他違法處罰學生，情節輕微經令其改善仍未改善。\n(九)其他依法規或學校章則辦理有關教育工作不力，有具體事實。\n(十)其他違反有關教育法令規定之事項，情節輕微。\n前項各款所列記大功、記功、嘉獎、記大過、記過、申誡之規定，得視其情節，核予一次或二次之獎懲。\n依前二項規定對教師所為之懲處，自違失行為終了之日起，屬一次記二大過之行為，無懲處權行使期間限制；屬記一大過之行為，已逾五年者，不予追究；屬記過或申誡之行為，已逾三年者，不予追究。\n前項行為終了之日，指教師應受懲處行為終結之日。但應受懲處行為係不作為者，指學校知悉之日。\n懲處處分經訴願、行政訴訟或其他救濟程序予以撤銷而須另為懲處者，第四項期間，自原懲處被撤銷確定之日起算。\n第  6  條之  1\n學校依高級中等以下學校教師解聘不續聘停聘或資遣辦法（以下簡稱解聘辦法）第九條之一規定，經認定行為人涉及教師懲處之情形者，學校應於接獲檢舉之日起二十日內，以書面通知檢舉人依本辦法之規定辦理。\n學校依前項規定辦理者，應派校內人員調查；必要時，得派校外人員調查。\n前項調查，應自派員之日起二個月內完成；必要時，得延長之，延長期間不得逾一個月，並以一次為限。延長調查時，學校應通知行為人。\n前項規定之調查完成後，學校應依主管機關所定之處理報告表單予以填載。\n學校作成處理結果後，除懲處結果經報主管機關核定或由主管機關改核者外，應將經填載之處理報告表單及學校相關會議紀錄，報主管機關備查。\n學校依解聘辦法第十三條第二項規定，經校園事件處理會議認定行為人涉及教師懲處之情形者，亦應依前三項規定辦理。\n第  7  條\n教師獎懲累計方式如下：\n一、嘉獎三次作為記功一次。\n二、記功三次作為記一大功。\n三、申誡三次作為記過一次。\n四、記過三次作為記一大過。\n前項獎懲同一學年度得相互抵銷。\n第  8  條\n辦理教師成績考核，高級中等學校應組成考核會；國民小學及國民中學應組成考核委員會(以下併稱考核會)，其任務如下：\n一、學校教師年終成績考核、另予成績考核及平時考核獎懲之初核或核議事項。\n二、其他有關考核之核議事項及校長交議考核事項。\n第  9  條\n考核會由委員九人至十七人組成，除掌理教務、學生事務、輔導、人事業務之單位主管及教師會代表一人為當然委員外，其餘由本校教師票選產生，並由委員互推一人為主席，任期一年。但參加考核人數不滿二十人之學校，得降低委員人數，最低不得少於五人，其中當然委員至多二人，除教師會代表外，其餘由校長指定之。\n前項主席因故不能主持會議時，由委員互推一人為主席。\n委員每滿三人應有一人為未兼行政職務教師；未兼行政職務教師人數之計算，應排除教師會代表。\n任一性別委員應占委員總數三分之一以上。但該校任一性別教師人數少於委員總數三分之一者，不在此限。\n委員之任期自當年九月一日至次年八月三十一日止。\n委員之總數、選舉與被選舉資格、會議規範及相關事項規定，由學校擬訂，經校務會議通過後實施。\n第  10  條\n考核會會議時，應有全體委員二分之一以上出席，出席委員過半數之同意，始得決議。但審議教師年終成績考核、另予成績考核及記大功、大過之平時考核時，應有全體委員三分之二以上出席，出席委員過半數之同意，始得決議。\n考核會為前項決議時，迴避之委員不計入該項決議案之出席人數。\n第  11  條\n人事人員辦理教師成績考核前，應將各項應用表件詳細填妥，並檢附有關資料送考核會初核。\n第  12  條\n考核會執行初核時，應審查下列事項：\n一、受考核人數。\n二、受考核教師平時考核紀錄及下列資料：\n(一)工作成績。\n(二)勤惰資料。\n(三)品德紀錄。\n(四)獎懲紀錄。\n三、其他應行考核事項。\n第  13  條\n考核會初核時，應置備紀錄，記載下列事項：\n一、考核委員名單。\n二、出席委員姓名。\n三、列席人員姓名。\n四、受考核人數。\n五、決議事項。\n第  14  條\n考核會完成初核，應報請校長覆核，校長對初核結果有不同意見時，應敘明理由交回復議，對復議結果仍不同意時，得變更之。\n校長為前項變更時，應於考核案內註明事實及理由。\n各校平時考核獎勵記功以下之案件，考核會已就相同案情核議有案或已有明確獎勵基準者，得先行發布獎勵令，並於獎勵令發布後三個月內提交考核會確認；考核會不同意時，應依第一項程序變更之；受考人於收受獎勵令後，如有不服，得依教師法提起救濟。\n第  15  條\n教師平時考核獎懲結果之報核程序、期限，由各主管機關定之。\n教師年終成績考核及另予成績考核結果，應於每年九月三十日前分別列冊報主管機關核定。\n前二項考核結果，學校未依規定期限報核者，主管機關應通知學校限期辦理；屆期仍未報核者，主管機關得逕行核定。\n第一項及第二項考核結果，主管機關認有違法或不當時，應敘明事實及理由通知學校限期重新報核；屆期未報核者，主管機關得逕行改核，並敘明改核之理由及追究學校相關人員之責任。\n前項學校重新考核結果，主管機關認仍有違法或不當者，得逕行改核，並敘明改核之理由。\n主管機關就學校所報考核結果，應依下列期限完成核定或改核；屆期未完成核定或改核者，視為依學校所報核定：\n一、教師平時考核獎懲結果，於學校報核後二個月內。\n二、教師年終成績考核及另予成績考核結果，於每年十一月三十日前，必要時得延長至十二月三十一日。\n第  16  條\n教師成績考核經核定後，應由學校以書面通知受考核教師，並附記不服者提起救濟之方法、期間、受理機關。\n平時考核之獎懲令應附記理由及不服者提起救濟之方法、期間、受理機關。\n前二項考核，應以原辦理學校為考核機關。但主管機關依前條第三項至第五項規定逕行核定或改核者，以該機關為考核機關。\n第  17  條\n教師成績考核結果應自次學年度八月一日執行。\n第四條所定薪給總額，以次學年度八月一日之本薪(年功薪)及其他法定加給為基準計算之。但職務加給、地域加給，以考核年度七月三十一日所支者為基準計算之。\n教師在考核年度內因職務異動致薪給總額減少者，其考核獎金之各種加給均以所任職務月數，按比例計算。\n非於年終辦理之另予考核獎金，其薪給總額以最後在職日之本薪(年功薪)及其他法定加給為基準計算之。\n第  18  條\n考核會委員於審查有關委員本人或其配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者之事項時，應自行迴避。\n委員有下列各款情形之一者，審查事項之當事人得向考核會申請迴避︰\n一、有前項所定之情形而不自行迴避。\n二、有具體事實，足認其執行任務有偏頗之虞。\n前項申請，應舉其原因及事實，並為適當之釋明；被申請迴避之委員，對於該申請得提出意見書，由考核會決議之。\n委員有第一項所定情形不自行迴避，而未經審查事項當事人申請迴避者，應由考核會主席命其迴避。\n第  19  條\n考核會委員均為無給職。\n教師執行考核會委員職務，以公假處理，所遺課務由學校遴聘合格人員代課，並核支代課鐘點費。\n對於教師之成績考核，應根據確切資料慎重辦理，辦理考核人員對考核過程應嚴守秘密，並不得遺漏舛錯，違者按情節輕重予以懲處，其影響考核結果之正確性者，並得予以撤銷重核。\n第  20  條\n考核會於審查受考核教師擬考列第四條第一項第三款或懲處事項時，應以書面通知該教師陳述意見；通知書應記載陳述意見之目的、時間、地點、得否委託他人到場及不到場所生之效果。\n考核會基於調查事實及證據之必要，得以書面通知審查事項之相關人員列席說明；通知書應記載列席說明之目的、時間、地點及得否委託他人到場。\n第  21  條\n教師留職停薪借調者，除借調至公立學校擔任編制內教師，應依第三條第六項規定辦理外，應於借調期滿歸建時，其借調期間及前後在校任教年資服務成績優良者，准予併計按學年度補辦成績考核。但不發給考核獎金。\n停聘教師經依規定復聘，在考核年度內連續任職達六個月以上者，准予辦理另予成績考核；其列冊事由，並應於備考欄內註明。任職不滿六個月者，不予辦理另予成績考核。\n第  22  條\n教師成績考核所需表冊格式，由各主管機關定之。\n第  23  條\n教育部依法定資格派任之高級中等學校軍訓教官及護理教師，其成績考核準用本辦法之規定。但軍訓教官之晉級及軍訓教官與護理教師之救濟事項，應依其他相關法令規定辦理，不準用第四條第一項第一款至第三款及第十六條規定。\n第  24  條\n本辦法自中華民國一百零三年八月一日施行。\n本辦法修正條文，自發布日施行。","history":"1.中華民國109年2月20日教育部臺教授國部字第 1090006765B號令修正發布第5條、第6條、第24條，並自發布日施行。\n\n2.中華民國110年7月28日教育部臺教授國部字第 1100088502B號令修正發布第 3～6、9、10、12、14、15、19、21條條文。\n\n3.中華民國115年1月12日教育部臺教授國部字第1146004422A號令修正「高級中等以下學校教師解聘不續聘停聘或資遣辦法」部分條文、「公立高級中等以下學校教師成績考核辦法」第五條、第六條之一。"},{"title":"國民中小學聘任班級導師注意事項","content":"一、目的：\n教育部為協助學校依教師法第十七條規定訂定擔任導師辦法之有關規定，以發揮導師功能，並落實教育基本法，積極維護學生之學習權、受教育權及人格發展權，並促成各直轄市、縣(市)政府提供前開擔任導師辦法之有關教育支持系統，特訂定本注意事項。\n二、適用對象：\n(一)各直轄市、縣(市)政府所主管之公私立國民中小學。\n(二)國立大學附屬實驗中小學。\n三、聘任人數及資格：\n(一)每班依規定應置導師一人。\n(二)各校編制內之教師，依教師法第十七條規定，均具有被遴聘為導師之義務。\n四、聘任方式及程序：\n各校導師聘任辦法經校務會議通過後，由校長依聘任辦法聘任各班導師。\n五、工作職責：\n經校務會議決定或於教師聘約中協商定之，工作範圍得包括：\n(一)班務處理及班級經營。\n(二)學生生活、學習、生涯、品行及身心健康之教育與輔導。\n(三)特殊需求學生之關照及個案輔導。\n(四)親師溝通與家庭聯繫。\n(五)學生偶發事件及申訴事件處理。\n(六)其他有關班級學生之教學、訓輔、總務等事務處理。\n六、支持系統：\n(一)直轄市、縣(市)政府:\n1.每學年舉辦導師專業知能研習，提供導師精進其班級經營、輔導及相關法律知能。\n2.訂定優質導師獎勵辦法，提升教師擔任導師之意願。\n3.提供各種教育支持以協助導師，例如心理諮商、法律諮詢服務等。\n(二)學校：\n1.每月辦理導師會議，了解各班級導師需求，適時給予協助。\n2.建立校內個案轉介機制，發揮二級輔導功能，給予導師協助。\n3.建立導師請假代理制度，於導師請假時，有效發揮職務代理功能，給予班級學生照顧及輔導。\n4.學校得建立師傅導師制，以提供有需要之導師必要協助。\n七、獎勵措施：\n教師擔任導師工作，其表現優異者，學校得於每學年度結束時，列舉事實，報請主管教育行政機關獎勵。表現不佳者，得於學年度結束時調整其職務，必要時得移請相關委員會審議，並依審議結果辦理。\n八、其他注意事項：\n(一)各校應依教師法第十七條規定，並參酌本注意事項，訂定或修正各校導師聘任辦法，提交校務會議通過後實施。\n(二)各校訂定導師聘任辦法應以學生學習權益為中心，力求選聘制度之完善，遴選出適合之教師擔任導師。","history":"101年8月9日臺國(四)字第1010134056號函頒布。"},{"title":"轉知教育部函釋「國民中小學聘任班級導師注意事項」所稱「編制內教師」是否含代理教師案","content":"一、有關「國民中小學聘任班級導師注意事項」係教育部為協助學校依教師法第  17條規定訂定擔任導師辦法之有關規定，促成各直轄市、縣(市)政府提供前開擔任導師辦法之有關教育支持系統，特訂定之。\n二、查中小學兼任代課及代理教師聘任辦法第2條第3項規定，代理教師：係指以全部時間擔任學校編制內教師因差假或其他原因所遺之課務者。據此，代理教師則需於受聘時間全程於學校服務，擔任該被代理教師所遺課務，包括導師工作或其他行政業務，爰長期代理教師如擔任導師，則適用「國民中小學聘任班級導師注意事項」之規定。","history":"教育部102年5月8日臺教授國字第1020035340號函。"},{"title":"主旨：貴處來函所詢校長聘任具有親屬關係之教師擔任導師或輔導教師職務，是否有公職人員利益衝突迴避法（下稱本法）之適用疑義乙案，復如說明，請查照。","content":"說明：\n一、復貴處102年5月22日雲政預字第10295200480號函。\n二、按本法立法意旨及迴避制度之設計目的，係為建立公職人員利益衝突迴避之規範，避免公職人員因運用公權力而達到私益之目的，以達有效遏阻貪污腐化暨不當利益輸送，主要係因公職人員具有職務、監督之便，不管行政措施如何舉措，都可能造成圖利本身或家族特定之利益，為避免其職務外觀之廉潔性遭人質疑，故有迴避必要。次按「本法所稱利益，包括財產上利益及非財產上利益」、「非財產上利益指有利於公職人員或其關係人於政府機關、公立學校、公營事業機構之任用、陞遷、調動及其他人事措施」、「公職人員知有利益衝突者，應即自行迴避」、「公職人員不得假借職務上之權力、機會或方法，圖其本人或關係人之利益」，本法第4條第1項、第3項與第6條及第7條分別定有明文，合先敘明。\n三、次按教育人員任用條例第32條規定「各級學校校長不得任用其配偶或三親等以內血親、姻親為本校職員或命與其具有各該親屬關係之教師兼任行政職務。但接任校長前已在職者，屬於經管財務之職務，應調整其職務或工作；屬於有任期之職務，得續任至任期屆滿」，復依教育部101年1月10日臺國（四）字第1000231733號書函認教師兼導師之聘用非屬行政職務而無上開規定之適用；惟上開規定係有關學校校長之特定親屬得否任用為學校職員或兼任行政職務之規定，而本法係規範公職人員執行職務涉及利益衝突之迴避，二者規範目的相異。是以，各級學校校長之配偶或三親等以內血親、姻親得否任用為學校職員或教師兼任行政職務，應適用前開教育人員任用條例第32條相關規定，惟校長執行教師聘任等人事措施涉及關係人時，依本法第1條第2 項「公職人員利益衝突之迴避，除其他法律另有嚴格規定者外，適用本法之規定」，仍有本法應自行迴避與禁止假借職權圖利等規定之適用。\n四、復按教師兼任導師，依來函所述，雖非教育人員任用條例所稱之行政職務，但因聘任後涉及導師費之發放與授課時數之減少，核屬本法第4條之利益，業據本部99年11月26日法政字第0991113098號函示甚明。依教育部函頒「國民中小學聘任班級導師注意事項」第4點規定「各校導師聘任辦法經校務會議通過後，由校長依聘任辦法聘任各班導師」，如依各校自定之聘任辦法，係由校長選擇及決定聘用何名教師兼任導師，因仍有選擇與裁量之空間，如涉及其關係人，顯有利益衝突，當應自行迴避及禁止假借職權圖利；如係由遴選委員會等類似組織負責審查與決定聘任導師之人選後，始由校長聘任，倘校長已迴避參與審查及決定，且無假借其職權或職務影響力圖利關係人之情形，此時校長僅係完成人事聘任手續而無決定任用與否之裁量空間，參照本部 93年6月10日法政決字第0930019600 號函示意旨，可認未違反本法相關規定。","history":"102年6月11日法務部法授廉利字第 10205013630 號函。"},{"title":"新北市高級中等以下學校教師聘約準則實施要點","content":"一、新北市政府 (以下簡稱本府)為辦理高級中等以下學校(以下簡稱學校)教師聘任事宜，依教師法施行細則第二十四條第一項之規定，由本府教育局(以下簡稱本局)與新北市教師會(以下簡稱本市教師會)協議，特訂定本要點。\n二、本要點旨在保障學生學習權益，維護教師工作權，兼顧學校行政運作效能及促進教育發展。\n三、學校應依本要點規定並考量學校、社區發展與特色，自行訂定教師聘約。\n四、學校教師聘約之訂定及修正應與學校教師會協議；雙方有爭議時，由本局召集，由當事人雙方、本市教師會及本局共同協商解決之。尚未成立教師會之學校應與教師代表協議，並經校務會議通過。\n教師法及其相關法令修正時，學校聘約應隨同修正公告，不適用前項規定。\n五、教師聘約內容應包括當事人、聘期、工作條件、工作內容、違約罰則、聘約修改、爭議處理及訴訟管轄法院等項目。\n其他內容學校得因應個別情況增列約定之。但不得違反本要點及法令規定。\n六、初聘、續聘、長期聘任之起聘日期為每一學年之八月一日。於學期中初聘者以實際到職日為起聘日，聘期至當學年之七月三十一日，年資以實際聘期計算。\n本局依教師法第十五條規定優先輔導遷調或介聘之教師，其在原校服務之年資、聘期應予併計。\n七、學校應於教師評審委員會審查通過後，十日內以書面通知教師決議結果及簽訂聘約日期、地點。\n受聘教師未依通知簽訂聘約者，即喪失受聘資格。\n前項逾期之原因，如為不可抗力之事由者，不在此限。\n八、教師欲離職時，應於每年五月三十一日前以書面通知學校，學校不得為不利於該教師之處置。\n教師解約、離職應於寒暑假辦理﹔欲於學期中辦理解約離職者，應經學校教師評審委員會同意，並辦妥離職手續。\n依前項規定完成離職手續者，學校應發給離職證明。\n九、教師在保障學生學習權之前提下，得本專業自主之原則，考量學生學習特質，自行編選教材、設計學習活動及教學評量方式。\n十、教師授課科目應依課程綱要，以專業專才及公平原則妥適編排。授課時數由學校依據法令及員額編制(含兼任、代理代課教師、行政人員及特殊班之相關專業人員)，與學校教師會共同訂定編配原則，經校務會議議決之。\n十一、學校應與教師會或尚未成立教師會學校之教師代表共同訂定職務分配原則，並經校務會議通過後實施。\n前項原則應以學生受教權益為最優先考量。\n十二、教師有參加校務會議之權利與義務。\n校務會議之決議，在不違反相關法令下，應予遵守。\n十三、教師被選為學校教師評審委員會委員及教師成績考核委員會委員，應有善盡職責之義務。\n十四、教師應不斷檢討改進教學方法、評量方式，充實專業知能，追求專業成長。\n學校及本局為提升教學品質及維護學生學習權，應與同級教師會擬定教育方案、教學專業視導及評鑑計畫並共同執行。\n十五、教師上班時數、留校時間及差假之基本原則，應由本局邀請教師會、家長團體代表等依相關法令研商後訂定之，並明載於聘約中，在未訂定前，依現行規定辦理。\n十六、教師寒暑假期間返校服務、研究與進修等活動事項及日數，由本局邀請本市教師會協商後訂定。\n十七、本市各公私立高級中等以下學校教師之聘任，除相關法令規定者外，應依本要點辦理。\n十八、教師之權利、義務、待遇、福利、進修與研究、退休、撫恤、離職、資遣、保險、申訴及訴訟等依相關法令之規定辦理，法令未有規定者，依教師聘約。\n十九、學校聘約應納入校園性侵害或性騷擾防治準則第七條及第八條規定。\n二十、教師違反教師聘約，由學校教師評審委員會依聘約規定處理。\n學校違反教師聘約，教師得不接受並依教師法之規定提出申訴或提起訴訟。\n二十一、教師因聘約所生之訴訟，以學校所在地之法院為第一審管轄法院。","history":"1.101年8月6日新北市政府北府教國字第1012206038 號令訂定發布全文 21 點；並自即日起生效。\n\n2.101年8月17日北教國字第1012352356號函頒各校。"},{"title":"高級中等以下學校及幼兒園原住民族語師資培育及聘用辦法","content":"第 1 條\n本辦法依國家語言發展法第十條第二項規定訂定之。\n第 2 條\n本辦法所稱原住民族語師資，指下列人員：\n一、高級中等以下學校得從事原住民族語文課程教學之師資：\n（一）取得本土語文原住民族語文專長教師證書之合格教師。\n（二）前目以外，具原住民族語能力認證之合格教師。\n（三）具原住民族語能力認證，並具備下列資格之一之原住民族語文教學支援工作人員（以下簡稱教學支援老師）或原住民族語老師：\n1.原住民族委員會（以下簡稱原民會）核發之原住民族語言能力認證合格人員研習結業證書。\n2.經中央教育主管機關或其所屬機關，或直轄市、縣（市）主管機關舉辦之教學支援老師認證，取得合格證書。\n3.大學校院依原住民族語言師資培育計畫辦理核發之修畢學分證明書。\n（四）依原住民族教育法第三十五條規定聘用之原住民族語文教學支援老師。\n二、高級中等以下學校得以原住民族語從事原住民族語文課程以外學科教學之師資：具原住民族語能力認證之合格教師。\n三、幼兒園得以原住民族語從事教保活動課程之師資：具原住民族語能力認證之教保服務人員。\n前項所稱具原住民族語能力認證，於第一款規定之國民中學及高級中等學校人員，指取得原民會 中華民國一百零二年十二月三十一日以前核發之原住民族語言能力（以下簡稱族語能力）證明書，或一百零三年一月一日以後核發之族語能力高級以上合格證明書；於第一款規定之國民小學人員、第二款及第三款規定之人員，指取得原民會一百零二年十二月三十一日以前核發之族語能力證明書，或一百零三年一月一日以後核發之族語能力中高級以上合格證明書。\n第 3 條\n原住民族語師資依下列方式培育：\n一、前條第一項第一款第一目教師，依師資培育法相關規定辦理。\n二、前條第一項第一款第三目教學支援老師，依高級中等以下學校教學支援工作人員聘任相關規定辦理。\n三、前條第一項第一款第三目原住民族語老師，依高級中等以下學校原住民族語老師資格及聘用規定辦理。\n四、前條第一項第一款第一目以外之合格教師，由原民會會同中央教育主管機關協調相關單位開設原住民族語言能力之相關課程或研習，提供其修習，協助其取得族語能力高級以上合格證明書。\n五、前條第一項第三款之教保服務人員，由原民會會同中央教育主管機關協調相關單位開設原住民族語言能力之相關課程或研習，提供其修習，協助其取得族語能力中高級以上合格證明書。\n第 4 條\n中央教育主管機關應協調師資培育之大學開設以原住民族語為教學語言之相關課程，提供師資培育之大學師資生修習。\n中央教育主管機關應依高級中等以下學校及幼兒園需求，協調師資培育之大學開設原住民族語教學增能課程，提供第二條第一項各款人員修習。\n中央教育主管機關、原民會及直轄市、縣（市）主管機關應依學校需求，開設原住民族語教學專業知能研習課程，提供第二條第一項第一款第三目、第四目教學支援老師及原住民族語老師修習。\n中央教育主管機關、原民會及直轄市、縣（市）主管機關應訂定相關激勵機制，鼓勵第二條第一項各款人員修習第二項原住民族語教學增能課程。\n第二項原住民族語教學增能課程由中央教育主管機關會商原民會共同規劃。\n第 5 條\n原住民族語師資聘用，依下列規定辦理：\n一、第二條第一項第一款第一目、第二目及第二款之教師：依教師法、公立高級中等以下學校教師甄選作業及相關規定辦理。\n二、第二條第一項第一款第三目、第四目之教學支援老師：依高級中等以下學校教學支援工作人員聘任相關規定辦理。\n三、第二條第一項第一款第三目之原住民族語老師：依高級中等以下學校原住民族語老師資格及聘用辦法規定辦理。\n四、第二條第一項第三款之幼兒園以原住民族語從事教保活動課程之教保服務人員：依教保服務人員條例及其相關規定辦理。\n第二條第一項第一款第一目之教師以專任為原則；必要時，得由學校採合聘方式為之。\n合聘教師相關規定，由中央教育主管機關另定之。\n原住民族語文課程兼任、代課及代理教師之聘用，依高級中等以下學校兼任代課及代理教師聘任辦法規定辦理。\n第 6 條\n原住民族地區之公立高級中等以下學校與幼兒園，其甄選、介聘、遷調原住民族語文課程以外學科之編制內教師或教保服務人員時，得優先進用取得族語能力中高級以上合格證明書之合格教師或教保服務人員。\n公立原住民重點學校及其附設幼兒園，其甄選、介聘、遷調原住民族語文課程以外學科之編制內教師或教保服務人員時，應優先進用取得族語能力中高級以上合格證明書之合格教師或教保服務人員。\n前項學校及其附設幼兒園位於客家人口達二分之一以上之鄉（鎮、市、區）者，應優先進用具原住民族語或客語能力認證之教師或教保服務人員，由中央教育主管機關或直轄市、縣（市）主管機關審酌學生身分（族別）比率、具原住民族語或客語能力認證之教師或教保服務人員人數及特色課程規劃等因素後決定之。\n第 7 條\n本辦法自中華民國一百十四年八月一日施行。","history":"114年6月27日修正全文7條，自114年8月1日施行。"},{"title":"高級中等以下學校原住民族語老師資格及聘用辦法","content":"第 1 條\n本辦法依原住民族語言發展法第二十二條第二項規定訂定之。\n第 2 條\n本辦法所稱原住民族語老師（以下簡稱族語老師），應符合下列規定：\n一、具備下列原住民族語言能力認證之一：\n（一）取得原住民族委員會中華民國一百零二年十二月三十一日以前核發之原住民族語言能力證明書。\n（二）取得原住民族委員會一百零三年一月一日以後核發之原住民族語言能力證明書。\n二、具備下列資格之一：\n（一）原住民族委員會核發之原住民族語言能力認證合格人員研習結業證書。\n（二）經中央教育主管機關或其所屬機關，或直轄市、縣（市）主管機關所舉辦之教學支援工作人員認證，取得合格證書。\n（三）大學校院依原住民族語言師資培育計畫辦理核發之修畢學分證明書。\n前項第一款第二目之原住民族語言能力，任教國民中學及高級中等學校之人員，應具備高級以上合格證明書，任教國民小學之人員，應具備中高級以上合格證明書。\n前項任教國民小學資格之規定，自中華民國一百十四年八月一日施行。\n第 3 條\n公立高級中等以下學校（以下簡稱學校）聘任專門從事原住民族語文（以下簡稱族語）教學之專職族語老師，應由各該學校之主管機關採聯合甄選方式為之。\n前項甄選作業，應以公平、公正及公開之方式辦理。\n學校聘任以部分時間擔任族語老師者，其聘任程序及權利義務，依國民中小學教學支援工作人員聘任辦法辦理；私立高級中等以下學校聘任族語老師者，亦同。\n第 4 條\n學校之主管機關辦理專職族語老師聯合甄選作業，應設甄選會；其任務如下：一、審議甄選簡章及試場規則。\n二、確認作業程序。\n三、督導試務工作。\n四、審議錄取名單。\n五、處理爭議事件。\n六、其他有關甄選事項。\n第 5 條\n甄選會置委員七人至十七人，由學校之主管機關就學者專家、原住民族代表、學校代表及行政機關代表遴聘；任一性別委員人數不得少於委員總數三分之一。\n前項甄選會，由學校之主管機關首長或其指定之人員擔任召集人，並為委員。\n甄選會開會時，由召集人擔任主席；召集人因故未能出席時，得由召集人指定委員一人，或由出席委員互推一人擔任主席。\n甄選會應有三分之二以上委員出席，始得開會，並經出席委員過半數之同意，始得決議。\n第 6 條\n專職族語老師之甄選，至少應就筆試、口試、試教或實作，擇二種以上方式為之，並得就下列條件綜合考評：\n一、族語能力認證等級。\n二、參與族語教學研習經歷。\n三、學歷。\n四、族語教學活動經歷。\n五、協助各機關推廣族語經歷。\n六、族語及文化相關著作。\n七、其他由學校之主管機關訂定之條件。\n第 7 條\n學校之主管機關依本辦法辦理專職族語老師甄選之簡章、名額及其他有關資訊，應於網站公告；自公告之日起至報名截止期間，不得少於五日（不包括例假日）。\n第 8 條\n學校之主管機關應將甄選錄取之人員名單，提供學校予以聘任。\n前項人員，除有第二十八條之三第一項各款情形之一者外，學校不得拒絕聘任。\n第 9 條\n專職族語老師每次聘期至少一學年，最長二學年；其聘期屆滿，符合下列規定者，由學校校長再聘之：\n一、專職族語老師於聘期內經依第二十二條第一項辦理之年終考核為甲等。\n二、經學校教師評審委員會審核通過，並報學校之主管機關同意。\n第 10 條\n專職族語老師，得由學校採合聘方式為之。\n合聘之專職族語老師專任學校為主聘學校，其他合聘學校為從聘學校；合聘之專職族語老師之學校，以不超過三校為原則。\n合聘之專職族語老師，應依主聘學校之需求，更換從聘學校。\n主聘學校與從聘學校，應就專職族語老師跨校相關工作項目，訂定協議書；主聘學校應將協議書內容及本辦法之規定，以書面方式通知合聘之專職族語老師。\n合聘之專職族語老師條件、聘期、教學活動及其他權利義務事項之規定，除本辦法另有規定外，由學校之主管機關定之。\n前項權利事項，得依實際需要，包括交通費之支給。\n第 11 條\n學校或主聘學校應與專職族語老師訂定契約；其契約應記載下列事項：\n一、專職族語老師之權利義務。\n二、擔任工作項目及工作考核。\n三、契約期間薪資及支給方式。\n四、其他必要事項。\n第 12 條\n專職族語老師於受聘期間，享有下列權利：\n一、對學校族語教學及行政事項提供意見。\n二、參與教學有關之研習或活動。\n三、享受學校各種教學資源。\n四、依法執行職務涉訟時，其服務學校應延聘律師為其辯護及提供法律上之協助。\n第 13 條\n專職族語老師於受聘期間，除應遵守法令履行聘約外，並負有下列義務：\n一、遵守聘約規定，維護校譽。\n二、積極維護學生受教之權益。\n三、依有關法令及學校之安排，實施教學活動。\n四、輔導或管教學生，導引其適性發展，並培養其健全人格。\n五、嚴守職分，本於良知，發揚專業精神。\n六、非依法律規定，不得洩漏學生個人或其家庭資料。\n七、參加經指派與教學、行政有關之研習或活動、學校學術及社會教育活動。八、其他依法令規定應盡之義務。\n第 14 條\n專職族語老師之薪資支給基準，規定如附表。\n專職族語老師支給薪資級別之認定，應就其跨校及跨直轄市、縣（市）受聘年資，予以累計採認。\n專職族語老師取得原住民族委員會核發之原住民族語言能力證明書，其最高級別為高級、優級（薪傳級）者，除按第一項薪資支給基準支給薪資外，每人每月加發數額如下：\n一、優級（薪傳級）：新臺幣三千元。\n二、高級：新臺幣一千五百元。\n專職族語老師連續受聘於偏遠地區學校任專職族語老師滿十年，自第十一年起連續受聘於偏遠地區學校任專職族語老師期間，除按第一項薪資支給基準支給薪資及前項加發數額外，每人每月加發新臺幣二千元。\n前項所稱連續，指前後聘約之離職與到職之月份連續未中斷。\n專職族語老師年終工作獎金，比照當年度軍公教人員年終工作獎金發給注意事項規定辦理。\n專職族語老師如於年度中轉任軍公教人員年終工作獎金發給注意事項適用對象或比照發給對象，且於十二月一日仍在職者，由原學校按實際擔任專職族語老師之月數比例於不重領、不兼領原則下，發給年終工作獎金。\n中華民國一百十一年三月二十一日修正發布之第一項附表，自一百十一年一月一日施行。\n中華民國一百十三年二月二十一日修正發布之第一項附表，自一百十三年一月一日施行。\n中華民國一百十四年三月十一日修正發布之第一項附表，自一百十四年一月一日施行。\n第二項至第五項規定，自中華民國一百十四年八月一日施行。\n第 15 條\n專職族語老師符合勞工保險條例、就業保險法或全民健康保險法所定資格者，學校應於聘約有效期間為其投保勞工保險、就業保險及全民健康保險。\n專職族語老師符合勞工退休金條例所定資格者，學校於聘約有效期間，應依勞工退休金條例規定，按月為其提繳退休金。\n第 16 條\n專職族語老師工作項目如下：\n一、族語課程教學。\n二、族語教學相關行政。\n三、族語課程、教學或教材研發。\n四、學生族語學習相關競賽及活動指導。\n五、其他學校指派之工作。\n學校不得安排專職族語老師擔任導師、編制內主管職務或同意商借至機關服務。\n第 17 條\n專職族語老師每週基本授課節數為二十節。但有下列情形之一，報學校之主管機關核准者，每週得減教學節數：\n一、減授四節：\n（一）任教於學校型態原住民族實驗學校，負責該校實驗教育課程教材之規劃及研發。\n（二）服務於偏遠地區學校分級及認定標準所定極度偏遠或特殊偏遠地區學校，統籌學校族語課程教學整體事務。\n（三）教授之族語為當地少數方言別，並辦理該少數方言文化傳承之相關工作。\n二、減授八節：教授之族語為原住民族委員會公告瀕危語別，並辦理瀕危語別復振之相關工作。\n任教於學校型態原住民實驗學校之專職族語老師，有教授民族教育課程，其課程節數，得合併族語課程計算。\n專職族語老師教學節數逾第一項各該教學節數者，得支給超節數鐘點費，每週以六節為限。\n第 18 條\n專職族語老師在職期間，應參與族語教學專業有關之研習，每學年至少三十六小時，並取得證明。\n專職族語老師經學校主動薦送、指派或同意，利用部分教學時間，進行與職務有關之進修、研究或研習，每週在八小時以內，給予公假；其期間由學校視實際需要定之。\n第 19 條\n專職族語老師應專職於學校工作；其經學校核准者，得於公、私立學校兼課，每週不得逾四小時，並應依規定請事假或休假。\n第 20 條\n專職族語老師之全學年服務日，比照行政院人事行政總處公告之行政機關辦公日辦理；其休假，比照兼任行政職務教師之規定。\n專職族語老師請假，除教師請假規則第四條第一項第五款、第十款後段、第十三款、第五條、第六條、第九條、第十條、第十二條、第十七條及第十八條規定外，準用該規則之規定。\n第 21 條\n專職族語老師應接受考核；其考核類別如下：\n一、平時考核：應就平時之工作、操行、敬業精神、工作成效、出勤紀錄等項目考核，隨時根據具體事實，詳予記錄，並作為年終考核之依據。\n二、年終考核：應就敬業精神、團隊精神、工作成效、專業知能、出勤紀錄、獎懲情形、完成本辦法規定相關研習時數及平時考核情形等，綜合考核。\n三、專案考核：專職族語老師有重大違失情事、受刑事處分或事、病假合計超過二十八日時，應辦理專案考核。\n前項第三款所定事、病假合計之日數，應扣除請家庭照顧假、生理假及因安胎事由請假之日數。\n專職族語老師有第二十三條各款所定情形者，學校應與其面談，就教學計畫、目標、方法及態度等，進行溝通討論；面談內容及結果，應記錄於平時考核紀錄。\n第 22 條\n年終考核分為甲等、乙等及丙等；其各等第分數及規定如下：\n一、甲等：八十分以上。其次學年薪資得提高一級。\n二、乙等：七十分以上，未滿八十分。其次學年薪資留原薪級。\n三、丙等：未滿七十分。其次學年薪資留原薪級，並不發給年終工作獎金。\n專職族語老師聘用至學年度終了屆滿一學年者，應予年終考核。任職滿一學期，未滿一學年者，另予考核；其考核項目、各等分數，比照年終考核之規定辦理，次學年仍留原薪級。\n第 23 條\n專職族語老師有下列情形之一者，年終考核不得考列甲等：\n一、不當管教學生。\n二、有遲到、早退情形，合計超過三次。\n三、有曠職之紀錄。\n四、未經學校校長同意，擅自在外兼課兼職。\n五、因病已達延長病假。\n六、辦理業務不服從主管指揮或態度惡劣，致影響整體業務之完成或推展。\n七、影響學校聲譽，有具體之事實。\n八、其他影響學生重大權益事項，且有具體之事實。\n第 24 條\n專職族語老師應接受考核；其考核，比照學校專任教師平時考核及年終考核之規定辦理。\n第 25 條\n專職族語老師平時考核應分別於每年十一月及三月辦理，年終考核應於每年七月三十一日前完成。\n第 26 條\n依本辦法辦理甄選及考核之人員，應確實保密，並遵守行政程序法有關利益迴避之規定。\n第 27 條\n專職族語老師之權利義務，除本辦法另有規定外，視同為國民中小學教學支援工作人員聘任辦法所定教學支援工作人員，為中央勞工主管機關所定依教育人員法令進用編制外之教學人員。\n第 28 條\n專職族語老師有下列各款情形之一者，學校應予解聘，且終身不得聘任為專職族語老師：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一款所定之罪，經有罪判決確定。\n四、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性侵害行為屬實。\n五、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘及終身不得聘任為專職族語老師之必要。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十五條或第二十七條規定處罰，經學校性別平等教育委員會確認，有解聘及終身不得聘任為專職族語老師之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有解聘及終身不得聘任為專職族語老師之必要。\n八、知悉服務學校發生疑似校園性侵害事件，未依性別平等教育法規定通報，致再度發生校園性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園性侵害事件之證據，經學校查證屬實。\n九、偽造、變造或湮滅他人所犯校園毒品危害事件之證據，經學校查證屬實。\n十、體罰或霸凌學生，造成其身心嚴重侵害。\n十一、行為違反相關法規，經學校查證屬實，有解聘及終身不得聘任為專職族語老師之必要。\n專職族語老師有前項第一款至第三款規定情形之一者，免經教師評審委員會審議，並免報主管機關核准，予以解聘。\n專職族語老師有第一項第四款至第六款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以解聘。\n專職族語老師有第一項第七款或第十款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第一項第八款、第九款或第十一款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n第 28 條之  1\n專職族語老師有下列各款情形之一者，學校應予解聘，且應議決一年至四年不得聘任為專職族語老師：\n一、經學校性別平等教育委員會或依法組成之相關委員會調查確認有性騷擾或性霸凌行為，有解聘之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十五條或第二十七條規定處罰，經學校性別平等教育委員會確認，有解聘之必要。\n三、體罰或霸凌學生，造成其身心侵害，有解聘之必要。\n四、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經教師評審委員會確認，有解聘之必要。\n五、行為違反相關法規，經學校查證屬實，有解聘之必要。\n專職族語老師有前項第一款或第二款規定情形之一者，免經教師評審委員會審議，由學校逕報主管機關核准後，予以解聘。\n專職族語老師有第一項第三款或第四款規定情形之一者，應經教師評審委員會委員三分之二以上 出席及出席委員二分之一以上之審議通過，並報主管機關核准後，予以解聘；有第一項第五款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過，並報主管機關核准後，予以解聘。\n第 28 條之 2\n專職族語老師聘任後，有下列各款情形之一者，應經教師評審委員會審議通過，並報主管機關核准後，予以解聘：\n一、教學不力或不能勝任工作有具體事實。\n二、違反聘約情節重大。\n專職族語老師有前項各款規定情形之一者，應經教師評審委員會委員三分之二以上出席及出席委員三分之二以上之審議通過。\n第 28 條之 3\n有下列各款情形之一者，不得聘任為專職族語老師；已聘任者，學校應予以解聘：\n一、有第二十八條第一項各款情形。\n二、有第二十八條之一第一項各款情形，於該議決一年至四年期間。\n三、有教師法第十四條第一項各款、第十九條第一項第一款情形。\n四、有教師法第十五條第一項各款、第十九條第一項第二款情形，於該議決一年至四年期間。\n五、有教師法第十八條第一項情形，於該終局停聘六個月至三年期間。\n六、有性別平等教育法第二十九條第一項第一款、第三項前段情形。\n七、有性別平等教育法第二十九條第一項第二款、第三項後段情形，於該議決一年至四年期間。\n有前項各款情形，且屬依第二十八條之四、教師法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，未聘任者，不得聘任；已聘任者，免經教師評審委員會、學校性別平等教育委員會或依法組成之相關委員會審議，由學校逕予解聘；非屬依第二十八條之四、教師法第二十條第一項或性別平等教育法第三十條第一項規定通報有案者，學校應依第二十八條或第二十八條之一規定辦理，未聘任者，不得聘任；已聘任者，予以解聘。\n第 28 條之 4\n專職族語老師有第二十八條第一項、第二十八條之一第一項及前條規定之情形者，學校應辦理通 報、資訊之蒐集、查詢、處理及利用；學校聘任專職族語老師前，應查詢其有無前條規定之情形，已聘任者，應定期查詢；其通報、資訊之蒐集、查詢、處理、利用及其他相關事項，準用不適任教育人員之通報資訊蒐集及查詢處理利用辦法之規定。\n第 28 條之 5\n專職族語老師有下列各款情形之一者，當然暫時予以停聘：\n一、依刑事訴訟程序被通緝或羈押。\n二、依刑事確定判決，受褫奪公權之宣告。\n三、依刑事確定判決，受徒刑之宣告，在監所執行中。\n第 28 條之 6\n專職族語老師於聘約有效期間內，涉有下列各款情形之一者，服務學校應於知悉之日起一個月內經教師評審委員會審議通過後，免報主管機關核准，暫時予以停聘六個月以下，並靜候調查；必要時，得經教師評審委員會審議通過後，延長停聘期間二次，每次不得逾三個月；其停聘期間不得超過聘約有效期間。經調查屬實者，依第二十八條或第二十八條之一規定辦理：\n一、第二十八條第一項第四款至第六款情形。\n二、第二十八條之一第一項第一款或第二款情形。\n專職族語老師於聘約有效期間內，涉有下列各款情形之一，服務學校認為有先行停聘進行調查之 必要者，應經教師評審委員會審議通過，免報主管機關核准，暫時予以停聘三個月以下；必要時，得經教師評審委員會審議通過後，延長停聘期間一次，且不得逾三個月；其停聘期間不得超過聘約有效期間。經調查屬實者，依第二十八條或第二十八條之一規定辦理：\n一、第二十八條第一項第七款至第十一款情形。\n二、第二十八條之一第一項第三款至第五款情形。\n前二項情形應經教師評審委員會委員二分之一以上出席及出席委員二分之一以上之審議通過。\n第 28 條之 7\n依第二十八條之五第二款、第三款規定停聘之專職族語老師，停聘期間不發給薪資。\n依第二十八條之五第一款、前條第一項規定停聘之專職族語老師，於停聘期間不發給薪資；停聘事由消滅後，未受解聘，並回復聘任者，補發其停聘期間半數薪資。\n依前條第二項規定停聘之專職族語老師，於停聘期間發給四分之一薪資；調查後未受解聘，並回復聘任者，補發其停聘期間另四分之一薪資。\n第 29 條\n本辦法除另定施行日期者外，自發布日施行。","history":"一百十四年六月二十日修正之第 2 條第 2 項有關任教國民小學資格之規定及第14 條第 2～5 項規定自一百十四年八月一日施行。"},{"title":"新北市立國民中小學主任甄選儲訓作業要點","content":"一、本要點依公立國民小學及國民中學校長主任甄選儲訓辦法第九條第六項規定訂定之。\n二、新北市政府（以下簡稱本府）設新北市立國民中小學主任甄選儲訓委員會（以下簡稱本會），本會之職權如下：\n（一）審議國民中小學主任甄選之簡章、錄取名單。\n（二）審議國民中小學主任儲訓之計畫。\n三、本會置委員十三人，其中一人為主任委員，由本府教育局（以下簡稱本局）局長兼任；一人為副主任委員，由本局副局長或主任秘書兼任；其餘委員，由市長就下列人員聘（派）兼之：\n（一）本局人事室主任。\n（二）國民中小學校長各一人。\n（三）教師會代表二人。\n（四）家長代表二人。\n（五）教師兼主任代表二人。\n（六）師鐸獎教師一人。\n（七）專家學者一人。\n本會任一性別委員人數不得少於委員總數三分之一。\n四、本會委員任期為一年，期滿得續聘（派）兼之。但代表機關出任者，應隨其本職進退。\n五、委員於聘期出缺時，應予補聘（派）兼之；其聘期至原聘期屆滿之日為止。\n六、本會置執行秘書一人，由教育局業務主管科長兼任，承主任委員之命，處理會務。\n七、本會會議由主任委員召集，並為會議主席；主任委員因故不能出席時，由副主任委員為主席；主任委員、副主任委員均不能出席時，由出席委員互推一人為主席。\n前項會議應有全體委員過半數之出席，及出席委員過半數同意之決議行之。\n八、委員應親自出席會議。但機關代表兼任之委員，除主任委員及副主任委員外，如因故不能出席時，得指派代表出席。\n委員關於案件審議，決議之迴避，依行政程序法第三十二條及第三十三條之規定。\n九、本會委員均為無給職。但得依規定支給相關費用。\n十、參加國民中小學候用主任甄選，應具備各校現職合格教師資格，服務滿五年（含）以上（限取得合格教師證，且服務於同一教育階段之年資），並符合下列各款資格之一者，其兼任人事、主計或代理主任者，比照具有組長資格之規定計算：\n（一）曾兼任組長二年以上，且服務成績優良。\n（二）曾兼任組長一年導師二年以上，且服務成績優良。\n（三）曾任導師三年以上，且服務成績優良。\n（四）支援
