本局及所屬機構服務二年導師二年（含）以上，且服務成績優良。\n現職合格教師實際服務偏遠地區滿三年，其間曾任組長一年或導師二年（含）以上，且服務成績優良者。\n前項甄選錄取及儲訓合格者，須於偏遠地區學校服務至少滿二年。\n十一、符合前點規定資格者，得申請參加國民中小學主任甄選。\n十二、為落實照顧弱勢族群，具原住民身分參加甄選時，得另外酌加積分。\n十三、國民中小學主任甄選錄取人員一律參加儲訓，儲訓時間至少四週，經主任甄選儲訓期滿成績合格者，由本府發給甄選儲訓合格證書，得受聘為本市國民中小學主任。\n十四、取得主任合格證書之人員，於受聘或待聘期間受刑事、懲戒處分或記過以上之行政處分者，取消其候用資格。","history":"民國 114 年 07 月 16 日 修正"}];
let currentIndex = 0;
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function formatLawText(content) {
  const normalized = String(content || '').replace(/\\n/g, '\n');
  return normalized.split('\n').map(raw => {
    const t = raw.trim();
    if (!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
    const chapter = t.match(/^(第\s*[一二三四五六七八九十百0-9０-９]+\s*章\s*.*)$/);
    if (chapter) return '<div class="doc-chapter" style="display:block;font-size:1.25rem !important;font-weight:800 !important;line-height:2.2 !important;margin:1.25em 0 0.6em !important;">' + esc(t.replace(/\s{2,}/g,' ')) + '</div>';
    const article = t.match(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)(.*)$/);
    if (article) {
      const heading = '<div class="doc-article-heading">' + esc(article[1].replace(/\s+/g,'')) + '</div>';
      const inlineText = article[2].trim();
      return heading + (inlineText ? '<div class="doc-article-body">' + esc(inlineText) + '</div>' : '');
    }
    const levels = [
      {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/,n:0},
      {re:/^([一二三四五六七八九十百]+、)(.*)$/,n:1},
      {re:/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/,n:2},
      {re:/^([0-9０-９]+[、.．])(.*)$/,n:3},
      {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/,n:4}
    ];
    for (const level of levels) {
      const m = t.match(level.re);
      if (m) return '<div class="doc-row doc-level-' + level.n + '"><span class="doc-marker">' + esc(m[1]) + '</span><span class="doc-copy">' + esc(m[2].trimStart()) + '</span></div>';
    }
    return '<div class="doc-row doc-paragraph"><span class="doc-marker"></span><span class="doc-copy">' + esc(t) + '</span></div>';
  }).join('');
}

function renderList() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const visible = laws.map((law,index) => ({law,index})).filter(x => !q || (x.law.title + ' ' + x.law.content + ' ' + (x.law.history || '')).toLowerCase().includes(q));
  document.getElementById('count').textContent = '共 ' + laws.length + ' 項';
  document.getElementById('none').classList.toggle('hidden', visible.length > 0);
  document.getElementById('lawList').innerHTML = visible.map(x =>
    '<button type="button" onclick="openLaw(' + x.index + ')" class="w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-blue-50 hover:text-blue-700 transition">' + esc(x.law.title) + '</button>'
  ).join('');
}
function openLaw(index) {
  currentIndex = index;
  renderDetail();
  renderList();
}
function renderDetail() {
  const law = laws[currentIndex];
  const content = formatLawText(law.content);
  document.getElementById('detail').innerHTML =
    '<div class="flex flex-wrap items-center gap-2 mb-4">' +
      '<span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ' + (currentIndex + 1) + ' 項／共 ' + laws.length + ' 項</span>' +
      '<span class="text-xs text-slate-400">教師聘任、兼任代課、代理、權利義務、教師甄選等</span>' +
    '</div>' +
    '<h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">' + esc(law.title) + '</h2>' +
    '<div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]">' +
      (content || '<div class="law05-empty-note">原始文件未另列法規正文，本筆以法規摘要標題呈現。</div>') +
    '</div></div>' +
    '<div class="mt-8 border-t border-slate-200 pt-6">' +
      '<h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3>' +
      '<div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">' +
        (law.history && law.history.trim() ? esc(law.history) : '原始文件未提供法規沿革資料。') +
      '</div>' +
    '</div>' +
    '<div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100">' +
      '<button onclick="go(-1)" ' + (currentIndex===0?'disabled':'') + ' class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button>' +
      '<button onclick="go(1)" ' + (currentIndex===laws.length-1?'disabled':'') + ' class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button>' +
    '</div>';
}

renderList();
renderDetail();
