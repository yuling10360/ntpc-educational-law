<script>
const laws = [];
let currentIndex = 0;
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function formatLawText(content) {
  return String(content || '').replace(/\\n/g, '\n').split('\n').map(raw => {
    const t = raw.trim();
    if (!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
    const article = t.match(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)(.*)$/);
    if (article) {
      const body = article[2].trim();
      return '<div class="doc-article-heading">' + esc(article[1].replace(/\s+/g,'')) + '</div>' + (body ? '<div class="doc-article-body">' + esc(body) + '</div>' : '');
    }
    const levels = [
      {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/, n:0},
      {re:/^([一二三四五六七八九十百]+、)(.*)$/, n:1},
      {re:/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/, n:2},
      {re:/^([0-9０-９]+[、.．])(.*)$/, n:3},
      {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/, n:4}
    ];
    for (const level of levels) {
      const m = t.match(level.re);
      if (m) return '<div class="doc-row doc-level-' + level.n + '"><span class="doc-marker">' + esc(m[1]) + '</span><span class="doc-copy">' + esc(m[2].trimStart()) + '</span></div>';
    }
    return '<div class="doc-row doc-paragraph"><span class="doc-marker"></span><span class="doc-copy">' + esc(t) + '</span></div>';
  }).join('');
}
function renderList() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const visible = laws.map((law, index) => ({law,index})).filter(x => !q || (x.law.title + ' ' + x.law.content + ' ' + (x.law.history || '')).toLowerCase().includes(q));
  document.getElementById('count').textContent = '共 ' + laws.length + ' 項';
  document.getElementById('none').classList.toggle('hidden', visible.length > 0 || laws.length === 0);
  document.getElementById('lawList').innerHTML = visible.length
    ? visible.map(x => '<button type="button" onclick="openLaw(' + x.index + ')" class="w-full text-left px-3 py-2.5 rounded-xl border border-transparent hover:bg-blue-50 hover:text-blue-700 transition">' + esc(x.law.title) + '</button>').join('')
    : '<div class="law05-empty-note">目前尚未匯入法規清單。</div>';
}
function openLaw(index) {
  currentIndex = index;
  renderDetail();
  renderList();
}
function renderDetail() {
  const detail = document.getElementById('detail');
  if (!laws.length) {
    detail.innerHTML = '<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第五類法規</span><span class="text-xs text-slate-400">版型已建立</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">法規資料尚未匯入</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]"><div class="law05-empty-note"><strong>版型已完成。</strong>本頁已套用 law-04.html 的主要版面配置與文字排版樣式；目前原始 law-05.html 沒有法規內容，因此暫不填入任何法規條文。待提供法規清單及全文後，再依此版型呈現。</div></div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">原始文件未提供此項資料。</div></div>';
    return;
  }
  const law = laws[currentIndex];
  const content = formatLawText(law.content);
  detail.innerHTML = '<h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">' + esc(law.title) + '</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]">' + (content || '<p>原始文件未提供此項資料。</p>') + '</div></div>';
}
renderList();
renderDetail();
</script>
