// 法規本文與沿革依據使用者提供之 Word 檔逐項轉錄；本階段不處理圖片。
const laws = [{"title":"高級中等教育法","content":"第  一  章  總則\n第  1  條\n高級中等教育，應接續九年國民教育，以陶冶青年身心，發展學生潛能，奠定學術研究或專業技術知能之基礎，培養五育均衡發展之優質公民為宗旨。\n第  2  條\n九年國民教育及高級中等教育，合為十二年國民基本教育。\n九年國民教育，依國民教育法規定，採免試、免學費及強迫入學；高級中等教育，依本法規定，採免試入學為主，由學生依其性向、興趣及能力自願入學，並依一定條件採免學費方式辦理。\n第  3  條\n本法之主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  二  章  設立、類型及評鑑\n第  4  條\n高級中等學校由中央政府、直轄市政府、縣(市)政府或由私人依私立學校法設立之。\n高級中等學校依其設立之主體為中央政府、直轄市政府、縣(市)政府或私人，分為國立、直轄市立、縣(市)立或私立；其設立、變更或停辦，依下列規定辦理：\n國立：由中央主管機關核定。\n直轄市立：由直轄市主管機關核定後，報中央主管機關備查。\n縣(市)立：由縣(市)主管機關核定後，報中央主管機關備查。\n私立：在直轄市由直轄市主管機關核定後，報中央主管機關備查；在縣(市)由中央主管機關核定。\n高級中等學校得設立分校、分部。\n高級中等學校與其分校、分部設立所需之校地、校舍、設備、設校經費、師資、變更或停辦之要件、核准程序及其他相關事項之辦法，由中央主管機關定之。\n第  5  條\n高級中等學校分為下列類型：\n普通型高級中等學校：提供基本學科為主課程，強化學生通識能力之學校。\n技術型高級中等學校：提供專業及實習學科為主課程，包括實用技能及建教合作，強化學生專門技術及職業能力之學校。\n綜合型高級中等學校：提供包括基本學科、專業及實習學科課程，以輔導學生選修適性課程之學校。\n單科型高級中等學校：採取特定學科領域為核心課程，提供學習性向明顯之學生，繼續發展潛能之學校。\n第  6  條\n前條所定各類型學校，除單科型高級中等學校外，得設群、科、學程。\n普通型高級中等學校經第四條第二項各款核准設立之主管機關(以下簡稱各該主管機關)核定，得設專業群、科、綜合高中學程。\n技術型高級中等學校以分類設立為原則，必要時，得合類設立；其應依類分群，並於群下設科，僅有一科者，不予設群；其經各該主管機關核定，得設普通科、綜合高中學程。\n前項所定類，指依配合國家建設、符應社會產業、契合專業群科屬性及學生職涯發展形成之類別；其分類依中央主管機關訂定之課程綱要規定。\n第一項至第三項所定群，指以相同屬性科別形成之專業群集，其分群依中央主管機關訂定之課程綱要規定。\n高級中等學校群、科、學程之設立、變更、停辦及其他相關事項之辦法，由中央主管機關定之。\n第  7  條\n高級中等學校經各該主管機關核定，得於同一直轄市、縣(市)設國民中學部。設有國民中學部之高級中等學校，基於中小學一貫教育之考量，經各該主管機關核定，得於同一直轄市、縣(市)設國民小學部。\n依前二項規定所設之國民中學部及國民小學部，適用國民教育法之相關規定。\n第  8  條\n高級中等學校為提供已受國民教育者繼續學習之教育機會，經各該主管機關核定，得設進修部，辦理繼續進修教育。高級中等學校進修部之教學內容，應配合學生學習及社會需要，課程並應符合中央主管機關訂定之課程綱要規定；其授課方式得採按日制、間日制或假日制。矯正機關收容人並得以在矯正機關收容方式為之。\n高級中等學校進修部學生學習評量辦法，由中央主管機關定之；修業期滿，評量及格者，准予畢業。\n第  9  條\n公立高級中等學校之校名，依其類型、群科類別，由各該主管機關定之；私立高級中等學校不得以地名為校名，其校名由學校財團法人於申請籌設時定之，非經各該主管機關許可，不得變更。\n私立高級中等學校申請設立之校名，足使一般民眾誤認與他校為同一學校者，各該主管機關得令其變更之。\n本法施行前已設立之高級中等學校，其校名得沿用原校名。\n第  10  條\n高級中等學校為配合產業發展，提供學生職場實作學習及產學合作，得辦理建教合作；其相關事項，另以法律定之。\n高級中等學校為提供終身學習之需求，得結合公、私立機構及社會團體，以非營利方式辦理推廣教育；其辦法，由各該主管機關定之。\n第  11  條\n高級中等學校應定期對教學、輔導、校務行政及學生參與等事項，進行自我評鑑；其規定，由各校定之。\n各該主管機關為促進高級中等學校均優質化發展，應定期辦理學校評鑑，並公告其結果，作為協助學校調整及發展之參考；其評鑑辦法，由各該主管機關定之。\n第  12  條\n為促進教育多元發展、改進教育素質，各該主管機關得指定或核准公私立高級中等學校辦理全部或部分班級之實驗教育；其實驗期程、實驗範圍、申請條件與程序及其他相關事項之辦法，由中央主管機關定之。\n前項學校全部或部分班級辦理實驗教育者，其課程得不受第四十三條第一項課程綱要規定之限制；全部班級辦理實驗教育者，其設校條件，得不受第四條第四項所定辦法有關規定之限制。\n第  13  條\n為保障學生學習權及家長教育選擇權，高級中等教育階段得以個人、團體及機構方式辦理非學校型態之實驗教育；其申請條件、程序、學生受教資格、課程、學籍管理、學習評量、畢業條件、訪視輔導、收費、政府補助及其他相關事項之辦法，由中央主管機關定之。\n第  三  章  校長聘任及考核\n第  14  條\n高級中等學校置校長一人，專任，綜理校務，經各該主管機關許可者，得於本校或他校兼課。\n公立高級中等學校校長，由各該主管機關遴選合格人員聘任之；師資培育之大學附屬高級中等學校校長，由各該校組織遴選委員會就各該校或其附屬學校或其他學校校長或教師中遴選合格人員，送請校長聘兼(任)之，並報各該主管機關備查，或委由各該主管機關遴選合格人員聘任之。私立高級中等學校校長，由學校財團法人董事會遴選合格人員，並報各該主管機關核准後聘任之。\n高級中等學校校長應採任期制。公立學校校長一任四年，參與遴選之現職校長應接受辦學績效考評，經遴選會考評結果績效優良者，得在同一學校連任一次或優先遴選為出缺學校校長；第一任任期未屆滿，或連任任期未達二分之一者，不得參加他校校長遴選。私立學校校長任期及連任之規定，由學校財團法人董事會定之。\n現職國民中小學校長符合高級中等學校校長資格者，其於國民中小學校長第一任任期未屆滿或連任任期未達二分之一者，不得參加高級中等學校校長之遴選。\n各該主管機關或學校財團法人董事會為辦理第二項遴選事宜，應召開遴選會；其遴選會之組成與遴選方式、程序、基準、校長辦學績效考評、聘任及其他相關事項之辦法，由中央主管機關定之。\n師資培育之大學辦理附屬高級中等學校校長遴選事宜，遴選委員會之組織及運作方式，由各師資培育之大學定之。\n第  15  條\n現職公立高級中等學校校長未獲遴聘，或因故解除職務，其具有教師資格願回任教師者，除有教師法所定解聘、停聘或不續聘情事者外，由各該主管機關逕行分發學校任教，免受教師評審委員會審議。\n前項校長未具教師資格無法回任或具有教師資格不願回任教師者，各該主\n管機關得依下列方式辦理：\n符合退休條件自願退休者，准其退休。\n不符合退休條件或不自願退休者，依其意願及資格條件，優先輔導轉任他職或辦理資遣。\n第  16  條\n各該主管機關應組成考核小組，對公立高級中等學校校長辦理年度成績考核；考核小組之組成與任務、考核程序、考核等級、獎懲類別、考核結果之通知、申訴及其他相關事項之辦法，由中央主管機關定之。\n第  17  條\n高級中等學校校長有不適任之事實者，公立學校校長由各該主管機關依法解除職務、改任其他職務或為其他適當之處理；私立學校校長由學校財團法人董事會依法處理。\n第  四  章  組織及會議\n第  18  條\n高級中等學校為辦理教務、學生事務、總務、實習、資訊、研究發展、繼續進修教育、特殊教育、建教合作、技術交流等事務，得視學校規模及業務需要設處(室)一級單位，並得分組(科、學程)為二級單位辦事。\n第  19  條\n高級中等學校得置副校長一人，一級單位置主任或部主任一人，二級單位依其性質置組長、科主任或學程主任一人。\n副校長應由校長就曾任一級單位主管以上人員聘兼之。一級單位主任、部主任及二級單位科主任、學程主任，除總務單位之主任得由教師兼任或職員專任外，其餘均由校長就專任教師聘兼之。\n二級單位組長，除總務單位之組長由職員專任、學生事務單位負責生活輔導業務之組長得由具輔導知能之人員兼任外，其餘由校長就專任教師聘兼之或由職員專任。\n第  20  條\n高級中等學校設輔導處(室)，置專任輔導教師，由校長遴聘具有輔導專業知能之教師擔任之。\n高級中等學校輔導處(室)置主任一人，由校長於專任輔導教師中遴聘一人兼任之。\n高級中等學校設輔導工作委員會，置主任委員一人，由校長兼任，其餘委員由校長就各處(室)主任及有關專任教職員聘兼之，負責協調整合各處(室)之輔導相關工作，並置執行秘書，由輔導處(室)主任兼任。\n第  21  條\n高級中等學校設圖書館，置主任一人，由校長遴選具有專業知能之人員專任，必要時得由具有專業知能之專任教師聘兼之。\n第  22  條\n公立高級中等學校依有關法令設人事管理機構，依法辦理人事管理事項。\n私立高級中等學校設人事室或置人事管理員，其人員得由校長聘請專任教師兼任或由職員專任之。\n第  23  條\n公立高級中等學校依有關法令設主計機構，依法辦理歲計、會計及統計事項。\n私立高級中等學校會計單位及會計人員之設置，依私立學校法及其相關規定辦理。\n第  24  條\n高級中等學校之組織設置及員額編制標準，由中央主管機關定之。\n本法施行前已依規定進用之護理教師，於本法施行後繼續任職者，其員額編制，納入前項標準。\n第  25  條\n高級中等學校設校務會議，審議下列事項：\n校務發展或校園規劃等重大事項。\n依法令或本於職權所訂定之各種重要章則。\n教務、學生事務、總務及其他校內重要事項。\n其他依法令應經校務會議議決事項。\n校務會議，由校長、各單位主管、全體專任教師或教師代表、職員代表、家長會代表及經選舉產生之學生代表組成；其成員之人數、比率、產生及議決方式，由各校定之，任一性別成員人數不得少於成員總數三分之一；學生代表人數不得少於成員總數百分之八，並報各該主管機關備查。\n前項經選舉產生之學生代表比率計算，遇有小數點時，採無條件進位法，取整數計算。\n校務會議，由校長召集並主持，每學期至少開會一次；經校務會議代表五分之一以上請求召開臨時校務會議時，校長應於十五日內召開。\n中華民國一百十年五月十一日修正之第二項及第三項規定，自一百十年十月一日施行。\n第  26  條\n高級中等學校為推展校務，除依法應設之委員會外，經由校務會議議決後，得設各種委員會；其組成及任務，由各校定之。\n第  27  條\n高級中等學校設學生家長會，應由在學學生之家長為會員組織之，並冠以該校之名稱；其組織章程、任務、委員人數、委員產生方式、任期、選舉罷免、議事規則、經費來源、財務管理、運作及其他相關事項之辦法，由各該主管機關定之。\n第  五  章  教職員任用及考核\n第  28  條\n高級中等學校教師應為專任。但有特殊情形者，得為兼任。\n高級中等學校因校際合作、課程需要或有特殊情形者，得與他校合聘教師，並於一校專任；合聘教師之條件、比例限制、教師之權利義務及其他應遵行事項之辦法，由中央主管機關定之。\n各該主管機關辦理公立高級中等學校教師之介聘，得自行或聯合組成介聘小組辦理；介聘小組之組織、介聘條件及運作之辦法，由各該主管機關定之。\n第  29  條\n高級中等學校得置專業及技術教師，遴聘具有實際經驗之人員，擔任專業或技術科目之教學；其聘任、解聘、停聘、不續聘、請假、申訴、待遇、福利、退休、撫卹、資遣等事項，準用教師之規定；其分級、資格、進修、成績考核及其他權益等事項之辦法，由中央主管機關定之。\n第  30  條\n高級中等學校每班置導師一人，由校長就專任教師聘兼之。但建教合作班得依需要增置導師員額。\n第  31  條\n高級中等學校置軍訓主任教官、軍訓教官；其編制、員額、資格及遴選事項之辦法，由中央主管機關會同國防部定之；其職掌、介派、遷調、進修、申訴及其他相關事項之辦法，由中央主管機關定之。\n第  32  條\n公立高級中等學校專任教師、合聘教師、專業及技術教師、兼任導師或行政職務者，其每週教學節數之標準，由各該主管機關定之。\n第  33  條\n各該主管機關應對公立高級中等學校教師辦理年度成績考核；其考核會之組成與任務、考核程序、考核指標、考核等級、獎懲類別、結果之通知及其他相關事項之辦法，由中央主管機關定之。\n第  六  章  學生資格、入學方式及就學區劃分\n第  34  條\n國民中學畢業生或具同等學力者，具有高級中等學校入學資格；同等學力之認定標準，由中央主管機關定之。\n第  35  條\n為發展多元智能、培育創新人才，高級中等學校應採多元入學方式辦理招生。多元入學，以免試入學為主；經各該主管機關核定者，得就部分名額，辦理特色招生。\n前項免試入學，一百零三學年度各就學區之總名額，應占核定招生總名額百分之七十五以上，並逐年提升，至一百零八學年度，應占核定招生總名額百分之八十五以上。\n免試入學總名額，包括學校附設國民中學部應屆畢業學生直升之名額；其直升名額規定如下：\n國立高級中等學校直升名額：不得高於國民中學部應屆畢業學生人數之百分之三十五。\n直轄市、縣(市)立高級中等學校直升名額：由直轄市、縣(市)主管機關定之。\n私立高級中等學校直升名額：一百零三學年度不得高於該校核定招生總名額之百分之六十。但其附設國民中學部學生人數小於學校招生人數者，不得高於國民中學部應屆畢業學生人數百分之六十，並採逐年漸進方式調整比率，至一百零八學年度不得高於百分之五十。\n各就學區直升入學比率規定較本法限制更嚴格者，從其規定。\n私立高級中等學校違反法令規定，以考試或甄選等篩選方式進入其國民中學部、國民小學部之學生，經各該主管機關查證屬實者，自下一學年度起，其前項第三款核定直升名額依其違規人數比率扣減。\n一百零三學年度各校提供免試入學名額比率，不得低於該校核定招生總名額百分之二十五，其比率得逐年檢討調整之。\n私立高級中等學校非政府捐助設立、未接受政府依私立學校法第五十九條規定所為獎勵、補助，且未由政府依第五十六條規定負擔學費者，得擬具課程計畫、申請單獨招生之理由、招生範圍及招生方式，報各該主管機關核定後，單獨辦理招生，不受本法有關招生規定之限制。但仍應提供不低於該校核定招生總名額百分之十五之免試入學名額。\n採第三項直升方式者，其超額比序方式應依第三十七條第四項規定辦理。\n各國民中學應協助學生自我認識及探索，依其能力、性向及興趣等，給予適性輔導，並提供升學選擇之建議，進入高級中等學校就學。\n第  36  條\n私立高級中等學校入學方式，未依本法規定，並報經主管機關核准者，其學生不適用第五十六條免學費之規定。\n私立高級中等學校應依下列原則配合十二年國民基本教育之實施：\n培養學生五育均衡發展。\n充足合格教師專長授課。\n輔導學生適性發展。\n貫徹教學正常化。\n第  37  條\n高級中等學校辦理免試入學，應由學生向學校提出申請，免考入學測驗。\n申請免試入學人數未超過各該主管機關核定之名額者，全額錄取。\n申請免試入學人數超過各該主管機關核定之名額者，其錄取方式，由直轄市、縣(市)主管機關會商就學區內學校各該主管機關訂定，報中央主管機關備查。但技術型及單科型高級中等學校有特殊招生需要，擬具課程計畫、招生計畫、名額及免試入學方式，報各該主管機關核定者，不在此限。\n前項情形，除得以學生在校健康與體育、藝術、綜合活動、科技領域之學習領域評量成績及格與否作為比序項目外，其他在校學習領域評量成績均不得採計。\n第三項免試入學超額比序之原則、程序及相關事項之規定，各直轄市、縣(市)主管機關應於各學年度開始一年前公告之。\n一百零八學年度前入學國民中學者，仍適用本法中華民國一百十年五月十一日修正之條文施行前之第四項規定。\n第  38  條\n高級中等學校辦理特色招生，應採學科考試分發或術科甄選方式辦理。\n各該主管機關應就高級中等學校評鑑結果、歷年招生情形、學生表現及課程規劃等，公告辦理特色招生之條件及名額。\n高級中等學校依前項公告，擬具計畫及名額，報各該主管機關核定後，始得辦理特色招生；各該主管機關應以逐校逐班審核為原則，並公告核定之理由。\n前項計畫內容，應包括特色招生之目標、課程與教學規劃及學生進路輔導等事項。\n第一項採學科考試分發之特色招生，應於免試入學後辦理。免試入學未招滿之名額，不得移列調整於特色招生。\n第  39  條\n直轄市、縣(市)主管機關應自行或會同其他主管機關考量行政區內或跨行政區各校新生入學來源、區域共同生活圈、交通便利性、學校類型及分布等情形，規劃前二條高級中等學校就學區，報中央主管機關核定後公告之。\n中央主管機關依前項規定核定前，得邀集相關直轄市、縣(市)主管機關、國民中學與高級中等學校代表及學者專家共同協商。\n第  40  條\n第三十五條至前條所定多元入學招生方式與對象、實施區域、範圍與方法、辦理時間、各類招生方式名額比率、特色招生之考試與甄選方式、就學區之劃定原則與程序、各該主管機關與學校之組織分工、私立高級中等學校入學方式不受限制之學校、其範圍、辦理方式、程序及其他應遵行事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關定之。\n第  41  條\n下列學生進入高級中等學校就讀，不受前條所定辦法之限制，其身分認定、名額、辦理方式、時程、錄取原則及其他有關入學重要事項之辦法，由中央主管機關定之：\n身心障礙學生。\n原住民學生。\n重大災害地區學生。\n政府派赴國外工作人員子女。\n參加國際性學科或術科競賽成績優良學生。\n技藝技能競賽成績優良學生。\n運動成績優良學生。\n退伍軍人。\n僑生。\n蒙藏學生。\n外國學生。\n基於人道考量、國際援助或其他特殊身分經專案核定安置之學生。\n前項第一款及第二款學生之入學保障辦法，依特殊教育法及原住民族教育法之規定。\n第  七  章  課程及學習評量\n第  42  條\n高級中等學校學生修業年限為三年。但性質特殊之類、群、科、學程有增減修業年限之必要，經各該主管機關報中央主管機關核定者，不在此限。\n學生未在修業年限內修畢應修課程者，得延長其修業年限，至多二年。身心障礙學生因身心狀況及學習需要，得延長修業期限，至多四年。\n學生因懷孕、分娩或撫育三歲以下子女，得延長修業期限，至多四年。\n第  43  條\n中央主管機關應訂定高級中等學校課程綱要及其實施之有關規定，作為學校規劃及實施課程之依據；學校規劃課程並得結合社會資源充實教學活動。\n前項高級中等學校課程綱要之訂定，除由中央主管機關常設課程研究發展機構外，其他教育相關領域之機構、學校、法人及團體，亦得提出課程綱要草案，併案委由課程審議委員會審議；其提案方式、處理程序及其他相關事項之辦法，由中央主管機關定之。\n課程綱要之研究、發展、審議及其實施，應秉持尊重族群多元、性別平等、公開透明、超越黨派之原則。\n第  43-1  條\n中央主管機關為審議課程綱要，應設課程審議會(以下簡稱課審會)；課審會分為審議大會及分組審議會。\n審議大會置委員四十一至四十九人，由政府機關代表與非政府代表組成。\n其中具政府機關代表身分者，不得超過委員總人數之四分之一。\n審議大會具政府機關代表身分之委員，由教育部就中央與地方機關人員提名後，送請行政院院長聘任之，並依其職務任免改聘。\n非政府代表之審議大會委員，依下列程序產生之：\n由行政院就國內具教育專業之專家學者、教師組織成員、校長組織成員、家長組織成員、其他教育相關之非政府組織成員及學生代表，提名委員候選人，提交課審會委員審查會以過半數同意後，送請行政院院長聘任之。\n前款課審會委員審查會由立法院推舉十一名至十五名社會公正人士組成之。\n課審會委員任期四年，任滿得連任。單一性別不得低於委員總人數三分之一。政府機關代表及非政府代表中，均應包含具原住民身分者。但第一次聘任之非政府代表委員，其中二分之一之任期為二年。\n中央及地方各級民意機關代表不得擔任課審會委員審查會之委員。\n第  43-2  條\n課審會審議大會掌理下列事項：\n課程綱要總綱、各領域、科目、群科課程綱要之審議。\n學校課程修訂原則之審議。\n其他依法應由課審會決議事項。\n課審會審議大會之決議，應有全體委員三分之二以上出席，以出席委員過半數之同意行之。\n課審會審議大會、分組審議會之組成及運作辦法，由中央主管機關定之。\n第  44  條\n技術型高級中等學校之課程，應加強通識教育、實驗及實習。\n前項實習課程之教學目標、科目、學分數、實施方式、實習場所、師資及其他相關事項之辦法，由中央主管機關定之。\n綜合型高級中等學校之實習課程及普通型高級中等學校設有專業群、科、綜合高中學程之實習課程，準用前項辦法之規定。\n第  45  條\n高級中等學校應辦理學生學習評量，其評量範圍包括學業成績及德行評量。\n前項評量方式、科目、結果及其他相關事項之辦法，由中央主管機關定之。\n高級中等學校應就學生能力、性向及興趣，輔導其適性發展，並得採取專案編班方式提供體育、音樂、美術、舞蹈、戲劇等技藝課程，以銜接國民中學之技藝教育，其所需專業師資得由校長就校外具有專業技能之專任教師聘任之。\n第  46  條\n高級中等學校學生依第四十三條第一項所定課程綱要修畢其應修課程或學分成績及格，且德行評量之獎懲紀錄相抵後未滿三大過者，由學校發給畢業證書。\n第  47  條\n高級中等學校學生保留入學資格、轉學、轉科(學程)、休學、學分(課程)抵免、重(補)修、服兵役與出國等有關學籍處理、雙重學籍及其他與學籍有關事項之辦法，由中央主管機關定之。\n高級中等學校學生持國外學歷之採認原則、認定程序及其他應遵行事項之辦法，由中央主管機關定之。\n第  48  條\n高級中等學校教科用書，以由民間編輯為原則，必要時，得由中央主管機關編定之。\n高級中等學校教科用書，由國家教育研究院審定；申請教科用書審定者之資格、申請程序、審查範圍、審查程序、費額、審定執照之發給與廢止、印製規格、成書修訂、稀有類科教材之編訂與獎助及其他相關事項之辦法，由中央主管機關定之。\n第  49  條\n高級中等學校教科用書應由各學校公開選用；其選用規定，由學校訂定，經校務會議通過後實施；其相關採購方式，由各該主管機關定之。\n第 八 章 學生權利及義務\n第  50  條\n高級中等學校應就學生能力、性向及興趣，考量社會職場動態，輔導其適性發展；其輔導工作、項目、程序、實施方式及其他相關事項之辦法，由中央主管機關定之。\n第  51  條\n高級中等學校應訂定學生獎懲規定，經校務會議通過後實施，並報各該主管機關備查。\n第  52  條\n高級中等學校設學生獎懲委員會，評議學生獎懲事件。\n前項委員會之組成應包括經選舉產生之學生代表或學生會代表；其組成、評議範圍、期限、評議方式、評議結果之執行及其他相關事項之辦法，由各該主管機關定之。\n第  53  條\n高級中等學校應輔導學生成立由全校學生選舉產生之學生會及其他相關自治組織，並提供其必要協助，以增進學生在校學習效果及自治能力。\n學生為前項學生會當然會員。\n第  54  條\n學生權益之救濟，依本法所定申訴、再申訴程序行之。\n學生或學生自治組織對學校之懲處、其他措施或決議，認為違法或不當致損害其權益者，得向學校提出申訴；不服學校申訴決定，得向各該主管機關提出再申訴；其提起訴願者，受理訴願機關應於十日內，將該事件移送應受理之學生申訴評議委員會或學生再申訴評議委員會，並通知學生或學生自治組織。\n申訴之提起，應於收受或知悉懲處、其他措施或決議之次日起三十日內以書面為之；再申訴應於申訴評議書達到之次日起三十日內以書面為之；其期間，以學校收受申訴書或各該主管機關收受再申訴書之日期為準。\n高級中等學校應設學生申訴評議委員會，委員會之組成應包括經選舉產生之學生代表或學生會代表，並應包括法律、教育、兒童及少年權利、心理或輔導專家學者至少一人；各該主管機關應設學生再申訴評議委員會，其中法律、教育、兒童及少年權利、心理或輔導專家學者人數應逾委員總數二分之一；學生申訴評議委員會及學生再申訴評議委員會，任一性別委員人數不得少於委員總數三分之一；其申訴、再申訴範圍、期限、委員會組成、調查方式、評議方式、評議結果之執行及其他相關事項之辦法，由中央主管機關定之。\n學校受理第五十二條、第二項及前項之懲處或申訴事件，各該主管機關受理再申訴事件時，應秉持客觀、公正、專業之原則，給予受懲處人或申訴人、再申訴人充分陳述意見及答辯之機會。\n學校應以書面或其他適當方式告知受懲處人；學校及各該主管機關應以書面告知申訴人或再申訴人，各該評議決定及不服該決定之相關救濟程序。\n原懲處、措施或決議性質屬行政處分者，其再申訴決定視同訴願決定；不服再申訴決定者，得依法提起行政訴訟。\n第  54-1  條\n中華民國一百十年五月十一日修正之前條規定，自公布後一年施行。\n中華民國一百十年五月十一日修正之前條規定施行前，尚未終結之事件，其以後之程序，依修正施行後之前條規定終結之。\n第  55  條\n高級中等學校為維護學生權益，對學生學業、生活輔導、獎懲有關規章研訂或影響其畢業條件之會議，應由經選舉產生之學生代表或學生會代表出席；其人數由各校校務會議定之。\n第  56  條\n高級中等學校學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀及符合第三十六條第一項私立學校之學生，不適用之。\n前項免納之學費，由政府編列預算補助學生。公立高級中等學校學生，由各校於註冊時逕免繳納；私立高級中等學校學生，由各校於註冊時免予繳納後，造具清冊函報各該主管機關請撥經費。\n第一項免納學費所需經費，除下列情形由各該主管機關負擔者外，由中央主管機關負擔之：\n本法施行前已由各該主管機關負擔。\n依其他法規規定由各該主管機關負擔。\n本法施行後因主管機關管轄變更，免納學費所需經費已移由各該主管機關負擔。\n除第一項免納學費規定外，高級中等學校得向學生收取學費、雜費、代收代付費、代辦費等必要費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關定之。\n第  57  條\n政府對就讀高級中等學校之經濟弱勢學生，應視其就讀公私立學校之實際需要及政府財政狀況給予學費外之補助；其補助對象、條件、基準及其他相關事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關後定之。\n第  58  條\n政府為協助學生就讀高級中等學校，應辦理學生就學貸款；貸款項目包括雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費、海外研修費及重讀者之學費等相關費用；其貸款條件、額度、項目、權利義務、還款協助措施及其他應遵行事項之辦法，由中央主管機關定之；其涉及原住民者，應會商中央原住民族主管機關定之。\n第  59  條\n高級中等學校應辦理學生團體保險；其範圍、金額、繳費方式、期程、給付基準、權利與義務、辦理方式及其他相關事項之辦法，由中央主管機關定之。\n學生申請理賠時，學校應主動協助辦理。\n各該主管機關應為所轄之公私立高級中等學校場所投保公共意外責任保險；其投保範圍、投保金額及相關事項，由中央主管機關定之。\n前項經費，由中央主管機關按年度編列預算支應之。\n第  九  章  附則\n第  60  條\n公立高級中等學校有下列情形之一者，由各該主管機關核予相關人員行政懲處、扣減補助款或減招班級數，並命其限期改善；屆期未改善者，並得按次處罰至改善為止：\n實施教學，違反中央主管機關依第五十條所定輔導學生五育均衡或適性發展辦法之規定。\n合格教師比率，違反中央主管機關依第二十四條第一項所定高級中等學校組織設置及員額編制標準之規定。\n向學生收取費用，違反各該主管機關依第五十六條第四項所定辦法之規定。\n私立高級中等學校有前項各款情形之一者，依私立學校法第五十五條規定處理。\n第  61  條\n公立高級中等學校之場地、設施、設備提供他人使用、委託經營、獎勵民間參與所獲之收入，不受國有財產法第七條收入解繳國庫及地方公有財產管理收入解繳公庫相關規定之限制。\n公立高級中等學校之場地、設施、設備提供他人使用時，應以公益目的為優先。\n公立高級中等學校編列公務預算者，前項收入與辦理學生課業輔導、重(補)修、招生、甄選、實習、實驗、實施推廣教育、接受捐款等收入及其相關支出，得設置專帳以代收代付方式執行，其賸餘款並得滾存作為改善學校基本設施或充實教學設備之用，不受預算法第十三條規定之限制。\n前項收支管理作業規定，由中央主管機關定之。\n公立高級中等學校編列附屬單位預算者，其各項收支均應依預算法循預算程序納入校務基金辦理。\n第  62  條\n高級中等學校特殊教育學生之教育需求，應依特殊教育相關規定辦理。\n第  63  條\n具高級中等學校畢業程度者，得經自學進修學力鑑定考試及格，發給證書；其考試辦理機關、每年舉辦之次數與時間、應考資格、考試科目與範圍、成績計算基準、證書之頒發、撤銷與廢止事由及其他相關事項之辦法，由中央主管機關定之。\n第  64  條\n本法公布施行前所設之高級中等進修學校及夜間部，自本法施行之日起，應依本法規定轉型為進修部；其已任職教職員工及已招收學生之權益，仍適用本法施行前之規定辦理。\n前項本法公布施行前所設之高級中等進修學校及夜間部轉型為進修部之程序及期限，於本法施行細則定之。\n本法公布施行前，已獨立設立或大學校院附設之高級中等進修學校，其招生、變更、停辦及相關事項，依本法之規定辦理。\n第  65  條\n國防部為培育軍事人才設立之高級中等學校，準用本法之規定；其準用範圍，由國防部會商中央主管機關定之。\n第  66  條\n本法施行細則，由中央主管機關定之。\n第  67  條\n本法除第三十五條至第四十一條條文自中華民國一百零二年九月一日施行外，自一百零三年八月一日施行。\n本法修正條文，除中華民國一百零五年五月十七日修正之第二十五條、第五十二條、第五十四條及第五十五條自一百零五年十月一日施行外，自公布日施行。","history":"1.中華民國102年7月10日總統華總一義字第10200131151號令制定公布，除第35條至第41條條文自102年9月1日施行外，自103年8月1日施行。\n2.中華民國105年6月1日總統華總一義字第 10500050791 號令修正公布，第 14、25、43、52～55、67 條條文；並增訂第 43-1、43-2 條條文；除第 25、52、54、55 條自105年10月1日施行外，自公布日施行。\n3.中華民國110年5月26日總統華總一義字第 11000049231  號令修正公布第25、37、54、55 條條文；增訂第54-1 條條文；除第54條條文自公布後1年施行外，其餘自公布日施行。\n4.中華民國115年9月23日總統華總一義字第11500093361  號令修正公布第58條條文","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">高級中等教育，應接續九年國民教育，以陶冶青年身心，發展學生潛能，奠定學術研究或專業技術知能之基礎，培養五育均衡發展之優質公民為宗旨。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">九年國民教育及高級中等教育，合為十二年國民基本教育。<\/div>\n<div class=\"doc-plain\">九年國民教育，依國民教育法規定，採免試、免學費及強迫入學；高級中等教育，依本法規定，採免試入學為主，由學生依其性向、興趣及能力自願入學，並依一定條件採免學費方式辦理。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本法之主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"chapter-heading\">第  二  章  設立、類型及評鑑<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">高級中等學校由中央政府、直轄市政府、縣(市)政府或由私人依私立學校法設立之。<\/div>\n<div class=\"doc-plain\">高級中等學校依其設立之主體為中央政府、直轄市政府、縣(市)政府或私人，分為國立、直轄市立、縣(市)立或私立；其設立、變更或停辦，依下列規定辦理：<\/div>\n<div class=\"doc-plain\">國立：由中央主管機關核定。<\/div>\n<div class=\"doc-plain\">直轄市立：由直轄市主管機關核定後，報中央主管機關備查。<\/div>\n<div class=\"doc-plain\">縣(市)立：由縣(市)主管機關核定後，報中央主管機關備查。<\/div>\n<div class=\"doc-plain\">私立：在直轄市由直轄市主管機關核定後，報中央主管機關備查；在縣(市)由中央主管機關核定。<\/div>\n<div class=\"doc-plain\">高級中等學校得設立分校、分部。<\/div>\n<div class=\"doc-plain\">高級中等學校與其分校、分部設立所需之校地、校舍、設備、設校經費、師資、變更或停辦之要件、核准程序及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">高級中等學校分為下列類型：<\/div>\n<div class=\"doc-plain\">普通型高級中等學校：提供基本學科為主課程，強化學生通識能力之學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技術型高級中等學校：提供專業及實習學科為主課程，包括實用技能及建教合作，強化學生專門技術及職業能力之學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">綜合型高級中等學校：提供包括基本學科、專業及實習學科課程，以輔導學生選修適性課程之學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">單科型高級中等學校：採取特定學科領域為核心課程，提供學習性向明顯之學生，繼續發展潛能之學校。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">前條所定各類型學校，除單科型高級中等學校外，得設群、科、學程。<\/div>\n<div class=\"doc-plain\">普通型高級中等學校經第四條第二項各款核准設立之主管機關(以下簡稱各該主管機關)核定，得設專業群、科、綜合高中學程。<\/div>\n<div class=\"doc-plain\">技術型高級中等學校以分類設立為原則，必要時，得合類設立；其應依類分群，並於群下設科，僅有一科者，不予設群；其經各該主管機關核定，得設普通科、綜合高中學程。<\/div>\n<div class=\"doc-plain\">前項所定類，指依配合國家建設、符應社會產業、契合專業群科屬性及學生職涯發展形成之類別；其分類依中央主管機關訂定之課程綱要規定。<\/div>\n<div class=\"doc-plain\">第一項至第三項所定群，指以相同屬性科別形成之專業群集，其分群依中央主管機關訂定之課程綱要規定。<\/div>\n<div class=\"doc-plain\">高級中等學校群、科、學程之設立、變更、停辦及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">高級中等學校經各該主管機關核定，得於同一直轄市、縣(市)設國民中學部。設有國民中學部之高級中等學校，基於中小學一貫教育之考量，經各該主管機關核定，得於同一直轄市、縣(市)設國民小學部。<\/div>\n<div class=\"doc-plain\">依前二項規定所設之國民中學部及國民小學部，適用國民教育法之相關規定。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">高級中等學校為提供已受國民教育者繼續學習之教育機會，經各該主管機關核定，得設進修部，辦理繼續進修教育。高級中等學校進修部之教學內容，應配合學生學習及社會需要，課程並應符合中央主管機關訂定之課程綱要規定；其授課方式得採按日制、間日制或假日制。矯正機關收容人並得以在矯正機關收容方式為之。<\/div>\n<div class=\"doc-plain\">高級中等學校進修部學生學習評量辦法，由中央主管機關定之；修業期滿，評量及格者，准予畢業。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">公立高級中等學校之校名，依其類型、群科類別，由各該主管機關定之；私立高級中等學校不得以地名為校名，其校名由學校財團法人於申請籌設時定之，非經各該主管機關許可，不得變更。<\/div>\n<div class=\"doc-plain\">私立高級中等學校申請設立之校名，足使一般民眾誤認與他校為同一學校者，各該主管機關得令其變更之。<\/div>\n<div class=\"doc-plain\">本法施行前已設立之高級中等學校，其校名得沿用原校名。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">高級中等學校為配合產業發展，提供學生職場實作學習及產學合作，得辦理建教合作；其相關事項，另以法律定之。<\/div>\n<div class=\"doc-plain\">高級中等學校為提供終身學習之需求，得結合公、私立機構及社會團體，以非營利方式辦理推廣教育；其辦法，由各該主管機關定之。 <\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">高級中等學校應定期對教學、輔導、校務行政及學生參與等事項，進行自我評鑑；其規定，由各校定之。<\/div>\n<div class=\"doc-plain\">各該主管機關為促進高級中等學校均優質化發展，應定期辦理學校評鑑，並公告其結果，作為協助學校調整及發展之參考；其評鑑辦法，由各該主管機關定之。 <\/div>\n<div class=\"article-heading\">第  12  條 <\/div>\n<div class=\"doc-plain\">為促進教育多元發展、改進教育素質，各該主管機關得指定或核准公私立高級中等學校辦理全部或部分班級之實驗教育；其實驗期程、實驗範圍、申請條件與程序及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">前項學校全部或部分班級辦理實驗教育者，其課程得不受第四十三條第一項課程綱要規定之限制；全部班級辦理實驗教育者，其設校條件，得不受第四條第四項所定辦法有關規定之限制。 <\/div>\n<div class=\"article-heading\">第  13  條 <\/div>\n<div class=\"doc-plain\">為保障學生學習權及家長教育選擇權，高級中等教育階段得以個人、團體及機構方式辦理非學校型態之實驗教育；其申請條件、程序、學生受教資格、課程、學籍管理、學習評量、畢業條件、訪視輔導、收費、政府補助及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  三  章  校長聘任及考核<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\" style=\"padding-left:0.08em\">高級中等學校置校長一人，專任，綜理校務，經各該主管機關許可者，得於本校或他校兼課。<\/div>\n<div class=\"doc-plain\">公立高級中等學校校長，由各該主管機關遴選合格人員聘任之；師資培育之大學附屬高級中等學校校長，由各該校組織遴選委員會就各該校或其附屬學校或其他學校校長或教師中遴選合格人員，送請校長聘兼(任)之，並報各該主管機關備查，或委由各該主管機關遴選合格人員聘任之。私立高級中等學校校長，由學校財團法人董事會遴選合格人員，並報各該主管機關核准後聘任之。<\/div>\n<div class=\"doc-plain\">高級中等學校校長應採任期制。公立學校校長一任四年，參與遴選之現職校長應接受辦學績效考評，經遴選會考評結果績效優良者，得在同一學校連任一次或優先遴選為出缺學校校長；第一任任期未屆滿，或連任任期未達二分之一者，不得參加他校校長遴選。私立學校校長任期及連任之規定，由學校財團法人董事會定之。<\/div>\n<div class=\"doc-plain\">現職國民中小學校長符合高級中等學校校長資格者，其於國民中小學校長第一任任期未屆滿或連任任期未達二分之一者，不得參加高級中等學校校長之遴選。<\/div>\n<div class=\"doc-plain\">各該主管機關或學校財團法人董事會為辦理第二項遴選事宜，應召開遴選會；其遴選會之組成與遴選方式、程序、基準、校長辦學績效考評、聘任及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">師資培育之大學辦理附屬高級中等學校校長遴選事宜，遴選委員會之組織及運作方式，由各師資培育之大學定之。<\/div>\n<div class=\"article-heading\">第  15  條 <\/div>\n<div class=\"doc-plain\">現職公立高級中等學校校長未獲遴聘，或因故解除職務，其具有教師資格願回任教師者，除有教師法所定解聘、停聘或不續聘情事者外，由各該主管機關逕行分發學校任教，免受教師評審委員會審議。<\/div>\n<div class=\"doc-plain\">前項校長未具教師資格無法回任或具有教師資格不願回任教師者，各該主<\/div>\n<div class=\"doc-plain\">管機關得依下列方式辦理：<\/div>\n<div class=\"doc-plain\">符合退休條件自願退休者，准其退休。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">不符合退休條件或不自願退休者，依其意願及資格條件，優先輔導轉任他職或辦理資遣。<\/div>\n<div class=\"article-heading\">第  16  條 <\/div>\n<div class=\"doc-plain\">各該主管機關應組成考核小組，對公立高級中等學校校長辦理年度成績考核；考核小組之組成與任務、考核程序、考核等級、獎懲類別、考核結果之通知、申訴及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">高級中等學校校長有不適任之事實者，公立學校校長由各該主管機關依法解除職務、改任其他職務或為其他適當之處理；私立學校校長由學校財團法人董事會依法處理。<\/div>\n<div class=\"chapter-heading\">第  四  章  組織及會議<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">高級中等學校為辦理教務、學生事務、總務、實習、資訊、研究發展、繼續進修教育、特殊教育、建教合作、技術交流等事務，得視學校規模及業務需要設處(室)一級單位，並得分組(科、學程)為二級單位辦事。<\/div>\n<div class=\"article-heading\">第  19  條 <\/div>\n<div class=\"doc-plain\">高級中等學校得置副校長一人，一級單位置主任或部主任一人，二級單位依其性質置組長、科主任或學程主任一人。<\/div>\n<div class=\"doc-plain\">副校長應由校長就曾任一級單位主管以上人員聘兼之。一級單位主任、部主任及二級單位科主任、學程主任，除總務單位之主任得由教師兼任或職員專任外，其餘均由校長就專任教師聘兼之。<\/div>\n<div class=\"doc-plain\">二級單位組長，除總務單位之組長由職員專任、學生事務單位負責生活輔導業務之組長得由具輔導知能之人員兼任外，其餘由校長就專任教師聘兼之或由職員專任。<\/div>\n<div class=\"article-heading\">第  20  條 <\/div>\n<div class=\"doc-plain\">高級中等學校設輔導處(室)，置專任輔導教師，由校長遴聘具有輔導專業知能之教師擔任之。<\/div>\n<div class=\"doc-plain\">高級中等學校輔導處(室)置主任一人，由校長於專任輔導教師中遴聘一人兼任之。<\/div>\n<div class=\"doc-plain\">高級中等學校設輔導工作委員會，置主任委員一人，由校長兼任，其餘委員由校長就各處(室)主任及有關專任教職員聘兼之，負責協調整合各處(室)之輔導相關工作，並置執行秘書，由輔導處(室)主任兼任。 <\/div>\n<div class=\"article-heading\">第  21  條 <\/div>\n<div class=\"doc-plain\">高級中等學校設圖書館，置主任一人，由校長遴選具有專業知能之人員專任，必要時得由具有專業知能之專任教師聘兼之。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">公立高級中等學校依有關法令設人事管理機構，依法辦理人事管理事項。<\/div>\n<div class=\"doc-plain\">私立高級中等學校設人事室或置人事管理員，其人員得由校長聘請專任教師兼任或由職員專任之。<\/div>\n<div class=\"article-heading\">第  23  條 <\/div>\n<div class=\"doc-plain\">公立高級中等學校依有關法令設主計機構，依法辦理歲計、會計及統計事項。<\/div>\n<div class=\"doc-plain\">私立高級中等學校會計單位及會計人員之設置，依私立學校法及其相關規定辦理。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">高級中等學校之組織設置及員額編制標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">本法施行前已依規定進用之護理教師，於本法施行後繼續任職者，其員額編制，納入前項標準。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">高級中等學校設校務會議，審議下列事項：<\/div>\n<div class=\"doc-plain\">校務發展或校園規劃等重大事項。<\/div>\n<div class=\"doc-plain\">依法令或本於職權所訂定之各種重要章則。<\/div>\n<div class=\"doc-plain\">教務、學生事務、總務及其他校內重要事項。<\/div>\n<div class=\"doc-plain\">其他依法令應經校務會議議決事項。<\/div>\n<div class=\"doc-plain\">校務會議，由校長、各單位主管、全體專任教師或教師代表、職員代表、家長會代表及經選舉產生之學生代表組成；其成員之人數、比率、產生及議決方式，由各校定之，任一性別成員人數不得少於成員總數三分之一；學生代表人數不得少於成員總數百分之八，並報各該主管機關備查。<br>前項經選舉產生之學生代表比率計算，遇有小數點時，採無條件進位法，取整數計算。<br>校務會議，由校長召集並主持，每學期至少開會一次；經校務會議代表五分之一以上請求召開臨時校務會議時，校長應於十五日內召開。<br>中華民國一百十年五月十一日修正之第二項及第三項規定，自一百十年十月一日施行。 <\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">高級中等學校為推展校務，除依法應設之委員會外，經由校務會議議決後，得設各種委員會；其組成及任務，由各校定之。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">高級中等學校設學生家長會，應由在學學生之家長為會員組織之，並冠以該校之名稱；其組織章程、任務、委員人數、委員產生方式、任期、選舉罷免、議事規則、經費來源、財務管理、運作及其他相關事項之辦法，由各該主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  五  章  教職員任用及考核<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">高級中等學校教師應為專任。但有特殊情形者，得為兼任。<\/div>\n<div class=\"doc-plain\">高級中等學校因校際合作、課程需要或有特殊情形者，得與他校合聘教師，並於一校專任；合聘教師之條件、比例限制、教師之權利義務及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">各該主管機關辦理公立高級中等學校教師之介聘，得自行或聯合組成介聘小組辦理；介聘小組之組織、介聘條件及運作之辦法，由各該主管機關定之。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">高級中等學校得置專業及技術教師，遴聘具有實際經驗之人員，擔任專業或技術科目之教學；其聘任、解聘、停聘、不續聘、請假、申訴、待遇、福利、退休、撫卹、資遣等事項，準用教師之規定；其分級、資格、進修、成績考核及其他權益等事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">高級中等學校每班置導師一人，由校長就專任教師聘兼之。但建教合作班得依需要增置導師員額。<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">高級中等學校置軍訓主任教官、軍訓教官；其編制、員額、資格及遴選事項之辦法，由中央主管機關會同國防部定之；其職掌、介派、遷調、進修、申訴及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain\">公立高級中等學校專任教師、合聘教師、專業及技術教師、兼任導師或行政職務者，其每週教學節數之標準，由各該主管機關定之。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain\">各該主管機關應對公立高級中等學校教師辦理年度成績考核；其考核會之組成與任務、考核程序、考核指標、考核等級、獎懲類別、結果之通知及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  六  章  學生資格、入學方式及就學區劃分<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain\">國民中學畢業生或具同等學力者，具有高級中等學校入學資格；同等學力之認定標準，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  35  條<\/div>\n<div class=\"doc-plain\">為發展多元智能、培育創新人才，高級中等學校應採多元入學方式辦理招生。多元入學，以免試入學為主；經各該主管機關核定者，得就部分名額，辦理特色招生。<\/div>\n<div class=\"doc-plain\">前項免試入學，一百零三學年度各就學區之總名額，應占核定招生總名額百分之七十五以上，並逐年提升，至一百零八學年度，應占核定招生總名額百分之八十五以上。<\/div>\n<div class=\"doc-plain\">免試入學總名額，包括學校附設國民中學部應屆畢業學生直升之名額；其直升名額規定如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">國立高級中等學校直升名額：不得高於國民中學部應屆畢業學生人數之百分之三十五。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">直轄市、縣(市)立高級中等學校直升名額：由直轄市、縣(市)主管機關定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">私立高級中等學校直升名額：一百零三學年度不得高於該校核定招生總名額之百分之六十。但其附設國民中學部學生人數小於學校招生人數者，不得高於國民中學部應屆畢業學生人數百分之六十，並採逐年漸進方式調整比率，至一百零八學年度不得高於百分之五十。<\/div>\n<div class=\"doc-plain\">各就學區直升入學比率規定較本法限制更嚴格者，從其規定。<\/div>\n<div class=\"doc-plain\">私立高級中等學校違反法令規定，以考試或甄選等篩選方式進入其國民中學部、國民小學部之學生，經各該主管機關查證屬實者，自下一學年度起，其前項第三款核定直升名額依其違規人數比率扣減。<\/div>\n<div class=\"doc-plain\">一百零三學年度各校提供免試入學名額比率，不得低於該校核定招生總名額百分之二十五，其比率得逐年檢討調整之。<\/div>\n<div class=\"doc-plain\">私立高級中等學校非政府捐助設立、未接受政府依私立學校法第五十九條規定所為獎勵、補助，且未由政府依第五十六條規定負擔學費者，得擬具課程計畫、申請單獨招生之理由、招生範圍及招生方式，報各該主管機關核定後，單獨辦理招生，不受本法有關招生規定之限制。但仍應提供不低於該校核定招生總名額百分之十五之免試入學名額。<\/div>\n<div class=\"doc-plain\">採第三項直升方式者，其超額比序方式應依第三十七條第四項規定辦理。<\/div>\n<div class=\"doc-plain\">各國民中學應協助學生自我認識及探索，依其能力、性向及興趣等，給予適性輔導，並提供升學選擇之建議，進入高級中等學校就學。<\/div>\n<div class=\"article-heading\">第  36  條 <\/div>\n<div class=\"doc-plain\">私立高級中等學校入學方式，未依本法規定，並報經主管機關核准者，其學生不適用第五十六條免學費之規定。<\/div>\n<div class=\"doc-plain\">私立高級中等學校應依下列原則配合十二年國民基本教育之實施：<\/div>\n<div class=\"doc-plain\">培養學生五育均衡發展。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">充足合格教師專長授課。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">輔導學生適性發展。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">貫徹教學正常化。<\/div>\n<div class=\"article-heading\">第  37  條 <\/div>\n<div class=\"doc-plain\">高級中等學校辦理免試入學，應由學生向學校提出申請，免考入學測驗。<br>申請免試入學人數未超過各該主管機關核定之名額者，全額錄取。<br>申請免試入學人數超過各該主管機關核定之名額者，其錄取方式，由直轄市、縣(市)主管機關會商就學區內學校各該主管機關訂定，報中央主管機關備查。但技術型及單科型高級中等學校有特殊招生需要，擬具課程計畫、招生計畫、名額及免試入學方式，報各該主管機關核定者，不在此限。<br>前項情形，除得以學生在校健康與體育、藝術、綜合活動、科技領域之學習領域評量成績及格與否作為比序項目外，其他在校學習領域評量成績均不得採計。<br>第三項免試入學超額比序之原則、程序及相關事項之規定，各直轄市、縣(市)主管機關應於各學年度開始一年前公告之。<br>一百零八學年度前入學國民中學者，仍適用本法中華民國一百十年五月十一日修正之條文施行前之第四項規定。<\/div>\n<div class=\"article-heading\">第  38  條 <\/div>\n<div class=\"doc-plain\">高級中等學校辦理特色招生，應採學科考試分發或術科甄選方式辦理。<\/div>\n<div class=\"doc-plain\">各該主管機關應就高級中等學校評鑑結果、歷年招生情形、學生表現及課程規劃等，公告辦理特色招生之條件及名額。<\/div>\n<div class=\"doc-plain\">高級中等學校依前項公告，擬具計畫及名額，報各該主管機關核定後，始得辦理特色招生；各該主管機關應以逐校逐班審核為原則，並公告核定之理由。<\/div>\n<div class=\"doc-plain\">前項計畫內容，應包括特色招生之目標、課程與教學規劃及學生進路輔導等事項。<\/div>\n<div class=\"doc-plain\">第一項採學科考試分發之特色招生，應於免試入學後辦理。免試入學未招滿之名額，不得移列調整於特色招生。<\/div>\n<div class=\"article-heading\">第  39  條 <\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應自行或會同其他主管機關考量行政區內或跨行政區各校新生入學來源、區域共同生活圈、交通便利性、學校類型及分布等情形，規劃前二條高級中等學校就學區，報中央主管機關核定後公告之。<\/div>\n<div class=\"doc-plain\">中央主管機關依前項規定核定前，得邀集相關直轄市、縣(市)主管機關、國民中學與高級中等學校代表及學者專家共同協商。 <\/div>\n<div class=\"article-heading\">第  40  條<\/div>\n<div class=\"article-heading\">第三十五條<\/div><div class=\"doc-plain\">至前條所定多元入學招生方式與對象、實施區域、範圍與方法、辦理時間、各類招生方式名額比率、特色招生之考試與甄選方式、就學區之劃定原則與程序、各該主管機關與學校之組織分工、私立高級中等學校入學方式不受限制之學校、其範圍、辦理方式、程序及其他應遵行事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關定之。<\/div>\n<div class=\"article-heading\"> 第  41  條<\/div>\n<div class=\"doc-plain\">下列學生進入高級中等學校就讀，不受前條所定辦法之限制，其身分認定、名額、辦理方式、時程、錄取原則及其他有關入學重要事項之辦法，由中央主管機關定之：<\/div>\n<div class=\"doc-plain\">身心障礙學生。<\/div>\n<div class=\"doc-plain\">原住民學生。<\/div>\n<div class=\"doc-plain\">重大災害地區學生。<\/div>\n<div class=\"doc-plain\">政府派赴國外工作人員子女。<\/div>\n<div class=\"doc-plain\">參加國際性學科或術科競賽成績優良學生。<\/div>\n<div class=\"doc-plain\">技藝技能競賽成績優良學生。<\/div>\n<div class=\"doc-plain\">運動成績優良學生。<\/div>\n<div class=\"doc-plain\">退伍軍人。<\/div>\n<div class=\"doc-plain\">僑生。<\/div>\n<div class=\"doc-plain\">蒙藏學生。<\/div>\n<div class=\"doc-plain\">外國學生。<\/div>\n<div class=\"doc-plain\">基於人道考量、國際援助或其他特殊身分經專案核定安置之學生。<\/div>\n<div class=\"doc-plain\">前項第一款及第二款學生之入學保障辦法，依特殊教育法及原住民族教育法之規定。<\/div>\n<div class=\"chapter-heading\">第  七  章  課程及學習評量<\/div>\n<div class=\"article-heading\">第  42  條<\/div>\n<div class=\"doc-plain\">高級中等學校學生修業年限為三年。但性質特殊之類、群、科、學程有增減修業年限之必要，經各該主管機關報中央主管機關核定者，不在此限。<\/div>\n<div class=\"doc-plain\">學生未在修業年限內修畢應修課程者，得延長其修業年限，至多二年。身心障礙學生因身心狀況及學習需要，得延長修業期限，至多四年。<\/div>\n<div class=\"doc-plain\">學生因懷孕、分娩或撫育三歲以下子女，得延長修業期限，至多四年。<\/div>\n<div class=\"article-heading\">第  43  條   <\/div>\n<div class=\"doc-plain\">中央主管機關應訂定高級中等學校課程綱要及其實施之有關規定，作為學校規劃及實施課程之依據；學校規劃課程並得結合社會資源充實教學活動。<\/div>\n<div class=\"doc-plain\">前項高級中等學校課程綱要之訂定，除由中央主管機關常設課程研究發展機構外，其他教育相關領域之機構、學校、法人及團體，亦得提出課程綱要草案，併案委由課程審議委員會審議；其提案方式、處理程序及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">課程綱要之研究、發展、審議及其實施，應秉持尊重族群多元、性別平等、公開透明、超越黨派之原則。<\/div>\n<div class=\"article-heading\">第  43-1  條 <\/div>\n<div class=\"doc-plain\">中央主管機關為審議課程綱要，應設課程審議會(以下簡稱課審會)；課審會分為審議大會及分組審議會。<\/div>\n<div class=\"doc-plain\">審議大會置委員四十一至四十九人，由政府機關代表與非政府代表組成。<\/div>\n<div class=\"doc-plain\">其中具政府機關代表身分者，不得超過委員總人數之四分之一。<\/div>\n<div class=\"doc-plain\">審議大會具政府機關代表身分之委員，由教育部就中央與地方機關人員提名後，送請行政院院長聘任之，並依其職務任免改聘。<\/div>\n<div class=\"doc-plain\">非政府代表之審議大會委員，依下列程序產生之：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">由行政院就國內具教育專業之專家學者、教師組織成員、校長組織成員、家長組織成員、其他教育相關之非政府組織成員及學生代表，提名委員候選人，提交課審會委員審查會以過半數同意後，送請行政院院長聘任之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前款課審會委員審查會由立法院推舉十一名至十五名社會公正人士組成之。<\/div>\n<div class=\"doc-plain\">課審會委員任期四年，任滿得連任。單一性別不得低於委員總人數三分之一。政府機關代表及非政府代表中，均應包含具原住民身分者。但第一次聘任之非政府代表委員，其中二分之一之任期為二年。<\/div>\n<div class=\"doc-plain\">中央及地方各級民意機關代表不得擔任課審會委員審查會之委員。<\/div>\n<div class=\"article-heading\">第  43-2  條 <\/div>\n<div class=\"doc-plain\">課審會審議大會掌理下列事項：<\/div>\n<div class=\"doc-plain\">課程綱要總綱、各領域、科目、群科課程綱要之審議。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校課程修訂原則之審議。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他依法應由課審會決議事項。<\/div>\n<div class=\"doc-plain\">課審會審議大會之決議，應有全體委員三分之二以上出席，以出席委員過半數之同意行之。<\/div>\n<div class=\"doc-plain\">課審會審議大會、分組審議會之組成及運作辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  44  條<\/div>\n<div class=\"doc-plain\">技術型高級中等學校之課程，應加強通識教育、實驗及實習。<\/div>\n<div class=\"doc-plain\">前項實習課程之教學目標、科目、學分數、實施方式、實習場所、師資及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">綜合型高級中等學校之實習課程及普通型高級中等學校設有專業群、科、綜合高中學程之實習課程，準用前項辦法之規定。<\/div>\n<div class=\"article-heading\">第  45  條<\/div>\n<div class=\"doc-plain\">高級中等學校應辦理學生學習評量，其評量範圍包括學業成績及德行評量。<\/div>\n<div class=\"doc-plain\">前項評量方式、科目、結果及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">高級中等學校應就學生能力、性向及興趣，輔導其適性發展，並得採取專案編班方式提供體育、音樂、美術、舞蹈、戲劇等技藝課程，以銜接國民中學之技藝教育，其所需專業師資得由校長就校外具有專業技能之專任教師聘任之。 <\/div>\n<div class=\"article-heading\">第  46  條<\/div>\n<div class=\"doc-plain\">高級中等學校學生依第四十三條第一項所定課程綱要修畢其應修課程或學分成績及格，且德行評量之獎懲紀錄相抵後未滿三大過者，由學校發給畢業證書。<\/div>\n<div class=\"article-heading\">第  47  條<\/div>\n<div class=\"doc-plain\">高級中等學校學生保留入學資格、轉學、轉科(學程)、休學、學分(課程)抵免、重(補)修、服兵役與出國等有關學籍處理、雙重學籍及其他與學籍有關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">高級中等學校學生持國外學歷之採認原則、認定程序及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  48  條<\/div>\n<div class=\"doc-plain\">高級中等學校教科用書，以由民間編輯為原則，必要時，得由中央主管機關編定之。<\/div>\n<div class=\"doc-plain\">高級中等學校教科用書，由國家教育研究院審定；申請教科用書審定者之資格、申請程序、審查範圍、審查程序、費額、審定執照之發給與廢止、印製規格、成書修訂、稀有類科教材之編訂與獎助及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  49  條<\/div>\n<div class=\"doc-plain\">高級中等學校教科用書應由各學校公開選用；其選用規定，由學校訂定，經校務會議通過後實施；其相關採購方式，由各該主管機關定之。<\/div>\n<div class=\"chapter-heading\">第 八 章 學生權利及義務<\/div>\n<div class=\"article-heading\">第  50  條<\/div>\n<div class=\"doc-plain\">高級中等學校應就學生能力、性向及興趣，考量社會職場動態，輔導其適性發展；其輔導工作、項目、程序、實施方式及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  51  條<\/div>\n<div class=\"doc-plain\">高級中等學校應訂定學生獎懲規定，經校務會議通過後實施，並報各該主管機關備查。<\/div>\n<div class=\"article-heading\">第  52  條<\/div>\n<div class=\"doc-plain\">高級中等學校設學生獎懲委員會，評議學生獎懲事件。<\/div>\n<div class=\"doc-plain\">前項委員會之組成應包括經選舉產生之學生代表或學生會代表；其組成、評議範圍、期限、評議方式、評議結果之執行及其他相關事項之辦法，由各該主管機關定之。<\/div>\n<div class=\"article-heading\">第  53  條<\/div>\n<div class=\"doc-plain\">高級中等學校應輔導學生成立由全校學生選舉產生之學生會及其他相關自治組織，並提供其必要協助，以增進學生在校學習效果及自治能力。<\/div>\n<div class=\"doc-plain\">學生為前項學生會當然會員。<\/div>\n<div class=\"article-heading\">第  54  條<\/div>\n<div class=\"doc-plain\">學生權益之救濟，依本法所定申訴、再申訴程序行之。<br>學生或學生自治組織對學校之懲處、其他措施或決議，認為違法或不當致損害其權益者，得向學校提出申訴；不服學校申訴決定，得向各該主管機關提出再申訴；其提起訴願者，受理訴願機關應於十日內，將該事件移送應受理之學生申訴評議委員會或學生再申訴評議委員會，並通知學生或學生自治組織。<br>申訴之提起，應於收受或知悉懲處、其他措施或決議之次日起三十日內以書面為之；再申訴應於申訴評議書達到之次日起三十日內以書面為之；其期間，以學校收受申訴書或各該主管機關收受再申訴書之日期為準。<br>高級中等學校應設學生申訴評議委員會，委員會之組成應包括經選舉產生之學生代表或學生會代表，並應包括法律、教育、兒童及少年權利、心理或輔導專家學者至少一人；各該主管機關應設學生再申訴評議委員會，其中法律、教育、兒童及少年權利、心理或輔導專家學者人數應逾委員總數二分之一；學生申訴評議委員會及學生再申訴評議委員會，任一性別委員人數不得少於委員總數三分之一；其申訴、再申訴範圍、期限、委員會組成、調查方式、評議方式、評議結果之執行及其他相關事項之辦法，由中央主管機關定之。<br>學校受理第五十二條、第二項及前項之懲處或申訴事件，各該主管機關受理再申訴事件時，應秉持客觀、公正、專業之原則，給予受懲處人或申訴人、再申訴人充分陳述意見及答辯之機會。<br>學校應以書面或其他適當方式告知受懲處人；學校及各該主管機關應以書面告知申訴人或再申訴人，各該評議決定及不服該決定之相關救濟程序。<br>原懲處、措施或決議性質屬行政處分者，其再申訴決定視同訴願決定；不服再申訴決定者，得依法提起行政訴訟。<\/div>\n<div class=\"article-heading\">第  54-1  條<\/div>\n<div class=\"doc-plain\">中華民國一百十年五月十一日修正之前條規定，自公布後一年施行。<br>中華民國一百十年五月十一日修正之前條規定施行前，尚未終結之事件，其以後之程序，依修正施行後之前條規定終結之。<\/div>\n<div class=\"article-heading\">第  55  條<\/div>\n<div class=\"doc-plain\">高級中等學校為維護學生權益，對學生學業、生活輔導、獎懲有關規章研訂或影響其畢業條件之會議，應由經選舉產生之學生代表或學生會代表出席；其人數由各校校務會議定之。<\/div>\n<div class=\"article-heading\">第  56  條<\/div>\n<div class=\"doc-plain\">高級中等學校學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀及符合第三十六條第一項私立學校之學生，不適用之。<\/div>\n<div class=\"doc-plain\">前項免納之學費，由政府編列預算補助學生。公立高級中等學校學生，由各校於註冊時逕免繳納；私立高級中等學校學生，由各校於註冊時免予繳納後，造具清冊函報各該主管機關請撥經費。<\/div>\n<div class=\"doc-plain\">第一項免納學費所需經費，除下列情形由各該主管機關負擔者外，由中央主管機關負擔之：<\/div>\n<div class=\"doc-plain\">本法施行前已由各該主管機關負擔。<\/div>\n<div class=\"doc-plain\">依其他法規規定由各該主管機關負擔。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本法施行後因主管機關管轄變更，免納學費所需經費已移由各該主管機關負擔。<\/div>\n<div class=\"doc-plain\">除第一項免納學費規定外，高級中等學校得向學生收取學費、雜費、代收代付費、代辦費等必要費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關定之。<\/div>\n<div class=\"article-heading\">第  57  條<\/div>\n<div class=\"doc-plain\">政府對就讀高級中等學校之經濟弱勢學生，應視其就讀公私立學校之實際需要及政府財政狀況給予學費外之補助；其補助對象、條件、基準及其他相關事項之辦法，由中央主管機關會商直轄市、縣(市)主管機關後定之。<\/div>\n<div class=\"article-heading\">第  58  條<\/div>\n<div class=\"doc-plain\">政府為協助學生就讀高級中等學校，應辦理學生就學貸款；貸款項目包括雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費、海外研修費及重讀者之學費等相關費用；其貸款條件、額度、項目、權利義務、還款協助措施及其他應遵行事項之辦法，由中央主管機關定之；其涉及原住民者，應會商中央原住民族主管機關定之。<\/div>\n<div class=\"article-heading\">第  59  條<\/div>\n<div class=\"doc-plain\">高級中等學校應辦理學生團體保險；其範圍、金額、繳費方式、期程、給付基準、權利與義務、辦理方式及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">學生申請理賠時，學校應主動協助辦理。<\/div>\n<div class=\"doc-plain\">各該主管機關應為所轄之公私立高級中等學校場所投保公共意外責任保險；其投保範圍、投保金額及相關事項，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">前項經費，由中央主管機關按年度編列預算支應之。<\/div>\n<div class=\"chapter-heading\">第  九  章  附則<\/div>\n<div class=\"article-heading\">第  60  條<\/div>\n<div class=\"doc-plain\">公立高級中等學校有下列情形之一者，由各該主管機關核予相關人員行政懲處、扣減補助款或減招班級數，並命其限期改善；屆期未改善者，並得按次處罰至改善為止：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實施教學，違反中央主管機關依第五十條所定輔導學生五育均衡或適性發展辦法之規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">合格教師比率，違反中央主管機關依第二十四條第一項所定高級中等學校組織設置及員額編制標準之規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">向學生收取費用，違反各該主管機關依第五十六條第四項所定辦法之規定。<\/div>\n<div class=\"doc-plain\">私立高級中等學校有前項各款情形之一者，依私立學校法第五十五條規定處理。<\/div>\n<div class=\"article-heading\">第  61  條<\/div>\n<div class=\"doc-plain\">公立高級中等學校之場地、設施、設備提供他人使用、委託經營、獎勵民間參與所獲之收入，不受國有財產法第七條收入解繳國庫及地方公有財產管理收入解繳公庫相關規定之限制。<\/div>\n<div class=\"doc-plain\">公立高級中等學校之場地、設施、設備提供他人使用時，應以公益目的為優先。<\/div>\n<div class=\"doc-plain\">公立高級中等學校編列公務預算者，前項收入與辦理學生課業輔導、重(補)修、招生、甄選、實習、實驗、實施推廣教育、接受捐款等收入及其相關支出，得設置專帳以代收代付方式執行，其賸餘款並得滾存作為改善學校基本設施或充實教學設備之用，不受預算法第十三條規定之限制。<\/div>\n<div class=\"doc-plain\">前項收支管理作業規定，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">公立高級中等學校編列附屬單位預算者，其各項收支均應依預算法循預算程序納入校務基金辦理。<\/div>\n<div class=\"article-heading\">第  62  條<\/div>\n<div class=\"doc-plain\">高級中等學校特殊教育學生之教育需求，應依特殊教育相關規定辦理。<\/div>\n<div class=\"article-heading\">第  63  條<\/div>\n<div class=\"doc-plain\">具高級中等學校畢業程度者，得經自學進修學力鑑定考試及格，發給證書；其考試辦理機關、每年舉辦之次數與時間、應考資格、考試科目與範圍、成績計算基準、證書之頒發、撤銷與廢止事由及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  64  條<\/div>\n<div class=\"doc-plain\">本法公布施行前所設之高級中等進修學校及夜間部，自本法施行之日起，應依本法規定轉型為進修部；其已任職教職員工及已招收學生之權益，仍適用本法施行前之規定辦理。<\/div>\n<div class=\"doc-plain\">前項本法公布施行前所設之高級中等進修學校及夜間部轉型為進修部之程序及期限，於本法施行細則定之。<\/div>\n<div class=\"doc-plain\">本法公布施行前，已獨立設立或大學校院附設之高級中等進修學校，其招生、變更、停辦及相關事項，依本法之規定辦理。<\/div>\n<div class=\"article-heading\">第  65  條<\/div>\n<div class=\"doc-plain\">國防部為培育軍事人才設立之高級中等學校，準用本法之規定；其準用範圍，由國防部會商中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  66  條<\/div>\n<div class=\"doc-plain\">本法施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  67  條<\/div>\n<div class=\"doc-plain\">本法除第三十五條至第四十一條條文自中華民國一百零二年九月一日施行外，自一百零三年八月一日施行。<\/div>\n<div class=\"doc-plain\">本法修正條文，除中華民國一百零五年五月十七日修正之第二十五條、第五十二條、第五十四條及第五十五條自一百零五年十月一日施行外，自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國102年7月10日總統華總一義字第10200131151號令制定公布，除第35條至第41條條文自102年9月1日施行外，自103年8月1日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國105年6月1日總統華總一義字第 10500050791 號令修正公布，第 14、25、43、52～55、67 條條文；並增訂第 43-1、43-2 條條文；除第 25、52、54、55 條自105年10月1日施行外，自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國110年5月26日總統華總一義字第 11000049231  號令修正公布第25、37、54、55 條條文；增訂第54-1 條條文；除第54條條文自公布後1年施行外，其餘自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4.中華民國115年9月23日總統華總一義字第11500093361  號令修正公布第58條條文<\/div>"},{"title":"高級中等教育法施行細則","content":"第  1  條\n本細則依高級中等教育法(以下簡稱本法)第六十六條規定訂定之。\n第  2  條\n本法施行前已設立之高級中等學校，依本法第九條第三項規定沿用原校名者，於本法施行後有變更類型、群科類別，或學校合併、改制時，應依本法第九條第一項及第二項規定，變更名稱。\n第  3  條\n現職公立高級中等學校校長，依本法第十五條第一項規定，經各該主管機關逕行分發學校任教者，由受分發學校校長直接發給教師聘書。但聘期屆滿之續聘，應依教師法之規定辦理。\n第  4  條\n高級中等學校依本法第十九條規定置副校長者，除襄助校長推動校務外，其具有教師資格者，得經校長同意，在校外兼課。\n第  5  條\n高級中等學校依本法第二十六條規定設有學科、群科教學研究委員會者，置召集人一人，負責協調教師進行研究、改進教材教法、推展教學活動，並得減少每週基本教學節數。\n第  6  條\n本法第三十六條第一項所稱私立高級中等學校學生不適用本法第五十六條免學費之規定者，指依本法第三十五條第六項規定，經各該主管機關核定，辦理單獨招生之私立高級中等學校所招收之學生。但依本法第三十五條第六項但書所定名額免試入學之學生，不包括在內。\n第  7  條\n高級中等學校依課程進度，分年級實施教學；每班學生人數，以二十五人至四十五人為限。但情形特殊，經各該主管機關核定者，不在此限。\n高級中等學校新開辦第一年，不得招收二年級以上學生，第二年不得招收三年級學生。\n第  8  條\n高級中等學校除依本法第四十八條規定，公開選用民間編定經國家教育研究院審定或中央主管機關編定之教科用書外，得依高級中等學校課程綱要及其實施之有關規定，自編補充教材。\n第  9  條\n本法施行前所設之高級中等進修學校及夜間部，應於施行後三年內，依本法第六十四條規定，提出轉型計畫書，就學生學習、課程教學、教職員工及學生權益之保障，詳加規劃，並報各該主管機關核定後，轉型為所屬高級中等學校之進修部。\n第  10  條\n本細則自中華民國一百零三年八月一日施行。","history":"中華民國102年12月27日教育部臺教授國部字第1020125135A號令訂定發布全文10條；並自103年8月1日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本細則依高級中等教育法(以下簡稱本法)第六十六條規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本法施行前已設立之高級中等學校，依本法第九條第三項規定沿用原校名者，於本法施行後有變更類型、群科類別，或學校合併、改制時，應依本法第九條第一項及第二項規定，變更名稱。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">現職公立高級中等學校校長，依本法第十五條第一項規定，經各該主管機關逕行分發學校任教者，由受分發學校校長直接發給教師聘書。但聘期屆滿之續聘，應依教師法之規定辦理。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">高級中等學校依本法第十九條規定置副校長者，除襄助校長推動校務外，其具有教師資格者，得經校長同意，在校外兼課。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">高級中等學校依本法第二十六條規定設有學科、群科教學研究委員會者，置召集人一人，負責協調教師進行研究、改進教材教法、推展教學活動，並得減少每週基本教學節數。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">本法第三十六條第一項所稱私立高級中等學校學生不適用本法第五十六條免學費之規定者，指依本法第三十五條第六項規定，經各該主管機關核定，辦理單獨招生之私立高級中等學校所招收之學生。但依本法第三十五條第六項但書所定名額免試入學之學生，不包括在內。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">高級中等學校依課程進度，分年級實施教學；每班學生人數，以二十五人至四十五人為限。但情形特殊，經各該主管機關核定者，不在此限。<\/div>\n<div class=\"doc-plain\">高級中等學校新開辦第一年，不得招收二年級以上學生，第二年不得招收三年級學生。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">高級中等學校除依本法第四十八條規定，公開選用民間編定經國家教育研究院審定或中央主管機關編定之教科用書外，得依高級中等學校課程綱要及其實施之有關規定，自編補充教材。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">本法施行前所設之高級中等進修學校及夜間部，應於施行後三年內，依本法第六十四條規定，提出轉型計畫書，就學生學習、課程教學、教職員工及學生權益之保障，詳加規劃，並報各該主管機關核定後，轉型為所屬高級中等學校之進修部。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">本細則自中華民國一百零三年八月一日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">中華民國102年12月27日教育部臺教授國部字第1020125135A號令訂定發布全文10條；並自103年8月1日施行。<\/div>"},{"title":"技術及職業教育法","content":"第  一  章  總則\n第  1  條\n為建立技術及職業教育(以下簡稱技職教育)人才培育制度，培養國人正確職業觀念，落實技職教育務實致用特色，培育各行業人才，特制定本法。\n第  2  條\n本法之主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。\n第  3  條\n本法用詞，定義如下：\n職業試探教育：指提供學生對職業之認識、探索及體驗教育。\n職業準備教育：指提供學生進入職場所需之專業知識、技術及職業倫理涵養教育，及建立技職專業之榮譽感。\n職業繼續教育：指提供在職者或轉業者，再學習職場所需之專業技術或職業訓練教育。\n技職校院：指技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程、專科學校、技術學院及科技大學。\n技專校院：指專科學校、技術學院及科技大學。\n職業訓練機構：指依職業訓練法登記或許可設立之職業訓練機構。\n第  二  章  技職教育之規劃及管理\n第  4  條\n為培育符合國家經濟及產業發展需求之人才，制定宏觀技職教育政策綱領，行政院應定期邀集教育部、勞動部、經濟部、國家發展委員會及其他相關部會首長，召開技職教育審議會；其委員之遴聘、組織及運作辦法，由行政院定之。\n前項綱領，至少每二年應通盤檢討一次並公告之。\n第  5 條\n中央主管機關應自行、委任或委託學校、法人、機關(構)或團體，進行技職教育相關資料之調查及統計。\n中央目的事業主管機關應彙整所轄產業人才需求相關資料，並提供產業人才需求調查及推估報告，送中央主管機關。\n中央主管機關應定期公告第一項技職教育統計資料與各級各類產業、職業發展及人力需求資訊。\n第  6  條\n直轄市、縣(市)主管機關應每三年向中央主管機關提出技職教育報告，由中央主管機關據以訂定技職教育發展報告。\n第  7  條\n主管機關應衡酌區域產業及個人就業需求，配合社會、經濟及技術發展，規劃所轄學校技職教育之實施。\n直轄市、縣(市)主管機關辦理技職教育具有成效時，中央主管機關得提撥經費予以獎勵；其獎勵之條件、方式及其他應遵行事項之辦法，由中央主管機關定之。\n第  8  條\n主管機關應邀請政府相關單位、學者專家、社會人士、企業界代表、學校代表、教師團體代表、產業(職業)公會或工會等單位之代表，組成技職教育諮詢會，提供技職教育相關事項之諮詢。\n前項技職教育諮詢會之組成，任一性別委員人數不得少於委員總人數之三分之一。\n第  三  章  技職教育之實施\n第  一  節  職業試探教育\n第  9  條\n高級中等以下學校應開設或採融入式之職業試探、生涯輔導課程，提供學生職業試探機會，建立正確之職業價值觀。\n國民小學及國民中學之課程綱要，應納入職業認識與探索相關內容；高級中等學校及國民中學應安排學生至相關產業參訪。\n第  10  條\n國民中學為實施職業試探教育，得與技職校院或職業訓練機構合作辦理技藝教育；其實施辦法，由中央主管機關會商中央勞動主管機關定之。\n國民中學與職業訓練機構間之權利義務關係，應以契約定之，並由學校報主管機關備查。\n前項契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n第  二  節  職業準備教育\n第  11  條\n高級中等以上學校(以下簡稱學校)辦理職業準備教育，其專業課程得由學校與產業共同設計，建構合宜之課程安排，且兼顧學生職業倫理之培養與職涯發展、勞動及技術法規之認識，並定期更新課程設計。\n前項專業課程，學校得參採各中央目的事業主管機關所定之職能基準，進行規劃設計，提供學生就業所需之職能。\n各中央目的事業主管機關依產業創新條例所定職能基準應視社會發展及產業變遷情況，至少每二年檢討更新、整併調整，並於專屬資訊平臺公告。\n技專校院應依各中央目的事業主管機關所定之職能基準每年檢討課程內容。\n第  12  條\n學校得依科、系、所、學程之性質，開設相關實習課程。\n前項實習課程，如為校外實習時，其實施方式、實習場所、師資、學分採計、輔導及其他相關事項規定，除法令另有規定外，由學校定之。\n學校辦理校外實習課程，需由政府機關(構)、公營事業機構提供實習名額時，依下列方式辦理：\n政府機關(構)：由學校檢附校外實習課程計畫書，專案報學校主管機關會商相關政府機關(構)核定。\n公營事業機構：學校主管機關得會商公營事業主管機關轉洽所屬事業機構，提供實習之名額、對象及方式，並由學校主管機關依會商結果彙總公告校外實習課程計畫及實習技術生之招募訊息，經評選或甄選決定之。\n第  13  條\n主管機關應就學校辦理實習課程實施績效評量；其評量之內容及其他應遵行事項之辦法，由中央主管機關定之。\n辦理實習課程績優之學校、合作機構及其相關人員，主管機關得予獎勵。\n學校辦理校外實習之合作機構，長期提供學校實習名額，且實習學生畢業後經一定程序獲聘為該機構正式員工達中央主管機關所定一定比率者，主管機關應報經中央主管機關轉請中央目的事業主管機關予以獎勵。\n第  14  條\n學校得遴聘業界專家，協同教學。\n前項業界專家之認定、權利義務、管理、學校開設課程及其他應遵行事項之辦法，由中央主管機關定之。\n主管機關對有大量員工參與學校實務教學之企業，應予獎勵。\n第  15  條\n學校應鼓勵教師及學生參與技藝競賽或取得與所學及就業相關之證照，提升學生就業能力；辦理績效卓著之學校，主管機關得予獎勵。\n各中央目的事業主管機關應彙整所轄產業之證照，送中央主管機關定期公告。\n前二項證照之認定、第一項獎勵之條件、方式及其他應遵行事項之辦法，由中央主管機關會商中央目的事業主管機關定之。\\\n第  16  條\n技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程為培育特定產業基層技術人力，得專案擬訂計畫，報學校主管機關核定後辦理專班。\n前項專班不受高級中等教育法第六章、第七章關於學生資格、入學方式、就學區劃分、課程及學習評量規定之限制。\n第  17  條\n專科以上學校為辦理職業準備教育，得與產業合作開設專班。\n前項專班之授課師資、課程設計、辦理方式、學分採計、職場實習及輔導等事項，由專科以上學校擬訂實施計畫，報經學校主管機關核定後辦理。\n第  18 條\n技專校院應強化職能導向課程，並與技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程共同建立課程銜接機制，以利學生職能培養。\n第  19  條\n技專校院得優先招收具一定實務工作經驗之學生，並於招生相關章則增列實務工作經驗之採認及優惠規定，經招生委員會審議通過，報中央主管機關核定後實施。\n第  三  節  職業繼續教育\n第  20  條\n職業繼續教育，得由學校或職業訓練機構辦理。\n職業繼續教育依其辦理性質，由學校提供學位證書、畢業證書、學分證明或學習時數證明。\n職業繼續教育應以開設在職者或轉業者職場所需課程為主；其課程得參採各中央目的事業主管機關所定之職能基準，進行規劃設計，並定期更新。\n前項職業繼續教育之招生對象、課程設計、學習評量、資格條件、招生方式及其他應遵行事項之辦法，由中央主管機關定之，必要時，得會商中央勞動主管機關，不受高級中等教育法第三十五條至第四十條入學方式、第七章課程及學習評量，專科學校法第三十一條第二項招生方式及大學法第二十四條第一項後段招生方式之限制。\n第  21  條\n學校辦理職業繼續教育，得安排學生至職場接受教育及訓練課程。\n前項職場教育及訓練課程，應由學校及合作機構共同規劃、設計，並與學生簽訂職場教育訓練契約。\n前項職場教育訓練契約應載明教育訓練內容、學校、合作機構及學生之權利義務、學習評量、畢業條件等。\n前項契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n學生依第一項規定至職場接受教育及訓練課程時，學校主管機關得視需要，進行實地訪視；其訪視結果，得作為核定學校年度調整科、系、所、學程、班或經費獎勵之參考。\n第  22  條\n職業訓練機構辦理職業繼續教育時，應就授課師資、課程、辦理方式、學分採計等，擬訂職業繼續教育實施計畫，報主管機關核定後辦理。\n前項職業繼續教育課程之認可、學習成就之採認及其他應遵行事項之辦法，由中央主管機關會商中央勞動主管機關定之。\n第  23  條\n職業訓練機構所辦職業繼續教育，主管機關得委託學術團體或專業評鑑機構辦理評鑑或訪視，並公告其結果；其評鑑、訪視及其他應遵行事項之辦法，由主管機關定之。\n第  四  章  技職教育之師資\n第  24  條\n高級中等以下學校師資職前教育課程應將職業教育與訓練、生涯規劃相關科目列為必修學分。\n高級中等學校職業群科師資職前教育課程，應包括時數至少十八小時之業界實習，由師資培育大學安排之。\n第  25  條\n技職校院專業科目或技術科目之教師，應具備一年以上與任教領域相關之業界實務工作經驗。但有下列情形之一者，不在此限：\n本法中華民國一百零四年一月十四日施行前已在職之專任合格教師。\n中華民國一百零八年七月三十一日以前已取得技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程各該類科合格教師證書，應聘高級中等學校專業科目或技術科目之專任合格教師。\n前項與任教領域相關之業界實務工作經驗之認定標準，由中央主管機關定之。\n高級中等學校於聘任專業科目或技術科目之專任合格教師時，應優先聘任具備一年以上與任教領域相關之業界實務工作經驗者及第一項第一款者，並於有缺額時，始得聘任第一項第二款之未具一年以上工作經驗者。\n第  26  條\n技職校院專業科目或技術科目教師、專業及技術人員或專業及技術教師，每任教滿六年應至與技職校院合作機構或與任教領域有關之產業，進行與專業或技術有關之研習或研究，技專校院教師之研習或研究期間，應至少半年；技職校院相關研習或研究之辦法，由中央主管機關定之。\n前項研習或研究期間，技職校院應保留職務、支付薪給、給予公假，並事先簽訂契約書，約定研習或研究起迄年月日、服務義務、違反規定應償還費用之條件、核計基準及強制執行等事項。\n技職校院因教學或業務需要，主動薦送、指派或同意教師、專業及技術人員或專業及技術教師至與技職校院合作機構或與任教領域有關之產業研習或研究，其辦理方式不受前二項規定之限制。\n第一項產業研習或研究，由技職校院邀請合作機構或相關職業團體、產業，共同規劃辦理；必要時，得由主管機關協助之。\n技職校院推動專業科目或技術科目教師、專業及技術人員或專業及技術教師定期至產業研習或研究，辦理績效卓著者，主管機關得予獎勵。\n第  五  章  附則\n第  27  條\n私人或團體對於技職教育教學設備研發、捐贈學習或實驗設備、提供實習機會及對學生施以職業技能訓練著有貢獻者，中央主管機關得會商中央目的事業主管機關，予以獎勵。\n第  28  條\n本法施行細則，由中央主管機關定之。\n第  29  條\n本法自公布日施行。","history":"中華民國108年12月31日總統華總一義字第10800141691號令修正公布第 25、26 條條文，自公布日施行。","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">為建立技術及職業教育(以下簡稱技職教育)人才培育制度，培養國人正確職業觀念，落實技職教育務實致用特色，培育各行業人才，特制定本法。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本法之主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"doc-plain\">本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本法用詞，定義如下：<\/div>\n<div class=\"doc-plain\">職業試探教育：指提供學生對職業之認識、探索及體驗教育。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">職業準備教育：指提供學生進入職場所需之專業知識、技術及職業倫理涵養教育，及建立技職專業之榮譽感。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">職業繼續教育：指提供在職者或轉業者，再學習職場所需之專業技術或職業訓練教育。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技職校院：指技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程、專科學校、技術學院及科技大學。<\/div>\n<div class=\"doc-plain\">技專校院：指專科學校、技術學院及科技大學。<\/div>\n<div class=\"doc-plain\">職業訓練機構：指依職業訓練法登記或許可設立之職業訓練機構。<\/div>\n<div class=\"chapter-heading\">第  二  章  技職教育之規劃及管理<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">為培育符合國家經濟及產業發展需求之人才，制定宏觀技職教育政策綱領，行政院應定期邀集教育部、勞動部、經濟部、國家發展委員會及其他相關部會首長，召開技職教育審議會；其委員之遴聘、組織及運作辦法，由行政院定之。<\/div>\n<div class=\"doc-plain\">前項綱領，至少每二年應通盤檢討一次並公告之。<\/div>\n<div class=\"article-heading\">第  5 條<\/div>\n<div class=\"doc-plain\">中央主管機關應自行、委任或委託學校、法人、機關(構)或團體，進行技職教育相關資料之調查及統計。<\/div>\n<div class=\"doc-plain\">中央目的事業主管機關應彙整所轄產業人才需求相關資料，並提供產業人才需求調查及推估報告，送中央主管機關。<\/div>\n<div class=\"doc-plain\">中央主管機關應定期公告第一項技職教育統計資料與各級各類產業、職業發展及人力需求資訊。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關應每三年向中央主管機關提出技職教育報告，由中央主管機關據以訂定技職教育發展報告。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">主管機關應衡酌區域產業及個人就業需求，配合社會、經濟及技術發展，規劃所轄學校技職教育之實施。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)主管機關辦理技職教育具有成效時，中央主管機關得提撥經費予以獎勵；其獎勵之條件、方式及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">主管機關應邀請政府相關單位、學者專家、社會人士、企業界代表、學校代表、教師團體代表、產業(職業)公會或工會等單位之代表，組成技職教育諮詢會，提供技職教育相關事項之諮詢。<\/div>\n<div class=\"doc-plain\">前項技職教育諮詢會之組成，任一性別委員人數不得少於委員總人數之三分之一。<\/div>\n<div class=\"chapter-heading\">第  三  章  技職教育之實施<\/div>\n<div class=\"doc-plain\">第  一  節  職業試探教育<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">高級中等以下學校應開設或採融入式之職業試探、生涯輔導課程，提供學生職業試探機會，建立正確之職業價值觀。<\/div>\n<div class=\"doc-plain\">國民小學及國民中學之課程綱要，應納入職業認識與探索相關內容；高級中等學校及國民中學應安排學生至相關產業參訪。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">國民中學為實施職業試探教育，得與技職校院或職業訓練機構合作辦理技藝教育；其實施辦法，由中央主管機關會商中央勞動主管機關定之。<\/div>\n<div class=\"doc-plain\">國民中學與職業訓練機構間之權利義務關係，應以契約定之，並由學校報主管機關備查。<\/div>\n<div class=\"doc-plain\">前項契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。<\/div>\n<div class=\"doc-plain\">第  二  節  職業準備教育<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">高級中等以上學校(以下簡稱學校)辦理職業準備教育，其專業課程得由學校與產業共同設計，建構合宜之課程安排，且兼顧學生職業倫理之培養與職涯發展、勞動及技術法規之認識，並定期更新課程設計。<\/div>\n<div class=\"doc-plain\">前項專業課程，學校得參採各中央目的事業主管機關所定之職能基準，進行規劃設計，提供學生就業所需之職能。<\/div>\n<div class=\"doc-plain\">各中央目的事業主管機關依產業創新條例所定職能基準應視社會發展及產業變遷情況，至少每二年檢討更新、整併調整，並於專屬資訊平臺公告。<\/div>\n<div class=\"doc-plain\">技專校院應依各中央目的事業主管機關所定之職能基準每年檢討課程內容。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">學校得依科、系、所、學程之性質，開設相關實習課程。<\/div>\n<div class=\"doc-plain\">前項實習課程，如為校外實習時，其實施方式、實習場所、師資、學分採計、輔導及其他相關事項規定，除法令另有規定外，由學校定之。<\/div>\n<div class=\"doc-plain\">學校辦理校外實習課程，需由政府機關(構)、公營事業機構提供實習名額時，依下列方式辦理：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">政府機關(構)：由學校檢附校外實習課程計畫書，專案報學校主管機關會商相關政府機關(構)核定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">公營事業機構：學校主管機關得會商公營事業主管機關轉洽所屬事業機構，提供實習之名額、對象及方式，並由學校主管機關依會商結果彙總公告校外實習課程計畫及實習技術生之招募訊息，經評選或甄選決定之。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">主管機關應就學校辦理實習課程實施績效評量；其評量之內容及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">辦理實習課程績優之學校、合作機構及其相關人員，主管機關得予獎勵。<\/div>\n<div class=\"doc-plain\">學校辦理校外實習之合作機構，長期提供學校實習名額，且實習學生畢業後經一定程序獲聘為該機構正式員工達中央主管機關所定一定比率者，主管機關應報經中央主管機關轉請中央目的事業主管機關予以獎勵。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">學校得遴聘業界專家，協同教學。<\/div>\n<div class=\"doc-plain\">前項業界專家之認定、權利義務、管理、學校開設課程及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">主管機關對有大量員工參與學校實務教學之企業，應予獎勵。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">學校應鼓勵教師及學生參與技藝競賽或取得與所學及就業相關之證照，提升學生就業能力；辦理績效卓著之學校，主管機關得予獎勵。<\/div>\n<div class=\"doc-plain\">各中央目的事業主管機關應彙整所轄產業之證照，送中央主管機關定期公告。<\/div>\n<div class=\"doc-plain\">前二項證照之認定、第一項獎勵之條件、方式及其他應遵行事項之辦法，由中央主管機關會商中央目的事業主管機關定之。\\<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程為培育特定產業基層技術人力，得專案擬訂計畫，報學校主管機關核定後辦理專班。<\/div>\n<div class=\"doc-plain\">前項專班不受高級中等教育法第六章、第七章關於學生資格、入學方式、就學區劃分、課程及學習評量規定之限制。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">專科以上學校為辦理職業準備教育，得與產業合作開設專班。<\/div>\n<div class=\"doc-plain\">前項專班之授課師資、課程設計、辦理方式、學分採計、職場實習及輔導等事項，由專科以上學校擬訂實施計畫，報經學校主管機關核定後辦理。<\/div>\n<div class=\"article-heading\">第  18 條<\/div>\n<div class=\"doc-plain\">技專校院應強化職能導向課程，並與技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程共同建立課程銜接機制，以利學生職能培養。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">技專校院得優先招收具一定實務工作經驗之學生，並於招生相關章則增列實務工作經驗之採認及優惠規定，經招生委員會審議通過，報中央主管機關核定後實施。<\/div>\n<div class=\"doc-plain\">第  三  節  職業繼續教育<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">職業繼續教育，得由學校或職業訓練機構辦理。<\/div>\n<div class=\"doc-plain\">職業繼續教育依其辦理性質，由學校提供學位證書、畢業證書、學分證明或學習時數證明。<\/div>\n<div class=\"doc-plain\">職業繼續教育應以開設在職者或轉業者職場所需課程為主；其課程得參採各中央目的事業主管機關所定之職能基準，進行規劃設計，並定期更新。<\/div>\n<div class=\"doc-plain\">前項職業繼續教育之招生對象、課程設計、學習評量、資格條件、招生方式及其他應遵行事項之辦法，由中央主管機關定之，必要時，得會商中央勞動主管機關，不受高級中等教育法第三十五條至第四十條入學方式、第七章課程及學習評量，專科學校法第三十一條第二項招生方式及大學法第二十四條第一項後段招生方式之限制。<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，得安排學生至職場接受教育及訓練課程。<\/div>\n<div class=\"doc-plain\">前項職場教育及訓練課程，應由學校及合作機構共同規劃、設計，並與學生簽訂職場教育訓練契約。<\/div>\n<div class=\"doc-plain\">前項職場教育訓練契約應載明教育訓練內容、學校、合作機構及學生之權利義務、學習評量、畢業條件等。<\/div>\n<div class=\"doc-plain\">前項契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。<\/div>\n<div class=\"doc-plain\">學生依第一項規定至職場接受教育及訓練課程時，學校主管機關得視需要，進行實地訪視；其訪視結果，得作為核定學校年度調整科、系、所、學程、班或經費獎勵之參考。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">職業訓練機構辦理職業繼續教育時，應就授課師資、課程、辦理方式、學分採計等，擬訂職業繼續教育實施計畫，報主管機關核定後辦理。<\/div>\n<div class=\"doc-plain\">前項職業繼續教育課程之認可、學習成就之採認及其他應遵行事項之辦法，由中央主管機關會商中央勞動主管機關定之。<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">職業訓練機構所辦職業繼續教育，主管機關得委託學術團體或專業評鑑機構辦理評鑑或訪視，並公告其結果；其評鑑、訪視及其他應遵行事項之辦法，由主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  四  章  技職教育之師資<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">高級中等以下學校師資職前教育課程應將職業教育與訓練、生涯規劃相關科目列為必修學分。<\/div>\n<div class=\"doc-plain\">高級中等學校職業群科師資職前教育課程，應包括時數至少十八小時之業界實習，由師資培育大學安排之。<\/div>\n<div class=\"article-heading\">第  25  條 <\/div>\n<div class=\"doc-plain\">技職校院專業科目或技術科目之教師，應具備一年以上與任教領域相關之業界實務工作經驗。但有下列情形之一者，不在此限：<\/div>\n<div class=\"doc-plain\">本法中華民國一百零四年一月十四日施行前已在職之專任合格教師。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">中華民國一百零八年七月三十一日以前已取得技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程各該類科合格教師證書，應聘高級中等學校專業科目或技術科目之專任合格教師。<\/div>\n<div class=\"doc-plain\">前項與任教領域相關之業界實務工作經驗之認定標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">高級中等學校於聘任專業科目或技術科目之專任合格教師時，應優先聘任具備一年以上與任教領域相關之業界實務工作經驗者及第一項第一款者，並於有缺額時，始得聘任第一項第二款之未具一年以上工作經驗者。<\/div>\n<div class=\"article-heading\">第  26  條 <\/div>\n<div class=\"doc-plain\">技職校院專業科目或技術科目教師、專業及技術人員或專業及技術教師，每任教滿六年應至與技職校院合作機構或與任教領域有關之產業，進行與專業或技術有關之研習或研究，技專校院教師之研習或研究期間，應至少半年；技職校院相關研習或研究之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">前項研習或研究期間，技職校院應保留職務、支付薪給、給予公假，並事先簽訂契約書，約定研習或研究起迄年月日、服務義務、違反規定應償還費用之條件、核計基準及強制執行等事項。<\/div>\n<div class=\"doc-plain\">技職校院因教學或業務需要，主動薦送、指派或同意教師、專業及技術人員或專業及技術教師至與技職校院合作機構或與任教領域有關之產業研習或研究，其辦理方式不受前二項規定之限制。<\/div>\n<div class=\"doc-plain\">第一項產業研習或研究，由技職校院邀請合作機構或相關職業團體、產業，共同規劃辦理；必要時，得由主管機關協助之。<\/div>\n<div class=\"doc-plain\">技職校院推動專業科目或技術科目教師、專業及技術人員或專業及技術教師定期至產業研習或研究，辦理績效卓著者，主管機關得予獎勵。<\/div>\n<div class=\"chapter-heading\">第  五  章  附則<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">私人或團體對於技職教育教學設備研發、捐贈學習或實驗設備、提供實習機會及對學生施以職業技能訓練著有貢獻者，中央主管機關得會商中央目的事業主管機關，予以獎勵。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">本法施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">本法自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">中華民國108年12月31日總統華總一義字第10800141691號令修正公布第 25、26 條條文，自公布日施行。<\/div>"},{"title":"高級中等學校建教合作實施及建教生權益保障法","content":"第  一  章  總則\n第  1  條\n為健全建教合作制度，保障建教生權益，提升職業教育品質，特制定本法。\n第  2  條\n本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。\n第  3  條\n本法用詞，定義如下：\n建教合作：指職業學校、附設職業類科或專門學程之高級中學及特殊教育學校(以下簡稱學校)，與建教合作機構合作，以培育建教生職業技能為目標之機制。\n建教生：指於學校就讀，參加建教合作計畫，在一定期間內於建教合作機構接受職業訓練，領取一定生活津貼之在學學生。\n建教合作機構：指與學校簽訂建教合作契約，傳授建教生職業技能之事業機構。\n建教合作契約：指學校與建教合作機構所簽訂，由學校安排建教生於一定期間前往建教合作機構學習職業技能之契約。\n建教生訓練契約：指建教生與建教合作機構所簽訂，由建教生於一定期間內，在建教合作機構學習職業技能，受建教合作機構指導，並領取一定生活津貼之契約。\n第  4  條\n中央主管機關應會同勞工主管機關每年針對本法所定建教生權益保障事項進行調查，並公布調查報告。\n前項調查，必要時得委託學術團體或專業機構辦理。\n第一項調查結果應為各級主管機關作為訂定建教合作政策及選定建教合作機構行業類別之參考。\n第  二  章  建教合作制度\n第  5  條\n學校辦理建教合作，應依下列方式為之：\n輪調式：學校與建教合作機構以二班為單位實施輪調，一班在校上課，另一班在建教合作機構接受職業技能訓練。\n階梯式：學校之一年級及二年級學生在校接受基礎及專業理論教育，三年級在建教合作機構接受職業技能訓練。\n實習式：學校依各年級專業課程需求，在不調整課程架構之前提下，使學生於寒暑假或學期中至建教合作機構接受職業技能訓練。\n其他經中央主管機關核定之方式：由學校研擬辦理方式，經直轄市、縣(市)主管機關核轉中央主管機關核定之方式。\n第 6 條\n建教合作機構參與建教合作，應符合下列條件：\n經依法設立或登記。\n具相關職業科別之訓練能力、指導人力及健全之設備。\n訓練場所符合勞工安全衛生相關法令之規定。\n無第三十二條第一項或第三十五條所定不得參與建教合作之情事。\n最近二年無違反勞動法規。\n最近二年依勞動基準法第十一條終止勞動契約人數未超過員工總人數百分之十。\n非從事派遣業務之事業單位。\n前項第三款、第五款至第七款應備之證明文件、範圍、認定及其他應遵行事項之辦法，由中央主管機關會同中央勞工主管機關定之。\n第  7  條\n學校辦理建教合作，應符合下列條件：\n最近一次學校評鑑達四等以上。\n最近三年建教合作考核結果均達四等以上，且最近一年考核結果達三等以上。\n建教合作班每兩班應置該科專任教師五人。\n第  8  條\n學校辦理建教合作，應檢具下列文件及資料，向主管機關申請核准：\n建教合作計畫書。\n採計學分及成績考查基準。\n建教生職業技能訓練計畫。\n建教生輔導計畫。\n建教合作契約草案。\n建教生訓練契約草案。\n建教合作機構評估報告表。\n前項第四款之建教生輔導計畫應包括生活輔導與訪視計畫。\n第  9  條\n為審議前條申請案，主管機關應遴聘學者專家、社會公正人士、業界代表、工會團體代表、教師組織代表、青少年團體代表、學校代表、家長團體代表、主管機關代表及勞工主管機關代表十五人至二十五人組成建教合作審議小組審議之；並得視業務需要組成專家小組，至建教合作機構辦理現場評估。\n前項委員，應包括勞動專長之學者專家至少一人，且任一性別委員人數，不得少於委員總數三分之一。\n第一項建教合作審議小組、專家小組委員之組成與運作、審議程序、建教合作機構評估之項目與基準、成果及其他應遵行事項之辦法，由中央主管機關定之。\n中央主管機關應定期檢討建教合作機構行業類別。\n第  10  條\n建教合作課程，應依中央主管機關有關課程之規定實施。\n建教生於建教合作機構接受職業技能訓練，經學校考查合格者，得採計為職業技能訓練學分；其採計之學分數，不得超過應修畢業學分數之六分之一。但情形特殊，經報主管機關核准者，得採計至應修畢業學分數三十學分。\n前項採計學分之認定基準、計算方式及其他相關事項之辦法，由中央主管機關定之。\n建教合作課程，除第二項採計為職業技能訓練學分之課程外，其餘課程應於學校實施。\n第  11  條\n學校於建教生進入建教合作機構接受職業技能訓練前，應完成下列事項：\n提供建教生基礎或職前訓練，以取得相關職業科別之基本技能、職業安全衛生、職業倫理道德及勞動權益等相關知能。\n邀請建教合作機構共同舉辦說明會，向建教生與其家長說明受訓之內容及建教生受訓期間之權利義務。\n前項第一款基礎或職前訓練之最低時數，由中央主管機關依建教合作辦理方式公告之；其中勞動權益課程最低時數，應會商中央勞工主管機關後辦理。\n中央主管機關應會商中央勞工主管機關編定勞動人權及勞動權益手冊，提供學校實施基礎或職前訓練；該手冊之內容，應每年檢討修訂。\n辦理建教僑生專班之學校，應於第一項第一款基礎或職前訓練，規劃基本華語文輔導課程。\n第  12  條\n學校辦理建教合作，不得有下列情形：\n將建教生送至未經主管機關核准之建教合作機構接受職業技能訓練。\n無正當理由自建教合作機構召回建教生。\n在學校教學實施期間，將建教生送至建教合作機構接受職業技能訓練。\n因建教生依本法提出申訴或協調，而給予不利之差別待遇。\n第  13  條\n學校應指派教師每二星期至少一次不預告訪視建教合作機構，瞭解建教生接受職業技能訓練及建教合作機構依建教合作契約、建教生訓練契約執行之情形，並輔導建教生獲得良好訓練。\n前項教師於訪視及輔導建教生時，發現建教合作機構有未依職業技能訓練計畫實施、違反建教合作契約或建教生訓練契約等缺失，應立即向學校提出報告。\n學校接獲前項教師之報告後，應立即要求建教合作機構改進，並為適當之追蹤處理及詳予記錄，供主管機關查核。\n第一項學校指派之教師，應定期接受勞動人權、勞動權益及職業安全衛生之相關研習或進修課程。\n第  14  條\n建教合作機構招收建教生與勞動基準法所定技術生、養成工、見習生及其他與技術生性質相類之人，合計不得超過其所僱用勞工總數四分之一；且個別建教合作機構每期輪調人數不得低於二人。\n前項僱用勞工總數六人以上未滿八人者，以八人計。\n前二項僱用勞工總數之計算，不包括依就業服務法第四十六條第一項第十款、第十一款僱用之外國人。\n第  15  條\n學校與建教合作機構間，不得有支付任何名義之報酬、費用、禮物、獎金、回饋金或佣金予對方之約定。\n第  三  章  建教合作契約及建教生訓練契約\n第  16  條\n學校經主管機關核准辦理建教合作後，應與建教合作機構簽訂建教合作契約，並將契約報主管機關備查；其契約內容應包括下列事項：\n建教合作計畫名稱。\n建教合作計畫經費及時程。\n建教生職業技能訓練計畫。\n建教合作機構對建教生之技能、生活及生涯輔導。\n建教合作協調會之設置及運作。\n學校指派學生至建教合作機構受訓之人數及期間。\n採計學分及成績考查基準。\n學校召回建教生之事由及程序。\n建教合作機構應接受學校與訪視教師要求該機構改進之處理程序及方式。\n合宜之膳宿、交通、生活津貼與其調整、給付方式及計算基準。\n前項第三款建教生職業技能訓練計畫，應包括訓練課程、項目、方式、期間、每日訓練時間、休息時間及例假。\n第  17  條\n建教合作機構應依前條第一項建教合作契約之內容，與建教生簽訂書面之建教生訓練契約，並將契約報主管機關備查；其契約內容應包括下列事項：\n建教生職業技能訓練計畫。\n勞工保險及團體保險。\n訓練證明之發給。\n終止契約之事由及程序。\n膳宿、交通、生活津貼與其調整、給付方式及計算基準。\n建教生權益之申訴或協調處理。\n學校應協助建教生與建教合作機構簽訂建教生訓練契約。\n建教生為未成年人者，建教生訓練契約之簽訂，應得其法定代理人允許。\n第一項建教生訓練契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n第  18  條\n建教合作機構不得有下列行為：\n要求建教生應負擔任何訓練費用。\n要求建教生應繳納保證金。\n訂定不符第十六條第一項第十款規定之膳宿、交通、生活津貼與其調整、給付方式及計算基準。\n排除建教生請求損害賠償之權利或限制其金額。\n超時訓練建教生或向其推銷產品。\n要求建教生提前終止契約應賠償違約金。\n於建教生違反工作規則時扣除生活津貼。\n限制建教生契約終止後之就業自由。\n其他有關不當損及建教生權益之行為。\n建教生訓練契約有前項各款約定者，其約定無效。\n第  19  條\n建教生於建教合作機構受訓時，發生可歸責於建教生之終止契約事由者，建教合作機構應自知悉之日起算三日內，協調學校加強輔導該建教生；建教合作機構屆期未處理者，不得再以該項事由終止建教生訓練契約。\n建教合作機構依前項規定協調學校加強輔導建教生，屆二星期仍未獲改善者，建教合作機構得終止建教生訓練契約，並報主管機關備查。\n第  20  條\n建教生因建教合作事項發生爭議，得向學校申請協調，並得向學校主管機關申訴。\n學校為辦理前項協調，由學校邀請建教合作機構代表與該案建教生及其家長、專家學者共同參與，並應請主管機關代表列席，於開會時互推一人擔任會議主席；協調會議應作成紀錄，並由學校報主管機關備查。建教合作機構應依協調會決議確實執行。\n第一項之協調，不影響建教生或建教合作機構之其他權利救濟。\n學校主管機關為審議第一項申訴事項，應遴聘具備教育、心理輔導、法律、勞工等專長之學者專家七人至十五人，組成建教生申訴審議會，其中任一性別委員應占委員總數三分之一以上；其組織、運作及其他相關事項之辦法，由各該主管機關定之。\n第  四  章  建教生權益保障\n第  21  條\n為保障建教生權益，建教合作機構應履行下列義務：\n依建教生訓練契約，提供良好之訓練環境，安排建教生至相關部門接受職業技能訓練，並培養優良之工作態度、安全認知及職業道德。\n前款訓練活動應與建教生所學職業科別相關，並注意建教生之身心健康。\n於建教生受訓期間，應依建教生職業技能訓練計畫，指派專人負責建教生之職業技能訓練及生活輔導。\n安排職業技能訓練時，不得影響建教生到校上課或至建教合作機構以外場所進行觀摩受訓之權益。\n應考量建教生之學習表現及年資，逐年增加生活津貼之金額。\n準用勞工保險條例之規定，為建教生辦理參加勞工保險。\n應置備建教生簽到簿或出勤卡，逐日記載建教生訓練情形。此項簿卡應保存一年。\n建教生於訓練活動期間從事之作業，屬勞工健康保護規則所定應實施特殊體格檢查或健康檢查項目者，應準用職業安全衛生法規定為建教生施行體格檢查或健康檢查。\n建教合作機構為建教生辦理參加勞工保險，其保險效力之開始及停止、月投保薪資、投保薪資之調整、保險費負擔、保險費繳納、保險費寬限期與滯納金之徵收及處理、保險給付之計算與發給及其他有關保險事項，準用勞工保險條例及其相關規定辦理。\n建教合作機構就建教生因從事訓練活動不法侵害他人權利，負損害賠償責任。但損害係因建教生故意或重大過失所致者，不在此限。\n第  22  條\n建教合作機構應依建教生訓練契約，給付建教生生活津貼，並提供其生活津貼明細表。\n前項生活津貼，屬建教生參與職業訓練而給與之補助費，非屬薪資或勞務所得，免納綜合所得稅；其金額，不得低於勞動基準法所定基本工資，並應以法定通用貨幣給付之。\n生活津貼應按月全額直接給付建教生。但法律另有規定得扣除相關費用者，不在此限。\n建教合作機構不得預扣生活津貼，作為違約金或賠償費用。\n第  23  條\n建教合作機構與建教生簽訂建教生訓練契約前，應繳納一定金額之保證金予學校，由學校專戶存儲，於建教生向建教合作機構請求生活津貼或第二十四條第九項所定賠償金未獲給付時，由該保證金支付之。學校應於建教生訓練契約終止後，將賸餘之保證金發還建教合作機構。\n前項保證金之金額，由中央主管機關定之。\n第  24  條\n建教生每日訓練時間不得超過八小時，每星期受訓總時數不得超過四十小時，且不得於午後八時至翌晨六時之時間內接受訓練。\n建教生繼續受訓四小時，至少應有三十分鐘之休息。\n建教生受訓期間，每七日至少應有二日之休息，作為例假。\n建教生受訓期間，遇有勞動基準法規定應放假之日，均應依該法及其相關法令之規定休息。\n女性建教生因生理日致受訓有困難者，每月得申請生理假一日，建教合作機構不得剋扣其生活津貼，學校不得列入其學業成績評量之事項。\n因建教合作機構經營型態、工作特性、季節、地域或行業類別需要，並符合下列各款條件者，建教合作機構得向主管機關申請核准，於建教生訓練契約中與建教生另行約定訓練及休息時間之起迄點：\n建教生年滿十六歲。\n建教合作機構提供必要之安全衛生設施。\n無大眾運輸工具可資運用時，建教合作機構提供交通工具或安排宿舍。\n建教合作機構與建教生依前項規定另行約定訓練時間者，仍不得於午後十時至翌晨六時之時間內接受訓練。\n建教生每日訓練時間之起訖，包括訓練及中間休息時間，合計不得超過十二小時。\n建教合作機構違反第一項至第五項、第七項或前項規定，應就違反規定之時數，發給建教生該時數換算之生活津貼數額二倍之金額，作為賠償金；違反規定之時數未滿一小時者，應以一小時計算。\n第  25  條\n建教生從事訓練活動時發生災害而致死亡、失能、傷害或疾病時，建教合作機構應準用勞動基準法第七章職業災害補償規定予以補償。\n前項補償金額所採計算基準，不得低於勞動基準法所定基本工資之數額。\n第一項建教生未加入勞工保險者，準用職業災害勞工保護法有關未加入勞工保險之勞工規定予以補助。\n學校應主動協助建教生依第一項或前項規定請求補償或申請補助。\n第  26  條\n建教合作機構於建教生受訓期間，不得因其種族、階級、語言、思想、宗教、黨派、籍貫、出生地、年齡、婚姻、容貌、五官或身心障礙之因素，給予不利之差別待遇。\n建教合作機構應與學校會商提供身心障礙建教生個別化協助措施。\n建教合作機構不得因建教生依本法提出申訴或協調或依勞動事件法聲請調解、提起訴訟，而給予不利之差別待遇。\n第一項差別待遇之認定，準用就業服務法及其相關法規有關就業歧視認定之規定。\n第  27  條\n建教合作機構於建教生受訓期間，不得因其性別或性傾向而有差別待遇，並應防治性騷擾行為之發生；於知悉有性騷擾情形時，應採取立即有效之糾正及補救措施。\n建教生於建教合作機構受訓期間遭性別歧視、性傾向歧視或性騷擾時，其申訴之提出、認定及建教合作機構之賠償責任，準用性別工作平等法及其相關法規之規定。\n第  28  條\n建教生訓練契約期間屆滿或因其他事由而終止時，建教合作機構應依第十七條第一項第三款規定，發給書面之訓練證明。\n前項訓練證明，應包括建教生之訓練職類、訓練期間及訓練時數。\n建教生取得訓練證明且表現優良者，建教合作機構得優先僱用。\n第  五  章  建教合作之監督\n第  29  條\n各級主管機關應會同地方勞工主管機關對學校及建教合作機構辦理建教合作進行考核；其考核之項目、方式、基準、獎懲及其他應遵行事項之辦法，由中央主管機關定之。\n除前項考核外，勞工主管機關得辦理建教合作機構勞動檢查。\n第  30  條\n各級主管機關依前條規定考核時，發現建教合作機構有違反建築、消防、勞工安全衛生、營業衛生或其他事項者，應通知目的事業主管機關依相關法規規定處理。\n建教合作機構依第二十八條第三項規定優先僱用表現優良之建教生者，主管機關得列入其以後年度參與建教合作之參考。\n第  六  章  罰則\n第  31  條\n學校違反第十二條第一款、第三款或第四款規定者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰；其情節重大者，得為減少下學年度建教合作之招收人數、停止部分建教合作班級之招生或停辦建教合作二年之處分。\n第  32  條\n建教合作機構有下列情形之一者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰；經處罰二次仍未改善者，三年內不得參與建教合作，並公布其名稱及負責人姓名：\n違反第十四條規定，超收建教生或不符合每期最低輪調人數。\n有第十八條第一項所定行為。\n未履行第二十一條第一項第一款至第三款、第五款、第七款或第八款規定保障建教生權益之義務。\n違反第二十二條規定，未依約給付建教生生活津貼並提供明細表、給付生活津貼低於勞動基準法所定基本工資、未以法定通用貨幣給付生活津貼、未按月全額直接給付生活津貼或預扣生活津貼。\n未依第二十三條規定，繳納保證金。\n未依第二十四條第一項至第八項規定，安排建教生之受訓及休息時間，或未依第九項規定，給予建教生賠償。\n未依第二十五條第一項、第二項規定，給予建教生補償。\n違反第二十六條第一項、第三項規定，給予建教生不利之差別待遇，或未依第二項規定提供個別化協助措施。\n違反第二十七條第一項規定，給予建教生差別待遇、未防治性騷擾行為之發生或未採取立即有效之糾正及補救措施。\n建教合作機構違反第二十一條第一項第六款或第二項規定，由勞工保險主管機關依勞工保險條例第六章規定處罰。但建教合作機構違反第二十一條第一項第六款規定，未為建教生辦理參加勞工保險，而有第二十五條第三項規定情事者，由中央勞工主管機關依職業災害勞工保護法之規定處罰。\n第  33  條\n學校與建教合作機構違反第十五條規定，約定支付任何名義之報酬或回饋予對方者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰。\n學校與建教合作機構之代表人、管理人或其他有代表權人，因執行職務致學校與建教合作機構依前項規定受處罰時，應並受同一額度罰鍰之處罰。\n第  34  條\n學校有下列情形之一者，應令其限期改善；屆期未改善者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰；其情節重大者，得為減少下學年度建教合作之招收人數、停止部分建教合作班級之招生或停辦建教合作一年至二年之處分：\n未依第十條第二項規定採計職業技能訓練學分之學分數。\n未依第十一條第一項第一款規定或第二項所定時數，於建教生進入建教合作機構接受職業技能訓練前，提供建教生基礎或職前訓練。\n未依第十一條第一項第二款規定，於建教生進入建教合作機構接受職業技能訓練前，邀請建教合作機構共同舉辦說明會。\n違反第十二條第二款規定，無正當理由自建教合作機構召回建教生。\n未依第十三條第一項或第三項規定，指派教師訪視建教合作機構、要求建教合作機構改進、為適當之追蹤處理及詳予記錄。\n未依第二十條第二項規定，召開協調會及作成會議紀錄報主管機關備查。\n未依第二十五條第四項規定，主動協助建教生請求補償或申請補助。\n第  35  條\n建教合作機構有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰；經處罰二次仍未改善者，三年內不得參與建教合作，並公布其名稱及負責人姓名：\n未依第十七條第一項規定，將建教生訓練契約報主管機關備查。\n未依第十九條第一項規定，於知悉發生可歸責於建教生之終止契約事由之日起算三日內，協調學校加強輔導該建教生，而直接以該事由終止建教生訓練契約。\n未依第二十條第二項規定，依協調會決議確實執行。\n違反第二十八條第一項或第二項規定，未發給建教生書面訓練證明或未於訓練證明中載明建教生之訓練職類、訓練期間及訓練時數。\n第 36 條\n建教合作機構違反第二十一條第一項第四款規定者，處新臺幣一萬元以上五萬元以下罰鍰。\n第  七  章  附則\n第  37  條\n本法施行後，勞動基準法第八章有關建教合作班之學生準用技術生之相關規定，於建教生不再適用。\n第  38  條\n本法施行前已核准之建教合作案，除適用第二十三條規定外，依原規定辦理。\n第  39  條\n本法自公布日施行。","history":"1.中華民國102年1月2日總統華總一義字第10100290761號令制定公布全文39條；並自公布日施行。\n2.中華民國110年6月16日總統華總一義字第1100005405號令修正公布第 4、9、11、13、14、21～26、29、32 條條文。","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">為健全建教合作制度，保障建教生權益，提升職業教育品質，特制定本法。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"doc-plain\">本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本法用詞，定義如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作：指職業學校、附設職業類科或專門學程之高級中學及特殊教育學校(以下簡稱學校)，與建教合作機構合作，以培育建教生職業技能為目標之機制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生：指於學校就讀，參加建教合作計畫，在一定期間內於建教合作機構接受職業訓練，領取一定生活津貼之在學學生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作機構：指與學校簽訂建教合作契約，傳授建教生職業技能之事業機構。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作契約：指學校與建教合作機構所簽訂，由學校安排建教生於一定期間前往建教合作機構學習職業技能之契約。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生訓練契約：指建教生與建教合作機構所簽訂，由建教生於一定期間內，在建教合作機構學習職業技能，受建教合作機構指導，並領取一定生活津貼之契約。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">中央主管機關應會同勞工主管機關每年針對本法所定建教生權益保障事項進行調查，並公布調查報告。<\/div>\n<div class=\"doc-plain\">前項調查，必要時得委託學術團體或專業機構辦理。<\/div>\n<div class=\"doc-plain\">第一項調查結果應為各級主管機關作為訂定建教合作政策及選定建教合作機構行業類別之參考。<\/div>\n<div class=\"chapter-heading\">第  二  章  建教合作制度<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">學校辦理建教合作，應依下列方式為之：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">輪調式：學校與建教合作機構以二班為單位實施輪調，一班在校上課，另一班在建教合作機構接受職業技能訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">階梯式：學校之一年級及二年級學生在校接受基礎及專業理論教育，三年級在建教合作機構接受職業技能訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習式：學校依各年級專業課程需求，在不調整課程架構之前提下，使學生於寒暑假或學期中至建教合作機構接受職業技能訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他經中央主管機關核定之方式：由學校研擬辦理方式，經直轄市、縣(市)主管機關核轉中央主管機關核定之方式。<\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain\">建教合作機構參與建教合作，應符合下列條件：<\/div>\n<div class=\"doc-plain\">經依法設立或登記。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具相關職業科別之訓練能力、指導人力及健全之設備。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">訓練場所符合勞工安全衛生相關法令之規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">無第三十二條第一項或第三十五條所定不得參與建教合作之情事。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">最近二年無違反勞動法規。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">最近二年依勞動基準法第十一條終止勞動契約人數未超過員工總人數百分之十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">非從事派遣業務之事業單位。<\/div>\n<div class=\"doc-plain\">前項第三款、第五款至第七款應備之證明文件、範圍、認定及其他應遵行事項之辦法，由中央主管機關會同中央勞工主管機關定之。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">學校辦理建教合作，應符合下列條件：<\/div>\n<div class=\"doc-plain\">最近一次學校評鑑達四等以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">最近三年建教合作考核結果均達四等以上，且最近一年考核結果達三等以上。<\/div>\n<div class=\"doc-plain\">建教合作班每兩班應置該科專任教師五人。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">學校辦理建教合作，應檢具下列文件及資料，向主管機關申請核准：<\/div>\n<div class=\"doc-plain\">建教合作計畫書。<\/div>\n<div class=\"doc-plain\">採計學分及成績考查基準。<\/div>\n<div class=\"doc-plain\">建教生職業技能訓練計畫。<\/div>\n<div class=\"doc-plain\">建教生輔導計畫。<\/div>\n<div class=\"doc-plain\">建教合作契約草案。<\/div>\n<div class=\"doc-plain\">建教生訓練契約草案。<\/div>\n<div class=\"doc-plain\">建教合作機構評估報告表。<\/div>\n<div class=\"doc-plain\">前項第四款之建教生輔導計畫應包括生活輔導與訪視計畫。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">為審議前條申請案，主管機關應遴聘學者專家、社會公正人士、業界代表、工會團體代表、教師組織代表、青少年團體代表、學校代表、家長團體代表、主管機關代表及勞工主管機關代表十五人至二十五人組成建教合作審議小組審議之；並得視業務需要組成專家小組，至建教合作機構辦理現場評估。<\/div>\n<div class=\"doc-plain\">前項委員，應包括勞動專長之學者專家至少一人，且任一性別委員人數，不得少於委員總數三分之一。<\/div>\n<div class=\"doc-plain\">第一項建教合作審議小組、專家小組委員之組成與運作、審議程序、建教合作機構評估之項目與基準、成果及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">中央主管機關應定期檢討建教合作機構行業類別。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">建教合作課程，應依中央主管機關有關課程之規定實施。<\/div>\n<div class=\"doc-plain\">建教生於建教合作機構接受職業技能訓練，經學校考查合格者，得採計為職業技能訓練學分；其採計之學分數，不得超過應修畢業學分數之六分之一。但情形特殊，經報主管機關核准者，得採計至應修畢業學分數三十學分。<\/div>\n<div class=\"doc-plain\">前項採計學分之認定基準、計算方式及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">建教合作課程，除第二項採計為職業技能訓練學分之課程外，其餘課程應於學校實施。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">學校於建教生進入建教合作機構接受職業技能訓練前，應完成下列事項：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">提供建教生基礎或職前訓練，以取得相關職業科別之基本技能、職業安全衛生、職業倫理道德及勞動權益等相關知能。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">邀請建教合作機構共同舉辦說明會，向建教生與其家長說明受訓之內容及建教生受訓期間之權利義務。<\/div>\n<div class=\"doc-plain\">前項第一款基礎或職前訓練之最低時數，由中央主管機關依建教合作辦理方式公告之；其中勞動權益課程最低時數，應會商中央勞工主管機關後辦理。<\/div>\n<div class=\"doc-plain\">中央主管機關應會商中央勞工主管機關編定勞動人權及勞動權益手冊，提供學校實施基礎或職前訓練；該手冊之內容，應每年檢討修訂。<\/div>\n<div class=\"doc-plain\">辦理建教僑生專班之學校，應於第一項第一款基礎或職前訓練，規劃基本華語文輔導課程。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">學校辦理建教合作，不得有下列情形：<\/div>\n<div class=\"doc-plain\">將建教生送至未經主管機關核准之建教合作機構接受職業技能訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">無正當理由自建教合作機構召回建教生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">在學校教學實施期間，將建教生送至建教合作機構接受職業技能訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">因建教生依本法提出申訴或協調，而給予不利之差別待遇。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">學校應指派教師每二星期至少一次不預告訪視建教合作機構，瞭解建教生接受職業技能訓練及建教合作機構依建教合作契約、建教生訓練契約執行之情形，並輔導建教生獲得良好訓練。<\/div>\n<div class=\"doc-plain\">前項教師於訪視及輔導建教生時，發現建教合作機構有未依職業技能訓練計畫實施、違反建教合作契約或建教生訓練契約等缺失，應立即向學校提出報告。<\/div>\n<div class=\"doc-plain\">學校接獲前項教師之報告後，應立即要求建教合作機構改進，並為適當之追蹤處理及詳予記錄，供主管機關查核。<\/div>\n<div class=\"doc-plain\">第一項學校指派之教師，應定期接受勞動人權、勞動權益及職業安全衛生之相關研習或進修課程。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">建教合作機構招收建教生與勞動基準法所定技術生、養成工、見習生及其他與技術生性質相類之人，合計不得超過其所僱用勞工總數四分之一；且個別建教合作機構每期輪調人數不得低於二人。<\/div>\n<div class=\"doc-plain\">前項僱用勞工總數六人以上未滿八人者，以八人計。<\/div>\n<div class=\"doc-plain\">前二項僱用勞工總數之計算，不包括依就業服務法第四十六條第一項第十款、第十一款僱用之外國人。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">學校與建教合作機構間，不得有支付任何名義之報酬、費用、禮物、獎金、回饋金或佣金予對方之約定。<\/div>\n<div class=\"chapter-heading\">第  三  章  建教合作契約及建教生訓練契約<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">學校經主管機關核准辦理建教合作後，應與建教合作機構簽訂建教合作契約，並將契約報主管機關備查；其契約內容應包括下列事項：<\/div>\n<div class=\"doc-plain\">建教合作計畫名稱。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作計畫經費及時程。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生職業技能訓練計畫。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作機構對建教生之技能、生活及生涯輔導。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作協調會之設置及運作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校指派學生至建教合作機構受訓之人數及期間。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">採計學分及成績考查基準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校召回建教生之事由及程序。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教合作機構應接受學校與訪視教師要求該機構改進之處理程序及方式。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">合宜之膳宿、交通、生活津貼與其調整、給付方式及計算基準。<\/div>\n<div class=\"doc-plain\">前項第三款建教生職業技能訓練計畫，應包括訓練課程、項目、方式、期間、每日訓練時間、休息時間及例假。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">建教合作機構應依前條第一項建教合作契約之內容，與建教生簽訂書面之建教生訓練契約，並將契約報主管機關備查；其契約內容應包括下列事項：<\/div>\n<div class=\"doc-plain\">建教生職業技能訓練計畫。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">勞工保險及團體保險。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">訓練證明之發給。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">終止契約之事由及程序。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">膳宿、交通、生活津貼與其調整、給付方式及計算基準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生權益之申訴或協調處理。<\/div>\n<div class=\"doc-plain\">學校應協助建教生與建教合作機構簽訂建教生訓練契約。<\/div>\n<div class=\"doc-plain\">建教生為未成年人者，建教生訓練契約之簽訂，應得其法定代理人允許。<\/div>\n<div class=\"doc-plain\">第一項建教生訓練契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">建教合作機構不得有下列行為：<\/div>\n<div class=\"doc-plain\">要求建教生應負擔任何訓練費用。<\/div>\n<div class=\"doc-plain\">要求建教生應繳納保證金。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">訂定不符第十六條第一項第十款規定之膳宿、交通、生活津貼與其調整、給付方式及計算基準。<\/div>\n<div class=\"doc-plain\">排除建教生請求損害賠償之權利或限制其金額。<\/div>\n<div class=\"doc-plain\">超時訓練建教生或向其推銷產品。<\/div>\n<div class=\"doc-plain\">要求建教生提前終止契約應賠償違約金。<\/div>\n<div class=\"doc-plain\">於建教生違反工作規則時扣除生活津貼。<\/div>\n<div class=\"doc-plain\">限制建教生契約終止後之就業自由。<\/div>\n<div class=\"doc-plain\">其他有關不當損及建教生權益之行為。<\/div>\n<div class=\"doc-plain\">建教生訓練契約有前項各款約定者，其約定無效。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">建教生於建教合作機構受訓時，發生可歸責於建教生之終止契約事由者，建教合作機構應自知悉之日起算三日內，協調學校加強輔導該建教生；建教合作機構屆期未處理者，不得再以該項事由終止建教生訓練契約。<\/div>\n<div class=\"doc-plain\">建教合作機構依前項規定協調學校加強輔導建教生，屆二星期仍未獲改善者，建教合作機構得終止建教生訓練契約，並報主管機關備查。<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">建教生因建教合作事項發生爭議，得向學校申請協調，並得向學校主管機關申訴。<\/div>\n<div class=\"doc-plain\">學校為辦理前項協調，由學校邀請建教合作機構代表與該案建教生及其家長、專家學者共同參與，並應請主管機關代表列席，於開會時互推一人擔任會議主席；協調會議應作成紀錄，並由學校報主管機關備查。建教合作機構應依協調會決議確實執行。<\/div>\n<div class=\"doc-plain\">第一項之協調，不影響建教生或建教合作機構之其他權利救濟。<\/div>\n<div class=\"doc-plain\">學校主管機關為審議第一項申訴事項，應遴聘具備教育、心理輔導、法律、勞工等專長之學者專家七人至十五人，組成建教生申訴審議會，其中任一性別委員應占委員總數三分之一以上；其組織、運作及其他相關事項之辦法，由各該主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  四  章  建教生權益保障<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain\">為保障建教生權益，建教合作機構應履行下列義務：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依建教生訓練契約，提供良好之訓練環境，安排建教生至相關部門接受職業技能訓練，並培養優良之工作態度、安全認知及職業道德。<\/div>\n<div class=\"doc-plain\">前款訓練活動應與建教生所學職業科別相關，並注意建教生之身心健康。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">於建教生受訓期間，應依建教生職業技能訓練計畫，指派專人負責建教生之職業技能訓練及生活輔導。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">安排職業技能訓練時，不得影響建教生到校上課或至建教合作機構以外場所進行觀摩受訓之權益。<\/div>\n<div class=\"doc-plain\">應考量建教生之學習表現及年資，逐年增加生活津貼之金額。<\/div>\n<div class=\"doc-plain\">準用勞工保險條例之規定，為建教生辦理參加勞工保險。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">應置備建教生簽到簿或出勤卡，逐日記載建教生訓練情形。此項簿卡應保存一年。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生於訓練活動期間從事之作業，屬勞工健康保護規則所定應實施特殊體格檢查或健康檢查項目者，應準用職業安全衛生法規定為建教生施行體格檢查或健康檢查。<\/div>\n<div class=\"doc-plain\">建教合作機構為建教生辦理參加勞工保險，其保險效力之開始及停止、月投保薪資、投保薪資之調整、保險費負擔、保險費繳納、保險費寬限期與滯納金之徵收及處理、保險給付之計算與發給及其他有關保險事項，準用勞工保險條例及其相關規定辦理。<\/div>\n<div class=\"doc-plain\">建教合作機構就建教生因從事訓練活動不法侵害他人權利，負損害賠償責任。但損害係因建教生故意或重大過失所致者，不在此限。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">建教合作機構應依建教生訓練契約，給付建教生生活津貼，並提供其生活津貼明細表。<\/div>\n<div class=\"doc-plain\">前項生活津貼，屬建教生參與職業訓練而給與之補助費，非屬薪資或勞務所得，免納綜合所得稅；其金額，不得低於勞動基準法所定基本工資，並應以法定通用貨幣給付之。<\/div>\n<div class=\"doc-plain\">生活津貼應按月全額直接給付建教生。但法律另有規定得扣除相關費用者，不在此限。<\/div>\n<div class=\"doc-plain\">建教合作機構不得預扣生活津貼，作為違約金或賠償費用。<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">建教合作機構與建教生簽訂建教生訓練契約前，應繳納一定金額之保證金予學校，由學校專戶存儲，於建教生向建教合作機構請求生活津貼或第二十四條第九項所定賠償金未獲給付時，由該保證金支付之。學校應於建教生訓練契約終止後，將賸餘之保證金發還建教合作機構。<\/div>\n<div class=\"doc-plain\">前項保證金之金額，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">建教生每日訓練時間不得超過八小時，每星期受訓總時數不得超過四十小時，且不得於午後八時至翌晨六時之時間內接受訓練。<\/div>\n<div class=\"doc-plain\">建教生繼續受訓四小時，至少應有三十分鐘之休息。<\/div>\n<div class=\"doc-plain\">建教生受訓期間，每七日至少應有二日之休息，作為例假。<\/div>\n<div class=\"doc-plain\">建教生受訓期間，遇有勞動基準法規定應放假之日，均應依該法及其相關法令之規定休息。<\/div>\n<div class=\"doc-plain\">女性建教生因生理日致受訓有困難者，每月得申請生理假一日，建教合作機構不得剋扣其生活津貼，學校不得列入其學業成績評量之事項。<\/div>\n<div class=\"doc-plain\">因建教合作機構經營型態、工作特性、季節、地域或行業類別需要，並符合下列各款條件者，建教合作機構得向主管機關申請核准，於建教生訓練契約中與建教生另行約定訓練及休息時間之起迄點：<\/div>\n<div class=\"doc-plain\">建教生年滿十六歲。<\/div>\n<div class=\"doc-plain\">建教合作機構提供必要之安全衛生設施。<\/div>\n<div class=\"doc-plain\">無大眾運輸工具可資運用時，建教合作機構提供交通工具或安排宿舍。<\/div>\n<div class=\"doc-plain\">建教合作機構與建教生依前項規定另行約定訓練時間者，仍不得於午後十時至翌晨六時之時間內接受訓練。<\/div>\n<div class=\"doc-plain\">建教生每日訓練時間之起訖，包括訓練及中間休息時間，合計不得超過十二小時。<\/div>\n<div class=\"doc-plain\">建教合作機構違反第一項至第五項、第七項或前項規定，應就違反規定之時數，發給建教生該時數換算之生活津貼數額二倍之金額，作為賠償金；違反規定之時數未滿一小時者，應以一小時計算。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">建教生從事訓練活動時發生災害而致死亡、失能、傷害或疾病時，建教合作機構應準用勞動基準法第七章職業災害補償規定予以補償。<\/div>\n<div class=\"doc-plain\">前項補償金額所採計算基準，不得低於勞動基準法所定基本工資之數額。<\/div>\n<div class=\"doc-plain\">第一項建教生未加入勞工保險者，準用職業災害勞工保護法有關未加入勞工保險之勞工規定予以補助。<\/div>\n<div class=\"doc-plain\">學校應主動協助建教生依第一項或前項規定請求補償或申請補助。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">建教合作機構於建教生受訓期間，不得因其種族、階級、語言、思想、宗教、黨派、籍貫、出生地、年齡、婚姻、容貌、五官或身心障礙之因素，給予不利之差別待遇。<\/div>\n<div class=\"doc-plain\">建教合作機構應與學校會商提供身心障礙建教生個別化協助措施。<\/div>\n<div class=\"doc-plain\">建教合作機構不得因建教生依本法提出申訴或協調或依勞動事件法聲請調解、提起訴訟，而給予不利之差別待遇。<\/div>\n<div class=\"doc-plain\">第一項差別待遇之認定，準用就業服務法及其相關法規有關就業歧視認定之規定。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">建教合作機構於建教生受訓期間，不得因其性別或性傾向而有差別待遇，並應防治性騷擾行為之發生；於知悉有性騷擾情形時，應採取立即有效之糾正及補救措施。<\/div>\n<div class=\"doc-plain\">建教生於建教合作機構受訓期間遭性別歧視、性傾向歧視或性騷擾時，其申訴之提出、認定及建教合作機構之賠償責任，準用性別工作平等法及其相關法規之規定。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">建教生訓練契約期間屆滿或因其他事由而終止時，建教合作機構應依第十七條第一項第三款規定，發給書面之訓練證明。<\/div>\n<div class=\"doc-plain\">前項訓練證明，應包括建教生之訓練職類、訓練期間及訓練時數。<\/div>\n<div class=\"doc-plain\">建教生取得訓練證明且表現優良者，建教合作機構得優先僱用。<\/div>\n<div class=\"chapter-heading\">第  五  章  建教合作之監督<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">各級主管機關應會同地方勞工主管機關對學校及建教合作機構辦理建教合作進行考核；其考核之項目、方式、基準、獎懲及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">除前項考核外，勞工主管機關得辦理建教合作機構勞動檢查。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">各級主管機關依前條規定考核時，發現建教合作機構有違反建築、消防、勞工安全衛生、營業衛生或其他事項者，應通知目的事業主管機關依相關法規規定處理。<\/div>\n<div class=\"doc-plain\">建教合作機構依第二十八條第三項規定優先僱用表現優良之建教生者，主管機關得列入其以後年度參與建教合作之參考。<\/div>\n<div class=\"chapter-heading\">第  六  章  罰則<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">學校違反第十二條第一款、第三款或第四款規定者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰；其情節重大者，得為減少下學年度建教合作之招收人數、停止部分建教合作班級之招生或停辦建教合作二年之處分。<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain\">建教合作機構有下列情形之一者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰；經處罰二次仍未改善者，三年內不得參與建教合作，並公布其名稱及負責人姓名：<\/div>\n<div class=\"doc-plain\">違反第十四條規定，超收建教生或不符合每期最低輪調人數。<\/div>\n<div class=\"doc-plain\">有第十八條第一項所定行為。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未履行第二十一條第一項第一款至第三款、第五款、第七款或第八款規定保障建教生權益之義務。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反第二十二條規定，未依約給付建教生生活津貼並提供明細表、給付生活津貼低於勞動基準法所定基本工資、未以法定通用貨幣給付生活津貼、未按月全額直接給付生活津貼或預扣生活津貼。<\/div>\n<div class=\"doc-plain\">未依第二十三條規定，繳納保證金。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依第二十四條第一項至第八項規定，安排建教生之受訓及休息時間，或未依第九項規定，給予建教生賠償。<\/div>\n<div class=\"doc-plain\">未依第二十五條第一項、第二項規定，給予建教生補償。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反第二十六條第一項、第三項規定，給予建教生不利之差別待遇，或未依第二項規定提供個別化協助措施。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反第二十七條第一項規定，給予建教生差別待遇、未防治性騷擾行為之發生或未採取立即有效之糾正及補救措施。<\/div>\n<div class=\"doc-plain\">建教合作機構違反第二十一條第一項第六款或第二項規定，由勞工保險主管機關依勞工保險條例第六章規定處罰。但建教合作機構違反第二十一條第一項第六款規定，未為建教生辦理參加勞工保險，而有第二十五條第三項規定情事者，由中央勞工主管機關依職業災害勞工保護法之規定處罰。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain\">學校與建教合作機構違反第十五條規定，約定支付任何名義之報酬或回饋予對方者，處新臺幣五萬元以上二十五萬元以下罰鍰，並得按次處罰。<\/div>\n<div class=\"doc-plain\">學校與建教合作機構之代表人、管理人或其他有代表權人，因執行職務致學校與建教合作機構依前項規定受處罰時，應並受同一額度罰鍰之處罰。<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain\">學校有下列情形之一者，應令其限期改善；屆期未改善者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰；其情節重大者，得為減少下學年度建教合作之招收人數、停止部分建教合作班級之招生或停辦建教合作一年至二年之處分：<\/div>\n<div class=\"doc-plain\">未依第十條第二項規定採計職業技能訓練學分之學分數。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依第十一條第一項第一款規定或第二項所定時數，於建教生進入建教合作機構接受職業技能訓練前，提供建教生基礎或職前訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依第十一條第一項第二款規定，於建教生進入建教合作機構接受職業技能訓練前，邀請建教合作機構共同舉辦說明會。<\/div>\n<div class=\"doc-plain\">違反第十二條第二款規定，無正當理由自建教合作機構召回建教生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依第十三條第一項或第三項規定，指派教師訪視建教合作機構、要求建教合作機構改進、為適當之追蹤處理及詳予記錄。<\/div>\n<div class=\"doc-plain\">未依第二十條第二項規定，召開協調會及作成會議紀錄報主管機關備查。<\/div>\n<div class=\"doc-plain\">未依第二十五條第四項規定，主動協助建教生請求補償或申請補助。<\/div>\n<div class=\"article-heading\">第  35  條<\/div>\n<div class=\"doc-plain\">建教合作機構有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰；經處罰二次仍未改善者，三年內不得參與建教合作，並公布其名稱及負責人姓名：<\/div>\n<div class=\"doc-plain\">未依第十七條第一項規定，將建教生訓練契約報主管機關備查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依第十九條第一項規定，於知悉發生可歸責於建教生之終止契約事由之日起算三日內，協調學校加強輔導該建教生，而直接以該事由終止建教生訓練契約。<\/div>\n<div class=\"doc-plain\">未依第二十條第二項規定，依協調會決議確實執行。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反第二十八條第一項或第二項規定，未發給建教生書面訓練證明或未於訓練證明中載明建教生之訓練職類、訓練期間及訓練時數。<\/div>\n<div class=\"article-heading\">第 36 條<\/div>\
