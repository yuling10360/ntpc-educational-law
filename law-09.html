><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">高壓用電設備絕緣情形、接地電阻及其他安全設備狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">自備屋外高壓配電線路情況。<\/span><\/div>\n<div class=\"article-heading\">第 31 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於低壓電氣設備，應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">低壓受電盤及分電盤（含各種電驛、儀表及其切換開關等）之動作試驗。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">低壓用電設備絕緣情形，接地電阻及其他安全設備狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">自備屋外低壓配電線路情況。<\/span><\/div>\n<div class=\"article-heading\">第 31-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於防爆電氣設備，應每月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">本體有無損傷、變形。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">配管、配線等有無損傷、變形及異常狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">其他保持防爆性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 32 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對鍋爐應每月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">鍋爐本體有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">燃燒裝置：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">油加熱器及燃料輸送裝置有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">噴燃器有無損傷及污髒。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">過濾器有無堵塞或損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">燃燒器瓷質部及爐壁有無污髒及損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">加煤機及爐篦有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">煙道有無洩漏、損傷及風壓異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">自動控制裝置：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">自動起動停止裝置、火焰檢出裝置、燃料切斷裝置、水位調節裝置、壓力調節裝置機能有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">電氣配線端子有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">附屬裝置及附屬品：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">給水裝置有無損傷及作動狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">蒸汽管及停止閥有無損傷及保溫狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">空氣預熱器有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">水處理裝置機能有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 33 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主對高壓氣體特定設備、高壓氣體容器及第一種壓力容器，應每月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">本體有無損傷、變形。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">蓋板螺栓有無損耗。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">管、凸緣、閥及旋塞等有無損傷、洩漏。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">壓力表及溫度計及其他安全裝置有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">平台支架有無嚴重腐蝕。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">對於有保溫部分或有高游離輻射污染之虞之場所，得免實施。<\/div>\n<div class=\"article-heading\">第 34 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對小型鍋爐應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">鍋爐本體有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">燃燒裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">自動控制裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">附屬裝置及附屬品性能是否正常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 35 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對第二種壓力容器應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">內面及外面有無顯著損傷、裂痕、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">蓋、凸緣、閥、旋塞等有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">安全閥、壓力表與其他安全裝置之性能有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 36 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對小型壓力容器應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">本體有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">蓋板螺旋有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">管及閥等有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 37 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高壓氣體儲存能力在一百立方公尺或一公噸以上之儲槽應注意有無沈陷現象，並應每年定期測定其沈陷狀況一次。<\/div>\n<div class=\"article-heading\">第 38 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對特定化學設備或其附屬設備，應每二年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">特定化學設備或其附屬設備（不含配管）：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">內部有無足以形成其損壞原因之物質存在。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">內面及外面有無顯著損傷、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">蓋、凸緣、閥、旋塞等之狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">安全閥、緊急遮斷裝置與其他安全裝置及自動警報裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">冷卻、攪拌、壓縮、計測及控制等性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">備用動力源之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（七）<\/span><span class=\"doc-copy\">其他為防止丙類第一種物質或丁類物質之漏洩之必要事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">配管<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">熔接接頭有無損傷、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">凸緣、閥、旋塞等之狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">接於配管之供為保溫之蒸氣管接頭有無損傷、變形或腐蝕。<\/span><\/div>\n<div class=\"article-heading\">第 39 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主對化學設備及其附屬設備，應就下列事項，每二年定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">內部是否有造成爆炸或火災之虞。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">內部與外部是否有顯著之損傷、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">蓋板、凸緣、閥、旋塞等之狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">安全閥或其他安全裝置、壓縮裝置、計測裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">冷卻裝置、攪拌裝置、壓縮裝置、計測裝置及控制裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">預備電源或其代用裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">其他防止爆炸或火災之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 40 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對局部排氣裝置、空氣清淨裝置及吹吸型換氣裝置應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">氣罩、導管及排氣機之磨損、腐蝕、凹凸及其他損害之狀況及程度。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">導管或排氣機之塵埃聚積狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">排氣機之注油潤滑狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">導管接觸部分之狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">連接電動機與排氣機之皮帶之鬆弛狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">吸氣及排氣之能力。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">設置於排放導管上之採樣設施是否牢固、鏽蝕、損壞、崩塌或其他妨礙作業安全事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 41 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對設置於局部排氣裝置內之空氣清淨裝置，應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">構造部分之磨損、腐蝕及其他損壞之狀況及程度。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">除塵裝置內部塵埃堆積之狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">濾布式除塵裝置者，有濾布之破損及安裝部分鬆弛之狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">其他保持性能之必要措施。<\/span><\/div>\n<div class=\"article-heading\">第 42 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對異常氣壓之再壓室或減壓艙，應就下列事項，每個月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">輸氣設備及排氣設備之運作狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">通話設備及警報裝置之運作狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">電路有無漏電。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">電器、機械器具及配線有無損傷。<\/span><\/div>\n<div class=\"article-heading\">第 43 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對施工架及施工構台，應就下列事項，每週定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">架材之損傷、安裝狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">立柱、橫檔、踏腳桁等之固定部分，接觸部分及安裝部分之鬆弛狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">固定材料與固定金屬配件之損傷及腐蝕狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">扶手、護欄等之拆卸及脫落狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">基腳之下沈及滑動狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">斜撐材、索條、橫檔等補強材之狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">立柱、踏腳桁、橫檔等之損傷狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">懸臂樑與吊索之安裝狀況及懸吊裝置與阻檔裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">壁連座之間距及連接構件之狀況。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">強風大雨等惡劣氣候、四級以上之地震襲擊後及每次停工之復工前，亦應實施前項檢查。<\/div>\n<div class=\"article-heading\">第 44 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對營造工程之模板支撐架，應每週依下列規定實施檢查：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">架材之損傷、安裝狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">支柱等之固定部分、接觸部分及搭接重疊部分之鬆弛狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">固定材料與固定金屬配件之損傷及腐蝕狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">基腳（礎）之沉陷及滑動狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">斜撐材、水平繫條等補強材之狀況。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">強風大雨等惡劣氣候、四級以上之地震襲擊後及每次停工之復工前，亦應實施前項檢查。<\/div>\n<div class=\"article-heading\">第 44-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於機械、設備，應依本章第一節及第二節規定，實施定期檢查。但雇主發現有腐蝕、劣化、損傷或堪用性之虞，應實施安全評估，並縮短其檢查期限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第 三 節 機械、設備之重點檢查<\/div>\n<div class=\"article-heading\">第 45 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對第二種壓力容器及減壓艙，應於初次使用前依下列規定實施重點檢查：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">確認胴體、端板之厚度是否與製造廠所附資料符合。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">確認安全閥吹洩量是否足夠。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">各項尺寸、附屬品與附屬裝置是否與容器明細表符合。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">經實施耐壓試驗無局部性之膨出、伸長或洩漏之缺陷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 46 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對捲揚裝置於開始使用、拆卸、改裝或修理時，應依下列規定實施重點檢查：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">確認捲揚裝置安裝部位之強度，是否符合捲揚裝置之性能需求。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">確認安裝之結合元件是否結合良好，其強度是否合乎需求。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 47 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對局部排氣裝置或除塵裝置，於開始使用、拆卸、改裝或修理時，應依下列規定實施重點檢查：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">導管或排氣機粉塵之聚積狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">導管接合部分之狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">吸氣及排氣之能力。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">其他保持性能之必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 48 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對異常氣壓之輸氣設備應依下列規定實施重點檢查：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">對輸氣設備初次使用或予分解後加以改造、修理或停用一個月以上擬再度使用時，應對該設備實施重點檢查。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">於輸氣設備發生故障或因出水或發生其他異常，致高壓室內作業勞工有遭受危險之虞時，應迅即使勞工自沈箱、壓氣潛盾等撤離，避免危難，應即檢點輸氣設備之有無異常，沈箱等之有無異常沈降或傾斜及其他必要事項。<\/span><\/div>\n<div class=\"article-heading\">第 49 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對特定化學設備或其附屬設備，於開始使用、改造、修理時，應依下列規定實施重點檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">特定化學設備或其附屬設備（不含配管）：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">內部有無足以形成其損壞原因之物質存在。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">內面及外面有無顯著損傷、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">蓋、凸緣、閥、旋塞等之狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">安全閥、緊急遮斷裝置與其他安全裝置及自動警報裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">冷卻、攪拌、壓縮、計測及控制等性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">備用動力源之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（七）<\/span><span class=\"doc-copy\">其他為防止丙類第一種物質或丁類物質之漏洩之必要事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">配管：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">熔接接頭有無損傷、變形及腐蝕。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">凸緣、閥、旋塞等之狀態。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">接於配管之蒸氣管接頭有無損傷、變形或腐蝕。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">第 四 節 機械、設備之作業檢點<\/div>\n<div class=\"article-heading\">第 50 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主對車輛機械，應每日作業前依下列各項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動器、連結裝置、各種儀器之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">蓄電池、配線、控制裝置之有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 50-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高空工作車，應於每日作業前就其制動裝置、操作裝置及作業裝置之性能實施檢點。<\/div>\n<div class=\"article-heading\">第 51 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對捲揚裝置應於每日作業前就其制動裝置、安全裝置、控制裝置及鋼索通過部分狀況實施檢點。<\/div>\n<div class=\"article-heading\">第 52 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對固定式起重機，應於每日作業前依下列規定實施檢點，對置於瞬間風速可能超過每秒三十公尺或四級以上地震後之固定式起重機，應實施各部安全狀況之檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">過捲預防裝置、制動器、離合器及控制裝置性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">直行軌道及吊運車橫行之導軌狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">鋼索運行狀況。<\/span><\/div>\n<div class=\"article-heading\">第 53 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對移動式起重機，應於每日作業前對過捲預防裝置、過負荷警報裝置、制動器、離合器 、控制裝置及其他警報裝置之性能實施檢點。<\/div>\n<div class=\"article-heading\">第 54 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對人字臂起重桿，應於每日作業前依下列規定實施檢點，對置於瞬間風速可能超過每秒三十公尺（以設於室外者為限）或四級以上地震後之人字臂起重桿，應就其安全狀況實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">過捲預防裝置、制動器、離合器及控制裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">鋼索通過部分狀況。<\/span><\/div>\n<div class=\"article-heading\">第 54-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對營建用或載貨用之升降機，應於每日作業前對搬器及升降路所有出入口門扉之連鎖裝置之性能實施檢點。<\/div>\n<div class=\"article-heading\">第 55 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對營建用提升機，應於每日作業前，依下列規定實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動器及離合器性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">鋼索通過部分狀況。<\/span><\/div>\n<div class=\"article-heading\">第 56 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對吊籠，應於每日作業前依下列規定實施檢點，如遇強風、大雨、大雪等惡劣氣候後， 應實施第三款至第五款之檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">鋼索及其緊結狀態有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">扶手等有無脫離。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">過捲預防裝置、制動器、控制裝置及其他安全裝置之機能有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">升降裝置之擋齒機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">鋼索通過部分狀況。<\/span><\/div>\n<div class=\"article-heading\">第 57 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對簡易提升機，應於每日作業前對制動性能實施檢點。<\/div>\n<div class=\"article-heading\">第 58 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對第十六條、第十九條至第二十五條及第五十二條至前條規定之起重機械使用之吊掛用鋼索、吊鏈、纖維索、吊鉤、吊索、鏈環等用具，應於每日作業前實施檢點。<\/div>\n<div class=\"article-heading\">第 59 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對第二十六條之衝剪機械，應於每日作業前依下列規定，實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">離合器及制動器之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">曲柄軸、飛輪、滑塊、連桿、連接螺栓之有無鬆懈狀況。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">一行程一停止機構及緊急制動裝置之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">安全裝置之性能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">電氣、儀表。<\/span><\/div>\n<div class=\"article-heading\">第 60 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對工業用機器人應於每日作業前依下列規定實施檢點；檢點時應儘可能在可動範圍外為之：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動裝置之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">緊急停止裝置之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">接觸防止設施之狀況及該設施與機器人間連鎖裝置之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">相連機器與機器人間連鎖裝置之機能。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">外部電線、配管等有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">供輸電壓、油壓及空氣壓有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">動作有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">有無異常之聲音或振動。<\/span><\/div>\n<div class=\"article-heading\">第 61 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高壓氣體製造設備，應於使用開始前及使用終了後，檢點該設備有無異常，且應依所製造之高壓氣體種類及製造設備狀況，一日一次以上就該設備之動作狀況實施檢點。<\/div>\n<div class=\"article-heading\">第 62 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高壓氣體消費設備，應於使用開始前及使用終了後，檢點該設備有無異常，一日一次以上就該設備之動作狀況實施檢點。<\/div>\n<div class=\"article-heading\">第 63 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對營建工程施工架設備、施工構台、支撐架設備、露天開挖擋土支撐設備、隧道或坑道開挖支撐設備、沉箱、圍堰及壓氣施工設備、打樁設備等，應於每日作業前及使用終了後，檢點該設備有無異常或變形。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第 五 節 作業檢點<\/div>\n<div class=\"article-heading\">第 64 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事下列危險性設備作業時，應使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">鍋爐之操作作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第一種壓力容器之操作作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">高壓氣體特定設備之操作作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">高壓氣體容器之操作作業。<\/span><\/div>\n<div class=\"article-heading\">第 65 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事下列高壓氣體作業時，應使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">高壓氣體之灌裝作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">高壓氣體容器儲存作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">高壓氣體之運輸作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">高壓氣體之廢棄作業。<\/span><\/div>\n<div class=\"article-heading\">第 66 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事工業用機器人之教導及操作作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 67 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事營造作業時，應就下列事項，使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">打樁設備之組立及操作作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">擋土支撐之組立及拆除作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">露天開挖之作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">隧道、坑道開挖作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">混凝土作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">鋼架施工作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">施工構台之組立及拆除作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">建築物之拆除作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">施工架之組立及拆除作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">模板支撐之組立及拆除作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">其他營建作業。<\/span><\/div>\n<div class=\"article-heading\">第 68 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事缺氧危險或局限空間作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 69 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事下列有害物作業時，應使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">有機溶劑作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">鉛作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">四烷基鉛作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">特定化學物質作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">粉塵作業。<\/span><\/div>\n<div class=\"article-heading\">第 70 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事下列異常氣壓作業時，應使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">潛水作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">高壓室內作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">沈箱作業。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">氣壓沈箱、沈筒、潛盾施工等作業。<\/span><\/div>\n<div class=\"article-heading\">第 71 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事金屬之熔接、熔斷或加熱作業時，應就下列事項，使該勞工就其作業有關事項實施檢點：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">乙炔熔接裝置。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">氣體集合熔接裝置。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">氧乙炔熔接裝置。<\/span><\/div>\n<div class=\"article-heading\">第 72 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事危害性化學品之製造、處置及使用作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 73 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事林場作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 74 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事船舶清艙解體作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 75 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事碼頭裝卸作業時，應使該勞工就其作業有關事項實施檢點。<\/div>\n<div class=\"article-heading\">第 76 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">（刪除）<\/div>\n<div class=\"article-heading\">第 77 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工對其作業中之纖維纜索、乾燥室、防護用具、電氣機械器具及自設道路等實施檢點。<\/div>\n<div class=\"article-heading\">第 78 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第五十條至第五十六條及第五十八條至第七十七條實施之檢點，其檢點對象、內容，應依實際需要訂定，以檢點手冊或檢點表等為之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第 六 節 自動檢查紀錄及必要措施<\/div>\n<div class=\"article-heading\">第 79 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十三條至第六十三條規定實施之自動檢查，應訂定自動檢查計畫。<\/div>\n<div class=\"article-heading\">第 80 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十三條至第四十九條規定實施之定期檢查、重點檢查應就下列事項記錄，並保存三年：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">檢查年月日。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">檢查方法。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">檢查部分。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">檢查結果。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">實施檢查者之姓名。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">依檢查結果應採取改善措施之內容。<\/span><\/div>\n<div class=\"article-heading\">第 81 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工、主管人員及職業安全衛生管理人員實施檢查、檢點時，發現對勞工有危害之虞者，應即報告上級主管。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十三條至第七十七條規定實施自動檢查，發現有異常時，應立即檢修及採取必要措施。<\/div>\n<div class=\"article-heading\">第 82 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十三條至第七十七條規定實施之自動檢查，於其他法令另有規定者外，應依該規定為之。<\/div>\n<div class=\"article-heading\">第 83 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十三條至第七十七條規定之自動檢查，除依本法所定之其他法令另有規定者外，應指定具專業知能或操作資格之適當人員為之。<\/div>\n<div class=\"article-heading\">第 84 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位以其事業之全部或部分交付承攬或再承攬時，如該承攬人使用之機械、設備或器具係由原事業單位提供者，該機械、設備或器具應由原事業單位實施定期檢查及重點檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項定期檢查及重點檢查於有必要時得由承攬人或再承攬人會同實施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項之定期檢查及重點檢查如承攬人或再承攬人具有實施之能力時，得以書面約定由承攬人或再承攬人為之。<\/div>\n<div class=\"article-heading\">第 85 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位承租、承借機械、設備或器具供勞工使用者，應對該機械、設備或器具實施自動檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項自動檢查之定期檢查及重點檢查，於事業單位承租、承借機械、設備或器具時，得以書面約定由出租、出借人為之。<\/div>\n<div class=\"chapter-heading\">第 五 章 報告<\/div>\n<div class=\"article-heading\">第 86 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工人數在三十人以上之事業單位，依第二條之一至第三條之一、第六條規定設管理單位或置管理人員時，應依中央主管機關公告之內容及方式登錄，報請勞動檢查機構備查；變更時，亦同。<\/div>\n<div class=\"article-heading\">第 87 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十條規定設委員會時，應製作委員會名冊（如附表三），並依中央主管機關公告之內容及方式登錄，報請勞動檢查機構備查；變更時，亦同。<\/div>\n<div class=\"chapter-heading\">第 六 章 附則<\/div>\n<div class=\"article-heading\">第 88 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">於本辦法發布日前，依已廢止之工廠安全衛生管理人員設置辦法、勞工安全衛生組織及管理人員設置辦法及修正前之勞工安全衛生組織管理及自動檢查辦法規定，取得勞工安全衛生管理人員資格者，於本辦法施行後，其資格不受影響。<\/div>\n<div class=\"article-heading\">第 89 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">（刪除）<\/div>\n<div class=\"article-heading\">第 89-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">政府機關（構），對於第二條之一、第三條及第六條之規定，因其他法規限制，得於組織修編完成前，以報經中央主管機關核定之職業安全衛生管理規章或職業安全衛生管理計畫替代之。<\/div>\n<div class=\"article-heading\">第 89-2 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第五條之一、第十二條至第十二條之六及第八十條規定所作之紀錄，應以紙本保存。但以電子紀錄形式保存，並能隨時調閱查對者，不在此限。<\/div>\n<div class=\"article-heading\">第 90 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法自發布日施行。但除中華民國九十七年一月九日修正發布之第二條之一第一項第一款、第六條第二項第一款已另定施行日期者外，第二條、第二條之一、第三條、第三條之一、第三條之二、第五條之一、第六條、第七條、第十條、第十二條之一至第十二條之六規定，自發布後六個月施行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法中華民國一百零三年六月二十六日修正發布之條文，自一百零三年七月三日施行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法中華民國一百零五年二月十九日修正發布之條文，除第六條之一及第十二條之七規定，自一百零五年七月一日施行外，自一百零六年一月一日施行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法中華民國一百零九年九月二十四日修正發布之第四條規定，自發布後六個月施行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法中華民國一百十一年一月五日修正發布之第四條規定，自一百十一年一月七日施行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本辦法中華民國一百十五年六月二十九日修正發布之條文，自一百十五年七月一日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.105年2月19日修正發布。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.111年1月5日勞動部勞職授字第 11002065741 號令修正發布第 4、90  條條文；並自111年1月7日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3. 115年6月29日勞動部勞職授字第 1150252299 號令修正發布第 1、1-1、5-1、6、11～12-7、20、27、43、44、60、63、67、71、84、86、87、90 條條文及第3條條文之附表二；依第 90 條規定：自115年7月1日施行。<\/div>"},{"title":"高級中等學校實習課程實施辦法","content":"第  1  條\n本辦法依高級中等教育法第四十四條第二項規定訂定之。\n第  2  條\n本辦法適用於技術型高級中等學校。\n綜合型高級中等學校之實習課程及普通型高級中等學校設有專業群、科、綜合高中學程之實習課程，準用本辦法之規定。\n第  3  條\n本辦法所稱實習課程，指高級中等學校課程綱要規定由教育部部定及學校自定，包括實驗、實務之專業實習課程。\n前項實習課程，應依群、科、學程屬性、產業發展趨勢、學校特色及學生就業準備與專業預備，規劃實習之科目。\n第  4  條\n實習課程之教學目標為依務實致用之原則，本於專業理論知識，進行實務操作，以培養學生專業技能、職業道德及安全與衛生觀念，提升學生就業及繼續進修所需基本知能。\n第  5  條\n實習課程得依其實施場所，分為下列三種方式進行：\n校內實習：學生於學期中，在校內實習工場、專科教室、實驗室或其他相關實習場所(以下簡稱校內實習場所)實習。\n校外實習：學生於學期中，每學期以六星期為限，在校外實習合作機構實習。\n校內併校外實習：學生於學期中，在校內實習場所及校外實習合作機構實習。\n第  6  條\n校內實習場所與校外實習合作機構之設施及設備，應符合建築、消防、職業安全衛生、營業衛生、性別友善空間及其他相關法規之規定。\n第  7  條\n學校校內實習課程，應依高級中等學校課程綱要規定，並得考量教學設備、安全及空間等因素，實施分組教學。\n前項分組教學，每班以二組為限；每組至少十二人，但情形特殊報各該主管機關核准者，其每組人數，不在此限。\n學校實施校內實習課程時，得辦理校外職場參觀，強化學生對職場之了解。\n第  8  條\n學校辦理校外實習前，應組成小組，對校外實習合作機構進行評估，作成評估報告，並擬訂合作契約草案。\n前項評估報告之內容，應包括設施與設備符合第六條規定，及工作內涵與實習技能項目之相關性。\n第一項合作契約草案內容，應包括實習起迄期間、每日實習時段、實習內容、公共意外責任保險、住宿或交通安排及其他學生與校外實習合作機構之權利義務。\n第  9  條\n校外實習合作機構經依前條規定評估通過者，學校應擬訂校外實習計畫，連同前條評估報告及合作契約草案提學校課程發展委員會審查通過；其計畫之內容如下：\n實習科別、年級、科目及學生數。\n校外實習起迄期間及每日實習時段。\n校外實習之技能項目與該科目教學綱要之對照表。\n校外實習合作機構對學生之輔導、師資、公共意外責任保險、住宿或交通安排。\n第  10  條\n校外實習計畫經依前條第一項規定審查通過後，學校應與校外實習合作機構簽訂合作契約，並將合作契約連同實習計畫，報各該主管機關備查。\n第  11  條\n學校辦理校內併校外實習，其校外實習，準用第六條、第八條至前條規定\n辦理。\n第  12  條\n校內併校外實習時，校外實習節數，不得超過該實習課程整學期授課節數三分之一。\n第  13  條\n學校不得為一年級學生辦理校外實習或校內併校外實習。\n第 14 條\n實習課程，得於每星期固定節次分散實施，或在一定期間內集中實施；其授課節數及學分採計方式如下：\n校內實習或校內併校外實習：每一科目學分之計算，以每學期每星期授課一節，或總授課節數達十八節者，為一學分。\n校外實習：實習時數達七十二小時者，始得採計為一學分，每學期以二學分為限。\n第  15  條\n實習課程之師資，應由該科專任、兼任或代理之合格教師擔任，並得遴聘業界專家協同教學。但由兼任或代理教師擔任者，以受員額限制、聘任困難或其他特殊情形者為限。\n第  16  條\n本辦法自中華民國一百零三年八月一日施行。\n本辦法中華民國一百零七年八月九日修正發布之條文，自一百零七年八月一日施行。","history":"1.103年1月7日教育部臺教授國部字第 1020134512A  號令訂定  發布全文 16 條；並自103年8月1日施行。\n2.107年8月9日教育部臺教授國部字第 1070084551B 號修正部分條文；並自107年8月1日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本辦法依高級中等教育法第四十四條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本辦法適用於技術型高級中等學校。<\/div>\n<div class=\"doc-plain\">綜合型高級中等學校之實習課程及普通型高級中等學校設有專業群、科、綜合高中學程之實習課程，準用本辦法之規定。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本辦法所稱實習課程，指高級中等學校課程綱要規定由教育部部定及學校自定，包括實驗、實務之專業實習課程。<\/div>\n<div class=\"doc-plain\">前項實習課程，應依群、科、學程屬性、產業發展趨勢、學校特色及學生就業準備與專業預備，規劃實習之科目。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">實習課程之教學目標為依務實致用之原則，本於專業理論知識，進行實務操作，以培養學生專業技能、職業道德及安全與衛生觀念，提升學生就業及繼續進修所需基本知能。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">實習課程得依其實施場所，分為下列三種方式進行：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校內實習：學生於學期中，在校內實習工場、專科教室、實驗室或其他相關實習場所(以下簡稱校內實習場所)實習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習：學生於學期中，每學期以六星期為限，在校外實習合作機構實習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校內併校外實習：學生於學期中，在校內實習場所及校外實習合作機構實習。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">校內實習場所與校外實習合作機構之設施及設備，應符合建築、消防、職業安全衛生、營業衛生、性別友善空間及其他相關法規之規定。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">學校校內實習課程，應依高級中等學校課程綱要規定，並得考量教學設備、安全及空間等因素，實施分組教學。<\/div>\n<div class=\"doc-plain\">前項分組教學，每班以二組為限；每組至少十二人，但情形特殊報各該主管機關核准者，其每組人數，不在此限。<\/div>\n<div class=\"doc-plain\">學校實施校內實習課程時，得辦理校外職場參觀，強化學生對職場之了解。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">學校辦理校外實習前，應組成小組，對校外實習合作機構進行評估，作成評估報告，並擬訂合作契約草案。<\/div>\n<div class=\"doc-plain\">前項評估報告之內容，應包括設施與設備符合第六條規定，及工作內涵與實習技能項目之相關性。<\/div>\n<div class=\"doc-plain\">第一項合作契約草案內容，應包括實習起迄期間、每日實習時段、實習內容、公共意外責任保險、住宿或交通安排及其他學生與校外實習合作機構之權利義務。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">校外實習合作機構經依前條規定評估通過者，學校應擬訂校外實習計畫，連同前條評估報告及合作契約草案提學校課程發展委員會審查通過；其計畫之內容如下：<\/div>\n<div class=\"doc-plain\">實習科別、年級、科目及學生數。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習起迄期間及每日實習時段。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習之技能項目與該科目教學綱要之對照表。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習合作機構對學生之輔導、師資、公共意外責任保險、住宿或交通安排。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">校外實習計畫經依前條第一項規定審查通過後，學校應與校外實習合作機構簽訂合作契約，並將合作契約連同實習計畫，報各該主管機關備查。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">學校辦理校內併校外實習，其校外實習，準用第六條、第八條至前條規定<\/div>\n<div class=\"doc-plain\">辦理。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">校內併校外實習時，校外實習節數，不得超過該實習課程整學期授課節數三分之一。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">學校不得為一年級學生辦理校外實習或校內併校外實習。<\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain\">實習課程，得於每星期固定節次分散實施，或在一定期間內集中實施；其授課節數及學分採計方式如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校內實習或校內併校外實習：每一科目學分之計算，以每學期每星期授課一節，或總授課節數達十八節者，為一學分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習：實習時數達七十二小時者，始得採計為一學分，每學期以二學分為限。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">實習課程之師資，應由該科專任、兼任或代理之合格教師擔任，並得遴聘業界專家協同教學。但由兼任或代理教師擔任者，以受員額限制、聘任困難或其他特殊情形者為限。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">本辦法自中華民國一百零三年八月一日施行。<\/div>\n<div class=\"doc-plain\">本辦法中華民國一百零七年八月九日修正發布之條文，自一百零七年八月一日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.103年1月7日教育部臺教授國部字第 1020134512A  號令訂定  發布全文 16 條；並自103年8月1日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.107年8月9日教育部臺教授國部字第 1070084551B 號修正部分條文；並自107年8月1日施行。<\/div>"},{"title":"高級中等學校實習課程績效評量辦法","content":"第  1  條\n本辦法依技術及職業教育法(以下簡稱本法)第十三條第一項規定訂定之。\n第  2  條\n本辦法適用於技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程(以下簡稱學校)。\n第  3  條\n本辦法所稱實習課程，指依高級中等學校實習課程實施辦法所開設之課程。\n第  4  條\n學校主管機關應就學校辦理實習課程及實施場所，依下列評量項目，進行績效評量(以下簡稱本評量)：\n實習課程整體規劃。\n實習課程實施、輔導及獎勵措施。\n實習課程經費之編列及執行。\n實習課程師資之專業能力及職場經驗。\n業界專家協同教學實施成效。\n實習課程教材選用及編撰。\n實習課程場地、設施與設備之設置、使用及維護。\n學生參與實習課程人數。\n校外實習合作機構之遴選及考核。\n校外實習學生之教學及輔導。\n校外實習合作機構長期留用學生占學生參與校外實習人數比率。\n前次評量結果改進情形。\n其他特色發展及優良績效。\n前項第九款至第十一款規定，於未辦理校外實習或校內併校外實習之學校，不適用之；第十二款規定，於第一次接受評量之學校，亦同。\n第  5  條\n學校主管機關得將本評量納入學校校務評鑑，依校務評鑑程序規定辦理，或委託學術團體或專業評量機構(以下簡稱受託機構)定期辦理評量。\n前項受託機構，應符合下列條件：\n依法設立登記或立案，且設立宗旨與教育相關之法人或團體。\n有專業客觀之評量實施能力，包括足夠之評量領域學者專家、完善之評量委員遴選與培訓制度、足夠之專(兼)任行政人員，及健全之組織與會計制度。\n本評量應以書面審查及實地訪視方式辦理。\n第  6  條\n受託機構應依下列原則及程序實施本評量：\n組成評量小組，統籌整體評量事宜。\n訂定評量實施計畫，包括評量項目、基準(指標)、程序、結果、申復、申訴、評量委員資格、講習、倫理、迴避及其他相關事項，經評量小組通過及學校主管機關核定後，於辦理評量六個月前公告之。\n評量實施前，應辦理評量說明會，向受評量之學校詳細說明。\n評量實施前，應辦理評量委員評量說明會。\n評量結束後，應於三個月內完成評量報告初稿，並經評量小組通過後，送達各受評量學校。\n對評量報告初稿不服之受評量學校，於評量報告初稿送達後十四日內，得向受託機構提出申復；受託機構應自受理申復之日起一個月內完成申復審查。申復有理由者，受託機構應請評量小組修正評量報告初稿；申復無理由者，維持評量報告初稿，並完成評量報告書及評量結果。\n評量報告書及評量結果經學校主管機關核定後公布，並送達受評量學校。\n對評量報告書及評量結果不服之受評量學校，於評量報告書及評量結果送達後十四日內，得向學校主管機關提出申訴；各該學校主管機關應自受理申訴之日起一個月內完成申訴審查。申訴有理由者，應請受託機構轉知評量小組修正評量報告書及評量結果，經各該學校主管機關核定後公布。\n參與評量相關人員對評量工作所獲取之各項資訊，應負保密義務，不得公開。\n前項第二款評量委員，由受託機構遴聘，其組成應包括學者專家、教師團體、家長團體、學校及機關代表；其任一性別委員人數，不得少於委員總數三分之一。\n第  7  條\n本評量結果分為下列五等第：\n優等：九十分以上。\n甲等：八十分以上，未達九十分。\n乙等：七十分以上，未達八十分。\n丙等：六十分以上，未達七十分。\n丁等：未達六十分。\n學校經評量結果達甲等以上者，學校主管機關得依本法第十三條第二項規定，對學校、校外實習合作機構及其相關人員予以獎勵；評量結果乙等者，不予獎勵；評量結果丙等以下者，應辦理追蹤輔導。\n評量結果為丙等以下之學校，應於三個月內完成改進；學校主管機關得以評量結果作為核定調整學校發展規模及經費補助之參據。\n第  8  條          \n本辦法自發布日施行。","history":"105 年 3 月 14 日 發布。","contentHtml":"<div class=\"doc-plain\">第  1  條<br>本辦法依技術及職業教育法(以下簡稱本法)第十三條第一項規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本辦法適用於技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程(以下簡稱學校)。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本辦法所稱實習課程，指依高級中等學校實習課程實施辦法所開設之課程。<\/div>\n<div class=\"doc-plain\">第  4  條<br>學校主管機關應就學校辦理實習課程及實施場所，依下列評量項目，進行績效評量(以下簡稱本評量)：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程整體規劃。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程實施、輔導及獎勵措施。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程經費之編列及執行。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程師資之專業能力及職場經驗。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">業界專家協同教學實施成效。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程教材選用及編撰。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實習課程場地、設施與設備之設置、使用及維護。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學生參與實習課程人數。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習合作機構之遴選及考核。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習學生之教學及輔導。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">校外實習合作機構長期留用學生占學生參與校外實習人數比率。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前次評量結果改進情形。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他特色發展及優良績效。<\/div>\n<div class=\"doc-plain\">前項第九款至第十一款規定，於未辦理校外實習或校內併校外實習之學校，不適用之；第十二款規定，於第一次接受評量之學校，亦同。<\/div>\n<div class=\"doc-plain\">第  5  條<br>學校主管機關得將本評量納入學校校務評鑑，依校務評鑑程序規定辦理，或委託學術團體或專業評量機構(以下簡稱受託機構)定期辦理評量。<\/div>\n<div class=\"doc-plain\">前項受託機構，應符合下列條件：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依法設立登記或立案，且設立宗旨與教育相關之法人或團體。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">有專業客觀之評量實施能力，包括足夠之評量領域學者專家、完善之評量委員遴選與培訓制度、足夠之專(兼)任行政人員，及健全之組織與會計制度。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:1.77em\">本評量應以書面審查及實地訪視方式辦理。<\/div>\n<div class=\"doc-plain\">第  6  條<br>受託機構應依下列原則及程序實施本評量：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">組成評量小組，統籌整體評量事宜。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">訂定評量實施計畫，包括評量項目、基準(指標)、程序、結果、申復、申訴、評量委員資格、講習、倫理、迴避及其他相關事項，經評量小組通過及學校主管機關核定後，於辦理評量六個月前公告之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">評量實施前，應辦理評量說明會，向受評量之學校詳細說明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">評量實施前，應辦理評量委員評量說明會。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">評量結束後，應於三個月內完成評量報告初稿，並經評量小組通過後，送達各受評量學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">對評量報告初稿不服之受評量學校，於評量報告初稿送達後十四日內，得向受託機構提出申復；受託機構應自受理申復之日起一個月內完成申復審查。申復有理由者，受託機構應請評量小組修正評量報告初稿；申復無理由者，維持評量報告初稿，並完成評量報告書及評量結果。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">評量報告書及評量結果經學校主管機關核定後公布，並送達受評量學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">對評量報告書及評量結果不服之受評量學校，於評量報告書及評量結果送達後十四日內，得向學校主管機關提出申訴；各該學校主管機關應自受理申訴之日起一個月內完成申訴審查。申訴有理由者，應請受託機構轉知評量小組修正評量報告書及評量結果，經各該學校主管機關核定後公布。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">參與評量相關人員對評量工作所獲取之各項資訊，應負保密義務，不得公開。<\/div>\n<div class=\"doc-plain\">前項第二款評量委員，由受託機構遴聘，其組成應包括學者專家、教師團體、家長團體、學校及機關代表；其任一性別委員人數，不得少於委員總數三分之一。<\/div>\n<div class=\"doc-plain\">第  7  條<br>本評量結果分為下列五等第：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">優等：九十分以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">甲等：八十分以上，未達九十分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">乙等：七十分以上，未達八十分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">丙等：六十分以上，未達七十分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">丁等：未達六十分。<\/div>\n<div class=\"doc-plain\">學校經評量結果達甲等以上者，學校主管機關得依本法第十三條第二項規定，對學校、校外實習合作機構及其相關人員予以獎勵；評量結果乙等者，不予獎勵；評量結果丙等以下者，應辦理追蹤輔導。<\/div>\n<div class=\"doc-plain\">評量結果為丙等以下之學校，應於三個月內完成改進；學校主管機關得以評量結果作為核定調整學校發展規模及經費補助之參據。<\/div>\n<div class=\"doc-plain\">第  8  條          <br>本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">105 年 3 月 14 日 發布。<\/div>"},{"title":"高級中等學校辦理職業繼續教育辦法","content":"第  1  條\n本辦法依技術及職業教育法第二十條第四項規定訂定之。\n第  2  條\n本辦法適用於技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程(以下簡稱學校)。\n第  3  條\n學校辦理職業繼續教育，應依下列課程種類及辦理方式，發給證書或證明：\n學程課程：至少取得一百五十學分；修習期滿成績合格者，發給畢業證書。\n學分課程：每學分至少修習十八小時，且不得採短期密集方式授課，但有特殊原因報經學校主管機關核定者，不在此限；修習期滿成績及格者，發給學分證明。\n學習時數課程：每一學習時數至少四十五分鐘；修習成績合格者，發給學習時數證明。\n第  4  條\n學校辦理職業繼續教育，招生對象為依高級中等教育法第三十四條規定具有高級中等學校入學資格之在職者或轉業者；參加前條第一款學程課程者，並應具備累計二年以上工作經驗。\n前項參加者之工作經驗，應由學校依其投保勞工保險、軍人保險、公教人員保險或農民健康保險年資予以認定。\n第  5  條\n學校辦理職業繼續教育，其課程應以專班方式辦理。\n前項課程內容，以下列方式設計：\n學程課程：參採高級中等學校課程綱要部定專業科目與實習科目及中央目的事業主管機關所定之職能基準訂定。\n學分課程及學習時數課程：依職場所需之專業技術，參採中央目的事業主管機關所定之職能基準訂定。\n第  6  條\n學校辦理職業繼續教育，應檢具包括下列內容之開班計畫及招生簡章，報學校主管機關核定：\n開班計畫：應包括第三條規定之課程種類、辦理方式、開班名稱與時間、招生對象之資格條件、招生人數、課程設計(包括教學科目名稱及內容)、修業年限、師資、教學場所、設施與設備、學習評量、發給證書或證明、收費與退費規定、經費預算及其他相關事項。\n招生簡章：應載明第三條辦理之課程種類、開班名稱與時間、招生對象之資格條件、招生人數、教學科目名稱與內容、收費與退費規定及其他相關事項。\n前項學校有安排學生至職場接受教育及訓練課程者，其開班計畫應包括職場教育及訓練計畫，內容應載明教育訓練內容與實施方式、職場教育訓練場所及時數、成績評量辦法、合作機構評估報告、學校與合作機構簽訂之合作契約草案、合作機構與學生簽訂之職場教育訓練契約草案及其他相關事項；於招生後，由學校與合作機構簽訂合作契約，並由合作機構與學生依該合作契約，簽訂職場教育訓練契約，報學校主管機關備查。\n前項合作機構評估報告之製作及內容，準用高級中等學校實習課程實施辦法之規定。\n第一項開班計畫或第二項職場教育及訓練計畫有變更之必要時，應報學校主管機關核定後，始得為之。\n第一項開班計畫及招生簡章之招生對象不得載入性別之限制。\n第  7  條\n學校辦理職業繼續教育，應訂定學習評量基準；實施職場教育及訓練課程者，學校應依學生於合作機構接受教育及訓練課程之紀錄，進行成績評量。\n前項成績評量，得採筆試、作業、口試、表演、實作、實驗、見習、參觀、報告、資料蒐集整理、鑑賞、晤談、實踐、自我評量、同儕互評或檔案評量等多元方式辦理。\n第  8  條\n學生至職場接受教育及訓練課程時，合作機構應指派專責技術人員，負責職場學習輔導；學校並應安排專責教師到職場協助輔導。\n第  9  條\n學校有下列情形之一，經學校主管機關依相關法令命其限期改善者，於改善期間不得辦理職業繼續教育之學分課程及學習時數課程，學校並應即對外公告：\n經學校評鑑，有下列情形之一：\n學校整體評鑑成績列為丙等(四等)以下。\n校務評鑑結果列為丁等(五等)。\n專業群科整體評鑑結果列為丁等(五等)。\n合格教師比率未達百分之五十。\n學校最近連續二學年屬非自願資遣教師人數超過該學年專任教師總人數之百分之十；或單一學年資遣教師人數超過該學年專任教師總人數之百分之二十，且屬非自願資遣人數占總資遣人數之百分之五十以上。\n學校積欠教職員工薪資累計達三個月以上。\n依財務預測，二年內將發生入不敷出或資金缺口達財務調度困難情形。\n違反私立學校法或有關教育法令，經學校主管機關評估應進行輔導。\n依前項規定不得辦理前，已開辦之職業繼續教育之學分課程及學習時數課程，得依原開班計畫辦理至該學期結束。\n第  10  條\n持有職業繼續教育學分證明者，得依高級中等學校學生學習評量辦法及高級中等學校進修部學生學習評量辦法，辦理學分或科目抵免。\n第  11  條\n學生年滿十八歲且修習職業繼續教育學分課程累計達一百五十學分以上，持有學分證明者，得依入學大學同等學力認定標準第二條第十三款規定，以同等學力報考大學學士班(不包括二年制學士班)一年級新生入學考試，並得依入學專科學校同等學力認定標準第二條第一款規定，以同等學力報考二年制專科學校一年級新生入學考試。\n第  12  條\n學校辦理職業繼續教育，應於每學年度結束後二個月內，將該學年度職業繼續教育開班數、學生數及辦理成效，報學校主管機關備查。\n學校主管機關應建立品質控管機制，得將職業繼續教育列入學校校務評鑑項目；必要時，亦得至學校訪視。\n學校主管機關對辦理職業繼續教育成效優良之學校，得予以獎勵；對辦理不善或不符合規定者，學校主管機關得視情節為下列處分：\n輔導。\n糾正。\n限期改善。\n停止部分或全部班別之招生。\n依前項第三款規定限期改善，屆期未改善者，得停止部分或全部班別之招生。\n第  13  條\n本辦法自發布日施行。","history":"1.105年2月24日臺教授國部字第1050009891B號令訂定發布全文11點；並自發布日施行。\n2.中華民國108年10月31日教育部臺教授國部字第1080116859B 號令修正發布全文 13 條，並自發布日施行。","contentHtml":"<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本辦法依技術及職業教育法第二十條第四項規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本辦法適用於技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程(以下簡稱學校)。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，應依下列課程種類及辦理方式，發給證書或證明：<\/div>\n<div class=\"doc-plain\">學程課程：至少取得一百五十學分；修習期滿成績合格者，發給畢業證書。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學分課程：每學分至少修習十八小時，且不得採短期密集方式授課，但有特殊原因報經學校主管機關核定者，不在此限；修習期滿成績及格者，發給學分證明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學習時數課程：每一學習時數至少四十五分鐘；修習成績合格者，發給學習時數證明。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，招生對象為依高級中等教育法第三十四條規定具有高級中等學校入學資格之在職者或轉業者；參加前條第一款學程課程者，並應具備累計二年以上工作經驗。<\/div>\n<div class=\"doc-plain\">前項參加者之工作經驗，應由學校依其投保勞工保險、軍人保險、公教人員保險或農民健康保險年資予以認定。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，其課程應以專班方式辦理。<\/div>\n<div class=\"doc-plain\">前項課程內容，以下列方式設計：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學程課程：參採高級中等學校課程綱要部定專業科目與實習科目及中央目的事業主管機關所定之職能基準訂定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學分課程及學習時數課程：依職場所需之專業技術，參採中央目的事業主管機關所定之職能基準訂定。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，應檢具包括下列內容之開班計畫及招生簡章，報學校主管機關核定：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">開班計畫：應包括第三條規定之課程種類、辦理方式、開班名稱與時間、招生對象之資格條件、招生人數、課程設計(包括教學科目名稱及內容)、修業年限、師資、教學場所、設施與設備、學習評量、發給證書或證明、收費與退費規定、經費預算及其他相關事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">招生簡章：應載明第三條辦理之課程種類、開班名稱與時間、招生對象之資格條件、招生人數、教學科目名稱與內容、收費與退費規定及其他相關事項。<\/div>\n<div class=\"doc-plain\">前項學校有安排學生至職場接受教育及訓練課程者，其開班計畫應包括職場教育及訓練計畫，內容應載明教育訓練內容與實施方式、職場教育訓練場所及時數、成績評量辦法、合作機構評估報告、學校與合作機構簽訂之合作契約草案、合作機構與學生簽訂之職場教育訓練契約草案及其他相關事項；於招生後，由學校與合作機構簽訂合作契約，並由合作機構與學生依該合作契約，簽訂職場教育訓練契約，報學校主管機關備查。<\/div>\n<div class=\"doc-plain\">前項合作機構評估報告之製作及內容，準用高級中等學校實習課程實施辦法之規定。<\/div>\n<div class=\"doc-plain\">第一項開班計畫或第二項職場教育及訓練計畫有變更之必要時，應報學校主管機關核定後，始得為之。<\/div>\n<div class=\"doc-plain\">第一項開班計畫及招生簡章之招生對象不得載入性別之限制。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，應訂定學習評量基準；實施職場教育及訓練課程者，學校應依學生於合作機構接受教育及訓練課程之紀錄，進行成績評量。<\/div>\n<div class=\"doc-plain\">前項成績評量，得採筆試、作業、口試、表演、實作、實驗、見習、參觀、報告、資料蒐集整理、鑑賞、晤談、實踐、自我評量、同儕互評或檔案評量等多元方式辦理。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">學生至職場接受教育及訓練課程時，合作機構應指派專責技術人員，負責職場學習輔導；學校並應安排專責教師到職場協助輔導。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">學校有下列情形之一，經學校主管機關依相關法令命其限期改善者，於改善期間不得辦理職業繼續教育之學分課程及學習時數課程，學校並應即對外公告：<\/div>\n<div class=\"doc-plain\">經學校評鑑，有下列情形之一：<\/div>\n<div class=\"doc-plain\">學校整體評鑑成績列為丙等(四等)以下。<\/div>\n<div class=\"doc-plain\">校務評鑑結果列為丁等(五等)。<\/div>\n<div class=\"doc-plain\">專業群科整體評鑑結果列為丁等(五等)。<\/div>\n<div class=\"doc-plain\">合格教師比率未達百分之五十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校最近連續二學年屬非自願資遣教師人數超過該學年專任教師總人數之百分之十；或單一學年資遣教師人數超過該學年專任教師總人數之百分之二十，且屬非自願資遣人數占總資遣人數之百分之五十以上。<\/div>\n<div class=\"doc-plain\">學校積欠教職員工薪資累計達三個月以上。<\/div>\n<div class=\"doc-plain\">依財務預測，二年內將發生入不敷出或資金缺口達財務調度困難情形。<\/div>\n<div class=\"doc-plain\">違反私立學校法或有關教育法令，經學校主管機關評估應進行輔導。<\/div>\n<div class=\"doc-plain\">依前項規定不得辦理前，已開辦之職業繼續教育之學分課程及學習時數課程，得依原開班計畫辦理至該學期結束。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">持有職業繼續教育學分證明者，得依高級中等學校學生學習評量辦法及高級中等學校進修部學生學習評量辦法，辦理學分或科目抵免。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">學生年滿十八歲且修習職業繼續教育學分課程累計達一百五十學分以上，持有學分證明者，得依入學大學同等學力認定標準第二條第十三款規定，以同等學力報考大學學士班(不包括二年制學士班)一年級新生入學考試，並得依入學專科學校同等學力認定標準第二條第一款規定，以同等學力報考二年制專科學校一年級新生入學考試。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">學校辦理職業繼續教育，應於每學年度結束後二個月內，將該學年度職業繼續教育開班數、學生數及辦理成效，報學校主管機關備查。<\/div>\n<div class=\"doc-plain\">學校主管機關應建立品質控管機制，得將職業繼續教育列入學校校務評鑑項目；必要時，亦得至學校訪視。<\/div>\n<div class=\"doc-plain\">學校主管機關對辦理職業繼續教育成效優良之學校，得予以獎勵；對辦理不善或不符合規定者，學校主管機關得視情節為下列處分：<\/div>\n<div class=\"doc-plain\">輔導。<\/div>\n<div class=\"doc-plain\">糾正。<\/div>\n<div class=\"doc-plain\">限期改善。<\/div>\n<div class=\"doc-plain\">停止部分或全部班別之招生。<\/div>\n<div class=\"doc-plain\">依前項第三款規定限期改善，屆期未改善者，得停止部分或全部班別之招生。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.105年2月24日臺教授國部字第1050009891B號令訂定發布全文11點；並自發布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國108年10月31日教育部臺教授國部字第1080116859B 號令修正發布全文 13 條，並自發布日施行。<\/div>"},{"title":"高級中等學校實驗室管理指引","content":"壹、目的：\n為協助高級中等學校（以下簡稱學校）能依循各法令規範事項進行校園實驗室安全管理，防止意外事故發生，保障教職員工及學生之安全與健康，特訂定「高級中等學校實驗室管理指引」（以下簡稱本指引），供學校參酌或另訂定相關規範。\n貳、法令：\n依據「職業安全衛生法」、「職業安全衛生管理辦法」、「毒性及關注化學物質管理法」與「廢棄物清理法」等相關法規訂定本指引。\n參、管理人員及其任務\n一、學校應指定專責管理人員（下稱管理人），其職責如下：\n(一) 管理實驗室門禁及安全維護，每學期開學前需全面檢視實驗器材及設施，學期間則採定期或不定期巡視，以維持實驗室安全性。\n(二) 實驗室設備、儀器及化學品之造冊、定期檢查及其他維運事項。\n(三) 執行實驗室安全衛生管理事項。\n(四) 擬訂實驗室汙染防治計畫。\n(五) 建置及維護實驗室職業安全法規要求之相關資料。\n(六) 接受相關職業安全相關教育訓練。\n二、為落實實驗室管理相關作業，學校單位主管應負督導管理人之責，俾管理人落實執行實驗室管理工作之職責。\n肆、空間配置\n一、實驗室設置於符合建築技術規則規定之耐震、防火構造建築物。\n二、通道應保持不致使人員跌倒、滑倒、踩傷等之安全狀態，或採取必要之預防措施。\n三、實驗室逃生門緊急避難出口應標示其目的，且維持隨時能應用之狀態，逃生門應為外開式。\n四、一般學校教室屬乙類第3目，若總樓地板面積在 150 平方公尺以上者應設滅火器，並依規定設置足夠數量及標識。\n五、工作場所應使空氣充分流通，必要時，應依規定以機械通風設備換氣。\n六、實驗室如有從事其身體或衣著有被污染之虞之特殊作業時，應置備緊急沖淋及盥洗等相關設備。\n七、可加裝監錄系統，監錄藥品使用之管制。\n八、實驗室應於明顯可見處張貼校安通報專線、學校各處室及管理人緊急聯絡電話。\n伍、電器設備作業管理\n一、電器設備處應標示「閒人勿近」並加鎖。\n二、操作時務必使用合格之絕緣防護裝置。\n三、儘量減少活線作業，否則應保持安全距離。\n四、高壓電保養作業前，務必先切斷電源，並加掛「工作中」。\n五、維修保養工作終了，恢復供電之前，應確實檢查作業人員離開線路後，始可供電。\n六、不用濕手觸及電氣設備，如遇電氣設備或電路著火時，需用不導電之滅火設備。\n七、電氣技術人員應對全校電氣設備應隨時檢查，並定期檢查。\n陸、進行實驗應注意事項\n一、實驗前\n(一) 授課教師務必向學生宣導，嚴禁於實驗室內從事與實驗無關之活動及工作，並禁止飲食、跑跳或打鬧等。\n(二) 實驗進行前應熟讀實驗操作步驟及注意事項，實驗進行時不可任意改變操作條件。\n(三) 實驗人員應隨時謹記安全防護具、消防器材及逃生出入口之相關位置，以備不時之需。\n(四) 認清及牢記滅火器、急救箱及緊急沖洗器之存放位置並熟知使用方法。\n(五) 穿著長褲包鞋，長髮應綁起，且不宜佩戴隱形眼鏡。\n(六) 使用藥品時，應確實了解藥品之毒性、物性、化性與正確使用方法，並對實驗過程中可能發生的危險，採取適當的防護措施。\n二、實驗進行中\n(一) 實驗進行時，應隨時確實配戴安全眼鏡及實驗衣，必要時應配戴手套避免直接和藥品接觸，實驗中未經授課教師許可，不可擅離；如有疑問應立即向授課教師反應。\n(二) 由容器中取出溶劑時不可任意傾倒或以嘴吸取。\n(三) 用試管直接加熱時，身體不可太靠近加熱區，管口不可朝向人。\n(四) 稀釋濃硫酸時，應將濃硫酸緩緩注入水內，切勿將水加入硫酸中，否則將因急劇放熱沸騰飛濺或炸裂容器，而發生危險。\n(五) 揮發性或易燃性藥品必須遠離焰火。酒精燈在添加酒精時，應將燈焰先行熄滅，酒精添加切勿過滿；且於酒精燈上引燃時，必須用火柴或紙片引燃之，切勿將酒精燈直接持至另一已燃著的燈焰上引燃之，以免酒精溢出著火發生火災。\n(六) 鏡面、三稜鏡、玻璃板等有尖利稜角時，應報請授課教師處理之。\n(七) 處理高溫物品時，應戴隔熱手套，不可將手直接伸入烘箱中。\n三、實驗結束後\n(一) 實驗完畢應養成洗手的習慣。\n(二) 應確實檢查所有應關閉之開關是否已經關閉，並關妥門窗及水電開關。\n(三) 為避免污染，禁止將用不完的藥品再倒回原來的容器內；有毒廢液應分類並回收。\n柒、化學品管理\n一、化學品管理應依化學品屬性、種類進行標示及備妥安全資料表、登記文件等應備資料，並有運作場所平面配置圖。\n二、化學品名、危險藥品明顯標示，妥善保存，管理人應隨時檢視化學物品，注意有無溢漏情形，並汰換過期或變質藥品。\n三、放置化學藥品之藥品櫃應有防止容器掉落之阻擋措施；層板或抽屜並應有分隔設計或設置瓶架、托盤等，防止收納之容器碰撞、傾倒。\n四、危險性較高之化學藥品，其容器應收納於藥品櫃低處；可能自然發火之化學藥品，應完全保存於保護液內，且不因地震使化學藥品露出。\n捌、廢棄物管理\n一、設計實驗時應依綠化化學之原則，設計減少產生廢棄物之步驟。進行各實驗時應先考慮其可能產生之廢棄物種類、數量，並依實驗廢棄物管理作業規範做好分類、收集等工作，亦盡可能考慮處理成本及其對環境所造成的影響。\n二、實驗產生之廢液應依其特性分類儲存；實驗產生之固體廢棄物應用容器密封且集中管理。\n三、廢液桶需使用HDPE（高密度聚乙稀）材質，容積為20公升之方型容器，存放時下方需有防漏盤。\n四、廢液桶上應標示標籤。\n五、廢液桶必須放置於指定位置，並確實將廢液桶固定。\n六、破損或損壞之實驗器材應收集儲存後集中處理。\n玖、災害應變及通報\n一、實驗意外事故之處理\n(一) 實驗場所有發生危險之虞時，任課教師應立即引導學員生退避至安全場所。\n(二) 如受玻璃割傷，用手指按壓，立即至健康中心止血。\n(三) 遇不慎起火時，視火災情況適時選用滅火氈、防火砂或滅火器將之撲滅。\n(四) 若酸、鹼或腐蝕性藥品濺入眼中或觸及皮膚，應先用水沖洗；情形嚴重者，立即送醫院治療。\n(五) 若皮膚被灼傷，應遵守「沖脫泡蓋送」原則處理。\n(六) 感電事故應即切斷電源，並實施急救。\n(七) 遇有地震或警鈴響時，應隨手將使用中的電器關閉，並遵從教師指示疏散。\n二、事故通報\n(一) 依據「校園安全及災害通報作業要點」規定，學校須透過校園安全暨災害防救通報處理中心網站實施通報，學校應指定單位及專人為實驗室管理及事故災害事件通報作業窗口，知悉事故後應以口頭或書面告知學校校園安全及環安衛相關單位；學校並應依相關規定啟動必要處理機制，並於時限內完成法定通報及校安通報網通報。\n(二) 依「職業安全衛生法」第 37 條規定，事業單位勞動場所（係指學校）發生下列職業災害之一者，雇主應於 8 小時內通報勞動檢查機構：\n1. 發生死亡災害。\n2. 發生災害之罹災人數在 3 人以上。\n3. 發生災害之罹災人數在 1 人以上，且需住院治療。\n如校園發生職業災害未盡到通報的責任，依據同法第43條，可處新臺幣3萬元以上 30 萬元以下罰鍰處分。\n拾、學校實驗(習)場所之安全衛生管理，應符合「職業安全衛生法」規定；如發生異常或危害狀況，應依「緊急災害應變處理作業辦法」處理 ；有關防疫措施，應依中央流行疫情指揮中心發布最新防疫規定及本部防疫管理指引辦理。\n拾壹、本指引如有未盡事宜，悉依相關法令辦理。","history":"中華民國110年8月13日臺教國署高字第110 0101527 號函訂定","contentHtml":"<div class=\"doc-plain\">壹、目的：<\/div>\n<div class=\"doc-plain\">為協助高級中等學校（以下簡稱學校）能依循各法令規範事項進行校園實驗室安全管理，防止意外事故發生，保障教職員工及學生之安全與健康，特訂定「高級中等學校實驗室管理指引」（以下簡稱本指引），供學校參酌或另訂定相關規範。<\/div>\n<div class=\"doc-plain\">貳、法令：<\/div>\n<div class=\"doc-plain\">依據「職業安全衛生法」、「職業安全衛生管理辦法」、「毒性及關注化學物質管理法」與「廢棄物清理法」等相關法規訂定本指引。<\/div>\n<div class=\"doc-plain\">參、管理人員及其任務<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">學校應指定專責管理人員（下稱管理人），其職責如下：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">管理實驗室門禁及安全維護，每學期開學前需全面檢視實驗器材及設施，學期間則採定期或不定期巡視，以維持實驗室安全性。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">實驗室設備、儀器及化學品之造冊、定期檢查及其他維運事項。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(三)<\/span><span class=\"doc-copy\">執行實驗室安全衛生管理事項。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(四)<\/span><span class=\"doc-copy\">擬訂實驗室汙染防治計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(五)<\/span><span class=\"doc-copy\">建置及維護實驗室職業安全法規要求之相關資料。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(六)<\/span><span class=\"doc-copy\">接受相關職業安全相關教育訓練。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">為落實實驗室管理相關作業，學校單位主管應負督導管理人之責，俾管理人落實執行實驗室管理工作之職責。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">肆、空間配置<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗室設置於符合建築技術規則規定之耐震、防火構造建築物。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">通道應保持不致使人員跌倒、滑倒、踩傷等之安全狀態，或採取必要之預防措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">實驗室逃生門緊急避難出口應標示其目的，且維持隨時能應用之狀態，逃生門應為外開式。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">一般學校教室屬乙類第3目，若總樓地板面積在 150 平方公尺以上者應設滅火器，並依規定設置足夠數量及標識。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">工作場所應使空氣充分流通，必要時，應依規定以機械通風設備換氣。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">實驗室如有從事其身體或衣著有被污染之虞之特殊作業時，應置備緊急沖淋及盥洗等相關設備。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">可加裝監錄系統，監錄藥品使用之管制。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">實驗室應於明顯可見處張貼校安通報專線、學校各處室及管理人緊急聯絡電話。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">伍、電器設備作業管理<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">電器設備處應標示「閒人勿近」並加鎖。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">操作時務必使用合格之絕緣防護裝置。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">儘量減少活線作業，否則應保持安全距離。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">高壓電保養作業前，務必先切斷電源，並加掛「工作中」。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">維修保養工作終了，恢復供電之前，應確實檢查作業人員離開線路後，始可供電。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">不用濕手觸及電氣設備，如遇電氣設備或電路著火時，需用不導電之滅火設備。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">電氣技術人員應對全校電氣設備應隨時檢查，並定期檢查。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">陸、進行實驗應注意事項<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗前<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">授課教師務必向學生宣導，嚴禁於實驗室內從事與實驗無關之活動及工作，並禁止飲食、跑跳或打鬧等。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">實驗進行前應熟讀實驗操作步驟及注意事項，實驗進行時不可任意改變操作條件。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(三)<\/span><span class=\"doc-copy\">實驗人員應隨時謹記安全防護具、消防器材及逃生出入口之相關位置，以備不時之需。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(四)<\/span><span class=\"doc-copy\">認清及牢記滅火器、急救箱及緊急沖洗器之存放位置並熟知使用方法。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(五)<\/span><span class=\"doc-copy\">穿著長褲包鞋，長髮應綁起，且不宜佩戴隱形眼鏡。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(六)<\/span><span class=\"doc-copy\">使用藥品時，應確實了解藥品之毒性、物性、化性與正確使用方法，並對實驗過程中可能發生的危險，採取適當的防護措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗進行中<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">實驗進行時，應隨時確實配戴安全眼鏡及實驗衣，必要時應配戴手套避免直接和藥品接觸，實驗中未經授課教師許可，不可擅離；如有疑問應立即向授課教師反應。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">由容器中取出溶劑時不可任意傾倒或以嘴吸取。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(三)<\/span><span class=\"doc-copy\">用試管直接加熱時，身體不可太靠近加熱區，管口不可朝向人。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(四)<\/span><span class=\"doc-copy\">稀釋濃硫酸時，應將濃硫酸緩緩注入水內，切勿將水加入硫酸中，否則將因急劇放熱沸騰飛濺或炸裂容器，而發生危險。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(五)<\/span><span class=\"doc-copy\">揮發性或易燃性藥品必須遠離焰火。酒精燈在添加酒精時，應將燈焰先行熄滅，酒精添加切勿過滿；且於酒精燈上引燃時，必須用火柴或紙片引燃之，切勿將酒精燈直接持至另一已燃著的燈焰上引燃之，以免酒精溢出著火發生火災。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(六)<\/span><span class=\"doc-copy\">鏡面、三稜鏡、玻璃板等有尖利稜角時，應報請授課教師處理之。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(七)<\/span><span class=\"doc-copy\">處理高溫物品時，應戴隔熱手套，不可將手直接伸入烘箱中。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">實驗結束後<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">實驗完畢應養成洗手的習慣。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">應確實檢查所有應關閉之開關是否已經關閉，並關妥門窗及水電開關。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(三)<\/span><span class=\"doc-copy\">為避免污染，禁止將用不完的藥品再倒回原來的容器內；有毒廢液應分類並回收。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">柒、化學品管理<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">化學品管理應依化學品屬性、種類進行標示及備妥安全資料表、登記文件等應備資料，並有運作場所平面配置圖。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">化學品名、危險藥品明顯標示，妥善保存，管理人應隨時檢視化學物品，注意有無溢漏情形，並汰換過期或變質藥品。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">放置化學藥品之藥品櫃應有防止容器掉落之阻擋措施；層板或抽屜並應有分隔設計或設置瓶架、托盤等，防止收納之容器碰撞、傾倒。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">危險性較高之化學藥品，其容器應收納於藥品櫃低處；可能自然發火之化學藥品，應完全保存於保護液內，且不因地震使化學藥品露出。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">捌、廢棄物管理<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">設計實驗時應依綠化化學之原則，設計減少產生廢棄物之步驟。進行各實驗時應先考慮其可能產生之廢棄物種類、數量，並依實驗廢棄物管理作業規範做好分類、收集等工作，亦盡可能考慮處理成本及其對環境所造成的影響。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">實驗產生之廢液應依其特性分類儲存；實驗產生之固體廢棄物應用容器密封且集中管理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">廢液桶需使用HDPE（高密度聚乙稀）材質，容積為20公升之方型容器，存放時下方需有防漏盤。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">廢液桶上應標示標籤。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">廢液桶必須放置於指定位置，並確實將廢液桶固定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">破損或損壞之實驗器材應收集儲存後集中處理。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">玖、災害應變及通報<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">實驗意外事故之處理<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">實驗場所有發生危險之虞時，任課教師應立即引導學員生退避至安全場所。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">如受玻璃割傷，用手指按壓，立即至健康中心止血。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(三)<\/span><span class=\"doc-copy\">遇不慎起火時，視火災情況適時選用滅火氈、防火砂或滅火器將之撲滅。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(四)<\/span><span class=\"doc-copy\">若酸、鹼或腐蝕性藥品濺入眼中或觸及皮膚，應先用水沖洗；情形嚴重者，立即送醫院治療。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(五)<\/span><span class=\"doc-copy\">若皮膚被灼傷，應遵守「沖脫泡蓋送」原則處理。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(六)<\/span><span class=\"doc-copy\">感電事故應即切斷電源，並實施急救。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(七)<\/span><span class=\"doc-copy\">遇有地震或警鈴響時，應隨手將使用中的電器關閉，並遵從教師指示疏散。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">事故通報<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(一)<\/span><span class=\"doc-copy\">依據「校園安全及災害通報作業要點」規定，學校須透過校園安全暨災害防救通報處理中心網站實施通報，學校應指定單位及專人為實驗室管理及事故災害事件通報作業窗口，知悉事故後應以口頭或書面告知學校校園安全及環安衛相關單位；學校並應依相關規定啟動必要處理機制，並於時限內完成法定通報及校安通報網通報。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">(二)<\/span><span class=\"doc-copy\">依「職業安全衛生法」第 37 條規定，事業單位勞動場所（係指學校）發生下列職業災害之一者，雇主應於 8 小時內通報勞動檢查機構：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">1.<\/span><span class=\"doc-copy\">發生死亡災害。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">2.<\/span><span class=\"doc-copy\">發生災害之罹災人數在 3 人以上。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">3.<\/span><span class=\"doc-copy\">發生災害之罹災人數在 1 人以上，且需住院治療。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:6.8em\">如校園發生職業災害未盡到通報的責任，依據同法第43條，可處新臺幣3萬元以上 30 萬元以下罰鍰處分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.29em\">拾、學校實驗(習)場所之安全衛生管理，應符合「職業安全衛生法」規定；如發生異常或危害狀況，應依「緊急災害應變處理作業辦法」處理 ；有關防疫措施，應依中央流行疫情指揮中心發布最新防疫規定及本部防疫管理指引辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:6.8em\">拾壹、本指引如有未盡事宜，悉依相關法令辦理。<\/div>","historyHtml":"<div class=\"history-paragraph\">中華民國110年8月13日臺教國署高字第110 0101527 號函訂定<\/div>"}];
let currentIndex=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTableHtml(html){
  const tpl=document.createElement('template');tpl.innerHTML=html;
  tpl.content.querySelectorAll('th,td').forEach(cell=>{
    const walker=document.createTreeWalker(cell,NodeFilter.SHOW_TEXT);const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const text=node.nodeValue||'';
      if(text.includes('、') || [...text].length<=6 || !text.trim()) return;
      const chars=[...text];const frag=document.createDocumentFragment();
      for(let i=0;i<chars.length;i+=6){if(i) frag.appendChild(document.createElement('br'));frag.appendChild(document.createTextNode(chars.slice(i,i+6).join('')));}
      node.parentNode.replaceChild(frag,node);
    });
  });
  return tpl.innerHTML;
}
function renderList(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const list=document.getElementById('lawList');list.innerHTML='';const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+' '+x.content+' '+x.history).toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} / ${laws.length} 項`;document.getElementById('none').classList.toggle('hidden',filtered.length>0);filtered.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'bg-blue-600 text-white':'');b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title)}</span>`;b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};list.appendChild(b);});}
function renderLawContent(law){
  const lines=String(law.content||'').split('\n');
  let tableIndex=0;
  const patterns=[
    /^(一、|二、|三、|四、|五、|六、|七、|八、|九、|十、|十[一二三四五六七八九]、|二十、|三十、)/,
    /^(（[一二三四五六七八九十百]+）|\([一二三四五六七八九十百]+\))/,
    /^(\d+[、.．])/,
    /^(（\d+）|\(\d+\))/
  ];
  // 含「第X條」的法規維持原有排版，僅調整以項次編排的法規內文縮排。
  const isArticleLaw=lines.some(raw=>/^第\s*\d+\s*條(?:之\s*\d+)?/.test(raw.trim()));
  if(isArticleLaw){
    return lines.map(raw=>{
      const line=raw.trim();
      if(!line) return '<div class="doc-empty" aria-hidden="true"></div>';
      if((line==='附表一' || line==='附表二' || line.includes('國民中學學技藝教育抽離式上課各職群主題與國中全對應及部分對應領域課程節數原則')) && law.tablesHtml && law.tablesHtml[tableIndex]) return `<div class="doc-plain">${esc(line)}</div>${formatTableHtml(law.tablesHtml[tableIndex++])}`;
      if(/^第\s*\d+\s*條(?:之\s*\d+)?/.test(line)) return `<div class="article-heading">${esc(line)}</div>`;
      for(let i=0;i<patterns.length;i++){
        const m=line.match(patterns[i]);
        if(m){const marker=m[0], body=line.slice(marker.length).trimStart();return `<div class="doc-row doc-level-${i}"><span class="doc-marker">${esc(marker)}</span><span class="doc-copy">${esc(body)}</span></div>`;}
      }
      return `<div class="doc-plain">${esc(line)}</div>`;
    }).join('');
  }
  let activeLevel=-1;
  return lines.map(raw=>{
    const line=raw.trim();
    if(!line){activeLevel=-1;return '<div class="doc-empty" aria-hidden="true"></div>';}
    if((line==='附表一' || line==='附表二' || line.includes('國民中學學技藝教育抽離式上課各職群主題與國中全對應及部分對應領域課程節數原則')) && law.tablesHtml && law.tablesHtml[tableIndex]) { activeLevel=-1; return `<div class="doc-plain">${esc(line)}</div>${formatTableHtml(law.tablesHtml[tableIndex++])}`; }
    for(let i=0;i<patterns.length;i++){
      const m=line.match(patterns[i]);
      if(m){
        activeLevel=i;
        const marker=m[0], body=line.slice(marker.length).trimStart();
        return `<div class="doc-row doc-level-${i}"><span class="doc-marker">${esc(marker)}</span><span class="doc-copy">${esc(body)}</span></div>`;
      }
    }
    if(activeLevel>=0){
      const indent=[2.8,4.8,6.8,8.8][activeLevel]||2.8;
      return `<div class="doc-plain doc-continuation" style="padding-left:${indent}em">${esc(line)}</div>`;
    }
    return `<div class="doc-plain">${esc(line)}</div>`;
  }).join('');
}

function renderDetail(){const law=laws[currentIndex];document.getElementById('detail').innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ${currentIndex+1} 項／共 ${laws.length} 項</span><span class="text-xs text-slate-400">高級中等教育、職業教育、實習課程、技能檢定、職業安全</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">${esc(law.title)}</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]">${law.contentHtml||renderLawContent(law)}</div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">${law.historyHtml||esc(law.history).replace(/\n/g,"<br>")}</div></div><div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" ${currentIndex===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" ${currentIndex===laws.length-1?'disabled':''} class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`;}
function go(d){currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
document.getElementById('searchInput').addEventListener('input',renderList);renderList();renderDetail();
</script></body></html>
