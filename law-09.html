c-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">考核現場安全衛生管理績效。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">審議承攬業務安全衛生管理事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">其他有關職業安全衛生管理事項。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項委員會審議、協調及建議安全衛生相關事項，應作成紀錄，並保存三年。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項委員會議由主任委員擔任主席，必要時得召開臨時會議。<\/div>\n<div class=\"chapter-heading\">第 三 章 職業安全衛生管理措施<\/div>\n<div class=\"article-heading\">第 12-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主使勞工從事工作前，應就工作場所內之建築物、機械、設備、器具、原料、材料等或作業活動及其他可能引起之危害因素實施風險評估，並依評估結果，採取必要之預防設備及措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應依其事業單位之規模、性質，訂定職業安全衛生管理計畫，要求各級主管及負責指揮、監督之有關人員執行；勞工人數在三十人以下之事業單位，得以安全衛生管理執行紀錄或文件代替職業安全衛生管理計畫。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工人數在一百人以上之事業單位，應另訂定職業安全衛生管理規章。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第二項職業安全衛生管理計畫，應包括下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">機械、設備或器具之管理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">危害性化學品之分類、標示、通識及管理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">有害作業環境之採樣策略規劃及監測。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">危險性工作場所之製程或施工安全評估。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">採購管理、承攬管理及變更管理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">安全衛生作業標準。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">定期檢查、重點檢查、作業檢點及現場巡視。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">安全衛生教育訓練。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">個人防護具之管理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">健康檢查、管理及促進。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">安全衛生資訊之蒐集、分享及運用。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十二、<\/span><span class=\"doc-copy\">緊急應變措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十三、<\/span><span class=\"doc-copy\">職業災害、虛驚事故、影響身心健康事件之調查處理及統計分析。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十四、<\/span><span class=\"doc-copy\">安全衛生管理稽核及績效評估措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十五、<\/span><span class=\"doc-copy\">其他安全衛生管理措施。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第二項職業安全衛生管理事項之執行，應作成紀錄，並保存三年。<\/div>\n<div class=\"article-heading\">第 12-2 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">下列事業單位，雇主應依國家標準CNS 45001同等以上規定，建置適合該事業單位之職業安全衛生管理系統，並據以執行：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">第一類事業勞工人數在二百人以上者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第二類事業勞工人數在五百人以上者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">有從事石油裂解之石化工業工作場所者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">有從事製造、處置或使用危害性之化學品，數量達中央主管機關規定量以上之工作場所者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他經中央主管機關指定公告者。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項安全衛生管理之執行，應作成紀錄，並保存三年。<\/div>\n<div class=\"article-heading\">第 12-3 條<\/div>\n<div class=\"article-heading\">第十二條<\/div><div class=\"doc-plain\">之二第一項之事業單位應建立變更管理程序，於引進或修改製程、作業程序、材料及設備前，辨識可能危害及評估其職業災害之風險，並依風險評估結果採取必要之預防設備及措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項變更，雇主應檢討與更新相關安全衛生文件，使勞工充分知悉及接受相關教育訓練。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項執行紀錄，應保存三年。<\/div>\n<div class=\"article-heading\">第 12-4 條<\/div>\n<div class=\"article-heading\">第十二條<\/div><div class=\"doc-plain\">之二第一項之事業單位應建立採購管理程序，對於機械、設備、器具、物料、原料及個人防護具等之採購、租賃，其契約內容應有符合法令及實際需要之職業安全衛生具體規範，並於驗收、使用前確認其符合規定。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項事業單位將營繕工程交付規劃、設計時，應依工程特性實施風險評估及訂定施工管理相關規範，並納入施工及監造履約要件，要求施工者評估施工風險與採取必要之預防設備及措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項執行紀錄，應保存三年。<\/div>\n<div class=\"article-heading\">第 12-5 條<\/div>\n<div class=\"article-heading\">第十二條<\/div><div class=\"doc-plain\">之二第一項之事業單位，以其事業交付承攬或與承攬人、再承攬人之工作者共同作業時，除應依本法第二十六條或第二十七條規定辦理外，應就承攬人之安全衛生管理能力、職業災害與事故通報、危險作業管制、教育訓練、進場管制、緊急應變及安全衛生績效評估等事項，訂定承攬管理計畫，並促使承攬人、再承攬人及其工作者，遵守職業安全衛生法令及原事業單位所定之職業安全衛生管理事項。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項事業單位將營繕工程交付二個以上施工者施工時，應指定施工者之一實施整體工程施工風險評估及採取必要之統合管理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項執行紀錄，應保存三年。<\/div>\n<div class=\"article-heading\">第 12-6 條<\/div>\n<div class=\"article-heading\">第十二條<\/div><div class=\"doc-plain\">之二第一項之事業單位，應評估潛在風險，訂定緊急狀況預防、準備及應變之計畫，並定期辦理教育訓練與緊急應變演練，及依演練結果檢討修正應變計畫。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項計畫，應包括下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">應變組織及職責。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">通報程序。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">各項緊急狀況處理程序。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">避難疏散措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">必要應變設備。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">與外部救援單位之聯繫機制。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項執行紀錄，應保存三年。<\/div>\n<div class=\"article-heading\">第 12-7 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位已實施第十二條之二職業安全衛生管理系統相關管理制度，且管理績效良好者，中央主管機關得分級公開表揚之。<\/div>\n<div class=\"chapter-heading\">第 四 章 自動檢查<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第 一 節 機械之定期檢查<\/div>\n<div class=\"article-heading\">第 13 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對電氣機車、蓄電池機車、電車、蓄電池電車、內燃機車、內燃動力車及蒸汽機車等（以下於本條中稱電氣機車等），應每三年就整體定期實施檢查一次。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對前項之電氣機車等應每年依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">電氣機車、蓄電池機車、電車及蓄電池電車應檢查電動機、控制裝置、制動器、自動遮斷器、車架、連結裝置、蓄電池、避雷器、配線、接觸器具及各種儀表之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">內燃機車及內燃動力車應檢查引擎、動力傳動裝置、制動器、車架、連結裝置及各種儀表之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">蒸汽機車應檢查氣缸、閥、蒸氣管、調壓閥、安全閥及各種儀表之有無異常。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對電氣機車等應每月依下列規定就其車體所裝置項目定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">電氣機車、蓄電池機車、電車及蓄電池電車應檢查電路、制動器及連結裝置之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">內燃機車或內燃動力車應檢查制動器及連結裝置之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">蒸汽機車應檢查火室、易熔栓、水位計、給水裝置、制動器及連結裝置之有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 14 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對一般車輛，應每三個月就車輛各項安全性能定期實施檢查一次。<\/div>\n<div class=\"article-heading\">第 15 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">車輛頂高機應每三個月檢查一次以上，維持其安全性能。<\/div>\n<div class=\"article-heading\">第 15-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高空工作車，應每年就下列事項實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">壓縮壓力、閥間隙及其他原動機有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">離合器、變速箱、差速齒輪、傳動軸及其他動力傳動裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">主動輪、從動輪、上下轉輪、履帶、輪胎、車輪軸承及其他走行裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">轉向器之左右回轉角度、肘節、軸、臂及其他操作裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">制動能力、制動鼓、制動塊及其他制動裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">伸臂、升降裝置、屈折裝置、平衡裝置、工作台及其他作業裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">油壓泵、油壓馬達、汽缸、安全閥及其他油壓裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">電壓、電流及其他電氣系統有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">車體、操作裝置、安全裝置、連鎖裝置、警報裝置、方向指示器、燈號裝置及儀表有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 15-2 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對高空工作車，應每月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動裝置、離合器及操作裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">作業裝置及油壓裝置有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">安全裝置有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 16 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對車輛系營建機械，應每年就該機械之整體定期實施檢查一次。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對前項之車輛系營建機械，應每月依下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動器、離合器、操作裝置及作業裝置之有無異常。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">鋼索及鏈等之有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">吊斗及鏟斗之有無損傷。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">倒車或旋轉警示燈及蜂鳴器之有無異常。<\/span><\/div>\n<div class=\"article-heading\">第 17 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對堆高機，應每年就該機械之整體定期實施檢查一次。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對前項之堆高機，應每月就下列規定定期實施檢查一次：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">制動裝置、離合器及方向裝置。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span clas
