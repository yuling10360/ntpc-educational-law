lass=\"doc-plain\"> 本店有關經費收支，應設專戶處理。<\/div>\n<div class=\"doc-plain\">本店有關人員，對實習學生應負責指導下列事項：<\/div>\n<div class=\"doc-plain\"> 交易程序。<\/div>\n<div class=\"doc-plain\">業務處理。<\/div>\n<div class=\"doc-plain\"> 商品陳列。<\/div>\n<div class=\"doc-plain\">商品包裝。<\/div>\n<div class=\"doc-plain\">帳務處理。<\/div>\n<div class=\"doc-plain\">廣告設計及運用。<\/div>\n<div class=\"doc-plain\"> 服務精神及態度。<\/div>\n<div class=\"doc-plain\">本店為配合學生之實習，可另製專供實習之憑證、帳冊、報表等指導學生登錄或填報。<\/div>","historyHtml":"<div class=\"history-paragraph\">93年11月9日教育部部授教中(三)字第 0930519354 號令修正發布第 17 點條文；並自發布日生效。<\/div>"},{"title":"高級中等學校實用技能學程入學招生作業要點","content":"教育部國民及學前教育署(以下簡稱本部國教署)為輔導國民中學學生進入高級中等學校就讀實用技能學程(班)，健全實用技能學程招生作業，特訂定本要點。\n實用技能學程採分區分發方式招生，並應依各該主管機關核定招收之科、班名額，進行招生工作。\n實用技能學程招生對象為國民中學畢業生或具同等學力者。\n實用技能學程招生範圍，不受免試入學就學區之限制。\n本部國教署設實用技能學程分發會(以下簡稱分發會)，統籌聯合分發作業，並委由國立高級中等學校承辦。\n分發會依免試入學就學區，成立各分區分發作業小組(以下簡稱分區作業小組)，辦理分發工作，並指定學校承辦分發事務。\n分發會置委員十九人至二十五人，其中一人為主任委員，由本部國教署就前點第一項承辦校長派兼之；各分區作業小組召集人為當然委員；其餘委員，由主任委員遴聘專家學者、教育局(處)代表擔任。\n各分區作業小組置委員七人至三十一人，其中一人為召集人，由分發會主任委員就前點第二項承辦分發學校之校長聘兼之；教育局(處)代表為當然委員；其餘委員，由召集人就區域內國民中學校長代表及辦理實用技能學程之高級中等學校校長聘兼之。\n區域內僅有一所高級中等學校辦理實用技能學程者，由該校自行依第十二點規定辦理分發，免成立分區作業小組。\n分發會及分區作業小組，得視需求成立申訴及緊急事件處理專案小組，負責辦理有關招生各種申訴及緊急事件，其組成由分發會及各該分區作業小組自行訂定。\n分發會之任務如下：\n訂定分發會組織章程。\n召開全國實用技能學程分發會議。\n規劃全國實用技能學程分發工作。\n訂定全國實用技能學程分發時程。\n訂定實用技能學程就學區分發招生簡章範例。\n檢討實用技能學程分發改進事項。\n其他實用技能學程分發相關事項。\n分區作業小組之任務如下：\n依各該主管機關核定高級中等學校招收科、班名額，擬定分區實用技能學程分發之招生簡章，經主政之教育主管機關核定後，轉教育部備查。\n依招生簡章製作文宣資料，分送相關就學區內國民中學及辦理實用技能學程之高級中等學校。\n依本要點辦理分區分發作業。\n訂定學生報名表(A表及B表，如附件一及附件二)特殊表現項目之給分基準。\n其他實用技能學程分發有關事項。\n招生簡章應記載招生科別、班數、名額及其他相關事項，並應於分發前，報教育部備查。\n各分區分發時，每班應預留一至二個名額，供身心障礙學生適性輔導安置作業；各班無適性輔導安置之學生者，該預留名額，得列入續招名額。\n各分區作業小組得依各校科別特性，於簡章訂定身心障礙學生安置就讀之相關安全注意事項。\n實用技能學程入學應以免試方式為之，並採志願序分發。\n相同志願報名人數未逾招生名額者，全額錄取；相同志願報名人數逾招生名額者，採第十二點順序及第十三點比序方式錄取。\n年度申請分發，以一次為限，並不得申請改分發。\n各分區作業小組按學生志願序分發；分發對象優先順序如下：\n曾選習國民中學技藝教育課程應屆畢業生或具同等學力者。\n曾選習國民中學技藝教育課程非應屆畢業生或具同等學力者。\n未曾選習國民中學技藝教育課程應屆畢業生或具同等學力者。\n未曾選習國民中學技藝教育課程非應屆畢業生或具同等學力者。\n前點相同順序之比序及應檢附之文件如下：\n曾選習國民中學技藝教育課程應屆或非應屆畢業生或具同等學力者：\n曾參加各直轄市、縣(市)政府主辦之技藝競賽獲獎或成果展獲獎，且為低收入戶：獲獎及低收入戶證明文件。\n曾參加各直轄市、縣(市)政府主辦之技藝競賽獲獎或成果展獲獎：獲獎證明文件。\n低收入戶：低收入戶證明文件。\n中低收入戶：中低收入戶證明文件。\n職群綜合表現積分：國民中學技藝教育修習職群證明書；有特殊表現者，其證明文件。\n依前五目依序比序結果均相同時，由各分區作業小組訂定優先分發順序。\n未曾選習國民中學技藝教育課程應屆或非應屆畢業生或具同等學力者：\n低收入戶：低收入戶證明文件。\n中低收入戶：中低收入戶證明文件。\n特殊表現及國民中學綜合活動領域前五學期平均成績，二者加總後之分數高低進行分發：成績證明文件；有特殊表現者，其證明文件。\n分發實用技能學程之報名文件及方式如下：\n曾選習國中技藝教育應屆及非應屆畢(結)業生之報名文件：\n分發就讀高級中等學校實用技能學程報名A表(如附件一)。\n選修職群轉化分數之修習證明書。\n參加各直轄市、縣(市)政府主辦技藝競賽或成果展，獲獎之證明文件(無者免附)。\n鄉(鎮、市、區)公所低收入戶或中低收入戶證明文件(無者免附)。\n技藝教育相關之特殊表現證明文件(無者免附)。\n未曾選習國中技藝教育應屆及非應屆畢(結)業生之報名文件：\n分發就讀高級中等學校實用技能學程報名B表(如附件二)。\n鄉(鎮、市、區)公所低收入戶或中低收入戶證明文件(無者免附)。\n國民中學綜合活動領域前五學期平均成績證明。\n技藝教育相關之特殊表現證明文件(無者免附)\n報名方式：\n國民中學收齊並審核報名表件後，於簡章所定期限前，送達該分區作業小組。\n跨區或非應屆畢業生或具同等學力者，應親自或以郵寄方式報名。\n每位學生報名，以一分發區為限。\n第十三點第一款第五目職群綜合表現積分，分類如下：\n技藝教育課程修習點數。\n修習相關職群成績轉化分數，或修習之所有職群之平均分數。\n特殊表現得分。\n前點第一款技藝教育課程修習點數，指修習技藝教育每週修習節數及每學期修習職群數二項之點數總和；其每週修習節數，每一節為一點，修習職群數，每一職群為二點。\n第十五點第二款修習課程成績轉換分數，指學生所修習技藝教育各職群成績之轉化分數。\n前項轉化分數，分類如下：\n修習相關職群成績轉化分數：以該班所有獲得成績之學生數計算之，並計算至小數第二位；其計算公式如下：\n修習之所有職群之平均分數：學生所選習全部職群之成績平均分數。\n前項各款轉化分數，以最優者採計之。\n第十五點第三款特殊表現得分，規定如下：\n特殊表現，指與報名職群相關之特殊優異表現，包括競賽、科展、觀摩發表或其他表現。但已用於第十三點第一款第一目及第二目之競賽項目，不包括在內。\n特殊表現與職群相關性及其得分，應由各分區作業小組訂定，並納入招生簡章。\n各類特殊表現之得分基準，全國級為六分至八分，區域級為四分至六分，直轄市、縣(市)級為二分至四分。\n各分區作業小組之承辦學校完成分發作業後，分區作業小組應召開會議，審核錄取名單。\n各分區作業小組應於放榜日期，公告錄取名單，並以書面通知學生錄取及報到相關事項；錄取名單應函送各招生學校。\n錄取學生應於指定時間完成報到手續；未於指定期間完成報到手續者，撤銷其分發錄取資格。\n招生學校各科、班於學生報到後仍有缺額者，得由各校自行辦理續招；其錄取順序、比序及審核程序，應依本要點規定為之。\n分發報到後未滿十五人之班級，招生學校得報各該主管機關核准後不開班；已報到之學生，由該分區作業小組協調改分發，不受第十一點第三項規定之限制。\n本要點未規定事項，得由各分區作業小組定之。","history":"1.中華民國101年 5月2日部授教中(三)字第1010506659B號令。\n2.中華民國112年5月1日教育部臺教授國部字第 1120030458A 號令修正。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本部國教署)為輔導國民中學學生進入高級中等學校就讀實用技能學程(班)，健全實用技能學程招生作業，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實用技能學程採分區分發方式招生，並應依各該主管機關核定招收之科、班名額，進行招生工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實用技能學程招生對象為國民中學畢業生或具同等學力者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實用技能學程招生範圍，不受免試入學就學區之限制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本部國教署設實用技能學程分發會(以下簡稱分發會)，統籌聯合分發作業，並委由國立高級中等學校承辦。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發會依免試入學就學區，成立各分區分發作業小組(以下簡稱分區作業小組)，辦理分發工作，並指定學校承辦分發事務。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發會置委員十九人至二十五人，其中一人為主任委員，由本部國教署就前點第一項承辦校長派兼之；各分區作業小組召集人為當然委員；其餘委員，由主任委員遴聘專家學者、教育局(處)代表擔任。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區作業小組置委員七人至三十一人，其中一人為召集人，由分發會主任委員就前點第二項承辦分發學校之校長聘兼之；教育局(處)代表為當然委員；其餘委員，由召集人就區域內國民中學校長代表及辦理實用技能學程之高級中等學校校長聘兼之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">區域內僅有一所高級中等學校辦理實用技能學程者，由該校自行依第十二點規定辦理分發，免成立分區作業小組。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發會及分區作業小組，得視需求成立申訴及緊急事件處理專案小組，負責辦理有關招生各種申訴及緊急事件，其組成由分發會及各該分區作業小組自行訂定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發會之任務如下：<\/div>\n<div class=\"doc-plain\">訂定分發會組織章程。<\/div>\n<div class=\"doc-plain\">召開全國實用技能學程分發會議。<\/div>\n<div class=\"doc-plain\">規劃全國實用技能學程分發工作。<\/div>\n<div class=\"doc-plain\">訂定全國實用技能學程分發時程。<\/div>\n<div class=\"doc-plain\">訂定實用技能學程就學區分發招生簡章範例。<\/div>\n<div class=\"doc-plain\">檢討實用技能學程分發改進事項。<\/div>\n<div class=\"doc-plain\">其他實用技能學程分發相關事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分區作業小組之任務如下：<\/div>\n<div class=\"doc-plain\">依各該主管機關核定高級中等學校招收科、班名額，擬定分區實用技能學程分發之招生簡章，經主政之教育主管機關核定後，轉教育部備查。<\/div>\n<div class=\"doc-plain\">依招生簡章製作文宣資料，分送相關就學區內國民中學及辦理實用技能學程之高級中等學校。<\/div>\n<div class=\"doc-plain\">依本要點辦理分區分發作業。<\/div>\n<div class=\"doc-plain\">訂定學生報名表(A表及B表，如附件一及附件二)特殊表現項目之給分基準。<\/div>\n<div class=\"doc-plain\">其他實用技能學程分發有關事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">招生簡章應記載招生科別、班數、名額及其他相關事項，並應於分發前，報教育部備查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區分發時，每班應預留一至二個名額，供身心障礙學生適性輔導安置作業；各班無適性輔導安置之學生者，該預留名額，得列入續招名額。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區作業小組得依各校科別特性，於簡章訂定身心障礙學生安置就讀之相關安全注意事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實用技能學程入學應以免試方式為之，並採志願序分發。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">相同志願報名人數未逾招生名額者，全額錄取；相同志願報名人數逾招生名額者，採第十二點順序及第十三點比序方式錄取。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">年度申請分發，以一次為限，並不得申請改分發。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區作業小組按學生志願序分發；分發對象優先順序如下：<\/div>\n<div class=\"doc-plain\">曾選習國民中學技藝教育課程應屆畢業生或具同等學力者。<\/div>\n<div class=\"doc-plain\">曾選習國民中學技藝教育課程非應屆畢業生或具同等學力者。<\/div>\n<div class=\"doc-plain\">未曾選習國民中學技藝教育課程應屆畢業生或具同等學力者。<\/div>\n<div class=\"doc-plain\">未曾選習國民中學技藝教育課程非應屆畢業生或具同等學力者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前點相同順序之比序及應檢附之文件如下：<\/div>\n<div class=\"doc-plain\">曾選習國民中學技藝教育課程應屆或非應屆畢業生或具同等學力者：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">曾參加各直轄市、縣(市)政府主辦之技藝競賽獲獎或成果展獲獎，且為低收入戶：獲獎及低收入戶證明文件。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">曾參加各直轄市、縣(市)政府主辦之技藝競賽獲獎或成果展獲獎：獲獎證明文件。<\/div>\n<div class=\"doc-plain\">低收入戶：低收入戶證明文件。<\/div>\n<div class=\"doc-plain\">中低收入戶：中低收入戶證明文件。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">職群綜合表現積分：國民中學技藝教育修習職群證明書；有特殊表現者，其證明文件。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">依前五目依序比序結果均相同時，由各分區作業小組訂定優先分發順序。<\/div>\n<div class=\"doc-plain\">未曾選習國民中學技藝教育課程應屆或非應屆畢業生或具同等學力者：<\/div>\n<div class=\"doc-plain\">低收入戶：低收入戶證明文件。<\/div>\n<div class=\"doc-plain\">中低收入戶：中低收入戶證明文件。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">特殊表現及國民中學綜合活動領域前五學期平均成績，二者加總後之分數高低進行分發：成績證明文件；有特殊表現者，其證明文件。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發實用技能學程之報名文件及方式如下：<\/div>\n<div class=\"doc-plain\">曾選習國中技藝教育應屆及非應屆畢(結)業生之報名文件：　　　　    <\/div>\n<div class=\"doc-plain\">分發就讀高級中等學校實用技能學程報名A表(如附件一)。　　　　<\/div>\n<div class=\"doc-plain\">選修職群轉化分數之修習證明書。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">參加各直轄市、縣(市)政府主辦技藝競賽或成果展，獲獎之證明文件(無者免附)。<\/div>\n<div class=\"doc-plain\">鄉(鎮、市、區)公所低收入戶或中低收入戶證明文件(無者免附)。<\/div>\n<div class=\"doc-plain\">技藝教育相關之特殊表現證明文件(無者免附)。<\/div>\n<div class=\"doc-plain\">未曾選習國中技藝教育應屆及非應屆畢(結)業生之報名文件：　　　　   <\/div>\n<div class=\"doc-plain\">分發就讀高級中等學校實用技能學程報名B表(如附件二)。　　　　<\/div>\n<div class=\"doc-plain\">鄉(鎮、市、區)公所低收入戶或中低收入戶證明文件(無者免附)。<\/div>\n<div class=\"doc-plain\">國民中學綜合活動領域前五學期平均成績證明。<\/div>\n<div class=\"doc-plain\">技藝教育相關之特殊表現證明文件(無者免附)<\/div>\n<div class=\"doc-plain\">報名方式：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">國民中學收齊並審核報名表件後，於簡章所定期限前，送達該分區作業小組。<\/div>\n<div class=\"doc-plain\">跨區或非應屆畢業生或具同等學力者，應親自或以郵寄方式報名。<\/div>\n<div class=\"doc-plain\">每位學生報名，以一分發區為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第十三點第一款第五目職群綜合表現積分，分類如下：<\/div>\n<div class=\"doc-plain\">技藝教育課程修習點數。<\/div>\n<div class=\"doc-plain\">修習相關職群成績轉化分數，或修習之所有職群之平均分數。<\/div>\n<div class=\"doc-plain\">特殊表現得分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前點第一款技藝教育課程修習點數，指修習技藝教育每週修習節數及每學期修習職群數二項之點數總和；其每週修習節數，每一節為一點，修習職群數，每一職群為二點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第十五點第二款修習課程成績轉換分數，指學生所修習技藝教育各職群成績之轉化分數。<\/div>\n<div class=\"doc-plain\">          前項轉化分數，分類如下：<\/div>\n<div class=\"doc-plain\"><img class=\"law-image\" src=\"data:image/gif;base64,R0lGODlhaAArAHcAMSH+GlNvZnR3YXJlOiBNaWNyb3NvZnQgT2ZmaWNlACH5BAEAAAAALAMAAwBiACUAgAAAAAAAAALZhI+py+0PT5i0xouz3rz7D4biSJZiYDZoOq7s4r5dLCd0jd0Gtc9TD9DhHsKVkXMMSoYZ4dJ5QcWgTBuRVrE4fghqdbk9KbxfpUo8tvEkZMaNaz2HdFMYsAkH0t3t7TveFWgnd2cmaNXnZgi2s1ZYFMa4KGkmNdPj4pR5CDj4qAiWp2G0GVnniXpaNvrJliW6qLqa05pGGOv6qrvL27sbJ8tpWzsbcaoZGVoModUFpSkKuzxNXW19jZ2tvc3dParrLQOXGL6BVS7eiU7yt27S7s6eSR5v7PhRAAA7\" alt=\"原稿圖片\" style=\"width:104px;max-width:100%;height:auto\">修習相關職群成績轉化分數：以該班所有獲得成績之學生數計算之，並計算至小數第二位；其計算公式如下：<\/div>\n<div class=\"doc-plain\">修習之所有職群之平均分數：學生所選習全部職群之成績平均分數。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">前項各款轉化分數，以最優者採計之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第十五點第三款特殊表現得分，規定如下：<\/div>\n<div class=\"doc-plain\">特殊表現，指與報名職群相關之特殊優異表現，包括競賽、科展、觀摩發表或其他表現。但已用於第十三點第一款第一目及第二目之競賽項目，不包括在內。<\/div>\n<div class=\"doc-plain\">特殊表現與職群相關性及其得分，應由各分區作業小組訂定，並納入招生簡章。<\/div>\n<div class=\"doc-plain\">各類特殊表現之得分基準，全國級為六分至八分，區域級為四分至六分，直轄市、縣(市)級為二分至四分。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區作業小組之承辦學校完成分發作業後，分區作業小組應召開會議，審核錄取名單。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各分區作業小組應於放榜日期，公告錄取名單，並以書面通知學生錄取及報到相關事項；錄取名單應函送各招生學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">錄取學生應於指定時間完成報到手續；未於指定期間完成報到手續者，撤銷其分發錄取資格。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">招生學校各科、班於學生報到後仍有缺額者，得由各校自行辦理續招；其錄取順序、比序及審核程序，應依本要點規定為之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">分發報到後未滿十五人之班級，招生學校得報各該主管機關核准後不開班；已報到之學生，由該分區作業小組協調改分發，不受第十一點第三項規定之限制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點未規定事項，得由各分區作業小組定之。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國101年 5月2日部授教中(三)字第1010506659B號令。<\/div>\n<div class=\"history-paragraph\">2.中華民國112年5月1日教育部臺教授國部字第 1120030458A 號令修正。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校辦理實用技能學程作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為補助高級中等學校(以下簡稱學校)辦理實用技能學程(以下簡稱本學程)，強化學生實務技能及就業能力，培育基礎產業人力，並鼓勵學生適性選讀本學程，特訂定本要點。\n本要點補助之對象如下：\n學生：就讀公、私立學校本學程，並具有中華民國國籍者。但其就讀學校係經本署指定辦理本學程專班者，得不受國籍之限制。\n學校：辦理本學程之公立學校。\n前點第一款學生，免納學費，並就教育部公告之當學年度雜費收費數額，免納雜費；其免納之學費及雜費，由本署依下列規定補助之：\n免納學費之補助：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。\n免納雜費之補助：\n由本署每學期依教育部公告之當學年度學校雜費收費數額，全額補助。\n學生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有關規定外，不得重複申請本項補助。\n重讀、轉學或復學之學生，於原學期已申請本項補助者，不得重複申請。但依其條件得申請本項補助額度優於原學期已申請之雜費補助者，得就扣除原學期雜費補助額度後之差額申請補助。\n本項補助之申請程序、本署核撥學校經費總額之計算、學生違反補助規定之處理，及學生因故離校時，學校應退還本署之經費比率，準用教育部補助高級中等學校學生學費實施要點第五點及第六點規定。\n第二點第二款學校，除其就讀本學程之學生依前點規定免納學費及雜費外，得向本署申請補助；其補助項目及基準如下：\n開班費用：各年級以班為單位之開班費用，包括鐘點費及行政費用；各群科每年每班之補助基準，規定如附件。\n輔導分發作業費用：臺北市及高雄市立學校辦理分區實用技能學程輔導分發所需行政作業費用；其補助金額，依實際需求決定。\n前點補助款，依下列規定計算：\n國立學校：依前點第一款補助基準，全額補助開班費用。\n直轄市、縣(市)立學校：應依「中央對直轄市及縣(市)政府補助\n辦法」所定財力分級予以補助；其補助比率如下：\n開班費用：第一級者，最高補助核定金額百分之二十五；第二級者，最高補助百分之三十；第三級者，最高補助百分之三十五；第四級者，最高補助百分之四十；第五級者，最高補助百分之四十五。但學校由本署改隸屬直轄市者，最高補助百分之五十。\n輔導分發作業費用：第一級者，最高補助核定金額百分之五十；第二級者，最高補助百分之六十；第三級者，最高補助百分之七十；第四級者，最高補助百分之七十五；第五級者，最高補助百分之八十。\n第四點補助款，其申請及核定程序如下：\n開班費用：國立學校應於每學期本署規定之期限內，向本署申請，經審查核定補助金額及通知學校後，由學校掣據報本署撥款；直轄市、縣(市)立學校，向各該政府申請，經審查經費需求後，彙整列冊及掣據，報本署核定補助金額及撥款。\n輔導分發作業費用：由學校擬具輔導分發作業計畫，報臺北市、高雄市政府審查經費需求後，轉報本署核定補助金額及撥款。\n第四點補助款，國立高級中等學校及直轄市、縣(市)政府應於每學期結束後二個月內，辦理核結相關事宜。\n前二點核撥及核結，均應依教育部補(捐)助及委辦經費核撥結報作業要點   規定辦理。\n本署得依實際需要，邀集專家學者及機關、學校代表組成小組，至學校查核辦理情形；查核結果有改善必要者，應通知學校限期改善；其改善情形，得作為次年度核定本補助之參據。","history":"1.中華民國106年6月15日臺教國署高字第1060060562B號訂定，並自中華民國106年8月1日生效。\n2.中華民國107年10月3日教育部臺教國署高字第 1070111969B 號令修正部分規定，並自即日生效。\n3.中華民國110年3月2日教育部臺教國署高字第 1100009298B號令修正第8點，並自即日生效。\n4.中華民國112年7月7日教育部臺教國署高字第 1120086977A號令修正「教育部國民及學前教育署補助高級中等學校辦理實用技能學程作業要點」第4點附件，自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)為補助高級中等學校(以下簡稱學校)辦理實用技能學程(以下簡稱本學程)，強化學生實務技能及就業能力，培育基礎產業人力，並鼓勵學生適性選讀本學程，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助之對象如下：<\/div>\n<div class=\"doc-plain\">學生：就讀公、私立學校本學程，並具有中華民國國籍者。但其就讀學校係經本署指定辦理本學程專班者，得不受國籍之限制。<\/div>\n<div class=\"doc-plain\">學校：辦理本學程之公立學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前點第一款學生，免納學費，並就教育部公告之當學年度雜費收費數額，免納雜費；其免納之學費及雜費，由本署依下列規定補助之：<\/div>\n<div class=\"doc-plain\">免納學費之補助：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。<\/div>\n<div class=\"doc-plain\">免納雜費之補助：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">由本署每學期依教育部公告之當學年度學校雜費收費數額，全額補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">學生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有關規定外，不得重複申請本項補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">重讀、轉學或復學之學生，於原學期已申請本項補助者，不得重複申請。但依其條件得申請本項補助額度優於原學期已申請之雜費補助者，得就扣除原學期雜費補助額度後之差額申請補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">本項補助之申請程序、本署核撥學校經費總額之計算、學生違反補助規定之處理，及學生因故離校時，學校應退還本署之經費比率，準用教育部補助高級中等學校學生學費實施要點第五點及第六點規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第二點第二款學校，除其就讀本學程之學生依前點規定免納學費及雜費外，得向本署申請補助；其補助項目及基準如下：<\/div>\n<div class=\"doc-plain\">開班費用：各年級以班為單位之開班費用，包括鐘點費及行政費用；各群科每年每班之補助基準，規定如附件。<\/div>\n<div class=\"doc-plain\">輔導分發作業費用：臺北市及高雄市立學校辦理分區實用技能學程輔導分發所需行政作業費用；其補助金額，依實際需求決定。 <\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前點補助款，依下列規定計算：<\/div>\n<div class=\"doc-plain\">國立學校：依前點第一款補助基準，全額補助開班費用。<\/div>\n<div class=\"doc-plain\">直轄市、縣(市)立學校：應依「中央對直轄市及縣(市)政府補助<\/div>\n<div class=\"doc-plain\">        辦法」所定財力分級予以補助；其補助比率如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">開班費用：第一級者，最高補助核定金額百分之二十五；第二級者，最高補助百分之三十；第三級者，最高補助百分之三十五；第四級者，最高補助百分之四十；第五級者，最高補助百分之四十五。但學校由本署改隸屬直轄市者，最高補助百分之五十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">輔導分發作業費用：第一級者，最高補助核定金額百分之五十；第二級者，最高補助百分之六十；第三級者，最高補助百分之七十；第四級者，最高補助百分之七十五；第五級者，最高補助百分之八十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第四點補助款，其申請及核定程序如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">開班費用：國立學校應於每學期本署規定之期限內，向本署申請，經審查核定補助金額及通知學校後，由學校掣據報本署撥款；直轄市、縣(市)立學校，向各該政府申請，經審查經費需求後，彙整列冊及掣據，報本署核定補助金額及撥款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">輔導分發作業費用：由學校擬具輔導分發作業計畫，報臺北市、高雄市政府審查經費需求後，轉報本署核定補助金額及撥款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第四點補助款，國立高級中等學校及直轄市、縣(市)政府應於每學期結束後二個月內，辦理核結相關事宜。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前二點核撥及核結，均應依教育部補(捐)助及委辦經費核撥結報作業要點   規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得依實際需要，邀集專家學者及機關、學校代表組成小組，至學校查核辦理情形；查核結果有改善必要者，應通知學校限期改善；其改善情形，得作為次年度核定本補助之參據。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國106年6月15日臺教國署高字第1060060562B號訂定，並自中華民國106年8月1日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國107年10月3日教育部臺教國署高字第 1070111969B 號令修正部分規定，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國110年3月2日教育部臺教國署高字第 1100009298B號令修正第8點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4.中華民國112年7月7日教育部臺教國署高字第 1120086977A號令修正「教育部國民及學前教育署補助高級中等學校辦理實用技能學程作業要點」第4點附件，自即日生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校產業特殊需求類科要點","content":"教育部國民及學前教育署(以下簡稱本署)為配合國家經濟建設發展，鼓勵設有產業特殊需求類科之高級中等學校(以下簡稱學校)開設實務技能學習課程，連結產業人力需求，培育相關人才，及以完全免試入學方式，吸引學生就讀，並落實高級中等學校多元入學招生辦法第九條規定，特訂定本要點。\n本要點所稱產業特殊需求類科，指該類科具有下列二款以上情形者：\n傳統、重要及基礎之行職業，具有急迫需求或轉型困難。\n產業技術傳承困難，有人力斷層之虞。\n學生就讀意願或就業意願較低。\n設施、設備投資成本高。\n產業特殊需求類科之範圍如下：\n專業群科：\n機械群：模具科、鑄造科、板金科、機械木模科及配管科。\n動力機械群：重機科、農業機械科及軌道車輛科。\n化工群：紡織科及染整科。\n設計群：家具木工科及陶瓷工程科。\n土木與建築群：土木科及空間測繪科。\n農業群：農場經營科、野生動物保育科、畜產保健科、森林科、園藝科及造園科。\n食品群：水產食品科。\n海事群：航海科及輪機科。\n水產群：漁業科及水產養殖科。\n商業與管理群：航運管理科。\n家政群：照顧服務科。\n實用技能學程群科：\n機械群：機械板金科、模具技術科及鑄造技術科。\n動力機械群：機車修護科及塗裝技術科。\n化工群：染整技術科。\n設計群：裝潢技術科、竹木工藝科。\n土木與建築群：營造技術科。\n農業群：農業技術科、畜產加工科、休閒農業科、茶葉技術科、園藝技術科及造園技術科。\n食品群：水產食品加工科。\n海事群：船舶機電科。\n水產群：水產養殖技術科、休閒漁業科及漁具製作科。\n電機電子群：水電技術科。\n學校符合下列規定之一者，得依本要點申請補助：\n設有前點所定產業特殊需求類科。\n本署因產業變遷及政策需要，指定辦理前點以外新增之類科。\n具中華民國國籍之學生就讀前點各款類科，或未具中華民國國籍之僑生就讀本署指定前點各款相關類科者，得依本要點規定，予以補助；補助範圍為學費及雜費，其規定如下：\n學費：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。\n雜費：\n依教育部公告之當學年度高級中等學校雜費收費數額，全額補助。\n學生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有規定者外，不得重複申請本補助。\n重讀、轉學或復學之學生，於原就讀期間已申請補助者，不得重複申請。\n但依其重讀、轉學或復學後之就讀類科條件，其得申請本補助之額度優於原已申領之補助者，得就扣除原已補助額度之差額，申請本補助。\n本補助之申請程序、本署核撥學校經費總額之計算、學生違反補助規定之處理及學生因故離校時，學校應退還本署補助款之額度比率，準用教育部補助高級中等學校學生學費實施要點第五點及第六點規定。\n依本要點補助學校之項目、基準及運用，規定如下：\n教學鐘點費：\n課後開設產業特殊需求類科各年級之充實或補強性實習課程者，以學校產業特殊需求類科一年級總班數為最高補助班數，補助教學鐘點費。\n補助金額：每班每節補助金額為新臺幣(以下同)五百五十元；每班最高補助四萬四千元。\n前目補助金額達應繳交全民健康保險補充保險費者，另予補助補充保險費。\n實習材料費：\n以班為基準，每班補助三萬元。\n補助項目，包括開設各年級之實習課程及課後充實或補強性實習課程所需材料費用。\n業務費：\n以科為基準，每科補助五萬元\n學校產業特殊需求類科之專業群科一年級採完全免試入學招生者，每科增加補助十萬元。\n前二目經費，得用於就業輔導、招生宣導、差旅、設備維護、物品與耗材，及產業特殊需求類科行政、教學相關之項目費用。\n前項第一款教學鐘點費之補助，由學校視實際需求，擬具教學計畫書，並依第七點程序，提出申請；學校利用課餘、假日或寒暑假開設課程者，其開設之科目，以充實或補強性實習課程為限，不包括一般科目或專業科目。\n前項教學計畫書內容，應包括依第一、第二學期規劃之教學分配節數，並註明不同會計年度所需之鐘點費，由本署按會計年度撥款。\n學校申請本要點之補助，應於本署規定之期間內，上網填報相關申請表冊，向本署提出。\n補助款應專款專用於辦理產業特殊需求類科相關業務所需；其核撥及結報，依教育部補(捐)助及委辦經費核撥結報作業要點規定辦理。\n學校各該主管機關應將辦理學校之執行成效，列入辦學績效考核重點輔導項目。\n本署為瞭解辦理學校執行成效，得組成專家小組進行視導，每學年以一次為原則。\n前項視導結果，得作為次一學年度審查第六點第一項第二款補助項目之參據。\n執行本要點成效績優學校及各該主管機關相關業務之人員，得依法令規定予以敘獎。\n依本要點申請及使用補助款，應遵行下列事項：\n辦理產業特殊需求類科之課程規劃，應融入該類科職場能力，著重技能 (藝)實務教學及實習，強化與產業合作。\n補助學生之人數，以教育部全國高級中等學校助學補助系統篩選之人數為準。\n就讀產業特殊需求類科學生享有政府其他就學補助、學費減免優待或獎助者，應擇優申請補助，不得重複申請；違反者，應以書面行政處分，\n通知其限期返還重複請領之金額。\n本補助，除免學費及雜費部分外，其餘應依「中央對直轄市及縣(市)政府補助辦法」規定，由本署就各直轄市、縣(市)政府財力級次，給予不同補助比率；屬第一級者，最高補助比率百分之七十；第二級者，百分之八十；第三級者，百分之八十八；第四級者，百分之八十九；第五級者，百分之九十。","history":"1.101年4月23日教育部部授教中(三)字 1010505920C號令修正發布全文8點；並自即日生效。\n2.102年10月14日教育部臺教授國部字第1020084618B號 令 修正 發布名稱及全文(原名稱：產業特殊需求類科免試入學及免學費獎補助作業要點)。\n3.103年8月8日教育部國民及學前教育署臺教國署高字第1030079502B號令修正發布名稱及全文9點，並自即日生效 (原名稱:產業特殊需求類科獎補助作業要點)。\n4.105年8月9日教育部國民及學前教育署臺教國署高字第1050086803B號令，名稱並修正為「教育部國民及學前教育署補助高級中等學校產業特殊需求類科要點」，並自即日生效。\n4.中華民國107年3月28日臺教國署高字第1070025870B號令修正。\n6.中華民國108年4月10日教育部臺教國署高字第1080036427B號令修正發布部分規定，並自即日生效。\n7.中華民國109年7月30日教育部臺教國署高字第 1090081756B 號令修正發布第4點、第8點、第9點，並自即日生效。\n8.中華民國111年7月20日教育部臺教國署高字第 1110086741A 號令修正，並自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)為配合國家經濟建設發展，鼓勵設有產業特殊需求類科之高級中等學校(以下簡稱學校)開設實務技能學習課程，連結產業人力需求，培育相關人才，及以完全免試入學方式，吸引學生就讀，並落實高級中等學校多元入學招生辦法第九條規定，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點所稱產業特殊需求類科，指該類科具有下列二款以上情形者：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">傳統、重要及基礎之行職業，具有急迫需求或轉型困難。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">產業技術傳承困難，有人力斷層之虞。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學生就讀意願或就業意願較低。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">設施、設備投資成本高。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">產業特殊需求類科之範圍如下：<\/div>\n<div class=\"doc-plain\">專業群科：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">機械群：模具科、鑄造科、板金科、機械木模科及配管科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">動力機械群：重機科、農業機械科及軌道車輛科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">化工群：紡織科及染整科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">設計群：家具木工科及陶瓷工程科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">土木與建築群：土木科及空間測繪科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">農業群：農場經營科、野生動物保育科、畜產保健科、森林科、園藝科及造園科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">食品群：水產食品科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">海事群：航海科及輪機科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">水產群：漁業科及水產養殖科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">商業與管理群：航運管理科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">家政群：照顧服務科。<\/div>\n<div class=\"doc-plain\">實用技能學程群科：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">機械群：機械板金科、模具技術科及鑄造技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">動力機械群：機車修護科及塗裝技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">化工群：染整技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">設計群：裝潢技術科、竹木工藝科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">土木與建築群：營造技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">農業群：農業技術科、畜產加工科、休閒農業科、茶葉技術科、園藝技術科及造園技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">食品群：水產食品加工科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">海事群：船舶機電科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">水產群：水產養殖技術科、休閒漁業科及漁具製作科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">電機電子群：水電技術科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校符合下列規定之一者，得依本要點申請補助：<\/div>\n<div class=\"doc-plain\">設有前點所定產業特殊需求類科。<\/div>\n<div class=\"doc-plain\">本署因產業變遷及政策需要，指定辦理前點以外新增之類科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具中華民國國籍之學生就讀前點各款類科，或未具中華民國國籍之僑生就讀本署指定前點各款相關類科者，得依本要點規定，予以補助；補助範圍為學費及雜費，其規定如下：<\/div>\n<div class=\"doc-plain\">學費：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。<\/div>\n<div class=\"doc-plain\">雜費：<\/div>\n<div class=\"doc-plain\">依教育部公告之當學年度高級中等學校雜費收費數額，全額補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">學生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有規定者外，不得重複申請本補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">重讀、轉學或復學之學生，於原就讀期間已申請補助者，不得重複申請。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">但依其重讀、轉學或復學後之就讀類科條件，其得申請本補助之額度優於原已申領之補助者，得就扣除原已補助額度之差額，申請本補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">本補助之申請程序、本署核撥學校經費總額之計算、學生違反補助規定之處理及學生因故離校時，學校應退還本署補助款之額度比率，準用教育部補助高級中等學校學生學費實施要點第五點及第六點規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點補助學校之項目、基準及運用，規定如下：<\/div>\n<div class=\"doc-plain\">教學鐘點費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">課後開設產業特殊需求類科各年級之充實或補強性實習課程者，以學校產業特殊需求類科一年級總班數為最高補助班數，補助教學鐘點費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助金額：每班每節補助金額為新臺幣(以下同)五百五十元；每班最高補助四萬四千元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">前目補助金額達應繳交全民健康保險補充保險費者，另予補助補充保險費。<\/div>\n<div class=\"doc-plain\">實習材料費：<\/div>\n<div class=\"doc-plain\">以班為基準，每班補助三萬元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助項目，包括開設各年級之實習課程及課後充實或補強性實習課程所需材料費用。<\/div>\n<div class=\"doc-plain\">業務費：<\/div>\n<div class=\"doc-plain\">以科為基準，每科補助五萬元<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">學校產業特殊需求類科之專業群科一年級採完全免試入學招生者，每科增加補助十萬元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">前二目經費，得用於就業輔導、招生宣導、差旅、設備維護、物品與耗材，及產業特殊需求類科行政、教學相關之項目費用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項第一款教學鐘點費之補助，由學校視實際需求，擬具教學計畫書，並依第七點程序，提出申請；學校利用課餘、假日或寒暑假開設課程者，其開設之科目，以充實或補強性實習課程為限，不包括一般科目或專業科目。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項教學計畫書內容，應包括依第一、第二學期規劃之教學分配節數，並註明不同會計年度所需之鐘點費，由本署按會計年度撥款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校申請本要點之補助，應於本署規定之期間內，上網填報相關申請表冊，向本署提出。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">補助款應專款專用於辦理產業特殊需求類科相關業務所需；其核撥及結報，依教育部補(捐)助及委辦經費核撥結報作業要點規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校各該主管機關應將辦理學校之執行成效，列入辦學績效考核重點輔導項目。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署為瞭解辦理學校執行成效，得組成專家小組進行視導，每學年以一次為原則。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項視導結果，得作為次一學年度審查第六點第一項第二款補助項目之參據。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">執行本要點成效績優學校及各該主管機關相關業務之人員，得依法令規定予以敘獎。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點申請及使用補助款，應遵行下列事項：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">辦理產業特殊需求類科之課程規劃，應融入該類科職場能力，著重技能 (藝)實務教學及實習，強化與產業合作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">補助學生之人數，以教育部全國高級中等學校助學補助系統篩選之人數為準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">就讀產業特殊需求類科學生享有政府其他就學補助、學費減免優待或獎助者，應擇優申請補助，不得重複申請；違反者，應以書面行政處分，<\/div>\n<div class=\"doc-plain\">      通知其限期返還重複請領之金額。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">本補助，除免學費及雜費部分外，其餘應依「中央對直轄市及縣(市)政府補助辦法」規定，由本署就各直轄市、縣(市)政府財力級次，給予不同補助比率；屬第一級者，最高補助比率百分之七十；第二級者，百分之八十；第三級者，百分之八十八；第四級者，百分之八十九；第五級者，百分之九十。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.101年4月23日教育部部授教中(三)字 1010505920C號令修正發布全文8點；並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.102年10月14日教育部臺教授國部字第1020084618B號 令 修正 發布名稱及全文(原名稱：產業特殊需求類科免試入學及免學費獎補助作業要點)。<br><\/div>\n<div class=\"history-paragraph\">3.103年8月8日教育部國民及學前教育署臺教國署高字第1030079502B號令修正發布名稱及全文9點，並自即日生效 (原名稱:產業特殊需求類科獎補助作業要點)。<br><\/div>\n<div class=\"history-paragraph\">4.105年8月9日教育部國民及學前教育署臺教國署高字第1050086803B號令，名稱並修正為「教育部國民及學前教育署補助高級中等學校產業特殊需求類科要點」，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4.中華民國107年3月28日臺教國署高字第1070025870B號令修正。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">6.中華民國108年4月10日教育部臺教國署高字第1080036427B號令修正發布部分規定，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">7.中華民國109年7月30日教育部臺教國署高字第 1090081756B 號令修正發布第4點、第8點、第9點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">8.中華民國111年7月20日教育部臺教國署高字第 1110086741A 號令修正，並自即日生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校學生校外職場參觀與校外實習及校內併校外實習經費作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為加強高級中等學校(以下簡稱學校)學生職場之實際體驗，鼓勵學生至業界實習，增進其實務知能，並達成與產業接軌及學用合一之目標，特訂定本要點。\n本要點補助對象為設有專業群科或專門學程(包括進修部、實用技能學程、階梯式建教合作班)之學校。\n學校應配合其規劃發展之特色、學生職涯規劃及產業需求，依高級中等學校實習課程實施辦法規定，辦理校外職場參觀與校外實習及校內併校外實習；其辦理方式如下：\n校外職場參觀：學校安排一年級及二年級全部或部分學生，至相關事業機構進行半日或一日之參訪活動，每班每學期以二次為限；綜合型學校三年級學生，亦同。\n校外實習及校內併校外實習：二年級以上全部或部分學生，至事業機構進行六星期以內之實務實習，學生每人每學期以一次為限。\n本要點之補助，每學年辦理一次，申請書表另定之；其申辦程序如下(作業流程及說明，如附件)：\n宣導說明：每年二月底前，由本署辦理學校提報計畫書與申請程序說明會及相關宣導。\n計畫申請：每年三月三十一日前，由學校填報申請書表，直轄　　　　　市、縣（市）政府主管學校應報各該直轄市、縣（市）政府彙　　　　　整後，報本署核定；教育部主管之學校，逕報本署核定。\n計畫審查：每年五月三十一日前，由本署審查學校申請書表。\n核定公告：每年六月三十日前，本署核定計畫書及補助經費，並通知教育部主管之學校及直轄市、縣(市)政府函轉該主管學校審查結果。\n前四款作業時程及每學年度之實際辦理時間，以本署公告或函文規定者為準。\n本署為審查申請案，得聘請學者專家及校長、產業界與機關之代表組　　成審核小組；必要時，得請申請學校列席說明。\n依本要點補助之項目及基準如下：\n校外職場參觀：\n交通費\n(１)租車：每班按班級人數計算車次；學校與事業機構在同一直轄市、縣(市)者，每車次最高補助新臺幣(以下同)八千元；跨直轄市、縣(市)者，每車次最高補助一萬元。\n(２)搭乘大眾運輸工具：離島與偏遠地區學校，另可補助搭乘大眾運輸工具費用，並依相關規定核實報支。\n膳費：辦理一日活動或超過用餐時間者，得補助膳費，學生每人一百元。\n雜費：帶隊教師或行政人員雜費，每班最多補助二人，每人四百元。\n講座鐘點費或指導費：事業機構專家(包括現場師傅)專題演講講座鐘點費或指導費，每人每節八百元；每日最高一千六百元。\n保險費：補助每位學生旅行平安保險四十元及前目專家全民健康保險之補充保險費。\n其他雜支：辦理活動相關雜支，最高按業務費百分之六編列，核實報支。\n校外實習及校內併校外實習：\n實習津貼：參加學生，發給膳費及雜費，每人每日二百五十元，每人每學期最高六千元。\n教師鐘點費：\n輔導鐘點費：教師赴事業機構輔導學生，每星期最高發給三節鐘點費，每節數額比照「公立中小學兼任及代課教師鐘點費支給基準表」高級中等學校之規定；同一申請案，學生每十五人以教師一人輔導為原則。\n授課鐘點費：學校得配合學生就業需求調整課程，校內教師增加教學節數者，發給鐘點費每節數額比照「公立中小學兼任及代課教師鐘點費支給基準表」高級中等學校之規定；課餘時間授課者，發給鐘點費每節五百五十元。\n交通費：教師赴事業機構輔導學生，依實際往返所需交通費核實報支。\n指導費：事業機構專家(包括現場師傅)指導學生，以每節八百元，每日最多八節，每星期最多十二節為原則。\n保險費：補助每位學生個人與事業機構應負擔之勞工保險費、學生團體平安保險費及前目專家全民健康保險之補充保險費。\n其他雜支：辦理活動相關雜支，最高按業務費百分之六編列，核實報支。\n本要點以補助辦理學校之業務費為限。\n依本要點補助之學校為直轄市、縣(市)政府主管之學校者，各直轄市、縣(市)政府應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，按各直轄市及縣(市)政府財力分級表編列相對配合款；直轄市、縣(市)政府財力分級屬第一級者，相對配合款比率為百分之二十，第二級者，相對配合款比率為百分之十五，第三級者，相對配合款比率為百分之十二，第四級者，相對配合款比率為百分之十一，第五級者，相對配合款比率為百分之十。\n學校依本要點獲補助之經費，應專款專用，不得重複申請或補助，並依「教育部補(捐)助及委辦經費核撥結報作業要點」之規定辦理核結作業。\n學校應依核定計畫，分別於當年十二月三十一日及次年七月三十一日前執行完畢，並辦理核結。直轄市、縣(市)政府主管之學校，由各該主管教育行政機關核轉本署辦理核結。\n學校應於每學年結束後一個月內，提出整學年執行成果報告；其報告書格式及內容，由本署定之。\n本署得依學校年度辦理成效，作為下年度核定辦理之參據。\n本署得視需要瞭解學校執行績效。\n受補助學校，應遵行下列規定：\n學校與事業機構應訂定合作意向書或意願書，確保學生及雙方權益。\n學校應訂定學校辦理校外職場參觀與校外實習及校內併校外實習相關作業規定或實施計畫，經實習會議或主管會報通過，陳校長核定後實施。\n學生至校外實習及校內併校外實習，應經家長出具書面同意書；接受學生實習之事業機構應為依法立案之公民營事業機構，且與學生就讀之科別相關。\n為加強學生校外實習及校內併校外實習輔導，瞭解學生學習及生活情況(包括工作環境)，學校應安排各項職能、生活及心理輔導等課程或訓練。\n學校應會同事業機構，為學生及家長辦理實習行前座談會、勞安講習，及其他相關注意事項。\n學校依計畫書辦理校外職場參觀、校外實習及校內併校外實習，應進行學生及事業機構滿意度之調查。\n計畫書之內容有變更必要時，學校應報本署或由直轄市、縣(市)主管教育行政機關核轉本署核定後辦理。\n學校型態實驗教育學校依各該主管機關許可之實驗教育計畫，及非學校型態實驗教育機構依直轄市、縣(市)主管機關許可之實驗教育計畫實施校外職場參觀、校外實習、校內併校外實習課程者，準用本要點之規定予以補助。但申請補助之程序及期限，以本署公告或函文規定者為準。\n非學校型態個人或團體實驗教育之學生，得參與高級中等學校及前項實驗教育學校、機構辦理之課程。","history":"1.中華民國103年1月21日教育部國民及學前教育署臺教國署高字第 1020135465B 號令訂定發布全文9點，並自即日生效。\n2.中華民國104年8月6日臺教國署高字第 1040083959B 號令修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生業界實習和職場體驗經費作業要點」，並自即日生效。\n3.中華民國106年3月20日教育部國民及學前教育署臺教國署高字第 1060004104B 號令修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生職場體驗及業界實習經費作業要點」，並自即日生效。\n4.中華民國107年6月28日臺教國署高字第 1070063681B 號修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生校外職場參觀與校外實習及校內併校外實習經費作業要點」，並自即日生效。\n5.中華民國109年4月29日教育部臺教國署高字第 1090039232B 號令修正發布部分規定，並自即日生效。\n6. 中華民國112年1月18日教育部臺教國署高字第 1120004242A 號令修正第六點、第十點，並自即日起生效。","contentHtml":"<div class=\"doc-plain\">教育部國民及學前教育署(以下簡稱本署)為加強高級中等學校(以下簡稱學校)學生職場之實際體驗，鼓勵學生至業界實習，增進其實務知能，並達成與產業接軌及學用合一之目標，特訂定本要點。<\/div>\n<div class=\"doc-plain\">本要點補助對象為設有專業群科或專門學程(包括進修部、實用技能學程、階梯式建教合作班)之學校。<\/div>\n<div class=\"doc-plain\">學校應配合其規劃發展之特色、學生職涯規劃及產業需求，依高級中等學校實習課程實施辦法規定，辦理校外職場參觀與校外實習及校內併校外實習；其辦理方式如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">校外職場參觀：學校安排一年級及二年級全部或部分學生，至相關事業機構進行半日或一日之參訪活動，每班每學期以二次為限；綜合型學校三年級學生，亦同。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">校外實習及校內併校外實習：二年級以上全部或部分學生，至事業機構進行六星期以內之實務實習，學生每人每學期以一次為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點之補助，每學年辦理一次，申請書表另定之；其申辦程序如下(作業流程及說明，如附件)：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.34em\">宣導說明：每年二月底前，由本署辦理學校提報計畫書與申請程序說明會及相關宣導。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.34em\">計畫申請：每年三月三十一日前，由學校填報申請書表，直轄　　　　　市、縣（市）政府主管學校應報各該直轄市、縣（市）政府彙　　　　　整後，報本署核定；教育部主管之學校，逕報本署核定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.28em\">計畫審查：每年五月三十一日前，由本署審查學校申請書表。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.28em\">核定公告：每年六月三十日前，本署核定計畫書及補助經費，並通知教育部主管之學校及直轄市、縣(市)政府函轉該主管學校審查結果。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.28em\">前四款作業時程及每學年度之實際辦理時間，以本署公告或函文規定者為準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署為審查申請案，得聘請學者專家及校長、產業界與機關之代表組　　成審核小組；必要時，得請申請學校列席說明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點補助之項目及基準如下：<\/div>\n<div class=\"doc-plain\">校外職場參觀：<\/div>\n<div class=\"doc-plain\">交通費<\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">(１)<\/span><span class=\"doc-copy\">租車：每班按班級人數計算車次；學校與事業機構在同一直轄市、縣(市)者，每車次最高補助新臺幣(以下同)八千元；跨直轄市、縣(市)者，每車次最高補助一萬元。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">(２)<\/span><span class=\"doc-copy\">搭乘大眾運輸工具：離島與偏遠地區學校，另可補助搭乘大眾運輸工具費用，並依相關規定核實報支。<\/span><\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">膳費：辦理一日活動或超過用餐時間者，得補助膳費，學生每人一百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">雜費：帶隊教師或行政人員雜費，每班最多補助二人，每人四百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">講座鐘點費或指導費：事業機構專家(包括現場師傅)專題演講講座鐘點費或指導費，每人每節八百元；每日最高一千六百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">保險費：補助每位學生旅行平安保險四十元及前目專家全民健康保險之補充保險費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他雜支：辦理活動相關雜支，最高按業務費百分之六編列，核實報支。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:8.8em\">校外實習及校內併校外實習：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:8.8em\">實習津貼：參加學生，發給膳費及雜費，每人每日二百五十元，每人每學期最高六千元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.4em\">教師鐘點費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.7em\">輔導鐘點費：教師赴事業機構輔導學生，每星期最高發給三節鐘點費，每節數額比照「公立中小學兼任及代課教師鐘點費支給基準表」高級中等學校之規定；同一申請案，學生每十五人以教師一人輔導為原則。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.7em\">授課鐘點費：學校得配合學生就業需求調整課程，校內教師增加教學節數者，發給鐘點費每節數額比照「公立中小學兼任及代課教師鐘點費支給基準表」高級中等學校之規定；課餘時間授課者，發給鐘點費每節五百五十元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">交通費：教師赴事業機構輔導學生，依實際往返所需交通費核實報支。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">指導費：事業機構專家(包括現場師傅)指導學生，以每節八百元，每日最多八節，每星期最多十二節為原則。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">保險費：補助每位學生個人與事業機構應負擔之勞工保險費、學生團體平安保險費及前目專家全民健康保險之補充保險費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他雜支：辦理活動相關雜支，最高按業務費百分之六編列，核實報支。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點以補助辦理學校之業務費為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點補助之學校為直轄市、縣(市)政府主管之學校者，各直轄市、縣(市)政府應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，按各直轄市及縣(市)政府財力分級表編列相對配合款；直轄市、縣(市)政府財力分級屬第一級者，相對配合款比率為百分之二十，第二級者，相對配合款比率為百分之十五，第三級者，相對配合款比率為百分之十二，第四級者，相對配合款比率為百分之十一，第五級者，相對配合款比率為百分之十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校依本要點獲補助之經費，應專款專用，不得重複申請或補助，並依「教育部補(捐)助及委辦經費核撥結報作業要點」之規定辦理核結作業。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應依核定計畫，分別於當年十二月三十一日及次年七月三十一日前執行完畢，並辦理核結。直轄市、縣(市)政府主管之學校，由各該主管教育行政機關核轉本署辦理核結。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應於每學年結束後一個月內，提出整學年執行成果報告；其報告書格式及內容，由本署定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得依學校年度辦理成效，作為下年度核定辦理之參據。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得視需要瞭解學校執行績效。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">受補助學校，應遵行下列規定：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.34em\">學校與事業機構應訂定合作意向書或意願書，確保學生及雙方權益。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校應訂定學校辦理校外職場參觀與校外實習及校內併校外實習相關作業規定或實施計畫，經實習會議或主管會報通過，陳校長核定後實施。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學生至校外實習及校內併校外實習，應經家長出具書面同意書；接受學生實習之事業機構應為依法立案之公民營事業機構，且與學生就讀之科別相關。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">為加強學生校外實習及校內併校外實習輔導，瞭解學生學習及生活情況(包括工作環境)，學校應安排各項職能、生活及心理輔導等課程或訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校應會同事業機構，為學生及家長辦理實習行前座談會、勞安講習，及其他相關注意事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校依計畫書辦理校外職場參觀、校外實習及校內併校外實習，應進行學生及事業機構滿意度之調查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">計畫書之內容有變更必要時，學校應報本署或由直轄市、縣(市)主管教育行政機關核轉本署核定後辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:3.22em\">學校型態實驗教育學校依各該主管機關許可之實驗教育計畫，及非學校型態實驗教育機構依直轄市、縣(市)主管機關許可之實驗教育計畫實施校外職場參觀、校外實習、校內併校外實習課程者，準用本要點之規定予以補助。但申請補助之程序及期限，以本署公告或函文規定者為準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:3.22em\">非學校型態個人或團體實驗教育之學生，得參與高級中等學校及前項實驗教育學校、機構辦理之課程。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國103年1月21日教育部國民及學前教育署臺教國署高字第 1020135465B 號令訂定發布全文9點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國104年8月6日臺教國署高字第 1040083959B 號令修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生業界實習和職場體驗經費作業要點」，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國106年3月20日教育部國民及學前教育署臺教國署高字第 1060004104B 號令修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生職場體驗及業界實習經費作業要點」，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4.中華民國107年6月28日臺教國署高字第 1070063681B 號修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校學生校外職場參觀與校外實習及校內併校外實習經費作業要點」，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">5.中華民國109年4月29日教育部臺教國署高字第 1090039232B 號令修正發布部分規定，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">6. 中華民國112年1月18日教育部臺教國署高字第 1120004242A 號令修正第六點、第十點，並自即日起生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校遴聘業界專家協同教學作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為鼓勵學校依高級中等學校遴聘業界專家協同教學實施辦法(以下簡稱本辦法)之規定，遴聘業界專家協同教學，促進理論與實務結合，提升技職教育價值，特訂定本要點。\n本要點適用於技術型高級中等學校、普通型高級中等學校附設專業群、科(包括進修部、實用技能學程)及綜合型高級中等學校專門學程 (以下簡稱學校)。\n本要點所稱業界專家，指具有本辦法第三條第一項各款所定資格之一者。前項業界實務工作經驗，依本辦法第三條第二項規定，不包括於短期補習班或學校從事之教學工作。但藝術類之業界專家於藝術類學校、幼兒園或托嬰中心之教學工作，不在此限。\n學校配合群、科特色或產業發展需要，得規劃專任教師與業界專家共同教學之課程，並共同授課。\n學校遴聘業界專家協同教學，得向本署申請補助；其申請補助，應於每年四月三十日前擬具協同教學計畫書，報本署審查通過後，核定其計畫書及補助經費。\n前項申請，以學年為單位；其補助經費，分別於第一及第二學期核撥。\n第二項計畫書之格式及內容，由本署另定之。\n學校每班之協同授課時數，每學期以七星期，每星期以六節為限；同一個科目，得由業界專家一人以上協同授課；每一業界專家至多得至四所學校協同授課，於同一學校同一科，以協同教授二個科目為限。\n業界專家教授之課程，依本辦法第七條規定，以依高級中等學校實習課程實施辦法開設之二年級、三年級實習課程為限。\n依本要點補助之項目如下：\n業界專家\n鐘點費：每人每節新臺幣(以下同)八百元。\n交通費：每人每學期每科目以七次為限，覈實報支。\n學校\n業務費：包括印刷費、教材製作費、設備維護、物品費及耗材費，以辦理科數為補助基準；每科依協同授課節數予以補助，至多四萬元為限。\n教學材料費：每節補助五百元，每校以補助十五萬元為限。\n直轄市、縣(市)政府主管之學校依本要點獲准補助者，本署應依中央對直轄市及縣(市)政府補助辦法規定，依各該政府財力級次，給予不同補助，各地方政府並應編列相對配合款。直轄市、縣(市)政府財力分級屬第一級者，最高補助百分之八十；第二級者，最高補助百分之八十五；第三級者，最高補助百分之八十八；第四級者，最高補助百分之八十九；第五級者，最高補助百分之九十。\n本署應於每年三月三十一日前，辦理本要點補助之申請說明會及相關宣導；受理申請案後，應於五月三十一日前審查完竣，並於六月三十日前核定公告審查結果。\n前項作業期限，以本署公告或函文規定者為主。\n本署為審查申請案，得邀請學者專家及機關代表，組成審查小組；必要時得請學校列席說明。\n本要點補助經費之核結，應依教育部補(捐)助及委辦經費核撥結報作業要點規定辦理。\n學校應於每學年結束後二個月內，提出學年執行成效報告，作為本署核定次學年度補助參據。\n學校執行本要點之補助，違反經核定之計畫書、本要點或其他相關法令之規定者，本署得廢止全部或部分之補助處分，並以書面行政處分通知學校限期返還已核撥之補助款。","history":"1.99年5月28日教育部部授教中(三)字第 0990503640C 號令訂定。\n2.102年3月18日臺教國署高字第 1020022107A  號令修正名稱及全文，並自中華民國102年8月1日生效(原名稱：「教育部補助高級中等學校遴聘業界專家協同教學作業要點」)。\n3.103年3月21日教育部國民及學前教育署臺教國署高字第 1030019956B  號令修正發布第5點，並自即日生效。\n4.103年12月10日教育部國民及學前教育署臺教國署高字第 1030134173B 號令修正發布全文9點，並自即日生效。\n5.105年5月10日臺教國署高字第1050048096B號令修正全文11點，並自即日起生效。\n6.中華民國108年5月24日教育部臺教國署高字第 1080043058B  號令修正發布部分規定，並自即日生效。\n7.中華民國110年1月21日教育部臺教國署高字第 1090164384B 號令修正「教育部國民及學前教育署補助高級中等學校遴聘業界專家協同教學作業要點」第10點，並自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)為鼓勵學校依高級中等學校遴聘業界專家協同教學實施辦法(以下簡稱本辦法)之規定，遴聘業界專家協同教學，促進理論與實務結合，提升技職教育價值，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點適用於技術型高級中等學校、普通型高級中等學校附設專業群、科(包括進修部、實用技能學程)及綜合型高級中等學校專門學程 (以下簡稱學校)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點所稱業界專家，指具有本辦法第三條第一項各款所定資格之一者。前項業界實務工作經驗，依本辦法第三條第二項規定，不包括於短期補習班或學校從事之教學工作。但藝術類之業界專家於藝術類學校、幼兒園或托嬰中心之教學工作，不在此限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校配合群、科特色或產業發展需要，得規劃專任教師與業界專家共同教學之課程，並共同授課。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校遴聘業界專家協同教學，得向本署申請補助；其申請補助，應於每年四月三十日前擬具協同教學計畫書，報本署審查通過後，核定其計畫書及補助經費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項申請，以學年為單位；其補助經費，分別於第一及第二學期核撥。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">第二項計畫書之格式及內容，由本署另定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校每班之協同授課時數，每學期以七星期，每星期以六節為限；同一個科目，得由業界專家一人以上協同授課；每一業界專家至多得至四所學校協同授課，於同一學校同一科，以協同教授二個科目為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">業界專家教授之課程，依本辦法第七條規定，以依高級中等學校實習課程實施辦法開設之二年級、三年級實習課程為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點補助之項目如下：<\/div>\n<div class=\"doc-plain\">業界專家<\/div>\n<div class=\"doc-plain\">鐘點費：每人每節新臺幣(以下同)八百元。<\/div>\n<div class=\"doc-plain\">交通費：每人每學期每科目以七次為限，覈實報支。<\/div>\n<div class=\"doc-plain\">學校<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">業務費：包括印刷費、教材製作費、設備維護、物品費及耗材費，以辦理科數為補助基準；每科依協同授課節數予以補助，至多四萬元為限。<\/div>\n<div class=\"doc-plain\">教學材料費：每節補助五百元，每校以補助十五萬元為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">直轄市、縣(市)政府主管之學校依本要點獲准補助者，本署應依中央對直轄市及縣(市)政府補助辦法規定，依各該政府財力級次，給予不同補助，各地方政府並應編列相對配合款。直轄市、縣(市)政府財力分級屬第一級者，最高補助百分之八十；第二級者，最高補助百分之八十五；第三級者，最高補助百分之八十八；第四級者，最高補助百分之八十九；第五級者，最高補助百分之九十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署應於每年三月三十一日前，辦理本要點補助之申請說明會及相關宣導；受理申請案後，應於五月三十一日前審查完竣，並於六月三十日前核定公告審查結果。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項作業期限，以本署公告或函文規定者為主。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署為審查申請案，得邀請學者專家及機關代表，組成審查小組；必要時得請學校列席說明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助經費之核結，應依教育部補(捐)助及委辦經費核撥結報作業要點規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應於每學年結束後二個月內，提出學年執行成效報告，作為本署核定次學年度補助參據。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校執行本要點之補助，違反經核定之計畫書、本要點或其他相關法令之規定者，本署得廢止全部或部分之補助處分，並以書面行政處分通知學校限期返還已核撥之補助款。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.99年5月28日教育部部授教中(三)字第 0990503640C 號令訂定。<\/div>\n<div class=\"history-paragraph\"><br>2.102年3月18日臺教國署高字第 1020022107A  號令修正名稱及全文，並自中華民國102年8月1日生效(原名稱：「教育部補助高級中等學校遴聘業界專家協同教學作業要點」)。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.103年3月21日教育部國民及學前教育署臺教國署高字第 1030019956B  號令修正發布第5點，並自即日生效。<\/div>\n<div class=\"history-paragraph\">4.103年12月10日教育部國民及學前教育署臺教國署高字第 1030134173B 號令修正發布全文9點，並自即日生效。<\/div>\n<div class=\"history-paragraph\"><br>5.105年5月10日臺教國署高字第1050048096B號令修正全文11點，並自即日起生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">6.中華民國108年5月24日教育部臺教國署高字第 1080043058B  號令修正發布部分規定，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">7.中華民國110年1月21日教育部臺教國署高字第 1090164384B 號令修正「教育部國民及學前教育署補助高級中等學校遴聘業界專家協同教學作業要點」第10點，並自即日生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校專業群科專任教師赴公民營機構研習或研究作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為鼓勵高級中等學校專業群科專任教師赴國內公民營機構或產業(以下簡稱機構)研習或研究(以下簡稱研習)，強化教師實務教學經驗，縮短學用落差，並藉由教師與機構交流，協助開發學生就業市場，特訂定本要點。\n本要點用詞，定義如下：\n專業科目或技術科目：指學校依課程綱要所定部定與校訂專業科目及實習科目。\n廣度研習：指學校配合發展特色及教師教學領域，與機構共同規劃辦理為期三日至五日之研習活動。\n深度研習：指學校配合教學領域，由同校或跨校有意願之教師組成團隊，與機構共同訂定研習主題，進行為期十日至三十日之研習活動。\n深耕研習：指任職滿六年以上之學校專任教師，以帶職帶薪及下列方式之一，進行二個月以上一年以下之連續性或週期性研習：\n赴機構進行與實務教學相關之研習。\n教師率同學生赴機構進行專題製作。\n與技專校院教師共同赴機構研習。\n本要點適用於技術型高級中等學校、普通型高級中等學校附設專業群、科(包括進修部、實用技能學程)及綜合型高級中等學校專門學程(以下簡稱學校)之專任專業科目或技術科目教師或專業及技術教師(以下簡稱教師)。\n廣度研習及深度研習，應於每年寒暑假期間或學期中辦理；其經費補助原則如下：\n補助學校用以支付機構辦理研習所需費用：\n補助金額：每梯次每人每日新臺幣(以下同)一千元。\n補助項目：講座鐘點費、全民健康保險補充保費、資料蒐集費、誤餐費(包括研習之教師)、印刷費、國內旅費、場地使用費、交通費(以機構至參訪實作現場路程之交通費為限)及雜支。\n補助材料費：研習時有使用材料必要者，得補助實作材料費：其經費，依研習課程設計編列，每梯次每人每日最高五百元。\n膳宿費：教師參加深度研習者，補助膳費每人每日二百五十元，及住宿費每人每日一千六百元。\n補助學校業務費：\n補助金額：廣度研習每梯次最高三萬元；深度研習每梯次最高六萬元。\n補助項目：包括資料蒐集費、誤餐費、印刷費、國內旅費、工讀費及雜支等。\n前項補助經費之審查基準如下：\n研習機構之形象及可運用資源：百分之三十。\n課程內容實務性及專業性：百分之三十。\n預期成效：百分之二十。\n例年辦理成效推廣：百分之二十。\n深耕研習之教師，應依學校之規定，在不影響校務運作原則下，配合學期制，帶職帶薪至機構研習。\n深耕研習之經費補助項目如下：\n代理教師費用或代課鐘點費。\n學校業務費：按每人每月一萬元計算，供學校作為推動課程教學所用。\n前項補助經費之審查基準如下：\n機構之形象及可運用資源：百分之三十。\n研習主題及內容之產業價值：百分之三十。\n預期成果對教學之助益：百分之四十。\n深耕研習教師、學校與機構三者之間權利義務關係：\n教師以帶職帶薪至機構研習期間，由學校按月支付薪俸，年資及考核併計。\n機構應與學校及教師簽訂契約書，約定研發保密規定、智慧財產歸屬、出勤規範及其他有關事項。\n教師至機構研習，學校得至機構訪視，並作成紀錄；機構每月應將教師於研習期間之出勤情形報學校備查。學校或機構發現教師有違反契約書、本要點或相關法令規定者，應立即向本署提出報告。\n教師應於研習期滿時立即返校服務，並於返校三個月內，提交研習報告予所屬學校；並應編撰實務教材或開授實務課程。\n教師參加研習後六年內，不得再提出研習之申請。\n教師於研習期間，每週工作時數(包括返校上課及赴機構研習時間)應達四十小時以上。\n教師參加研習後，其回學校服務期間，應為研習期間之二倍；教師履行服務期限屆滿前，不得退休、資遣、辭聘、調任或申請進修、研究。但因教學或業務特殊需要，經教師評審委員會審查通過及服務學校同意，並報經學校主管機關核准，或私立學校與教師另有約定者，不在此限。\n教師於研習期間，經機構指派出差至國(境)外者，應經學校核准同意並報各學校主管機關備查，直轄市、縣(市)政府並應層報本署。\n直轄市、縣(市)政府主管之學校依本要點獲准補助者，各該政府應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，按各直轄市及縣(市)政府財力分級表編列相對配合款；直轄市、縣(市)政府財力分級屬第一級者，最高補助百分之八十；第二級者，最高補助百分之八十五；第三級者，最高補助百分之八十八；第四級者，最高補助百分之八十九；第五級者，最高補助百分之九十。\n本要點作業時程如下：\n每年十一月下旬前：本署指定之總召集學校應辦理本要點所定各類研習申請說明會及相關宣導事宜。\n每年十二月下旬前：十二月上旬前，教師應擬具深耕研習計畫書經學校初審通過；學校應於十二月下旬前，提暑假、寒假申辦廣度、深度研習計畫書(如附件一)及深耕研習計畫書(如附件二)。\n翌年一月上旬前：本署組成審查小組審查前款申請案；經審查通過者，由本署核定其計畫書及補助金額，並通知學校。\n翌年一月中旬前：開放學校教師上網報名寒假梯次廣度、深度研習。\n翌年二月上旬前：一月下旬前，教師應擬具深耕研習計畫書經學校初審通過；學校應於二月上旬前，提暑假申辦廣度、深度研習計畫書(如附件一)及深耕研習計畫書(如附件二)。\n翌年三月下旬前：本署組成審查小組審查前款申請案；經審查通過者，由本署核定其計畫書及補助金額，並通知學校。\n翌年三月中旬前：開放學校教師上網報名暑假梯次廣度、深度研習。\n前七款所定作業時程實際辦理期間，以本署公告或函文規定時間為準。\n依本要點申請補助之請撥、核結作業，應依教育部補(捐)助及委辦 經費核撥結報作業要點規定辦理。\n學校應於計畫書執行結束後二個月內，提交成果報告及經費收支結算表，送本署辦理結案。成果報告之內容應包括研習主題、研習教師資料、研習機構介紹、研習對教師實務能力之提升、研習對教學之助益等。\n學校應建立管考機制，依計畫確實執行，以達成計畫目標。\n學校執行本要點之補助，違反核定之計畫書、本要點或其他相關法令之規定者，本署得廢止全部或部分之補助處分，並以書面行政處分通知學校限期返還已核撥之補助款。\n本署得視實際需要，自行或指定學校不定期派員至機構查訪。\n本署應檢視年度辦理成效，作為下年度繼續辦理參據；並對學校績優人員，予以獎勵。","history":"1.99年6月7日教育部部授教中(三)字第0990503637C號令訂定。\n2.102年3月18日教育部國民及學前教育署臺教國署高字第1020022105B 號令修正發布名稱及全文 7 點，並自即日生效(原名稱：教育部補助高級中等學校職業類科專任教師赴公民營機構研習服務作業要點)。\n3.102年12月4日教育部國民及學前教育署臺教國署高字第1020114233B 號令修正發布全文6點，並自即日生效。\n4.103年12月19日臺教國署高字第 1030142881B 號函修正發布全文6點，並自即日起生效。\n5.106年2月9日教育部國民及學前教育署臺教國署高字第106000394 9B號令修正發布名稱及全文12點，並自即日生效(原名稱：教育部國民及 學前教育署補助高級中等學校職業類科專任教師赴公民營機構研習服務作業要點)。\n6.107年3月5日臺教國署高字第1070015854B號修正第7點，並自即日生效。\n7. 110年1月25日教育部臺教國署高字第 1100003032B 號令修正「教育部國民及學前教育署補助高級中等學校專業群科專任教師赴公民營機構研習或研究作業要點」第9點，並自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)為鼓勵高級中等學校專業群科專任教師赴國內公民營機構或產業(以下簡稱機構)研習或研究(以下簡稱研習)，強化教師實務教學經驗，縮短學用落差，並藉由教師與機構交流，協助開發學生就業市場，特訂定本要點。<\/div>\n<div class=\"doc-plain\">本要點用詞，定義如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">專業科目或技術科目：指學校依課程綱要所定部定與校訂專業科目及實習科目。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">廣度研習：指學校配合發展特色及教師教學領域，與機構共同規劃辦理為期三日至五日之研習活動。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">深度研習：指學校配合教學領域，由同校或跨校有意願之教師組成團隊，與機構共同訂定研習主題，進行為期十日至三十日之研習活動。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">深耕研習：指任職滿六年以上之學校專任教師，以帶職帶薪及下列方式之一，進行二個月以上一年以下之連續性或週期性研習：<\/div>\n<div class=\"doc-plain\">赴機構進行與實務教學相關之研習。  <\/div>\n<div class=\"doc-plain\">教師率同學生赴機構進行專題製作。  <\/div>\n<div class=\"doc-plain\">與技專校院教師共同赴機構研習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點適用於技術型高級中等學校、普通型高級中等學校附設專業群、科(包括進修部、實用技能學程)及綜合型高級中等學校專門學程(以下簡稱學校)之專任專業科目或技術科目教師或專業及技術教師(以下簡稱教師)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">廣度研習及深度研習，應於每年寒暑假期間或學期中辦理；其經費補助原則如下：<\/div>\n<div class=\"doc-plain\">補助學校用以支付機構辦理研習所需費用：<\/div>\n<div class=\"doc-plain\">補助金額：每梯次每人每日新臺幣(以下同)一千元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助項目：講座鐘點費、全民健康保險補充保費、資料蒐集費、誤餐費(包括研習之教師)、印刷費、國內旅費、場地使用費、交通費(以機構至參訪實作現場路程之交通費為限)及雜支。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助材料費：研習時有使用材料必要者，得補助實作材料費：其經費，依研習課程設計編列，每梯次每人每日最高五百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">膳宿費：教師參加深度研習者，補助膳費每人每日二百五十元，及住宿費每人每日一千六百元。<\/div>\n<div class=\"doc-plain\">補助學校業務費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助金額：廣度研習每梯次最高三萬元；深度研習每梯次最高六萬元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">補助項目：包括資料蒐集費、誤餐費、印刷費、國內旅費、工讀費及雜支等。<\/div>\n<div class=\"doc-plain\">前項補助經費之審查基準如下：<\/div>\n<div class=\"doc-plain\">研習機構之形象及可運用資源：百分之三十。<\/div>\n<div class=\"doc-plain\">課程內容實務性及專業性：百分之三十。<\/div>\n<div class=\"doc-plain\">預期成效：百分之二十。<\/div>\n<div class=\"doc-plain\">例年辦理成效推廣：百分之二十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">深耕研習之教師，應依學校之規定，在不影響校務運作原則下，配合學期制，帶職帶薪至機構研習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">深耕研習之經費補助項目如下：<\/div>\n<div class=\"doc-plain\">代理教師費用或代課鐘點費。  <\/div>\n<div class=\"doc-plain\">學校業務費：按每人每月一萬元計算，供學校作為推動課程教學所用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項補助經費之審查基準如下：<\/div>\n<div class=\"doc-plain\"> 機構之形象及可運用資源：百分之三十。<\/div>\n<div class=\"doc-plain\">研習主題及內容之產業價值：百分之三十。<\/div>\n<div class=\"doc-plain\">預期成果對教學之助益：百分之四十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">深耕研習教師、學校與機構三者之間權利義務關係：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師以帶職帶薪至機構研習期間，由學校按月支付薪俸，年資及考核併計。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">機構應與學校及教師簽訂契約書，約定研發保密規定、智慧財產歸屬、出勤規範及其他有關事項。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師至機構研習，學校得至機構訪視，並作成紀錄；機構每月應將教師於研習期間之出勤情形報學校備查。學校或機構發現教師有違反契約書、本要點或相關法令規定者，應立即向本署提出報告。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師應於研習期滿時立即返校服務，並於返校三個月內，提交研習報告予所屬學校；並應編撰實務教材或開授實務課程。<\/div>\n<div class=\"doc-plain\">教師參加研習後六年內，不得再提出研習之申請。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師於研習期間，每週工作時數(包括返校上課及赴機構研習時間)應達四十小時以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師參加研習後，其回學校服務期間，應為研習期間之二倍；教師履行服務期限屆滿前，不得退休、資遣、辭聘、調任或申請進修、研究。但因教學或業務特殊需要，經教師評審委員會審查通過及服務學校同意，並報經學校主管機關核准，或私立學校與教師另有約定者，不在此限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">教師於研習期間，經機構指派出差至國(境)外者，應經學校核准同意並報各學校主管機關備查，直轄市、縣(市)政府並應層報本署。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">直轄市、縣(市)政府主管之學校依本要點獲准補助者，各該政府應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，按各直轄市及縣(市)政府財力分級表編列相對配合款；直轄市、縣(市)政府財力分級屬第一級者，最高補助百分之八十；第二級者，最高補助百分之八十五；第三級者，最高補助百分之八十八；第四級者，最高補助百分之八十九；第五級者，最高補助百分之九十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點作業時程如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">每年十一月下旬前：本署指定之總召集學校應辦理本要點所定各類研習申請說明會及相關宣導事宜。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">每年十二月下旬前：十二月上旬前，教師應擬具深耕研習計畫書經學校初審通過；學校應於十二月下旬前，提暑假、寒假申辦廣度、深度研習計畫書(如附件一)及深耕研習計畫書(如附件二)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">翌年一月上旬前：本署組成審查小組審查前款申請案；經審查通過者，由本署核定其計畫書及補助金額，並通知學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">翌年一月中旬前：開放學校教師上網報名寒假梯次廣度、深度研習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\"> 翌年二月上旬前：一月下旬前，教師應擬具深耕研習計畫書經學校初審通過；學校應於二月上旬前，提暑假申辦廣度、深度研習計畫書(如附件一)及深耕研習計畫書(如附件二)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">翌年三月下旬前：本署組成審查小組審查前款申請案；經審查通過者，由本署核定其計畫書及補助金額，並通知學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">翌年三月中旬前：開放學校教師上網報名暑假梯次廣度、深度研習。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">前七款所定作業時程實際辦理期間，以本署公告或函文規定時間為準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依本要點申請補助之請撥、核結作業，應依教育部補(捐)助及委辦 經費核撥結報作業要點規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應於計畫書執行結束後二個月內，提交成果報告及經費收支結算表，送本署辦理結案。成果報告之內容應包括研習主題、研習教師資料、研習機構介紹、研習對教師實務能力之提升、研習對教學之助益等。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應建立管考機制，依計畫確實執行，以達成計畫目標。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校執行本要點之補助，違反核定之計畫書、本要點或其他相關法令之規定者，本署得廢止全部或部分之補助處分，並以書面行政處分通知學校限期返還已核撥之補助款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得視實際需要，自行或指定學校不定期派員至機構查訪。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署應檢視年度辦理成效，作為下年度繼續辦理參據；並對學校績優人員，予以獎勵。 <\/div>","historyHtml":"<div class=\"history-paragraph\">1.99年6月7日教育部部授教中(三)字第0990503637C號令訂定。<br><\/div>\n<div class=\"history-paragraph\">2.102年3月18日教育部國民及學前教育署臺教國署高字第1020022105B 號令修正發布名稱及全文 7 點，並自即日生效(原名稱：教育部補助高級中等學校職業類科專任教師赴公民營機構研習服務作業要點)。<br><\/div>\n<div class=\"history-paragraph\">3.102年12月4日教育部國民及學前教育署臺教國署高字第1020114233B 號令修正發布全文6點，並自即日生效。<br><\/div>\n<div class=\"history-paragraph\">4.103年12月19日臺教國署高字第 1030142881B 號函修正發布全文6點，並自即日起生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">5.106年2月9日教育部國民及學前教育署臺教國署高字第106000394 9B號令修正發布名稱及全文12點，並自即日生效(原名稱：教育部國民及 學前教育署補助高級中等學校職業類科專任教師赴公民營機構研習服務作業要點)。<br><\/div>\n<div class=\"history-paragraph\">6.107年3月5日臺教國署高字第1070015854B號修正第7點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">7. 110年1月25日教育部臺教國署高字第 1100003032B 號令修正「教育部國民及學前教育署補助高級中等學校專業群科專任教師赴公民營機構研習或研究作業要點」第9點，並自即日生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校提升學生實習實作能力計畫經費作業要點","content":"宗旨\n教育部國民及學前教育署(以下簡稱本署)，為增進高級中等學校學生實務知識及技能，提升學生就業能力及準備，培養具有專業技術能力及符合產業需求之務實致用人才，特訂定本要點。\n補助對象\n本要點補助對象為設有專業群科或專門學程之高級中等學校(以下簡稱學校)。\n前項學校，包括進修部、實用技能學程、建教合作班及實驗教育。\n前項實驗教育，指依學校型態實驗教育實施條例及公立高級中等以下學校委託私人辦理實驗教育條例辦理之實驗教育學校。\n補助範圍\n本要點補助之範圍如下：\n學校就各專業群科或專門學程所對應行業別之技能需求，依高級中等學校課程綱要規定，開設校訂課程之實習科目及安排專業訓練項目，所需之實習材料費。\n學校輔導專業群科或專門學程所對應職場就業能力直接相關之技術證照檢定考試，所需之輔導費(包括訓練材料費及報名費)。\n學校就培訓入圍全國技能競賽決賽之學生，安排教師訓練學生強化技能，所需之訓練指導費。\n學校就培訓入選「國際技能競賽」之正選國手，且為在學學生或學校提名並在校培訓者，於培訓期間所需之材料費。\n前款培訓期間，全程實際指導教師減授每週基本教學節數所需之鐘點費。\n補助項目及基準\n本要點補助之項目及基準如下：\n實習材料費：就學校依前點第一款規定所實際開班科目，補助如下：\n每校補助科目總數，以專業群科(學程)二、三年級核定班級數之二倍為限。\n每一實習科目之經費，依修習人數、群科屬性核給，每年最高不超過一萬六千元。\n證照考試輔導費：依前點第二款所辦理乙級或單一級別證照檢定，補助技術證照檢定考試輔導之經費；其補助上限如下：\n訓練材料費：學生每人每年一千元。\n證照考試報名費：學生每人每職類一千元，合計不超過二千元；\n同一職類、同一級別，每生以申請補助一次為限。\n訓練指導費：依前點第三款所安排教師，於課餘時間訓練學生強化技能之經費；每一職類指導教師於課餘時間訓練節數以四十八節為限，每節最高五百五十元，並得包括全民健康保險之補充保險費。\n國手培訓材料費：依前點第四款培訓入選之正選國手，且為在學學生或學校提名，並有訓練事實者，每一職類得補助材料費，最高三十萬元。\n減授每週基本教學節數鐘點費：依前點第五款規定，於前點第四款培訓期間，以全學期為原則，每一職類指導教師一人，得減授基本教學節數，每週最高八節；並按減授節數補助鐘點費。\n辦理時程\n本要點之辦理時程如下：\n宣導說明：每年二月底前，由本署辦理申請說明會及相關宣導。\n計畫申請：\n實習材料費、證照考試輔導費、訓練指導費：每年三月三十一日前，由學校檢附計畫書及經費申請表，向本署提出申請。\n國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：\n每年主辦單位公告入選名單後二星期內，由學校檢附計畫書及經費申請表，函報本署提出申請。\n計畫審查：\n實習材料費、證照考試輔導費、訓練指導費：每年六月十五日前，由本署完成審查。\n國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：\n申請截止日後二星期內，由本署完成審查。\n核定公告：\n實習材料費、證照考試輔導費、訓練指導費：每年六月三十日前，由本署核定並公告審查結果。\n國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：\n經審查符合本要點補助資格者，由本署核定並公告審查結果。\n前四款作業時程，以本署公告或函文規定者為準；逾期申請者，不予受理。計畫作業流程及說明，規定如附件。\n審查作業\n由本署聘請學者專家，及學校校長、產業界與主管機關代表組成審核\n小組進行審查；必要時，得請學校代表列席說明。\n經費編列、使用及核結\n本要點補助經費，應依下列規定辦理：\n本要點以補助學校之業務費為限，各該主管機關應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，計畫型補助款，各直轄市、縣(市)政府應依其財力級次，編列相對配合款。財力級次第一級者，相對配合款比率為百分之二十；第二級者，百分之十五；第三級者，百分之十二；第四級者，百分之十一；第五級者，百分之十。\n獲核定補助之學校，應依本署核定經費額度及期限辦理請領事宜。\n學校使用本要點補助費，應專款專用，不得向本署、教育部或其他機關重複申請補助；並應依「教育部補(捐)助及委辦經費核撥結報作業要點」之規定辦理核撥及結報。\n學校應依核定計畫，於當年十二月三十一日及次年七月三十一日前執行完畢，並辦理核結；直轄市政府主管之公、私立高級中等學校及縣(市)立高級中等學校，應由各該政府主管機關層轉本署辦理核結。\n成效考核\n學校應於每學年結束後一個月內，就本案執行成果，提出完整執行成果報告，其內容包括學生就業相關證照取得數量、執行經費達成率、發展實習實作教材教案融入課程數量及競賽成績；成果報告書格式及內容，由本署定之。\n本署得依學校年度辦理成效，作為後續核定本要點補助之參據。\n本署得視需要，組成督導或考核小組，對學校執行績效，辦理訪視及考核；小組成員，由本署就學者專家，及學校校長、產業界及機關代表組成聘(派)兼之。\n注意事項\n學校應遵行下列事項：\n學校辦理本要點補助之相關活動，應以該申請類科主要就業職場所需之證照輔導及技能訓練為主。\n參與本要點相關活動之學生，應列冊管理，並追蹤其後續就業情況。\n學校於課餘期間辦理本要點相關活動，應加強校園安全維護，確保參與學生安全。\n申請實習課程材料費之科目應實際開班；其無法開班而需更換科目者，應於規定期限內提出計畫書修正，或報本署終止該項計畫，並繳回補助款。\n證照考試報名費未執行部分之剩餘款，全數繳回本署。\n計畫書之執行有變更必要者，學校應報本署或由各該直轄市、縣(市)政府主管機關層轉本署核定後辦理。\n依高級中等以下教育階段非學校型態實驗教育實施條例辦理機構實驗教育之實驗教育機構，其實驗教育計畫經直轄市、縣(市)主管機關許可者，準用本要點規定予以補助。但申請補助之程序及期限，本署得另行公告或以函文通知。\n參與非學校型態實驗教育之個人或團體實驗教育學生，得參加學校與前項實驗教育機構辦理之課程及活動，並準用本要點規定予以補助。\n本要點未規定事項，悉依相關法令規定辦理。","history":"1.中華民國104年7月6日臺教國署高字第 1040071321B 號令訂定發布全文10點，並自即日起生效。\n2.中華民國107年6月28日臺教國署高字第 1070062991B 號修正第7點，並自即日生效。\n3.中華民國108年3月26日教育部臺教國署高字第 1080023069B 號令修正發布全文11點，並自即日生效。\n4.中華民國109年4月21日教育部臺教國署高字第 1090035669B 號令修正發布第3點、第4點、第5點，並自即日生效。","contentHtml":"<div class=\"doc-plain\">宗旨<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)，為增進高級中等學校學生實務知識及技能，提升學生就業能力及準備，培養具有專業技術能力及符合產業需求之務實致用人才，特訂定本要點。<\/div>\n<div class=\"doc-plain\">補助對象<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助對象為設有專業群科或專門學程之高級中等學校(以下簡稱學校)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項學校，包括進修部、實用技能學程、建教合作班及實驗教育。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項實驗教育，指依學校型態實驗教育實施條例及公立高級中等以下學校委託私人辦理實驗教育條例辦理之實驗教育學校。<\/div>\n<div class=\"doc-plain\">補助範圍<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助之範圍如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校就各專業群科或專門學程所對應行業別之技能需求，依高級中等學校課程綱要規定，開設校訂課程之實習科目及安排專業訓練項目，所需之實習材料費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校輔導專業群科或專門學程所對應職場就業能力直接相關之技術證照檢定考試，所需之輔導費(包括訓練材料費及報名費)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校就培訓入圍全國技能競賽決賽之學生，安排教師訓練學生強化技能，所需之訓練指導費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校就培訓入選「國際技能競賽」之正選國手，且為在學學生或學校提名並在校培訓者，於培訓期間所需之材料費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">前款培訓期間，全程實際指導教師減授每週基本教學節數所需之鐘點費。<\/div>\n<div class=\"doc-plain\">補助項目及基準<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助之項目及基準如下：<\/div>\n<div class=\"doc-plain\">實習材料費：就學校依前點第一款規定所實際開班科目，補助如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">每校補助科目總數，以專業群科(學程)二、三年級核定班級數之二倍為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">每一實習科目之經費，依修習人數、群科屬性核給，每年最高不超過一萬六千元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">證照考試輔導費：依前點第二款所辦理乙級或單一級別證照檢定，補助技術證照檢定考試輔導之經費；其補助上限如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">訓練材料費：學生每人每年一千元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">證照考試報名費：學生每人每職類一千元，合計不超過二千元；<\/div>\n<div class=\"doc-plain\">　　　　同一職類、同一級別，每生以申請補助一次為限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">訓練指導費：依前點第三款所安排教師，於課餘時間訓練學生強化技能之經費；每一職類指導教師於課餘時間訓練節數以四十八節為限，每節最高五百五十元，並得包括全民健康保險之補充保險費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">國手培訓材料費：依前點第四款培訓入選之正選國手，且為在學學生或學校提名，並有訓練事實者，每一職類得補助材料費，最高三十萬元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">減授每週基本教學節數鐘點費：依前點第五款規定，於前點第四款培訓期間，以全學期為原則，每一職類指導教師一人，得減授基本教學節數，每週最高八節；並按減授節數補助鐘點費。<\/div>\n<div class=\"doc-plain\">辦理時程<\/div>\n<div class=\"doc-plain\">　　本要點之辦理時程如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">宣導說明：每年二月底前，由本署辦理申請說明會及相關宣導。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">計畫申請：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">實習材料費、證照考試輔導費、訓練指導費：每年三月三十一日前，由學校檢附計畫書及經費申請表，向本署提出申請。<\/div>\n<div class=\"doc-plain\">國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">每年主辦單位公告入選名單後二星期內，由學校檢附計畫書及經費申請表，函報本署提出申請。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">計畫審查：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">實習材料費、證照考試輔導費、訓練指導費：每年六月十五日前，由本署完成審查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">申請截止日後二星期內，由本署完成審查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">核定公告：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">實習材料費、證照考試輔導費、訓練指導費：每年六月三十日前，由本署核定並公告審查結果。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">國手培訓材料費及指導教師減授每週基本教學節數所需鐘點費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">經審查符合本要點補助資格者，由本署核定並公告審查結果。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">前四款作業時程，以本署公告或函文規定者為準；逾期申請者，不予受理。計畫作業流程及說明，規定如附件。<\/div>\n<div class=\"doc-plain\">審查作業<\/div>\n<div class=\"doc-plain\">　　由本署聘請學者專家，及學校校長、產業界與主管機關代表組成審核<\/div>\n<div class=\"doc-plain\">　　小組進行審查；必要時，得請學校代表列席說明。<\/div>\n<div class=\"doc-plain\">經費編列、使用及核結<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助經費，應依下列規定辦理：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">本要點以補助學校之業務費為限，各該主管機關應依教育部與所屬機關(構)對直轄市及縣(市)政府計畫型補助款處理原則規定，計畫型補助款，各直轄市、縣(市)政府應依其財力級次，編列相對配合款。財力級次第一級者，相對配合款比率為百分之二十；第二級者，百分之十五；第三級者，百分之十二；第四級者，百分之十一；第五級者，百分之十。<\/div>\n<div class=\"doc-plain\">獲核定補助之學校，應依本署核定經費額度及期限辦理請領事宜。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校使用本要點補助費，應專款專用，不得向本署、教育部或其他機關重複申請補助；並應依「教育部補(捐)助及委辦經費核撥結報作業要點」之規定辦理核撥及結報。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校應依核定計畫，於當年十二月三十一日及次年七月三十一日前執行完畢，並辦理核結；直轄市政府主管之公、私立高級中等學校及縣(市)立高級中等學校，應由各該政府主管機關層轉本署辦理核結。<\/div>\n<div class=\"doc-plain\">成效考核<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應於每學年結束後一個月內，就本案執行成果，提出完整執行成果報告，其內容包括學生就業相關證照取得數量、執行經費達成率、發展實習實作教材教案融入課程數量及競賽成績；成果報告書格式及內容，由本署定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得依學校年度辦理成效，作為後續核定本要點補助之參據。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署得視需要，組成督導或考核小組，對學校執行績效，辦理訪視及考核；小組成員，由本署就學者專家，及學校校長、產業界及機關代表組成聘(派)兼之。<\/div>\n<div class=\"doc-plain\">注意事項<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應遵行下列事項：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校辦理本要點補助之相關活動，應以該申請類科主要就業職場所需之證照輔導及技能訓練為主。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">參與本要點相關活動之學生，應列冊管理，並追蹤其後續就業情況。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學校於課餘期間辦理本要點相關活動，應加強校園安全維護，確保參與學生安全。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">申請實習課程材料費之科目應實際開班；其無法開班而需更換科目者，應於規定期限內提出計畫書修正，或報本署終止該項計畫，並繳回補助款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">證照考試報名費未執行部分之剩餘款，全數繳回本署。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">計畫書之執行有變更必要者，學校應報本署或由各該直轄市、縣(市)政府主管機關層轉本署核定後辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依高級中等以下教育階段非學校型態實驗教育實施條例辦理機構實驗教育之實驗教育機構，其實驗教育計畫經直轄市、縣(市)主管機關許可者，準用本要點規定予以補助。但申請補助之程序及期限，本署得另行公告或以函文通知。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">參與非學校型態實驗教育之個人或團體實驗教育學生，得參加學校與前項實驗教育機構辦理之課程及活動，並準用本要點規定予以補助。<\/div>\n<div class=\"doc-plain\">本要點未規定事項，悉依相關法令規定辦理。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國104年7月6日臺教國署高字第 1040071321B 號令訂定發布全文10點，並自即日起生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國107年6月28日臺教國署高字第 1070062991B 號修正第7點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國108年3月26日教育部臺教國署高字第 1080023069B 號令修正發布全文11點，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4.中華民國109年4月21日教育部臺教國署高字第 1090035669B 號令修正發布第3點、第4點、第5點，並自即日生效。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校辦理綜合高中學程作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為鼓勵高級中等學校辦理綜合高中學程，特訂定本要點。\n本要點適用於普通型高級中等學校、技術型高級中等學校及綜合型高級中等學校(以下簡稱學校)。\n本要點補助之項目如下：\n經常門：包括規劃、宣導、職業試探輔導、教師研習、超支鐘點費、教學材料費、設備維護費及其他相關費用。\n資本門：開設或充實學程所需設備。\n本要點之補助基準如下：\n經常門：\n基本補助額度：依本署年度預算經費定之。\n加權補助額度：以目前之基本補助額度為基準，另依班級數及學程數增加補助額度。\n資本門：\n基本補助額度：依班級數及學程數計算。\n新增學程補助：以前目之基本補助額度為基準，另依新增學程數增加補助額度。\n核准辦理綜合高中學程之學校，得另補助核准辦理至開辦後第一年所需之資本門經費。\n前項核准辦理至開辦後第一年之經費核定基準，以學校各該主管機關核定之班級數及學程數為準；開辦第一年後各年之經費核定基準，以各該學年度全校實際辦理班級數及學程數為準。\n學校有特殊需求者，得經本署認定後，調高其補助金額，不受前三項規定之限制。\n學校申請之經常門補助金額，宣導經費不得少於百分之十(停辦學校得免編列)，教師研習經費不得少於百分之十；超支鐘點費得支用於空白課程；教學材料費，學生每人至多新臺幣二百元。\n本補助依「中央對直轄市及縣(市)政府補助辦法」之規定及配合本署年度預算經費，就各直轄市、縣(市)政府財力級次，給予不同補助比率。屬第一級者，最高補助百分之七十；第二級者，最高百分之八十；第三級者，最高百分之八十五；第四級者，最高百分之八十八；第五級者，最高百分之九十；直轄市、縣(市)政府應編列相對配合款。\n學校自停止辦理綜合高中學程年度起，不予補助資本門；經常門補助，仍依本要點之經常門補助基準，核撥至所有綜合高中學生畢業之學年度為止。\n本署每年於三月三十一日前，依本要點規定核算學校之經常門及資本門補助款額度。\n學校依前項核算之補助款額度，研提計畫及經費需求表(如附件)，經學校各該主管機關審查通過後核撥。\n補助經費應專款專用；其核撥及結報，應依教育部補(捐)助及委辦經費核撥結報作業要點辦理。\n學校支用本要點所定補助款，有違反本要點或其他法令規定者，得取消其原補助之全部或部分經費；已撥款者，應繳回補助經費。","history":"中華民國108年4月11日教育部臺教國署高字第 1080016385B 號令修正發布全文 10點，名稱並修正為「教育部國民及學前教育署補助高級中等學校辦理綜合高中學程作業要點」，並自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部國民及學前教育署(以下簡稱本署)為鼓勵高級中等學校辦理綜合高中學程，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點適用於普通型高級中等學校、技術型高級中等學校及綜合型高級中等學校(以下簡稱學校)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點補助之項目如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">經常門：包括規劃、宣導、職業試探輔導、教師研習、超支鐘點費、教學材料費、設備維護費及其他相關費用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">資本門：開設或充實學程所需設備。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點之補助基準如下：<\/div>\n<div class=\"doc-plain\">經常門：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">基本補助額度：依本署年度預算經費定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">加權補助額度：以目前之基本補助額度為基準，另依班級數及學程數增加補助額度。<\/div>\n<div class=\"doc-plain\">資本門：<\/div>\n<div class=\"doc-plain\">基本補助額度：依班級數及學程數計算。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">新增學程補助：以前目之基本補助額度為基準，另依新增學程數增加補助額度。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">核准辦理綜合高中學程之學校，得另補助核准辦理至開辦後第一年所需之資本門經費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項核准辦理至開辦後第一年之經費核定基準，以學校各該主管機關核定之班級數及學程數為準；開辦第一年後各年之經費核定基準，以各該學年度全校實際辦理班級數及學程數為準。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校有特殊需求者，得經本署認定後，調高其補助金額，不受前三項規定之限制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校申請之經常門補助金額，宣導經費不得少於百分之十(停辦學校得免編列)，教師研習經費不得少於百分之十；超支鐘點費得支用於空白課程；教學材料費，學生每人至多新臺幣二百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本補助依「中央對直轄市及縣(市)政府補助辦法」之規定及配合本署年度預算經費，就各直轄市、縣(市)政府財力級次，給予不同補助比率。屬第一級者，最高補助百分之七十；第二級者，最高百分之八十；第三級者，最高百分之八十五；第四級者，最高百分之八十八；第五級者，最高百分之九十；直轄市、縣(市)政府應編列相對配合款。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校自停止辦理綜合高中學程年度起，不予補助資本門；經常門補助，仍依本要點之經常門補助基準，核撥至所有綜合高中學生畢業之學年度為止。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本署每年於三月三十一日前，依本要點規定核算學校之經常門及資本門補助款額度。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校依前項核算之補助款額度，研提計畫及經費需求表(如附件)，經學校各該主管機關審查通過後核撥。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">補助經費應專款專用；其核撥及結報，應依教育部補(捐)助及委辦經費核撥結報作業要點辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校支用本要點所定補助款，有違反本要點或其他法令規定者，得取消其原補助之全部或部分經費；已撥款者，應繳回補助經費。<\/div>","historyHtml":"<div class=\"history-paragraph\">中華民國108年4月11日教育部臺教國署高字第 1080016385B 號令修正發布全文 10點，名稱並修正為「教育部國民及學前教育署補助高級中等學校辦理綜合高中學程作業要點」，並自即日生效。<\/div>"},{"title":"綜合高級中學實施要點","content":"目的\n教育部(以下簡稱本部)為規範辦理綜合高級中學之學校(以下簡稱各校)辦理類型、課程、輔導、師資、學生進路、組織員額及評鑑與諮詢輔導等事項，特訂定本要點。\n辦理類型\n單一學校型：由單一學校提供本要點所規定辦理綜合高中之充分必要條件的類型。\n社區聯合型︰指由社區內兩校以上合作提供辦理綜合高中之充分必要條件的類型。\n課程\n綜合高中之課程由各校依綜合高級中學課程綱要妥善規劃。\n各校應組成課程發展委員會，依本要點訂定或適時修正課程，提教務會議討論通過後，報主管教育行政機關核定後實施。\n輔導\n除依學生輔導之相關法規外，各校應於輔導工作委員會下成立輔導小組。學生輔導宜涵蓋學習、生活與生涯輔導等方面。\n學生於修業期間之選課輔導須兼顧課程之統整、試探及分化功能。學校應輔導學生自第二年起選擇未來進路，並修習與進路相符應之課程。\n師資\n利用現有教師資源，透過校內或校外第二專長進修活動，加強教師在職進修與知能發展，調整其任教科目。\n因課程需要而另聘師資確有困難者，該科目之任教教師每週兼課及代課總時數得酌予放寬，但不得超過九小時。\n為應教學實際需要，各校得依本部有關規定與他校合聘教師，該教師在他校授課之時數得與本校授課時數合併計算，或聘任他校專任教師擔任兼代課教師，該兼代課教師支援他校教學准以公假辦理；其校內外兼代課總時數合計不得超過九小時。\n公立學校教師經各校依規定排課後，基本授課時數仍不足者，其擔任各校排定之學生輔導、指導社團活動、學生團體自習、協辦校務行政、重補修課程及進修學校正規課程等時數，得併計教師基本授課時數；私立學校得視實際需要比照辦理。\n學生進路\n升學：可參加大學、四技、二專各種多元入學管道，升讀專科以上學校。\n就業：得參加技能檢定、直接就業或參加職訓機構辦理之短期專精訓練，進入職場就業。\n組織員額\n綜合高中專任教師員額編制，每班以二點五人為原則。但工業、農業及海事水產職業學校辦理綜合高中課程者，每班置三人。\n各校得置學程主任，由校長就專任教師中聘兼之。但專門學程主任得由職業類科主任兼任。\n各校技士、技佐員額配置依國立職業學校組織員額設置基準第四點第二款第一目辦理。\n各校為處理學生之輔導、課務、課外活動、招生等業務，得依各校需要增置組長一至三人。\n第二款學程主任及前款組長，比照同級兼任行政職務教師(組長或科主任)減少授課時數。\n評鑑與諮詢輔導\n本部得針對綜合高中辦理情形進行評鑑。\n本部為協助各校解決辦理過程中所遭遇之各項問題，得按年度委託辦理諮詢輔導專案，輔導各校落實綜合高中理念與精神，達成辦理成效。\n各校應充分配合評鑑與諮詢輔導專案，接受訪視及各項輔導工作。\n諮詢輔導專案總體成效檢核結果，作為各主管機關停辦綜合高中及本部核定各校年度補助款之參考依據。\n本要點未規定者，依綜合高級中學課程綱要及相關法令規定。","history":"1.90年10月26日教育部(90)臺技(一)字第 90130123 號令訂定發布全文 10 點。\n2.91年5月30日教育部臺(九一)技(一)字第 91074045 號令修正發布全文 10 點；並自91年5月30日起生效。\n3.95年7月3日教育部臺技(一)字第 0950074981C 號令修正發布全文 9 點；並自即日生效。\n4.101年2月4日教育部部授教中(三)字第 1010500328D號令修正發布第3點、第9點，並自即日生效。","contentHtml":"<div class=\"doc-plain\">目的<\/div>\n<div class=\"doc-plain\">教育部(以下簡稱本部)為規範辦理綜合高級中學之學校(以下簡稱各校)辦理類型、課程、輔導、師資、學生進路、組織員額及評鑑與諮詢輔導等事項，特訂定本要點。<\/div>\n<div class=\"doc-plain\">辦理類型<\/div>\n<div class=\"doc-plain\">單一學校型：由單一學校提供本要點所規定辦理綜合高中之充分必要條件的類型。<\/div>\n<div class=\"doc-plain\">社區聯合型︰指由社區內兩校以上合作提供辦理綜合高中之充分必要條件的類型。<\/div>\n<div class=\"doc-plain\">課程<\/div>\n<div class=\"doc-plain\">綜合高中之課程由各校依綜合高級中學課程綱要妥善規劃。<\/div>\n<div class=\"doc-plain\">各校應組成課程發展委員會，依本要點訂定或適時修正課程，提教務會議討論通過後，報主管教育行政機關核定後實施。<\/div>\n<div class=\"doc-plain\">輔導<\/div>\n<div class=\"doc-plain\">除依學生輔導之相關法規外，各校應於輔導工作委員會下成立輔導小組。學生輔導宜涵蓋學習、生活與生涯輔導等方面。<\/div>\n<div class=\"doc-plain\">學生於修業期間之選課輔導須兼顧課程之統整、試探及分化功能。學校應輔導學生自第二年起選擇未來進路，並修習與進路相符應之課程。<\/div>\n<div class=\"doc-plain\">師資<\/div>\n<div class=\"doc-plain\">利用現有教師資源，透過校內或校外第二專長進修活動，加強教師在職進修與知能發展，調整其任教科目。<\/div>\n<div class=\"doc-plain\">因課程需要而另聘師資確有困難者，該科目之任教教師每週兼課及代課總時數得酌予放寬，但不得超過九小時。<\/div>\n<div class=\"doc-plain\">為應教學實際需要，各校得依本部有關規定與他校合聘教師，該教師在他校授課之時數得與本校授課時數合併計算，或聘任他校專任教師擔任兼代課教師，該兼代課教師支援他校教學准以公假辦理；其校內外兼代課總時數合計不得超過九小時。<\/div>\n<div class=\"doc-plain\">公立學校教師經各校依規定排課後，基本授課時數仍不足者，其擔任各校排定之學生輔導、指導社團活動、學生團體自習、協辦校務行政、重補修課程及進修學校正規課程等時數，得併計教師基本授課時數；私立學校得視實際需要比照辦理。<\/div>\n<div class=\"doc-plain\">學生進路<\/div>\n<div class=\"doc-plain\">升學：可參加大學、四技、二專各種多元入學管道，升讀專科以上學校。<\/div>\n<div class=\"doc-plain\">就業：得參加技能檢定、直接就業或參加職訓機構辦理之短期專精訓練，進入職場就業。<\/div>\n<div class=\"doc-plain\">組織員額<\/div>\n<div class=\"doc-plain\">綜合高中專任教師員額編制，每班以二點五人為原則。但工業、農業及海事水產職業學校辦理綜合高中課程者，每班置三人。<\/div>\n<div class=\"doc-plain\">各校得置學程主任，由校長就專任教師中聘兼之。但專門學程主任得由職業類科主任兼任。<\/div>\n<div class=\"doc-plain\">各校技士、技佐員額配置依國立職業學校組織員額設置基準第四點第二款第一目辦理。<\/div>\n<div class=\"doc-plain\">各校為處理學生之輔導、課務、課外活動、招生等業務，得依各校需要增置組長一至三人。<\/div>\n<div class=\"doc-plain\">第二款學程主任及前款組長，比照同級兼任行政職務教師(組長或科主任)減少授課時數。<\/div>\n<div class=\"doc-plain\">評鑑與諮詢輔導<\/div>\n<div class=\"doc-plain\">本部得針對綜合高中辦理情形進行評鑑。<\/div>\n<div class=\"doc-plain\">本部為協助各校解決辦理過程中所遭遇之各項問題，得按年度委託辦理諮詢輔導專案，輔導各校落實綜合高中理念與精神，達成辦理成效。<\/div>\n<div class=\"doc-plain\">各校應充分配合評鑑與諮詢輔導專案，接受訪視及各項輔導工作。<\/div>\n<div class=\"doc-plain\">諮詢輔導專案總體成效檢核結果，作為各主管機關停辦綜合高中及本部核定各校年度補助款之參考依據。<\/div>\n<div class=\"doc-plain\">本要點未規定者，依綜合高級中學課程綱要及相關法令規定。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.90年10月26日教育部(90)臺技(一)字第 90130123 號令訂定發布全文 10 點。<br><\/div>\n<div class=\"history-paragraph\">2.91年5月30日教育部臺(九一)技(一)字第 91074045 號令修正發布全文 10 點；並自91年5月30日起生效。<br><\/div>\n<div class=\"history-paragraph\">3.95年7月3日教育部臺技(一)字第 0950074981C 號令修正發布全文 9 點；並自即日生效。<br><\/div>\n<div class=\"history-paragraph\">4.101年2月4日教育部部授教中(三)字第 1010500328D號令修正發布第3點、第9點，並自即日生效。<\/div>"},{"title":"教育部補助及推動產學攜手合作計畫補助要點","content":"一、目的：教育部（以下簡稱本部），為鼓勵各校辦理產學攜手合作計畫，建置以兼顧學生就學就業為基礎之教育模式，搭配在地產業聚落，培育在地學習、在地就業、在地發展之人才，發揚技職教育「做中學、學中做」務實致用之特色，特訂定本要點。\n二、申請對象：\n（一）以技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程（以下簡稱高級中等學校）及公私立科技大學、技術學院及專科學校（以下簡稱技專校院）辦理為原則，但各直轄市、縣市或辦理本計畫之高級中等學校群科鄰近僅有一般大學科系可銜接高級中等學校群科者，得專案報部申請。\n（二）得視人才培育需求，延伸至國民中學。\n三、辦理原則：\n（一）結合高級中等學校、技專校院、產業及勞動部勞動力發展署所屬分署合作培養四至七年之技術人才。\n（二）兼顧學生升學及就業。\n（三）學制規劃及銜接具彈性，技專校院以進修學制為原則。但各直轄市、縣（市）或辦理本計畫之高級中等學校群科鄰近僅有日間學制之大專校院，得經本部專案同意後辦理，學雜費收費並應低於日間學制收費。\n（四）技專校院以列入招生名額總量方式辦理；如全校生師比值符合專科以上學校總量發展規模與資源條件標準第四條附表一規定，且加計外加名額之系科生師比符合前開標準第五條附表五規定者，經核准後得以外加名額方式辦理，其中政府機關定有人才培育機制之相關類科，應列入招生名額總量內辦理。大學校院經專案同意辦理者，亦同。\n（五）技專校院每系（科）以核定一計畫（班）為原則。大學校院經專案同意辦理者，亦同。\n（六）學生於合作企業之權利義務（身分別），依下列規定辦理：\n１、高級中等學校：\n（１）以高級中等學校建教合作實施及建教生權益保障法之建教生辦理。\n（２）為引導學生興趣，漸進參與本計畫，得以高級中等學校實習課程實施辦法之實習學生辦理，並經本部核定後，於高級中等學校三年級參與本計畫。\n２、技專校院：\n（１）於技專校院，以勞動基準法之正式員工辦理為原則。\n（２）於專科學校五年制（包括科技大學及技術學院附設專科部）就讀護理科者，以專科以上學校產學合作實施辦法第六條及第六條之一之實習學生辦理。\n（七）高級中等學校申辦產學攜手合作專班（以下簡稱專班）以學校主管機關核定班級為限。\n（八）技專校院非專班學生如有參與意願，亦可參與專班學習。\n（九）政府機關得依在地產業需求及人才發展，引導大專校院及高級中等學校開設專班。\n四、推動組織：\n（一）本部應組成跨部會推動工作小組，由本部部長指派召集人一人；並由本部技術及職業教育司司長擔任執行秘書。除召集人及執行秘書為當然成員外，其餘小組成員包括本部國民及學前教育署、經濟部、勞動部、學校主管機關代表、業界代表等。\n（二）工作小組執掌規劃推動本計畫，工作項目包括規劃推動策略、協調各主管機關所屬單位辦理廠商及學校媒合說明會、研習會、座談會、宣導及審查等相關措施，並依規定辦理各項審核及督導工作。\n五、運作方式：\n（一）高級中等學校銜接技專校院方式：採高級中等學校加技專校院加合作企業之三合一模式辦理：\n１、得發展三加二（高級中等學校加二專）、三加二加二（高級中等學校加二專加二技）或三加四（高級中等學校加四技）縱向彈性銜接學制，並視需求向下延伸國民中學技藝教育課程，加強國民中學職業試探，提供有意願或有需求學生參加，得透過特色招生升讀技術型高級中等學校；學生於技術型高級中等學校畢業後，成為合作企業正式員工，並得經推薦至技專校院在職進修。\n２、高級中等學校開辦專班，得依合作企業產業條件於高級中等學校\n各年級開班，並以建教合作輪調式、階梯式、實習式及其他經中央主管機關核定之方式辦理。\n３、前目採以非建教合作方式辦理者，應採高二起至高三畢業期間，二年內辦理至少十週在校外實習合作機構之實習，並得運用寒、暑假期間或分散於高二以上各該學期之方式彈性辦理。但因產業情況特殊，經主管機關核定者，得減少至多二週之實習週數。\n４、各專班應由學校及合作企業共同規劃完整課程，且學校應事先訂定相關遴選成班之規定。為有利於學生選擇參加與否之參考，學校應於該專班學生預計入班一年前完成計畫申請，如依在地產業發展需求從國中開班，需於國二完成計畫申請。\n（二）技專校院在職進修方式：得採技專校院加合作企業之二合一模式，或技專校院加勞動部勞動力發展署各分署加合作企業之三合一模式辦理：\n１、二合一模式，得發展二加二Ｎ（二專日間部加二技進修部）及五加二（五專加二技）縱向彈性銜接學制，方式如下：\n（１）二加二Ｎ開辦專班模式，二專日間部以階梯式為原則，於修業最後一學期辦理，二技進修部以白天上班晚上上課為原則；五加二配合合作企業產業條件辦理。\n（２）各專班應由學校及合作企業共同規劃課程，並由合作企業提供業師協助，且學校應事先訂定相關遴選成班之規定。\n２、三合一模式，得發展科技大學第一年或第二年日間或寒暑假安排學員至合作企業或勞動部勞動力發展署各分署（或承訓單位）等地，接受最長一年專業技術養成訓練及輔導考取乙級（或單一級）技術士證照，學員結訓後由技專校院媒合至合作企業正式僱用進行工作實務訓練，四年期間之夜間或休假日接受學校教育課程之方式辦理。\n（１）二十九歲以下國人均可報考，不限高中職生，由科技大學辦理單獨招生，學校可訂定招生條件，如相關系科畢業，或應持有證照等。\n（２）技專校院階段，學員完成分署（或承訓單位）專業技術養成訓練成績及格者，由分署（或承訓單位）發給結訓證書。\n（三）前兩款之運作方式，得結合在地產業人才及技術培育基地之設備與場地共育人才。\n（四）第二款以五加二開辦專班模式且於五專護理科辦理者，應採五專在校外實習合作機構實習，二技進修部在合作企業工作並在職進修之方式辦理。\n（五）計畫參與者義務：應配合本計畫參與專班迄畢業為止。畢業前，如因不適應，經輔導及轉廠等措施，仍退出專班者，依規定予以退學。\n六、申辦領域：申辦學校應具備下列產業之相關類科：\n（一）以特殊類科、嚴重缺工產業為優先，並鼓勵開辦政府提倡之核心產業。\n（二）除前款規定外，本部得依產業界實際需求增列辦理類科。\n七、辦理期程：通過審查之學校依本部核定之計畫期程辦理。\n八、審查作業：\n（一）符合補助資格之學校，得研擬申辦計畫，並檢附相關資料，依本部指定期限及方式提出申請；其計畫內容大綱得參考產學攜手合作計畫作業手冊。\n（二）本部為辦理各校申辦計畫審查，應偕同經濟部、勞動部等政府相關單位，邀請學者專家、社會人士、學校代表、學校主管機關代表等組成審查小組進行審查。審查程序分初審、複審二階段辦理；若申辦計畫為續辦班，得免辦理複審。\n（三）初審作業由本部先就各校所提申辦計畫檢附資料進行初核；資料不齊全者，應通知學校於十日內補正。\n（四）複審作業由本部審查小組召開複審會議，得就各校所提計畫進行書面審查；必要時，得安排學校進行簡報。\n（五）複審通過之計畫有需修正者，應依審查意見修正計畫書；本部俟各\n校依規定完成修正計畫書後，予以核定並辦理經費補助事宜。\n（六）計畫經核定後，各校應依原核定計畫執行，執行期間不得變更教學模式與合作學校，但屬課程、合作企業調整變動，或增加技專校院學生輪值大夜班等相關事項，並敘明理由及檢附相關文件報本部偕同勞動部、經濟部等相關政府單位核定者，得變更之，並納入後續申辦審查參考；違反者，本部得終止其計畫之執行，並追繳補助款。\n九、審查基準：\n（一）計畫目標及教育政策配合度。\n（二）計畫內容完整性及可行性：\n１、學校與合作企業應建置完整之職場實習及升讀技專校院之工作或實習機制。\n２、學校與合作企業應擬具學生於合作企業之定期崗位輪調機制。\n３、學校與合作企業應擬具高級中等學校之定型化訓練契約及技專校院之教育工作契約。\n４、合作企業應明定計畫參與者高級中等學校實習或技專校院工作或實習期間身分別與給予合理之薪資、生活津貼或待遇。\n５、學校與合作企業應建立完善之計畫參與者輔導機制。\n６、學校與合作企業應向計畫參與者說明專班辦理模式、職場身分別、生活津貼或待遇、升學等機制及相關法令。\n（三）高級中等學校端與技專校院端科系之契合度及課程規劃之銜接性與進階性。\n（四）合作企業與專班性質之關連性及配合度。\n（五）計畫預期效益影響程度。\n（六）歷年開辦本計畫相關專班之成效（包括留職率、就業率、起薪或晉薪條件）。\n十、經費補助、核撥、核銷及偕同部會獎勵合作企業之機制：\n（一）經費補助原則：\n１、每一核定計畫案經費補助方式，採高級中等學校及技專校院每校每班最高補助新臺幣三十萬元；一百零六學年度後核定計畫案，技專校院開設嚴重缺工產業班別，補助新臺幣七十萬元。\n２、技專校院執行補助經費之期程，為開辦第一年至專班生修滿修業年限止；高級中等學校執行補助經費之期程，為開辦第一年執行完畢。\n３、技專校院應編列至少百分之十之配合款。但專班辦理成效良好，經本部同意者，得免提列配合款。\n４、高級中等學校，本部主管者，免編列配合款；直轄市、縣（市）政府主管者，各該政府應依本部與所屬機關（構）對直轄市及縣（市）政府計畫型補助款處理原則規定，按財力分級表編列相對配合款。直轄市、縣（市）政府財力級次屬第一級者，最高補助百分之八十；第二級者，百分之八十五；第三級者，百分之八十八；第四級者，百分之八十九；第五級者，百分之九十。\n５、本部得於計畫核定後，各校正式開班辦理前，依申辦計畫實際需求酌予調整補助經費。\n６、計畫案經費補助項目依教育部補（捐）助及委辦經費核撥結報作業要點規定辦理。\n７、計畫案經僑務委員會、本部國民及學前教育署補助高級中等學校新住民子女國際培力產學專班經費之學校，不予補助。\n８、本部每年得補助就讀技專校院家庭年所得未逾新臺幣七十萬元有戶籍登記之中華民國國民且於修業年限內之具有學籍者（不包括七年一貫學制前三年或五專前三年）經濟不利助學金，每學年每人新臺幣四萬元。\n９、本部每年得補助就讀私立技專校院農林漁牧工等重點產業領域之中華民國國民且於修業年限內之具有學籍者（不包括七年一貫學制前三年或五專前三年），其就讀私立技專校院與公立技專校院之學雜費差額，差額計算方式為當學期私立學雜費實際收費扣除公立技專校院同一學制同一學院之最高及最低學雜費總和之平均金額。\n１０、本部每年得補助就讀技專校院之中華民國國民且於修業年限內之具有學籍者，未支領每月薪資之助學金，以每月新臺幣五千元計，補助期間與工作期間相等，並於工作完畢後，始得請領。\n１１、本部國民及學前教育署每年得補助就讀高級中等學校之中華民國國民且於修業年限內具有學籍之學生，每人每月發給新臺幣五千元獎勵金，補助額度以學生參與建教合作方式或非建教合作方式，並依合作企業接受訓練或校外實習之月數計算。其於特定月份非全月於合作企業接受訓練或校外實習者，按其訓練或實習日數所占當月份總日數之比率，折算當月份發給金額。\n１２、前目獎勵金每年由本部國民及學前教育署編列年度預算支應。經學校審查符合規定及請領金額後，依其就讀年級順序造具請領清冊一份，並檢附審查紀錄影本，於當年度經費請撥時併同陳報本部國民及學前教育署，其請撥時間及方式如下：\n（１）採輪調式建教合作方式參與本計畫者：\nＡ、請撥時間：本部經費依會計年度分二次撥付學校；第一次撥付經費為六月，第二次撥付經費為十二月。\nＢ、請撥方式：本部主管高級中等學校，依前開所定請撥時間分次備據並造具請領表一式二份，向本部國民及學前教育署請領；直轄市、縣（市）政府主管高級中等學校，依前開所定請撥時間分次造具請領表一式三份，函報各該主管教育行政機關，並由該主管教育行政機關備據及彙送請領表一式二份陳報本部國民及學前教育署請領。\n（２）採階梯式、實習式或其他式等建教合作方式及採學生校外實習非建教合作方式參與本計畫者：本部經費依會計年度一次撥付學校，請撥方式比照前細目Ｂ辦理。但申請補助之程序及期限，本部國民及學前教育署得另行公告或以函文通知。\n（二）經費核撥及核銷：\n１、各校於計畫核定後，由本部撥付核定技專校院開班費及學生相關補助經費；高級中等學校開班費及學生獎勵金由本部國民及學前教育署撥付。\n２、應依教育部補（捐）助及委辦經費核撥結報作業要點規定辦理核結。\n（三）偕同部會獎勵合作企業機制：\n１、經濟部：辦理本計畫之合作企業，列入經濟部每年申請工安輔導及研發補助等計畫評選（審核）加分項目等相關規定辦理。\n２、勞動部：辦理本計畫之技專端合作企業，得依勞動部相關規定補助其工作崗位訓練費；勞動力發展署各分署提供受訓學員專業技術訓練指導等。\n３、農業部：辦理本計畫且屬農業類者，列入鼓勵獎勵高中生從農方案之相關獎勵金、獎學金及辦理新農民培育計畫等相關補助規定辦理。\n十一、成效考核：\n（一）學校應定期填報每一核定案之執行成效，包括下列事項：\n１、實際開班人數占核定人數之比率。\n２、合作高級中等學校專班學生銜接至技專校院端之比率。\n３、技專校院端學生被聘任為正式員工之比率。\n４、畢業生留原合作企業就業之比率\n５、其他本部規定應填報事項。\n（二）各項補助款應專款專用，不得移作他用，如有不實者，補助款應予追繳，並依規定予以處分。\n（三）本部為考核各校執行成果，得辦理實地訪視。當年度執行成果作為學校主管機關、本部、勞動部及經濟部等相關政府單位後續年度學校申請續辦，或該專班銜接技專開辦、經費補助之參考。","history":"1.109年4月8日教育部臺教技(一)字第1090041244B號令修正發布第7點、第8點，並自即日生效。\n2.114 年 01 月 02 日臺教技（一）字第1132303091A號 令修正部分規定，並自   即日生效。","contentHtml":"<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">目的：教育部（以下簡稱本部），為鼓勵各校辦理產學攜手合作計畫，建置以兼顧學生就學就業為基礎之教育模式，搭配在地產業聚落，培育在地學習、在地就業、在地發展之人才，發揚技職教育「做中學、學中做」務實致用之特色，特訂定本要點。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">申請對象：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">以技術型高級中等學校、普通型高級中等學校附設專業群科、綜合型高級中等學校專門學程（以下簡稱高級中等學校）及公私立科技大學、技術學院及專科學校（以下簡稱技專校院）辦理為原則，但各直轄市、縣市或辦理本計畫之高級中等學校群科鄰近僅有一般大學科系可銜接高級中等學校群科者，得專案報部申請。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">得視人才培育需求，延伸至國民中學。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">辦理原則：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">結合高級中等學校、技專校院、產業及勞動部勞動力發展署所屬分署合作培養四至七年之技術人才。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">兼顧學生升學及就業。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">學制規劃及銜接具彈性，技專校院以進修學制為原則。但各直轄市、縣（市）或辦理本計畫之高級中等學校群科鄰近僅有日間學制之大專校院，得經本部專案同意後辦理，學雜費收費並應低於日間學制收費。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">技專校院以列入招生名額總量方式辦理；如全校生師比值符合專科以上學校總量發展規模與資源條件標準第四條附表一規定，且加計外加名額之系科生師比符合前開標準第五條附表五規定者，經核准後得以外加名額方式辦理，其中政府機關定有人才培育機制之相關類科，應列入招生名額總量內辦理。大學校院經專案同意辦理者，亦同。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">技專校院每系（科）以核定一計畫（班）為原則。大學校院經專案同意辦理者，亦同。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">學生於合作企業之權利義務（身分別），依下列規定辦理：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">高級中等學校：<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（１）<\/span><span class=\"doc-copy\">以高級中等學校建教合作實施及建教生權益保障法之建教生辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（２）<\/span><span class=\"doc-copy\">為引導學生興趣，漸進參與本計畫，得以高級中等學校實習課程實施辦法之實習學生辦理，並經本部核定後，於高級中等學校三年級參與本計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">技專校院：<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（１）<\/span><span class=\"doc-copy\">於技專校院，以勞動基準法之正式員工辦理為原則。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（２）<\/span><span class=\"doc-copy\">於專科學校五年制（包括科技大學及技術學院附設專科部）就讀護理科者，以專科以上學校產學合作實施辦法第六條及第六條之一之實習學生辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（七）<\/span><span class=\"doc-copy\">高級中等學校申辦產學攜手合作專班（以下簡稱專班）以學校主管機關核定班級為限。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（八）<\/span><span class=\"doc-copy\">技專校院非專班學生如有參與意願，亦可參與專班學習。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（九）<\/span><span class=\"doc-copy\">政府機關得依在地產業需求及人才發展，引導大專校院及高級中等學校開設專班。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">推動組織：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">本部應組成跨部會推動工作小組，由本部部長指派召集人一人；並由本部技術及職業教育司司長擔任執行秘書。除召集人及執行秘書為當然成員外，其餘小組成員包括本部國民及學前教育署、經濟部、勞動部、學校主管機關代表、業界代表等。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">工作小組執掌規劃推動本計畫，工作項目包括規劃推動策略、協調各主管機關所屬單位辦理廠商及學校媒合說明會、研習會、座談會、宣導及審查等相關措施，並依規定辦理各項審核及督導工作。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">運作方式：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">高級中等學校銜接技專校院方式：採高級中等學校加技專校院加合作企業之三合一模式辦理：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">得發展三加二（高級中等學校加二專）、三加二加二（高級中等學校加二專加二技）或三加四（高級中等學校加四技）縱向彈性銜接學制，並視需求向下延伸國民中學技藝教育課程，加強國民中學職業試探，提供有意願或有需求學生參加，得透過特色招生升讀技術型高級中等學校；學生於技術型高級中等學校畢業後，成為合作企業正式員工，並得經推薦至技專校院在職進修。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">高級中等學校開辦專班，得依合作企業產業條件於高級中等學校<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:6.8em\">各年級開班，並以建教合作輪調式、階梯式、實習式及其他經中央主管機關核定之方式辦理。<\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">３、<\/span><span class=\"doc-copy\">前目採以非建教合作方式辦理者，應採高二起至高三畢業期間，二年內辦理至少十週在校外實習合作機構之實習，並得運用寒、暑假期間或分散於高二以上各該學期之方式彈性辦理。但因產業情況特殊，經主管機關核定者，得減少至多二週之實習週數。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">４、<\/span><span class=\"doc-copy\">各專班應由學校及合作企業共同規劃完整課程，且學校應事先訂定相關遴選成班之規定。為有利於學生選擇參加與否之參考，學校應於該專班學生預計入班一年前完成計畫申請，如依在地產業發展需求從國中開班，需於國二完成計畫申請。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">技專校院在職進修方式：得採技專校院加合作企業之二合一模式，或技專校院加勞動部勞動力發展署各分署加合作企業之三合一模式辦理：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">二合一模式，得發展二加二Ｎ（二專日間部加二技進修部）及五加二（五專加二技）縱向彈性銜接學制，方式如下：<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（１）<\/span><span class=\"doc-copy\">二加二Ｎ開辦專班模式，二專日間部以階梯式為原則，於修業最後一學期辦理，二技進修部以白天上班晚上上課為原則；五加二配合合作企業產業條件辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（２）<\/span><span class=\"doc-copy\">各專班應由學校及合作企業共同規劃課程，並由合作企業提供業師協助，且學校應事先訂定相關遴選成班之規定。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">三合一模式，得發展科技大學第一年或第二年日間或寒暑假安排學員至合作企業或勞動部勞動力發展署各分署（或承訓單位）等地，接受最長一年專業技術養成訓練及輔導考取乙級（或單一級）技術士證照，學員結訓後由技專校院媒合至合作企業正式僱用進行工作實務訓練，四年期間之夜間或休假日接受學校教育課程之方式辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（１）<\/span><span class=\"doc-copy\">二十九歲以下國人均可報考，不限高中職生，由科技大學辦理單獨招生，學校可訂定招生條件，如相關系科畢業，或應持有證照等。<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（２）<\/span><span class=\"doc-copy\">技專校院階段，學員完成分署（或承訓單位）專業技術養成訓練成績及格者，由分署（或承訓單位）發給結訓證書。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">前兩款之運作方式，得結合在地產業人才及技術培育基地之設備與場地共育人才。<\/span><\/div>\n<div class=\"doc-ro
