n<div class=\"doc-plain\">建教合作機構違反第二十一條第一項第四款規定者，處新臺幣一萬元以上五萬元以下罰鍰。<\/div>\n<div class=\"chapter-heading\">第  七  章  附則<\/div>\n<div class=\"article-heading\">第  37  條<\/div>\n<div class=\"doc-plain\">本法施行後，勞動基準法第八章有關建教合作班之學生準用技術生之相關規定，於建教生不再適用。<\/div>\n<div class=\"article-heading\">第  38  條<\/div>\n<div class=\"doc-plain\">本法施行前已核准之建教合作案，除適用第二十三條規定外，依原規定辦理。<\/div>\n<div class=\"article-heading\">第  39  條<\/div>\n<div class=\"doc-plain\">本法自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國102年1月2日總統華總一義字第10100290761號令制定公布全文39條；並自公布日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國110年6月16日總統華總一義字第1100005405號令修正公布第 4、9、11、13、14、21～26、29、32 條條文。<\/div>"},{"title":"教育部國民及學前教育署補助高級中等學校辦理建教合作作業要點","content":"教育部國民及學前教育署(以下簡稱本署)為鼓勵學生參加建教合作，並補助高級中等學校(以下簡稱學校)辦理建教合作基礎或職前訓練，使建教生能順利進入建教合作機構接受職業技能訓練，特訂定本要點。\n本要點補助之對象如下：\n建教生：就讀公、私立學校建教合作班，並具有中華民國國籍之學生。但參加本署指定辦理建教合作班之僑生，得不受國籍之限制。\n學校：辦理建教合作之公、私立學校。\n建教生免納學費，並就教育部依高級中等學校向學生收取費用辦法第三條第一項第二款規定公告之當學年度雜費收費數額，免納雜費。\n前項免納之學費及雜費，由本署補助；其補助規定如下：\n學費：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。\n雜費：\n於各該主管機關核定辦理建教合作計畫期間，由本署依教育部公告之當學年度建教合作班雜費收費數額，全額補助；核定期間未滿一學期且跨學期者，以一學期計。\n建教生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有規定者外，不得重複申請本補助。\n重讀、轉學或復學之建教生，於原就讀期間已申請本補助者，不得重複申請。但依其重讀、轉學或復學後之就讀群科條件，其得申請本補助之額度優於原已申領之補助者，得扣除原已補助額度後之差額，申請補助。\n本補助之申請程序、本署核撥學校經費總額之計算、建教生違反補助規定之處理，及建教生因故離校時，學校應退還本署補助款之額度比率，準用教育部補助高級中等學校學生學費實施要點第四點至第七點及第十點規定。\n依本要點補助之項目及基準，規定如下：\n基礎訓練\n鐘點費：每節新臺幣(以下同)五百五十元。但本署聘(派)之講師，每節八百元。\n實習材料費(包括雜支)：依人數及科別予以補助；每班除最高得支用百分之二十作為雜支外，其餘以提供建教生技能訓練、實習使用為限，不得移作他用。\n行政費：依科別及班數給予補助；其補助內容，包括導師職務加給、加班費、設備維護費及其他相關費用。\n職前訓練\n鐘點費：每節五百五十元。但本署聘(派)之講師，每節八百元。\n行政費：依科別及班數給予補助；其補助內容，包括加班費、設備維護費及其他相關費用。\n前項基礎及職前訓練之實施時數及補助項目金額，規定如附表一。\n直轄市、縣(市)政府主管之學校辦理基礎或職前訓練所需經費，由本署依中央對直轄市及縣(市)政府補助辦法之規定及配合本署獲配年度預算額度，就各直轄市、縣(市)政府財力等級，給予不同比率之補助。第一級者，最高補助百分之五十；第二級者，百分之六十；第三級者，百分之六十八；第四級者；百分之六十九；第五級者，百分之七十。\n學校申請補助，應於開學後一個月內，檢附當學年度基礎或職前訓練成果報告(包括點名紀錄、訓練課程表，如附表三)、結訓建教生名冊(如附表四)與訓練日誌影本，及經費申請表(如附表五)與申請補助經費統計表(如附表六)，直轄市、縣(市)政府主管之學校，應向各該政府提出，並由各該政府彙整列冊轉本署辦理，教育部主管之學校，逕向本署提出。\n本署應就第一項申請之補助額度核定後，將結果通知直轄市、縣(市)政府轉知各該政府主管之學校，教育部主管之學校，由本署逕予通知。\n學校實施基礎及職前訓練，應遵行下列規定：\n基礎訓練\n依各該主管機關核定之科、班，辦理招生；招生後，於八月三十一日前，實施基礎訓練。\n基礎訓練開始前，將訓練課程表、建教生訓練名冊及訓練日程表 (如附表二)，送各該主管機關備查後，始得辦理。\n每班招收人數超過五十人者，得分甲、乙二班實施。\n基礎訓練屬實習課程者，得準用高級中等學校實習課程實施辦法規定，實施分組教學。\n職前訓練：\n於第二與第三學年間暑假之八月三十一日前，以原上課班級為單位，實施職前訓練。\n職前訓練開始前，將訓練課程表、建教生訓練名冊及訓練日程表 (格式規定如附表二)，送各該主管機關備查後，始得辦理。\n職前訓練屬實習課程者，得準用高級中等學校實習課程實施辦法規定，實施分組教學。\n基礎及職前訓練之課程內容及最低時數如下：\n基礎訓練\n共同課程\n勞動人權、勞動權益及建教合作訓練契約簡介：十小時(節)。\n職業安全衛生：四小時(節)。\n相關科別介紹與行業特性及發展：二小時(節)。\n職場倫理(包括工作態度)及職業道德：二小時(節)。\n群育活動：機械科、模具科為八小時(節)，其餘各科為六小時(節)。\n性別工作平等及性騷擾防治：二小時(節)。\n專業基礎課程：以第四點第二項所定各科應訓練最低時數，扣減前目及第三目之時數後，由學校以預備進入職場所需之知識及技能，自行規劃該科基本專業知能課程，其中實習課程不得少於二分之一。\n基本華語文輔導課程：由辦理建教僑生專班之學校，自行規劃九十六小時基本華語文輔導課程。\n職前訓練\n共同課程\n勞動人權、勞動權益及建教合作簡介：十小時(節)。\n職業安全衛生：四小時(節)。\n相關科別介紹與行業特性及發展：二小時(節)。\n職場倫理(包括工作態度)及職業道德：二小時(節)。\n群育活動:四小時(節)。\n性別工作平等及性騷擾防治：二小時(節)。\n專業課程：以第四點第二項所定應訓練最低時數，扣減前目及第三目之時數後，由學校以預備進入職場所需之知識及技能，自行規劃該科專業知能課程，其中實習課程不得少於二分之一。\n基本華語文輔導課程:由辦理建教僑生專班之學校，自行規劃四小時基本華語文輔導課程。\n前項勞動人權、勞動權益及建教合作訓練契約簡介課程，得由本署聘(派)講師授課。\n學校應自開訓之日起，為參加基礎或職前訓練之建教生辦理團體保險；其保險費，由建教合作機構負擔。\n基礎或職前訓練應在學校內辦理，並依訓練課程表實施；各該主管機關得視需要，至學校訪視。\n本補助經費，應專款專用，不得移作他用。\n前項補助經費之核撥及結報，應依教育部補(捐)助及委辦經費核撥結報作業要點之規定辦理。\n學校辦理基礎或職前訓練之執行成果，列入本署年度考核項目；考核結果，得作為下年度依本要點申請補助審核之參考。","history":"1.中華民國103年8月29日教育部臺教國署高字第 1030081289B 號令訂定發布全文8點，並自103年7月1日生效。\n2.中華民國107年9月21日教育部臺教國署高字第 1070105756B 號令修正發布全文9點，名稱並修正為「教育部國民及學前教育署補助高級中等學校辦理建教合作作業要點」，並自即日生效。\n3.中華民國108年7月12日教育部臺教國署高字第 1080075426B號令修正發布第7點、第9點及附表1，並自即日生效。\n4. 中華民國114年10月30日教育部國民及學前教育署臺教國署高字第1145405359A號令  修正第3點、第4點、第7點，並自即日生效。","contentHtml":"<div class=\"doc-plain\">教育部國民及學前教育署(以下簡稱本署)為鼓勵學生參加建教合作，並補助高級中等學校(以下簡稱學校)辦理建教合作基礎或職前訓練，使建教生能順利進入建教合作機構接受職業技能訓練，特訂定本要點。<\/div>\n<div class=\"doc-plain\">本要點補助之對象如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">建教生：就讀公、私立學校建教合作班，並具有中華民國國籍之學生。但參加本署指定辦理建教合作班之僑生，得不受國籍之限制。<\/div>\n<div class=\"doc-plain\">學校：辦理建教合作之公、私立學校。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">建教生免納學費，並就教育部依高級中等學校向學生收取費用辦法第三條第一項第二款規定公告之當學年度雜費收費數額，免納雜費。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項免納之學費及雜費，由本署補助；其補助規定如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">學費：依高級中等教育法第五十六條、高級中等學校向學生收取費用辦法及其相關法令之規定辦理。<\/div>\n<div class=\"doc-plain\">雜費：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">於各該主管機關核定辦理建教合作計畫期間，由本署依教育部公告之當學年度建教合作班雜費收費數額，全額補助；核定期間未滿一學期且跨學期者，以一學期計。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">建教生享有政府其他相關雜費減免、補助，或與減免、補助雜費性質相當之給付者，除法令另有規定者外，不得重複申請本補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">重讀、轉學或復學之建教生，於原就讀期間已申請本補助者，不得重複申請。但依其重讀、轉學或復學後之就讀群科條件，其得申請本補助之額度優於原已申領之補助者，得扣除原已補助額度後之差額，申請補助。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">本補助之申請程序、本署核撥學校經費總額之計算、建教生違反補助規定之處理，及建教生因故離校時，學校應退還本署補助款之額度比率，準用教育部補助高級中等學校學生學費實施要點第四點至第七點及第十點規定。<\/div>\n<div class=\"doc-plain\">依本要點補助之項目及基準，規定如下：<\/div>\n<div class=\"doc-plain\">基礎訓練<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">鐘點費：每節新臺幣(以下同)五百五十元。但本署聘(派)之講師，每節八百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">實習材料費(包括雜支)：依人數及科別予以補助；每班除最高得支用百分之二十作為雜支外，其餘以提供建教生技能訓練、實習使用為限，不得移作他用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">行政費：依科別及班數給予補助；其補助內容，包括導師職務加給、加班費、設備維護費及其他相關費用。<\/div>\n<div class=\"doc-plain\">職前訓練<\/div>\n<div class=\"doc-plain\">鐘點費：每節五百五十元。但本署聘(派)之講師，每節八百元。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">行政費：依科別及班數給予補助；其補助內容，包括加班費、設備維護費及其他相關費用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">前項基礎及職前訓練之實施時數及補助項目金額，規定如附表一。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">直轄市、縣(市)政府主管之學校辦理基礎或職前訓練所需經費，由本署依中央對直轄市及縣(市)政府補助辦法之規定及配合本署獲配年度預算額度，就各直轄市、縣(市)政府財力等級，給予不同比率之補助。第一級者，最高補助百分之五十；第二級者，百分之六十；第三級者，百分之六十八；第四級者；百分之六十九；第五級者，百分之七十。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校申請補助，應於開學後一個月內，檢附當學年度基礎或職前訓練成果報告(包括點名紀錄、訓練課程表，如附表三)、結訓建教生名冊(如附表四)與訓練日誌影本，及經費申請表(如附表五)與申請補助經費統計表(如附表六)，直轄市、縣(市)政府主管之學校，應向各該政府提出，並由各該政府彙整列冊轉本署辦理，教育部主管之學校，逕向本署提出。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">本署應就第一項申請之補助額度核定後，將結果通知直轄市、縣(市)政府轉知各該政府主管之學校，教育部主管之學校，由本署逕予通知。<\/div>\n<div class=\"doc-plain\">學校實施基礎及職前訓練，應遵行下列規定：<\/div>\n<div class=\"doc-plain\">基礎訓練<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">依各該主管機關核定之科、班，辦理招生；招生後，於八月三十一日前，實施基礎訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">基礎訓練開始前，將訓練課程表、建教生訓練名冊及訓練日程表 (如附表二)，送各該主管機關備查後，始得辦理。<\/div>\n<div class=\"doc-plain\">每班招收人數超過五十人者，得分甲、乙二班實施。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">基礎訓練屬實習課程者，得準用高級中等學校實習課程實施辦法規定，實施分組教學。<\/div>\n<div class=\"doc-plain\">職前訓練：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">於第二與第三學年間暑假之八月三十一日前，以原上課班級為單位，實施職前訓練。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">職前訓練開始前，將訓練課程表、建教生訓練名冊及訓練日程表 (格式規定如附表二)，送各該主管機關備查後，始得辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">職前訓練屬實習課程者，得準用高級中等學校實習課程實施辦法規定，實施分組教學。<\/div>\n<div class=\"doc-plain\">基礎及職前訓練之課程內容及最低時數如下：<\/div>\n<div class=\"doc-plain\">基礎訓練<\/div>\n<div class=\"doc-plain\">共同課程<\/div>\n<div class=\"doc-plain\">勞動人權、勞動權益及建教合作訓練契約簡介：十小時(節)。<\/div>\n<div class=\"doc-plain\">職業安全衛生：四小時(節)。<\/div>\n<div class=\"doc-plain\">相關科別介紹與行業特性及發展：二小時(節)。<\/div>\n<div class=\"doc-plain\">職場倫理(包括工作態度)及職業道德：二小時(節)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.44em\">群育活動：機械科、模具科為八小時(節)，其餘各科為六小時(節)。<\/div>\n<div class=\"doc-plain\">性別工作平等及性騷擾防治：二小時(節)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">專業基礎課程：以第四點第二項所定各科應訓練最低時數，扣減前目及第三目之時數後，由學校以預備進入職場所需之知識及技能，自行規劃該科基本專業知能課程，其中實習課程不得少於二分之一。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">基本華語文輔導課程：由辦理建教僑生專班之學校，自行規劃九十六小時基本華語文輔導課程。<\/div>\n<div class=\"doc-plain\">職前訓練<\/div>\n<div class=\"doc-plain\">共同課程<\/div>\n<div class=\"doc-plain\">勞動人權、勞動權益及建教合作簡介：十小時(節)。<\/div>\n<div class=\"doc-plain\">職業安全衛生：四小時(節)。<\/div>\n<div class=\"doc-plain\">相關科別介紹與行業特性及發展：二小時(節)。<\/div>\n<div class=\"doc-plain\">職場倫理(包括工作態度)及職業道德：二小時(節)。<\/div>\n<div class=\"doc-plain\">群育活動:四小時(節)。<\/div>\n<div class=\"doc-plain\">性別工作平等及性騷擾防治：二小時(節)。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">專業課程：以第四點第二項所定應訓練最低時數，扣減前目及第三目之時數後，由學校以預備進入職場所需之知識及技能，自行規劃該科專業知能課程，其中實習課程不得少於二分之一。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">基本華語文輔導課程:由辦理建教僑生專班之學校，自行規劃四小時基本華語文輔導課程。<\/div>\n<div class=\"doc-plain\">　　前項勞動人權、勞動權益及建教合作訓練契約簡介課程，得由本署聘(派)講師授課。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校應自開訓之日起，為參加基礎或職前訓練之建教生辦理團體保險；其保險費，由建教合作機構負擔。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">基礎或職前訓練應在學校內辦理，並依訓練課程表實施；各該主管機關得視需要，至學校訪視。<\/div>\n<div class=\"doc-plain\">本補助經費，應專款專用，不得移作他用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">前項補助經費之核撥及結報，應依教育部補(捐)助及委辦經費核撥結報作業要點之規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.13em\">學校辦理基礎或職前訓練之執行成果，列入本署年度考核項目；考核結果，得作為下年度依本要點申請補助審核之參考。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國103年8月29日教育部臺教國署高字第 1030081289B 號令訂定發布全文8點，並自103年7月1日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國107年9月21日教育部臺教國署高字第 1070105756B 號令修正發布全文9點，名稱並修正為「教育部國民及學前教育署補助高級中等學校辦理建教合作作業要點」，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3.中華民國108年7月12日教育部臺教國署高字第 1080075426B號令修正發布第7點、第9點及附表1，並自即日生效。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">4. 中華民國114年10月30日教育部國民及學前教育署臺教國署高字第1145405359A號令  修正第3點、第4點、第7點，並自即日生效。<\/div>"},{"title":"職業安全衛生法","content":"第  一  章  總則\n第  1  條\n為防止職業災害，保障工作者安全及健康，特制定本法；其他法律有特別規定者，從其規定。\n第  2 條\n本法用詞，定義如下：\n工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n勞工：指受僱從事工作獲致工資者。\n雇主：指事業主或事業之經營負責人。\n事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。\n勞動場所：指於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所；自營作業者實際從事勞動之場所；及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。\n工作場所：指勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所。\n作業場所：指工作場所中，從事特定工作目的之場所。\n第  3  條\n本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n本法有關衛生事項，中央主管機關應會商中央衛生主管機關辦理。\n第  4  條\n本法適用於各業。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。\n第  5  條\n雇主使勞工從事工作，應在合理可行範圍內，採取必要之預防設備或措施，使勞工免於發生職業災害。\n機械、設備、器具、原料、材料等物件之設計、製造或輸入者及工程之設計或施工者，應於設計、製造、輸入或施工規劃階段實施風險評估，致力防止此等物件於使用或工程施工時，發生職業災害。\n第  二  章  安全衛生設施\n第  6  條\n雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n防止機械、設備或器具等引起之危害。\n防止爆炸性或發火性等物質引起之危害。\n防止電、熱或其他之能引起之危害。\n防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n防止高壓氣體引起之危害。\n防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n防止監視儀表或精密作業等引起之危害。\n防止廢氣、廢液或殘渣等廢棄物引起之危害。\n防止水患、風災或火災等引起之危害。\n防止動物、植物或微生物等引起之危害。\n防止通道、地板或階梯等引起之危害。\n防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n重複性作業等促發肌肉骨骼疾病之預防。\n輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。\n避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。\n第  7  條\n製造者、輸入者、供應者或雇主，對於中央主管機關指定之機械、設備或器具，其構造、性能及防護非符合安全標準者，不得產製運出廠場、輸入、租賃、供應或設置。\n前項之安全標準，由中央主管機關定之。\n製造者或輸入者對於第一項指定之機械、設備或器具，符合前項安全標準者，應於中央主管機關指定之資訊申報網站登錄，並於其產製或輸入之產品明顯處張貼安全標示，以供識別。但屬於公告列入型式驗證之產品，應依第八條及第九條規定辦理。\n前項資訊登錄方式、標示及其他應遵行事項之辦法，由中央主管機關定之。\n第  8  條\n製造者或輸入者對於中央主管機關公告列入型式驗證之機械、設備或器具，非經中央主管機關認可之驗證機構實施型式驗證合格及張貼合格標章，不得產製運出廠場或輸入。\n前項應實施型式驗證之機械、設備或器具，有下列情形之一者，得免驗證，不受前項規定之限制：\n依第十六條或其他法律規定實施檢查、檢驗、驗證或認可。\n供國防軍事用途使用，並有國防部或其直屬機關出具證明。\n限量製造或輸入僅供科技研發、測試用途之專用機型，並經中央主管機關核准。\n非供實際使用或作業用途之商業樣品或展覽品，並經中央主管機關核准。\n其他特殊情形，有免驗證之必要，並經中央主管機關核准。\n第一項之驗證，因產品構造規格特殊致驗證有困難者，報驗義務人得檢附產品安全評估報告，向中央主管機關申請核准採用適當檢驗方式為之。\n輸入者對於第一項之驗證，因驗證之需求，得向中央主管機關申請先行放行，經核准後，於產品之設置地點實施驗證。\n前四項之型式驗證實施程序、項目、標準、報驗義務人、驗證機構資格條件、認可、撤銷與廢止、合格標章、標示方法、先行放行條件、申請免驗、安全評估報告、監督管理及其他應遵行事項之辦法，由中央主管機關定之。\n第  9  條\n製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。\n第  10  條\n雇主對於具有危害性之化學品，應予標示、製備清單及揭示安全資料表，並採取必要之通識措施。\n製造者、輸入者或供應者，提供前項化學品與事業單位或自營作業者前，應予標示及提供安全資料表；資料異動時，亦同。\n前二項化學品之範圍、標示、清單格式、安全資料表、揭示、通識措施及其他應遵行事項之規則，由中央主管機關定之。\n第  11  條\n雇主對於前條之化學品，應依其健康危害、散布狀況及使用量等情形，評估風險等級，並採取分級管理措施。\n前項之評估方法、分級管理程序與採行措施及其他應遵行事項之辦法，由中央主管機關定之。\n第  12  條\n雇主對於中央主管機關定有容許暴露標準之作業場所，應確保勞工之危害暴露低於標準值。\n前項之容許暴露標準，由中央主管機關定之。\n雇主對於經中央主管機關指定之作業場所，應訂定作業環境監測計畫，並設置或委託由中央主管機關認可之作業環境監測機構實施監測。但中央主管機關指定免經監測機構分析之監測項目，得僱用合格監測人員辦理之。\n雇主對於前項監測計畫及監測結果，應公開揭示，並通報中央主管機關。\n中央主管機關或勞動檢查機構得實施查核。\n前二項之作業場所指定、監測計畫與監測結果揭示、通報、監測機構與監測人員資格條件、認可、撤銷與廢止、查核方式及其他應遵行事項之辦法，由中央主管機關定之。\n第  13  條\n製造者或輸入者對於中央主管機關公告之化學物質清單以外之新化學物質，未向中央主管機關繳交化學物質安全評估報告，並經核准登記前，不得製造或輸入含有該物質之化學品。但其他法律已規定或經中央主管機關公告不適用者，不在此限。\n前項評估報告，中央主管機關為防止危害工作者安全及健康，於審查後得予公開。\n前二項化學物質清單之公告、新化學物質之登記、評估報告內容、審查程序、資訊公開及其他應遵行事項之辦法，由中央主管機關定之。\n第  14  條\n製造者、輸入者、供應者或雇主，對於經中央主管機關指定之管制性化學品，不得製造、輸入、供應或供工作者處置、使用。但經中央主管機關許可者，不在此限。\n製造者、輸入者、供應者或雇主，對於中央主管機關指定之優先管理化學品，應將相關運作資料報請中央主管機關備查。\n前二項化學品之指定、許可條件、期間、廢止或撤銷許可、運作資料內容及其他應遵行事項之辦法，由中央主管機關定之。\n第  15  條\n有下列情事之一之工作場所，事業單位應依中央主管機關規定之期限，定期實施製程安全評估，並製作製程安全評估報告及採取必要之預防措施；製程修改時，亦同：\n從事石油裂解之石化工業。\n從事製造、處置或使用危害性之化學品數量達中央主管機關規定量以上。\n前項製程安全評估報告，事業單位應報請勞動檢查機構備查。\n前二項危害性之化學品數量、製程安全評估方法、評估報告內容要項、報請備查之期限、項目、方式及其他應遵行事項之辦法，由中央主管機關定之。\n第  15-1  條\n事業單位將一定規模以上之工程交付規劃、設計時，應依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n事業單位應使前項施工者依施工計畫書確實執行，並指派人員或委託專業機構監督及查證。\n前三項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督與查證內容及其他相關事項之辦法，由中央主管機關定之。\n第  16  條\n雇主對於經中央主管機關指定具有危險性之機械或設備，非經勞動檢查機構或中央主管機關指定之代行檢查機構檢查合格，不得使用；其使用超過規定期間者，非經再檢查合格，不得繼續使用。\n代行檢查機構應依本法及本法所發布之命令執行職務。\n檢查費收費標準及代行檢查機構之資格條件與所負責任，由中央主管機關定之。\n第一項所稱危險性機械或設備之種類、應具之容量與其製程、竣工、使用、變更或其他檢查之程序、項目、標準及檢查合格許可有效使用期限等事項之規則，由中央主管機關定之。\n第  17  條\n勞工工作場所之建築物，應由依法登記開業之建築師依建築法規及本法有關安全衛生之規定設計。\n第  18  條\n工作場所有立即發生危險之虞時，雇主或工作場所負責人應即令停止作業，並使勞工退避至安全場所。\n勞工執行職務發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並立即向直屬主管報告。\n雇主不得對前項勞工予以解僱、調職、不給付停止作業期間工資或其他不利之處分。但雇主證明勞工濫用停止作業權，經報主管機關認定，並符合勞動法令規定者，不在此限。\n第  19  條\n在高溫場所工作之勞工，雇主不得使其每日工作時間超過六小時；異常氣壓作業、高架作業、精密作業、重體力勞動或其他對於勞工具有特殊危害之作業，亦應規定減少勞工工作時間，並在工作時間中予以適當之休息。\n前項高溫度、異常氣壓、高架、精密、重體力勞動及對於勞工具有特殊危害等作業之減少工作時間與休息時間之標準，由中央主管機關會同有關機關定之。\n第  20  條\n雇主於僱用勞工時，應施行體格檢查；對在職勞工應施行下列健康檢查：\n一般健康檢查。\n從事特別危害健康作業者之特殊健康檢查。\n經中央主管機關指定為特定對象及特定項目之健康檢查。\n前項檢查應由中央主管機關會商中央衛生主管機關認可之醫療機構之醫師為之；檢查紀錄雇主應予保存，並負擔健康檢查費用；實施特殊健康檢查時，雇主應提供勞工作業內容及暴露情形等作業經歷資料予醫療機構。\n前二項檢查之對象及其作業經歷、項目、期間、健康管理分級、檢查紀錄與保存期限及其他應遵行事項之規則，由中央主管機關定之。\n醫療機構對於健康檢查之結果，應通報中央主管機關備查，以作為工作相關疾病預防之必要應用。但一般健康檢查結果之通報，以指定項目發現異常者為限。\n第二項醫療機構之認可條件、管理、檢查醫師資格與前項檢查結果之通報內容、方式、期限及其他應遵行事項之辦法，由中央主管機關定之。\n勞工對於第一項之檢查，有接受之義務。\n第  21  條\n雇主依前條體格檢查發現應僱勞工不適於從事某種工作，不得僱用其從事該項工作。健康檢查發現勞工有異常情形者，應由醫護人員提供其健康指導；其經醫師健康評估結果，不能適應原有工作者，應參採醫師之建議，變更其作業場所、更換工作或縮短工作時間，並採取健康管理措施。\n雇主應依前條檢查結果及個人健康注意事項，彙編成健康檢查手冊，發給勞工，並不得作為健康管理目的以外之用途。\n前二項有關健康管理措施、檢查手冊內容及其他應遵行事項之規則，由中央主管機關定之。\n第  22  條\n事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。\n前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。\n第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。\n第  二  章之一 職場霸凌之防治\n第  22-1  條\n本法所稱職場霸凌，指勞工於勞動場所執行職務，因其事業單位人員利用職務或權勢等關係，逾越業務上必要且合理範圍，持續以冒犯、威脅、冷落、孤立、侮辱或其他不當之言詞或行為，致其身心健康遭受危害。但情節重大者，不以持續發生為必要。\n雇主應採取必要之措施，防治職場霸凌之發生；其僱用勞工人數達下列規模者，並依各款規定辦理：\n一、勞工人數在十人以上者，應訂定職場霸凌申訴管道，並在工作場所公開揭示。\n二、勞工人數在三十人以上者，應訂定職場霸凌防治措施、申訴及懲處規範，並在工作場所公開揭示。\n第  22-2  條\n雇主於知悉勞工遭受職場霸凌時，應採取下列立即有效之適當措施：\n一、雇主因接獲被霸凌勞工申訴而知悉時：\n（一）採行避免申訴人受職場霸凌情形再度發生之措施。\n（二）視申訴人需求及事件情節，提供相關諮詢或必要之協助及保護措施。\n（三）對申訴事件進行調查；申訴人有意願者，得予協調，如協調不成立時，應續行調查。\n（四）對行為人為適當之懲戒或處理。\n二、雇主非因前款情形而知悉時：\n（一）就相關事實進行必要之釐清。\n（二）依被霸凌勞工意願，協助其協調或提起申訴。\n（三）適度調整工作內容或工作場所。\n（四）依被霸凌勞工意願，提供相關諮詢或必要之協助及保護措施。\n雇主對於職場霸凌事件之調查或協調，應秉持客觀、公正、公平原則；於調查時，除給予當事人充分陳述意見及答辯機會外，並應遵守利益迴避規定。雇主僱用勞工人數達一定規模者，應組成調查小組；其調查小組外聘成員比例不得少於二分之一。\n雇主接獲被霸凌勞工申訴時，應於中央主管機關指定之網站登錄；事件之處理結果，亦應於該網站登錄之。\n雇主依前三項所為之適當措施、調查處理與申復原則、一定規模之認定、資訊登錄方式，與前條第二項各款應訂定之防治措施、申訴及懲處規範，內容應包括職場霸凌之樣態、預防事項、教育訓練、申訴管道、調查、處理與申復程序、調查人員資格與調查小組之組成、利益迴避事項、懲戒處理及其他相關措施；其準則，由中央主管機關定之。\n雇主所為職場霸凌事件之調查結果，經認定違反前項所定準則之規定，且調查程序有重大瑕疵者，主管機關或勞動檢查機構得要求重新調查，雇主不得拒絕。\n第  22-3  條\n勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。\n第  三  章  安全衛生管理\n第  23  條\n雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。\n第  24  條\n第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。\n第  25  條\n事業單位以其事業招人承攬時，其承攬人就承攬部分負本法所定雇主之責任；原事業單位就職業災害補償仍應與承攬人負連帶責任。再承攬者亦同。\n原事業單位違反本法或有關安全衛生規定，致承攬人所僱勞工發生職業災害時，與承攬人負連帶賠償責任。再承攬者亦同。\n第  26  條\n事業單位以其事業交付承攬時，應於事前就交付承攬之事業實施風險評估，將有關工作環境、危害因素與應採取之安全衛生設備及措施等評估結果告知該承攬人，並於承攬期間使承攬人依評估結果確實執行。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。\n第  27  條\n事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、機械、設備、器具及人員之進場管制。\n六、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第六款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。\n第  27-1  條\n事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。\n第  28  條\n二個以上之事業單位分別出資共同承攬工程時，應互推一人為代表人；該代表人視為該工程之事業雇主，負本法雇主防止職業災害之責任。\n第  29  條\n雇主不得使未滿十八歲者從事下列危險性或有害性工作：\n坑內工作。\n處理爆炸性、易燃性等物質之工作。\n鉛、汞、鉻、砷、黃磷、氯氣、氰化氫、苯胺等有害物散布場所之工作。\n有害輻射散布場所之工作。\n有害粉塵散布場所之工作。\n運轉中機器或動力傳導裝置危險部分之掃除、上油、檢查、修理或上卸皮帶、繩索等工作。\n超過二百二十伏特電力線之銜接。\n已熔礦物或礦渣之處理。\n鍋爐之燒火及操作。\n鑿岩機及其他有顯著振動之工作。\n一定重量以上之重物處理工作。\n起重機、人字臂起重桿之運轉工作。\n動力捲揚機、動力運搬機及索道之運轉工作。\n橡膠化合物及合成樹脂之滾輾工作。\n其他經中央主管機關規定之危險性或有害性之工作。\n前項危險性或有害性工作之認定標準，由中央主管機關定之。\n未滿十八歲者從事第一項以外之工作，經第二十條或第二十二條之醫師評估結果，不能適應原有工作者，雇主應參採醫師之建議，變更其作業場所、更換工作或縮短工作時間，並採取健康管理措施。\n第  30  條\n雇主不得使妊娠中之女性勞工從事下列危險性或有害性工作：\n礦坑工作。\n鉛及其化合物散布場所之工作。\n異常氣壓之工作。\n處理或暴露於弓形蟲、德國麻疹等影響胎兒健康之工作。\n處理或暴露於二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、砷及其化合物、汞及其無機化合物等經中央主管機關規定之危害性化學品之工作。\n鑿岩機及其他有顯著振動之工作。\n一定重量以上之重物處理工作。\n有害輻射散布場所之工作。\n已熔礦物或礦渣之處理工作。\n起重機、人字臂起重桿之運轉工作。\n動力捲揚機、動力運搬機及索道之運轉工作。\n橡膠化合物及合成樹脂之滾輾工作。\n處理或暴露於經中央主管機關規定具有致病或致死之微生物感染風險之工作。\n其他經中央主管機關規定之危險性或有害性之工作。\n雇主不得使分娩後未滿一年之女性勞工從事下列危險性或有害性工作：\n礦坑工作。\n鉛及其化合物散布場所之工作。\n鑿岩機及其他有顯著振動之工作。\n一定重量以上之重物處理工作。\n其他經中央主管機關規定之危險性或有害性之工作。\n第一項第五款至第十四款及前項第三款至第五款所定之工作，雇主依第三十一條採取母性健康保護措施，經當事人書面同意者，不在此限。\n第一項及第二項危險性或有害性工作之認定標準，由中央主管機關定之。\n雇主未經當事人告知妊娠或分娩事實而違反第一項或第二項規定者，得免予處罰。但雇主明知或可得而知者，不在此限。\n第  31  條\n中央主管機關指定之事業，雇主應對有母性健康危害之虞之工作，採取危害評估、控制及分級管理措施；對於妊娠中或分娩後未滿一年之女性勞工，應依醫師適性評估建議，採取工作調整或更換等健康保護措施，並留存紀錄。\n前項勞工於保護期間，因工作條件、作業程序變更、當事人健康異常或有不適反應，經醫師評估確認不適原有工作者，雇主應依前項規定重新辦理之。\n第一項事業之指定、有母性健康危害之虞之工作項目、危害評估程序與控制、分級管理方法、適性評估原則、工作調整或更換、醫師資格與評估報告之文件格式、紀錄保存及其他應遵行事項之辦法，由中央主管機關定之。\n雇主未經當事人告知妊娠或分娩事實而違反第一項或第二項規定者，得免予處罰。但雇主明知或可得而知者，不在此限。\n第  32  條\n雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。\n第  33  條\n雇主應負責宣導本法及有關安全衛生之規定，使勞工周知。\n第  34  條\n雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。\n勞工對於前項安全衛生工作守則，應切實遵行。\n第  四  章  監督與檢查\n第  35  條\n中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業安全衛生諮詢會，研議國家職業安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。\n第  36  條\n中央主管機關及勞動檢查機構對於各事業單位勞動場所得實施檢查。其有不合規定者，應告知違反法令條款，並通知限期改善；屆期未改善或已發生職業災害，或有發生職業災害之虞時，得通知其部分或全部停工。勞工於停工期間應由雇主照給工資。\n事業單位對於前項之改善，於必要時，得請中央主管機關協助或洽請認可之顧問服務機構提供專業技術輔導。\n前項顧問服務機構之種類、條件、服務範圍、顧問人員之資格與職責、認可程序、撤銷、廢止、管理及其他應遵行事項之規則，由中央主管機關定之。\n第  37  條\n事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n發生死亡災害。\n發生災害之罹災人數在三人以上。\n發生災害之罹災人數在一人以上，且需住院治療。\n其他經中央主管機關指定公告之災害。\n勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。\n事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。\n第  38  條\n中央主管機關指定之事業，雇主應依規定填載職業災害內容及統計，按月報請勞動檢查機構備查，並公布於工作場所。\n第  39  條\n工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。\n第  五  章  罰則\n第  40  條\n違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。\n第  41  條\n有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n四、故意違反第三十七條第四項規定，未經許可而移動或破壞現場。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。\n第  42  條\n違反第十五條第一項、第二項之規定，其危害性化學品洩漏或引起火災、爆炸致發生第三十七條第二項之職業災害者，處新臺幣三十萬元以上三百萬元以下罰鍰；經通知限期改善，屆期未改善，並得按次處罰。\n雇主依第十二條第四項規定通報之監測資料，經中央主管機關查核有虛偽不實者，處新臺幣三十萬元以上一百萬元以下罰鍰。\n第  43  條\n有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病或工作相關疾病。\n四、違反第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n第  44  條\n未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。\n第  45  條\n有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項至第三項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二項、第五項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n第  46  條\n最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。\n第  47  條\n代行檢查機構執行職務，違反本法或依本法所發布之命令者，處新臺幣六萬元以上三十萬元以下罰鍰；其情節重大者，中央主管機關並得予以暫停代行檢查職務或撤銷指定代行檢查職務之處分。\n第  48  條\n有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。\n第  49  條\n有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。\n符合前項第一款或第二款情形，並應公布職業災害之發生日期、發生地及罹災人數。\n第  六  章  附則\n第  50  條\n為提升雇主及工作者之職業安全衛生知識，促進職業安全衛生文化之發展，中央主管機關得訂定獎勵或補助辦法，鼓勵事業單位及有關團體辦理之。\n直轄市與縣(市)主管機關及各目的事業主管機關應積極推動職業安全衛生業務；中央主管機關得訂定績效評核及獎勵辦法。\n第  51  條\n自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。\n第  51-1  條\n事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。\n第  52  條\n中央主管機關得將第八條驗證機構管理、第九條抽驗與市場查驗、第十二條作業環境監測機構之管理、查核與監測結果之通報、第十三條新化學物質之登記與報告之審查、第十四條管制性化學品之許可與優先管理化學品之運作資料之備查、第二十條認可之醫療機構管理及健康檢查結果之通報、第二十三條第三項職業安全衛生管理系統之訪查與績效認可、第三十二條第二項訓練單位之管理及第三十九條第二項疑似職業病調查等業務，委託相關專業團體辦理。\n第  53  條\n主管機關辦理本法所定之認可、審查、許可、驗證、檢查及指定等業務，應收規費；其收費標準由中央主管機關定之。\n第  54  條\n本法施行細則，由中央主管機關定之。\n第  55  條\n本法施行日期，由行政院定之。","history":"1.中華民國108年5月15日總統華總一義字第10800049111  號令修正公布第3、6條條文；施行日期，由行政院定之。\n2.中華民國108年6月13日行政院院臺勞字第1080018514 號令發布定自108年6月15日施行。\n3. 中華民國114年12月19日總統華總一義字第11400130481號令修正公布第 2、6、9、22、23、24、26、27、32、39、40、41、43～46、48、49、51條條文；增訂第15-1、22-1～22-3、27-1、51-1  條條文及第二章之一章名；施行日期，由行政院定之中華民國115年6月9日行政院院臺勞字第1151014441號令發布定自115年7月1日施行","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">為防止職業災害，保障工作者安全及健康，特制定本法；其他法律有特別規定者，從其規定。<\/div>\n<div class=\"article-heading\">第  2 條<\/div>\n<div class=\"doc-plain\">本法用詞，定義如下：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">勞工：指受僱從事工作獲致工資者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">雇主：指事業主或事業之經營負責人。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">事業單位：指本法適用範圍內僱用勞工從事工作之機構。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">勞動場所：指於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所；自營作業者實際從事勞動之場所；及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">工作場所：指勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">作業場所：指工作場所中，從事特定工作目的之場所。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"doc-plain\">本法有關衛生事項，中央主管機關應會商中央衛生主管機關辦理。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">本法適用於各業。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">雇主使勞工從事工作，應在合理可行範圍內，採取必要之預防設備或措施，使勞工免於發生職業災害。<\/div>\n<div class=\"doc-plain\">機械、設備、器具、原料、材料等物件之設計、製造或輸入者及工程之設計或施工者，應於設計、製造、輸入或施工規劃階段實施風險評估，致力防止此等物件於使用或工程施工時，發生職業災害。<\/div>\n<div class=\"chapter-heading\">第  二  章  安全衛生設施<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">雇主對下列事項應有符合規定之必要安全衛生設備及措施：<\/div>\n<div class=\"doc-plain\">防止機械、設備或器具等引起之危害。<\/div>\n<div class=\"doc-plain\">防止爆炸性或發火性等物質引起之危害。<\/div>\n<div class=\"doc-plain\">防止電、熱或其他之能引起之危害。<\/div>\n<div class=\"doc-plain\">防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。<\/div>\n<div class=\"doc-plain\">防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。<\/div>\n<div class=\"doc-plain\">防止高壓氣體引起之危害。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。<\/div>\n<div class=\"doc-plain\">防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。<\/div>\n<div class=\"doc-plain\">防止監視儀表或精密作業等引起之危害。<\/div>\n<div class=\"doc-plain\">防止廢氣、廢液或殘渣等廢棄物引起之危害。<\/div>\n<div class=\"doc-plain\">防止水患、風災或火災等引起之危害。<\/div>\n<div class=\"doc-plain\">防止動物、植物或微生物等引起之危害。<\/div>\n<div class=\"doc-plain\">防止通道、地板或階梯等引起之危害。<\/div>\n<div class=\"doc-plain\">防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。<\/div>\n<div class=\"doc-plain\">雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：<\/div>\n<div class=\"doc-plain\">重複性作業等促發肌肉骨骼疾病之預防。<\/div>\n<div class=\"doc-plain\">輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。<\/div>\n<div class=\"doc-plain\">執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。<\/div>\n<div class=\"doc-plain\">避難、急救、休息或其他為保護勞工身心健康之事項。<\/div>\n<div class=\"doc-plain\">前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">製造者、輸入者、供應者或雇主，對於中央主管機關指定之機械、設備或器具，其構造、性能及防護非符合安全標準者，不得產製運出廠場、輸入、租賃、供應或設置。<\/div>\n<div class=\"doc-plain\">前項之安全標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain\">製造者或輸入者對於第一項指定之機械、設備或器具，符合前項安全標準者，應於中央主管機關指定之資訊申報網站登錄，並於其產製或輸入之產品明顯處張貼安全標示，以供識別。但屬於公告列入型式驗證之產品，應依第八條及第九條規定辦理。<\/div>\n<div class=\"doc-plain\">前項資訊登錄方式、標示及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">製造者或輸入者對於中央主管機關公告列入型式驗證之機械、設備或器具，非經中央主管機關認可之驗證機構實施型式驗證合格及張貼合格標章，不得產製運出廠場或輸入。<\/div>\n<div class=\"doc-plain\">前項應實施型式驗證之機械、設備或器具，有下列情形之一者，得免驗證，不受前項規定之限制：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.4em\">依第十六條或其他法律規定實施檢查、檢驗、驗證或認可。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.4em\">供國防軍事用途使用，並有國防部或其直屬機關出具證明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">限量製造或輸入僅供科技研發、測試用途之專用機型，並經中央主管機關核准。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.4em\">非供實際使用或作業用途之商業樣品或展覽品，並經中央主管機關核准。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.4em\">其他特殊情形，有免驗證之必要，並經中央主管機關核准。<\/div>\n<div class=\"doc-plain\">第一項之驗證，因產品構造規格特殊致驗證有困難者，報驗義務人得檢附產品安全評估報告，向中央主管機關申請核准採用適當檢驗方式為之。<\/div>\n<div class=\"doc-plain\">輸入者對於第一項之驗證，因驗證之需求，得向中央主管機關申請先行放行，經核准後，於產品之設置地點實施驗證。<\/div>\n<div class=\"doc-plain\">前四項之型式驗證實施程序、項目、標準、報驗義務人、驗證機構資格條件、認可、撤銷與廢止、合格標章、標示方法、先行放行條件、申請免驗、安全評估報告、監督管理及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">一、未完成資訊申報網站登錄。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">二、未取得型式驗證合格。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">期。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於具有危害性之化學品，應予標示、製備清單及揭示安全資料表，並採取必要之通識措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">製造者、輸入者或供應者，提供前項化學品與事業單位或自營作業者前，應予標示及提供安全資料表；資料異動時，亦同。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項化學品之範圍、標示、清單格式、安全資料表、揭示、通識措施及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於前條之化學品，應依其健康危害、散布狀況及使用量等情形，評估風險等級，並採取分級管理措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項之評估方法、分級管理程序與採行措施及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於中央主管機關定有容許暴露標準之作業場所，應確保勞工之危害暴露低於標準值。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項之容許暴露標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於經中央主管機關指定之作業場所，應訂定作業環境監測計畫，並設置或委託由中央主管機關認可之作業環境監測機構實施監測。但中央主管機關指定免經監測機構分析之監測項目，得僱用合格監測人員辦理之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於前項監測計畫及監測結果，應公開揭示，並通報中央主管機關。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關或勞動檢查機構得實施查核。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項之作業場所指定、監測計畫與監測結果揭示、通報、監測機構與監測人員資格條件、認可、撤銷與廢止、查核方式及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">製造者或輸入者對於中央主管機關公告之化學物質清單以外之新化學物質，未向中央主管機關繳交化學物質安全評估報告，並經核准登記前，不得製造或輸入含有該物質之化學品。但其他法律已規定或經中央主管機關公告不適用者，不在此限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項評估報告，中央主管機關為防止危害工作者安全及健康，於審查後得予公開。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項化學物質清單之公告、新化學物質之登記、評估報告內容、審查程序、資訊公開及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">製造者、輸入者、供應者或雇主，對於經中央主管機關指定之管制性化學品，不得製造、輸入、供應或供工作者處置、使用。但經中央主管機關許可者，不在此限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">製造者、輸入者、供應者或雇主，對於中央主管機關指定之優先管理化學品，應將相關運作資料報請中央主管機關備查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項化學品之指定、許可條件、期間、廢止或撤銷許可、運作資料內容及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情事之一之工作場所，事業單位應依中央主管機關規定之期限，定期實施製程安全評估，並製作製程安全評估報告及採取必要之預防措施；製程修改時，亦同：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">從事石油裂解之石化工業。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">從事製造、處置或使用危害性之化學品數量達中央主管機關規定量以上。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項製程安全評估報告，事業單位應報請勞動檢查機構備查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項危害性之化學品數量、製程安全評估方法、評估報告內容要項、報請備查之期限、項目、方式及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  15-1  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位將一定規模以上之工程交付規劃、設計時，應依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位應使前項施工者依施工計畫書確實執行，並指派人員或委託專業機構監督及查證。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前三項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督與查證內容及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對於經中央主管機關指定具有危險性之機械或設備，非經勞動檢查機構或中央主管機關指定之代行檢查機構檢查合格，不得使用；其使用超過規定期間者，非經再檢查合格，不得繼續使用。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">代行檢查機構應依本法及本法所發布之命令執行職務。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">檢查費收費標準及代行檢查機構之資格條件與所負責任，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項所稱危險性機械或設備之種類、應具之容量與其製程、竣工、使用、變更或其他檢查之程序、項目、標準及檢查合格許可有效使用期限等事項之規則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工工作場所之建築物，應由依法登記開業之建築師依建築法規及本法有關安全衛生之規定設計。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">工作場所有立即發生危險之虞時，雇主或工作場所負責人應即令停止作業，並使勞工退避至安全場所。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工執行職務發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並立即向直屬主管報告。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主不得對前項勞工予以解僱、調職、不給付停止作業期間工資或其他不利之處分。但雇主證明勞工濫用停止作業權，經報主管機關認定，並符合勞動法令規定者，不在此限。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">在高溫場所工作之勞工，雇主不得使其每日工作時間超過六小時；異常氣壓作業、高架作業、精密作業、重體力勞動或其他對於勞工具有特殊危害之作業，亦應規定減少勞工工作時間，並在工作時間中予以適當之休息。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項高溫度、異常氣壓、高架、精密、重體力勞動及對於勞工具有特殊危害等作業之減少工作時間與休息時間之標準，由中央主管機關會同有關機關定之。<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主於僱用勞工時，應施行體格檢查；對在職勞工應施行下列健康檢查：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">一般健康檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">從事特別危害健康作業者之特殊健康檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">經中央主管機關指定為特定對象及特定項目之健康檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項檢查應由中央主管機關會商中央衛生主管機關認可之醫療機構之醫師為之；檢查紀錄雇主應予保存，並負擔健康檢查費用；實施特殊健康檢查時，雇主應提供勞工作業內容及暴露情形等作業經歷資料予醫療機構。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項檢查之對象及其作業經歷、項目、期間、健康管理分級、檢查紀錄與保存期限及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">醫療機構對於健康檢查之結果，應通報中央主管機關備查，以作為工作相關疾病預防之必要應用。但一般健康檢查結果之通報，以指定項目發現異常者為限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第二項醫療機構之認可條件、管理、檢查醫師資格與前項檢查結果之通報內容、方式、期限及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工對於第一項之檢查，有接受之義務。<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依前條體格檢查發現應僱勞工不適於從事某種工作，不得僱用其從事該項工作。健康檢查發現勞工有異常情形者，應由醫護人員提供其健康指導；其經醫師健康評估結果，不能適應原有工作者，應參採醫師之建議，變更其作業場所、更換工作或縮短工作時間，並採取健康管理措施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應依前條檢查結果及個人健康注意事項，彙編成健康檢查手冊，發給勞工，並不得作為健康管理目的以外之用途。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項有關健康管理措施、檢查手冊內容及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  二  章之一 職場霸凌之防治<\/div>\n<div class=\"article-heading\">第  22-1  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本法所稱職場霸凌，指勞工於勞動場所執行職務，因其事業單位人員利用職務或權勢等關係，逾越業務上必要且合理範圍，持續以冒犯、威脅、冷落、孤立、侮辱或其他不當之言詞或行為，致其身心健康遭受危害。但情節重大者，不以持續發生為必要。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應採取必要之措施，防治職場霸凌之發生；其僱用勞工人數達下列規模者，並依各款規定辦理：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">霸凌申訴管道，並在工作場所公開揭示。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">場霸凌防治措施、申訴及懲處規範，並在工作場所公開揭示。<\/span><\/div>\n<div class=\"article-heading\">第  22-2  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主於知悉勞工遭受職場霸凌時，應採取下列立即有效之適當措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">發生之措施。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">諮詢或必要之協助及保護措施。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">者，得予協調，如協調不成立時，應續行調查。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">（四）對行為人為適當之懲戒或處理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">二、雇主非因前款情形而知悉時：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">（一）就相關事實進行必要之釐清。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">起申訴。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">（三）適度調整工作內容或工作場所。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">必要之協助及保護措施。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主對於職場霸凌事件之調查或協調，應秉持客觀、公正、公平原則；於調查時，除給予當事人充分陳述意見及答辯機會外，並應遵守利益迴避規定。雇主僱用勞工人數達一定規模者，應組成調查小組；其調查小組外聘成員比例不得少於二分之一。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主接獲被霸凌勞工申訴時，應於中央主管機關指定之網站登錄；事件之處理結果，亦應於該網站登錄之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主依前三項所為之適當措施、調查處理與申復原則、一定規模之認定、資訊登錄方式，與前條第二項各款應訂定之防治措施、申訴及懲處規範，內容應包括職場霸凌之樣態、預防事項、教育訓練、申訴管道、調查、處理與申復程序、調查人員資格與調查小組之組成、利益迴避事項、懲戒處理及其他相關措施；其準則，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">雇主所為職場霸凌事件之調查結果，經認定違反前項所定準則之規定，且調查程序有重大瑕疵者，主管機關或勞動檢查機構得要求重新調查，雇主不得拒絕。<\/div>\n<div class=\"article-heading\">第  22-3  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">，不予受理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  三  章  安全衛生管理<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"article-heading\">第十六條<\/div><div class=\"doc-plain\">第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項其他特定機械之種類及應具之容量，由中央主管機關公告之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位以其事業招人承攬時，其承攬人就承攬部分負本法所定雇主之責任；原事業單位就職業災害補償仍應與承攬人負連帶責任。再承攬者亦同。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">原事業單位違反本法或有關安全衛生規定，致承攬人所僱勞工發生職業災害時，與承攬人負連帶賠償責任。再承攬者亦同。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位以其事業交付承攬時，應於事前就交付承攬之事業實施風險評估，將有關工作環境、危害因素與應採取之安全衛生設備及措施等評估結果告知該承攬人，並於承攬期間使承攬人依評估結果確實執行。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">人，擔任指揮、監督及協調之工作。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">二、工作之連繫及調整。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">三、工作場所之巡視。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">及協助。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">六、其他為防止職業災害之必要事項。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第六款規定辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。<\/div>\n<div class=\"article-heading\">第  27-1  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項經指定之施工者，應執行整體工程安全衛生統合管理事項。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">二個以上之事業單位分別出資共同承攬工程時，應互推一人為代表人；該代表人視為該工程之事業雇主，負本法雇主防止職業災害之責任。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主不得使未滿十八歲者從事下列危險性或有害性工作：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">坑內工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">處理爆炸性、易燃性等物質之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">鉛、汞、鉻、砷、黃磷、氯氣、氰化氫、苯胺等有害物散布場所之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有害輻射散布場所之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有害粉塵散布場所之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">運轉中機器或動力傳導裝置危險部分之掃除、上油、檢查、修理或上卸皮帶、繩索等工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">超過二百二十伏特電力線之銜接。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">已熔礦物或礦渣之處理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">鍋爐之燒火及操作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">鑿岩機及其他有顯著振動之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">一定重量以上之重物處理工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">起重機、人字臂起重桿之運轉工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">動力捲揚機、動力運搬機及索道之運轉工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">橡膠化合物及合成樹脂之滾輾工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他經中央主管機關規定之危險性或有害性之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項危險性或有害性工作之認定標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">未滿十八歲者從事第一項以外之工作，經第二十條或第二十二條之醫師評估結果，不能適應原有工作者，雇主應參採醫師之建議，變更其作業場所、更換工作或縮短工作時間，並採取健康管理措施。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主不得使妊娠中之女性勞工從事下列危險性或有害性工作：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">礦坑工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">鉛及其化合物散布場所之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">異常氣壓之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">處理或暴露於弓形蟲、德國麻疹等影響胎兒健康之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">處理或暴露於二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、砷及其化合物、汞及其無機化合物等經中央主管機關規定之危害性化學品之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">鑿岩機及其他有顯著振動之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">一定重量以上之重物處理工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">有害輻射散布場所之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">已熔礦物或礦渣之處理工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">起重機、人字臂起重桿之運轉工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">動力捲揚機、動力運搬機及索道之運轉工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">橡膠化合物及合成樹脂之滾輾工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">處理或暴露於經中央主管機關規定具有致病或致死之微生物感染風險之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他經中央主管機關規定之危險性或有害性之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主不得使分娩後未滿一年之女性勞工從事下列危險性或有害性工作：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">礦坑工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">鉛及其化合物散布場所之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">鑿岩機及其他有顯著振動之工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">一定重量以上之重物處理工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他經中央主管機關規定之危險性或有害性之工作。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項第五款至第十四款及前項第三款至第五款所定之工作，雇主依第三十一條採取母性健康保護措施，經當事人書面同意者，不在此限。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項及第二項危險性或有害性工作之認定標準，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主未經當事人告知妊娠或分娩事實而違反第一項或第二項規定者，得免予處罰。但雇主明知或可得而知者，不在此限。<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關指定之事業，雇主應對有母性健康危害之虞之工作，採取危害評估、控制及分級管理措施；對於妊娠中或分娩後未滿一年之女性勞工，應依醫師適性評估建議，採取工作調整或更換等健康保護措施，並留存紀錄。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項勞工於保護期間，因工作條件、作業程序變更、當事人健康異常或有不適反應，經醫師評估確認不適原有工作者，雇主應依前項規定重新辦理之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項事業之指定、有母性健康危害之虞之工作項目、危害評估程序與控制、分級管理方法、適性評估原則、工作調整或更換、醫師資格與評估報告之文件格式、紀錄保存及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主未經當事人告知妊娠或分娩事實而違反第一項或第二項規定者，得免予處罰。但雇主明知或可得而知者，不在此限。<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工對於第一項之安全衛生教育訓練，有接受之義務。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應負責宣導本法及有關安全衛生之規定，使勞工周知。<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞工對於前項安全衛生工作守則，應切實遵行。<\/div>\n<div class=\"chapter-heading\">第  四  章  監督與檢查<\/div>\n<div class=\"article-heading\">第  35  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業安全衛生諮詢會，研議國家職業安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。<\/div>\n<div class=\"article-heading\">第  36  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關及勞動檢查機構對於各事業單位勞動場所得實施檢查。其有不合規定者，應告知違反法令條款，並通知限期改善；屆期未改善或已發生職業災害，或有發生職業災害之虞時，得通知其部分或全部停工。勞工於停工期間應由雇主照給工資。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位對於前項之改善，於必要時，得請中央主管機關協助或洽請認可之顧問服務機構提供專業技術輔導。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項顧問服務機構之種類、條件、服務範圍、顧問人員之資格與職責、認可程序、撤銷、廢止、管理及其他應遵行事項之規則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  37  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">發生死亡災害。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">發生災害之罹災人數在三人以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">發生災害之罹災人數在一人以上，且需住院治療。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:5.55em\">其他經中央主管機關指定公告之災害。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。<\/div>\n<div class=\"article-heading\">第  38  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關指定之事業，雇主應依規定填載職業災害內容及統計，按月報請勞動檢查機構備查，並公布於工作場所。<\/div>\n<div class=\"article-heading\">第  39  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">二、疑似罹患職業病。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">三、身體或精神遭受侵害。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主為前項不利處分者，無效。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。<\/div>\n<div class=\"chapter-heading\">第  五  章  罰則<\/div>\n<div class=\"article-heading\">第  40  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。<\/div>\n<div class=\"article-heading\">第  41  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">之規定，致發生第三十七條第二項第二款之災害。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">一項或第三十條第一項、第二項之規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">第三十六條第一項所發停工之通知。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">經許可而移動或破壞現場。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。<\/div>\n<div class=\"article-heading\">第  42  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第十五條第一項、第二項之規定，其危害性化學品洩漏或引起火災、爆炸致發生第三十七條第二項之職業災害者，處新臺幣三十萬元以上三百萬元以下罰鍰；經通知限期改善，屆期未改善，並得按次處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">雇主依第十二條第四項規定通報之監測資料，經中央主管機關查核有虛偽不實者，處新臺幣三十萬元以上一百萬元以下罰鍰。<\/div>\n<div class=\"article-heading\">第  43  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">、第二十三條第二項之規定，經通知限期改善，屆期未改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">第二項後段或第二十二條之二第一項規定，致發生職業病或工作相關疾病。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定致發生第三十七條第二項之災害。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">，按次處罰。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">調查、抽驗、市場查驗或查核。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。<\/div>\n<div class=\"article-heading\">第  44  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。<\/div>\n<div class=\"article-heading\">第  45  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第十七條、第十八條第三項、第二十二條之二第一項第一款、第二項、第五項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">工資而不給付。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。<\/div>\n<div class=\"article-heading\">第  46  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項情形，操作人員係因雇主指示作業所致者，不予處罰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。<\/div>\n<div class=\"article-heading\">第  47  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">代行檢查機構執行職務，違反本法或依本法所發布之命令者，處新臺幣六萬元以上三十萬元以下罰鍰；其情節重大者，中央主管機關並得予以暫停代行檢查職務或撤銷指定代行檢查職務之處分。<\/div>\n<div class=\"article-heading\">第  48  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">驗證機構違反中央主管機關依第八條第五項規定所定之辦法。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">監測機構違反中央主管機關依第十二條第五項規定所定之辦法。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。<\/div>\n<div class=\"article-heading\">第  49  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">一、發生第三十七條第二項之災害。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">條或第四十八條之情形。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">三、發生職業病。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">符合前項第一款或第二款情形，並應公布職業災害之發生日期、發生地及罹災人數。<\/div>\n<div class=\"chapter-heading\">第  六  章  附則<\/div>\n<div class=\"article-heading\">第  50  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">為提升雇主及工作者之職業安全衛生知識，促進職業安全衛生文化之發展，中央主管機關得訂定獎勵或補助辦法，鼓勵事業單位及有關團體辦理之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">直轄市與縣(市)主管機關及各目的事業主管機關應積極推動職業安全衛生業務；中央主管機關得訂定績效評核及獎勵辦法。<\/div>\n<div class=\"article-heading\">第  51  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。<\/div>\n<div class=\"article-heading\">第二條<\/div><div class=\"doc-plain\">第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。<\/div>\n<div class=\"article-heading\">第  51-1  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。<\/div>\n<div class=\"article-heading\">第  52  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">中央主管機關得將第八條驗證機構管理、第九條抽驗與市場查驗、第十二條作業環境監測機構之管理、查核與監測結果之通報、第十三條新化學物質之登記與報告之審查、第十四條管制性化學品之許可與優先管理化學品之運作資料之備查、第二十條認可之醫療機構管理及健康檢查結果之通報、第二十三條第三項職業安全衛生管理系統之訪查與績效認可、第三十二條第二項訓練單位之管理及第三十九條第二項疑似職業病調查等業務，委託相關專業團體辦理。<\/div>\n<div class=\"article-heading\">第  53  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">主管機關辦理本法所定之認可、審查、許可、驗證、檢查及指定等業務，應收規費；其收費標準由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  54  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本法施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  55  條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">本法施行日期，由行政院定之。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國108年5月15日總統華總一義字第10800049111  號令修正公布第3、6條條文；施行日期，由行政院定之。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國108年6月13日行政院院臺勞字第1080018514 號令發布定自108年6月15日施行。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3. 中華民國114年12月19日總統華總一義字第11400130481號令修正公布第 2、6、9、22、23、24、26、27、32、39、40、41、43～46、48、49、51條條文；增訂第15-1、22-1～22-3、27-1、51-1  條條文及第二章之一章名；施行日期，由行政院定之中華民國115年6月9日行政院院臺勞字第1151014441號令發布定自115年7月1日施行<\/div>"},{"title":"職業訓練法","content":"第  一  章  總則\n第  1  條\n為實施職業訓練，以培養國家建設技術人力，提高工作技能，促進國民就業，特制定本法。\n第  2  條\n本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  3  條\n本法所稱職業訓練，指為培養及增進工作技能而依本法實施之訓練。\n職業訓練之實施，分為養成訓練、技術生訓練、進修訓練及轉業訓練。\n主管機關得將前項所定養成訓練及轉業訓練之職業訓練事項，委任所屬機關(構)或委託職業訓練機構、相關機關(構)、學校、團體或事業機構辦理。\n接受前項委任或委託辦理職業訓練之資格條件、方式及其他應遵行事項之辦法，由中央主管機關定之。\n第  4  條\n職業訓練應與職業教育、補習教育及就業服務，配合實施。\n第  4-1  條\n中央主管機關應協調、整合各中央目的事業主管機關所定之職能基準、訓練課程、能力鑑定規範與辦理職業訓練等服務資訊，以推動國民就業所需之職業訓練及技能檢定。\n第  二  章  職業訓練機構\n第  5  條\n職業訓練機構包括左列三類：\n政府機關設立者。\n事業機構、學校或社團法人等團體附設者。\n以財團法人設立者。\n第  6  條\n職業訓練機構之設立，應經中央主管機關登記或許可；停辦或解散時，應報中央主管機關核備。\n職業訓練機構，依其設立目的，辦理訓練；並得接受委託，辦理訓練。\n職業訓練機構之設立及管理辦法，由中央主管機關定之。\n第  三  章  職業訓練之實施\n第  一  節  養成訓練\n第  7  條\n養成訓練，係對十五歲以上或國民中學畢業之國民，所實施有系統之職前訓練。\n第  8  條\n養成訓練，除本法另有規定外，由職業訓練機構辦理。\n第  9  條\n經中央主管機關公告職類之養成訓練，應依中央主管機關規定之訓練課程、時數及應具設備辦理。\n第  10  條\n養成訓練期滿，經測驗成績及格者，由辦理職業訓練之機關(構)、學校、團體或事業機構發給結訓證書。\n第  二  節  技術生訓練\n第  11  條\n技術生訓練，係事業機構為培養其基層技術人力，招收十五歲以上或國民中學畢業之國民，所實施之訓練。\n技術生訓練之職類及標準，由中央主管機關訂定公告之。\n第  12  條\n事業機構辦理技術生訓練，應先擬訂訓練計畫，並依有關法令規定，與技\n術生簽訂書面訓練契約。\n第  13  條\n主管機關對事業機構辦理技術生訓練，應予輔導及提供技術協助。\n第  14  條\n技術生訓練期滿，經測驗成績及格者，由事業機構發給結訓證書。\n第  三  節  進修訓練\n第  15  條\n進修訓練，係為增進在職技術員工專業技能與知識，以提高勞動生產力所實施之訓練。\n第  16  條\n進修訓練，由事業機構自行辦理、委託辦理或指派其參加國內外相關之專業訓練。\n第  17  條\n事業機構辦理進修訓練，應於年度終了後二個月內將辦理情形，報主管機關備查。\n第  四  節  轉業訓練\n第  18  條\n轉業訓練，係為職業轉換者獲得轉業所需之工作技能與知識，所實施之訓練。\n第  19  條\n主管機關為因應社會經濟變遷，得辦理轉業訓練需要之調查及受理登記，配合社會福利措施，訂定訓練計畫。\n主管機關擬定前項訓練計畫時，關於農民志願轉業訓練，應會商農業主管機關訂定。\n第  20  條\n轉業訓練，除本法另有規定外，由職業訓練機構辦理。\n第  五  節\n(刪除)\n第  21  條\n(刪除)\n第  22  條\n(刪除)\n第  23  條\n(刪除)\n第  四  章  職業訓練師\n第  24  條\n職業訓練師，係指直接擔任職業技能與相關知識教學之人員。\n職業訓練師之名稱、等級、資格、甄審及遴聘辦法，由中央主管機關定之。\n第  25  條\n職業訓練師經甄審合格者，其在職業訓練機構之教學年資，得與同等學校\n教師年資相互採計。其待遇並得比照同等學校教師。\n前項採計及比照辦法，由中央主管機關會同教育主管機關定之。\n第  26  條\n中央主管機關，得指定職業訓練機構，辦理職業訓練師之養成訓練、補充訓練及進修訓練。\n前項職業訓練師培訓辦法，由中央主管機關定之。\n第  五  章  事業機構辦理訓練之費用\n第  27  條\n應辦職業訓練之事業機構，其每年實支之職業訓練費用，不得低於當年度營業額之規定比率。其低於規定比率者，應於規定期限內，將差額繳交中央主管機關設置之職業訓練基金，以供統籌辦理職業訓練之用。\n前項事業機構之業別、規模、職業訓練費用比率、差額繳納期限及職業訓練基金之設置、管理、運用辦法，由行政院定之。\n第  28  條\n前條事業機構，支付職業訓練費用之項目如左：\n自行辦理或聯合辦理訓練費用。\n委託辦理訓練費用。\n指派參加訓練費用。\n前項費用之審核辦法，由中央主管機關定之。\n第  29  條\n依第二十七條規定，提列之職業訓練費用，應有獨立之會計科目，專款專用，並以業務費用列支。\n第  30  條\n應辦職業訓練之事業機構，須於年度終了後二個月內將職業訓練費用動支情形，報主管機關審核。\n第  六  章  技能檢定、發證及認證\n第  31  條\n為提高技能水準，建立證照制度，應由中央主管機關辦理技能檢定。\n前項技能檢定，必要時中央主管機關得委託或委辦有關機關(構)、團體辦理。\n第  31-1  條\n中央目的事業主管機關或依法設立非以營利為目的之全國性專業團體，得向中央主管機關申請技能職類測驗能力之認證。\n前項認證業務，中央主管機關得委託非以營利為目的之專業認證機構辦理。\n前二項機關、團體、機構之資格條件、審查程序、審查費數額、認證職類、等級與期間、終止委託及其他管理事項之辦法，由中央主管機關定之。\n第  31-2  條\n依前條規定經認證之機關、團體(以下簡稱經認證單位)，得辦理技能職類測驗，並對測驗合格者，核發技能職類證書。\n前項證書之效力比照技術士證，其等級比照第三十二條規定；發證及管理之辦法，由中央主管機關定之。\n第  32  條\n辦理技能檢定之職類，依其技能範圍及專精程度，分甲、乙、丙三級；不宜分三級者，由中央主管機關定之。\n第  33  條\n技能檢定合格者稱技術士，由中央主管機關統一發給技術士證。\n技能檢定題庫之設置與管理、監評人員之甄審訓練與考核、申請檢定資格、學、術科測試委託辦理、術科測試場地機具、設備評鑑與補助、技術士證發證、管理及對推動技術士證照制度獎勵等事項，由中央主管機關另以辦法定之。\n技能檢定之職類開發、規範製訂、試題命製與閱卷、測試作業程序、學科監場、術科監評及試場須知等事項，由中央主管機關另以規則定之。\n第  34  條\n進用技術性職位人員，取得乙級技術士證者，得比照專科學校畢業程度遴用；取得甲級技術士證者，得比照大學校院以上畢業程度遴用。\n第  35  條\n技術上與公共安全有關業別之事業機構，應僱用一定比率之技術士；其業別及比率由行政院定之。\n第  七  章  輔導及獎勵\n第  36  條\n主管機關得隨時派員查察職業訓練機構及事業機構辦理職業訓練情形。\n職業訓練機構或事業機構，對前項之查察不得拒絕，並應提供相關資料。\n第  37  條\n主管機關對職業訓練機構或事業機構辦理職業訓練情形，得就考核結果依左列規定辦理：\n著有成效者，予以獎勵。\n技術不足者，予以指導。\n經費困難者，酌予補助。\n第  38  條\n私人、團體或事業機構，捐贈財產辦理職業訓練，或對職業訓練有其他特殊貢獻者，應予獎勵。\n第  38-1  條\n中央主管機關為鼓勵國民學習職業技能，提高國家職業技能水準，應舉辦技能競賽。\n前項技能競賽之實施、委任所屬機關(構)或委託有關機關(構)、團體辦理、裁判人員遴聘、選手資格與限制、競賽規則、爭議處理及獎勵等事項之辦法，由中央主管機關定之。\n第  八  章  罰則\n第  39  條\n職業訓練機構辦理不善或有違反法令或設立許可條件者，主管機關得視其情節，分別為下列處理：\n警告。\n限期改善。\n停訓整頓。\n撤銷或廢止許可。\n第 39-1 條\n依第三十一條之一規定經認證單位，不得有下列情形：\n辦理技能職類測驗，為不實之廣告或揭示。\n收取技能職類測驗規定數額以外之費用。\n謀取不正利益、圖利自己或他人。\n會務或財務運作發生困難。\n依規定應提供資料，拒絕提供、提供不實或失效之資料。\n違反中央主管機關依第三十一條之一第三項所定辦法關於資格條件、審查程序或其他管理事項規定。\n違反前項各款規定者，處新臺幣三萬元以上三十萬元以下罰鍰，中央主管機關並得視其情節，分別為下列處理：\n警告。\n限期改善。\n停止辦理測驗。\n撤銷或廢止認證。\n經認證單位依前項第四款規定受撤銷或廢止認證者，自生效日起，不得再核發技能職類證書。\n經認證單位違反前項規定或未經認證單位，核發第三十一條之二規定之技能職類證書者，處新臺幣十萬元以上一百萬元以下罰鍰。\n第  39-2  條\n取得技能職類證書者，有下列情形之一時，中央主管機關應撤銷或廢止其證書：\n以詐欺、脅迫、賄賂或其他不正方法取得證書。\n證書租借他人使用。\n違反第三十一條之二第二項所定辦法關於證書效力等級、發證或其他管理事項規定，情節重大。\n經認證單位依前條規定受撤銷或廢止認證者，其參加技能職類測驗人員於生效日前合法取得之證書，除有前項行為外，效力不受影響。\n第  40  條\n依第二十七條規定，應繳交職業訓練費用差額而未依規定繳交者，自規定期限屆滿之次日起，至差額繳清日止，每逾一日加繳欠繳差額百分之零點二滯納金。但以不超過欠繳差額一倍為限。\n第  41  條\n本法所定應繳交之職業訓練費用差額及滯納金，經通知限期繳納而逾期仍未繳納者，得移送法院強制執行。\n第  九  章  附則\n第  42  條\n(刪除)\n第  43  條\n本法施行細則，由中央主管機關定之。\n第  44  條\n本法自公布日施行。\n本法修正條文，除中華民國一百年十月二十五日修正之第三十一條之一、第三十一條之二、第三十九條之一及第三十九條之二自公布後一年施行外，自公布日施行。","history":"1.103年2月14日行政院院臺規字第 1030124618 號公告 第2條所列屬「行政院勞工委員會」之權責事項，自103年2月17日起改由「勞動部」管轄。\n2.104年7月1日總統華總一義字第 10400077161號令修正公布第2條條文。","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">為實施職業訓練，以培養國家建設技術人力，提高工作技能，促進國民就業，特制定本法。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">本法所稱職業訓練，指為培養及增進工作技能而依本法實施之訓練。<\/div>\n<div class=\"doc-plain\">職業訓練之實施，分為養成訓練、技術生訓練、進修訓練及轉業訓練。<\/div>\n<div class=\"doc-plain\">主管機關得將前項所定養成訓練及轉業訓練之職業訓練事項，委任所屬機關(構)或委託職業訓練機構、相關機關(構)、學校、團體或事業機構辦理。<\/div>\n<div class=\"doc-plain\">接受前項委任或委託辦理職業訓練之資格條件、方式及其他應遵行事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">職業訓練應與職業教育、補習教育及就業服務，配合實施。<\/div>\n<div class=\"article-heading\">第  4-1  條<\/div>\n<div class=\"doc-plain\">中央主管機關應協調、整合各中央目的事業主管機關所定之職能基準、訓練課程、能力鑑定規範與辦理職業訓練等服務資訊，以推動國民就業所需之職業訓練及技能檢定。<\/div>\n<div class=\"chapter-heading\">第  二  章  職業訓練機構<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">職業訓練機構包括左列三類：<\/div>\n<div class=\"doc-plain\">政府機關設立者。<\/div>\n<div class=\"doc-plain\">事業機構、學校或社團法人等團體附設者。<\/div>\n<div class=\"doc-plain\">以財團法人設立者。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">職業訓練機構之設立，應經中央主管機關登記或許可；停辦或解散時，應報中央主管機關核備。<\/div>\n<div class=\"doc-plain\">職業訓練機構，依其設立目的，辦理訓練；並得接受委託，辦理訓練。<\/div>\n<div class=\"doc-plain\">職業訓練機構之設立及管理辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  三  章  職業訓練之實施<\/div>\n<div class=\"doc-plain\">第  一  節  養成訓練<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">養成訓練，係對十五歲以上或國民中學畢業之國民，所實施有系統之職前訓練。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">養成訓練，除本法另有規定外，由職業訓練機構辦理。<\/div>\n<div class=\"article-heading\">第  9  條<\/div>\n<div class=\"doc-plain\">經中央主管機關公告職類之養成訓練，應依中央主管機關規定之訓練課程、時數及應具設備辦理。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">養成訓練期滿，經測驗成績及格者，由辦理職業訓練之機關(構)、學校、團體或事業機構發給結訓證書。<\/div>\n<div class=\"doc-plain\">第  二  節  技術生訓練<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">技術生訓練，係事業機構為培養其基層技術人力，招收十五歲以上或國民中學畢業之國民，所實施之訓練。<\/div>\n<div class=\"doc-plain\">技術生訓練之職類及標準，由中央主管機關訂定公告之。<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">事業機構辦理技術生訓練，應先擬訂訓練計畫，並依有關法令規定，與技<\/div>\n<div class=\"doc-plain\">術生簽訂書面訓練契約。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">主管機關對事業機構辦理技術生訓練，應予輔導及提供技術協助。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">技術生訓練期滿，經測驗成績及格者，由事業機構發給結訓證書。<\/div>\n<div class=\"doc-plain\">第  三  節  進修訓練<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">進修訓練，係為增進在職技術員工專業技能與知識，以提高勞動生產力所實施之訓練。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">進修訓練，由事業機構自行辦理、委託辦理或指派其參加國內外相關之專業訓練。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">事業機構辦理進修訓練，應於年度終了後二個月內將辦理情形，報主管機關備查。<\/div>\n<div class=\"doc-plain\">第  四  節  轉業訓練<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">轉業訓練，係為職業轉換者獲得轉業所需之工作技能與知識，所實施之訓練。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">主管機關為因應社會經濟變遷，得辦理轉業訓練需要之調查及受理登記，配合社會福利措施，訂定訓練計畫。<\/div>\n<div class=\"doc-plain\">主管機關擬定前項訓練計畫時，關於農民志願轉業訓練，應會商農業主管機關訂定。<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">轉業訓練，除本法另有規定外，由職業訓練機構辦理。<\/div>\n<div class=\"doc-plain\">第  五  節<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"chapter-heading\">第  四  章  職業訓練師<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">職業訓練師，係指直接擔任職業技能與相關知識教學之人員。<\/div>\n<div class=\"doc-plain\">職業訓練師之名稱、等級、資格、甄審及遴聘辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">職業訓練師經甄審合格者，其在職業訓練機構之教學年資，得與同等學校<\/div>\n<div class=\"doc-plain\">教師年資相互採計。其待遇並得比照同等學校教師。<\/div>\n<div class=\"doc-plain\">前項採計及比照辦法，由中央主管機關會同教育主管機關定之。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">中央主管機關，得指定職業訓練機構，辦理職業訓練師之養成訓練、補充訓練及進修訓練。<\/div>\n<div class=\"doc-plain\">前項職業訓練師培訓辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  五  章  事業機構辦理訓練之費用<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">應辦職業訓練之事業機構，其每年實支之職業訓練費用，不得低於當年度營業額之規定比率。其低於規定比率者，應於規定期限內，將差額繳交中央主管機關設置之職業訓練基金，以供統籌辦理職業訓練之用。<\/div>\n<div class=\"doc-plain\">前項事業機構之業別、規模、職業訓練費用比率、差額繳納期限及職業訓練基金之設置、管理、運用辦法，由行政院定之。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">前條事業機構，支付職業訓練費用之項目如左：<\/div>\n<div class=\"doc-plain\">自行辦理或聯合辦理訓練費用。<\/div>\n<div class=\"doc-plain\">委託辦理訓練費用。<\/div>\n<div class=\"doc-plain\">指派參加訓練費用。<\/div>\n<div class=\"doc-plain\">前項費用之審核辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">依第二十七條規定，提列之職業訓練費用，應有獨立之會計科目，專款專用，並以業務費用列支。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">應辦職業訓練之事業機構，須於年度終了後二個月內將職業訓練費用動支情形，報主管機關審核。<\/div>\n<div class=\"chapter-heading\">第  六  章  技能檢定、發證及認證<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">為提高技能水準，建立證照制度，應由中央主管機關辦理技能檢定。<\/div>\n<div class=\"doc-plain\">前項技能檢定，必要時中央主管機關得委託或委辦有關機關(構)、團體辦理。<\/div>\n<div class=\"article-heading\">第  31-1  條<\/div>\n<div class=\"doc-plain\">中央目的事業主管機關或依法設立非以營利為目的之全國性專業團體，得向中央主管機關申請技能職類測驗能力之認證。<\/div>\n<div class=\"doc-plain\">前項認證業務，中央主管機關得委託非以營利為目的之專業認證機構辦理。<\/div>\n<div class=\"doc-plain\">前二項機關、團體、機構之資格條件、審查程序、審查費數額、認證職類、等級與期間、終止委託及其他管理事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  31-2  條<\/div>\n<div class=\"doc-plain\">依前條規定經認證之機關、團體(以下簡稱經認證單位)，得辦理技能職類測驗，並對測驗合格者，核發技能職類證書。<\/div>\n<div class=\"doc-plain\">前項證書之效力比照技術士證，其等級比照第三十二條規定；發證及管理之辦法，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain\">辦理技能檢定之職類，依其技能範圍及專精程度，分甲、乙、丙三級；不宜分三級者，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain\">技能檢定合格者稱技術士，由中央主管機關統一發給技術士證。<\/div>\n<div class=\"doc-plain\">技能檢定題庫之設置與管理、監評人員之甄審訓練與考核、申請檢定資格、學、術科測試委託辦理、術科測試場地機具、設備評鑑與補助、技術士證發證、管理及對推動技術士證照制度獎勵等事項，由中央主管機關另以辦法定之。<\/div>\n<div class=\"doc-plain\">技能檢定之職類開發、規範製訂、試題命製與閱卷、測試作業程序、學科監場、術科監評及試場須知等事項，由中央主管機關另以規則定之。<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain\">進用技術性職位人員，取得乙級技術士證者，得比照專科學校畢業程度遴用；取得甲級技術士證者，得比照大學校院以上畢業程度遴用。<\/div>\n<div class=\"article-heading\">第  35  條<\/div>\n<div class=\"doc-plain\">技術上與公共安全有關業別之事業機構，應僱用一定比率之技術士；其業別及比率由行政院定之。<\/div>\n<div class=\"chapter-heading\">第  七  章  輔導及獎勵<\/div>\n<div class=\"article-heading\">第  36  條<\/div>\n<div class=\"doc-plain\">主管機關得隨時派員查察職業訓練機構及事業機構辦理職業訓練情形。<\/div>\n<div class=\"doc-plain\">職業訓練機構或事業機構，對前項之查察不得拒絕，並應提供相關資料。<\/div>\n<div class=\"article-heading\">第  37  條<\/div>\n<div class=\"doc-plain\">主管機關對職業訓練機構或事業機構辦理職業訓練情形，得就考核結果依左列規定辦理：<\/div>\n<div class=\"doc-plain\">著有成效者，予以獎勵。<\/div>\n<div class=\"doc-plain\">技術不足者，予以指導。<\/div>\n<div class=\"doc-plain\">經費困難者，酌予補助。<\/div>\n<div class=\"article-heading\">第  38  條<\/div>\n<div class=\"doc-plain\">私人、團體或事業機構，捐贈財產辦理職業訓練，或對職業訓練有其他特殊貢獻者，應予獎勵。<\/div>\n<div class=\"article-heading\">第  38-1  條<\/div>\n<div class=\"doc-plain\">中央主管機關為鼓勵國民學習職業技能，提高國家職業技能水準，應舉辦技能競賽。<\/div>\n<div class=\"doc-plain\">前項技能競賽之實施、委任所屬機關(構)或委託有關機關(構)、團體辦理、裁判人員遴聘、選手資格與限制、競賽規則、爭議處理及獎勵等事項之辦法，由中央主管機關定之。<\/div>\n<div class=\"chapter-heading\">第  八  章  罰則<\/div>\n<div class=\"article-heading\">第  39  條<\/div>\n<div class=\"doc-plain\">職業訓練機構辦理不善或有違反法令或設立許可條件者，主管機關得視其情節，分別為下列處理：<\/div>\n<div class=\"doc-plain\">警告。<\/div>\n<div class=\"doc-plain\">限期改善。<\/div>\n<div class=\"doc-plain\">停訓整頓。<\/div>\n<div class=\"doc-plain\">撤銷或廢止許可。<\/div>\n<div class=\"article-heading\">第 39-1 條<\/div>\n<div class=\"doc-plain\">依第三十一條之一規定經認證單位，不得有下列情形：<\/div>\n<div class=\"doc-plain\">辦理技能職類測驗，為不實之廣告或揭示。<\/div>\n<div class=\"doc-plain\">收取技能職類測驗規定數額以外之費用。<\/div>\n<div class=\"doc-plain\">謀取不正利益、圖利自己或他人。<\/div>\n<div class=\"doc-plain\">會務或財務運作發生困難。<\/div>\n<div class=\"doc-plain\">依規定應提供資料，拒絕提供、提供不實或失效之資料。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反中央主管機關依第三十一條之一第三項所定辦法關於資格條件、審查程序或其他管理事項規定。<\/div>\n<div class=\"doc-plain\">違反前項各款規定者，處新臺幣三萬元以上三十萬元以下罰鍰，中央主管機關並得視其情節，分別為下列處理：<\/div>\n<div class=\"doc-plain\">警告。<\/div>\n<div class=\"doc-plain\">限期改善。<\/div>\n<div class=\"doc-plain\">停止辦理測驗。<\/div>\n<div class=\"doc-plain\">撤銷或廢止認證。<\/div>\n<div class=\"doc-plain\">經認證單位依前項第四款規定受撤銷或廢止認證者，自生效日起，不得再核發技能職類證書。<\/div>\n<div class=\"doc-plain\">經認證單位違反前項規定或未經認證單位，核發第三十一條之二規定之技能職類證書者，處新臺幣十萬元以上一百萬元以下罰鍰。<\/div>\n<div class=\"article-heading\">第  39-2  條<\/div>\n<div class=\"doc-plain\">取得技能職類證書者，有下列情形之一時，中央主管機關應撤銷或廢止其證書：<\/div>\n<div class=\"doc-plain\">以詐欺、脅迫、賄賂或其他不正方法取得證書。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:7.4em\">證書租借他人使用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反第三十一條之二第二項所定辦法關於證書效力等級、發證或其他管理事項規定，情節重大。<\/div>\n<div class=\"doc-plain\">經認證單位依前條規定受撤銷或廢止認證者，其參加技能職類測驗人員於生效日前合法取得之證書，除有前項行為外，效力不受影響。<\/div>\n<div class=\"article-heading\">第  40  條<\/div>\n<div class=\"doc-plain\">依第二十七條規定，應繳交職業訓練費用差額而未依規定繳交者，自規定期限屆滿之次日起，至差額繳清日止，每逾一日加繳欠繳差額百分之零點二滯納金。但以不超過欠繳差額一倍為限。<\/div>\n<div class=\"article-heading\">第  41  條<\/div>\n<div class=\"doc-plain\">本法所定應繳交之職業訓練費用差額及滯納金，經通知限期繳納而逾期仍未繳納者，得移送法院強制執行。<\/div>\n<div class=\"chapter-heading\">第  九  章  附則<\/div>\n<div class=\"article-heading\">第  42  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  43  條<\/div>\n<div class=\"doc-plain\">本法施行細則，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  44  條<\/div>\n<div class=\"doc-plain\">本法自公布日施行。<\/div>\n<div class=\"doc-plain\">本法修正條文，除中華民國一百年十月二十五日修正之第三十一條之一、第三十一條之二、第三十九條之一及第三十九條之二自公布後一年施行外，自公布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.103年2月14日行政院院臺規字第 1030124618 號公告 第2條所列屬「行政院勞工委員會」之權責事項，自103年2月17日起改由「勞動部」管轄。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.104年7月1日總統華總一義字第 10400077161號令修正公布第2條條文。<\/div>"},{"title":"高級中等學校設置實習商店實施要點","content":"為達成高級中等學校設置實習商店有效管理之目的，特訂定本要點。\n高級中等學校設置實習商店，依本要點之規定辦理。\n前項高級中等學校不包括直轄市或縣 (市) 主管教育行政機關設立或核准立案者。\n為提供學生實習環境，使學生所學理論與實務互相配合，設有商業類科 (含商業學程) 學校得設置實習商店 (以下簡稱本店) 。\n本店店址設於本校校內為原則。\n本店籌設資金來源應循預算程序辦理。\n本店業務之對象，限於校內教職員工生。\n本店銷售貨品範圍如下：\n文具用品。\n日用百貨。\n罐頭及食品。\n其他代辦教學實習器材等相關業務。\n本店設實習指導委員會，由校長就本校教職員中聘請若干人為委員組織之，校長為當然委員兼召集人，並為會議主席。\n本店設經理、副理各一人，其下得視業務需要酌設營業、會計、出納、文書等組。經理由實習主任兼任，其他人員由經理遴選適當人選提指導委員會通過聘兼之。\n經理綜合店內一切業務並執行實習指導委員會議決事項，副理協助經理綜合店內業務，其他人員承經理之命，分別辦理相關業務。但會計與出納不得同一人兼任。\n本店實習指導委員，任期為一學年，連聘得連任。\n實習指導委員會之職權如下：\n審定業務計畫。\n審定各項預算及決算。\n審查經理提報各兼職人選及其他有關事項。\n擬定本店有關業務之各種決策。\n實習指導委員會每學期開會一次，必要時得召開臨時會議，均由召集人召集之。\n本店應按日填造購銷日報表、現金出納結存表、應收及應付帳款明細表，送請經理審核之。\n本店會計年度採學年度，每學期末編製半年報，年度終了時應編造營業報告書、資產負債表、損益表及財產目錄，提實習指導委員會審核公布之。\n實習指導委員會召集人，應定期指派人員查核商店收支帳目，編製查核報書，提實習指導委員會報告。\n本店收支，國立學校得依「公立高級中等學校提供場地設施辦理甄選及推廣教育等收支管理作業規定」辦理；私立學校如有盈餘，應撥充學校基金，或提撥盈餘使用計畫，送請董事會決議後實施，但不得將盈餘分配予個人、法人或其他團體。\n本店有關經費收支，應設專戶處理。\n本店有關人員，對實習學生應負責指導下列事項：\n交易程序。\n業務處理。\n商品陳列。\n商品包裝。\n帳務處理。\n廣告設計及運用。\n服務精神及態度。\n本店為配合學生之實習，可另製專供實習之憑證、帳冊、報表等指導學生登錄或填報。","history":"93年11月9日教育部部授教中(三)字第 0930519354 號令修正發布第 17 點條文；並自發布日生效。","contentHtml":"<div class=\"doc-plain\">為達成高級中等學校設置實習商店有效管理之目的，特訂定本要點。<\/div>\n<div class=\"doc-plain\">高級中等學校設置實習商店，依本要點之規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項高級中等學校不包括直轄市或縣 (市) 主管教育行政機關設立或核准立案者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">為提供學生實習環境，使學生所學理論與實務互相配合，設有商業類科 (含商業學程) 學校得設置實習商店 (以下簡稱本店) 。<\/div>\n<div class=\"doc-plain\">本店店址設於本校校內為原則。<\/div>\n<div class=\"doc-plain\">本店籌設資金來源應循預算程序辦理。<\/div>\n<div class=\"doc-plain\">本店業務之對象，限於校內教職員工生。<\/div>\n<div class=\"doc-plain\">本店銷售貨品範圍如下：<\/div>\n<div class=\"doc-plain\">文具用品。<\/div>\n<div class=\"doc-plain\">日用百貨。<\/div>\n<div class=\"doc-plain\">罐頭及食品。<\/div>\n<div class=\"doc-plain\">其他代辦教學實習器材等相關業務。<\/div>\n<div class=\"doc-plain\">本店設實習指導委員會，由校長就本校教職員中聘請若干人為委員組織之，校長為當然委員兼召集人，並為會議主席。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本店設經理、副理各一人，其下得視業務需要酌設營業、會計、出納、文書等組。經理由實習主任兼任，其他人員由經理遴選適當人選提指導委員會通過聘兼之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">經理綜合店內一切業務並執行實習指導委員會議決事項，副理協助經理綜合店內業務，其他人員承經理之命，分別辦理相關業務。但會計與出納不得同一人兼任。<\/div>\n<div class=\"doc-plain\"> 本店實習指導委員，任期為一學年，連聘得連任。<\/div>\n<div class=\"doc-plain\">實習指導委員會之職權如下：<\/div>\n<div class=\"doc-plain\">審定業務計畫。<\/div>\n<div class=\"doc-plain\"> 審定各項預算及決算。<\/div>\n<div class=\"doc-plain\">審查經理提報各兼職人選及其他有關事項。<\/div>\n<div class=\"doc-plain\"> 擬定本店有關業務之各種決策。<\/div>\n<div class=\"doc-plain\">實習指導委員會每學期開會一次，必要時得召開臨時會議，均由召集人召集之。<\/div>\n<div class=\"doc-plain\">本店應按日填造購銷日報表、現金出納結存表、應收及應付帳款明細表，送請經理審核之。<\/div>\n<div class=\"doc-plain\">本店會計年度採學年度，每學期末編製半年報，年度終了時應編造營業報告書、資產負債表、損益表及財產目錄，提實習指導委員會審核公布之。<\/div>\n<div class=\"doc-plain\">實習指導委員會召集人，應定期指派人員查核商店收支帳目，編製查核報書，提實習指導委員會報告。<\/div>\n<div class=\"doc-plain\">本店收支，國立學校得依「公立高級中等學校提供場地設施辦理甄選及推廣教育等收支管理作業規定」辦理；私立學校如有盈餘，應撥充學校基金，或提撥盈餘使用計畫，送請董事會決議後實施，但不得將盈餘分配予個人、法人或其他團體。<\/div>\n<div c
