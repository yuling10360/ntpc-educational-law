w doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">第二款以五加二開辦專班模式且於五專護理科辦理者，應採五專在校外實習合作機構實習，二技進修部在合作企業工作並在職進修之方式辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">計畫參與者義務：應配合本計畫參與專班迄畢業為止。畢業前，如因不適應，經輔導及轉廠等措施，仍退出專班者，依規定予以退學。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">申辦領域：申辦學校應具備下列產業之相關類科：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">以特殊類科、嚴重缺工產業為優先，並鼓勵開辦政府提倡之核心產業。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">除前款規定外，本部得依產業界實際需求增列辦理類科。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">辦理期程：通過審查之學校依本部核定之計畫期程辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">審查作業：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">符合補助資格之學校，得研擬申辦計畫，並檢附相關資料，依本部指定期限及方式提出申請；其計畫內容大綱得參考產學攜手合作計畫作業手冊。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">本部為辦理各校申辦計畫審查，應偕同經濟部、勞動部等政府相關單位，邀請學者專家、社會人士、學校代表、學校主管機關代表等組成審查小組進行審查。審查程序分初審、複審二階段辦理；若申辦計畫為續辦班，得免辦理複審。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">初審作業由本部先就各校所提申辦計畫檢附資料進行初核；資料不齊全者，應通知學校於十日內補正。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">複審作業由本部審查小組召開複審會議，得就各校所提計畫進行書面審查；必要時，得安排學校進行簡報。　<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">複審通過之計畫有需修正者，應依審查意見修正計畫書；本部俟各<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">校依規定完成修正計畫書後，予以核定並辦理經費補助事宜。<\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">計畫經核定後，各校應依原核定計畫執行，執行期間不得變更教學模式與合作學校，但屬課程、合作企業調整變動，或增加技專校院學生輪值大夜班等相關事項，並敘明理由及檢附相關文件報本部偕同勞動部、經濟部等相關政府單位核定者，得變更之，並納入後續申辦審查參考；違反者，本部得終止其計畫之執行，並追繳補助款。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">審查基準：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">計畫目標及教育政策配合度。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">計畫內容完整性及可行性：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">學校與合作企業應建置完整之職場實習及升讀技專校院之工作或實習機制。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">學校與合作企業應擬具學生於合作企業之定期崗位輪調機制。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">３、<\/span><span class=\"doc-copy\">學校與合作企業應擬具高級中等學校之定型化訓練契約及技專校院之教育工作契約。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">４、<\/span><span class=\"doc-copy\">合作企業應明定計畫參與者高級中等學校實習或技專校院工作或實習期間身分別與給予合理之薪資、生活津貼或待遇。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">５、<\/span><span class=\"doc-copy\">學校與合作企業應建立完善之計畫參與者輔導機制。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">６、<\/span><span class=\"doc-copy\">學校與合作企業應向計畫參與者說明專班辦理模式、職場身分別、生活津貼或待遇、升學等機制及相關法令。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">高級中等學校端與技專校院端科系之契合度及課程規劃之銜接性與進階性。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">合作企業與專班性質之關連性及配合度。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">計畫預期效益影響程度。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（六）<\/span><span class=\"doc-copy\">歷年開辦本計畫相關專班之成效（包括留職率、就業率、起薪或晉薪條件）。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十、<\/span><span class=\"doc-copy\">經費補助、核撥、核銷及偕同部會獎勵合作企業之機制：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">經費補助原則：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">每一核定計畫案經費補助方式，採高級中等學校及技專校院每校每班最高補助新臺幣三十萬元；一百零六學年度後核定計畫案，技專校院開設嚴重缺工產業班別，補助新臺幣七十萬元。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">技專校院執行補助經費之期程，為開辦第一年至專班生修滿修業年限止；高級中等學校執行補助經費之期程，為開辦第一年執行完畢。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">３、<\/span><span class=\"doc-copy\">技專校院應編列至少百分之十之配合款。但專班辦理成效良好，經本部同意者，得免提列配合款。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">４、<\/span><span class=\"doc-copy\">高級中等學校，本部主管者，免編列配合款；直轄市、縣（市）政府主管者，各該政府應依本部與所屬機關（構）對直轄市及縣（市）政府計畫型補助款處理原則規定，按財力分級表編列相對配合款。直轄市、縣（市）政府財力級次屬第一級者，最高補助百分之八十；第二級者，百分之八十五；第三級者，百分之八十八；第四級者，百分之八十九；第五級者，百分之九十。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">５、<\/span><span class=\"doc-copy\">本部得於計畫核定後，各校正式開班辦理前，依申辦計畫實際需求酌予調整補助經費。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">６、<\/span><span class=\"doc-copy\">計畫案經費補助項目依教育部補（捐）助及委辦經費核撥結報作業要點規定辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">７、<\/span><span class=\"doc-copy\">計畫案經僑務委員會、本部國民及學前教育署補助高級中等學校新住民子女國際培力產學專班經費之學校，不予補助。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">８、<\/span><span class=\"doc-copy\">本部每年得補助就讀技專校院家庭年所得未逾新臺幣七十萬元有戶籍登記之中華民國國民且於修業年限內之具有學籍者（不包括七年一貫學制前三年或五專前三年）經濟不利助學金，每學年每人新臺幣四萬元。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">９、<\/span><span class=\"doc-copy\">本部每年得補助就讀私立技專校院農林漁牧工等重點產業領域之中華民國國民且於修業年限內之具有學籍者（不包括七年一貫學制前三年或五專前三年），其就讀私立技專校院與公立技專校院之學雜費差額，差額計算方式為當學期私立學雜費實際收費扣除公立技專校院同一學制同一學院之最高及最低學雜費總和之平均金額。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１０、<\/span><span class=\"doc-copy\">本部每年得補助就讀技專校院之中華民國國民且於修業年限內之具有學籍者，未支領每月薪資之助學金，以每月新臺幣五千元計，補助期間與工作期間相等，並於工作完畢後，始得請領。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１１、<\/span><span class=\"doc-copy\">本部國民及學前教育署每年得補助就讀高級中等學校之中華民國國民且於修業年限內具有學籍之學生，每人每月發給新臺幣五千元獎勵金，補助額度以學生參與建教合作方式或非建教合作方式，並依合作企業接受訓練或校外實習之月數計算。其於特定月份非全月於合作企業接受訓練或校外實習者，按其訓練或實習日數所占當月份總日數之比率，折算當月份發給金額。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１２、<\/span><span class=\"doc-copy\">前目獎勵金每年由本部國民及學前教育署編列年度預算支應。經學校審查符合規定及請領金額後，依其就讀年級順序造具請領清冊一份，並檢附審查紀錄影本，於當年度經費請撥時併同陳報本部國民及學前教育署，其請撥時間及方式如下：<\/span><\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（１）<\/span><span class=\"doc-copy\">採輪調式建教合作方式參與本計畫者：<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:8.8em\">        　Ａ、請撥時間：本部經費依會計年度分二次撥付學校；第一次撥付經費為六月，第二次撥付經費為十二月。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:8.8em\">        　Ｂ、請撥方式：本部主管高級中等學校，依前開所定請撥時間分次備據並造具請領表一式二份，向本部國民及學前教育署請領；直轄市、縣（市）政府主管高級中等學校，依前開所定請撥時間分次造具請領表一式三份，函報各該主管教育行政機關，並由該主管教育行政機關備據及彙送請領表一式二份陳報本部國民及學前教育署請領。<\/div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">（２）<\/span><span class=\"doc-copy\">採階梯式、實習式或其他式等建教合作方式及採學生校外實習非建教合作方式參與本計畫者：本部經費依會計年度一次撥付學校，請撥方式比照前細目Ｂ辦理。但申請補助之程序及期限，本部國民及學前教育署得另行公告或以函文通知。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">經費核撥及核銷：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">各校於計畫核定後，由本部撥付核定技專校院開班費及學生相關補助經費；高級中等學校開班費及學生獎勵金由本部國民及學前教育署撥付。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">應依教育部補（捐）助及委辦經費核撥結報作業要點規定辦理核結。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">偕同部會獎勵合作企業機制：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">經濟部：辦理本計畫之合作企業，列入經濟部每年申請工安輔導及研發補助等計畫評選（審核）加分項目等相關規定辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">勞動部：辦理本計畫之技專端合作企業，得依勞動部相關規定補助其工作崗位訓練費；勞動力發展署各分署提供受訓學員專業技術訓練指導等。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">３、<\/span><span class=\"doc-copy\">農業部：辦理本計畫且屬農業類者，列入鼓勵獎勵高中生從農方案之相關獎勵金、獎學金及辦理新農民培育計畫等相關補助規定辦理。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">十一、<\/span><span class=\"doc-copy\">成效考核：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">學校應定期填報每一核定案之執行成效，包括下列事項：<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">１、<\/span><span class=\"doc-copy\">實際開班人數占核定人數之比率。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">２、<\/span><span class=\"doc-copy\">合作高級中等學校專班學生銜接至技專校院端之比率。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">３、<\/span><span class=\"doc-copy\">技專校院端學生被聘任為正式員工之比率。<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">４、<\/span><span class=\"doc-copy\">畢業生留原合作企業就業之比率<\/span><\/div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">５、<\/span><span class=\"doc-copy\">其他本部規定應填報事項。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">各項補助款應專款專用，不得移作他用，如有不實者，補助款應予追繳，並依規定予以處分。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">本部為考核各校執行成果，得辦理實地訪視。當年度執行成果作為學校主管機關、本部、勞動部及經濟部等相關政府單位後續年度學校申請續辦，或該專班銜接技專開辦、經費補助之參考。<\/span><\/div>","historyHtml":"<div class=\"history-paragraph\">1.109年4月8日教育部臺教技(一)字第1090041244B號令修正發布第7點、第8點，並自即日生效。<\/div>\n<div class=\"history-paragraph\">2.114 年 01 月 02 日臺教技（一）字第1132303091A號 令修正部分規定，並自   即日生效。<\/div>"},{"title":"教育部推動高級中學培育研發人才補助原則","content":"依據：行政院「挑戰2008國家發展重點計畫-E世代人才培育」\n目的：\n構高中成為學習型學校，發展校際水平及垂直策略聯盟，以增強學校競爭力。\n鼓勵學生深入各項課題之研究，拓展學生學習領域與深度培育高中學生具有研究及創造力。\n補助對象：國立及台灣省私立高級中學\n補助原則：\n補助類別：自然學科、數學、資訊、人文、社會學科、藝術等。\n由學校彙整學生研究計畫，向主辦單位提出申請。\n經費支用項目：指導費、出席費、差旅費、材料費、 鐘點費暨相關研究及圖書費。\n每項計畫最高金額為五萬元。\n申請及審查作業：\n申請期間：即日起至五月三十日止，逾期不予受理。\n申請程序：\n各校在指導教授、教師協助學生研擬研究計畫並填寫申請書。\n學校彙整學生研究計畫及申請書，於五月三十日前函送本辦公室。\n審查期限：六月十五日前。\n審查方式：由本辦公室邀請學者專家審查各校所提研究計畫。\n經費請撥與核銷：\n經審查核定予以補助者，函知學校備據送本辦公室憑撥，學生於研究過程中依需要向學校請款。\n研究計畫於十二月十五日前完成，學校於十二月二十五日前彙整研究成果送本辦公室。\n原始支出憑證留學校備查，如有餘款應於十二月十五日前繳回。\n補助成效考核：\n受補助學校需辦理成果發表，並編印專輯送本辦公室，本室將學校辦理成效列為下年度核發該項補助費之參考。\n辦理年度檢討，檢視各校申請及辦理成效，作為下年度辦理之依據","history":"93年2月20日教中(二)字第0930502806號書函訂定。","contentHtml":"<div class=\"doc-plain\">依據：行政院「挑戰2008國家發展重點計畫-E世代人才培育」<\/div>\n<div class=\"doc-plain\">目的：<\/div>\n<div class=\"doc-plain\">構高中成為學習型學校，發展校際水平及垂直策略聯盟，以增強學校競爭力。<\/div>\n<div class=\"doc-plain\">鼓勵學生深入各項課題之研究，拓展學生學習領域與深度培育高中學生具有研究及創造力。<\/div>\n<div class=\"doc-plain\">補助對象：國立及台灣省私立高級中學<\/div>\n<div class=\"doc-plain\">補助原則：<\/div>\n<div class=\"doc-plain\">補助類別：自然學科、數學、資訊、人文、社會學科、藝術等。<\/div>\n<div class=\"doc-plain\">由學校彙整學生研究計畫，向主辦單位提出申請。<\/div>\n<div class=\"doc-plain\">經費支用項目：指導費、出席費、差旅費、材料費、 鐘點費暨相關研究及圖書費。<\/div>\n<div class=\"doc-plain\">每項計畫最高金額為五萬元。<\/div>\n<div class=\"doc-plain\">申請及審查作業：<\/div>\n<div class=\"doc-plain\">申請期間：即日起至五月三十日止，逾期不予受理。<\/div>\n<div class=\"doc-plain\">申請程序：<\/div>\n<div class=\"doc-plain\">各校在指導教授、教師協助學生研擬研究計畫並填寫申請書。<\/div>\n<div class=\"doc-plain\">學校彙整學生研究計畫及申請書，於五月三十日前函送本辦公室。<\/div>\n<div class=\"doc-plain\">審查期限：六月十五日前。<\/div>\n<div class=\"doc-plain\">審查方式：由本辦公室邀請學者專家審查各校所提研究計畫。<\/div>\n<div class=\"doc-plain\">經費請撥與核銷：<\/div>\n<div class=\"doc-plain\">經審查核定予以補助者，函知學校備據送本辦公室憑撥，學生於研究過程中依需要向學校請款。<\/div>\n<div class=\"doc-plain\">研究計畫於十二月十五日前完成，學校於十二月二十五日前彙整研究成果送本辦公室。<\/div>\n<div class=\"doc-plain\">原始支出憑證留學校備查，如有餘款應於十二月十五日前繳回。<\/div>\n<div class=\"doc-plain\">補助成效考核：<\/div>\n<div class=\"doc-plain\">受補助學校需辦理成果發表，並編印專輯送本辦公室，本室將學校辦理成效列為下年度核發該項補助費之參考。<\/div>\n<div class=\"doc-plain\">辦理年度檢討，檢視各校申請及辦理成效，作為下年度辦理之依據<\/div>","historyHtml":"<div class=\"history-paragraph\">93年2月20日教中(二)字第0930502806號書函訂定。<\/div>"},{"title":"高級職業學校學生預修技專校院專業及實習課程實施要點","content":"教育部 (以下簡稱本部) 為提供高級職業學校 (以下簡稱高職) 學生預修進階專業及實習課程之機會，由高職推薦、輔導學生修讀技專校院課程，發展學生潛能，以落實因材施教之目標，並促進技職教育之發展，特訂定本要點。\n本要點所稱技專校院，包括科技大學四年制學校、技術學院四年制學校、技術學院二年制學校、專科二年制學校；所稱高級職業學校，包括公私立高職、綜合高中、高級中學附設職業類科。\n高職辦理推薦學生赴技專校院預修專業及實習課程，應訂定推薦程序、基準及組織推薦小組，並依規定辦理審查、推薦等事務，必要時各高職得組織聯合推薦委員會辦理之。\n高職學生預修技專校院之專業及實習課程，其上課時數、學分數、評量及實習方式，應依各技專校院教學及實習等相關規定辦理。\n高職學生預修技專校院之專業及實習課程，應依規定繳交學分費；其預修學分費以自行負擔為原則。但符合主管機關規定，就讀成績優良或家境清寒者，得酌予補助或減免。\n高職預修技專校院之專業及實習課程學生，至技專校院上課期間，依各高職請假規則辦理；各技專校院應依合作協議或補充規定，定期提供各高職瞭解學生學習情形，並落實輔導工作。\n高職學生預修技專校院專業及實習課程成績及格者，各高職得採計為畢業學分，並由各技專校院發給學分證明，於進入相關系、科就讀後，依各技專校院學分規定申請學分採計抵免。\n技專校院應組織甄選審查小組，辦理審查預修課程及被推薦學生資格等相關事務，並得視其需要辦理聯合甄選審查。\n技專校院應就所提供預修之各系科名額、專業及實習課程名稱、上課時間、地點、學分費等相關資料，提送甄選審查小組彙整審查後，分送辦理之高職。\n前項校外上課地點，應於開課前報本部核定。\n技專校院於訂定預修甄選審查基準時，得考量高職學生之技能表現、競賽、證照、學業成績，及高中職社區化等因素。\n技專校院得於學期中、週末假日或寒暑假提供專業及實習課程供高職學生預修，其開班得經雙方協議採隨班附讀、開設專班、遠距教學或其他方式辦理。前項隨班附讀，每班以不超過五人為原則；開設專班，全校每學期以二班為限，第一學期含暑假，第二學期含寒假，每班不得超過五十人。\n預修技專校院專業及實習課程學生，每學期預修總學分以不超過六學分為原則。\n預修技專校院專業及實習課程學生成績，得納入各技專校院推薦甄選入學推薦條件，並優予採計。\n技專校院教師至高職授課，課程內容如屬技專校院課程之延伸者，宜比照技專校院授課鐘點標準支給，該費用原則上由各高職支付。\n但專任教師每週授課時數合併校外授課時數後，超過其基本授課時數者，依公立大專校院兼任教師鐘點費支給標準及公立大專校院專任教師基本授課時數編配注意事項第四點辦理。\n技專校院教師校外授課時數，應受服務學校教師校外授課時數相關規定之限制。\n高職得與技專校院締結策略聯盟，並視實際需要訂定合作協議或補充規定，經雙方學校通過後，報主管機關備查。主管機關應逐年檢討實施成效。\n普通大學得準用本要點，提供高職學生預修進階專業及實習課程。","history":"95年5月10日教育部台技(一)字第 0950060095C  號令訂定發布全文 16 點；並自即日生效。","contentHtml":"<div class=\"doc-plain\" style=\"padding-left:2.4em\">教育部 (以下簡稱本部) 為提供高級職業學校 (以下簡稱高職) 學生預修進階專業及實習課程之機會，由高職推薦、輔導學生修讀技專校院課程，發展學生潛能，以落實因材施教之目標，並促進技職教育之發展，特訂定本要點。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">本要點所稱技專校院，包括科技大學四年制學校、技術學院四年制學校、技術學院二年制學校、專科二年制學校；所稱高級職業學校，包括公私立高職、綜合高中、高級中學附設職業類科。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職辦理推薦學生赴技專校院預修專業及實習課程，應訂定推薦程序、基準及組織推薦小組，並依規定辦理審查、推薦等事務，必要時各高職得組織聯合推薦委員會辦理之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職學生預修技專校院之專業及實習課程，其上課時數、學分數、評量及實習方式，應依各技專校院教學及實習等相關規定辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職學生預修技專校院之專業及實習課程，應依規定繳交學分費；其預修學分費以自行負擔為原則。但符合主管機關規定，就讀成績優良或家境清寒者，得酌予補助或減免。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職預修技專校院之專業及實習課程學生，至技專校院上課期間，依各高職請假規則辦理；各技專校院應依合作協議或補充規定，定期提供各高職瞭解學生學習情形，並落實輔導工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職學生預修技專校院專業及實習課程成績及格者，各高職得採計為畢業學分，並由各技專校院發給學分證明，於進入相關系、科就讀後，依各技專校院學分規定申請學分採計抵免。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院應組織甄選審查小組，辦理審查預修課程及被推薦學生資格等相關事務，並得視其需要辦理聯合甄選審查。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院應就所提供預修之各系科名額、專業及實習課程名稱、上課時間、地點、學分費等相關資料，提送甄選審查小組彙整審查後，分送辦理之高職。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">前項校外上課地點，應於開課前報本部核定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院於訂定預修甄選審查基準時，得考量高職學生之技能表現、競賽、證照、學業成績，及高中職社區化等因素。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院得於學期中、週末假日或寒暑假提供專業及實習課程供高職學生預修，其開班得經雙方協議採隨班附讀、開設專班、遠距教學或其他方式辦理。前項隨班附讀，每班以不超過五人為原則；開設專班，全校每學期以二班為限，第一學期含暑假，第二學期含寒假，每班不得超過五十人。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">預修技專校院專業及實習課程學生，每學期預修總學分以不超過六學分為原則。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">預修技專校院專業及實習課程學生成績，得納入各技專校院推薦甄選入學推薦條件，並優予採計。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院教師至高職授課，課程內容如屬技專校院課程之延伸者，宜比照技專校院授課鐘點標準支給，該費用原則上由各高職支付。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">但專任教師每週授課時數合併校外授課時數後，超過其基本授課時數者，依公立大專校院兼任教師鐘點費支給標準及公立大專校院專任教師基本授課時數編配注意事項第四點辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技專校院教師校外授課時數，應受服務學校教師校外授課時數相關規定之限制。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高職得與技專校院締結策略聯盟，並視實際需要訂定合作協議或補充規定，經雙方學校通過後，報主管機關備查。主管機關應逐年檢討實施成效。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">普通大學得準用本要點，提供高職學生預修進階專業及實習課程。<\/div>","historyHtml":"<div class=\"history-paragraph\">95年5月10日教育部台技(一)字第 0950060095C  號令訂定發布全文 16 點；並自即日生效。<\/div>"},{"title":"技術士技能檢定及發證辦法","content":"第  一  章  總則\n第  1  條\n本辦法依職業訓練法第三十三條第二項規定訂定之。\n第  2  條\n中央主管機關掌理事項如下：\n法規之訂定、修正及解釋。\n技能檢定學科、術科題庫之建立。\n技能檢定學科、術科收費標準之審定及支出之規定。\n技能檢定監評人員資格甄審、訓練、考核及發證。\n技能檢定術科測試場地及機具設備之評鑑及發證。\n全國技能檢定計畫之訂定、公告及辦理。\n技能檢定之專案辦理。\n技術士證與證書之核發及管理。\n技術士證照效用之協調推動。\n辦理技能檢定優良單位及人員之獎勵。\n其他技能檢定業務之推動、辦理、監督、協調、稽核及考評。\n前項第二款、第四款至第八款及第十一款業務，中央主管機關得委任所屬機關（構）辦理之。\n第一項第六款全國技能檢定計畫之辦理及第七款業務，中央主管機關得委託其他機關（構）、學校或法人團體或委辦直轄市、縣（市）主管機關辦理之。\n第  3  條\n(刪除)\n第  4  條\n(刪除)\n第  二  章  申請檢定資格\n第  5  條\n技能檢定職類分為甲、乙、丙三級，不宜分三級者，定為單一級。\n第  6  條\n年滿十五歲或國民中學畢業者，得參加丙級或單一級技術士技能檢定。\n前項年齡計算，以檢定辦理單位同一梯次學科測試日期之第一日為準。\n第  7  條\n具有下列資格之一者，得參加乙級技術士技能檢定：\n取得申請檢定相關職類丙級以上技術士證，並接受相關職類職業訓練時數累計八百小時以上，或從事申請檢定職類相關工作二年以上。\n取得申請檢定相關職類丙級以上技術士證，並具有高級中等學校畢業或同等學力證明，或高級中等學校在校最高年級。\n取得申請檢定相關職類丙級以上技術士證，並為五年制專科三年級以上、二年制及三年制專科、技術學院、大學之在校學生。\n接受相關職類職業訓練時數累計四百小時，並從事申請檢定職類相關工作三年以上。\n接受相關職類職業訓練時數累計八百小時，並從事申請檢定職類相關工作二年以上。\n接受相關職類職業訓練時數累計一千六百小時以上。\n接受相關職類職業訓練時數累計八百小時以上，並具有高級中等學校畢業或同等學力證明。\n接受相關職類職業訓練時數累計四百小時，並從事申請檢定職類相關工作一年以上，且具有高級中等學校畢業或同等學力證明。\n接受相關職類技術生訓練二年，並從事申請檢定職類相關工作二年以上。\n具有高級中等學校畢業或同等學力證明，並從事申請檢定職類相關工作二年以上。\n具有大專校院以上畢業或同等學力證明，或大專校院以上在校最高年級。\n從事申請檢定職類相關工作六年以上。\n前項相關職類丙級以上技術士證，由中央主管機關認定，並公告之。\n第一項相關職類職業訓練及技術生訓練由中央主管機關認定，並以在職業訓練機關（構）或政府委辦單位參訓者為限。\n參加國際技能競賽或國際展能節職業技能競賽之國手培訓時數，經中央主管機關認定，得納入第一項相關職類職業訓練時數。\n第  8  條\n具有下列資格之一者，得參加甲級技術士技能檢定：\n取得申請檢相關定職類乙級以上技術士證，並從事申請檢定職類相關工作二年以上。\n取得申請檢定相關職類乙級以上技術士證，並接受相關職類職業訓練時數累計八百小時以上。\n取得申請檢定相關職類乙級以上技術士證，並接受相關職類職業訓練時數累計四百小時以上者，並從事申請檢定職類相關工作一年以上。\n取得申請檢定相關職類乙級技術士證，並具有技術學院、大學畢業或同等學力證明，且從事申請檢定職類相關工作一年以上。\n具有專科畢業或同等學力證明，並從事應檢職類相關工作四年以上。\n具有技術學院或大學畢業或同等學力證明，並從事應檢職類相關工作三年以上。\n前項相關職類乙級以上技術士證，由中央主管機關認定，並公告之。\n第一項相關職類職業訓練由中央主管機關認定，並以在職業訓練機關（構）或政府委辦單位參訓者為限。\n參加國際技能競賽或國際展能節職業技能競賽之國手培訓時數，經中央主管機關認定，得納入第一項相關職類職業訓練時數。\n第 9 條\n前三條規定之申請檢定資格，中央目的事業主管機關另有法規規定者，從其規定。\n申請檢定資格特殊之職類，由中央主管機關公告其申請檢定資格，必要時得會商中央目的事業主管機關後公告之。\n第  9-1  條\n前四條學歷證明之採認、訓練時數或工作年資之採計，計算至受理檢定報名當日為止。\n第  10  條\n同一職類級別之技能檢定，學科測試成績及術科測試成績均及格者，為檢定合格。\n前項術科測試成績及格者，該測試成績自下年度起，三年內參加檢定時，得予保留。\n不適用前二項規定之職類，由中央主管機關公告檢定合格方式。\n第二項保留年限，得扣除暫停辦理檢定之年限，或配合停辦之職類縮短保留年限。\n第  10-1  條\n(刪除)\n第  11  條\n參加技能競賽之下列人員，得向中央主管機關申請免術科測試：\n國際技能組織主辦之國際技能競賽、國際奧林匹克身心障礙聯合會主辦之國際展能節職業技能競賽，獲得前三名或優勝獎，自獲獎日起五年內參加相關職類各級技能檢定者。\n中央主管機關主辦之全國技能競賽或全國身心障礙者技能競賽成績及格，自及格日起三年內，參加相關職類乙級、丙級或單一級技能檢定者。\n中央主管機關主辦之分區技能競賽或經認可之機關(構)、學校或法人團體舉辦之技能及技藝競賽獲得前三名，自獲獎日起三年內，參加相關職類丙級或單一級技能檢定者。\n前項得免術科測試之人員，應以獲獎日或及格日已開辦之職類擇一參加，其年限之計算依第十條第四項規定辦理。\n前項得免術科測試之職類、級別及項目，由中央主管機關公告之。\n第一項第三款有關經認可單位之資格條件，由中央主管機關公告之。\n第  三  章  學、術科測試委託辦理\n第  12  條\n中央主管機關應於年度開始前公告辦理全國技能檢定之梯次、職類級別、報名及測試等相關事項，為非特定對象舉辦全國技能檢定。\n中央主管機關於必要時，得為特定對象及特定目的辦理專案技能檢定。\n第  13  條\n受委任、委託辦理技能檢定術科測試試務工作單位，其術科測試採筆試非測驗題以外之方式者，其場地及機具設備應經中央主管機關評鑑合格。\n第  14  條\n受委任、委託辦理技能檢定單位有下列情形之一者，中央主管機關得終止委任或委託：\n對參加技能檢定人員之資格有故意或重大過失審查不實，經查證屬實。\n未依相關規定辦理各項試務工作，經通知限期改善，屆期仍未改善完成。\n辦理職業訓練、技能檢定收取規定標準以外之費用或不當利益，經查證屬實。\n未經許可將受委任、委託或委辦業務，再委任、委託或委辦其他單位。\n違反本辦法及相關法令規定情節重大。\n第  15  條\n受委任、委託或委辦辦理專案技能檢定之下列單位，得辦理所屬特定對象技能檢定學科、術科測試試務工作：\n政府機關設立之職業訓練機關(構)：自行辦理受訓學員技能檢定。\n法務部所屬矯正機關：辦理收容人技能檢定。\n事業機構：辦理在職員工技能檢定。\n國防部所屬機關(構)：辦理國軍人員技能檢定。\n教育部：辦理在校生技能檢定。\n依法設立之公會：辦理所屬廠商僱用之員工技能檢定。\n依法設立之工會：辦理所屬會員技能檢定。\n其他依法或經專案核准之機關(構)：辦理技能檢定。\n第  16  條\n受委任、委託或委辦辦理專案技能檢定之單位，應符合下列資格條件：\n政府機關設立之職業訓練機關(構)及法務部所屬矯正機關：辦理之職類，應與訓練課程相關，且當期訓練時數至少符合下列規定：\n甲、乙級檢定：依職業訓練主管機關公告之養成訓練課程或報經職業訓練主管機關核准之養成訓練課程訓練完畢。\n丙級檢定：八十小時以上。\n事業機構：\n依法領有登記證明文件，且營業項目與辦理技能檢定職類相關。\n內部規章訂有從事某項工作須為技能檢定合格人員，或對參加技能檢定合格人員給予核敘職級、薪給等激勵措施。\n為在職員工辦理短期訓練，報經該主管機關核准，並負擔或補助參檢費用。\n國防部所屬機關(構)：為國軍人員辦理短期訓練報經國防部核准。\n中央教育主管機關：其辦理程序及承辦單位等事項，由中央主管機關會商中央教育主管機關另定年度實施計畫規定之。\n依法設立之公會或工會：\n章程所定任務與申辦技能檢定職類具有相關性。\n持有經主管機關核准設立之立案證書滿三年以上者。\n持有經主管機關出具證明文件確認其會務運作正常者。\n擬訂技能檢定推動計畫書及提經會員(代表)大會通過且列有紀錄，並報經主管機關核准者。\n備有一次可容納十人以上學科測試專用場地者。\n為其所屬會員或廠商僱用之員工辦理短期訓練，報經主管機關核准，並負擔或補助參檢費用。\n第  17  條\n申請檢定各項專案技能檢定人員，除符合第二章申請檢定資格外，並應符合下列資格條件：\n受訓學員：參加職業訓練機關(構)之當期學員，且申請檢定職類與受訓課程內容相關。\n收容人：參加法務部所屬矯正機關之當期學員，且申請檢定職類與受訓課程內容相關。\n在職員工：經參加短期技能訓練班結訓且參加公教人員保險或勞工保險之在職員工。\n國軍人員：經參加短期技能訓練班結訓之國軍官兵、軍事校院學生及國軍單位之聘僱人員。\n在校生：為具有學籍之在校學生。\n公會所屬廠商僱用之員工：經參加短期技能訓練班結訓，且已參加勞工保險者。\n工會所屬會員：經參加短期技能訓練班結訓，且已參加勞工保險者。\n前項申請專案技能檢定人員，同一梯次以申請一職類為限。\n第  18  條\n辦理專案技能檢定，應以公告之全國技能檢定職類及級別為限。但術科試題測試前列入保密之職類及級別，應經中央主管機關核准，始得辦理。\n第  19  條\n辦理專案技能檢定之單位，除情形特殊經中央主管機關核准者外，應符合下列事項：\n每一梯次之同一職類同一級別參加檢定人數須在十人以上。\n甲、乙級之學科測試採筆試測驗題方式者，須配合全國技能檢定舉辦學科測試。但中央主管機關必要時，得另定各職類級別統一學科試題及測試日期。\n第  四  章  術科測試場地機具設備評鑑與補助\n第  20  條\n技能檢定術科測試採筆試非測驗題以外之方式者，其場地及機具設備應先經中央主管機關評鑑。但術科測試場地設在海上、海下或空中者，其場地得不列入評鑑。\n第  21  條\n申請技能檢定術科測試場地及機具設備評鑑之單位，除經中央主管機關專案核定者外，應符合下列資格之一：\n職業訓練機構：依職業訓練機構設立及管理辦法登記或許可設立，領有職業訓練機構設立證書，且其設立證書登載之訓練職類與申請評鑑職類相關者。\n學校：經教育主管機關核准設立之公私立高級中等以上學校，並設有與評鑑職類相關科系者。\n事業機構：依公司法或商業登記法登記，領有公司登記證明文件或商業登記證明文件之公司行號，其所營事業與申請評鑑職類相關，且其登記資本額在新臺幣一千五百萬元以上或僱用員工人數達一百人以上者。\n團體：\n設立三年以上領有登記證書，且申請評鑑職類與其會員本業相關之工會或同業公會。\n設立三年以上領有登記證書，且申請評鑑職類與其捐助章程所定任務相關之全國性財團法人。\n政府機關(構)或政府輔助設立之法人機構：依政府組織法規設置之機關(構)或政府輔助設立之法人機構。\n第  22  條\n中央主管機關應依各職類級別，公告技能檢定術科測試場地及機具設備評鑑自評表（以下簡稱自評表）。\n中央主管機關應於每年一月底前，公告辦理當年度術科測試場地及機具設備評鑑之職類、級別。\n前二項情形特殊者，得另行公告辦理。\n第  23  條\n申請技能檢定術科測試場地及機具設備評鑑之單位，應於依據各職類級別自評表自行評鑑符合規定後，檢附下列文件及自評表一式二份向中央主管機關申請評鑑：\n設立證明文件影本。但機關及公立學校不在此限。\n測試場地之土地所有權狀影本或土地登記簿謄本、建築物所有權狀影本或建築物登記簿謄本。但機關、學校或得由地政資訊網際網路服務系統進行確認者，不在此限。\n學校應檢附與申請評鑑職類級別相關科系之課程表。\n團體應檢附經主管機關備查之會務運作相關之證明文件。\n前項第二款測試場地屬租借者，應另檢附自受理申請日起二年以上期間之租約或使用同意書。\n同一場地及機具設備不得提供作為二個以上單位申請評鑑使用。\n申請評鑑職類級別術科測試場地，具有獨特性、單一場地、就業市場需求、從業管理法規效用或其他情形特殊者，中央主管機關得專案核定之。\n第  24  條\n技能檢定術科測試場地、機具及設備評鑑之審核程序如下：\n初審：由中央主管機關以書面審查方式為之。\n實地評鑑：初審合格者，由中央主管機關聘請題庫命製人員或具監評人員資格者二人至三人實地評鑑，評鑑結果應填列評鑑結果表。\n第  25  條\n經實地評鑑合格單位，由中央主管機關核發技能檢定術科測試場地及機具設備評鑑合格證書，並載明下列事項：\n評鑑合格者之名稱。\n職類名稱及級別。\n每場檢定崗位數量。\n場地地址。\n有效期限。\n前項第一款至第四款事項或機具發生變更時，應報中央主管機關核備。\n第一項第五款所稱有效期限，自發證日起算五年，場地租借期間少於五年者，有效期限與場地租約或使用同意書終止日期相同。但遇有第二十七條情事者，從其規定。\n評鑑合格單位應於有效期限屆滿前三個月內重新填報自評表送中央主管機關備查。必要時，中央主管機關得隨時辦理實地評鑑。\n第  26  條\n中央主管機關得視經費預算編列情形，補助術科測試辦理單位技能檢定所需機具設備。\n第  27  條\n中央主管機關於技能檢定職類級別試題有重大修訂並更動自評表時，應於適用該新試題三個月前公告新訂自評表。\n評鑑合格單位應依前項自評表重新自評，並於中央主管機關所訂期間內提出評鑑申請或填報調整情形。\n第  28  條\n離島地區、偏遠地區或符合第十五條第二款規定資格之單位，申請評鑑經中央主管機關核准者，不受評鑑自評表所定每場最少辦理崗位數量之限制。\n符合第十五條第二款規定資格之單位，因矯治及管理需要，得向中央主管機關申請免設置自評表所定之部分場地共同設施。\n第  29  條\n評鑑合格單位有下列情形之一者，中央主管機關應為廢止其職類級別場地合格之處分，並註銷其合格證書：\n場地及機具設備嚴重毀損或變更用途，致已無法辦理術科測試。\n場地經建管、環保、消防、安全衛生或相關機關(構)檢查不符規定，經各該目的事業主管機關限期改善，屆期未改善。\n評鑑合格後縮減場地空間、機具設備，經中央主管機關限期改善，屆期未改善。\n拒絕接受中央主管機關委託辦理術科測試連續三次以上或五年內累計達五次以上。\n違反第二十三條第三項規定。\n違反第二十五條第二項規定。\n未依第二十七條第二項規定辦理。\n辦理技能檢定有徇私舞弊。\n其他違反本辦法及相關法令規定情節重大。\n評鑑合格單位有前項第一款、第二款情形時，應立即停止辦理技能檢定，並通知中央主管機關，未通知經查獲者，除註銷其評鑑合格證書外，不再受理其申請同職類級別場地評鑑。\n第  30  條\n評鑑合格單位所提供申請評鑑之資料、文件，有偽造、變造或其他虛偽不實情事者，中央主管機關得撤銷其評鑑合格證書。\n第  五  章  監評人員資格甄審、訓練及考核\n第  31  條\n中央主管機關有下列情形之一者，應公告辦理監評人員資格之培訓：\n新開發之職類級別。\n經評估具監評人員資格者數量不足之職類級別。\n其他有必要辦理之職類級別。\n第  32  條\n下列單位得向中央主管機關推派人員參加監評人員資格之培訓：\n培訓職類之術科測試辦理單位。\n培訓職類之技能檢定規範製訂及學、術科題庫命製人員服務單位。\n培訓職類技能檢定術科測試場地及機具設備經評鑑合格之單位。\n設有與培訓職類相同或相關科別之職業訓練機關(構)或學校。\n具有與培訓職類相同技術、設備等之事業單位。\n與培訓職類相關之職業工會、同業公會及專業團體。\n各有關目的事業主管機關。\n其他經中央主管機關指定者。\n第  33  條\n具下列資格條件之一者，得經前條單位推派或自我推薦參加監評人員資格之培訓：\n專科學校以上畢業，現任或曾任培訓職類依法領有登記證明文件相關機構之技術人員、高中(職)以上學校教師、軍事學校教官、技術人員或職業訓練機關(構)訓練師，並從事與培訓職類相關工作達八年以上。\n現任或曾接受中央主管機關聘請擔任培訓職類技能檢定規範製訂或學、術科題庫命製人員。\n由各有關目的事業主管機關或中央主管機關指定推薦具有相當學經歷之專家或主管(辦)人員。\n取得培訓職類乙級以上技術士證，並從事相關工作達十年以上。\n高中(職)以上學校畢業，具所開辦職類級別技術士證，並從事相關工作達十三年以上，而培訓之職類未開辦乙級檢定。\n參加國際技能競賽或國際展能節職業技能競賽，獲得優勝以上，並從事相關工作三年以上，且競賽職類與培訓職類相關。\n參加全國技能競賽，獲得前三名，並從事相關工作八年以上，且競賽職類與培訓職類相關。\n前項單位推派或自我推薦人員之甄選，由中央主管機關公開辦理。\n符合第一項所列資格條件之人員，以培訓職類相關科系畢業、實際教授培訓職類相關課程並持有培訓職類技術士證者，優先遴選參加監評人員之培訓。\n前項人員參加監評人員培訓，以一個職類為限。但經中央主管機關公告者，不在此限。\n擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作者，不得參加培訓。\n情形特殊之職類，其資格條件得由中央主管機關專案核定之。\n第  34  條\n參加監評人員資格培訓者，應全程參與培訓課程，經測試成績合格取得監評人員資格後，由中央主管機關發給監評人員資格證書。\n前項證書效期自發證日起算五年。\n具監評人員資格者，得向中央主管機關申請註銷監評人員資格證書，不得再參加任何職類級別監評人員資格培訓。\n第  35  條\n中央主管機關有下列情形之一者，應對已具有監評人員資格者辦理監評人員研討：\n技能檢定術科測試試題或監評標準有重大修訂之職類級別。\n五年內未辦理監評研討之職類級別。\n其他有必要辦理之職類級別。\n第  36  條\n參加監評研討之人員，應全程參與課程，並經測試成績合格，始得擔任該職類級別之監評工作。\n具監評人員資格者，擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作，不得參加前項研討。\n未參加第一項研討、未全程參與或研討成績不合格者，暫停執行監評工作。\n參加第一項研討之監評人員資格證書定有效期者，應重新核發資格證書，其效期自發證日起算五年。\n因天災、事變或其他重大事故，致中央主管機關未能於效期內辦理第一項研討，得專案核定延長其資格效期六個月；必要時，得再延長之，每次最長為六個月。\n第  36-1  條\n具監評人員資格者報名參加其所擔任監評職類技能檢定術科測試，不得受聘擔任當梯次該職類所有場次監評工作。\n第  36-2  條\n(刪除)\n第  37  條\n監評人員對於術科測試成績或因職務及業務知悉或持有之秘密事項，應保守秘密。\n第  38  條\n具監評人員資格者，無正當理由不得拒絕至指定術科測試場地擔任監評工作。\n違反前項規定者，應停止遴聘其擔任監評工作二年。\n第  39  條\n具監評人員資格者有下列情形之一，經查證屬實者，中央主管機關應撤銷或廢止監評人員資格證書：\n洩漏或盜用屬於保密性試題、評審標準、評審表、參考答案、測試成績或因職務、業務知悉或持有秘密事項之資料。\n資格證明文件有偽造、變造或其他虛偽不實情事。\n受有期徒刑一年以上刑之宣告確定。但過失犯不在此限。\n以詐術、冒名頂替或其他不正當手法，參加監評人員培訓或研討。\n其他因故意或重大疏忽致影響應檢人權益或測試事宜。\n前項具監評人員資格者之證書經撤銷或廢止後，其不得再參加任何職類級別監評人員資格培訓。\n第  39-1  條\n具監評人員資格者有下列情形之一，經查證屬實者，中央主管機關應撤銷或廢止該職類級別監評人員資格證書：\n擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作。\n應檢人為其配偶、前配偶、四親等內之血親、三親等內之姻親，應自行迴避而未迴避。\n現任或自報名梯次首日前二年內曾任應檢人之授課人員，應自行迴避而未迴避。\n現任應檢人機關(構)、團體、學校或事業機構之首長(負責人)或直屬長官，應自行迴避而未迴避。\n在術科測試辦理單位專任、兼任之授課人員及協同教學業界專家，監評對象為該單位學員或學生，應自行迴避而未迴避。\n其他有具體事實足認其執行職務有偏頗之虞，應自行迴避而未迴避。\n具監評人員資格者於暫停或停止執行監評工作期間有前項第一款情形者，不予撤銷或廢止監評人員資格證書。\n第一項具監評人員資格者之證書經撤銷或廢止後，其不得再參加該職類級別監評人員資格培訓。\n第  六  章  題庫設置與管理\n第  40  條\n中央主管機關為統一管理技能檢定試題，應設置題庫並指定管理人員負責試題管理事項。\n前項管理人員應保守秘密。\n第  41  條\n各職類題庫命製人員之遴聘資格，應符合下列條件之一：\n現任或曾任大學校院助理教授以上職務，並有相關科系五年以上教學經驗者。\n大學校院以上畢業，並有十年以上相關職類教學經驗者。\n大專以上畢業，現任或曾任檢定相關職類，政府機關或依法領有登記證明文件相關機構技術部門或訓練部門之主管職位五年以上或非主管職位八年以上者。\n高中職以上畢業，具有現已辦理檢定相關職類最高級別技能檢定合格者，並在相關職類有現場實務經驗十年以上者或擔任相關職業訓練工作十年以上者。\n各級主管機關或目的事業主管機關推薦之代表。\n性質特殊職類之命製人員無法依前項規定遴聘時，不受前項之限制。\n每一職類題庫命製人員為六人至十二人；每人限擔任一職類題庫命製人員，但經中央主管機關專案核定者，不在此限。\n第  42  條\n中央主管機關遴聘前條人員，得請相關目的事業主管機關、學校、機構及團體推薦之；其經遴聘者，發給題庫命製人員聘書。\n前項聘書效期，自聘任日起至當年十二月三十一日止。\n第  43  條\n題庫命製人員對命製過程中持有或知悉未公開之試題及其相關資料，應保守秘密，不得洩漏或據以編印書本、講義。\n第  44  條\n有下列情事之一者，不得遴聘為題庫命製人員，已遴聘者應予解聘：\n投資或經營相關職類之補習班等營利單位。\n於技能檢定相關職類之補習班等營利單位，擔任行政或教學工作。\n違反前條規定。\n第  45  條\n題庫命製人員於參與命製題庫及試題使用期間，不得報名參加該職類技能檢定。但試題使用逾二年者，不在此限。\n前項命製題庫及試題使用期間，題庫命製人員有下列情形之一，應予迴避：\n題庫命製人員之配偶、前配偶、四親等內之血親或三親等內之姻親應檢者。\n有具體事實足認其執行職務有偏頗之虞者。\n違反前二項規定者，適用前條規定。\n第  46  條\n學、術科測試試題應由題庫管理人員密封後，點交學、術科測試辦理單位領題人員簽收，或密交辦理單位首長。\n測試辦理單位相關人員於試題之領取、印製、分送等過程，應保守秘密。\n第  46-1  條\n保密性之學、術科試題職類級別，由中央主管機關公告之。\n第  七  章  技術士證發證與管理\n第  47  條\n技能檢定合格者，由中央主管機關發給技術士證，並得應技能檢定合格者之申請，發給技術士證書。技術士證或證書毀損或遺失者，得申請換發或補發。\n中央主管機關得應中央目的事業主管機關之請求，於其執行法定職務必要範圍內，提供技術士名冊等相關資料。\n第  48  條\n技術士證應記載之事項及內容如下：\n姓名、出生年月日及國民身分證統一編號。\n照片。\n職類(項)名稱及等級。\n技術士證總編號。\n發證機關。\n生效日期。\n製發日期。\n其他經中央主管機關認定應記載事項。\n技術士證書應記載姓名及前項第二款至第八款所列事項。\n第  49  條\n技術士證及證書不得租借他人使用。違反規定者，中央主管機關應廢止其技術士證，並註銷其技術士證書。\n應檢人有下列情形之一者，撤銷其報檢資格或學、術科測試成績，並不予發證；已發技術士證及證書者，應撤銷其技術士證，並註銷其技術士證書：\n參加技能檢定者之申請檢定資格與規定不合。\n參加技能檢定違反學、術科測試規定。\n冒名頂替。\n偽造或變造應考證件。\n擾亂試場內外秩序，經監場人員勸阻不聽。\n以詐術或其他不正當手法，使檢定發生不正確結果。\n其他舞弊情事。\n應檢人或參與人員涉及前項所定情形之一者，中央主管機關應通知其相關學校或機關依規定究辦，其涉及刑事責任者，中央主管機關應移送檢察機關。\n中央主管機關於撤銷技術士證或註銷技術士證書時，應通知相關中央目的事業主管機關。\n第  50  條\n(刪除)\n第  八  章  附則\n第  51  條\n中央主管機關對推廣技能檢定績效優良之個人、事業機構、學校、職業訓練及就業服務機關(構)，應予公開獎勵。\n第  52  條\n(刪除)\n第  53  條\n(刪除)\n第  54  條\n本辦法所定之各項書證格式，由中央主管機關定之。\n第  55  條\n本辦法自發布日施行。","history":"1.中華民國108年8月27日勞動部勞動發能字第 1080511018號令修正發布第9、13、14、20、29、39、39-1、45條條文；增訂第 9-1條條文。\n2.中華民國110年1月20日勞動部勞動發能字第 1100500010 號令修正發布第 10、15～17、33、36、41 條條文；刪除第10-1條條文。\n3. 中華民國112年11月2日勞動部勞動發能字第1120516875號令修正發布第 2、12～17、22、25、29、47  條條文及第三章章名；刪除第4條條文","contentHtml":"<div class=\"chapter-heading\">第  一  章  總則<\/div>\n<div class=\"article-heading\">第  1  條<\/div>\n<div class=\"doc-plain\">本辦法依職業訓練法第三十三條第二項規定訂定之。<\/div>\n<div class=\"article-heading\">第  2  條<\/div>\n<div class=\"doc-plain\">中央主管機關掌理事項如下：<\/div>\n<div class=\"doc-plain\">法規之訂定、修正及解釋。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技能檢定學科、術科題庫之建立。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技能檢定學科、術科收費標準之審定及支出之規定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技能檢定監評人員資格甄審、訓練、考核及發證。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技能檢定術科測試場地及機具設備之評鑑及發證。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">全國技能檢定計畫之訂定、公告及辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技能檢定之專案辦理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技術士證與證書之核發及管理。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">技術士證照效用之協調推動。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">辦理技能檢定優良單位及人員之獎勵。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他技能檢定業務之推動、辦理、監督、協調、稽核及考評。<\/div>\n<div class=\"doc-plain\">前項第二款、第四款至第八款及第十一款業務，中央主管機關得委任所屬機關（構）辦理之。<\/div>\n<div class=\"doc-plain\">第一項第六款全國技能檢定計畫之辦理及第七款業務，中央主管機關得委託其他機關（構）、學校或法人團體或委辦直轄市、縣（市）主管機關辦理之。<\/div>\n<div class=\"article-heading\">第  3  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  4  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"chapter-heading\">第  二  章  申請檢定資格<\/div>\n<div class=\"article-heading\">第  5  條<\/div>\n<div class=\"doc-plain\">技能檢定職類分為甲、乙、丙三級，不宜分三級者，定為單一級。<\/div>\n<div class=\"article-heading\">第  6  條<\/div>\n<div class=\"doc-plain\">年滿十五歲或國民中學畢業者，得參加丙級或單一級技術士技能檢定。<\/div>\n<div class=\"doc-plain\">前項年齡計算，以檢定辦理單位同一梯次學科測試日期之第一日為準。<\/div>\n<div class=\"article-heading\">第  7  條<\/div>\n<div class=\"doc-plain\">具有下列資格之一者，得參加乙級技術士技能檢定：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類丙級以上技術士證，並接受相關職類職業訓練時數累計八百小時以上，或從事申請檢定職類相關工作二年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類丙級以上技術士證，並具有高級中等學校畢業或同等學力證明，或高級中等學校在校最高年級。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類丙級以上技術士證，並為五年制專科三年級以上、二年制及三年制專科、技術學院、大學之在校學生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">接受相關職類職業訓練時數累計四百小時，並從事申請檢定職類相關工作三年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">接受相關職類職業訓練時數累計八百小時，並從事申請檢定職類相關工作二年以上。<\/div>\n<div class=\"doc-plain\">接受相關職類職業訓練時數累計一千六百小時以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">接受相關職類職業訓練時數累計八百小時以上，並具有高級中等學校畢業或同等學力證明。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">接受相關職類職業訓練時數累計四百小時，並從事申請檢定職類相關工作一年以上，且具有高級中等學校畢業或同等學力證明。<\/div>\n<div class=\"doc-plain\">接受相關職類技術生訓練二年，並從事申請檢定職類相關工作二年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具有高級中等學校畢業或同等學力證明，並從事申請檢定職類相關工作二年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具有大專校院以上畢業或同等學力證明，或大專校院以上在校最高年級。<\/div>\n<div class=\"doc-plain\">從事申請檢定職類相關工作六年以上。<\/div>\n<div class=\"doc-plain\">前項相關職類丙級以上技術士證，由中央主管機關認定，並公告之。<\/div>\n<div class=\"doc-plain\">第一項相關職類職業訓練及技術生訓練由中央主管機關認定，並以在職業訓練機關（構）或政府委辦單位參訓者為限。<\/div>\n<div class=\"doc-plain\">參加國際技能競賽或國際展能節職業技能競賽之國手培訓時數，經中央主管機關認定，得納入第一項相關職類職業訓練時數。<\/div>\n<div class=\"article-heading\">第  8  條<\/div>\n<div class=\"doc-plain\">具有下列資格之一者，得參加甲級技術士技能檢定：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢相關定職類乙級以上技術士證，並從事申請檢定職類相關工作二年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類乙級以上技術士證，並接受相關職類職業訓練時數累計八百小時以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類乙級以上技術士證，並接受相關職類職業訓練時數累計四百小時以上者，並從事申請檢定職類相關工作一年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">取得申請檢定相關職類乙級技術士證，並具有技術學院、大學畢業或同等學力證明，且從事申請檢定職類相關工作一年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具有專科畢業或同等學力證明，並從事應檢職類相關工作四年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">具有技術學院或大學畢業或同等學力證明，並從事應檢職類相關工作三年以上。<\/div>\n<div class=\"doc-plain\">前項相關職類乙級以上技術士證，由中央主管機關認定，並公告之。<\/div>\n<div class=\"doc-plain\">第一項相關職類職業訓練由中央主管機關認定，並以在職業訓練機關（構）或政府委辦單位參訓者為限。<\/div>\n<div class=\"doc-plain\">參加國際技能競賽或國際展能節職業技能競賽之國手培訓時數，經中央主管機關認定，得納入第一項相關職類職業訓練時數。<\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain\">前三條規定之申請檢定資格，中央目的事業主管機關另有法規規定者，從其規定。<\/div>\n<div class=\"doc-plain\">申請檢定資格特殊之職類，由中央主管機關公告其申請檢定資格，必要時得會商中央目的事業主管機關後公告之。<\/div>\n<div class=\"article-heading\">第  9-1  條<\/div>\n<div class=\"doc-plain\">前四條學歷證明之採認、訓練時數或工作年資之採計，計算至受理檢定報名當日為止。<\/div>\n<div class=\"article-heading\">第  10  條<\/div>\n<div class=\"doc-plain\">同一職類級別之技能檢定，學科測試成績及術科測試成績均及格者，為檢定合格。<\/div>\n<div class=\"doc-plain\">前項術科測試成績及格者，該測試成績自下年度起，三年內參加檢定時，得予保留。<\/div>\n<div class=\"doc-plain\">不適用前二項規定之職類，由中央主管機關公告檢定合格方式。<\/div>\n<div class=\"doc-plain\">第二項保留年限，得扣除暫停辦理檢定之年限，或配合停辦之職類縮短保留年限。<\/div>\n<div class=\"article-heading\">第  10-1  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  11  條<\/div>\n<div class=\"doc-plain\">參加技能競賽之下列人員，得向中央主管機關申請免術科測試：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">國際技能組織主辦之國際技能競賽、國際奧林匹克身心障礙聯合會主辦之國際展能節職業技能競賽，獲得前三名或優勝獎，自獲獎日起五年內參加相關職類各級技能檢定者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">中央主管機關主辦之全國技能競賽或全國身心障礙者技能競賽成績及格，自及格日起三年內，參加相關職類乙級、丙級或單一級技能檢定者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">中央主管機關主辦之分區技能競賽或經認可之機關(構)、學校或法人團體舉辦之技能及技藝競賽獲得前三名，自獲獎日起三年內，參加相關職類丙級或單一級技能檢定者。<\/div>\n<div class=\"doc-plain\">前項得免術科測試之人員，應以獲獎日或及格日已開辦之職類擇一參加，其年限之計算依第十條第四項規定辦理。<\/div>\n<div class=\"doc-plain\">前項得免術科測試之職類、級別及項目，由中央主管機關公告之。<\/div>\n<div class=\"doc-plain\">第一項第三款有關經認可單位之資格條件，由中央主管機關公告之。<\/div>\n<div class=\"chapter-heading\">第  三  章  學、術科測試委託辦理<\/div>\n<div class=\"article-heading\">第  12  條<\/div>\n<div class=\"doc-plain\">中央主管機關應於年度開始前公告辦理全國技能檢定之梯次、職類級別、報名及測試等相關事項，為非特定對象舉辦全國技能檢定。<\/div>\n<div class=\"doc-plain\">中央主管機關於必要時，得為特定對象及特定目的辦理專案技能檢定。<\/div>\n<div class=\"article-heading\">第  13  條<\/div>\n<div class=\"doc-plain\">受委任、委託辦理技能檢定術科測試試務工作單位，其術科測試採筆試非測驗題以外之方式者，其場地及機具設備應經中央主管機關評鑑合格。<\/div>\n<div class=\"article-heading\">第  14  條<\/div>\n<div class=\"doc-plain\">受委任、委託辦理技能檢定單位有下列情形之一者，中央主管機關得終止委任或委託：<\/div>\n<div class=\"doc-plain\">對參加技能檢定人員之資格有故意或重大過失審查不實，經查證屬實。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未依相關規定辦理各項試務工作，經通知限期改善，屆期仍未改善完成。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">辦理職業訓練、技能檢定收取規定標準以外之費用或不當利益，經查證屬實。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">未經許可將受委任、委託或委辦業務，再委任、委託或委辦其他單位。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反本辦法及相關法令規定情節重大。<\/div>\n<div class=\"article-heading\">第  15  條<\/div>\n<div class=\"doc-plain\">受委任、委託或委辦辦理專案技能檢定之下列單位，得辦理所屬特定對象技能檢定學科、術科測試試務工作：<\/div>\n<div class=\"doc-plain\">政府機關設立之職業訓練機關(構)：自行辦理受訓學員技能檢定。<\/div>\n<div class=\"doc-plain\">法務部所屬矯正機關：辦理收容人技能檢定。<\/div>\n<div class=\"doc-plain\">事業機構：辦理在職員工技能檢定。<\/div>\n<div class=\"doc-plain\">國防部所屬機關(構)：辦理國軍人員技能檢定。<\/div>\n<div class=\"doc-plain\">教育部：辦理在校生技能檢定。<\/div>\n<div class=\"doc-plain\">依法設立之公會：辦理所屬廠商僱用之員工技能檢定。<\/div>\n<div class=\"doc-plain\">依法設立之工會：辦理所屬會員技能檢定。<\/div>\n<div class=\"doc-plain\">其他依法或經專案核准之機關(構)：辦理技能檢定。<\/div>\n<div class=\"article-heading\">第  16  條<\/div>\n<div class=\"doc-plain\">受委任、委託或委辦辦理專案技能檢定之單位，應符合下列資格條件：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">政府機關設立之職業訓練機關(構)及法務部所屬矯正機關：辦理之職類，應與訓練課程相關，且當期訓練時數至少符合下列規定：<\/div>\n<div class=\"doc-plain\">甲、乙級檢定：依職業訓練主管機關公告之養成訓練課程或報經職業訓練主管機關核准之養成訓練課程訓練完畢。<\/div>\n<div class=\"doc-plain\">丙級檢定：八十小時以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">事業機構：<\/div>\n<div class=\"doc-plain\">依法領有登記證明文件，且營業項目與辦理技能檢定職類相關。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">內部規章訂有從事某項工作須為技能檢定合格人員，或對參加技能檢定合格人員給予核敘職級、薪給等激勵措施。<\/div>\n<div class=\"doc-plain\">為在職員工辦理短期訓練，報經該主管機關核准，並負擔或補助參檢費用。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">國防部所屬機關(構)：為國軍人員辦理短期訓練報經國防部核准。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">中央教育主管機關：其辦理程序及承辦單位等事項，由中央主管機關會商中央教育主管機關另定年度實施計畫規定之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">依法設立之公會或工會：<\/div>\n<div class=\"doc-plain\">章程所定任務與申辦技能檢定職類具有相關性。<\/div>\n<div class=\"doc-plain\">持有經主管機關核准設立之立案證書滿三年以上者。<\/div>\n<div class=\"doc-plain\">持有經主管機關出具證明文件確認其會務運作正常者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">擬訂技能檢定推動計畫書及提經會員(代表)大會通過且列有紀錄，並報經主管機關核准者。<\/div>\n<div class=\"doc-plain\">備有一次可容納十人以上學科測試專用場地者。<\/div>\n<div class=\"doc-plain\">為其所屬會員或廠商僱用之員工辦理短期訓練，報經主管機關核准，並負擔或補助參檢費用。<\/div>\n<div class=\"article-heading\">第  17  條<\/div>\n<div class=\"doc-plain\">申請檢定各項專案技能檢定人員，除符合第二章申請檢定資格外，並應符合下列資格條件：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">受訓學員：參加職業訓練機關(構)之當期學員，且申請檢定職類與受訓課程內容相關。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">收容人：參加法務部所屬矯正機關之當期學員，且申請檢定職類與受訓課程內容相關。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">在職員工：經參加短期技能訓練班結訓且參加公教人員保險或勞工保險之在職員工。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">國軍人員：經參加短期技能訓練班結訓之國軍官兵、軍事校院學生及國軍單位之聘僱人員。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">在校生：為具有學籍之在校學生。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">公會所屬廠商僱用之員工：經參加短期技能訓練班結訓，且已參加勞工保險者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">工會所屬會員：經參加短期技能訓練班結訓，且已參加勞工保險者。<\/div>\n<div class=\"doc-plain\">前項申請專案技能檢定人員，同一梯次以申請一職類為限。<\/div>\n<div class=\"article-heading\">第  18  條<\/div>\n<div class=\"doc-plain\">辦理專案技能檢定，應以公告之全國技能檢定職類及級別為限。但術科試題測試前列入保密之職類及級別，應經中央主管機關核准，始得辦理。<\/div>\n<div class=\"article-heading\">第  19  條<\/div>\n<div class=\"doc-plain\">辦理專案技能檢定之單位，除情形特殊經中央主管機關核准者外，應符合下列事項：<\/div>\n<div class=\"doc-plain\">每一梯次之同一職類同一級別參加檢定人數須在十人以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">甲、乙級之學科測試採筆試測驗題方式者，須配合全國技能檢定舉辦學科測試。但中央主管機關必要時，得另定各職類級別統一學科試題及測試日期。<\/div>\n<div class=\"chapter-heading\">第  四  章  術科測試場地機具設備評鑑與補助<\/div>\n<div class=\"article-heading\">第  20  條<\/div>\n<div class=\"doc-plain\">技能檢定術科測試採筆試非測驗題以外之方式者，其場地及機具設備應先經中央主管機關評鑑。但術科測試場地設在海上、海下或空中者，其場地得不列入評鑑。<\/div>\n<div class=\"article-heading\">第  21  條<\/div>\n<div class=\"doc-plain\">申請技能檢定術科測試場地及機具設備評鑑之單位，除經中央主管機關專案核定者外，應符合下列資格之一：<\/div>\n<div class=\"doc-plain\">職業訓練機構：依職業訓練機構設立及管理辦法登記或許可設立，領有職業訓練機構設立證書，且其設立證書登載之訓練職類與申請評鑑職類相關者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">學校：經教育主管機關核准設立之公私立高級中等以上學校，並設有與評鑑職類相關科系者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">事業機構：依公司法或商業登記法登記，領有公司登記證明文件或商業登記證明文件之公司行號，其所營事業與申請評鑑職類相關，且其登記資本額在新臺幣一千五百萬元以上或僱用員工人數達一百人以上者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">團體：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">設立三年以上領有登記證書，且申請評鑑職類與其會員本業相關之工會或同業公會。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:4.29em\">設立三年以上領有登記證書，且申請評鑑職類與其捐助章程所定任務相關之全國性財團法人。<\/div>\n<div class=\"doc-plain\">政府機關(構)或政府輔助設立之法人機構：依政府組織法規設置之機關(構)或政府輔助設立之法人機構。<\/div>\n<div class=\"article-heading\">第  22  條<\/div>\n<div class=\"doc-plain\">中央主管機關應依各職類級別，公告技能檢定術科測試場地及機具設備評鑑自評表（以下簡稱自評表）。<\/div>\n<div class=\"doc-plain\">中央主管機關應於每年一月底前，公告辦理當年度術科測試場地及機具設備評鑑之職類、級別。<\/div>\n<div class=\"doc-plain\">前二項情形特殊者，得另行公告辦理。<\/div>\n<div class=\"article-heading\">第  23  條<\/div>\n<div class=\"doc-plain\">申請技能檢定術科測試場地及機具設備評鑑之單位，應於依據各職類級別自評表自行評鑑符合規定後，檢附下列文件及自評表一式二份向中央主管機關申請評鑑：<\/div>\n<div class=\"doc-plain\">設立證明文件影本。但機關及公立學校不在此限。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">測試場地之土地所有權狀影本或土地登記簿謄本、建築物所有權狀影本或建築物登記簿謄本。但機關、學校或得由地政資訊網際網路服務系統進行確認者，不在此限。<\/div>\n<div class=\"doc-plain\">學校應檢附與申請評鑑職類級別相關科系之課程表。<\/div>\n<div class=\"doc-plain\">團體應檢附經主管機關備查之會務運作相關之證明文件。<\/div>\n<div class=\"doc-plain\">前項第二款測試場地屬租借者，應另檢附自受理申請日起二年以上期間之租約或使用同意書。<\/div>\n<div class=\"doc-plain\">同一場地及機具設備不得提供作為二個以上單位申請評鑑使用。<\/div>\n<div class=\"doc-plain\">申請評鑑職類級別術科測試場地，具有獨特性、單一場地、就業市場需求、從業管理法規效用或其他情形特殊者，中央主管機關得專案核定之。<\/div>\n<div class=\"article-heading\">第  24  條<\/div>\n<div class=\"doc-plain\">技能檢定術科測試場地、機具及設備評鑑之審核程序如下：<\/div>\n<div class=\"doc-plain\">初審：由中央主管機關以書面審查方式為之。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">實地評鑑：初審合格者，由中央主管機關聘請題庫命製人員或具監評人員資格者二人至三人實地評鑑，評鑑結果應填列評鑑結果表。<\/div>\n<div class=\"article-heading\">第  25  條<\/div>\n<div class=\"doc-plain\">經實地評鑑合格單位，由中央主管機關核發技能檢定術科測試場地及機具設備評鑑合格證書，並載明下列事項：<\/div>\n<div class=\"doc-plain\">評鑑合格者之名稱。<\/div>\n<div class=\"doc-plain\">職類名稱及級別。<\/div>\n<div class=\"doc-plain\">每場檢定崗位數量。<\/div>\n<div class=\"doc-plain\">場地地址。<\/div>\n<div class=\"doc-plain\">有效期限。<\/div>\n<div class=\"doc-plain\">前項第一款至第四款事項或機具發生變更時，應報中央主管機關核備。<\/div>\n<div class=\"doc-plain\">第一項第五款所稱有效期限，自發證日起算五年，場地租借期間少於五年者，有效期限與場地租約或使用同意書終止日期相同。但遇有第二十七條情事者，從其規定。<\/div>\n<div class=\"doc-plain\">評鑑合格單位應於有效期限屆滿前三個月內重新填報自評表送中央主管機關備查。必要時，中央主管機關得隨時辦理實地評鑑。<\/div>\n<div class=\"article-heading\">第  26  條<\/div>\n<div class=\"doc-plain\">中央主管機關得視經費預算編列情形，補助術科測試辦理單位技能檢定所需機具設備。<\/div>\n<div class=\"article-heading\">第  27  條<\/div>\n<div class=\"doc-plain\">中央主管機關於技能檢定職類級別試題有重大修訂並更動自評表時，應於適用該新試題三個月前公告新訂自評表。<\/div>\n<div class=\"doc-plain\">評鑑合格單位應依前項自評表重新自評，並於中央主管機關所訂期間內提出評鑑申請或填報調整情形。<\/div>\n<div class=\"article-heading\">第  28  條<\/div>\n<div class=\"doc-plain\">離島地區、偏遠地區或符合第十五條第二款規定資格之單位，申請評鑑經中央主管機關核准者，不受評鑑自評表所定每場最少辦理崗位數量之限制。<\/div>\n<div class=\"doc-plain\">符合第十五條第二款規定資格之單位，因矯治及管理需要，得向中央主管機關申請免設置自評表所定之部分場地共同設施。<\/div>\n<div class=\"article-heading\">第  29  條<\/div>\n<div class=\"doc-plain\">評鑑合格單位有下列情形之一者，中央主管機關應為廢止其職類級別場地合格之處分，並註銷其合格證書：<\/div>\n<div class=\"doc-plain\">場地及機具設備嚴重毀損或變更用途，致已無法辦理術科測試。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">場地經建管、環保、消防、安全衛生或相關機關(構)檢查不符規定，經各該目的事業主管機關限期改善，屆期未改善。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">評鑑合格後縮減場地空間、機具設備，經中央主管機關限期改善，屆期未改善。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">拒絕接受中央主管機關委託辦理術科測試連續三次以上或五年內累計達五次以上。<\/div>\n<div class=\"doc-plain\">違反第二十三條第三項規定。<\/div>\n<div class=\"doc-plain\">違反第二十五條第二項規定。<\/div>\n<div class=\"doc-plain\">未依第二十七條第二項規定辦理。<\/div>\n<div class=\"doc-plain\">辦理技能檢定有徇私舞弊。<\/div>\n<div class=\"doc-plain\">其他違反本辦法及相關法令規定情節重大。<\/div>\n<div class=\"doc-plain\">評鑑合格單位有前項第一款、第二款情形時，應立即停止辦理技能檢定，並通知中央主管機關，未通知經查獲者，除註銷其評鑑合格證書外，不再受理其申請同職類級別場地評鑑。<\/div>\n<div class=\"article-heading\">第  30  條<\/div>\n<div class=\"doc-plain\">評鑑合格單位所提供申請評鑑之資料、文件，有偽造、變造或其他虛偽不實情事者，中央主管機關得撤銷其評鑑合格證書。<\/div>\n<div class=\"chapter-heading\">第  五  章  監評人員資格甄審、訓練及考核<\/div>\n<div class=\"article-heading\">第  31  條<\/div>\n<div class=\"doc-plain\">中央主管機關有下列情形之一者，應公告辦理監評人員資格之培訓：<\/div>\n<div class=\"doc-plain\">新開發之職類級別。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">經評估具監評人員資格者數量不足之職類級別。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他有必要辦理之職類級別。<\/div>\n<div class=\"article-heading\">第  32  條<\/div>\n<div class=\"doc-plain\">下列單位得向中央主管機關推派人員參加監評人員資格之培訓：<\/div>\n<div class=\"doc-plain\">培訓職類之術科測試辦理單位。<\/div>\n<div class=\"doc-plain\">培訓職類之技能檢定規範製訂及學、術科題庫命製人員服務單位。<\/div>\n<div class=\"doc-plain\">培訓職類技能檢定術科測試場地及機具設備經評鑑合格之單位。<\/div>\n<div class=\"doc-plain\">設有與培訓職類相同或相關科別之職業訓練機關(構)或學校。<\/div>\n<div class=\"doc-plain\">具有與培訓職類相同技術、設備等之事業單位。<\/div>\n<div class=\"doc-plain\">與培訓職類相關之職業工會、同業公會及專業團體。<\/div>\n<div class=\"doc-plain\">各有關目的事業主管機關。<\/div>\n<div class=\"doc-plain\">其他經中央主管機關指定者。<\/div>\n<div class=\"article-heading\">第  33  條<\/div>\n<div class=\"doc-plain\">具下列資格條件之一者，得經前條單位推派或自我推薦參加監評人員資格之培訓：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">專科學校以上畢業，現任或曾任培訓職類依法領有登記證明文件相關機構之技術人員、高中(職)以上學校教師、軍事學校教官、技術人員或職業訓練機關(構)訓練師，並從事與培訓職類相關工作達八年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">現任或曾接受中央主管機關聘請擔任培訓職類技能檢定規範製訂或學、術科題庫命製人員。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">由各有關目的事業主管機關或中央主管機關指定推薦具有相當學經歷之專家或主管(辦)人員。<\/div>\n<div class=\"doc-plain\">取得培訓職類乙級以上技術士證，並從事相關工作達十年以上。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高中(職)以上學校畢業，具所開辦職類級別技術士證，並從事相關工作達十三年以上，而培訓之職類未開辦乙級檢定。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">參加國際技能競賽或國際展能節職業技能競賽，獲得優勝以上，並從事相關工作三年以上，且競賽職類與培訓職類相關。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">參加全國技能競賽，獲得前三名，並從事相關工作八年以上，且競賽職類與培訓職類相關。<\/div>\n<div class=\"doc-plain\">前項單位推派或自我推薦人員之甄選，由中央主管機關公開辦理。<\/div>\n<div class=\"doc-plain\">符合第一項所列資格條件之人員，以培訓職類相關科系畢業、實際教授培訓職類相關課程並持有培訓職類技術士證者，優先遴選參加監評人員之培訓。<\/div>\n<div class=\"doc-plain\">前項人員參加監評人員培訓，以一個職類為限。但經中央主管機關公告者，不在此限。<\/div>\n<div class=\"doc-plain\">擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作者，不得參加培訓。<\/div>\n<div class=\"doc-plain\">情形特殊之職類，其資格條件得由中央主管機關專案核定之。<\/div>\n<div class=\"article-heading\">第  34  條<\/div>\n<div class=\"doc-plain\">參加監評人員資格培訓者，應全程參與培訓課程，經測試成績合格取得監評人員資格後，由中央主管機關發給監評人員資格證書。<\/div>\n<div class=\"doc-plain\">前項證書效期自發證日起算五年。<\/div>\n<div class=\"doc-plain\">具監評人員資格者，得向中央主管機關申請註銷監評人員資格證書，不得再參加任何職類級別監評人員資格培訓。<\/div>\n<div class=\"article-heading\">第  35  條<\/div>\n<div class=\"doc-plain\">中央主管機關有下列情形之一者，應對已具有監評人員資格者辦理監評人員研討：<\/div>\n<div class=\"doc-plain\">技能檢定術科測試試題或監評標準有重大修訂之職類級別。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">五年內未辦理監評研討之職類級別。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">其他有必要辦理之職類級別。<\/div>\n<div class=\"article-heading\">第  36  條<\/div>\n<div class=\"doc-plain\">參加監評研討之人員，應全程參與課程，並經測試成績合格，始得擔任該職類級別之監評工作。<\/div>\n<div class=\"doc-plain\">具監評人員資格者，擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作，不得參加前項研討。<\/div>\n<div class=\"doc-plain\">未參加第一項研討、未全程參與或研討成績不合格者，暫停執行監評工作。<\/div>\n<div class=\"doc-plain\">參加第一項研討之監評人員資格證書定有效期者，應重新核發資格證書，其效期自發證日起算五年。<\/div>\n<div class=\"doc-plain\">因天災、事變或其他重大事故，致中央主管機關未能於效期內辦理第一項研討，得專案核定延長其資格效期六個月；必要時，得再延長之，每次最長為六個月。<\/div>\n<div class=\"article-heading\">第  36-1  條<\/div>\n<div class=\"doc-plain\">具監評人員資格者報名參加其所擔任監評職類技能檢定術科測試，不得受聘擔任當梯次該職類所有場次監評工作。<\/div>\n<div class=\"article-heading\">第  36-2  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  37  條<\/div>\n<div class=\"doc-plain\">監評人員對於術科測試成績或因職務及業務知悉或持有之秘密事項，應保守秘密。<\/div>\n<div class=\"article-heading\">第  38  條<\/div>\n<div class=\"doc-plain\">具監評人員資格者，無正當理由不得拒絕至指定術科測試場地擔任監評工作。<\/div>\n<div class=\"doc-plain\">違反前項規定者，應停止遴聘其擔任監評工作二年。<\/div>\n<div class=\"article-heading\">第  39  條<\/div>\n<div class=\"doc-plain\">具監評人員資格者有下列情形之一，經查證屬實者，中央主管機關應撤銷或廢止監評人員資格證書：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">洩漏或盜用屬於保密性試題、評審標準、評審表、參考答案、測試成績或因職務、業務知悉或持有秘密事項之資料。<\/div>\n<div class=\"doc-plain\">資格證明文件有偽造、變造或其他虛偽不實情事。<\/div>\n<div class=\"doc-plain\">受有期徒刑一年以上刑之宣告確定。但過失犯不在此限。<\/div>\n<div class=\"doc-plain\">以詐術、冒名頂替或其他不正當手法，參加監評人員培訓或研討。<\/div>\n<div class=\"doc-plain\">其他因故意或重大疏忽致影響應檢人權益或測試事宜。<\/div>\n<div class=\"doc-plain\">前項具監評人員資格者之證書經撤銷或廢止後，其不得再參加任何職類級別監評人員資格培訓。<\/div>\n<div class=\"article-heading\">第  39-1  條<\/div>\n<div class=\"doc-plain\">具監評人員資格者有下列情形之一，經查證屬實者，中央主管機關應撤銷或廢止該職類級別監評人員資格證書：<\/div>\n<div class=\"doc-plain\">擔任監評相關職類之補習班等相同性質單位之負責人或行政、教學工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">應檢人為其配偶、前配偶、四親等內之血親、三親等內之姻親，應自行迴避而未迴避。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">現任或自報名梯次首日前二年內曾任應檢人之授課人員，應自行迴避而未迴避。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">現任應檢人機關(構)、團體、學校或事業機構之首長(負責人)或直屬長官，應自行迴避而未迴避。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">在術科測試辦理單位專任、兼任之授課人員及協同教學業界專家，監評對象為該單位學員或學生，應自行迴避而未迴避。<\/div>\n<div class=\"doc-plain\">其他有具體事實足認其執行職務有偏頗之虞，應自行迴避而未迴避。<\/div>\n<div class=\"doc-plain\">具監評人員資格者於暫停或停止執行監評工作期間有前項第一款情形者，不予撤銷或廢止監評人員資格證書。<\/div>\n<div class=\"doc-plain\">第一項具監評人員資格者之證書經撤銷或廢止後，其不得再參加該職類級別監評人員資格培訓。<\/div>\n<div class=\"chapter-heading\">第  六  章  題庫設置與管理<\/div>\n<div class=\"article-heading\">第  40  條<\/div>\n<div class=\"doc-plain\">中央主管機關為統一管理技能檢定試題，應設置題庫並指定管理人員負責試題管理事項。<\/div>\n<div class=\"doc-plain\">前項管理人員應保守秘密。<\/div>\n<div class=\"article-heading\">第  41  條<\/div>\n<div class=\"doc-plain\">各職類題庫命製人員之遴聘資格，應符合下列條件之一：<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">現任或曾任大學校院助理教授以上職務，並有相關科系五年以上教學經驗者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">大學校院以上畢業，並有十年以上相關職類教學經驗者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">大專以上畢業，現任或曾任檢定相關職類，政府機關或依法領有登記證明文件相關機構技術部門或訓練部門之主管職位五年以上或非主管職位八年以上者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">高中職以上畢業，具有現已辦理檢定相關職類最高級別技能檢定合格者，並在相關職類有現場實務經驗十年以上者或擔任相關職業訓練工作十年以上者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">各級主管機關或目的事業主管機關推薦之代表。<\/div>\n<div class=\"doc-plain\">性質特殊職類之命製人員無法依前項規定遴聘時，不受前項之限制。<\/div>\n<div class=\"doc-plain\">每一職類題庫命製人員為六人至十二人；每人限擔任一職類題庫命製人員，但經中央主管機關專案核定者，不在此限。<\/div>\n<div class=\"article-heading\">第  42  條<\/div>\n<div class=\"doc-plain\">中央主管機關遴聘前條人員，得請相關目的事業主管機關、學校、機構及團體推薦之；其經遴聘者，發給題庫命製人員聘書。<\/div>\n<div class=\"doc-plain\">前項聘書效期，自聘任日起至當年十二月三十一日止。<\/div>\n<div class=\"article-heading\">第  43  條<\/div>\n<div class=\"doc-plain\">題庫命製人員對命製過程中持有或知悉未公開之試題及其相關資料，應保守秘密，不得洩漏或據以編印書本、講義。<\/div>\n<div class=\"article-heading\">第  44  條<\/div>\n<div class=\"doc-plain\">有下列情事之一者，不得遴聘為題庫命製人員，已遴聘者應予解聘：<\/div>\n<div class=\"doc-plain\">投資或經營相關職類之補習班等營利單位。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">於技能檢定相關職類之補習班等營利單位，擔任行政或教學工作。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">違反前條規定。<\/div>\n<div class=\"article-heading\">第  45  條<\/div>\n<div class=\"doc-plain\">題庫命製人員於參與命製題庫及試題使用期間，不得報名參加該職類技能檢定。但試題使用逾二年者，不在此限。<\/div>\n<div class=\"doc-plain\">前項命製題庫及試題使用期間，題庫命製人員有下列情形之一，應予迴避：<\/div>\n<div class=\"doc-plain\">題庫命製人員之配偶、前配偶、四親等內之血親或三親等內之姻親應檢者。<\/div>\n<div class=\"doc-plain\" style=\"padding-left:2.4em\">有具體事實足認其執行職務有偏頗之虞者。<\/div>\n<div class=\"doc-plain\">違反前二項規定者，適用前條規定。<\/div>\n<div class=\"article-heading\">第  46  條<\/div>\n<div class=\"doc-plain\">學、術科測試試題應由題庫管理人員密封後，點交學、術科測試辦理單位領題人員簽收，或密交辦理單位首長。<\/div>\n<div class=\"doc-plain\">測試辦理單位相關人員於試題之領取、印製、分送等過程，應保守秘密。<\/div>\n<div class=\"article-heading\">第  46-1  條<\/div>\n<div class=\"doc-plain\">保密性之學、術科試題職類級別，由中央主管機關公告之。<\/div>\n<div class=\"chapter-heading\">第  七  章  技術士證發證與管理<\/div>\n<div class=\"article-heading\">第  47  條<\/div>\n<div class=\"doc-plain\">技能檢定合格者，由中央主管機關發給技術士證，並得應技能檢定合格者之申請，發給技術士證書。技術士證或證書毀損或遺失者，得申請換發或補發。<\/div>\n<div class=\"doc-plain\">中央主管機關得應中央目的事業主管機關之請求，於其執行法定職務必要範圍內，提供技術士名冊等相關資料。<\/div>\n<div class=\"article-heading\">第  48  條<\/div>\n<div class=\"doc-plain\">技術士證應記載之事項及內容如下：<\/div>\n<div class=\"doc-plain\">姓名、出生年月日及國民身分證統一編號。<\/div>\n<div class=\"doc-plain\">照片。<\/div>\n<div class=\"doc-plain\">職類(項)名稱及等級。<\/div>\n<div class=\"doc-plain\">技術士證總編號。<\/div>\n<div class=\"doc-plain\">發證機關。<\/div>\n<div class=\"doc-plain\">生效日期。<\/div>\n<div class=\"doc-plain\">製發日期。<\/div>\n<div class=\"doc-plain\">其他經中央主管機關認定應記載事項。<\/div>\n<div class=\"doc-plain\">技術士證書應記載姓名及前項第二款至第八款所列事項。<\/div>\n<div class=\"article-heading\">第  49  條<\/div>\n<div class=\"doc-plain\">技術士證及證書不得租借他人使用。違反規定者，中央主管機關應廢止其技術士證，並註銷其技術士證書。<\/div>\n<div class=\"doc-plain\">應檢人有下列情形之一者，撤銷其報檢資格或學、術科測試成績，並不予發證；已發技術士證及證書者，應撤銷其技術士證，並註銷其技術士證書：<\/div>\n<div class=\"doc-plain\">參加技能檢定者之申請檢定資格與規定不合。<\/div>\n<div class=\"doc-plain\">參加技能檢定違反學、術科測試規定。<\/div>\n<div class=\"doc-plain\">冒名頂替。<\/div>\n<div class=\"doc-plain\">偽造或變造應考證件。<\/div>\n<div class=\"doc-plain\">擾亂試場內外秩序，經監場人員勸阻不聽。<\/div>\n<div class=\"doc-plain\">以詐術或其他不正當手法，使檢定發生不正確結果。<\/div>\n<div class=\"doc-plain\">其他舞弊情事。<\/div>\n<div class=\"doc-plain\">應檢人或參與人員涉及前項所定情形之一者，中央主管機關應通知其相關學校或機關依規定究辦，其涉及刑事責任者，中央主管機關應移送檢察機關。<\/div>\n<div class=\"doc-plain\">中央主管機關於撤銷技術士證或註銷技術士證書時，應通知相關中央目的事業主管機關。<\/div>\n<div class=\"article-heading\">第  50  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"chapter-heading\">第  八  章  附則<\/div>\n<div class=\"article-heading\">第  51  條<\/div>\n<div class=\"doc-plain\">中央主管機關對推廣技能檢定績效優良之個人、事業機構、學校、職業訓練及就業服務機關(構)，應予公開獎勵。<\/div>\n<div class=\"article-heading\">第  52  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  53  條<\/div>\n<div class=\"doc-plain\">(刪除)<\/div>\n<div class=\"article-heading\">第  54  條<\/div>\n<div class=\"doc-plain\">本辦法所定之各項書證格式，由中央主管機關定之。<\/div>\n<div class=\"article-heading\">第  55  條<\/div>\n<div class=\"doc-plain\">本辦法自發布日施行。<\/div>","historyHtml":"<div class=\"history-paragraph\">1.中華民國108年8月27日勞動部勞動發能字第 1080511018號令修正發布第9、13、14、20、29、39、39-1、45條條文；增訂第 9-1條條文。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">2.中華民國110年1月20日勞動部勞動發能字第 1100500010 號令修正發布第 10、15～17、33、36、41 條條文；刪除第10-1條條文。<\/div>\n<div class=\"history-empty\" aria-hidden=\"true\"><\/div>\n<div class=\"history-paragraph\">3. 中華民國112年11月2日勞動部勞動發能字第1120516875號令修正發布第 2、12～17、22、25、29、47  條條文及第三章章名；刪除第4條條文<\/div>"},{"title":"職業安全衛生管理辦法","content":"第 一 章 總則\n第 1 條\n本辦法依職業安全衛生法（以下簡稱本法）第二十三條第五項規定訂定之。\n第 1-1 條\n雇主應依其事業之規模、性質，設置安全衛生組織及人員，建立職業安全衛生管理系統，透過規劃、實施、評估及改善措施等管理功能，實現安全衛生管理目標，提升安全衛生管理水準。\n第 2 條\n本辦法之事業，依危害風險之不同區分如下：\n一、第一類事業：具顯著風險者。\n二、第二類事業：具中度風險者。\n三、第三類事業：具低度風險者。\n前項各款事業之例示，如附表一。\n第 二 章 職業安全衛生組織及人員\n第 2-1 條\n事業單位應依下列規定設職業安全衛生管理單位（以下簡稱管理單位）：\n一、第一類事業之事業單位勞工人數在一百人以上者，應設直接隸屬雇主之專責一級管理單位。\n二、第二類事業勞工人數在三百人以上者，應設直接隸屬雇主之一級管理單位。\n前項第一款專責一級管理單位之設置，於勞工人數在三百人以上者，自中華民國九十九年一月九日施行；勞工人數在二百人至二百九十九人者，自一百年一月九日施行；勞工人數在一百人至一百九十九人者，自一百零一年一月九日施行。\n第 3 條\n第二條所定事業之雇主應依附表二之規模，置職業安全衛生業務主管及管理人員（以下簡稱管理人員）。\n第一類事業之事業單位勞工人數在一百人以上者，所置管理人員應為專職；第二類事業之事業單位勞工人數在三百人以上者，所置管理人員應至少一人為專職。\n依前項規定所置專職管理人員，應常駐廠場執行業務，不得兼任其他法令所定專責（任）人員或從事其他與職業安全衛生無關之工作。\n第 3-1 條\n前條第一類事業之事業單位對於所屬從事製造之一級單位，勞工人數在一百人以上未滿三百人者，應另置甲種職業安全衛生業務主管一人，勞工人數三百人以上者，應再至少增置專職職業安全衛生管理員一人。\n營造業之事業單位對於橋樑、道路、隧道或輸配電等距離較長之工程，應於每十公里內增置營造業丙種職業安全衛生業務主管一人。\n第 3-2 條\n事業單位勞工人數之計算，包含原事業單位及其承攬人、再承攬人之勞工及其他受工作場所負責人指揮或監督從事勞動之人員，於同一期間、同一工作場所作業時之總人數。\n事業設有總機構者，其勞工人數之計算，包含所屬各地區事業單位作業勞工之人數。\n第 4 條\n事業單位勞工人數未滿三十人者，雇主或其代理人經職業安全衛生業務主管安全衛生教育訓練合格，得擔任該事業單位職業安全衛生業務主管。但屬第二類及第三類事業之事業單位，且勞工人數在五人以下者，得由經職業安全衛生教育訓練規則第三條附表一所列丁種職業安全衛生業務主管教育訓練合格之雇主或其代理人擔任。\n第 5 條\n（刪除）\n第 5-1 條\n職業安全衛生組織、人員、工作場所負責人及各級主管之職責如下：\n一、職業安全衛生管理單位：擬訂、規劃、督導及推動安全衛生管理事項，並指導有關部門實施。\n二、職業安全衛生委員會：對雇主擬訂之安全衛生政策提出建議，並審議、協調及建議安全衛生相關事項。\n三、職業安全衛生業務主管：\n（一）事業單位置有職業安全（衛生）管理師、職業安全衛生管理員者：主管及督導安全衛生管理事項。\n（二）事業單位未置有職業安全（衛生）管理師、職業安全衛生管理員者：擬訂、規劃、推動及查核安全衛生管理事項。\n四、職業安全（衛生）管理師、職業安全衛生管理員：擬訂、規劃及推動安全衛生管理事項，並指導有關部門實施。\n五、工作場所負責人及各級主管：依職權指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施。\n六、各級主管：依職責指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施。\n七、一級單位之職業安全衛生人員：協助一級單位主管擬訂、規劃及推動所屬部門安全衛生管理事項，並指導有關人員實施。\n前項人員，雇主應使其接受安全衛生教育訓練。\n第 6 條\n事業分散於不同地區者，應於各該地區之事業單位依第二條至第三條之二規定，設管理單位及置管理人員。事業單位勞工人數之計算，以各該地區事業單位作業勞工之總人數為準。\n事業設有總機構者，除各該地區事業單位之管理單位及管理人員外，應依下列規定另於總機構或其地區事業單位設綜理全事業之職業安全衛生事務之管理單位，及依附表二之一之規模置管理人員，並依第五條之一規定辦理安全衛生管理事項：\n一、第一類事業勞工人數在五百人以上者，應設直接隸屬雇主之專責一級管理單位。\n二、第二類事業勞工人數在五百人以上者，應設直接隸屬雇主之一級管理單位。\n三、第三類事業勞工人數在三千人以上者，應設管理單位。\n前項規定所置管理人員，應為專職。但第二類及第三類事業之職業安全衛生業務主管，不在此限。\n第 6-1 條\n第一類事業單位或其總機構已實施第十二條之二職業安全衛生管理系統相關管理制度，管理績效並經中央主管機關審查通過者，得不受第二條之一、第三條及前條有關一級管理單位應為專責及職業安全衛生業務主管應為專職之限制。\n第 7 條\n職業安全衛生業務主管除第四條規定者外，雇主應自該事業之相關主管或辦理職業安全衛生事務者選任之。但營造業之事業單位，應由曾受營造業職業安全衛生業務主管教育訓練者選任之。\n下列職業安全衛生人員，雇主應自事業單位勞工中具備下列資格者選任之：\n一、職業安全管理師：\n（一）高等考試職業安全衛生類科錄取或具有工業安全技師資格。\n（二）領有職業安全管理甲級技術士證照。\n（三）曾任勞動檢查員，具有職業安全檢查工作經驗三年以上。\n（四）修畢工業安全相關科目十八學分以上，並具有國內外大專以上校院工業安全相關類科碩士以上學位。\n二、職業衛生管理師：\n（一）高等考試職業安全衛生類科錄取或具有職業衛生技師資格。\n（二）領有職業衛生管理甲級技術士證照。\n（三）曾任勞動檢查員，具有職業衛生檢查工作經驗三年以上。\n（四）修畢工業衛生相關科目十八學分以上，並具有國內外大專以上校院工業衛生相關類科碩士以上學位。\n三、職業安全衛生管理員：\n（一）具有職業安全管理師或職業衛生管理師資格。\n（二）領有職業安全衛生管理乙級技術士證照。\n（三）曾任勞動檢查員，具有職業安全衛生檢查工作經驗二年以上。\n（四）修畢工業安全衛生相關科目十八學分以上，並具有國內外大專以上校院工業安全衛生相關科系畢業。\n（五）普通考試職業安全衛生類科錄取。\n前項大專以上校院工業安全相關類科碩士、工業衛生相關類科碩士、工業安全衛生相關科系與工業安全、工業衛生及工業安全衛生相關科目由中央主管機關定之。地方主管機關依中央主管機關公告之科系及科目辦理。\n第二項第一款第四目及第二款第四目，自中華民國一百零一年七月一日起不再適用；第二項第三款第四目，自一百零三年七月一日起不再適用。\n第 8 條\n職業安全衛生人員因故未能執行職務時，雇主應即指定適當代理人。其代理期間不得超過三個月。\n勞工人數在三十人以上之事業單位，其職業安全衛生人員離職時，應即報當地勞動檢查機構備查。\n第 9 條\n（刪除）\n第 10 條\n適用第二條之一及第六條第二項規定之事業單位，應設職業安全衛生委員會（以下簡稱委員會）。\n第 11 條\n委員會置委員七人以上，除雇主為當然委員及第五款規定者外，由雇主視該事業單位之實際需要指定下列人員組成：\n一、勞工代表。\n二、事業內各部門之主管、監督、指揮人員。\n三、職業安全衛生人員。\n四、勞工健康服務人員。\n五、其他與安全衛生有關之專業人員。\n委員任期為二年，並以雇主為主任委員，綜理會務。\n委員會由主任委員指定一人為秘書，輔助其綜理會務。\n第一項第五款之勞工代表，應佔委員人數三分之一以上；事業單位設有工會者，由工會推派之；無工會組織而有勞資會議者，由勞方代表推選之；無工會組織且無勞資會議者，由勞工共同推選之。\n第 12 條\n委員會應每三個月至少開會一次，辦理下列事項：\n一、對雇主擬訂之職業安全衛生政策提出建議。\n二、協調、建議職業安全衛生管理計畫。\n三、審議安全、衛生教育訓練實施計畫。\n四、審議作業環境監測計畫、監測結果及採行措施。\n五、審議健康管理、職業病預防及健康促進事項。\n六、審議各項安全衛生提案。\n七、審議事業單位自動檢查及安全衛生稽核事項。\n八、審議機械、設備或原料、材料危害之預防措施。\n九、審議職業災害調查報告。\n十、考核現場安全衛生管理績效。\n十一、審議承攬業務安全衛生管理事項。\n十二、其他有關職業安全衛生管理事項。\n前項委員會審議、協調及建議安全衛生相關事項，應作成紀錄，並保存三年。\n第一項委員會議由主任委員擔任主席，必要時得召開臨時會議。\n第 三 章 職業安全衛生管理措施\n第 12-1 條\n雇主使勞工從事工作前，應就工作場所內之建築物、機械、設備、器具、原料、材料等或作業活動及其他可能引起之危害因素實施風險評估，並依評估結果，採取必要之預防設備及措施。\n雇主應依其事業單位之規模、性質，訂定職業安全衛生管理計畫，要求各級主管及負責指揮、監督之有關人員執行；勞工人數在三十人以下之事業單位，得以安全衛生管理執行紀錄或文件代替職業安全衛生管理計畫。\n勞工人數在一百人以上之事業單位，應另訂定職業安全衛生管理規章。\n第二項職業安全衛生管理計畫，應包括下列事項：\n一、機械、設備或器具之管理。\n二、危害性化學品之分類、標示、通識及管理。\n三、有害作業環境之採樣策略規劃及監測。\n四、危險性工作場所之製程或施工安全評估。\n五、採購管理、承攬管理及變更管理。\n六、安全衛生作業標準。\n七、定期檢查、重點檢查、作業檢點及現場巡視。\n八、安全衛生教育訓練。\n九、個人防護具之管理。\n十、健康檢查、管理及促進。\n十一、安全衛生資訊之蒐集、分享及運用。\n十二、緊急應變措施。\n十三、職業災害、虛驚事故、影響身心健康事件之調查處理及統計分析。\n十四、安全衛生管理稽核及績效評估措施。\n十五、其他安全衛生管理措施。\n第二項職業安全衛生管理事項之執行，應作成紀錄，並保存三年。\n第 12-2 條\n下列事業單位，雇主應依國家標準CNS 45001同等以上規定，建置適合該事業單位之職業安全衛生管理系統，並據以執行：\n一、第一類事業勞工人數在二百人以上者。\n二、第二類事業勞工人數在五百人以上者。\n三、有從事石油裂解之石化工業工作場所者。\n四、有從事製造、處置或使用危害性之化學品，數量達中央主管機關規定量以上之工作場所者。\n五、其他經中央主管機關指定公告者。\n前項安全衛生管理之執行，應作成紀錄，並保存三年。\n第 12-3 條\n第十二條之二第一項之事業單位應建立變更管理程序，於引進或修改製程、作業程序、材料及設備前，辨識可能危害及評估其職業災害之風險，並依風險評估結果採取必要之預防設備及措施。\n前項變更，雇主應檢討與更新相關安全衛生文件，使勞工充分知悉及接受相關教育訓練。\n前二項執行紀錄，應保存三年。\n第 12-4 條\n第十二條之二第一項之事業單位應建立採購管理程序，對於機械、設備、器具、物料、原料及個人防護具等之採購、租賃，其契約內容應有符合法令及實際需要之職業安全衛生具體規範，並於驗收、使用前確認其符合規定。\n前項事業單位將營繕工程交付規劃、設計時，應依工程特性實施風險評估及訂定施工管理相關規範，並納入施工及監造履約要件，要求施工者評估施工風險與採取必要之預防設備及措施。\n前二項執行紀錄，應保存三年。\n第 12-5 條\n第十二條之二第一項之事業單位，以其事業交付承攬或與承攬人、再承攬人之工作者共同作業時，除應依本法第二十六條或第二十七條規定辦理外，應就承攬人之安全衛生管理能力、職業災害與事故通報、危險作業管制、教育訓練、進場管制、緊急應變及安全衛生績效評估等事項，訂定承攬管理計畫，並促使承攬人、再承攬人及其工作者，遵守職業安全衛生法令及原事業單位所定之職業安全衛生管理事項。\n前項事業單位將營繕工程交付二個以上施工者施工時，應指定施工者之一實施整體工程施工風險評估及採取必要之統合管理。\n前項執行紀錄，應保存三年。\n第 12-6 條\n第十二條之二第一項之事業單位，應評估潛在風險，訂定緊急狀況預防、準備及應變之計畫，並定期辦理教育訓練與緊急應變演練，及依演練結果檢討修正應變計畫。\n前項計畫，應包括下列事項：\n一、應變組織及職責。\n二、通報程序。\n三、各項緊急狀況處理程序。\n四、避難疏散措施。\n五、必要應變設備。\n六、與外部救援單位之聯繫機制。\n第一項執行紀錄，應保存三年。\n第 12-7 條\n事業單位已實施第十二條之二職業安全衛生管理系統相關管理制度，且管理績效良好者，中央主管機關得分級公開表揚之。\n第 四 章 自動檢查\n第 一 節 機械之定期檢查\n第 13 條\n雇主對電氣機車、蓄電池機車、電車、蓄電池電車、內燃機車、內燃動力車及蒸汽機車等（以下於本條中稱電氣機車等），應每三年就整體定期實施檢查一次。\n雇主對前項之電氣機車等應每年依下列規定定期實施檢查一次：\n一、電氣機車、蓄電池機車、電車及蓄電池電車應檢查電動機、控制裝置、制動器、自動遮斷器、車架、連結裝置、蓄電池、避雷器、配線、接觸器具及各種儀表之有無異常。\n二、內燃機車及內燃動力車應檢查引擎、動力傳動裝置、制動器、車架、連結裝置及各種儀表之有無異常。\n三、蒸汽機車應檢查氣缸、閥、蒸氣管、調壓閥、安全閥及各種儀表之有無異常。\n雇主對電氣機車等應每月依下列規定就其車體所裝置項目定期實施檢查一次：\n一、電氣機車、蓄電池機車、電車及蓄電池電車應檢查電路、制動器及連結裝置之有無異常。\n二、內燃機車或內燃動力車應檢查制動器及連結裝置之有無異常。\n三、蒸汽機車應檢查火室、易熔栓、水位計、給水裝置、制動器及連結裝置之有無異常。\n第 14 條\n雇主對一般車輛，應每三個月就車輛各項安全性能定期實施檢查一次。\n第 15 條\n車輛頂高機應每三個月檢查一次以上，維持其安全性能。\n第 15-1 條\n雇主對高空工作車，應每年就下列事項實施檢查一次：\n一、壓縮壓力、閥間隙及其他原動機有無異常。\n二、離合器、變速箱、差速齒輪、傳動軸及其他動力傳動裝置有無異常。\n三、主動輪、從動輪、上下轉輪、履帶、輪胎、車輪軸承及其他走行裝置有無異常。\n四、轉向器之左右回轉角度、肘節、軸、臂及其他操作裝置有無異常。\n五、制動能力、制動鼓、制動塊及其他制動裝置有無異常。\n六、伸臂、升降裝置、屈折裝置、平衡裝置、工作台及其他作業裝置有無異常。\n七、油壓泵、油壓馬達、汽缸、安全閥及其他油壓裝置有無異常。\n八、電壓、電流及其他電氣系統有無異常。\n九、車體、操作裝置、安全裝置、連鎖裝置、警報裝置、方向指示器、燈號裝置及儀表有無異常。\n第 15-2 條\n雇主對高空工作車，應每月依下列規定定期實施檢查一次：\n一、制動裝置、離合器及操作裝置有無異常。\n二、作業裝置及油壓裝置有無異常。\n三、安全裝置有無異常。\n第 16 條\n雇主對車輛系營建機械，應每年就該機械之整體定期實施檢查一次。\n雇主對前項之車輛系營建機械，應每月依下列規定定期實施檢查一次：\n一、制動器、離合器、操作裝置及作業裝置之有無異常。\n二、鋼索及鏈等之有無損傷。\n三、吊斗及鏟斗之有無損傷。\n四、倒車或旋轉警示燈及蜂鳴器之有無異常。\n第 17 條\n雇主對堆高機，應每年就該機械之整體定期實施檢查一次。\n雇主對前項之堆高機，應每月就下列規定定期實施檢查一次：\n一、制動裝置、離合器及方向裝置。\n二、積載裝置及油壓裝置。\n三、貨叉、鍊條、頂蓬及桅桿。\n第 18 條\n雇主對以動力驅動之離心機械，應每年就下列規定機械之一部分，定期實施檢查一次：\n一、回轉體。\n二、主軸軸承。\n三、制動器。\n四、外殼。\n五、配線、接地線、電源開關。\n六、設備之附屬螺栓。\n第 19 條\n雇主對固定式起重機，應每年就該機械之整體定期實施檢查一次。\n雇主對前項之固定式起重機，應每月依下列規定定期實施檢查一次。\n一、過捲預防裝置、警報裝置、制動器、離合器及其他安全裝置有無異常。\n二、鋼索及吊鏈有無損傷。\n三、吊鉤、抓斗等吊具有無損傷。\n四、配線、集電裝置、配電盤、開關及控制裝置有無異常。\n五、對於纜索固定式起重機之鋼纜等及絞車裝置有無異常。\n前項檢查於輻射區及高溫區，停用超過一個月者得免實施。惟再度使用時，仍應為之。\n第 20 條\n雇主對移動式起重機，應每年依下列規定定期實施檢查一次：\n一、伸臂、迴轉裝置（含螺栓、螺帽等）、外伸撐座、動力傳導裝置及其他結構項目有無損傷。\n二、迴轉裝置（含螺栓、螺帽等）有無異常並依原製造廠規定量測位移及螺栓扭力值。\n三、過捲預防裝置、警報裝置、制動器、離合器及其他安全裝置有無異常。\n四、鋼索、吊鏈及吊具有無損傷。\n五、配線、集電裝置、配電盤、開關及其他機械電氣項目有無異常。\n雇主對前項移動式起重機，應每月依下列規定定期實施檢查一次：\n一、過捲預防裝置、警報裝置、制動器、離合器及其他安全裝置有無異常。\n二、鋼索及吊鏈有無損傷。\n三、吊鉤、抓斗等吊具有無損傷。\n四、配線、集電裝置、配電盤、開關及控制裝置有無異常。\n第 21 條\n雇主對人字臂起重桿應每年就該機械之整體定期實施檢查一次。\n雇主對前項人字臂起重桿，應每月依下列規定定期實施檢查一次：\n一、過捲預防裝置、制動器、離合器及其他安全裝置有無異常。\n二、捲揚機之安置狀況。\n三、鋼索有無損傷。\n四、導索之結頭部分有無異常。\n五、吊鉤、抓斗等吊具有無損傷。\n六、配線、開關及控制裝置有無異常。\n第 22 條\n雇主對升降機，應每年就該機械之整體定期實施檢查一次。\n雇主對前項之升降機，應每月依下列規定定期實施檢查一次：\n一、終點極限開關、緊急停止裝置、制動器、控制裝置及其他安全裝置有無異常。\n二、鋼索或吊鏈有無損傷。\n三、導軌之狀況。\n四、設置於室外之升降機者，為導索結頭部分有無異常。\n第 23 條\n雇主對營建用提升機，應每月依下列規定定期實施檢查一次：\n一、制動器及離合器有無異常。\n二、捲揚機之安裝狀況。\n三、鋼索有無損傷。\n四、導索之固定部位有無異常。\n第 24 條\n雇主對吊籠應每月依下列規定定期實施檢查一次：\n一、過捲預防裝置、制動器、控制裝置及其他安全裝置有無異常。\n二、吊臂、伸臂及工作台有無損傷。\n三、升降裝置、配線、配電盤有無異常。\n第 25 條\n雇主對簡易提升機，應每年定期實施檢查一次。\n雇主對前項之簡易提升機，應每月依下列規定定期實施檢查一次：\n一、過捲預防裝置、制動器、控制裝置及其他安全裝置有無異常。\n二、鋼索及吊鏈有無損傷。\n三、導軌狀況。\n第 26 條\n雇主對以動力驅動之衝剪機械，應每年依下列規定機械之一部分，定期實施檢查一次：\n一、離合器及制動裝置。\n二、曲柄軸、飛輪、滑塊、連結螺栓及連桿。\n三、一行程一停止機構及緊急制動器。\n四、電磁閥、減壓閥及壓力表。\n五、配線及開關。\n第 二 節 設備之定期檢查\n第 27 條\n雇主對乾燥設備、以氣體燃料或液體燃料等為熱源之加熱設備，及其附屬設備（含排氣裝置、排風導管等），應每年依下列規定定期實施檢查一次：\n一、內面、外面及外部之棚櫃等有無損傷、變形或腐蝕。\n二、危險物之乾燥設備中，排出因乾燥產生之氣體、蒸氣或粉塵等之設備有無異常。\n三、使用液體燃料或可燃性液體為熱源之乾燥設備，燃燒室或點火處之換氣設備有無異常。\n四、窺視孔、出入孔、排氣孔等開口部有無異常。\n五、內部溫度測定裝置及調整裝置有無異常。\n六、設置於內部之電氣機械器具或配線有無異常。\n七、加熱設備之燃料供應系統控制閥、電磁遮斷閥，或其他安全遮斷裝置之功能有無異常。\n第 28 條\n雇主對乙炔熔接裝置（除此等裝置之配管埋設於地下之部分外）應每年就裝置之損傷、變形、腐蝕等及其性能定期實施檢查一次。\n第 29 條\n雇主對氣體集合熔接裝置（除此等裝置之配管埋設於地下之部分外）應每年就裝置之損傷、變形、腐蝕等及其性能定期實施檢查一次。\n第 30 條\n雇主對高壓電氣設備，應於每年依下列規定定期實施檢查一次：\n一、高壓受電盤及分電盤（含各種電驛、儀表及其切換開關等）之動作試驗。\n二、高壓用電設備絕緣情形、接地電阻及其他安全設備狀況。\n三、自備屋外高壓配電線路情況。\n第 31 條\n雇主對於低壓電氣設備，應每年依下列規定定期實施檢查一次：\n一、低壓受電盤及分電盤（含各種電驛、儀表及其切換開關等）之動作試驗。\n二、低壓用電設備絕緣情形，接地電阻及其他安全設備狀況。\n三、自備屋外低壓配電線路情況。\n第 31-1 條\n雇主對於防爆電氣設備，應每月依下列規定定期實施檢查一次：\n一、本體有無損傷、變形。\n二、配管、配線等有無損傷、變形及異常狀況。\n三、其他保持防爆性能之必要事項。\n第 32 條\n雇主對鍋爐應每月依下列規定定期實施檢查一次：\n一、鍋爐本體有無損傷。\n二、燃燒裝置：\n（一）油加熱器及燃料輸送裝置有無損傷。\n（二）噴燃器有無損傷及污髒。\n（三）過濾器有無堵塞或損傷。\n（四）燃燒器瓷質部及爐壁有無污髒及損傷。\n（五）加煤機及爐篦有無損傷。\n（六）煙道有無洩漏、損傷及風壓異常。\n三、自動控制裝置：\n（一）自動起動停止裝置、火焰檢出裝置、燃料切斷裝置、水位調節裝置、壓力調節裝置機能有無異常。\n（二）電氣配線端子有無異常。\n四、附屬裝置及附屬品：\n（一）給水裝置有無損傷及作動狀態。\n（二）蒸汽管及停止閥有無損傷及保溫狀態。\n（三）空氣預熱器有無損傷。\n（四）水處理裝置機能有無異常。\n第 33 條\n雇主對高壓氣體特定設備、高壓氣體容器及第一種壓力容器，應每月依下列規定定期實施檢查一次：\n一、本體有無損傷、變形。\n二、蓋板螺栓有無損耗。\n三、管、凸緣、閥及旋塞等有無損傷、洩漏。\n四、壓力表及溫度計及其他安全裝置有無損傷。\n五、平台支架有無嚴重腐蝕。\n對於有保溫部分或有高游離輻射污染之虞之場所，得免實施。\n第 34 條\n雇主對小型鍋爐應每年依下列規定定期實施檢查一次：\n一、鍋爐本體有無損傷。\n二、燃燒裝置有無異常。\n三、自動控制裝置有無異常。\n四、附屬裝置及附屬品性能是否正常。\n五、其他保持性能之必要事項。\n第 35 條\n雇主對第二種壓力容器應每年依下列規定定期實施檢查一次：\n一、內面及外面有無顯著損傷、裂痕、變形及腐蝕。\n二、蓋、凸緣、閥、旋塞等有無異常。\n三、安全閥、壓力表與其他安全裝置之性能有無異常。\n四、其他保持性能之必要事項。\n第 36 條\n雇主對小型壓力容器應每年依下列規定定期實施檢查一次：\n一、本體有無損傷。\n二、蓋板螺旋有無異常。\n三、管及閥等有無異常。\n四、其他保持性能之必要事項。\n第 37 條\n雇主對高壓氣體儲存能力在一百立方公尺或一公噸以上之儲槽應注意有無沈陷現象，並應每年定期測定其沈陷狀況一次。\n第 38 條\n雇主對特定化學設備或其附屬設備，應每二年依下列規定定期實施檢查一次：\n一、特定化學設備或其附屬設備（不含配管）：\n（一）內部有無足以形成其損壞原因之物質存在。\n（二）內面及外面有無顯著損傷、變形及腐蝕。\n（三）蓋、凸緣、閥、旋塞等之狀態。\n（四）安全閥、緊急遮斷裝置與其他安全裝置及自動警報裝置之性能。\n（五）冷卻、攪拌、壓縮、計測及控制等性能。\n（六）備用動力源之性能。\n（七）其他為防止丙類第一種物質或丁類物質之漏洩之必要事項。\n二、配管\n（一）熔接接頭有無損傷、變形及腐蝕。\n（二）凸緣、閥、旋塞等之狀態。\n（三）接於配管之供為保溫之蒸氣管接頭有無損傷、變形或腐蝕。\n第 39 條\n雇主對化學設備及其附屬設備，應就下列事項，每二年定期實施檢查一次：\n一、內部是否有造成爆炸或火災之虞。\n二、內部與外部是否有顯著之損傷、變形及腐蝕。\n三、蓋板、凸緣、閥、旋塞等之狀態。\n四、安全閥或其他安全裝置、壓縮裝置、計測裝置之性能。\n五、冷卻裝置、攪拌裝置、壓縮裝置、計測裝置及控制裝置之性能。\n六、預備電源或其代用裝置之性能。\n七、其他防止爆炸或火災之必要事項。\n第 40 條\n雇主對局部排氣裝置、空氣清淨裝置及吹吸型換氣裝置應每年依下列規定定期實施檢查一次：\n一、氣罩、導管及排氣機之磨損、腐蝕、凹凸及其他損害之狀況及程度。\n二、導管或排氣機之塵埃聚積狀況。\n三、排氣機之注油潤滑狀況。\n四、導管接觸部分之狀況。\n五、連接電動機與排氣機之皮帶之鬆弛狀況。\n六、吸氣及排氣之能力。\n七、設置於排放導管上之採樣設施是否牢固、鏽蝕、損壞、崩塌或其他妨礙作業安全事項。\n八、其他保持性能之必要事項。\n第 41 條\n雇主對設置於局部排氣裝置內之空氣清淨裝置，應每年依下列規定定期實施檢查一次：\n一、構造部分之磨損、腐蝕及其他損壞之狀況及程度。\n二、除塵裝置內部塵埃堆積之狀況。\n三、濾布式除塵裝置者，有濾布之破損及安裝部分鬆弛之狀況。\n四、其他保持性能之必要措施。\n第 42 條\n雇主對異常氣壓之再壓室或減壓艙，應就下列事項，每個月依下列規定定期實施檢查一次：\n一、輸氣設備及排氣設備之運作狀況。\n二、通話設備及警報裝置之運作狀況。\n三、電路有無漏電。\n四、電器、機械器具及配線有無損傷。\n第 43 條\n雇主對施工架及施工構台，應就下列事項，每週定期實施檢查一次：\n一、架材之損傷、安裝狀況。\n二、立柱、橫檔、踏腳桁等之固定部分，接觸部分及安裝部分之鬆弛狀況。\n三、固定材料與固定金屬配件之損傷及腐蝕狀況。\n四、扶手、護欄等之拆卸及脫落狀況。\n五、基腳之下沈及滑動狀況。\n六、斜撐材、索條、橫檔等補強材之狀況。\n七、立柱、踏腳桁、橫檔等之損傷狀況。\n八、懸臂樑與吊索之安裝狀況及懸吊裝置與阻檔裝置之性能。\n九、壁連座之間距及連接構件之狀況。\n強風大雨等惡劣氣候、四級以上之地震襲擊後及每次停工之復工前，亦應實施前項檢查。\n第 44 條\n雇主對營造工程之模板支撐架，應每週依下列規定實施檢查：\n一、架材之損傷、安裝狀況。\n二、支柱等之固定部分、接觸部分及搭接重疊部分之鬆弛狀況。\n三、固定材料與固定金屬配件之損傷及腐蝕狀況。\n四、基腳（礎）之沉陷及滑動狀況。\n五、斜撐材、水平繫條等補強材之狀況。\n強風大雨等惡劣氣候、四級以上之地震襲擊後及每次停工之復工前，亦應實施前項檢查。\n第 44-1 條\n雇主對於機械、設備，應依本章第一節及第二節規定，實施定期檢查。但雇主發現有腐蝕、劣化、損傷或堪用性之虞，應實施安全評估，並縮短其檢查期限。\n第 三 節 機械、設備之重點檢查\n第 45 條\n雇主對第二種壓力容器及減壓艙，應於初次使用前依下列規定實施重點檢查：\n一、確認胴體、端板之厚度是否與製造廠所附資料符合。\n二、確認安全閥吹洩量是否足夠。\n三、各項尺寸、附屬品與附屬裝置是否與容器明細表符合。\n四、經實施耐壓試驗無局部性之膨出、伸長或洩漏之缺陷。\n五、其他保持性能之必要事項。\n第 46 條\n雇主對捲揚裝置於開始使用、拆卸、改裝或修理時，應依下列規定實施重點檢查：\n一、確認捲揚裝置安裝部位之強度，是否符合捲揚裝置之性能需求。\n二、確認安裝之結合元件是否結合良好，其強度是否合乎需求。\n三、其他保持性能之必要事項。\n第 47 條\n雇主對局部排氣裝置或除塵裝置，於開始使用、拆卸、改裝或修理時，應依下列規定實施重點檢查：\n一、導管或排氣機粉塵之聚積狀況。\n二、導管接合部分之狀況。\n三、吸氣及排氣之能力。\n四、其他保持性能之必要事項。\n第 48 條\n雇主對異常氣壓之輸氣設備應依下列規定實施重點檢查：\n一、對輸氣設備初次使用或予分解後加以改造、修理或停用一個月以上擬再度使用時，應對該設備實施重點檢查。\n二、於輸氣設備發生故障或因出水或發生其他異常，致高壓室內作業勞工有遭受危險之虞時，應迅即使勞工自沈箱、壓氣潛盾等撤離，避免危難，應即檢點輸氣設備之有無異常，沈箱等之有無異常沈降或傾斜及其他必要事項。\n第 49 條\n雇主對特定化學設備或其附屬設備，於開始使用、改造、修理時，應依下列規定實施重點檢查一次：\n一、特定化學設備或其附屬設備（不含配管）：\n（一）內部有無足以形成其損壞原因之物質存在。\n（二）內面及外面有無顯著損傷、變形及腐蝕。\n（三）蓋、凸緣、閥、旋塞等之狀態。\n（四）安全閥、緊急遮斷裝置與其他安全裝置及自動警報裝置之性能。\n（五）冷卻、攪拌、壓縮、計測及控制等性能。\n（六）備用動力源之性能。\n（七）其他為防止丙類第一種物質或丁類物質之漏洩之必要事項。\n二、配管：\n（一）熔接接頭有無損傷、變形及腐蝕。\n（二）凸緣、閥、旋塞等之狀態。\n（三）接於配管之蒸氣管接頭有無損傷、變形或腐蝕。\n第 四 節 機械、設備之作業檢點\n第 50 條\n雇主對車輛機械，應每日作業前依下列各項實施檢點：\n一、制動器、連結裝置、各種儀器之有無異常。\n二、蓄電池、配線、控制裝置之有無異常。\n第 50-1 條\n雇主對高空工作車，應於每日作業前就其制動裝置、操作裝置及作業裝置之性能實施檢點。\n第 51 條\n雇主對捲揚裝置應於每日作業前就其制動裝置、安全裝置、控制裝置及鋼索通過部分狀況實施檢點。\n第 52 條\n雇主對固定式起重機，應於每日作業前依下列規定實施檢點，對置於瞬間風速可能超過每秒三十公尺或四級以上地震後之固定式起重機，應實施各部安全狀況之檢點：\n一、過捲預防裝置、制動器、離合器及控制裝置性能。\n二、直行軌道及吊運車橫行之導軌狀況。\n三、鋼索運行狀況。\n第 53 條\n雇主對移動式起重機，應於每日作業前對過捲預防裝置、過負荷警報裝置、制動器、離合器 、控制裝置及其他警報裝置之性能實施檢點。\n第 54 條\n雇主對人字臂起重桿，應於每日作業前依下列規定實施檢點，對置於瞬間風速可能超過每秒三十公尺（以設於室外者為限）或四級以上地震後之人字臂起重桿，應就其安全狀況實施檢點：\n一、過捲預防裝置、制動器、離合器及控制裝置之性能。\n二、鋼索通過部分狀況。\n第 54-1 條\n雇主對營建用或載貨用之升降機，應於每日作業前對搬器及升降路所有出入口門扉之連鎖裝置之性能實施檢點。\n第 55 條\n雇主對營建用提升機，應於每日作業前，依下列規定實施檢點：\n一、制動器及離合器性能。\n二、鋼索通過部分狀況。\n第 56 條\n雇主對吊籠，應於每日作業前依下列規定實施檢點，如遇強風、大雨、大雪等惡劣氣候後， 應實施第三款至第五款之檢點：\n一、鋼索及其緊結狀態有無異常。\n二、扶手等有無脫離。\n三、過捲預防裝置、制動器、控制裝置及其他安全裝置之機能有無異常。\n四、升降裝置之擋齒機能。\n五、鋼索通過部分狀況。\n第 57 條\n雇主對簡易提升機，應於每日作業前對制動性能實施檢點。\n第 58 條\n雇主對第十六條、第十九條至第二十五條及第五十二條至前條規定之起重機械使用之吊掛用鋼索、吊鏈、纖維索、吊鉤、吊索、鏈環等用具，應於每日作業前實施檢點。\n第 59 條\n雇主對第二十六條之衝剪機械，應於每日作業前依下列規定，實施檢點：\n一、離合器及制動器之機能。\n二、曲柄軸、飛輪、滑塊、連桿、連接螺栓之有無鬆懈狀況。\n三、一行程一停止機構及緊急制動裝置之機能。\n四、安全裝置之性能。\n五、電氣、儀表。\n第 60 條\n雇主對工業用機器人應於每日作業前依下列規定實施檢點；檢點時應儘可能在可動範圍外為之：\n一、制動裝置之機能。\n二、緊急停止裝置之機能。\n三、接觸防止設施之狀況及該設施與機器人間連鎖裝置之機能。\n四、相連機器與機器人間連鎖裝置之機能。\n五、外部電線、配管等有無損傷。\n六、供輸電壓、油壓及空氣壓有無異常。\n七、動作有無異常。\n八、有無異常之聲音或振動。\n第 61 條\n雇主對高壓氣體製造設備，應於使用開始前及使用終了後，檢點該設備有無異常，且應依所製造之高壓氣體種類及製造設備狀況，一日一次以上就該設備之動作狀況實施檢點。\n第 62 條\n雇主對高壓氣體消費設備，應於使用開始前及使用終了後，檢點該設備有無異常，一日一次以上就該設備之動作狀況實施檢點。\n第 63 條\n雇主對營建工程施工架設備、施工構台、支撐架設備、露天開挖擋土支撐設備、隧道或坑道開挖支撐設備、沉箱、圍堰及壓氣施工設備、打樁設備等，應於每日作業前及使用終了後，檢點該設備有無異常或變形。\n第 五 節 作業檢點\n第 64 條\n雇主使勞工從事下列危險性設備作業時，應使該勞工就其作業有關事項實施檢點：\n一、鍋爐之操作作業。\n二、第一種壓力容器之操作作業。\n三、高壓氣體特定設備之操作作業。\n四、高壓氣體容器之操作作業。\n第 65 條\n雇主使勞工從事下列高壓氣體作業時，應使該勞工就其作業有關事項實施檢點：\n一、高壓氣體之灌裝作業。\n二、高壓氣體容器儲存作業。\n三、高壓氣體之運輸作業。\n四、高壓氣體之廢棄作業。\n第 66 條\n雇主使勞工從事工業用機器人之教導及操作作業時，應使該勞工就其作業有關事項實施檢點。\n第 67 條\n雇主使勞工從事營造作業時，應就下列事項，使該勞工就其作業有關事項實施檢點：\n一、打樁設備之組立及操作作業。\n二、擋土支撐之組立及拆除作業。\n三、露天開挖之作業。\n四、隧道、坑道開挖作業。\n五、混凝土作業。\n六、鋼架施工作業。\n七、施工構台之組立及拆除作業。\n八、建築物之拆除作業。\n九、施工架之組立及拆除作業。\n十、模板支撐之組立及拆除作業。\n十一、其他營建作業。\n第 68 條\n雇主使勞工從事缺氧危險或局限空間作業時，應使該勞工就其作業有關事項實施檢點。\n第 69 條\n雇主使勞工從事下列有害物作業時，應使該勞工就其作業有關事項實施檢點：\n一、有機溶劑作業。\n二、鉛作業。\n三、四烷基鉛作業。\n四、特定化學物質作業。\n五、粉塵作業。\n第 70 條\n雇主使勞工從事下列異常氣壓作業時，應使該勞工就其作業有關事項實施檢點：\n一、潛水作業。\n二、高壓室內作業。\n三、沈箱作業。\n四、氣壓沈箱、沈筒、潛盾施工等作業。\n第 71 條\n雇主使勞工從事金屬之熔接、熔斷或加熱作業時，應就下列事項，使該勞工就其作業有關事項實施檢點：\n一、乙炔熔接裝置。\n二、氣體集合熔接裝置。\n三、氧乙炔熔接裝置。\n第 72 條\n雇主使勞工從事危害性化學品之製造、處置及使用作業時，應使該勞工就其作業有關事項實施檢點。\n第 73 條\n雇主使勞工從事林場作業時，應使該勞工就其作業有關事項實施檢點。\n第 74 條\n雇主使勞工從事船舶清艙解體作業時，應使該勞工就其作業有關事項實施檢點。\n第 75 條\n雇主使勞工從事碼頭裝卸作業時，應使該勞工就其作業有關事項實施檢點。\n第 76 條\n（刪除）\n第 77 條\n雇主使勞工對其作業中之纖維纜索、乾燥室、防護用具、電氣機械器具及自設道路等實施檢點。\n第 78 條\n雇主依第五十條至第五十六條及第五十八條至第七十七條實施之檢點，其檢點對象、內容，應依實際需要訂定，以檢點手冊或檢點表等為之。\n第 六 節 自動檢查紀錄及必要措施\n第 79 條\n雇主依第十三條至第六十三條規定實施之自動檢查，應訂定自動檢查計畫。\n第 80 條\n雇主依第十三條至第四十九條規定實施之定期檢查、重點檢查應就下列事項記錄，並保存三年：\n一、檢查年月日。\n二、檢查方法。\n三、檢查部分。\n四、檢查結果。\n五、實施檢查者之姓名。\n六、依檢查結果應採取改善措施之內容。\n第 81 條\n勞工、主管人員及職業安全衛生管理人員實施檢查、檢點時，發現對勞工有危害之虞者，應即報告上級主管。\n雇主依第十三條至第七十七條規定實施自動檢查，發現有異常時，應立即檢修及採取必要措施。\n第 82 條\n雇主依第十三條至第七十七條規定實施之自動檢查，於其他法令另有規定者外，應依該規定為之。\n第 83 條\n雇主依第十三條至第七十七條規定之自動檢查，除依本法所定之其他法令另有規定者外，應指定具專業知能或操作資格之適當人員為之。\n第 84 條\n事業單位以其事業之全部或部分交付承攬或再承攬時，如該承攬人使用之機械、設備或器具係由原事業單位提供者，該機械、設備或器具應由原事業單位實施定期檢查及重點檢查。\n前項定期檢查及重點檢查於有必要時得由承攬人或再承攬人會同實施。\n第一項之定期檢查及重點檢查如承攬人或再承攬人具有實施之能力時，得以書面約定由承攬人或再承攬人為之。\n第 85 條\n事業單位承租、承借機械、設備或器具供勞工使用者，應對該機械、設備或器具實施自動檢查。\n前項自動檢查之定期檢查及重點檢查，於事業單位承租、承借機械、設備或器具時，得以書面約定由出租、出借人為之。\n第 五 章 報告\n第 86 條\n勞工人數在三十人以上之事業單位，依第二條之一至第三條之一、第六條規定設管理單位或置管理人員時，應依中央主管機關公告之內容及方式登錄，報請勞動檢查機構備查；變更時，亦同。\n第 87 條\n雇主依第十條規定設委員會時，應製作委員會名冊（如附表三），並依中央主管機關公告之內容及方式登錄，報請勞動檢查機構備查；變更時，亦同。\n第 六 章 附則\n第 88 條\n於本辦法發布日前，依已廢止之工廠安全衛生管理人員設置辦法、勞工安全衛生組織及管理人員設置辦法及修正前之勞工安全衛生組織管理及自動檢查辦法規定，取得勞工安全衛生管理人員資格者，於本辦法施行後，其資格不受影響。\n第 89 條\n（刪除）\n第 89-1 條\n政府機關（構），對於第二條之一、第三條及第六條之規定，因其他法規限制，得於組織修編完成前，以報經中央主管機關核定之職業安全衛生管理規章或職業安全衛生管理計畫替代之。\n第 89-2 條\n雇主依第五條之一、第十二條至第十二條之六及第八十條規定所作之紀錄，應以紙本保存。但以電子紀錄形式保存，並能隨時調閱查對者，不在此限。\n第 90 條\n本辦法自發布日施行。但除中華民國九十七年一月九日修正發布之第二條之一第一項第一款、第六條第二項第一款已另定施行日期者外，第二條、第二條之一、第三條、第三條之一、第三條之二、第五條之一、第六條、第七條、第十條、第十二條之一至第十二條之六規定，自發布後六個月施行。\n本辦法中華民國一百零三年六月二十六日修正發布之條文，自一百零三年七月三日施行。\n本辦法中華民國一百零五年二月十九日修正發布之條文，除第六條之一及第十二條之七規定，自一百零五年七月一日施行外，自一百零六年一月一日施行。\n本辦法中華民國一百零九年九月二十四日修正發布之第四條規定，自發布後六個月施行。\n本辦法中華民國一百十一年一月五日修正發布之第四條規定，自一百十一年一月七日施行。\n本辦法中華民國一百十五年六月二十九日修正發布之條文，自一百十五年七月一日施行。","history":"1.105年2月19日修正發布。\n2.111年1月5日勞動部勞職授字第 11002065741 號令修正發布第 4、90  條條文；並自111年1月7日施行。\n3. 115年6月29日勞動部勞職授字第 1150252299 號令修正發布第 1、1-1、5-1、6、11～12-7、20、27、43、44、60、63、67、71、84、86、87、90 條條文及第3條條文之附表二；依第 90 條規定：自115年7月1日施行。","contentHtml":"<div class=\"doc-paragraph doc-image-only\"><span style=\"background-color:yellow;\"><\/span><\/div>\n<div class=\"chapter-heading\">第 一 章 總則<\/div>\n<div class=\"article-heading\">第 1 條<\/div>\n<div class=\"doc-plain\">本辦法依職業安全衛生法（以下簡稱本法）第二十三條第五項規定訂定之。<\/div>\n<div class=\"article-heading\">第 1-1 條<\/div>\n<div class=\"doc-plain\">雇主應依其事業之規模、性質，設置安全衛生組織及人員，建立職業安全衛生管理系統，透過規劃、實施、評估及改善措施等管理功能，實現安全衛生管理目標，提升安全衛生管理水準。<\/div>\n<div class=\"article-heading\">第 2 條<\/div>\n<div class=\"doc-plain\">本辦法之事業，依危害風險之不同區分如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">第一類事業：具顯著風險者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第二類事業：具中度風險者。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">第三類事業：具低度風險者。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項各款事業之例示，如附表一。<\/div>\n<div class=\"chapter-heading\">第 二 章 職業安全衛生組織及人員<\/div>\n<div class=\"article-heading\">第 2-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位應依下列規定設職業安全衛生管理單位（以下簡稱管理單位）：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">第一類事業之事業單位勞工人數在一百人以上者，應設直接隸屬雇主之專責一級管理單位。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第二類事業勞工人數在三百人以上者，應設直接隸屬雇主之一級管理單位。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項第一款專責一級管理單位之設置，於勞工人數在三百人以上者，自中華民國九十九年一月九日施行；勞工人數在二百人至二百九十九人者，自一百年一月九日施行；勞工人數在一百人至一百九十九人者，自一百零一年一月九日施行。<\/div>\n<div class=\"article-heading\">第 3 條<\/div>\n<div class=\"article-heading\">第二條<\/div><div class=\"doc-plain\">所定事業之雇主應依附表二之規模，置職業安全衛生業務主管及管理人員（以下簡稱管理人員）。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一類事業之事業單位勞工人數在一百人以上者，所置管理人員應為專職；第二類事業之事業單位勞工人數在三百人以上者，所置管理人員應至少一人為專職。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">依前項規定所置專職管理人員，應常駐廠場執行業務，不得兼任其他法令所定專責（任）人員或從事其他與職業安全衛生無關之工作。<\/div>\n<div class=\"article-heading\">第 3-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前條第一類事業之事業單位對於所屬從事製造之一級單位，勞工人數在一百人以上未滿三百人者，應另置甲種職業安全衛生業務主管一人，勞工人數三百人以上者，應再至少增置專職職業安全衛生管理員一人。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">營造業之事業單位對於橋樑、道路、隧道或輸配電等距離較長之工程，應於每十公里內增置營造業丙種職業安全衛生業務主管一人。<\/div>\n<div class=\"article-heading\">第 3-2 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位勞工人數之計算，包含原事業單位及其承攬人、再承攬人之勞工及其他受工作場所負責人指揮或監督從事勞動之人員，於同一期間、同一工作場所作業時之總人數。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業設有總機構者，其勞工人數之計算，包含所屬各地區事業單位作業勞工之人數。<\/div>\n<div class=\"article-heading\">第 4 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業單位勞工人數未滿三十人者，雇主或其代理人經職業安全衛生業務主管安全衛生教育訓練合格，得擔任該事業單位職業安全衛生業務主管。但屬第二類及第三類事業之事業單位，且勞工人數在五人以下者，得由經職業安全衛生教育訓練規則第三條附表一所列丁種職業安全衛生業務主管教育訓練合格之雇主或其代理人擔任。<\/div>\n<div class=\"article-heading\">第 5 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">（刪除）<\/div>\n<div class=\"article-heading\">第 5-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">職業安全衛生組織、人員、工作場所負責人及各級主管之職責如下：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">職業安全衛生管理單位：擬訂、規劃、督導及推動安全衛生管理事項，並指導有關部門實施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">職業安全衛生委員會：對雇主擬訂之安全衛生政策提出建議，並審議、協調及建議安全衛生相關事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">職業安全衛生業務主管：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">事業單位置有職業安全（衛生）管理師、職業安全衛生管理員者：主管及督導安全衛生管理事項。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">事業單位未置有職業安全（衛生）管理師、職業安全衛生管理員者：擬訂、規劃、推動及查核安全衛生管理事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">職業安全（衛生）管理師、職業安全衛生管理員：擬訂、規劃及推動安全衛生管理事項，並指導有關部門實施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">工作場所負責人及各級主管：依職權指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">各級主管：依職責指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">一級單位之職業安全衛生人員：協助一級單位主管擬訂、規劃及推動所屬部門安全衛生管理事項，並指導有關人員實施。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項人員，雇主應使其接受安全衛生教育訓練。<\/div>\n<div class=\"article-heading\">第 6 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業分散於不同地區者，應於各該地區之事業單位依第二條至第三條之二規定，設管理單位及置管理人員。事業單位勞工人數之計算，以各該地區事業單位作業勞工之總人數為準。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">事業設有總機構者，除各該地區事業單位之管理單位及管理人員外，應依下列規定另於總機構或其地區事業單位設綜理全事業之職業安全衛生事務之管理單位，及依附表二之一之規模置管理人員，並依第五條之一規定辦理安全衛生管理事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">第一類事業勞工人數在五百人以上者，應設直接隸屬雇主之專責一級管理單位。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">第二類事業勞工人數在五百人以上者，應設直接隸屬雇主之一級管理單位。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">第三類事業勞工人數在三千人以上者，應設管理單位。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">前項規定所置管理人員，應為專職。但第二類及第三類事業之職業安全衛生業務主管，不在此限。<\/div>\n<div class=\"article-heading\">第 6-1 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一類事業單位或其總機構已實施第十二條之二職業安全衛生管理系統相關管理制度，管理績效並經中央主管機關審查通過者，得不受第二條之一、第三條及前條有關一級管理單位應為專責及職業安全衛生業務主管應為專職之限制。<\/div>\n<div class=\"article-heading\">第 7 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">職業安全衛生業務主管除第四條規定者外，雇主應自該事業之相關主管或辦理職業安全衛生事務者選任之。但營造業之事業單位，應由曾受營造業職業安全衛生業務主管教育訓練者選任之。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">下列職業安全衛生人員，雇主應自事業單位勞工中具備下列資格者選任之：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">職業安全管理師：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">高等考試職業安全衛生類科錄取或具有工業安全技師資格。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">領有職業安全管理甲級技術士證照。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">曾任勞動檢查員，具有職業安全檢查工作經驗三年以上。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">修畢工業安全相關科目十八學分以上，並具有國內外大專以上校院工業安全相關類科碩士以上學位。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">職業衛生管理師：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">高等考試職業安全衛生類科錄取或具有職業衛生技師資格。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">領有職業衛生管理甲級技術士證照。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">曾任勞動檢查員，具有職業衛生檢查工作經驗三年以上。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">修畢工業衛生相關科目十八學分以上，並具有國內外大專以上校院工業衛生相關類科碩士以上學位。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">職業安全衛生管理員：<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（一）<\/span><span class=\"doc-copy\">具有職業安全管理師或職業衛生管理師資格。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（二）<\/span><span class=\"doc-copy\">領有職業安全衛生管理乙級技術士證照。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（三）<\/span><span class=\"doc-copy\">曾任勞動檢查員，具有職業安全衛生檢查工作經驗二年以上。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（四）<\/span><span class=\"doc-copy\">修畢工業安全衛生相關科目十八學分以上，並具有國內外大專以上校院工業安全衛生相關科系畢業。<\/span><\/div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">（五）<\/span><span class=\"doc-copy\">普通考試職業安全衛生類科錄取。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">前項大專以上校院工業安全相關類科碩士、工業衛生相關類科碩士、工業安全衛生相關科系與工業安全、工業衛生及工業安全衛生相關科目由中央主管機關定之。地方主管機關依中央主管機關公告之科系及科目辦理。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">第二項第一款第四目及第二款第四目，自中華民國一百零一年七月一日起不再適用；第二項第三款第四目，自一百零三年七月一日起不再適用。<\/div>\n<div class=\"article-heading\">第 8 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">職業安全衛生人員因故未能執行職務時，雇主應即指定適當代理人。其代理期間不得超過三個月。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">勞工人數在三十人以上之事業單位，其職業安全衛生人員離職時，應即報當地勞動檢查機構備查。<\/div>\n<div class=\"article-heading\">第 9 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">（刪除）<\/div>\n<div class=\"article-heading\">第 10 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">適用第二條之一及第六條第二項規定之事業單位，應設職業安全衛生委員會（以下簡稱委員會）。<\/div>\n<div class=\"article-heading\">第 11 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:4.8em\">委員會置委員七人以上，除雇主為當然委員及第五款規定者外，由雇主視該事業單位之實際需要指定下列人員組成：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">勞工代表。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">事業內各部門之主管、監督、指揮人員。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">職業安全衛生人員。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">勞工健康服務人員。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">其他與安全衛生有關之專業人員。<\/span><\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">委員任期為二年，並以雇主為主任委員，綜理會務。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">委員會由主任委員指定一人為秘書，輔助其綜理會務。<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">第一項第五款之勞工代表，應佔委員人數三分之一以上；事業單位設有工會者，由工會推派之；無工會組織而有勞資會議者，由勞方代表推選之；無工會組織且無勞資會議者，由勞工共同推選之。<\/div>\n<div class=\"article-heading\">第 12 條<\/div>\n<div class=\"doc-plain doc-continuation\" style=\"padding-left:2.8em\">委員會應每三個月至少開會一次，辦理下列事項：<\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">一、<\/span><span class=\"doc-copy\">對雇主擬訂之職業安全衛生政策提出建議。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">二、<\/span><span class=\"doc-copy\">協調、建議職業安全衛生管理計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">三、<\/span><span class=\"doc-copy\">審議安全、衛生教育訓練實施計畫。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">四、<\/span><span class=\"doc-copy\">審議作業環境監測計畫、監測結果及採行措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">五、<\/span><span class=\"doc-copy\">審議健康管理、職業病預防及健康促進事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">六、<\/span><span class=\"doc-copy\">審議各項安全衛生提案。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">七、<\/span><span class=\"doc-copy\">審議事業單位自動檢查及安全衛生稽核事項。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">八、<\/span><span class=\"doc-copy\">審議機械、設備或原料、材料危害之預防措施。<\/span><\/div>\n<div class=\"doc-row doc-level-0\"><span class=\"doc-marker\">九、<\/span><span class=\"doc-copy\">審議職業災害調查報告。<\/span><\/div>\n<div class=\"doc-row do
