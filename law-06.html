<script>
const laws = [{"title":"教師進修研究等專業發展辦法","content":"第  一  章  總則\n第  1  條\n本辦法依教師法(以下簡稱本法)第三十三條第三項規定訂定之。\n第  2  條\n本辦法適用對象為公立及已立案之私立學校編制內，按月支給待遇，並依法取得教師資格之專任教師。\n第  3  條\n本辦法所稱專業發展，指教師從事有助於提升其教學、輔導、研究或教育行政專業知能、促進學生有效學習等與其職務有關之下列活動：\n一、進修：教師至國內、外機關或政府立案之機構、學校進修學位、學程或學分。\n二、研究：教師至國內、外機關或政府立案之機構、學校從事與職務有關之專題研究或實習。\n三、其他專業發展活動：辦理或參與研習、工作坊、教師專業學習社群、競賽、展演、參訪交流，或與課程、教學、學生事務與輔導、學校行政與教育研究相關，能增進教師專業、專門及跨領域(科)知能發展之活動。\n第 二 章 專業發展之方式、請假、補助及獎勵\n第 4 條\n教師得在一定期間內保留職務，並照支薪給，以帶職帶薪方式於國內、外從事專業發展，並依下列規定辦理：\n一、全時進修或研究：學校或其主管機關基於業務需要，主動薦送或指派教師，在一定期間內進修或研究。\n二、部分辦公時間專業發展：\n(一)進修或研究：學校或其主管機關基於業務需要，主動薦送、指派或同意教師，於留校服務期間，利用授課之餘進修或研究。\n(二)其他專業發展活動：學校或其主管機關基於業務需要，主動薦送、指派或同意教師，於辦公時間，從事其他專業發展活動。\n三、專科以上學校教師休假進修或研究：依學校章則規定辦理。\n四、高級中等以下學校教師以公假進行提升教師專業知能之活動：學校主管機關同意教師全時或部分辦公時間從事自主專業成長計畫之研究、參訪交流、公開授課、辦理或參與研習、工作坊、專題講座或其他提升教師專業知能之活動。\n五、公餘專業發展：學校基於業務需要，主動薦送、指派或同意教師，利用假期、週末或夜間進修、研究或從事其他專業發展活動。\n第  5  條\n教師得以留職停薪方式，於國內、外進修或研究；其申請程序及期限，於公立學校依教育人員留職停薪辦法之規定，於私立學校依學校章則之規定。\n前項所稱以留職停薪方式，於國內、外進修或研究，指學校或其主管機關基於業務需要，同意教師在一定期間內保留職務及停止支薪而從事之進修或研究。\n第  6  條\n高級中等以下學校教師從事進修或研究之資格、條件及程序，依主管機關之規定辦理。\n服務學校主動薦送、指派或同意教師進修或研究，應依序審酌下列事項：\n一、進修或研究項目，符合提升教學、輔導、研究或教育行政專業知能、促進學生有效學習之需要。\n二、學校發展需要。\n三、人員調配狀況。\n四、在本校服務年資。\n第  7  條\n全時進修或研究給予公假，並以一年為限。\n部分辦公時間專業發展，每人每週公假時數最高以八小時為限。但學校或其主管機關基於業務需要，主動薦送、指派者，或一次性之其他專業發展活動，得不受八小時之限制。\n第  8  條\n教師經學校或其主管機關基於業務需要，主動薦送或指派於國內進修或研究者，得給予全額補助。\n教師經服務學校同意，於國內從事與教學或職務有關之進修或研究者，得由服務學校視經費預算，給予半數費用以下之補助。\n前二項補助項目，包括依進修或研究學校主管機關訂定之收費法令所收取之學費、雜費、學分費及學分學雜費。教師應於學期或進修、研究階段結束後，憑成績單及繳費收據申請補助；不及格科目，不予補助。\n公立學校教師於國外進修或研究所需費用，由服務學校依相關法令規定辦理；私立學校教師，得由各校視經費情形酌予補助。\n第  9 條\n教師帶職帶薪全時進修或研究者，其返回原校服務之義務期間(以下簡稱服務義務期間)為帶職帶薪期間之二倍；留職停薪全時進修或研究者，其服務義務期間為留職停薪之相同期間。\n教師履行服務義務期限屆滿前，不得辭聘、介聘或再申請進修或研究。但因教學或業務特殊需要，經教師評審委員會審查通過及學校同意者，不在此限。\n私立學校教師進修或研究後之服務義務，依本辦法之規定。但服務學校與教師另有約定者，從其約定。\n第  10  條\n教師帶職帶薪或留職停薪全時進修或研究，應事先與學校簽訂契約，約定下列事項：\n一、進修或研究起訖年月日。\n二、返回原校之服務義務。\n三、違反本辦法及契約約定應償還費用之條件、核計基準及強制執行。\n四、其他與進修或研究相關之事項。\n第  11  條\n教師進修、研究期限屆滿或屆滿前已依計畫完成進修、研究或因故無法完成者，應立即返回原校服務，不得拖延。\n第  12  條\n教師進修或研究後，未履行服務義務或未獲續聘，除有不可歸責於當事人之事由外，應依進修或研究契約之約定，按未履行服務義務期間比例，償還進修或研究期間所領之薪給及補助。\n第  13  條\n主管機關或學校得考量專業發展之效益，依下列方式對教師予以獎勵：\n一、依教師待遇條例規定改敘薪級。\n二、協助專業發展成果出版、發表或推廣。\n三、專業發展成果經採行後，對教學或學校業務有貢獻，或教師參加與教學或職務有關之競賽獲獎、指導學生參加競賽獲獎者，依法規規定核給獎金、請頒獎章或推薦參加機關(構)或團體舉辦之表揚活動。\n四、對課程設計、教材研發、教學策略、學習評量或學習輔導，積極開發並有具體成效者，補助相關經費或頒給獎狀、獎品。\n五、安排教師於國內、外學校或機構進行參訪交流。\n六、列為高級中等以下學校校長、主任甄選之資績評分條件。\n七、表現優良者，依法令規定予以嘉獎、記功或記大功。\n主管機關及學校得依權責及實際需要，另訂其他獎勵規定。\n第  三  章  高級中等以下學校教師專業發展之規劃及實施方式\n第  14  條\n高級中等以下學校主管機關、高級中等以下學校及師資培育之大學，應積極推動多元之教師專業發展活動，提供教師專業發展之必要支持及協助，並採取下列措施：\n一、高級中等以下學校主管機關：\n(一)整合所屬機關(構)、單位之教師專業發展資源及組織，指定專責機關(單位)依教育政策及地方特色發展需求，規劃及推動教師專業發展活動。\n(二)於轄內提供教師專業發展所需研討空間、教學媒材及設備器材。\n(三)補助教師從事其他專業發展活動所需經費，並對辦理績效優良者，予以獎勵。\n(四)提供教師專業學習社群所需交流或成果發表之網路平臺，並協助舉辦成果發表會。\n二、高級中等以下學校：\n(一)依學校發展特色、學生學習及教師教學需求，規劃學校本位之教師專業發展活動。\n(二)視校內空間、設施及設備情形，提供教師專業發展所需研討空間、教學媒材及設備器材。\n三、師資培育之大學：以高級中等以下學校及其主管機關需求為核心，提供諮詢、輔導及駐點服務，並開設學分班。\n第  15  條\n高級中等以下學校及其主管機關應參考終身學習的教師圖像及中華民國教師專業素養指引，並因應課程改革，規劃及辦理教師增能研習、工作坊。\n第  16  條\n高級中等以下學校主管機關得甄選具專長之高級中等以下學校教師，並經服務學校同意後，協助到校陪伴輔導、帶領社群、領域備課或其他課程與教學諮詢、輔導工作；服務學校應依相關法令，減授教學節數或支給鐘點\n費。\n第  17  條\n高級中等以下學校及其主管機關應就教學年資三年以下之專任教師，訂定及實施初任教師陪伴輔導方案，並提供相關支持措施。\n前項陪伴輔導方案之實施，得由高級中等以下學校主管機關依前條規定甄選之教師為之。\n第  18  條\n高級中等以下學校主管機關得視需要，邀請教師組織參與專業發展活動之規劃及推動。\n教師組織參與前項專業發展活動之規劃及推動，其應辦理事項、權利、義務及其他相關事項，由高級中等以下學校主管機關與教師組織協商定之。\n第  19  條\n高級中等以下學校得視實際需要編列年度預算，鼓勵教師專業發展；教育部及高級中等以下學校主管機關亦得寬列經費予以補助。\n第  20  條\n高級中等以下學校主管機關得視財政狀況，提供教師自行或聯合其他教師申請自主專業成長計畫之經費補助或資源支持。\n前項自主專業成長計畫，期間以一學年為限，包括於國內、外學校或機構從事研究、參訪交流、公開授課、辦理或參與研習、工作坊、專題講座或其他提升教師專業知能之活動。\n第  21  條\n離島及偏遠地區學校教師進修第二專長學分班者，由教育部核實補助交通費及住宿費；高級中等以下學校主管機關得將離島及偏遠地區學校教師進修第二專長情形，列入教師介聘積分採計之項目。\n第  22  條\n高級中等以下學校主管機關得視教師專業發展需要，協助高級中等以下學校訂定教師共同時間，於校內或跨校辦理教師專業發展活動。\n第  23  條\n高級中等以下學校及其主管機關應鼓勵並支持教師組成校內、跨校、跨領域或網路數位之專業學習社群。\n教師得透過教學研究會、年級(段)、領域會議、專業學習社群或其他課程教學相關會議，進行共同備課、公開授課、教學觀察與專業回饋、研發課程與教材及其他提升教師專業知能之活動。\n第  24  條\n高級中等以下學校辦理教師專業發展之成效，應列為學校評鑑之重要項目。\n第  四  章  附則\n第  25  條\n本辦法規定，於下列人員準用之：\n一、各級學校校長。\n二、具教師資格之公立幼兒園園長(主任)、公立幼兒園教師、中華民國一百年十二月三十一日以前已準用本法之私立幼兒園教師。\n第  26  條\n本辦法自發布日施行。","history":"1.85年10月9日教育部台(85)參字第85081105號令訂定發布全文15條。\n\n2.93年11月15日教育部台(93)參字第0930149643A號令修正發布第5、6、12～14條條文；並自93年11月15日生效。\n\n3.101年12月25日臺人(二)字第1010244755C號令修正發布第6條條文。\n\n4.102年11月01日臺教人(三)字第1020154620B號令修正發布第14條條文。\n\n5.中華民國109年6月28日教育部臺教師(三)字第 1090084121B 號令修正發布名稱及全文 26條；並自發布日施行(原名稱：教師進修研究獎勵辦法；新名稱：教師進修研究等專業發展辦法)。"},{"title":"高級中等學校教師進行產業研習或研究實施辦法","content":"第  1  條\n本辦法依技術及職業教育法(以下簡稱本法)第二十六條第一項規定訂定之。\n第  2  條\n本辦法適用對象為技術型高級中等學校、普通型高級中等學校附設專業群科及綜合型高級中等學校專門學程(以下簡稱學校)之專任專業科目或技術科目教師或專業及技術教師(以下簡稱教師)。\n前項所稱專業科目或技術科目，指學校依課程綱要所定部定與校訂專業科目及實習科目。\n第  3  條\n本法第二十六條第一項所定與專業或技術有關之研習或研究，應符合下列形式之一：\n一、教師至合作機構或產業實地服務或研究。\n二、教師參與學校與合作機構或產業共同規劃辦理之深度實務研習。\n前項研習或研究期間，得以連續或累計方式，依下列規定採計：\n一、教師至合作機構或產業實地服務或研究：以教師實際研習服務或研究期間計算。\n二、教師參與學校與合作機構或產業共同規劃辦理之深度實務研習：以教師實際參與研習期間計算。\n前二項合作機構或產業，不包括短期補習班或各級學校。\n第  4  條\n學校為推動教師進行產業研習或研究，應設推動委員會；其任務如下：\n一、訂定教師進行產業研習或研究之作業規定。\n二、排定教師進行產業研習或研究期程。\n三、邀請合作機構、相關職業團體或產業，共同規劃及辦理研習或研究。\n四、督導學校與合作機構或產業契約書及學校與教師契約書之簽訂及執行。\n五、其他教師至合作機構或產業進行研習或研究權益保障相關事項。\n第  5  條\n教師於研習或研究期間，應遵守合作機構或產業之相關規定；其與合作機構或產業發生爭議時，學校主管機關及學校應提供必要之法律協助。\n合作機構或產業得視實際需要與學校及教師簽訂契約書，約定研發保密規定、智慧財產權歸屬及其他有關事項。\n第  6  條\n教師至合作機構或產業進行研習或研究期間，學校得至合作機構或產業訪視，並作成紀錄。教師應於研習、研究結束後三個月內，向學校提交研習或研究報告。\n第  7  條\n學校應依辦理教師進行產業研習或研究之需求，編列預算協助教師進行研習或研究；各學校主管機關得視年度預算編列相關獎勵或補助經費支應之。\n第  8  條\n學校辦理教師進行產業研習或研究，各學校主管機關得納入專業群科評鑑；經評鑑結果辦理績效卓著者，得予獎勵。\n第  9  條\n本辦法自發布日施行。","history":"中華民國105年1月20日教育部臺教授國部字第1040156270B號令訂定發布全文9  條；並自發布日施行。"},{"title":"新北市教師進修研習實施要點","content":"一、新北市政府(以下簡稱本府)為建立新北市(以下簡稱本市)教師終身學習成長機制，整合規劃教師專業發展，提昇教師專業知能，特訂定本要點。\n二、本要點執行機關為本府教育局(以下簡稱本局)。\n三、本要點適用對象為本市市立及私立高級中等以下學校(以下簡稱學校)及幼兒園教師。\n四、本要點之教師進修研習範圍如下：\n(一)符合師資培育法第十九條規定認可之機構或法人所辦理各種教師進      修課程。\n(二)本府所屬各機關學校及幼兒園自辦或聯合辦理之教師進修研究等研習活動。\n(三)各直轄市、縣(市)政府教育局(處)主辦或委託學校及幼兒園辦理之教師進修研習研究等活動。\n(四)其他政府機關或學術、專業研究機構辦理與教學有關之教師進修研究等研習活動，提出具體計畫經本局備查者。\n(五)大專院校、社區大學、其他團體辦理之教師進修研究等研習活動，提出具體計畫經本局備查者。\n五、教師進修研究等研習課程或活動應符合下列類別：\n(一)規模：應為全國性、全市性、跨直轄市或縣(市)性、數校聯合或學校及幼兒園自辦之一者。\n(二)實施方式：講述類、實作技能類及活動類等。\n(三)內容：課程與教學、班級經營與輔導、進修研究與發展、敬業態度與精神、經營與領導、新興議題與特色、實用智能與生活等。\n(四)型態：學校及幼兒園本位進修研習及教師自主進修研究等研習。\n(五)時間：學期中辦理與寒暑假辦理。\n六、教師進修研習之辦理原則如下：\n(一)教師進修研究等研習時間，應以不影響正常教學實施為原則。\n(二)學校及幼兒園應鼓勵教師進修研究等研習，每校每園每年教師平均研習時數應達五十四小時以上為目標。\n(三)進修研究等研習內容應配合教學所需，以提昇教學專業知能、增進教學效果為主，其他與教學相關之研習活動為輔。\n(四)進修研究等研習辦理單位應落實簽到及簽退，並確實核予研習時數。教師參加研習期間因故須中途離開者，應向進修研究等研習辦理單位請假。遲到與早退者應註明簽到退時間，遲到、早退及請假時間均應扣除研習時數，凡缺席超過單次研習時數三分之一者，不核予研習時數。\n(五)進修研究等研習辦理單位辦理之研習，應做成紀錄、成果及簽到(退)名冊，並應留存三年備查。\n七、教師進修研習之實施方式如下：\n(一)學校及幼兒園應慎選薦派研習之教師，並於研習後與校內或園內教師公開分享。\n(二)學校及幼兒園如需申請非屬本位研習之研習時數，應於研習開設前向本局提報研習計畫，計畫內容應包含研習目的、研習主題、課程內容、實施方式、講師名單、研習日期與時間及預期效益等事項。\n(三)經本局核可之各種進修課程，學校及幼兒園應定期公布相關資訊，由教師依個人需求自行報名參加。學期中教師自行參加各項進修研究等，應檢附該項進修課程資料，並依教師請假規則辦理。但以不影響教學或行政工作為原則。\n(四)寒暑假進修內容以自主為原則，程序採自提計畫，於寒暑假開始一個月前，由教師向教務處提出假期進修研究等(得採個人或學習型組織方式)，教務處應召集教師或教師會代表參與審議，必要時得邀請家長代表參加。\n八、研習登錄及研習時數核發規定如下：\n(一)研習登錄：\n1.研習系統分為本市校務行政系統、全國教師在職進修資訊網及教育部特殊教育通報網。\n2.學校及幼兒園於系統上登錄之研習課程，應依各教育主管機關核定辦理之核定文號開設，並上傳公文經審核單位審核同意後始得開課。\n(二)研習時數核發：\n1.經由研習系統開課之研習時數，於研習結束後，由開設研習辦理單位依參加人員出席情形覈實核予研習時數。\n2.參與非本市辦理之研習，應有本局核定之文號，或經其他教育主管機關核備，並由開設研習辦理單位核予研習時數。\n3.參與學校、幼兒園觀摩教學、學習領域課程小組會議、學習社群及教師共同備課等本位研習，應檢附相關資料(如觀課紀錄表、備課與議課資料、會議資料及簽到表等書面或影音佐證資料)，由學校及幼兒園依教師進修研究獎勵辦法及本要點規定，核予研習時數。\n九、研習時數採計及審核原則如下：\n(一)全國性及跨直轄市或縣(市)性研習時數之核給，依全國教師在職進修資訊網進修研習活動使用管理規定辦理。\n(二)本市學校及幼兒園辦理之研習，以實際講述、活動、授課時間核給，一天不超過七小時為原則，每星期時數採計以三十五小時為原則，超過時數者，由本局專案核准。\n(三)研習時間不包括參觀活動車程、簽到(退)時間、午休、中場休息及茶敘。\n(四)進修學位、學分班之學分，不予採計研習時數。\n十、本要點規定，於下列人員準用之：\n(一)學校校長及幼兒園園長。\n(二)幼兒園教保員及助理教保員。\n(三)學校及幼兒園代理代課教師、代理教保員、代理助理教保員。\n十一、教師參與進修研究等研習活動之獎勵措施，由本局另訂之。","history":"1.104年1月6日新北市政府新北府教研字第1032437882號令發布全文11點；並自即日生效。"},{"title":"於本市校務行政系統開設教師研習活動相關事宜","content":"一、依據「新北市國民中小學及幼稚園辦理教師進修及研習核章實施要點」(104年1月6日廢止)第3  點第2款略以：各校將研習公文函報本府；本府各局室直接復文各校，該文號即為研習編號，如外縣市或各大專院校辦理者，必須有本府函轉之文號，或經外縣市教育主管機關核備有案者，始得核算研習時數。\n二、請各校於校務行政系統開設研習時，除輸入研習字號外，請務必上傳該研習相關課程計畫(表)及核准開辦之公文電子檔，俾利進行研習課程審查。\n三、各校於全國教師在職進修資訊網開設之進修研習活動，請確實依「全國教師 在職進修資訊網進修研習活動使用管理規定」辦理。\n四、學校本位進修請依教師實際參與情形核發研習時數，研習時數登錄請依本市「教師進修研習系統」作業程序辦理，研習字號即為當學期本局統一核發學校本位研習文號，課程代碼依研習內容核給。非校內研習之進修課程，勿以學校本位研習文號開課。\n五、學校本位進修研習相關行事曆、簽到冊正本與成果資料請留校備查。","history":"1.103年1月27日北教研字第1030141876號。\n\n2.103年7月2日北教研字第1031207190號。"},{"title":"有關本市校務行政系統之教師研習系統補登功能移除一案","content":"一、依據教育部103年4月25日臺教師(三)字第1030056340號函辦理。\n二、依「全國教師在職進修資訊網進修研習活動使用管理規定」第12條第1項，登錄於縣市教師研習系統之研習課程，不得重複登錄於全國教師在職進修資訊網(以下簡稱全教網)；另依全教網操作規定，教師研習時數補登作業，原   則由開設研習之主辦單位進行補登，合先敘明。\n三、為避免發生研習資料重複補登情事，並保障教師研習時數之完整性與正確性，本局將自103年5月16日起移除本市校務行政系統之教師研習系統補登功能。","history":"103年5月9日北教研字第1030773739號。"},{"title":"新北市立中小學教師假期進修及課程準備實施要點","content":"一、依教師進修及獎勵辦法，訂定本要點。\n二、實施目的：\n(一)發展教育人員終身學習風氣。\n(二)提昇教師教學準備之效能。\n三、實施對象：新北市(以下簡稱本市)公立高級中等以下學校教師。\n四、實施內容：\n(一)假期進修：指教師提出假期進修計畫經學校審議，而於假期中從事之進修活動。\n(二)課程準備：指教師利用假期中到校，對下一學期進行課程設計、班級經營規劃、教具教案之準備等。\n五、實施方式：\n(一)假期進修：\n1.程序採自提計畫，內容則以自主為原則，每學年寒暑假期進修總時數不低於十五小時。\n2.寒暑假開始一個月前由教師向教務處提出假期進修計畫(可採個人或學習型組織方式)，教務處應召集教師或教師會代表參與審議，必要時並得邀請家長代表參加。\n(1)假期進修之實施，旨在提醒及鼓勵教師預作 規劃，運用假期從事進修。\n(2)如教師進行非學位、非學分班之研習，另可依新北市國民中小學及幼稚園辦理教師進修及研習核章實施要點取得進修時數。\n3.進修內容可配合教學所需，或配合科技整合，亦可涵蓋第二專長生涯學習，以提昇教師專業，重享知識喜悅為依歸。其形式包括至大學或進修機構定期性進修、參加各類文教團體所舉辦之講座與活動，教師自組成長團體、教育有關之專書研讀、課程相關之參觀活動，觀賞教育相關影片、參加教育行政單位主辦或委辦之研習等。\n4.各校行政單位應視教師進修計畫之需求給予適當支援，教師會亦可以給予協助。\n5.新北市(以下簡稱本市)國教輔導團應與市教師會積極蒐集進修資訊，研發教師進修個人檔案之登錄，以充實教師進修資源並便利進修之採認。\n(二)課程準備：\n1.各校應於每學期結束一個月前訂定校內或校際之寒暑假課程準備計畫，並公告於各校網頁。\n2.時數以寒假不得低於七小時為原則，暑假不得低於二十一小時為原則，確切時數由各校校務會議決定，利用寒暑假開始或結束前為之，並可分段實施，教師應準時參與。\n3.內容可包含課程設計、班級經營規劃、教具教案準備等，計畫內容應兼顧教師(含兼行政)之職務分配及工作特性。\n4.地點以校園為原則，各處室應配合服務，對教師在器材、場地、材料等需求儘量予以供應，家長如願參與研討應予協助。\n5.採全校集中或分散或與他校聯合由各校決定。\n6.教師之年資較淺者可酌增時數，唯以不超過該校一般教師時數之一倍為限。\n六、獎勵措施：由本府教育局與本市教師會、家長協會、校長協會合組評選小組，每年辦理評選一次，由各校自行決定參加與否，評選優良者給予獎勵及公開表揚。","history":"100年11月9日北府教秘字第1001458364號令訂定發布全文6點；並即日起生效。"},{"title":"新北市政府教育局所屬各級公立學校及幼稚園教師在職進修學位實施要點","content":"一、依據：教師進修研究獎勵辦法第6條第1項。\n二、本市所屬各級公立學校及幼稚園教師申請在職進修，除其它法令另有規定外，依本要點規定辦理。\n三、本要點所稱「本市所屬各級公立學校及幼稚園教師」(以下簡稱教師)，係指現任本市所屬高級中學暨國民中小學、鶯歌高職、公立幼稚園編制內按月支給待遇並依法取得合格教師資格之教師。\n四、教師申請進修研究以在學校服務滿一年以上者為限，其「服務滿一年」之計算，除服兵役年資不予採計外，以擔任合格教師之學期起算至報考時之該學期結束止。但新進教師已在原服務學校申請進修核准者，不在此限。\n五、進修條件：\n(一)師範院校及教育院系公費畢業生，於其服務義務期限內不得參加全時進修；師資培育法公布後考入師範院校及教育院系之公費畢業生，於其服務義務期限滿一年後得以賠償公費方式參加留職停薪進修。\n(二)各校教師申請部分辦公時間在職進修學位，須不影響教學及行政業務，其參加進修名額，含每學年度新增進修名額，以不超過編制教師員額十分之一為限。\n各校教師申請在職進修排序原則，應依序審酌下列事項，自行訂立標準，經校務會議決議通過後實施：\n1.學校發展需要。\n2.進修項目與教學專長或業務之符合程度。\n3.人員調配狀況。\n4.在本校服務年資。\n5.其他(依各校特性訂定之事項)。\n(三)同一學校中教師進修人數受名額限制時，以進修學士、碩士、博士為先後之順序；同一學位(程)，並以一次為限。\n(四)申請公餘進修者，其名額不受第二款之限制。\n(五)教師於寒假、暑假、夜間、週末時段進修，係屬公餘時間進修。教師兼行政職務參加寒暑假期間進修，係屬部分辦公時間進修。\n六、進修程序：\n(一)各校教師參加部分辦公時間進修，須取得服務學校同意，各校應將同意書及報考證明文件、錄取通知書、聘書等相關證件，自行造冊列管。\n(二)教師參加留職停薪進修，由服務學校依「教師進修研究獎勵辦法」第四條第二項規定自行核定。\n(三)教師參加留職停薪進修前，應先與服務學校簽訂契約書，約定進修、研究起迄年月日、服務義務、違反規定應償還費用之條件、核計基準及強制執行等事項。\n(四)教師申請公餘時間進修者，由各校自行核定。\n七、教師未經同意自行前往進修者，不得申請公假，並視情節輕重依相關法令規定予以議處，學校知情放行者，查處有關行政人員責任。\n八、進修期限\n(一)部分辦公時間進修者，每週核予公假8小時(每次請公假須半日或全日為準)，惟學校教學或業務應自行調整，期限最高不得超過各進修學校法定最高修業年限。進修人員除核給公假外，不得再另行請事假進修。\n(二)留職停薪進修者，以學年度為基準，並以2年為原則，如須延長，須經服務學校同意，必要時得延長1年。教師留職停薪前往國外進修，應經學校或主管教育行政機關核准，進修期限以2年為原則，必要時得延長1年。但為取得學位需要者，得再延長1年。以上均須配合學期辦理。\n(三)留職停薪進修者，應於進修期滿或完成進修或因故無法完成進修前20日內，檢附就讀學校或指導教授證明文件，向服務學校提出申請復職，逾期經學校通知仍不申請者，依聘約暨相關法令規定處理。\n(四)教師於進修期間，原申請進修方式得由個人視實際需要，經服務學校同意，以學期為單位，核准變更進修方式 ，但以1次為限。\n九、進修人員義務：\n(一)教師參加在職進修者，除留職停薪進修外，寒暑假期間，服務學校如有教學及行政需要，應依規定返校處理。\n(二)留職停薪進修、研究者，其服務義務期間為留職停薪相同時間。教師履行服務義務期限屆滿前，不得辭聘、調任或再申請進修、研究。但因教學或業務特殊需要，應經教師評審委員會審查通過及學校同意。另再申請進修者，應於契約書中載明將來取得學位後履行前後進修學位累計應服務之義務。\n十、教師申請在職進修學位，服務學校應依「教師進修研究獎勵辦法」及本要點之規定，依報考校院別敘明報考教師之登記科目及報考系所確實審核，自行造冊列管。\n十一、本要點自99年12月25日生效。","history":"100年1月28日北教人字第1000075588號。"},{"title":"有關教師育嬰留職停薪期間得否從事進修活動一案","content":"一、依教育部100年5月3日臺人(二)字第1000906491號函規定辦理。\n二、查教師進修研究獎勵辦法第3條規定：「本辦法所稱進修、研究，係指教師在國內、外學校或機構，修讀與職務有關之學分、學位或從事與職務有關之研習、專題研究等活動。」，是以，教師進修種類包含修讀與職務有關之學分、學位及研習等，爰教育部旨揭函釋說明二(一)所敘「原已依教師進修研究獎勵辦法規定奉准進修，嗣後辦理育嬰留職停薪者，准予進修至結業為止」之後段「准予進修至結業為止」，修正為「進修學位者准予進修至畢業為止」及「進修學分及其他非學位學分者，准予進修至課程結束為止」。\n三、另依上開旨揭函示略以，惟98年6月6日以後(含)奉准進修者，僅准予進修至當學期為止，復職後始得繼續從事進修活動，併予敘明。","history":"1.98年6月11日北教人字第0980457516號。\n\n2.100年5月5日北教人字第1000449792號。"},{"title":"教師於研究所進修留職停薪期間是否得以至他校兼課一案","content":"一、查本部98年6月6日台人(二)字第0980086244號函略以：「…銓敘部95年11月24日部銓四字第0952726567號書函略以：『…查公務人員留職停薪辦法第4條第2項規定…經核准進修人員，如仍屬公務人員任用法施行細則第2條所稱之現職人員，自得經由各機關考量業務狀況後，依權則核准其辦理侍親留職停薪；惟如申請侍親留職停薪經核准者，於留職停薪期間從事進修或其他與留職停薪原因不符之情事，則為法所不許。』據上，公務人員留職停薪期間不得從事進修或其他與留職停薪原因不符之情事，教育人員亦比照辦理。…」\n二、本案仍請依上開規定辦理。","history":"98年11月20日教育部台人(二)字第0980197880號。"},{"title":"有關教師經核給延長病假、公假休養或療治期間，可否自行參加進修或研習一案。","content":"一、依教育部98年6月11日台人(二)字第0980098345號函辦理。\n二、依上開函釋，教師核給延長病假或公假係因疾病或因執行職務或上下班途中發生危險以致傷病，「必須治療或休養」或「必須休養或療治」，如已能參加進修或研習，是否符合延長病假或公假之要件，不無疑義，宜請權責機關或學校重新認定。","history":"98年6月17日北教人字第0980473550號。"},{"title":"本市所屬各級學校新進教師在不影響教學及行政業務前提下，得利用公餘時間進修，不受「在服務學校滿1年以上」之規定限制。","content":"一、復貴校103年7月10日新北碇中人字1037175839號函。\n二、查新北市政府教育局所屬各級公立學校及幼稚園教師在職進修學位實施要點第4點規定：「教師申請進修研究以在學校服務滿一年以上者為限，其『服務滿一年』之計算，除服兵役年資不予採計外，以擔任合格教師之學期起算至報考時之該學期結束止。但新進教師已在原服務學校申請進修核准者，不在此限。」\n三、有關新進教師在擔任本市正式教師前，業已前往各大專院校進修碩、博士學位，或考上大專院校欲前往進修碩、博士學位，經甄試錄取或介聘為本市正式教師者，基於鼓勵教師進修之目的，在不影響教學及行政業務前提下，得利用公餘時間進修，不受前揭實施要點第4點「在服務學校滿1年以上」之限制規定。","history":"中華民國103年7月14日北教人字第1031285765號函。"},{"title":"教師請假規則","content":"第  1  條\n本規則依教師法第三十五條第二項規定訂定之。\n第  2  條\n本規則於公立及已立案之私立學校編制內，按月支給待遇，並依法取得教師資格之專任教師適用之。\n第  3  條\n教師之請假，依下列規定：\n一、因事得請事假，每學年准給七日。其家庭成員預防接種、發生嚴重之疾病或其他重大事故須親自照顧時，得請家庭照顧假，每學年准給七日；為調適身心需要，得請身心調適假，每學年准給三日。請家庭照顧假及身心調適假之日數，均併入事假計算。事假、家庭照顧假及身心調適假合計超過七日者，應按日扣除薪給，其所遺課務代理費用應由學校支付。\n二、因疾病或經醫師診斷需安胎休養者，其治療或休養期間，得請病假，每學年准給二十八日；其超過規定日數者，以事假抵銷，並依下列規定辦理：\n(一)女性教師因生理日致工作有困難者，每月得請生理假一日，全學年請假日數未逾三日，不併入病假計算，其餘日數併入病假計算。\n(二)患重病非短時間所能治癒或因安胎經醫師診斷確有需要請假休養者，於依規定核給之病假、事假及休假均請畢後，經學校核准得延長之；其延長期間自第一次請延長病假之首日起算，二年內合併計算不得超過一年，但銷假上班一年以上者，其延長病假得重行起算。\n三、因結婚者，給婚假十四日，應自結婚登記之日前十日起三個月內請畢。但因特殊事由經學校核准者，得於一年內請畢。\n四、因懷孕者，於分娩前，給產前假八日，得分次申請，不得保留至分娩後；於分娩後，給娩假四十二日；懷孕滿二十週以上流產者，給流產假四十二日；懷孕十二週以上未滿二十週流產者，給流產假二十一日；懷孕未滿十二週流產者，給流產假十四日。娩假及流產假應一次請畢，且不得扣除寒暑假之日數。分娩前已請畢產前假者，必要時得於分娩前先申請部分娩假，並以二十一日為限，不限一次請畢。流產者，其流產假應扣除先請之娩假日數。\n五、因陪伴配偶懷孕產前檢查、分娩或懷孕滿二十週以上流產者，給陪產檢及陪產假七日，得分次申請。陪產檢之請假，應於配偶懷孕期間為之；陪產之請假，應於配偶分娩日或流產日前後合計十五日(包括例假日)內為之。\n六、因父母、配偶死亡者，給喪假十五日；繼父母、配偶之父母、子女死亡者，給喪假十日；曾祖父母、祖父母、配偶之祖父母、配偶之繼父母、兄弟姐妹死亡者，給喪假五日。除繼父母、配偶之繼父母，以教師或其配偶於成年前受該繼父母扶養或於該繼父母死亡前仍與共居者為限外，其餘喪假應以原因發生時所存在之天然血親或擬制血親為限。喪假得分次申請，並應於死亡之日起百日內請畢。\n七、因捐贈骨髓或器官者，視實際需要給假。\n前項第一款所定准給事假日數，於學年度開始一個月以後到職、再任或復職者，按到職、再任或復職當月至學年度終之在職月數占全學年度比例計算之，尾數未滿半日者，以半日計；超過半日未滿一日者，以一日計。\n第一項所定事假、家庭照顧假、身心調適假、病假、婚假、生理假、產前假、陪產檢及陪產假及喪假得以時計。分娩前先申請部分娩假，每次請假應至少半日。\n具原住民族身分之教師，於依紀念日及節日實施辦法由原住民族委員會所公告之各該原住民族歲時祭儀放假日，得申請放假。\n教師依第一項規定申請家庭照顧假、身心調適假、生理假、產前假、娩假、流產假、陪產檢及陪產假，以及因安胎事由申請其他假別之假時，服務學校不得拒絕，且不得為其他不利之處分。\n第  4  條\n教師有下列各款情事之一者，給予公假。其期間由學校視實際需要定之：\n一、奉派參加政府召集之集會。\n二、奉派考察或參加國際會議。\n三、依法受各種兵役召集。\n四、參加政府依法主辦之各項投票。\n五、依主管機關所定獎勵優秀教師之規定給假。\n六、因執行職務或上下班途中發生危險以致傷病，必須休養或療治，其期間在二年以內。\n七、參加政府舉辦與職務有關之考試，經學校同意。\n八、參加本校舉辦之活動，經學校同意。\n九、應國內外機關團體或學校邀請，參加與其職務有關之各項會議或活動，或基於法定義務出席作證、答辯，經學校同意。\n十、教師從事進修、研究等專業發展，其公假依教師進修研究等專業發展辦法規定辦理；兼任行政職務教師寒暑假期間從事進修、研究等專業發展之公假時數，得不受每週八小時之限制。\n十一、寒暑假期間，於不影響教學及行政工作原則下，事先擬具出國計畫，經服務學校核准赴國外學校或機構自費參加與其職務有關之進修、研究。\n十二、因校際間教學需要，經服務學校同意至支援學校兼課。\n十三、專科以上學校因產學合作需要，經學校同意至相關合作事業機構兼職或合作服務。\n十四、因法定傳染病，須依法親自配合各級衛生主管機關施行之檢查、隔離治療或其他防疫、檢疫措施。但因可歸責於當事人事由而罹病者，不在此限。\n十五、依其他法規規定給假。\n教師基於法定義務出席作證性侵害、性騷擾、性霸凌、違反與性或性別有關之專業倫理及霸凌事件，應給予公假。\n第  5  條\n教師請延長病假或因公傷病請公假已滿規定期限仍不能銷假者，應予留職停薪或依法辦理退休或資遣。\n前項教師自留職停薪之日起已逾一年仍未痊癒，應依法辦理退休或資遣。\n但留職停薪係因執行職務且情況特殊者，得由學校審酌延長之；其延長以一年為限。\n第  6  條\n教師經學校依第三條第一項第二款核准延長病假或依前條同意留職停薪期間聘期屆滿者，學校應予繼續聘任。\n依前條規定留職停薪人員，於留職停薪期間病癒者，得檢具中央衛生主管機關評鑑合格醫院出具之診斷證明書，向原服務學校申請復職。但為辦理退休或資遣者，得免附診斷書隨時向服務學校申請復職，並以復職當日為退休或資遣之生效日。\n第  7  條\n教師請延長病假跨越二學年度者，其假期之計算應扣除各學年度得請事、病假之日數；其兼任行政職務者，並應扣除休假之日數。\n前項教師於延長病假期間銷假上班，開學後再請延長病假時，其延長病假視為未中斷，且不得扣除寒暑假之日數。但開學後即銷假且實際上課已達一學期以上者，寒暑假之日數得予扣除。\n前項所定銷假上班，應取得醫療機構出具之診斷書。但因安胎休養者，不在此限。\n第  8  條\n公立中小學教師兼任行政職務者，應給予休假，其專任教師年資得併計核給，服務年資滿一學年者，自第二學年起，每學年應給休假七日；服務滿三學年者，自第四學年起，每學年應給休假十四日；滿六學年者，自第七學年起，每學年應給休假二十一日；滿九學年者，自第十學年起，每學年應給休假二十八日；滿十四學年者，自第十五學年起，每學年應給休假三十日。\n初任教師於學年度開始一個月以後到職，並奉派兼任行政職務者，於次學年續兼時，得按到職當學年在職月數比例核給休假。第三學年以後續兼者，依前項規定給假。\n除初任教師外，於學年度中兼任行政職務未滿一學年者，當學年之休假日數依第一項規定按實際兼任行政職務月數占全學年比例計算核給，其尾數之計算依第三條第二項規定；年資未滿一學年者，以七日按上開比例計算之。\n教師兼任行政職務當學年度未具休假三日資格者，應給休假三日。但屬第九條第二項前段人員，不適用之。\n私立學校及公立專科以上學校兼任行政職務教師之休假，由各校自行定之。\n第  9  條\n教師因介聘轉任或因退休、資遣、辭聘再任其他學校教師年資銜接者，其兼任行政職務時之休假年資得前後併計。\n因辭聘、退休、資遣、不續聘、停聘、解聘、撤職、休職或受免職懲處後，再任或復聘年資未銜接者，依前條第二項規定核給休假；留職停薪教師復職後於學年度中兼任行政職務者，依前條第三項規定給假，次學年度續兼者，依前條第一項規定給假。\n退伍前後任教職者，其軍職年資之併計，依前二項規定。\n第  10  條\n兼任行政職務之教師，其休假應於寒暑假期間實施為原則。但在不影響教學及校務推展情形下，各校得於學期期間視實際需要核給休假。\n第  11  條\n教師符合第八條休假規定者，每學年至少應休畢規定之日數；未達應休畢規定之日數資格者，應全部休畢；休假得以時計。休假並得酌予發給補助。\n前項應休假日數以外之休假，確因公務或業務需要經學校核准無法休假時，酌予獎勵，不予保留。\n前二項應休畢規定之日數、補助或未休假獎勵之基準，由中央主管機關定之。私立學校及公立專科以上學校得比照上開基準另定規定。\n第  12  條\n公立中小學未兼任行政職務教師於學生寒暑假期間，除返校服務、進修研究等專業發展活動及配合災害防救所需之日外，得不必到校。\n前項返校服務、進修研究等專業發展活動事項及日數之實施原則，由中央主管機關邀請全國教師會代表參與訂定，並由各級主管機關邀請同級教師會協商後訂定執行規定；無地方教師會之直轄市、縣(市)，由主管機關自行或授權學校訂定。\n前二項返校服務、進修研究等專業發展活動之實施，教師無法配合參與時，應依規定辦理請假手續。\n第  13  條\n教師請假應填具假單，經學校核准後，始得離開。但有急病或緊急事故，得由其同事或親友代辦或補辦請假手續。\n因疾病申請延長病假或因公傷病之公假七日以上，應檢具中央衛生主管機關評鑑合格醫院出具之診斷證明書；未達七日者，或因安胎事由申請延長病假，應檢具合法醫療機構證明書。於銷假時，亦同。\n因陪產請陪產檢及陪產假、請娩假、流產假、二日以上之病假及骨髓捐贈或器官捐贈假，應檢具合法醫療機構證明書或其他證明文件。因安胎事由申請二日以上之假，除延長病假依前項規定辦理外，亦同。但於分娩前先請之娩假，不在此限。\n具原住民族身分之教師依第三條第四項規定放假，應檢具證明其族別之戶籍資料證明文件，向服務學校申請。\n第  14  條\n教師請假，其課(職)務應委託適當人員代理；教師無法覓得合適代理人時，學校應協調派員代理。但具原住民族身分之教師，因各該原住民族歲時祭儀放假，所遺課(職)務由學校派員代理。\n前項所遺課務之調課補課代課，得由各級主管機關協助，並與同級教師會協商訂定相關規定；無地方教師會之直轄市、縣(市)，由主管機關自行訂定。\n兼任行政職務之教師請假期間，其行政職務應由學校預為排定現職人員代理順序。\n第  15  條\n教師未依第十三條第一項規定請假而擅離職守或假期已滿仍未銷假，或請假有虛偽情事者，均以曠職論；無故缺課者，以曠課論。曠職或曠課者，應扣除其曠職或曠課日數之薪給。\n第  16  條\n本規則所規定假期之核給，扣除例假日。但請延長病假或因公傷病請公假者，例假日均不予扣除。按時請假者，以規定之出勤時間為準。\n第  17  條\n本規則於下列人員準用之：\n一、各級公立學校校長。\n二、各級學校依法聘任之編制內專任人員。\n三、教育部依法定資格派任之高級中等以上學校護理教師。\n前項第一款人員請假之程序，由各級主管機關定之。\n第  18  條\n各級私立學校教師之請假，除第三條家庭照顧假、身心調適假、經醫師診斷需安胎休養者，其治療或休養期間之病假、生理假、婚假、娩假、流產假、產前假、陪產檢及陪產假、原住民族歲時祭儀放假及第四條第一項第一款至第四款、第七款至第九款及第二項公假假別及日數之規定外，得由各校自行定之。\n前項教師請婚假、娩假、流產假、產前假、陪產檢及陪產假，及原住民族歲時祭儀放假期間，應由學校支應代課鐘點費，且不得扣薪。\n第  19  條\n本規則除第八條及第九條自中華民國一百十四年八月一日施行外，自一百十四年十月十日施行。","history":"1.中華民國111年6月15日臺教人(三)字第1114200873A號令修正發布第3條、第13條、第18條條文。\n\n2.中華民國114年10月8日教育部臺教人（三）字第1144203364A號令修正。"},{"title":"學校職員於辦公時間內在服務學校兼課，與在外兼課相同，依規定應辦理請假手續，並得支領鐘點費，且每週併計不得超過四小時。","content":"","history":"84年10月19日八四北府人三字第374039號(縣公報84冬字8期)。"},{"title":"本縣縣立高級中等以下學校教師請病假連續3日以上，並依教育部教師請假規則之規定，檢具醫療機構或專科醫師證明書者，得由學校覓合格人員代課，並核支代課鐘點費。","content":"一、依據教育部95年5月8日發布之「教師請假規則」第14條第2項規定辦理。\n二、為保障教師權益，本規定溯自96年9月1日生效。\n三、有關「醫療機構」相關規定，請依教育部95年7月12日台人(二)字第0950091878號函辦理。","history":"96年10月18日北教國字第0960594799號。"},{"title":"重申本市立高級中等以下學校教師請病假連續3日以上者，所檢之醫療機構或專科醫師證明書之認定一案","content":"一、本局96年10月18日北教國字第0960594799號函諒達。\n二、邇來，部分學校反映教師倘請病假連續3日以上者其醫療機構與專科醫師證明書認定上有所差異，為免影響教師權益，本縣縣立高級中等以下學校教師請病假連續3日以上者，所檢具之醫療機構或專科醫師證明書，審酌個案情形並考量本縣偏遠地區之差異性與適用規範之一致性，重申其醫療機構或專科醫師證明書尚不以公立醫院機構、全民健保特約醫院及中央健康保險局聯合門診中心出具之診斷證明書機構為限，以符實際需要與方便教師就診。\n三、本規定溯自96年9月1日生效。","history":"98年6月17日北教國字第0980380705號。"},{"title":"本市國民中小學校長於延長病假其期間，經本局核定職務由主任代理者，為考量主任兼代校長期間有充裕時間處理校務，代理期間其原有課務，得依中小學兼任代課及代理教師聘任辦法規定聘任代理教師協助。","content":"","history":"96年12月4日北教國字第0960758731號。"},{"title":"新北市政府及所屬各機關學校教職員工出差加班應行注意事項","content":"一、新北市政府(以下簡稱本府)為規範所屬各機關學校(以下簡稱各機關)教職員工(以下簡稱各機關員工)之出差、法定辦公時數以外執行職務(以下簡稱加班)，並使差勤管理有所遵循、保持彈性及提高行政效能，特訂定本注意事項。各機關學校對於所屬教職員工出差、加班之派遣，應依分層負責規定切實嚴格審核，不得浮濫。\n二、各機關員工出差、加班之派遣，應依分層負責規定切實嚴格審核，不得浮濫。\n三、各機關派遣出差人員，應以需派員前往實地洽辦者為限，可用電話傳真、電子郵件或文書等聯繫解決者，不得派員出差。\n各機關員工申請出差應填寫出差請示單，並附具相關文件，詳敘具體事由、出差地點，並註明出差日(時)數，事先陳經核准後始得辦理，除天災或其他不可歸責之事由延後完成工作等情形外，應於核准之期程內往返。\n四、加班費支給要件，以各機關員工於法定辦公時數以外經覈實指派執行職務者為限，且免刷卡員工加班者，其加班起迄時間應有刷卡、簽到或其他可資證明之紀錄。\n加班費以每小時為單位，每小時支給基準如下：\n(一)公務人員：非主管按月支薪俸、專業加給二項之總和，主管及簡任(派)非主管人員比照主管職務核給職務加給者，另加主管職務加給或比照主管職務核給之職務加給三項之總和，除以二四○。\n(二)技工、工友：按月支工餉、專業加給及報院核定有案之每月固定經常性工作給與之總和，除以二四○。\n(三)約聘僱人員及非編制人員：按月支單一薪酬除以二四○。\n待命時數之加班費，每小時支給評價換算基準依前項基準之百分之百發給。但警察人員及消防人員待命時數之加班費支給基準，另依內政部所訂加班費評價換算基準。\n五、各機關員工之加班，應視業務需要覈實指派，並於事前詳填加班請示單，詳述加班事由。\n每人上班日之加班時數連同法定辦公時數不得超過十二小時，放假日及例假日不得超過八小時，每月不得超過二十小時。\n六、各機關員工因辦理特定業務或遇特殊情形，需較長時間加班，得申請專案加班，相關核定權責如下：\n(一)每人每日(含放假日及例假日)加班時數連同法定辦公時數不超過十二小時，且全月合計加班總時數於二十小時以內者，授權由各機關核定。\n(二)每人每日(含放假日及例假日)加班時數連同法定辦公時數超過十二小時且不超過十四小時者，或全月合計加班總時數超過二十小時且不超過六十小時者，授權由本府各一級機關及各區公所自行核定，其所屬機關學校應層報各該一級機關核定。\n(三)每人每日(含放假日及例假日)加班時數連同法定辦公時數超過十四小時者，或全月合計加班總時數超過六十小時者，專簽報府同意。\n前項第三款之公務員專案加班應依行政院與所屬中央及地方各機關(構)公務員服勤實施辦法第四條所定態樣詳細敘明理由、期限及適用人員等，並符合該辦法之申請程序，本府各二級機關及學校專簽須經由一級機關層轉，報府同意。\n七、各機關輪班輪休人員每日加班時數連同法定辦公時數超過十二小時，或全月合計加班總時數超過八十小時，須依第六點規定申請專案加班。但實施輪班輪休之警察、消防及醫療人員依其相關規定本撙節原則辦理。\n各機關輪班輪休人員之加班費，每小時支給評價換算基準依本注意事項第四點第二項之支給基準百分之百發給。但警察人員及消防人員超勤加班費支給基準，另依內政部所訂加班費評價換算基準。\n八、各機關員工加班應儘量以補休為原則，核給之補休假應依加班之時數計算補休時數。補休假以小時為單位，不另支給加班費，並應於加班後二年內補休完畢。\n各機關因預算之限制或必要範圍內之業務需要，致無法給予員工加班費、補休假，除因離職或已亡故者，仍按加班時之加班費支給基準及換算基準計發加班費外，應依所適用之規定給予平時考核之獎勵。\n前項之獎勵原則，各一級機關及區公所得視其業務性質及工作程度不同等情形定之。\n各機關員工當月加班時數無論申請補休或支領加班費，其時數總和仍不得超過第五點或第六點有關加班時數上限之規定。\n適用勞動基準法(以下簡稱勞基法)之非編制人員加班後依意願選擇補休，並經服務機關同意後，以特別休假所定週年制之末日，為補休期限之末日，且補休期限屆期或契約終止未補休之時數，仍應發給工資。\n九、各機關加班費之支給，應有差勤紀錄或其他可資證明之紀錄，不得浮濫，如有虛報情事，經查明屬實，應嚴予議處。\n十、各機關得隨時指派專人查核其所屬單位員工出差、加班情形或派員前往實地查證，如發現有冒領出差或加班費等涉及貪瀆之不實情事，除當事人移送法辦並追繳溢領款項外，主管亦受監督不周之處分。\n十一、各機關對加班之管制應依下列事項辦理，以維護員工健康權：\n(一)各機關全年度加班費預算應於每年一月就各單位重點業務或各月份淡旺季等情形進行分配，並保留一定比例由各機關首長彈性運用。\n(二)各機關加班費應視業務消長情形，以移緩濟急方式分配給重點業務單位，不得平均分配，並應就辦理專案或市民迫切需要等特定業務人員核實支給加班費。\n(三)各機關人事單位應定期提供首長各單位加班情形，並得參酌工作量化指標統計分析等資料作為佐證，由首長於必要時據以調整工作分配並給予適時關懷；單位主管亦應定期檢視所屬員工加班情形，關心加班時數較多的同仁，並涉入積極指導或評估調整業務分配，以避免不必要之加班情事。\n(四)各機關員工於加班或輪班後，應依相關規定給予適當之休息。\n各機關於年度中倘因處理重大專案業務、解決突發困難問題或搶救重大災難需要增加加班費額度，應經簽會本府財政局、主計處、研究發展考核委員會及人事處，專案報經本府核准者，始得調整該年度加班費預算額度上限。\n十二、本府各一級機關(含督導所屬機關學校)及各區公所應不定期檢視勤休制度之妥適性，本府將定期抽查並檢討各機關之勤休制度。\n十三、教育人員及適用勞基法人員申請加班或出差，優先依其所適用之規定辦理，無相關規定者，得適用本注意事項。","history":"1.中華民國107年10月15日新北市政府新北府人考字第1071905126 號函修正全文16點；並自107年5月1日生效。\n\n2.中華民國112年7月3日新北市政府新北府人考字第 1121267760號函修正。"},{"title":"有關教師擔任導護值勤工作給以補假一案，請依規定辦理教師擔任導護值勤補休事宜。","content":"一、教師導護工作屬交通安全教育乙環，導護值勤為教師責無旁貸的教育工作，為符「依法行政」原則，查行政院人事行政局八十二年三月二十七日八十二局肆字第09373號函規定略以：「各機關員工不同時段加班未滿一小時或超過一小時之餘數，不得合併計支加班費」惟各校為配合學生到校時間及課務安排，各校於前開每天辦公八小時限度內，自行訂定公到退勤時間，調整導護老師上班時間，以符法令規定。\n二、本縣教師擔任導護值勤工作若排定執行時段已超過教師上班八小時以外，得以行政院八十三年一月三十一日台(八三)人政考字第02486號函規定：「各機關員工一次加班達四小時，或累計加班時數達四小時，得由機關首長視實際業務狀況核酌准以在加班後一個月內補休假，不另支加班費」方式辦理。\n三、為維護國中小學童交通及人身安全，本縣業已撤離校外交通崗哨，不再由學生擔任路口交通值勤工作，教師輪值導護工作給予補假，由校長核准後以加班累計每滿四小時方式，擇期補休半天，惟課務仍需自理，不得另派代課。","history":"91年6月11日北府教社字第0910252492號。"},{"title":"有關本市高中職以下各校教師擔任導護工作補假事宜","content":"一、關於教師擔任導護值勤工作(如總導護、校內導護、交通導護、學年導護等)，如超過平日上班時數,其補假事宜建議各校以「各校以週次排輪值導護者，每值勤1週次折算加班4小時，予以擇期補休半天，若值勤1週次實際超過4小時，予以核實累計補休時数；各校以日排輪值導護者，予以核實累計補休時數。補休應課務自理，不得另派代課」處理。\n二、另教師於1學年内依學校排勤擔任導護工作，依據「公立高級中等以下學校教師成績考核辦法」第6條第2項第3款第10目，每學年由學校自行核敘嘉獎1次。\n三、請各校權衡教師導護勤務輕重參酌辦理並規劃逸當導護值勤辦法，並積極邀請家長、社區人士、民間單位、義交、義警、民防及社區巡守隊等人力資源協同投入導護工作，共同協助維護社區學童上下放學的安全。","history":"113年1月31日新北教社字第1130224956號。"},{"title":"函詢「教師導護執勤工作補假相關事宜」疑義一案","content":"一、有關行政院93年11月4日院授人給字第0930064940號函略以：為落實人事法規鬆綁，加班補休改以時為計算單位之規定，本府經配合修正「臺北縣政府暨所屬各機關學校教職員工出差加班注意事項」第十二點第一項之規定，「加班應僅量以補休假為原則、加班補休得以時計算，並得於加班後6個月內補休假…。」本縣所屬機關學校教職員工加班補休可依前開規定辦理。\n二、另有關加班時數計算之相關規定如下：\n(一)依「臺北縣政府暨所屬各機關學校教職員工出差加班注意事項」第十三點：不同時段加班未滿1小時或超過1小時之餘數，不得合併計支加班費：第十五點：教職員工因業務需要，須於星期例假日或下班後離開辦公場所執行職務時，其為「加班」或「出差」，由首長依相關規定本於權則認定。\n(二)另查本府前以86年5月1日86北府人二字略以「各級學校應依行政院60年7月10日台六十人政參字第21595號令規定，每天辦公8小時。」為配合學生到校時間及課務安排，對於教師擔任導護執勤工作，如超過當日上班時數，可依規定補休，另本縣所屬各級公立學校實施寒暑假彈性上班之行政人員(含兼任行政教師)，請確實依本府93年7月19日北府人二字第0930490773號函規定，實施寒暑假彈性上班，時數為140小時，應於上課日每日提前到勤或延後下班半小時補足(上課日為200日，總計100小時)。\n(三)故，教師擔任交通導護補休事宜，如超過當日上班時數(8小時)，則加班超過1小時(餘數不採計)得依規定以「時」補休。","history":"95年5月3日北府教社字第0950195134號。"}];
let currentIndex=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderList(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const list=document.getElementById('lawList');
 const count=document.getElementById('count');
 const none=document.getElementById('none');
 if(!laws.length){
  count.textContent='待匯入法規';
  none.classList.add('hidden');
  list.innerHTML='<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm leading-relaxed text-slate-500">法規清單將於版型確認後匯入。</div>';
  return;
 }
 list.innerHTML='';
 const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+'\\n'+x.content+'\\n'+x.history).toLowerCase().includes(q));
 count.textContent=`${filtered.length} / ${laws.length} 項`;
 none.classList.toggle('hidden',filtered.length>0);
 filtered.forEach(x=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'active-law':'');
  b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title.replace(/^\\s*\\d+[、.．]?\\s*/,''))}</span>`;
  b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};
  list.appendChild(b);
 });
}
function formatLawText(content, lawIndex){
 let normalized=String(content||'').replace(/\\n/g,'\n').replace(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)\s*\n(?!第\s*[0-9０-９一二三四五六七八九十百]+\s*條)([^\n]+)$/gm,'$1 $2');
 // 第25至27項原始文字含有句中換行；合併續行，保留各款、目之換行。
 if(lawIndex===24 || lawIndex===25 || lawIndex===26){
  normalized=normalized.split('\n').reduce((acc,line)=>{
   const t=line.trim();
   if(!t) return acc;
   const isNewItem=/^(?:[一二三四五六七八九十百]+、|[（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)]|[0-9０-９]+[、.．])/.test(t);
   if(acc.length===0 || isNewItem) acc.push(t);
   else acc[acc.length-1]+=' '+t;
   return acc;
  },[]).join('\n');
 }
 return normalized.split('\n').map(raw=>{
  const t=raw.trim(); if(!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
  const chapter=t.match(/^(第\s*[一二三四五六七八九十百0-9０-９]+\s*章\s*.*)$/);
  if(chapter) return '<div class="doc-chapter" style="display:block;font-size:1.25rem !important;font-weight:800 !important;line-height:2.2 !important;margin:1.25em 0 0.6em !important;">'+esc(t.replace(/\s{2,}/g,' '))+'</div>';
  const article=t.match(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條(?:\s*之\s*[0-9０-９一二三四五六七八九十百]+)?)(.*)$/);
  if(article){
   const heading='<div class="doc-article-heading">'+esc(article[1].replace(/\s+/g,''))+'</div>';
   const inlineText=article[2].trim();
   return heading+(inlineText?'<div class="doc-article-body">'+esc(inlineText)+'</div>':'');
  }
  const levels=[
  {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/,n:0},
  {re:/^([一二三四五六七八九十百]+、)(.*)$/,n:1},
  {re:/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/,n:2}, // 刪除 0-9０-９
  {re:/^([0-9０-９]+[、.．])(.*)$/,n:3},
  {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/,n:4}
];
  for(const level of levels){const m=t.match(level.re);if(m)return '<div class="doc-row doc-level-'+level.n+'"><span class="doc-marker">'+esc(m[1])+'</span><span class="doc-copy">'+esc(m[2].trimStart())+'</span></div>';}
  const indentContinuation=[35,36,38].includes(lawIndex); return '<div class="doc-row doc-paragraph'+(indentContinuation?' law-indent-paragraph':'')+'"'+(indentContinuation?' style="padding-left:2.8em!important;box-sizing:border-box!important"':'')+'><span class="doc-marker"></span><span class="doc-copy">'+esc(t)+'</span></div>';
 }).join('');
}
function renderDetail(){
 const detail=document.getElementById('detail');
 if(!laws.length){
  detail.innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第六類法規版型確認</span><span class="text-xs text-slate-400">版型確認階段</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">法規內容預留區</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc${indentClass} text-sm md:text-[15px]"><div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-5 text-sm leading-relaxed text-slate-500">目前先確認頁面版型。確認後再匯入第六類法規名稱、條文及項次內容。</div></div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">法規沿革預留區；確認版型後再匯入。</div></div>`;
  return;
 }
 const law=laws[currentIndex];
 const content=formatLawText(law.content,currentIndex);
 const hasArticleStructure=/(?:^|\n)\s*第\s*[0-9０-９一二三四五六七八九十百]+\s*條/m.test(law.content||'');
 const hasItemMarkers=/(?:^|\n)\s*(?:[壹貳參肆伍陸柒捌玖拾]+、|[一二三四五六七八九十百]+、|[（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)]|[0-9０-９]+[、.．])/m.test(law.content||'');
 const indentClass=(!hasArticleStructure && hasItemMarkers)?' law06-indent-format':'';
 detail.innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ${currentIndex+1} 項／共 ${laws.length} 項</span><span class="text-xs text-slate-400">教師研習、進修、請假</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">${esc(law.title)}</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc${indentClass} text-sm md:text-[15px]">${content||'<p>原始文件未提供此項資料。</p>'}</div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">${law.history.trim()?esc(law.history):'原始文件未提供此項資料。'}</div></div><div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" ${currentIndex===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" ${currentIndex===laws.length-1?'disabled':''} class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`;
}
function go(d){if(!laws.length)return;currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
document.getElementById('searchInput').addEventListener('input',renderList);renderList();renderDetail();
</script><script id="topic-nav-search-script">
(function(){
 const input=document.getElementById('searchInput');
 if(!input) return;
 const list=document.getElementById('lawList') || document.querySelector('aside');
 if(!list) return;
 const buttons=Array.from(list.querySelectorAll('button[data-law]'));
 if(!buttons.length) return;
 let results=document.getElementById('lawSearchResults');
 if(!results){
   results=document.createElement('div');
   results.id='lawSearchResults';
   results.className='mt-3 max-w-xl rounded-xl bg-white text-slate-800 shadow-lg border border-slate-200 overflow-hidden';
   results.style.display='none';
   input.parentElement.insertAdjacentElement('afterend',results);
 }
 const norm=s=>(s||'').toLocaleLowerCase().replace(/\s+/g,' ').trim();
 function getPanel(btn,index){
   const i=btn.getAttribute('data-law')||String(index);
   const panels=Array.from(document.querySelectorAll('.law-panel'));
   return panels[Number(i)] || null;
 }
 function excerpt(text,q){
   const plain=(text||'').replace(/\s+/g,' ').trim();
   const at=norm(plain).indexOf(norm(q));
   if(at<0) return plain.slice(0,115)+(plain.length>115?'…':'');
   const start=Math.max(0,at-45), end=Math.min(plain.length,at+q.length+75);
   return (start?'…':'')+plain.slice(start,end)+(end<plain.length?'…':'');
 }
 function render(){
   const raw=(input.value||'').trim();
   const q=norm(raw);
   results.replaceChildren();
   if(!q){results.style.display='none';return;}
   const matches=[];
   buttons.forEach((btn,index)=>{
     const panel=getPanel(btn,index);
     const title=(btn.innerText||btn.textContent||'').replace(/\s+/g,' ').trim();
     const body=panel ? (panel.innerText||panel.textContent||'') : title;
     if(norm(title).includes(q)||norm(body).includes(q)) matches.push({btn,title,body,index});
   });
   const heading=document.createElement('div');
   heading.className='px-4 py-2 text-xs font-bold text-slate-500 bg-slate-50 border-b border-slate-100';
   heading.textContent=matches.length?'搜尋結果（'+matches.length+' 項）':'找不到符合的法規';
   results.appendChild(heading);
   if(matches.length){
     matches.slice(0,30).forEach(item=>{
       const a=document.createElement('button');
       a.type='button';
       a.className='block w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-blue-50 focus:bg-blue-50';
       const name=document.createElement('div');name.className='text-sm font-semibold text-blue-700';name.textContent=item.title;
       const desc=document.createElement('div');desc.className='mt-1 text-xs leading-relaxed text-slate-600';desc.textContent=excerpt(item.body,raw);
       a.append(name,desc);
       a.addEventListener('click',()=>{
         item.btn.click();
         results.style.display='none';
         input.blur();
       });
       results.appendChild(a);
     });
     if(matches.length>30){const more=document.createElement('div');more.className='px-4 py-2 text-xs text-slate-500';more.textContent='另有 '+(matches.length-30)+' 項符合，請輸入更完整的關鍵字縮小範圍。';results.appendChild(more);}
   }
   results.style.display='block';
 }
 input.addEventListener('input',render);
 input.addEventListener('focus',render);
 document.addEventListener('click',e=>{if(!results.contains(e.target)&&e.target!==input)results.style.display='none';});
})();
</script>
