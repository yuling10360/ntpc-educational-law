<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3"><a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700 hover:text-blue-600"><i class="fa-solid fa-arrow-left"></i> 返回手冊目錄</a><span class="text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-full border border-blue-200">第六類法規全文查閱</span></div></header>
<section class="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-900 text-white py-8 px-4"><div class="max-w-7xl mx-auto space-y-3"><div class="inline-flex items-center gap-2 text-blue-300 text-xs font-semibold"><i class="fa-solid fa-chalkboard-user"></i> 法規章節</div><h1 class="text-2xl md:text-3xl font-extrabold">六、教師研習、進修、請假</h1><p class="text-xs md:text-sm text-slate-300">本頁版型沿用第四類法規，先供確認版面；確認後再匯入本類法規內容。</p><div class="relative max-w-xl pt-1"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input id="searchInput" type="search" oninput="renderList()" placeholder="搜尋法規名稱、條文或文號" class="w-full pl-11 pr-4 py-3 bg-white text-slate-800 rounded-2xl shadow-lg outline-none text-sm"></div></div></section>

<script>
const laws = [];
let currentIndex=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderList(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const list=document.getElementById('lawList');
 const count=document.getElementById('count');
 const none=document.getElementById('none');
 if(!laws.length){
  count.textContent='待匯入法規';
  none.classList.add('hidden');
  list.innerHTML='<div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm leading-relaxed text-slate-500">法規清單將於版型確認後匯入。</div>';
  return;
 }
 const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+'\\n'+x.content+'\\n'+x.history).toLowerCase().includes(q));
 count.textContent=`${filtered.length} / ${laws.length} 項`;
 none.classList.toggle('hidden',filtered.length>0);
 filtered.forEach(x=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'active-law':'');
  b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title.replace(/^\\s*\\d+[、.．]?\\s*/,''))}</span>`;
  b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};
  list.appendChild(b);
 });
}
function formatLawText(content, lawIndex){
 let normalized=String(content||'').replace(/\\n/g,'\n').replace(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)\s*\n(?!第\s*[0-9０-９一二三四五六七八九十百]+\s*條)([^\n]+)$/gm,'$1 $2');
 // 第25至27項原始文字含有句中換行；合併續行，保留各款、目之換行。
 if(lawIndex===24 || lawIndex===25 || lawIndex===26){
  normalized=normalized.split('\n').reduce((acc,line)=>{
   const t=line.trim();
   if(!t) return acc;
   const isNewItem=/^(?:[一二三四五六七八九十百]+、|[（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)]|[0-9０-９]+[、.．])/.test(t);
   if(acc.length===0 || isNewItem) acc.push(t);
   else acc[acc.length-1]+=' '+t;
   return acc;
  },[]).join('\n');
 }
 return normalized.split('\n').map(raw=>{
  const t=raw.trim(); if(!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
  const chapter=t.match(/^(第\s*[一二三四五六七八九十百0-9０-９]+\s*章\s*.*)$/);
  if(chapter) return '<div class="doc-chapter" style="display:block;font-size:1.25rem !important;font-weight:800 !important;line-height:2.2 !important;margin:1.25em 0 0.6em !important;">'+esc(t.replace(/\s{2,}/g,' '))+'</div>';
  const article=t.match(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)(.*)$/);
  if(article){
   const heading='<div class="doc-article-heading">'+esc(article[1].replace(/\s+/g,''))+'</div>';
   const inlineText=article[2].trim();
   return heading+(inlineText?'<div class="doc-article-body">'+esc(inlineText)+'</div>':'');
  }
  const levels=[
  {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/,n:0},
  {re:/^([一二三四五六七八九十百]+、)(.*)$/,n:1},
  {re:/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/,n:2}, // 刪除 0-9０-９
  {re:/^([0-9０-９]+[、.．])(.*)$/,n:3},
  {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/,n:4}
];
  for(const level of levels){const m=t.match(level.re);if(m)return '<div class="doc-row doc-level-'+level.n+'"><span class="doc-marker">'+esc(m[1])+'</span><span class="doc-copy">'+esc(m[2].trimStart())+'</span></div>';}
  const indentContinuation=[35,36,38].includes(lawIndex); return '<div class="doc-row doc-paragraph'+(indentContinuation?' law-indent-paragraph':'')+'"'+(indentContinuation?' style="padding-left:2.8em!important;box-sizing:border-box!important"':'')+'><span class="doc-marker"></span><span class="doc-copy">'+esc(t)+'</span></div>';
 }).join('');
}
function renderDetail(){
 const detail=document.getElementById('detail');
 if(!laws.length){
  detail.innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第六類法規版型確認</span><span class="text-xs text-slate-400">版型確認階段</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">法規內容預留區</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]"><div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-5 text-sm leading-relaxed text-slate-500">目前先確認頁面版型。確認後再匯入第六類法規名稱、條文及項次內容。</div></div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">法規沿革預留區；確認版型後再匯入。</div></div>`;
  return;
 }
 const law=laws[currentIndex];
 const content=formatLawText(law.content,currentIndex);
 detail.innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ${currentIndex+1} 項／共 ${laws.length} 項</span><span class="text-xs text-slate-400">教師研習、進修、請假</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">${esc(law.title)}</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px]">${content||'<p>原始文件未提供此項資料。</p>'}</div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">${law.history.trim()?esc(law.history):'原始文件未提供此項資料。'}</div></div><div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" ${currentIndex===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" ${currentIndex===laws.length-1?'disabled':''} class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`;
}
function go(d){if(!laws.length)return;currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
document.getElementById('searchInput').addEventListener('input',renderList);renderList();renderDetail();
</script></body></html>
