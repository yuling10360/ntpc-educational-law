<text x="400" y="42" class="title">新北市114學年度高級中等學校各學習領域</text>
<text x="400" y="76" class="title">教師共同不排課時段與教學研究會時間表</text>
<g class="grid">
<rect x="35" y="110" width="730" height="485"/>
<path d="M105 110V595 M355 110V595 M575 110V595 M35 165H765 M35 220H765 M35 275H765 M35 330H765 M35 385H765 M35 465H765 M35 530H765"/>
</g>
<g class="cell bold">
<text x="70" y="145">序號</text><text x="230" y="145">部定必修領域</text><text x="465" y="137">領域教師</text><text x="465" y="157">共同不排課時段</text><text x="670" y="137">領域研究會</text><text x="670" y="157">時間</text>
<text x="70" y="200">1</text><text x="230" y="200">國文（國語文）</text><text x="465" y="200">星期四下午半天</text><text x="670" y="200">星期四 5–6 節</text>
<text x="70" y="255">2</text><text x="230" y="255">英文（英語文）</text><text x="465" y="255">星期一下午半天</text><text x="670" y="255">星期一 5–6 節</text>
<text x="70" y="310">3</text><text x="230" y="310">數學</text><text x="465" y="310">星期三下午半天</text><text x="670" y="310">星期三 5–6 節</text>
<text x="70" y="365">4</text><text x="230" y="365">社會</text><text x="465" y="365">星期三上午半天</text><text x="670" y="365">星期三 3–4 節</text>
<text x="70" y="420">5</text><text x="230" y="420">自然（自然科學）領域</text><text x="465" y="420">星期二下午半天</text><text x="670" y="420">星期二 5–6 節</text>
