<script type="application/json" id="lawData">[{"id":"law-01","label":"1. 新北市立高級中等學校組織規程準則","tag":"市定法規","title":"新北市立高級中等學校組織規程準則","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n第  1  條\n本準則依高級中等學校組織設置及員額編制標準(以下簡稱本標準)第十一條第一項及新北市政府教育局組織規程第九條規定訂定之。\n\n第  2  條\n本準則所稱高級中等學校(以下簡稱學校)，係指新北市立普通型學校、技術型學校及綜合型學校。\n\n第  3  條\n學校置校長一人，專任，綜理校務。\n學校四十一班以上者，得置副校長一人，襄助校長處理校務，由校長就曾任一級單位主管以上人員聘兼之。\n\n第  4  條\n學校應設一級單位，其掌理事項如下：\n一、教務處：辦理課程編排、教學實施、教學研究、學籍管理、成績評量、招生、教學設備與教具圖書資料供應及配合實施教育輔導等事項。\n二、學生事務處：辦理民主法治教育、道德教育、生活教育、體育衛生保健與團體活動、校園性別事件、防制校園霸凌因應小組及配合實施生活輔導等事項。\n三、總務處：辦理文書、檔案管理、公文管理、事務、出納、工友管理、物品採購、營建修繕及財產管理等事項。\n四、輔導處(室)：辦理學生生活輔導、心理諮商輔導及生涯輔導等事項。\n五、圖書館：辦理圖書購置、分編、典藏、閱覽、利用及推廣教育等事項。\n技術型學校應設實習處，辦理學生實習、技能檢定、學生就業輔導、建教合作及其他有關事項。但設有建教合作處者，由該處辦理建教合作事項。\n綜合型學校或設有專業群、科、學程之普通型學校，亦得設置實習處或建教合作處，辦理前項事項。\n學校得視類型、校務發展需要及規模大小，增設下列一級單位；其設置基準及掌理事項如下：\n一、特殊教育處：特殊教育班十八班以上者，得設置；辦理特殊教育及其他有關事項。\n二、建教合作處：建教合作班十八班以上者，得設置；辦理建教合作及其他有關事項。\n三、進修部：辦理進修教育者，得設置；辦理進修教育及其他有關事項。\n四、資訊室：得視業務需要設置；辦理資訊業務及其他有關事項。\n五、研究發展處：得視業務需要設置；辦理研究發展及其他有關事項。\n六、技術交流處：得視業務需要設置；辦理技術交流及其他有關事項。\n學校得依校務發展需要，自行調整各處(室、館、部)之掌理事項。\n\n第  5  條\n學校設二級單位(組、科或學程)辦事，並得基於自主管理原則及需要，訂定組別及組數。但不得超過下列基準：\n一、普通型及綜合型學校：\n（一）二十班以下：十二組。\n（二）二十一班以上：十五組。\n二、技術型學校：\n（一）四十八班以下：十三組。\n（二）四十九班以上：十五組。\n除前項組數外，有下列情形者，其設置基準如下：\n一、附設國民中學部(以下簡稱國中部)，學校班級總數，應包括附設國中部，並得增設四組，不受前項規定之限制。\n二、普通型學校附設專業群、科、學程，得另增設二組，不受前項規定之限制。\n三、普通型學校設有綜合高中學程十二班以上，得設綜合高中組。\n四、設有特殊教育班，得於教務處或輔導處(室)設特教組。\n五、技術型學校辦理實用技能學程六班以上，得視實際需要，於適當單位增設實用技能組。\n六、設進修部，得視學校規模大小(班級數得併計國民中學附設補習學校班級數)及校務發展需要，增設教務、教學、註冊、學生事務、生活輔導、衛生或實習輔導各組，不受前項規定之限制。但增設組數不得超過下列基準：\n（一）五班以下：一組。\n（二）六班至九班：二組。\n（三）十班至十五班：四組。\n（四）十六班以上：五組。\n\n第  6  條\n學校置教師、專任輔導教師、導師、秘書、主任、組長、科主任、學程主任及軍訓教官；其員額編制，依本標準第七條、第八條及第十二條規定。\n學校兼行政職務人員之進用方式如下：\n一、學校未置副校長者，得置秘書一人，由校長就編制內專任教師聘兼之。\n二、一級單位主任及二級單位科主任、學程主任，除總務處之主任得由教師兼任或職員專任外，其餘均由校長就專任教師聘兼之。\n三、輔導處(室)置主任一人，由校長就專任輔導教師聘兼之。如因業務設組，其組長由校長就具輔導知能之專任教師聘兼之。\n四、圖書館置主任一人，由校長遴選具有專業知能之人員專任，必要時得由校長就具有專業知能之專任教師聘兼之。\n五、二級單位組長，除總務處之組長由職員專任、學生事務處負責生活輔導業務之組長得由具輔導知能之人員兼任外，其餘由校長就專任教師聘兼之或由職員專任。\n\n第  7  條\n學校置幹事、技士、助理員、技佐、電器管理員、管理員、書記等職員；其員額編制，依本標準第八條及第十二條規定。\n前項學校職員數，得依學校分布情形或學生人數多寡，視財政狀況及實際業務需要，依新北市政府(以下簡稱本府)年度預算，以不逾學校教職員員額總數百分之二十五編列。但本準則施行前已進用之職員，不受員額總數比率之限制，得繼續任職至離職為止。\n學校置醫師、營養師、護理師(或護士)等醫事人員，其員額編制，依本標準第八條及第十二條規定。\n學校得依本標準第八條規定，置專任運動教練，並聘(僱)用救生員或運動傷害防護員。\n\n第  8  條\n學校設人事室或置人事管理員；其設人事室者，置主任一人，得置組員、助理員或書記若干人，依法辦理人事管理事項；其設置，依人事機構設置有關規定辦理。\n\n第  9  條\n學校設會計室或置會計員；其設會計室者，置主任一人，得置組員、佐理員或書記若干人，依法辦理歲計、會計及統計事項；其設置，依主計機構設置有關規定辦理。\n\n第  10  條\n學校附設國中部、國民小學部者，其組織及員額編制，依國民教育法相關規定辦理。\n\n第  11  條\n學校附設幼兒園者，其組織及員額編制，依幼兒教育及照顧法相關規定辦理。\n\n第  12  條\n學校設立分校、分部者，應依高級中等教育法相關規定辦理。\n\n第  13  條\n本準則所列各職稱之官等職等或級別及員額，另以編制表定之。\n各職稱之官等職等，依職務列等表之規定。\n\n第  14  條\n學校職員員額編制表，由學校擬訂，報本府教育局(以下簡稱本局)轉陳本府核定，並送考試院備查。\n\n第  15  條\n學校分層負責明細表，由學校訂定，報本局備查。\n\n第  16  條\n本準則自中華民國一百十三年二月一日施行。\n        </div>","historyClass":"law-history","history":"\n          1. 104年12月30日新北市政府新北府法規字第1042465552號令訂定發布全文15條；並自103年8月1日施行。<br/>\n          2. 中華民國113年2月29日新北市政府新北府法規字第1130267809號令修正發布全文16條；並113年2月1日施行。\n        "},{"id":"law-02","label":"2. 高級中等學校組織設置及員額編制標準","tag":"教育部法規","title":"高級中等學校組織設置及員額編制標準","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n第  1  條\n本標準依高級中等教育法(以下簡稱本法)第二十四條第一項規定訂定之。\n          \n第  2  條\n高級中等學校(以下簡稱學校)置校長一人，專任，綜理校務；並得置副校長一人，襄助校長處理校務。\n副校長之設置基準，由各該主管機關定之。\n          \n第  3  條\n學校設下列一級單位：\n一、\t教務處。\n二、\t學生事務處。\n三、\t總務處。\n四、\t輔導處(室)。\n五、\t圖書館。\n六、\t實習處：技術型學校應設置；綜合型學校或設有專業群、科、學程之普通型學校，得設置。\n七、\t特殊教育處：辦理特殊教育十八班以上者，得設置。\n八、\t建教合作處：辦理建教合作十八班以上者，得設置。\n九、\t進修部：辦理進修教育者，得設置。\n十、\t資訊室、研究發展處、技術交流處或其他處(室)：得視業務需要設置。\n          \n第  4  條\n學校設人事室或置人事管理員；其設人事室者，置主任一人，得置組員、助理員或書記若干人；其設置，依人事機構設置有關規定辦理。\n學校設主(會)計室或置主(會)計員；其設主(會)計室者，置主任一人，得置組員、佐理員或書記若干人；其設置，依主計機構設置有關規定辦理。\n          \n第  5  條 \n學校設下列二級單位：\n一、\t教務處：\n(一)\t得設教學、註冊、設備、試務、課務、實習及就業輔導、實驗研究各組辦事。但設有實習處者，不得設實習及就業輔導組。\n(二)\t普通型學校設有綜合高中學程十二班以上者，得設綜合高中組。\n二、\t學生事務處：得設訓育、生活輔導、體育、衛生、社團活動各組。\n三、\t總務處：得設文書、庶務、出納各組。\n四、\t輔導處(室)：得設輔導、資料各組。\n五、\t圖書館：得設技術服務、讀者服務、資訊媒體各組。\n六、\t實習處：得設實習、就業輔導、技能檢定各組；辦理建教合作在十七班以下者，得設建教合作組。\n七、\t學校辦理實用技能學程六班以上者，得視實際需要於適當單位增設實用技能組。\n八、\t學校辦理特殊教育班二班以上十七班以下者，得增設特殊教育組。\n九、\t進修部：得設教務、教學、註冊、學生事務、生活輔導、衛生、實習輔導各組。\n十、\t資訊室、研究發展處、特殊教育處、建教合作處、技術交流處或其他處(室)：得視業務需要分組。\n          \n第  6  條\n各該主管機關得視學校規模大小及校務發展需要，並配合學校班級數，訂定第三條及前條單位之設置基準或總量，並納入第十一條所定之組織規程準則。\n          \n第  7  條\n學校教師員額編制如下：\n一、\t普通科：每班置教師二人，每達四班，增置教師一人。\n二、\t專業類科：\n(一)\t農業、海事水產類：每三班置教師八人；未達三班者，二班置五人，一班置二人。但農業類之農業機械科每班置三人。\n(二)\t工業及藝術類：每班置教師三人。\n(三)\t商業及家事類：每二班置教師五人；未達二班者，一班置二人。\n(四)\t前三目類，除工業類外，設有五科以上者，每增二科得增置教師一人。\n(五)\t綜合高中學程：每班以二點五人為原則。但辦理工業、農業及海事水產綜合高中課程者，每班置三人。\n三、\t實用技能學程：日間授課每班置教師一人，每滿四班增一人；夜間授課每班置教師二人。\n四、\t特殊教育班：依高級中等以下學校特殊教育班班級及專責單位設置與人員進用辦法規定辦理。\n五、\t體育班：依高級中等以下學校體育班設立辦法規定辦理。\n六、\t進修部：每班置教師二人，並得由學校現有教師兼任。\n七、\t專任輔導教師：學校班級數十二班以下者，置一人；十三班至二十四班者，置二人；二十五班以上者以此類推。\n八、\t導師：每班置一人，由編制內專任教師兼任，但建教合作班得依需要增置導師員額；特殊教育班導師，依高級中等以下學校特殊教育班班級及專責單位設置與人員進用辦法規定設置。\n九、\t兼行政職務人員：\n(一)\t學校得置副校長一人，由校長就曾任一級單位主管以上人員聘兼之；未置副校長者，得置秘書一人，由校長就編制內專任教師聘兼之。\n(二)\t教務處、學生事務處、總務處及實習處各置主任一人，除總務處主任得由教師兼任或職員專任外，其餘均由校長就專任教師聘兼之；其所屬各組，除總務處之組長由職員專任、學生事務處負責生活輔導業務之組長得由具輔導知能之人員兼任外，其餘由校長就專任教師聘兼之或由職員專任。\n(三)\t輔導處(室)置主任一人，由校長就專任輔導教師聘兼之。如因業務設組，其組長由校長就具輔導知能之專任教師聘兼之。\n(四)\t圖書館置主任一人，由校長遴選具有專業知能之人員專任，必要時得由校長就具有專業知能之專任教師聘兼之。\n(五)\t普通型學校、技術型學校及綜合型學校，設有專業類科二科以上者，每一專業科置科主任一人；設有專門學程總班級數四班以上者，置學程主任一人，由校長就各該專業科、學程之專任教師聘兼之。同類專業科及綜合高中專門學程，科主任、學程主任擇一配置。\n(六)\t資訊室、研究發展處、特殊教育處、建教合作處、技術交流處、進修部或其他一級單位，置主任一人，由校長就專任教師聘兼之。\n(七)\t進修部組長，得由校長就專任教師聘兼之；進修部軍訓教官得由學校現有軍訓教官兼任。\n軍訓主任教官、軍訓教官之員額編制依軍訓教官員額設置之相關規定辦理。本法施行前已依規定進用之護理教師，於本法施行後繼續任職者，其員額編制依護理教師員額設置之相關規定辦理。\n第一項第七款有關專任輔導教師之配置規定，自中華民國一百零六年八月一日起逐年完成。\n          \n第  8  條\t\n學校職員員額編制如下：\n一、\t總務處所屬各組，各置組長一人。\n二、\t幹事、助理員、管理員、書記，依下列基準設置：\n(一)\t幹事：六班以下者，置二人，超過六班部分，每六班增置一人，超過六班之班級數除以六之餘數三班以上者，增置一人。設有學生宿舍者，寄宿學生數八十人以上置幹事一人；三百人以上，增置一人；三百人以上，每增寄宿學生二百人，再增置一人。\n(二)\t助理員、管理員：得置二人或三人。\n(三)\t書記：置一人，四十一班以上者，得增置一人。\n三、\t技士、技佐：\n(一)\t工業及海事水產專業科，每科置技士及技佐各一人；農業專業科置技士一人，及設有農機具工廠之專業科，每科置技佐一人，商業及家事每類置技士一人。裝有高壓電力六百伏特以上學校，增置技士一人，專責電力管理。\n(二)\t辦理綜合高中專門學程，每校置技士、技佐二人，四十一班以上者，得增置一人。設有工業、農業、海事類學程，每學程在四班以下者，得置技士一人，逾四班者，每增四班得增置技佐一人。辦理商業、家事類學程者，每類得就技士、技佐擇一配置一人。\n(三)\t設置同類專業科及綜合高中專門學程，其技士、技佐員額於前二目擇一配置。\n四、\t電器管理員：學校有電器設備之維護管理需要，得置電器管理員一人。\n五、\t醫師：得置兼任醫師一人，四十一班以上得增置一人，並得在預算額度內分科遴請合格醫師應診之。\n六、\t營養師、護理師(或護士)：依學校衛生法規定辦理。進修部應於學校衛生法所定員額外，單獨置護理人員一人。\n七、\t進修部兼任幹事：九班以下至多三人；十班至十五班至多五人；十六班以上至多八人。由校長指派現有人員兼任。\n八、\t進修部兼辦人員：就業實習、總務、人事及主計等業務，由校長指派相關人員兼辦之。\n公立學校依第四條、第七條第二項第二款及前項第一款至第四款職員之員額配置，應符合各機關職稱及官等職等員額配置準則規定；學校之總量及配置基準，應納入第十一條所定之組織規程準則或組織規程。\n學校依高級中等以下學校體育班設立辦法得置專任運動教練。\n學校設有游泳池或因學生運動與訓練需要，經報主管機關核准後得聘(僱)用救生員或運動傷害防護員若干人。\n          \n第  9  條\n私立學校除依本標準規定設單位外，得視實際需要，設其他單位。\n私立學校人事及會計員額設置，依私立學校法及相關規定辦理；學校財團法人董事會得置辦事人員若干人，並得納入所設私立學校員額編制。\n          \n第  10  條 \n本法第六十條第一項第二款所稱合格教師，指於公立或已立案之私立學校編制內，按月支給待遇，並依法取得與其任教類別、學科相符教師證書之專任或代理教師，並包括經中央主管機關審核通過，取得專業及技術教師證書之專任專業及技術教師。\n學校前項合格教師比率(學校合格教師總人數╱學校聘任之專任及代理教師總人數)，應達下列基準：\n一、\t公立學校：偏鄉學校百分之八十以上，其餘學校百分之八十五以上。\n二、\t私立學校：偏鄉學校或師資培育供需現況不足之群科百分之七十以上，其餘學校或群科百分之八十以上。\n前項所定偏鄉學校，應符合下列條件之一，並由各該主管機關認定：\n一、\t學校所在地區，無公共交通工具到達者。\n二、\t學校距公共交通站牌，達五公里以上者。\n三、\t社區距學校五公里以上，且無公共交通工具可到達學校者。\n四、\t公共交通工具到學校所在地區，每日少於四班，或公共交通工具每日八班以內仍無法配合上下學者。\n第二項第二款所定師資培育供需現況不足之群科，由各該主管機關認定。\n          \n第  11  條\n各該主管機關應就所屬公立學校依本標準規定，訂定組織規程準則；各學校應擬訂員額編制表，報各該主管機關核定。各該主管機關應將組織規程準則及各學校職員員額編制表，分別轉請考試院核備或備查。\n私立學校應依本標準規定，擬訂組織規程及員額編制表，報各該主管機關核定。\n          \n第  12  條\n學校附設國民中學、國民小學部者，其組織及員額編制，依國民教育法相關規定辦理。\n          \n第  13  條\n本標準自中華民國一百零三年八月一日施行。\n本標準中華民國一百零七年七月十六日修正發布之條文，自發布日施行。\n\n        <div class=\"law-history\">\n          1. 103年1月10日教育部臺教授國部字第 1020136307A號令訂定發布全文13條。<br/>\n          2. 104年8月26日修正第4、8條條文。<br/>\n          3. 107年7月16日修正第7、13條條文。\n        </div>\n</div>","historyClass":"","history":""},{"id":"law-03","label":"3. 新北市立高級中等學校教師每週教學節數標準","tag":"市定標準","title":"新北市立高級中等學校教師每週教學節數標準","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n第  1  條\n本標準依高級中等教育法第三十二條規定訂定之。\n          \n第  2  條\n本標準適用於新北市立高級中等學校(以下簡稱學校)。\n本標準之主管機關為新北市政府教育局(以下簡稱本局)。\n          \n第  3  條 \n學校專任教師及兼任導師之專任教師(以下簡稱兼任導師)，每週基本教學節數(以下簡稱基本節數)如附表一規定，其核計方式如下：\n一、\t擔任基本節數相同之二種以上課程(領域、科目)者，按各該課程(領域、科目)教學節數合併計算。\n二、\t擔任基本節數不同之二種以上課程(領域、科目)者，按各該課程(領域、科目)教學節數之比例折算。\n三、\t兼任導師擔任團體活動課程之班級活動教學節數，應併入其基本節數計算。但擔任其餘團體活動時間，不計入基本節數。\n          \n第  4  條\n學校應依十二年國民基本教育課程綱要總綱規定，訂定課程計畫，並報本局備查。\n前項課程計畫所定跨領域或跨科目之課程採協同教學方式者，其教師教學節數之核計方式如下：\n一、\t全學期全部節數均採協同教學：教學節數一節，採計為每週教學節數一節。\n二、\t全學期部分節數採協同教學：不計入每週教學節數。但依實際教學節數，支給鐘點費。\n          \n第  5  條 \n學校教師依課程計畫所定彈性學習時間，擔任充實、增廣或補強性教學課程授課者，其教學節數比照前條第二項規定計算之。\n學校教師依課程計畫所定彈性學習時間，擔任學生自主學習教學(指導)，或選手培訓、學校特色活動指導者，依實際教學(指導)節數，支給鐘點費。\n          \n第  6  條 \n學校兼任行政職務之專任教師(以下簡稱兼任行政教師)，基本節數如附表二規定，其核計方式如下：\n一、\t班數以日間部學校(含分散式資源班、巡迴輔導班)、國中編制班級數合計為計算標準。但輪調式建教合作班，每二班折算為一班。\n二、\t學校輔導處(室)主任及專任輔導教師，專職學生輔導工作。但其因學校課務需要擔任教學者，其基本節數比照處(室)主任及教學組長之規定。\n三、\t進修部主任、組長及分部主任，其基本節數比照附表二所列節數各減少二節；其班數依進修部或分部編制班級數計算之。\n四、\t進修部專任輔導教師擔任課程教學者，其基本節數比照進修部教學組長之規定。\n五、\t學校辦理綜合高中所增兼任行政教師(含學程主任及輔導、課務、課外活動、招生等組長)，經報本局同意後，其基本節數比照同級兼任行政教師之規定。\n特殊教育班教師因兼任行政職務所減少之教學節數，學校應以代理教師或兼任方式補足之，不得減少該特殊教育班每週教學節數。\n          \n第  7  條\n學校教師協助校務，其減授教學節數(以下簡稱減授節數)之核計方式如下：\n一、\t課程領域(包含語文、數學、社會、自然科學及藝能五大領域)之召集人，其基本節數減授二節；藝能領域包含藝術、綜合活動、科技、健康與體育、全民國防教育等領域。\n二、\t學校各年級級導師，其基本節數減授一節。\n三、\t學校辦理綜合高中未設學程主任者，得設學程召集人，其減授節數比照第一款規定。\n四、\t教師協助校務每週減授節數如附表三規定，其分配比例與優先順序，由校務會議決定；並以擔任童軍團長、協辦學習扶助或實際參與其他重大教育政策推動者，列為減授節數優先對象。\n五、\t教師兼任課程諮詢教師或其召集人，或承辦政府機關(構)委任、委託、補助或指示學校辦理之事項者，得依有關法令規定，減授其基本節數；其減授節數，不計入附表三協助校務每週減授節數。\n\n第  8  條\n學校教師超時教學鐘點費(以下簡稱超時鐘點費)之核發方式如下：\n一、\t教師實際教學節數超過應教學節數者(以下簡稱超時教學節數)，核實支給超時鐘點費；超時教學節數應於開學前註記於課表，並平均分散於每日為原則。\n二、\t全學期兼(代)課者，按學校行事曆排定之每週(代)課節數，核實支給超時鐘點費；其節數包括適逢國定假日為實際兼(代)課及學期始(末)未滿一週之教學節數。但擔任畢業班之教師，於學校停課後之節數，不予計入。\n三、\t教師超時教學節數與全學期代課節數合計以九節為限，以上節數\n四、\t日間部及進修部合併以十二節為限；學期中之短期代課節數，則不予計入。但課程有不可分割或特殊情形，報本局核准者，不在此限。\n五、\t設有體育班之學校，其寒(暑)假應開設競技專項運動綜合訓練者，寒假以三學分、暑假以六學分為限，得依實際教學節數核實支給超時鐘點費。\n六、\t學校依規定排課核算後，如確有超時教學節數，得於學校人事費項下核實支給超時鐘點費。\n前項第一款應教學節數，以基本節數扣減協助校務每週減授節數核計之。\n          \n第  9  條\n全民國防教育課程由軍訓教官(包括軍訓主任教官、軍訓教官兼任生活輔導組長及一般軍訓教官)擔任教學者，該課程每週教學節數，由一般軍訓教官平均分配。\n全民國防教育課程依前項規定分配後，一般軍訓教官每人基本節數達十節，仍有賸餘節數時，由軍訓教官兼任生活輔導組長或軍訓主任教官優先擔任；再有賸餘節數時，由全部軍訓教官分別擔任。\n軍訓主任教官基本節數，比照附表二處主任之規定。\n          \n第  10  條\n學校應按教師登記、檢定科目並參酌其專長，排定教學課程。但就實習課程、選修課程及稀有科目如不易延聘合格師資，得聘請具有專長者兼課，除法令另有規定外，節數以每週不超過九節為限。\n          \n第  11  條\n依高級中等學校合聘教師辦法聘任之合聘教師，其基本節數，按該教師於各合聘學校教學之課程種類及擔任之職稱類別，依本標準相關規定辦理。\n依高級中等學校專業及技術教師遴聘辦法聘任之編制內專任教師，其基本節數，按該教師於學校教學之課程種類及擔任之職稱類別，依本標準相關規定辦理。\n          \n第  12  條\n學校教師每週教學節數未依本標準辦理者，除追繳其溢領鐘點費外，並議處失職人員。\n          \n第  13  條\n學校附設國中部之專任教師及兼任導師，其教學節數應依新北市國民中學教師基本節數相關規定辦理。但兼任行政教師，其基本節數及協助校務減授節數，得準用本標準規定辦理。\n          \n第  14  條\n學校代理教師每週教學節數，準用本標準之規定。\n          \n第  15  條\n本標準自發布日施行。\n本標準中華民國一百零八年十月三十日修正條文，自中華民國一百零八年八月一日施行。\n本標準中華民國一百十二年二月十五日修正條文，自中華民國一百十一年八月一日施行。\n本標準中華民國一百十二年七月十九日修正條文，自中華民國一百十二年八月一日施行。\n本標準自中華民國○年○月○日修正條文，自中華民國一百十五年八月一日施行。\n                        <!-- 附表一：每週基本教學節數表 -->\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n    附表一：新北市立高級中等學校教師每週教學節數標準\n  </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse\">\n<thead>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<!-- 表頭三向斜線格 -->\n<th class=\"p-3 border-r border-slate-300 font-normal relative min-w-[240px] text-left align-top bg-gradient-to-tr from-slate-100 to-white\" colspan=\"2\">\n<div class=\"flex justify-between items-start text-xs text-slate-600\">\n<span class=\"text-right w-full pr-12 font-medium\">節 數</span>\n<span class=\"font-medium\">職別</span>\n</div>\n<div class=\"text-xs text-slate-700 font-semibold mt-4\">\n              課程 (領域、科目)\n            </div>\n</th>\n<th class=\"p-3 border-r border-slate-300 text-center font-bold min-w-[100px] w-28 bg-slate-100/50\">\n            專任教師\n          </th>\n<th class=\"p-3 text-center font-bold min-w-[100px] w-28 bg-slate-100/50\">\n            導 師\n          </th>\n</tr>\n</thead>\n<tbody class=\"divide-y divide-slate-200\">\n<!-- 語文領域 (合併 2 列) -->\n<tr>\n<td class=\"p-3 border-r border-slate-200 text-center font-medium bg-slate-50/50 w-28\" rowspan=\"2\">\n            語文領域\n          </td>\n<td class=\"p-3 border-r border-slate-200\">國文 (國語文)</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十四</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">九</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200\">英文 (英語文)</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<!-- 其餘領域科目 -->\n<tr>\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">數學</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">社會領域</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">自然 (自然科學) 領域</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">藝術領域</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">生活 (綜合活動) 領域</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">生活領域之計算機概論或資訊科技概論 (科技領域)</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">健康與體育領域</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">全民國防教育</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">各群、科、學程之專業科目及實習科目，包括專題製作 (專題實作)</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200\" colspan=\"2\">選修課程，包括生命教育類、生涯規劃類、其他類</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<!-- 備註區塊 (合併 4 欄) -->\n<tr class=\"bg-slate-50 border-t border-slate-300\">\n<td class=\"p-4 text-xs leading-relaxed text-slate-700\" colspan=\"4\">\n<span class=\"font-bold text-slate-900 block mb-1\">備註：</span>\n<ol class=\"list-decimal pl-5 space-y-1.5\">\n<li>\n                教師擔任二種以上課程(領域、科目)教學時，各該課程(領域、科目)基本節數相同者，按各該課程(領域、科目)教學節數合併計算；基本節數不同者，依各該課程(領域、科目)教學節數比例折算後併計之。\n              </li>\n<li>\n                括弧內文字為十二年國民基本教育課程綱要總綱適用之名稱。\n              </li>\n<li>\n                各課程(領域、科目)包括必修(部定、校訂)及選修課程(領域、科目)。\n              </li>\n</ol>\n</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>\n<!-- 附表二：兼任行政職務每週基本教學節數表 -->\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n    附表二：新北市立高級中等學校教師兼任行政職務每週基本教學節數表\n  </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse\">\n<thead>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<!-- 三向表頭：節數 / 班數 / 職別 -->\n<th class=\"p-3 border-r border-slate-300 font-normal relative min-w-[200px] w-52 text-left align-top bg-gradient-to-tr from-slate-100 to-white\">\n<div class=\"flex justify-between items-start text-xs text-slate-600\">\n<span class=\"font-medium pl-6\">節數</span>\n<span class=\"font-medium pr-2\">班數</span>\n</div>\n<div class=\"text-xs text-slate-700 font-semibold mt-4\">\n              職別\n            </div>\n</th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[55px] bg-slate-100/50\">\n            九班<br/>以下\n          </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[55px] bg-slate-100/50\">\n            十班<br/>至<br/>十八班\n          </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[55px] bg-slate-100/50\">\n            十九班<br/>至<br/>二十四班\n          </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[55px] bg-slate-100/50\">\n            二十五班<br/>至<br/>三十班\n          </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[55px] bg-slate-100/50\">\n            三十一班<br/>至<br/>四十班\n          </th>\n<th \"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">三</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">一</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-emerald-700 text-base\">○</td>\n<td class=\"p-2 text-center font-bold text-emerald-700 text-base\">○</td>\n</tr>\n<!-- 第 3 列：上列各組以外之編制內各處(室)組長 -->\n<tr>\n<td class=\"p-3 border-r border-slate-200 font-medium bg-slate-50/30\">\n            上列各組以外之編制內各處(室)組長\n          </td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">九</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">九</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">七</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">七</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">五</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">三</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">一</td>\n<td class=\"p-2 text-center font-bold text-emerald-700 text-base\">○</td>\n</tr>\n<!-- 第 4 列：各群、科、學程主任 (跨 8 欄) -->\n<tr class=\"bg-slate-50/40\">\n<td class=\"p-3 border-r border-slate-200 font-medium bg-slate-50/30\">\n            各群、科、學程主任\n          </td>\n<td class=\"p-3 text-left leading-relaxed text-xs md:text-sm text-slate-700\" colspan=\"8\">\n            全科<span class=\"underline decoration-slate-400 font-medium\">總班數三班</span>(含)以下者<strong>八節</strong>；四班至六班者<strong>七節</strong>；七班以上者<strong>六節</strong>。\n          </td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>\n<!-- 附表三：協助校務酌減節數表 -->\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n    附表三：新北市立高級中等學校教師協助校務酌減節數表\n  </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse\">\n<tbody>\n<!-- 第 1 列：總班級數 -->\n<tr class=\"border-b border-slate-300\">\n<th class=\"p-3 border-r border-slate-300 text-center font-bold bg-slate-50/80 min-w-[120px] w-36\">\n            總班級數\n          </th>\n<td class=\"p-3 border-r border-slate-200 text-center font-medium min-w-[110px]\">\n            二十六班以下\n          </td>\n<td class=\"p-3 border-r border-slate-200 text-center font-medium min-w-[110px]\">\n            二十七班至四十四班\n          </td>\n<td class=\"p-3 border-r border-slate-200 text-center font-medium min-w-[110px]\">\n            四十五班至六十二班\n          </td>\n<td class=\"p-3 text-center font-medium min-w-[110px]\">\n            六十三班以上\n          </td>\n</tr>\n<!-- 第 2 列：協助校務酌減節數 -->\n<tr class=\"bg-slate-50/20\">\n<th class=\"p-3 border-r border-slate-300 text-center font-bold bg-slate-50/80\">\n            協助校務<br/>酌減節數\n          </th>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-sm md:text-base\">\n            八節至十二節\n          </td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-sm md:text-base\">\n            十二節至十八節\n          </td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-sm md:text-base\">\n            十八節至三十節\n          </td>\n<td class=\"p-3 text-center font-bold text-blue-700 text-sm md:text-base\">\n            三十節至六十節\n          </td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>\n</div>","historyClass":"law-history","history":"\n          115年8月11日新北市政府教育局新北府教中字第 1151487041號函預告修正第15條及第3條附表一；並自115年8月1日施行。\n        "},{"id":"law-04","label":"4. 教育部國民及學前教育署補助高級中等學校實施十二年國民基本教育課程及國立高級中等學校教師每週教學節數標準新增鐘點費要點","tag":"教育部要點","title":"教育部國民及學前教育署補助高級中等學校實施十二年國民基本教育課程及國立高級中等學校教師每週教學節數標準新增鐘點費要點","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">教育部國民及學前教育署(以下簡稱本署)為補助高級中等學校(以下簡稱學校)，執行十二年國民基本教育課程綱要(以下簡稱課綱)高級中等教育階段相關規定、高級中等學校課程規劃及實施要點、高級中等學校實習課程實施辦法、高級中等學校課程諮詢教師設置相關規定及國立高級中等學校教師每週教學節數標準(以下簡稱節數標準)，所新增之鐘點費，特訂定本要點。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">本要點所稱新增鐘點費，指學校適用課綱之班級實施課程教學增加教師授課、指導，及減授課程諮詢教師、課程諮詢教師召集人(以下簡稱召集人)每週基本教學節數(以下簡稱基本節數)或依節數標準所定教師基本節數調降、協辦行政教師減授基本節數，所增加之鐘點費。前項新增鐘點費，依公立中小學兼任及代課教師鐘點費支給基準表規定支給。但授課或指導教師為大專校院教師者，依公立大專校院兼任教師鐘點費支給基準表規定，支給其鐘點費。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">本要點補助項目及基準如下：</span></div>\n<div class=\"doc-row doc-level-2 font-medium\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">部定必修課程新增鐘點費：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">各類型學校國語文、英語文及數學三科目：採班群實施適性分組教學增加教師授課之鐘點費；其補助之金額，以該科目原應支出鐘點費之零點五倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">普通型學校自然科學探究與實作課程：實施跨科目協同教學增加不同科目教師授課之鐘點費；其補助之金額，以該課程原應支出鐘點費之一倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">3.</span><span class=\"doc-copy\">技術型學校之社會、自然科學與藝術領域：實施各該領域跨科之統整型、探究型或實作型課程，增加不同科目教師授課之鐘點費；其補助之金額，以該課程原應支出鐘點費之一倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">4.</span><span class=\"doc-copy\">學校設有專業群、科之實習科目：實施分組教學增加教師授課之鐘點費；其補助之金額，以該課程原應支出鐘點費之一倍為限。</span></div>\n<div class=\"doc-row doc-level-2 font-medium\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">校訂必修課程及選修課程新增鐘點費：</span></div>\n<div class=\"doc-row doc-level-3 doc-row-continuation text-slate-500\"><span class=\"doc-marker\"></span><span class=\"doc-copy\">下列各目補助之總金額，以學校適用課綱之班級所開設校訂必修課程及選修課程之總節數原應支出鐘點費之一倍為限：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">普通型學校、綜合型學校及單科型學校採班群開課增加教師授課之鐘點費；其補助之金額，以該班群原應支出鐘點費之零點五倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">技術型學校及綜合型學校開設學生應修習學分數一點二倍至一點五倍之選修課程增加教師授課之鐘點費；其補助之金額，以學生應修習學分數之課程原應支出鐘點費之零點五倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">3.</span><span class=\"doc-copy\">技術型學校、綜合型學校開設專題實作課程及綜合型學校專門學程之實習科目實施分組教學增加教師授課之鐘點費；其補助之金額，以該課程原應支出鐘點費之一倍為限。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">4.</span><span class=\"doc-copy\">學校於一般科目開設跨領域或跨科目專題類與統整課程增加不同領域或科目教師授課之鐘點費；其補助之金額，以該課程原應支出鐘點費之一倍為限。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（三）</span><span class=\"doc-copy\">彈性學習時間新增鐘點費：規劃學生自主學習、選手培訓、充實(增廣)教學、補強性教學及學校特色活動增加教師授課或指導之鐘點費；其補助之金額，以學校適用課綱之班級所規劃之彈性學習時間節數原應支出鐘點費之零點五倍為限。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（四）</span><span class=\"doc-copy\">設置課程諮詢教師、召集人新增鐘點費：依高級中等學校課程諮詢教師設置要點所定課程諮詢教師、召集人減授基本節數而增加之鐘點費。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（五）</span><span class=\"doc-copy\">教師基本節數調降新增鐘點費：國立學校依節數標準第二條及第五條所定教師及兼任行政職務之專任教師基本節數調降而增加之鐘點費。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（六）</span><span class=\"doc-copy\">協辦行政教師減授基本節數新增鐘點費：國立學校依節數標準第八條所定協辦行政教師減授基本節數而增加之鐘點費。</span></div>\n<div class=\"doc-row doc-level-1 doc-row-continuation text-slate-600 font-normal\"><span class=\"doc-marker\"></span><span class=\"doc-copy\">私立學校以補助前項第二款選修課程及第四款之新增鐘點費為限。學校因特殊情形，經報各該主管機關核准者，得不受第一項第一款至第四款所定補助基準之限制。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">四、</span><span class=\"doc-copy\">依本要點之申請、審查、請款及補助比率如下：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">申請：學校申請前點第一項第一款至第四款者，應依本署規定，檢具新增鐘點費需求表，直轄市、縣(市)政府(以下簡稱地方政府)主管之學校，報各該地方政府彙整列冊，向本署申請補助，教育部主管之學校，逕向本署申請補助。國立學校申請前點第一項第五款及第六款者，應依本署規定，檢具新增鐘點費需求表，逕向本署申請補助。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">審查：本署得邀集學者專家審查前款申請。審查通過者，由本署視年度預算核定補助金額，未通過者，不予補助。地方政府主管之學校，由本署通知地方政府轉知審查結果；教育部主管之學校，由本署逕行通知審查結果。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（三）</span><span class=\"doc-copy\">請款：地方政府主管之學校，由地方政府彙整列冊並檢附領據向本署請款；教育部主管之學校，國立學校由本署撥入校務基金，私立學校逕向本署請款。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（四）</span><span class=\"doc-copy\">補助比率：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">教育部主管之國立學校，依第二款審查核定之金額，最高全額補助。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">地方政府主管之學校，依中央對直轄市及縣(市)政府補助辦法之規定，就地方政府財力級次，針對第二款審查核定之金額給予不同補助比率；屬第一級者，最高補助百分之八十，第二級者，最高補助百分之八十二，第三級者，最高補助百分之八十四，第四級者，最高補助百分之八十六，第五級者，最高補助百分之九十。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">五、</span><span class=\"doc-copy\">本署及地方政府得不定期訪視學校執行績效；必要時，得聘請專家學者專案查核，作為下次補助之參考。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">六、</span><span class=\"doc-copy\">依本要點申請補助、核撥及結報，應依教育部補(捐)助及委辦經費核撥結報作業要點之規定辦理。</span></div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規沿革】</span>\n          1. 中華民國107年7月10日教育部臺教國署高字第 1070078239B號令訂定發布全文6條，並自108年8月1日生效。<br/>\n          2. 中華民國108年05月30日教育部臺教國署高字第 1080053255B 號令修正發布第4點，並自108年8月1日生效。<br/>\n          3. 中華民國109年4月15日教育部臺教國署高字第 1090037484B號令修正發布第4點、第6點，並自109年2月1日生效。<br/>\n          4. 中華民國110年3月30日教育部臺教國署高字第 1100027922B號令修正發布第2點、第3點，並自即日生效。<br/>\n          5. 中華民國114年10月15日教育部國民及學前教育署臺教國署高字第1145405518A號令修正第4點，並自中華民國115年1月1日生效。\n        "},{"id":"law-05","label":"5. 國民小學與國民中學班級編制及教職員員額編制準則","tag":"教育部準則","title":"國民小學與國民中學班級編制及教職員員額編制準則","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n第  1  條\n本準則依國民教育法第二十三條第一項規定訂定之。\n\n第  2  條\n國民小學及國民中學普通班班級編制規定如下：\n一、國民小學每班學生人數以二十九人為原則。\n二、國民中學每班學生人數以三十人為原則。\n三、山地、偏遠及離島等地區之學校每班學生人數，得視實際情形予以降低，並以維持年級教學為原則。\n其他班級類型之班級編制，依各該法規規定辦理。\n\n第  3  條\n國民小學教職員員額編制如下：\n一、校長：每校置校長一人，專任。\n二、主任：各處、室、分校及其他一級單位置主任一人，除輔導專責單位主任得由教師專任外，其餘由教師兼任。\n三、組長、副組長：\n（一）各組及其他二級單位，置組長一人，優先由職員專任或兼任，或由教師兼任。\n（二）學校三十七班以上者，置副組長若干人，由教師兼任；其配置基準及人數，由直轄市、縣（市）主管機關定之。\n四、教師：每班至少置教師一．六五人；全校未達九班者，另增置教師一人。\n五、專任輔導教師：班級數二十班以下者，置一人；二十一班至四十班者，置二人；四十一班以上者，以此類推。\n六、幹事、助理員、管理員及書記(包括各處室職員及圖書館、教具室、實驗室管理員等，不包括人事、主計專任人員)：七十二班以下者，置一人至三人；七十三班以上者，置三人至五人。\n七、圖書館專業人員：至少應置一人，且專業人員占圖書館工作人員之比率應達三分之一；其專業人員，得由符合圖書館設立及營運標準規定之教師或職員專任或兼任。\n八、營養師及護理師或護士：依學校衛生法規定辦理。其具有護理師資格者，以護理師任用；具有護士資格者，以護士任用。\n九、住宿生輔導員：山地及偏遠地區學校，學生宿舍有十二人以上住宿生者，得置住宿生輔導員一人；五十人以上住宿生者，得置住宿生輔導員二人。但學生宿舍有十一人以下住宿生者，必要時，得置住宿生輔導員一人或指派專人兼任。\n十、運動教練：得依國民體育法規定置專任運動教練若干人。\n十一、人事及主計人員：依有關法令之規定辦理。\n國民小學得視需要，在不超過全校教師員額編制數百分之八範圍內，將專任員額控留，改聘代理教師、兼任、代課教師、教學支援工作人員或輔助教學工作之臨時人員，但學校教師員額編制十二人以下者，得將專任員額控留一人改聘之；其控留員額為二人以上者，至少半數員額應改聘代理教師。\n前項學校所控留之專任員額經費，應全數用於改聘之人員。\n辦理實驗之學校，得視需要增置教師；其增置基準，由該管主管機關視實驗性質定之。\n第一項第五款有關專任輔導教師之配置規定，學校應自中華民國一百零六年八月一日起，於十六年內逐年完成。完成前，由符合學生輔導法施行細則第二條第二款規定之教師兼任。\n國民小學專任及兼任輔導教師逐年配置基準表，規定如附件一。\n\n第  4  條\n國民中學教職員員額編制如下：\n一、校長：每校置校長一人，專任。\n二、主任：各處、室、分校及其他一級單位置主任一人，除輔導專責單位主任得由教師專任外，其餘由教師兼任。\n三、組長、副組長：\n（一）各組及其他二級單位，置組長一人，優先由職員專任或兼任，或由教師兼任。\n（二）學校二十五班以上者，置副組長若干人，由教師兼任；其配置基準及人數，由直轄市、縣(市)主管機關定之。\n四、教師：每班至少置教師二．二人，每九班得增置教師一人；全校未達九班者，得另增置教師一人。\n五、專任輔導教師：班級數十二班以下者，置一人；十三班至二十四班者，置二人；二十五班以上者，以此類推。\n六、幹事、助理員、管理員及書記(包括各處室職員及圖書館、教具室、實驗室、家政教室管理員等，不包括人事、主計專任人員)：三十六班以下者，置二人至九人；三十七班至七十二班者，置三人至十三人；七十三班以上者，置五人至二十人。\n七、圖書館專業人員：至少應置一人，且專業人員占圖書館工作人員之比率應達三分之一；其專業人員，得由符合圖書館設立及營運標準規定之教師或職員專任或兼任。\n八、營養師及護理師或護士：依學校衛生法規定辦理。其具有護理師資格者，以護理師任用；具有護士資格者，以護士任用。\n九、住宿生輔導員：山地及偏遠地區學校，學生宿舍有十二人以上住宿生者，得置住宿生輔導員一人；五十人以上住宿生者，得置住宿生輔導員二人。\n十、運動教練：得依國民體育法規定置專任運動教練若干人。\n十一、人事及主計人員：依有關法令之規定辦理。\n前條第二項至第四項規定，於國民中學準用之。\n第一項第五款有關專任輔導教師之配置規定，學校應自中華民國一百零六年八月一日起，於十二年內逐年完成。完成前，由符合學生輔導法施行細則第三條第二款規定之教師兼任。\n國民中學專任及兼任輔導教師逐年配置基準表，規定如附件二。\n\n第  5  條\n國民小學及國民中學之全校教師員額編制，得經各該主管機關核定，按教師授課節數滿足學生學習節數定之，不受第三條第一項第四款及前條第一項第四款規定之限制；其計算公式如下：\n學校全校教師員額 ＝ (全校學生每週學習總節數 ＋ 全校教師每週兼任各項職務總減授節數) ÷ 各該主管機關規定專任教師每人每週授課節數\n\n第  6  條\n偏遠地區國民小學及國民中學全校學生人數達三十一人以上者，其全校教師員額編制，應依偏遠地區學校教育發展條例第十一條第一項規定，按教師授課節數滿足學生學習節數定之，不受第三條第一項第四款及第四條第一項第四款規定之限制；其計算公式如下：\n學校全校教師員額 ＝ (全校學生每週學習總節數 ＋ 全校教師每週兼任各項職務總減授節數) ÷ 各該主管機關規定專任教師每人每週授課節數\n\n第  7  條\n直轄市、縣(市)主管機關得就教職員員額編制，另定優於本準則之規定。\n直轄市、縣(市)主管機關得依學校分布情形或學生人數多寡，視財政狀況及實際業務需要，於不違反相關法律規定下，就職員員額編制另定有關規定，並報中央主管機關備查，不受第三條及第四條規定之限制。\n\n第  7-1  條\n國民小學或國民中學，已依第三條第一項第六款或第四條第一項第六款規定配置職員後，基於人力資源需求，報經直轄市、縣（市）主管機關同意後，得依勞動基準法相關規定，以契約進用人員。\n國民小學或國民中學，經直轄市、縣（市）主管機關指定統籌辦理所轄全部或部分學校之部分業務者，直轄市、縣（市）主管機關應依其指定辦理事項之規模，另增置教師員額，或依勞動基準法相關規定，以契約進用人員。\n\n第  8  條\n本準則自發布日施行。\n        </div>","historyClass":"law-history","history":"\n          1. 96年3月21日教育部台參字第0960036864C號令修正發布全文6條。<br/>\n          2. 97年7月4日教育部台參字第0970119596C號令修正發布。<br/>\n          3. 98年10月30日教育部台參字第0980165847C號令修正發布。<br/>\n          4. 100年7月6日教育部臺參字第1000108754C號令修正第3、4、6條101年8月1日施行。<br/>\n          5. 101年10日5日教育部臺參字第1010176706C號令修正發布第3條。<br/>\n          6. 103年3月14日教育部臺教授國部字第 1030013420B號令修正發布第3條條文。<br/>\n          7. 105年8月12日教育部臺教授國部字1050076087B號令修正發布。<br/>\n          8. 106年8月3日教育部臺教授國部字第1060075321B號修正。<br/>\n          9. 中華民國107年7月6日教育部臺教授國部字第 1070076914B號令修正第4條、第4條之一；並自發布日起施行。<br/>\n          10. 中華民國112年12月18日教育部臺教授國部字第 1120174459A號令修正發布全文8條；並自發布日施行。<br/>\n          11. 中華民國115年7月15日教育部臺教授國部字第1155501981A號令修正第3條、第4條、第7條之1；並自發布日施行。\n        "},{"id":"law-06","label":"6. 國民中小學教師授課節數訂定基準","tag":"教育部基準","title":"國民中小學教師授課節數訂定基準","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">教育部(以下簡稱本部)為使各領域專任教師之授課節數一致，並達總量管制之要求，特訂定本基準。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">國民中小學專任教師之授課節數，依授課領域、科目及學校需求，每週安排十六節至二十節為原則，且不得超過二十節之上限。專任教師授課節數應以固定節數為原則，不宜因學校規模大小而不同。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">專任教師兼任導師者，其授課節數與專任教師之差距以四節至六節為原則。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">四、</span><span class=\"doc-copy\">專任教師兼任行政職務，其減授節數之基準由各該主管教育行政機關訂定之。國立師資培育大學附設實驗國民小學專任教師兼任主任行政職務者，每週之授課節數以一節至四節為原則；兼任組長行政職務者，每週之授課節數以七節至十三節為原則。</span></div>\n<div class=\"doc-explanatory doc-intro\">\n            專任教師每週兼課、超時授課及代課節數，除法令另有規定外，依下列原則辦理：\n          </div>\n<div class=\"doc-row doc-level-2 law06-level2-indent\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">兼課（超時授課）復代課節數不包括進修部者，併計以不超過九節為原則。</span></div>\n<div class=\"doc-row doc-level-2 law06-level2-indent\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">兼課（超時授課）復代課節數包括進修部者，併計以不超過十二節為原則。</span></div>\n<div class=\"doc-explanatory doc-followup\">\n            前項規定，如課程不可分割或特殊情形報經各該主管教育行政機關核准者，不在此限。\n          </div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">五、</span><span class=\"doc-copy\">輔導教師負責執行發展性及介入性輔導措施，並協助處遇性輔導措施，以學生輔導工作為主要職責；其授課時數，規定如下：</span></div>\n<div class=\"doc-row doc-level-2 law06-level2-indent\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">專任輔導教師不得排課。但因課務需要教授輔導相關課程者，以不超過教師兼主任之授課節數排課。</span></div>\n<div class=\"doc-row doc-level-2 law06-level2-indent\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">兼任輔導教師之減授節數，國民中學教師以十節為原則，國民小學教師以二節至四節為原則。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">六、</span><span class=\"doc-copy\">國民中小學之人事、會計人員，不論規模大小，不得由教師兼任，其人員之任用，應依國民教育法之規定辦理。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">七、</span><span class=\"doc-copy\">各該主管教育行政機關應訂定不同規模國民中小學之行政組織層級、單位及人員配置，發揮總量管制效益，合理調配專任、兼任及部分時間支援教學之人力，以維教學品質。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">八、</span><span class=\"doc-copy\">中央政府專案補助增置之員額，應優先運用於教師人力缺乏之學校</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">九、</span><span class=\"doc-copy\">各該主管教育行政機關，應依本基準規定及人力、經費等實際狀況，訂定補充規定。</span></div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規沿革】</span>\n          1. 98年8月6日教育部台國(四)字第0980126062B號令。<br/>\n          2. 101年1月20日教育部臺國(四)字第1000234382C號令。<br/>\n          3. 105年4月8日臺教授國部字第1050030051B號令。<br/>\n          4. 114年7月28日教育部臺教授國部字第1145502829A號令修正第四點，並自中華民國114年8月1日生效。\n        "},{"id":"law-07","label":"7. 新北市立國民中學及國民中小學組織規程","tag":"市定規程","title":"新北市立國民中學及國民中小學組織規程","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n第  1  條\n本規程依新北市政府教育局組織規程第九條規定訂定之。\n新北市立國民中學及新北市立國民中小學(以下簡稱各校)之組織，依本規程之規定。\n          \n第  2  條\n各校之校名，應冠以新北市立之名稱。\n          \n第  3  條\n各校置校長一人，承新北市政府教育局(以下簡稱本局)局長之命，綜理校務。 \n          \n第  4  條\n各校設教務處、學生事務處、總務處及輔導室，分別掌理下列事項：\n一、\t教務處：課程發展、課程編排、教學實施、學籍管理、成績評量、教學設備、資訊與網路設備、教具圖書資料供應、教學研究與教學評鑑及與輔導單位配合實施教育輔導等事項。\n二、\t學生事務處：公民教育、民主法治教育、道德教育、生活教育、體育衛生保健、學生團體活動與生活管理及與輔導單位配合實施生活輔導等事項。\n三、\t總務處：學校文書、事務及出納等事項。 \n四、\t輔導室：學生資料蒐集與分析、學生智力、性向與人格測驗、學生學習興趣、成就與志願輔導諮商、特殊教育及親職教育等事項。\n六班以下者，設教導處，掌理前項教務處及學生事務處業務。\n國民中小學之國民小學部(以下簡稱國小部)十三班以上者，增設教導處。\n各校得設進修部辦理國民補習教育及其他有關事項。 \n          \n第  5  條 \n各校得視學校規模大小及校務發展需要，於處、室及部分設教務組、教學組、設備組、教學設備組、註冊組、資訊組、訓育組、生活教育組、體育組、衛生組、體育衛生組、事務組、出納組、文書組、輔導組、學輔組、適性生涯組、特教組、技藝教育組及學習照顧組及教導組。\n\n第  6  條\n各校基於學校自主管理，得依下列基準設各處、室及分設各組辦事：\n一、\t六班以下：設教導處、總務處、輔導室。下設五組。\n二、\t七班至十二班：設教務處、學生事務處、總務處、輔導室。國民中學下設九組，國民中小學下設十組。\n三、\t十三班以上：設教務處、學生事務處、總務處、輔導室。下設十三組。\n前項班級數，於國民中小學，係指其國民中學部及國小部合計之總班級數；依第四條第三項增設之教導處，下設二組。\n除第一項組數外，有下列情形者，其設置基準如下：\n一、各校設技藝教育班者，得視需要於適當處、室設技藝教育組。\n二、設特殊教育班者，得增設特教組，不受第一項組數之限制。\n三、設進修部，二班以下不設組、三班至五班設教導組、六班以上設教務組及訓育組，不受第一項組數之限制。\n          \n第  7  條\n第四條至前條所訂各處、室、部及組別之名稱，各校因實際發展需要，得報本局核准後調整之。\n          \n第  8  條\n各校教職員得置之各類職稱，依國民小學與國民中學班級編制及教職員員額編制準則之規定。\n          \n第  9  條\n各校設會計室者，置主任、佐理員、書記，依法辦理歲計、會計及統計事項；未設會計室者，置會計員，專任或由新北市政府(以下簡稱本府)主計處派員兼任，置專任會計員者，得置書記；未置會計員者，由本府主計處派員兼辦。 \n          \n第  10  條\n各校設人事室者，置主任、助理員、書記，依法辦理人事管理事項；未設人事室者，置人事管理員，專任或由本府人事處派員兼任，置專任人事管理員者，得置書記；未置人事管理員者，由本府人事處派員兼辦。 \n          \n第  11  條\n各校得附設幼兒園，辦理幼兒教育業務，其編制依幼兒教育及照顧法相關規定辦理。\n          \n第  12  條\n各校因實際需要，得報經本局轉陳本府核准後，設分校或分班。\n          \n第  13  條\n各校教職員員額編制基準，由本局另定之；設特殊教育班者，並依高級中等以下學校及幼兒園特殊教育班班級與專責單位設置及人員進用辦法相關規定辦理。\n          \n第  14  條\n各校設校務會議，議決校務重大事項，由校長召集，並為主席。\n校務會議由校長、全體專任教師或教師代表、家長會代表及職工代表組成之，其成員比例由本府定之。\n          \n第  15  條\n各校職員員額編制表，由各校擬訂，報請本局轉陳本府核定，並送考試院備查。\n本規程所列各職稱之官等職等或級別及員額，另以編制表定之。\n各職稱之官等職等，依職務列等表之規定。\n          \n第  16  條\n各校分層負責明細表，由本局定之。\n          \n第  17  條\n本規程自中華民國一百十四年八月一日施行。\n\n        </div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規沿革】</span>\n          1. 99年12月25日北府法規字第0991227588號令。<br/>\n          2. 102年5月8日北府法規字第 1021710699號令。<br/>\n          3. 114年10月29日新北市政府新北府法規字第1142086346 號令修正發布全文 17 條；並自114年8月1日施行。\n        "},{"id":"law-08","label":"8. 新北市立國中及國民中小學教職員員額設置基準","tag":"市定基準","title":"新北市立國民中學及國民中小學教職員員額設置基準","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">本基準依新北市立國民中學及國民中小學組織規程第十三條規定訂定之。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">新北市立國民中學及國民中小學(以下簡稱學校)教職員員額設置如下：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(一)</span><span class=\"doc-copy\">校長：學校置校長一人，專任。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(二)</span><span class=\"doc-copy\">主任：各處、室及分校，置主任一人，除輔導室主任得由教師專任外，其餘由教師兼任。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(三)</span><span class=\"doc-copy\">校務主任：附設國民補習學校，置校務主任一人，由教師兼任。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(四)</span><span class=\"doc-copy\">組長、副組長：各組各置組長一人，除文書、出納及事務三組組長由職員專任外，其餘由教師兼任。六十一班以上者，學生事務處及輔導室得共置副組長一人至三人，均由教師兼任。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(五)</span><span class=\"doc-copy\">教師：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">普通班每班設置二．二人，每九班得增置教師一人，最多增置七人；全校未達九班者，得另增置教師一人。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">特殊教育班(含身心障礙及資賦優異)及藝術才能班每班置三人。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">3.</span><span class=\"doc-copy\">學校設有分校者，得視情形專案報請新北市政府核准後於分校增置教師一人或二人。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">4.</span><span class=\"doc-copy\">國民中小學國小部之教師員額設置依新北市所屬國民小學教職員員額編制基準規定辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(六)</span><span class=\"doc-copy\">專任輔導教師：依學生輔導法及其施行細則規定辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(七)</span><span class=\"doc-copy\">專任運動教練：得依國民體育法等規定置專任運動教練。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(八)</span><span class=\"doc-copy\">幹事、助理員、管理員及書記(不含人事、主計專任人員)：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">三十六班以下者，置二人至九人；三十七班至七十二班者，置三人至十三人；七十三班以上者，置五人至二十人。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">學校幹事、助理員、管理員及書記之配置另依各機關職稱及官等職等員額配置準則相關規定辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(九)</span><span class=\"doc-copy\">圖書館專業人員：至少應置一人，且專業人員占圖書館工作人員之比率應達三分之一；其專業人員，由符合圖書館設立及營運標準規定之教師或職員兼任。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(十)</span><span class=\"doc-copy\">護理師或護士及營養師：依學校衛生法規定辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(十一)</span><span class=\"doc-copy\">住宿生輔導員：山地及偏遠地區學校，學生宿舍有十二人以上住宿生者，得置住宿生輔導員一人；五十人以上住宿生者，得置住宿生輔導員二人。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(十二)</span><span class=\"doc-copy\">人事及主計人員：依人事人員員額設置標準及主計員額設置原則規定辦理。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">偏遠地區國民中學全校學生人數達三十一人以上者，其全校教師員額編制，按教師授課節數滿足學生學習節數定之，不受前點第五款第一目規定之限制；其計算公式，偏遠地區學校全校教師員額＝(全校學生每週學習總節數＋全校教師每週兼任各項職務總減授節數)÷新北市規定專任教師每人每週授課節數。</span></div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規沿革】</span>\n          1. 中華民國102年6月24日新北市政府北府教中字第1022039818號函訂定全文2點；並自即日生效。<br/>\n          2. 中華民國107年5月11日新北市政府新北府教中字第1070624934 號令修正發布第2點條文；並自即日生效。<br/>\n          3. 中華民國109年12月18日新北市政府新北府教中字第 1092200274號令修正發布全文3點，並自即日生效。<br/>\n          4. 中華民國112年8月14日新北市政府新北府教中字第1121567951號令修正發布第2點條文；並自112年8月1日生效。\n        "},{"id":"law-09","label":"9. 新北市國民中學教師每週授課節數補充原則","tag":"市定補充原則","title":"新北市國民中學教師每週授課節數補充原則","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">新北市政府為使新北市國民中學、高級中學附設國中部及國民中小學國中部(以下簡稱學校)之專任教師及兼任導師或行政職務專任教師之授課節數有所依循，訂定本原則。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">專任教師及兼任導師每週基本授課節數核計方式如下：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(一)</span><span class=\"doc-copy\">教師擔任二種領域科目以上而每週授課節數相同者，依附表一各領域科目基本授課節數辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(二)</span><span class=\"doc-copy\">教師擔任二種領域科目以上而每週基本授課節數不同者，應依二者之比例折算每星期基本授課節數。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(三)</span><span class=\"doc-copy\">級導師授課節數，依學校規模(不含分散式資源班及巡迴輔導班)，得酌減授課節數如下：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">該年級班級數在十五班至三十班者：酌減零節至一節。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">該年級班級數在三十班以上者：酌減零節至二節。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(四)</span><span class=\"doc-copy\">導師授課節數不含導師時間。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(五)</span><span class=\"doc-copy\">學校專任教師每週授課節數未依前項規定辦理者，除追繳其溢領鐘點費外並議處相關失職人員。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">兼任行政職務教師每週基本授課節數依附表二及規定辦理。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">四、</span><span class=\"doc-copy\">學校教師協助校務酌減節數依附表三及下列規定辦理：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(一)</span><span class=\"doc-copy\">其分配比例與優先順序，由校務會議決定之，並以擔任童軍團長或協辦學習扶助及實際參與其他重大教育政策推動者，列為優先減授課節數對象。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(二)</span><span class=\"doc-copy\">教師協助校務或各項工作酌減授課節數後之授課節數，於不增加預算情形下，均視為該教師之基本授課節數。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">五、</span><span class=\"doc-copy\">教師超時授課鐘點費核發方式如下(學期中之短期代課者不列入計算)：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(一)</span><span class=\"doc-copy\">教師授課節數超出本補充原則所定每週基本授課節數者，其超時授課節數，得核支超時授課鐘點費；超時授課節數應於開學前註記於課表中，並以平均分散於每日註記為原則。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(二)</span><span class=\"doc-copy\">教師除因公差假未實際授課之超時授課鐘點費由代課教師領取外，應以學校行事曆排定之上課星期數，按每週排定之超時授課節數計算發給，其節數包括適逢國定假日未實際超時授課之節數及學期始(末)未滿一星期之超時授課節數。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(三)</span><span class=\"doc-copy\">整學期兼課、代課者，以學校行事曆安排定上課週數，按每週排定之兼課、代課節數計算之節數發給；其節數包括適逢國定假日未實際兼課、代課之節數及學期始(末)未滿一週之上課節數。但擔任畢業班教師於學校停止上課後之節數，不包括在內。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(四)</span><span class=\"doc-copy\">教師兼課或超時授課，每週不超過六節，代課每週不超過五節，兼課或超時授課復代課併計每週不超過九節，兼課或超時授課復代課節數包括進修部者，併計每週以不超過十二節為原則。但課程不得分割或特殊情形報經新北市政府教育局核准者，不在此限。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(五)</span><span class=\"doc-copy\">學期中之短期代課者不列入計算。非整學期兼課、代課者，依實際授課節數發給。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(六)</span><span class=\"doc-copy\">學校依規定排課核算後，其確有超時授課節數，得於學校人事費項下核實支給鐘點費。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">六、</span><span class=\"doc-copy\">學校主任不得兼任導師；組長以專任教師兼任為原則，必要時得視學校規模(不含分散式資源班及巡迴輔導班)及行政需要由導師兼任之。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">七、</span><span class=\"doc-copy\">學校代理教師每星期授課節數準用本原則。</span></div>\n</div>\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n            附表一：新北市國民中學各領域科目教師每週基本授課節數表\n          </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse\">\n<thead>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<th class=\"p-3 border-r border-slate-300 text-left font-bold min-w-[200px]\" rowspan=\"2\">\n                    學習領域\n                  </th>\n<th class=\"p-2 border-b border-slate-300 text-center font-bold\" colspan=\"2\">\n                    節數\n                  </th>\n</tr>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[100px] w-32 bg-slate-100/50\">\n                    專任教師\n                  </th>\n<th class=\"p-2 text-center font-bold min-w-[100px] w-32 bg-slate-100/50\">\n                    兼任導師\n                  </th>\n</tr>\n</thead>\n<tbody class=\"divide-y divide-slate-200\">\n<tr>\n<td class=\"p-3 border-r border-slate-200 font-medium\">語文領域國語文科</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十六</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十一</td>\n</tr>\n<tr class=\"bg-slate-50/30\">\n<td class=\"p-3 border-r border-slate-200 font-medium\">除語文領域國語文科外，其餘領域科目</td>\n<td class=\"p-3 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">十八</td>\n<td class=\"p-3 text-center font-bold text-emerald-700 text-base\">十三</td>\n</tr>\n<tr class=\"bg-slate-50 border-t border-slate-300\">\n<td class=\"p-4 text-xs leading-relaxed text-slate-700\" colspan=\"3\">\n<span class=\"font-bold text-slate-900 block mb-1\">備註：</span>\n<ol class=\"list-decimal pl-5 space-y-1.5\">\n<li>表內數字單位均以節計。</li>\n<li>教師擔任二種以上不同基本授課節數科目者，應依二者比例折算該教師每週基本授課節數。折算公式：「配授課基本授課節數等於配授科目標準節數乘(主授科目標準時數減主授科目實際編排時數)除以主授科目標準節數」，其中主授科目係指教師於校內獲聘任之科目。</li>\n<li>特殊教育教師基本授課節數應依照「新北市立高級中等以下學校與幼兒園及特殊教育學校特殊教育教師每週教學節數標準」規定辦理。</li>\n</ol>\n</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n            附表二：新北市國民中學兼任行政職務教師每週基本授課節數表\n          </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse\">\n<thead>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<th class=\"p-3 border-r border-slate-300 font-normal relative min-w-[130px] w-36 text-left align-top bg-gradient-to-tr from-slate-100 to-white\">\n<div class=\"flex justify-between items-start text-xs text-slate-600\">\n<span class=\"font-medium\">節數</span>\n<span class=\"font-medium pr-1\">班數</span>\n</div>\n<div class=\"text-xs text-slate-700 font-semibold mt-4\">\n                      職別\n                    </div>\n</th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    十七班<br/>以下\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    十八班<br/>至<br/>二十六班\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    二十七班<br/>至<br/>三十五班\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    三十六班<br/>至<br/>四十四班\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    四十五班<br/>至<br/>五十三班\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    五十四班<br/>至<br/>六十班\n                  </th>\n<th class=\"p-2 border-r border-slate-300 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    六十一班<br/>至<br/>六十二班\n                  </th>\n<th class=\"p-2 text-center font-bold min-w-[50px] bg-slate-100/50\">\n                    六十三班<br/>以上\n                  </th>\n</tr>\n</thead>\n<tbody class=\"divide-y divide-slate-200\">\n<tr>\n<td class=\"p-3 border-r border-slate-200 font-medium bg-slate-50/30\">\n                    兼任主任\n                  </td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">二</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">二</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">二</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">一</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-blue-700 text-base\">一</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-emerald-700 text-base\">○</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-emerald-700 text-base\">○</td>\n<td class=\"p-2 text-center font-bold text-emerald-700 text-base\">○</td>\n</tr>\n<tr class=\"bg-slate-50/20\">\n<td class=\"p-3 border-r border-slate-200 font-medium bg-slate-50/30\">\n                    兼任組長\n                  </td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">六</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">六</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">六</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">四</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">四</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">二</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold text-slate-800 text-base\">二</td>\n<td class=\"p-2 text-center font-bold text-emerald-700 text-base\">○</td>\n</tr>\n<tr>\n<td class=\"p-3 border-r border-slate-200 font-medium bg-slate-50/30\">\n                    兼任副組長\n                  </td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-center font-bold tex e-300 font-medium\">九十班<br/>至<br/>九十九班</th>\n<th class=\"p-1 font-medium\">一百班<br/>以上</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"bg-slate-50/20 divide-x divide-slate-200\">\n<td class=\"p-3 font-bold text-slate-800 text-left bg-slate-50/50\">\n                    減授節數\n                  </td>\n<td class=\"p-2 font-bold text-blue-700\">十二</td>\n<td class=\"p-2 font-bold text-blue-700\">十五</td>\n<td class=\"p-2 font-bold text-blue-700\">十八</td>\n<td class=\"p-2 font-bold text-blue-700\">二十四</td>\n<td class=\"p-2 font-bold text-blue-700\">三十</td>\n<td class=\"p-2 font-bold text-blue-700\">四十二</td>\n<td class=\"p-2 font-bold text-blue-700\">五十四</td>\n<td class=\"p-2 font-bold text-blue-700\">六十</td>\n<td class=\"p-2 font-bold text-blue-700\">六十六</td>\n<td class=\"p-2 font-bold text-blue-700\">七十二</td>\n<td class=\"p-2 font-bold text-blue-700\">七十八</td>\n<td class=\"p-2 font-bold text-blue-700\">八十四</td>\n</tr>\n<tr class=\"bg-slate-50 border-t border-slate-300 text-left\">\n<td class=\"p-4 text-xs leading-relaxed text-slate-700\" colspan=\"13\">\n<span class=\"font-bold text-slate-900 block mb-1\">備註：</span>\n<ol class=\"list-decimal pl-5 space-y-1.5\">\n<li>表內數字單位均以節計。</li>\n<li>總班級數包含普通班、體育班、藝術才能班、慈暉班、中途班、集中式特教班及附設幼兒園。</li>\n</ol>\n</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規沿革】</span>\n          1. 中華民國103年11月11日新北市政府北府教中字第 1032105226號令訂定發布全文7點；並自即日生效。<br/>\n          2. 中華民國108年8月15日新北市政府新北府教中字第 1081315865 號令修正發布第2、4點條文；並自即日生效。<br/>\n          3. 中華民國111年8月12日新北市政府新北府教中字第 1111492078號令修正發布第2點條文；並自即日生效。<br/>\n          4. 中華民國115年7月20日新北市政府新北府教中字第 1151365961號令修正發布第2點條文之附表一；並自即日生效。\n        "},{"id":"law-10","label":"10. 教師授課排配課折算公式函釋及範例","tag":"重要令釋","title":"各校於94學年度起教師授課排配課折算請確依折算公式計算","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            主旨：各校於94學年度起教師授課排配課折算請確依折算公式計算，其主授科目係指教師獲聘任之科目，至第二、三科之配授科目則應依其授課節數多寡為其排序，另為兼顧學生學習權益及教師教學準備，請儘量減少排配授至第三科任教。\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            說明：\n          </div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">依審計部臺灣省臺北縣審計室94年7月5日審北縣貳字第0940006029號函辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">折算公式：「配授課程節數等於配授科目標準時數乘(主授科目標準時數減主授科目實際編排時數)除以主授科目標準時數」，其中主授科目係指教師於校內獲聘任之科目，如需配授至三科以上，仍請依該師授課節數多寡為其認定第二、三科配授科目。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">以國文專任教師為例：依規定應排18節國文課，如僅配授國文10節，再搭配健體領域及藝術與人文領域等三種不同科目標準時數之科目，以國文與健體領域授課時數依上述折算後，得出健體領域需配以9節，如健體排配時數為6節，則所減授之3節，再以健體與藝文領域之授課時數折算，得出需配授藝文領域課程3節；如將藝文領域配以6節課，則需先將國文與藝文領域折算得出需配授10節，所減授之4節，再以藝文與健體領域標準時數折算，得出需配授健體領域4節課。</span></div>\n<div class=\"font-semibold text-slate-900 mt-4 doc-explanatory doc-explanatory-doc-level-1\">\n            ※配課時數折算範例說明：\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-2\">\n            以國文專任教師為例：依規定應排18節國文課\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-2\">\n            若僅配授國文10節，再搭配健體領域及藝術與人文領域\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-3\">\n            搭配健體：21×(18-10)/18＝9.3 (配授健體9節)\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-3\">\n            搭配藝文：22×(18-10)/18＝9.7 (配授藝文10節)\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-3\">\n            搭配健體6節再搭配藝文：22×(9-6)/21＝3.1 (配授藝文3節)\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-3\">\n            搭配藝文6節再搭配健體：21×(10-6)/22＝3.8 (配授健體4節)\n          </div>\n</div>\n<div class=\"mt-6 border border-slate-300 rounded-xl overflow-hidden shadow-sm bg-white\">\n<div class=\"bg-slate-100 px-4 py-2 border-b border-slate-300 font-bold text-sm text-slate-800\">\n            配課折算對照表\n          </div>\n<div class=\"overflow-x-auto\">\n<table class=\"w-full text-xs md:text-sm text-slate-800 border-collapse text-center\">\n<thead>\n<tr class=\"bg-slate-50 border-b border-slate-300\">\n<th class=\"p-3 border-r border-slate-300 font-bold min-w-[90px] bg-slate-100/50\">項目</th>\n<th class=\"p-3 border-r border-slate-300 font-bold min-w-[90px]\">未配課</th>\n<th class=\"p-3 border-r border-slate-300 font-bold min-w-[90px]\">1.</th>\n<th class=\"p-3 border-r border-slate-300 font-bold min-w-[90px]\">2.</th>\n<th class=\"p-3 border-r border-slate-300 font-bold min-w-[90px]\">3.</th>\n<th class=\"p-3 font-bold min-w-[90px]\">4.</th>\n</tr>\n</thead>\n<tbody class=\"divide-y divide-slate-200\">\n<tr>\n<td class=\"p-2 border-r border-slate-200 font-medium bg-slate-50/50\">主授科目</td>\n<td class=\"p-2 border-r border-slate-200\">國文18節</td>\n<td class=\"p-2 border-r border-slate-200\">國文10節</td>\n<td class=\"p-2 border-r border-slate-200\">國文10節</td>\n<td class=\"p-2 border-r border-slate-200\">國文10節</td>\n<td class=\"p-2\">國文10節</td>\n</tr>\n<tr class=\"bg-slate-50/20\">\n<td class=\"p-2 border-r border-slate-200 font-medium bg-slate-50/50\">配授科目一</td>\n<td class=\"p-2 border-r border-slate-200 text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200\">健體 9節</td>\n<td class=\"p-2 border-r border-slate-200\">藝文10節</td>\n<td class=\"p-2 border-r border-slate-200\">健體 6節</td>\n<td class=\"p-2\">藝文 6節</td>\n</tr>\n<tr>\n<td class=\"p-2 border-r border-slate-200 font-medium bg-slate-50/50\">配授科目二</td>\n<td class=\"p-2 border-r border-slate-200 text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200 text-slate-300\">-</td>\n<td class=\"p-2 border-r border-slate-200\">藝文 3節</td>\n<td class=\"p-2\">健體 4節</td>\n</tr>\n<tr class=\"bg-blue-50/40 border-t border-slate-300 font-bold\">\n<td class=\"p-2 border-r border-slate-200 text-blue-900 bg-blue-100/50\">合計</td>\n<td class=\"p-2 border-r border-slate-200 text-blue-700\">共授18節</td>\n<td class=\"p-2 border-r border-slate-200 text-blue-700\">共授19節</td>\n<td class=\"p-2 border-r border-slate-200 text-blue-700\">共授20節</td>\n<td class=\"p-2 border-r border-slate-200 text-blue-700\">共授19節</td>\n<td class=\"p-2 text-blue-700\">共授20節</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          94年8月30日北府教學字第0940603197號\n        "},{"id":"law-11","label":"11. 專任教師協助校務酌減時數折算函釋","tag":"重要函釋","title":"專任教師如協助校務酌減時數折算函釋","sectionClass":"space-y-4","headerClass":"border-b border-slate-200 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2","body":"<div class=\"text-sm md:text-base text-slate-700 space-y-3 leading-relaxed whitespace-pre-line\">\n專任教師如協助校務酌減時數，請先以專任教師之各科授課標準時數折算後，再行扣除減授時數。\n(依審計部臺灣省臺北縣審計室95年12月5日審北縣(二)字第950010273號函辦理)\n        </div>","historyClass":"law-history","history":"95年12月26日北府教學字第0950871476號。"},{"id":"law-12","label":"12. 重申各國民中學教師授課排配課確依折算公式計算函釋","tag":"重要令釋","title":"重申各國民中學教師授課之排配課請確依折算公式計算","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            主旨：重申各國民中學教師授課之排配課請確依折算公式計算。\n          </div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            說明：\n          </div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">依審計部臺灣省臺北縣審計室97年7月25日審北縣二字第0970001990號函辦理。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">教師授課之排配課折算，請各校確依本府94年8月30日北府教學字第0940603197號函規定辦理。折算公式為「配授課程節數等於配授科目標準時數乘(主授科目標準時數減主授科目實際編排時數)除以主授科目標準時數」，以符公平原則。</span></div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          97年8月1日北教國字第0970569602號。\n        "},{"id":"law-13","label":"13. 有關國民中小學兼任輔導教師減課規定函釋","tag":"重要令釋","title":"有關國民中小學兼任輔導教師減課一案","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">兼任輔導教師專責執行局訂學生輔導工作之節數規劃及課表安排：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(一)</span><span class=\"doc-copy\">兼任輔導教師之授課及專責執行局訂學生輔導工作之節數皆須納入課表。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(二)</span><span class=\"doc-copy\">兼任輔導教師每人每週依其減授節數執行學生輔導工作。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">(三)</span><span class=\"doc-copy\">兼任輔導教師週四下午不得安排授課及專責執行局訂學生輔導工作。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">國小兼任輔導教師減授課規定：</span></div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-2\">\n            國小兼任輔導教師24班以下學校法定編制1人執行6節之規定，一律調整為設置2人共執行6節學生輔導工作；兼任輔導教師專責執行學生輔導工作時數最低限為2節、最高限為6節，需介於此區間。\n          </div>\n<div class=\"text-slate-600 doc-explanatory doc-explanatory-doc-level-2\">\n            舉例說明：如某校兼任輔導教師法定編制人數3人，總專責執行學生輔導工作時數3*6=18節，學校擬聘4位兼輔，可調整為A師專責執行2節、B師專責執行4節、C師專責執行6節、D師專責執行6節(高於法定編制人數且專責執行時數介於2~6節之間)等方式因應。\n          </div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">國中兼任輔導教師減授課規定：</span></div>\n<div class=\"doc-explanatory doc-explanatory-doc-level-2\">\n            國中兼任輔導教師之減授節數，國民中學教師以十節為原則。\n          </div>\n<div class=\"text-slate-600 doc-explanatory doc-explanatory-doc-level-2\">\n            例如：兼任輔導教師教綜合領域輔導活動課，其授課節數為20-10=10節；兼任輔導教師教國文課，其授課節數為16-10=6節；兼任輔導教師教歷史課，其授課節數為18-10=8節。\n          </div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          1. 104年6月4日新北教特字第1041032888號函。<br/>\n          2. 104年6月4日新北教特字第10410328881號函。\n        "},{"id":"law-14","label":"14. 導師協助行政減課以一種為限函釋","tag":"重要令釋","title":"為避免日後導師協助行政之減課疑義規定","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            為避免日後導師協助行政之減課疑義，國中教師以兼任一種職務為原則，學校如因特殊需要致教師須協助2種以上工作時，減授基本授課節數以1種為限。\n          </div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          1. 95年3月8日北府教學字第0950091451號。<br/>\n          2. 97年8月20日北教國字第0970530821號。<br/>\n          3. 109年4月14日新北教研資字第10906033681號。\n        "},{"id":"law-15","label":"15. 兼職教師授課時數班級數認定函釋","tag":"重要令釋","title":"有關兼職教師授課時數之班級數認定一案","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc law15-format text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\">\n<span class=\"doc-marker\">一、</span>\n<span class=\"doc-copy\">「臺北縣國民中學兼職教師授課時數」中有關主任、組長及副組長之授課時數，參照本府87年8月10日八七北府教一字第239336號函，及「臺北縣立國民中學教師員額編制作業要點」第4點規定，所謂「班級數」之計算包含特教班。</span>\n</div>\n<div class=\"doc-row doc-level-1\">\n<span class=\"doc-marker\">二、</span>\n<span class=\"doc-copy\">級導師部份，依規定該年級班級數在15~30班者，酌減0~1節。惟特殊教育班不同於普通班級型態，且參照「臺北縣政府所屬國民中小學導師制實施要點」第5點略以：「國中同一年級在3班以上，每一年級應設級導師…」之精神，故該年級班級數之計算不含特教班。</span>\n</div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          94年11月17日北府教學字第0940774865號。\n        "},{"id":"law-16","label":"16. 兼任員生社職務不得減課函釋","tag":"重要令釋","title":"兼任員生社理事主席、經理、會計之老師不得減少授課時數規定","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-explanatory doc-explanatory-doc-level-1\">\n            兼任員生社理事主席、經理、會計之老師不得減少授課時數。\n          </div>\n</div>","historyClass":"law-history rounded-lg mt-6","history":"\n<span class=\"font-bold text-slate-700 block mb-1\">【法規令釋字號】</span>\n          82年5月8日82北府社2字第158047號。\n        "},{"id":"law-17","label":"17. 專任運動教練績效評量基準","tag":"體育局基準","title":"新北市政府體育局辦理新北市所屬各級學校專任運動教練績效評量基準","sectionClass":"space-y-4","headerClass":"border-b-2 border-slate-900 pb-3","h2Class":"text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug","body":"<div class=\"official-doc text-sm md:text-base pt-2\">\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">一、</span><span class=\"doc-copy\">新北市政府體育局(以下簡稱本局)為規範新北市所屬各級學校(以下簡稱學校)專任運動教練績效評量，並辦理教練之績效評量相關事宜，特定訂定本基準。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">二、</span><span class=\"doc-copy\">為辦理專任運動教練之績效評量，本局設新北市專任運動教練績效評量委員會(以下簡稱本會)，任務如下：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">訂定有關教練績效評量之作業程序。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">依各級學校專任運動教練績效評量組織及審議準則擬訂有關教練績效評量之基準。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（三）</span><span class=\"doc-copy\">評量有關教練之訓練、指導、專項運動推廣績效及服務成績。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（四）</span><span class=\"doc-copy\">其他有關教練評量事項之審議。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">三、</span><span class=\"doc-copy\">學校專任運動教練(以下簡稱專任運動教練)每任用滿三個成績考核學年度，應接受績效評量，並於規定期限內，檢附三學年度內相關證明文件辦理績效評量。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">四、</span><span class=\"doc-copy\">專任運動教練指導參賽成績以每年八月一日起至隔年七月三十一日止所舉辦之各項正式比賽計算，比賽日期逾每年七月三十一日，列為次學年度成績計算。</span></div>\n<div class=\"doc-row doc-level-1\"><span class=\"doc-marker\">五、</span><span class=\"doc-copy\">專任運動教練之績效評量，分為訓練指導績效、專項運動推廣績效及年度成績考核三大評量類別，評量要項及配分比率規定如下：</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（一）</span><span class=\"doc-copy\">國民小學：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">訓練指導績效：以下評量要項給分比例最高占總績效評量百分之三十五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（1）</span><span class=\"doc-copy\">經教育部體育署核定並經本會認定之國際正式比賽，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（2）</span><span class=\"doc-copy\">經教育部體育署核定並經本會認定之全國正式比賽，其給分比例上限為百分之四十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（3）</span><span class=\"doc-copy\">經本局核定並經本會認定之本市正式比賽，其給分比例上限為百分之七十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（4）</span><span class=\"doc-copy\">指導選手入選國家代表隊，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（5）</span><span class=\"doc-copy\">支援國家代表隊培訓工作，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（6）</span><span class=\"doc-copy\">有具體事實，執行工作績效卓著時，得專案加分(採外加制)，其給分比例不超過訓練指導績效總成績百分之十。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">專項運動推廣績效：占總績效評量百分之五十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（1）</span><span class=\"doc-copy\">教練輔導學生畢業後繼續從事專項運動銜接之績效，其給分比例為百分之四十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（2）</span><span class=\"doc-copy\">有具體事實，協助專項運動社團組成與運作及支援專項運動賽會之工作，其給分比例為百分之三十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（3）</span><span class=\"doc-copy\">有具體事實，協助學校推動每週一百五十分鐘課間活動，其給分比例為百分之二十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（4）</span><span class=\"doc-copy\">有具體事實並提出相關證明，參加運動科學研習會修習運動科學相關課程達每學年度十八小時以上，且應用於訓練工作，其給分比例為百分之十。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">3.</span><span class=\"doc-copy\">年度成績考核：占總績效評量百分之十五。</span></div>\n<div class=\"doc-row doc-level-2\"><span class=\"doc-marker\">（二）</span><span class=\"doc-copy\">國民中學：</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">1.</span><span class=\"doc-copy\">訓練指導績效：以下評量要項給分比例最高占總績效評量百分之五十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（1）</span><span class=\"doc-copy\">經教育部體育署核定並經本會認定之國際正式比賽，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（2）</span><span class=\"doc-copy\">經教育部體育署核定並經本會認定之全國正式比賽，其給分比例上限為百分之六十。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（3）</span><span class=\"doc-copy\">經本局核定並經本會認定之本市正式比賽，其給分比例上限為百分之四十五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（4）</span><span class=\"doc-copy\">指導選手入選國家代表隊，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（5）</span><span class=\"doc-copy\">支援國家代表隊培訓工作，其給分比例上限為百分之五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（6）</span><span class=\"doc-copy\">有具體事實，執行工作績效卓著時，得專案加分(採外加制)，其給分比例不超過訓練指導績效總成績百分之十。</span></div>\n<div class=\"doc-row doc-level-3\"><span class=\"doc-marker\">2.</span><span class=\"doc-copy\">專項運動推廣績效：占總績效評量百分之三十五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（1）</span><span class=\"doc-copy\">教練輔導學生畢業後繼續從事專項運動銜接之績效，其給分比例為百分之三十五。</span></div>\n<div class=\"doc-row doc-level-4\"><span class=\"doc-marker\">（2）</span><span class=\"doc-copy\">有具體事實，協助專項運動社團組成與運作及支援專項運動賽會之工作，其給分比例為百分之三十五。</span></div>\n<div class=\"do
