        content: `<strong>第 1 條</strong>
本準則依高級中等學校組織設置及員額編制標準(以下簡稱本標準)第十一條第一項及新北市政府教育局組織規程第九條規定訂定之。

<strong>第 2 條</strong>
本準則所稱高級中等學校(以下簡稱學校)，係指新北市立普通型學校、技術型學校及綜合型學校。

<strong>第 3 條</strong>
學校置校長一人，專任，綜理校務。
學校四十一班以上者，得置副校長一人，襄助校長處理校務，由校長就曾任一級單位主管以上人員聘兼之。

<strong>第 4 條</strong>
學校應設一級單位，其掌理事項如下：
教務處：辦理課程編排、教學實施、教學研究、學籍管理、成績評量、招生、教學設備與教具圖書資料供應及配合實施教育輔導等事項。
學生事務處：辦理民主法治教育、道德教育、生活教育、體育衛生保健與團體活動、校園性別事件、防制校園霸凌因應小組及配合實施生活輔導等事項。
總務處：辦理文書、檔案管理、公文管理、事務、出納、工友管理、物品採購、營建修繕及財產管理等事項。
輔導處(室)：辦理學生生活輔導、心理諮商輔導及生涯輔導等事項。
圖書館：辦理圖書購置、分編、典藏、閱覽、利用及推廣教育等事項。
技術型學校應設實習處，辦理學生實習、技能檢定、學生就業輔導、建教合作及其他有關事項。但設有建教合作處者，由該處辦理建教合作事項。
綜合型學校或設有專業群、科、學程之普通型學校，亦得設置實習處或建教合作處，辦理前項事項。
學校得視類型、校務發展需要及規模大小，增設下列一級單位；其設置基準及掌理事項如下：
特殊教育處：特殊教育班十八班以上者，得設置；辦理特殊教育及其他有關事項。
建教合作處：建教合作班十八班以上者，得設置；辦理建教合作及其他有關事項。
進修部：辦理進修教育者，得設置；辦理進修教育及其他有關事項。
資訊室：得視業務需要設置；辦理資訊業務及其他有關事項。
研究發展處：得視業務需要設置；辦理研究發展及其他有關事項。
技術交流處：得視業務需要設置；辦理技術交流及其他有關事項。
學校得依校務發展需要，自行調整各處(室、館、部)之掌理事項。

<strong>第 5 條</strong>
學校設二級單位(組、科或學程)辦事，並得基於自主管理原則及需要，訂定組別及組數。但不得超過下列基準：
普通型及綜合型學校：
二十班以下：十二組。
二十一班以上：十五組。
技術型學校：
四十八班以下：十三組。
四十九班以上：十五組。
除前項組數外，有下列情形者，其設置基準如下：
附設國民中學部(以下簡稱國中部)，學校班級總數，應包括附設國中部，並得增設四組，不受前項規定之限制。
普通型學校附設專業群、科、學程，得另增設二組，不受前項規定之限制。
普通型學校設有綜合高中學程十二班以上，得設綜合高中組。
設有特殊教育班，得於教務處或輔導處(室)設特教組。
技術型學校辦理實用技能學程六班以上，得視實際需要，於適當單位增設實用技能組。
設進修部，得視學校規模大小(班級數得併計國民中學附設補習學校班級數)及校務發展需要，增設教務、教學、註冊、學生事務、生活輔導、衛生或實習輔導各組，不受前項規定之限制。但增設組數不得超過下列基準：
五班以下：一組。
六班至九班：二組。
十班至十五班：四組。
十六班以上：五組。

<strong>第 6 條</strong>
學校置教師、專任輔導教師、導師、秘書、主任、組長、科主任、學程主任及軍訓教官；其員額編制，依本標準第七條、第八條及第十二條規定。
學校兼行政職務人員之進用方式如下：
學校未置副校長者，得置秘書一人，由校長就編制內專任教師聘兼之。
一級單位主任及二級單位科主任、學程主任，除總務處之主任得由教師兼任或職員專任外，其餘均由校長就專任教師聘兼之。
輔導處(室)置主任一人，由校長就專任輔導教師聘兼之。如因業務設組，其組長由校長就具輔導知能之專任教師聘兼之。
圖書館置主任一人，由校長遴選具有專業知能之人員專任，必要時得由校長就具有專業知能之專任教師聘兼之。
二級單位組長，除總務處之組長由職員專任、學生事務處負責生活輔導業務之組長得由具輔導知能之人員兼任外，其餘由校長就專任教師聘兼之或由職員專任。

<strong>第 7 條</strong>
學校置幹事、技士、助理員、技佐、電器管理員、管理員、書記等職員；其員額編制，依本標準第八條及第十二條規定。
前項學校職員數，得依學校分布情形或學生人數多寡，視財政狀況及實際業務需要，依新北市政府(以下簡稱本府)年度預算，以不逾學校教職員員額總數百分之二十五編列。但本準則施行前已進用之職員，不受員額總數比率之限制，得繼續任職至離職為止。
學校置醫師、營養師、護理師(或護士)等醫事人員，其員額編制，依本標準第八條及第十二條規定。
學校得依本標準第八條規定，置專任運動教練，並聘(僱)用救生員或運動傷害防護員。

<strong>第 8 條</strong>
學校設人事室或置人事管理員；其設人事室者，置主任一人，得置組員、助理員或書記若干人，依法辦理人事管理事項；其設置，依人事機構設置有關規定辦理。

<strong>第 9 條</strong>
學校設會計室或置會計員；其設會計室者，置主任一人，得置組員、佐理員或書記若干人，依法辦理歲計、會計及統計事項；其設置，依主計機構設置有關規定辦理。

<strong>第 10 條</strong>
學校附設國中部、國民小學部者，其組織及員額編制，依國民教育法相關規定辦理。

<strong>第 11 條</strong>
學校附設幼兒園者，其組織及員額編制，依幼兒教育及照顧法相關規定辦理。

<strong>第 12 條</strong>
學校設立分校、分部者，應依高級中等教育法相關規定辦理。

<strong>第 13 條</strong>
本準則所列各職稱之官等職等或級別及員額，另以編制表定之。
各職稱之官等職等，依職務列等表之規定。

<strong>第 14 條</strong>
學校職員員額編制表，由學校擬訂，報本府教育局(以下簡稱本局)轉陳本府核定，並送考試院備查。

<strong>第 15 條</strong>
學校分層負責明細表，由學校訂定，報本局備查。

<strong>第 16 條</strong>
本準則自中華民國一百十三年二月一日施行。`

        content: `<strong>第 1 條</strong>

<strong>第 8 條（職員員額編制）</strong>
幹事、助理員、管理員、書記、技士、技佐、電器管理員、醫師、營養師、護理師之設置基準規定。

    let currentLawId = "law-01";

    function selectLaw(id) {
      currentLawId = id;
      renderMenu();
      renderContent();
      // 在小螢幕點擊時自動平滑滾動到右側條文頂端
      if (window.innerWidth < 1024) {
        document.getElementById('law-content-display').scrollIntoView({ behavior: 'smooth' });
      }
    }

    function renderMenu() {
      const menuContainer = document.getElementById('law-menu');
      menuContainer.innerHTML = lawsDatabase.map(item => {
        const isActive = item.id === currentLawId;
        return `
          <button 
            onclick="selectLaw('${item.id}')"
            class="w-full text-left p-2.5 rounded-xl transition flex items-center justify-between ${
              isActive 
                ? 'bg-blue-600 text-white font-bold shadow-sm' 
                : 'text-slate-700 hover:bg-slate-100'
            }">
            <span class="truncate pr-2">${item.title}</span>
            <i class="fa-solid fa-angle-right text-[10px] ${isActive ? 'text-white' : 'text-slate-400'}"></i>
          </button>
        `;
      }).join('');
    }

    function renderContent() {
      const law = lawsDatabase.find(item => item.id === currentLawId);
      const displayContainer = document.getElementById('law-content-display');

      if (!law) return;

      displayContainer.innerHTML = `
        <div class="space-y-4">
          <div class="border-b border-slate-200 pb-4">
            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-blue-50 text-blue-700 border border-blue-200">
              ${law.type}
            </span>
            <h2 class="text-xl md:text-2xl font-bold text-slate-900 mt-2 leading-snug">
              ${law.title}
            </h2>
          </div>

          <!-- 法規主體條文 -->
          <div class="text-sm md:text-base text-slate-700 space-y-4 leading-relaxed whitespace-pre-line font-normal">
            ${law.content}
          </div>

          <!-- 歷史沿革 -->
          ${law.history ? `
            <div class="law-history rounded-lg">
              <span class="font-bold text-slate-700 block mb-1">【法規沿革與令釋字號】</span>
              \${law.history}
            </div>
          ` : ''}
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderMenu();
      renderContent();
    });
  </script>
