const laws = [{"title":"國民小學及國民中學常態編班及分組學習準則","content":"第  1  條\n本準則依國民教育法第三十九條第一項規定訂定之。\n第  2  條\n公私立國民小學及國民中學(以下簡稱國中小)之編班及分組學習，除特殊教育法、藝術教育法或其他法律另有規定外，依本準則之規定。\n第  3  條\n本準則用詞，定義如下：\n常態編班：指於同一年級內，以隨機原則將學生安排於班級就讀之編班方式。\n分組學習：指依學生之學習成就、興趣、性向、能力等特性差異，將特性相近之學生集合為一組，實施適性化或個別化之學習。\n第  4  條\n國中小各年級，應實施常態編班；學生有下列情形之一者，學校得依其規定辦理編班：\n學校依校園霸凌防制準則或校園性侵害性騷擾或性霸凌防治準則規定，學生有調整班級之必要，報直轄市、縣(市)主管機關備查。\n多胞胎者，得依其法定代理人需求，編於同一班級或分開編班。\n教師與其子女，應以編配於不同班級為原則。\n有前項第一款情形或因教育輔導需要，學生得透過轉班作業程序申請調整班級，其程序由直轄市、縣(市)主管機關納入補充規定。\n國中小各年級應維持原有編班。但國民小學(以下簡稱國小)三年級及五年級或另有增減班情形者，不在此限。\n第  5  條\n直轄市、縣(市)主管機關應成立國中小常態編班推動委員會(以下簡稱編班推動委員會)，負責推動國中小之常態編班。\n前項編班推動委員會置委員十一人至十七人，其中一人為主任委員，由教育局(處)長兼任；其餘委員由教育局(處)人員、國中小校長、地方教師會代表、學生家長會代表及學者專家組成；其中地方教師會代表、學生家長會代表各不得少於委員總人數之三分之一。\n第一項編班推動委員會置執行秘書一人，由主任委員指定教育局(處)科長或督學擔任。\n第  6  條\n國中小學生之編班，由直轄市、縣(市)主管機關辦理或由其指定學校或核定各校自行辦理；其編班方式如下：\n國民中學(以下簡稱國中)新生之編班得採測驗再依成績高低順序以S型排列，或採公開抽籤方式，或採電腦亂數方式為依據，分配就讀班級。\n國小新生之編班得採公開抽籤方式，或採電腦亂數方式為依據，分配就讀班級。\n國小二年級、四年級、六年級與國中二年級、三年級因增減班需重新編班，或國小三年級、五年級需重新編班者，得採測驗再依成績高低順序以S型排列，或採公開抽籤方式，或採電腦亂數方式為依據，分配就讀班級。\n編班後補報到之新生或轉學生，優先編入學生人數較少之班級；班級人數相同時，採公開抽籤方式分配就讀班級。因身心障礙學生就讀普通班減少之班級人數，應併入該班人數計算。\n前項第一款或第二款國中小新生之編班由各校自行辦理者，各校應事先公告，並通知全體新生家長參觀編班作業，直轄市、縣(市)主管機關並應派員到校督導。\n學校於各班學生編班作業完成後，應立即將學生編班名冊(包括就讀班級及姓名)於校內公告至少十五日，並自公告日起七日內以公開抽籤方式編配導師(級任教師)，抽籤時應邀請學校教師會代表(無教師會者，由年級教師代表)及學生家長會代表出席。\n第  7  條\n學校於導師編配完成後，應立即於校內公告至少十五日，學期內班級學生有異動者，亦應隨時更新並於校內公告至少十五日。\n國中小應將常態編班及導師編配過程之測驗成績、電腦亂數表、導師抽籤及編班結果等相關資料，妥為保存至少三年，以備查考。\n第  8  條\n國中小之分組學習，以班級內實施為原則。但國中二年級、三年級得就下列領域，以二班或三班為一組群，依學生學習特性，實施年級內之分組學習：\n國中二年級得就英語、數學領域，分別實施分組學習。\n國中三年級得就英語、數學、自然科學領域，分別實施分組學習；其中數學及自然科學領域，得合併為同一組。\n前項年級內分組學習之實施，應由學校邀請該校教師會代表(無教師會者，由各該年級教師代表)、學生家長會代表及學校行政人員共同訂定計畫，報直轄市、縣(市)主管機關備查。\n第  9  條\n國中小辦理社團活動時，得不受本準則之限制，不同年級、班級之學生得自由參加，以發展多元能力，深化學習成果。\n第  10  條\n直轄市、縣(市)主管機關及學校，應採行具體措施加強與教師、學生及其法定代理人溝通，使其瞭解學校實施常態編班及分組學習之精神與措施，以確保學生均能獲得良好之學習效果。\n第  11  條\n編班推動委員會應規劃評鑑制度，評鑑各國中小常態編班執行成效，並於每學年度結束前提出報告。\n編班推動委員會得依前項評鑑報告，針對各校之執行成效，建請直轄市、縣(市)主管機關辦理獎懲。\n第  12  條\n公立國中小實施常態編班及分組學習情形應列為校務評鑑、校長成績考核及校長遴選之重要參據，學校違反本準則規定者，校長及學校相關人員應依法令規定議處。\n私立國中小違反本準則規定者，直轄市、縣(市)主管機關應立即依私立學校法及相關規定處理。\n第  13  條\n直轄市、縣(市)主管機關為實施本準則規定事項，得另訂定補充規定，並報中央主管機關備查。\n第  14  條\n本準則自發布日施行。","history":"1.98年7月14日教育部台參字第0980115271C號令修正第6條條文。\n2.中華民國112年12月12日教育部臺教授國部字第1120155794A號令修正發布全文14條；並自發布日施行。"},{"title":"高級中等學校學生編班及轉班作業原則","content":"一、教育部為協助高級中等學校（以下簡稱學校）依高級中等教育法第一條、第三十六條及高級中等學校學生學籍管理辦法第二條第二項規定，落實十二年國民基本教育政策，培養五育均衡發展的優質公民，並鼓勵學生奮發向上之求學精神，特訂定本原則。\n二、學校編班及轉班（群、科、學程）作業，應以學生為學習主體，依學生特性協助其探索生涯進路，引導其發展多元智能，並發展學校辦學特色以提升教學品質，同時給予每位學生同等之關懷及尊重，提供適性及優質之教育環境。\n三、學校應成立編班及轉班委員會，委員由行政人員、教師代表及學生家長代表組成，由校長擔任主任委員，辦理學生編班及轉班（群、科、學程）作業。\n四、各校編班及轉班委員會應依本原則訂定編班及轉班（群、科、學程）作業規定，其內容應包括學生申請條件、編班與轉班（群、科、學程）辦理方式、運作程序、申訴處理及相關事項。\n五、各班級人數，宜符合各該主管機關之規定為原則；班級師資之配置，應依各該主管機關所定學校組織規程及員額編制規定辦理。\n六、依特色招生管道入學、通過資優鑑定及其他經各該主管機關核定班別所招收之學生，應依報經主管機關核定之計畫實施編班（群、科、學程）及教學。\n七、除前點所定之學生，學校應依常態編班原則，採S型排列、公開抽籤或電腦亂數方式實施編班。\n八、普通型高級中等學校二年級、三年級學生，得依其選修課程（學程）之差異，進行編班。\n九、學生經家長同意後，得向學校申請轉班（群、科、學程）；學校受理申請，並實施生活、學習、生涯等適性輔導後，提編班及轉班委員會審議；經審議通過後，應為學生辦理轉班（群、科、學程）。\n十、為求各班學生人數趨於均衡，學校編班（群、科、學程）後始報到或轉入之學生，應優先將其編入學生數較少之班級，其次依其性別編入同性別人數較少之班級。\n十一、學校不得將學生編入二親等內之血親擔任授課教師之班級。但因班級規模、教師編制或有其他特殊困難者，提經學校編班及轉班委員會審議通過後，不在此限。\n十二、身心障礙學生就讀之普通班，其班級安排應由學校召開特殊教育推行委員會決議，依學生個別學習適應需要及校內資源狀況，選擇適當教師擔任班級導師，並以適性原則均衡編入各班，學校應主動連結校內外資源，協調校內各單位共同辦理身心障礙學生各項教學及輔導工作。\n十三、學校應於學年度開始前六個月，將編班及轉班（群、科、學程）作業規定公告於學校網頁，修正時亦同。\n十四、學校應於開學前，將前項辦理情形，公告於學校網頁。\n十五、學校應妥為保存編班及轉班（群、科、學程）相關資料至少五年，以備查考。","history":"1.102 年5 月17 日臺教授國部字第1020036366號函核定。\n2.113年8月28日教育部臺教授國部字第 1135403868A 號令修正發布，並自即日生效"},{"title":"有關貴轄私立國民中(小)學(含高中職附設國中部)招生及編班作業，請本權責依相關規定確實督導辦理，以落實常態編班及教學正常化。","content":"一、私立國民中(小)學(含高中職附設國中部)招生規範如下：\n（一）依「國民教育法」第20條第1項及第2項規定「(第1項)私立國民小學及私立國民中學之學區劃分，由直轄市、縣(市)政府參照地方特性定之。(第2項)私立國民小學及私立國民中學之學生入學，由學校本教育機會均等及國民教育健全發展之精神，訂定招生辦法，報經直轄市、縣(市)政府核定。」。\n（二）依「國民教育法」第12條第2項規定「國民小學及國民中學各年級應實施常態編班；為兼顧學生適性發展之需要，得實施分組學習；其編班及分組學習準則，由教育部定之。」，國民小學及國民中學常態編班及分組學習準則並已於94年3月30日發布施行。\n（三）依「私立學校法」第55條規定「學校法人所設私立學校辦理不善、違反本法或有關教育法規，經學校主管機關糾正或限期整頓改善，屆期仍未改善者，經徵詢私立學校諮詢會意見後，視其情節輕重為下列處分：\n1.停止所設私立學校部分或全部之獎勵、補助。\n2.停止所設私立學校部分或全部班級之招生。\n二、本於前述規定，貴管所定之私立學校招生注意事項或各校招生辦法等規定建請納入以下規範：\n（一）統一全直轄市、縣(市)各私立國民中(小)學之登記日期(1至2天)及起迄時間(如：上午9時至下午4時)。\n（二）登記人數低於核定招生人數，則應全部錄取，登記人數超過核定招生人數，應以公開抽籤方式辦理，並統一全直轄市、縣(市)之抽籤日期(1天)及起迄時間(如：上午9時起至抽完籤止)。\n（三）公開登記及抽籤當日應由　貴府(局)協調派員到校督導。\n（四）抽籤結果錄取名冊乙份立即由督導人員帶回，以備查考，並另製作乙份由各該校辦妥門首公告及網路公告。\n（五）對違反招生規定之學校，建請訂定裁處基準後，依「私立學校法」之規定處理。\n（六）編班方式請依據「國民小學及國民中學常態編班及分組學習準則」之規定辦理。\n（七）對違反常態編班規定者，應依「私立學校法」相關規定，視其情節輕重，予以限期整頓改善、停止部分或全部班級之招生、停辦或依法解散之處分。有前項規定情事者，直轄市、縣(市)政府並得扣減對該私立學校之補助款。\n三、在尊重學生自由申請登記私立學校入學意願及公平均等錄取機會原則下，嚴禁各校以智力測驗、學業成就測驗或面談等方式作為錄取依據，挑選學生。且為落實常態編班及教學正常化，請確依「國民小學及國民中學常態編班及分組學習準則」之規定辦理。","history":"100年3月25日臺國(一)字第1000048128號。"},{"title":"重申各校應確依國民教育法第12條之規定實施常態編班，並推動教學正常化，以維學生學習權益。","content":"一、依教育部98年4月13日台國(四)字第0980058653號函辦理。\n二、依「國民小學及國民中學常態編班及分組學習準則」(以下簡稱本準則)第10條規定，各校應採行具體措施加強與教師、家長、學生溝通，使其瞭解學校實施常態編班及分組學習之精神與措施，以確保學生均能獲得良好之學習效果。\n三、各校常態編班之成效，列入督察視導重點、校務評鑑、校長成績考核及校長遴選之重要參據。\n四、本準則第8條第1項規定，應依學生學習特性，實施年級內之分組學習，若依學生有關領域之「總成績」分組，即為變相實施能力分班。另依本準則第8條第2項規定，年級內分組學習之實施應由學校邀請該校教師會代表(無教師會者，由各該年級教師代表)、學生家長會代表及學校行政人員共同訂定計畫，並報本局備查。","history":"98年4月20日北教國字第0980288671號。"},{"title":"重申各校應確依國民教育法第12條之規定實施常態編班，並避免以延後報到達「選班級、選老師」之目的。","content":"一、依據教育部98年7月28日台國(四)字第0980128225號函辦理。\n二、查國民小學及國民中學常態編班及分組學習準則第6條規定「…編班後補報到之新生或轉學生，由原辦理單位採公開抽籤方式分配就讀班級…」各校不能以延後報到達「選班級、選老師」之目的。\n三、編班後補報到之新生或轉學生，各校應以公開抽籤方式，依序編入學生人數較少之班級。\n四、各校違反常態編班規定者，公立國中小除依相關規定追究責任外，並列入校長年終考核重要參據，私立國中小，由本府依私立學校法及相關規定辦理。","history":"98年7月30日北教國字第0980622775號。"},{"title":"新北市國民小學及國民中學常態編班及分組學習補充規定","content":"一、本補充規定依教育部頒國民小學及國民中學常態編班及分組學習準則第十三條規定訂定之。\n二、新北市（以下簡稱本市）公私立國民小學及國民中學（以下簡稱各校）之編班，除其他法規另有規定外，依本補充規定辦理。\n三、新北市政府（以下簡稱本府）應成立新北市國民小學及國民中學常態編班推動委員會（以下簡稱本會），負責本府常態編班之推動及評鑑。\n本會置委員十五人，其中一人為主任委員，由本府教育局（以下簡稱本局）局長兼任，其餘委員，由市長就下列人員聘（派）兼之：\n（一）本局人員一人。\n（二）專家學者代表一人。\n（三）國中、國小校長代表二人。\n（四）地方教師會代表五人。\n（五）學生家長會代表五人。\n本會置執行秘書一人，由主任委員指定本局科長或督學擔任。\n本會委員任期為二年，期滿得續聘（派）兼之。但代表機關出任者，應隨其本職進退。委員於任期出缺時，應予補聘（派）兼之，其任期至原任期屆滿之日為止。但出缺委員所餘任期未滿六個月，得不補聘（派）。\n本會會議由主任委員召集，並為會議主席；主任委員因故不能出席時，由出席委員互推一人為主席。\n前項會議應有全體委員過半數之出席，及出席委員過半數同意之決議行之。\n本會任一性別委員人數不得少於委員總數三分之一。\n委員應親自出席會議。但機關代表兼任之委員，除主任委員外，因故不能出席時，得指派代表出席。委員關於案件審議、決議之迴避，依行政程序法第三十二條及第三十三條規定。\n本會委員均為無給職。但得依規定支給相關費用。\n四、各校應於每學年度成立常態編班委員會（以下簡稱編班委員會），由校長、各相關處室主任、承辦業務處（室）組長、特教業務承辦人、教師（會）代表三至七人及家長會代表一人等組成，校長為召集人，委員任期一年。\n五、各校編班委員會任務如下：\n（一）決定編班（含調整班級與增減班）時程、地點及方式，並執行編班作業。\n（二）執行身心障礙學生編班事宜，並應依新北市政府特殊教育學生鑑定及就學輔導會決議。\n（三）公告學生編班名冊。\n（四）執行導師編配作業。\n（五）特殊情形轉換班級事宜。\n六、各校編班原則如下：\n（一）公平、公正、公開。\n（二）常態編班。\n（三）男女合班。\n（四）各班學生數均衡（同學年班級間男女學生數亦應均衡）。\n（五）照護身心障礙學生學習之需求。\n（六）教師應迴避擔任自己子女之導師職務。但各校因員額編制限制，專案報本局核定者，不在此限。\n七、常態編班作業，依下列規定辦理：\n（一）國小新生編班依學生戶籍之鄰里別或區公所編列之入學號碼或其他隨機方式，得採公開抽籤方式，或採電腦亂數方式為依據，區分為男女二組，分配就讀班級。\n（二）國中新生之編班得採測驗再依成績高低順序以 S  型排列，或採公開抽籤方式，或採電腦亂數方式為依據，區分為男女二組，分配就讀班級。\n（三）國小三年級、五年級需重新編班者，得採測驗再依成績高低順序以S 型排列，或採公開抽籤方式，或採電腦亂數方式為依據，區分為男女二組，分配就讀班級。\n（四）國小二、四、六年級學生與國中二、三年級學生以直升為原則，若達增班條件，必須重新編班時，應檢附編班委員會會議紀錄、各主管機關特殊教育學生鑑定及就學輔導會核發之鑑定結果通知書或鑑定安置決議結果等資料，專案報本局核准，其編班方式依前款規定辦理。\n八、各校辦理編班作業前，應召開特殊教育推行委員會（以下簡稱特推會）及個案會議，就下列事項進行討論：\n（一）特推會：\n1.依據特殊教育學生鑑定安置及轉銜會議決議，就身心障礙學生個別適應需求及校內資源狀況，選擇適當教師擔任班級導師，並以適性原則均衡編入各班。\n2.就身心障礙學生實際狀況，學校經提供人力資源及協助後，仍認為有減少該班級人數必要者，得減少該班級人數一至三人，並報本局核定。\n（二）個案會議：針對學習適應困難特殊個案，由輔導室（組）召開個案會議，會議結果送交編班委員會參考，並採均衡原則分散編班。\n九、雙（多）胞胎學生或同父母之兄弟姊妹於同一年級就讀者，於編班前得依學生家長之意願，選擇同班或分開班級，但不得指定班級。\n十、編班後補報到之新生或轉學生，依不同時間點，分別處理，方式如下：\n（一）開學前：由承辦編班業務處室於開學前一星期，就全數編班後補報到之新生或轉學生，先考慮班級人數再考慮男女之均衡，辦理一次公開抽籤分配就讀班級。\n（二）學期中：應先考慮依人數之多寡將其編入學生數較少之班級，再考慮依性別之不同編入同性別人數較少之班級，倘上開條件皆相同時，應以公開抽籤分配就讀班級，以求各班學生數達於均衡。\n十一、因身心障礙學生就讀普通班減少之班級人數，應併入該班人數計算。學生因故轉出後再轉回原校時，基於考量學生適應力，以優先編入原班級就讀為原則；倘學生轉回原校時已重新編班，不在此限。\n各校導師編配作業應於學生編班完成後採公開抽籤方式或採電腦亂數方式進行，倘以公開抽籤方式辦理者，需由教師親自到場抽籤，無法親自抽籤者，由現場人員代抽，抽籤時應邀請學校教師會代表（無教師會者，由年級教師代表）及學生家長會代表出席。各班導師抽籤確定後，如有其他特殊因素需調整時，應報本局核定。\n十二、各校於學生編班及導師編配工作完成後，應立即將學生編班名冊及導師編配結果於校內及網路公告至少十五日。\n受保護個案或經學校編班委員會認定之個案，應不予公告。\n十三、學生經編班確定後，除下列各款情形外，不得任意調整就讀班級：\n（一）各校依校園霸凌防制準則或校園性別事件防治準則等規定，於調和、調查、處理階段或作成終局實體處理後，得於必要時對當事人施予抽離或個別教學、輔導，並得暫時將當事人安置到其他班級或協助當事人依法定程序轉班，並報本局備查。\n（二）因教育輔導或其他原因，需要調整就讀班級者，各校應依下列程序辦理：\n1.學生家長應以書面詳細述明理由，向承辦編班業務處（室）提出申請轉班，惟不得指定轉入班級。\n2.承辦編班業務處（室）受理後，應協調輔導處（室）指派輔導教師瞭解及妥善輔導。經輔導教師瞭解、溝通及輔導確實無法解決者，召開個案會議後，提交編班委員會研議。\n3.編班委員會會議議程得由輔導教師、原班導師報告處理情形後，於一個月內審議，並研議相關配合措施。\n4.如獲同意轉班，得由承辦編班業務處（室）視各班人數多寡，編入人數較少班級或適合輔導該個案學生之教師班級，必要時可於召開編班委員會時，邀請擬轉入班級導師參與會議，俾瞭解學生，作為未來輔導之參考。\n5.經編班委員會決議後，由承辦編班業務處（室）通知學生及家長。\n十四、為使教師、家長、學生瞭解學校實施常態編班及分組學習之精神與措施，各校應於校務會議、家長委員會、班親會及其他適當時機宣導。\n十五、本府得將各校常態編班及分組學習辦理情形，納入督學視導項目，並由本局於每學年度結束前向本會提出報告。\n各校執行常態編班及分組學習經本府查核成效良好者，校長及有關人員依公立高級中等以下學校校長成績考核辦法、公立高級中等以下學校教師成績考核辦法及新北市政府所屬各級學校及幼兒園辦理教師敘獎處理原則辦理獎勵。各校違反常態編班規定者，公立國中小學除依相關規定追究責任外，並列入校長成績考核及校長遴選重要參考依據，私立國中小學，由本府依私立學校法及相關規定處理。\n十六、各校得依本補充規定另訂實施計畫。","history":"1.100年9月19日北府教秘字第1001107614號令，自即日起生效。\n2.101年3月30日北府教國字第1011442820號令修正發布全文12點；並自即日起生效。\n3.102年2月5日北府教國字第1021138899號令修正發布。\n4.102年10月31日北府教國字第1022931972號令修正發布。\n5.中華民國112年11月3日新北市政府新北府教國字第1122153639號令修正發布第4點條文；並自即日生效。\n6. 民國 114年04月 28日新北府教國字第 1140734854號令修正發布全文16點；並自即日生效。"},{"title":"國民小學及國民中學正常教學督導辦法","content":"第　1　條\n本辦法依國民教育法第三十九條第三項規定訂定之。\n第　2　條\n國民小學及國民中學(以下簡稱國民中小學)為落實正常教學，其應辦理之事項如下：\n常態編班及分組學習：學校實施常態編班、導師編配及分組學習，除特殊教育法、藝術教育法或其他法律另有規定外，應依國民小學及國民中學常態編班及分組學習準則規定辦理。\n課程教學規劃及實施：\n學校應依國民中小學課程綱要規定之課程規劃，訂定課程計畫及課表，並督導教師據以授課。\n學校應依教師專長優先排課，並鼓勵配課教師參加增能研習。\n學校辦理國民中小學課程綱要所定學習節數外之課後輔導、寒暑假學藝活動及留校自習，應於規定時間進行且不得教授新進度。\n學習評量實施：\n學校學習評量，應於國民中小學課程綱要所訂學習節數內實施為原則，並依國民小學及國民中學學生學習評量辦法規定辦理。\n模擬考應於國民中學三年級辦理，且不得於寒暑假結束後之第一週實施。\n第　3　條\n國民中小學應訂定正常教學自主檢核方式，並定期進行自主檢核。\n前項正常教學自主檢核，其項目由中央主管機關定之；國民中學應於每學年開學前，將檢核結果公告於學校網站。\n第　4　條\n直轄市、縣(市)主管機關應訂定正常教學視導計畫，並依計畫組成視導小組，至其轄區內國民中小學實地視導。\n前項視導小組，由下列人員組成；每次視導時，應至少由其中二款人員進行：\n督學。\n專家學者。\n國民教育地方輔導團之分團輔導員。\n地方教師會代表。\n地方家長團體代表。\n第　5　條\n前條正常教學視導，應依下列方式辦理：\n國民小學：每學年抽查一定比率校數，對學校進行實地視導；必要時，並得加強視導。\n國民中學：每學年完成對學校實施一次實地視導；必要時，並得增加視導次數。\n前項實地視導，應以無預警方式辦理。但因學校距離、行事曆安排考量，得於視導人員到校前一小時三十分鐘內通知學校。\n第　6　條\n直轄市、縣(市)主管機關實地視導之程序如下：\n資料審閱。\n課堂巡查。\n向學生、教師代表問卷調查或與之晤談。\n與學校行政人員座談。\n視導人員為前項第一款至第三款所定視導程序時，發現學校未符合第二條規定者，應於前項第四款座談時確認之。\n視導人員，應對第一項第三款問卷調查及晤談內容，予以保密。\n第　7　條\n直轄市、縣(市)主管機關於實地視導結束後，應將未符合第二條規定之事項，通知學校限期改善，並督導其改善。\n直轄市、縣(市)主管機關應訂定獎勵機制，鼓勵教師參加中央主管機關辦理之第二專長學分班，提升各領域(科目)專長授課比率。\n直轄市、縣(市)主管機關每學年應定期辦理增能研習，提升配課教師專業知能；中央主管機關得就該增能研習所需費用，酌予補助。\n第　8　條\n直轄市、縣(市)主管機關應就每學年國民中小學視導結果進行分析，並訂定改善措施，於當學年度結束前，報中央主管機關備查。\n第　9　條\n直轄市、縣(市)主管機關應將正常教學相關法令及各該學年度之視導計畫、主要視導結果、全轄區共通性問題及改善措施，於教育局(處)網站首頁設置專區公告。\n直轄市、縣(市)主管機關應每學年對學校相關人員，進行正常教學法令宣導。\n第　10　條\n直轄市、縣(市)主管機關應依視導結果，對落實正常教學績效卓著之國民中小學校長及其相關人員，依法規規定予以獎勵。\n直轄市、縣(市)主管機關應按視導結果，對未符合第二條第一款、第二款第一目、第三目或第三款規定之公立國民中小學，依相關法規對校長及學校相關人員予以議處。\n私立國民中小學有前項情形者，直轄市、縣(市)主管機關應依私立學校法及相關規定辦理。\n第 11 條\n中央主管機關得就直轄市、縣(市)主管機關轄區內之國民中小學，抽查一定比率校數，進行實地訪視。\n中央主管機關應就前項訪視結果列為未符合第二條規定之學校，要求直轄市、縣(市)主管機關通知學校限期改善；屆期未改善者，直轄市、縣(市)主管機關應依前條第二項及第三項規定辦理。\n直轄市、縣(市)主管機關未依前項規定辦理者，中央主管機關得降低中央對地方相關教育經費補助之比率。\n第 12  條\n本辦法自中華民國一百十三年八月一日施行。","history":"中華民國113年5月2日教育部臺教授國部字第 1135501190A 號令訂定「國民小學及國民中學正常教學督導辦法」。"},{"title":"轉知教育部「落實按課表授課，學校若有未依課程綱要規定排課或未督導教師按表授課，校長成績考核不得考列甲等」一案。","content":"一、依教育部100年1月10日臺國(二)字第1000000023A號函辦理。\n二、教育部為落實國民中學藝能及活動課程教學正常化，達成學生五育均衡、身心健全發展之目標，業於98年6月8日以台國(二)字第0980078347C號令發布「加強國民中學藝能及活動課程教學視導實施要點」。該要點強調學校排課應以教師專長優先排定符合專長之課程，並明定各縣市政府應定期調查並掌握學校師資狀況及教師專長排課情形，且應對於專長師資不足之學校，加強其教師缺額之管控，要求其優先進用不足之科目專長師資。本局業於98年7月9日北教國字第0980459352號轉知，合先敘明。\n三、另教育部業於99年12月15日召開99年度第3次全國教育處(局)學管科(課、股)長會議，請各直轄市、縣市政府依據本部99年9月16日台參字第0990155887C號令修正之「公立高級中等以下學校校長成績考核辦法」第六條(如附件)規定辦理，即校長在考核年度內學校未依課程綱要規定排課或未督導教師依規定授課，成績考核不得考列甲等。\n四、請各校教師確實依照所配課程之課程計畫或教學進度表確實授課，以維護學生的受教權益，本局將不定期督導查察。","history":"100年1月17日北教國字第1000034116號。"},{"title":"為落實九年一貫各領域課程目標，促使教學正常化，減少非專長授課比例，請各校重視專長授課，減少非專長授課情形，並確實依課表上課，嚴禁借課情形發生，進而逐年調整校內師資結構。","content":"經查，全縣非專長授課比例較高科目為：表演藝術、家政、童軍、輔導活動、健康、生活科技6科，請各校加強落實專長授課之精神。","history":"95年11月2日北府教學字第0950766276號函。"},{"title":"新北市115學年度國民中小學正常教學視導實施計畫","content":"壹、依據：\n一、國民小學及國民中學正常教學督導辦法辦理。\n二、國民小學及國民中學正常教學實施要點。\n三、國民小學及國民中學常態編班及分組學習準則。\n四、教育部國民及學前教育署(以下簡稱國教署) 115學年度「公私立國民中小學正常教學視導實施計畫」。\n貳、目的：\n一、為辦理國民中小學正常教學視導，有效掌握本市國民中小學正常教學實施情形，協助學校落實教育政策，實踐教育公平正義。\n二、透過本市校務行政系統建構，由專案助理制定正常教學資料範例檔供各校參考，並透過各校上傳資料事先進行檢視、分析與通知補件，以達行政減量，俾利學校行政與教學回歸正常運作。\n參、辦理單位：\n一、主辦單位：新北市政府教育局。\n二、承辦單位：新北市板橋區板橋國民小學。\n三、視導對象：全市各公私立國民中小學及國立華僑高級中等學校(國中部)。\n肆、視導期程：自115年11月9日起至116年5月28日止。\n伍、實施方式：\n一、本市於學年度期初辦理各校正常教學宣導，國民中學全面及國民小學校數約1%為原則，採取無預警方式進行實地視導，並於視導當日前 90 分鐘通知受視導學校進行相關準備工作。\n二、國民中學及國民小學於學期開始前，需分別依「115學年度國民中學正常教學學校自我檢核表」（如附件1-1）或「115學年度國民小學正常教學學校自我檢核表」（如附件 1-2）進行正常教學自主檢核及養成平日資料建檔之習慣，另國民中學應於開學前將「國民中學正常教學學校自我檢核表」及相關資料公告於學校首頁「正常教學專區」，後續並依相關期程不定期將正常教學所需資料（如附件2）備妥上傳至指定本市校務 行政系統「正常教學視導模組」。\n三、實地視導相關規劃如下：\n(一) 各校請於每學年度開學初，應針對法規及資料準備進行校內正常教學宣導，含前一學年度視導結果委員建議待改進事項。\n(二) 實地視導當日包含隨機抽訪學校行政人員、教師及學生，「教師晤談或問卷」及「學生晤談或問卷」調查項目，晤談時間以不影響學生作息、教師教學的原則下進行，詳見實地視導流程（如附件3）。\n(三) 視導委員包含駐區督學、課程督學、專家學者、國民教育地方輔導團之分團輔導員、地方教師會代表及地方家長團體代表等人員之任 2 類，本局將辦理視導委員專業培訓及共識會議。\n(四) 為利學校整備資料，本局將辦理視導說明、資料整備工作及模組使用說明，協助學校養成於平日建構資料的習慣。\n四、實驗教育學校依據其所送之實驗規範，已排除正常教學之項目，免除正常教學視導；未排除項目，仍應依規定進行該項目視導，本市實驗學校採線上視導。\n五、線上視導當日請依照本局通知時間，由行政人員廣播學生及教師分別至指定電腦教室進行「學生晤談或問卷」及「教師問卷」調查項目，晤談時間以不影響學生作息、教師教學的原則下進行。\n六、倘國教署後續函頒之縣市辦理實地視導規定有所修正，將以最新規定辦理。\n七、經費來源：由新北市政府教育局相關經費項下支應。\n陸、視導結果：\n一、各校之視導紀錄表（國民中學如附件4-1；國民小學如附件4-2）函報國教署備查，另針對視導結果大部分落實、部分落實及少部分落實正常教學的學校，需填寫「新北市國民中小學正常教學視導改善策略表」（如附件5），提出具體改善策略並函復或於模組完成簽核後提交本局備查。\n二、每學年度5月將針對未落實改善、陳情案量較多或連續兩年視導結果符合項目比率低於50%之學校進行追蹤視導。\n柒、參與視導之委員、學校代表及承辦本項工作人員均核予視導當日公假(課務派代)。\n捌、本案聯絡人：\n一、新北市板橋區板橋國民小學林專案助理，電話：(02)29559019 分機 22。\n二、新北市政府教育局中等教育科吳輔導員，電話：(02)29603456 分機 2667。\n三、新北市政府教育局國小教育科林輔導員，電話：(02)29603456 分機 2745。\n玖、注意事項：\n一、實地視導–請學校預先將備齊書面資料、前一學年度視導紀錄表及具體改善策略表，統一放置於訪視會場，若為電子化資料，請準備3台筆記型電腦或iPad，避免委員現 場審閱資料時，因資料缺漏，需學校立即補齊而耽誤視導時程。\n二、線上視導–請學校預先備妥 1~2 間電腦教室，並安裝視訊鏡頭及含麥克風耳機，於接獲視導通知時，請將欲使用電腦開啟，並測試網路連線及各項設備均正常，以避免耽誤視導時程。\n壹拾、執行考核\n一、經視導委員評定為完全落實及絕大部分落實者，推動有功之教職員依公立高級中等以下學校校長成績考核辦法第7條第2項第2款第4目及公立高級中等以下學校教師成績考核辦法第6條第2項第3款第10目，學校人員：校長記功1次、其他相關人員嘉獎2次（至多3名）。\n二、經視導委員評定尚有指標未符合者，應提出改善策略表並函復或於模組完成簽核後提交本局備查，本局將不定期派員到校進行追蹤輔導訪視。\n三、違反相關規定或未據以落實正常教學之校長、學校行政人員及教師，經限期改善而屆期仍未改善者，應依「公立高級中等以下學校校長成績考核辦法」及「公立高級中等以下學校教師成績考核辦法」落實考核，私立學校並應落實依「私立學校法」第55條，視情節輕重予以處分；連續2年視導結果符合項目比例低於50%之學校，依前揭規定落實議處。\n壹拾壹、本計畫奉核後實施，修正時亦同。","history":"115年9月22日新北教中字第1151885240號函。"},{"title":"教育部主管高級中等學校課業輔導實施要點","content":"一、教育部國民及學前教育署（以下簡稱本署）為提升教育部主管之高級中等學校（以下簡稱學校）在校學生學習興趣，增進學習效能，規範學校辦理高級中等教育法第六十一條第三項課業輔導事項，特訂定本要點。\n二、學校得於學期中或寒假、暑假辦理課業輔導，並由學生自由選擇參加。\n學校辦理前項課業輔導前，應訂定課業輔導實施計畫，於學校網站首頁公告，並運用多元管道，向學生及家長說明；其計畫內容，應包括課業輔導實施內容、上課期程、時間安排及收費規定。\n三、前點課業輔導實施內容，包括課業複習及相關補充課程。\n前項課業複習及相關補充課程，不得提前講授各該科目教學進度表所定之課程內容。\n四、學校於學期中辦理之課業輔導，應就課程綱要所定每週三十五節課程外，安排於每日科目課程、團體活動時間及彈性學習時間之後；其結束時間，不得逾十七時三十分。\n前項課業輔導，每週不得逾五日，全學期不得逾八十節，且不得於國定假日及例假日實施。\n寒假課業輔導，總計不得逾四十節；暑假課業輔導，總計不得逾一百二十節。前二項所定之節，每節為五十分鐘。\n五、學校向參加課業輔導之學生，收取課業輔導費之數額、收費及退費程序，應依高級中等學校向學生收取費用辦法及教育部主管高級中等學校向學生收取費用補充規定辦理。\n前項收費數額，其平均後每節單價，應於新臺幣（以下同）十五元至三十五元間，由學校依課業輔導辦理情形，按收支平衡原則訂定。\n學生屬低收入戶、中低收入戶或家境清寒者，學校得酌情減免第一項課業輔導費收取數額，或由學校協助申請其他替代繳費補助方案；其清寒減免之境遇條件、減免收費數額之比率及申請減免或替代繳費補助方案之程序，由學校依課業輔導辦理情形，自行於補充規定訂定。\n六、學校公告課業輔導實施計畫後，應檢附課業輔導實施計畫及家長同意書，通知學生家長，徵詢學生參加之意願。\n學生已成年者，前項家長同意書應改為學生同意書，徵詢其參加之意願，並知會家長。\n前二項為同意參加者，學校始得收取課業輔導費。\n七、學生參加課業輔導，每班最高以四十五人為原則，並得自由編班。\n八、學校辦理課業輔導，應注意學生之安全，並依學校之常規管理；學校應加強學生之生活輔導。\n九、課業輔導費支用項目及基準如下：\n（一）教師鐘點費：每節最高支給六百六十元，其支用不得低於所收費用總額百分之八十；其低於百分之八十者，賸餘款應發還學生。\n（二）教學活動業務費：得支用於支援教學活動之業務費、教材印製或購買費、材料費、學生獎勵金、行政管理及加班費，其支用不得逾所收費用總額百分之二十；賸餘款得滾存作為改善學校基本設施或充實教學設備之用。\n前項支用項目之用途，學校於收支平衡下，應優先支給教師最高數額之教師鐘點費，且不得另以其他名目，向學生收取費用。\n十、學校實施課業輔導，應依教育部主管高級中等學校課業輔導實施正常化檢核表（如附件），適時進行自我檢核，並於各該檢核項目發生後二週內，公告於學校網站首頁。\n十一、學校得依本要點規定，自行擬訂補充規定，經校務會議通過後實施。\n十二、本署得不定期至學校查核課業輔導辦理情形；學校違反本要點或其他法令規定，經本署通知限期改善，屆期未改善者，國立學校，依法規議處相關人員，私立學校，依私立學校法及其相關法令規定辦理。","history":"1.中華民國90年1月8日九０教中(二)字第90500183號函訂定。\n2.中華民國91年9月23日教育部部授教中(二)字第0910517200 號令修正發布名稱及全文5點；並自91學年度生效(原名稱：臺灣省課業輔導實施要點)。\n3.中華民國105年8月30日教育部臺教授國部字第1050094312A令號修正，並將名稱修正為「高級中等學校課業輔導實施要點」，並自中華民國105年8月29日生效。\n4.中華民國109年10月30日教育部臺教國署高字第 1090121708B號令修正 「高級中等學校課業輔導實施要點」，並自即日生效。\n5.中華民國110年7月14日教育部臺教國署高字第 1100081115B號令修正「高級中等學校課業輔導實施要點」部分規定，並自中華民國110年8月1日生效。\n6.中華民國 112 年 3 月 16 日臺教國署高字第 1120024619A 號令修正第六點、第九點及第十點附件\n7.中華民國 113 年 8 月 30 日臺教授國部字第 1135403868A 號令修正第五點、第九點\n8. 中華民國115年7月1日教育部國民及學前教育署臺教國署高字第1155403212A號令修正第4點、第9點及第10點附件，名稱並修正為「教育部主管高級中等學校課業輔導實施要點」，並自即日生效。"},{"title":"新北市公私立高級中等學校課業輔導實施要點","content":"一、新北市政府為辦理新北市公私立高級中等學校(以下簡稱各校)課業輔導，以提升學生學習興趣，並增進學習效能，特訂定本要點。\n前項高級中等學校，不包括高級中學附設之國中部。\n二、各校辦理學生課業輔導原則如下：\n(一) 學生自由參加，不得有強迫參加情事，並應取得學生家長同意書。\n(二) 實施編班，每班最高以四十五人為原則，並得採因材施教方式教學。\n(三) 學期中，應於星期一至星期五正式課程結束後實施一節，其結束時間不得逾十七時三十分。\n(四) 寒假期間，上課以四十節為原則；暑假期間，上課以一百二十節為原則。\n(五) 前二款所定之節，每節為五十分鐘。\n(六) 課程內容，由各校視教學及活動需要，妥為設計安排。\n(七) 不得提前教授新單元教材，或採用坊間出版專為應付升學考試之各種參考書及測驗卷。\n(八) 各校得視學生需要，酌量編選補充教材，印發講義應用，並不得另收教材或講義費。\n(九) 學生在校生活應按照各校常規管理，並應注意學生安全及陶冶品德與培養群性。\n(十) 學生請假之相關規定，由各校定之。\n(十一) 各校規劃上課時程應預留補課時間。\n三、技術型高級中等學校及綜合型高級中等學校辦理技能輔導原則如下：\n（一）學期中：\n1、週一至週五：於正式課程後實施，每日以增加一節為原則，必要時得增加至二節。\n2、週六、週日：每日以八節為限。\n3、開課總節數，每週不得超過二十節。\n（二）寒暑假期間：\n1、於上午或下午時段實施，每日以八節為限，每週授課不得超過四十節。\n2、開課總節數，寒假期間不得超過四十節，暑假期間不得超過一百二十節。\n(三)技能操作材料費依職種需求酌收，採使用者付費原則。\n四、各校辦理課業輔導之費用，其收支原則如下：\n(一) 所收費用，以每節新臺幣三十元為上限。\n(二) 所收費用之開支，包括鐘點費及行政費：\n1. 鐘點費按實際授課節數支給，每節最高支給新臺幣六百六十元，其支用不得低於所收費用總額百分之七十五；其低於百分之七十五者，剩餘款應發還學生。前開教師授課時數，不列入兼代課鐘點計算。\n2. 行政費支用不得逾所收費用總額百分之二十五，支付項目包括課業輔導業務費、水電費、紙張講義印刷費、材料費、教學設備費、維修費、加班費、獎學金及其他相關費用；剩餘款得滾存作為改善學校基本設施或充實教學設備之用。\n(三) 寒暑假期間，舉辦課業輔導之班級，每班得置生活輔導教師一人，以加強生活輔導；生活輔導費之支給，每班每週最高為新臺幣一千元。但已支領導師費者，不得重複支領生活輔導費。\n(四) 學校所收費用，應以核發鐘點費為優先，兼任行政業務之教師無授課事實者，不得支領鐘點費。授課鐘點費核實支付後，剩餘費用始得用於行政費、實際參與工作人員之加班費或其他相關費用之開支。\n(五) 低收入戶、中低收入戶、家境清寒或單親家庭生計困難者，各校得准其免繳或酌減費用。中途參加之學生，按參加之週次比例核實收費。\n(六) 收費應製給收據並納入各校保管款專戶以代收代付方式存管，應本於取之學生，用之學生，與本案教學活動相關，專款專用之原則。\n(七) 鐘點費於辦理期間有調整者，仍依原收費支給，不得再向學生補收差額。\n五、各校應確實核算各項費用，如因故停課且未補課時，未核發部分之費用應退予學生。\n六、學生參加課業輔導後，因故無法參加其課程者，各校應依下列規定退還學生所繳費用：\n(一) 開學前申請退費者，全數退還。\n(二) 開學後未逾學期三分之一申請退費者，退還三分之二。\n(三) 開學後逾學期三分之一，未逾學期三分之二申請退費者，退還三分之一。\n(四) 開學後逾學期三分之二申請退費者，不予退費。\n七、各校應依本要點規定，訂定實施計畫。","history":"1.100年8月24日北府教秘字第1000719756號令訂定，全文6點；並自即日起生效。\n2.101年5月2日北府教中字第1011353922號令修正發布名稱及全文6點；並自101年8月1日生效。\n3.104年1月12日新北府教中字第1032481495號令修正發布第3、5點條文，並自即日生效。\n4. 113年3月18日新北府教中字第 11304900001號令修正發布第2、3點條文。\n5. 115年4月30日新北府教中字第 1150782423號令修正發布全文7點；並自即日生效。"},{"title":"請各縣市政府督促所屬學校於寒假期間進行課後輔導時，必須落實正常化教學，以維學生學習權益。","content":"一、本部95年10月17日召開之「研商落實教學正常化－國中課業輔導與留校自習協調會議」紀錄略以：「各國中小於課外時間在校(如於寒暑假及第8節課)為學生進行課業輔導或補救教學，應由學生自由參加，並嚴禁強迫收費。國中課後輔導與留校自習採以下原則辦理：(一)課後輔導：1.不強迫參加；2.不教新進度；3.基本上每日放學後，每天1小時，每週5天，並以不超過下午5:30為原則；4.星期例假日不得辦理；5.寒暑假期間應以上午為限；6.由地方政府因地制宜本權責訂定適宜收費基準。」\n二、前述原則係與各縣市政府充分討論所達成之共識，故各縣市政府得自訂相關實施規定及收費基準，俾學校據以向學生收費並進行課業輔導、補救教學等。\n三、另本部亦於97年12月25日以台國(四)字第0970259038號函申：「請各縣市政府督導轄內各國中，應以自主辦理課外輔導或留校自習等學習活動為原則，不應有接受外界或家長委託辦理情事；亦請兼顧尊重教師授課意願。」有關課業輔導與留校自習亦應尊重教師授課意願。\n四、惟目前接獲民眾陳情部分學校利用寒假安排課業輔導疑有未徵詢學生意願及上新進度之情事，請各縣市政府加強督導及行文至所屬各級學校確實遵照原則辦理。","history":"100年1月26日臺國(四)字第1000015706號。"},{"title":"教育部取消早自習之規定","content":"一、現行國民中小學課程標準並未列有早自習之規定，為維護學生身心均衡發展，應予取消早自習，惟各校仍可視地區及家長作息特性自行訂定「學生早到學校」之實施辦法，並依下列原則辦理。\n二、對於因交通、家庭因素及家長作息特性而須提早到校之學生，學校應安排導護老師、義工媽媽(爸爸)或警衛巡視，及協助交通安全導護工作，以維護學生安全。\n三、至於提早到校之學生，學校應輔導學生自我學習，不得強制抄寫作業或實施考試。","history":"1.86年2月20日八六北府教一字第059382號(縣公報86春字19期)。\n2.86年2月5日教育部台(86)國字第86006472號。"},{"title":"國民中學及其主管機關辦理升學或國中會考模擬考試處理原則","content":"一、教育部國民及學前教育署為促進國民中學階段教學及學習正常化，協助學校了解學生學習情形，以供教師進行適性化補救教學及學生自我改善學習弱項之參據，適應國民中學升學測驗或國中教育會考之程序、題型及答題方式等，特訂定本原則。\n二、國民中學模擬考試(以下簡稱模擬考)為模擬升學測驗或國中教育會考之準總結性評量。\n三、模擬考辦理時間，應符合下列規定：\n(一) 於國中三年級始得辦理，且不得於寒暑假結束後之第一週實施。\n(二) 於平日上課時間辦理者，不得影響領域學習，學校應自行妥善調整課務。\n(三) 辦理日期應列入學校行事曆。\n四、模擬考辦理次數，每學期不得超過二次(全學年不得超過四次)。\n五、學校及其主管機關是否辦理模擬考及其辦理之日期、方式、命題方向等，應由學校與家長、老師充分溝通後，依共識決定。\n六、模擬考成績不得納入平時評量、定期評量及學期總成績中計算。\n七、模擬考之參與，應尊重學生、家長之意願，不得強迫其參加。\n八、模擬考所需相關費用，應由自願參加者負擔。但家境清寒者，得由學校協助以教育儲蓄戶等方式支應。","history":"1.100年2月18日教育部臺國(二)字第1000022142D號函辦理。\n2.100年2月21日北教國字第1000162660號函轉。\n3.教育部101年12月21日臺國(二)字第1010235065B號令102年1月1日生效。\n4.教育部國學前教育署103年10月2日臺教國署國字第1030094839B號令。"},{"title":"各級學校學生學年學期假期辦法","content":"第  1  條\n\n教育部(以下簡稱本部)為規範各級學校學生學年學期假期，特訂定本辦法。\n\n第  2  條\n\n各級學校以每年八月一日為學年之始，翌年七月三十一日為學年之終。其情形特殊者，經主管機關核准後得調整之。\n\n第  3  條\n\n一學年分為二學期，分別以八月一日至翌年一月三十一日、二月一日至七月三十一日各為一學期。\n國內大學與外國大學合作並經本部專案核定之學位專班，得視課程設計或合作學校之學期制度，調整前項學期起迄時間。\n\n第  4  條\n\n各級學校暑假、寒假日數及起訖日期，依下列之規定：\n一、暑假：六十日(起七月一日，訖八月二十九日為原則)。 \n二、寒假：二十一日(起一月二十一日，訖二月十日為原則)。\n\n第  5  條\n\n各級學校對於國定紀念日之放假及舉行紀念辦法，依中央之規定辦理。\n\n第  6  條\n\n各級學校對於本校紀念日之休假，每年不得超過一日。\n\n第  7  條\n\n各級學校應於寒假或暑假期滿之翌日，一律開學辦理註冊等手續，並正式上課。\n\n第  8  條\n\n各級學校得依下列規定，調整第四條所定之假期起訖日期：\n一、大專校院：因教學需要調整，並經校內行政會議審議通過。\n二、高級中等以下學校：\n(一) 因春節假期或其他需要，由本部會商各直轄市、縣(市)主管機關後，予以調整。\n(二) 因氣候或因應地方性、學校特殊需要：\n1.直轄市、縣（市）主管機關主管之高級中等以下學校，經各該主管機關事先報本部同意。\n2.本部主管高級中等學校，事先報本部同意。\n\n第  9  條\n\n教保服務機構之學年學期假期得比照國民小學規定辦理。\n\n第  10  條\n\n本辦法自發布日施行。","history":"1.99年7月26日臺參字第0990120320C號。\n2.100年2月8日臺參字第1000014262C號。\n3.103年6月19日教育部臺教高(一)字第 1030076053B號令。\n4. 114年7月17日教育部令臺教高（一）字第1142201437A 號修正部分條文。"},{"title":"本市立高中職定期評量期間行事曆之安排一案","content":"一、查「各級學校學生學年學期假期辦法」，係就學校學年學期以及寒暑假之起訖日期等進行規範，是項辦法並未授予各校安排「溫書假」之規定，各校定期評量期間仍應避免溫書假之安排。\n二、學校舉辦定期評量當日屬正常上課時間，未安排評量之節課，應安排學生各項教育學習活動，並請自98學年度起納入各校行事曆。","history":"98年5月20日北教中字第0980387587號。"},{"title":"有關本市國中小辦理定期評量期間得否安排溫書假一案","content":"一、 依據教育部98年04月22日台國(一)字第0980053659B號函暨本縣98年2月13日九大區中心學校校長業務研討會議決議辦理。\n二、 查「國民中小學九年一貫課程綱要」，全校全年授課日數以200天(不含國定假日及例假日)、每學期上課20週及每週上課5天為原則。但每週上課天數應配合人事行政局所訂政府行政機關辦公日數之相關規定辦理。\n三、 另查「各級學校學生學年學期假期辦法」，係就學校學年學期以及寒暑假之起訖日期等進行規範，是項辦法並未授予各校安排「溫書假」之規定，因此國民中小學定期評量應避免溫書假之安排。\n四、 學校舉辦定期評量當日屬正常上課時間，未安排評量之節課，應安排學生各項教育學習活動，並請自98學年度起納入各校行事曆。\n五、 本府91年8月9日北府教學字第0910484602號函有關「辦理定期評量期間之溫書假事宜」之相關規定停止適用。","history":"98年4月30日北教國字第0980319778號。"},{"title":"國三畢業考至畢業典禮期間，請妥予規劃多元感性之教育活動，切勿任意停課以維學生受教權益。","content":"","history":"86年2月5日八六北府教一字第067312號。"},{"title":"有關國中教育會考後至畢業離校之間，各校應視實際需求，考量學校特性，妥善規劃學生學習活動內容，並符合國民中小學九年一貫課程綱要及教學正常化之規定，以延伸學習。","content":"","history":"104年3月26日新北教中字第1040524329號。"},{"title":"國民中小學一律不宜在週一或假日隔天舉行考試或學科測驗","content":"","history":"83年3月4日八三北府教一字第068019號。"},{"title":"有關中小學能否以社團特色編班","content":"為發展學生性向、培養學生興趣，中小學所設立之社團，應按學生志願及性向分組，以社團組織型態進行，依每週教學節數，以全校統一時間或分年級統一時間實施，惟仍不宜以專設班級方式實施。","history":"92年4月7日北府教學字第0920266030號。"},{"title":"函轉教育部關於藝術才能優異學生鑑定安置之相關規範供參","content":"一、 依據教育部97年6月25日台特教字第0970117284號書函辦理。\n二、 依據特殊教育法、國民小學及國民中學常態編班及分組學習準則並無隨班附讀相關規定，故藝術才能班不得開放未通過資賦優異鑑定學生隨班附讀。\n三、 依據地方制度法第七十五條第四項規定，縣(市)政府辦理自治事項違背憲法、法律或基於法律授權之法規者，由中央各該主管機關報行政院予以徹銷、變更、廢止或停止其執行。另縣(市)政府辦理自治事項經中央各該主管機關令其限期改善未改善者，得將相關資料送請監察院處理。","history":"97年7月2日北教特字第0970479319號。"},{"title":"新北市高級中等學校學生在校作息時間規劃注意事項","content":"一、 新北市政府(以下簡稱本府)為規範主管高級中等學校(以下簡稱各校)安排學生在校作息時間，依十二年國民基本教育課程綱要總綱(以下簡稱總綱)訂定本注意事項。\n二、 各校訂定學生在校作息時間相關規定時，應考量高級中等學校階段學生身心發展需求、學校條件、社區特性、校園安全、交通狀況、家庭需求及其他相關因素，以促進學生身心健全發展、強化主動學習、提升學習品質為主要目的，並兼顧師生互動、班級經營及生活教育需求。\n三、 依總綱之規定，學習節數每週三十五節，其中包括必修與選修課程、團體活動時間及彈性學習時間。\n四、 前項學習節數，每日排課以七節為原則；學校有特殊需求者，應提報本府教育局許可後實施。\n五、 各校得訂定學生每日上學及放學時間；因代表隊培(集)訓、學校重要活動或其他特殊需求，在學生安全無虞前提下，各校得調整部分上放學時間。\n六、 學生因個人或家庭特殊因素，須提早上學或延遲放學時，各校應本維護學生安全之責，提供適當安置場所或相關措施。\n七、 各校於上午第一節開始上課以前，每週得實施全校集合活動至多一日；當週其餘日數，應由學生自主規劃運用，學生於上午第一節開始上課以前抵達上課地點即可。\n八、 各校於上午第一節開始上課以前，不得對學生實施任何學業成績評量。\n九、 非學習節數活動之時間及活動內容，由各校依本注意事項納入作息時間規劃辦理。\n十、 學生於非學習節數活動之參與狀況，不得列入出缺席紀錄。但得視其情節，採取適當且合乎比例原則之輔導或管教措施。\n十一、 前項管教措施，以運用正向管教措施為主，並得運用其他一般管教措施。但僅限於口頭糾正、列入日常生活表現紀錄、通知監護權人協請處理、書面自省或靜坐反省。\n十二、 各校實施課業輔導，依新北市公私立高級中等學校課業輔導實施要點規定辦理。\n十三、 前項課業輔導，不得提前講授各該科目教學進度表所定之課程內容，且不得對學生實施列入學業成績計算之評量。\n十四、 學校設有進修部、其他學制或班別者，除法令另有規定外，應依本注意事項規定辦理。\n十五、 各校訂定學生在校作息時間相關規定時，應依循民主參與之程序，與學生、教師及家長充分溝通，經校務會議通過後實施。\n十六、 本注意事項未規定者，依總綱及相關法令之規定辦理。","history":"1.中華民國109年8月6日新北市政府新北府教中字第 1091326707號函訂定全文12點；並自即日生效。\n2.中華民國111年6月14日新北市政府新北府教中字第 1111089330號函修正全文 1點；並自111年8月1日生效。"},{"title":"新北市國民中小學學生在校作息時間規劃注意事項","content":"一、 新北市政府(以下簡稱本府)為規範新北市所轄國民中學及國民小學(以下 簡稱各校)安排學生在校作息時間，依十二年國民基本教育課程綱要總綱(以下簡稱總綱)規定，訂定本注意事項。\n二、 為維護學生身心健康發展，衡酌學生成長生理需求，各校訂定學生在校作息時間相關規定時，應以健全身心發展、強調主動學習、提升學習品質為目的。\n三、 各校應依據學生需求、學校條件、社區特性及社會期待，並考量校園安全、 交通狀況及家庭需求等因素，訂定學生在校作息時間相關規定。\n四、 學習節數每日排課及每週節數應依總綱之規定；非學習節數之時間及活動內 容，由各校依本注意事項納入作息時間規劃辦理。前項學習節數，每日排課以七節為原則；各校如有特殊需求，應提報本府教育局(以下簡稱本局)許可後實施。\n五、 各校得訂定學生每日上學及放學時間，如因班級經營、課後社團活動、代表隊培(集)訓、學校重要活動或其他特殊需求，在學生安全無虞前提下，各校得調整部分上學及放學時間。\n六、 學生如因個人或家庭特殊因素，提早上學或延遲放學時，各校有維護學生安全之責，提供適當安置場所或相關必要措施。\n七、 為增進師生互動機會，以利班級經營及生活教育進行，各校得於上午第一節開始上課以前，實施非學習節數之活動。前項屬國民中學全校集合之活動，每週以不超過二日為原則；為維護學生身心健康，培養主動學習，每週至少得安排二日自主學習。\n八、 學生於非學習節數活動之參與狀況，不得列入出缺席紀錄。但得視其情節，採取適當之正向輔導管教措施。\n九、 各校實施課業輔導及課後照顧，依新北巿國民中學學生學習輔導實施要點及新北市國民小學辦理課後照顧服務班補充規定辦理。\n十、 各校設有進修補習學校等其他學制或班別者，其作息時間由各校依相關規定另訂之。\n十一、 各校應依本注意事項擬訂學生在校作息時間表，循民主參與之程序，與學生、教師及家長充分溝通，經課程發展委員會審議通過後，納入課程計畫，並經校務會議通過後報本局備查。\n十二、 本注意事項未規定者，依總綱及相關法令之規定辦理。","history":"110 年 7 月 26 日新北府教中字第 1101299467號函訂定發布。"},{"title":"國民小學及國民中學正常教學實施要點","content":"一、 教育部國民及學前教育署為落實國民小學及國民中學正常教學督導辦法（以下簡稱督導辦法）之規定，特訂定本要點。\n二、 督導辦法第二條第二款第二目所定依教師專長優先排課，應依下列規定辦理：\n（一） 依教師持有或加註之領域（科目）專長教師證書，安排課程教學，並優先聘任配課節數較多領域（科目）之專業師資。\n（二） 學校依專長排課後所餘課務，應優先配予具備該科第二專長之教師，或參加各級主管機關辦理增能研習之教師。\n（三） 配課時，同一位教師應長期配同一領域或科目，每位教師配課，不得超過二門。但國民小學及班級總數未達十五班之國民中學，或經各級主管機關認定特殊因素者，不在此限。\n（四） 同一領域之課程，除前款但書規定外，避免平均配予其他特定領域（科目）之教師。\n三、 督導辦法第二條第二款第三目所定課後輔導及留校自習應依下列規定辦理：\n（一） 以學生及教師自由參與為原則。以復習為主，不得為新進度之教授。\n（二） 學期中課後輔導，每日不得超過下午五時三十分，且不得於紀念日、節日之放假日及例假日辦理。\n（三） 留校自習，不得用於上課或考試，並應有學校人員或家長在場督導，負責安全、秩序之維護。\n（四） 學校人員協助辦理留校自習者，應依人事相關規定給予加班費或補休假。\n（五） 直轄市、縣（市）主管機關得就場地使用管理及學生安全需求，依國民教育法第三十二條第二項、第三項授權訂定自治法規，收取費用。。\n（六） 體育班因競賽進行集中訓練，獲得中央或地方體育主管機關補助加強課業經費者，其實施時間，不受第二款規定之限制。\n（七） 督導辦法第二條第二款第三目所定寒暑假學藝活動，其屬課業輔導者，應於週一至週五上午辦理，並準用前項第一款及第五款規定。\n四、 學校及教師不得要求學生購買參考書、測驗卷及課程外之教學相關資料。\n五、 學校實施學習評量，應訂定學生學習評量規定，督導教師依課程計畫之課程目標命題；其命題參考其他資料者，應進行轉化，不得原文照錄。\n（一） 定期評量時應落實審題機制及迴避原則，並確實掌握評量之品質。\n六、 學校應提供下列協助措施，以提升教師教學及評量知能：\n（一） 定期召開學校課程發展委員會與領域教學研究會，落實課程規劃、研討，及多元評量等功能，並提供配課教師參加。\n（二） 建立學校本位進修機制，對於未具專長之教師，應依其專業成長需求，提供優先進修之機會。\n（三） 訂定支持及獎勵措施，鼓勵教師實施多元評量。\n七、 直轄市、縣（市）主管機關為達成正常教學之目標，除依督導辦法落實督導外，應實施下列措施：\n（一） 落實課程計畫備查，確保學校課程計畫依國民中小學課程綱要實施。\n（二） 訂定課後輔導及寒暑假學藝活動規定。\n（三） 定期調查學校師資狀況及依教師專長排課情形，輔導專長師資不足學校，優先進用該科目或領域之專長教師。\n（四） 建立跨校合聘及巡迴教師制度。\n（五） 鼓勵教師參加增能研習，並參加在職進修取得第二專長。\n（六） 辦理學校教務行政人員之進修，提升其配課與排課能力，及帶動教學研究會、編製教學進度、進行課程評鑑、學生學習評量與其他實務知能。","history":"114年6月12日臺教國署國字第1145501679A號令"}];
let currentIndex = 0;
function renderList(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const list=document.getElementById('lawList'); list.innerHTML='';
 const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+'\n'+x.content+'\n'+x.history).toLowerCase().includes(q));
 document.getElementById('count').textContent=`${filtered.length} / ${laws.length} 項`;
 document.getElementById('none').classList.toggle('hidden',filtered.length>0);
 filtered.forEach(x=>{
  const b=document.createElement('button'); b.type='button';
  b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'active-law':'');
  b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title)}</span>`;
  b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};
  list.appendChild(b);
 });
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatLawText(content, lawIndex){
 const normalized=String(content||'').replace(/\\n/g,'\n');
 const lines=normalized.split('\n');
 // 第2至第6項：逐行保留原始段落，不把未編號的下一段併入上一段。
 if(lawIndex>=1 && lawIndex<=5){
  return lines.map(raw=>{
   const t=raw.trim();
   if(!t) return '<div class="doc-paragraph-gap"></div>';
   const article=t.match(/^(第\s*\d+\s*條)(.*)$/);
   const level1=t.match(/^([一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+、)(.*)$/);
   const level2=t.match(/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)])(.*)$/);
   const level3=t.match(/^([0-9０-９]+[、.．])(.*)$/);
   const level4=t.match(/^([（(][0-9０-９]+[）)])(.*)$/);
   if(article) return '<div class="doc-row doc-article"><span class="doc-marker">'+esc(article[1].replace(/\s+/g,''))+'</span><span class="doc-copy">'+esc(article[2].trim())+'</span></div>';
   if(level1) return '<div class="doc-row doc-level-1"><span class="doc-marker">'+esc(level1[1])+'</span><span class="doc-copy">'+esc(level1[2].trim())+'</span></div>';
   if(level2) return '<div class="doc-row doc-level-2"><span class="doc-marker">'+esc(level2[1])+'</span><span class="doc-copy">'+esc(level2[2].trim())+'</span></div>';
   if(level3) return '<div class="doc-row doc-level-3"><span class="doc-marker">'+esc(level3[1])+'</span><span class="doc-copy">'+esc(level3[2].trim())+'</span></div>';
   if(level4) return '<div class="doc-row doc-level-4"><span class="doc-marker">'+esc(level4[1])+'</span><span class="doc-copy">'+esc(level4[2].trim())+'</span></div>';
   return '<div class="doc-row doc-paragraph"><span class="doc-marker"></span><span class="doc-copy">'+esc(t)+'</span></div>';
  }).join('');
 }
 return normalized.split('\n').map(line=>{
  if(!line.trim()) return '';
  const t=line.trim();
  const safeText=esc(t);
  const article=t.match(/^(第\s*\d+\s*條)(.*)$/);
  const level0=t.match(/^(壹、)(.*)$/);
  const level1=t.match(/^([一二三四五六七八九十百]+、)(.*)$/);
  const level2=t.match(/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)])(.*)$/);
  const level3=t.match(/^([0-9０-９]+[、.．、])(.*)$/);
  const level4=t.match(/^([（(][0-9０-９]+[）)])(.*)$/);
  if(article) return '<div class="doc-row doc-level-1 doc-article"><span class="doc-marker">'+esc(article[1].replace(/\s+/g,''))+'</span><span class="doc-copy">'+esc(article[2].trimStart())+'</span></div>';
  if(level0) return '<div class="doc-row doc-level-0"><span class="doc-marker">'+esc(level0[1])+'</span><span class="doc-copy">'+esc(level0[2].trimStart())+'</span></div>';
  if(level1) return '<div class="doc-row doc-level-1"><span class="doc-marker">'+esc(level1[1])+'</span><span class="doc-copy">'+esc(level1[2].trimStart())+'</span></div>';
  if(level2) return '<div class="doc-row doc-level-2"><span class="doc-marker">'+esc(level2[1])+'</span><span class="doc-copy">'+esc(level2[2].trimStart())+'</span></div>';
  if(level3) return '<div class="doc-row doc-level-3"><span class="doc-marker">'+esc(level3[1])+'</span><span class="doc-copy">'+esc(level3[2].trimStart())+'</span></div>';
  if(level4) return '<div class="doc-row doc-level-4"><span class="doc-marker">'+esc(level4[1])+'</span><span class="doc-copy">'+esc(level4[2].trimStart())+'</span></div>';
  return '<div class="doc-row doc-level-1 doc-row-continuation"><span class="doc-marker"></span><span class="doc-copy">'+safeText+'</span></div>';
 }).join('');
}
function renderDetail(){
 const law=laws[currentIndex];
 document.getElementById('detail').innerHTML=`
 <div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ${currentIndex+1} 項／共 ${laws.length} 項</span><span class="text-xs text-slate-400">常態編班、教學正常化</span></div>
 <h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">${esc(law.title)}</h2>
 <div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px] text-slate-700 ${(currentIndex===0||currentIndex===6||currentIndex===15||currentIndex===16||currentIndex===17||currentIndex===22)?'first-law-format':(currentIndex>=1&&currentIndex<=5?'law02-match':'')}">${formatLawText(law.content,currentIndex)}</div></div>
 <div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i> 日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">${law.history.trim()?esc(law.history):'原始文件未提供此項資料。'}</div></div>
 <div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" ${currentIndex===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" ${currentIndex===laws.length-1?'disabled':''} class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`;
}
function go(d){currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
renderList();renderDetail();
</script></body></html>
