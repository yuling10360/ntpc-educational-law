學校保管；已停辦之學校，本局得指定所屬其他學校代管其學生學籍資料，並受理學生申請或查詢及核發有關學籍資料。", "history": "102年2月7日新北市政府北府教社字第 1021132023號令訂定發布全文5 點；並自即日起生效。"}, {"title": "高級中等學校學生學習評量辦法", "content": "第  1  條\n本辦法依高級中等教育法(以下簡稱本法)第四十五條第二項規定訂定之。\n第  2  條\n高級中等學校(以下簡稱學校)學生學習評量，應以了解學生學習情形，激發學生多元潛能，培養學生核心素養，促進學生適性發展為目的，並作為教師教學及輔導之依據。\n第  3  條\n學校學生學習評量，包括學業成績評量及德行評量。\n第  4  條\n學業成績評量，採百分制評定，並得註記質性文字描述。\n學業成績評量，按學生身心發展及個別差異，兼顧科目認知、技能及情意之教學目標，採多元評量方式，並於日常及定期為之；其各科目日常及定期學業成績評量之占分比率，由學校定之。\n前項多元評量，得採筆試、作業、口試、表演、實作、實驗、見習、參觀、報告、資料蒐集整理、鑑賞、晤談、實踐、自我評量、同儕互評或檔案評量等方式辦理。\n第  5  條\n學業成績評量之科目，依高級中等學校課程綱要(以下簡稱課程綱要)之規定。\n每一科目學分之計算，以每學期每週修習一節或總修習節數達十八節，為一學分。\n第  6  條\n學生於定期學業成績評量時，因故不能參加全部科目或部分科目之評量，經學校核准給假者，學校得審酌其請假事由後，准予補行考試或採\n其他方式評量之；其評量方式、成績採計及登錄，由學校定之。\n第  7  條\n學期學業成績總平均之計算，為各科目學期學業成績乘以各該科目學分數所得之總和，再除以總學分數。\n學年學業成績總平均之計算，以該學年度 各學期學業成績總平均成績平均之。\n各科目學年學業成績之計算，以該學年度 該科目各學期學業成績平均之；學生各科目學期學業成績，依第十條第二項規定應予補考者，其該科目學年學業成績之計算，以其該科目該學年各學期原成績或補考成績\n擇優登錄計算，不得與該科目重修或補修後之成績平均計算。\n各科目學期學業成績之計算，遇小數點時，採四捨五入法，取整數計算；學期、學年學業成績總平均及各科目學年學業成績之計算，取小數點後一位數，第二位數採四捨五入法進入第一位數。\n第  8  條\n學業成績以一百分為滿分，其及格基準規定如下：\n一、 一般學生：以六十分為及格。\n二、 依各種升學優待辦法規定入學之原住民學生、重大災害地區學生、政府派赴國外工作人員子女、退伍軍人、僑生、蒙藏學生、外國學生、境外優秀科學技術人才子女及基於人道考量、國際援助或其他特殊身分經專案核定安置之學生：一年級以四十分為及格，二年級以五十分為及格，三年級以後以六十分為及格。\n三、 依中等以上學校技藝技能優良學生甄審及保送入學辦法規定入學之學生：一年級、二年級以五十分為及格，三年級以後以六十分為及格。\n四、 依中等以上學校運動成績優良學生升學輔導辦法規定入學之學生：一年級、二年級以四十分為及格，三年級以後以五十分為及格。\n身心障礙學生之學業成績評量，應依特殊教育法及高級中等以下學校特殊教育課程教材教法及評量實施辦法相關規定辦理。\n第  9  條\n學生因其居住地區或就讀學校發生災害防救法第二條第一款所定災害或其他重大變故情形，學校認有調整前條所定學業成績及格基準之必要者，得擬具計畫，經各該特定科目教學研究委員會及行政會議通過後調整之，並妥為保存；其調整後之成績及格基準，不得低於四十分。\n前項計畫之內容，應包括下列事項：\n一、 適用調整學業成績及格基準之學生姓名、學號、年級、科別、班級與適用學期及學年。\n二、 學校已實施之多元評量執行策略及學生學習補救措施。\n三、 學生學習成就差異分析、學校學習評量調整方案及調整之必要性說明。\n第  10  條\n學生學期學業成績達第八條或前條所定及格基準之科目，授予學分。\n學生學期學業成績未達第八條或前條所定及格基準之科目，其成績達下列基準者，學校應予補考：\n一、 及格基準分數為五十分至六十分者：四十分。\n二、 及格基準分數為四十分至四十九分者：三十分。\n前項補考科目，其補考所得之成績，達第八條或前條所定及格基準者，授予學分，並依及格基準分數登錄；未達及格基準者，不授予學分，並就原成績或補考成績擇優登錄。\n學校每學期辦理補考，以一次為限。但學生因故不能參加補考，經學校核准給假者，學校得審酌其請假事由後，准予補行考試或採其他方式評量之。\n學生學年學業成績達第八條或前條所定及格基準之科目，該學年度各學期均授予學分；其各學期成績仍應以該學期實得分數登錄。\n第  11  條\n學生於本法第四十二條規定之修業期限內，各學期學業成績未達第八條或第九條所定及格基準之科目，得申請重修。\n課程綱要規定應修習之部定及校訂必修科目，學生未修習者，應予補修。轉學、轉科(學程)者，並得就應修習之部定必修及校訂必修以外科目，申請補修。\n學校辦理重修、補修之方式，依下列規定順序為之：\n一、 專班辦理：申請學生人數達十五人以上者，由學校開設專門班級，供學生修讀；其實施方式得採部分數位平臺之學習。每一學分不得少於六節。\n二、 自學輔導：\n(一) 申請學生未達前款所定人數者，由教師指定教材或數位平臺，供學生自行修讀，並安排面授指導及教學；\n(二) 每一學分之面授指導及教學節數，規定如下:\n１、 屬重修者，不得少於三節。\n２、 屬補修者，不得少於六節。但採數位平臺自行修讀者，其面授指導及教學節數，不得少於三節。\n(三)前二目面授指導及教學，得採數位遠距方式。\n三、 隨班修讀：依學生能力及學校排課等因素，安排學生隨其他班級課程修讀。\n前項各款之實施時間、課程內容及實際授課節數，由學校定之。\n重修、補修及延長修業期限學生之學業成績評量，應依第四條規定辦理。\n第  12  條\n學生依前條規定完成重修、補修後，其所得成績達第八條或第九條所定及格基準之科目，授予學分；未達及格基準者，不授予學分。\n前項重修、補修後之科目成績登錄，依下列規定辦理：\n一、 重修：達第八條或第九條所定及格基準者，依所定之及格基準分數登錄；未達及格基準者，就重修前後成績，擇優登錄。\n二、 補修：依實得成績登錄。\n第  13  條\n學生各學年度第一學期取得之學分數，未達該學期修習總學分數二分之一者，第二學期得由學校輔導其減修學分；其減修之相關規定，由學校定之。\n休學學生申請提前一學期復學者，準用前項規定。\n第  14  條\n學生各該學年度取得之學年總學分數，未達該學年度修習總學分數二分之一者，得於學校規定日期前申請重讀；各該學年度取得之學年總學分數，應包括該學年度結束前補考、重修及補修後取得之學分。\n學生重讀前，各該學年度原已修習且取得學分之科目，依下列規定辦理：\n一、得申請列抵學分，並應於重讀學年之各學期開學日前提出。\n二、經學校審查符合重讀時課程綱要之規定者，准予列抵學分；該科目成績以原已修習所得成績登錄。\n學生重讀前，各該學年度原已修習而未取得學分之科目，或學生未依前項第一款規定申請列抵學分之科目，依下列規定辦理：\n一、不得列抵學分。\n二、經再次修習，其科目成績以重讀後取得之實得分數登錄。但經學校審查符合重讀時課程綱要之規定者，其科目成績以原已修習所得成績，或重讀後取得之實得分數，擇優登錄。\n學生重讀之學年所修習之科目，屬重讀前未曾修習，或原已修習而經學校審查未符合該重讀時課程綱要之規定者，該科目成績以重讀後取得之實得分數登錄。\n學校為協助學生取得畢業應修學分數，應針對學生各學期學分取得情形，提供預警措施並給予個別輔導。\n轉學生入學時、轉科（學程）學生轉科（學程）時及休學學生復學時，準用前五項規定。\n第  15  條\n學校應建置學生學習支援系統，並依日常及定期學業成績評量結果進行分析，作為學期中實施差異化教學及補救教學之依據，以輔導學生適性學習，發揮學生潛能；其實施基準及方式，由學校定之。\n第  16  條\n新生與轉學生入學前、轉科(學程)學生轉科(學程)前及休學學生復學前，已修習且取得學分之科目，經審查符合入學、轉入、轉科(學程)或復學時課程綱要之規定，或經測驗及格者，得列抵學分，該科目成績，以原成績或測驗成績登錄；列抵學分及成績登錄之規定，由學校定之。\n學生轉學、轉科(學程)，經學校依第一項規定辦理列抵學分後，得免依第十四條第一項規定重讀；申請重讀者，學校得視該學生學習狀況與學校編班、班級人數等情形，依下列規定辦理：\n一、 符合高級中等學校學生學籍管理辦法第十三條及第十四條第一款規定者，編入適當之年級。\n二、 符合高級中等學校學生學籍管理辦法第十四條第二款及第三款規定者，編入適當之年級、科(學程)。\n學生依高級中等學校學生學籍管理辦法第十條第一項規定借讀時，原學校應會同借讀學校審查借讀修習科目及學分；借讀期滿後，借讀學校應通知原學校依原學校之科目登錄其成績；未取得學分之科目，依第十一條規定辦理。\n第  17  條\n資賦優異學生得依身心發展狀況、學習需要及意願，向學校申請縮短修業年限；其辦理方式，應依特殊教育學生調整入學年齡及修業年限實施辦法及其相關法規之規定辦理。\n第  17  條之 1\n學生代表我國參加國際數理學科奧林匹亞競賽或國際科學展覽成績優良，依參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升學優待辦法之規定，取得保送專科學校二年制就讀或保送、推薦升入大學就讀資格者，得就與其選訓或參賽項目（科目）所涉相關學術範疇之科目，向學校申請列抵學分及成績登錄。\n前項申請、審查基準、列抵學分之條件、成績登錄及其他相關規定，由學校定之。\n第  18  條\n學生取得依高級中等學校辦理學生國外學歷採認辦法規定採認之國外學歷，其在國外所修之科目，經學校審查符合採認時課程綱要之規定，或經測驗及格者，得列抵學分；該科目成績，以原成績或測驗成績登錄。\n學生經學校核准後，赴國外學校、國內外之公民營事業機構職場或就業導向之職訓機構等場所進修、訓練、實習、學習或修習課程，取得學習成就、教育訓練證明或科目成績學分，經學校審查符合採認時課程綱要之規定者，得列抵該科目學分及成績登錄。\n學校辦理前二項學生學歷、成績證明、學習成就、教育訓練或成績學分之審查及赴國外高級中等以上學校學習期間之認定，應依相關法規規定為之。\n第一項及第二項審查、測驗、列抵學分及成績登錄之規定，由學校定之。\n第  19  條\n學校得依下列方式開設課程：\n一、選定數位平臺開設下列數位學習課程：\n（一）選修課程。\n（二）第二十條所定彈性學習時間課程。\n（三）學校為依前條第二項規定赴國外學習學生開設，並經各該主管機關\n核准之部定必修及校訂必修課程。\n二、與國內、外其他學校合作開設跨校選修之課程。\n三、與國內、外大專校院合作開設預修課程或選修課程。\n前項課程，應納入學校課程計畫，並報各該主管機關備查。\n第一項第一款課程之實施、學業成績評量方式、學分採計、成績登錄及其他相關事項，由學校定之；第一項第二款及第三款課程採數位遠距教學實施者，該等事項由學校與合作之其他學校、大專校院協議後定之。\n第  19  條之 1\n依偏遠地區學校分級及認定標準核定之偏遠地區學校，或其他經中央主管機關核定之教育資源需要協助學校，其部定必修或校訂必修科目無法聘任合格教師實施教學者，經各該主管機關同意後，得與國內其他學校合作開設數位遠距教學課程。\n前項數位遠距教學課程，其課程實施與學業成績評量方式、學分採計、成績登錄及其他相關事項，由學校與合作之其他學校協議後定之。\n第  19  條之 2\n學生居住地區或就讀學校所在地區，發生災害防救法第二條第一款所定災害、傳染病防治法第三條第一項所定傳染病，或其他重大變故時，學校得以數位遠距教學或其他適當方式實施教學，並辦理學習評量。\n第  20  條\n學生修習課程綱要所定技術型高級中等學校彈性學習時間課程，符合下列各款規定，且於備查之學校課程計畫標註授予學分者，授予彈性學習時間學分：\n一、 所修讀者為全學期授課之充實增廣或補強性課程。\n二、 所得成績達第八條或第九條所定及格基準。\n三、 無第二十五條第一項所定缺課致成績零分之情形。\n前項所得成績，得不登錄或以實得成績登錄。但不納入第七條第一項至第三項平均成績計算。\n第  21  條\n德行評量，依學生行為事實作綜合評量，不評定分數及等第。\n德行評量項目如下：\n一、 日常生活綜合表現及校內外特殊表現。\n二、 服務學習。\n三、 獎懲紀錄。\n四、 出缺席紀錄。\n五、 具體建議。\n第  22  條\n德行評量以學期為階段，由導師依前條第二項各款規定，參考各科目任課教師及相關行政單位提供之意見，依行為事實記錄，並視需要提出具體建議，經學生事務相關會議審議後，作為學生適性輔導及其他適性教育處置之依據。\n重修、補修學生及延長修業期限學生之德行評量，由學校依其修課情形，並參酌一般學生之規定定之。\n學生借讀期間之德行評量，由借讀學校依本辦法規定辦理；借讀期滿後，借讀學校應提供借讀學生德行評量項目紀錄予原學校登錄。\n第  23  條\n德行評量之獎懲，依下列規定辦理：\n一、 獎勵：分為嘉獎、小功及大功。\n二、 懲處：分為警告、小過及大過。\n學生之獎懲，應通知學生、導師、家長或監護人，並於學期結束時列入德行評量。\n第一項之獎懲項目、事由、程序、獎懲相抵及銷過之相關規定，由學校定之。\n第  24  條\n學生請假別，分為公假、事假、病假、生理假、身心調適假、婚假、產前假、娩假、陪產假、流產假、育嬰假及喪假；其請假規定，由學校定之。\n學生缺課未經學校依請假規定核准給假者，為曠課。\n德行評量之出缺席紀錄，依學生請假規定辦理。\n第  25  條\n學生曠課及事假之缺課節數合計達該科目全學期總修習節數三分之一者，該科目學期學業成績以零分計算。但因學生或其家庭發生重大變故所請事假而缺課之節數，經提學生事務相關會議通過後，得不納入計算。\n學生缺課致影響課業時，學校應視其情形提供預警措施，並給予個別輔導。\n第  26  條\n學生除公假外，全學期缺課節數達修習總節數二分之一，或曠課累積達四十二節者，經提學生事務相關會議後，應依法令規定進行適性輔導及適性教育處置。\n第  27  條\n學生學習評量結果，依下列規定處理：\n一、 符合下列情形者，准予畢業，並發給畢業證書：\n(一)修業期滿，符合課程綱要所定畢業條件。\n(二)修業期間德行評量之獎懲紀錄相抵後，未滿三大過。\n二、 修業期滿，修畢課程綱要所定應修課程，且取得一百二十個畢業應修學分數，而未符合前款規定者，發給修業證明書。\n學生修畢實用技能學程分段課程，成績及格者，得向學校申請發給分段課程修業證明書。\n第  28  條\n學生重讀、轉學或復學時，因中央主管機關發布新課程綱要，致其適用之畢業條件已變更者，由學校從寬就變更前後畢業條件擇一適用，並進行列抵學分及成績登錄。\n第  29  條\n學生學習評量之結果，應妥為保存及管理，並維護個人隱私及權益；其評量資料之蒐集、處理及利用，應依個人資料保護法及其相關法規之規定辦理。\n第  30  條\n學校依本辦法規定，自行訂定之學生學習評量補充規定，應經校務會議通過後實施。\n第  31  條\n本辦法除中華民國一百十三年八月二十一日修正發布之條文，自一百十三年八月一日施行外，自發布日施行。", "history": "1.103年1月8日教育部臺教授國部字第1020127904A號令訂定發布全文28 條，自103年8 月1 日施行。\n\n2.108 年6月18日教育部臺教授國部字第1080057314B號令修正。\n\n3. 114年12月18日教育部臺教授國部字第1145406544A號令修正第十一條、第十九條。"}, {"title": "高級中等學校進修部學生學習評量辦法", "content": "第  1  條\n本辦法依高級中等教育法第八條第三項規定訂定之。\n第  2  條\n高級中等學校(以下簡稱學校)進修部學生學習評量，應以了解學生學習情形，激發學生多元潛能，培養學生核心素養，促進學生適性發展為目的，並作為教師教學及輔導之依據。\n第  3  條\n學校進修部學生學習評量，包括學業成績評量及德行評量。\n第  4  條\n學業成績評量，採百分制評定，並得註記質性文字描述。\n學業成績評量，按學生身心發展及個別差異，兼顧科目認知、技能及情意之教學目標，採多元評量方式，並於日常及定期為之；其各科目日常及定期學業成績評量之占分比率，由學校定之。\n前項多元評量，得採筆試、作業、口試、表演、實作、實驗、見習、參觀、報告、資料蒐集整理、鑑賞、晤談、實踐、自我評量、同儕互評或檔案評量等方式辦理。\n第  5  條\n學業成績評量之科目及節數，依高級中等學校課程綱要(以下簡稱課程綱要)之規定。\n第  6  條\n學生於定期學業成績評量時，因故不能參加全部科目或部分科目之評量，經學校核准給假者，學校得審酌其請假事由後，准予補行考試或採其他方式評量之；其評量方式、成績採計及登錄，由學校定之。\n第  7  條\n學期學業成績總平均之計算，為各科目學期學業成績乘以各該科目每週修習節數所得之總和，再除以每週科目修習總節數。\n學年學業成績總平均之計算，以各科目學年學業成績乘以各該科目第一學期、第二學期平均每週修習節數所得之總和，再除以每週科目修習總節數。\n各科目學期學業成績之計算，遇小數點時，採四捨五入法，取整數計算；學期、學年學業成績總平均及各科目學年學業成績之計算，取小數點後一位數，第二位數採四捨五入法進入第一位數。\n第  8  條\n各科目學年學業成績之計算，以該科目第一學期、第二學期成績平均計算；該科目第一學期、第二學期每週科目修習節數不同時，其學年學業成績依各學期修習節數比例計算。\n前項科目經定為學期課程者，以其學期學業成績為學年學業成績。\n第  9  條\n學業成績評量以學期為階段，以一百分為滿分；其及格基準規定如下：\n一、 一般學生：以六十分為及格。但其單一科目第一學期學業成績達五十分且第二學期學業成績及格時，學年學業成績經計算仍未達六十分者，其學年學業成績視為及格，並以六十分登錄。\n二、 依各種升學優待辦法規定入學之原住民學生、重大災害地區學生、政府派赴國外工作人員子女、退伍軍人、蒙藏學生、外國學生、境外優秀科學技術人才子女及基於人道考量、國際援助或其他特殊身分經專案核定安置之學生：一年級以四十分為及格，二年級以五十分為及格，三年級以後以六十分為及格。\n三、 依中等以上學校技藝技能優良學生甄審及保送入學辦法規定入學之學生：一年級、二年級以五十分為及格，三年級以後以六十分為及格。\n四、 依中等以上學校運動成績優良學生升學輔導辦法規定入學之學生：一年級、二年級以四十分為及格，三年級以後以五十分為及格。\n身心障礙學生之學業成績評量，應依特殊教育法及高級中等以下學校特殊教育課程教材教法及評量實施辦法相關規定辦理。\n第  10  條\n學生因其居住地區或就讀學校發生災害防救法第二條第一款所定災害或其他重大變故情形，學校認有調整前條所定學業成績及格基準之必要者，得擬具計畫，經各該特定科目教學研究委員會及行政會議通過後調整之，並妥為保存；其調整後之成績及格基準不得低於四十分。\n前項計畫之內容，應包括下列事項：\n一、 適用調整學業成績及格基準之學生姓名、學號、年級、科別、班級與適用學期及學年。\n二、 學年學業成績及格基準之調整情形。\n三、 學校已實施之多元評量執行策略及學生學習補救措施。\n四、 學生學習成就差異分析、學校學習評量調整方案及調整之必要性說明。\n第  11  條\n學校進修部採學年學時制，學生修畢各學年學業，成績符合下列各款規定之一者，准予升級：\n一、 各科目學年學業成績均及格。\n二、 學年學業成績符合下列各目情形：\n(一) 不及格科目每週修習節數之總和，未超過全部科目每週總修習節數二分之一，或不及格科目數未超過全部科目數二分之一。\n(二) 無任何科目之學年學業成績零分。\n(三) 學年學業成績總平均及格。\n第  12  條\n學生學年學業成績未符合前條升級規定者，其不及格科目應予補考，但零分科目除外。補考採多元評量方式，並以二次為限。\n前項補考科目，其補考所得之成績，達第九條或第十條所定及格基準者，依及格基準分數登錄；未達及格基準者，就原成績或補考成績擇優登錄。\n學生學年學業成績經補考仍未符合前條升級規定者，應重讀。\n第  13  條\n學校應建置學生學習支援系統，並依日常及定期學業成績評量結果進行分析，作為學期中實施差異化教學及補救教學之依據，以輔導學生適性學習，發揮學生潛能；其實施基準及方式，由學校定之。\n第  14  條\n新生、轉學生入學前、轉科生轉科前及休學生復學前，已修習且成績及格之科目，經學校審查符合入學、轉入、轉科或復學時課程綱要之規定，或經測驗及格者，得列抵；其科目成績，依原成績或測驗成績登錄。\n前項審查、測驗及列抵科目及成績登錄之規定，由學校定之。\n學校應視第一項轉學生、轉科生審查或測驗結果，編入適當之年級、科班就讀。\n第  15  條\n學生取得依高級中等學校辦理學生國外學歷採認辦法規定採認之國外學歷，其在國外所修之科目成績，經學校審查符合採認時課程綱要之規定，或經測驗及格者，得列抵；該科目成績，經學校審查符合採認時課程綱要之規定者，得列抵科目及成績登錄。\n學校辦理前二項學生學歷、成績證明、學習成就、教育訓練或科目成績之審查及赴國外高級中等以上學校學習期間之認定，應依相關法規規定為之。\n第一項及第二項審查、測驗、列抵科目及成績登錄之規定，由學校定之。\n第  16  條\n學校得依下列方式開設課程：\n一、選定數位平臺開設下列數位學習課程：\n（一）選修課程。\n（二）學校為依前條第二項規定赴國外學習學生開設，並經各該主管機關      核准之部定必修及校訂必修課程。\n二、與國內、外其他學校合作開設跨校選修之課程。\n三、與國內、外大專校院合作開設預修課程或選修課程。\n前項課程，應納入學校課程計畫，並報各該主管機關備查。\n第一項第一款課程之實施、學業成績評量方式、科目採計、成績登錄及其他相關事項，由學校定之；第一項第二款及第三款課程採數位遠距教學實施者，該等事項由學校與合作之其他學校、大專校院協議後定之。\n第  16  條之  1\n依偏遠地區學校分級及認定標準核定之偏遠地區學校，或其他經中央主管機關核定之教育資源需要協助學校，其部定必修或校訂必修科目無法聘任合格教師實施教學者，經各該主管機關同意後，得與國內其他學校合作開設數位遠距教學課程。\n前項數位遠距教學課程，其課程實施與學業成績評量方式、成績採計與登錄及其他相關事項，由學校與合作之其他學校協議後定之。\n第  16  條之  2\n學生居住地區或就讀學校所在地區，發生災害防救法第二條第一款所定災害、傳染病防治法第三條第一項所定傳染病，或其他重大變故時，學校得以數位遠距教學或其他適當方式實施教學，並辦理學習評量。\n第  17  條\n德行評量，依學生行為事實作綜合評量，不評定分數及等第。\n德行評量項目如下：\n一、 日常生活綜合表現及校內外特殊表現。\n二、 服務學習。\n三、 獎懲紀錄。\n四、 出缺席紀錄。\n五、 具體建議。\n第  18  條\n德行評量以學期為階段，由導師依前條第二項各款規定，參考各科目任課教師及相關行政單位提供之意見，依行為事實記錄，並視需要提出具體建議，經學生事務相關會議審議後，作為學生適性輔導及其他適性教育處置之依據。\n第  19  條\n德行評量之獎懲，依下列規定辦理：\n一、 獎勵：分為嘉獎、小功及大功。\n二、 懲處：分為警告、小過及大過。\n學生之獎懲，應通知學生、導師、家長或監護人，並於學期結束時列入德行評量。\n第一項之獎懲項目、事由、程序、獎懲相抵及銷過之相關規定，由學校定之。\n第  20  條\n學生請假別，分為公假、事假、病假、生理假、身心調適假、婚假、產前假、娩假、陪產假、流產假、育嬰假及喪假；其請假規定，由學校定之。\n學生缺課未經學校依請假規定核准給假者，為曠課。\n德行評量之出缺席紀錄，依學生請假規定辦理。\n第  21  條\n學生曠課及事假之缺課節數合計達該科目全學期修習總節數三分之一者，該科目學期學業成績以零分計算。但因學生或其家庭發生重大變故所請事假而缺課之節數，經提學生事務相關會議通過後，得不納入計算。\n學生缺課致影響課業時，學校應視其情形提供預警措施，並給予個別輔導。\n第  22  條\n學生除公假外，全學期缺課節數達修習總節數二分之一，或曠課累積達三十六節者，經提學生事務相關會議後，應依法令規定進行適性輔導及適性教育處置。\n第  23  條\n學生學習評量結果，依下列規定處理：\n一、 符合下列情形者，准予畢業，並發給畢業證書：\n(一) 修業期滿，且各學年學業成績符合第十一條規定。\n(二) 修業期間德行評量之獎懲紀錄相抵後，未滿三大過。\n二、 修業期滿，而學習評量結果未符合前款規定者，發給修業證明書。\n第  24  條\n學生學習評量之結果，應妥為保存及管理，並維護個人隱私及權益；其評量資料之蒐集、處理及利用，應依個人資料保護法及其相關法規之規定辦理。\n第  25  條\n學校依本辦法規定訂定之學生學習評量補充規定，應經校務會議通過後實施。\n第  26  條\n獨立設立或大學校院附設之高級中等進修學校，其學生學習評量，適用本辦法之規定。\n第  27  條\n本辦法自中華民國一百零八年八月一日施行。\n本辦法修正條文，除中華民國一百十三年八月二十一日修正發布之條文，自一百十三年八月一日施行外，自發布日施行。", "history": "1.中華民國103年1月8日教育部臺教授國部字第1020127905A號令訂定發布全文25條；並自103年8月1日施行。\n\n2.中華民國108年8月5日教育部臺教授國部字第1080083878B號令修正發布全文27條；並自108年8月1日施行。\n\n3.中華民國111年7月29日教育部臺教授國部字第1110088745A號令修正發布第2、3、11、16、27條條文；增訂第16-1、16-2條條\n文；並自發布日施行。\n\n4.中華民國114年12月18日教育部臺教授國部字第1145406545A號令修正第十六條。"}, {"title": "國民小學及國民中學學生成績評量辦法", "content": "第  1  條\n本辦法依國民教育法第四十條第一項規定訂定之。\n第  2  條\n國民小學及國民中學(以下簡稱國民中小學)學生成績評量，以協助學生德智體群美五育均衡發展為目的，並具有下列功能：\n學生據以瞭解自我表現，並調整學習方法及態度。\n教師據以調整教學及評量方式，並輔導學生適性學習。\n學校據以調整課程計畫，並針對學生需求安排激勵方案或補救教學。\n學生之法定代理人據以瞭解學生學習表現，並與教師、學校共同督導學生有效學習。\n各級主管機關據以進行學習品質管控，並調整課程及教學政策。\n第  3  條\n國民中小學學生成績評量，應依領域學習課程、彈性學習課程及日常生活表現，分別評量之；其評量範圍及內涵如下：\n一、 領域學習課程、彈性學習課程：\n(一) 範圍：包括國民中小學課程綱要所定領域學習課程、彈性學習課程及其所融入之議題。\n(二) 內涵：包括核心素養、學習重點、學生努力程度、進步情形，並應兼顧認知、情意、技能及參與實踐等層面，且重視學習歷程及結果之分析。\n二、 日常生活表現：評量範圍及內涵，包括學生出缺席情形、獎懲紀錄、團體活動表現、品德言行表現、公共服務及校內外特殊表現等。\n第  4  條\n國民中小學學生成績評量原則如下：\n一、 目標：應符合教育目的之正當性。\n二、 對象：應兼顧適性化及彈性調整。\n三、 時機：應兼顧平時及定期。\n四、 方法：應符合紙筆測驗使用頻率最小化。\n五、 結果解釋：應以標準參照為主，常模參照為輔。\n六、 結果功能：形成性及總結性功能應並重；必要時，應兼顧診斷性及安置性功能。\n七、 結果呈現：應兼顧質性描述及客觀數據。\n八、 結果管理：應兼顧保密及尊重隱私。\n第  5  條\n國民中小學學生成績評量，應依第三條規定，並視學生身心發展、個別差異、文化差異及核心素養內涵，採取下列適當之多元評量方式：\n一、 紙筆測驗及表單：依重要知識與概念性目標，及學習興趣、動機與態度等情意目標，採用學習單、習作作業、紙筆測驗、問卷、檢核、評定量表或其他方式。\n二、 實作評量：依問題解決、技能、參與實踐及言行表現目標，採書面報告、口頭報告、聽力與口語溝通、實際操作、作品製作、展演、鑑賞、行為觀察或其他方式。\n三、 檔案評量：依學習目標，指導學生本於目的導向系統性彙整之表單、測驗、表現評量與其他資料及相關紀錄，製成檔案，展現其學習歷程及成果。\n特殊教育學生之成績評量方式，由學校依特殊教育法及其相關規定，衡酌學生學習需求及優勢管道，彈性調整之。\n第  6  條\n國民中小學學生居住地區或就讀學校所在地區，發生災害防救法第二條第一款所定災害、傳染病防治法第三條第一項所定傳染病，或其他重大變故，致無法實體授課時，學校得以數位遠距教學或其他適當方式實施教學，並辦理學習評量。\n第  7  條\n國民中小學學生成績評量時機，分為平時評量及定期評量二種。\n領域學習課程評量，應兼顧平時評量及定期評量；彈性學習課程評量，應以平時評量為原則，並得視需要實施定期評量。\n前項平時評量中紙筆測驗之次數，於各領域學習課程及彈性學習課程，均應符合第四條第四款最小化原則；定期評量中紙筆測驗之次數，每學期至多三次。\n學生因故不能參加定期評量，經學校核准給假者，得補行評量；其成績以實得分數計算為原則。\n日常生活表現以平時評量為原則，評量次數得視需要彈性為之。\n第  8  條\n國民中小學學生成績評量之評量人員如下：\n一、 各領域學習課程及彈性學習課程：由授課教師評量，且應於每學期初，向學生及家長說明評量計畫。\n二、 日常生活表現：由導師參據學校各項紀錄、各領域學習課程與彈性學習課程之授課教師、學生同儕及家長意見反映，加以評量。\n第  9  條\n學生依國民中學技藝教育實施辦法，於國民中學階段修習抽離式技藝教育課程者，其職群所對應之領域學習課程學期成績，應包括抽離式技藝教育課程總成績，並按抽離式技藝教育課程每週節數占對應之領域學習課程每週排定節數之比率計算。\n第  10  條\n國民中小學學生領域學習課程及彈性學習課程之平時及定期成績評量結果，應依評量方法之性質以等第、數量或質性文字描述記錄之。\n前項各領域學習課程及彈性學習課程之成績評量，至學期末，應綜合全學期各種評量結果紀錄，參酌學生人格特質、特殊才能、學習情形與態度等，評量及描述學生學習表現，並得視需要提出未來學習之具體建議。\n領域學習課程之評量結果，應以優、甲、乙、丙、丁之等第，呈現各領域學習課程學生之全學期學習表現；其等第與分數之轉換如下：\n一、 優等：九十分以上。\n二、 甲等：八十分以上未滿九十分。\n三、 乙等：七十分以上未滿八十分。\n四、 丙等：六十分以上未滿七十分。\n五、 丁等：未滿六十分。\n前項等第，以丙等為表現及格之基準。\n彈性學習課程評量結果之全學期學習表現，得比照第三項規定辦理。\n學生日常生活表現紀錄，應就第三條第二款所列項目，分別依行為事實記錄之，並酌予提供具體建議，不作綜合性評價及等第轉換。\n第  11  條\n學校就國民中小學學生領域學習課程、彈性學習課程及日常生活表現之成績評量紀錄及具體建議，每學期至少應以書面通知家長及學生一次。\n學校得公告說明學生分數之分布情形。但不得公開呈現個別學生在班級及學校排名。\n直轄市、縣(市)政府應於每學期結束後一個月內，檢視所轄國民中小學學生之評量結果，作為其教育政策訂定及推動之參考。\n第  12  條\n學校應結合教務、學務、輔導相關處室及家長資源，確實掌握學生學習狀況，對需予協助者，應訂定並落實預警、輔導措施。\n學生學習過程中各領域學習課程及彈性學習課程之成績評量結果未達及格之基準者，學校應實施補救教學及相關補救措施；其實施原則，由直轄市、縣(市)主管機關定之。\n直轄市、縣(市)政府依前項實施補救教學之辦理成效，應併同前條第三項國民中小學學生之評量結果，於每學年結束後二個月內，報教育部備查。\n學生日常生活表現需予協助者，學校應依教師輔導及管教學生相關規定施以輔導，並與其法定代理人聯繫，且提供學生改過銷過及功過相抵之機會。\n第  13  條\n國民中小學學生修業期滿，符合下列規定者，為成績及格，由學校發給畢業證書；未符合者，發給修業證明書：\n一、 出席率及獎懲：學習期間授課總日數扣除學校核可之公、喪、病假，上課總出席率至少達三分之二以上，且經獎懲抵銷後，未滿三大過。\n二、 領域學習課程成績：\n(一) 國民小學階段：語文、數學、社會、自然科學、藝術、綜合活動、健康與體育七領域有四大領域以上，其各領域之畢業總平均成績，均達丙等以上。\n(二) 國民中學階段：語文、數學、社會、自然科學、藝術、綜合活動、科技、健康與體育八領域有四大領域以上，其各領域之畢業總平均成績，均達丙等以上。\n第  14  條\n國民中小學就學生之成績評量結果，應妥為保存及管理，並維護個人隱私與權益；其評量結果及紀錄處理，應依個人資料保護法規相關規定辦理。\n第  15  條\n為瞭解並確保國民中學學生學力品質，應由教育部會同直轄市、縣(市)政府辦理國中教育會考(以下簡稱教育會考)；其辦理方式如下：\n一、 中華民國一百零三年起每年五月針對國民中學三年級學生統一舉辦，評量科目為國文、英語、數學、社會與自然五科及寫作測驗；其評量結果，除寫作測驗分為一級分至六級分外，分為精熟、基礎及待加強三等級。\n二、 教育部應會同直轄市、縣(市)政府設教育會考推動會，審議、協調及指導教育會考重要事項。\n三、 教育會考推動會下設教育會考全國試務會，統籌全國試務工作；各直轄市、縣(市)政府應協助辦理全國試務工作。\n四、 教育會考考區試務工作，由考區所在地之直轄市、縣(市)政府辦理，並得個別或共同委由考區所在地之學校設教育會考考區試務會辦理之。考區試務會應依全國試務會之規劃，辦理全國共同事項。\n五、 教育部得將下列事項委託大學、學術專業團體或財團法人(以下簡稱受託評量機構)辦理：\n(一) 第三款全國試務會之全國試務工作。\n(二) 命題、組卷、閱卷、計分、題庫建置、試題研發。\n六、 前款受託評量機構應具備學生學力品質評量之專業能力、充足之行政人員及健全之組織與會計制度。\n七、 國民中學學生除經直轄市、縣(市)主管機關核准者外，應參加教育會考，學校應協助學生報名，並不得拒絕學生應試。\n八、 教育會考之結果供學生、教師、學校、家長及主管機關瞭解學生學習品質及其他相關法規規定之使用。但不得納入在校學習評量成績計算。\n前項第二款至第五款所定各會之委員及辦理教育會考之試務工作人員，對於試務負有保密義務，並應遵守下列迴避規定：\n一、 前項第二款至第五款所定各會之委員，本人或其配偶、前配偶、三親等內之血親或姻親或曾有此關係者，報名參加當年度考試時，應行迴避。\n二、 監試人員本人或其配偶、前配偶、二親等內之血親或姻親或曾有此關係者，報名參加當年度考試時，應行迴避。\n三、 前款以外試務工作人員，參與教育部或受教育部委託為辦理教育會考之命題、審查、組卷、閱卷、計分、接觸試題或試卷機會之人員，本人或其配偶、前配偶、三親等內之血親或姻親或曾有此關係者，報名參加當年度考試時，應行迴避。\n各考區、考場規定較本準則限制更嚴格者，從其規定。\n第  16  條\n國民中小學學生各項成績評量相關表冊，由直轄市、縣(市)政府定之。\n第  17  條\n國民中學及其主管機關為輔導學生升學或協助學生適應教育會考之程序、題型及答題方式，得辦理模擬考，其辦理次數，全學期不得超過二次。模擬考成績不得納入學生評量成績計算；相關處理原則，依中央主管機關之規定。\n前項模擬考，國民中學除自行或配合主管機關辦理外，不得協助其他機構、團體或個人辦理。\n第  18  條\n公立國民中小學辦理學生學習評量相關事項，違反本辦法規定者，應依公立高級中等以下學校校長成績考核辦法及公立高級中等以下學校教師成績考核辦法對學校人員議處。\n私立國民中小學違反本辦法規定者，直轄市、縣(市)主管機關應依私立學校法及相關規定處理。\n第  19  條\n本辦法自中華民國一百十三年八月一日施行。", "history": "1.101年5月7日教育部臺參字第1010079561B號令修正發布。\n\n2.103年4月25日教育部臺教授國部字第1030028354B號令修正發布。\n\n3.104年1月7日教育部臺教授國部字第1030141892B號令修正發布第6條、第13 條條文。\n\n4.108年6月28日教育部臺教授國部字第1080065377E號令修正發布第3條、第5 條、第6條、第8條、第9條、第12條、第14條、第17條、第18條條文。\n\n5.中華民國113年4月24日教育部臺教授國部字第 1135500955A號令修正發布名稱及全文 19條；並自113年8月1日施行(原名稱：國民小學及國民中學學生成績評量準則；新名稱：國民小學及國民中學學生學習評量辦法)。"}, {"title": "新北市國民小學及國民中學學生成績評量補充規定", "content": "一、 本補充規定依國民教育法第四十條第一項規定訂定之。\n二、 新北市國民小學及國民中學（以下簡稱學校）學生學習之評量，除依國民小學及國民中學學生學習評量辦法及相關法規規定外，並應依本補充規定辦理。\n三、 學校學生日常生活表現評量由導師參考學校各領域學習課程與彈性學習課程(以下簡稱學習課程)授課教師、學生同儕及學生之法定代理人反映，依下列各款學生表現項目加以評定：\n(一) 出缺席情形：學生出缺席情形包含曠課及新北市高級中等以下學校學生請假及出缺勤管理規定第二點規定之假別等紀錄。\n(二) 獎懲：包含大功、小功、嘉獎、大過、小過及警告等紀錄，其評量標準由學校訂定。\n(三) 團體活動表現：由導師或授課教師視學生參與班級、社團、自治與學校活動學習等情形紀錄之。\n(四) 品德言行表現：由導師考量學生智力、性向、興趣、家庭環境與社會背景等因素，並綜合平日個別行為觀察結果、談話與家庭訪視紀錄、學生自評、同儕互評及校外活指導委員會彙送資料紀錄之。\n(五) 公共服務表現：由導師或相關人員依學生參與班級、學校或社區服務等情形紀錄之。\n(六) 校內外特殊表現：依學生實際表現紀錄之。\n四、 學校學生領域學習課程、彈性學習課程之評量，包括國民中小學課程綱要所定領域學習課程、彈性學習課程及其所融入之重大議題。\n國民小學一、二年級之社會、藝術、自然科學及綜合活動學習領域統整為生活課程實施評量。\n國民中學辦理模擬升學測驗成績之結果，不得納入學生在校學習評量成績計算。\n五、 學校學生定期學習評量， 每學期紙筆測驗之次數， 國民小學一年級及二年級，每學期至多二次，國民小學三年級至國民中學三年級，每學期至多三次；其評量日期由學校擬定，並經課程發展委員會通過；其評量方式由各領域/科目教學研究會決定之。\n前項定期評量之紙筆測驗，學校應組成命題與審題小組及建立命題與審題機制，以維護評量之合理性、專業性、診斷性、公平性及保密性。\n學習課程之評量中，紙筆測驗使用頻率應符最小化精神；彈性學習課程評量，應以平時評量為原則，並得視需要實施定期評量。\n六、 學校學生領域學習課程、彈性學習課程成績評量之計算方式如下：\n(一) 個別學習課程每次定期評量與平時評量成績之核計比例，由各校領域/科目教學研究會訂定。\n(二) 個別學習課程之各次定期評量與平時評量成績總和之平均數為該領域學期成績。\n(三) 各個別學習課程學期成績乘以各該學習課程每週學習節數，所得總和再除以每週學習課程總節數為學習課程評量之學期總平均成績。\n七、 特殊教育學生之成績評量，依下列方式辦理：\n(一) 學校應衡酌特殊教育學生身心發展狀況及學習優勢管道實施評量，並依學生能力及需求，調整評量之領域學習課程、彈性學習課程、內容及方式；其評量調整措施，以及成績計算方式，應納入學生個別化教育計畫或個別輔導計畫，並經各校特殊教育推行委員會審查通過後實施。\n(二) 身心障礙學生因其學習課程之學習節數完全由特殊需求領域替代時，該學習課程成績得採計特殊需求領域之評量結果。\n(三) 普通班特殊教育學生接受資源班或巡迴輔導直接教學之領域學習課程、彈性學習課程時，其成績評量除衡酌該生普通班之平時及定期評量表現外，應納入資源班或巡迴輔導教師之評量結果。\n八、 非學校型態實驗教育學生之成績評量依下列方式辦理：\n(一) 非學校型態實驗教育學生依十二年國民基本教育課程綱要學習課程進行評量。\n(二) 學生之法定代理人應依申請計畫實施評量，並得自行決定學生是否返校參加定期評量，由學生之法定代理人實施之評量紀錄，應於學期末提供校方進行成績登錄，提供之時間由學生之法定代理人與導師聯繫確認。\n1. 返校參加定期考試者，平時評量成績由學生之法定代理人提供，教師就平時評量與定期評量成績，合併計算學生之學期成績。\n2. 不返校參加考試者，所有領域成績由學生之法定代理人評定。\n3. 學生學期成績單應加註「申請非學校型態實驗教育」字樣。\n(三) 學校核發申請實驗教育學生之畢業證書，應在相關文件上加註申請實驗教育修業期程。\n(四) 申請實驗教育之學生成績，倘涉及畢業成績計算，不列入畢業成績獎項評比。\n九、 學校學生於領域學習課程、彈性學習課程定期評量時，因故不能參加，經學校核准給假者，於銷假後得補行評量，其成績以實得分數計算。但無故缺考者，不得補行評量，其學習課程定期評量成績以零分計算。\n十、 學校得視學生日常生活表現情形之需要安排專案輔導。\n學生學習表現欠佳者，學校應訂定並落實預警、輔導與補救措施。\n學生各學期各領域學習課程及彈性學習課程之成績未達丙等者，應施予相關輔導與補救措施，並得建立補考機制，其實施原則如下：\n(一) 補行評量範圍：\n1. 以補行評量前一學期不及格學習課程為限。\n2. 國民中學九年級下學期及國民小學六年級下學期學生，得補考當學期不及格領域。\n(二) 補行評量時間：\n1. 除國民中學九年級下學期及國民小學六年級下學期學生，應於畢業典禮前辦理外，由學校自訂。\n2. 學校應以書面通知學生於指定期日參加補行評量，學生逾期未參加者，除有不可抗力情形外，視同放棄補行評量機會。\n(三) 補行評量方式：得以紙筆測驗或多元評量等方式辦理。\n(四) 成績計算：補行評量及格者，該學習課程學期成績以六十分計算； 補行評量不及格者，以原始分數擇優採計。\n(五) 補行評量次數：每位學生得參加各學期各學習課程之補行評量以一次為限。\n十一、 學校學生成績評量之處理、登記單位及人員如下：\n(一) 國民中學：學習課程評量由教務處主辦；日常生活表現評量由學務處主辦，任課教師配合辦理。\n(二) 國民小學：由各班導師辦理。\n前項成績評量之各類表冊，由新北市政府另訂之。\n十二、 學校學生學習評量紀錄，應定期告知學生及其法定代理人。\n學期或畢業成績通知除量化紀錄外，得參酌學生人格特質、學習能力、生活態度及特殊才能等以文字描述加以說明，並提出具體建議。\n十三、 學校應成立學生成績評量輔導小組(以下簡稱本小組)，每學期定期召開成績評量相關會議，研議、審查學生成績評量相關事項。\n本小組置成員五人至十七人，由學校行政人員、教師代表、教師會代表、家長會代表及相關人員組成之。\n十四、 學校學生修業期滿，經本小組審查符合下列規定者，由學校發給畢業證書；未符合者，發給修業證明書：\n(一) 出席率：扣除事假外之新北市高級中等以下學校學生請假及出缺勤管理規定第二點規定之假別或其他不可抗力等因素外，學習期間上課總出席率至少達三分之二以上。\n(二) 獎懲：學生經獎懲抵銷後，未記滿三大過。\n(三) 領域學習課程成績：\n1. 國民小學階段：語文、數學、社會、自然科學、藝術、綜合活動及健康與體育七領域，有四大領域以上，其各領域之畢業總平均成績，均達丙等以上。\n2. 國民中學階段：語文、數學、社會、自然科學、藝術、綜合活動、科技及健康與體育八領域，有四大領域以上，其各領域之畢業總平均成績，均達丙等以上。\n十五、 學校於不違反相關法規及本補充規定，得視本位發展實際需要另訂規定。\n十六、 中華民國一百零八年十二月二日修正發布之第三點至第十一點及第十四點，自一百零八年八月一日以後入學學校之學生適用之。", "history": "1.中華民國100年5月25日新北市政府教育局北教國字第1000443400 號函訂定全文17點；並自即日生效。      \n\n2.中華民國101年8月27日新北市政府北府教國字第 1012324521 號令修正發布全文17 點；並自即日生效。\n\n3.中華民國104年5月13日新北市政府新北府教中字第1040284187 號令修正發布第 5、7、9、10、13、14點條文；並自即日生效。\n\n4.中華民國108年12月2日新北市政府新北府教國字第 1082207507 號令修正發布全文16點；並自即日生效。\n5.中華民國113年11月26日新北市政府新北府教國字第 1132286212 號令修正發布名稱及全文 15 點；並自即日生效（原名稱：新北市國民小學及國民中學學生成績評量補充規定；新名稱：新北市國民小學及國民中學學生學習評量補充規定）"}, {"title": "新北市國民中小學中途輟學學生復學安置輔導及成績評量實施要點", "content": "一、 依據：\n(一) 國民教育法、國民教育法施行細則。\n(二) 強迫入學條例、強迫入學條例施行細則。\n(三) 新北市國民小學及國民中學學生成績評量補充規定。\n(四) 國民中小學中途輟學學生通報及復學輔導辦法。\n(五) 新北市國民中學學生學籍管理要點。\n(六) 新北市國民小學學生學籍管理要點。\n二、 目標：\n(一) 加強追蹤輔導中途輟學學生復學，維護學生就學之權利及義務，協助其快速適應學校生活，順利完成國民教育。\n(二) 為增進國民中小學中途輟學學生學習興趣，激發學生多元潛能，促進學生適性發展。\n三、 對象：\n(一) 未經請假未到校上課達三日以上之中途輟學學生。\n(二) 學期開學未到校註冊達三日以上之中途輟學學生。\n(三) 轉學時未向轉入學校報到達三日以上之中途輟學學生。\n四、 安置原則：\n(一) 對申請復學之中輟學生，應以零拒絕、隨時接受申請為原則，不得以銜接課程之理由拒絕，並積極協助其辦理復學相關程序。\n(二) 中輟學生辦理復學，應由學校編入相當之年級就讀。如其年齡已滿十五歲者，得輔導其就讀補習學校。中輟時間達一年以上者銜接原中輟年級，未達一年者以返回原班就讀為原則；如有特殊個案，召開個案安置會議決議之。\n(三) 特殊個案基於輔導需求，輔導處(室)得協同家長、導師、教務處、學務處(訓導處)，訂定個別化教育方案，經提報中途輟學學生復學安置輔導會議決議之。\n五、 成績之處理：\n(一) 中輟學生復學後，如其中輟期間部分課業成績無法連貫計算時，應依新北市國民中學學生學籍管理要點、新北市國民小學學生學籍管理要點第二點第六款第三目規定辦理，由任課教師按領域(學科)以補考或甄試等多元評量方式，評定其成績。\n(二) 中輟學生復學後，中途輟學原因消滅，其成績依現行成績評量相關規定辦理。\n(三) 中輟學生復學後修業期滿能否畢業依新北市國民小學及國民中學學生成績評量補充規定辦理。\n(四) 中輟學生復學後之成績處理，學校得在不違反新北市國民小學及國民中學學生成績評量補充規定下，由學生成績評量審查委員會訂定補充規定。\n六、 安置輔導方式及分工原則：\n(一) 以輔導處(室)為中輟生復學之單一窗口，並指定專人(學校社工、認輔教師等)統籌協助復學事宜，結合教務處、學務處(訓導處)及導師之專業力量，共同協助學生適應復學生活。\n(二) 學生完成復學手續後，至輔導處(室)報到，依據個案情形進行一日至一周之安置輔導課程。\n(三) 學生安置時間之長短由學生個別生活學習評量表現決定之。\n(四) 分工原則：\n1. 輔導處(室)：中輟學生復學之單一窗口，協助個案心理輔導、學校適應及親子師生溝通。教師及學務處無法處理之個案視需要由輔導處協助安排諮商輔導及生涯、生活、學習輔導等課程活動。\n2. 學務處(訓導處)：服裝儀容、生活常規、外顯性行為個案之輔導工作。\n3. 教務處：協助個案班級安置、成績處理、學習適應及補救教學。\n4. 導師：協助個案班級及學校適應。導師於復學安置輔導期間，每日適時與個案會談，輔導其學校及班級適應。\n5. 任課教師：適時協助個案課程學習，並協助辦理領域(學科)之成績評量，提供學生成績資料。\n6. 認輔教師：協助個案復學生活與學校適應。每星期至少三次與個案晤談，至少進行兩星期。\n七、 國中中輟生安置補校：\n(一) 申請流程：由家長及學生提出申請，經輔導室及導師查核認可後，填寫暫讀補校轉介單，並提中輟生復學暫讀補校安置會議討論。\n(二) 學籍歸屬：暫讀補校學生，學籍仍設原校日間部原班。\n(三) 個案輔導：暫讀補校學生，應列入個案輔導，由原班導師、輔導老師、訓導人員及補校主任、導師共同輔導。\n1. 成績計算：以回原班參加定期考試為原則，其時間與地點由教務處通知，亦得以補校考試成績認定。\n2. 藝能科成績：以作品為考核依據，亦得提請中輟學生復學暫讀補校安置會議中討論之，從寬認定。\n3. 暫讀補校學生就讀兩個月後，應召開會議，評估其返回原班就讀之可行性；如有需要，亦得隨時召開會議評估之。\n八、 復學安置流程如附圖", "history": "100年12月1日北府教秘字第 1001651654號令訂定發布全文8點；並自即日起生效。"}, {"title": "請各直轄市、縣(市)政府督導所屬國民中學落實試題之檢核機制", "content": "一、 有關國民小學及國民中學學生定期評量，本署業於102年1月28日以臺教國署國字第1020008301號函(諒達)，請各直轄市政府教育局及縣(市)政府督導所屬各國中小學落實審題機制並遵守迴避原則。\n二、 近日報載有國中複習模擬考交由廠商包辦試題考卷之情事，考量基測轉型會考後部分國中仍維持辦理模擬考，為確保試題品質，發揮教師專業，爰請各直轄市、縣(市)政府督導所屬國民中學對模擬考應有適當之試題檢核機制。", "history": "教育部國民及學前教育署102年6月20日臺教國署國字第10260057680號函。"}, {"title": "重申本市所屬各級學校辦理定期評量應嚴守保密原則且務請教師應秉持專業，依據教學計畫之進度範圍命題且不得洩題，違者依相關規定處理。", "content": "一、 邇來，本局接獲家長反應學校定期評量疑有以先前試題重複製作，致多有雷同，為維護學生受教權益並兼顧考試公平公正，請務必要求教師應稟持專業與評量準則命題，不得有類此情事發生，違者依相關規定辦理。\n二、 另為提升學校教師評量專業知能，請  貴校強化教師遵守命題規範，以維護評量公平性，杜絕爭議事件發生。", "history": "100年4月1日北教國字第1000317513號。"}, {"title": "請學校落實學習領域定期評量之審題機制，避免評量試題與考古題雷同，以維持評量之公平性。", "content": "一、 依據教育部100年4月14日臺國(二)字第1000906644號函辦理。\n二、 依「國民小學及國民中學學生成績評量準則」(以下簡稱本準則)第6條第3項之規定，國民中小學學生成績評量方式，由任課教師依教學計畫在學期初向學生及家長說明，並負責評量。爰成績評量係屬教師專業自主之範疇，也是教師之責任，應由教師依據其教學計畫及目標決定其評量的範圍、方式及評分標準，並負責學生成績評量的完整過程。\n三、 爾來多次接獲民眾投書陳訴，學校定期評量試題採用考古題，題號及答案順序均完全與考古題雷同，造成有特定管道(如參加課後輔導、參加補習等)之學生能於考前取得試題加強練習，影響成績評量之公平性。尤其於國民中學，雖採計在校學習表現並非是擴大免試入學之必要條件，惟仍可能影響學生升學權益，學校更應謹慎處理。\n四、 請學校辦理定期評量時應確實依據年度課程計畫、目標及前揭評量準則之規定，由任課教師負責評量，並應確實執行審題機制，以提升定期評量試題品質、維護評量之公平性及保障學生升學權益。", "history": "100年4月19日北教國字第1000372960號。"}, {"title": "新北市高級中等以下學校學生請假及出缺勤管理規定", "content": "一、 新北市政府為使主管之公私立高級中等以下學校(以下簡稱學校)辦理學生請假及出缺勤管理事項有所遵循，特訂定本規定。\n二、 學生請假應依下列規定辦理：\n(一) 事假：學生因有個人或家庭事故須親自處理致到校上課困難者，得請事假。學校准假與否須視個案情事及影響學生受教權益之程度，並得召開個別會議與家長協商。\n(二) 病假：學生因病或意外傷害，必須在家休養或住院治療者，得請病假。\n(三) 公假：凡經學校核派參加校內外各種勤務、活動、比賽或因公訴訟者，得請公假。\n(四) 喪假：曾祖父母、祖父母、父母、外祖父母、繼父母、兄弟姐妹死亡，得請喪假。\n(五) 學生懷孕，其待產與生產期間，依據學生懷孕受教權維護及輔導協助要點等相關規定，應專案彈性處理，不得以曠課論，其相關假別如下：\n1. 產前假：懷孕分娩前得請產前假八日，得分次申請。\n2. 娩假：分娩後得請四十二日分娩假。\n3. 流產假：懷孕滿二十週以上流產者，得請流產假四十二日；懷孕十二週以上未滿二十週流產者，得請流產假二十一日；懷孕未滿十二週流產者，得請流產假十四日。\n(六) 生理假：女性同學因生理日致到校上課困難者，每月得申請生理假一日。\n三、 原住民族學生應於其所屬族群歲時祭儀日前，持戶籍謄本或戶口名簿等證明其族別之文件，向就讀學校辦理請假事宜，學校應依據行政院原住民族委員會所頒當年度原住民族歲時祭儀放假日期，作為准假依據。\n原住民族學生返校後，教師應給予適當之學習扶助。\n原住民學生參加所屬族群之歲時祭儀，每年以一次為原則，並核予公假登記。\n四、 學校於不違反本規定及其他法令下，得訂定學生請假手續、核准權責等相關規定，並依規定核定假別。\n學生因故不能到校上課者，應依規定辦理請假；學校不予准假者，應以曠課論。\n五、 學生請假應由家長或監護人向學校提出申請，除病假、喪假或其他因不可抗力因素得事後補假外，應事先辦妥請假手續；保護性個案或其他特殊個案，得由主要照顧人代為提出申請。\n六、 學生臨時外出應依規定完成請假手續。\n七、 學校應每日登錄學生出缺勤情形，並定期通知家長，每學期統計出缺勤日數， 隨同成績單通知家長；學生請假單應妥為保留至學生畢(修)業。\n八、 學生請假理由及所陳證明文件，如有虛偽隱瞞情事，除自缺席之日起以曠課計算外，並依學校相關規定予以輔導或懲處。\n九、 學生於非學習節數活動之參與狀況，不得列入出缺席紀錄。但得視其情節，採取正向輔導管教措施。\n十、 學生如對學校請假手續及核准結果有不服者，得依其性質及相關規定提出救濟。", "history": "1.100年12月1日北府教秘字第 1001651654號令訂定發布全文11點；並自即日起生效。\n\n2.111年2月25日新北府教國字第1110256059號函修正。"}, {"title": "高級中等學校學生學習歷程檔案作業要點", "content": "一、 教育部國民及學前教育署(以下簡稱本署)為落實十二年國民基本教育課程綱要總綱有關高級中等學校(以下簡稱學校)應完備學生學習歷程檔案之規定，以蒐集、處理及利用學生學習歷程檔案資料，特訂定本要點。\n二、 本署依教育基本法第九條第一項第三款及教育部國民及學前教育署組織法第二條規定之職權，建置高級中等教育階段學生學習歷程資料庫(以下簡稱學習歷程中央資料庫)，向學校蒐集學生學習歷程檔案資料，並得請相關機關、機構或其他學校提供學生學習歷程檔案資料。\n前項學校、機關或機構，依各該教育評量法規、組織法規或個人資料保護法及其相關法規規定，其蒐集之學生學習歷程檔案資料，得依個人資料保護法第十六條或第二十條規定，釋出學生學習歷程檔案資料，供學習歷程中央資料庫處理及利用。\n三、 學校應建置學生學習歷程檔案數位平臺(以下簡稱學習歷程學校平臺)，蒐集學生學習歷程檔案資料，其內容應包括下列項目：\n(一) 基本資料：姓名、身分證明號碼、擔任校級、班級、社團幹部紀錄及其他學籍相關資料。\n(二) 修課紀錄：學校報經各該主管機關備查之課程計畫所開設各科目課程之學業成績及課程諮詢紀錄。\n(三) 課程學習成果：前款課程產出之作業、作品及其他學習成果。\n(四) 多元表現：彈性學習時間、團體活動時間及其他表現。\n學習歷程中央資料庫向學校蒐集之資料，不包括前項第二款課程諮詢紀錄。\n第一項資料及其建置之格式，由本署定之。\n四、 學習歷程學校平臺及學習歷程中央資料庫蒐集之資料，以學生就學期間之資料為限；其記錄方式如下：\n(一) 基本資料及修課紀錄：\n1. 學校人員應於學校每學期規定時間內，登錄至學習歷程學校平臺。\n2. 學校人員應於本署次學期規定時間內，就學習歷程學校平臺之料，經檢核無誤後，提交至學習歷程中央資料庫。但三年級第二學期資料之提交，應於本署當學期規定時間內為之。\n(二) 課程學習成果：\n1. 學生依本要點規定上傳至學習歷程學校平臺者，應於學校每學期規定時間內辦理，並應經任課教師認證；其件數由學校定之。\n2. 學校人員應於本署次學年規定時間內，就學習歷程學校平臺之資料，經學生勾選至多六件後，提交至學習歷程中央資料庫。但三年級資料之提交，應於本署當學年規定時間內為之。\n(三) 多元表現：\n1. 學生依本要點規定上傳至學習歷程學校平臺者，應於學校每學年規定時間內辦理；其件數由學校定之。\n2. 學校人員應於本署次學年規定時間內，就學習歷程學校平臺之資料，經學生勾選至多十件後，提交至學習歷程中央資料庫。但三年級資料之提交，應於本署當學年規定時間內為之。\n學校完成提交資料後，應至學習歷程中央資料庫下載收訖明細，提供學生核對已提交資料之正確性，並應於本署規定期限內，公告收訖明細之確認期間。\n前項學校公告之收訖明細之確認期間，不得少於三日。\n學生應於學校依第二項規定之公告期間內，確認學校提交資料與學生上傳資料一致；逾公告期間未確認，或未向學校提出疑義者，視為已確認學校提交資料與學生上傳資料一致。\n學生依前項規定提出疑義者，由學校相關單位依其權責，妥為處置。\n五、 學校應成立學生學習歷程檔案工作小組(以下簡稱工作小組)，由校長擔任召集人，成員至少包括教務處、學務處、輔導處(室)、課程諮詢教師、教師、家長及學生代表，設有實習處或進修部者，並應包括其代表，每學期至少召開一次會議。\n學校應依本要點訂定補充規定，經校務會議通過後實施，並公告於學校資訊網；其內容應包括下列事項：\n(一) 工作小組之組成、運作及督導。\n(二) 學生學習歷程檔案資料建置之方式、人員、期程及內容。\n(三) 學生學習歷程檔案資料相關研習之規劃。\n(四) 辦理成效評核及獎勵。\n六、 學生申請就讀大專校院時，經學生本人同意及勾選後，本署得將學習歷程中央資料庫之相關資料釋出至其申請之校、院、系、科、組或學位學程，作為招生選才之參據。\n七、 學習歷程中央資料庫保有學生個人之所有資料，應自該學生完成高級中等教育五年後，予以封存；封存後，學生得向本署申請刪除上開資料。\n八、 各該主管機關對於學校有關學生學習歷程檔案資料之建置作業，得視其辦理情形，就相關人員予以獎懲；如有可歸責於學校相關人員之情事，致資料登載不實，影響學生權益或大學招生制度之公正性及公平性者，應負相關行政或刑事責任。", "history": "1.教育部國民及學前教育署108 年7 月15 日臺教國署高字第1080070186 號令訂定。\n\n2.中華民國111年5月13日教育部臺教國署高字第1110056868A 號令修正發布第4點，並自即日生效。"}, {"title": "教育部國民及學前教育署補助高級中等學校充實建置學生學習歷程檔案要點", "content": "一、 教育部國民及學前教育署(以下簡稱本署)為補助高級中等學校(以下簡稱學校)充實學生學習歷程檔案，促進各地區教育均衡發展，特訂定本要點。\n二、 本要點補助之對象及其得申請補助之用途、項目與額度如下：\n(一) 全國公立及私立學校：得申請補助充實建置學生學習歷程檔案所需人力之經常門經費，補助項目及額度如附表。\n(二) 經教育部依偏遠地區學校教育發展條例規定核定公告之偏遠地區學校，及經教育部比照偏遠地區學校分級及認定標準專案審認其教育資源情形相當於偏遠地區學校之私立學校，除得依前款申請補助外，得就下列支出用途，申請最高新臺幣五十萬元之補助，其中資本門經費不得超過總經費百分之二十:\n1、協助學生製作學生學習歷程檔案所需之資訊設備。\n2、支持學生多元表現學習及師生參賽活動所需經費。\n3、其他學校為建置及充實學生學習歷程檔案所需採購設備及舉辦活動之費用。\n三、 本要點本署之補助比率規定如下：\n(一) 教育部主管公立及私立學校：依核定金額全額補助。\n(二) 直轄市、縣(市)立政府主管學校：依「中央對直轄市及縣(市)政府補助辦法」之規定及配合本署獲配年度預算額度，就各直轄市、縣(市)政府財力級次，給予不同補助比率:\n1、第一級者，最高補助比率為百分之八十五。\n2、第二級者，最高補助比率為百分之八十七。\n3、第三級者，最高補助比率為百分之八十八。\n4、第四級者，最高補助比率為百分之八十九。\n5、第五級者，最高補助比率為百分之九十。\n四、 學校經審酌第二點支出用途需求後，得於本署函知之期限內，擬具計畫書及經費申請表，向本署申請補助。\n五、 本署受理前點申請後，依申請表件進行審查；經審查通過，並核定補助金額後，通知學校。\n六、 學校請領補助款，應遵行下列規定：\n(一) 依本署核定之補助經費及期限，辦理請領事宜。\n(二) 補助經費應專款專用。\n(三) 執行內容有變更必要者，應擬具計畫書修正案，報本署核定後，始得為之。\n七、 學校辦理請撥結報，或未能依限辦理經費結報、補助經費結餘款之處理，應依教育部補(捐)助及委辦經費核撥結報作業要點規定辦理。\n八、 學校經費執行，有違反經核定之計畫書、本要點或法令規定者，得廢止原補助經費之部分或全部；已撥款者，應繳回補助款；未繳回者，由本署以書面行政處分，限期通知學校返還。\n九、 本署就教育部核定之非山非市學校，經專案審認其教育資源情形，確有經費需求者，得準用第二點第二款規定補助之。\n附表教育部國民及學前教育署補助全國公立及私立高級中等學校申請補助充實建置學生學習歷程檔案所需人力之經常門經費補助項目及額度一覽表", "history": "1.中華民國108年8月21日教育部臺教國署高字第 1080092345B 號令訂定發布全文10 點，並自即日生效。\n\n2.中華民國112年1月16日教育部臺教國署高字第1110182190A號令修正，名稱並修正為「教育部國民及學前教育署補助高級中等學校充實建置學生學習歷程檔案要點」，並自中華民國一百十二年一月一日生效。"}, {"title": "高級中等學校中途離校學生預防追蹤及復學輔導實施要點", "content": "一、 教育部(以下簡稱本部)為維護學生就學權益，協助直轄市、縣(市)政府、高級中等學校(以下簡稱學校)依兒童權利公約施行法第四條、學生輔導法(以下簡稱本法)第七條第三項及第四項規定，辦理中途離校學生之預防、追蹤及復學輔導事項，特訂定本要點。\n二、 本要點用詞，定義如下：\n(一) 中途離校學生：指有下列情形之一之學校學生：\n1. 未經請假或不明原因未到校上課連續達三日以上，包括高級中等學校學生學籍管理辦法(以下簡稱學籍管理辦法)第十七條第二項視為休學之學生。\n2. 學籍管理辦法第十七條第一項之休學學生。\n(二) 長期缺課學生：\n1. 日間部：指高級中等學校學生學習評量辦法第二十六條所定，全學期缺課節數達修習總節數二分之一，或曠課累積達四十二節之學生。\n2. 進修部：指高級中等學校進修部學生學習評量辦法第二十二條所定，全學期缺課節數達修習總節數二分之一，或曠課累積達三十六節之學生。\n(三) 轉學學生：指學籍管理辦法第十六條所定，由原學校發給轉學證明書之學生。\n三、 學校各該主管機關應辦理中途離校學生預防、追蹤及輔導相關工作之規劃及執行事項，並定期召開相關聯繫會議，整合相關資源，提供就學、就業或其他相關協助。\n直轄市、縣(市)政府應至少每半年召開一次聯繫會議，邀集教育、警政、勞政、社政、衛政、民政及司法等網絡單位代表，協調、審議、諮詢及\n推動政策；直轄市、縣(市)政府召開之聯繫會議，應由副首長擔任召集人，召集人因故無法出席時，得指派秘書長、局(處)長或適當層級人員代理主持會議。\n直轄市、縣(市)政府應就轄內主管及教育部主管之公、私立學校，透過前項聯繫會議建立協助機制，學校應配合辦理。\n學校應配合本要點之規定，於學生中途離校、長期缺課或其他有輔導需求期間，主動提供輔導資源，並得請求其他相關機關(構)協助，實施有關措施，穩定學生就學。\n四、 本部應建置中途離校學生通報系統(以下簡稱通報系統)，供中途離校學生、長期缺課學生與轉學學生(以下併稱學生)就讀學校或轉出學校辦理通報及追蹤，掌握各學校學生狀況，並連結教育部青年發展署、勞動部、法務部、內政部、衛生福利部之資源，提供就學、就業或其他相關協助。\n學校各該主管機關應督導所屬學校，依本要點規定傳送相關資料至通報系統。\n五、 學校應自學生中途離校、長期缺課或轉學事實發生，或復學之日起三日內，完成通報作業。\n前項中途離校學生之通報、追蹤及輔導期間，自通報之日起，至學生成年止。\n六、 學校於規劃課程計畫時，應同時考量學習興趣、性向、能力及需求，於校訂課程納入多元彈性之學習內容，提供學生適性修習，並提高學生穩定就學意願。\n七、 學校應設輔導小組；其任務如下：\n(一) 建立預防機制，規劃多元彈性及適性教育課程。\n(二) 訂定中途離校學生通報及追蹤與復學輔導計畫。\n(三) 評估學生確有轉銜學制或轉學需求者，由學校提出輔導紀錄，協助輔導就讀進修部、實用技能學程、建教合作班或其他學制，或送適性學習社區(以下簡稱社區)適性轉學委員會協助學生辦理適性轉學。\n(四) 其他有關學生預防、追蹤及復學輔導事項。\n前項輔導小組，置委員若干人，其中一人為召集人，由校長兼任之，其餘委員，由學校各處室(包括進修部)行政主管、輔導教師或專業輔導人員及教師派兼之。\n輔導小組應每學期定期召開輔導會議；其組織、運作、議事及其他相關事項，由學校定之。\n第一項第三款所稱社區，指本部為推動十二年國民基本教育，提升中等教育品質，均衡城鄉教育落差，減少教育機會不公，藉由學校間之教學合作及資源共享，提供社區內學校學生適性學習機會，滿足當地學生教育需求所規劃之社區。\n八、 學校應建立學生檔案，詳細記載學生基本資料；其內容包括離校日期、通報日期、聯絡資訊及其他必要之資訊。\n學校應建立學生輔導紀錄，並定期檢討輔導成效；紀錄內容包括復學日期、再度離校情形、追蹤輔導紀錄及其他必要之資訊。\n九、 學校應針對長期缺課學生建立預警機制，進行追蹤輔導，並訂定具體輔導措施，引進不同網絡資源，共同協助學生穩定就學。\n學校應就藥物濫用之學生，應依各級學校特定人員尿液篩檢及輔導作業要點附件六各級學校涉及毒品危害防制條例案件輔導處遇流程辦理，並定期追蹤輔導，製作個案紀錄。\n十、 學校針對行蹤不明學生，於必要時，得洽請各直轄市、縣(市)政府警察局少年警察隊或轄區分局提供協助。\n十一、 學校應對辦理休學之學生，了解及掌握休學原因，定期追蹤輔導，並提供復學相關資訊，積極鼓勵其復學。\n學生辦理轉學時，原轉出學校應於確認該生已接獲轉入學校同意入學文件後，始得依學籍管理辦法第十六條規定，發給轉學證明書。\n十二、 學校對中途離校學生復學後不適應一般學校教育課程者，應規劃多元教育輔導措施，融入藥物濫用防制、性別平等、性剝削防制、網路安全、勞動權益及其他相關課程，提供適性教育，避免學生再度中途離校。\n十三、 學生因家庭清寒或發生重大變故，致中途離校、長期缺課或轉學者，學校除依本要點規定辦理外，應檢具該學生及其家庭相關資料，報當地直轄市、縣(市)政府提供必要之救助、安置或其他福利服務；其屬親職功能不彰者，得請家庭教育中心或民間相關團體，提供親職教育或諮詢。\n十四、 直轄市、縣(市)政府對其轄區所在學校之中途離校學生，得整合其所屬學生輔導諮商中心、本部學生輔導諮商中心、家庭教育中心、勞政、社會福利、衛生、內政與警政機關、公私立機構、法人與團體及學校資源，協助預防、追蹤及復學輔導。\n十五、 學校辦理本要點所定事項，應納入學校各該主管機關重點視導項目，及依視導結果，給予辦理學校及相關人員適當之獎勵或輔導；並納入公立高級中等以下學校校長成績考核辦法有關校長平時考核之參據。\n學校違反本要點規定者，學校各該主管機關得按其情節輕重，納入各類獎勵、補助經費刪減、停撥或終止補助之參據。", "history": "1.中華民國106年8月1日臺教授國部字第1060073562B號訂定，並自即日生效。\n\n2.中華民國109年9月15日教育部臺教授國部字第 1090098254B 號令修正「高級中等學校學生穩定就學及中途離校學生輔導機制實施要點」，名稱並修正為「高級中等學校中途離校學生預防追蹤及復學輔導實施要點」，並自即日生效。\n\n3. 中華民國111年7月22日教育部臺教授國部字1110084668A 號令修正第3點，並自即日生效。"}, {"title": "新北市公私立高級中等學校學生重修學分實施要點", "content": "一、 新北市政府為利主管之公私立高級中等學校(以下簡稱各校)執行高級中等學校學生學習評量辦法(以下簡稱本辦法)第十一條規定，特訂定本要點。\n二、 學生各學期學業成績未達及格基準之科目，得申請重修，未修習之科目依本辦法規定申請補修；重修或補修之辦理方式，應依下列順序為之：\n(一) 專班辦理：\n1. 該科目報名重修或補修總人數達十五人以上。\n2. 辦理時間、課程內容及成績評量方式，由各校定之。\n3. 課程以寒假、暑假期間實施為原則；每一學分授課節數，不得少於六節。\n4. 學生收費每人每節課為新臺幣五十元。\n(二) 自學輔導：\n1. 由教師指定教材，供學生自行修讀，並安排面授指導；屬重修者，每一學分不得少於三節，屬補修者，每一學分不得少於六節。\n2. 面授時間及成績評量方式，由各校定之。\n3. 學生收費每人每學分為三百元。\n4. 已開設專班重修或補修之科目，除有特殊情形並經各校核准者外，學生不得申請自學輔導。\n(三) 隨班修讀：在學學生依學生能力及學校排課等因素，安排學生隨其他班級課程修讀。\n三、 學生重修或補修時，得跨年級、學程或類(科)修讀。\n四、 重修或補修期間，學生曠課及事假之缺課節數達該科目總修習節數三分之一者，該科目不予成績評量。\n五、 重修及補修經費依下列規定辦理：\n(一) 重修及補修經費，應納入年度預算內編列。\n(二) 教師面授指導及教學鐘點費，應依教師實際授課時數核實支付。於上課期間開課者，依公立中小學兼任及代課教師鐘點費支給基準表高級中等學校之支給數額辦理；於課後或寒暑假期間開課者，每節支給六百六十元，並以收支平衡為原則。\n(三) 重修及補修之學分費，以支付教師鐘點費、教材、講義及行政費用；如不敷使用，應優先支付教師鐘點費。教材、講義及行政費用之支出，不得逾其學分費收費總額百分之三十。\n(四) 重修或補修課程如有實習(驗)者，得酌收實習(驗)費或材料費。但每人每學分收費，以新臺幣二百元為限。\n(五) 學生已享雜費優待補助者，其重修及補修學分費不再補助。", "history": "1.中華民國101年4月24日新北市政府北府教中字第 1011353748號令訂定發布全文7點；並自101年8月1日生效。\n\n2.中華民國113年3月15日新北市政府新北府教中字第 1130452277號令修正發布名稱及全文5  點；並自113年2月27日生效(原名稱：新北市公私立高級中等學校學生重修學分實施要點；新名稱：新北市公私立高級中等學校學生重修及補修學分實施要點)。\n\n3.中華民國115年4月30日新北市政府新北府教中字第 1150782445號令修正發布第2、5點條文；並自即日生效。"}];
let currentIndex=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderList(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const list=document.getElementById('lawList');list.innerHTML='';const filtered=laws.map((law,i)=>({...law,i})).filter(x=>(x.title+'\n'+x.content+'\n'+x.history).toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} / ${laws.length} 項`;document.getElementById('none').classList.toggle('hidden',filtered.length>0);filtered.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='w-full text-left px-3 py-3 rounded-xl hover:bg-blue-50 text-slate-700 transition '+(x.i===currentIndex?'active-law':'');b.innerHTML=`<span class="inline-flex w-6 h-6 rounded-lg items-center justify-center mr-2 text-[10px] font-bold ${x.i===currentIndex?'bg-white/20':'bg-slate-100 text-slate-500'}">${x.i+1}</span><span class="align-middle">${esc(x.title.replace(/^\s*\d+[、.．]?\s*/,''))}</span>`;b.onclick=()=>{currentIndex=x.i;renderList();renderDetail();};list.appendChild(b);});}
function formatLawText(content, lawIndex){
 let normalized=String(content||'').replace(/\\n/g,'\n').replace(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)\s*\n(?!第\s*[0-9０-９一二三四五六七八九十百]+\s*條)([^\n]+)$/gm,'$1 $2');
 // 第25至27項原始文字含有句中換行；合併續行，保留各款、目之換行。
 if(lawIndex===24 || lawIndex===25 || lawIndex===26){
  normalized=normalized.split('\n').reduce((acc,line)=>{
   const t=line.trim();
   if(!t) return acc;
   const isNewItem=/^(?:[一二三四五六七八九十百]+、|[（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾0-9０-９]+[）)]|[0-9０-９]+[、.．])/.test(t);
   if(acc.length===0 || isNewItem) acc.push(t);
   else acc[acc.length-1]+=' '+t;
   return acc;
  },[]).join('\n');
 }
 return normalized.split('\n').map(raw=>{
  const t=raw.trim(); if(!t) return '<div class="doc-paragraph-gap" aria-hidden="true"></div>';
  const chapter=t.match(/^(第\s*[一二三四五六七八九十百0-9０-９]+\s*章\s*.*)$/);
  if(chapter) return '<div class="doc-chapter" style="display:block;font-size:1.25rem !important;font-weight:800 !important;line-height:2.2 !important;margin:1.25em 0 0.6em !important;">'+esc(t.replace(/\s{2,}/g,' '))+'</div>';
  const article=t.match(/^(第\s*[0-9０-９一二三四五六七八九十百]+\s*條)(.*)$/);
  if(article){
   const heading='<div class="doc-article-heading">'+esc(article[1].replace(/\s+/g,''))+'</div>';
   const inlineText=article[2].trim();
   return heading+(inlineText?'<div class="doc-article-body">'+esc(inlineText)+'</div>':'');
  }
  const levels=[
  {re:/^([壹貳參肆伍陸柒捌玖拾]+、)(.*)$/,n:0},
  {re:/^([一二三四五六七八九十百]+、)(.*)$/,n:1},
  {re:/^([（(][一二三四五六七八九十百壹貳參肆伍陸柒捌玖拾]+[）)])\s*(.*)$/,n:2}, // 刪除 0-9０-９
  {re:/^([0-9０-９]+[、.．])(.*)$/,n:3},
  {re:/^([（(][0-9０-９]+[）)])\s*(.*)$/,n:4}
];
  for(const level of levels){const m=t.match(level.re);if(m)return '<div class="doc-row doc-level-'+level.n+'"><span class="doc-marker">'+esc(m[1])+'</span><span class="doc-copy">'+esc(m[2].trimStart())+'</span></div>';}
  const indentContinuation=[35,36,38].includes(lawIndex); return '<div class="doc-row doc-paragraph'+(indentContinuation?' law-indent-paragraph':'')+'"'+(indentContinuation?' style="padding-left:2.8em!important;box-sizing:border-box!important"':'')+'><span class="doc-marker"></span><span class="doc-copy">'+esc(t)+'</span></div>';
 }).join('');
}
function renderDetail(){const law=laws[currentIndex];const content=formatLawText(law.content,currentIndex);document.getElementById('detail').innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-100 rounded-full px-3 py-1">第 ${currentIndex+1} 項／共 ${laws.length} 項</span><span class="text-xs text-slate-400">新生入學、學籍管理、成績評量</span></div><h2 class="text-xl md:text-2xl font-extrabold leading-relaxed text-slate-900 mb-6">${esc(law.title)}</h2><div class="border-t border-slate-200 pt-6"><div class="official-doc text-sm md:text-[15px] ${currentIndex===19?'law-twenty-format':''} ${currentIndex===26?'law-twenty-seven-format':''} ${[35,36,38].includes(currentIndex)?'law-indent-format':''}">${content||'<p>原始文件未提供此項資料。</p>'}</div></div><div class="mt-8 border-t border-slate-200 pt-6"><h3 class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-clock-rotate-left text-blue-600"></i>法規沿革／日期及文號／法源簡述／備註</h3><div class="history-text text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4">${law.history.trim()?esc(law.history):'原始文件未提供此項資料。'}</div></div><div class="flex justify-between gap-3 mt-8 pt-5 border-t border-slate-100"><button onclick="go(-1)" ${currentIndex===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-2"></i>上一項</button><button onclick="go(1)" ${currentIndex===laws.length-1?'disabled':''} class="px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed">下一項<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`;}
function go(d){currentIndex=Math.max(0,Math.min(laws.length-1,currentIndex+d));renderList();renderDetail();}
document.getElementById('searchInput').addEventListener('input',renderList);renderList();renderDetail();
</script>
<style id="mobile-law-detail-switch-style">
@media(max-width:1023px){
 body:not(.mobile-law-detail-view) main{display:block!important}
 body:not(.mobile-law-detail-view) main>aside{display:block!important;width:100%!important;max-width:100%!important;position:static!important;max-height:none!important;overflow:visible!important;grid-column:1/-1!important}
 body:not(.mobile-law-detail-view) main>section{display:none!important}
 body.mobile-law-detail-view main{display:block!important}
 body.mobile-law-detail-view main>aside{display:none!important}
 body.mobile-law-detail-view main>section{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important;padding:16px!important;scroll-margin-top:110px!important}
 #mobileLawBackButton{display:block!important;position:relative!important;z-index:100!important;visibility:visible!important;opacity:1!important;width:100%;box-sizing:border-box;margin:8px 0 16px!important;padding:11px 14px;border-radius:10px;border:1px solid #cbd5e1;background:#eff6ff;color:#1d4ed8;font-weight:700;text-align:left;cursor:pointer}
}
@media(min-width:1024px){#mobileLawBackButton{display:none!important}}
</style>
<script id="mobile-law-detail-switch-script">
(function(){
 function isMobile(){return window.matchMedia('(max-width:1023px)').matches;}
 function backToList(){document.body.classList.remove('mobile-law-detail-view');var a=document.querySelector('main>aside');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});}
 function addBackButton(){var section=document.querySelector('main>section');var detail=document.getElementById('detail');if(!section||!detail)return;var b=document.getElementById('mobileLawBackButton');if(!b){b=document.createElement('button');b.id='mobileLawBackButton';b.type='button';b.textContent='← 返回法規項目清單';b.addEventListener('click',backToList);}if(b.parentElement!==section)section.insertBefore(b,detail);}
 document.addEventListener('click',function(e){var b=e.target.closest('#lawList button, main>aside button');if(!b||!isMobile())return;setTimeout(function(){addBackButton();document.body.classList.add('mobile-law-detail-view');var s=document.querySelector('main>section');if(s)s.scrollIntoView({behavior:'smooth',block:'start'});},80);},true);
 window.addEventListener('resize',function(){if(!isMobile())document.body.classList.remove('mobile-law-detail-view');});
})();
</script>
