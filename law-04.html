const laws = [{"title": "國民教育法", "content": "第  一  章  總則\n第  1  條\n國民教育，以養成德、智、體、群、美五育均衡發展之健全國民為宗旨。\n第  2  條\n本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣(市)為縣(市)政府。\n第  二  章  國民教育之辦理\n第  3  條\n六歲至十五歲之國民，應受國民教育；其強迫入學，另以法律定之。\n第  4  條\n國民教育分為二階段：前六年為國民小學教育；後三年為國民中學教育。\n第  5  條\n國民教育，以政府辦理為原則，並鼓勵私人興辦。\n第  6  條\n為保障學生學習權及家長教育選擇權，國民教育階段之學校型態實驗教育，依學校型態實驗教育實施條例規定辦理；非學校型態實驗教育，依高級中等以下教育階段非學校型態實驗教育實施條例規定辦理。\n為協助前項實驗教育之發展，中央主管機關應訂定相關補助規定。\n補習及進修教育法所定之短期補習教育，不得視為第一項非學校型態實驗教育。\n第  7  條\n辦理國民教育所需建校土地，由直轄市、縣(市)主管機關視都市計畫及社區發展需要，優先規劃；核准設立公立國民小學及國民中學(以下簡稱學校)之主管機關並得依法撥用或徵收。\n第  8  條\n直轄市、縣(市)主管機關辦理國民教育所需經費，應優先編列預算支應；其財源如下：\n一、 直轄市、縣(市)主管機關一般收入。\n二、 直轄市、縣(市)主管機關依平均地權條例規定分配款。\n三、 為保障國民教育之健全發展，直轄市、縣(市)主管機關得依財政收支劃分法第十八條第一項但書規定，優先籌措辦理國民教育所需經費。\n中央主管機關應視直轄市、縣(市)主管機關辦理國民教育經費之實際需要補助之。\n第  9  條\n各級主管機關得商借公立學校教師組成任務編組性質、具專業自主性之課程及教學輔導團；其任務如下：\n一、 協助宣導並落實課程及教學相關政策。\n二、 統籌建置所屬學習領域及議題輔導資源，成為支援教師教學及專業發展之有效系統。\n三、 協助學校發展課程，提供教師課程與教學諮詢及輔導，以落實國民教育之實施。\n四、 研究發展創新教學方法，協助教師積極進行教學研究，增進教學效能。\n各級主管機關得商借公立學校教師組成任務編組之組織，推動學生輔導諮商、科技與資訊教育、特殊教育、原住民族教育及其他相關教育事項。\n前二項任務編組之組織、運作與教師資格、遴選、商借、培訓、獎勵、年資採計及其他相關事項之辦法，由中央主管機關定之。\n第  三  章  學校之設立、變更及停辦\n第  10  條\n公立學校，由直轄市、縣(市)主管機關依據學齡人口推估、交通狀況、社區發展、文化特色、環境條件、行政區域及學校分布情形，分區設立，劃分學區；其設立、學區劃分原則及分發入學規定，由直轄市、縣(市)主管機關定之。\n為促進學生同儕互動，培養群體多元學習，有效整合教育資源，建構優質學習環境，均衡城鄉教育功能，確保學生就學權益，直轄市、縣(市)主管機關得辦理公立學校之變更或停辦；其變更、停辦之條件、程序、審查、學校學生與教職員工之安置及其他相關事項之準則，由中央主管機關定之；直轄市、縣(市)主管機關應依準則之規定，訂定有關變更或停辦之自治法規。\n前項所稱變更，指學校之改名、改制、合併。\n第二項公立學校之合併或停辦，直轄市、縣(市)主管機關應擬具校園空間利用與財務支援及課程規劃等教育事務相關計畫，邀請學者專家、家長代表、學校教職員代表、地方社區人士及相關人員進行專案評估及辦理公聽會，並經各直轄市、縣(市)主管機關教育審議委員會審議通過後，送中央主管機關備查。\n原住民重點學校之合併或停辦，另依原住民族教育法規定辦理。\n公立學校，得委託私人辦理；其相關事項，依公立高級中等以下學校委託私人辦理實驗教育條例規定辦理。\n第  11  條\n公立師資培育之大學為辦理教育實習、實驗及研究，得設附設實驗國民小學、國民中學；其組織規程，由公立師資培育之大學擬訂，報公立師資培育之大學所屬主管機關核定。\n前項附設實驗國民小學、國民中學，除組織、人員、編制及預算事項，應受所屬公立師資培育之大學及其主管機關之監督外，其辦理本法所定事項，應比照所在地直轄市、縣(市)主管機關之公立學校，受所在地直轄市、縣(市)主管機關之監督。\n公立師資培育之大學附屬之高級中等學校附設之國小部、國中部，及國立高級中等學校附設之國小部、國中部，準用前項規定。\n第  12  條\n私立學校與其分校、分部之設立、變更或停辦，依私立學校法及其相關法規辦理。\n第 四 章 組織、人員及編制\n第  13  條\n學校置校長一人，專任，綜理校務。\n直轄市、縣(市)立學校校長，由直轄市、縣(市)主管機關召開遴選會，就公開甄選並儲訓合格之人員、任期屆滿或連任任期已達二分之一之現職校長或曾任校長人員中公開遴選，並擇定一人後，由直轄市、縣(市)主管機關聘任之。但所屬學校數量國民中學未達十五校或國民小學未達四十校者，得遴選連任中之現職校長，不受連任任期應達二分之一之限制；其相關規定，由直轄市、縣(市)主管機關定之。\n公立師資培育之大學附設實驗國民小學、國民中學校長，由公立師資培育之大學組織遴選會，就該師資培育之大學、該大學附設之實驗國民小學、國民中學或其他學校校長或教師中遴選合格人員，並擇定一人後，由公立師資培育之大學校長聘兼(任)之，並報主管機關備查。\n私立學校校長之遴選，應召開私立學校校長遴選會為之；其遴選會之組成、召開及相關規定，由學校財團法人(以下簡稱學校法人)董事會定之。\n前項遴選會應就合格人員以公開方式甄求候選名單。\n私立學校校長由學校法人董事會遴選合格人員，報直轄市、縣(市)主管機關核准後聘任之。\n第二項及第三項遴選會，應有家長會代表、教師會或教師代表參與，其比例各不得少於五分之一，任一性別委員人數不得少於委員總數三分之一；其組織及運作方式，分別由組織遴選會之直轄市、縣(市)主管機關、公立師資培育之大學定之。\n第  14  條\n前條第二項所稱公開甄選並儲訓合格之人員，指符合下列各款情形之一者：\n一、 本法中華民國八十八年二月五日修正生效前，由臺灣省政府或直轄市主管機關公開甄選並儲訓合格之校長候用人員。\n二、 本法中華民國八十八年二月五日修正生效後，由直轄市、縣(市)主管機關公開甄選並儲訓合格之校長候用人員。\n三、 本法中華民國八十八年二月五日修正生效前，經公開辦理之督學、課長甄選儲訓合格，並具有學校校長任用資格之人員。\n公立學校專任教師最近三年有下列各款情形之一者，不得參加校長甄選、儲訓及遴選：\n一、 受刑事有罪判決。但經判決無罪確定者，不在此限。\n二、 受懲戒處分，未經撤銷。\n三、 受記過以上之行政懲處，未經撤銷。\n前條第二項校長甄選、儲訓及其他相關事項之辦法，由中央主管機關定之。\n第  15  條\n依第十三條第二項、第三項組織遴選會之直轄市、縣(市)主管機關、公立師資培育之大學，應就學校或附設實驗國民小學、國民中學校長辦學績效予以考評，考評結果作為校長應否繼續遴聘之依據。\n第  16  條\n學校校長應採任期制，公立學校校長一任四年，得在同一學校連任一次，任期屆滿得回任教職。但任期屆滿後一年內屆齡退休者，經遴選會通過，報經各該主管機關核准，得續任原學校校長職務至退休之日；其相關規定，由各該主管機關定之。\n原住民族地區之學校校長任期，由直轄市、縣(市)主管機關定之。\n第一項但書以外之直轄市、縣(市)立學校校長任期為配合學年起訖期間，得經遴選會通過，報直轄市、縣(市)主管機關核准，延長至任期屆滿之當學年終了之日止；其相關規定由直轄市、縣(市)主管機關定之。\n私立學校校長之任期及連任之規定，由學校法人董事會定之。\n第  17  條\n學校校長有不適任之事實者，公立學校校長，由各該主管機關依法解除職務、改任其他職務或為其他適當之處理；私立學校校長，由學校法人董事會依法解除職務、改任其他職務或為其他適當之處理。\n前項不適任事實之認定、處理方式及其他相關事項之辦法，由中央主管機關定之。\n第  18  條\n公立學校現職校長具有教師法所定教師資格願意回任教師者，由各該主管機關分發學校，或公立師資培育之大學安排原校任教；其回任程序不受教師法、教育人員任用條例應經學校教師評審委員會審議相關規定之限制。\n前項公立學校現職校長，經主管機關審查認定具有教師法、教育人員任用條例所定解聘或不續聘之情事者，不得回任。\n公立學校現職校長未獲遴聘，未具教師資格無法回任或具有教師資格不願回任教師者，各該主管機關或公立師資培育之大學得依下列方式辦理：\n一、 符合退休條件自願退休者，准其退休。\n二、 不符合退休條件或不自願退休者，視其意願及資格條件，優先輔導轉任他職。\n私立學校現職校長具有教師法所定教師資格願意回任教師者，應依學校法人董事會決議辦理。\n前項私立學校現職校長，經主管機關審查認定具有教師法、教育人員任用條例所定解聘或不續聘之情事者，不得回任。\n第  19  條\n學校設校務會議，議決下列事項，由校長召集並主持之：\n一、 校務發展或校園規劃等重大事項。\n二、 依法令或本於職權所訂定之各種重要章則。\n三、 教務、學生事務、總務及其他校內重要事項。\n四、 其他依法令應經校務會議議決事項。\n校務會議成員，應包括校長、全體專任教師或教師代表、家長會代表及職工代表，並應邀請學生列席會議；採教師代表為組成成員者，任一性別成員人數不得少於成員總數三分之一；其各類成員比例及運作原則，由各該主管機關定之。\n第  20  條\n學校為辦理教務、學生事務、總務及其他事務，應視規模大小，分別或合併設一級單位或二級單位。\n前項各單位之一級單位置主任一人，二級單位置組長一人，各置職員若干人。公立學校主任由校長就甄選且儲訓合格之專任教師聘兼之，組長由教師兼任、職員專任或兼任之，職員由校長遴用之，均應報直轄市、縣(市)主管機關備查。\n學校應設人事及主計單位。規模較小未設專責單位之公立學校，得由直轄市、縣(市)人事及主計主管機關(構)指派所屬機關(構)、學校之專任人事、主計人員或經有關機關辦理相關訓練合格之職員兼任之；其員額編制標準，依有關法令之規定。\n前項職員不包括護理人員。\n公立學校專任教師最近三年有下列各款情形之一者，不得參加主任甄選、儲訓及取得受聘主任資格：\n一、 受刑事有罪判決。但經判決無罪確定者，不在此限。\n二、 受懲戒處分，未經撤銷。\n三、 受記過以上之行政懲處，未經撤銷。\n公立學校主任之甄選、儲訓及其他相關事項之辦法，由中央主管機關定之。\n第  21  條\n學校辦理學生輔導事項，應依學生輔導法之規定。\n學校應由專責單位或專責人員推動學生輔導工作。\n輔導專責單位為一級單位者，置主任一人，二級單位者，置組長一人，各置專任輔導教師若干人。輔導主任、組長由校長遴聘具有輔導熱忱及專業知能教師擔任之。輔導主任及輔導教師以專任為原則。\n專任輔導教師及專任專業輔導人員之員額編制，應依學生輔導法規定。\n第  22 條\n學校應設圖書館(室)、寬列圖書採購預算及訂定閱讀課程，獎勵學生閱讀課外書籍。\n第  23  條\n公立學校以採小班制為原則，每班置導師一人，由教師兼任，學校規模較小者，得酌予增加教師員額；其班級編制及教職員員額編制準則，由中央主管機關定之。\n前項準則所定教師員額編制，得視學生學習節數及教師授課節數定之。\n直轄市、縣(市)主管機關得視需要，依第一項準則規定，在不超過全校教師員額編制數一定比率範圍內，將專任員額控留，其所控留之員額經費，應全數支用於改聘教學人力所需之相關費用。\n第  24  條\n學校教師應為專任，必要時，得依法聘請兼任教師，或聘請具有特定科目、領域專長人員，以部分時間擔任教學支援工作。\n前項教學支援工作人員之工作範圍、資格審查基準、認證、聘任、解聘、停聘、不適任人員通報、教學節數、待遇、權利、義務及其他相關事項之辦法，由中央主管機關定之。\n前項認證作業，由直轄市、縣(市)主管機關辦理。擔任教學支援工作人員經各該主管機關協議，得互相承認已認證之資格。\n中華民國九十一年六月三十日前，依中央主管機關規定辦理之檢核及培訓成績及格者，具有第一項擔任教學支援工作之資格。\n第一項教師每週授課節數之基準，由中央主管機關定之。\n第  25  條\n公立學校因校際合作、課程需要或有特殊情形者，得與他校合聘教師，並於一校專任；合聘教師之條件、比率限制、教師之權利義務及其他應遵行事項之辦法，由中央主管機關定之。\n第  26  條\n學校教師之聘任，另以法律定之。教師之進修、獎懲、公立學校教師介聘之條件、程序、方式及其他相關事項之辦法，由中央主管機關定之。\n公立學校校長、教師應辦理成績考核；其考核小組或考核會之組成與任務、考核程序、考核等級、獎懲類別、結果之通知及其他相關事項之辦法，由中央主管機關定之。\n前項考核小組或考核會之成員，任一性別成員人數不得少於成員總數三分之一。\n第  27  條\n私立學校校長、教師及其他人員之進用，除依教育人員任用條例、教師法、私立學校法及本法有關規定辦理外，各單位主管、教師及職員，由校長聘(兼)任或遴用，報直轄市、縣(市)主管機關備查。\n第  五  章  學生之入學\n第  28  條\n六歲之學齡兒童，由戶政機關調查造冊，送經直轄市、縣(市)主管機關按學區分發，並由鄉(鎮、市、區)公所通知其入公立國民小學。\n公立國民小學當年度畢業生，由直轄市、縣(市)主管機關按學區分發入公立國民中學。\n第  29  條\n私立學校之學區劃分，由直轄市、縣(市)主管機關參照地方特性定之。\n私立學校之學生入學，由學校本教育機會均等及國民教育健全發展之精神，訂定招生規定，報直轄市、縣(市)主管機關核定。\n第  30  條\n政府派赴國外工作人員子女、僑生、外國學生及無國籍學生進入學校就學，其資格、方式及其他相關事項之辦法，由中央主管機關定之。\n政府延攬國外人才及境外優秀科學技術人才，為其子女成立之公立學校海外攬才子女專班，其學區劃分、班級編制與教師員額編制、課程、教科書選用、編班、正常教學及學習評量，得不適用第十條第一項、第二十三條第一項、第三十四條、第三十五條、第三十九條、第四十條；其設立、入學資格、方式、收費及其他相關事項之辦法，由中央主管機關定之。\n第  31  條\n學校學生入學後之學籍資料，應以書面或電子方式切實記錄，永久保存，並依法維護安全及使用。\n學校有合併或停辦之情形者，應由合併後存續之學校或直轄市、縣(市)主管機關指定之學校接管學生學籍資料。\n前二項之學籍管理之自治法規，由直轄市、縣(市)主管機關定之。\n第  六  章  就學費用及獎助學金\n第  32  條\n學校學生免納學費；經濟弱勢之學生，由直轄市、縣(市)主管機關供給書籍，並免繳其他法令規定之費用。\n公立學校學生免納雜費；各項代收代辦費之自治法規，由直轄市、縣(市)主管機關定之。\n私立學校收取雜費及各項代收代辦費之自治法規，由直轄市、縣(市)主管機關定之。\n第  33  條\n各該主管機關、學校應設獎、助學金，獎助優秀、清寒學生。\n第  七  章  課程、教學及學習評量\n第  34  條\n中央主管機關應訂定國民中小學課程綱要及其實施之有關規定，作為學校規劃及實施課程之依據；學校規劃課程並得結合社會資源充實教學活動。\n國民中小學課程綱要之研究發展及審議，準用高級中等教育法之相關規定。\n第  35  條\n學校教科用書，以由民間編輯為原則，必要時，得由中央主管機關編定之。\n學校教科用書之編輯、審定，皆應符合現行法令與於我國具有效力之國際公約，國家教育研究院並應辦理相關研習或培訓予學校教科用書之編輯人員及申請教科用書審定者。\n學校教科用書由國家教育研究院審定；審定組織之組成與運作、申請教科用書審定者之資格、申請程序、審查範圍、審查程序、費額、審定執照之發給與廢止、印製規格、教科用書修訂、申訴、教科用書計價機制及其他相關事項之辦法，由中央主管機關定之。\n學校教科用書應由各校公開選用；其選用規定，由學校訂定，經校務會議通過後實施。\n第  36  條\n學校選用之教科用書，得由中央主管機關或中央主管機關指定之直轄市、縣(市)主管機關，依政府採購法之規定辦理採購，或與教科用書出版者締結行政契約；其方式，由中央主管機關定之。\n前項學校藝能及活動科目之教科用書，應免費借用予需要之學生。\n第  37  條\n為豐富學生經驗及強化與真實情境連結，學校應推動走出課室，提供學生探究、實作與體驗課程；其推動之經費來源、收費基準、單位人員分工與權責、風險管理及其他相關事項之自治法規，由直轄市、縣(市)主管機關定之。\n學校應規劃辦理學生自我認識及職業試探生涯發展教育活動，依其能力、性向、興趣及其他需要，提供適性輔導，協助其進路選擇。\n第  38  條\n為適應學生個別差異、學習興趣及需要，學校應提供技藝課程選習，加強技藝教育。\n國民中學三年級學生，應在自由參加之原則下，由學校提供技藝課程選習，並得採專案編班方式辦理；其實施辦法，由中央主管機關定之。\n第  39  條\n學校各年級應實施常態編班；為兼顧學生適性發展之需要，得實施分組學習；其編班與分組學習、違反規定之處理及其他相關事項之準則，由中央主管機關定之；直轄市、縣(市)主管機關得依準則，訂定補充規定。\n規模較小之學校，為增進學生學習成效，得實施混齡教學或混齡編班；其實施方式及其他相關事項之辦法，由中央主管機關定之。\n直轄市、縣(市)主管機關為落實學校正常教學，應建立督導機制，指派督導人員實地視導；其督導方式、範圍、獎懲及其他相關事項之辦法，由中央主管機關定之。\n第  40  條\n學生之學習應予評量，其評量內容、方式、原則、違反規定之處理及其他相關事項之辦法，由中央主管機關定之；直轄市、縣(市)主管機關應依該辦法，訂定學生學習評量相關補充規定。\n學校學生修業期滿，符合前項辦法規定且成績及格者，由學校發給畢業證書。\n國民中學學生除經直轄市、縣(市)主管機關核准者外，應參加中央主管機關會同直轄市、縣(市)主管機關辦理之國中教育會考；其辦理方式於第一項辦法定之。\n中央主管機關為辦理國中教育會考，得就試題及試務相關業務，委託大學、學術專業團體或財團法人會同直轄市、縣(市)主管機關共同辦理；其資格條件、辦理方式、業務範圍及其他相關事項，於第一項辦法定之。\n第  41  條\n直轄市、縣(市)主管機關及學校，應為復學之中途輟學學生，規劃彈性課程及多元輔導措施，協助其適應學校教育課程。\n第  42  條\n學校設施設備基準，由中央主管機關定之。直轄市、縣(市)主管機關亦得視實際需要，另定適用於該地方之基準，報中央主管機關備查。\n第  八  章  學生權益及家長參與\n第  43  條\n學校應辦理學生團體保險；其團體保險，另以法律定之。\n學生申請理賠時，學校應主動協助辦理。\n各級主管機關應為所轄之學校場所投保公共意外責任保險。\n前項保險所需經費，由中央主管機關按年度編列預算支應之。\n第  44  條\n學生獎懲原則、處理及其他相關事項之準則，由中央主管機關定之；直轄市、縣(市)主管機關應依準則，訂定學生獎懲自治法規。\n第  45  條\n學生權益之救濟，依本法所定申訴、再申訴程序行之。\n學生對學校有關其個人之懲處、其他措施或決議，認為違法或不當致損害其權益者，得由其法定代理人或實際照顧者代為向學校提出申訴；不服學校申訴決定，得向學校所在地之直轄市、縣(市)主管機關提出再申訴；其提起訴願者，受理訴願機關應於十日內，將該事件移送應受理之學生申訴評議委員會或學生再申訴評議委員會，並通知學生及其法定代理人或實際照顧者。\n申訴之提起，應於收受或知悉懲處、其他措施或決議之次日起四十日內以書面為之；再申訴應於申訴評議書達到之次日起四十日內以書面為之；其期間，以學校收受申訴書或直轄市、縣(市)主管機關收受再申訴書之日期為準。\n第  46  條\n學校應設學生申訴評議委員會，其中家長代表不得少於五分之一，並應包括法律、教育、兒童及少年權利、心理或輔導專家學者至少一人；直轄市、縣(市)主管機關應設學生再申訴評議委員會，其中法律、教育、兒童及少年權利、心理或輔導專家學者人數應逾委員總數二分之一；學生申訴評議委員會及學生再申訴評議委員會，任一性別委員人數不得少於委員總數三分之一；其申訴、再申訴範圍、期限、委員會組成、調查方式、評議方式、評議結果之執行及其他相關事項之辦法，由中央主管機關定之。\n學校受理懲處或申訴事件，直轄市、縣(市)主管機關受理再申訴事件時，應秉持客觀、公正、專業之原則，給予受懲處人或申訴人、再申訴人充分陳述意見及答辯之機會。\n學校應以書面或其他適當方式告知受懲處人；學校及直轄市、縣(市)主管機關應以書面告知申訴人或再申訴人，各該評議決定及不服該決定之相關救濟程序。\n原懲處、措施或決議性質屬行政處分者，其再申訴決定視同訴願決定；不服再申訴決定者，得依法提起行政訴訟。\n第  47  條\n前二條規定施行前，尚未終結之事件，其以後之程序，依修正施行後之規定終結之。\n第  48  條\n國民教育階段內，家長為維護其子女之權益，應相對承擔輔導子女及參與家長會之責任，並為保障學生學習權及人格權，有參與教育事務之權利；其參與方式、內容、程序及其他相關事項之辦法，由中央主管機關定之。\n學校設學生家長會，應由在學學生之家長為會員組織之，並冠以該校之名稱；其組織章程、任務、委員人數、委員產生方式、任期、選舉罷免、議事規範、經費來源、財務管理、運作及其他相關事項之自治法規，由學校所在地之直轄市、縣(市)主管機關會商家長團體後定之。\n各級主管機關應定期協助家長團體辦理家長參與教育事務之增能研習。\n第  九  章  國民補習教育\n第  49  條\n已逾齡未受國民教育之國民，應受國民補習教育。\n國民補習教育，由學校設進修部實施之。\n第  50  條\n學校進修部置主任一人，並得置組長若干人，由該校專任教師或職員兼任；教師依法由校內外合格人員兼任，職員得專任或兼任。\n第  51  條\n學校進修部之入學年齡須年滿十五歲。\n國民小學進修部新生，得由學校編入與其程度相銜接之級別就讀。\n國民中學進修部之入學，應具有下列資格之一：\n一、 國民小學或國民小學補習學校畢業。\n二、 經自學進修學力鑑定考試通過，具有國民小學畢業程度。\n三、 國民小學同等學力。\n前二項之入學方式及申請程序採登記制；其相關規定，由直轄市、縣(市)主管機關定之。\n第  52  條\n國民小學進修部分初級及高級，初級相當於國民小學前三年，修業期限為六個月至一年；高級相當於國民小學後三年，修業期限為一年六個月至二年。國民中學進修部相當於國民中學，修業期限不得少於三年。\n第  53  條\n國民補習教育之授課，得採按日制、間日制或假日制。\n第  54  條\n國民補習教育之學習內容，參考國民中小學課程綱要之內容，由中央主管機關定之，作為學校規劃及實施課程之依據，並依據學生年齡、身心發展、生活及工作需求等進行規劃，以適應學生學習及社會需要。\n第  55  條\n國民補習教育之學生，修業期滿成績及格者，准予畢業，並由學校給予畢業證書，具有同級、同類學校之畢業資格。\n前項成績評量相關規定，由直轄市、縣(市)主管機關定之。\n第  56  條\n國民小學、國民中學畢業程度之自學進修學力鑑定範圍、考試辦理機關、每年舉辦之次數與時間、考試科目、應考資格、證書之頒發、廢止及其他相關事項之辦法，由中央主管機關定之。\n第  57  條\n學校進修部免收學費，並得視需要，酌收雜費及代收代辦費；其收費之自治法規，由直轄市、縣(市)主管機關定之。\n第  十  章  附則\n第  58  條\n學校應配合地方需要，協助辦理終身學習，促進社區發展。\n第  59  條\n公立學校之場地、設施及設備，提供他人使用、委託經營、獎勵民間參與所獲之收入，不受國有財產法第七條收入解繳國庫、地方公有財產管理收入解繳公庫及相關規定之限制。\n前項場地、設施、設備提供他人使用時，應以公益目的為優先，並不得影響校內師生使用。\n公立學校編列附屬單位預算者，其各項收支均應依預算法循預算程序納入特種基金辦理。\n第  60  條\n各級主管機關為瞭解與規劃學生就學情形、學習成效、教職員員額配置、師資任用及專長授課情形，得蒐集、處理或利用國民教育階段學生、教職員及其他教育人員之個人資料，並建立相關資料庫；直轄市、縣(市)主管機關並應依中央主管機關之規定，將其資料庫之內容，傳輸至中央資料庫。\n第  61  條\n本法施行細則，由中央主管機關定之。\n第  62  條\n本法除第四十五條、第四十六條規定自公布後一年施行，第九章之施行日期由行政院定之外，自公布日施行。", "history": "1.100年1月26日總統華總一義字第10000016631號令修正公布第10條條文。\n\n2.100年11月30總統華總一義字第10000266431號令修正公布增訂第20條之2條文；並修正第8條之1及第20條之1條文。\n\n3.105年5月11日總統華總一義字第10500040051號令修正公布第10條條文。\n\n4.105年6月1日總統華總一義字第 10500050781 號令修正公布第8條條文；並增訂第4-1條條文。\n\n5.112年6月21日總統華總一義字第 11200052771 號令修正公布全文 62 條；除第 45、46 條自公布後一年施行，第9章之施行日期由行政院定之外，自公布日施行."}, {"title": "入學高級中等學校同等學力認定標準", "content": "第  1  條\n本標準依高級中等教育法(以下簡稱本法)第三十四條規定訂定之。\n第  2  條\n本法第三十四條所定同等學力，其認定基準如下：\n一、 曾在公、私立國民中學或相當於國民中學教育階段之學校修習三年級課程，持有修業證明書。\n二、 依國民教育法規定，經主管機關許可參加相當於國民中學階段之非學校型態實驗教育二年以上，有證明文件。\n三、 曾在公、私立國民中學附設補習學校或已立案之私立中級補習學校修業期滿，取得結業證明書或修業證明書。\n四、 經國民中學畢業程度自學進修學力鑑定考試及格，取得學力鑑定通過證書。\n五、 取得丙級技術士證或相當於丙級以上技術士證之資格。\n第  3  條\n持大陸地區或香港、澳門相當於國內國民中學肄業之證明文件，符合大陸地區學歷採認辦法或香港澳門學歷檢覈及採認辦法規定者，得準用前條第一款規定辦理。\n修業年級高於相當國內國民中學之大陸地區或香港、澳門同級同類學校肄業生，修滿相當於國內國民中學修業年限以下年級者，得準用前條第一款規定辦理。\n第  4  條\n持國外相當於國內國民中學肄業之證明文件，符合高級中等學校辦理學生國外學歷採認辦法規定者，得準用第二條第一款規定辦理。\n修業年級高於相當國內國民中學之國外同級同類學校肄業生，修滿相當於國內國民中學修業年限以下年級者，得準用第二條第一款規定辦理。\n第  5  條\n本標準自中華民國一百零三年八月一日施行。", "history": "中華民國102年12月31日教育部臺教授國部字第1020127826A  號令訂定發布全文 5  條；並自103年8月1日施行。"}, {"title": "高級中等學校多元入學招生辦法", "content": "第  1  條\n本辦法依高級中等教育法(以下簡稱本法)第四十條規定訂定之。\n第  2  條\n本辦法適用於一百零三學年度以後入學之學生。\n第  3  條\n本辦法用詞，定義如下：\n一、 多元入學：指取得國民中學畢業資格或具同等學力學生(以下簡稱國中學生)，依下列方式之一進入高級中等學校(以下簡稱學校)就讀：\n(一) 免試入學：免入學測驗，依性向、興趣、志願等，選擇直升或進入就學區內之學校就讀。\n(二) 特色招生入學：依其術科或學科能力，分別以術科甄選或學科考試分發方式，進入辦理特色招生之學校就讀。\n二、 就學區：指直轄市、縣(市)主管機關以該直轄市、縣(市)個別或聯合之行政轄區為範圍所劃定，並經中央主管機關核定，供該區域之國中學生選擇免試入學，或核定該區域之學校辦理特色招生，供全國國中學生選擇特色招生入學之就學區域。\n第  4  條\n就學區之劃定，應考量下列因素：\n一、 新生入學來源：近三年入學各學校之國民中學畢業生學生數。\n二、 區域共同生活圈：因歷史發展、地理區位或社會文化所形成之共同生活網絡範圍。\n三、 交通便利性：區域公共交通網絡之連結及便利情形。\n四、 學校類型及分布：本法第五條各類型學校分布之完整性，或學生適性選擇之充分性。\n五、 其他直轄市、縣(市)主管機關認定之因素。\n就學區內之國民中學所在地緊鄰其他就學區之鄉(鎮、市、區)者，得由各該就學區之直轄市、縣(市)主管機關，依前項規定協商後，將該緊鄰鄉(鎮、市、區)或其所屬就學區，劃定為該國民中學之共同就學區。\n第  5  條\n就學區之劃定程序如下：\n一、 直轄市、縣(市)主管機關應於辦理招生前一年之六月十日前，依前條第一項規定，自行或聯合其他直轄市、縣(市)主管機關共同劃定就學區，報中央主管機關核定。直轄市、縣(市)主管機關於劃定階段，得報中央主管機關協助及調處。\n二、 中央主管機關於完成前款就學區之核定前，得邀集相關直轄市、縣(市)主管機關、國民中學與高級中等學校代表及專家學者共同協商。\n三、 直轄市、縣(市)主管機關應依中央主管機關之核定，於招生前一年之七月二十日前公告就學區。\n第  6  條\n免試入學之辦理方式如下：\n一、 就學區之直轄市、縣(市)主管機關應會商區內學校各該主管機關，依中央主管機關所定應遵行事項，訂定該區免試入學作業要點，提直轄市、縣(市)教育審議委員會審議通過，並經中央主管機關備查後公告實施；就學區涉及二以上直轄市、縣(市)者，應自行協調以其中之一為主政機關，會商訂定該區免試入學作業要點。\n二、 學校辦理免試入學，不得訂定申請條件。學生報名人數未超過學校核定招生名額者，全額錄取，超過者，採比序方式錄取；其比序項目及模式，應納入各區免試入學作業要點規定。\n三、 前款比序，應符合下列規定：\n(一) 一百零八學年度以後入學國民中學者，其健康與體育、藝術、綜合活動、科技四學習領域在校評量成績之及格與否，得予採計為比序項目。語文、數學、社會、自然科學四學習領域在校評量成績，不得採計。\n(二) 一百零七學年度以前入學國民中學者，其健康與體育、藝術與人文、綜合活動三學習領域在校評量成績之及格與否，得予採計為比序項目。語文、數學、社會、自然與生活科技四學習領域在校評量成績，不得採計。\n(三) 國中教育會考成績得列為比序項目；其列為比序項目者，應以採等級、等級加標示或運用加權採計方式為限，且比序比重不得超過總分三分之一。\n四、 學生經依前二款規定比序後仍超額時，報各該主管機關核准增加名額或為其他適當之處理。\n五、 直轄市、縣(市)主管機關依第一款規定訂定該區免試入學作業要點報備查時，中央主管機關認有違反本辦法或第一款應遵行事項之規定，經函請其限期修正者，直轄市、縣(市)主管機關應儘速修正後，報中央主管機關備查。為促進區域教育機會均等，鼓勵就近入學，或照顧弱勢學生就學權益，就學區之直轄市、縣(市)主管機關會商區內學校各該主管機關，於衡酌國民中學校數、畢業班數或人數等因素後，得於前項第一款免試入學作業要點中訂定學生優先免試入學之實施方式。\n第  7  條\n技術型及單科型學校有特殊招生需要者，其免試入學得依下列規定辦理，不受該區免試入學作業要點規定之限制。但其比序，應符合前條第一項第三款規定：\n一、 學校以群、科或校為規劃單位，擬具課程計畫、申請單獨招生之特色需求、理由及超額比序項目與方式，送該區免試入學委員會審查，並報各該主管機關核定後，單獨辦理免試招生。\n二、 學生得向前款各單獨招生學校報名，不受就學區限制，並以選擇一學校報到為限。\n三、 單獨招生學校之報到日期，應與就學區免試入學報到日同一日；其未招滿之名額，得辦理續招，其續招方式，除有特殊情形報經各該主管機關核准外，應依各區免試入學方式辦理。\n第  7-1  條\n學校進修部招收非應屆畢業生，得視歷年招生情況，自訂招生名額，並報各該主管機關核准，單獨辦理免試招生。\n第  8  條\n國中學生參加免試入學之範圍及學校分配共同就學區免試入學招生名額之方式如下：\n一、 依第四條第二項劃定緊鄰就學區之鄉(鎮、市、區)為共同就學區者：\n(一) 國中學生應以其具畢業或同等學力資格之國民中學學籍所在之就學區(以下簡稱原就學區)及共同就學區，參加免試入學，並依原就學區之免試入學作業要點規定辦理。\n(二) 位於共同就學區之學校得分配其招生名額，供原就學區國中學生參加免試入學。\n二、 依第四條第二項劃定緊鄰就學區全區為共同就學區者：\n(一) 國中學生應以原就學區或共同就學區擇一區參加免試入學，並依各該就學區之免試入學作業要點規定辦理。\n(二) 位於前目國民中學所在鄉(鎮、市、區)之學校得分配其招生名額，供原就學區及共同就學區內國中學生參加免試入學。\n因戶籍遷徙或其他特殊理由，須變更就學區者，應於免試入學招生簡章規定期限內，向擬參加免試入學之就學區免試入學委員會提出申請，經審查通過者，始得於變更後之就學區參加免試入學。\n第  9  條\n原住民重點學校或技術型學校產業特殊需求類科，得跨就學區，獨立或聯合辦理免試入學。\n第  10  條\n學校經免試入學仍未招滿，得報經各該主管機關核准，辦理免試續招，續招得不受就學區限制跨區辦理。但辦理方式仍應依第六條第一項第二款至第四款規定辦理。\n第  11  條\n特色招生辦理方式如下：\n一、 甄選入學：學校之音樂、美術、舞蹈、戲劇、科學、體育及高級中等學校專業群、科之特殊班、科、組、群，得參採國中教育會考成績作為錄取門檻，辦理單獨或聯合招生，並應依術科測驗分數及學生志願，作為錄取依據。\n二、 考試分發入學：\n(一) 學校採國中教育會考成績作為錄取門檻，並以學科測驗成績及學生志願，作為分發入學之依據，按就學區為單位，由各校辦理單獨或聯合考試招生。\n(二) 各學校應依其特色課程規劃前目學科測驗內容或加權採計。\n(三) 各就學區辦理特色招生之甄選入學，或考試分發入學，其同類型術科測驗或學科測驗，應以同日辦理為原則。\n第  12  條\n國民中學學生參加前條第一項第一款班、科、組、群之甄選入學者，其報名資格及審核程序，應依藝術教育法、特殊教育法、國民體育法、本法第十二條及其相關法規之規定辦理。\n第  13  條\n學校辦理特色招生考試分發、高級中等學校專業群、科辦理特色招生甄選入學之申請及審核程序如下：\n一、 就學區之直轄市、縣(市)主管機關應會商區內學校各該主管機關，依中央主管機關所定應遵行事項，訂定該區特色招生核定作業要點，提直轄市、縣(市)教育審議委員會審議通過，並經中央主管機關備查後公告實施；就學區涉及二以上直轄市、縣(市)者，應自行協商其中之一為主政機關，會商訂定該區特色招生核定作業要點。\n二、 學校以班(群、科、組)為規劃單位，向各該主管機關提出申請辦理特色招生；申請辦理考試分發入學及高級中等學校專業群、科特色招生甄選入學者，並應擬具計畫書，其計畫書內容應包括採特色招生之目標與理由、自我評估、課程規劃、師資條件、教學資源、辦理方式、學生輔導方式、編班方式、招生比率、學生表現、學校評鑑及預期成果。\n三、 主政機關應邀集區內學校各該主管機關共同成立審查會，審查前款計畫書，其委員應包括家長、教師、學校、國民中學與各該主管機關代表及學者專家等，並應遵守利益迴避原則。\n四、 直轄市、縣(市)主管機關應於辦理招生前一年九月三十日前，將前款審查結果與經各該主管機關核定之辦理特色招生之學校及招生名額，報中央主管機關備查後公告。\n五、 直轄市、縣(市)主管機關依第一款規定訂定特色招生核定作業要點報備查時，中央主管機關認有違反本辦法或第一款應遵行事項之規定，經函請其限期修正者，直轄市、縣(市)主管機關應儘速修正後，報中央主管機關備查。\n學校經核定辦理特色招生者，其以後學年度申請繼續辦理時，得經各該主管機關核准，免提前項第二款計畫書；其得免提計畫書之學年度，不得超過二年。\n第  14  條\n(刪除)\n第  15  條\n國民中學學生參加特色招生者，應擇一就學區報考並據以分發，不以其具畢業或同等學力資格之國民中學學籍所在地就學區為限。\n第  16  條\n各種入學方式之辦理時間，規定如下：\n一、 免試入學：\n(一) 於每年七月前辦理分發作業。\n(二) 學校附設國民中學部應屆畢業學生之直升入學，應於前目免試入學前辦理；直升錄取之學生，應經書面聲明放棄後，始得報名參加免試入學。\n二、 特色招生：\n(一) 甄選入學：其分發或報到，原則應與免試入學之分發同時辦理；報到後之各班、科有餘額時，經各該主管機關核准者，得辦理續招。\n(二) 考試分發入學：於每年六月辦理學科測驗。\n同時參加免試入學及特色招生，並均獲錄取者，應擇一學校報到。\n各就學區學校辦理免試入學及特色招生考試分發入學者，以一次辦理分發作業為原則。\n第  17  條\n各就學區之特色招生總名額不得超過核定招生總名額百分之二十五，特色招生考試分發入學未招滿之名額，不得續招，亦不得移列調整至其他入學方式使用。\n第  18  條\n各就學區免試入學總名額，應占核定招生總名額百分之八十五以上；各校提供免試入學總名額占該校核定招生總名額比率，以達百分之五十以上為原則。\n本法第三十五條第五項所定各校提供免試入學名額比率，及依本法第三十五條第六項申請辦理單獨招生之私立學校提供免試入學名額比率，不採計其附設國民中學部直升名額。\n第  18-1  條\n直轄市、縣(市)主管機關依本法第三十七條第三項規定應公告之免試入學超額比序之原則、程序及相關事項之規定，因正當事由未能於第五項所定期限完成者，應敘明理由及完成時間，報中央主管機關備查。\n第  19  條\n直轄市、縣(市)主管機關應組成入學推動工作小組，研商免試入學、特色招生入學辦理之方式、名額及其他入學招生相關事項。\n前項工作小組，由主管機關首長或教育局(處)長擔任召集人；小組委員就家長團體、教師組織、高級中等學校、國民中學與各該主管機關代表及專家學者聘(派)兼之，其中國民中學代表人數，不得低於高級中等學校代表人數。\n第  20  條\n各學校應成立學校招生委員會，依本辦法相關規定規劃辦理各種入學方式招生事項，並將學校基本資料、招生科別及名額、資格條件等招生資料，按其招生方式，報第二十一條第一項所定各種入學委員會審查，並彙編成各種入學方式招生簡章，經各種入學委員會報各該主管機關核定後，報中央主管機關備查，由各種入學委員會公告之。\n第  21  條\n除本辦法規定得採單獨招生方式者外，各就學區學校視實際辦理招生工作之必要，聯合成立各就學區免試入學委員會、特色招生甄選入學委員會及特色招生考試分發入學委員會，並依第十九條各就學區入學推動工作小組之決議，辦理免試入學、特色招生甄選入學及特色招生考試分發入學等招生工作。\n前項各種入學委員會委員，由直轄市、縣(市)主管機關、學校校長與教務主任、國民中學校長、教師組織及家長團體代表組成，其中國民中學校長、教師及家長等代表人數，不得少於委員總人數四分之一，且國民中學校長代表人數不得少於教師組織及家長團體代表人數之總和。\n各就學區之學校數低於十五校，未能依前項規定組成入學委員會者，得報直轄市、縣(市)主管機關核准後，調整委員人數，不受前項規定之限制。\n第一項各種入學委員會，均應成立申訴及緊急事件處理專案小組，負責辦理有關招生各種申訴及緊急事件。\n第  22  條\n各就學區各種入學委員會應推派代表，聯合成立全國各種入學委員會，協調各就學區招生入學相關事項。\n第  23  條\n高級中等學校為辦理多元入學招生事宜，得與專科學校五年制成立全國高級中等學校及專科學校五年制適性入學委員會，由第十九條、第二十一條、前條之各小組、委員會及專科學校五年制各招生委員會遴派委員組成，統合、協調並督導本辦法所定全國各種招生事項。\n第  24  條\n第十九條至前條所定各小組、委員會之委員及涉及試務工作者，對於試務及分發等事項負有保密義務。\n下列各款人員，本人或其配偶、前配偶、三親等內之血親或姻親或曾有此關係者報名參加當學年度該入學管道招生時，應行迴避︰\n一、 第二十條及第二十一條所定各委員會之委員。\n二、 第十九條、第二十二條及第二十三條所定各小組、委員會，辦理試務工作之命題、閱卷、審查或監試，或分發工作之積分、資格審查或入闈分發等委員及工作者。\n各就學區規定較本辦法限制更嚴格者，從其規定。\n第  25  條\n依本辦法辦理之各種入學招生作業，得向學生收取費用；其費額由入學委員會擬訂，報中央主管機關核定。但低收入戶子女或學生之直系血親尊親屬支領失業給付者，免收取費用。\n第  26  條\n高級中等學校建教合作班及實用技能學程(班)、特殊教育班之入學招生，其招生名額、方式及其他應遵行事項，依其相關法規之規定辦理。\n第  27  條\n直轄市、縣(市)主管機關應推動國民中學學生適性輔導工作，協助並督導國民中學辦理學生適性選擇適當入學方式，並建立對學校訪視及考核機制。\n第  28  條\n國民中學應配合各入學委員會之招生作業，提供畢(結)業學生必要之協助。\n國民中學應依學生能力、性向、興趣及各項測驗結果、教師平時之觀察及試探活動紀錄，並依中央主管機關訂定之國民中學推動生涯發展教育工作手冊及國中學生生涯輔導紀錄手冊，妥善規劃學校適性輔導工作。\n國民中學應於學生二年級時辦理性向測驗，三年級時辦理興趣測驗，並依測驗結果提供各項試探及實作活動，於三年級下學期當年四月三十日前，提供學生及家長升學進路之參考。\n第  29  條\n本辦法自中華民國一百零二年九月一日施行。\n本辦法修正條文，除中華民國一百零三年九月十二日修正發布之條文自一百零三年八月一日施行、一百零四年六月十日修正發布之第六條第一項第三款第二目、第二項、第十九條、第二十一條第二項自一百零四年八月一日施行、一百零五年八月十六日修正發布之第二十四條自一百零五年八月一日施行外，自發布日施行。", "history": "1.中華民國102年8月23日教育部臺教授國部字第 1020078575A號令訂定發布全文 29 條；並自102年9月1日施行。\n\n2.中華民國103年9月12日教育部臺教授國部字第 1030083939B號令修正發布第 6、7、10、11、13、14、16、18、21、24、29 條條文；增訂第 18-1 條條文；並自103年8月1日施行。\n\n3.中華民國104年6月10日教育部臺教授國部字第 1040062160B號  令修正發布第 6、13、19、21、29條條文；增訂第 7-1  條條文；除第 6  條第1項第3款第 2目、第2項、第19 條、第 21 條第 2  項自104年8月1日施行外，自發布日施行。\n\n4.中華民國105年8月16日教育部臺教授國部字第 1050085603B號令修正發布第 13、14、18、24、29 條條文；除第 24 條條文自105年8月一日施行外，自發布日施行。\n\n5.中華民國108年2月20日教育部臺教授國部字第 1080010359B號令修正發布第 7、10、13、18、20條條文；刪除第14條條文。\n\n6.中華民國110年6月30日教育部臺教授國部字第1100069751B號令修正發布第6條條文。"}, {"title": "高級中等學校免試入學作業要點訂定應遵行事項", "content": "一、 教育部(以下簡稱本部)為落實高級中等學校多元入學招生辦法(以下簡稱本辦法)第六條第一項第一款規定，以利各就學區(以下簡稱各區)主管機關訂定該區高級中等學校免試入學作業要點(以下簡稱免試入學作業要點)時得有共通性原則，特訂定本應遵行事項。\n二、 本應遵行事項適用於本部、各直轄市政府教育局、縣(市)政府及公私立高級中等學校。\n三、 免試入學作業要點，其內容應包括下列事項：\n(一) 訂定依據。\n(二) 訂定程序。\n(三) 該區免試入學名額占總核定招生名額之比率。\n(四) 區內各校提供免試入學名額之最低比率。\n(五) 區內公私立高級中等學校附設國中部之直升入學比率及辦理方式。\n(六) 免試入學作業流程。\n(七) 免試入學超額時之比序項目及運作模式。\n(八) 學生經依免試入學超額時之比序項目及運作模式仍同分時之適當處理   方式。\n四、 前點第七款比序項目及運作模式，應符合下列規定：\n(一) 符合教育性、公平性、可操作性原則，規定如下：\n1. 教育性：比序項目應符合教育目標，如培養五育均衡發展、重視學生多元智能、舒緩升學壓力，以達成學生適性發展。\n2. 公平性：比序項目應符合公平原則，促進教育機會均等。\n3. 可操作性：比序項目應兼顧入學管道之可行性及完整性。\n(二) 國中教育會考項目：\n1. 是否採計由各區因地制宜。但不得列為唯一項目，應搭配其他比序項目整體規劃。\n2. 超額比序項目包括國中教育會考總標示(總積點)者，其順次應置於\n3. 多元學習表現項目總積分之後，並置於國中教育會考各科標示比序之前；比序項目包括國中教育會考三等級總積分者，總標示(總積點)並應置於三等級總積分之後。\n(三) 志願序項目：\n1. 普通型高級中等學校以校為原則；技術型高級中等學校得以校、群科為志願序。\n2. 是否採計由各區因地制宜考量；採計志願序者，以群組計分為原則，高低分積分差異不宜過大。\n(四) 多元學習表現項目採計原則如附件。\n五、 完全中學或高級中等學校附設國民中學部辦理應屆畢業生直升入學，依下列規定辦理：\n(一) 超額比序項目及模式，依所在之該區免試入學作業要點規定。\n(二) 直升入學未招滿之名額(包括特殊身分學生外加名額)，移列至該區免試入學辦理；其辦理方式，依各區免試入學作業要點規定。\n(三) 各區免試入學委員會應會同主管機關於放榜前針對多元學習表現積分、國中教育會考成績、超額比序項目及模式等項目，擇採集中分發、集中審查或重點審查方式辦理查核。\n六、 學生於就讀或畢業之國民中學學籍所在之該區參加免試入學，有下列特殊因素者，僅得擇一區參加免試入學：\n(一) 學生就讀或畢業之國民中學學籍所在之該區，未設置學生適性選擇之技術型高級中等學校課程群別或產業特殊需求類科。\n(二) 學生因搬家遷徙。\n(三) 學生在國民中學階段跨區就學，惟未遷移戶籍，並計畫返回原戶籍所在地就讀學校。\n(四) 其他經核定之特殊因素。\n學生依前項特殊因素申請專案認定者，其所需檢附文件、程序及審核機制，由各區免試入學委員會訂定。\n七、 技藝技能優良學生甄審入學、國中技藝教育課程(班)畢業生分發實用技能學程(班)、建教合作班、技術型及單科型高級中等學校單獨辦理免試招生、身心障礙學生入學等，得由各主管機關另定招生方式及其他應遵行事項。", "history": "1.中華民國103年9月12日教育部臺教授國部字第1030093905B號令訂定發布全文10點，並自即日生效。\n\n2.中華民國104年6月24日教育部臺教授國部字第1040057382B號令修正全文7點，並自中華民國104年8月1日生效。\n\n3.中華民國104年8月4日教育部臺教授國部字第1040086268B號令修正第4點，並自中華民國104年8月1日生效。\n\n4.中華民國105年8月30日教育部臺教授國部字第1050091890B號修正第4點、第7點，並自即日生效。\n\n5. 中華民國113年3月21日教育部臺教授國部字第1135400097A號令修正「高級中等學校免試入學作業要點訂定應遵行事項」第4點附件，並自中華民國113年8月1日生效。"}, {"title": "高級中等學校特色招生核定作業要點訂定應遵行事項", "content": "一、 教育部(以下簡稱本部)為落實高級中等學校多元入學招生辦法(以下簡稱本辦法)第十三條第一項第一款規定，以利各就學區(以下簡稱各區)主管機關訂定該區高級中等學校特色招生核定作業要點時得有共通性原則，特訂定本應遵行事項。\n二、 本應遵行事項適用於本部、各直轄市政府教育局、縣(市)政府及公私立高級中等學校。\n三、 高級中等學校特色招生核定作業要點，其內容應包括下列事項：\n(一) 訂定依據。\n(二) 訂定程序。\n(三) 該區特色招生總名額比率。\n(四) 特色招生審查會之組織、成員及利益迴避原則。\n(五) 學校申辦之程序、日程及所需文件。\n(六) 審查程序及重點：\n1. 審查程序：包括特色招生審查會之運作、審查程序及作業期程。\n2. 審查重點：\n(1) 招生之目標及理由：特色招生目標與特色課程實施目標相符，及其理由具信服力。\n(2) 自我評估：辦理特色招生班(群、科)之內外部評估。\n(3) 課程規劃草案：應符合特色課程內涵，如：發展語文、人文學科、社會科學、數學、自然科學、藝術、技能或與社區文化結合等。\n(4) 教學資源：包括師資、設備、教材教法等，與大專校院、學術機構、國中小、社區及企業等合作成效，如：國家科學技術委員會高瞻計畫、產學攜手合作計畫等。\n(5) 辦理方式：學科測驗內容應符合特色課程規劃；試務規劃應包括招生名額、命題單位、分數採計及錄取方式；招生方式採聯合或單獨辦理等。\n(6) 學生輔導方式：學生未來學習、升學及就業等生涯輔導之規劃。\n(7) 編班方式：學校以各該主管機關核定之招收新生班級人數申請辦理特色招生入學者，以班為規劃單位，得呈現班別名稱；非以班為規劃單位，應僅呈現群、科別名稱。\n(8) 招生比率：特色招生之名額占學校總招生名額之比率。\n(9) 學生表現：學校歷年參加國際性或全國性競賽、全國性科學展等成果、學科能力測驗或四技二專統一入學測驗之各科成績分布等學生優異表現。\n(10) 學校評鑑。\n(11) 預期成果。\n(12) 其他主管機關核定之重要項目，如：國中應屆畢業生人數及前學年度特色招生辦理情形等。\n(七) 申復程序及日程。\n(八) 核定程序及公告日程規劃。\n(九) 核定結果之有效期限。\n四、 重新申請辦理特色招生或招生班(群、科)變更之學校，仍應依本辦法規定辦理；已經核定辦理特色招生，惟未變更招生班(群、科)之班名、科別、課程規劃等，僅降低名額或下一學年度停辦者，免提計畫書，經該校招生委員會通過後報各該主管機關核定，並報本部備查。\n五、 本辦法第十一條第一項第一款甄選入學之招生範圍，由各主管機關依實際需要訂定，報本部備查；其高級中等學校特色招生核定作業要點，由本部定之。\n六、 主管機關審核高級中等學校提報特色招生申請計畫檢核表之參考格式如附件。", "history": "1.中華民國103年9月12日教育部臺教授國部字第 1030093055B 號令訂定發布全文7點，並自即日生效。\n\n2.中華民國104年6月24日教育部臺教授國部字第 1040058050B 號令修正全文6點，並自即日生效。\n\n3.中華民國105年8月30日教育部臺教授國部字第1050091895B號修正第3點及第6點(附件)，並自即日生效\n。\n4.中華民國108年7月5日教育部臺教授國部字第 1080068371B 號令修正發布第3點、第\n4點及第6點附件，並自即日生效。\n\n5.中華民國109年2月25日教育部臺教授國部字第 1090013221B 號令修正發布第3點、第4點及第6點附件，並自即日生效。\n\n6.中華民國112年12月28日教育部臺教授國部字第1120171643A號令修正「高級中等學校特色招生核定作業要點訂定應遵行事項」第3點、第4點，並自即日生效。"}, {"title": "高級中等學校辦理學生國外學歷採認辦法", "content": "第  1  條\n本辦法依高級中等教育法第四十七條第二項規定訂定之。\n第  2  條\n本辦法用詞，定義如下：\n一、 採認：指高級中等學校(以下簡稱學校)就申請人所檢附之國外學歷文件所為與國內同級同類學校相當學歷之認定。\n二、 驗證：指申請人持國外學校學歷證書、成績證明等證件，向我國駐外使領館、代表處、辦事處或其他經外交部授權機構(以下簡稱駐外館處)申請證明文件為真。\n三、 查證：指學校函請駐外館處查明證實當地國政府權責機關對學校認可情形及其入學資格、修業期間等事項。\n第  3  條\n國外學歷符合下列各款規定者，始得採認：\n一、 畢(肄)業學校為當地國政府權責機關所認可。\n二、 修業期間、修習課程，與國內同級同類學校規定相當。\n前項第二款所稱修業期間，指申請人停留於當地學校之修業時間應符合當地國學制之規定。\n第一項修業期間，學校應對照國內外學制情形，以申請人所持國外學歷當地國學制、修業期間學校行事曆及入出國紀錄等綜合判斷。\n符合特殊教育法所定身心障礙者，其修業期間之認定，得由各校衡酌各該國外學校學制之規定及實際狀況，予以酌減。\n第  4  條\n國外學歷有下列情形之一者，不予採認：\n一、 經函授方式取得。\n二、 各類研習班所取得之修課證(明)書。\n三、 未經教育部認可，在我國所設分校或以國外學校名義委託機構在國內招生授課取得之學歷。\n第  5  條\n申請人得檢具下列文件，向學校申請辦理國外學歷採認：\n一、 經我國駐外館處驗證之國外學歷證件及歷年成績證明影本一份。\n二、 國外學歷修業起迄期間之入出國主管機關核發之入出國紀錄一份。但申請人係外國人或僑民者，免附。\n三、 其他學校規定之相關文件。\n前項第一款文件之驗證，得以受理學校向申請人國外畢業學校查證代替之。\n第  6  條\n學校辦理查證國外學歷，應由申請人出具授權查證之英文同意書及相關文件後，函請我國駐外館處為之。\n第  7  條\n學校函請駐外館處協助查證申請人所持國外學歷之項目如下：\n一、 入學資格。\n二、 修業期間。\n三、 當地國政府權責機關對學校認可情形。\n四、 其他必要查證事項。\n第  8  條\n學校辦理國外學歷採認，依本辦法規定辦理驗證及查證後，如仍有疑義，必要時，得敘明疑義，並檢附相關證明文件，送教育部國民及學前教育署協助。\n第  9  條\n申請人所提供之各項證件，有偽造、變造、冒用等不實情事，經調查屬實者，應予撤銷其學歷之採認。經許可入學者，撤銷其入學許可；已註冊入學者，撤銷其學籍，且不發給與修業有關之任何證明文件；畢業後發現者，撤銷畢業資格，並追繳或註銷畢業證書；涉及刑事責任者，移送司法機關依法辦理。\n第  10  條\n本辦法自中華民國一百零三年八月一日施行。", "history": "中華民國102年12月30日教育部臺教授國部字第1020125951A 號令訂定發布全文 10 條；並自103年8月1日施行。"}, {"title": "外國學生來臺就學辦法", "content": "第  1  條\n本辦法依大學法第二十五條第三項、專科學校法第三十二條第一項、高級中等教育法第四十一條第一項及國民教育法第三十條第一項規定訂定之。\n第  2  條\n具外國國籍且未曾具有中華民國國籍，符合下列規定者，得依本辦法規定申請入學：\n一、 未曾以僑生身分在臺就學。\n二、 未於申請入學當學年度依僑生回國就學及輔導辦法經海外聯合招生委員會分發。\n具外國國籍並符合下列規定，且最近連續居留海外六年以上者，亦得依本辦法規定申請入學。但擬就讀大學醫學、牙醫或中醫學系者，其連續居留年限為八年以上：\n一、 申請時兼具中華民國國籍者，應自始未曾在臺設有戶籍。\n二、 申請前曾兼具中華民國國籍，於申請時已不具中華民國國籍者，應自內政部許可喪失中華民國國籍之日起至申請時已滿八年。\n三、 前二款均應符合前項第一款及第二款規定。\n依教育合作協議，由外國政府、機構或學校遴薦來臺就學之外國國民，其自始未曾在臺設有戶籍者，經主管機關核准，得不受前二項規定之限制。\n第二項所定六年、八年，以擬入學當學期起始日期(二月一日或八月一日)為終日計算之。\n第二項所稱海外，指大陸地區、香港及澳門以外之國家或地區；所稱連續居留，指外國學生每曆年在國內停留期間未逾一百二十日。連續居留海外採計期間之起迄年度非屬完整曆年者，以各該年度之採計期間內在國內停留期間未逾一百二十日予以認定。但符合下列情形之一且具相關證明文件者，不在此限；其在國內停留期間，不併入海外居留期間計算：\n一、 就讀僑務主管機關舉辦之海外青年技術訓練班或教育部(以下簡稱本部)認定之技術訓練專班。\n二、 就讀本部核准得招收外國學生之各大專校院華語文中心，合計未滿二年。\n三、 交換學生，其交換期間合計未滿二年。\n四、 經中央目的事業主管機關許可來臺實習，實習期間合計未滿二年。\n具外國國籍並兼具中華民國國籍，且於本辦法中華民國一百年二月一日修正施行前已提出申請喪失中華民國國籍者，得依原規定申請入學，不受第二項規定之限制。\n具有國籍法第二條規定情形者，為本辦法所定具有中華民國國籍。\n第  3  條\n具外國國籍，兼具香港或澳門永久居留資格，且未曾在臺設有戶籍，申請時於香港、澳門或海外連續居留滿六年以上者，得依本辦法規定申請入學。但擬就讀大學醫學、牙醫或中醫學系者，其連續居留年限為八年以上。\n前項所稱連續居留，指每曆年在國內停留期間，合計未逾一百二十日。但符合前條第五項第一款至第四款所列情形之一且具相關證明文件者，不在此限；其在國內停留期間，不併入前項連續居留期間計算。\n曾為大陸地區人民具外國國籍且未曾在臺設有戶籍，申請時已連續居留海外六年以上者，得依本辦法規定申請入學。但擬就讀大學醫學、牙醫或中醫學系者，其連續居留年限為八年以上。\n前項所稱連續居留，指每曆年在國內停留期間，合計未逾一百二十日。但符合前條第五項第一款至第四款所列情形之一且具相關證明文件者，不在此限；其在國內停留期間，不併入海外連續居留期間計算。\n第一項及第三項所定六年、八年，以擬入學當學期起始日期(二月一日或八月一日)為終日計算之。\n第一項至第四項所定海外，準用前條第五項規定。\n第  4  條\n外國學生依前二條規定申請來臺就學，以一次為限；繼續在臺就學者，入學方式應與我國內一般學生相同。\n外國學生有下列情形之一者，其於前項申請後，復申請繼續在臺就學，或\n再次申請來臺就學，不受前項規定之限制：\n一、 於完成申請就學學校學程後，申請碩士班以上學程，逕依各校規定辦理。\n二、 外國學生申請來臺就讀學士班以下學程，在國內停留未滿一年，因故退學或喪失學籍，得重新申請來臺就學，並以一次為限。\n三、 符合第二條第一項規定之外國學生，申請就讀副學士以下學程。\n四、 符合第二條第一項規定之外國學生，申請入學大學醫學、牙醫或中醫    學系以外之學士班學程，並以一次為限。\n外國學生經入學學校以操行不及格或學業考核未達規定、違反法令或校規情節嚴重致遭退學或喪失學籍者，不得再依前二項規定申請入學。\n第  5  條\n大學及專科學校二年制(以下簡稱大專校院)實際招收入學之外國學生，其名額以本部核定該校前一學年度招生名額外加百分之十為原則，並應併入當學年度招生總名額報本部核定；申請招收外國學生名額超過前一學年度核定招生名額外加百分之十者，應併同提出增量計畫(包括品質控管策略及配套措施)報本部核定。但國內大學與外國大學合作並經本部專案核定之學位專班，不在此限。\n專科學校五年制及高級中等以下學校實際招收入學之外國學生，其名額以各主管機關核定該校前一學年度招生名額外加百分之十為限，並應併入當學年度招生總名額報各主管機關核定。\n大專校院於前一學年度核定招生總名額內，有本國學生未招足情形者，得以外國學生名額補足，並應報本部核定。\n第一項及第二項招生名額，不包括未具正式學籍之外國學生。\n第  6  條\n大專校院招收外國學生入學各年級，應擬訂公開招生規定報本部核定，其內容應包括招生方式、入學資格審查程序、學系(程)授課語言、學生應具備之語文能力基準、財力證明基準及其他相關事項。\n前項招生規定經本部核定後，大專校院應自行訂定外國學生招生簡章，詳列招生方式、入學資格審查程序、招生學系(程)、各學系(程)授課語言、學生應具備之語文能力基準、修業年限、招生名額、申請資格、財力證明基準、學雜費收退費基準、學校獎助學金資訊及其他相關事項。\n大專校院辦理外國學生招生事務，除宣傳推廣及協助學生辦理來臺相關必要程序外，不得委由校外機構、法人、團體或個人辦理；並應適時確認其是否向外國學生收取不合理之費用、成立借貸關係或其他違反相關法令之情形，必要時得向申請之外國學生查核。\n大專校院自行或委由校外機構、法人、團體或個人辦理外國學生招生相關事項，不得提供與招生規定、招生簡章或相關規定不一致之資訊。\n第  7  條\n申請入學大專校院之外國學生，應於各校院指定期間，檢附下列文件，逕向各該校院申請入學，經審查或甄試合格者，發給入學許可：\n一、 入學申請表。\n二、 學歷證明文件：\n(一) 大陸地區學歷：應依大陸地區學歷採認辦法規定辦理。\n(二) 香港或澳門學歷：應依香港澳門學歷檢覈及採認辦法規定辦理。\n(三) 其他地區學歷：\n1. 海外臺灣學校及大陸地區臺商學校之學歷同我國同級學校學歷。\n2. 前二目以外之國外地區學歷，應依大學辦理國外學歷採認辦法規定辦理。但設校或分校於大陸地區之外國學校學歷，應經大陸地區公證處公證，並經行政院設立或指定之機構或委託之民間團體驗證。\n三、 足夠在臺就學之財力證明，或政府、大專校院或民間機構提供全額獎助學金之證明。\n四、 申請學校所規定之其他文件。\n各校審核外國學生之入學申請時，對前項第二款至第四款未經我國駐外機構、行政院設立或指定之機構或委託之民間團體驗證之文件認定有疑義時，得要求經驗證；其業經驗證者，得請求協助查證。\n第一項入學許可應載明外國學生之姓名、就讀學程名稱、學位別、授課語言、入學之學年、學期開始日期、學雜費收退費基準、獎助學金及其他應告知外國學生之相關資訊之中文及英文版本，確認外國學生瞭解來臺就學相關權利義務，並得提供外國學生母國語言版本。\n第  7-1  條\n外國學生所繳入學證明文件有偽造、假借、塗改等情事，應撤銷錄取資格；已註冊入學者，撤銷其學籍，且不發給任何相關學業證明；如畢業後始發現者，應由學校撤銷其畢業資格並註銷其學位證書。\n第  8  條\n外國學生已在臺完成學士以上學位，繼續申請入學碩士以上學程者，得檢具我國各校院畢業證書及歷年成績證明文件，依第七條規定申請入學，免檢附第七條第一項第二款規定之境外學歷證明文件。\n符合第二條第一項規定之外國學生，在我國完成副學士以下學程者，得持該學歷證明文件及歷年成績證明文件，依第七條、第十八條、第二十條規定申請入學學士班以下學程，免檢附第七條第一項第二款、第十八條第一項第二款及第二十條第一項第三款規定之境外學歷證明文件。\n第  9  條\n招收外國學生之大專校院，應即時於本部指定之外國學生資料管理資訊系統，登錄外國學生錄取、入學、轉學、休學、退學或變更、喪失學生身分、離境等情事。\n第  10  條\n外國學生不得申請就讀我國大專校院所辦理回流教育之進修學士班、碩士在職專班及其他僅於夜間、例假日授課之班別。但外國學生在臺已具有合法居留身分者或其就讀之班別屬經本部專案核准之課程者，不在此限。\n第  11  條\n大專校院、專科學校五年制、高級中等以下學校之外國學生註冊入學時，未逾該學年第一學期修業期間三分之一者，於當學期入學；已逾該學年第一學期修業期間三分之一者，於第二學期或下一學年註冊入學。但各主管機關另有規定者，不在此限。\n第  12  條\n大學外國學生於我國大學畢業後，經學校核轉本部許可在我國實習者，其外國學生身分最長得延長至畢業後一年。\n外國學生來臺就學後，其於就學期間許可在臺初設戶籍登記、戶籍遷入登記、歸化或回復中華民國國籍者，喪失外國學生身分，應予退學。但符合下列情形之一者，不在此限：\n一、 入學方式與我國內一般學生相同。\n二、 依國籍法第四條第一項第一款至第三款申請歸化取得中華民國國籍。\n三、 符合第二條第一項規定且依國籍法第三條至第七條申請歸化取得中華民國國籍。\n於我國大專校院就讀之外國學生轉學，由各大專校院自行訂定相關規定，並納入招生規定報本部核定。但外國學生經入學學校以操行不及格或因刑事案件經判刑確定致遭退學者，不得轉學進入大專校院就讀。\n第  13  條\n大專校院在不影響正常教學情況下，得與外國學校簽訂教育合作協議，招收外國交換學生；並得準用外國學生入學規定，酌收外國人士為選讀生。\n高級中等以下學校經各主管機關核准者，得招收外國學生來臺進行一年以下之短期研習。\n第  14  條\n各級學校因國際學術合作計畫或其他特殊需求成立外國學生專班者，應依各級學校總量發展規模與資源條件相關規定，經該管主管機關核轉本部核定。\n第  15  條\n本部為獎勵就讀大專校院優秀外國學生，得設置或補助學校設置外國學生獎學金。\n大專校院為鼓勵外國學生來臺就學，得自行提撥經費設置外國學生獎學金、助學金。\n第  16  條\n大專校院應指定專責單位或人員負責辦理外國學生就學申請、輔導、聯繫等事項，並加強安排住宿家庭及輔導外國學生學習我國語文、文化等，以增進外國學生對我國之了解。\n大專校院應於每學年度不定期舉辦外國學生輔導活動或促進校園國際化，有助我國學生與外國學生交流、互動之活動。\n第  17  條\n專科學校五年制及高級中等以下學校招收外國學生，除依第二十條規定辦理在臺已具有合法居留身分之外國學生申請入學外，應擬訂招收外國學生來臺就學有關計畫，於每年十一月三十日前報該管主管機關核定後，始得招生。直轄市、縣(市)主管機關並應於每年十二月三十一日前，將核定招生學校名冊報本部備查。\n前項計畫內容應包括專責外國學生單位之設置、加強我國語文、文化學習課程之規劃及安排外國學生住宿之措施等事項。\n第一項學校招收外國學生之國別及名額，必要時得由本部會商內政部及外交部後定之。\n第  18  條\n申請入學專科學校五年制及高級中等以下學校之外國學生，除第二十條另有規定外，應於各校指定期間，檢附下列文件，逕向各校申請入學，經審查或甄試合格者，發給入學許可：\n一、 入學申請表。\n二、 學歷證明文件：\n(一) 大陸地區學歷：應依大陸地區學歷採認辦法規定辦理。\n(二) 香港及澳門學歷：應依香港澳門學歷檢覈及採認辦法規定辦理。\n(三) 其他地區學歷：\n1. 海外臺灣學校及大陸地區臺商學校之學歷同我國同級學校學歷。\n2. 前二目以外之國外地區學歷，應依本部國外學歷查證認定相關規定辦理。設校或分校於大陸地區之國外學校學歷，應經大陸地區公證處公證，並經行政院設立或指定之機構或委託之民間團體驗證。\n三、 足夠在臺就學之財力證明。\n四、 在臺監護人資格證明文件。\n五、 經駐外機構驗證之父母或其他法定代理人委託在臺監護人之委託書。\n六、 經我國公證人公證之在臺監護人同意書。\n七、 申請學校所規定之其他文件。\n前項第二款學歷證明文件，於申請入學國民小學一年級上學期者，免予檢附。\n第一項第四款至第六款文件，外國學生已成年者，免予檢附。\n各校審核外國學生之入學申請時，對第一項第二款、第三款及第七款未經駐外機構、行政院設立或指定之機構或委託之民間團體驗證之文件認定有疑義時，得要求驗證；其業經驗證者，得請求協助查證。\n第  19  條\n前條所稱在臺監護人，應為在臺設有戶籍之中華民國國民，並提出無犯罪之警察刑事紀錄證明及稅捐機關核發最新年度個人各類所得總額新臺幣九十萬元以上之資料清單。\n符合前項規定者，每人以擔任一位外國學生之在臺監護人為限。但以校長、學校財團法人董事長或董事為監護人者，每人以擔任五位外國學生之在臺監護人為限。\n第  20  條\n在臺已有合法居留身分，申請入學專科學校五年制及高級中等以下學校之外國學生，應檢具下列文件，逕向學校申請，並經甄試核准後註冊入學：\n一、 入學申請表。\n二、 合法居留證件影本。\n三、 學歷證明文件：\n(一) 大陸地區學歷：應依大陸地區學歷採認辦法規定辦理。\n(二) 香港及澳門學歷：應依香港澳門學歷檢覈及採認辦法規定辦理。\n(三) 其他地區學歷：\n1. 海外臺灣學校及大陸地區臺商學校之學歷同我國同級學校學歷。\n2. 前二目以外之國外地區學歷，應依本部國外學歷查證認定相關規定辦理。設校或分校於大陸地區之國外學校學歷，應經大陸地區公證處公證，並經行政院設立或指定之機構或委託之民間團體驗證。\n前項第三款學歷證明文件，於申請入學國民小學一年級上學期者，免予檢附。\n各校審核外國學生之入學申請時，對第一項第三款未經駐外機構、行政院設立或指定之機構或委託之民間團體驗證之文件認定有疑義時，得要求驗證；其業經驗證者，得請求協助查證。\n高級中等以下學校應於第一項外國學生註冊入學後，列冊報該管主管機關備查。\n第一項外國學生如申請高級中等以下學校因招生額滿無法接受入學，得向主管機關申請輔導至有缺額之學校入學。\n高級中等以下學校得視第一項申請入學學生甄試成績，編入適當年級就讀或隨班附讀；附讀以一年為限，經考試及格者，承認其學籍。\n第  20-1  條\n外國學生因該國發生戰亂、重大災害或重大傳染疾病疫情等情事，致該地區之學校無法正常運作，得經我駐外機構、或其本國駐華使領館或授權機構檢齊相關評估資料，經本部會同外交部、內政部移民署等相關機關認定後，其入學高級中等學校、專科學校以專案辦理招生。\n前項專案就學採外加名額者，以各校招生核定各該學制總名額外加百分之一為原則。\n第  21  條\n外國學生就學應繳之費用，依下列規定辦理：\n一、 依前二條規定入學者、經駐外機構推薦來臺就學之外交部臺灣獎學金受獎學生及具我國永久居留身分者，依就讀學校所定我國學生收費基準辦理。\n二、 依教育合作協議入學者，依協議規定辦理。\n三、 前二款以外之外國學生，依其就讀學校所定外國學生收費基準，並不得低於同級私立學校收費基準。\n本辦法中華民國一百年二月一日修正施行前已入學之學生，該教育階段應繳之費用，仍依原規定辦理。\n第  22  條\n外國學生註冊時，新生應檢附已投保自入境當日起至少六個月效期之醫療及傷害保險，在校生應檢附我國全民健康保險等相關保險證明文件。\n前項保險證明如為國外所核發者，應經駐外機構驗證。\n第  23  條\n外國學生有違反就業服務法之規定經查證屬實者，學校或相關主管機關應即依規定處理。\n第  24  條\n外國學生有休學、退學或變更、喪失學生身分等情事，學校應通報外交部領事事務局及學校所在地之內政部移民署各服務站，並副知本部。\n第  25  條\n學校違反本辦法規定者，主管機關依相關法令規定處理。\n學校未依第二十三條規定處理者，各該主管機關並得視情形調整招收外國學生名額。\n第  26  條\n外國學生來臺於大專校院附設之華語文中心學習語文者，其申請程序、獎補助、管理與輔導、缺課時數逾該期上課總時數四分之一以上及變更或喪失學生身分之通報，準用第七條第一項第一款、第三款、第四款、第九條、第十五條、第十六條、第二十二條及第二十四條規定。\n第  27  條\n第七條第一項第一款、第十八條第一項第一款及第二十條第一項第一款所定書表格式，由各校定之；第十八條第一項第五款及第六款所定書表格式，由本部定之。\n第  27-1  條\n實驗教育機構得依高級中等以下教育階段非學校型態實驗教育實施條例，並準用本辦法規定，招收外國學生來臺就學；其準用本辦法之範圍如下：\n一、 第二條。\n二、 第三條。\n三、 第四條。\n四、 第十一條。\n五、 第十三條第二項。\n六、 第十七條第一項。\n七、 第十八條。\n八、 第十九條第一項。\n九、 第二十條第一項至第四項。\n十、 第二十二條。\n十一、 第二十三條。\n十二、 第二十五條第一項。\n十三、 前條。\n實驗教育機構擬訂外國學生來臺就學有關計畫之內容，應包括外國學生專責人員之設置等事項。\n實驗教育機構招收外國學生之國別，比照高級中等以下學校招收外國學生之國別規定。\n符合第十九條第一項所定資格者，每人以擔任一位外國學生之在臺監護人為限。但實驗教育機構之負責人或設立實驗教育機構之非營利法人代表，每人以擔任五位外國學生之在臺監護人為限。\n實驗教育機構招收外國學生之收、退費相關規定，應納入高級中等以下教育階段非學校型態實驗教育實施條例第六條第四項第七款收、退費規定。\n外國學生有喪失學生身分、休學、變更或終止短期研習及其他情事，實驗教育機構應通報外交部領事事務局及學校所在地之內政部移民署各服務站，並副知本部、直轄市、縣(市)主管機關及設籍學校。\n第  28  條\n本辦法自中華民國一百零一年八月一日施行。\n本辦法修正條文，除中華民國一百零一年十二月二十四日修正發布之條文，自一百零二年一月一日施行，一百零二年八月二十三日修正發布之條文，自一百零二年九月一日施行外，自發布日施行。", "history": "1.中華民國110年1月22日教育部臺教文(五)字第 110000346 1B  號令修正發布第 2～6、8、12 條條文；增訂第27-1條條文。\n\n2.中華民國111年12月29日教育部臺教文(五)字第1112506246A 號令修正發布第 6、7、25 條條文。\n\n3. 中華民國114年9月19日教育部臺教文(五)字第1142503595A號令修正「外國學生來臺就學辦法」部分條文。"}, {"title": "大陸地區學歷採認辦法", "content": "第  1  條\n本辦法依臺灣地區與大陸地區人民關係條例(以下簡稱本條例)第二十二條第一項規定訂定之。\n第  2  條\n本辦法用詞，定義如下：\n一、 大陸地區學歷證件：指由大陸地區各級各類學校或學位授予機構(以下簡稱機構)發給之學歷證件，包括學位證(明)書、畢業證(明)書及肄業證(明)書。\n二、 查驗：指查核驗明經大陸地區公證處公證屬實，且經行政院設立或指定之機構或委託之民間團體驗證之相關證件，或經大陸地區指定之認證中心證明屬實之證明文件，及其他依本辦法規定應檢具之相關證件。\n三、 查證：指依大陸地區學歷證件、成績證明、論文等文件、資料，查明證實當地政府權責機關對學校或機構認可情形與其入學資格、修業時間及修習課程等事項。\n四、 採認：指就大陸地區學歷完成查驗、查證，認定與臺灣地區同級同類學校相當之學歷。\n五、 認可名冊：指教育部(以下簡稱本部)就大陸地區高等學校或機構之研究及教學品質進行認可後，收錄其名稱、地址所彙集並公告之名冊。\n第  3  條\n下列人民持有大陸地區學歷證件者，得依本辦法申請大陸地區學歷採認：\n一、 臺灣地區人民。\n二、 申請來臺灣地區就讀之大陸地區人民。\n三、 申請於臺灣地區大專校院依法於境外開設之專班就讀之大陸地區人民。\n四、 經許可進入臺灣地區團聚、依親居留或長期居留之大陸地區人民。\n五、 經許可在臺灣地區定居之大陸地區人民。\n前項人民，於本條例中華民國九十九年九月三日修正生效後，於當學期或以後學期入學於大陸地區高等學校或機構就讀者，始得依本辦法申請高等學校或機構學歷採認。\n第  4  條\n符合前條規定之大陸地區人民，申請學歷採認，應檢具下列文件：\n一、 國民小學及國民中學學歷：畢業證(明)書或肄業證(明)書；必要時，另應檢附歷年成績證明。\n二、 高級中等學校學歷：\n(一) 經大陸地區公證處公證屬實之畢業證(明)書或肄業證(明)書及公證書影本；必要時，另應檢附歷年成績證明。\n(二) 前目公證書經行政院設立或指定之機構或委託之民間團體驗證與大陸地區公證處原發副本相符之文件影本。\n三、 高等學校或機構學歷：\n(一) 肄業：\n1. 經大陸地區公證處公證屬實之肄業證(明)書、歷年成績證明及公證書影本。\n2. 本目之 1 公證書經行政院設立或指定之機構或委託之民間團體驗證與大陸地區公證處原發副本相符之文件影本。\n(二) 畢業：\n1. 畢業證(明)書。\n2. 學位證(明)書及歷年成績。但高等學校或機構專科學歷，得免檢具學位證(明)書。\n3. 本目之 1 及之 2 文件經大陸地區指定之認證中心證明屬實之證明文件。\n4. 碩士以上學歷者，並應檢具學位論文。\n前項第三款第二目之 1 至之 3 文件，經本部依第六條規定查證認定有疑義時，並應檢具下列文件：\n一、 前項第三款第二目之 1 及之 2 文件經大陸地區公證處公證屬實之公證書影本。\n二、 前款公證書經行政院設立或指定之機構或委託之民間團體驗證與大陸地區公證處原發副本相符之文件影本。\n經許可在臺灣地區居留之大陸地區人民，申請學歷採認，除應依前二項規定辦理外，並應檢具居留證。\n經許可在臺灣地區定居之大陸地區人民，申請學歷採認，除應依第一項及第二項規定辦理外，並應檢具國民身分證。\n第  5  條\n臺灣地區人民申請學歷採認，除準用前條第一項及第二項各款規定檢具文件外，並應檢具國民身分證明及內政部移民署核發之入出國日期證明書。\n臺灣地區人民在臺灣地區大學就讀後，依第八條第一項規定，經由學術合作，同時在本部認可名冊內所列之大陸地區高等學校或機構修讀學位者，其申請學歷採認，得免檢具前條第一項第三款第二目之1之大陸地區高等學校或機構畢業證(明)書。\n第  6  條\n大陸地區學歷之採認，依下列規定辦理：\n一、 持大陸地區中等以下各級各類學校學歷之臺灣地區人民或大陸地區人民，除第二款以外，由直轄市、縣(市)主管教育行政機關辦理採認。\n二、 持大陸地區中等學校學歷、高等學校或機構專科學歷擬就讀學士學位，或持大陸地區中等學校學歷擬就讀二專副學士學位之臺灣地區人民或大陸地區人民，由就讀學校辦理查驗後，送本部辦理查證及認定。\n三、 申請來臺灣地區就讀碩士、博士學位，或申請於臺灣地區大專校院依法於境外開設之專班就讀之大陸地區人民，由就讀學校辦理查驗後，送本部辦理查證及認定。\n四、 持大陸地區高等學校或機構學歷之臺灣地區人民或大陸地區人民，除前款以外，由本部辦理採認。\n前項第一款所稱直轄市、縣(市)主管教育行政機關，指申請學歷採認當事人戶籍所在地之主管教育行政機關；無戶籍者，指申請學歷採認當事人擬就讀學校所在地之主管教育行政機關。\n本部辦理第一項第二款及第三款查證、認定及第四款採認，必要時，得委託學校、機關(構)或團體為之。\n第  7  條\n大陸地區學校或機構之修業期間及修習課程，應與臺灣地區同級同類學校規定相當；修業時間指申請人停留於當地學校修業之時間，規定如下：\n一、 持高級中等學校學歷者，累計修業時間應符合大陸地區學制規定。\n二、 持專科學歷者，累計在當地學校修業期間至少應滿十六個月。\n三、 持學士學位者，累計在當地學校修業期間至少應滿三十二個月。\n四、 持碩士學位者，累計在當地學校修業期間至少應滿八個月。\n五、 持博士學位者，累計在當地學校修業期間至少應滿十六個月。\n六、 碩士、博士學位同時修習者，累計在當地學校修業期間至少應滿二十四個月。\n七、 以專科學校畢業學歷或具專科學校畢業同等學力進修學士學位者，累計在當地學校修業期間至少應滿十六個月。\n前項修業時間，應以申請人所持大陸地區學歷之學制、修課期間學校行事曆及入出境紀錄證明等綜合判斷；其所停留期間非屬學校正規學制及行事曆所示修課期間者，不予採計。\n修讀學士學位表現優異者，其修業時間，得衡酌各該大陸地區學校學制之規定及實際情況，就第一項第三款修業時間予以酌減。\n符合特殊教育法所定身心障礙者，其修業時間，得衡酌各該大陸地區學校學制之規定、身心障礙程度及其他實際情況，就第一項各款修業時間予以酌減。\n第  8  條\n經由學術合作，同時在臺灣地區大學及本部認可名冊內所列之大陸地區高等學校或機構修讀學位者，不得全程於臺灣地區大學修業；其修業時間，得累計其停留於各當地大學之修業時間，並應符合下列規定，不適用前條第一項規定。但在二校當地修習學分數，累計應各達獲頒學位所需總學分數之三分之一以上：\n一、 持學士學位者，累計在二校修業時間至少應滿三十二個月。\n二、 持碩士學位者，累計在二校修業時間至少應滿十二個月。\n三、 博士學位者，累計在二校修業時間至少應滿二十四個月。\n申請核發相當學士或碩士學歷證明作為就學用途者，修業時間達前項或前條第一項所定修業時間三分之二以上，且所取得之學歷或學位，符合第九條規定，得檢具臺灣地區大學碩士班或博士班之錄取證明，由錄取學校依本辦法查驗後，向本部提出申請。本部得就申請人所持大陸地區學歷修課期間學校行事曆、入出境紀錄及臺灣地區同級同類學校學制等，綜合判斷是否符合大學入學同等學力後，核發相當學士或碩士學歷證明；該學歷證明以作為升學使用為限。\n申請人入學所持大陸地區學歷，依大陸地區學校規定應跨國或跨香港、澳門修習者，由申請人檢具大陸地區學校證明文件，經學校查驗後，送本部查證及認定。該跨國或跨香港、澳門修習學校符合大學辦理國外學歷採認辦法第四條第一款或香港澳門學歷檢覈及採認辦法第三條之規定者，申請人跨國或跨香港、澳門之修業時間，得併計為第一項或前條第一項所定修業時間。\n第  9  條\n大陸地區高等學校或機構學歷之採認，應以認可名冊內所列者為限；有下列情形之一者，不予採認：\n一、 非經正式入學管道入學。\n二、 採函授方式取得。\n三、 經高等教育自學考試方式通過後入學。\n四、 在分校就讀。\n五、 大學下設獨立學院授予之學歷。\n六、 非正規學制之高等學校。\n七、 醫療法所稱醫事人員相關之學歷。\n八、 學士以上學位未同時取得畢業證(明)書及學位證(明)書。但依第五條第二項規定經由學術合作，同時在臺灣地區大學及本部認可名冊內所列之大陸地區高等學校或機構修讀學位，並取得學位證(明)書者，不在此限。\n九、 各類研習班所取得之修課證書(明)。\n十、 取得博士學位候選人資格而未獲得博士學位，申請採認相當於碩士學位資格。\n十一、 未經註冊入學及修業，僅以論文著作取得博士學位。\n十二、 名(榮)譽博士學位。\n十三、 未經本部核定，在臺灣地區所設分校、分部及學位專班，或委託機構在臺灣地區招生授課取得之學歷。\n十四、 遠距教學課程學分數，超過畢業總學分數之二分之一。\n十五、 其他經本部公告不予採認之情形。\n第  10  條\n經本部採認之大陸地區學歷，不得以該學歷辦理臺灣地區高級中等以下學校師資職前教育課程之審查及教師資格之取得。\n第  11  條\n外國人、香港及澳門居民之大陸地區學歷採認，準用本辦法所定大陸地區人民申請採認之規定。\n第  12  條\n臺灣地區與大陸地區人民自本條例中華民國八十一年九月十八日制定生效後，至九十九年九月三日修正生效前，已於大陸地區高等學校或機構就讀者，其所取得之學歷或學位，符合第七條、第八條所定修業時間及第九條規定，得申請參加本部自行或委託學校、機關(構)或團體辦理之學歷甄試；經甄試通過者，由本部核發相當學歷證明；符合第八條第二項所定修業時間之申請者，該學歷證明以作為升學使用為限。\n前項甄試，得以筆試、口試、論文審查或本部公告之方式辦理。\n申請參加學歷甄試應檢具之文件，準用第四條規定。\n第  13  條\n申請人所提供之各項證件，有偽造、變造、冒用情事者，應予撤銷其學歷之採認，涉及刑事責任者，移送檢察機關依法辦理。\n第  14  條\n本辦法自發布日施行。", "history": "1.中華民國102年4月30日教育部臺教高(五)字第 1020055777C號令修正發布第4、6～8、11條條文。\n\n2.中華民國103年12月26日行政院院臺規字第 1030158355 號公告第5條第1項所列屬「內政部入出國及移民署」之權責事項，自104年1月2日起改由「內政部移民署」管轄。\n\n3.中華民國111年6月16日教育部臺教高(五)字第 1110055851A號令修正發布全文14條；並自發布日施行。"}, {"title": "境外優秀科學技術人才子女來台就學辦法", "content": "第  1  條\n本辦法依科學技術基本法第十七條第三項規定訂定之。\n第  2  條\n本辦法所稱境外優秀科學技術人才，指依中央部會、中央研究院相關規定延攬來臺從事研究、教學或其他科學技術服務，其種類及範圍，符合教育部(以下簡稱本部)會商中央主管科技行政機關及相關機關所認定之人員(以下簡稱科技人才)。\n第  3  條\n科技人才得於應聘來臺三年內，為在臺停留未滿一年之子女申請來臺就讀與其學歷相銜接之各級學校。\n第  4  條\n具本辦法所定申請資格之科技人才子女，如同時符合僑生回國就學及輔導辦法或外國學生來臺就學辦法規定者，應擇一申請入學就讀。\n科技人才為其子女申請就讀科學工業園區雙語學校或雙語部者，應依科學工業園區高級中等以下學校雙語部或雙語學校學生入學辦法規定辦理。\n第  5  條\n科技人才依本辦法申請子女來臺就學者，應檢附下列文件，由服務機關(構)、學校、團體送請其應聘來臺規定所屬之中央部會或中央研究院初審，初審通過者送本部複審，複審通過者由本部轉送各級主管教育行政機關辦理：\n一、 入學申請表(包括志願序)一式二份。\n二、 健康證明書(包括人類免疫缺乏病毒有關檢查)。\n三、 申請人及其子女護照影本、入出國主管機關核發之入出國日期證明書。\n四、 申請人子女最高學歷證明文件及成績單(中、英文以外之語文，應附中文或英文譯本)。\n五、 申請人服務機關(構)、學校、團體之聘函影本或在職證明書。\n六、 申請就讀私立高級中等以下學校者，應附學校同意入學證明。\n七、 其他經中央部會或中央研究院指定之文件。\n申請就讀大學或專科學校二年制者，由本部依申請人提出之志願序，送請各校依其入學審查或甄選等規定辦理。但醫學系、牙醫學系及中醫學系不接受就讀申請。\n申請就讀專科學校五年制、高級中等以下學校者，由各級主管教育行政機關依申請人提出之志願序，送請各校辦理。\n申請就讀幼兒園者，其屬公立幼兒園，應依各直轄市、縣(市)政府公立幼兒園優先入園相關規定辦理。\n第一項第四款所定最高學歷證明文件，其為外國學歷者，應依大學辦理國外學歷採認辦法規定辦理；其為大陸學歷者，應依大陸地區學歷採認辦法規定辦理。\n第  6  條\n科技人才子女依本辦法申請分發就學，以一次為限。但科技人才因服務機關(構)、學校、團體之指派變更工作地點時，得為其就讀專科學校五年制前三年、高級中等以下學校及幼兒園之子女申請分發轉學。\n前項轉學之申請應由科技人才檢具下列文件，由服務機關(構)、學校、團體轉陳其應聘來臺規定所屬之中央部會或中央研究院加具審查意見後，逕向各級主管教育行政機關辦理：\n一、 原核定分發就學文件。\n二、 申請人子女現就讀學校成績單。\n三、 申請人變更工作地點之證明文件。\n第  7  條\n科技人才子女依本辦法來臺就學，於完成申請就讀學校學程後，如繼續在臺升學，其入學方式應與國內一般學生相同；其參加高級中等以上學校新生入學，除博士班、碩士班、學士後各系、醫學系、牙醫學系、中醫學系招生不予優待外，依下列規定辦理；其入學各校之名額採外加方式辦理，不占各級主管教育行政機關原核定各校(系、科)招生名額：\n一、 高級中等學校、專科學校五年制：\n(一) 來臺就讀未滿一學年者：\n1. 參加免試入學者，其超額比序總積分加百分之二十五計算。\n2. 參加特色招生入學者，依其採計成績，以加總分百分之二十五計算。\n(二) 來臺就讀一學年以上未滿二學年者：\n1. 參加免試入學者，其超額比序總積分加百分之十五計算。\n2. 參加特色招生入學者，依其採計成績，以加總分百分之十五計算。\n(三) 來臺就讀二學年以上未滿三學年者：\n1. 參加免試入學者，其超額比序總積分加百分之十計算。\n2. 參加特色招生入學者，依其採計成績，以加總分百分之十計算。\n二、 技術校院四年制、二年制或專科學校二年制：\n(一) 來臺就讀未滿一學年者：\n1. 參加登記分發入學者，以加總分百分之二十五計算。\n2. 參加登記分發入學以外之其他方式入學者，由各校酌予考量優待。\n(二) 來臺就讀一學年以上，未滿二學年者：\n1. 參加登記分發入學者，以加總分百分之十五計算。\n2. 參加登記分發入學以外之其他方式入學者，由各校酌予考量優待。\n(三) 來臺就讀二學年以上，未滿三學年者：\n1. 參加登記分發入學者，以加總分百分之十計算。\n2. 參加登記分發入學以外之其他方式入學者，由各校酌予考量優待。\n三、 大學：\n(一) 來臺就讀未滿一學年者：\n1. 參加考試分發入學者，依其採計考試科目成績，以加原始總分百分之二十五計算。\n2. 參加考試分發入學以外之其他方式入學者，由各校酌予考量優待。\n(二) 來臺就讀一學年以上，未滿二學年者：\n1. 參加考試分發入學者，依其採計考試科目成績，以加原始總分百分之十五計算。\n2. 參加考試分發入學以外之其他方式入學者，由各校酌予考量優待。\n(三) 來臺就讀二學年以上，未滿三學年者：\n1. 參加考試分發入學者，依其採計考試科目成績，以加原始總分百分之十計算。\n2. 參加考試分發入學以外之其他方式入學者，由各校酌予考量優待。\n前項第一款各目之 1 總積分經加分優待後進行比序；第一款各目之 2、第二款及第三款經加分優待後分數應達錄取標準。\n第一項所定外加名額，以各校(系、科)原核定招生名額外加百分之二計算，其計算遇小數點時，採無條件進位法，取整數計算。但成績總分或總積分經加分優待後相同，如訂有分項比序或同分參酌時，經比序或同分參酌至最後一項結果均相同者，增額錄取，不受百分之二限制。\n第一項優待，於大陸地區優秀科技人才之子女，不適用之。\n第  8  條\n各級學校對依本辦法入學之學生，應提供適切之輔導，以利其學習適應。\n第  9  條\n本辦法所定書表格式，由本部定之。\n第  10  條\n第七條規定，適用於一百零三學年度以後入學之學生。\n第  11  條\n本辦法自一百零二年九月一日施行。", "history": "1.中華民國94年6月28日教育部台參字第 0940083118C號令訂定發布全文10條；並自發布日施行。\n\n2.中華民國100年1月26日教育部臺參字第 1000006004C號令修正發布第7條條文。\n\n3.中華民國102年8月26日教育部臺教授國部字第1020079858A號令修正發布全文 11 條；並自102年9月1日施行。"}, {"title": "離島地區學生保送高級中等以上學校辦法", "content": "第  1  條\n本辦法依離島建設條例第十七條第二項規定訂定之。\n第  2  條\n本辦法所稱離島地區，包括澎湖縣、金門縣(含烏坵鄉)、連江縣、臺東縣綠島鄉、蘭嶼鄉及屏東縣琉球鄉。\n第  3  條\n本辦法適用對象，指離島地區內國民中學或其附設補習學校、高級中等學校、五年制、二年制專科學校或其進修部之應屆畢業學生。\n前項學生申請保送，應設籍離島地區累計達九年以上，並應符合下列之規定。但經離島地區所屬縣政府審認設籍九年確有困難，並於離島地區就學期間累計達九年以上，得不受設籍九年以上規定之限制：\n一、 申請保送高級中等學校或五年制專科學校者，應於離島地區接受並完成國民中小學或其附設補習學校之教育，並取得各學期成績。\n二、 申請保送大學校院者，應於離島地區接受並完成國民中學或其附設補習學校及高級中等學校、五年制、二年制專科學校或其進修部之教育，並取得各學期成績。\n前項第二款之規定，於未設置高級中等學校、五年制、二年制專科學校或其進修部之離島地區，得以就讀該離島地區所屬縣之高級中等學校、五年制、二年制專科學校或其進修部代之。\n申請保送設籍時間以戶口名簿(包括詳細記事)或三個月內申請之其他戶籍資料證明文件(包括詳細記事)登記者為準。\n第  4  條\n離島地區學生申請保送高級中等以上學校之類別如下：\n一、 國民中學及附設補習學校應屆畢業生，以申請保送縣境內高級中等學校為限，或得申請保送五年制專科學校。\n二、 高級中等學校、五年制及二年制專科學校及其進修部應屆畢業生，得申請保送大學校院。\n第  5  條\n離島地區所屬縣政府為地方建設需要，應訂定各階段別、類(科)別人才培養保送計畫、保送名額，於每年八月三十一日前分別報請擬保送學校之該管教育行政機關核定。\n第  6  條\n離島地區學生合於本辦法及招生簡章規定者，由就讀學校彙整保送申請表、家長(或監護人)同意書、戶口名簿(包括詳細記事)或三個月內申請之其他戶籍資料證明文件(包括詳細記事)、歷年成績單及學籍異動等文件，於每年十二月三十一日前造具名冊，報請該離島地區所屬縣政府核轉各擬保送學校之主管教育行政機關。\n前項保送名冊，經該主管教育行政機關審查後，送請擬保送學校辦理甄試。\n第  7  條\n高級中等以上學校受理各離島地區學生申請保送事宜，應設立保送甄試委員會或納入招生委員會辦理，必要時得設立聯合保送甄試委員會辦理甄試作業。\n辦理招生作業時，應將甄試時間、地點、資格、錄取名額及類科別、成績計算標準、保送學生權利義務等事項明訂於招生簡章。\n第  8  條\n離島地區學生申請保送，經甄試未達錄取標準者，保送甄試委員會得不足額錄取；經公告錄取後，參加其他方式入學者，應廢止其保送入學資格。\n前項離島地區學生依本辦法或其他中央目的事業主管機關訂定之規定，申請保送經公告錄取者，不得依本辦法或該規定再申請保送。\n第  9  條\n高級中等以上學校辦理本項保送，其招生名額採外加方式，不占各級主管教育行政機關原核定各校(系、科)招生名額。\n第  10  條\n依本辦法申請保送升學之離島地區學生，依學校規定註冊入學後，不得申請轉校(系、科)。但有特殊情況，報經原保送之離島地區所屬縣政府同意者，不在此限。\n第  11  條\n依本辦法申請保送升學之離島地區學生，經發現其有假冒戶籍或資格不符者，應撤銷其保送入學資格。\n第  12  條\n(刪除)\n第  13  條\n本辦法自中華民國九十二年一月一日施行。\n本辦法修正條文，自發布日施行。", "history": "1.中華民國91年11月7日教育部台(91)參字第 91169253 號令訂定發布全文13條；並自92年1月1日施行。\n\n2.中華民國92年10月2日教育部台參字第0920143620A號令修正發布第3、12條條文。\n\n3.中華民國92年12月30日教育部台參字第0920193822A號令修正發布第12條條文。\n\n4.中華民國98年10月14日教育部台參字第0980167320C號令修正發布名稱及第2、13條條文；並自發布日施行(原名稱：澎湖金門及馬祖地區學生保送高級中等以上學校辦法；新名稱：離島地區學生保送高級中等以上學校辦法)。\n\n5.中華民國101年7月9日教育部臺參字第1010123075C號令修正發布第8、13條條文；並自發布日施行。\n\n6.中華民國102年1月29日教育部臺教授國部字第1020108651B  號令修正發布第8條條文。\n\n7.中華民國105年10月24日教育部臺教授國部字第 1050098599B號令修正發布第3、6條條文。\n\n8.中華民國110年7月6日教育部臺教授國部字第1100070730B號令 修正發布第3、4、6、10條條文；刪除第12 條條文。"}, {"title": "科學園區高級中等以下學校雙語部或雙語學校學生入學辦法", "content": "第 1 條\n本辦法依科學園區設置管理條例(以下簡稱本條例)第十條第二項規定訂定之。\n第 2 條\n本辦法所定園區駐區單位如下：\n一、 本條例第五條之園區事業、研究機構、創業育成中心及其進駐對象，其中園區事業須為完成公司登記、有限合夥登記或其他商業登記者。\n二、 科技部駐區附屬單位。\n三、 科學園區高級中等以下學校及幼兒園(以下簡稱園區學校)。\n本辦法所稱外籍員工，指非中華民國國籍者。\n第  3  條\n申請就讀園區學校雙語部或雙語學校之學生入學資格，應符合下列條件之一：\n一、 園區駐區單位員工之子女符合下列條件之一者：\n(一) 園區駐區單位應聘回國之本國籍員工，其子女隨同在國外連續居留二年以上且回國未滿一年。\n(二) 園區駐區單位未具中華民國國籍之外籍員工之子女。\n(三) 園區駐區單位派赴至國外工作人員，其子女隨同在國外連續居留二年以上且回國未滿一年。\n二、 符合派赴國外工作人員子女返國入學辦法之規定，經教育部分發者。\n三、 非園區駐區單位員工之子女符合下列條件之一者：\n(一) 公立或已立案之私立大專院校、學術研究機構或公民營高科技事業單位應聘回國之本國籍員工，服務單位或戶籍設於園區所在之直轄市、縣(市)，其子女隨同在國外連續居留二年以上且回國未滿一年。\n(二) 設於園區所在直轄市、縣(市)之公立或已立案之私立大專院校、學術研究機構之未具中華民國國籍之外籍員工之子女。\n(三) 依外國專業人才延攬及僱用法聘僱之具科技領域特殊專長外國特定專業人才、境外優秀科學技術人才子女來臺就學辦法第二條所定境外優秀科學技術人才，或依科技部延攬海外人才相關政策歸國或延攬之外國科技人才之子女；其屬具中華民國國籍員工之子女者，應隨同在國外連續居留二年以上且入境未滿一年。\n四、 現就讀園區學校雙語部或雙語學校之學生，其弟妹在國內連續居留未滿五年者。\n前項第一款第一目及第三款之員工，應符合下列條件之一：\n一、 具有國內、外大學博士學位。\n二、 具有國內、外大學碩士學位，並有五年以上國外大學、學術研究機構或高科技事業單位工作經驗。\n符合第一項第一款第一目、第三目或第三款第一目之資格者，於應聘回國或回國服務三年內提出申請。\n符合第一項第一款或第四款之資格者，得選擇任一園區學校雙語部或雙語學校申請就讀。\n符合第一項之資格者，園區學校得視實際需要舉辦語文測驗，經測驗及格者始得錄取。\n第  4  條\n學生報名人數超出錄取名額時，依前條第一項第一款至第四款次序優先錄取。\n前條第一項第一款報名人數超出錄取名額時，依下列次序錄取：\n一、優先錄取該園區駐區單位員工子女，並依下列次序優先錄取：\n(一) 取得國內、外高科技相關系所博士學位，且在國外高科技相關單位服務三年以上者。\n(二) 取得國內、外高科技相關系所碩士學位，且在國外高科技相關單位服務五年以上者。\n(三) 未符合前二目資格者。\n二、優先錄取該園區駐區單位員工子女後，仍有名額時，由其他園區駐區單位員工子女，比照前款各目次序錄取。\n前項各款、目次序或前條第一項第二款至第四款之同一次序人數超出錄取名額時，以抽籤方式錄取。\n第  5  條\n園區學校雙語部或雙語學校，依第三條規定招生之各年級錄取人數未達核定招生名額百分之八十時，其缺額得由符合下列條件之一者，依各款次序優先錄取，遞補至百分之八十為止：\n一、 園區駐區單位員工之子女符合下列條件之一者：\n(一) 園區駐區單位應聘回國之本國籍員工，其子女隨同在國外連續居留一年以上，且回國未滿八年。\n(二) 園區駐區單位派赴至國外工作人員，其子女隨同在國外連續居留一年以上，且回國未滿八年。\n二、 非園區駐區單位員工之子女：公立或已立案之私立大專院校、學術研究機構或公民營高科技事業單位應聘回國之本國籍員工，服務單位或戶籍設於園區所在之直轄市、縣(市)，其子女隨同在國外連續居留一年以上，且回國未滿八年。\n三、 現就讀園區學校雙語部或雙語學校學生之弟妹。\n四、 依外國專業人才延攬及僱用法聘僱之外國特定專業人才之子女。\n五、 居留地設於園區所在地之直轄市、縣(市)之未具中華民國國籍之外籍人士之子女。\n前項第一款第一目之員工，應具有國內、外博士學位，或具有國內、外碩士學位，並有二年以上國外工作經驗；第二款之員工，應符合第三條第二項規定。\n符合第一項之資格者，園區學校得視實際需要舉辦語文測驗，經測驗及格者始得錄取。\n第一項第一款人數超出錄取名額時，依前條第二項規定次序優先錄取；其各次序或第一項第二款至第五款之同一次序人數超出錄取名額時，以抽籤方式錄取。\n依第一項第四款、第五款入學者，其學雜費由園區學校訂定，並於每學年度開始前按程序報主管機關核定之。\n依本條入學之學生申請轉學至其他園區雙語學校就讀時，其入學資格應經申請轉入學校依本辦法規定重新審查，並適用前五項規定。但第一項第一款、第二款所定子女隨同在國外連續居留及回國之期間，依入學當時情形認定。\n第一項第一款之員工因職務調動或其他特殊因素，致其子女難以隨同在國外連續居留一年以上，經該園區管理局個案審查同意者，得不受連續居留之限制。\n第  6  條\n依本辦法申請入學者，除政府派赴國外工作人員子女返國入學辦法另有規定者外，應由學生家長填具申請書，並檢附下列文件向園區學校雙語部或雙語學校為之：\n一、 申請人歷次出入境日期證明書一份。\n二、 子女歷次出入境日期證明書一份。\n三、 子女最近二年之成績單或就學證明文件影本一份。\n四、 申請人服務單位聘函或在職證明書影本一份。\n五、 申請人學經歷證件、戶口名簿或其他相關證明文件影本各一份。\n第  7  條\n前條申請文件有虛偽不實情事者，不予受理，已入學者，撤銷其入學資格。\n第  8  條\n本辦法各項入學招生作業、申請書格式、受理申請時間及入學測驗等事項，由園區學校另定之。\n第  9  條\n本辦法自發布日施行。", "history": "1.中華民國92年1月22日教育部台參字第 091201858號令、行政院國家科學委員會臺會協字第 0920000917-2 號令會銜訂定發布全文8條；並自發布日施行。\n\n2.中華民國96年5月18日教育部台參字第 0960074431C號令、行政院國家科學委員會臺會協字第 0960028978 號令會銜修正發布第3條條文。\n\n3.中華民國97年9月22日教育部台參字第 0970169094C號令、行政院國家科學委員會臺會協字第 0970057041 之2號令會銜修正發布第 8  條條文；增訂第 4-1  條條文；並自97年8月1日施行。\n\n4.中華民國100年2月9日教育部臺參字第 0990231696C號令、行政院國家科學委員會臺會協字第 1000004567B號令會銜修正發布第 3、4-1 條條文；並自99年12月25日施行。\n\n5.中華民國101年3月3日教育部臺參字第 1010015808C號令、行政院國家科學委員會臺會協字第 1010008513B號令會銜修正發布第4-1 條條文；並自101年1月1日施行中華民國103年2月27日行政院院臺規字第1030125872號公告第2條第1項第2款所列屬「行政院國家科學委員會」之權責事項，自103年3月3日起改由「科技部」管轄。\n\n6.中華民國103年7月10日教育部臺教授國部字第1030051752B號令、科技部科部產字第 1030043011B號令會銜修正發布第2條條文。\n\n7.中華民國106年1月19日教育部臺教授國部字第1050136014B號令、科技部科部產字第1050097842B號令會銜修正發布第 4-1條條文；第1項、第4項及第5項自105年8月1日施行。\n\n8.中華民國106年12月4日教育部臺教授國部字第1060103248B號令、科技部科部產字第 1061001068B號令會銜修正發布第3條條文。\n\n9.中華民國108年1月24日教育部臺教授國部字第1070143864B號令、科技部科部產字第 1070087197B號令會銜修正發布名稱及第1、2條條文(原名稱：科學工業園區高級中等以下學校雙語部或雙語學校學生入學辦法；新名稱：科學園區高級中等以下學校雙語部或雙語學校學生入學辦法)。\n\n10.中華民國108年6月12日教育部臺教授國部字第 1080050141B號令、科技部科部產字第 1080031617B號令會銜修正發布第 4-1條條文。\n\n11.中華民國111年7月13日教育部臺教授國部字第1110072820A號令、科部產字第1110037193B號令修正發布。"}, {"title": "重大災害地區學生升學優待辦法", "content": "第  1  條\n本辦法依大學法第二十五條第三項、專科學校法第三十二條第一項及高級中等教育法第四十一條第一項規定訂定之。\n第  2  條\n學校因地區發生重大災害致嚴重影響正常運作，妨礙學校上課、學生學習，且無法透過教育措施改善，經直轄市、縣(市)政府認定足以影響當學年度升學公平性者，由各該政府檢齊相關評估資料，報中央主管教育行政機關召集相關機關、學者專家及學校代表審查後，核定其重大災害情形、地區範圍、優待方式及優待期限，並由直轄市、縣(市)政府據以核發受災情形證明文件。\n前項所定重大災害，並包括重大傳染疾病。\n第一項所定評估資料，應包括重大災害情形、地區範圍、影響學生人數、已進行之教育改善措施及成效、影響學生升學公平性分析、建議優待方式及優待期限等。\n第  3  條\n重大災害地區學生參加高級中等以上學校新生入學，除博士班、碩士班與學士後各學系招生不予優待，及報考轉學考試不予優待外，其優待方式得以外加名額、增加總分、放寬申請條件或專案辦理招生等方式為之。\n第  4  條\n前條優待方式之訂定，應依下列規定辦理：\n一、 高級中等學校或專科學校五年制：由中央主管教育行政機關會商相關機關、學者專家及學校代表後定之。\n二、 技術校院四年制、二年制或專科學校二年制：由技專校院招生策進總會會商相關機關、學者專家及學校代表後定之。\n三、 大學：由大學招生委員會聯合會會商相關機關、學者專家及學校代表後定之。\n前項優待方式採外加名額者，以各校招生核定各該學制總名額外加百分之一為原則；其依第二款或第三款規定辦理者，應報中央主管教育行政機關備查。\n第  5  條\n符合第二條規定之重大災害地區學生，參加高級中等以上學校新生入學，除依招生一般規定外，應於規定時間繳交規定之受災情形證明文件，作為報名資格審查及升學優待之依據。\n重大災害地區學生參加高級中等以上學校新生入學，如未以重大災害地區學生身分報名或未繳交前項規定之證件者，不得享受本辦法之升學優待。\n第  6  條\n具中華民國國籍學生於境外就學學校所在地區發生重大災害，且該重大災害存續期間，足以妨礙學校上課、學生學習者，由中央主管教育行政機關會商相關中央目的事業主管機關評估後，核定其重大災害情形、地區範圍、返國就學優待方式及優待期限。\n前項所定重大災害，並包括重大傳染疾病及戰亂。\n第一項學生境外就學學校，應符合境外學歷相關採認規定。\n符合前三項規定之學生申請返國就學，依下列規定辦理：\n一、 優待方式，依第三條、第四條規定辦理。\n二、 每位學生申請系(科)數，以三系(科)為限；其申請大學之學系，以師資培育、醫學、中醫及牙醫以外之其他學系為限。\n三、 經中央主管教育行政機關資格審查符合者，依入學申請表所載擬就讀學校志願，申請高級中等學校或專科學校者，依其免試入學就學區規定辦理；申請大學校院者，送請各大學校院以筆試、口試、面試或書面審查等方式進行甄選，並由中央主管教育行政機關依各校甄選結果及學生志願序，以外加名額方式核定分發。\n第  7  條\n各招生單位於公告錄取名單後，應將重大災害地區學生報考及錄取人數編製統計表報請主管教育行政機關備查。\n第  8  條\n依本辦法升學之學生，如發現所繳受災情形證明文件有偽造、假借、塗改等情事，應撤銷錄取資格；已註冊入學者，撤銷其學籍，且不發給任何相關學業證明；如畢業後始發現者，應由學校撤銷其畢業資格並繳銷其學位證書。\n第  9  條\n第三條至第五條規定，適用於一百零三學年度以後入學之學生。\n第  10  條\n本辦法自中華民國一百零二年九月一日施行。\n本辦法修正條文，自發布日施行。", "history": "1.中華民國94年8月11日教育部台參字第0940105606C號令訂定發布全文8條；並自發布日施行。\n\n2.中華民國95年7月26日教育部台參字第0950107396C號令修正發布第1條條文。\n\n3.中華民國102年4月12日教育部臺教高(四)字第1020049029C號令修正發布全文9條；並自發布日施行。\n\n4.中華民國102年8月15日教育部臺教高(四)字第 1020120156A號令修正發布全文10條；並自102年9月1日施行。\n\n5.中華民國103年12月19日教育部臺教高(四)字第1030181904B號令修正發布第1、10條條文；並自發布日施行。"}, {"title": "參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升學優待辦法", "content": "第　一　條\n本辦法依大學法第二十五條第三項、專科學校法第三十二條第一項及高級中等教育法第四十一條第一項規定訂定之。\n第　二　條\n本辦法用詞，定義如下：\n一、國際數理學科奧林匹亞競賽，指下列競賽：\n（一）國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽。\n（二）亞太數學及亞洲物理奧林匹亞競賽。\n（三）國際國中科學奧林匹亞競賽。\n（四）歐洲女子數學奧林匹亞競賽。\n（五）其他經教育部（以下簡稱本部）認定之國際數理學科奧林匹亞競賽。\n二、國際科學展覽：指由國立臺灣科學教育館選派參加之美國國際科技展覽會（International Science and Engineering Fair, ISEF）及其他經本部認定之國際科學展覽。\n三、升學優待：指以名額外加方式，保送或推薦升學。\n四、高級中等教育階段學生：指高級中等學校學生及參與高級中等教育階段非學校型態實驗教育未取得學籍學生。\n五、大學：指大學、科技大學或技術學院四年制。\n六、各本學系：指與參賽項目相同之各本學系。\n第　三　條\n高級中等教育階段學生代表我國參加國際數理學科奧林匹亞競賽成績優良，且符合入學規定者，得依下列規定申請依其志願保送或推薦升入大學就讀：\n一、獲得國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽金牌獎者，保送大學各本學系或理、工、醫、農、生命科學、電機及資訊等相關學院各學系，或推薦入大學各學系。\n二、獲得國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽銀牌獎者，保送大學各本學系或理、工、農、生命科學、電機及資訊等相關學院各學系，或推薦入大學各學系。\n三、獲得國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽銅牌獎、榮譽獎、亞太數學奧林匹亞競賽金牌獎、歐哈囉蘭（O'Halloran）獎、銀牌獎、銅牌獎或亞洲物理、歐洲女子數學奧林匹亞競賽金牌獎、銀牌獎、銅牌獎者，保送大學各本學系，或推薦入大學各學系。\n四、獲得亞太數學、亞洲物理或歐洲女子數學奧林匹亞競賽榮譽獎，或參加國際數理學科奧林匹亞競賽選訓決賽完成結訓並獲選訓工作委員會推薦（名額以前百分之五十為原則）者，推薦入大學各本學系。\n第　四　條\n高級中等教育階段學生代表我國參加國際科學展覽成績優良，且符合入學規定者，得依下列規定申請依其志願保送或推薦升入大學就讀：\n一、獲得美國國際科技展覽會大會一等獎者，保送大學各本學系或理、工、醫、農、生命科學、電機及資訊等相關學院各學系，或推薦入大學各學系。\n二、獲得美國國際科技展覽會大會二等獎者，保送大學各本學系或理、工、農、生命科學、電機及資訊等相關學院各學系，或推薦入大學各學系。\n三、獲得美國國際科技展覽會大會三等或四等獎者，保送大學各本學系，或推薦入大學各學系。\n四、獲選參加國際科學展覽正選代表者，推薦入大學各本學系。\n第　五　條\n高級中等教育階段學生有下列情形之一，且符合入學規定者，得申請依其志願保送專科學校二年制就讀：\n一、參加亞太數學奧林匹亞競賽或歐洲女子數學奧林匹亞競賽獲獎。\n二、參加前款以外之國際數理學科奧林匹亞競賽選訓決賽完成結訓。\n三、獲選國際科學展覽正選代表。\n第　六　條\n國民中學學生有下列情形之一，且符合入學規定者，得申請依其志願保送高級中等學校或專科學校五年制就讀：\n一、參加亞太數學奧林匹亞競賽或歐洲女子數學奧林匹亞競賽獲獎。\n二、參加前款以外之國際數理學科奧林匹亞競賽選訓決賽完成結訓。\n三、獲選國際科學展覽正選代表。\n第　七　條\n符合前四條規定而申請升學優待之應屆畢業生，應於符合資格後二個月內，檢具畢業證（明）書影本或完成高級中等教育階段實驗教育證明影本、獲獎或相關證明文件影本及歷年成績單正本，依下列規定辦理：\n一、國際數理學科奧林匹亞競賽：\n(一)高級中等學校及國民中學學生，由其就讀學校報請本部辦理。\n(二)參與高級中等教育階段非學校型態實驗教育未取得學籍學生，由直轄市、縣（市）主管機關報請本部辦理。\n二、國際科學展覽：\n(一)高級中等學校及國民中學學生，由其就讀學校送請國內主辦單位核轉本部辦理。\n（二）參與高級中等教育階段非學校型態實驗教育未取得學籍學生，由直轄市、縣（市）主管機關送請國內主辦單位核轉本部辦理。\n學生於非屬畢業之學年度符合前四條規定者，其申請升學優待，應於畢業當學年度第一學期開學後二個月內，依前項規定辦理。\n前二項應檢具之畢業證（明）書，於學生未畢業前，以在學證明書代之；參與高級中等教育階段非學校型態實驗教育未取得學籍學生，以直轄市、縣（市）主管機關發給學生身分證明代之。\n學生依前四條及前三項規定申請升學優待時，應就其升學之志願予以排序；其提出申請時，同時符合二種以上申請資格者，應將其依不同資格而申請之升學志願予以排序；經向本部申請後，不得申請變更、增補志願或變更其排序；其經二個以上志願學校錄取者，以排序在前之學校優先錄取。\n經本部審查符合保送升學規定之學生，除申請保送大學醫學系及牙醫學系者，各大學得另定規定予以審查外，學校應予接受。\n第　八　條\n參加國際數理學科奧林匹亞競賽成績優良之學生，得由本部依下列規定發給獎學金：\n一、獲得國際數理學科奧林匹亞競賽（不包括亞太數學、亞洲物理、歐洲女子數學奧林匹亞競賽）金牌獎者，新臺幣二十萬元。\n二、獲得國際數理學科奧林匹亞競賽（不包括亞太數學、亞洲物理、歐洲女子數學奧林匹亞競賽）銀牌獎、亞太數學奧林匹亞競賽金牌獎、歐哈囉蘭（O'Halloran）獎、亞洲物理、歐洲女子數學奧林匹亞競賽金牌獎者，新臺幣十萬元。\n三、獲得國際數理學科奧林匹亞競賽（不包括亞太數學、亞洲物理、歐洲女子數學奧林匹亞競賽）銅牌獎、榮譽獎、亞太數學奧林匹亞競賽銀牌獎、亞洲物理、歐洲女子數學奧林匹亞競賽銀牌獎者，新臺幣五萬元。\n同一年度獲得同一學科或不同學科二種以上獎項者，應擇優以最高獲獎獎額辦理之。\n第　九　條\n參加國際科學展覽成績優良之學生，得由本部依下列規定發給獎學金：\n一、獲得美國國際科技展覽會大會一等獎者，新臺幣二十萬元。\n二、獲得美國國際科技展覽會大會二等獎者，新臺幣十萬元。\n三、獲得美國國際科技展覽會大會三等或四等獎者，新臺幣五萬元。\n第　十　條\n高級中等教育階段學生代表我國參加國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽，獲得該科競賽金牌獎項排名前百分之五十或參加美國國際科技展覽會獲得大會一等獎，其後並取得本部所認定國外頂尖大學數理系所入學許可者，得向本部申請出國留學獎學金；於同一學制重複就讀之年級或畢業後再考入相同學制就讀者，均不再補助。\n前項金牌獎項排名前百分之五十之計算遇小數點時，採無條件進位法，取整數計算。\n第一項申請出國留學獎學金之學生，應分別於就讀學士、碩士、博士階段前一教育階段畢業後一年內，檢附下列文件提出申請：\n一、申請書。\n二、具中華民國國籍且在臺灣地區設有戶籍之文件。\n三、獲獎或相關證明文件影本。\n四、本部所認定國外頂尖大學數理系所（不包括大陸與港澳地區）入學許可證明影本。\n學生申請出國留學獎學金經本部審查通過者，依申請留學國別發給不同額度之出國留學獎學金。\n經本部審核通過發給出國留學獎學金之學生，應與本部簽訂契約；其內容應包括獎學金金額、給與期間與回饋條件、終止或償還獎學金原因及其他權利義務事項。\n本部應設專責小組，長期輔導前項至國外留學之學生，查核其學習情形，並提供必要之服務。\n第 十一 條\n高級中等教育階段學生代表我國參加國際數學、物理、化學、生物、地球科學及資訊奧林匹亞競賽、亞太數學、亞洲物理、歐洲女子數學奧林匹亞競賽及美國國際科技展覽會，符合第八條第一項或第九條者，於其就讀國內大學數理相關學系學士學位期間，依下列規定予以獎勵及補助：\n一、每學年度名列該學系該年級前三名者，每一學年發給新臺幣十二萬元之獎學金。\n二、出席國際學術會議並發表論文者，依下列規定補助：\n（一）來回經濟艙機票、生活費及註冊費，每年以一次為限。\n（二）論文為合著者，每一論文，以補助一人為限。\n（三）學生為重度身心障礙者，補助隨行看護人員一人之來回經濟艙機票。\n前項第一款獎學金，應由學生就讀學校於每學年度結束後二個月內，檢具\n學生請領清冊及領據報本部申請該學年度獎學金；其發給期間，不包括轉學後就學及延長修業之期間。\n獲第一項第二款補助之學生，應於回國後，依法令規定之期限，繳交出席國際學術會議報告；違反者，本部不受理其嗣後出席國際學術會議補助之申請。\n第 十二 條\n申請本辦法獎勵或補助之文件、資料有虛偽不實者，本部得撤銷請領資格；已撥款者，由本部以書面行政處分通知受領人限期返還。\n獲第十條第一項及前條第一項第二款補助之學生，除法令另有規定外，不得重複請領我國政府其他相關補助或與補助性質相當之給付。經查證確有重複請領事實者，本部得撤銷請領資格；已撥款者，由本部以書面行政處分通知受領人限期返還。\n第 十三 條\n獲本辦法升學優待或獎學金者，應協助本部辦理經驗分享活動、國家代表隊培訓、教材研發及配合人才資料長期追蹤等推廣科學教育相關事項。\n第 十四 條\n本部為協調及審議學生參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良之升學優待及發給獎學金事宜，得組成委員會；其組成方式、審查程序及審查基準，由本部定之。\n第 十五 條\n各接受保送或推薦升學之學校，應對保送或推薦升學之學生定期辦理追蹤輔導。\n第 十六 條\n本辦法所定書表格式，由本部定之。\n第 十七 條\n本辦法中華民國一百十一年十月二十八日修正發布之第十一條第一項第一款規定，適用於一百十二學年度以後入學大學之學生。\n第十七條之一\n本辦法中華民國一百十三年七月三十一日修正發布之第三條、第八條、第十一條施行前，已獲得歐洲女子數學奧林匹亞競賽獎項，尚未申請升學優待或未予以獎學金、獎勵、補助者，適用修正施行後之規定；其申請升學優待之應屆畢業生，應於修正施行之日起一個月內，依第七條規定辦理。\n本辦法中華民國一百十三年七月三十一日修正發布之第五條、第六條施行前，已參加亞太數學奧林匹亞競賽或歐洲女子數學奧林匹亞競賽獲獎，尚未申請就讀者，適用修正施行後之規定。\n第 十八 條\n本辦法自中華民國一百十二年一月一日施行。本辦法修正條文，自發布日施行。", "history": "1.中華民國93年4月23日教育部台參字第 0930055017A號令訂定發布全文14條；並自發布日施行。\n\n2.中華民國93年10月238日教育部台參字第0930140729A號令修正發布第2、7～9  條條文。\n\n3.中華民國94年5月9日教育部台參字第 0940058898C號令增訂發布第9-1條條文。\n\n4.中華民國95年8月21日教育部台參字第 0950120480C號令修正發布第1、9-1 條條文。\n\n5.中華民國97年3月26日教育部台參字第 0970035497C號令修正發布第2、3、9-1  條條文；增訂第 9-2、9-3條條文；除第9-1、9-2條條文自96年7月1日施行；其餘自發布日施行。\n\n6.中華民國102年8月23日教育部臺教授國部字第 1020079943B號令修正發布第1、2、9-1、14條條文；增訂第 13-1條條文；並自102年9月1日施行。\n\n7.中華民國104年1月28日教育部臺教授國部字第 1030151063B號令修正發布第1條條文。\n\n8.中華民國105年10月11日教育部臺教授國部字第 1050103122B號令修正發布第2條條文。\n9. 中華民國107年11月5日教育部臺教授國部字第 1070121395B號令修正發布第9-2條條文。\n10. 中華民國一百十一年十月二十八日教育部臺教授國部字第 1110142115A 號令修正\n11. 中華民國113年07月31日教育部臺教授國部字第 1135403161A 號令修正「參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升學優待辦法」部分條文\n12. 中華民國114年8月29日教育部臺教授國部字第1145404909A號令修正第7條。"}, {"title": "高級中等學校建教合作招生作業要點", "content": "一、 教育部為推動十二年國民基本教育，協助國中學生適性發展，輔導其就讀建教合作班，特訂定本要點。\n二、 建教合作班招生對象為公私立國民中學(包括高中附設國中部、完全中學國中部)畢(結)業生或具同等學力者。\n三、 建教合作班招生因課程、教學和實習之特殊性，其招生對象不受免試就學區規定之限制。\n四、 學校辦理建教合作班應成立招生委員會，擬訂招生簡章、報名作業、評選方式、招生名額、錄取名單、工作檢討與相關注意事項，並處理申訴及緊急事件等工作。\n五、 前項委員會置委員七人至十三人，由學校校長、處室或科主任、組長、家長代表及建教合作機構代表等組成；其中一人為主任委員，由校長擔任之；並置總幹事一人，由主任委員指派之，辦理招生各項工作。\n六、 學校辦理建教合作班應本公開、公正和公平之原則自行招生，並依各主管機關核定招收科班及名額進行招生工作；招生簡章應詳列招生科班、名額及建教合作辦理模式等項目，經各主管機關核准後辦理。\n七、 學校辦理建教合作班招生以免試為之。但為實習職場之適應，得辦理面談、口試、實作或由學校訂定評選方式，並不得採計國民中學學生在校學習領域評量成績。因實習職場之特殊性，得不足額錄取。\n八、 學校辦理建教合作班招生，以每年六月三十日前完成為原則。\n九、 本要點未盡事宜，悉依相關法令規定辦理。", "history": "中華民國101年4月30日教育部部授教中(三)字第 1010506771B號令訂定發布全文8點，並自103學年度起入學高級中等學校學生適用之。"}, {"title": "高級中等學校學籍管理辦法", "content": "第  1  條\n本辦法依高級中等教育法(以下簡稱本法)第四十七條第一項規定訂定之。\n第  2  條\n高級中等學校(以下簡稱學校)新生應檢具本法第三十四條所定國民中學畢業或具同等學力證明文件正本，依學校所定時間報到註冊後，取得學籍。\n學校應依各該主管機關之規定編班、編列學號、建立學籍及核發學生證等有關證明文件。\n學校於學生修業期間，應依學生學籍表冊之格式及內容建立詳細資料；學生學籍表冊之範圍如下：\n一、 學生學籍表。\n二、 新生名冊。\n三、 學生學籍異動名冊。\n四、 轉入學生名冊。\n五、 畢業學生名冊。\n六、 其他有關學籍資料。\n學生學籍有關事項發生異動時，應註記於前項第一款及第三款學生學籍表冊。\n第  3  條\n學校應就前條第三項第二款至第五款學生學籍表冊，依下列規定期限，報各該主管機關備查：\n一、 新生名冊：九月三十日前。\n二、 學生學籍異動名冊：九月三十日及三月二十日前。\n三、 轉入學生名冊：九月三十日及三月二十日前。\n四、 畢業學生名冊：九月三十日前。\n第  4  條\n第二條第三項第一款學生學籍表，其個人身分資料，應依國民身分證明文件之內容記載；變更時，亦同。\n前項變更，在校學生應檢具國民身分證明文件，畢(肄)業學生應檢具國民身分證明文件及畢業證書或與修業有關之證明文件，向學校申請。\n第  5  條\n學校應將第二條第三項第一款至第五款學生學籍表冊紙本及電磁紀錄，設置專櫃永久保存，並指定專人妥慎保管及列入業務移交項目；其有遺失、毀損者，應即報各該主管機關備查，並儘速重建。\n第  6  條\n學校就第三條第一款新生名冊報各該主管機關備查後，應將第二條第一項新生所檢具之國民中學畢業或具同等學力證明文件，發還學生。\n新生錄取名單、轉入學生錄取名單及轉學證明書，應保存三年。\n第  7  條\n一年級新生取得二以上學校學籍者，各該學校應依適性輔導原則，限期通知學生擇一就學，未受選擇之學校應廢止其錄取資格，並註銷其學籍。\n學生因重考或轉學而取得原學校及新學校學籍，其未選擇原學校就讀者，原學校應註銷其學籍；其選擇重考或轉學之新學校有二以上並均取得學籍者，準用前項規定辦理。\n第  8  條\n學生假借、冒用、偽造或變造學歷證明文件取得錄取資格者，應撤銷其錄取資格，並註銷其學籍，且不得發給與修業有關之任何證明文件；其已發給與修業有關之證明文件者，應註銷該證明文件；其已畢業者，撤銷畢業資格及註銷學籍，並通知限期繳回畢業證書，屆期未繳回者，逕予註銷。\n第  9  條\n新生有下列情形之一者，得於註冊前，向學校申請保留錄取資格，無需繳納就學費用：\n一、 因病須長期療養或懷孕，持有區域醫院以上醫院出具之診斷證明。\n二、 因服兵役，持有徵集令或服役證明。\n保留錄取資格之期間為一學年，學校應於期限屆滿一個月前，通知學生限期返校就學，屆期未返校就學者，廢止其錄取資格。\n學生持有徵集令依第一項第二款規定申請經保留錄取資格者，不得申請緩徵；其因病依第一項第一款規定保留錄取資格期間復受徵召服役者，應檢具徵集令，向學校申請延長保留錄取資格至服役期滿後次一學年度開學日止。\n學校應將保留錄取資格之學生名冊，報各該主管機關備查。\n第  10  條\n學生因災害、適應不良或參加國家代表隊選手培訓，得檢具證明文件，向原學校申請至他校借讀；經原學校會同借讀學校審查通過，並報原學校主管機關核准後，由借讀學校通知學生辦理借讀相關事項。\n學生因參加國家運動訓練中心辦理之國家代表隊選手培訓，得檢具證明文件，向就讀學校申請彈性修讀課程，經學校同意後，並報就讀學校主管機關備查。\n第  11  條\n學生申請借讀，應以與原學校同群或科(學程)為限，且借讀至當學期結束為止；申請借讀並以一次為原則。\n借讀學校應將學期成績通知原學校。原學校應於借讀期限屆滿一個月前，通知學生限期返校就讀；屆期未返校就讀者，視為申請休學。\n第  12  條\n學校各科經核定新生名冊後，其實招班數名額遇有缺額時，得辦理學生轉科(學程)或招收轉學生，並以公開方式為之。但第十四條第三款法定轉學，不在此限。\n第  13  條\n學生有轉科(學程)之需求者，得向學校申請適性轉科(學程)；學校於受理申請後，應予適性輔導；其轉科(學程)與輔導流程之程序及方式，由學校定之。\n第  14  條\n學校辦理適性轉科(學程)後，得辦理招收轉學生；其方式如下：\n一、 公告招收：由學校自行或數校聯合辦理。\n二、 學生申請：因家長調職、舉家遷移或其他有改變學習環境必要者，得申請轉學，並經學校審查通過後招收之。\n三、 法定轉學：依兒童及少年福利與權益保障法、性別平等教育法、少年事件處理法及其他相關法令規定有轉學必要者。\n第  15  條\n學校辦理學生轉科(學程)或轉學，應於開學前完成。\n學校於第一學期不得招收一年級轉學生。但符合高級中等學校學生學習評量辦法第十四條規定之重讀一年級學生，依前條第二款學生申請方式申請轉學至他校一年級就讀者，不在此限。\n前條第三款法定轉學，學校不受前二項應於開學前完成及第一學期不得招收一年級轉學生規定之限制。\n第  16  條\n學生依第十四條第一款、第二款規定申請轉學者，應經原學校審查通過後，發給轉學證明書。\n第  17  條\n學生因故得向學校申請休學，經輔導並審查通過者，發給休學證明書。\n學生於開學日後，無故連續未到校超過七日，並經通知而未於期限內回校辦理請假、轉學或放棄學籍者，視為休學，學校應附具理由通知學生及其法定代理人。\n休學每次以一學年為期，並以二次為限。\n休學期間不列入本法第四十二條所定修業年限。\n第  18  條\n學生於休學期間受徵召服役者，應檢具徵集令向學校申請保留學籍至服役期滿後次一學年度開學日止，並繳回休學證明書；學校應報各該主管機關備查。\n前項學生應於保留學籍期間內，檢具退伍令或結訓令，準用第十九條規定辦理復學、轉學或放棄學籍。\n第  19  條\n學校應於學生休學期滿一個月前，通知學生限期辦理復學，學生未於期限內辦理復學者，應辦理轉學或放棄學籍；第一次休學學生，未於期限內辦理復學、轉學或放棄學籍者，視為申請第二次休學；第二次休學學生未於期限內辦理復學、轉學或放棄學籍者，學校應廢止其學籍，並附具理由通知學生及其法定代理人。\n第  20  條\n休學學生應持休學證明書，向學校申請復學。學校應將學生編入與休學時相銜接之年級、科(學程)就讀。復學生因志趣不合或原就讀科(學程)變更或停辦時，學校應輔導學生轉至適當之年級、科(學程)就讀。\n第  21  條\n休學學生於必要時，得向學校申請提前一學期復學。\n學生復學後，欲辦理緩徵者，應於兵役機關徵集令送達前為之。\n第  22  條\n學生修業符合本法第四十六條規定者，發給畢業證書；未符合者，依高級中等學校學生學習評量辦法及高級中等學校進修部學生學習評量辦法之規定，發給修業證明書。\n第  23  條\n本辦法所定各項證明文件遺失或毀損時，得向學校申請補發或換發。\n學生得就畢業證書或修業證明書之影本，向學校申請驗證，經審核與正本無異者，應在該影本加蓋學校相關章戳證明。\n第  24  條\n學校應就取得學籍且在學之學生，主動依免役禁役緩徵緩召實施辦法及其相關法令規定，辦理已屆兵役年齡學生之申請緩徵。\n第  25  條\n本法施行前，曾就讀高級中等學校附設進修學校，且修業期滿取得結業資格，而未通過資格考之學生，其自高級中等學校進修部三年級第一學期起就讀，且為同科，修業期滿成績及格者，由學校發給畢業證書。\n第  26  條\n學校改名、改制或合併時，由變更後之學校接管原學校歷年學生學籍表冊，並受理其學生申請、查詢及核發有關學籍資料。\n學校停辦時，由各該主管機關或指定所屬學校，接管停辦學校歷年學生學籍表冊，並受理其學生申請、查詢及核發有關學籍資料。\n第  27  條\n學校應就學生學籍資料，依個人資料保護法及其相關法規規定蒐集、處理及利用。\n第  28  條\n學校承辦學籍管理人員違反本辦法規定者，除依法規規定予以懲處外，其涉及刑事責任者，並移送司法機關辦理。\n第  29  條\n各該主管機關得派員檢查及輔導學校學生學籍管理作業，並視辦理情形予以獎懲。\n第  30  條\n各該主管機關應建立學生學籍審查機制，並提供中央主管機關訂定政策所需之學生學籍資料。\n第  31  條\n直轄市、縣(市)主管機關得依本辦法規定另定補充規定。\n第  32  條\n本辦法自中華民國一百零三年八月一日施行。\n本辦法修正條文，除中華民國一百零四年一月二十六日修正發布之條文，自一百零四年一月一日施行外，自發布日施行。", "history": "1.中華民國102年12月18日教育部臺教授國部字第 1020118423A號令訂定發布全文32條；並自103年8月1日施行。\n\n2.中華民國104年1月26日教育部臺教授國部字第 1040004787B號令修正發布第 13～17、32 條條文；並自1014年1月1日施行。\n\n3.中華民國110年8月12日教育部臺教授國部字第1100090282B號令修正發布第 10、15、32 條條文；並自發布日施行。"}, {"title": "自學進修高級中等教育學力鑑定考試辦法", "content": "第  1  條\n本辦法依高級中等教育法第六十三條規定訂定之。\n第  2  條\n自學進修高級中等教育畢業程度學力鑑定考試(以下簡稱學力鑑定考試)之範圍如下：\n一、 相當於普通型高級中等學校之畢業程度。\n二、 相當於技術型高級中等學校之畢業程度。\n第  3  條\n學力鑑定考試，由教育部國民及學前教育署(以下簡稱國教署)會商各直轄市政府後聯合辦理之，並由國教署或直轄市政府之一為主辦機關。\n第  4  條\n國教署或直轄市政府辦理學力鑑定考試前，應邀集學者專家、學校及機關代表組成試務委員會，就試務事項予以研議。\n第  5  條\n參加學力鑑定考試之應考資格如下：\n一、 持有中華民國國民身分證、護照或我國政府核發之有效居留證明文件。\n二、 普通型高級中等學校畢業程度：\n(一) 年滿十八歲，曾於國民教育階段或高級中等教育階段參與經主管機關核准之非學校型態實驗教育者。\n(二) 年滿二十歲者。\n三、技術型高級中等學校畢業程度：具有前款資格之一，並均具有下列資格之一：\n(一) 取得丙級技術士證或相當於丙級技術士證之資格，具有三年以上之工作經驗。\n(二) 取得乙級以上技術士證或相當於乙級以上技術士證之資格，具有一年以上之工作經驗。\n前項第二款報考資格年齡，採計至應試翌年之九月一日。\n第一項第三款有關相當於技術士證資格及其對應科表之認定事項，由國教署會商相關技術士證之核發機關後定之。\n第  6  條\n學力鑑定考試之科目如下：\n一、 普通型高級中等學校畢業程度：國文、英文、數學、社會學科(歷史、地理及公民與社會)、自然學科(物理、化學、生物及生活科技)。\n二、 技術型高級中等學校畢業程度：國文、英文、生活領域學科(計算機概論、生涯規劃及法律與生活)。\n學力鑑定考試之計分，每科均以六十分為及格，一百分為滿分。當次學力鑑定考試之前項各款所定科目均及格，或各該科目均達五十分而總平均達六十分者，為考試通過。\n持身心障礙證明(手冊)或各該主管機關核發之身心障礙證明之學生，參加學力鑑定考試者，其各科成績，以加百分之二十五計算之。\n第  7  條\n應考人參加學力鑑定考試時，其進入或離開試場之時間、應攜帶或不得攜帶之文件與物品、作答之方式、停止作答之情形、在試場應遵守之秩序、違反者之扣減分數、不予計分、不准參加考試，及其他應遵行事項，由學力鑑定考試之主辦機關定之。\n第  8  條\n辦理學力鑑定考試時，得視身心障礙考生需要，在考場設施、考卷呈現、考試輔具、作答時間及作答方式等事項，調整因應之。\n第  9  條\n經學力鑑定考試通過者，由教育部(以下簡稱本部)及各直轄市政府發給學力鑑定通過證書，證明其具有普通型高級中等學校或技術型高級中等學校相關類科畢業之同等資格；單科考試科目達六十分及格者，發給各該考試科目及格證明書，於參加學力鑑定考試時，均予採認，俟其全部科目均達六十分時，發給學力鑑定通過證書。\n前項技術型高級中等學校相關類科與第五條第一項第三款各目技術士證或相當證照資格之對照表，由本部另定之。\n第一項學力鑑定通過證書及各該考試科目及格證明書之發給、換發或補發，由國教署及各直轄市政府辦理。\n第  10  條\n考試前發現應考人有下列各款情事之一者，撤銷其應考資格；考試時發現者，予以扣考；考試後榜示前發現者，不予發給考試科目及格證明書或學力鑑定通過證書；考試榜示後發現者，撤銷其考試及格資格，已發給證明書者，註銷其證書；其涉及刑事責任者，移送司法機關辦理：\n一、 冒名頂替。\n二、 偽造或變造應考證件。\n三、 自始不具備應考資格。\n四、 以詐術或其他不正當方法，使考試發生不正確之結果。\n第  11  條\n學力鑑定考試每年舉辦一次，其時間由國教署會商各直轄市政府後定之。\n第  12  條\n本辦法自中華民國一百零三年八月一日施行。", "history": "中華民國103年1月9日教育部臺教授國部字第1020134735A號令訂定發布全文12條；並自103年8月1日施行。"}, {"title": "高中高職藝術才能班特色甄選入學作業要點", "content": "一、 教育部(以下簡稱本部)為利公、私立高級中等學校(以下簡稱學校)依高級中等學校多元入學招生辦法辦理藝術才能班特色招生甄選入學，特訂定本要點。\n二、 本要點所定學校藝術才能班，其範圍如下：\n(一) 依特殊教育法規定設置之音樂、美術及舞蹈資賦優異班。\n(二) 依高級中等以下學校藝術才能班設立標準規定設立之音樂、美術、舞蹈及戲劇班(科)。\n三、 學校申請藝術才能班特色招生甄選入學，應於每年三月三十一日前，檢具下一學年度藝術才能班辦理特色招生甄選入學申請表 (如附件一)，連同依申請表所列審查項目擬具之計畫書，向各該主管機關提出。\n四、 各該主管機關就前點申請案審查同意者，應將招生名額彙整列冊後，送所屬就學區特色招生審查會匡列特色招生名額，並報本部備查。\n各該主管機關應於每年九月三十日前，公告核定下一學年度學校藝術才能班辦理甄選入學之學校及名額。曾獲核定採特色招生甄選入學之學校，其以後學年度申請繼續辦理時，得經各該主管機關核准，免提前點之計畫書；其得免提計畫書之學年度，不得超過二年，由各該主管機關參酌應屆畢業生人數及前一學年度特色招生甄選入學辦理情形等，核定特色招生名額。但於核定辦理年度終結三個月前，通知各該主管機關不續行辦理者，免予核定。\n五、 藝術才能班甄選入學招生區，以聯合辦理為原則。但招生區內學校因區域特性等因素，無法採聯合招生方式招收學生者，得經各該主管機關同意後，辦理單獨招生。前項各類藝術才能班甄選入學招生區如附件二。\n六、 藝術才能班甄選入學招生，分術科測驗及分發作業二階段辦理。\n七、 報名藝術才能班甄選入學之學生，不受就學區之限制，惟僅能向一區(校)報名術科測驗及申請分發。\n八、 藝術才能班甄選入學，不得施以學科成就測驗；其術科測驗作業，同一類型藝術才能班以同日辦理為原則。前項甄選入學作業，應於免試入學分發前完成術科測驗，並發給成績證明。\n九、 藝術才能班之分發，應與免試入學之分發同時辦理為原則。\n十、 分發入學，應以術科測驗分數及學生志願作為依據，並得以國民中學教育會考評量結果為入學門檻。學生完成報到後有缺額者，學校得經各該主管機關同意後，辦理續招。\n十一、 藝術才能班甄選入學招生作業，以聯合甄選入學辦理者，由各該主管機關協調擇定一所學校為入學委員會主委學校，擬訂術科測驗及申辦分發作業相關規定，連同簡章，報本部備查後，統籌辦理該區術科測驗及申請分發事宜。\n十二、 報名第二點所定藝術才能資賦優異班或藝術才能班之學生，以依各該法規規定通過鑑定者為限。\n十三、 藝術才能班甄選入學招生名額，應併入學校所屬就學區之特色招生名額計算，不得流入其他入學管道。\n十四、 學校應保留藝術才能班名額，供參加政府機關(構)舉辦之國際性或全國性各該藝術類科競賽表現優異，獲前三等獎項者，申請鑑定安置；其辦理時程、名額及資格，應明定於簡章。\n十五、 採特色招生甄選入學之學校，於學生報到後，應將特色招生成果函報各該主管機關備查，並對學生進行後續輔導及追蹤。各該主管機關應定期檢討評估特色招生對國民中學教學之影響。\n十六、 各該主管機關依高級中等教育法或廢止前職業學校法規定核定設立之音樂、美術、舞蹈、戲劇科，得參照本要點規定續行辦理。", "history": "1.中華民國101年5月8日教育部部授教中(一)字第 1010507023B號令訂定發布全文18點，並自103學年度起入學高中高職學生適用之。\n\n2.中華民國106年9月21日臺教授國部字第1060082527B號，名稱並修正為「高級中等學校藝術才能班特色招生甄選入學作業要點」，並自即日生效。"}, {"title": "強迫入學條例", "content": "第  1  條\n本條例依國民教育法第二條第二項規定制定之。\n第  2  條\n六歲至十五歲國民 (以下稱適齡國民) 之強迫入學，依本條例之規定。\n第  3  條\n直轄市、縣(市)為辦理強迫入學事宜，設直轄市、縣(市)強迫入學委員會，由直轄市、縣(市)長、教育、民政、財政、主計、警政、社政等單位主管及鄉(鎮、市、區)長組織之；以直轄市、縣(市)長為主任委員。\n第  4  條\n鄉(鎮、市、區)為辦理強迫入學事宜，設鄉(鎮、市、區)強迫入學委員會，由鄉(鎮、市、區)長、民政、財政、戶政、衛生、社政等單位主管及國民中、小學校長組織之；以鄉(鎮、市、區)長為主任委員。\n第  5  條\n鄉 (鎮、市、區) 強迫入學委員會，負責宣導及督促本鄉 (鎮、市、區)適齡國民入學。\n第  6  條\n適齡國民之父母或監護人有督促子女或受監護人入學之義務，並配合學校實施家庭教育；收容或受託監護適齡國民之機構或個人，亦同。\n第  7  條\n六歲應入國民小學之國民，由當地戶政機關於每年五月底前調查造冊，送經主管教育行政機關於六月十五日前依學區分發，並由鄉 (鎮、市、區)公所於七月十五日前按學區通知入學。\n前項所定之調查造冊，必要時戶政機關得協調當地國民小學協助辦理。\n第  8  條\n國民小學應於每年五月底前，造具當年度畢業生名冊，報請主管教育行政機關辦理分發，並於七月十五日前按學區通知入國民中學。\n第  8-1  條\n國民小學及國民中學發現學生有未經請假或不明原因未到校上課達三天以上，或轉學生未向轉入學校報到者，應通報主管教育行政機關，並輔導其復學；其通報及復學輔導辦法，由教育部定之。\n第  9  條\n凡應入學而未入學、已入學而中途輟學或長期缺課之適齡國民，學校應報請鄉(鎮、市、區)強迫入學委員會派員作家庭訪問，勸告入學、復學；其因家庭清寒或家庭變故而不能入學、已入學而中途輟學或長期缺課者，報請當地直轄市、縣(市)政府，依社會福利法規或以特別救助方式協助解決其困難。\n前項適齡國民，除有第十二條、第十三條所定情形或有特殊原因經鄉(鎮、市、區)強迫入學委員會核准者外，其父母或監護人經勸告後仍不送入學、復學者，應由學校報請鄉(鎮、市、區)強迫入學委員會予以書面警告，並限期入學、復學。\n經警告並限期入學、復學，仍不遵行者，由鄉(鎮、市、區)公所處一百元以下罰鍰，並限期入學、復學；如未遵限入學、復學，得繼續處罰至入學、復學為止。\n第  10  條\n(刪除)\n第  11  條\n依本條例規定所處罰鍰，逾期不繳者，移送法院強制執行。\n第  12  條\n適齡國民因身心障礙或健康條件達到不能入學之程度，經公立醫療機構證明者，得核定暫緩入學。但健康恢復後仍應入學。\n第  13  條\n身心障礙之適齡國民，應經直轄市及縣 (市) 主管教育行政機關特殊教育學生鑑定及就學輔導委員會鑑定後，安置入學實施特殊教育。但經鑑定確有暫緩入學之必要者，得予核定暫緩入學，最長以一年為限，並應副知鄉 (鎮、市、區) 強迫入學委員會。\n前項暫緩入學之核定基準、程序及其他相關事項之辦法，由直轄市、縣 (市) 主管教育行政機關定之。\n第  14  條\n直轄市及縣(市)主管教育行政機關應主動調查因地區偏遠路途遙遠無法當日往返上學之學生，學校應提供膳宿設備、交通或其他有效措施。\n第  15  條\n適齡國民隨同家庭遷移戶籍者，由遷入地戶政機關以副本通知當地強迫入學委員會執行強迫入學或轉學事宜。\n第  16  條\n本條例施行細則由教育部定之。\n第  17  條\n本條例自公布日施行。", "history": "1.33年7月18日國民政府制定公布全文16條刊國民政府公報渝字第 693 號。\n\n2.34年2月17日國民政府修正公布第3、4、5及8條條文刊國民政府公報渝字第755號。\n\n3.71年5月12日總統令修正公布全文17條；並自公布日施行。\n\n\n4.92年1月15日總統華總一義字第09200005470號令修  正公布第6、9、13條條文；刪除第10條條文。\n\n5.100年11月30日\n華總一義字第10000266441號令公布增訂第8條之1條文；並修正第3條、第4條及第9條條文。\n\n6.中華民國108年4月17日總統華總一義字第10800037901號令修正公布第12、14 條條文。"}, {"title": "有關依規定執行強迫入學業務，所致相關時間分段點認定及強制執行罰鍰之疑慮。", "content": "一、 依據教育部九十三年十月二十九日台國字第0930138198號函辦理。\n二、 按前項函示說明三，「強迫入學條例施行細則」第二條所稱，六歲至十五歲之國民強迫入學，其期間係指國民滿六歲該學年度開始(九月一日)至滿十五歲之該學年度結束止，是請爾後確實依本規定執行強迫入學通報作業。", "history": "93年11月9日北府教特字第0930737248號。"}, {"title": "新北市政府教育局高級中等學校學生學籍管理要點", "content": "一、 新北市政府(以下簡稱本府)教育局(以下簡稱本局)為管理新北市所屬公私立高級中等學校(以下簡稱學校)學生學籍，訂定本要點。\n二、 學校應建立下列學生學籍表冊資料：\n(一) 新生名冊。\n(二) 學生學籍表。\n(三) 學生學籍異動名冊(轉入、轉科、復學、重讀、轉出、休學、延修等)。\n(四) 畢(修)業生名冊。\n(五) 其他有關學籍表冊資料。\n除前項第五款表冊自保管日起屆滿五年，學校得自行銷毀外，其餘表冊應永久保存。\n三、 學校應依本局核定之科別、班數、名額招收新生，不得任意調整或超收學生。\n四、 學校於新生註冊後，應依規定編班、編列學號、建立學籍，並填發學生證；學生證影本加蓋學校戳記視同在學證明。\n五、 學校原核定新生名額，遇有缺額時，除一年級第一學期外，得由學校於開學前自行或由數校聯合辦理招收轉學生。\n六、 學校辦理招收轉學生，應組成轉學審查委員會，訂定轉學簡章，並於招生前二星期報本局備查。\n七、 學校辦理轉學考試，得招收五年制專科學校前三年級肄業學生；招收轉學生，應依學校規定，辦理資格審核及學分抵免相關事宜。\n八、 學校辦理學生轉學事宜，應符合下列規定：\n(一) 公告轉學應依本局核定名額及期限等規定辦理。\n(二) 學生轉學，應於報考時繳驗原校發給之轉學證明書或修業證明書(均含成績)、及其家長或監護人出具署名蓋章之申請書。\n(三) 因故須改變學習環境者，應經志願學校認可。\n(四) 一年級重讀生，得轉學他校一年級就讀。\n(五) 不同學制之學生轉學，學校應組成審查委員會，依課程要求審核其已修畢科目學分之抵免事宜。\n學校學生校內轉科或學程，除新生在一年級第一學期由學校依各科原核定新生名額另定規定辦理外，以修業年限內可修畢應修學分數者為限，得申請轉科或學程，其轉入年級學生名額，以不超過該科原核定新生名冊實招班數之名額為原則。\n學生轉科或學程之相關規定，由學校另定之。\n身心障礙學生如欲轉入高中職集中式特殊教育班或特殊教育學校者，應經本府特殊教育學生鑑定及就學輔導會審核同意後轉入。\n九、 學生就讀學校或地點為實施疏散地區、學生適應不良或參加集訓者，得向肄業學校申請發給借讀證明書，並於一星期內連同戶口名簿(驗後發還)，向欲借讀之學校申請借讀。\n前項所稱適應不良，係指學生因身心障礙程度嚴重或生活起居因素，而不適宜繼續於原就讀學校就讀，須就近就學安置，且有證明文件者。\n學校受理第一項規定之適應不良學生申請借讀者，應經學校召開專案會議審查。學校同意接受學生借讀申請後，應於一星期內將借讀學生之姓名、科別、年級、學號、借讀起訖時間等學籍資料，列冊報本局備查。\n十、 借讀學校以同性質、同科別、有缺額之學校，且以借讀一學期為原則，借讀學校應將學期成績通知原就讀學校處理。借讀期滿應返回原校就讀或依本要點辦理轉學。\n十一、 借讀生應向原學校繳納學費，以保留其學籍，再向借讀學校繳納學費以外之其他費用。\n十二、 學生因特殊原因，得由學生家長或監護人向學校提出書面申請，休學一學年，必要時並得向學校申請延長一學年。\n學校應核發給休學生休學證明書。\n十三、 學生休學期間，如遇徵召、服役者，應檢具徵集令影本向學校申請保留學籍，學校並應專案報本局備查。\n學生應於服役期滿一年內檢同退伍令及休學證明書向原學校申請復學，逾期視同自動放棄學籍。\n十四、 休學生應於休學期滿前，持休學證明書向原肄業學校申請復學，學校應將學生編入與休學時相銜接之年級、科別或學程就讀。\n休學生因志趣不合、原肄業科別或學程變更或停辦時，學校得輔導學生轉適當科別或學程就讀。\n十五、 休學生得向學校申請提前復學，視為復學生。復學後如屆兵役年齡，得辦理緩徵。但於兵役機關徵集令送達後而提前復學者，不得辦理。\n前項復學生於該學期選擇重讀之科目，其成績計算以較優者作為科目學分績。\n十六、 在校學生姓名、出生年月日，以身分證所載者為準，如有更正，應檢附戶籍謄本向學校申請辦理，學校應將更正項目登錄於學籍表冊。\n十七、 畢業生申請更正證書，應檢具原證書向原畢業學校申請更正，學校在原證書正面空白處改註加印，並將更正事項登錄於原學籍表及更正學籍事項名冊。\n十八、 學校應於學生註冊時，主動就已屆兵役年齡之學生繕造名冊，依規定時限辦理申請緩徵手續。\n十九、 學校新生入學證件，於建立學籍後將相關證件發還學生。\n學校應於每學年規定期限內，依學生學籍表格式，造具新生名冊及相關統計表，報本局備查。\n二十、 學校每學期應於規定時限內造具轉入學生名冊、學生學籍異動名冊報本局備查。\n二十一、 畢業生資格由學校依規定審核，並應於每年九月三十日前，造具畢業生名冊及統計表報本局備查。\n二十二、 持有國外高級中等學校學歷或大陸地區學歷之學生，應依教育部相關規定，取得學歷認證後，再依相關規定辦理入學事宜。\n二十三、 學校新生及轉學生入學資格，由學校審核，錄取榜單及轉學生入學證件應保存一年，以備抽查。\n二十四、 學校對於學籍管理，未依規定辦理或偽造變造相關資料，經查核屬實，應追究行政及刑事責任。\n二十五、 已停辦或改制學校之畢業生，申請或查詢學籍資料，應逕向本局或改制之學校辦理。\n二十六、 畢(修)業證書遺失或破損，得檢具最近二吋正面脫帽半身照片，向原畢業學校申請核發畢(修)業證明書。\n二十七、 學校附設進修學校學生之學籍管理，適用新北市立高級中等學校附設進修學校學生學籍管理要點。", "history": "102年7月16日北教中字第1022179579號令訂定發布；自即日生效。"}, {"title": "新北市立國民中學新生分發及入學作業要點", "content": "一、 本要點依國民教育法第四條第二項規定訂定之。\n二、 新北市(以下簡稱本市)立國民中學、國民中小學國中部及高級中學國中部(以下簡稱國民中學)新生入學應依據劃定學區予以列冊分發，其入學資格如下：\n(一) 國民小學應屆畢業生或因故未升學之歷屆畢業生，年齡未滿十五歲者(以入學之學年度九月一日為準)。\n(二) 設籍本市，並有居住事實之學生，且與其設籍本市之父或母或直系尊親屬或監護人居住於同戶籍者。\n三、 特殊教育學生之免強迫入學及調整入學年齡與修業年限，依相關規定辦理。\n四、 國民中學新生分發及入學作業程序如下：\n(一) 本市各公私立國民小學應於五月十日前，依學區劃分繕造二份應屆畢業生升入各國民中學名冊(含電子檔)，一份送至國民中學，一份存校備查，其戶籍規定係以造冊時為準，國民中學應詳為審查，學生所繳戶口名簿(或戶籍謄本)影本一份，保存二年備查。如係當年戶籍異動者，得加驗下列證明文件之一：\n1. 設籍地房屋所有權狀。\n2. 經公證之房屋租賃契約。\n3. 公家宿舍配住證明。\n4. 其它經學校查證確有居住事實之證明文件。\n(二) 國民中學應於五月三十日前複審各國民小學送達之新生名冊，如發現因國民小學造冊或其他錯誤而分發者，或非該校學區內之學生，不得給予辦理入學，並應請其至應就讀之學校報到。\n(三) 國民中學依審核完成之新生名冊，填發入學通知書，該入學通知書應註明新生之國民小學班別，於國民小學畢業典禮前分送至各國民小學轉發之，以憑持向應就讀之國民中學辦理報到手續。\n(四) 設籍本市而在外縣市就讀之國民小學應屆畢業生，因故未造送入學名冊至所屬學區之國民中學者，或因戶籍異動而不能就讀原分發國民中學者，可逕向該學區之國民中學辦理報到。報到時，應攜帶戶口名簿、國民小學畢業證書、家長或監護人印章及第一款各目所列之任一證明文件。\n(五) 因故未升學之歷屆畢業生，如設籍本市且年齡未滿十五歲者，得於開學日前向戶籍所在地之國民中學申請入學。\n五、 國民中學經新北市政府教育局(以下簡稱本局)公告為額滿學校時，其新生分發入學辦理方式如下：\n(一) 新生應與父或母或直系尊親屬或監護人設籍在額滿學校學區內，並持有第四點第一款各目所列之任一證明文件。\n(二) 符合前款規定之新生，並有居住事實者，且非寄居身分，依下列順序，分發入學至額滿為止：\n1. 該校學區(含自由學區)學籍滿二年之國小畢業生，且其兄弟姊妹就讀該校者。\n2. 該校學區(含自由學區)國小畢業生，依學籍設籍先後順序；若學籍設籍順序相同者，則依戶籍設籍先後順序決定之。\n3. 非該校學區(含自由學區)國小畢業生，依戶籍設籍先後順序。\n(三) 依前款規定分發至額滿後，其餘未受分發之學生應依其志願，由學校填具轉介單，改分發至鄰近未額滿學校，並依本局核定之原額滿學校改分發順序進行分發。改分發學校除經本局核定額滿外，不得拒收學生，改分發之學生無須再遷戶籍。\n(四) 額滿學校依規定辦理分發報到後，學校仍有缺額時，應在七月三十一日前，依候補名冊依序通知遞補分發至額滿為止。候補名冊依第二款之規定排序。\n前項各款規定，應於新生入學通知單載明。\n六、 國民中學每班學生人數，以本局每學年度訂定之基準為原則。\n七、 額滿學校之核定，以本局每學年公告之額滿基準為依據，報請本局核定為新生分發或各年級額滿學校。但鄰近學校於同學年度均經本局核定為額滿學校者，必要時該額滿學校每班學生人數得逾當學年度額滿學校班級人數基準之上限。\n額滿學校之推估，由各國民中學依據各公私立國民小學於五月十日前函送各學區國民中學之應屆畢業生升入各國民中學名冊，再以該校近三年平均報到率預估新生人數為原則，每班預估人數達本局公告之額滿學校基準時，得報本局核定為新生分發額滿學校名單。\n八、 具有下列身分之一者，依下列各款辦理入學：\n(一) 經新北市政府特殊教育學生鑑定及就學輔導會安置之特殊教育學生，以安置戶籍學區內之適當國民中學為原則。若學區內無適當場所提供時，得不受戶籍學區之限制，以就近入學為原則，並於五月三十一日前完成特殊教育學生鑑定安置作業，將安置名冊送交國民中學，列入各國民中學新生入學名單內。\n(二) 符合本市特殊需求學生就學安置計畫之個案，本局安置以實際居住地學區之適當國民中學就讀，不受戶籍學區限制。安置時，除保護性個案外，其餘應避免安置於本市額滿學校。\n(三) 各國民中學現職編制內教職員工之子女或被監護人，得優先隨其父或母或監護人就讀於所服務之國民中學。但其父或母或監護人為教師者，除員額編制限制外，應迴避任教其子女或被監護人就讀之班級。\n(四) 依政府派赴國外工作人員子女返國入學辦法或僑生回國就學及輔導辦法規定申請入學之學生，得依其志願分發至國民中學就讀。但於額滿學校報到日以後申請者，應改分發至鄰近未額滿學校。其餘持有外國護照及居留證之學生入學，依外國學生來臺就學辦法與本市新生分發及入學方式辦理。\n(五) 非設籍本市原住民學生，得檢具與其父或母或直系尊親屬或監護人實際居住本市之證明文件，或其父或母或直系尊親屬或監護人之受僱地證明文件等，向居住地或僱用地所屬學區之國民中學申請分發入學。但額滿學校不在此限。\n(六) 戶籍暫寄本市戶政事務所個案且確有居住事實者，申請入學居住所在地之國民中學，各校應以居住事實准其入學。但額滿學校不在此限。\n(七) 因本市都市更新計畫致原住居所拆遷移之學生，得檢具戶口名簿、原居住事實證明文件向原住居所學區之學校申請，經審查符合即分發入學，並由學校將相關資料列冊函報本局備查。\n九、 資賦優異、體育班、及藝術才能班(美術、音樂及舞蹈)等學生均依下列相關規定入學，其入學不受本要點限制：\n(一) 資賦優異學生依據本市國民中學學術性向(數理及語文)資賦優異學生鑑定及安置實施計畫辦理。\n(二) 體育班學生依新北市立高級中等以下學校體育班設置要點辦理入學。\n(三) 美術、音樂、舞蹈等藝術才能學生依高級中等以下學校藝術才能班設立標準規定辦理入學。", "history": "1.101年3月6日北府教秘字第 1011160896號令訂定發布全文10點；並自即日起生效。\n\n2.103年2月14日北府教中字第1030210584號令修正修正發布全文9點；並自即日生效。\n\n3.中華民國109年3月23日新北市政府新北府教中字第 1090465943 號令修正發布第5、8點條文；並自即日生效。"}, {"title": "新北市立國民中學學生轉學作業要點", "content": "一、 新北市(以下簡稱本市)政府教育局(以下簡稱本局)為辦理本市國民中學學生(以下簡稱學生)轉學事宜，訂定本要點。\n二、 本市學生因家庭戶口遷移，持有戶口證明文件並有居住事實者，始得申請轉學。但申請轉入全市自由學區學校，或就讀本市自由學區學校申請轉學回原學區學校，不在此限。\n各國民中學不得強制學生轉學。\n三、 學生辦理轉學之作業流程如下：\n(一) 家長或監護人以辦妥遷徙之持有戶籍證明文件，向就讀學校申請轉出，並於三日內持轉學證明書向轉入學校申請辦理轉入。\n(二) 受理申請轉入學校，依申請轉入學生之戶籍資料，確認學區無誤准予辦理轉入，並以回報單通知原就讀學校。\n(三) 原就讀學校接獲通知且審查回函資料無誤後，逕將學生學籍等相關資料以掛號信件寄送轉入學校查收，不得經由家長轉送。\n學生未完成轉學手續者，視為原就讀學校學生，原就讀學校負有追蹤輔導之責，並應避免學生產生中輟狀態。\n四、 依下列規定安置及轉介轉學之學生，得免遷戶籍辦理轉學：\n(一) 依特殊教育法等相關規定予以安置之特殊教育學生。\n(二) 為照顧身心障礙學生，其兄弟姊妹得由父、母或監護人向本局申請，經核定就讀同一學校。\n(三) 因就讀額滿學校，由額滿學校改分發之學生。\n(四) 屬同一戶籍學生因學區重新劃分致兄弟姊妹分屬不同學校就讀者，得申請隨其兄弟姊妹轉入未額滿之同一學校就讀。\n(五) 屬同一戶籍學生，因學區重新劃分或因該區屬額滿學校致兄弟姊妹分屬不同學校就讀，符合下列要件者，得優先申請隨其兄弟姊妹轉入額滿之同一學校就讀，但學校轉入人數有競額時依設籍時間先後順序遞補轉入：\n1. 弟妹出生時與兄姊設籍同戶籍，或兄弟姊妹同時遷入同戶籍。\n2. 額滿學校學區(含自由學區)學籍滿二年之國小畢業生。\n(六) 符合本市特殊需求學生就學安置計畫之保護個案依相關規定辦理。\n(七) 學校現職編制內教職員工子女不住在學區內者，得申請轉入其現職服務學校就讀。\n(八) 因本市都市更新計畫致原住居所拆遷之學生，得檢具戶口名簿、原居住事實證明文件向原住居所學區之學校申請，經審查符合免辦理轉學，並由學校將相關資料列冊函報本局備查。\n五、 各國民中學經本局核定為額滿學校，該年級為額滿時，其學生轉學依下列原則辦理：\n(一) 學生辦理轉出，準用本要點第三點規定辦理。\n(二) 學期中不受理學生轉入，如有學生申請轉入，應主動協助改分發至鄰近未額滿學校就讀，並填發額滿學校轉介單交予家長，持往改分發學校報到，改分發學校除已經本局核定額滿之外，不得拒收學生。\n(三) 轉學或異動缺額應俟寒暑假期間再受理學生轉入申請。學校應於每學期開學前一星期內辦理轉入作業；各校應公告各年級缺額及作業時間於校內及學校網頁，公告期間不得少於五日。\n(四) 設籍於額滿學校學區內，且非寄居身分，並與其父母、直系血親尊親屬或監護人居住於同戶籍之學生，持有下列證明文件之一，依其設籍先後順序分發入學：\n1. 設籍地房屋所有權狀。\n2. 經公證之房屋租賃契約。\n3. 公家宿舍配住證明。\n4. 其他經學校查證確有居住事實之證明文件。\n六、 戶籍暫寄本市各戶政事務所之學生，申請轉學至居住所在地之國民中學，各校應以居住事實准其轉學。\n七、 外國學生依外國學生來臺就學辦法，在臺已有合法居留身分，可檢具申請書、外僑居留證或永久居留證影本及外國學校畢業或肄業證明書及該學程之全部成績單等文件，逕向住所所屬學區之學校申請就讀，經核准註冊入學後，列冊報本局備查。\n八、 港澳居民在臺灣地區已達就學年齡，並具有臺灣地區合法居留身分，於來臺之次日起九十日內申請分發入學，依香港澳門居民來臺就學辦法，檢具相關表件，向教育部提出申請核轉，由本局視實際情形核定分發入學。\n九、 僑生回國就讀國民中學，應依僑生回國就學及輔導辦法，在臺已具有合法居留身分或取得期限六十日以上停留許可，得於回國之次日起九十日內，檢具相關證件，向僑務主管機關申請核轉，由本局視實際情形核定分發入學。\n十、 隨大陸人民入境之學生，依據大陸地區人民在臺灣地區依親居留長期居留或定居許可辦法，檢具申請書、居留證(或依親證)影本及經相關單位(大陸地區公證處、行政院設立或指定之機構或委託之民間團體，如財團法人海峽交流基金會)驗證之學歷證件或成績證明文件，向本局申請入學，編入適當年級就讀。\n十一、 赴大陸或國外就學之學生，應辦理轉出。\n學生回國後，依規定檢附戶口名簿及成績證明文件，向戶籍所在地學區之學校申請編入適當年級就讀，如該校該年級額滿，則比照額滿學校轉學方式辦理。", "history": "1.中華民國101年3月6日新北市政府北府教秘字第 1011160896號令訂定發布全文11 點；並自即日起生效。\n\n2.中華民國109年3月19日新北市政府新北府教中字第 1090438287 號令修正發布第2、4點條文；並自即日生效。"}, {"title": "新北市國民小學及國民中學學生學籍管理辦法", "content": "第  1  條\n本辦法依國民教育法第三十一條第三項規定訂定之。\n第  2  條\n本辦法之主管機關為新北市政府(以下簡稱本府) ， 執行機關為本府教育局(以下簡稱本局)。\n第  3  條\n新北市(以下簡稱本市)公私立國民小學及國民中學(以下簡稱學校)學生於入學時取得學籍；學校於學生轉出或轉入時移轉學籍，於中輟學生逾學齡時撤銷學籍。\n同一學生不得同時擁有二個以上學籍。\n學校進修部學生學籍管理，由本府另定之。\n第  4  條\n符合本市特殊需求學生就學安置計畫之保護個案，得經本局核准後，以不移轉學籍或戶籍之方式，予以緊急安置至原因消滅時為止。\n第  5  條\n學生入學時，學校應詳細登載學生資料，轉入時亦同。\n學校應依下列規定編定學生學號：\n一、 學生學號依年度別，以學籍管理及資料處理便利為原則編定。\n二、 學生於同一學校就學期間，應使用同一學號，不得變更或與其他學生重複。\n三、 轉入學生之學號，應銜接同年級學生學號之末號接續編定；轉出學生再轉回同一學校就讀者，應使用原編定之學號。\n四、 中輟學生復學，應使用原編定之學號。\n學校應隨時更新學生學籍資料，發現有錯誤者，應予更正。\n第  6  條\n學生轉學時，其學籍資料應依下列規定辦理：\n一、 轉出學校應出具轉學證明書，交由家長持往轉入學校報到。\n二、 轉入學校應於學生報到後，將回報單寄回轉出學校。\n三、 轉出學校接獲回報單後，應將學生學籍資料移轉至轉入學校，不得交由家長代為轉送。\n四、 學校於學生轉學時，應辦理學籍異動作業。\n第  7  條\n學生赴國外或大陸地區就學時，應辦理轉出；其學籍資料由原就讀學校保留。\n第  8  條\n經本府核准辦理非學校型態實驗教育之學生，其學籍資料應由原學區學校或本府指定學校保留並登錄。\n第  9  條\n畢(修)業證書由學校自行驗(套)印，免送本局驗印。\n畢(修)業證書因遺失、破爛、污損或其他原因致不堪使用者，得向原就讀學校申請補發畢(修)業證明書， 由學校自行印製核發，並應註記核發日期及文號。\n前項申請應檢附身分證或戶口名簿。委託他人代辦者，應另附受託人身分證及委託書。\n第  10  條\n學生或畢(修)業生申請更正學籍資料，應由當事人檢附相關證明文件，向原就讀學校辦理。\n前項當事人為未成年者，應由法定代理人辦理之。\n第  11  條\n學生學籍資料，除因學校實施教學或輔導學生之必要使用外，非依法規不得提供閱覽、抄寫、複印、複製或攝影。\n法定代理人向學校申請查閱學生學籍資料，應依相關法規辦理。\n第  12  條\n學校應永久保存學生學籍之書面或電子資料，並指派專人妥慎保管及列入移交，電子資料應另製備份。如有遺失、毀損或洩漏學生個人資料者，依相關法規辦理。\n前項學籍資料之遺失或毀損，應即報本局備查，並儘速重建。\n第  13  條\n學校有合併或停辦之情形者，應主動將學生學籍資料移轉至合併後存續或本府指定學校。\n第  14  條\n本辦法自發布日施行。\n本辦法中華民國一百十四年八月二十七日修正條文，自中華民國一百十四年八月一日施行。", "history": "102年12月4日北府法規第1023117772號令發布全文14條；並自發布日施行。\n114年8月27日新北市政府新北府法規字第 1141632909 號令修正發布第3、14條條文；並自114年8月1日施行。"}, {"title": "新北市國民中學學生學籍管理要點", "content": "一、 新北市政府(以下簡稱本府)為管理公、私立國民中學學籍，特訂定本要點。\n二、 公、私立國民中學(以下簡稱國中)學生之入學、學號、輟學、復學、轉學、成績及學籍資料之管理，依下列規定辦理：\n(一) 入學：各國中應適時與各區公所強迫入學委員會密切聯繫，並依強迫入學條例施行細則及下列規定辦理：\n1. 分發國中學生入學之通知，應依國民教育法及其施行細則有關規        定辦理。\n2. 國小應屆畢業生應一律分發入學，如有未修滿國小六年課程肄業        者，應於課程修滿後，始得升入國中就讀。但經主管教育行政機關核准之資賦優異及身心障礙學生，不在此限。\n3. 國中入學年齡，係自出生之日起計算至入學之學年度九月一日止，不得超過十五歲。但國小應屆畢業生或新北市特殊教育學生鑑定及就學輔導委員會決議之個案，不在此限。\n4. 逾十五歲之非國小應屆畢業生，申請入學時，應輔導就讀國中附        設補習學校。\n5. 新生入學，應依規定編班後，按照班級、座號之順序，繕造入學學生名冊一份，存校備查。入學學生名冊，應永久保存；中途肄業者，亦同。\n6. 各國中對入學新生及轉入學生，所繳之國小畢業證書或證明文件，應嚴予審核，並妥為保管，經審核無誤後，畢業證書即予發還，不得藉故扣留。\n7. 國中不得有寄讀生、借讀生、旁聽生及重讀生或插班生。但外籍學生(非僑生)經主管教育行政機關報備就讀者，不在此限。\n8. 僑生、中國大陸來臺學生、回國學人子女、派赴國外工作人員子女、外籍學生(非僑生)及隨同父母到中國大陸或國外各工作地回國就讀者，各依有關規定辦理。\n9. 對無戶籍而失學之適齡國民，應准其先行入學，並由其家長或監護人、學校及戶政、社政機關協助辦理戶籍登記。\n(二) 學號：\n1. 學生學號一律編六碼，男女生分開編列。\n2. 第一碼為學年度最後一碼。\n3. 第二碼為國中代號，國中(含高中國中部)固定碼是五。\n4. 第三碼為性別，男性為五，女性為零。\n5. 第四至六碼為流水號依照班級順序編號。\n6. 每一學生自入學至畢業限用一學號，依序編號造冊，存校永久備        查。\n7. 學期中途轉學者，其學號應予保留，不得遞補。\n8. 轉入學生之學號編列，應編在同年級學生學號之末。轉學他校之        學生，如申請再轉回原校就讀時，應沿用原保留學號。\n(三) 輟學：\n1. 在學學生無故中途輟學或長期缺課者，應報本市各區強迫入學委        員會處理，並依國民中小學中途輟學學生通報要點規定通報。\n2. 學生異動名冊繕造一份，存校備查。\n(四) 復學：中途輟學或請假原因消滅，申請復學時，由學校甄試編入相當程度之年級就讀。如其年齡已滿十五歲者，應輔導其就讀國中附設補習學校。\n(五) 轉學：\n1. 學生轉學應依新北市公私立國民中小學學生分發入學轉學作業要        點辦理之。\n2. 各國中對轉出學生應出具轉學證明書、成績證明書、期中轉學成        績紀錄表及入學回覆信函，密封交由學生家長，於三日內攜至轉入學校報到。學生轉出後，原校應永久保存該生學籍資料。\n3. 學生轉入報到後，轉入學校收到轉學資料後，應於三日內將入學        回覆信函填妥，送達轉出學校，轉出學校再將該生學籍紀錄表及輔導紀錄表正本，以郵政掛號函送達轉入學校。轉出學校未在七日內未接到入學回覆信函，應即追蹤輔導，並依有關規定處理，如有未報到者，轉入學校應主動查訪協助其就學。\n(六) 成績：\n1. 各國中學生成績考查，應依國民小學及國民中學學生成績評量準        則及新北市國民小學及國民中學學生成績評量補充規定辦理之。\n2. 學生各定期及日常考查成績紀錄表，應予保存一學年；畢業生三        學年成績(即學生學籍紀錄)，各校應永久妥為保存。\n(七) 學籍資料：\n1. 在學學生有關各項學籍資料，應予詳細填載，以備查考。\n2. 學生之家長或監護人，如向學校申請查閱其子女之學籍資料，應        依政府資訊公開法及相關法令辦理。\n3. 各校學籍資料應詳加檢查，發現有錯誤者，應予更正。如係戶籍        資料錯誤者，應即通知學生依規定家長向戶政機關申請更正。\n4. 學生自動離校，且其父母或監護人，均去向不明，其追蹤輔導就        學應至年滿十五歲之該年度九月一日為止，其學籍資料應永久保留。\n5. 中途輟學致逾學齡者，其就讀補校時，得出具成績證明書；其就        業者，得出具肄業證明書。\n6. 學生申請獎助學金之成績證明，發給領域各科成績，均得以百分        數計之，日常生活表現以文字描述呈現。在學證明得以學生證影印本代替。\n7. 學籍資料留校備查，必要時本府予抽查之。\n三、 畢業生名冊、畢業證書及修業證明書等事項，依下列規定辦理。\n(一) 畢業生及修業生名冊：\n1. 各國中應於當年五月底前依班級編列畢業生及修業生名冊一份，        存校永久備查。\n2. 畢業證書及修業證明書之編號，用學校名稱全銜中之三字為文號。(例如新北市板橋區江翠國民中學九十一學年度畢(修)業證書為(九一)新北市江翠中畢字第○○一號。)\n(二) 畢業證書及修業證明書：\n1. 畢業證書及修業證明書之作業，由各國中依規定自行驗(套)印，免送本府驗印。國中如原任校長調離，由兼代校長代理時，其應屆畢業生畢業證書、修業證明書上之校長署名，應在校長簽字章右下方加蓋代理二字。\n2. 各國中填寫畢業生名冊時，在該名冊封面內頁，應填寫該學年度        套印畢業證書張數、發出張數、剩餘空白張數，及寫錯作廢張數。剩餘空白及寫錯作廢之證書，由各國中承辦人員會同各處室主任予以銷毀。但學生於畢業典禮前，因故無法畢業，改發修業證明書者，原畢業證書字號，予以空號，並用紅字在備註欄註明修業生三字。\n3. 填寫畢業證書或修業證明書，有任何筆誤，或蓋印模糊不清時，        均應換張重寫，不得塗改或蓋用核對章。\n4. 畢業證書或修業證明書各欄，均應以黑筆正楷書寫或以電腦套印，其年、月、日數字，一律大寫。\n5. 國中應屆畢業生經考試或保送三軍士校就讀，(含因故被三軍士        校退學或開除)持有證明者，一律發給畢業證書。但不適應軍中生活，中途離校，仍為國中適讀學齡者，應准予繼續返原校就讀，學校不得拒絕。\n6. 升學報名必須在畢業典禮前繳驗畢業證書者，得先行影印加蓋關        防發給。\n7. 畢業證書填發日期為實際畢業日期。畢業證書及修業證明書，應        於舉行畢業典禮當日發給。\n8. 外國學生之畢業證書及修業證明書應於學生姓名旁加註國籍。\n四、 申請補發國中畢業證書、修業證明書及申請更正學籍記載：\n(一) 補發畢業證明書、修業證明書。\n1. 國中(含前身初中、初職)畢業生申請補發證明書，由各國中依規定自行驗印。\n2. 國中前身之高中、高職畢業生，畢業證書遺失申請補發證明書，        仍應依規定填寫補發畢業證明書申請表，轉送教育部核驗。\n3. 申請補發證明書，應檢附身分證正本、戶口名簿影印本一份及本        人最近二吋半身脫帽相片二張，經學校核對無誤後，依規定予以辦理。\n4. 證明書各欄，均需應以黑筆正楷書寫或以電腦套印，其年、月、日數字，一律大寫。\n5. 補發五十九年(含五十九年畢業)以前之畢業證明書，其原畢業        學校全銜校名應填寫本校前身○○縣立○○初級中學」或本校前身○○縣(市)立中學初(高)中部，其畢業時間如為六十年(含)以後者，則填寫本校。\n6. 證明書校長署名處，應一律蓋用校長簽字章，校長署名處應印學        校全銜新北市立○○國民中學，其字體不得小於四號印刷體字，學校印信應蓋在中華民國年次上之位置。\n7. 原畢業證書或修業證明書，除不慎遺失或其他不可抗力原因滅失        外，因破爛或汙損不堪使用而申請補發時，原證書應同時繳回銷燬。\n(二) 畢業生、修業生及在學學生申請更正學籍記載：\n1. 國中(含前身之初中、初職部)畢業生及在校學生申請更正學籍        記載，由各國中依規定自行辦理。\n2. 國中前身之高中(職)部畢業生申請更正學籍記載，仍應填寫申        請更正學籍名冊轉送教育部核辦。\n3. 畢業生或修業生，申請更正學籍記載，應檢附身分證正本或戶口        名簿影印本一份，並檢送原畢業證書或修業證明書，經學校驗明無誤後辦理，並將該生原存校學籍資料同時更正，以紅筆註明核准更正年、月、日及文號。\n4. 申請更正學籍記載，應填造名冊，留校備查。\n5. 畢業證書或修業證明書之更正學籍記載，應在其證書右上方，蓋        更正戳記並加蓋學校印信。\n6. 畢業證書、修業證明書更正姓名、出生年、月、日戳記格式如下：\n(1) 更改姓名戳記格式\n┌───────────┐\n│本證件姓名更正為      │三\n│                      │\n│    年    月    日    │公\n│                      │\n│    更字第      號    │分\n└───────────┘\n六    公    分\n(2) 更正出生年、月、日戳記格式\n┌─────────────┐\n│本證件出生年、月、日更正為│三\n│                          │\n│中華民國  年  月  日      │公\n│                          │\n│更字第      號            │分\n└─────────────┘\n六    公    分\n7. 檢附之戶口名簿影印本，並留校備查。\n五、 國中學生學籍資料之處理事項，依照下列規定辦理：\n(一) 學生學籍資料之有關文書、簿冊或數位紀錄，應專人妥慎保管，並列入移交，不得有遺失、毀損或非依法令交付他人或使他人知悉學生個人資料之情形。違者依法議處。\n(二) 學籍資料如遭遇不可抗力之原因而損害時，應即報備，並予重建。\n(三) 學生之學籍資料，非依法令不得提供閱覽、抄寫、複印、複製或攝影。但學校教職或輔導人員，因實施教學或輔導學生而有使用學生學籍資料之必要者，不在此限。\n六、 本要點所需之各種書表格式，由本府訂定之。", "history": "100 年9 月16 日北府教密字第1001107614 號令；並自即日起生效。"}, {"title": "新北市公立國民中小學學區劃分及調整作業要點", "content": "一、新北市政府（以下簡稱本府）為辦理新北市（以下簡稱本市）公立國\n民中小學學區劃分及檢討調整作業，依據國民教育法第十條第一項及\n其施行細則第四條規定，訂定本要點。\n二、新北市公立國民中學及國民小學（以下簡稱學校）之學區類型如下：\n（一）基本學區：指劃定某一區、里或鄰為一校之專屬學區。\n（二）自由學區：指考量學校容量相當、距離相近等而有實際需求者，劃\n定某一區、里或鄰同時為二校以上之學區，學區內之學生得依其意\n願選擇就讀學校。\n（三）大學區：指本市偏遠學校、學校型態實驗教育學校、新學年度全校\n學生數為一百人以下學校或本府為教育資源充分運用之考量，劃定\n特定學校以本市全部或部分行政區為其學區，學區內之學生得依其\n意願選擇就讀該校。\n三、本市學校學區依據人口、交通、社區、文化環境、行政區域及學校分\n布情形，劃分原則如下：\n（一）應均衡學校發展、考量就近入學、顧及通學安全、衡酌各校容量、\n調適班級人數、配合社區發展。\n（二）學區應以穩定為宜，如有新設學校、新社區成立、行政區域調整，\n或其他突發致使原學區劃分顯與實際情形不符之情事發生時，得依\n第四點規定辦理學區調整。\n（三）本市額滿學校於學區調整時，以不增列學區為原則。\n（四）為穩定師資及學生來源，劃分學區應以基本學區為原則，例外得依\n第四點規定調整為自由學區或大學區。\n四、學校學區之調整，應依下列規定辦理：\n（一）已劃定之學區，經學校或里長評估認有調整之必要時，邀集相關學\n校及鄰、里長召開評估會議充分溝通說明後，做成會議紀錄始得提\n出列入區公所提案。跨區公所之提案，應邀請相關區公所及學校列\n席學區協調會說明。\n（二）前年度未獲核定之學區調整案，如欲重行提案時，應依前款重新召\n開評估會議，始得列入區公所提案。\n（三）學區調整案應於每學年度開始前一年之十一月三十日前報各區公所\n，並於同年十二月三十一日前由各區公所召開學區協調會，形成共\n識決議及建議調整案，建議案報由本府核定之。\n（四）鄰近直轄市、縣市共同之學區案，應由所屬之主管教育行政機關同\n意後，列入區公所提案討論，並邀相關代表與會說明。\n五、新學年度學區之劃分及調整結果，由本府於每年三月十五日前公布。", "history": "1.100年7月1日新北市政府教育局北教國字第 1000684620號函訂定全文4點；並自即日生效。            \n2.114年4月17日新北市政府新北府教國字第 1140705052號函修正全文5點；並自即日生效。"}, {"title": "新北市立國民中學進修部學生學籍管理要點", "content": "一、 新北市政府（以下簡稱本府）為管理新北市立國民中學進修部（以下簡稱國中進修部）學生學籍，特訂定本要點。\n二、 國中進修部學生之入學、轉學、休學及復學應依下列規定辦理：\n(一) 入學：凡年滿十五歲且具備下列資格之一者，均可以登記入學：\n1. 國民小學畢業，持有畢業證書。\n2. 國民小學補校畢業或結業，持有畢業證書或資格證明書。\n3. 經國民小學畢業程度自學進修學力鑑定考試及格，持有及格證明書。\n4. 修畢國民小學前五個學年課程，成績及格，因故輟學一年以上，持有修業證明書者，得以同等學力資格登記入學。\n5. 其他持有國民小學畢業同等學力證明書。\n(二) 轉學：\n1. 學生轉學須俟原就讀學校學籍核定後，始得辦理，每學期以轉學一次為限。\n2. 學生申請轉學，學校應核發轉學證明書；申請轉學之學生於原校開學一個月內，如欲回原校就讀，且原肄業年級尚有缺額時，得向原校申請返回就讀。\n3. 轉學生辦妥轉出手續，應於七日（不含例假日）內前往轉入學校報到。\n4. 國中進修部對轉學生證件之審核應審慎，如證件資格可疑，應即設法查證。未經繳驗證件者，不得報名及申報學籍。\n(三) 休學：學生因故需辦理休學者，應由學生或其家屬（應具委託書）向學校提出書面申請，學校應發給休學證明書。\n(四) 復學：因特殊原因曾辦休學者或其他因素肄業者，申請復學，由學校編入相當之年級就讀。\n三、 國中進修部學生之學號編列以六位數為原則，前三位代表年度，其餘\n按當年入學學生人數多寡適當排列。\n四、 國中進修部學生之學籍依下列規定辦理：\n(一) 入學：於註冊後一個月內，國中進修部應將新生名冊報本府教育局（以下簡稱本局）備查。\n(二) 轉學：於註冊後一個月內，國中進修部應將學生學籍異動名冊報本局備查，入學證件由國中補校核定。\n(三) 畢業：於每年七月底前，國中進修部應將畢業生成績及證書名冊報本局備查。\n五、 在校學生姓名、出生年月日，以身分證或居留證所載者為準，學生申請變更學籍記載時，應以書面敘明原因及檢附相關資料（如戶籍謄本\n或身分證），學校應更正學籍記載事項名冊並留存影本備查。\n六、 國中進修部畢業、修業等事項依下列規定辦理：\n(一) 學生修業期滿，經審查符合下列規定者，由國中進修部發給畢業證書；不符規定者，發給修業證書：\n1. 除公、喪、病假或其他不可抗力等因素外，學習期間上課總出席率不得少於二分之一。\n2. 未有記滿三大過。\n3. 學習領域中有二分之一以上個別學習領域畢業總平均成績列丙等以上，或應屆畢業當學期成績有二分之一以上個別學習領域丙等以上。\n(二) 畢（修）業證書由學校自行驗（套）印，免送本局驗印。\n(三) 畢（修）業證書因遺失、破爛、污損或其他原因致不堪使用者，得向原就讀學校申請畢（修）業證明書，由學校自行印製核發，並應註記核發日期及文號；其申請應檢附身分證或戶口名簿。委託他人代辦者，應另附受託人身分證及委託書。\n七、 經核定之學生學籍資料保存年限，依下列規定辦理：\n(一) 永久保存：\n1. 學籍紀錄表。\n2. 畢業生成績證明書名冊。\n3. 其他有關永久保存之學籍記載資料。\n(二) 保存十年：\n1. 新生名冊。\n2. 學生學籍異動名冊。\n3. 學生學籍更正名冊。\n4. 教職員名冊。\n(三) 有關學生學籍之重要文件，列為專案移交，如有遺失或毀損，應即報本局知悉並查明責任。\n八、 國中進修部停辦後，學生學籍資料由原校保管。", "history": "101年4月25日北府教社字第1011509459號令訂定發布全文8點；並自即日生效。\n114年7月25日新北市政府新北府教社字第 1141450697號令修正發布名稱及全文 8 點；並自114年8月1日生效（原名稱：新北市立國民中學附設國民補習學校學生學籍管理要點；新名稱：新北市立國民中學進修部學生學籍管理要點）"}, {"title": "新北市立高級中等學校附設進修學校學生學籍管理要點", "content": "一、新北市政府（以下簡稱本府）為管理新北市立高級中等學校附設進修學校（以下簡稱進修學校）學生學籍，特訂定本要點。\n二、進修學校學生之入學、轉學、休學、復學、重讀、退學、轉群科及緩徵，應依下列規定辦理：\n（一）入學：\n1、進修學校應依本府教育局（以下簡稱本局）核定之科別、班數、名額招收新生，不得任意調整及超收學生，入學方式應依補習及進修教育法及施行細則規定辦理。\n2、一年級新生之入學，應具備下列資格之一：\n（1）國民中學、初級中學、初級職業學校（以下簡稱國民中等學校），或其附設補習學校畢業。\n（2）國民中等學校附設補習學校或國軍隨營補習教育國民中等學校          結業，經資格考驗及格，持有資格證明書。\n（3）修畢國民中等學校或其附設補習學校三個學年課程，持有修業證明（修畢五年制職業學校前三個學年課程者，得參照報考）。\n（4）國民中等學校、其附設補習學校或國軍隨營補習教育國民中等學校結業，持有結業證明書。\n（5）國民中學畢業程度自學進修學力鑑定考試及格，持有及格證明書。\n（6）考試院所舉辦之初等、丁等或特種考試相當於一職等以上考試及格，持有及格證明書。\n（7）行政院勞工委員會檢定通過取得丙級技術士證或相當於丙級以上技術士證之資格。\n3、持有國外高級中等學校（含進修學校）學歷之學生入學，進修學校應依驗證文件認定後，依相關規定辦理入學事宜。\n4、依大陸地區學歷檢覈及採認辦法經教育部、直轄市政府教育局檢覈及採認其具有高級中等學校（含進修學校）學歷者，進修學校得依轉學相關規定辦理入學事宜。\n5、進修學校於新生註冊後，應依規定編班、編列學號、建立學籍及核發學生有關證明文件。學生證影本加蓋進修學校戳記，視同在學證明。\n6、學生入學或轉學資格與規定不符者，進修學校不得同意其入學；已入學進修學校者，應撤銷其學籍。\n（二）轉學：\n1、進修學校除一年級上學期外，其餘各學期得公告招收轉學生。轉學考試相關事宜，得由進修學校於開學前自行辦理或數校聯合辦理。\n2、公告轉學招收人數，應以各科原核定招收班級人數之缺額為限。\n3、高級中等進修學校學生轉學，應經轉學考試合格，始得入學；一年級及二年級上學期轉學者，不受原就讀群科之限制；二年級下學期轉學者，以同群為限；三年級轉學者，以同科為限。\n4、高級中等學校或高級中等進修學校轉入高級中等進修學校各群科，應依下列規定辦理：\n（1）修畢一年級上學期課程者，得轉入一年級下學期就讀；修畢一年級下學期課程得升級者，得轉入二年級上學期就讀。\n（2）一年級未能升級或肄業者，得轉入相銜接之一年級下學期就讀。\n（3）修畢二年級上學期課程者，得轉入二年級下學期就讀；修畢二年級下學期課程得升級者，得轉入三年級上學期就讀。\n（4）二年級未能升級或肄業者，得轉入相銜接之二年級下學期就讀；修畢三年級上學期課程者，得轉入三年級下學期就讀。\n5、高級職業學校夜間部學生轉入高級中等進修學校各群科，應依下        列規定辦理：\n（1）修滿一年級課程學年學業成績准予升級或修滿二年級課程成績不及格者，得轉入二年級上學期就讀。\n（2）修滿二年級課程學年學業成績准予升級或修滿三年級課程成績不及格者，得轉入二年級上學期或下學期就讀。\n（3）修滿三年級課程學年學業成績准予升級者，得轉入三年級上學期就讀。\n（4）修滿四年級課程未能取得畢業證書者，得轉入三年級上或下學期就讀。\n6、五年制專科學校學生轉入高級中等進修學校各群科，應依下列規定辦理：\n（1）五年制專科學校一年級、二年級上學期肄業學生得轉入高級中等進修學校相當年級就讀，不受群科限制。但轉入二年級下學期者，應以性質相近群科為限。\n（2）修畢五專二年級之學生，得轉入高級中等進修學校三年級同科就讀。\n（3）五年制專科學校一年級、二年級學生，得轉入高級中等進修學校普通科；其二年級學生轉入普通科必須降轉。\n7、持國軍隨營補習教育及格成績單或肄業證明書，得轉入高級中等進修學校相銜接之年級就讀。\n8、學生於註冊前申請轉學證明書，學校不得拒絕。學生領取轉學證明書後，如於原校開學一個月內，其原肄業年級科別尚有缺額者，得向原校申請返回就讀。\n9、轉學學生於原校之學業成績，由轉入學校訂定成績審查原則抵免之。\n10、學生遇有下列情形之一者，得申請轉學：\n（1）因學生、家長調職或家庭遷移而須轉學，且具有證明文件。\n（2）因故須改變學習環境轉學。\n（3）一年級重讀生，因故須轉學他校一年級上學期就讀。\n11、在監獄辦理之高級中等進修學校各年級（含應屆畢業生）上學期中途轉學者，應於轉學證明書中填註，或將轉學前成績資料繳送轉入學校一併核計；下學期中途轉學者，除應屆畢業生外，均與上學期同。\n12、學校招收轉學人數，應以各科原核定招收班級人數之缺額為限。\n（三）休學：\n1、學生於修業期間，得申請休學，已成年者得由學生提出書面申請，未成年者應由學生及其家長或監護人向學校提出書面申請休學；每次申請以一年為期，累計得申請二次為限，並應依下列規定辦理：\n（1）學校應核發給休學學生休學證明書。\n（2）休學學生於休學期間因家庭遷移或其他原因，得向原就讀學校申請休業證明書，辦理轉學，學校不得拒絕。\n（3）休學學生逾期未復學者，視同自動退學。\n2、學生於休學期間受徵召服役者，應檢具徵集令影印本，向進修學校申請保留學籍，並由進修學校報本局備查。\n3、前目學生應於服役期滿一年內，檢具退伍令及休學證明書，向原學校申請復學，逾期視同自動退學。\n4、學生依本規定應辦理休學或轉學者，各校應明定期限以書面通知學生、家長或監護人到校辦理手續，逾期視同自動退學。\n（四）復學：\n1、休學學生得向原學校申請復學，進修學校應將其編入與休學時相銜接之年級群科就讀。但學生志趣不合或原群科變更或停辦者，得輔導學生至適當群科就讀或輔導轉學。\n2、休學生得向進修學校申請提前復學。\n3、復學後屆兵役年齡，得辦理緩徵。但於兵役機關徵集令送達後而提前復學者，不得辦理。\n4、原就讀國內高級中等學校附設進修學校之學生辦理休學，赴國外或大陸地區就學曾專案向原就讀學校報備者，進修學校得同意學生以其經採認之國外或大陸地區學歷，返回原學校復學或升級。\n（五）重讀：學生修業期滿未能取得畢業證書者，得至進修學校三年級上學期重讀。\n（六）退學：學生因故申請退學者，得向進修學校申請發給成績單。\n（七）轉群科：\n1、進修學校辦理學生轉群科，應以轉入各科原核定招收班級人數缺額為限。學生轉群科之相關規定由進修學校定之。\n2、進修學校辦理學生轉群科，得於第一學年下學期及第二學年上學期開學前辦理。\n3、學生申請轉群科以一次為限，一、二年級重讀學生，得申請轉入不同群科。\n（八）緩徵：進修學校應於學生註冊時主動就已屆兵役年齡之學生繕造名冊，依兵役法及相關規定辦理緩徵。\n三、進修學校學生之學籍，應依下列規定辦理：\n（一）進修學校於學生修業期間，應建立下列資料：\n1、新生名冊。\n2、學生學籍表。\n3、轉入學生名冊。\n4、學籍異動名冊（轉群科、復學、重讀、轉出、休學、退學、緩徵等）。\n5、畢業生名冊。\n6、其他有關學籍資料。\n（二）前款第一目至第五目之學籍表冊等有關資料，由進修學校自行審查，並應永久保存備查，其餘資料保管五年後得自行銷毀。\n（三）學生學籍有關事項發生異動時，進修學校應將事實登記於學生學籍表內。\n（四）學生學籍資料，應歸檔保管，列為專案移交，如有遺失或毀損，應即向本局報備及查明責任議處，並於一個月內向本局影印補全查考。\n（五）進修學校應依學生學籍表之內容及格式，建立詳細學生學籍資料，並依下列規定辦理：\n1、進修學校新生名冊、轉入學生名冊、學籍異動名冊應於註冊後一個月內，畢業生名冊應於每年七月底前，造冊報本局備查。\n2、進修學校新生及轉入學生名冊經本局備查之文號，為學生學籍核准文號。\n四、進修學校更正學籍記載事項，應依下列規定辦理：\n（一）學生姓名、身分證統一編號及出生年月日，應以身分證所載者為準。入學資格證件所載與身分證所載不符者，應立即更正，並將更正情形登錄於學籍表冊內，於下學期開學後彙造學籍異動名冊報本局備查。\n（二）在校學生及畢業生更改姓名、身分證統一編號及出生年月日者，應檢附戶政機關發給之有效證明文件，向原校申請辦理。\n五、進修學校停辦後學生學籍資料由原屬
